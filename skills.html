<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Skills · Linh Trần Nhật</title>
<meta name="description" content="Searchable library of skills for working with coding agents, synced live from a GitHub repo.">
<link rel="stylesheet" href="assets/lab.css">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div id="site-nav"></div>
<div class="wrap">
  <header class="page-hero">
    <div class="kick">My Skills</div>
    <h1>Skills for working with agents</h1>
    <p class="lead">Reusable instructions that make coding agents dependable on real engineering work. They live in one GitHub repo; this page reads its index, so a new skill appears here after the next push.</p>
    <div class="searchbar" role="search"><span id="ico"></span><input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search skills: research, review, pipeline…" aria-label="Search skills"><kbd>/</kbd></div>
    <div class="filters" id="tags"></div>
  </header>
  <main>
    <div class="status"><span id="status" aria-live="polite"></span> · <span class="live" id="live"><i></i><span>bundled snapshot</span></span> · <a id="repo" href="#">Repository ↗</a></div>
    <div class="grid wide" id="skills"></div>
  </main>
</div>
<div id="site-foot"></div>
<script src="data/profile.js"></script>
<script src="data/skills.js"></script>
<script src="assets/site.js"></script>
<script>
(function(){
  const {esc,hi,search,bindSearch,norm}=Site,$=id=>document.getElementById(id),on=new Set();
  let D=SITE_SKILLS;
  const RAW='https://raw.githubusercontent.com/'+D.repo+'/main/skills.json';
  $('ico').innerHTML=Site.ICON; $('repo').href='https://github.com/'+D.repo;
  const ago=iso=>{if(!iso)return '';const d=(Date.now()-new Date(iso))/864e5;return d<1?'today':d<30?Math.floor(d)+'d ago':new Date(iso).toLocaleDateString('en',{year:'numeric',month:'short',day:'numeric'})};
  function tagBar(){const t=[...new Set(D.skills.flatMap(s=>s.tags||[]))].sort();$('tags').innerHTML=t.map(x=>`<button type="button" aria-pressed="${on.has(x)}" data-k="${esc(x)}">${esc(x)}</button>`).join('')}
  $('tags').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;on.has(k)?on.delete(k):on.add(k);b.setAttribute('aria-pressed',on.has(k));render()};
  function render(){
    const q=$('q').value,toks=norm(q).split(/\s+/).filter(Boolean);
    const pool=D.skills.filter(s=>!on.size||(s.tags||[]).some(t=>on.has(t)));
    const hits=search(pool,q,[['name',6],['tags',4],['description',1]]);
    $('status').textContent=`${hits.length} of ${D.skills.length} skills`;
    $('skills').innerHTML=hits.length?hits.map(({item:s})=>{const cmd=`npx degit ${D.repo}/${s.path} ~/.claude/skills/${s.name}`;
      return `<article class="tile skill"><h3>${hi(s.name,toks)}</h3><p>${hi(s.description,toks)}</p>
      <div class="chips">${(s.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
      <div class="install"><code>${esc(cmd)}</code><button type="button" data-cmd="${esc(cmd)}">Copy</button></div>
      <div class="links"><a href="${esc(s.url)}">View on GitHub ↗</a>${s.updated?`<span style="color:var(--mut)">updated ${ago(s.updated)}</span>`:''}</div></article>`}).join('')
      :`<div class="empty" style="grid-column:1/-1"><b>${D.skills.length?'No skill matches':'No skills yet'}</b>${D.skills.length?'Try another word or clear the tag filters.':'Add a skill to the repo and push.'}</div>`;
  }
  $('skills').onclick=e=>{const b=e.target.closest('button[data-cmd]');if(!b)return;(navigator.clipboard?navigator.clipboard.writeText(b.dataset.cmd):Promise.reject()).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)},()=>{b.textContent='Select + copy'})};
  tagBar();bindSearch($('q'),render);render();
  /* Live refresh: the repo's CI keeps skills.json current, so new skills show up with no change to this site. */
  fetch(RAW,{cache:'no-cache'}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>{
    if(!j||!Array.isArray(j.skills))return; D=j; tagBar(); render();
    $('live').classList.add('on'); $('live').lastChild.textContent='live from GitHub'+(j.generated?' · '+ago(j.generated):'');
  }).catch(()=>{});
})();
</script>
</body>
</html>
