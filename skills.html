<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Skills · Linh Trần Nhật</title>
<meta name="description" content="Searchable library of skills for working with coding agents, synced live from a GitHub repo.">
<link rel="stylesheet" href="assets/lab.css">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/curriculum.css">
<style>
.skill-card .art{aspect-ratio:auto;height:118px}
.skill-card .install{display:flex;flex-direction:column;gap:6px;align-items:stretch;margin-top:6px}
.skill-card .install button{align-self:flex-start}
.skill-card .install code{flex:1;min-width:0;overflow:auto;white-space:nowrap;padding:7px 9px;border-radius:8px;border:1px solid var(--ink);font-size:12px}
.skill-card .install button{min-height:0;padding:4px 10px;font:600 12.5px var(--mono);border-radius:8px}
.skill-card .links{display:flex;gap:12px;font:13px var(--mono);flex-wrap:wrap;color:var(--mut)}
.skill-card .links a{color:var(--ink)}
.skill-card .chips button{font:12.5px var(--mono);border:1px solid var(--ink);border-radius:999px;padding:2px 10px;background:var(--card);min-height:0}
.skill-card .chips button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.live.on i{background:var(--ok)}
</style>
</head>
<body>
<div id="site-nav"></div>
<div class="cur-wrap">
  <header class="cur-hero">
    <div class="kick">MY SKILLS</div>
    <h1>Skill sets for working with agents</h1>
    <p class="lead">Courses that teach the skill behind each agent plugin, so you can review what the agent produces. Each module ends in an artifact the plugin checks.</p>
    <div class="cur-search" role="search"><span id="ico"></span><input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="Search courses: backend, design, data, qa…" aria-label="Search courses"><kbd>/</kbd></div>
    <div class="chips" id="tags" style="display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0"></div>
    <div class="cur-status"><span id="status" aria-live="polite"></span> · <span class="live" id="live"><i></i><span>bundled snapshot</span></span> · <a id="repo" href="#">Repository ↗</a></div>
  </header>
  <main>
    <div id="courses"></div>
    <section id="skills-sec" hidden>
      <h2 style="font:700 15px var(--mono);margin:30px 0 0">Agent skills</h2>
      <div class="cgrid" id="skills" style="margin-top:14px"></div>
    </section>
  </main>
  <footer class="cur-foot" id="site-foot"></footer>
</div>
<script src="data/profile.js"></script>
<script src="data/skills.js"></script>
<script src="assets/site.js"></script>
<script src="assets/thumbs.js"></script>
<script>
(function(){
  const {esc,hi,search,bindSearch,norm}=Site,$=id=>document.getElementById(id),on=new Set();
  /* skills kept in the repo but not listed here (moved to .claude/skills or retired) */
  const HIDDEN=new Set(['internals-deep-dive','learn-technology-from-scratch','learn-from-scratch']);
  let D=SITE_SKILLS;
  const RAW='https://raw.githubusercontent.com/'+D.repo+'/main/skills.json';
  $('ico').innerHTML=Site.ICON; $('repo').href='https://github.com/'+D.repo;
  const ago=iso=>{if(!iso)return '';const d=(Date.now()-new Date(iso))/864e5;return d<1?'today':d<30?Math.floor(d)+'d ago':new Date(iso).toLocaleDateString('en',{year:'numeric',month:'short',day:'numeric'})};
  function tagBar(){const t=[...new Set(D.skills.flatMap(s=>s.tags||[]))].sort();$('tags').innerHTML=t.map(x=>`<button type="button" aria-pressed="${on.has(x)}" data-k="${esc(x)}" style="font:13px var(--mono);border:1px solid var(--ink);border-radius:999px;padding:3px 11px;background:${on.has(x)?'var(--ink)':'var(--card)'};color:${on.has(x)?'var(--bg)':'var(--ink)'};min-height:0">${esc(x)}</button>`).join('')}
  $('tags').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;on.has(k)?on.delete(k):on.add(k);tagBar();render()};
  /* Skill-set courses (skillset/<id>/course.html). Add a row here when a new course is created. */
  const TEAMS=[
    {id:'business',name:'Business team',blurb:'Roles that decide what to build and why, win customers and money, and keep the company within the rules.'},
    {id:'platform',name:'Platform team',blurb:'Roles that build, run and check the product itself.'},
    {id:'data',name:'Data team',blurb:'Roles that move, analyse and model data.'}
  ];
  const TEAM_OF={'product-management':'business','sales':'business','marketing':'business','finance':'business','legal':'business','backend-engineer':'platform','frontend-engineer':'platform','ui-ux-design':'platform','devops':'platform','qa-qc':'platform','data-engineer':'data','data-analytics':'data','data-science':'data'};
  const COURSES0=[
    {id:'backend-engineer',tag:'BACKEND ENG',name:'Backend engineer',hash:'#/m/1',desc:'Backend skill set and the mindset to review an AI agent: 13 modules and 75 lessons, from requirements and data modeling to security, scaling and delivery.',chips:['13 modules written','plugin: backend-engineer']},
    {id:'ui-ux-design',tag:'UI/UX',name:'UI/UX designer',desc:'From a user problem to a design contract: discovery, flows, visual system, accessibility, handoff.',chips:['curriculum layout','12 modules planned','plugin: ui-ux-designer']},
    {id:'frontend-engineer',tag:'FRONTEND',name:'Frontend engineer',desc:'Components, state, rendering, accessibility, performance and testing, built from a design contract.',chips:['curriculum layout','12 modules planned','plugin: frontend-engineer']},
    {id:'devops',tag:'DEVOPS',name:'DevOps engineer',desc:'Containers, CI/CD, infrastructure as code, observability, reliability and secure operations.',chips:['curriculum layout','12 modules planned','plugin: devops-engineer']},
    {id:'qa-qc',tag:'QA/QC',name:'QA and QC engineer',desc:'Requirements to tests, risk-based strategy, automation, metrics and release readiness.',chips:['curriculum layout','11 modules planned','plugin: qa-engineer']},
    {id:'product-management',tag:'PRODUCT',name:'Product manager',desc:'Discovery, strategy, PRDs, prioritization, metrics, experiments and launch.',chips:['curriculum layout','12 modules planned','plugin: product-manager']},
    {id:'data-engineer',tag:'DATA ENG',name:'Data engineer',desc:'Ingestion, batch and streaming pipelines, warehouse modeling, data quality, governance and operations.',chips:['curriculum layout','12 modules planned','plugin: data-engineer']},
    {id:'data-analytics',tag:'ANALYTICS',name:'Data analyst',desc:'Questions and metrics, SQL, cleaning, statistics, experiments, dashboards and recommendations.',chips:['curriculum layout','11 modules planned','plugin: data-analyst']},
    {id:'sales',tag:'SALES',name:'Sales',desc:'Ideal customer, prospecting, discovery, negotiation, pipeline and forecasting, and account growth.',chips:['curriculum layout','11 modules planned','plugin: sales-manager']},
    {id:'marketing',tag:'MARKETING',name:'Marketing',desc:'Positioning, messaging, channels, content and SEO, lifecycle, attribution and budgets.',chips:['curriculum layout','12 modules planned','plugin: marketing-manager']},
    {id:'finance',tag:'FINANCE',name:'Finance',desc:'Accounting foundations, reporting, forecasting, unit economics, cash, business cases and controls.',chips:['curriculum layout','11 modules planned','plugin: finance-analyst']},
    {id:'legal',tag:'LEGAL',name:'Legal',desc:'Contracts, platform terms, privacy, IP, consumer rules, regulatory risk and incident response.',chips:['curriculum layout','11 modules planned','plugin: legal-counsel']},
    {id:'data-science',tag:'DATA SCI',name:'Data scientist',desc:'Problem framing, features, supervised and unsupervised learning, evaluation, MLOps and responsible ML.',chips:['curriculum layout','13 modules planned','plugin: data-scientist']}
  ];
  const COURSES=COURSES0.map(c=>({...c,team:TEAM_OF[c.id],role:c.name,text:c.desc+' '+c.chips.join(' ')}));
  const cardHTML=(c,i)=>`<a class="ccard" href="skillset/${c.id}/course.html${c.hash||''}" style="--p:var(--p${i%8})"><div class="art"><svg viewBox="0 0 200 90" aria-hidden="true"><rect x="22" y="22" width="156" height="46" rx="10" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><text x="100" y="51" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="15" font-weight="700" fill="var(--ink)">${esc(c.tag)}</text></svg></div><div class="body"><h3>${esc(c.name)}</h3><p>${esc(c.desc)}</p><div class="chips">${c.chips.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div></a>`;
  function render(){
    const q=$('q').value,toks=norm(q).split(/\s+/).filter(Boolean);
    /* the search box filters the skill-set courses (and agent skills, when the repo lists any) */
    const hitsC=search(COURSES,q,[['name',6],['tag',4],['role',3],['text',1]]);
    $('courses').innerHTML=hitsC.length?TEAMS.map(t=>{const hs=hitsC.filter(({item:c})=>c.team===t.id);return hs.length?`<section class="team" aria-labelledby="team-${t.id}"><h3 id="team-${t.id}" style="font:700 14px var(--mono);margin:26px 0 0">${esc(t.name)} <span style="font-weight:400;color:var(--mut)">${hs.length} ${hs.length>1?'courses':'course'}</span></h3><p style="color:var(--mut);margin:4px 0 0;max-width:72ch;font-size:14px">${esc(t.blurb)}</p><div class="cgrid" style="margin-top:12px">${hs.map(({item:c},k)=>cardHTML(c,k)).join('')}</div></section>`:''}).join(''):`<div class="empty" style="margin-top:14px"><b>No course matches</b>Try another word.</div>`;
    const pool=D.skills.filter(s=>!on.size||(s.tags||[]).some(t=>on.has(t)));
    const hits=search(pool,q,[['name',6],['tags',4],['description',1]]);
    $('skills-sec').hidden=!D.skills.length;
    $('status').textContent=D.skills.length?`${hits.length} of ${D.skills.length} skills · ${hitsC.length} of ${COURSES.length} courses`:`${hitsC.length} of ${COURSES.length} courses`;
    $('skills').innerHTML=hits.length?hits.map(({item:s},i)=>{const cmd=`npx degit ${D.repo}/${s.path} ~/.claude/skills/${s.name}`;
      return `<article class="ccard skill-card" style="--p:var(--p${i%8});cursor:default"><div class="art">${window.Thumbs.svg('skill')}</div>
      <div class="body"><h3 style="word-break:break-word">${hi(s.name,toks)}</h3><p>${hi(s.description,toks)}</p>
      <div class="chips">${(s.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div>
      <div class="install"><code>${esc(cmd)}</code><button type="button" data-cmd="${esc(cmd)}">Copy</button></div>
      <div class="links"><a href="${esc(s.url)}" target="_blank" rel="noopener">View on GitHub ↗</a>${s.updated?`<span>updated ${ago(s.updated)}</span>`:''}</div></div></article>`}).join('')
      :`<div class="empty" style="grid-column:1/-1"><b>${D.skills.length?'No skill matches':'No skills yet'}</b>${D.skills.length?'Try another word or clear the tag filters.':'Add a skill to the repo and push.'}</div>`;
  }
  $('skills').onclick=e=>{const b=e.target.closest('button[data-cmd]');if(!b)return;(navigator.clipboard?navigator.clipboard.writeText(b.dataset.cmd):Promise.reject()).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)},()=>{b.textContent='Select + copy'})};
  tagBar();bindSearch($('q'),render);render();
  /* Live refresh: the repo's CI keeps skills.json current, so new skills show up with no change to this site. */
  fetch(RAW,{cache:'no-cache'}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>{
    if(!j||!Array.isArray(j.skills))return; D={...j,skills:j.skills.filter(s=>!HIDDEN.has(s.name))}; tagBar(); render();
    $('live').classList.add('on'); $('live').lastChild.textContent='live from GitHub'+(j.generated?' · '+ago(j.generated):'');
  }).catch(()=>{});
})();
</script>
</body>
</html>
