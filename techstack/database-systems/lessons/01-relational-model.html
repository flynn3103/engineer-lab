<p class="lede">A relational database stores facts as rows in tables. You describe the result you want in SQL, and the database works out how to fetch it.</p>

<h2>Rows are facts</h2>
<p>A table is a <b>relation</b>. Each row is one fact about one thing: “customer 1 is Ana”. Columns have names and types. Row order means nothing, so use <code>ORDER BY</code> whenever the order matters.</p>

<h2>Keys and constraints keep bad data out</h2>
<ul>
  <li><b>Primary key</b>: every row has a unique id, so rows can be referred to.</li>
  <li><b>Foreign key</b>: <code>orders.customer_id</code> must match a real customer.</li>
  <li><b>UNIQUE</b>: no two rows may share the same value, such as an email.</li>
  <li><b>NOT NULL</b>: the value must be present.</li>
</ul>
<p>Put the rule in the database and every writer must obey it. Hoping that each application checks is how duplicates appear.</p>
<figure>

<h2>SQL says what, not how</h2>
<p>You describe the result. The planner picks the access path, such as which index to use and in which order to join. Your job is to make the description say exactly what you mean.</p>

<h2>Joins multiply rows</h2>
<p>A join keeps a pair of rows only when its condition is true. With no condition, every row pairs with every row: 3 customers and 3 orders make 9 pairs. Any sum over those pairs is wrong, and the mistake is easy to miss because the query still runs.</p>

<h2>NULL means unknown</h2>
<p>NULL is not zero, and it is not an empty string. A comparison with NULL is <i>unknown</i>, and <code>WHERE</code> keeps only rows that are true. So <code>3 NOT IN (1, 2, NULL)</code> is never true, and the whole query returns nothing. To ask “has no matching row”, use <code>NOT EXISTS</code>.</p>

<h2>Money is decimal</h2>
<p>Binary floating point cannot store 0.1 or 0.2 exactly, so totals drift. Store money as <code>NUMERIC(10,2)</code>.</p>

<div class="rule"><b>Before you trust a number:</b> count the rows after each join; check that keys match on both sides; check that no NULL can reach a <code>NOT IN</code> list; check that the table has the UNIQUE and NOT NULL constraints the business rule needs.</div>
