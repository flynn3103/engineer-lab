  return { el, add(text, cls) { el.append(h('div', { class: cls || '' }, text)); el.scrollTop = el.scrollHeight; }, clear() { el.textContent = ''; } };
}
function stat(items) {   // items: [{l, v, cls}] -> element; call el.update(items) to refresh
  const el = h('div', { class: 'stat' });
  el.update = its => { el.textContent = ''; its.forEach(i => el.append(h('div', { class: i.cls || '' }, h('small', {}, i.l), h('b', {}, i.v)))); };
  el.update(items || []); return el;
}

/* static architecture diagram: spec = {w,h,boxes:[[id,x,y,w,h,label,tone]],arrows:[[from,to,label,dashed]],cap}; tone 0..7 picks a --p colour; '\n' splits lines */
function diagram(sp) {
  const B = {}; sp.boxes.forEach(b => { B[b[0]] = { x: b[1], y: b[2], w: b[3], h: b[4] }; });
  const s = svg('svg', { viewBox: `0 0 ${sp.w} ${sp.h}`, role: 'img', 'aria-label': sp.cap || 'diagram', style: 'width:100%;min-width:' + Math.min(sp.w, 540) + 'px;max-width:' + sp.w + 'px;height:auto;display:block;margin:0 auto' });
  s.append(svg('defs', {}, svg('marker', { id: 'ah', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, svg('path', { d: 'M0 0L10 5L0 10z', fill: 'currentColor' }))));
  const edge = (a, t) => { const cx = a.x + a.w / 2, cy = a.y + a.h / 2, dx = t.x + t.w / 2 - cx, dy = t.y + t.h / 2 - cy; const k = Math.min(dx ? (a.w / 2) / Math.abs(dx) : 1e9, dy ? (a.h / 2) / Math.abs(dy) : 1e9); return [cx + dx * k, cy + dy * k]; };
  (sp.arrows || []).forEach(([f, t, lab, dash]) => {
    const [x1, y1] = edge(B[f], B[t]), [x2, y2] = edge(B[t], B[f]);
    s.append(svg('line', { x1, y1, x2, y2, stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-dasharray': dash ? '5 4' : null, 'marker-end': 'url(#ah)', style: 'color:var(--mut)' }));
    if (lab) s.append(svg('text', { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 5, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--mut)' }, lab));
  });
  sp.boxes.forEach(([id, x, y, w, hh, lab, tone]) => {
    s.append(svg('rect', { x, y, width: w, height: hh, rx: 9, fill: tone == null ? 'var(--card)' : 'var(--p' + tone + ')', stroke: 'var(--line)', 'stroke-width': 1.5 }));
    const ls = String(lab).split('\n'), y0 = y + hh / 2 - (ls.length - 1) * 8 + 4;
    ls.forEach((l, i) => s.append(svg('text', { x: x + w / 2, y: y0 + i * 16, 'text-anchor': 'middle', 'font-size': 12.5, fill: 'var(--ink)', 'font-weight': i === 0 && ls.length > 1 ? 700 : 400 }, l)));
  });
  return h('figure', { class: 'arch' }, h('div', { class: 'svgw' }, s), sp.cap ? h('figcaption', { class: 'note' }, sp.cap) : null);
}
API.diagram = diagram;

{ask:'Why store rows in pages, and keep only some of them in memory?',

 scene:['A database stores rows on disk. A query can only work on data that is in memory (RAM), and reading from disk is far slower.','So the database groups rows into fixed-size <b>pages</b>, for example 8 KB. Every disk read moves a whole page, so one read can serve many rows.','But a 200 GB table does not fit in 16 GB of RAM (illustrative). A lookup whose pages are in memory takes 2 ms; one that must read them from disk can take 3 seconds.','So the database keeps a limited set of pages in memory, called the <b>buffer pool</b>, and decides which pages stay.'],

e>read</code>.']},
  {tab:'Leaked pin',t:'A pin is never released, so its frame can never be reused',sym:'<b>Free frames</b> run out after a few failed requests, and then the next request waits forever.',ctx:'An error path in a storage extension returns early without unpinning. Each failed request leaves its frame pinned for the life of the process.',why:'A pin is a reference count, and eviction needs the count at zero. Time never clears a missing unpin, so the unpinned frames drain until none are left.',log:{text:'-- representative MySQL/InnoDB output, wording varies by version\n[Warning] InnoDB: Difficult to find free blocks in the buffer pool (search iterations ...)!\n\nSHOW ENGINE INNODB STATUS;  ->  BUFFER POOL AND MEMORY: Free buffers 0',note:'Free buffers at 0 with rising search iterations means no frame can be reused. Look for references that never went away.'},sim:{bad:{frames:4,start:'Start: the pool is empty. Requests 2 to 5 fail on an error path.',ops:[{page:'P1'},{page:'P2',leak:true},{page:'P3',leak:true},{page:'P4',leak:true},{page:'P5',leak:true},{page:'P6'}]},good:{frames:4,start:'Start: the same requests, but every path releases its pin.',ops:[{page:'P1'},{page:'P2'},{page:'P3'},{page:'P4'},{page:'P5'},{page:'P6'}]}},fix:['Pair every pin with an unpin on every exit path. Use a guard that releases on scope exit: RAII in C++ or Rust, try-with-resources in Java, defer in Go.','Add an assertion in debug and test builds: when a request ends, every frame it touched must have a pin count of zero.','Find the leaking path with diagnostics. In MySQL, <code>SHOW ENGINE INNODB STATUS</code> reports free buffers and pending reads; in PostgreSQL, the <code>pg_buffercache</code> extension shows what each buffer holds.','Verify: run the failing path 10,000 times in a test, then check that the number of free frames matches the count before the test.']},
  {tab:'Scan flooding',t:'A one-time scan evicts the hot pages',sym:'<b>Checkout</b> latency rises only while the nightly export runs.',ctx:'A nightly export reads a 180 GB sales table once, page by page. It passes through the same buffer pool that serves checkout, so the checkout hot set is replaced every night.',why:'LRU keeps the most recently used pages. A scan touches many pages exactly once, and each one is more recent than the hot pages, so the scan pushes them out. The export gains nothing from caching, yet it uses the cache that other queries need.',log:{text:'-- representative pg_stat_io (PostgreSQL 16+), counts illustrative\nbackend_type   | context  |   reads     |    hits\nclient backend | normal   |   412,908   |  9,811,002\nclient backend | bulkread | 1,920,000   |          0',note:'A <code>bulkread</code> row with many reads and no hits is a scan. If <code>normal</code> reads rise in the same window, the hot set is being evicted.'},sim:{bad:{frames:4,start:'Start: the pool holds the hot set H1 to H3 and one scan page.',ops:[{page:'H1'},{page:'H2'},{page:'H3'},{page:'H1'},{page:'H2'},{page:'H3'},{page:'S1',scan:true},{page:'S2',scan:true},{page:'S3',scan:true},{page:'S4',scan:true},{page:'S5',scan:true},{page:'S6',scan:true},{page:'H1'},{page:'H2'},{page:'H3'}]},good:{frames:4,scanRing:true,start:'Start: the same workload, but scan pages use one reserved frame.',ops:[{page:'H1'},{page:'H2'},{page:'H3'},{page:'H1'},{page:'H2'},{page:'H3'},{page:'S1',scan:true},{page:'S2',scan:true},{page:'S3',scan:true},{page:'S4',scan:true},{page:'S5',scan:true},{page:'S6',scan:true},{page:'H1'},{page:'H2'},{page:'H3'}]}},fix:['Give large scans a bounded ring. PostgreSQL does this for large sequential scans, VACUUM and COPY: they reuse a small 256 kB ring of buffers instead of the whole pool.','In MySQL/InnoDB, rely on midpoint insertion. Pages read by a scan enter the old sublist first; <code>innodb_old_blocks_time</code> (default 1000 ms) delays promotion, and <code>innodb_old_blocks_pct</code> sets the old-sublist share.','Move the export to a replica or to an off-peak window, so it does not compete with the hot set on the primary.','Verify: compare checkout p99 latency and <code>pg_stat_io</code> reads in context <code>normal</code> across two export runs, before and after the change.']},
  {tab:'Dirty eviction',t:'A read must write a dirty page before it can reuse the frame',sym:'<b>Read latency</b> spikes during write bursts, while disk read throughput looks normal.',ctx:'An order-ingest service updates about 8,000 rows a second. The background writer cannot flush pages as fast as writers dirty them, so most frames a reader needs hold changes that are not on disk yet.',why:'A frame cannot be reused while it holds unsaved changes. A backend that needs a frame and finds a dirty victim must write it first, so the read waits on a write. That is background flushing work done inside the query path.',log:{text:'-- representative pg_stat_bgwriter (PostgreSQL 16 and earlier), counts illustrative\n buffers_clean | buffers_alloc | buffers_backend\n   1,203,411   |  9,870,114   |   6,402,955   <- written by query backends',note:'A rising <code>buffers_backend</code> means query backends are doing the writer&rsquo;s job. PostgreSQL 17 moved these counts into <code>pg_stat_io</code>.'},sim:{bad:{frames:4,init:[{p:'A',dirty:1},{p:'B',dirty:1},{p:'C',dirty:1},{p:'D',dirty:1}],start:'Start: every frame holds a dirty page. Nothing has been flushed yet.',ops:[{page:'E'},{page:'F'}]},good:{frames:4,init:[{p:'A',dirty:1},{p:'B',dirty:1},{p:'C',dirty:1},{p:'D',dirty:1}],cleaner:true,idle:4,start:'Start: the same dirty pool, and the background writer runs before the requests.',ops:[{page:'E'},{page:'F'}]}},fix:['Keep the background writer ahead of the workload: raise <code>bgwriter_lru_maxpages</code> and lower <code>bgwriter_delay</code>, so dirty pages are written before a backend needs their frames.','Track <code>buffers_backend</code> (or writes by backend in <code>pg_stat_io</code>) as a rate. It should stay small next to background writes.','Spread the writes: commit in smaller batches so dirty pages reach disk steadily, instead of in one burst. Checkpoint I/O bursts are a separate mechanism, covered in chapter 13.','Verify: replay the same write burst and compare  comp:{
  exec:{n:'Executor',d:'The part of the query engine that needs a row. It does not know where the row is stored. It only asks the buffer pool for a page ID, such as page 17, and then reads the record it needs from that page.'},
  bpm:{n:'Buffer pool manager',d:'The coordinator. Every page request goes through it. It checks the <b>page table</b>, a map from page ID to frame (page 17 to frame 3): an entry means a <b>hit</b>, no entry means a <b>miss</b>. It calls the replacer and the disk manager when needed, and keeps the bookkeeping that makes caching safe.'},
  frames:{n:'Buffer frames',d:'Fixed-size slots in RAM, each holding exactly one page. Each frame has a <b>pin count</b>, the number of users using it now (a pinned frame can never be evicted), and a <b>dirty flag</b>, which means its content differs from disk and must be written back before reuse.'},
  repl:{n:'Replacer',d:'Picks a <b>victim</b> frame when no frame is free, and only from unpinned frames. <b>LRU</b> picks the least recently used frame. <b>Clock</b> approximates LRU cheaply with one reference bit per frame and a moving hand.'},
  disk:{n:'Disk manager',d:'The only component that calls the operating system file API. It reads a whole page from the data file into a frame, and writes a dirty page back. It moves pages, never single rows.'},

<script>
const SQL_LOGICAL_ORDER=[
 'FROM','JOIN','WHERE','GROUP BY','HAVING','WINDOW','SELECT','DISTINCT','ORDER BY','LIMIT'
];
const SQL_KEYWORDS=new Set(('SELECT FROM WHERE JOIN INNER LEFT RIGHT FULL CROSS ON AS GROUP BY HAVING OVER PARTITION ORDER ROWS BETWEEN UNBOUNDED PRECEDING CURRENT ROW LIMIT OFFSET DISTINCT WITH RECURSIVE UNION ALL INSERT INTO UPDATE DELETE CREATE TABLE PRIMARY KEY FOREIGN REFERENCES UNIQUE NOT NULL IS AND OR DESC ASC CASE WHEN THEN ELSE END').split(' '));
const SQL_FUNCTIONS=new Set(['AVG','COUNT','SUM','MIN','MAX','ROW_NUMBER','RANK','DENSE_RANK','LAG','LEAD']);

function sqlEscape(text){
 return String(text).replace(/[&<>]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[char]));
}

function sqlHighlightSql(code){
 const tokens=String(code).match(/--[^\n]*|'(?:''|[^'])*'|\b\d+(?:\.\d+)?\b|<>|!=|<=|>=|::|[-+*/=<>]|\b[A-Za-z_][A-Za-z0-9_]*\b|\s+|./gs)||[];
 return tokens.map(token=>{
  if(/^\s+$/.test(token)) return token;
  let kind='';
  const upper=token.toUpperCase();
  if(token.startsWith('--')) kind='comment';
  else if(token.startsWith("'")) kind='str';
  else if(/^\d/.test(token)) kind='num';
  else if(SQL_FUNCTIONS.has(upper)) kind='fn';
  else if(SQL_KEYWORDS.has(upper)) kind='kw';
  else if(/^(<>|!=|<=|>=|::|[-+*/=<>])$/.test(token)) kind='op';
  else if(/^[A-Za-z_]/.test(token)) kind='id';
  return kind?'<span class="sqlcs-tok '+kind+'">'+sqlEscape(token)+'</span>':sqlEscape(token);
 }).join('');
}

function sqlLogicalOrder(clauses){
 const present=new Set(clauses);
 return SQL_LOGICAL_ORDER.filter(clause=>present.has(clause));
}

function sqlLogicalPipeline(courses,enrollments,options){
 const settings={minScore:75,minCount:2,limit:2,...(options||{})};
 const fromRows=courses.map(row=>({cid:row.cid,name:row.name}));
 const joined=[];
 courses.forEach(course=>enrollments.forEach(enrollment=>{
  if(course.cid===enrollment.cid) joined.push({
   cid:course.cid,name:course.name,sid:enrollment.sid,score:enrollment.score
  });
 }));
 const filtered=joined.filter(row=>row.score>=settings.minScore);
 const grouped=[];
 const groups=new Map();
 filtered.forEach(row=>{
  const group=groups.get(row.cid)||{cid:row.cid,name:row.name,count:0,sum:0,avgScore:0};
  group.count+=1;
  group.sum+=row.score;
  group.avgScore=group.sum/group.count;
  groups.set(row.cid,group);
 });
 groups.forEach(group=>grouped.push({...group}));
 const having=grouped.filter(row=>row.count>=settings.minCount);
 const selected=having.map(row=>({name:row.name,avgScore:row.avgScore}));
 const ordered=[...selected].sort((a,b)=>b.avgScore-a.avgScore||a.name.localeCompare(b.name));
 const limited=ordered.slice(0,settings.limit);
 return [
  {clause:'FROM',columns:['cid','name'],rows:fromRows},
  {clause:'JOIN / ON',columns:['cid','name','sid','score'],rows:joined},
  {clause:'WHERE',columns:['cid','name','sid','score'],rows:filtered},
  {clause:'GROUP BY',columns:['cid','name','count','avgScore'],rows:grouped},
  {clause:'HAVING',columns:['cid','name','count','avgScore'],rows:having},
  {clause:'SELECT',columns:['name','avgScore'],rows:selected},
  {clause:'ORDER BY',columns:['name','avgScore'],rows:ordered},
  {clause:'LIMIT',columns:['name','avgScore'],rows:limited}
 ];
}

function sqlGroupBy(rows,keyField,valueField){
 const groups=new Map();
 rows.forEach(row=>{
  const key=row[keyField];
  const group=groups.get(key)||{key:key,count:0,sum:0,average:0};
  group.count+=1;
  group.sum+=Number(row[valueField]);
  group.average=group.sum/group.count;
  groups.set(key,group);
 });
 return [...groups.values()];
}

function sqlWindowRows(rows,partitionField,orderField){
 const partitions=new Map();
 rows.forEach(row=>{
  const key=row[partitionField];
  if(!partitions.has(key)) partitions.set(key,[]);
  partitions.get(key).push(row);
 });
 const result=[];
 partitions.forEach(partition=>{
  partition.sort((a,b)=>Number(b[orderField])-Number(a[orderField])||Number(a.sid)-Number(b.sid));
  let runningTotal=0,previousValue,rank=0;
  partition.forEach((row,index)=>{
   const value=Number(row[orderField]);
   runningTotal+=value;
   if(value!==previousValue) rank=index+1;
   result.push({...row,rowNumber:index+1,rank:rank,runningTotal:runningTotal});
   previousValue=value;
  });
 });
 return result;
}

function sqlCorrelatedExists(outerRows,innerRows,outerKey,innerKey){
 return outerRows.map(outer=>{
  const matches=innerRows.filter(inner=>inner[innerKey]===outer[outerKey]).length;
  return {...outer,matches:matches,exists:matches>0};
 });
}

function sqlRecursiveLevels(edges,start){
 const visited=new Set([start]);
 const levels=[[start]];
 let frontier=[start];
 while(frontier.length){
  const next=[];
  frontier.forEach(parent=>{
   edges.forEach(([from,to])=>{
    if(from===parent&&!visited.has(to)){
     visited.add(to);
     next.push(to);
    }
   });
  });
  if(!next.length) break;
  levels.push(next);
  frontier=next;
 }
 return levels;
}

/* architecture: one request walks through the boxes; the strip shows the 4 buffer frames */
function archAnim(sp, steps) {
  const B = {};
  sp.boxes.forEach(b => { B[b[0]] = b; });
  const ctr = id => [B[id][1] + B[id][3] / 2, B[id][2] + B[id][4] / 2];
  const edge = (f, t) => {
    const a = B[f], b = B[t], cx = a[1] + a[3] / 2, cy = a[2] + a[4] / 2;
    const dx = b[1] + b[3] / 2 - cx, dy = b[2] + b[4] / 2 - cy;
    const k = Math.min(dx ? (a[3] / 2) / Math.abs(dx) : 1e9, dy ? (a[4] / 2) / Math.abs(dy) : 1e9);
    return [cx + dx * k, cy + dy * k];
  };
  const arrowEls = sp.arrows.map(([f, t, lab, dash]) => {
    const p1 = edge(f, t), p2 = edge(t, f), mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
    const horiz = Math.abs(p2[0] - p1[0]) > Math.abs(p2[1] - p1[1]);
    return svg('g', { class: 'ar-arrow' },
      svg('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], 'marker-end': 'url(#arah)', 'stroke-dasharray': dash ? '6 5' : null }),
      svg('text', { class: 'ar-lab', x: horiz ? mx : mx + 8, y: horiz ? my - 8 : my, 'text-anchor': horiz ? 'middle' : 'start' }, lab));
  });
  let picked = null;
  const boxEls = sp.boxes.map(([id, x, y, w, hh, label]) => {
    const lines = label.split('\n');
    return svg('g', { class: 'ar-box', tabindex: 0, role: 'button', 'aria-label': sp.comp[id].n, onclick: () => pick(id), onkeydown: e => { if (e.key === 'Enter') pick(id); } },
      svg('rect', { x, y, width: w, height: hh, rx: 10 }),
      lines.map((ln, i) => svg('text', { class: i ? 'ar-sub' : 'ar-title', x: x + w / 2, y: y + hh / 2 + (i - (lines.length - 1) / 2) * 16 + 4, 'text-anchor': 'middle' }, ln)));
  });
  const dot = svg('circle', { class: 'ar-dot', r: 7, cx: 0, cy: 0, opacity: 0 });
  const picture = svg('svg', { viewBox: `0 0 ${sp.w} ${sp.h}`, role: 'img', 'aria-label': sp.cap, style: 'width:100%;max-width:500px;margin:0 auto;height:auto;display:block' },
    svg('defs', {}, svg('marker', { id: 'arah', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, svg('path', { d: 'M0 0L10 5L0 10z', fill: 'currentColor' }))),
    arrowEls, boxEls, dot);
  let mode = steps.modes[0].v, k = 0, tok = 0;
  const text = h('p', { class: 'ar-text' }), count = h('small', { class: 'ar-count' });
  const comp = h('div', { class: 'ar-comp' });
  const S = () => steps[mode];
  function paint() {
    const cur = k ? S()[k - 1] : null;
    boxEls.forEach((el, i) => { const on = !!cur && cur.box.includes(sp.boxes[i][0]); el.classList.toggle('on', on); el.classList.toggle('off', !!cur && !on); });
    arrowEls.forEach((el, i) => el.classList.toggle('on', !!cur && cur.arrows.includes(i)));
    text.textContent = cur ? cur.t : steps.intro[mode];
    count.textContent = 'Step ' + k + ' of ' + S().length;
    paintComp();
  }
  /* click a component: its definition appears under the diagram; click it again to close */
  function pick(id) {
    picked = picked === id ? null : id;
    boxEls.forEach((el, i) => el.classList.toggle('picked', sp.boxes[i][0] === picked));
    paintComp();
  }
  function paintComp() {
    comp.replaceChildren(picked
      ? h('div', { class: 'ar-card' }, h('b', {}, sp.comp[picked].n), h('p', { html: sp.comp[picked].d }))
      : h('p', { class: 'ar-hint' }, 'Click a component in the diagram to see what it does.'));
  }
  function flyDot(pairs) {
    const my = ++tok;
    dot.setAttribute('opacity', 0);
    if (!pairs) return;
    let i = 0;
    const next = () => {
      if (my !== tok) return;
      if (i >= pairs.length) { dot.setAttribute('opacity', 0); return; }
      const [f, t] = pairs[i++], a = ctr(f), b = ctr(t), t0 = performance.now();
      const frame = () => {
        if (my !== tok) return;
        const p = Math.min(1, (performance.now() - t0) / 500);
        dot.setAttribute('cx', a[0] + (b[0] - a[0]) * p);
        dot.setAttribute('cy', a[1] + (b[1] - a[1]) * p);
        dot.setAttribute('opacity', 1);
        if (p < 1) requestAnimationFrame(frame); else setTimeout(next, 150);
      };
      requestAnimationFrame(frame);
    };
    next();
  }
  const play = player({
    speed: 1600,
    step() { if (k >= S().length) return false; k++; paint(); flyDot(S()[k - 1].dot); return k < S().length; },
    reset() { k = 0; tok++; dot.setAttribute('opacity', 0); paint(); } });
  const modeSeg = seg(steps.modes, mode, v => { mode = v; k = 0; tok++; play.stop(); paint(); });
  paint();
  return h('figure', { class: 'arch arch-anim' },
    h('div', { class: 'split' },
      h('div', { class: 'split-l svgw' }, picture),
      h('div', { class: 'split-r' }, h('div', { class: 'arch-ctl' }, play, modeSeg), h('div', { class: 'ar-step' }, count, text), comp)),
    h('figcaption', { class: 'note' }, sp.cap));
}

/* one simulator for every common problem: frames, pins, dirty flags, reads and writes, step by step */
function poolSim(o) {
  const N = o.frames, ring = o.scanRing ? 1 : 0, main = N - ring;
  const fr = Array.from({ length: N }, (_, i) => (o.init && o.init[i]) ? { p: o.init[i].p, pin: 0, dirty: o.init[i].dirty ? 1 : 0 } : null);
  const use = Array.from({ length: N }, (_, i) => i - N);
  let t = 0, hits = 0, reads = 0, fgW = 0, bgW = 0, hotMiss = 0, stalled = false;
  const seen = new Set((o.init || []).map(x => x.p));
  const snap = () => fr.map(f => (f ? { ...f } : null));
  const out = [];
  const state = (msg, extra) => out.push(Object.assign({ frames: snap(), msg, hits, reads, fgW, bgW, hotMiss, stalled }, extra || {}));
  function clean() {   // background writer: flush the least recently used dirty, unpinned frame
    const c = fr.map((f, i) => i).filter(i => fr[i] && fr[i].dirty && fr[i].pin === 0).sort((a, b) => use[a] - use[b])[0];
    if (c === undefined) return '';
    fr[c].dirty = 0; bgW++;
    return 'The background writer flushes page ' + fr[c].p + ' (not on the request path)';
  }
  state(o.start || 'Start: the pool is empty.');
  for (let i = 0; i < (o.idle || 0); i++) { const m = clean(); if (m) state(m + '.'); }
  for (const op of o.ops) {
    const msg = [];
    let idx = fr.findIndex(f => f && f.p === op.page);
    const hit = idx >= 0;
    if (hit) {
      hits++;
      msg.push('Page ' + op.page + ' is in frame ' + (idx + 1) + ': HIT, no disk read');
    } else {
      const range = op.scan && ring ? [N - 1] : [...Array(main).keys()];
      let target = range.find(i => !fr[i]);
      msg.push('Page ' + op.page + ' is not in memory: MISS');
      if (target === undefined) {
        const cands = range.filter(i => fr[i].pin === 0);
        if (!cands.length) {
          stalled = true;
          state('Page ' + op.page + ' needs a frame, but every frame is pinned. The request waits forever.', { hit: false, op: op.page });
          break;
        }
        target = cands.reduce((a, b) => (use[b] < use[a] ? b : a));
        const v = fr[target];
        msg.push(v.dirty ? 'Victim page ' + v.p + ' is dirty: it must be written first (1 extra write)' : 'Victim page ' + v.p + ' is clean, so it is just dropped');
        if (v.dirty) fgW++;
      }
      reads++;
      if (op.page[0] === 'H' && seen.has(op.page)) hotMiss++;
      fr[target] = { p: op.page, pin: 0, dirty: 0 };
      msg.push('Read page ' + op.page + ' from disk into frame ' + (target + 1));
      idx = target;
    }
    seen.add(op.page);
    const f = fr[idx];
    f.pin += 1; use[idx] = ++t;
    if (op.write) { f.dirty = 1; msg.push('The row is written and the frame is marked dirty'); }
    if (op.leak) msg.push('The error path returns without unpinning, so pin count stays ' + f.pin);
    else { f.pin -= 1; msg.push('Request done: pin count back to ' + f.pin); }
    if (o.cleaner) { const c = clean(); if (c) msg.push(c); }
    state(msg.join('. ') + '.', { hit, op: op.page });
  }
  return out;
}

function simView(o) {
  const st = poolSim(o);
  let k = 0;
  const strip = h('div', { class: 'sm-frames' }), chips = h('div', { class: 'sm-ops' }), msg = h('p', { class: 'sm-msg' }), cnt = h('div', { class: 'sm-cnt' });
  function paint() {
    const s = st[k];
    strip.replaceChildren(...s.frames.map((f, i) => h('div', { class: 'sm-fr' + (f && f.pin > 0 ? ' pinned' : '') + (f && f.dirty ? ' dirty' : '') },
      h('small', {}, 'frame ' + (i + 1)), h('b', {}, f ? 'page ' + f.p : 'free'), h('small', {}, f ? 'pin ' + f.pin + ' · ' + (f.dirty ? 'dirty' : 'clean') : ''))));
    chips.replaceChildren(...o.ops.map((op, i) => {
      const r = st[i + 1];
      const cls = 'sm-op' + (r && i + 1 <= k ? ' done ' + (r.hit ? 'hit' : 'miss') : '') + (i + 1 === k ? ' now' : '') + (op.leak ? ' leak' : '');
      return h('span', { class: cls }, op.page);
    }));
    msg.textContent = s.msg;
    cnt.textContent = 'hits ' + s.hits + ' · disk reads ' + s.reads + ' · writes on the request ' + s.fgW + ' · background writes ' + s.bgW + (s.hotMiss ? ' · hot pages evicted ' + s.hotMiss : '') + (s.stalled ? ' · STALLED' : '');
  }
  const play = player({ speed: 1100, step() { if (k >= st.length - 1) return false; k++; paint(); return k < st.length - 1; }, reset() { k = 0; paint(); } });
  paint();
  return h('div', { class: 'sm' }, play, strip, chips, msg, cnt);
}

/* ---- chapter 3 · storage models, file formats and compression. Custom layout, following the plan ---- */
PG.storage = function (root, A) {
  const { h, seg, player } = A;
  const ROWS = [[1, 'HN', 10, '03-01'], [2, 'HN', 20, '03-01'], [3, 'SG', 30, '03-02'], [4, 'HN', 40, '03-02'], [5, 'SG', 50, '03-03'], [6, 'SG', 60, '03-03'], [7, 'HN', 70, '03-04'], [8, 'HN', 80, '03-04']];
  const COLS = ['id', 'city', 'amount', 'day'];
  const sec = SX.sec;
  const para = SX.para;
  const chip = SX.chip;
  const stat = SX.stat;

  const stepper = SX.stepper;
  /* the table as rows (row store), columns (column store) or PAX row groups, with optional lit and touched cells */
  function table(mode, lit, touch) {
    const chunks = mode === 'col' || mode === 'pax', grouped = mode === 'row' || mode === 'pax';
    const body = [];
    ROWS.forEach((row, r) => {
      if (grouped && r % 4 === 0) body.push(h('tr', { class: 'sx-grp' }, h('td', { colspan: 4 }, (mode === 'pax' ? 'row group ' : 'page ') + (r / 4 + 1) + ' · 128 bytes')));
      body.push(h('tr', { class: touch && touch(r, -1) ? 'touch' : '' }, row.map((x, c) => h('td', { class: lit && lit(r, c) ? 'on' : '' }, String(x)))));
    });
    return h('table', { class: 'sx-table' },
      h('thead', {}, h('tr', {}, COLS.map((c, i) => h('th', { class: touch && touch(-1, i) ? 'touch' : '' }, chunks ? 'chunk: ' + c : c)))),
      h('tbody', {}, body));
  }

  /* PLAYGROUND: one table, two workloads, three layouts. Bytes read, share of the table, values decoded, units touched */
  function playground() {
    let work = 'olap', mode = 'row';
    const view = h('div', { class: 'sx-vis' }), out = h('div', { class: 'sx-stats' }), txt = h('p', { class: 'sx-txt' });
    const paint = () => {
      if (work === 'olap') {
        const bytes = mode === 'row' ? 256 : 64, dec = mode === 'row' ? 32 : 8;
        view.replaceChildren(table(mode, (r, c) => mode === 'row' || c === 2));
        txt.textContent = mode === 'row' ? 'Row store: SUM(amount) reads both pages in full, 256 bytes. It decodes 32 values to use 8.'
          : mode === 'col' ? 'Column store: only the amount chunk is read, 64 bytes. It decodes 8 values, and all of them are used.'
          : 'PAX: inside each row group only the amount chunk is read, 64 bytes. Whole rows still sit together in each group.';
        out.replaceChildren(stat('bytes read', bytes + ' B'), stat('share of table', Math.round(bytes / 256 * 100) + '%'), stat('values decoded', dec));
      } else {
        const touch = (r, c) => mode === 'col' ? r === -1 : r >= 4;
        view.replaceChildren(table(mode, null, touch));
        txt.textContent = mode === 'row' ? 'OLTP insert into a row store: the new row fits in page 2, so one page is rewritten.'
          : mode === 'col' ? 'OLTP insert into a column store: the new row touches 4 chunks, one per column, so 4 separate writes.'
          : 'OLTP insert into PAX: the new row goes into one row group, and its 4 column chunks sit together.';
        out.replaceChildren(stat('units touched', mode === 'col' ? '4 chunks' : mode === 'row' ? '1 page' : '1 row group'), stat('good for', mode === 'row' ? 'OLTP' : mode === 'col' ? 'OLAP' : 'both'));
      }
    };
    const workSeg = seg([{ v: 'olap', l: 'OLAP: SUM(amount)' }, { v: 'oltp', l: 'OLTP: insert one row' }], work, v => { work = v; paint(); });
    const modeSeg = seg([{ v: 'row', l: 'Row (NSM)' }, { v: 'col', l: 'Column (DSM)' }, { v: 'pax', l: 'PAX' }], mode, v => { mode = v; paint(); });
    paint();
    return h('div', { class: 'sx-play' }, h('div', { class: 'sx-controls' }, workSeg, modeSeg), view, out, txt);
  }

  /* ---- two case studies: one row-based file (Avro) and one column-based file (Parquet). Each has an architecture and a write and a read path ---- */
  const rowLines = (idx, clsFn) => idx.map(i => h('div', { class: 'sx-rowl ' + clsFn(i) }, '(' + ROWS[i].join(', ') + ')'));
  const blk = (n, idx, clsFn) => ({ n, rows: idx, clsFn, closed: true });

  function caseStudy(sp) {
    let mode = 'write', k = 0, picked = null;
    const archBox = h('div', { class: 'sx-arch' }), def = h('div', { class: 'sx-def' }), vis = h('div', { class: 'sx-vis' }), txt = h('p', { class: 'sx-txt' }), cnt = h('small', { class: 'sx-cnt' });
    const steps = () => sp.steps[mode];
    const cur = () => (k ? steps()[k - 1] : null);
    function paint() {
      const s = cur(), on = s ? s.on : [];
      archBox.replaceChildren(...sp.boxes.map(b => h('button', { class: 'sx-box' + (on.includes(b.id) ? ' on' : '') + (picked === b.id ? ' picked' : ''), onclick: () => { picked = picked === b.id ? null : b.id; paint(); } }, b.n)));
      const pb = sp.boxes.find(b => b.id === picked);
      def.replaceChildren(...(pb ? [h('b', {}, pb.n), h('p', { class: 'sx-p', html: pb.d })] : [h('span', { class: 'sx-hint' }, 'Click a component above to see what it does.')]));
      vis.replaceChildren(...sp.draw(s ? s.file : sp.start[mode].file));
      txt.textContent = s ? s.t : sp.start[mode].t;
      cnt.textContent = 'Step ' + k + ' of ' + steps().length;
    }
    const play = player({ speed: 1500, step() { if (k >= steps().length) return false; k++; paint(); return k < steps().length; }, reset() { k = 0; paint(); } });
    const modeSeg = seg([{ v: 'write', l: 'Write' }, { v: 'read', l: 'Read' }], 'write', v => { mode = v; k = 0; play.stop(); paint(); });
    paint();
    return h('div', { class: 'sx-cs' }, h('div', { class: 'sx-controls' }, modeSeg), archBox, def,
      h('div', { class: 'sx-step' }, play, h('div', { class: 'sx-line' }, cnt, txt), vis));
  }

  /* CASE STUDY 1 · Avro: a row-based container file */
  const AVRO = {
    boxes: [
      { id: 'writer', n: 'Writer', d: 'Receives one row at a time and appends it to the open block.' },
      { id: 'header', n: 'Header', d: 'Magic bytes, the schema as JSON, the codec name and a random sync marker. Written once, at the start of the file.' },
      { id: 'buffer', n: 'Block buffer', d: 'Whole rows waiting to be written. When the block is full, it is flushed as one block.' },
      { id: 'block', n: 'Data block', d: 'Row count, byte size, the encoded rows and a sync marker. A reader can skip a block using its size, but has no column statistics to decide.' },
      { id: 'file', n: 'File on disk', d: 'The header, then the blocks one after another. There is no footer: the file is complete as soon as the last block is written.' },
      { id: 'reader', n: 'Reader', d: 'Reads the header first, then reads the blocks in order from start to end.' },
      { id: 'decoder', n: 'Row decoder', d: 'Uses the schema to decode each row. Avro decodes every field of a row, because the data is stored row by row.' }],
    start: {
      write: { t: 'Start: a writer opens a new Avro file. Nothing has been written yet.', file: { header: false, buffer: null, blocks: [] } },
      read: { t: 'Start: query SUM(amount) WHERE day >= 03-03 on an Avro file. The header has no column statistics.', file: { header: true, buffer: null, blocks: [blk(1, [0, 1, 2, 3], () => 'dim'), blk(2, [4, 5, 6, 7], () => 'dim')] } } },
    steps: {
      write: [
        { t: 'The header is written first: magic bytes, the schema as JSON, the codec and a random sync marker. The schema travels with the file.', on: ['writer', 'header'], file: { header: true, buffer: null, blocks: [] } },
        { t: 'Rows 1 to 4 are appended to the open block, one whole row after another. Every field of a row is written together.', on: ['writer', 'buffer'], file: { header: true, buffer: [0, 1, 2, 3], blocks: [] } },
        { t: 'The block is full. Write its row count, its byte size, the encoded rows and a sync marker.', on: ['buffer', 'block'], file: { header: true, buffer: null, blocks: [blk(1, [0, 1, 2, 3], () => 'new')] } },
        { t: 'Rows 5 to 8 go into the next block the same way.', on: ['writer', 'buffer'], file: { header: true, buffer: [4, 5, 6, 7], blocks: [blk(1, [0, 1, 2, 3], () => '')] } },
        { t: 'Close the file. It ends after the last block, with no footer. Appending a row later only adds one more block.', on: ['block', 'file'], file: { header: true, buffer: null, blocks: [blk(1, [0, 1, 2, 3], () => ''), blk(2, [4, 5, 6, 7], () => 'new')] } }],
      read: [
        { t: 'Read the header first: the schema tells the reader how to decode each row.', on: ['reader', 'header'], file: { header: true, buffer: null, blocks: [blk(1, [0, 1, 2, 3], () => 'dim'), blk(2, [4, 5, 6, 7], () => 'dim')] } },
        { t: 'Read block 1. Its size is known, so it could be skipped, but there are no min and max values to show that it cannot match. It must be read.', on: ['reader', 'block'], file: { header: true, buffer: null, blocks: [blk(1, [0, 1, 2, 3], () => 'raw'), blk(2, [4, 5, 6, 7], () => 'dim')] } },
        { t: 'Decode every row of block 1 completely: id, city, amount and day. The query uses only amount and day, but the rows are stored whole.', on: ['decoder', 'block'], file: { header: true, buffer: null, blocks: [blk(1, [0, 1, 2, 3], () => 'decoded'), blk(2, [4, 5, 6, 7], () => 'dim')] } },
        { t: 'Read block 2 the same way.', on: ['reader', 'block'], file: { header: true, buffer: null, blocks: [blk(1, [0, 1, 2, 3], () => 'decoded'), blk(2, [4, 5, 6, 7], () => 'raw')] } },
        { t: 'Decode block 2. Rows 5 to 8 match day >= 03-03, and their amounts 50, 60, 70 and 80 sum to 260.', on: ['decoder', 'block'], file: { header: true, buffer: null, blocks: [blk(1, [0, 1, 2, 3], () => 'decoded'), blk(2, [4, 5, 6, 7], i => 'hit')] } },
        { t: 'Summary: every byte of both blocks was read, and all 4 fields of all 8 rows were decoded. Good for writing and for whole-row reads; costly for a query that needs one column.', on: ['decoder'], file: { header: true, buffer: null, blocks: [blk(1, [0, 1, 2, 3], () => 'decoded'), blk(2, [4, 5, 6, 7], i => 'hit')] } }]
    },
    draw: f => [
      f.header ? h('div', { class: 'sx-hdr' }, h('b', {}, 'header'), h('small', {}, 'magic · schema as JSON · codec · sync marker')) : null,
      f.buffer ? h('div', { class: 'sx-blk open' }, h('b', {}, 'block buffer (open)'), ...rowLines(f.buffer, () => 'new')) : null,
      ...f.blocks.map((b, i) => h('div', { class: 'sx-blk' }, h('b', {}, 'block ' + (i + 1) + ' · ' + b.rows.length + ' rows'), ...rowLines(b.rows, b.clsFn), h('small', {}, 'ends with a sync marker')))
    ].filter(Boolean)
  };

  /* CASE STUDY 2 · Parquet: a column-based file with row groups, chunks and a footer written last */
  const PARQUET = {
    boxes: [
      { id: 'writer', n: 'Writer', d: 'Receives rows and collects them in a buffer, one list per column.' },
      { id: 'buffer', n: 'Row buffer', d: 'Holds a batch of rows in memory until the row group is full. Nothing reaches the file before this.' },
      { id: 'encoder', n: 'Encoders', d: 'Encode each column chunk on its own: dictionary, RLE, bit packing or delta, chosen per column.' },
      { id: 'rowgroup', n: 'Row groups and chunks', d: 'Each row group stores one chunk per column. Chunks of the same column sit together, so a reader can read one column only.' },
      { id: 'footer', n: 'Footer', d: 'The schema, the offset of every chunk, and the min and max of each chunk. It is written last, so the file is complete only when it exists.' },
      { id: 'reader', n: 'Reader', d: 'Reads the last 8 bytes, then the footer. The footer tells it where every chunk is.' },
      { id: 'pruning', n: 'Pruning', d: 'Uses the min and max of each row group to skip row groups that cannot match, before any data is read.' },
      { id: 'chunks', n: 'Chunk reader', d: 'Reads only the byte ranges of the chunks the query needs.' },
      { id: 'decoder', n: 'Decoder', d: 'Expands the needed values into vectors. Values that are not needed are not expanded.' }],
    start: {
      write: { t: 'Start: the writer receives rows. Parquet stores columns, so nothing can be written until a row group is complete.', file: { buffer: null, rgs: [], footer: false } },
      read: { t: 'Start: query SUM(amount) WHERE day >= 03-03 on a complete Parquet file.', file: { buffer: null, footer: true, tail: true, rgs: [rgOf(0, 'idle', {}), rgOf(1, 'idle', {})] } } },
    steps: {
      write: [
        { t: 'Rows 1 to 4 are collected in a buffer. The buffer keeps each column apart in memory. Nothing is on disk yet.', on: ['writer', 'buffer'], file: { buffer: [0, 1, 2, 3], rgs: [], footer: false } },
        { t: 'The row group is full. Each column is encoded on its own: city becomes a dictionary with bit-packed ids, day becomes delta values. Then the chunks are written.', on: ['encoder', 'rowgroup'], file: { buffer: null, rgs: [rgOf(0, 'written', {})], footer: false } },
        { t: 'Rows 5 to 8 fill the next buffer.', on: ['writer', 'buffer'], file: { buffer: [4, 5, 6, 7], rgs: [rgOf(0, 'written', {})], footer: false } },
        { t: 'The second row group is encoded and written the same way.', on: ['encoder', 'rowgroup'], file: { buffer: null, rgs: [rgOf(0, 'written', {}), rgOf(1, 'written', {})], footer: false } },
        { t: 'Write the footer last: the schema, the offset of every chunk, and the min and max day of each row group. Then PAR1 closes the file. Only now is the file complete.', on: ['footer'], file: { buffer: null, rgs: [rgOf(0, 'idle', {}), rgOf(1, 'idle', {})], footer: true, tail: true } }],
      read: [
        { t: 'Read the last 8 bytes, then the footer. The footer gives the offset of every chunk and the min and max day of each row group.', on: ['reader', 'footer'], file: { buffer: null, footer: true, tail: true, rgs: [rgOf(0, 'idle', {}), rgOf(1, 'idle', {})] } },
        { t: 'Row group 1 has max day 03-02, so pruning skips it. None of its bytes are read.', on: ['pruning', 'rowgroup'], file: { buffer: null, footer: true, tail: true, rgs: [rgOf(0, 'skipped', {}), rgOf(1, 'idle', {})] } },
        { t: 'Row group 2 may match. The chunk reader reads only its day and amount chunks. The id and city chunks stay on disk.', on: ['chunks', 'rowgroup'], file: { buffer: null, footer: true, tail: true, rgs: [rgOf(0, 'skipped', {}), rgOf(1, 'read', { amount: 'read', day: 'read' })] } },
        { t: 'The decoder expands only the needed values. The result is SUM(amount) = 260. The footer and 2 chunks were read; 6 chunks were not.', on: ['decoder'], file: { buffer: null, footer: true, tail: true, rgs: [rgOf(0, 'skipped', {}), rgOf(1, 'read', { amount: 'read', day: 'read' })] } }]
    },
    draw: f => [
      f.buffer ? h('div', { class: 'sx-blk open' }, h('b', {}, 'row buffer (in memory)'), ...rowLines(f.buffer, () => 'new')) : null,
      ...f.rgs.map(rg => h('div', { class: 'sx-rgb ' + rg.st }, h('b', {}, rg.label + (rg.st === 'skipped' ? ' · skipped' : '')),
        h('div', { class: 'sx-chunks' }, COLS.map(c => h('span', { class: 'sx-chip ' + (rg.cols[c] || '') }, c))))),
      h('div', { class: 'sx-footer' + (f.footer ? ' on' : '') }, f.footer ? 'Footer: schema, chunk offsets, min and max per chunk' + (f.tail ? ' · ends with PAR1' : '') : 'Footer: not written yet')
    ].filter(Boolean)
  };
  function rgOf(i, st, cols) {
    const all = {}; COLS.forEach(c => { all[c] = st === 'written' ? 'new' : (cols[c] || ''); });
    return { label: 'row group ' + (i + 1) + ' · rows ' + (i * 4 + 1) + ' to ' + (i * 4 + 4), st, cols: all };
  }

  /* the Avro and Parquet sections; each one is a case study with its own steps */
  const caseAvro = () => caseStudy(AVRO);
  const caseParquet = () => caseStudy(PARQUET);

  /* COMMON PROBLEMS: each one is a short timeline with a Failure and an After-fix version */
  function layoutDemo(mode) {
    return stepper([
      { t: 'Start: the same 8 rows, laid out on disk in the chosen way. The query needs only amount.', read: false },
      { t: mode === 'row' ? 'Row layout: every page is read in full, so all 4 columns are read to use 1. Bytes read: 256, which is 100% of the table.' : 'Column layout: only the amount chunk is read. Bytes read: 64, which is 25% of the table.', read: true }],
      s => [table(mode, s.read ? (r, c) => mode === 'row' || c === 2 : null), h('div', { class: 'sx-stats' }, stat('bytes read', s.read ? (mode === 'row' ? '256 B' : '64 B') : '0 B'))]);
  }
  function dictDemo(fix) {
    const W = 8, n = 8, plain = n * W, dict = u => u * W + Math.ceil(n * Math.ceil(Math.log2(u)) / 8);
    const bars = cols => h('div', { class: 'sx-bars' }, cols.map(c => h('div', { class: 'sx-bar' }, h('div', {}, h('b', {}, c[0]), h('small', {}, c[1])),
      h('div', { class: 'sx-track' }, h('i', { style: 'width:' + Math.min(100, c[2] / 2) + '%' })), h('small', {}, c[2] + ' B'))));
    const states = fix
      ? [{ t: 'Start: user_id is unique in every row. City has only 2 values. Plain: 64 bytes per column.', cols: [['user_id', 'plain', 64], ['city', 'plain', 64]], total: 128 },
         { t: 'user_id stays plain, because its values never repeat. No dictionary is built.', cols: [['user_id', 'plain', 64], ['city', 'plain', 64]], total: 128 },
         { t: 'city has 2 values: a dictionary of 17 bytes instead of 64. Total: 81 bytes.', cols: [['user_id', 'plain', 64], ['city', 'dictionary', dict(2)]], total: plain + dict(2) }]
      : [{ t: 'Start: user_id is unique in every row. City has only 2 values. Plain: 64 bytes per column.', cols: [['user_id', 'plain', 64], ['city', 'plain', 64]], total: 128 },
         { t: 'A dictionary of 8 entries for user_id costs 67 bytes, more than 64 bytes plain. The writer must fall back to plain.', cols: [['user_id', 'dictionary', dict(8)], ['city', 'plain', 64]], total: dict(8) + 64 },
         { t: 'The 67-byte dictionary is already written, so user_id is written plain as well: 131 bytes for user_id.', cols: [['user_id', 'dictionary, then plain', dict(8) + plain], ['city', 'plain', 64]], total: dict(8) + plain + plain },
         { t: 'city has 2 values: a dictionary of 17 bytes instead of 64. Total: 148 bytes.', cols: [['user_id', 'dictionary, then plain', dict(8) + plain], ['city', 'dictionary', dict(2)]], total: dict(8) + plain + dict(2) }];
    return stepper(states, s => [bars(s.cols), h('div', { class: 'sx-stats' }, stat('total bytes', s.total))]);
  }
  function schemaDemo(fix) {
    const files = [{ n: 'file 1', t: 'INT32', v: '10, 20' }, { n: 'file 2', t: 'DOUBLE', v: '30.5, 40.5' }];
    const reader = fix ? 'DOUBLE (table schema)' : 'INT32 (from file 1)';
    const states = [
      { t: fix ? 'Start: the table schema says amount is DOUBLE, and every file is read against it.' : 'Start: the reader takes its schema from file 1. File 1 has INT32 and file 2 has DOUBLE.', st: ['idle', 'idle'], res: 'running' },
      { t: fix ? 'File 1 is INT32, so its values are widened to DOUBLE on read: 10 and 20 become 10.0 and 20.0.' : 'File 1 matches the reader schema: 2 values are read.', st: ['ok', 'idle'], res: 'running' },
      fix ? { t: 'File 2 is DOUBLE and matches the table schema. SUM(amount) = 101.', st: ['ok', 'ok'], res: 'sum = 101' }
        : { t: 'File 2 stores amount as DOUBLE, but the reader expects INT32, so the query fails. Representative message: "Parquet column cannot be converted: expected INT32, found DOUBLE".', st: ['ok', 'error'], res: 'failed' }];
    return stepper(states, s => [h('div', { class: 'sx-files' }, files.map((f, i) => h('div', { class: 'sx-file2 ' + (s.st[i] === 'ok' ? 'read' : s.st[i] === 'error' ? 'error' : '') },
      h('b', {}, f.n), h('small', {}, 'amount: ' + f.t), h('small', {}, f.v)))), h('div', { class: 'sx-reader' }, h('b', {}, 'Reader'), h('small', {}, 'expects amount: ' + reader)),
      h('div', { class: 'sx-stats' }, stat('query', s.res))]);
  }
  function skipDemo(sorted) {
    const days = sorted ? ['03-01', '03-01', '03-02', '03-02', '03-03', '03-03', '03-04', '03-04'] : ['03-01', '03-04', '03-02', '03-04', '03-03', '03-04', '03-01', '03-04'];
    const rgs = [0, 1, 2, 3].map(i => { const a = days[2 * i], b = days[2 * i + 1]; return { min: a < b ? a : b, max: a < b ? b : a }; });
    const status = [0, 1, 2, 3].map(() => 'idle'), states = [{ t: 'Start: 4 row groups of 2 rows each, with the min and max day of each. Query: WHERE day >= 03-04.', st: status.slice() }];
    rgs.forEach((g, i) => { status[i] = g.max < '03-04' ? 'skip' : 'read'; states.push({ t: 'Row group ' + (i + 1) + ': max ' + g.max + (g.max < '03-04' ? ' is below 03-04, so it is skipped without reading its data.' : ' can match, so it must be read.'), st: status.slice() }); });
    const skipped = status.filter(x => x === 'skip').length;
    states.push({ t: (sorted ? 'Sorted by day: ' : 'Unsorted: ') + skipped + ' of 4 row groups skipped. ' + (sorted ? '' : 'Every row group covers 03-01 to 03-04, so the statistics cannot help.'), st: status.slice() });
    return stepper(states, s => [h('div', { class: 'sx-rgs' }, rgs.map((g, i) => h('div', { class: 'sx-rg2 ' + s.st[i] }, h('b', {}, 'Row group ' + (i + 1)), h('small', {}, 'day ' + g.min + ' to ' + g.max),
      h('small', {}, s.st[i] === 'skip' ? 'skipped' : s.st[i] === 'read' ? 'read' : 'not checked yet'))))]);
  }

  const PROBLEMS = [
    { tab: 'Row layout wastes I/O', sym: 'bytes read stay near 100% of the table, even though the query uses one column.', why: 'A row page keeps whole rows together. The reader must read the page to reach any column, so a scan costs the size of the table, not the size of the columns it uses.', log: 'representative, illustrative\nquery: SUM(amount) FROM orders WHERE day >= 2026-03-01\nbytes read: 1.0 TB (columns used: 1 of 100)', demo: v => layoutDemo(v === 'bad' ? 'row' : 'col'),
      fix: ['Store analytical tables in a columnar format such as Parquet or ORC.', 'Select only the columns you need. SELECT * forces every chunk to be read.', 'Keep transactional tables in row storage, and copy them to a columnar table for reporting.', 'Verify: compare bytes read in the engine profile before and after the change.'] },
    { tab: 'High-cardinality dictionary', sym: 'encoded size grows above the plain size, and the writer has to fall back.', why: 'A dictionary stores each distinct value once, plus an id per row. When almost every value is distinct, the dictionary is as large as the data, so it saves nothing and costs work.', log: 'representative writer warning; wording varies by version\nWARN: dictionary for column user_id exceeded its size limit; falling back to plain encoding', demo: v => dictDemo(v === 'good'),
      fix: ['Dictionary-encode only columns with few distinct values, such as city or status.', 'Let the writer fall back to plain or delta encoding for unique columns, such as ids and timestamps.', 'Check the encoded size of each column in the file metadata, and compare it with the plain size.', 'Verify: user_id should stay close to its plain size, and city should shrink.'] },
    { tab: 'Schema evolution', sym: 'the query fails after amount changes from INT32 to DOUBLE, even though the table still looks fine.', why: 'A Parquet file records its own column types. The reader must convert each file to one agreed type. Without a table-level schema, the first file decides, and the next file that differs breaks the read.', log: 'representative, wording varies by engine and version\nParquet column cannot be converted: expected INT32, found DOUBLE (column: amount)', demo: v => schemaDemo(v === 'good'),
      fix: ['Keep one table-level schema, and check every new file against it before it is committed.', 'Widen types explicitly (INT32 to DOUBLE) in the table definition. Do not change a column type in place.', 'Use a table format with schema evolution rules, such as Delta or Iceberg, where the schema is kept in the table log (chapter 16).', 'Verify: read the table from an old file and from a new file, and check the row count and the sum.'] },
    { tab: 'Poor sort order or oversized row groups', sym: 'row groups read stay at 4 of 4, even with a narrow date filter.', why: 'Row-group statistics only help when a row group covers a narrow range. Unsorted data gives every row group the same wide min and max. Oversized row groups have the same effect: one group covers the whole file, so nothing can be skipped.', log: 'representative scan summary, counts illustrative\nrow groups: 4 total, 0 skipped by statistics\nbytes read: 1.2 GB', demo: v => skipDemo(v === 'good'),
      fix: ['Sort or cluster the data by the column that queries filter, such as day, before writing it.', 'Keep row groups small enough that each covers a narrow range, but not so small that the metadata grows.', 'Run a periodic rewrite (compaction) that re-sorts recent small files.', 'Verify: count the row groups skipped by statistics before and after the change.'] }
  ];

  const problems = () => SX.problems(PROBLEMS);
  root.append(
    sec('1 · The problem',
      para('An orders table has 100 columns. Checkout writes one order at a time, so it wants whole rows.'),
      para('An analytical query needs only three columns, but a row layout reads the entire dataset to get them. (Illustrative: about 1 TB read to use about 30 GB.)'),
      para('Columns stored together read less and compress better. But one new row then touches many column files.'),
      h('p', { class: 'sx-q', html: 'Why should the same table be stored differently for transactions and for analytics?' })),
    sec('2 · Core idea and mechanisms',
      para('<b>Core idea:</b> arrange and encode data according to how the workload reads it.'),
      h('ul', { class: 'sx-list', html: [
        '<b>Storage models:</b> row store (NSM), column store (DSM) and PAX, a hybrid with row groups.',
        '<b>File format:</b> row groups, column chunks and pages, with a footer that holds the schema and zone maps (min and max).',
        '<b>Encodings:</b> dictionary, RLE, bit packing and delta, chosen per column chunk.',
        '<b>Late materialization:</b> keep values encoded as long as possible, and decode only what the query returns.'].map(x => '<li>' + x + '</li>').join('') })),
    sec('3 · Playground: one table, two workloads, three layouts', playground()),
    sec('4 · Case study 1 · Avro: a row-based file',
      para('Avro is a row-based file format, common for event streams and message logs. The file is a header with the schema, followed by blocks of whole rows. Writing is simple, but a reader decodes whole rows.'),
      caseAvro()),
    sec('5 · Case study 2 · Parquet: a column-based file',
      para('Parquet is a column-based file format, common for analytics on data lakes. Rows are collected into row groups, each column is stored as a chunk, and a footer at the end lets a reader pick only what it needs.'),
      caseParquet()),
    sec('6 · Row-based or column-based?',
      h('table', { class: 'sx-table sx-cmp' },
        h('thead', {}, h('tr', {}, h('th', {}, ''), h('th', {}, 'Avro (row)'), h('th', {}, 'Parquet (column)'))),
        h('tbody', {}, [
          ['Written as', 'whole rows in blocks', 'column chunks in row groups, footer last'],
          ['Append one row', 'cheap: add to the open block', 'buffered until the row group is full'],
          ['Read unit', 'a block, with every field', 'a column chunk inside a row group'],
          ['Skipping data', 'by block size only', 'by footer min and max, and by column'],
          ['Best for', 'event logs and whole-row reads', 'scans over a few columns']
        ].map(r => h('tr', {}, r.map((c, i) => h('td', { class: i === 0 ? 'sx-cmp-k' : '' }, c)))))),
      para('Both are self-describing: the schema lives in the file, so a reader does not need anything else to decode it.')),
    sec('7 · Common problems · what breaks in production?', problems())
  );
};

for (const k of ["relational", "storage", "indexes", "execution", "algorithms", "udfs", "networking", "optimizer", "cpu", "isolation", "mvcc", "recovery", "distributed", "warehouse", "lakehouse"]) if (!PG[k]) PG[k] = (root, A) => root.append(A.h('div', { class: 'pgbox' }, 'Playground for ' + k + ' is coming.'));
</script>

<script>
/* ---- router + chapter renderer (page content comes from COURSE and CHAPTERS) ---- */
const pc = i => 'var(--p' + (i % 8) + ')';
const app = $('#app');
