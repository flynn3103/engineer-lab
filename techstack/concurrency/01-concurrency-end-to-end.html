{ask:`Two threads both ask "is the lock free?", both hear yes, and both walk into the critical section. How do you make "check and take" one step that nothing can split?`,
 scene:[
  `A payment worker protects its charge routine with a spin lock written by hand: <code>while (locked) {}; locked = true;</code>. In unit tests it works every time, because the test has one thread.`,
  `In production there are 8 cores. Core 1 reads <code>locked</code> as 0 at time 10 ns. Core 2 reads it as 0 at time 11 ns, before core 1 has written anything. Core 1 writes 1 at 12 ns, core 2 writes 1 at 13 ns, and both go on to charge the same order. The customer is charged twice. The log shows two successful charges and no error.`,
  `The gap between the read and the write is a few nanoseconds, so the bug shows up only when two cores hit that gap together. It is rare, and it gets more common as the load goes up. That is exactly the kind of bug tests miss.`
 ],
 build:[
  {t:'Attempt 1: a flag and a loop', body:`The loop reads the flag, then writes it. Those are two separate instructions, and another core can run between them. The answer the thread read is already stale by the time the thread acts on it. Nothing in the code says "these two lines must not be split".`},
  {t:'Attempt 2: protect the flag with another lock', body:`Guard the check with a mutex, and the problem seems solved. But a mutex is itself a lock, and its own "is it free?" check has exactly the same gap. You have moved the problem one level down. You cannot build a lock out of locks. Somewhere the hardware has to make one step indivisible.`},
  {t:'Attempt 3: one instruction that reads and writes', body:`The CPU offers <b>test-and-set</b>: write 1 and return the old value, as a single indivisible instruction. <code>while (test_and_set(&amp;locked)) {}</code>. Now two cores can both call it, but only one gets back 0. That core owns the lock; the other keeps spinning. Correctness is back.<br>The price: every spinning core writes to the same cache line. The line bounces from core to core, and the holder is slowed down by the waiters. The usual fix is to spin on a plain read first, and try the atomic only when the read says the lock looks free.`},
  {t:'Attempt 4: stop spinning, and keep writes in order', body:`A holder that is paused by the scheduler leaves its waiters spinning and burning CPU for nothing. Spin for a short while, then block (the kernel's futex does this). And the lock alone is not enough: the data written before <code>unlock</code> must be visible to the next owner. That needs a release store on unlock and an acquire load on lock. Without them, a weakly ordered CPU can make the flag visible before the data it protects.`}
 ],
 idea:[
  `<b>Safety</b> means a bad thing never happens: two threads are never inside the critical section together. <b>Liveness</b> means a good thing eventually happens: every waiting thread gets in. A lock can be safe and still starve a thread, which is a liveness failure. Deadlock (chapter 8) is another one.`,
  `A read-modify-write must be one instruction, or it is not atomic. The usual set is <b>test-and-set</b>, <b>fetch-and-add</b>, and <b>compare-and-swap (CAS)</b>. CAS is the most general: <code>CAS(p, expected, new)</code> writes <code>new</code> only if <code>*p == expected</code>, and returns whether it did. On ARM and POWER the same job is done by load-linked / store-conditional.`,
  `Atomic instructions are cheap when the cache line is uncontended. Under contention each core must first take the cache line in exclusive state (MESI), so the line moves between cores. That cost, not the instruction itself, is what makes contended atomics slow.`,
  `The CPU and the compiler may reorder independent loads and stores. x86 keeps most stores in order (its memory model is "total store order"). ARM and POWER allow much more reordering. So a correct program on x86 can be wrong on ARM, unless it uses acquire and release ordering.`,
  `You almost never write these by hand. Mutexes, semaphores, channels and lock-free queues are all built from the few instructions above. The rule for application code: use the platform's atomics and locks, and treat any hand-rolled flag as a bug until proven otherwise.`
 ],
 common:[
  {t:'A hand-written lock on a plain flag', tab:'Flag race under load', sim:'c2_flag',
   ex:`A boolean flag guarding a charge routine, written in C, Java or Go without atomics. It passes every test with one thread, and fails only when two requests arrive close together.`,
   why:`Reading the flag and writing it are two instructions. Two threads can both read 0 inside the gap, and both then write 1 and enter. The probability grows with the number of requests that land in that gap, so load makes it worse.`,
   fix:[`Replace the flag with an atomic test-and-set (<code>atomic_flag.test_and_set</code>, <code>AtomicBoolean.compareAndSet</code>), or use the platform mutex and let it do this.`,
        `Add a stress test that runs the critical section from many threads at once, and check the invariant at the end (one charge per order).`,
        `Use a race detector in CI (<code>go test -race</code>, ThreadSanitizer) so the plain read and write is reported even when the timing is lucky.`]},
  {t:'Spinning while the lock holder is paused', tab:'Spinning on a paused holder', sim:'c2_spin',
   ex:`A user-space spin lock in a container limited to 2 CPUs, with 3 worker threads. The lock holder is preempted by the scheduler. The two waiters spin on the two CPUs for their whole time slice, and the holder cannot run to release the lock.`,
   why:`Spinning helps only when the holder is running on another CPU at this moment. If the holder is not running, every spin is wasted, and the spinners push the holder further back in the queue.`,
   fix:[`Spin for a short, bounded time, then block with a futex or a park call. <code>sync.Mutex</code> and <code>pthread_mutex</code> already do this.`,
        `Do not write a spin lock for user code under load. If you must, make it back off (exponential sleep) and yield the CPU after a few spins.`,
        `Keep critical sections short, so the chance that the holder is preempted inside one stays small.`]},
  {t:'Starvation: an unfair lock keeps losing', tab:'Starvation', sim:'c2_starve',
   ex:`Go's <code>sync.Mutex</code> had a starvation problem before Go 1.9: a waiter could lose the race to new arrivals again and again. Java's default <code>ReentrantLock</code> is unfair too, so a thread that arrives later can overtake one that has been waiting for a long time.`,
   why:`A thread that has just arrived can grab the lock the moment it is released, before the waiter that has been queued for a long time wakes up. Under a steady stream of arrivals, the waiter may never be the one that gets the lock.`,
   fix:[`Use a fair lock when waiting time matters: <code>new ReentrantLock(true)</code>. Fair locks cost some throughput, so measure first.`,
        `Go's mutex switches to a starvation mode after a waiter has waited for more than 1 ms, which hands the lock straight to the waiter. Read the release notes before you depend on a specific timing.`,
        `Shorten the critical section, so each waiter's wait is short in the first place.`]},
  {t:'Works on x86, breaks on ARM', tab:'Reordering on ARM', sim:'c2_order',
   ex:`Code that publishes data with <code>data = 42; ready = true;</code> and no barrier. It worked for years on Intel servers. On ARM servers and Apple Silicon, another core read <code>ready == true</code> and then read <code>data == 0</code>.`,
   why:`A weakly ordered CPU may make the store to <code>ready</code> visible before the store to <code>data</code>, because the first store was a cache miss and the second was not. x86 keeps stores in order, so the bug is hidden there, and the code looks correct.`,
   fix:[`Use the language's atomics with release and acquire ordering: a release store on <code>ready</code>, an acquire load on the reader side (C++ <code>std::atomic</code>, Java <code>volatile</code> or <code>VarHandle</code>, Go <code>sync/atomic</code>).`,
        `Never signal through a plain variable, even on x86. The compiler may also reorder it.`,
        `Test on the hardware you ship on. An ARM CI runner catches this class of bug that an x86 laptop never shows.`]}
 ],
 pg:'c2'},

{ask:`A producer makes items faster than the consumer can handle. How do you stop the buffer from growing without limit, and wake each side only when it can actually make progress?`,
 scene:[
  `A crawler downloads pages at 200 per second and a parser turns each page into a record at 50 per second. The queue between them starts empty and gains 150 pages every second.`,
  `After five minutes it holds 45,000 pages, and the newest page waits 15 minutes before anyone looks at it. After an hour the process has used all of its memory and is killed at 3 a.m. Nothing failed along the way: the queue just kept accepting work it could not finish.`
 ],
 build:[
  {t:'Attempt 1: an unbounded queue', body:`The producer appends to a list and the consumer pops from the front. It is fast, simple, and wrong. Overload does not show up as an error. It shows up as <b>latency</b> (the wait grows with the queue length) and as <b>memory</b> (every waiting item holds its data). By the time either is alarming, the damage is done.`},
  {t:'Attempt 2: a capacity check and a sleep', body:`Add a limit: <code>while (count == CAP) sleep(10 ms); push(x); count++</code>. The limit is there, but two things are wrong. Every producer that finds the buffer full loses up to 10 ms, even if a slot frees up one microsecond later. And the check and the push are two steps: two producers can both see <code>count == CAP - 1</code>, both push, and the buffer ends up holding <code>CAP + 1</code> items. This is the race from chapter 5, in a new place.`},
  {t:'Attempt 3: one mutex and one condition variable', body:`Put the check inside a lock, and wait on a condition variable instead of sleeping: <code>lock; while (full) wait(cv); push; notify(cv); unlock</code>. With one producer and one consumer this is correct. With several of each sharing one condition variable, a <code>notify</code> can wake a thread that is waiting for the other condition, and everyone goes back to sleep. Chapter 7 shows how to split the conditions.`},
  {t:'Attempt 4: two counting semaphores and a mutex', body:`Count the two things that matter. <code>empty</code> starts at CAP and counts free slots. <code>full</code> starts at 0 and counts items. Producer: <code>wait(empty); wait(mutex); push; signal(mutex); signal(full)</code>. Consumer: <code>wait(full); wait(mutex); pop; signal(mutex); signal(empty)</code>. Each side sleeps exactly when it cannot proceed, and wakes exactly the other side when it has changed the count. The order of the first two waits is a trap, and the common problems below show what happens when it is wrong.`}
 ],
 idea:[
  `A <b>semaphore</b> is a counter S that never goes below 0. <code>wait</code> (also called P or down): if S &gt; 0, decrement and continue; otherwise sleep. <code>signal</code> (V or up): increment, and wake one sleeper if there is one. A <b>binary</b> semaphore has S in {0, 1} and works as a lock; a <b>counting</b> semaphore counts resources.`,
  `Semaphores have memory. A <code>signal</code> that arrives before anyone waits is kept in the counter, so it is not lost. This is the main difference from a condition variable (chapter 7), and it is why semaphores fit "N items are available" so well.`,
  `For a bounded buffer the invariant is <code>empty + full == CAP</code>, at all times, in every state. Write it down before coding. It is also the first thing to check in a test.`,
  `Keep two jobs apart. The semaphores decide <i>whether</i> an operation may start. The mutex protects the data structure while it is changed. A counting semaphore cannot protect data by itself, because two threads can both pass <code>wait</code> at the same time.`,
  `Choose the capacity from the latency you can afford, not from memory alone. <b>Little's law</b> says the average number of items in a system equals arrival rate times average time in it: L = λW. At 200 items per second with a 0.5 s budget, a capacity near 100 is the most you should allow. Anything bigger only adds waiting.`,
  `Shutdown is part of the design. A consumer blocked on <code>wait(full)</code> will sleep forever unless the producer signals it, or sends a "poison pill", or closes the queue. Decide that before the first version ships.`
 ],
 common:[
  {t:'An unbounded queue hides overload', tab:'Unbounded queue', sim:'c3_queue',
   ex:`Java <code>LinkedBlockingQueue()</code> created with no capacity, Python <code>queue.Queue()</code> with no <code>maxsize</code>, and thread pools built on an unbounded queue (<code>Executors.newFixedThreadPool</code> uses one). Everything looks fine in staging, and the queue grows only when production traffic exceeds the consumer rate.`,
   why:`An unbounded queue accepts every item. Overload turns into a growing queue, which turns into latency and then into memory, and the producer never feels any of it.`,
   fix:[`Give every queue a capacity, and choose what happens when it is full: block the producer, drop the newest item, or reject with an error the caller sees.`,
        `Alert on queue length and on the age of the oldest item, not only on error rates. The age is the number users feel.`,
        `Check the capacity against Little's law: capacity is about throughput times the latency you can afford.`]},
  {t:'A permit that is never released', tab:'Permit leaked on error', sim:'c3_leak',
   ex:`A connection pool built on a semaphore with 3 permits. A request takes a permit, then fails inside the handler, and the code path that releases it is skipped by the exception. Each failure removes one permit for good. Python <code>asyncio.Semaphore</code> used without <code>async with</code> behaves the same way.`,
   why:`Acquire and release are two separate calls, and nothing ties them together when the code leaves early. Each leaked permit makes the pool smaller, until the pool is empty and every new request waits for ever.`,
   fix:[`Use the scoped form of the call: <code>try/finally</code> in Java, <code>defer</code> in Go, <code>with</code> or <code>async with</code> in Python. The release then runs on every path.`,
        `Give waiting requests a timeout, so the pool reports "no connection" as an error instead of hanging.`,
        `Expose the number of free permits as a metric. A count that only goes down is the signature of this bug.`]},
  {t:'Wait order causes a deadlock', tab:'Wait order deadlock', sim:'c3_order',
   ex:`The textbook trap: the producer takes the mutex, then waits for an empty slot. The consumer needs the mutex to free a slot. Real code hits the same shape when a worker holds a pool lock while it waits for a free connection, and the only thing that frees a connection needs that same lock.`,
   why:`The producer holds the mutex while it sleeps on <code>empty</code>. Nobody can take the mutex to make a slot free, so both sides wait for each other forever.`,
   fix:[`Always wait on the counting semaphore first, and take the mutex second, and release the mutex before you signal.`,
        `Keep the locked section to the data change only. Never block on another resource while holding a mutex.`,
        `Write the wait order down as a rule for the team, and check it in review, since no compiler will catch it.`]},
  {t:'Readers keep starving the writer', tab:'Readers starve a writer', sim:'c3_rw',
   ex:`A cache protected by a read-write lock. Reads arrive all the time and overlap, so there is never a moment with zero readers. Java's default <code>ReentrantReadWriteLock</code> can starve writers this way. In Go, a waiting writer blocks new readers, and a goroutine that takes a read lock twice (recursively) while a writer waits can deadlock itself.`,
   why:`A writer can get in only when no reader is inside. With overlapping readers, that moment never comes, so the writer waits for ever, even though it arrived first.`,
   fix:[`Use writer preference: once a writer is waiting, new readers queue behind it. The Go <code>RWMutex</code> does this, which is also why recursive read locking is forbidden.`,
        `Use a fair lock when writes must not wait long (<code>new ReentrantReadWriteLock(true)</code>), and keep read sections short.`,
        `Ask whether you need a read-write lock at all. For short reads, a plain mutex or a copy-on-write snapshot is often faster and cannot starve.`]}
 ],
 pg:'c3'},

{ask:`A consumer waits until the queue is not empty, then takes an item. Why must the check sit in a while loop and not an if, and why must the check and the wait be one locked step?`,
 scene:[
  `Three consumer threads wait for jobs from one queue. A producer adds a job and signals. One consumer wakes up, but a fourth thread that never waited takes the job first, because it arrived while the woken thread was still on its way to the lock. The woken consumer then takes from an empty queue and crashes with <code>NoSuchElementException</code>, about once a week.`,
  `The code looked right. The check ran once, before the wait, and nobody checked again after the wait. Waking up was treated as proof that the job was still there. It is only a hint that it might be.`
 ],
 build:[
  {t:'Attempt 1: check once, then wait', body:`<code>if (queue.isEmpty()) cv.wait(); take();</code>. With one producer and one consumer, the producer signals only when it adds, so this works in every test. With two consumers, a signal wakes one of them, and the other one may take the item first. Now the woken thread's "the queue is not empty" is no longer true.`},
  {t:'Attempt 2: a while loop around the wait', body:`<code>while (queue.isEmpty()) cv.wait(); take();</code>. Each wake-up re-checks the condition, and goes back to sleep if it is still false. This also covers <b>spurious wake-ups</b>: POSIX allows <code>pthread_cond_wait</code> to return with no signal at all. A wake-up is a hint that something <i>may</i> have changed, so the condition has to be tested again every time.`},
  {t:'Attempt 3: check and wait must be one locked step', body:`Now split the check from the wait: <code>lock; empty = queue.isEmpty(); unlock; lock; cv.wait(); ...</code>. A producer can add an item and signal between the two locked regions. The signal finds nobody waiting, and a signal with no waiter is <b>lost</b>. The consumer then sleeps on an item that is already there. The rule: test the condition while holding the lock, and release the lock only inside <code>wait</code>, which releases it and goes to sleep in one atomic step.`},
  {t:'Attempt 4: one condition variable for two kinds of waiter', body:`Consumers and producers share one <code>cv</code>. A <code>notify</code> wakes whichever thread is first in the queue, and that may be a producer that is still blocked on "full" when the buffer has just become "not full" for someone else. The fix is to give each condition its own variable (<code>notEmpty</code>, <code>notFull</code>). The shortcut <code>notifyAll</code> also works, but it wakes everyone on every change, which is its own problem (see the common problems).`}
 ],
 idea:[
  `A <b>monitor</b> is a lock plus the data it protects, plus one or more <b>condition variables</b> for waiting on the state of that data. Java's <code>synchronized</code> and <code>Condition</code>, C's <code>pthread_mutex</code> with <code>pthread_cond</code>, Go's <code>sync.Mutex</code> with <code>sync.Cond</code>, and Python's <code>threading.Condition</code> all follow this model.`,
  `<code>wait</code> does three things as one atomic step: it releases the lock, it puts the thread to sleep, and when it wakes it re-acquires the lock before it returns. Being atomic is what prevents the lost wake-up in attempt 3.`,
  `A <code>signal</code> or <code>notify</code> does not hand the lock over. Most libraries use <b>Mesa semantics</b>: the signalled thread becomes runnable, and must compete for the lock again. The textbook <b>Hoare semantics</b> (the signaller yields the lock straight to the waiter) is rarely implemented. That is why the loop is required.`,
  `A condition variable has no memory. A <code>notify</code> with nobody waiting is dropped. Compare this with a semaphore (chapter 6), whose <code>signal</code> is kept in the counter. Condition variables are for "wait until this predicate is true", and the predicate itself must live in shared state protected by the lock.`,
  `Use the loop form every time: <code>while (!predicate) wait();</code>. Choose <code>signal</code> when exactly one waiter can make progress, and <code>notifyAll</code> when the change may let any of several different kinds of waiter go on. Separate conditions let you use <code>signal</code> more often, which is cheaper.`,
  `Never call <code>wait</code> while holding a second lock. <code>wait</code> releases only the monitor's own lock, so anything you still hold stays locked during the whole sleep.`
 ],
 common:[
  {t:'An if where the loop should be', tab:'if instead of while', sim:'c4_spurious',
   ex:`Java <code>if (queue.isEmpty()) lock.wait()</code>, C <code>pthread_cond_wait</code> inside an if, Go <code>sync.Cond.Wait()</code> outside a loop. POSIX explicitly allows spurious wake-ups, so this fails even with a single producer, and only under a particular timing.`,
   why:`A wake-up only means "something may have changed". The if treats it as proof that the condition holds. A spurious wake-up, a stolen item, or a second signal all break that assumption.`,
   fix:[`Put every wait in a <code>while</code> loop that tests the predicate again each time the thread wakes.`,
        `Keep the predicate in shared state that only the lock protects (for example, the queue length), so the test is meaningful.`,
        `Code review rule: any <code>wait</code> that is not inside a <code>while</code> is a bug until shown otherwise.`]},
  {t:'A signal sent before the waiter waits', tab:'Lost signal', sim:'c4_lost',
   ex:`A consumer checks the queue under the lock, releases the lock, and then re-acquires it to call <code>wait()</code>. The producer adds an item and signals in the gap. The signal finds no waiter, and the consumer sleeps on a queue that is no longer empty.`,
   why:`Between the check and the wait the lock was released, so the producer ran. Condition variables do not remember a signal, so the wake-up was lost.`,
   fix:[`Check the predicate and call <code>wait</code> inside the same locked region. <code>wait</code> releases the lock atomically.`,
        `In the loop form (<code>while (empty) wait()</code>), the check happens just before the sleep, so a signal that already happened is seen by the check.`,
        `Diagnose a hang like this with a thread dump: the consumer is in <code>wait</code> while the queue length metric is non-zero.`]},
  {t:'notifyAll wakes everyone', tab:'notifyAll storm', sim:'c4_herd',
   ex:`A bounded buffer shared by 200 producers and 200 consumers, all waiting on one monitor. Each <code>notifyAll()</code> wakes all 400 threads. Almost all of them find the condition false, and go back to sleep. CPU use climbs while throughput does not.`,
   why:`A single item changed the state, but <code>notifyAll</code> wakes every waiter, including the ones that cannot act. This is the thundering herd: most wake-ups are wasted, and each one takes the lock once more.`,
   fix:[`Use separate conditions (<code>notEmpty</code>, <code>notFull</code>) and <code>signal</code> the one that can now make progress.`,
        `Use <code>notifyAll</code> only when the state change may satisfy any waiter, for example when a shutdown flag is set.`,
        `Measure wake-ups per item. More than one wasted wake-up per item means the conditions are mixed up.`]},
  {t:'Waiting while holding another lock', tab:'Nested monitor lockout', sim:'c4_nested',
   ex:`A method holds lock A and then waits on condition B, which belongs to another object. <code>wait</code> releases only B. Another thread needs lock A to change the state that B is waiting for, so it can never get there. Java's <code>synchronized</code> blocks nested this way, and Go code that waits on a <code>sync.Cond</code> while holding another mutex, both hang.`,
   why:`<code>wait</code> releases the monitor's own lock and nothing else. Any outer lock stays held during the sleep, and whoever would wake the waiter is blocked by it.`,
   fix:[`Release the outer lock before waiting. Re-acquire it after the wake-up if you still need it.`,
        `Keep waits and locks in one place: wait only in the monitor that owns the condition, with no other locks held.`,
        `When you must nest, decide one global lock order and check it, the same rule as chapter 8.`]}
 ],
 pg:'c4'},

{ask:`Thread A holds lock 1 and waits for lock 2. Thread B holds lock 2 and waits for lock 1. How does the system get stuck, and how do you make it impossible?`,
 scene:[
  `The bank service has <code>transfer(from, to)</code>, which locks both accounts. At 9:00 two customers send money to each other at the same moment. Each thread locks its own "from" account, then waits for the other one.`,
  `Both requests hang. The health check still passes because the process is alive, and the customers see a spinner for ever.`
 ],
 idea:[
  `A deadlock needs four things at the same time: mutual exclusion, hold-and-wait, no forced release, and a circular wait. Removing any one of them makes deadlock impossible.`,
  `Draw it as a graph. A lock points at the thread that holds it. A thread points at the lock it waits for. A loop in this graph is a deadlock.`,
  `<b>Lock ordering</b> is the simplest prevention. Every thread takes locks in one global order, for example lowest account number first. If everyone climbs the same ladder, no loop can form.`,
  `Timeouts and try-lock with back-off get you out of a deadlock that has already happened. They do not stop it from happening.`,
  `<b>Priority inversion</b> is a close cousin: a low-priority thread holds a lock that a high-priority thread needs, and medium-priority work keeps the low-priority thread from running.`
 ],
 common:[
  {t:'Two transfers that lock in opposite order',ex:`<code>transfer(a, b)</code> and <code>transfer(b, a)</code> run at the same time. Two database transactions that update the same two rows in opposite order are the same bug; PostgreSQL reports <code>deadlock detected</code> and aborts one of them.`,why:`Each side holds the lock the other needs, and nothing forces a common order.`,fix:`Sort the lock keys (lowest account ID first) in one helper that every transfer uses.`},
  {t:'Calling out while holding a lock',ex:`An event bus calls its listeners inside a <code>synchronized</code> block. A listener calls back into the bus and needs the same lock, or waits for a thread that does.`,why:`The code you call may take locks you do not know about, so the order is out of your control.`,fix:`Copy what you need while holding the lock, release it, and only then call the listeners.`},
  {t:'Self-deadlock with a non-reentrant lock',ex:`Go's <code>sync.Mutex</code> is not reentrant. A method locks it and then calls another method that locks the same mutex, so the goroutine waits for itself. Java's <code>synchronized</code> does allow this.`,why:`The second lock call has no way to know that the same owner already holds the lock.`,fix:`Split the method into a public version that takes the lock and an internal version that expects it to be held.`},
  {t:'A thread pool waiting on itself',ex:`Tasks running in a bounded pool wait for sub-tasks queued in the same pool. Every worker is waiting, and none is free to run the sub-tasks.`,why:`Waiting occupies a worker, so the pool runs out of workers that could make progress.`,fix:`Give parent and child tasks separate pools, or make the parent asynchronous so it does not hold a worker while it waits.`}
 ],
 pg:'c5'},

{ask:`Two actors each own one account. How do you move money between them so that a lost message can never make money vanish?`,
 scene:[
  `Each account is an actor with a private balance and a mailbox, so no locks are needed inside one account. A transfer is two messages: "debit 10" to account A, then "credit 10" to account B.`,
  `Under load the network drops the second message. A has already debited, B never credits, and $10 is gone. No thread crashed and no error was logged.`
 ],
 idea:[
  `An actor keeps private state and a mailbox, and handles one message at a time. That removes data races inside the actor, so the actor needs no locks.`,
  `Work that spans two actors is different. No single lock covers both accounts, so the transfer has to survive a message that is lost between its two steps.`,
  `Keep a <b>pending</b> record: A does not forget the debit until B has confirmed the credit.`,
  `Give every transfer an ID. B remembers which IDs it has already applied, so a retried message does not add the money twice. Retrying with the same ID is safe.`
 ],
 common:[
  {t:'A goroutine blocked on a channel nobody reads',ex:`A goroutine sends its reply on a channel after the caller has timed out and gone away. The send blocks for ever. Thousands pile up, and <code>runtime.NumGoroutine()</code> keeps growing.`,why:`A send waits for a receiver, and the receiver has left.`,fix:`Use a buffered reply channel of size 1, or <code>select</code> on <code>ctx.Done()</code> so the sender can give up.`},
  {t:'An unbounded mailbox hides overload',ex:`Akka's default mailbox is unbounded. An actor that receives faster than it handles grows its memory until the JVM runs out of heap.`,why:`An asynchronous send never waits, so the sender never feels the overload.`,fix:`Use a bounded mailbox with a rejection policy, or add back-pressure, where the sender waits for a credit or an ack.`},
  {t:'Sharing again through a pointer',ex:`In Go, sending a pointer or a slice through a channel and then using it on both sides is the same data race you were trying to avoid. "Share memory by communicating" only holds when the sender gives up ownership.`,why:`A message that carries a reference still shares the memory behind it.`,fix:`Send copies or immutable values, or hand over ownership and never touch the object after the send.`},
  {t:'Two actors waiting for each other',ex:`Actor A calls <code>ask</code> on B and waits for the reply, while B does the same to A. Both mailboxes stop moving.`,why:`Waiting for a reply inside a handler freezes the actor, so the reply sits behind the other actor's frozen handler.`,fix:`Do not block inside a handler. Send the request, and handle the reply as another message.`}
 ],
 pg:'c6'},

{ask:`A report adds up all balances while a transfer is half done, and comes out $10 short. How do transactions stop a reader from seeing a state that never existed?`,
 scene:[
  `At month end a report sums all balances while transfers keep running. A transfer debits account A, and credits account B a moment later. The report reads A after the debit and B before the credit.`,
  `Every single read and write was correct. The mistake is that the report saw two halves of one transfer, so the total is $10 short.`
 ],
 idea:[
  `A <b>transaction</b> is a group of reads and writes that should look like one step. <b>Isolation</b> decides what other transactions may see of it while it is running.`,
  `Two operations <b>conflict</b> if they touch the same item and at least one of them writes. A schedule is <b>serialisable</b> if its result equals some one-after-another order of the transactions.`,
  `<b>Two-phase locking (2PL)</b> works in two phases. First a transaction takes locks as it needs them. Then it releases none until it commits. That forces a serialisable order.`,
  `The price is waiting: readers block on writers, and writers block on readers. Weaker levels, such as snapshot isolation, run faster but allow some anomalies.`,
  `Optimistic and timestamp methods reach the same goal without waiting. They let transactions run, then abort and retry any one that would break the order.`
 ],
 common:[
  {t:'Write skew under snapshot isolation',ex:`Two doctors each check "at least one doctor is on call", see two, and both go off call. PostgreSQL's <code>REPEATABLE READ</code> (snapshot isolation) allows this; <code>SERIALIZABLE</code> aborts one of them.`,why:`Both transactions read the same snapshot and write different rows, so neither sees a conflict.`,fix:`Use <code>SERIALIZABLE</code> for rules like this, or make both transactions write one shared row so they collide.`},
  {t:'Check then insert without a unique constraint',ex:`"If no booking exists for this seat, insert one" in application code: two requests both pass the check and double-book the seat. The same happens with "if balance &gt;= amount, subtract".`,why:`The check and the write are two steps, and nothing ties them together in the database.`,fix:`Let the database enforce it with a unique constraint, or with a conditional update such as <code>UPDATE ... WHERE balance &gt;= ?</code>.`},
  {t:'Serialization failures need a retry',ex:`PostgreSQL error 40001 (<code>could not serialize access</code>) is normal at high isolation. Applications that do not retry show random 500 errors, and retrying with no back-off causes a retry storm.`,why:`The database aborts a transaction to keep the order safe, so the application must run it again.`,fix:`Retry the whole transaction, not one statement, with a short random back-off and a limited number of attempts.`},
  {t:'Long transactions hold locks',ex:`A transaction left open while it calls an external API, or an ORM session that spans a whole web request, blocks writers. In PostgreSQL it also stops vacuum from cleaning old row versions.`,why:`Locks and old snapshots stay alive until commit.`,fix:`Keep transactions short: make the network call first, then open the transaction, write, and commit.`}
 ],
 pg:'c7'},

{ask:`The power fails halfway through a transfer. After reboot, what does the disk say, and how does the database decide what to keep?`,
 scene:[
  `A transfer changes account A on disk, and then the machine loses power before account B is changed. After reboot, A has lost $10 and B never received it. The disk now holds a state that nobody ever chose.`,
  `The fix is an old idea: write down what you are about to do, make that record durable, and only then touch the data. Recovery reads the record. A transfer with a commit record is finished. One without it is undone.`
 ],
 idea:[
  `<b>Write-ahead logging (WAL)</b>: before any data page changes, append the old and new values to a log and flush it to disk. When the transaction is done, append a <code>COMMIT</code> and flush again.`,
  `The data pages can be written later, in any order, because the log holds everything needed to finish the work or undo it.`,
  `<b>Recovery</b> reads the log. If the <code>COMMIT</code> is there, it redoes the changes. If not, it undoes whatever reached the data pages. Either way the transfer ends up done fully or not at all.`,
  `This only works if the disk really persists the flush (<code>fsync</code>). If the disk lies about it, no algorithm can save the data.`,
  `<b>Lock-free code</b> uses <b>compare-and-swap</b>: change a value only if it still holds the value you read, and retry otherwise. No thread blocks, but under heavy contention the retry loop burns CPU.`
 ],
 common:[

<script>
PG.f1 = function (root, A) {
  const { h, rng, bar, btn, badge, note, seg, slider, player, stat } = A;

  /* ---------- (a) latency ladder ---------- */
  const LAD = [
    ['Register', 0.3], ['L1 cache', 1], ['L2 cache', 4], ['L3 cache', 15], ['RAM', 100],
    ['SSD read', 100000], ['Network, same data centre', 500000], ['Network, across a continent', 150000000]];
  const CYCLE = 0.3;                       // ns per CPU cycle: "1 cycle = 1 second"
  const fmtReal = ns => ns < 1000 ? +ns.toFixed(1) + ' ns' : ns < 1e6 ? +(ns / 1e3).toFixed(0) + ' µs' : +(ns / 1e6).toFixed(0) + ' ms';
  const fmtHuman = ns => {
    const s = ns / CYCLE;
    const u = (x, w) => { const n = Math.round(x); return n + ' ' + w + (n === 1 ? '' : 's'); };
    if (s < 60) return u(s, 'second');
    if (s < 3600) return u(s / 60, 'minute');
    if (s < 86400) return u(s / 3600, 'hour');
    if (s < 86400 * 365) return u(s / 86400, 'day');
    return u(s / 86400 / 365, 'year');
  };
  let humanScale = false;
  const ladder = h('div', { class: 'f1-lad' });
  const ladNote = h('div', { class: 'out' });
  function paintLadder() {
    const lo = Math.log10(0.3), hi = Math.log10(150000000);
    ladder.replaceChildren(...LAD.map(([name, ns]) => {
      const w = 4 + 96 * (Math.log10(ns) - lo) / (hi - lo);
      return h('div', { class: 'f1-lr' }, h('span', { class: 'f1-ln' }, name),
        h('span', { class: 'f1-lt' }, h('i', { style: 'width:' + w.toFixed(1) + '%' })),
        h('b', { class: 'f1-lv' }, humanScale ? fmtHuman(ns) : fmtReal(ns)));
    }));
    ladNote.textContent = humanScale
      ? 'Scaled so that one CPU cycle takes one second: a RAM read is a 6-minute wait, an SSD read about 4 days, and one packet across a continent about 16 years. A CPU that waits for data does nothing for all that time.'
      : 'Real times on a log scale. Each step down the list is roughly 10 to 1000 times slower than the one above it.';
  }
  const scaleSeg = seg([{ v: false, l: 'Real time' }, { v: true, l: 'If 1 cycle = 1 second' }], false, v => { humanScale = v; paintLadder(); });

  /* ---------- (b) cache simulation ---------- */
  const N = 256, PER = 16, LINES = N / PER, ACC = 256;       // 256 ints, 16 ints (64 bytes) per cache line, 16 lines
  const HIT = 1, MISS = 100;                                 // ns
  const PATTERNS = [
    { v: 'seq', l: 'Row-major (sequential)' },
    { v: 'col', l: 'Column-major (stride 16)' },
    { v: 'rnd', l: 'Random' }];
  let pat = 'col', cacheLines = 4, seed = 5, order = [], pos = 0, cache = [], hits = 0, misses = 0, last = null;
  function makeOrder() {
    const r = rng(seed), o = [];
    for (let i = 0; i < ACC; i++) {
      if (pat === 'seq') o.push(i % N);
      else if (pat === 'col') { const row = i % 16, col = Math.floor(i / 16) % 16; o.push(row * 16 + col); }   // walks down a column of a 16x16 matrix
      else o.push(Math.floor(r() * N));
    }
    return o;
  }
  function resetSim() { order = makeOrder(); pos = 0; cache = []; hits = 0; misses = 0; last = null; }
  function access() {
    if (pos >= order.length) return false;
    const idx = order[pos++], line = Math.floor(idx / PER), at = cache.indexOf(line);
    if (at >= 0) { hits++; cache.splice(at, 1); cache.push(line); last = { idx, line, hit: true }; }
    else { misses++; cache.push(line); if (cache.length > cacheLines) cache.shift(); last = { idx, line, hit: false }; }
    return pos < order.length;
  }
  const grid = h('div', { class: 'f1-grid', role: 'img', 'aria-label': 'Array of 256 integers split into 16 cache lines of 16 integers' });
  const cells = [], lineTags = [];
  for (let l = 0; l < LINES; l++) {
    const row = h('div', { class: 'f1-row' });
    const tag = h('span', { class: 'f1-tag' }, 'line ' + l); lineTags.push(tag); row.append(tag);
    const box = h('span', { class: 'f1-cells' });
    for (let k = 0; k < PER; k++) { const c = h('i', {}); cells.push(c); box.append(c); }
    row.append(box); grid.append(row);
  }
  const tiles = stat([]);
  const verdict = h('div', { class: 'out' });
  function paintCache() {
    cells.forEach(c => { c.className = ''; });
    lineTags.forEach((t, l) => { t.className = 'f1-tag' + (cache.includes(l) ? ' in' : ''); });
    for (let l = 0; l < LINES; l++) for (let k = 0; k < PER; k++) if (cache.includes(l)) cells[l * PER + k].className = 'in';
    if (last) cells[last.idx].className = last.hit ? 'hit' : 'miss';
    const total = hits + misses, rate = total ? hits / total : 0, ns = hits * HIT + misses * MISS, ideal = total * HIT;
    tiles.update([
      { l: 'Reads done', v: total + ' / ' + ACC },
      { l: 'Cache hits', v: hits, cls: 'ok' },
      { l: 'Misses', v: misses, cls: misses ? 'bad' : '' },
      { l: 'Hit rate', v: total ? Math.round(rate * 100) + '%' : '–' },
      { l: 'Time', v: ns >= 1000 ? +(ns / 1000).toFixed(1) + ' µs' : ns + ' ns' }]);
    verdict.replaceChildren();
    if (!total) verdict.append('Press Play or Step. Each cell is one int; a row of 16 is one 64-byte cache line. Blue rows are in the cache.');
    else {
      const last2 = last ? (last.hit ? 'Read of cell ' + last.idx + ': hit (line ' + last.line + ' is already in cache, ~1 ns).' : 'Read of cell ' + last.idx + ': MISS, line ' + last.line + ' is fetched from RAM (~100 ns).') : '';
      verdict.append(h('div', {}, last2));
      if (pos >= ACC) verdict.append(h('div', { style: 'margin-top:6px' }, badge(ns / ideal < 2 ? 'close to ideal' : Math.round(ns / ideal) + '× slower than all hits', ns / ideal < 2 ? 'ok' : 'bad'), ' ',
        pat === 'col' ? 'Walking down a column touches a new line on every read, and 16 lines do not fit in the cache.' : pat === 'seq' ? 'One miss brings in 16 ints, so the next 15 reads are free.' : 'Random reads reuse a line only by luck.'));
    }
  }
  const sim = player({ speed: 45, step: () => { const more = access(); paintCache(); return more; }, reset: () => { resetSim(); paintCache(); } });
  const runAll = btn('Run all', () => { sim.stop(); while (access()); paintCache(); });
  const patSeg = seg(PATTERNS, pat, v => { pat = v; sim.stop(); resetSim(); paintCache(); });
  const cacheSl = slider('Cache size', 1, 16, cacheLines, 1, v => { cacheLines = v; sim.stop(); resetSim(); paintCache(); }, v => v + (v === 1 ? ' line' : ' lines'));
  const seedBtn = btn('New seed', () => { seed += 7; sim.stop(); resetSim(); paintCache(); });

  paintLadder(); resetSim(); paintCache();
  root.append(h('div', { class: 'pgbox' },
    note('Try this: with a cache of 4 lines, run Row-major, then Column-major. Same 256 reads of the same array, but column-major is about 15 times slower. Then raise the cache to 16 lines and watch column-major recover.'),
    h('b', { class: 'f1-h' }, 'A. What each step costs'),
    bar(scaleSeg), ladder, ladNote,
    h('b', { class: 'f1-h' }, 'B. A tiny cache scanning a 16 × 16 array of ints'),
    bar(h('span', { class: 'mut' }, 'Loop order:'), patSeg),
    bar(cacheSl, seedBtn),
    h('div', { class: 'f1-sim' }, grid, h('div', { class: 'f1-side' }, tiles, verdict)),
    bar(sim, runAll),
    h('div', { class: 'f1-key' }, h('i', { class: 'in' }), 'in cache', h('i', { class: 'hit' }), 'hit', h('i', { class: 'miss' }), 'miss (fetch from RAM)')));
};

PG.f2 = function (root, A) {
  const { h, svg, bar, btn, badge, note, seg, slider, player, logbox, stat } = A;
  const U = 10;                                                    // 1 ms = 10 integer units, keeps the maths exact
  const col = id => 'var(--t' + (id % 8) + ')';

  /* =========== (a) memory map: threads share the heap, a forked process gets a copy =========== */
  let procs, pages, nextPid, nextTid, nextPage;
  const log = logbox();
  const mem = h('div', { class: 'f2-mem' });
  function resetMem() {
    pages = { 1: { value: 0, owners: ['A'] } }; nextPage = 2; nextTid = 2; nextPid = 1;
    procs = [{ id: 'A', page: 1, threads: [{ id: 1, name: 'main' }] }];
    log.clear(); log.add('Process A starts with one thread (T1) and x = 0 on its heap.', 'mut'); paintMem();
  }
  const procBy = id => procs.find(p => p.id === id);
  function startThread(pid) {
    const p = procBy(pid); if (p.threads.length >= 3) return;
    const t = { id: nextTid++, name: 'worker()' }; p.threads.push(t);
    log.add('Process ' + pid + ' starts thread T' + t.id + ': a new stack, but the SAME heap (x is shared).');
    paintMem();
  }
  function fork(pid) {
    if (procs.length >= 3) return;
    const p = procBy(pid), id = String.fromCharCode(65 + procs.length);
    const pg = pages[p.page]; pg.owners.push(id);
    procs.push({ id, page: p.page, threads: [{ id: nextTid++, name: 'main (copy)' }] });
    log.add('fork(): process ' + id + ' is created as a copy of ' + pid + '. Only the calling thread is copied. The page holding x is now shared copy-on-write.');
    paintMem();
  }
  function write(pid, t) {
    const p = procBy(pid), v = 7 * t.id; let pg = pages[p.page];
    if (pg.owners.length > 1) {
      const np = nextPage++; pages[np] = { value: pg.value, owners: [pid] };
      pg.owners = pg.owners.filter(o => o !== pid); p.page = np; pg = pages[np];
      log.add('T' + t.id + ' writes x: page fault, the OS copies the page for process ' + pid + ' first (copy-on-write).', 'bad');
    }
    pg.value = v; log.add('T' + t.id + ' (process ' + pid + ') writes x = ' + v + '.');
    paintMem();
  }
  function paintMem() {
    mem.replaceChildren(...procs.map(p => {
      const pg = pages[p.page], shared = pg.owners.length > 1;
      return h('div', { class: 'f2-proc' },
        h('div', { class: 'f2-ph' }, h('b', {}, 'Process ' + p.id), h('span', { class: 'mut' }, 'own address space')),
        h('div', { class: 'f2-heap' + (shared ? ' cow' : '') },
          h('div', { class: 'f2-hl' }, 'heap'),
          h('div', { class: 'f2-x' }, 'x = ', h('b', {}, pg.value)),
          h('div', { class: 'f2-pg' }, 'page #' + p.page + (shared ? ' · shared with ' + pg.owners.filter(o => o !== p.id).join(', ') + ' (copy-on-write)' : ' · private'))),
        h('div', { class: 'f2-ths' }, p.threads.map(t => h('div', { class: 'f2-th' },
          h('div', { class: 'f2-tn' }, h('b', {}, 'T' + t.id), h('span', { class: 'mut' }, 'own stack')),
          h('div', { class: 'f2-stack' }, h('div', {}, t.name), h('div', { class: 'mut' }, 'locals…')),
          h('div', { class: 'f2-see' }, 'sees x = ', h('b', {}, pg.value)),
          btn('write x = ' + 7 * t.id, () => write(p.id, t))))),
        bar(
          Object.assign(btn('+ start thread in ' + p.id, () => startThread(p.id)), { disabled: p.threads.length >= 3 }),
          Object.assign(btn('fork() from ' + p.id, () => fork(p.id)), { disabled: procs.length >= 3 })));
    }));
  }

  /* =========== shared: pure simulations + Gantt drawing =========== */
  function simulate(cores, nth, slice, swc, mode) {                // (b) round-robin scheduler
    const ths = [];
    for (let i = 0; i < nth; i++) {
      const prog = mode === 'cpu' ? [[20 * U]] : Array.from({ length: 10 }, () => [2 * U, 18 * U]);
      ths.push({ id: i, prog, pi: 0, rem: prog[0][0], at: 0, done: false });
    }
    const cs = Array.from({ length: cores }, () => ({ free: 0, last: -1 }));
    const segs = [];
    let guard = 0;
    for (;;) {
      if (++guard > 20000) break;
      let best = null;
      cs.forEach((c, ci) => ths.forEach(t => {
        if (t.done) return;
        const start = Math.max(t.at, c.free), same = c.last === t.id ? 0 : 1;
        if (!best || start < best.start || (start === best.start && (t.at < best.t.at || (t.at === best.t.at && same < best.same)))) best = { c, ci, t, start, same };   // round robin: longest-waiting thread first, then keep the core it last used
      }));
      if (!best) break;
      const { c, ci, t } = best; let st = best.start;
      const sw = c.last !== -1 && c.last !== t.id ? Math.round(swc * U) : 0;
      if (sw) { segs.push({ core: ci, t0: st, t1: st + sw, type: 'sw' }); st += sw; }
      const run = Math.min(Math.round(slice * U), t.rem);
      segs.push({ core: ci, t0: st, t1: st + run, type: 'run', tid: t.id });
      const end = st + run; t.rem -= run; c.free = end; c.last = t.id;
      if (t.rem > 0) t.at = end;
      else { const wait = t.prog[t.pi][1]; t.pi++; if (t.pi < t.prog.length) { t.rem = t.prog[t.pi][0]; t.at = end + (wait || 0); } else t.done = true; }
    }
    const finish = segs.reduce((m, s) => Math.max(m, s.t1), 0);
    const run = segs.filter(s => s.type === 'run').reduce((a, s) => a + s.t1 - s.t0, 0), sw = segs.filter(s => s.type === 'sw').reduce((a, s) => a + s.t1 - s.t0, 0);
    const work = nth * 20 * U, chain = mode === 'cpu' ? 20 * U : 20 * U + 9 * 18 * U;
    return { segs, finish, run, sw, ideal: Math.max(work / cores, chain), cores };
  }
  const TASKS = 8, WORK = 10 * U, GSLICE = 5 * U, GSW = 3;         // (c) 8 tasks x 10 ms, 5 ms GIL switch interval, 0.3 ms hand-over
  function par(mode, cores, gil) {                                 // returns {segs, finish, ncores, idleCores}
    const segs = []; let ncores = cores;
    if (mode === 'seq' || mode === 'conc' || (mode === 'par' && gil)) {
      const spread = mode === 'par' && gil, nc = spread ? cores : 1; ncores = nc;
      if (mode === 'seq') { for (let i = 0; i < TASKS; i++) segs.push({ core: 0, t0: i * WORK, t1: (i + 1) * WORK, type: 'run', tid: i }); }
      else {                                                       // round-robin slices, one at a time (one CPU, or the GIL)
        const rem = Array(TASKS).fill(WORK); let t = 0, last = -1;
        while (rem.some(r => r > 0)) for (let i = 0; i < TASKS; i++) if (rem[i] > 0) {

/* f3 · Asynchronous programming: I/O-bound work, blocking vs event loop, callbacks vs coroutines */
const F3 = (() => {
  /* ---- panel 1: N tasks (compute then wait) on W worker threads and C cores ---- */
  function ioSim(p, C, W, N) {
    N = N || 24; const c = 100 * p, w = 100 * (1 - p);
    const free = new Array(C).fill(0), segs = [], waits = [];
    const act = []; let next = 0;
    for (let i = 0; i < Math.min(W, N); i++) act.push({ t: 0, task: next++ });
    let wall = 0;
    while (act.length) {
      let bi = 0; for (let i = 1; i < act.length; i++) if (act[i].t < act[bi].t) bi = i;
      const a = act[bi]; let ci = 0; for (let i = 1; i < C; i++) if (free[i] < free[ci]) ci = i;
      const s = Math.max(a.t, free[ci]), e = s + c; free[ci] = e;
      segs.push({ core: ci, s, e, task: a.task }); waits.push({ s: e, e: e + w });
      const fin = e + w; wall = Math.max(wall, fin);
      if (next < N) { a.t = fin; a.task = next++; } else act.splice(bi, 1);
    }
    return { wall, segs, waits, busy: N * c, c, w };
  }
  const PRESETS = { api: { l: 'Call an API (10% compute)', p: 0.1 }, db: { l: 'Read a DB (30% compute)', p: 0.3 }, img: { l: 'Resize an image (90% compute)', p: 0.9 } };

  /* ---- panel 2: six requests, each compute 10 ms, wait I/O 100 ms, compute 10 ms ---- */
  const ARR = [0, 5, 10, 15, 20, 25], CPU = 10, IO = 100, BLOCK = 150, BLOCKED_REQ = 2;
  function server(model) {
    const R = ARR.map((a, i) => ({ i, arr: a, segs: [], end: 0 })), threads = [], jobs = [];
    if (model === 'blocking') {
      const th = { label: 'thread 1', segs: [] }; threads.push(th); let prev = 0;
      R.forEach(r => { const s = Math.max(r.arr, prev);
        if (s > r.arr) r.segs.push([r.arr, s, 'queue']);
        const seq = [[s, s + CPU, 'cpu'], [s + CPU, s + CPU + IO, 'wait'], [s + CPU + IO, s + 2 * CPU + IO, 'cpu']];

        const s = r.arr; [[s, s + CPU, 'cpu'], [s + CPU, s + CPU + IO, 'wait'], [s + CPU + IO, s + 2 * CPU + IO, 'cpu']].forEach(x => { r.segs.push(x); th.segs.push([x[0], x[1], x[2], r.i]); }); r.end = s + 2 * CPU + IO; });

    if (hist) {
      const e = 2 * ITERS, tot = 20; const good = hist[e] || 0;
      histBox.append(h('div', { class: 'pg1-hh' }, 'Final value over 20 random schedules (expected ' + e + '): ', badge(good + ' of 20 correct', good === 20 ? 'ok' : 'bad')));
      for (let v = 1; v <= e; v++) { const c = hist[v] || 0;
        histBox.append(h('div', { class: 'pg1-hr' }, h('span', { class: 'mono' }, 'count = ' + v), h('span', { class: 'pg1-track' }, h('i', { class: v === e ? 'good' : 'bad', style: 'width:' + (c / tot * 100) + '%' })), h('span', { class: 'mono' }, c))); }
    }
  }
  fresh(); render();
  root.append(h('div', { class: 'pgbox' },
    note('Try this: with No lock press Step A, Step B in an order where both load before either stores. Then switch to Mutex and try the same.'),
    bar(h('span', { class: 'mut' }, 'Protect count with:'), mx),
    view, bar(stepA, stepB, h('span', { class: 'mut' }, 'or let a random scheduler pick:'), stepper, seedBtn),
    info, bar(runBtn, h('span', { class: 'mut' }, 'seed ' + seed + ' · each thread runs count++ ' + ITERS + ' times')), histBox));

PG.c2 = function (root, A) {
  const { h, bar, btn, seg, player, stat, logbox, note } = A;
  // both threads run the same job: get the lock, enter, leave. The two versions differ only in how they get the lock.
  const PROG = {
    plain: [{ op: 'read', t: 'reads flag' }, { op: 'check', t: 'checks: is flag 0?' }, { op: 'set', t: 'sets flag = 1' }, { op: 'enter', t: 'enters critical section' }, { op: 'leave', t: 'sets flag = 0 and leaves' }],
    atomic: [{ op: 'tas', t: 'test-and-set(flag)' }, { op: 'enter', t: 'enters critical section' }, { op: 'leave', t: 'sets flag = 0 and leaves' }]
  };
  let mode = 'plain', S, t = 0;
  const lb = logbox();
  const cards = h('div', { class: 'cols two' });
  const st = stat([]);
  const msg = h('div', { class: 'out', 'aria-live': 'polite' });
  const fresh = () => { S = { flag: 0, inside: 0, max: 0, th: [0, 1].map(() => ({ pc: 0, reg: null, done: false })) }; t = 0; lb.clear(); };
  const prog = () => PROG[mode];
  function run(i) {                        // thread i executes its next instruction
    const th = S.th[i], ins = prog()[th.pc], nm = 'T' + (i + 1);
    let text;
    if (ins.op === 'read') { th.reg = S.flag; th.pc++; text = 'reads flag = ' + th.reg; }
    else if (ins.op === 'check') { if (th.reg === 0) { th.pc++; text = 'saw 0, so it goes on'; } else { th.pc = 0; text = 'saw 1, so it starts again'; } }
    else if (ins.op === 'set') { S.flag = 1; th.pc++; text = 'sets flag = 1'; }
    else if (ins.op === 'tas') { th.reg = S.flag; S.flag = 1; if (th.reg === 0) { th.pc++; text = 'got back 0: the lock is mine'; } else text = 'got back 1: the lock is taken, it tries again'; }
    else if (ins.op === 'enter') { S.inside++; S.max = Math.max(S.max, S.inside); th.pc++; text = 'enters the critical section'; }
    else { S.inside--; S.flag = 0; th.pc = 0; th.done = true; text = 'leaves and sets flag = 0'; }
    lb.add(nm + ' ' + text, S.max > 1 ? 'bad' : '');
  }
  function advance() {                     // one tick: the scheduler runs one live thread for one instruction
    const live = [0, 1].filter(i => !S.th[i].done);
    if (!live.length || t >= 40) return false;
    const i = live.length === 2 ? t % 2 : live[0];
    t++; run(i);
    return [0, 1].some(k => !S.th[k].done) && t < 40;
  }
  function redraw() {
    cards.replaceChildren(...[0, 1].map(i => {
      const th = S.th[i], ins = th.done ? null : prog()[th.pc];
      return h('div', { class: 'out' }, h('b', {}, 'Thread T' + (i + 1)), h('div', {}, ins ? ins.t : 'finished'), h('div', { class: 'note' }, 'register = ' + (th.reg == null ? '-' : th.reg)));
    }));
    st.update([{ l: 'flag', v: S.flag }, { l: 'inside now', v: S.inside, cls: S.inside > 1 ? 'bad' : 'ok' }, { l: 'most at once', v: S.max, cls: S.max > 1 ? 'bad' : 'ok' }]);
    msg.textContent = S.max > 1
      ? 'Both threads are inside at once. Both read flag = 0 before either wrote 1, so both passed the check. This is the race.'
      : mode === 'atomic'
        ? 'Test-and-set reads the old value and writes 1 in one indivisible step. The second thread gets back 1 and keeps waiting.'
        : 'Press Play and watch what happens when both threads read the flag before either one sets it.';
  }
  const pl = player({
    speed: 600,
    step() { const more = advance(); redraw(); return more; },
    reset() { fresh(); redraw(); }
  });
  pl.append(btn('Jump to end', () => { pl.stop(); while (advance()); redraw(); }));
  const modeSeg = seg([{ v: 'plain', l: 'Read, check, then set' }, { v: 'atomic', l: 'Test-and-set (atomic)' }], mode, v => { mode = v; pl.stop(); fresh(); redraw(); });
  fresh();
  root.append(
    bar(modeSeg), pl, cards, st, msg, lb.el,
    note('Illustrative: a simple scheduler alternates the two threads one instruction at a time. Real schedulers are less regular, which is why this bug is rare and shows up under load.')
  );
  redraw();
};

PG.c3 = function (root, A) {
  const { h, svg, bar, btn, seg, player, stat, note } = A;
  const CAP = 4, STEPS = 18;                 // buffer slots, and the number of ticks in one run
  let mode = 'open', S, t = 0;
  // the producer makes one item per tick; the consumer takes one item every third tick
  const fresh = () => { S = { items: [], made: 0, took: 0, blocked: 0 }; t = 0; };
  function advance() {
    if (t >= STEPS) return false;
    t++;
    if (mode === 'open' || S.items.length < CAP) S.items.push(S.made++);
    else S.blocked++;                        // empty semaphore is 0: the producer waits
    if (t % 3 === 0 && S.items.length) { S.items.shift(); S.took++; }
    return t < STEPS;
  }
  const board = h('div', { style: 'min-width:0' });
  const st = stat([]);
  const msg = h('div', { class: 'out', 'aria-live': 'polite' });
  function redraw() {
    const n = S.items.length, cells = Math.max(CAP, Math.min(n, 14));
    const s = svg('svg', { viewBox: '0 0 600 96', role: 'img', 'aria-label': 'Buffer holds ' + n + ' items at tick ' + t, style: 'width:100%;min-width:520px;height:auto;display:block' });
    for (let k = 0; k < cells; k++) {
      const x = 10 + k * 42, has = k < n, over = has && k >= CAP;
      s.append(svg('rect', { x, y: 22, width: 38, height: 44, rx: 7, fill: over ? 'var(--acc2)' : has ? 'var(--acc)' : 'var(--card)', stroke: over ? 'var(--acc2)' : 'var(--line)', 'stroke-width': 1.5, 'stroke-dasharray': has ? null : '4 3' }));
      if (has) s.append(svg('text', { x: x + 19, y: 49, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--card)' }, String(S.items[k])));
    }
    const cx = 10 + CAP * 42 - 2;
    s.append(svg('line', { x1: cx, y1: 12, x2: cx, y2: 74, stroke: 'var(--mut)', 'stroke-dasharray': '3 3' }));
    s.append(svg('text', { x: cx, y: 90, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--mut)' }, 'capacity ' + CAP));
    board.replaceChildren(h('div', { class: 'svgw' }, s));
    const bounded = mode === 'bounded';
    st.update([
      { l: 'in buffer', v: n, cls: n > CAP ? 'bad' : 'ok' },
      { l: 'empty slots', v: bounded ? CAP - n : '–' },
      { l: 'producer blocked', v: S.blocked },
      { l: 'consumed', v: S.took }
    ]);
    msg.textContent = bounded
      ? 'The producer waits on the empty semaphore when all 4 slots are full. Each take signals empty and wakes it, so the buffer never holds more than 4.'
      : 'Nothing stops the producer. It makes one item per tick and the consumer takes one every third tick, so the queue grows without limit. In a real service that is memory, until the process dies.';
  }
  const pl = player({
    speed: 450,
    step() { const more = advance(); redraw(); return more; },
    reset() { fresh(); redraw(); }
  });
  pl.append(btn('Jump to end', () => { pl.stop(); while (advance()); redraw(); }));
  const modeSeg = seg([{ v: 'open', l: 'Unbounded queue' }, { v: 'bounded', l: 'Bounded: empty and full semaphores' }], mode, v => { mode = v; pl.stop(); fresh(); redraw(); });
  fresh();
  root.append(
    bar(modeSeg), pl, board, st, msg,
    note('Illustrative: one tick is one step of the producer, and the consumer is three times slower. Press Play in the unbounded mode first, then switch to the bounded mode and jump to the end.')
  );
  redraw();
};

PG.c4 = function (root, A) {
  const { h, bar, btn, seg, player, note } = A;
  let mode = 'if', i = 0;
  // one scripted run of the same race. The only step that differs between the modes is the last one.
  const script = () => [
    { hold: '-', q: [], w: ['C1'], ready: [], s: 'C1 takes the lock, finds the queue empty, and calls wait(). Waiting releases the lock.' },
    { hold: '-', q: [], w: ['C1', 'C2'], ready: [], s: 'C2 does the same, so both consumers sleep on the condition.' },
    { hold: 'P', q: ['J1'], w: ['C2'], ready: ['C1'], s: 'The producer adds job J1 and signals. C1 wakes up, but it must take the lock back before wait() can return.' },
    { hold: 'N', q: [], w: ['C2'], ready: ['C1'], s: 'A newcomer thread N, which never waited, takes the lock first, sees J1 and takes it. The job is gone before C1 runs.' },
    mode === 'if'
      ? { hold: 'C1', q: [], w: ['C2'], ready: [], s: 'C1 gets the lock. Its check was an if, so it does not look again and takes from the empty queue.', err: 'ERROR: take from empty queue. C1 crashes.' }
      : { hold: 'C1', q: [], w: ['C1', 'C2'], ready: [], s: 'C1 gets the lock and re-tests in the while loop. The queue is empty, so it waits again. Nothing is lost.' }
  ];
  const panel = h('div', { class: 'cols two' });
  const errBox = h('div', { class: 'badge bad', style: 'justify-self:start' });
  const msg = h('div', { class: 'out', 'aria-live': 'polite' });
  const chips = (list, k) => list.length ? list.map(x => h('span', { class: 'badge ' + (k || '') }, x)) : [h('span', { class: 'note' }, 'none')];
  const cell = (title, body) => h('div', { class: 'out' }, h('b', {}, title), h('div', { style: 'margin-top:6px;display:flex;gap:6px;flex-wrap:wrap' }, body));
  function redraw() {
    const sc = script(), cur = i === 0 ? { hold: '-', q: [], w: [], ready: [], s: 'Nothing has run yet. Press Play.' } : sc[i - 1];
    panel.replaceChildren(
      cell('Job queue', chips(cur.q)),
      cell('Waiting on the condition', chips(cur.w, 'info')),
      cell('Woken, needs the lock', chips(cur.ready, 'warn')),
      cell('Lock holder', chips(cur.hold === '-' ? [] : [cur.hold], 'ok'))
    );
    msg.textContent = cur.s;
    errBox.textContent = i === sc.length && cur.err ? cur.err : '';
    errBox.style.display = errBox.textContent ? '' : 'none';
  }
  const pl = player({
    speed: 1100,
    step() { const n = script().length; if (i >= n) return false; i++; redraw(); return i < n; },
    reset() { i = 0; redraw(); }
  });
  pl.append(btn('Jump to end', () => { pl.stop(); i = script().length; redraw(); }));
  const modeSeg = seg([{ v: 'if', l: 'if (queue empty) wait()' }, { v: 'while', l: 'while (queue empty) wait()' }], mode, v => { mode = v; pl.stop(); i = 0; redraw(); });
  errBox.style.display = 'none';
  root.append(
    bar(modeSeg), pl, panel, errBox, msg,
    note('Illustrative: this run is scripted to show the timing of one bad interleaving. Real systems hit it rarely, which is why it survives code review.')
  );
  redraw();
};

PG.c5 = function (root, A) {
  const { h, svg, bar, btn, seg, player, stat, logbox, note } = A;
  let mode = 'free', S, t = 0;
  // T1 moves money A -> B and T2 moves money B -> A. Each needs both locks.
  const NEEDS = { free: [['A', 'B'], ['B', 'A']], ordered: [['A', 'B'], ['A', 'B']] };
  const POS = { T1: [125, 60], T2: [515, 60], A: [125, 160], B: [515, 160] };
  const lb = logbox();
  const fresh = () => { S = { owner: { A: null, B: null }, dead: false, th: NEEDS[mode].map((need, k) => ({ name: 'T' + (k + 1), need, held: [], pc: 0, state: 'run' })) }; t = 0; lb.clear(); };
  function run(th) {                       // th tries its next action: take a lock, transfer, or release everything
    if (th.pc < th.need.length) {
      const L = th.need[th.pc];
      if (S.owner[L] === null) { S.owner[L] = th.name; th.held.push(L); th.pc++; th.state = 'run'; return 'takes lock ' + L; }
      th.state = 'blocked';
      return 'waits for lock ' + L + ' (held by ' + S.owner[L] + ')';
    }
    if (th.pc === th.need.length) { th.pc++; th.state = 'run'; return 'transfers $10'; }
    th.held.forEach(L => { S.owner[L] = null; }); th.held = []; th.state = 'done';
    return 'releases its locks and finishes';
  }
  function advance() {                     // one tick: T1 acts, then T2 acts
    if (S.dead || t >= 20 || S.th.every(th => th.state === 'done')) return false;
    t++;
    S.th.forEach(th => { if (th.state !== 'done') lb.add('tick ' + t + ' · ' + th.name + ' ' + run(th), th.state === 'blocked' ? 'mut' : ''); });
    const live = S.th.filter(th => th.state !== 'done');
    if (live.length && live.every(th => th.state === 'blocked')) { S.dead = true; lb.add('Every live thread waits for a lock that another live thread holds. Nothing can move: deadlock.', 'bad'); }
    return !S.dead && S.th.some(th => th.state !== 'done') && t < 20;
  }
  const board = h('div', { style: 'min-width:0' });
  const st = stat([]);
  const msg = h('div', { class: 'out', 'aria-live': 'polite' });
  function redraw() {
    const s = svg('svg', { viewBox: '0 0 640 220', role: 'img', 'aria-label': 'Lock graph at tick ' + t, style: 'width:100%;min-width:520px;height:auto;display:block' });
    const edge = (x1, y1, x2, y2, dashed, label, col) => {
      s.append(svg('line', { x1, y1, x2, y2, stroke: col, 'stroke-width': 2, 'stroke-dasharray': dashed ? '6 4' : null }));
      s.append(svg('text', { x: (x1 + x2) / 2 + 8, y: (y1 + y2) / 2, 'font-size': 11.5, fill: col, 'font-weight': 600 }, label));
    };
    S.th.forEach(th => {
      th.held.forEach(L => edge(POS[L][0], POS[L][1], POS[th.name][0], POS[th.name][1], false, 'holds', 'var(--ok)'));
      if (th.state === 'blocked') { const L = th.need[th.pc]; edge(POS[th.name][0], POS[th.name][1], POS[L][0], POS[L][1], true, 'waits', 'var(--acc2)'); }
    });
    S.th.forEach(th => {
      const x = POS[th.name][0] - 65, col = S.dead ? 'var(--acc2)' : th.state === 'blocked' ? 'var(--acc2)' : th.state === 'done' ? 'var(--ok)' : 'var(--line)';
      s.append(svg('rect', { x, y: 20, width: 130, height: 40, rx: 9, fill: 'var(--card)', stroke: col, 'stroke-width': 2 }));
      s.append(svg('text', { x: x + 65, y: 38, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700, fill: 'var(--ink)' }, th.name + ' · ' + (th.need[0] + ' then ' + th.need[1])));
      s.append(svg('text', { x: x + 65, y: 53, 'text-anchor': 'middle', 'font-size': 11.5, fill: 'var(--mut)' }, th.state));
    });
    ['A', 'B'].forEach(L => {
      const x = POS[L][0] - 65;
      s.append(svg('rect', { x, y: 160, width: 130, height: 40, rx: 9, fill: 'var(--soft)', stroke: 'var(--line)', 'stroke-width': 1.5 }));
      s.append(svg('text', { x: x + 65, y: 178, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700, fill: 'var(--ink)' }, 'lock ' + L));
      s.append(svg('text', { x: x + 65, y: 194, 'text-anchor': 'middle', 'font-size': 11.5, fill: 'var(--mut)' }, S.owner[L] ? 'held by ' + S.owner[L] : 'free'));
    });
    board.replaceChildren(h('div', { class: 'svgw' }, s));
    st.update([{ l: 'tick', v: t }, { l: 'lock A', v: S.owner.A || 'free' }, { l: 'lock B', v: S.owner.B || 'free' }, { l: 'status', v: S.dead ? 'DEADLOCK' : S.th.every(th => th.state === 'done') ? 'both done' : 'running', cls: S.dead ? 'bad' : 'ok' }]);
    msg.textContent = S.dead
      ? 'T1 holds A and waits for B. T2 holds B and waits for A. Each waits for the other, so neither can ever move. A global lock order prevents this.'
      : mode === 'ordered'
        ? 'Both transfers take A first, then B. The one that arrives second just waits, then runs.'
        : 'Press Play and watch the cycle form: each thread holds one lock and waits for the other.';
  }
  const pl = player({
    speed: 700,
    step() { const more = advance(); redraw(); return more; },
    reset() { fresh(); redraw(); }
  });
  pl.append(btn('Jump to end', () => { pl.stop(); while (advance()); redraw(); }));
  const modeSeg = seg([{ v: 'free', l: 'Each transfer locks in its own order' }, { v: 'ordered', l: 'Everyone locks A first' }], mode, v => { mode = v; pl.stop(); fresh(); redraw(); });
  fresh();
  root.append(
    bar(modeSeg), pl, board, st, msg, lb.el,
    note('Illustrative: the two threads take turns, one action each per tick. A real deadlock needs the two threads to interleave this way, which is why it shows up under load and not in a quiet test.')
  );
  redraw();
};

PG.c6 = function (root, A) {

  root.append(

      { l: 'locks', v: c.locks }
    ]);
    msg.textContent = c.s;
  }
  const pl = player({
    speed: 1200,
    step() { const n = ROWS[mode].length; if (i >= n) return false; i++; redraw(); return i < n; },
    reset() { i = 0; redraw(); }
  });

  const modeSeg = seg([{ v: 'none', l: 'No locks' }, { v: 'twopl', l: 'Two-phase locking' }], mode, v => { mode = v; pl.stop(); i = 0; redraw(); });
  root.append(
    bar(modeSeg), pl, st, msg,
    note('Illustrative: one scripted interleaving per mode. Real schedulers vary the order, but the report can only be wrong in the first mode, and the two-phase rule forbids that interleaving.')
  );

};

PG.c8 = function (root, A) {
  const { h, bar, btn, seg, slider, player, stat, note } = A;
  let mode = 'direct', crash = 1, i = 0;
  // one transfer: A 100 -> 90 and B 100 -> 110. The power fails after `crash` steps have finished.
  const STEPS = {
    direct: ['write A = 90 to the data file', 'write B = 110 to the data file'],
    wal: ['append BEGIN T7 to the log', 'append A: 100 -> 90 to the log', 'append B: 100 -> 110 to the log', 'append COMMIT T7 and flush the log', 'write A = 90 to the data file', 'write B = 110 to the data file']
  };
  // what is on disk after `done` steps, and what recovery makes of it
  function state(done) {
    if (mode === 'direct') {
      const a = done >= 1 ? 90 : 100, b = done >= 2 ? 110 : 100;
      return { a, b, ra: a, rb: b, log: [], rec: 'No log, so recovery has nothing to work with. The disk keeps whatever half of the transfer was written.' };
    }
    const committed = done >= 4;
    return {
      a: done >= 5 ? 90 : 100, b: done >= 6 ? 110 : 100,
      ra: committed ? 90 : 100, rb: committed ? 110 : 100,
      log: STEPS.wal.slice(0, Math.min(done, 4)),
      rec: committed
        ? 'Recovery finds COMMIT T7 in the log, so it redoes the transfer: A = 90 and B = 110, whatever the data file held.'
        : 'Recovery finds no COMMIT for T7, so it undoes the transfer. The data file never received it, so the old values stand.'
    };
  }
  const steps = h('div', { class: 'out' });
  const live = stat([]), after = stat([]);
  const msg = h('div', { class: 'out', 'aria-live': 'polite' });
  const cap = () => Math.min(crash, STEPS[mode].length);
  function redraw() {
    const c = cap(), now = state(i), fin = state(c);
    steps.replaceChildren(...STEPS[mode].map((s, k) => h('div', { style: k < i ? 'color:var(--ink)' : 'color:var(--mut)' }, (k < i ? '✓ ' : '· ') + s + (k === c - 1 ? '   ← power fails here' : ''))),
      ...(c === 0 ? [h('div', { style: 'color:var(--acc2);font-weight:700' }, '✕ power fails before any step')] : []));
    live.update([{ l: 'A on disk', v: now.a }, { l: 'B on disk', v: now.b }, { l: 'total on disk', v: now.a + now.b, cls: now.a + now.b === 200 ? 'ok' : 'bad' }]);
    after.update([{ l: 'A after reboot', v: fin.ra }, { l: 'B after reboot', v: fin.rb }, { l: 'total after reboot', v: fin.ra + fin.rb, cls: fin.ra + fin.rb === 200 ? 'ok' : 'bad' }]);
    msg.textContent = (mode === 'wal' ? 'Log on disk: ' + (fin.log.length ? fin.log.join(' · ') : 'empty') + '. ' : '') + fin.rec;
  }
  const pl = player({
    speed: 800,
    step() { const n = cap(); if (i >= n) return false; i++; redraw(); return i < n; },
    reset() { i = 0; redraw(); }
  });
  pl.append(btn('Jump to end', () => { pl.stop(); i = cap(); redraw(); }));
  const modeSeg = seg([{ v: 'direct', l: 'Write the data directly' }, { v: 'wal', l: 'Write-ahead log first' }], mode, v => { mode = v; pl.stop(); i = 0; redraw(); });
  const crashSl = slider('Power fails after step', 0, 6, crash, 1, v => { crash = v; pl.stop(); i = 0; redraw(); });
  root.append(
    bar(modeSeg), crashSl, pl, steps, live, after, msg,
    note('Illustrative: a 100-to-90 and 100-to-110 transfer. The first row shows the disk while the transfer runs; the second row shows what the database holds after reboot. Compare the totals.')
  );
  redraw();
};
/* ---- common-problem simulations. Each one animates the failure, then the fix, with the same controls as the main playground ---- */

function sbox(s, x, y, w, hh, label, o) {

/* o.modes [{v,l}], o.init(mode) -> state, o.step(state, mode) -> more?, o.render(state, mode) -> {nodes, stats, msg} */
function simPanel(root, o) {

  pl.append(btn('Jump to end', () => { pl.stop(); for (let g = 0; g < 400 && o.step(S, mode); g++); draw(); }));
  const modeSeg = seg(o.modes, mode, v => { mode = v; pl.stop(); reset(); draw(); });
