SIM.c2_flag = function (root) {
  // 60 requests. Each one reads the flag, then writes it. A double entry happens when two requests read 0 within one tick of each other.
  const N = 60, WIN = 40, DIV = { low: 1, high: 4 };
  const R = rng(7), PLAN = [...Array(N)].map(() => [R(), R()]);
  simPanel(root, {
    modes: [{ v: 'plain-low', l: 'Plain flag, low load' }, { v: 'plain-high', l: 'Plain flag, high load' }, { v: 'atomic-high', l: 'Test-and-set, high load' }],
    speed: 110,
    init: () => ({ i: 0 }),
    step: S => { S.i++; return S.i < N; },
    render: (S, mode) => {
      const [kind, load] = mode.split('-');
      const span = WIN / DIV[load], cols = 12, cw = 36;
      const clash = PLAN.map(([u, v]) => kind === 'plain' && Math.abs(Math.floor(u * span) - Math.floor(v * span)) <= 1);
      const bad = clash.slice(0, S.i).filter(Boolean).length;
      const s = svg('svg', { viewBox: `0 0 ${cols * cw + 12} ${Math.ceil(N / cols) * cw + 12}`, role: 'img', 'aria-label': 'Each square is one request pair', style: 'width:100%;min-width:440px;height:auto;display:block' });
      clash.forEach((c, k) => {
        const shown = k < S.i, x = 6 + (k % cols) * cw, y = 6 + Math.floor(k / cols) * cw;
        const col = !shown ? 'var(--line)' : c ? 'var(--acc2)' : 'var(--acc)';
        sbox(s, x, y, 30, 30, null, { fill: shown ? col : 'var(--card)', stroke: col, dash: !shown });
      });
      const why = kind === 'atomic'
        ? 'Test-and-set reads the old value and writes 1 in one step. Two requests can never both see 0, so no pair collides, at any load.'
        : 'A collision means both requests read flag = 0 before either wrote 1, so both entered. High load squeezes the arrivals into a shorter window, so collisions multiply.';
      return {
        nodes: [s],
        stats: [{ l: 'requests run', v: S.i }, { l: 'double entries', v: bad, cls: bad ? 'bad' : 'ok' }, { l: 'rate', v: S.i ? Math.round(100 * bad / S.i) + '%' : '-' }],
        msg: why
      };
    },
    note: 'Illustrative: a seeded set of arrival times, not measured data. The mechanism is the same as in production code: the gap between the read and the write is what matters.'
  });
};

SIM.c2_spin = function (root) {
  // H holds the lock, but the scheduler has put it at the back of the queue. W1 and W2 are on the two cores, waiting for H to release.
  const SLICE = 3, WORK = 4, LIMIT = 2;
  const init = mode => ({ mode, t: 0, q: ['W1', 'W2', 'H'], core: [null, null], slice: [0, 0], left: 4, spin: { W1: 0, W2: 0 }, st: {}, row: { H: [], W1: [], W2: [] }, lockFree: false, blocked: [], doneAt: null, end: null });
  const step = (S, mode) => {
    if (S.end !== null || S.t >= 24) return false;
    S.t++;
    const T = S.t, mark = {};
    S.core.forEach((x, c) => { if (x === null && S.q.length) { S.core[c] = S.q.shift(); S.slice[c] = SLICE; } });
    S.core.forEach((x, c) => {
      if (x === null) return;
      S.slice[c]--;
      if (x === 'H') {
        S.left--; mark.H = 'run';
        if (S.left === 0) { S.lockFree = true; S.doneAt = T; mark.H = 'done'; S.core[c] = null; return; }
      } else if (S.lockFree) {
        S.lockFree = false; S.end = T; mark[x] = 'crit'; S.core[c] = null; return;
      } else {
        S.spin[x]++; mark[x] = 'spin';
        if (mode === 'block' && S.spin[x] >= LIMIT) { S.blocked.push(x); S.st[x] = 'blocked'; S.core[c] = null; mark[x] = 'block'; return; }
      }
      if (S.core[c] !== null && S.slice[c] === 0) { S.q.push(x); S.core[c] = null; }
    });
    if (S.lockFree && S.blocked.length) { S.q.push(...S.blocked); S.blocked = []; }
    ['H', 'W1', 'W2'].forEach(n => S.row[n].push(mark[n] || (S.st[n] === 'blocked' ? 'block' : 'wait')));
    return S.end === null;
  };
  simPanel(root, {
    modes: [{ v: 'spin', l: 'Spin until the lock is free' }, { v: 'block', l: 'Spin 2 ticks, then block' }],
    speed: 450,
    init: mode => init(mode),
    step: (S, mode) => step(S, mode),
    render: (S, mode) => {
      const cell = 34, label = 112, rows = ['H', 'W1', 'W2'], T = Math.max(12, S.row.H.length);
      const s = svg('svg', { viewBox: `0 0 ${label + T * cell + 10} ${rows.length * 40 + 30}`, role: 'img', 'aria-label': 'Timeline of the holder and two waiters', style: 'width:100%;min-width:480px;height:auto;display:block' });
      for (let k = 0; k < T; k++) stxt(s, label + k * cell + cell / 2, 14, String(k + 1), { anchor: 'middle', fs: 11 });
      rows.forEach((n, r) => {
        const y = 24 + r * 40;
        stxt(s, 6, y + 22, n === 'H' ? 'H (owner)' : n, { col: 'var(--ink)', bold: true, fs: 12.5 });
        for (let k = 0; k < T; k++) {
          const m = S.row[n][k] || '', x = label + k * cell + 2, look = {
            run: ['var(--acc)', 'var(--card)', 'work'], done: ['var(--ok)', 'var(--card)', 'free'], spin: ['var(--acc2)', 'var(--card)', 'spin'],
            crit: ['var(--ok)', 'var(--card)', 'LOCK'], block: ['var(--soft)', 'var(--mut)', 'asleep'], wait: ['var(--card)', 'var(--mut)', '']
          }[m] || ['var(--card)', 'var(--mut)', ''];
          sbox(s, x, y, cell - 4, 30, look[2] || null, { fill: look[0], stroke: m === 'wait' || !m ? 'var(--line)' : look[0], dash: m === 'wait' || !m, col: look[1], fs: 9 });
        }
      });
      const waste = ['W1', 'W2'].reduce((a, n) => a + S.row[n].filter(x => x === 'spin').length, 0);
      return {
        nodes: [s],
        stats: [{ l: 'wasted spin ticks', v: waste, cls: waste > 3 ? 'bad' : 'ok' }, { l: 'lock freed at tick', v: S.doneAt ?? '-' }, { l: 'waiter got it at tick', v: S.end ?? '-' }],
        msg: mode === 'spin'
          ? 'Both waiters spin for their whole time slice. The holder H needs CPU to finish its work and release the lock, but it is queued behind the spinners. The lock stays taken while two cores burn time.'
          : 'After two ticks of spinning, each waiter blocks and gives its core back. H gets a core straight away, releases the lock sooner, and the waiter is woken at once.'
      };
    },
    note: 'Illustrative: two cores, a three-tick time slice, and H needs four ticks of work. The numbers are chosen to show the order of events.'
  });
};

SIM.c2_starve = function (root) {
  // One lock. H holds it until tick 2. From then on one thread arrives every tick and holds the lock for one tick. W arrives at tick 1.
  const TICKS = 14;
  simPanel(root, {
    modes: [{ v: 'barge', l: 'Unfair: the newest arrival takes a free lock' }, { v: 'fifo', l: 'Fair: the oldest waiter takes it' }],
    speed: 600,
    init: () => ({ t: 0, wait: [], owner: 'H', until: 2, got: { H: 0 }, arr: {} }),
    step: (S, mode) => {
      if (S.t >= TICKS || S.got.W !== undefined) return false;
      S.t++;
      const id = S.t === 1 ? 'W' : 'N' + S.t;
      S.arr[id] = S.t; S.wait.push(id);
      if (S.owner && S.t >= S.until) S.owner = null;
      if (!S.owner && S.wait.length) {
        const k = mode === 'barge' ? S.wait.length - 1 : 0;
        S.owner = S.wait.splice(k, 1)[0]; S.got[S.owner] = S.t; S.until = S.t + 1;
      }
      return S.t < TICKS && S.got.W === undefined;
    },
    render: (S, mode) => {
      const rows = S.wait.slice(0, 9), H = 26 + (rows.length + 1) * 34;
      const s = svg('svg', { viewBox: `0 0 560 ${H}`, role: 'img', 'aria-label': 'Waiting threads and how long each has waited', style: 'width:100%;min-width:440px;height:auto;display:block' });
      sbox(s, 6, 8, 520, 28, 'lock held by ' + (S.owner || 'nobody (free)'), { fill: S.owner ? 'var(--soft)' : 'var(--card)', bold: true, fs: 13 });
      rows.forEach((id, r) => {
        const y = 46 + r * 34, waited = S.t - S.arr[id], isW = id === 'W';
        stxt(s, 6, y + 18, id, { col: 'var(--ink)', bold: true, fs: 13 });
        sbox(s, 60, y + 4, Math.max(4, waited * 30), 20, null, { fill: isW ? 'var(--acc2)' : 'var(--p4)', stroke: 'none' });
        stxt(s, 66 + waited * 30, y + 18, 'waited ' + waited, { fs: 11.5, col: isW ? 'var(--acc2)' : 'var(--mut)' });
      });
      const wWait = (S.got.W ?? S.t) - 1;
      return {
        nodes: [s],
        stats: [{ l: 'W waited (ticks)', v: wWait, cls: wWait > 4 ? 'bad' : 'ok' }, { l: 'locks granted', v: Object.keys(S.got).length }, { l: 'threads waiting', v: S.wait.length }],
        msg: mode === 'barge'
          ? 'Each release goes to the newest arrival, which is the one that just showed up. W is never the newest, so it never reaches the front. Nothing is broken: the lock simply never picks W. That is starvation.'
          : 'Each release goes to the oldest waiter. W is at the front when H releases, so it gets the lock at once. Waiting is longer for newcomers, but no thread waits for ever.'
      };
    },
    note: 'Illustrative: a steady stream of arrivals. Go and Java both document unfair locks for speed; the starvation case is what the fair mode prevents.'
  });
};

SIM.c2_order = function (root) {
  // The writer runs: data = 42, then ready = 1. The reader spins until it sees ready = 1, then reads data.
  const PLAN = {
    weak: { ev: [{ t: 2, k: 'ready', v: 1 }, { t: 4, k: 'data', v: 42 }] },
    strong: { ev: [{ t: 2, k: 'data', v: 42 }, { t: 3, k: 'ready', v: 1 }] },
    fixed: { ev: [{ t: 4, k: 'data', v: 42 }, { t: 5, k: 'ready', v: 1 }] }
  };
  simPanel(root, {
    modes: [{ v: 'weak', l: 'Weak order (ARM-like)' }, { v: 'strong', l: 'Strong order (x86-like)' }, { v: 'fixed', l: 'Weak order + release barrier' }],
    speed: 800,
    init: () => ({ t: 0 }),
    step: S => { S.t++; return S.t < 7; },
    render: (S, mode) => {
      const ev = PLAN[mode].ev, cw = 70, label = 110;
      const mem = t => { const m = { data: 0, ready: 0 }; ev.forEach(e => { if (e.t <= t) m[e.k] = e.v; }); return m; };
      let seen = null;
      for (let t = 0; t <= S.t && !seen; t++) if (mem(t).ready === 1) seen = { t, data: mem(t).data };
      const s = svg('svg', { viewBox: `0 0 ${label + 7 * cw} 150`, role: 'img', 'aria-label': 'Memory contents and reader at each tick', style: 'width:100%;min-width:500px;height:auto;display:block' });
      for (let t = 0; t < 7; t++) stxt(s, label + t * cw + cw / 2, 16, 'tick ' + t, { anchor: 'middle', fs: 11 });
      ['data', 'ready'].forEach((k, r) => {
        const y = 28 + r * 40;
        stxt(s, 6, y + 22, 'memory: ' + k, { col: 'var(--ink)', bold: true, fs: 12.5 });
        for (let t = 0; t <= S.t; t++) {
          const applied = ev.some(e => e.t === t && e.k === k), v = mem(t)[k];
          sbox(s, label + t * cw + 4, y, cw - 8, 30, String(v), { fill: applied ? 'var(--acc)' : 'var(--card)', stroke: applied ? 'var(--acc)' : 'var(--line)', col: applied ? 'var(--card)' : 'var(--ink)', bold: applied });
        }
      });
      const y = 108;
      stxt(s, 6, y + 22, 'reader', { col: 'var(--ink)', bold: true, fs: 12.5 });
      for (let t = 0; t <= S.t; t++) {
        const sees = seen && t === seen.t, waiting = !seen || t < seen.t;
        const label2 = waiting ? 'spin' : sees ? 'data=' + seen.data : '';
        sbox(s, label + t * cw + 4, y, cw - 8, 30, label2, { fill: sees ? (seen.data === 42 ? 'var(--ok)' : 'var(--acc2)') : 'var(--card)', stroke: sees ? (seen.data === 42 ? 'var(--ok)' : 'var(--acc2)') : 'var(--line)', col: sees ? 'var(--card)' : 'var(--mut)', dash: waiting, fs: 11 });
      }
      return {
        nodes: [s],
        stats: [{ l: 'reader saw ready = 1 at tick', v: seen ? seen.t : '-' }, { l: 'data it read', v: seen ? seen.data : '-', cls: seen ? (seen.data === 42 ? 'ok' : 'bad') : '' }],
        msg: mode === 'weak'
          ? 'The data store missed the cache, so the CPU let ready = 1 leave first. The reader saw ready = 1 and read data = 0. Nothing crashed and nothing was logged.'
          : mode === 'strong'
            ? 'Stores become visible in program order, so when ready = 1 is visible, data = 42 already is. The bug is hidden on x86 machines, which is why it appears only on other hardware.'
            : 'A release barrier makes the CPU drain the data store before the ready store can leave. The reader that sees ready = 1 is guaranteed to see data = 42.'
      };
    },
    note: 'Illustrative schedule: the delays are chosen to show the mechanism. Real reordering is rarer and depends on the CPU and the cache state.'
  });
};

SIM.c3_queue = function (root) {
  // The producer adds one item per tick. The consumer takes one item every third tick. Bounded mode caps the queue at 4.
  const TICKS = 30, CAP = 4, SCALE = 7;
  simPanel(root, {
    modes: [{ v: 'open', l: 'Unbounded queue' }, { v: 'bounded', l: 'Bounded at 4: the producer waits' }],
    speed: 280,
    init: () => ({ t: 0, q: [], hist: [], blocked: 0, took: 0 }),
    step: (S, mode) => {
      if (S.t >= TICKS) return false;
      S.t++;
      if (mode === 'open' || S.q.length < CAP) S.q.push(S.t); else S.blocked++;
      if (S.t % 3 === 0 && S.q.length) { S.q.shift(); S.took++; }
      S.hist.push(S.q.length);
      return S.t < TICKS;
    },
    render: (S, mode) => {
      const W = 620, base = 170, bw = 18;
      const s = svg('svg', { viewBox: `0 0 ${W} 200`, role: 'img', 'aria-label': 'Queue length over time', style: 'width:100%;min-width:520px;height:auto;display:block' });
      S.hist.forEach((n, k) => {
        const hgt = n * SCALE, over = n > CAP && mode === 'bounded';
        s.append(svg('rect', { x: 10 + k * bw, y: base - hgt, width: bw - 4, height: Math.max(0, hgt), rx: 2, fill: n > CAP ? 'var(--acc2)' : 'var(--acc)' }));
      });
      sline(s, 6, base - CAP * SCALE, W - 6, base - CAP * SCALE, { col: 'var(--mut)', dash: true });
      stxt(s, W - 8, base - CAP * SCALE - 6, 'capacity 4', { anchor: 'end', fs: 11 });
      sline(s, 6, base, W - 6, base, { col: 'var(--line)', w: 1.2 });
      stxt(s, 10, base + 18, 'ticks 1 to ' + TICKS, { fs: 11 });
      const oldest = S.q.length ? S.t - S.q[0] : 0;
      return {
        nodes: [s],
        stats: [{ l: 'queued now', v: S.q.length, cls: S.q.length > CAP ? 'bad' : 'ok' }, { l: 'oldest item waited (ticks)', v: oldest, cls: oldest > 10 ? 'bad' : 'ok' }, { l: 'producer blocked (ticks)', v: S.blocked }],
        msg: mode === 'open'
          ? 'The producer makes one item per tick and the consumer takes one every third tick, so the queue gains two items every three ticks. No error is raised. The oldest item waits longer and longer, and the memory holding the queue grows with it.'
          : 'When 4 items are queued, the producer waits. Overload becomes a slower producer: visible, bounded, and it can be reported upstream.'
      };
    },
    note: 'Illustrative rates: 1 item per tick in, 1 per 3 ticks out. The same ratio as the crawler example in the problem.'
  });
};

SIM.c3_leak = function (root) {
  // A pool with 3 permits. A new request arrives every tick and takes 2 ticks. Every third request fails part way through.
  const PERMITS = 3, TICKS = 14;
  const fails = id => id % 3 === 0;
  simPanel(root, {
    modes: [{ v: 'plain', l: 'Release only on the happy path' }, { v: 'finally', l: 'Release in finally' }],
    speed: 520,
    init: () => ({ t: 0, free: PERMITS, active: [], waiting: [], leaked: 0, served: 0, failed: 0 }),
    step: (S, mode) => {
      if (S.t >= TICKS) return false;
      S.t++;
      S.waiting.push(S.t);                                       // a request arrives
      S.active.filter(r => r.end === S.t).forEach(r => {        // requests that finish this tick
        S.active.splice(S.active.indexOf(r), 1);
        if (r.fail) S.failed++; else S.served++;
        if (r.fail && mode === 'plain') S.leaked++;             // the exception skipped release(): the permit is gone
        else S.free++;
      });
      while (S.free > 0 && S.waiting.length) {                  // free permits go to the oldest waiting request
        const id = S.waiting.shift();
        S.active.push({ id, end: S.t + 2, fail: fails(id) }); S.free--;
      }
      return S.t < TICKS;
    },
    render: (S, mode) => {
      const s = svg('svg', { viewBox: '0 0 620 150', role: 'img', 'aria-label': 'Permits in use, leaked and free', style: 'width:100%;min-width:500px;height:auto;display:block' });
      stxt(s, 6, 22, 'permits', { col: 'var(--ink)', bold: true, fs: 13 });
      for (let k = 0; k < PERMITS; k++) {
        const x = 110 + k * 90;
        const r = S.active[k];
        const leakedHere = k < S.leaked;
        if (leakedHere) sbox(s, x, 6, 78, 46, 'leaked', { fill: 'var(--acc2)', stroke: 'var(--acc2)', col: 'var(--card)', bold: true });
        else if (r) sbox(s, x, 6, 78, 46, 'req ' + r.id + (r.fail ? ' · error' : ''), { fill: r.fail ? 'var(--p4)' : 'var(--acc)', stroke: r.fail ? 'var(--p4)' : 'var(--acc)', col: 'var(--card)' });
        else sbox(s, x, 6, 78, 46, 'free', { fill: 'var(--card)', stroke: 'var(--ok)', dash: true, col: 'var(--ok)' });
      }
      stxt(s, 6, 98, 'waiting', { col: 'var(--ink)', bold: true, fs: 13 });
      S.waiting.slice(0, 12).forEach((id, k) => sbox(s, 110 + k * 40, 80, 34, 30, String(id), { fill: 'var(--soft)', fs: 11 }));
      if (S.waiting.length > 12) stxt(s, 110 + 12 * 40, 100, '+' + (S.waiting.length - 12), { fs: 12 });
      const hung = S.free === 0 && S.active.length === 0 && S.waiting.length;
      return {
        nodes: [s],
        stats: [{ l: 'free permits', v: S.free, cls: S.free === 0 ? 'bad' : 'ok' }, { l: 'leaked for good', v: S.leaked, cls: S.leaked ? 'bad' : 'ok' }, { l: 'waiting', v: S.waiting.length }, { l: 'served', v: S.served }],
        msg: mode === 'plain'
          ? (S.leaked >= PERMITS
            ? 'All 3 permits are leaked. Every new request waits for a permit that will never come back. The service still answers its health check, but it serves nothing.'
            : 'Each failed request keeps its permit, because the exception skipped release(). Watch the free count fall by one for every error.')
          : 'A finally block gives the permit back even when the request fails. The pool never shrinks, and waiting requests are served in order.'
      };
    },
    note: 'Illustrative: every third request fails halfway. The failure rate is set high on purpose so the leak is visible in 14 ticks.'
  });
};

SIM.c3_order = function (root) {
  // Buffer capacity 2, currently full. Producer P needs an empty slot and the mutex. Consumer C needs an item and the mutex.
  const PROG = {
    wrong: { P: ['lock', 'wait empty', 'put', 'unlock', 'signal full'], C: ['wait full', 'lock', 'take', 'unlock', 'signal empty'] },
    right: { P: ['wait empty', 'lock', 'put', 'unlock', 'signal full'], C: ['wait full', 'lock', 'take', 'unlock', 'signal empty'] }
  };
  const can = (op, S, who) => {
    if (op === 'lock') return S.mutex === null || S.mutex === who;
    if (op === 'wait empty') return S.empty > 0;
    if (op === 'wait full') return S.full > 0;
    return true;
  };
  const doOp = (op, S, who) => {
    if (op === 'lock') S.mutex = who;
    else if (op === 'unlock') S.mutex = null;
    else if (op === 'wait empty') S.empty--;
    else if (op === 'wait full') S.full--;
    else if (op === 'signal empty') S.empty++;
    else if (op === 'signal full') S.full++;
  };
  simPanel(root, {
    modes: [{ v: 'wrong', l: 'lock first, then wait(empty)' }, { v: 'right', l: 'wait(empty) first, then lock' }],
    speed: 900,
    init: mode => ({ mode, t: 0, empty: 0, full: 2, mutex: null, pc: { P: 0, C: 0 }, st: { P: 'run', C: 'run' }, dead: false }),
    step: (S, mode) => {
      if (S.dead || (S.pc.P >= 5 && S.pc.C >= 5) || S.t >= 14) return false;
      S.t++;
      let moved = false;
      ['P', 'C'].forEach(who => {
        if (S.pc[who] >= 5) return;
        const op = PROG[mode][who][S.pc[who]];
        if (can(op, S, who)) { doOp(op, S, who); S.pc[who]++; S.st[who] = 'run'; moved = true; }
        else S.st[who] = 'blocked';
      });
      if (!moved && (S.pc.P < 5 || S.pc.C < 5)) S.dead = true;
      return !S.dead && (S.pc.P < 5 || S.pc.C < 5);
    },
    render: (S, mode) => {
      const s = svg('svg', { viewBox: '0 0 620 210', role: 'img', 'aria-label': 'Producer, consumer and their semaphores', style: 'width:100%;min-width:520px;height:auto;display:block' });
      const lane = (who, y, title) => {
        stxt(s, 6, y + 22, title, { col: 'var(--ink)', bold: true, fs: 13 });
        const ops = PROG[mode][who];
        ops.forEach((op, k) => {
          const done = k < S.pc[who], now = k === S.pc[who];
          const col = done ? 'var(--ok)' : now ? (S.st[who] === 'blocked' ? 'var(--acc2)' : 'var(--acc)') : 'var(--line)';
          sbox(s, 120 + k * 98, y, 92, 34, op, { fill: done ? 'var(--ok)' : 'var(--card)', stroke: col, col: done ? 'var(--card)' : 'var(--ink)', dash: !done && !now, fs: 10.5, bold: now });
        });
      };
      lane('P', 20, 'Producer');
      lane('C', 80, 'Consumer');
      sbox(s, 120, 140, 200, 34, 'mutex: ' + (S.mutex ?? 'free'), { fill: S.mutex ? 'var(--soft)' : 'var(--card)', bold: true });
      sbox(s, 340, 140, 130, 34, 'empty = ' + S.empty, { fill: 'var(--card)', bold: true });
      sbox(s, 480, 140, 130, 34, 'full = ' + S.full, { fill: 'var(--card)', bold: true });
      stxt(s, 6, 162, 'buffer', { col: 'var(--ink)', bold: true, fs: 13 });
      if (S.dead) stxt(s, 120, 200, 'Both sides are waiting for each other. Nothing can change again.', { col: 'var(--acc2)', bold: true, fs: 12.5 });
      return {
        nodes: [s],
        stats: [{ l: 'tick', v: S.t }, { l: 'status', v: S.dead ? 'DEADLOCK' : (S.pc.P >= 5 && S.pc.C >= 5 ? 'both done' : 'running'), cls: S.dead ? 'bad' : 'ok' }, { l: 'mutex held by', v: S.mutex ?? 'nobody' }],
        msg: mode === 'wrong'
          ? 'The producer takes the mutex, then waits for an empty slot. The consumer needs the mutex to take an item, so it cannot free a slot. Each waits for the other, forever.'
          : 'The producer waits for an empty slot before it touches the mutex. The consumer takes the mutex, frees a slot, and signals. The producer then runs, and both finish.'
      };
    },
    note: 'Illustrative: each side tries its next operation once per tick, producer first. The deadlock needs only these two operations in this order.'
  });
};

SIM.c3_rw = function (root) {
  // Readers arrive every tick and each reads for 3 ticks. A writer arrives at tick 2 and writes for 2 ticks once no reader is inside.
  const TICKS = 14;
  simPanel(root, {
    modes: [{ v: 'readers', l: 'Readers first: a writer needs zero readers' }, { v: 'writer', l: 'Writer preference: new readers queue behind it' }],
    speed: 420,
    init: () => ({ t: 0, active: [], queued: [], writerWait: false, writing: 0, writerStart: null, writerDone: null, bars: [] }),
    step: (S, mode) => {
      if (S.t >= TICKS || S.writerDone !== null) return false;
      S.t++;
      S.active = S.active.filter(r => r.end > S.t);
      if (S.writing > 0) { S.writing--; if (S.writing === 0) S.writerDone = S.t; }
      if (S.t === 2) S.writerWait = true;
      if (S.writing === 0 && S.writerWait && S.active.length === 0) { S.writing = 2; S.writerStart = S.t; S.writerWait = false; }
      const r = { id: 'R' + S.t, start: S.t, end: S.t + 3 };
      if (S.writing === 0 && (mode === 'readers' || !S.writerWait)) { S.active.push(r); S.bars.push(r); } else S.queued.push(r);
      if (S.writing === 0 && !S.writerWait && S.queued.length) { S.queued.forEach(q => { q.start = S.t; q.end = S.t + 3; S.active.push(q); S.bars.push(q); }); S.queued = []; }
      return S.t < TICKS && S.writerDone === null;
    },
    render: (S, mode) => {
      const rows = S.bars.slice(-8), H = 60 + rows.length * 26 + 30, cell = 36, label = 130;
      const s = svg('svg', { viewBox: `0 0 ${label + 15 * cell} ${H}`, role: 'img', 'aria-label': 'Writer and readers over time', style: 'width:100%;min-width:520px;height:auto;display:block' });
      for (let k = 0; k <= TICKS; k++) stxt(s, label + k * cell + 2, 14, String(k), { fs: 10.5 });
      const wy = 24;
      stxt(s, 6, wy + 18, 'writer', { col: 'var(--ink)', bold: true, fs: 13 });
      if (S.writerStart !== null) {
        sbox(s, label + 2 * cell, wy, (S.writerStart - 2) * cell, 26, 'waits', { fill: 'var(--card)', stroke: 'var(--acc2)', dash: true, col: 'var(--acc2)', fs: 11 });
        const end = S.writerDone ?? S.t;
        sbox(s, label + S.writerStart * cell, wy, (end - S.writerStart) * cell, 26, 'writes', { fill: 'var(--acc2)', stroke: 'var(--acc2)', col: 'var(--card)', fs: 11 });
      } else if (S.t >= 2) {
        sbox(s, label + 2 * cell, wy, (S.t - 2) * cell, 26, 'waiting since tick 2', { fill: 'var(--card)', stroke: 'var(--acc2)', dash: true, col: 'var(--acc2)', fs: 11 });
      }
      rows.forEach((r, k) => {
        const y = 60 + k * 26, end = Math.min(r.end, S.t + 1);
        stxt(s, 6, y + 18, r.id, { col: 'var(--ink)', fs: 12 });
        const inside = S.active.includes(r) || (r.start <= S.t && r.end > S.t);
        sbox(s, label + r.start * cell, y, Math.max(cell, (end - r.start) * cell - 2), 20, null, { fill: inside ? 'var(--acc)' : 'var(--soft)', stroke: 'none' });
      });
      const wait = (S.writerDone ?? S.t) - 2;
      return {
        nodes: [s],
        stats: [{ l: 'writer waited (ticks)', v: S.writerStart !== null ? S.writerStart - 2 : wait, cls: wait > 6 ? 'bad' : 'ok' }, { l: 'readers admitted', v: S.bars.length }, { l: 'writer done at', v: S.writerDone ?? '-' }],
        msg: mode === 'readers'
          ? 'The readers overlap, so there is never a moment with zero readers inside. The writer arrived at tick 2 and is still waiting. Every new reader gets in first.'
          : 'Once the writer is waiting, new readers queue. The readers already inside drain, the writer writes, and only then do the queued readers continue.'
      };
    },
    note: 'Illustrative schedule: one reader per tick, each reading for three ticks. Bars show who is inside the lock.'
  });
};

/* Scripted multi-actor run. Each actor has a list of operations and runs one per tick, in key order. An operation waits (blocked) until canDo() is true. If nobody can move, the run is stuck. */
function opsSim(root, cfg) {
  simPanel(root, {
    modes: cfg.modes,
    speed: cfg.speed || 800,
    init: mode => {
      const P = cfg.progs(mode), S = Object.assign(cfg.init(mode), { t: 0, dead: false, P, pc: {}, st: {} });
      Object.keys(P).forEach(w => { S.pc[w] = 0; S.st[w] = 'run'; });
      return S;
    },
    step: (S, mode) => {
      const names = Object.keys(S.P), finished = () => names.every(w => S.pc[w] >= S.P[w].length);
      if (S.dead || finished() || S.t >= 18) return false;
      S.t++;
      let moved = false;
      names.forEach(w => {
        if (S.pc[w] >= S.P[w].length) return;
        const op = S.P[w][S.pc[w]];
        if (cfg.canDo(op, S, w)) {
          const done = cfg.doIt(op, S, w);
          if (done !== false) S.pc[w]++;
          moved = true; S.st[w] = 'run';
        } else S.st[w] = 'blocked';
      });
      if (!moved) S.dead = true;
      return !S.dead && !finished();
    },
    render: (S, mode) => cfg.render(S, mode),
    note: cfg.note
  });
}
/* draws one row of operations per actor, marking done, current, blocked */
function opsLanes(s, S, names, label) {
  names.forEach((w, r) => {
    const y = 14 + r * 58, ops = S.P[w];
    stxt(s, 6, y + 22, label[w] || w, { col: 'var(--ink)', bold: true, fs: 13 });
    ops.forEach((op, k) => {
      const done = k < S.pc[w], now = k === S.pc[w] && S.pc[w] < ops.length;
      const col = done ? 'var(--ok)' : now ? (S.st[w] === 'blocked' ? 'var(--acc2)' : 'var(--acc)') : 'var(--line)';
      sbox(s, 84 + k * 92, y, 86, 36, op, { fill: done ? 'var(--ok)' : 'var(--card)', stroke: col, col: done ? 'var(--card)' : 'var(--ink)', dash: !done && !now, fs: 10.5, bold: now });
    });
  });
}

SIM.c4_spurious = function (root) {
  // Queue empty. C1 and C2 wait for an item. The OS wakes C2 with no signal at all (spurious). P adds an item later and notifies.
  const cfg = {
    modes: [{ v: 'if', l: 'if (empty) wait()' }, { v: 'while', l: 'while (empty) wait()' }],
    speed: 900,
    progs: mode => ({
      C1: ['lock', mode === 'if' ? 'if empty wait' : 'while empty wait', 'take', 'unlock'],
      C2: ['lock', mode === 'if' ? 'if empty wait' : 'while empty wait', 'take', 'unlock'],
      S: ['spurious wake C2'],
      P: ['pause', 'lock', 'put', 'unlock', 'notify']
    }),
    init: () => ({ lock: null, q: 0, sleep: {}, wake: {}, err: null, pcP: 0 }),
    canDo: (op, S, w) => {
      if (op === 'lock') return S.lock === null || S.lock === w;
      if (op === 'pause') return S.t >= 5;
      if (op === 'spurious wake C2') return !!S.sleep.C2;
      if (op.endsWith('wait')) return !S.sleep[w] || (S.wake[w] && S.lock === null);
      return true;
    },
    doIt: (op, S, w) => {
      if (op === 'lock') { S.lock = w; return true; }
      if (op === 'unlock') { S.lock = null; return true; }
      if (op === 'pause') return true;
      if (op === 'put') { S.q++; return true; }
      if (op === 'notify') { if (S.sleep.C1) S.wake.C1 = true; return true; }
      if (op === 'spurious wake C2') { S.wake.C2 = true; return true; }
      if (op === 'take') { if (S.q === 0) { S.err = w; } else S.q--; return true; }
      if (op.endsWith('wait')) {
        if (!S.sleep[w]) {
          if (op === 'if empty wait' && S.q > 0) return true;        // condition already true: no sleep
          if (op === 'while empty wait' && S.q > 0) return true;
          S.lock = null; S.sleep[w] = true; return false;             // release the lock and sleep
        }
        S.sleep[w] = false; S.wake[w] = false; S.lock = w;            // woken: take the lock back
        if (op === 'while empty wait' && S.q === 0) { S.lock = null; S.sleep[w] = true; return false; }   // re-check: still empty, sleep again
        return true;
      }
      return true;
    },
    render: (S, mode) => {
      const s = svg('svg', { viewBox: '0 0 760 220', role: 'img', 'aria-label': 'Consumers, producer and the queue', style: 'width:100%;min-width:560px;height:auto;display:block' });
      opsLanes(s, S, ['C1', 'C2', 'S', 'P'], { S: 'OS' });
      sbox(s, 6, 186, 150, 26, 'queue: ' + S.q, { fill: 'var(--card)', bold: true, fs: 12 });
      sbox(s, 170, 186, 210, 26, 'lock: ' + (S.lock ?? 'free'), { fill: S.lock ? 'var(--soft)' : 'var(--card)', bold: true, fs: 12 });
      sbox(s, 394, 186, 360, 26, 'sleeping: ' + (['C1', 'C2'].filter(w => S.sleep[w]).join(', ') || 'nobody') + (S.wake.C2 ? '  · C2 woken' : ''), { fill: 'var(--card)', fs: 12 });
      return {
        nodes: [s],
        stats: [{ l: 'queue', v: S.q }, { l: 'took from empty queue', v: S.err ?? 'no', cls: S.err ? 'bad' : 'ok' }, { l: 'status', v: S.err ? 'error' : S.dead ? 'C2 waits, nothing left' : 'finished', cls: S.err ? 'bad' : 'ok' }],
        msg: mode === 'if'
          ? (S.err ? 'C2 was woken with no item in the queue, did not check again, and took from an empty queue. That is the bug.' : 'C2 wakes with no signal. Watch what it does next: with if, it will not look again.')
          : 'C2 wakes with no signal, takes the lock, and checks the queue again. It is still empty, so it goes back to sleep and keeps waiting. The item goes to C1, and nothing fails.'
      };
    },
    note: 'Illustrative: the spurious wake-up is placed at tick 3 so that the mechanism is easy to follow. In real systems it happens rarely, and only under particular timing.'
  };
  opsSim(root, cfg);
};

SIM.c4_lost = function (root) {
  // Consumer X checks the queue under the lock, then releases it, then waits. Producer P adds an item and signals in between.
  const cfg = {
    modes: [{ v: 'bad', l: 'check, unlock, lock, wait' }, { v: 'good', l: 'check and wait in one locked step' }],
    speed: 900,
    progs: mode => ({
      X: mode === 'bad' ? ['lock', 'check', 'unlock', 'lock', 'wait', 'take', 'unlock'] : ['lock', 'wait if empty', 'take', 'unlock'],
      P: ['lock', 'put', 'unlock', 'notify']
    }),
    init: () => ({ lock: null, q: 0, sleep: false, notified: false, seen: null, err: null }),
    canDo: (op, S, w) => {
      if (op === 'lock') return S.lock === null || S.lock === w;
      if (op === 'wait' || op === 'wait if empty') return !S.sleep || (S.notified && S.lock === null);
      if (op === 'take') return true;
      return true;
    },
    doIt: (op, S, w) => {
      if (op === 'lock') { S.lock = w; return true; }
      if (op === 'unlock') { S.lock = null; return true; }
      if (op === 'check') { S.seen = S.q === 0 ? 'empty' : 'has item'; return true; }
      if (op === 'put') { S.q++; return true; }
      if (op === 'notify') { if (S.sleep) S.notified = true; return true; }   // a signal with no waiter is lost
      if (op === 'take') { if (S.q === 0) S.err = w; else S.q--; return true; }
      if (op === 'wait if empty' && S.q > 0) return true;
      if (op === 'wait' || op === 'wait if empty') {
        if (!S.sleep) { S.lock = null; S.sleep = true; return false; }
        S.sleep = false; S.notified = false; S.lock = w; return true;
      }
      return true;
    },
    render: (S, mode) => {
      const s = svg('svg', { viewBox: '0 0 700 210', role: 'img', 'aria-label': 'Consumer and producer steps', style: 'width:100%;min-width:540px;height:auto;display:block' });
      opsLanes(s, S, ['X', 'P'], { X: 'Consumer', P: 'Producer' });
      sbox(s, 6, 136, 150, 26, 'queue: ' + S.q, { fill: 'var(--card)', bold: true, fs: 12 });
      sbox(s, 170, 136, 200, 26, 'lock: ' + (S.lock ?? 'free'), { fill: S.lock ? 'var(--soft)' : 'var(--card)', bold: true, fs: 12 });
      sbox(s, 384, 136, 310, 26, 'consumer ' + (S.sleep ? 'asleep in wait()' : 'awake') + (S.notified ? ' · signalled' : ''), { fill: 'var(--card)', fs: 12 });
      stxt(s, 6, 186, S.seen ? 'consumer last saw: ' + S.seen : '', { col: 'var(--ink)', fs: 12 });
      const stuck = S.dead && S.sleep && S.q > 0;
      return {
        nodes: [s],
        stats: [{ l: 'items in queue', v: S.q }, { l: 'consumer asleep', v: S.sleep ? 'yes' : 'no' }, { l: 'status', v: stuck ? 'STUCK' : S.dead ? 'stuck' : (S.pc.X >= S.P.X.length ? 'finished' : 'running'), cls: S.dead ? 'bad' : 'ok' }],
        msg: mode === 'bad'
          ? (stuck ? 'The producer added an item and signalled while nobody was waiting, so the signal was lost. The consumer then went to sleep, though the queue is not empty. Nothing will wake it.' : 'Press Play. The producer can run in the gap between the check and the wait.')
          : 'The check and the wait happen under one lock. The producer cannot run in between, so the consumer is always either before the check or already waiting when the signal comes.'
      };
    },
    note: 'Illustrative: one consumer, one producer, scripted so the gap between the two locked regions is visible.'
  };
  opsSim(root, cfg);
};

SIM.c4_herd = function (root) {
  // 20 consumers wait for one item. The producer puts one item and wakes waiters: all of them with notifyAll, or one with signal on the right condition.
  const N = 20;
  simPanel(root, {
    modes: [{ v: 'all', l: 'notifyAll on one condition' }, { v: 'one', l: 'signal on notEmpty' }],
    speed: 700,
    init: () => ({ t: 0, woken: [], took: null, back: [] }),
    step: (S, mode) => {
      if (S.t >= 3) return false;
      S.t++;
      if (S.t === 2) S.woken = mode === 'all' ? [...Array(N).keys()] : [0];
      if (S.t === 3) { S.took = S.woken[0]; S.back = S.woken.slice(1); }
      return S.t < 3;
    },
    render: (S, mode) => {
      const cols = 10, cw = 56;
      const s = svg('svg', { viewBox: `0 0 ${cols * cw + 10} ${Math.ceil(N / cols) * cw + 10}`, role: 'img', 'aria-label': 'Twenty consumers and who is woken', style: 'width:100%;min-width:500px;height:auto;display:block' });
      for (let k = 0; k < N; k++) {
        const x = 6 + (k % cols) * cw, y = 6 + Math.floor(k / cols) * cw;
        let fill = 'var(--card)', stroke = 'var(--line)', label = 'asleep', col = 'var(--mut)', dash = true;
        if (k === S.took) { fill = 'var(--ok)'; stroke = 'var(--ok)'; label = 'took it'; col = 'var(--card)'; dash = false; }
        else if (S.back.includes(k)) { fill = 'var(--soft)'; stroke = 'var(--acc2)'; label = 'slept again'; col = 'var(--acc2)'; dash = false; }
        else if (S.woken.includes(k)) { fill = 'var(--acc)'; stroke = 'var(--acc)'; label = 'woken'; col = 'var(--card)'; dash = false; }
        sbox(s, x, y, cw - 8, cw - 8, label, { fill, stroke, dash, col, fs: 8.5 });
      }
      const wasted = S.back.length;
      return {
        nodes: [s],
        stats: [{ l: 'threads woken', v: S.woken.length }, { l: 'got the item', v: S.took === null ? '-' : 1 }, { l: 'woken for nothing', v: wasted, cls: wasted ? 'bad' : 'ok' }],
        msg: mode === 'all'
          ? (S.t >= 3 ? 'One item arrived, but notifyAll woke all 20 threads. One took it, and the other 19 found the queue empty and slept again. Every change costs a wake-up for each waiter.' : 'The producer adds one item and calls notifyAll. Every waiting thread is woken.')
          : (S.t >= 3 ? 'signal on the notEmpty condition woke exactly one thread. It took the item, and nobody was woken for nothing.' : 'The producer adds one item and signals only notEmpty, so exactly one consumer is woken.')
      };
    },
    note: 'Illustrative: 20 consumers on one buffer. Real systems have hundreds of waiters, so the wasted wake-ups add up quickly.'
  });
};

SIM.c4_nested = function (root) {
  // X holds lock B (the condition's monitor) and must wait for Y. Y needs lock A to set the state, then needs B to signal.
  const cfg = {
    modes: [{ v: 'nested', l: 'X waits while still holding A' }, { v: 'fixed', l: 'X releases A before waiting' }],
    speed: 900,
    progs: mode => ({
      X: mode === 'nested' ? ['lock A', 'lock B', 'wait B', 'unlock B', 'unlock A'] : ['lock B', 'wait B', 'unlock B'],
      Y: ['lock A', 'set ready', 'unlock A', 'lock B', 'signal B', 'unlock B']
    }),
    init: () => ({ A: null, B: null, ready: false, sigB: false, sleep: {} }),
    canDo: (op, S, w) => {
      if (op === 'lock A') return S.A === null || S.A === w;
      if (op === 'lock B') return S.B === null || S.B === w;
      if (op === 'wait B') return !S.sleep[w] || (S.sigB && (S.B === null));
      return true;
    },
    doIt: (op, S, w) => {
      if (op === 'lock A') { S.A = w; return true; }
      if (op === 'unlock A') { S.A = null; return true; }
      if (op === 'lock B') { S.B = w; return true; }
      if (op === 'unlock B') { S.B = null; return true; }
      if (op === 'set ready') { S.ready = true; return true; }
      if (op === 'signal B') { S.sigB = true; return true; }
      if (op === 'wait B') {
        if (!S.sleep[w]) { S.B = null; S.sleep[w] = true; return false; }   // wait releases B only, and sleeps
        S.sleep[w] = false; S.sigB = false; S.B = w; return true;
      }
      return true;
    },
    render: (S, mode) => {
      const s = svg('svg', { viewBox: '0 0 760 220', role: 'img', 'aria-label': 'Two threads and two locks', style: 'width:100%;min-width:560px;height:auto;display:block' });
      opsLanes(s, S, ['X', 'Y'], { X: 'X (waits)', Y: 'Y (sets)' });
      sbox(s, 6, 136, 170, 28, 'lock A: ' + (S.A ?? 'free'), { fill: S.A ? 'var(--soft)' : 'var(--card)', bold: true, fs: 12 });
      sbox(s, 190, 136, 170, 28, 'lock B: ' + (S.B ?? 'free'), { fill: S.B ? 'var(--soft)' : 'var(--card)', bold: true, fs: 12 });
      sbox(s, 374, 136, 180, 28, 'X asleep: ' + (S.sleep.X ? 'yes' : 'no'), { fill: 'var(--card)', fs: 12 });
      sbox(s, 568, 136, 180, 28, 'ready: ' + S.ready, { fill: 'var(--card)', fs: 12 });
      return {
        nodes: [s],
        stats: [{ l: 'lock A', v: S.A ?? 'free' }, { l: 'lock B', v: S.B ?? 'free' }, { l: 'status', v: S.dead ? 'STUCK' : (S.pc.X >= S.P.X.length && S.pc.Y >= S.P.Y.length ? 'finished' : 'running'), cls: S.dead ? 'bad' : 'ok' }],
        msg: mode === 'nested'
          ? (S.dead ? 'X sleeps inside wait() while still holding lock A. wait() releases only B, so Y can never take A to set the state. Both are stuck.' : 'Press Play. Watch what X still holds while it sleeps.')
          : 'X releases A before it waits. Y takes A, sets the state under B, signals, and X wakes up and finishes.'
      };
    },
    note: 'Illustrative: two locks and one condition. The pattern is the same as a monitor method that calls another object, while holding its own lock.'
  };
  opsSim(root, cfg);
};

/*SIM-END*/
