<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concurrency · course</title>
<link rel="stylesheet" href="../../assets/lab.css">
<style>
:root{--acc:#0f9d8a;--acc2:#d6456b}
@media(prefers-color-scheme:dark){:root{--acc:#3ccfb8;--acc2:#ff7aa0}}
body{font-size:16px}
.topbar .wrap{min-height:50px}
.topbar .crumb{color:var(--mut);font-size:14px;text-decoration:none}
.topbar .crumb:hover{color:var(--ink)}
.hero{padding:34px 0 10px}
.hero .lead{max-width:60ch}
.part{margin:28px 0 10px}
.part h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 4px}
.part p{margin:0 0 12px;color:var(--mut);font-size:14.5px;max-width:64ch}
.map{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.tile{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:0;height:100%;width:100%}
.tile:hover{border-color:var(--acc);transform:translateY(-2px)}
.tile .n{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--pc);border:1px solid var(--line)}
.tile b{display:block;font-size:15px;line-height:1.3}
.tile small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;line-height:1.35}
.chhead{display:flex;gap:12px;align-items:center;margin:22px 0 4px}
.chhead .n{flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;background:var(--pc);border:1px solid var(--line)}
.chhead h1{font-size:clamp(22px,4.6vw,30px);letter-spacing:-.4px}
.chhead small{display:block;color:var(--mut);font-size:13px}
.ask{font-size:clamp(17px,2.8vw,20px);margin:8px 0 18px;max-width:62ch}
.blk{margin:0 0 16px}
.blk>h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.blk>h3 i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--on-brand,#fff);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.idea{margin:0;padding-left:20px}.idea li{margin:5px 0}
.pg{display:grid;gap:12px}
.pgwhy{margin:0;color:var(--mut);font-size:14px}
.cp{display:grid;gap:10px}
@media(min-width:760px){.cp{grid-template-columns:repeat(3,1fr)}}
.cp>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.cp b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.cp .s b{color:var(--bad)}.cp .c b{color:var(--warn)}.cp .f b{color:var(--ok)}
.cp p{margin:0;font-size:14.5px}
.quiz .q{font-weight:600;margin:0 0 8px}
.quiz .opts{display:grid;gap:6px}
.quiz .opts button{text-align:left;min-height:0;padding:9px 12px}
.quiz .opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.quiz .opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.quiz .why{margin-top:8px}
.pn{display:flex;justify-content:space-between;gap:8px;margin:22px 0 40px}
.pn button{max-width:48%;text-align:left}
.pn button:last-child{margin-left:auto;text-align:right}
/* ---- playground kit ---- */
.pgbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.pgbox .bar{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;min-height:36px;padding:6px 12px;font-size:13.5px;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:var(--on-brand,#fff);font-weight:600}
.sl{display:inline-flex;align-items:center;gap:8px;flex-wrap:nowrap}
.sl input{width:130px}.sl b{color:var(--ink);font-weight:600;min-width:2ch;font-variant-numeric:tabular-nums}
.out{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;min-width:0}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.badge.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.badge.info{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line));background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.log{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card)}
.log div{padding:1px 0;border-bottom:1px dashed var(--line)}.log div:last-child{border:0}
.log .bad{color:var(--bad)}.log .ok{color:var(--ok)}.log .mut{color:var(--mut)}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat>div{border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--card);min-width:84px}
.stat small{display:block;color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat .bad b{color:var(--bad)}.stat .ok b{color:var(--ok)}
.svgw{overflow-x:auto;overscroll-behavior-x:contain}.svgw svg{display:block;max-width:100%}
.cols{display:grid;gap:12px}
@media(min-width:760px){.cols.two{grid-template-columns:1fr 1fr}.cols.three{grid-template-columns:repeat(3,1fr)}}
.cols>*{min-width:0}
@media(max-width:560px){.chhead{margin-top:14px}}
.prob{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc2);border-radius:12px;padding:12px 16px;margin:0 0 6px}
.prob p{margin:0 0 .5em}.scene p:last-child{margin:0}
.prob .q{font-weight:700;font-size:clamp(17px,2.6vw,19px)}
.arch{margin:0}.arch figcaption{text-align:center}
.arch svg{overflow:visible}
.common{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.common>div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);display:grid;gap:5px;align-content:start}
.common h4{font-size:15px;line-height:1.3;margin:0}.common h4 i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;margin-right:6px;vertical-align:1px}
.common p{margin:0;font-size:14px}
.common b{font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-right:6px}
.common .e b{color:var(--acc2)}.common .c b{color:var(--warn)}.common .f b{color:var(--ok)}
.sw{display:flex;gap:6px;margin-left:auto}
.sw a{font-size:13px;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}
.sw a:hover{color:var(--ink);border-color:var(--acc)}.sw a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.ctabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.ctab{border-radius:999px;font-size:14px;padding:7px 14px;min-height:0}
.ctab.on{color:var(--ink);background:color-mix(in srgb,var(--acc2) 14%,var(--card));border-color:var(--acc2);font-weight:700}
.cbody{display:grid;gap:12px}
.ctitle{font-size:clamp(20px,3.6vw,26px);letter-spacing:-.3px;margin:4px 0 0}
.csym{font-size:clamp(16px,2.4vw,18.5px);margin:0}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.ccard h5{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 6px}
.ccard h5:not(:first-child){margin-top:12px}
.ccard p{margin:0 0 .5em;font-size:15px}.ccard .seen b{color:var(--acc2);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.ccard pre{font-size:12.5px}
.vizc{background:var(--soft)}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.vrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin:6px 0}
@media(max-width:620px){.vrow{grid-template-columns:1fr;gap:4px}}
.vl{font-size:13px;color:var(--mut)}
.vcells{display:flex;gap:6px;min-width:0}
.vc{flex:1 1 0;min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;font-size:12.5px;background:var(--card);overflow-wrap:anywhere}
.vc.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.vc.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--card))}
.vc.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,var(--card))}
.vc.off{border-style:dashed;color:var(--mut);background:transparent}
.vbar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
@media(max-width:620px){.vbar{grid-template-columns:1fr}}
.vtrack{height:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vtrack i{display:block;height:100%;border-radius:8px;transition:width .35s}
.vtrack i.bad{background:var(--bad)}.vtrack i.ok{background:var(--ok)}.vtrack i.warn{background:var(--warn)}
.vt{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.fixes{margin:0;padding-left:22px}.fixes li{margin:4px 0}.fixes li::marker{color:var(--acc2);font-weight:700}
.f1-h{font-size:13px;color:var(--ink)}
.f1-lad{display:grid;gap:5px}
.f1-lr{display:grid;grid-template-columns:minmax(110px,190px) 1fr minmax(76px,auto);gap:8px;align-items:center;font-size:13.5px}
.f1-ln{color:var(--mut)}
.f1-lt{display:block;height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.f1-lt i{display:block;height:100%;border-radius:7px;background:var(--acc);transition:width .2s}
.f1-lv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:560px){.f1-lr{grid-template-columns:1fr auto;grid-template-areas:"n v" "t t"}.f1-ln{grid-area:n}.f1-lv{grid-area:v}.f1-lt{grid-area:t}}
.f1-sim{display:grid;gap:12px;align-items:start}
@media(min-width:760px){.f1-sim{grid-template-columns:auto 1fr}}
.f1-grid{display:grid;gap:2px;justify-content:start}
.f1-row{display:flex;align-items:center;gap:6px}
.f1-tag{font-size:10.5px;color:var(--mut);width:48px;white-space:nowrap;font-family:ui-monospace,monospace}
.f1-tag.in{color:var(--acc);font-weight:700}
.f1-cells{display:flex;gap:1px}
.f1-cells i{display:block;width:13px;height:13px;border-radius:3px;background:var(--soft);border:1px solid var(--line)}
.f1-cells i.in{background:color-mix(in srgb,var(--acc) 35%,var(--card));border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
.f1-cells i.hit,.f1-key i.hit{background:var(--ok);border-color:var(--ok)}
.f1-cells i.miss,.f1-key i.miss{background:var(--bad);border-color:var(--bad)}
.f1-side{display:grid;gap:10px;min-width:0}
.f1-key{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.f1-key i{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid var(--line);background:var(--soft)}
.f1-key i.in{background:color-mix(in srgb,var(--acc) 35%,var(--card));border-color:color-mix(in srgb,var(--acc) 60%,var(--line))}
.f1-key i+*{margin-right:6px}
.f2-h{font-size:13px;color:var(--ink)}
.f2-mem{display:grid;gap:10px}
@media(min-width:900px){.f2-mem{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}}
.f2-proc{border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--card);display:grid;gap:8px;align-content:start;min-width:0}
.f2-ph{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.f2-heap{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;background:var(--p2)}
.f2-heap.cow{background:var(--p4)}
.f2-hl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.f2-x{font-size:16px;font-family:ui-monospace,monospace}.f2-x b{font-size:22px}
.f2-pg{font-size:12px;color:var(--mut)}
.f2-ths{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.f2-th{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--p0);display:grid;gap:4px;font-size:12.5px;min-width:0}
.f2-th button{min-height:32px;padding:4px 8px;font-size:12.5px}
.f2-tn{display:flex;justify-content:space-between;gap:6px}
.f2-stack{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:3px 6px;font-family:ui-monospace,monospace;font-size:11.5px}
.f2-see b{font-size:14px}
.f2-g svg{border-radius:8px}
.f2-key{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.f2-key i{display:inline-block;width:14px;height:12px;border-radius:3px}
.f2-key i+*{margin-right:10px}
.f2-panel{display:grid;gap:10px;min-width:0}
.f2-panel[hidden]{display:none}
.f2-g svg{max-width:720px}
.f3-vh{font-size:13.5px;color:var(--mut)}.f3-vh b{color:var(--ink)}
.f3-vocab{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.f3-vc{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);display:grid;gap:3px;align-content:start;font-size:12.5px}
.f3-vc code{font-size:12.5px;font-weight:700;justify-self:start}
.f3-vl{color:var(--mut)}.f3-vl.ok{color:var(--ok)}.f3-vl.bad{color:var(--bad)}
.f3-panel{display:grid;gap:12px;min-width:0}.f3-panel[hidden]{display:none}
.f3-h{font-size:13px;margin:0;color:var(--ink)}
.f3-t{font-size:11px;fill:var(--mut);font-family:inherit}.f3-tb{font-weight:700;letter-spacing:.06em}
.f3-lane{fill:var(--soft);stroke:var(--line);stroke-width:1}
.f3-cpu{stroke:var(--card);stroke-width:.6}.f3-c0{fill:var(--acc)}.f3-c1{fill:color-mix(in srgb,var(--acc) 65%,var(--card))}
.f3-wait{fill:var(--t4)}
.f3-grid{stroke:var(--line);stroke-width:1}
.f3-line{fill:none;stroke-width:2.4}.f3-l-io{stroke:var(--acc);background:var(--acc)}.f3-l-cpu{stroke:var(--acc2)}.f3-l-db{stroke:var(--t3);stroke-dasharray:5 3}
.f3-knee{stroke:var(--mut);stroke-width:1.2;stroke-dasharray:3 3}
.f3-cur{stroke:var(--ink);stroke-width:1.6}
.f3-dot{fill:var(--ink)}
.f3-leg{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--mut);margin-top:6px}
.f3-sw{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:-8px}
.f3-sw.f3-l-io{border-color:var(--acc)}.f3-sw.f3-l-cpu{border-color:var(--acc2)}.f3-sw.f3-l-db{border-color:var(--t3);border-top-style:dashed}.f3-sw.f3-cur{border-color:var(--ink)}
.f3-sq{display:inline-block;width:14px;height:12px;border-radius:3px;margin-right:-8px;vertical-align:middle;border:1px solid var(--line)}
.f3-k-cpu{fill:var(--acc);background:var(--acc)}
.f3-k-wait{fill:color-mix(in srgb,var(--t4) 35%,var(--card));background:color-mix(in srgb,var(--t4) 35%,var(--card))}
.f3-k-queue{fill:var(--mut);fill-opacity:.4;background:color-mix(in srgb,var(--mut) 40%,var(--card))}
.f3-k-block{fill:var(--bad);background:var(--bad)}
.f3-q{display:grid;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);font-size:13.5px}
.f3-q[hidden]{display:none}
.f3-qr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.f3-qr>.mut{min-width:78px;font-size:12.5px}
.f3-chip{display:inline-block;max-width:100%;white-space:normal !important;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;background:var(--soft);white-space:nowrap}
.f3-chip.run{background:color-mix(in srgb,var(--acc) 20%,var(--card));border-color:var(--acc)}
.f3-chip.ok{background:color-mix(in srgb,var(--ok) 16%,var(--card));border-color:var(--ok)}
.f3-chip.bad{background:color-mix(in srgb,var(--bad) 16%,var(--card));border-color:var(--bad)}
.f3-chip.warn{background:color-mix(in srgb,var(--warn) 18%,var(--card));border-color:var(--warn)}
.f3-codes{display:grid;gap:10px}
@media(min-width:760px){.f3-codes{grid-template-columns:1fr 1fr}}
.f3-codes>div{min-width:0;display:grid;gap:6px;align-content:start}
.f3-code{margin:0;white-space:pre;overflow-x:auto;font-size:12px;line-height:1.55}
.f3-ln{display:block;padding:0 4px;border-radius:4px}
.f3-ln.aw{color:var(--ink)}
.f3-ln.hot{background:color-mix(in srgb,var(--acc) 22%,var(--soft));outline:1px solid var(--acc)}
.f3-hint{display:block;color:var(--acc);font-size:11.5px;font-weight:700;margin-top:4px}
.f3-boxes{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.f3-bx{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);display:grid;gap:6px;align-content:start;font-size:13px;min-width:0}
.f3-bx>div{display:flex;flex-wrap:wrap;gap:5px;min-height:24px;align-items:center}
.f3-bx b{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.f3-bx.hotbx{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card))}
.pg1-view{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:700px){.pg1-view{grid-template-columns:1fr 150px 1fr;align-items:start}}
.pg1-th{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card)}
.pg1-th.fin{opacity:.6}
.pg1-thh{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;font-size:14px}
.pg1-ins{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:7px;border:1px solid transparent;min-height:28px}
.pg1-ins.past{opacity:.45}
.pg1-ins.next{background:var(--soft);border-color:var(--acc)}
.pg1-arrow{font-size:12px;color:var(--acc);font-weight:700;margin-left:auto}
.pg1-reg{margin-top:4px;font-size:13px;color:var(--mut)}.pg1-reg b{color:var(--ink)}
.pg1-mem{text-align:center;border:2px dashed var(--line);border-radius:12px;padding:10px 6px;background:var(--soft)}
.pg1-mem small{color:var(--mut);text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.pg1-count{font-size:17px;margin:2px 0}.pg1-count b{font-size:30px;font-variant-numeric:tabular-nums}
.pg1-lock{font-size:13px;color:var(--ok)}.pg1-lock.held{color:var(--warn);font-weight:700}
.pg1-hist{display:grid;gap:4px}
.pg1-hh{margin-bottom:2px;font-size:14px}
.pg1-hr{display:grid;grid-template-columns:78px 1fr 28px;gap:8px;align-items:center;font-size:13px}

<script>
/* ---- tiny helpers shared by the chapters and playgrounds ---- */
const PG = {};
const COMMON = {};   // COMMON.<pgkey> = [...] overrides that chapter's common-problems list
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TIMERS = [];
function stopTimers() { while (TIMERS.length) { const t = TIMERS.pop(); clearInterval(t); clearTimeout(t); } }
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  const add = k => { if (k == null || k === false) return; if (Array.isArray(k)) k.forEach(add); else el.append(k.nodeType ? k : document.createTextNode(String(k))); };
  kids.forEach(add);
  return el;
}
function svg(tag, props, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in (props || {})) { const v = props[k]; if (v == null || v === false) continue; if (k === 'class') el.setAttribute('class', v); else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v); else el.setAttribute(k, v); }
  const add = k => { if (k == null || k === false) return; if (Array.isArray(k)) k.forEach(add); else el.append(k.nodeType ? k : document.createTextNode(String(k))); };
  kids.forEach(add);
  return el;
}
/* seeded random numbers, so every run of a playground repeats */
function rng(seed) { let a = (seed >>> 0) || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const bar = (...k) => h('div', { class: 'bar' }, ...k);
const btn = (label, fn, cls) => h('button', { class: cls || '', onclick: fn }, label);
const badge = (text, kind) => h('span', { class: 'badge ' + (kind || '') }, text);
const note = t => h('p', { class: 'note' }, t);
function seg(opts, val, cb) {          // opts: [{v,l}] or [v]; returns element with .value and .set(v)
  const el = h('div', { class: 'seg', role: 'group' });
  const norm = opts.map(o => (typeof o === 'object' ? o : { v: o, l: String(o) }));
  const paint = () => [...el.children].forEach((b, i) => b.classList.toggle('on', norm[i].v === el.value));
  norm.forEach(o => el.append(h('button', { onclick() { el.value = o.v; paint(); cb && cb(o.v); } }, o.l)));
  el.value = val; el.set = v => { el.value = v; paint(); }; paint(); return el;
}
function slider(label, min, max, val, step, cb, fmt) {   // returns <label> with .input and .value
  const out = h('b', {}, fmt ? fmt(val) : val);
  const input = h('input', { type: 'range', min, max, step: step || 1, value: val, 'aria-label': label });
  input.addEventListener('input', () => { out.textContent = fmt ? fmt(+input.value) : input.value; cb && cb(+input.value); });
  const el = h('label', { class: 'sl' }, label, input, out);
  Object.defineProperty(el, 'value', { get: () => +input.value, set: v => { input.value = v; out.textContent = fmt ? fmt(+v) : v; } });
  return el;
}
function player(o) {   // o.step() -> false when finished, o.reset(), o.speed ms per tick. returns element with .stop()
  let t = null;
  const stop = () => { if (t) { clearInterval(t); const i = TIMERS.indexOf(t); if (i >= 0) TIMERS.splice(i, 1); t = null; } play.textContent = '▶ Play'; };
  const tick = () => { if (o.step() === false) stop(); };
  const play = btn('▶ Play', () => { if (t) { stop(); return; } t = setInterval(tick, o.speed || 600); TIMERS.push(t); play.textContent = '⏸ Pause'; tick(); }, 'primary');
  const el = bar(play, btn('Step ›', () => { stop(); tick(); }), btn('⏮ Reset', () => { stop(); o.reset(); }));
  el.stop = stop; return el;
}
function logbox() {
  const el = h('div', { class: 'log', 'aria-live': 'polite' });
  return { el, add(text, cls) { el.append(h('div', { class: cls || '' }, text)); el.scrollTop = el.scrollHeight; }, clear() { el.textContent = ''; } };
}
function stat(items) {   // items: [{l, v, cls}] -> element; call el.update(items) to refresh
  const el = h('div', { class: 'stat' });
  el.update = its => { el.textContent = ''; its.forEach(i => el.append(h('div', { class: i.cls || '' }, h('small', {}, i.l), h('b', {}, i.v)))); };
  el.update(items || []); return el;
}
const API = { h, svg, rng, bar, btn, badge, note, seg, slider, player, logbox, stat, esc, timers: TIMERS };
/* static architecture diagram: spec = {w,h,boxes:[[id,x,y,w,h,label,tone]],arrows:[[from,to,label,dashed]],cap}; tone 0..7 picks a --p colour; '\n' splits lines */
function diagram(sp) {
  const B = {}; sp.boxes.forEach(b => { B[b[0]] = { x: b[1], y: b[2], w: b[3], h: b[4] }; });
  const s = svg('svg', { viewBox: `0 0 ${sp.w} ${sp.h}`, role: 'img', 'aria-label': sp.cap || 'diagram', style: 'width:100%;min-width:' + Math.min(sp.w, 540) + 'px;max-width:' + sp.w + 'px;height:auto;display:block;margin:0 auto' });
  s.append(svg('defs', {}, svg('marker', { id: 'ah', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, svg('path', { d: 'M0 0L10 5L0 10z', fill: 'currentColor' }))));
  const edge = (a, t) => { const cx = a.x + a.w / 2, cy = a.y + a.h / 2, dx = t.x + t.w / 2 - cx, dy = t.y + t.h / 2 - cy; const k = Math.min(dx ? (a.w / 2) / Math.abs(dx) : 1e9, dy ? (a.h / 2) / Math.abs(dy) : 1e9); return [cx + dx * k, cy + dy * k]; };
  (sp.arrows || []).forEach(([f, t, lab, dash]) => {
    const [x1, y1] = edge(B[f], B[t]), [x2, y2] = edge(B[t], B[f]);
    s.append(svg('line', { x1, y1, x2, y2, stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-dasharray': dash ? '5 4' : null, 'marker-end': 'url(#ah)', style: 'color:var(--mut)' }));
    if (lab) s.append(svg('text', { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 5, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--mut)' }, lab));
  });
  sp.boxes.forEach(([id, x, y, w, hh, lab, tone]) => {
    s.append(svg('rect', { x, y, width: w, height: hh, rx: 9, fill: tone == null ? 'var(--card)' : 'var(--p' + tone + ')', stroke: 'var(--line)', 'stroke-width': 1.5 }));
    const ls = String(lab).split('\n'), y0 = y + hh / 2 - (ls.length - 1) * 8 + 4;
    ls.forEach((l, i) => s.append(svg('text', { x: x + w / 2, y: y0 + i * 16, 'text-anchor': 'middle', 'font-size': 12.5, fill: 'var(--ink)', 'font-weight': i === 0 && ls.length > 1 ? 700 : 400 }, l)));
  });
  return h('figure', { class: 'arch' }, h('div', { class: 'svgw' }, s), sp.cap ? h('figcaption', { class: 'note' }, sp.cap) : null);
}
API.diagram = diagram;

const CHAPTERS=[
{ask:'Why does a loop over a million items take 1 ms one way and 100 ms another, on the same machine?',
 why:'Because a CPU is thousands of times faster than the memory, disk and network it waits on, and caches hide that gap only when access is predictable.',
 principle:'A CPU executes one instruction per cycle per core; reading RAM costs about a hundred cycles, an SSD a hundred thousand, a network hop millions. Programs are fast when they stay in cache.',
 design:'Keep hot data small and contiguous so it stays in cache, and treat every trip to RAM, disk or network as expensive work you must overlap or avoid.',
 scene:['Your service parses 1 million records. Written one way it takes 1 ms per thousand records; after a harmless-looking refactor (a list of objects instead of an array, or looping down columns instead of across rows) it takes 100 ms. Same CPU, same data, same result.','Before threads, locks or servers make sense you need a mental picture of the machine underneath: what the CPU does, where data lives, and what each place costs.'],
 idea:['A <b>CPU core</b> repeats: fetch an instruction, decode it, execute it, using a few <b>registers</b>. A modern chip has several cores, each able to run one instruction stream at a time.','Data lives in a <b>hierarchy</b>: registers (instant) → L1/L2/L3 <b>cache</b> (a few ns) → <b>RAM</b> (~100 ns) → <b>SSD</b> (~100 µs) → <b>network</b> (0.5 ms in a data centre, 150 ms across the world). Each step is roughly 10 to 1000 times slower.','The cache loads whole <b>cache lines</b> (64 bytes). Walking an array in order means one slow fetch serves many reads; jumping around means a slow fetch for every read.','Scale it to human time: if one CPU cycle were one second, a RAM read takes about 5 minutes, an SSD read about 4 days, a cross-continent packet about 15 years. Everything in this course is about not wasting those years.'],
 arch:{w:640,h:215,boxes:[['c0',20,15,130,60,'Core 0\nregisters + L1',0],['c1',170,15,130,60,'Core 1\nregisters + L1',0],['l3',20,105,280,40,'L3 cache (shared by all cores)',3],['ram',350,55,120,60,'RAM\n~100 ns',1],['ssd',510,10,110,50,'SSD\n~100 µs',2],['net',510,100,110,56,'Network\n0.5 – 150 ms',4]],arrows:[['c0','l3'],['c1','l3'],['l3','ram'],['ram','ssd'],['ram','net']],cap:'Each box to the right is roughly 10 to 1000 times slower to reach than the one before it.'},
 common:[

   viz:{bad:{rows:[{l:'8 items in RAM',cells:[['obj 1','bad'],['obj 2','bad'],['obj 3','bad'],['obj 4','bad'],['obj 5','bad'],['obj 6','bad'],['obj 7','bad'],['obj 8','bad']]}],bars:[['time for 8 reads',100,'bad','8 misses × 100 ns = 800 ns']],cap:'Every item sits in a different cache line, so every read is a miss.'},
        good:{rows:[{l:'8 items in RAM',cells:[['v1 v2 v3 v4 v5 v6 v7 v8: one 64-byte cache line','ok']]}],bars:[['time for 8 reads',14,'ok','1 miss + 7 hits ≈ 107 ns']],cap:'Contiguous data: one trip to RAM serves eight reads.'}},
   fix:['Measure first: <code>perf stat</code> or a profiler shows the cache-miss rate.','Store hot data contiguously: arrays, NumPy, primitive arrays, struct-of-arrays.','Walk memory in order (row by row) and keep the working set small.','Measure again: a layout fix should give several times, not a few percent.']},
  {t:'False sharing between cores',tab:'False sharing',
   sym:'Adding threads makes a counter benchmark slower, although each thread only touches its own variable.',

   why:'Cores own cache lines, not variables. When core 0 writes its counter, core 1\'s copy of the whole line is invalidated, and the other way round. The line bounces between the cores on every write.',
   log:{text:'perf c2c report\n  Shared Cache Line Distribution Pareto\n  HITM (hit in another core\'s modified line): 41.7 %\n  line 0x7f3a...c0  <- two threads write different offsets',note:'Representative perf c2c output (Linux). The other signal is throughput that falls when you add threads.'},

   fix:['Pad or align each hot per-thread variable to its own 64-byte line (<code>@Contended</code>, padding fields, <code>alignas(64)</code>).','Or keep one counter per thread and add them up when reading (<code>LongAdder</code>).','Confirm with <code>perf c2c</code>, and benchmark with 1, 2, 4 and 8 threads.']},
  {t:'Running out of RAM and swapping',tab:'Out of RAM',

   why:'When RAM is full the OS either swaps pages to disk (a disk access is about a million times slower than RAM) or the kernel OOM killer ends the process.',

        good:{rows:[{l:'RAM, 12 GB limit',cells:[['heap 8 GB','ok',8],['native + stacks 3 GB','ok',3],['free','off',1]]},{l:'disk (swap)',cells:[['unused','off']]}],bars:[['access time',1,'ok','~100 ns: everything stays in RAM']],cap:'Heap sized to about 70% of the limit leaves room for everything else.'}},
   fix:['Set the heap to about 70% of the container limit (<code>-XX:MaxRAMPercentage=70</code>).','Stream or chunk big inputs instead of loading them whole.','Alert on RSS, working set, swap use and the OOMKilled restart count.','Load-test with production-sized data before release.']},
  {t:'Treating a network call like a function call',tab:'N+1 network calls',
   sym:'A page that is instant in development takes seconds in production, while the CPU is almost idle.',
   ctx:'A loop fetches one row per iteration: for each of 1,000 orders, load its customer. In development the database is on localhost (0.05 ms away); in production it is 0.5 ms away.',
   seen:'The N+1 query problem in Rails, Django and Hibernate/JPA, GraphQL resolvers that call a service per item, microservices calling each other inside a loop.',
   why:'Each call waits a full round trip while the CPU does nothing, and the latency multiplies by the number of items. A step a million times slower than a function call hides inside what looks like one.',
   log:{text:'pg_stat_statements (one request)\n  SELECT * FROM orders                      calls: 1\n  SELECT * FROM customers WHERE id = $1     calls: 1000   mean: 0.5 ms',note:'Representative output. Tracing shows the same thing as a comb of many short spans.'},
   viz:{bad:{rows:[{l:'one request',cells:[['q','bad'],['q','bad'],['q','bad'],['q','bad'],['q','bad'],['q','bad'],['q','bad'],['q','bad'],['q','bad'],['q','bad'],['… ×1000','off',3]]}],bars:[['total time',100,'bad','1,001 round trips ≈ 500 ms']],cap:'The CPU waits between every small query.'},
        good:{rows:[{l:'one request',cells:[['one query: JOIN or WHERE id IN (...)','ok']]}],bars:[['total time',3,'ok','1 round trip ≈ 5 ms']],cap:'One round trip fetches everything.'}},
   fix:['Count queries per request in tests and traces.','Batch: one query with a <code>JOIN</code> or <code>WHERE id IN (...)</code>; eager loading (<code>select_related</code>, <code>include</code>, <code>JOIN FETCH</code>).','Cache lookups that repeat.','Fail CI when a request runs more than N queries.']}],
 pg:'f1'},

{ask:'You have a CPU-heavy job and 8 cores. How do you use them, and why is the speedup never 8 times?',
 why:'Because only as many threads run at once as there are cores, threads share memory, and the part of the job that cannot be split limits the total gain.',
 principle:'A process owns an address space; its threads share it but each has its own stack. The scheduler runs one thread per core and time-slices the rest. Parallelism needs cores; the serial fraction caps the speedup (Amdahl\'s law).',
 design:'For CPU-bound work use about one worker per core, share as little as possible, cut the serial part, and measure the speedup instead of assuming it.',
 scene:['A nightly job resizes 10,000 images. On one core it takes 40 minutes, and the server has 8 cores. The team adds 8 threads in Python and nothing gets faster. They switch to 8 processes and it takes 9 minutes: 4.4 times faster, not 8. Meanwhile the web server that starts one thread per request slows down at 2,000 users.','To use the cores well you need to know what a process and a thread are, what the scheduler does with them, and why <i>concurrent</i> is not the same as <i>parallel</i>.'],
 idea:['A <b>process</b> is a running program with its own <b>address space</b> (code, heap, stack). Processes cannot read each other\'s memory, so one crash does not take the others down.','A <b>thread</b> runs <i>inside</i> a process. Threads share the heap and code but each has its own stack and registers. Sharing is cheap, and that is exactly why races are easy.','The <b>scheduler</b> puts at most one thread on each core, gives each a <b>time slice</b> (a few ms), then does a <b>context switch</b>: save registers, load another thread\'s, lose some cache warmth. More runnable threads than cores means waiting in line plus switching cost.','<b>CPU-bound</b> work keeps a core busy computing (image resizing, compression, encryption, parsing). Only more cores help, and one worker per core is the sweet spot.','<b>Concurrent</b> = several tasks in progress, interleaved even on one core (about structure). <b>Parallel</b> = several tasks running at the same instant on different cores (about speed). On one core, interleaving CPU work is never faster.','<b>Amdahl\'s law</b>: if a fraction <i>s</i> of the job is serial, the best speedup on N cores is 1 ÷ (s + (1 − s) ÷ N). With 5% serial work the limit is 20 times, however many cores you add.'],
 arch:{w:640,h:200,boxes:[['pa',15,15,130,56,'Process A\nown memory',0],['heap',200,8,150,36,'heap + code (shared)',2],['s1',200,54,70,34,'stack T1',3],['s2',280,54,70,34,'stack T2',3],['pb',15,120,130,56,'Process B\nown memory',1],['hb',200,128,150,36,'its own heap + code',2],['k',430,60,185,66,'Kernel scheduler\nputs threads on cores',5]],arrows:[['pa','heap'],['pa','s1'],['pa','s2'],['pb','hb'],['s1','k'],['s2','k'],['hb','k']],cap:'Threads of one process share the heap; processes share nothing unless they ask for it.'},

   fix:['Size CPU-bound pools to about the core count and check <code>vmstat</code> (r, cs, sy).','Use async I/O or lightweight threads for work that mostly waits, instead of more OS threads.','Bound the pool and its queue; reject or shed load instead of starting more threads.','Measure throughput at several pool sizes and pick the knee of the curve.']},

   sym:'Counters are wrong, a map crashes with "concurrent map writes", or a loop never ends, only under load.',

   seen:'Go <code>fatal error: concurrent map writes</code>; Java 7 <code>HashMap.put</code> could spin forever in a resize; Python <code>x += 1</code> from several threads loses updates.',
   why:'Threads of one process share the heap and nothing orders their reads and writes. The CPU can switch between the load and the store of a single <code>x += 1</code>.',
   log:{text:'fatal error: concurrent map writes\n\ngoroutine 18 [running]:\nmain.(*Cache).Set(...)\n\n==================\nWARNING: DATA RACE   (go test -race)\nWrite at 0x00c000124018 by goroutine 8\nPrevious write at 0x00c000124018 by goroutine 7',note:'Representative Go output. The race detector prints both conflicting accesses with stack traces.'},
   viz:{bad:{rows:[{l:'thread A',cells:[['load x = 5','warn'],['add 1','warn'],['store 6','bad']]},{l:'thread B',cells:[['load x = 5','warn'],['add 1','warn'],['store 6','bad']]}],bars:[['x after two "x += 1"',50,'bad','6 instead of 7: one update was lost']],cap:'Both threads loaded 5 before either stored.'},
        good:{rows:[{l:'thread A',cells:[['lock','ok'],['load 5','ok'],['store 6','ok'],['unlock','ok'],['','off',4]]},{l:'thread B',cells:[['waits for lock','off',4],['lock','ok'],['load 6','ok'],['store 7','ok']]}],bars:[['x after two "x += 1"',100,'ok','7']],cap:'The lock makes load-add-store one step at a time.'}},
   fix:['Share less: give each thread its own data and merge the results at the end.','Guard what must be shared with a mutex, an atomic, or a thread-safe type (<code>sync.Map</code>, <code>ConcurrentHashMap</code>, <code>queue.Queue</code>).','Run the race detector in CI (<code>go test -race</code>, ThreadSanitizer).','Treat any unsynchronised read of data that another thread writes as a bug.']},
  {t:'CPU-bound threads in CPython (the GIL)',tab:'Python GIL',
   sym:'A CPU-heavy Python script uses 4 threads and is no faster than one thread, sometimes slower.',
   ctx:'A script hashes 10,000 files with <code>ThreadPoolExecutor(max_workers=4)</code> on a 4-core machine.',
   seen:'CPython <code>ThreadPoolExecutor</code> on CPU work; Ruby MRI has a similar global lock; free-threaded Python builds (3.13 and later) are optional and not yet the default.',
   why:'CPython has a Global Interpreter Lock: only one thread runs Python bytecode at a time. CPU-bound threads take turns on one core while the others wait, so there is no parallelism.',
   log:{text:'top -H -p 4101\n  PID    %CPU  COMMAND\n  4101   25.0  python     # 4 threads x 25%\n  4102   25.0  python\n  4103   24.8  python\n  4104   25.1  python\n# total about 100%: one core busy, three idle',note:'Representative output. Sum the per-thread CPU: if it never exceeds one core, the GIL is the limit.'},
   viz:{bad:{rows:[{l:'core 0',cells:[['T1','warn'],['T2','warn'],['T3','warn'],['T4','warn']]},{l:'cores 1 to 3',cells:[['idle','off',4]]}],bars:[['wall time',100,'bad','4.0 s (same as one thread)']],cap:'The four threads run one after another.'},
        good:{rows:[{l:'core 0',cells:[['process 1','ok']]},{l:'core 1',cells:[['process 2','ok']]},{l:'core 2',cells:[['process 3','ok']]},{l:'core 3',cells:[['process 4','ok']]}],bars:[['wall time',28,'ok','~1.1 s with 4 processes']],cap:'Each process has its own interpreter and its own GIL.'}},
   fix:['Use <code>ProcessPoolExecutor</code> or <code>multiprocessing</code> for CPU-bound work.','Use libraries that release the GIL while computing (NumPy, hashlib on large buffers, native extensions).','Chunk the tasks so the data pickled between processes stays small.','Consider a free-threaded build once your dependencies support it.']},
  {t:'Wrong core count inside containers',tab:'Container cores',
   sym:'A service on a big node is slow and shows CPU throttling, although the node is mostly idle.',
   ctx:'A Go service runs in Kubernetes with a CPU limit of 2 on a 64-core node. The Go runtime sees 64 cores.',
   seen:'Go services without <code>automaxprocs</code> (newer Go releases are container-aware), JVMs and .NET before container-aware limits, Node pools sized from <code>os.cpus().length</code>.',
   why:'The runtime sizes its threads by the host cores (64), but the cgroup only allows 2 cores of CPU time per period. The 64 threads use up the quota in a few ms and are then frozen until the next period.',
   log:{text:'cat /sys/fs/cgroup/cpu.stat\nnr_periods      12000\nnr_throttled     9100        # throttled in 76% of periods\nthrottled_usec  840000000\n\nGOMAXPROCS=64 (default on a 64-core host)',note:'Representative cgroup v2 cpu.stat. In Prometheus: container_cpu_cfs_throttled_periods_total.'},
   viz:{bad:{rows:[{l:'quota per 100 ms',cells:[['200 ms of CPU time (2 cores)','warn']]},{l:'64 threads run',cells:[['run 3 ms: quota spent','bad',1],['frozen 97 ms (throttled)','bad',9]]}],bars:[['p99 latency',100,'bad','spikes of about 100 ms']],cap:'Lots of threads burn the quota at once, then everything waits.'},
        good:{rows:[{l:'GOMAXPROCS = 2',cells:[['2 threads run the whole period','ok']]}],bars:[['p99 latency',10,'ok','steady']],cap:'Thread count matches the CPU the container may actually use.'}},
   fix:['Set GOMAXPROCS and thread pools from the cgroup limit (<code>automaxprocs</code>, container-aware runtime settings).','Watch CPU <i>throttling</i> metrics, not only CPU usage.','For latency-sensitive services consider requests = limits, or a limit that is not too tight.','Load-test inside the same container limits you run in production.']},
  {t:'The serial part caps the speedup',tab:'Amdahl: serial part',
   sym:'Going from 8 to 32 cores barely helps: the job runs about 3 times faster on 32 cores, not 30.',
   ctx:'A report job parses files in parallel, then every worker writes into one output file under a lock, then merges. The output step is 30% of the time.',
   seen:'Spark or MapReduce stages waiting for the slowest task, a single synchronized logger or database writer, one global lock around the hot path.',
   why:'Amdahl\'s law: with 30% serial work the limit is 1 ÷ 0.30 = 3.3 times, however many cores you add. The serial part takes the same time whatever the number of workers.',
   log:{text:'time ./report --workers 8     real 1m40s\ntime ./report --workers 32    real 1m10s   # 4x workers, 1.4x faster\n\nperf lock:  31% of wall time waiting on output_mu',note:'Representative output. Adding workers stops helping when most of the time is in one lock or one writer.'},
   viz:{bad:{rows:[{l:'1 core',cells:[['parallel 70','ok',7],['serial 30','bad',3]]},{l:'32 cores',cells:[['·','ok',0.3],['serial 30','bad',3]]}],bars:[['speedup',10,'bad','3.1 times (ideal would be 32)']],cap:'The parallel part shrinks 32 times; the serial part does not shrink at all.'},
        good:{rows:[{l:'32 cores, serial part cut to 3%',cells:[['·','ok',0.3],['serial 3','bad',0.3]]}],bars:[['speedup',51,'ok','16 times']],cap:'Shrinking the serial part is worth more than adding cores.'}},
   fix:['Find the serial section (a lock, a single writer, a final merge) with a profiler.','Shrink it: shard the output, use per-worker buffers, parallel reduce, lock-free structures.','Re-measure the serial fraction and attack the biggest serial piece first.','Do not buy more cores until the serial fraction is small.']}],

{ask:'One thread must serve 10,000 connections that spend 99% of their time waiting. How, without 10,000 threads?',
 why:'By never blocking: start the I/O, go and do other work, and come back when the OS says it is ready. That is an event loop, and async/await is the way to write it.',
 principle:'A blocking call parks the thread until it finishes. A non-blocking call returns at once and the result arrives later as an event, callback, future or <code>await</code>. I/O-bound work needs overlapped waiting, not more cores.',
 design:'Use an event loop (epoll/kqueue/io_uring) with non-blocking I/O, or lightweight threads that the runtime parks for you. Never run long CPU work or blocking calls on the loop.',
 scene:['A chat server holds 10,000 open connections and a batch job calls a payment API 10,000 times. Both spend 99% of their time <i>waiting</i>: the CPU is idle, so more cores do nothing. One thread per connection would need 10,000 stacks and 10,000 context-switch candidates, almost all asleep.','An event loop serves the same users with one thread and a little memory. Until the day someone adds one synchronous call inside a handler, and every user freezes for two seconds.'],
 idea:['<b>I/O-bound</b> work mostly waits for a disk, database or network reply. The CPU is idle while it waits, so the speedup comes from <i>overlapping waits</i>. Rule of thumb: workers ≈ cores × (1 + wait ÷ compute).','<b>Blocking</b>: the call does not return until done and the thread waits. <b>Non-blocking</b>: the call returns at once ("not ready yet") and you ask again or are notified.','<b>Synchronous</b> vs <b>asynchronous</b> is about how you get the result: wait for it in line (sync) or be notified later (async). Blocking vs non-blocking is about what the thread does meanwhile.','An <b>event loop</b> asks the OS "which of these sockets are ready?" (<code>epoll</code>, <code>kqueue</code>), runs the matching <b>callback</b>, and repeats. One thread, many connections.','<b>Callbacks</b> nest and lose errors; <b>promises/futures</b> chain them; <b>coroutines</b> (<code>async/await</code>) let you write straight-line code where each <code>await</code> is a point at which the function pauses and the loop runs something else.','Go goroutines and Java virtual threads give the same effect differently: the runtime parks a lightweight thread on a blocking call and runs another one.'],
 arch:{w:640,h:190,boxes:[['cl',10,60,100,56,'10,000\nclients',0],['loop',160,10,150,56,'Event loop\n1 thread',3],['q',160,112,150,56,'ready callbacks\n(queue)',4],['os',370,10,130,56,'OS\nepoll / kqueue',5],['io',540,10,90,56,'network\ndisk',2]],arrows:[['cl','loop'],['loop','os'],['os','io'],['os','q','ready'],['q','loop']],cap:'The loop never waits for I/O; it waits for "something is ready".'},
 common:[
  {t:'Blocking the event loop',tab:'Blocking the loop',
   sym:'Every request stalls at the same moment for a second or two, although CPU and network look fine.',
   ctx:'One handler makes a synchronous call (a sleep, a blocking HTTP client, a large JSON parse, a sync file read). While it runs, nothing else on the loop runs.',
   seen:'Node.js <code>fs.readFileSync</code>, <code>JSON.parse</code> of a huge body, <code>crypto.pbkdf2Sync</code>; Python asyncio calling <code>time.sleep()</code> or <code>requests.get()</code> inside <code>async def</code>.',
   why:'There is one thread. A callback or coroutine that does not return control to the loop freezes all other connections until it finishes.',
   log:{text:'asyncio (debug mode)\nWARNING Executing <Task pending name=\'Task-3\' coro=<handler() running at app.py:12>> took 2.001 seconds\n\nNode: monitorEventLoopDelay  max = 1.95 s   p99 = 1.9 s',note:'Representative output. Event-loop lag (Node monitorEventLoopDelay, asyncio slow-callback warning) is the signal to alert on.'},
   viz:{bad:{rows:[{l:'event loop (1 thread)',cells:[['request 1','ok'],['sync call: 2 s','bad',4],['request 2 waits','warn']]},{l:'the other 9,999 connections',cells:[['frozen until the loop is free','bad']]}],bars:[['p99 latency',100,'bad','about 2 s']],cap:'One blocking call holds the only thread.'},
        good:{rows:[{l:'event loop (1 thread)',cells:[['req 1','ok'],['req 2','ok'],['req 3','ok'],['req 4','ok'],['req 5','ok']]},{l:'the sync work',cells:[['worker thread / process pool','off',3]]}],bars:[['p99 latency',2,'ok','about 20 ms']],cap:'The loop only starts and finishes work; blocking work lives elsewhere.'}},
   fix:['Use the async version of the call (<code>await asyncio.sleep</code>, aiohttp, <code>fs.promises</code>).','Move blocking or CPU-heavy work to a thread or process pool (<code>run_in_executor</code>, <code>worker_threads</code>).','Measure event-loop lag and alert on it; run asyncio in debug mode in tests.','Keep every callback short: it should return control quickly.']},
  {t:'Forgotten await and lost errors',tab:'Forgotten await',
   sym:'The user sees "OK" but the work never happened, or a process crashes later with an unhandled rejection.',
   ctx:'A handler starts an async operation and returns without awaiting it or checking its result.',
   seen:'Python <code>RuntimeWarning: coroutine was never awaited</code>; JavaScript fire-and-forget promises ending in <code>UnhandledPromiseRejection</code> (a process crash since Node 15); Go goroutines launched without error handling.',
   why:'Calling an async function only creates the task or coroutine. If nobody awaits or observes it, its failure is lost and the caller cannot know whether it finished.',
   log:{text:'RuntimeWarning: coroutine \'save_order\' was never awaited\n  save_order(order)\n\nnode:internal/process/promises:394\n  triggerUncaughtException(err, true)\n[UnhandledPromiseRejection: ... code: \'ERR_UNHANDLED_REJECTION\']',note:'Representative Python and Node messages.'},
   viz:{bad:{rows:[{l:'handler',cells:[['save_order()  (not awaited)','warn'],['return OK','ok']]},{l:'save_order',cells:[['never ran, or failed unseen','bad',2]]}],bars:[['orders saved',0,'bad','0 of 1, and the user was told OK']],cap:'The handler finished before the work did, and nobody sees the error.'},
        good:{rows:[{l:'handler',cells:[['await save_order()','ok'],['saved','ok'],['return OK','ok']]}],bars:[['orders saved',100,'ok','1 of 1; errors reach the handler']],cap:'Await (or collect) every task and handle its error.'}},
   fix:['Await every coroutine, or collect them (<code>asyncio.gather</code>, <code>Promise.all</code>, <code>errgroup</code>).','Add a top-level handler that logs unhandled rejections and task exceptions.','Turn on linters (no-floating-promises, ruff/pyright for unawaited coroutines).','For deliberate fire-and-forget, attach an error callback explicitly.']},
  {t:'No backpressure: unbounded concurrency',tab:'No backpressure',
   sym:'Memory grows steadily under load until the process is killed; latency climbs before that.',
   ctx:'Requests arrive at 1,000 per second, the downstream handles 200 per second, and every request is accepted and queued or given its own task.',
   seen:'A Go handler that does <code>go process(req)</code> per request, a Node stream piped into a slow sink without backpressure, an unbounded queue in front of a consumer.',
   why:'Non-blocking makes it easy to start work faster than it finishes. Nothing slows the producer down, so the backlog (and its memory) grows without limit.',
   log:{text:'kubectl get pod api  ->  OOMKilled (restarts: 14)\n\nmetrics\n  goroutines      1,482,330   (was 800)\n  queue_depth     3,900,000\n  rss_bytes       7.8e9',note:'Representative metrics: queue depth and task count climbing without bound.'},
   viz:{bad:{rows:[{l:'arrivals 1,000/s',cells:[['in','warn',5]]},{l:'processing 200/s',cells:[['done','ok',1],['queued, growing','bad',4]]}],bars:[['memory',100,'bad','grows until OOM kill']],cap:'The queue absorbs the excess until memory runs out.'},
        good:{rows:[{l:'arrivals 1,000/s',cells:[['accepted','ok',2],['rejected (429) or slowed','warn',3]]},{l:'processing 200/s',cells:[['bounded queue','ok',1]]}],bars:[['memory',20,'ok','flat']],cap:'A bounded queue pushes back on the producer.'}},
   fix:['Bound everything: worker pools, semaphores, bounded queues, stream backpressure.','Shed load early: return 429 or drop the oldest work instead of queueing for ever.','Set timeouts on queued work so stale requests are not processed.','Alert on queue depth and task count, not only CPU.']},
  {t:'Sync-over-async: thread-pool starvation',tab:'Pool starvation',
   sym:'The service hangs although CPU is idle; thread dumps show every pool thread waiting.',
   ctx:'A task running in a bounded pool waits for a sub-task that is submitted to the same pool (<code>future.get()</code>, <code>task.Result</code>).',
   seen:'.NET <code>.Result</code> or <code>.Wait()</code> on async code (thread-pool starvation), Java <code>future.get()</code> in a fixed pool, <code>CompletableFuture</code> joins inside the common pool.',
   why:'Waiting consumes a pool thread, and the awaited work needs a free pool thread to start. When every thread is waiting, none can run the work they wait for.',
   log:{text:'"pool-1-thread-1" WAITING  at java.util.concurrent.FutureTask.get()\n"pool-1-thread-2" WAITING  at java.util.concurrent.FutureTask.get()\n"pool-1-thread-3" WAITING  at java.util.concurrent.FutureTask.get()\n"pool-1-thread-4" WAITING  at java.util.concurrent.FutureTask.get()\n# queue: 12 tasks, none can run',note:'Representative jstack output; .NET reports it as ThreadPool starvation in diagnostics.'},
   viz:{bad:{rows:[{l:'pool of 4 threads',cells:[['T1 waits for child','bad'],['T2 waits for child','bad'],['T3 waits for child','bad'],['T4 waits for child','bad']]},{l:'child tasks',cells:[['queued: no free thread','warn',4]]}],bars:[['progress',0,'bad','deadlock']],cap:'Parents hold all the threads that the children need.'},
        good:{rows:[{l:'pool A (parents)',cells:[['T1 awaits','ok'],['T2 awaits','ok']]},{l:'pool B (children)',cells:[['children run here','ok',2]]}],bars:[['progress',100,'ok','completes']],cap:'Separate pools, or await without blocking a thread.'}},
   fix:['Go async all the way: do not block a pool thread to wait for async work.','Use separate pools (or executors) for parent and child tasks.','Add timeouts to every <code>get()</code>/<code>Wait()</code> so a stall becomes an error.','Alert on pool queue length and active-thread count.']},
  {t:'Wrong pool for the kind of work',tab:'Wrong pool size',
   sym:'Throughput is poor while CPU is almost idle; or CPU is saturated by a pool that was sized for waiting.',
   ctx:'Blocking HTTP calls run inside a pool sized to the number of cores, or heavy computation runs in a pool of hundreds of threads.',
   seen:'Java <code>parallelStream()</code> or <code>supplyAsync</code> using the common ForkJoinPool (sized to cores) for blocking calls; a 200-thread pool for pure computing.',
   why:'A pool sized for computing cannot overlap waits (8 threads = 8 requests in flight), and a pool sized for waiting makes computing threads fight for cores.',
   log:{text:'jstack: "ForkJoinPool.commonPool-worker-1" TIMED_WAITING\n        at java.net.SocketInputStream.socketRead0\n\ntop: %Cpu(s): 6.0 us    # cores nearly idle, all 8 workers blocked on sockets',note:'Representative output: all workers in socket reads, CPU nearly idle.'},
   viz:{bad:{rows:[{l:'common pool: 8 threads (= cores)',cells:[['wait','bad'],['wait','bad'],['wait','bad'],['wait','bad'],['wait','bad'],['wait','bad'],['wait','bad'],['wait','bad']]}],bars:[['requests in flight',8,'bad','8 at a time']],cap:'Every thread is blocked on the network; the rest queue.'},
        good:{rows:[{l:'I/O pool: 100 threads',cells:[['wait','ok'],['wait','ok'],['wait','ok'],['wait','ok'],['wait','ok'],['wait','ok'],['wait','ok'],['… ×100','off',2]]}],bars:[['requests in flight',100,'ok','100 at a time']],cap:'A separate, larger pool for blocking I/O (or async I/O).'}},
   fix:['Use separate pools: a small one for CPU work, a larger one for blocking I/O, each named and monitored.','Size the I/O pool from the formula cores × (1 + wait ÷ compute), then measure.','Never run blocking calls in a shared common pool.','Prefer non-blocking clients or virtual threads where available.']}],

{ask:'Two threads each run count++ one million times. Why is the total almost never 2,000,000?',
 why:'Because count++ is three steps (load, add, store) and the scheduler may switch threads between any two of them.',
 principle:'An operation that looks like one step is several machine steps. Mutual exclusion makes a critical section behave as one.',
 design:'Wrap the read-modify-write in a mutex so only one thread is inside at a time. Keep the section short.',
 scene:['A web service keeps a request counter in memory. Two worker threads both do <code>count++</code> per request. The dashboard shows 1,873,402 after 2,000,000 requests, and a different wrong number after every run.','Nothing crashes, no error is logged. The number is just quietly wrong.'],
 idea:['A <b>thread</b> has its own stack and registers but shares the heap with every other thread in the process.','The scheduler can <b>preempt</b> a thread between any two instructions, so the order of steps (the <b>interleaving</b>) is not under your control.','<code>count++</code> is really <code>load</code>, <code>add</code>, <code>store</code>. Two threads can both load the same old value, so one update is lost.','A <b>mutex</b> makes the section <b>atomic</b>: one thread in, the others wait. Kernel threads are scheduled by the OS, user threads by a library; M:N maps many user threads onto fewer kernel threads.'],
 common:[
  {t:'Lost update on a shared counter',ex:'Go: <code>counter++</code> from many goroutines (caught by <code>go run -race</code>). Java: a plain <code>int</code> field. Python: <code>x += 1</code> on a global is several bytecodes, so it loses updates even with the GIL.',why:'Read-modify-write is not atomic; two threads read the same old value.',fix:'Use a mutex or an atomic (<code>sync/atomic</code>, <code>AtomicLong</code>/<code>LongAdder</code>, <code>threading.Lock</code>), or keep per-thread counters and sum them.'},
  {t:'Check-then-act (TOCTOU) race',ex:'<code>if (!cache.containsKey(k)) cache.put(k, load())</code> on a thread-safe map still loads twice; a lazy singleton with double-checked locking without <code>volatile</code> was broken in Java before 5; "if file does not exist then create" is the classic security bug.',why:'Each call is safe alone, but the gap between the check and the action lets another thread in.',fix:'Make the check and the action one atomic operation (<code>computeIfAbsent</code>, <code>sync.Once</code>, <code>O_CREAT|O_EXCL</code>, a unique constraint).'},
  {t:'Forgetting to unlock, or locking too little',ex:'An exception or early <code>return</code> skips <code>mu.Unlock()</code> and the next caller hangs; a lock around only the store (not the load) still races. Go: copying a struct that contains a <code>sync.Mutex</code> by value copies the lock state (<code>go vet</code> copylocks).',why:'The lock must cover the whole invariant, and be released on every path.',fix:'<code>defer mu.Unlock()</code>, <code>with lock:</code>, <code>try/finally</code>; never copy a mutex; lock the whole read-modify-write.'},
  {t:'Visibility: one thread never sees the other\'s write',ex:'Java <code>while (!stopped) {}</code> with a non-volatile flag can loop forever; the JIT may hoist the read out of the loop.',why:'Without synchronisation the compiler and CPU may cache or reorder reads and writes.',fix:'Use <code>volatile</code>, atomics, locks or channels: anything that creates a happens-before edge.'}],
