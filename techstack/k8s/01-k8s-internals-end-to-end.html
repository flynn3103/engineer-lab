<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kubernetes · course</title>
<link rel="stylesheet" href="../../assets/lab.css">
<style>
:root{--acc:#0f9d8a;--acc2:#d6456b}
@media(prefers-color-scheme:dark){:root{--acc:#3ccfb8;--acc2:#ff7aa0}}
body{font-size:16px}
.topbar .wrap{min-height:50px}
.topbar .crumb{color:var(--mut);font-size:14px;text-decoration:none}
.topbar .crumb:hover{color:var(--ink)}
.hero{padding:34px 0 10px}
.hero .lead{max-width:60ch}
.part{margin:28px 0 10px}
.part h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 4px}
.part p{margin:0 0 12px;color:var(--mut);font-size:14.5px;max-width:64ch}
.map{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.tile{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:0;height:100%;width:100%}
.tile:hover{border-color:var(--acc);transform:translateY(-2px)}
.tile .n{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--pc);border:1px solid var(--line)}
.tile b{display:block;font-size:15px;line-height:1.3}
.tile small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;line-height:1.35}
.chhead{display:flex;gap:12px;align-items:center;margin:22px 0 4px}
.chhead .n{flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;background:var(--pc);border:1px solid var(--line)}
.chhead h1{font-size:clamp(22px,4.6vw,30px);letter-spacing:-.4px}
.chhead small{display:block;color:var(--mut);font-size:13px}
.ask{font-size:clamp(17px,2.8vw,20px);margin:8px 0 18px;max-width:62ch}
.blk{margin:0 0 16px}
.blk>h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.blk>h3 i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--on-brand,#fff);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.idea{margin:0;padding-left:20px}.idea li{margin:5px 0}
.pg{display:grid;gap:12px}
.pgwhy{margin:0;color:var(--mut);font-size:14px}
.cp{display:grid;gap:10px}
@media(min-width:760px){.cp{grid-template-columns:repeat(3,1fr)}}
.cp>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.cp b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.cp .s b{color:var(--bad)}.cp .c b{color:var(--warn)}.cp .f b{color:var(--ok)}
.cp p{margin:0;font-size:14.5px}
.quiz .q{font-weight:600;margin:0 0 8px}
.quiz .opts{display:grid;gap:6px}
.quiz .opts button{text-align:left;min-height:0;padding:9px 12px}
.quiz .opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.quiz .opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.quiz .why{margin-top:8px}
.pn{display:flex;justify-content:space-between;gap:8px;margin:22px 0 40px}
.pn button{max-width:48%;text-align:left}
.pn button:last-child{margin-left:auto;text-align:right}
/* ---- playground kit ---- */
.pgbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.pgbox .bar{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;min-height:36px;padding:6px 12px;font-size:13.5px;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:var(--on-brand,#fff);font-weight:600}
.sl{display:inline-flex;align-items:center;gap:8px;flex-wrap:nowrap}
.sl input{width:130px}.sl b{color:var(--ink);font-weight:600;min-width:2ch;font-variant-numeric:tabular-nums}
.out{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;min-width:0}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.badge.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.badge.info{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line));background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.log{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card)}
.log div{padding:1px 0;border-bottom:1px dashed var(--line)}.log div:last-child{border:0}
.log .bad{color:var(--bad)}.log .ok{color:var(--ok)}.log .mut{color:var(--mut)}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat>div{border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--card);min-width:84px}
.stat small{display:block;color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat .bad b{color:var(--bad)}.stat .ok b{color:var(--ok)}
.svgw{overflow-x:auto;overscroll-behavior-x:contain}.svgw svg{display:block;max-width:100%}
.cols{display:grid;gap:12px}
@media(min-width:760px){.cols.two{grid-template-columns:1fr 1fr}.cols.three{grid-template-columns:repeat(3,1fr)}}
.cols>*{min-width:0}
@media(max-width:560px){.chhead{margin-top:14px}}
.prob{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc2);border-radius:12px;padding:12px 16px;margin:0 0 6px}
.prob p{margin:0 0 .5em}.scene p:last-child{margin:0}
.prob .q{font-weight:700;font-size:clamp(17px,2.6vw,19px)}
.arch{margin:0}.arch figcaption{text-align:center}
.arch svg{overflow:visible}
.common{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.common>div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);display:grid;gap:5px;align-content:start}
.common h4{font-size:15px;line-height:1.3;margin:0}.common h4 i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;margin-right:6px;vertical-align:1px}
.common p{margin:0;font-size:14px}
.common b{font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-right:6px}
.common .e b{color:var(--acc2)}.common .c b{color:var(--warn)}.common .f b{color:var(--ok)}
.sw{display:flex;gap:6px;margin-left:auto}
.sw a{font-size:13px;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}
.sw a:hover{color:var(--ink);border-color:var(--acc)}.sw a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.ctabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.ctab{border-radius:999px;font-size:14px;padding:7px 14px;min-height:0}
.ctab.on{color:var(--ink);background:color-mix(in srgb,var(--acc2) 14%,var(--card));border-color:var(--acc2);font-weight:700}
.cbody{display:grid;gap:12px}
.ctitle{font-size:clamp(20px,3.6vw,26px);letter-spacing:-.3px;margin:4px 0 0}
.csym{font-size:clamp(16px,2.4vw,18.5px);margin:0}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.ccard h5{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 6px}
.ccard h5:not(:first-child){margin-top:12px}
.ccard p{margin:0 0 .5em;font-size:15px}.ccard .seen b{color:var(--acc2);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.ccard pre{font-size:12.5px}
.vizc{background:var(--soft)}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.vrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin:6px 0}
@media(max-width:620px){.vrow{grid-template-columns:1fr;gap:4px}}
.vl{font-size:13px;color:var(--mut)}
.vcells{display:flex;gap:6px;min-width:0}
.vc{flex:1 1 0;min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;font-size:12.5px;background:var(--card);overflow-wrap:anywhere}
.vc.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.vc.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--card))}
.vc.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,var(--card))}
.vc.off{border-style:dashed;color:var(--mut);background:transparent}
.vbar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
@media(max-width:620px){.vbar{grid-template-columns:1fr}}
.vtrack{height:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vtrack i{display:block;height:100%;border-radius:8px;transition:width .35s}
.vtrack i.bad{background:var(--bad)}.vtrack i.ok{background:var(--ok)}.vtrack i.warn{background:var(--warn)}
.vt{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.fixes{margin:0;padding-left:22px}.fixes li{margin:4px 0}.fixes li::marker{color:var(--acc2);font-weight:700}
.course-custom{display:grid;gap:18px;margin-bottom:22px}

/* chapter 2 · buffer pool playground and architecture animation */
section.blk .prob p{font-size:15px;line-height:1.55}
.arch-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 8px}
.ar-box rect{fill:var(--card);stroke:var(--line);stroke-width:1.5;transition:opacity .3s,stroke .3s}
.ar-box.on rect{stroke:var(--acc);stroke-width:3}
.ar-box.off{opacity:.35}
.ar-box{transition:opacity .3s}
.ar-title{font-size:13px;font-weight:700;fill:var(--ink);font-family:system-ui,sans-serif}
.ar-sub{font-size:11px;fill:var(--mut);font-family:ui-monospace,monospace}
.ar-arrow line{stroke:var(--mut);stroke-width:1.6;fill:none;color:var(--mut);transition:opacity .3s}
.ar-arrow.on line{stroke:var(--acc2);stroke-width:3;color:var(--acc2)}
.ar-arrow:not(.on) line{opacity:.45}
.ar-lab{font-size:11px;fill:var(--mut);font-family:ui-monospace,monospace}
.ar-arrow.on .ar-lab{fill:var(--acc2);font-weight:700}
.ar-dot{fill:var(--acc2);stroke:var(--card);stroke-width:2}
.ar-step{margin-top:8px;border-left:4px solid var(--acc);background:var(--soft);border-radius:0 10px 10px 0;padding:10px 12px}
.ar-count{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.ar-text{margin:4px 0 0;font-size:15px;color:var(--ink)}
.ar-box{cursor:pointer;outline:none}
.ar-box:focus-visible rect{stroke:var(--acc);stroke-width:3}
.ar-box.picked rect{stroke:var(--acc2);stroke-width:3}
.ar-hint{margin:0;font-size:14px;color:var(--mut)}
.split{display:grid;gap:14px;align-items:start}
.split-l,.split-r{min-width:0}
.split-r{display:grid;gap:10px;align-content:start}
@media(min-width:760px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}}

.ar-comp{display:grid;gap:8px;margin-top:10px}
.ar-state{display:grid;gap:8px;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.ar-pt{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.ar-lookup{font-weight:700;font-size:14px}
.ar-lookup.hit{color:var(--ok)}.ar-lookup.miss{color:var(--bad)}
.ar-frs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ar-fr{border:1.5px solid var(--line);border-radius:10px;padding:6px;background:var(--card);display:grid;gap:2px;font-size:12px;color:var(--mut)}
.ar-fr b{font-size:14px;color:var(--ink)}
.ar-fr.pinned{border-color:var(--acc)}
.ar-fr.dirty{box-shadow:inset 0 -4px 0 var(--bad)}
.ar-legend{font-size:12.5px;color:var(--mut);margin:0}
@media(max-width:620px){.ar-frs{grid-template-columns:repeat(2,1fr)}}
.sm{display:grid;gap:10px}
.sm-frames{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sm-fr{border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;background:var(--card);display:grid;gap:2px;text-align:center;min-height:66px;align-content:center}
.sm-fr small{font-size:11px;color:var(--mut)}
.sm-fr b{font-size:15px;color:var(--ink)}
.sm-fr.pinned{border-color:var(--acc)}
.sm-fr.dirty{box-shadow:inset 0 -4px 0 var(--bad)}
.sm-ops{display:flex;flex-wrap:wrap;gap:5px}
.sm-op{font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:7px;padding:3px 7px;color:var(--mut)}
.sm-op.done.hit{color:var(--ok);border-color:var(--ok)}
.sm-op.done.miss{color:var(--bad);border-color:var(--bad)}
.sm-op.now{outline:2px solid var(--acc);outline-offset:2px;color:var(--ink)}
.sm-op.leak{border-style:dashed}
.sm-msg{margin:0;font-size:14.5px;color:var(--ink);min-height:3em}
.sm-cnt{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums;border-top:1px dashed var(--line);padding-top:6px}
@media(max-width:620px){.sm-frames{grid-template-columns:repeat(2,1fr)}}
.ar-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ar-card b{font-size:13px;color:var(--acc)}
.ar-card p{margin:2px 0 0;font-size:14px;color:var(--ink)}
/* kubernetes · tech CSS (prefix k8s-) */
.k8s-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.k8s-chip{border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;background:var(--card);text-align:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.k8s-chip small{display:block;font-weight:400;font-size:11.5px;color:var(--mut);margin-top:2px}
.k8s-chip.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--card))}
.k8s-chip.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.k8s-chip.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,var(--card))}
.k8s-chip.off{border-style:dashed;color:var(--mut);background:transparent}
.k8s-tbl{border-collapse:collapse;width:100%;min-width:560px;font-size:13px;font-variant-numeric:tabular-nums}
.k8s-tbl th,.k8s-tbl td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
.k8s-tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.k8s-tbl tr.ok td{background:color-mix(in srgb,var(--ok) 13%,var(--card))}
.k8s-tbl tr.bad td:last-child{color:var(--bad)}
.k8s-lanes{display:grid;gap:8px}
.k8s-laneRow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center}
.k8s-lane{display:flex;height:26px;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--card)}
.k8s-seg{min-width:2px;font-size:11px;line-height:26px;text-align:center;white-space:nowrap;overflow:hidden;color:var(--ink);border-right:1px solid var(--card)}
.k8s-seg.ok{background:color-mix(in srgb,var(--ok) 35%,var(--card))}
.k8s-seg.bad{background:color-mix(in srgb,var(--bad) 35%,var(--card))}
.k8s-seg.warn{background:color-mix(in srgb,var(--warn) 38%,var(--card))}
.k8s-seg.off{background:var(--soft);color:var(--mut)}
@media(max-width:620px){.k8s-laneRow{grid-template-columns:1fr;gap:3px}.k8s-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}.k8s-tbl{min-width:520px}}
@media(prefers-reduced-motion:reduce){.k8s-chip,.k8s-seg{transition:none;animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---- tiny helpers shared by the chapters and playgrounds ---- */
const PG = {};
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TIMERS = [];
function stopTimers() { while (TIMERS.length) { const t = TIMERS.pop(); clearInterval(t); clearTimeout(t); } }
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  const add = k => { if (k == null || k === false) return; if (Array.isArray(k)) k.forEach(add); else el.append(k.nodeType ? k : document.createTextNode(String(k))); };
  kids.forEach(add);
  return el;
}
function svg(tag, props, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in (props || {})) { const v = props[k]; if (v == null || v === false) continue; if (k === 'class') el.setAttribute('class', v); else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v); else el.setAttribute(k, v); }
  const add = k => { if (k == null || k === false) return; if (Array.isArray(k)) k.forEach(add); else el.append(k.nodeType ? k : document.createTextNode(String(k))); };
  kids.forEach(add);
  return el;
}
/* seeded random numbers, so every run of a playground repeats */
function rng(seed) { let a = (seed >>> 0) || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const bar = (...k) => h('div', { class: 'bar' }, ...k);
const btn = (label, fn, cls) => h('button', { class: cls || '', onclick: fn }, label);
const badge = (text, kind) => h('span', { class: 'badge ' + (kind || '') }, text);
const note = t => h('p', { class: 'note' }, t);
function seg(opts, val, cb) {          // opts: [{v,l}] or [v]; returns element with .value and .set(v)
  const el = h('div', { class: 'seg', role: 'group' });
  const norm = opts.map(o => (typeof o === 'object' ? o : { v: o, l: String(o) }));
  const paint = () => [...el.children].forEach((b, i) => b.classList.toggle('on', norm[i].v === el.value));
  norm.forEach(o => el.append(h('button', { onclick() { el.value = o.v; paint(); cb && cb(o.v); } }, o.l)));
  el.value = val; el.set = v => { el.value = v; paint(); }; paint(); return el;
}
function slider(label, min, max, val, step, cb, fmt) {   // returns <label> with .input and .value
  const out = h('b', {}, fmt ? fmt(val) : val);
  const input = h('input', { type: 'range', min, max, step: step || 1, value: val, 'aria-label': label });
  input.addEventListener('input', () => { out.textContent = fmt ? fmt(+input.value) : input.value; cb && cb(+input.value); });
  const el = h('label', { class: 'sl' }, label, input, out);
  Object.defineProperty(el, 'value', { get: () => +input.value, set: v => { input.value = v; out.textContent = fmt ? fmt(+v) : v; } });
  return el;
}
function player(o) {   // o.step() -> false when finished, o.reset(), o.speed ms per tick. returns element with .stop()
  let t = null;
  const stop = () => { if (t) { clearInterval(t); const i = TIMERS.indexOf(t); if (i >= 0) TIMERS.splice(i, 1); t = null; } play.textContent = '▶ Play'; };
  const tick = () => { if (o.step() === false) stop(); };
  const play = btn('▶ Play', () => { if (t) { stop(); return; } t = setInterval(tick, o.speed || 600); TIMERS.push(t); play.textContent = '⏸ Pause'; tick(); }, 'primary');

/* static architecture diagram: spec = {w,h,boxes:[[id,x,y,w,h,label,tone]],arrows:[[from,to,label,dashed]],cap}; tone 0..7 picks a --p colour; '\n' splits lines */
function diagram(sp) {
  const B = {}; sp.boxes.forEach(b => { B[b[0]] = { x: b[1], y: b[2], w: b[3], h: b[4] }; });
  const s = svg('svg', { viewBox: `0 0 ${sp.w} ${sp.h}`, role: 'img', 'aria-label': sp.cap || 'diagram', style: 'width:100%;min-width:' + Math.min(sp.w, 540) + 'px;max-width:' + sp.w + 'px;height:auto;display:block;margin:0 auto' });
  s.append(svg('defs', {}, svg('marker', { id: 'ah', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, svg('path', { d: 'M0 0L10 5L0 10z', fill: 'currentColor' }))));
  const edge = (a, t) => { const cx = a.x + a.w / 2, cy = a.y + a.h / 2, dx = t.x + t.w / 2 - cx, dy = t.y + t.h / 2 - cy; const k = Math.min(dx ? (a.w / 2) / Math.abs(dx) : 1e9, dy ? (a.h / 2) / Math.abs(dy) : 1e9); return [cx + dx * k, cy + dy * k]; };
  (sp.arrows || []).forEach(([f, t, lab, dash]) => {
    const [x1, y1] = edge(B[f], B[t]), [x2, y2] = edge(B[t], B[f]);
    s.append(svg('line', { x1, y1, x2, y2, stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-dasharray': dash ? '5 4' : null, 'marker-end': 'url(#ah)', style: 'color:var(--mut)' }));
    if (lab) s.append(svg('text', { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 5, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--mut)' }, lab));
  });
  sp.boxes.forEach(([id, x, y, w, hh, lab, tone]) => {
    s.append(svg('rect', { x, y, width: w, height: hh, rx: 9, fill: tone == null ? 'var(--card)' : 'var(--p' + tone + ')', stroke: 'var(--line)', 'stroke-width': 1.5 }));
    const ls = String(lab).split('\n'), y0 = y + hh / 2 - (ls.length - 1) * 8 + 4;
    ls.forEach((l, i) => s.append(svg('text', { x: x + w / 2, y: y0 + i * 16, 'text-anchor': 'middle', 'font-size': 12.5, fill: 'var(--ink)', 'font-weight': i === 0 && ls.length > 1 ? 700 : 400 }, l)));
  });
  return h('figure', { class: 'arch' }, h('div', { class: 'svgw' }, s), sp.cap ? h('figcaption', { class: 'note' }, sp.cap) : null);
}
API.diagram = diagram;

{ ask: `Two controllers update the same Deployment at the same moment and one change silently disappears. How does the store stop that?`,
  why: `Many writers share one object, so a writer that read old data must not overwrite newer data without noticing.`,
  principle: `Version every write with one global revision and make updates compare-and-swap on that version.`,
  design: `etcd assigns a revision per write; the API server exposes it as resourceVersion, rejects stale updates with 409 and streams changes from a revision.`,
  scene: [`A homegrown release tool and an autoscaler script both read Deployment <code>web</code> at resourceVersion 41. The tool changes the image, the script changes <code>replicas</code>, and both send a full <code>PUT</code> within the same second.`,
          `After the dust settles the replica count is correct but the image is the old one. Nothing was logged as an error, and the release tool reports success.`],
  predict: { q: `Two clients both read the object at <code>resourceVersion: 41</code> and both send an update that carries <code>resourceVersion: 41</code>. What happens to the <b>second</b> update?`,
    opts: [`It overwrites the first; the last writer wins`, `It is merged field by field with the first`, `It is rejected with HTTP 409 Conflict`, `It waits until the first update finishes, then applies`], ans: 2,
    why: `The first write moves the object to a new resourceVersion. The second still claims 41, so the compare fails and the API server answers 409 Conflict; the client must re-read and retry. A PUT with no resourceVersion skips the check, which is how lost updates happen.` },
  idea: [`<b>Global revision.</b> etcd keeps MVCC history; every write increments one revision, exposed as <code>metadata.resourceVersion</code>.`,
         `<b>Optimistic concurrency.</b> An update that carries a <code>resourceVersion</code> only succeeds if it still matches; otherwise HTTP 409.`,
         `<b>Watch from a revision.</b> A client lists once, remembers the list's resourceVersion and watches for newer events. Watching from a revision that was compacted returns <code>410 Gone</code>, and the client must list again.`,
         `<b>Limits.</b> etcd compacts old revisions (the API server asks every 5 minutes by default), a request size limit rejects huge objects, and the database has a space quota (<code>--quota-backend-bytes</code>, 2 GiB by default) that raises a NOSPACE alarm.`],
  arch: { w: 620, h: 210, cap: 'Writes compare the revision; watchers resume from a revision held in the history.',
    boxes: [['a', 10, 24, 110, 50, 'Client A\nPUT rv=41', 0], ['b', 10, 130, 110, 50, 'Client B\nPUT rv=41', 0], ['api', 190, 78, 130, 56, 'API server\ncheck rv', 1], ['etcd', 390, 20, 140, 56, 'etcd MVCC\nrev 42, 43 ...', 2], ['wc', 390, 134, 140, 56, 'Watch cache\nevents after rv', 3], ['ctl', 550, 134, 62, 56, 'Ctrl\nwatch', 4]],
    arrows: [['a', 'api', 'ok → rv 42'], ['b', 'api', '409'], ['api', 'etcd', 'txn if rev=41'], ['etcd', 'wc', 'events', true], ['wc', 'ctl', 'from rv']] },

      why: `The update carried an old <code>resourceVersion</code>. The stored object changed in between, so the API server refused the compare-and-swap rather than overwrite the newer data.`,
      log: { text: `-- representative output, wording varies by version
Error from server (Conflict): Operation cannot be fulfilled on
deployments.apps "web": the object has been modified; please apply your
changes to the latest version and try again`,
        note: `This is the safe outcome. Re-read, re-apply your change, retry. ${k8sSrc(K8S + 'reference/using-api/api-concepts/#resource-versions', 'API Concepts: Resource versions')}` },

      fix: [`Measure first: count 409s per client in the API server audit log or <code>apiserver_request_total{code="409"}</code>.`, `Fix: wrap read-modify-write in a retry loop (client-go has <code>retry.RetryOnConflict</code>).`, `Fix: prefer a patch or server-side apply that touches only your fields, so unrelated changes do not conflict.`, `Verify: the 409 rate falls and no lost updates appear when the two writers run together.`] },
    { tab: 'Watch 410', t: `A watch fails with too old resource version after compaction`, sym: `A controller log shows a watch error with HTTP 410 and then relists.`,
      ctx: `A custom controller restarted after a long pause and tried to resume its watch from the last resourceVersion it had saved.`,
      why: `etcd keeps history only back to the last compaction. A revision older than that no longer exists, so the server returns <code>410 Gone</code> (reason <code>Expired</code>) and the client must do a fresh LIST and watch from the list's resourceVersion.`,
      log: { text: `-- representative output, wording varies by version
W1008 03:12:41 reflector.go: watch of *v1.Pod ended with:
  too old resource version: 38120 (39877)
I1008 03:12:41 reflector.go: Listing and watching *v1.Pod again`,

      fix: [`Measure first: count <code>410</code> responses and relists per controller; a few per day is normal, a loop is not.`, `Fix: use an informer or reflector that relists on 410 instead of a hand-written watch.`, `Fix: do not persist old resourceVersions across long downtimes; always LIST first.`, `Verify: after a restart the controller logs one relist and then runs without repeated 410s.`] },
    { tab: 'DB space', t: `etcd stops accepting writes: database space exceeded`, sym: `All writes fail with <code>mvcc: database space exceeded</code>; reads still work.`,
      ctx: `A cluster with heavy event and Lease churn reaches the 2 GiB default backend quota. Deploys and even <code>kubectl delete</code> fail.`,
      why: `Every write adds a revision. If compaction runs but the backend file is not defragmented, free space inside the file is not returned, and the usage the quota measures stays high. At the quota etcd raises the NOSPACE alarm and rejects writes.`,
      log: { text: `-- representative output, values illustrative

        note: `A large gap between DB SIZE and DB SIZE IN USE means defragmentation is overdue. ${k8sSrc(K8S + 'tasks/administer-cluster/configure-upgrade-etcd/#space-quota', 'Operating etcd clusters: Space quota')}` },

             good: kv([['DB file', [['0.5 GB after defrag', 'ok']]], ['Alarm', [['disarmed', 'ok']]], ['Writes', [['accepted', 'ok']]]], [['quota used', 25, 'ok', '0.5 / 2.0 GB (illustrative)']], 'Compact, defragment, disarm.') },
      fix: [`Measure first: <code>etcdctl endpoint status -w table</code> and compare DB SIZE with DB SIZE IN USE; find the object kinds that grew (events, Leases, large CRs).`, `Fix: compact to the current revision, run <code>etcdctl defrag</code> one member at a time, then <code>etcdctl alarm disarm</code>.`, `Fix: find and stop the writer that churns objects, and keep automatic compaction enabled.`, `Verify: <code>endpoint status</code> shows the file shrunk, the alarm list is empty and a test write succeeds.`] },
    { tab: 'Too large', t: `A ConfigMap or Secret that is too large is rejected`, sym: `<code>kubectl create configmap</code> or an apply fails with a request-too-large error.`,
      ctx: `A team embeds a 3 MB data file into a ConfigMap so that pods can mount it.`,
      why: `Objects live in etcd, which is built for small values. ConfigMaps and Secrets are limited to 1 MiB, and etcd and the API server also cap request size. Large objects also slow every list and watch of that kind.`,

The ConfigMap "ref-data" is invalid: []: Too long: must have at most 1048576 bytes
Error from server (RequestEntityTooLarge): Request entity too large: limit is 3145728`,

{ ask: `A pod is deleted while the controller is restarting and the delete event is lost. Will the pod ever be replaced?`,
  why: `Notifications get dropped, delayed or duplicated, so a controller cannot rely on seeing every event.`,
  principle: `Be level-triggered: whatever woke you, re-read current state, compare it with desired state and take the smallest step.`,
  design: `Informers keep a cache from list plus watch, a rate-limited work queue holds object keys, and reconcile compares counts, not events.`,
  scene: [`The ReplicaSet <code>web</code> wants 3 pods. During a rolling restart of kube-controller-manager, a pod is deleted by a node drain at the exact second the controller process is down.`,
          `The controller comes back up with a perfectly working watch, but nobody told it about the deletion. Two pods are running, and the on-call waits to see whether a third ever appears.`],
  predict: { q: `The DELETE event was dropped. When is the missing pod created?`,
    opts: [`Never: without the event the controller cannot know`, `At the next relist or resync, because the controller compares levels instead of events`, `Only when an operator runs <code>kubectl rollout restart</code>`], ans: 1,
    why: `The controller's job is "make the number of matching pods equal spec.replicas". On any wake-up, including a relist after restart or a periodic resync, it counts pods, sees 2 not 3 and creates one. An edge-triggered design that only reacts to DELETE events would never recover.` },
  idea: [`<b>Reflector and informer.</b> A reflector does LIST then WATCH and fills a local cache, so controllers read from memory instead of the API server.`,
         `<b>Work queue.</b> Event handlers enqueue only the object <b>key</b>. The queue de-duplicates and applies per-item rate limiting with exponential backoff, so a failing key does not spin.`,
         `<b>Reconcile(key).</b> Read desired and observed state from the cache, create or delete the difference, write status.`,
         `<b>Ownership.</b> <code>ownerReferences</code> let the garbage collector delete dependents. A <code>finalizer</code> in <code>metadata.finalizers</code> blocks deletion until its controller removes it.`],
  arch: { w: 620, h: 232, cap: 'Events only say which key to look at; reconcile re-reads state from the cache.',
    boxes: [['api', 10, 90, 110, 56, 'API server\nLIST + WATCH', 1], ['refl', 170, 16, 120, 50, 'Reflector\ndeltas', 2], ['cache', 340, 16, 130, 50, 'Informer cache\nlocal copy', 3], ['q', 490, 90, 110, 56, 'Work queue\nkeys, backoff', 4], ['wk', 340, 168, 130, 50, 'Reconcile\ndesired vs actual', 5]],
    arrows: [['api', 'refl', 'list/watch'], ['refl', 'cache', 'store'], ['cache', 'q', 'enqueue key'], ['q', 'wk', 'next key'], ['wk', 'cache', 'read'], ['wk', 'api', 'create/delete', true]] },

      ctx: `A team uninstalled an operator before deleting its custom resources. A namespace delete is now stuck with remaining resources.`,
      why: `A finalizer in <code>metadata.finalizers</code> keeps the object in the API after deletion is requested, until the controller that owns the finalizer cleans up and removes it. If that controller no longer runs, no one removes the entry.`,

$ kubectl get ns old

old    Terminating   3d`,

      viz: { bad: kv([['Delete requested', [['deletionTimestamp set', 'ok']]], ['Finalizer', [['db.example.com/cleanup', 'warn']]], ['Controller', [['gone', 'bad']]], ['Object', [['Terminating forever', 'bad']]]], [], 'No one removes the finalizer.'),

      fix: [`Measure first: <code>kubectl get &lt;kind&gt; &lt;name&gt; -o yaml</code> and read <code>finalizers</code> and <code>deletionTimestamp</code>.`, `Fix: reinstall or restart the controller that owns the finalizer so it can clean up.`, `Fix: only if the external resource is gone, remove the finalizer by hand: <code>kubectl patch &lt;kind&gt; &lt;name&gt; --type=merge -p '{"metadata":{"finalizers":null}}'</code>.`, `Verify: the object disappears from <code>kubectl get</code>.`] },
    { tab: 'Fighting RS', t: `Two ReplicaSets with overlapping selectors fight over pods`, sym: `Pods are created and deleted in a loop, or the replica counts never settle.`,
      ctx: `Two Deployments in one namespace both use the selector <code>app: web</code> with different templates.`,
      why: `A ReplicaSet counts every pod that matches its selector, regardless of who created it (unless another controller owns it). Two overlapping ReplicaSets each see the other's pods as theirs and scale against each other.`,

      fix: [`Measure first: <code>kubectl get rs,deploy -o wide</code> and compare selectors; check each pod's <code>ownerReferences</code>.`, `Fix: give each Deployment a unique selector label (selectors are immutable, so recreate the Deployment).`, `Fix: never share a label set between workloads that have different templates.`, `Verify: pod count equals <code>replicas</code> for each Deployment and stops changing.`] },
    { tab: 'Hot loop', t: `A controller hot-loops on a permanent error`, sym: `One controller burns CPU and floods the API server with identical failing calls.`,
      ctx: `A custom operator reconciles a resource that references a missing Secret. The reconcile returns an error every time it is called.`,
      why: `Returning an error requeues the key immediately. Without backoff the same key is retried at full speed. Work queue rate limiters add per-item exponential delay for exactly this reason; custom code that bypasses them (or requeues with zero delay) spins.`,

(2400 lines per second, illustrative)`,
        note: `Identical lines milliseconds apart for one key means no backoff. ${k8sSrc(K8S + 'concepts/architecture/controller/', 'Controllers')}` },
      viz: { bad: kv([['Key ns/db-7', [['error → requeue now', 'bad'], ['error → requeue now', 'bad'], ['error → requeue now', 'bad']]]], [['retries per minute', 100, 'bad', '~144000 (illustrative)']], 'Immediate retry, no delay.'),
             good: kv([['Key ns/db-7', [['5 ms', 'ok'], ['10 ms', 'ok'], ['20 ms ... capped', 'ok']]]], [['retries per minute', 3, 'ok', '~10 (illustrative)']], 'Exponential backoff per key.') },
      fix: [`Measure first: look at the controller's work queue metrics (<code>workqueue_retries_total</code>, <code>workqueue_depth</code>) and its error rate.`, `Fix: requeue through the rate-limited queue (<code>AddRateLimited</code>) so each failing key backs off.`, `Fix: distinguish permanent errors from transient ones and record a status condition instead of retrying forever.`, `Verify: retries per minute for the key fall, and the API server request rate from this client drops.`] }
  ] },

{ ask: `A new pod asks for 200m CPU and an SSD node, yet it sits Pending while 120 nodes look half empty. Why can the scheduler not place it?`,
  why: `Placing a pod is a constraint problem: only some nodes can host it, and the choice should keep the cluster balanced.`,
  principle: `Filter out every node that cannot run the pod, score the survivors, then commit with one small write.`,
  design: `The scheduler counts requests, taints, selectors and affinity in Filter plugins, ranks nodes in Score plugins and binds by setting spec.nodeName.`,
  scene: [`The search team deploys <code>indexer</code> with a request of 200m CPU and a <code>nodeSelector</code> for SSD nodes. The cluster has 120 nodes (illustrative), and dashboards show average CPU usage of 25%.`,
          `The pod stays <code>Pending</code>. <code>kubectl describe pod</code> shows a <code>FailedScheduling</code> event that lists reasons like insufficient cpu and untolerated taints, which do not match what the dashboards say.`],
  predict: { q: `A node has 4 CPU, real usage is 1 CPU, but the <b>requests</b> of its pods add up to 3.9 CPU. Can a 200m pod be scheduled there?`,
    opts: [`Yes: only 1 of 4 CPU is actually used`, `No: the scheduler adds requests, and 3.9 + 0.2 exceeds 4`, `Yes, but only with a toleration`], ans: 1,
    why: `The scheduler works with declared requests, not live usage (NodeResourcesFit compares the sum of requests with allocatable). Idle usage does not create room; only lower requests or more capacity do.` },
  idea: [`<b>Filter</b> removes infeasible nodes. <code>NodeResourcesFit</code> checks requests against allocatable, <code>TaintToleration</code> checks taints, <code>NodeAffinity</code> checks <code>nodeSelector</code> and affinity, <code>InterPodAffinity</code> checks pod (anti-)affinity.`,
         `<b>Score</b> ranks the remaining nodes: by default it favours less-allocated nodes (spread) and balanced CPU/memory, plus image locality and topology spread.`,
         `<b>Bind</b> writes a Binding that sets <code>spec.nodeName</code>. The kubelet on that node reacts to it.`,
         `<b>Rules you set.</b> <code>nodeSelector</code>, affinity, tolerations and <code>topologySpreadConstraints</code> only ever remove nodes from the candidate list.`],
  arch: { w: 580, h: 262, cap: 'Filter shrinks the candidate list, score picks the best, bind records the decision.',
    boxes: [['q', 10, 96, 112, 56, 'Scheduling queue\nPending pods', 0], ['cache', 210, 12, 130, 46, 'Node snapshot\nrequests, taints', 2], ['f', 150, 96, 112, 56, 'Filter\nwho can run it', 3], ['s', 290, 96, 112, 56, 'Score\nwho is best', 4], ['b', 430, 96, 120, 56, 'Bind\nspec.nodeName', 5], ['k', 430, 196, 120, 50, 'Kubelet\non that node', 6]],
    arrows: [['q', 'f', 'one pod'], ['cache', 'f', '', true], ['f', 's', 'feasible'], ['s', 'b', 'winner'], ['b', 'k', 'bound']] },

{ ask: `The pod is bound to node-1 but never becomes Running, or it restarts every few minutes. What does the node agent do, and what does it report?`,
  why: `A pod only exists as a record until an agent on its node turns it into running processes and reports back honestly.`,
  principle: `Run an agent on every node that reconciles its own pods and writes status back.`,
  design: `The kubelet watches pods bound to it, drives the container runtime through CRI, enforces limits with cgroups and restarts containers with exponential back-off.`,
  scene: [`The new <code>web</code> pods were scheduled within seconds, but on one node they show <code>ImagePullBackOff</code>, and on another the pod flips between <code>Running</code> and <code>CrashLoopBackOff</code> every few minutes.`,
          `A third pod shows <code>OOMKilled</code> in <code>kubectl describe</code> even though the node has plenty of free memory. The on-call needs to know which of these is an image, an app or a limit problem.`],
  predict: { q: `A container exceeds its <b>memory limit</b>. What does <code>kubectl describe pod</code> show for that container?`,
    opts: [`State Waiting, Reason ImagePullBackOff`, `Last State Terminated, Reason OOMKilled, Exit Code 137`, `Last State Terminated, Reason Completed, Exit Code 0`], ans: 1,
    why: `The limit is a cgroup memory limit. When the container goes over it the kernel OOM-kills the process (SIGKILL, exit code 137 = 128 + 9). The kubelet records Terminated with reason OOMKilled and then restarts the container according to restartPolicy.` },
  idea: [`<b>Pod phase and container state.</b> Phases are Pending, Running, Succeeded, Failed, Unknown. Each container is Waiting (with a reason), Running or Terminated.`,
         `<b>CRI.</b> The kubelet asks the container runtime (for example containerd or CRI-O) to pull the image, create the sandbox and containers, and start them.`,
         `<b>Back-off.</b> Failed image pulls and crashing containers retry with exponential back-off that starts at 10 seconds and is capped at 5 minutes by default.`,
         `<b>Limits.</b> A memory limit is hard: over it the container is OOM-killed. A CPU limit is a CFS quota: over it the container is throttled, not killed. Requests decide scheduling and CPU weight.`],
  arch: { w: 620, h: 196, cap: 'The kubelet reconciles desired Pods against what the runtime reports and writes status back.',
    boxes: [['api', 10, 12, 130, 46, 'API server\nPods for node', 1], ['kl', 10, 100, 120, 56, 'Kubelet\nreconcile', 2], ['cri', 180, 100, 130, 56, 'Container runtime\nCRI', 3], ['cg', 360, 100, 120, 56, 'cgroups\nmemory · cpu', 4], ['ct', 520, 100, 90, 56, 'Container\nprocess', 5]],
    arrows: [['api', 'kl', 'watch'], ['kl', 'cri', 'pull, start'], ['cri', 'cg', 'limits'], ['cg', 'ct', 'kill / throttle'], ['kl', 'api', 'status', true]] },

    { tab: 'OOMKilled', t: `OOMKilled with exit code 137 from a limit below the real peak`, sym: `<code>Last State: Terminated, Reason: OOMKilled, Exit Code: 137</code>, and the restart count rises.`,

    { tab: 'CPU throttle', t: `CPU limits throttle a latency-sensitive service while node CPU is idle`, sym: `p99 latency spikes every 100 ms window although node CPU is below 40%.`,

{ ask: `During a short database blip every replica restarts at once and the outage gets longer. How does the kubelet decide to restart a container or to stop sending it traffic?`,
  why: `A running process is not the same as a process that can serve, and one check cannot answer both questions.`,
  principle: `Separate the questions: alive (restart me), ready (send me traffic), started (do not judge me yet).`,
  design: `The kubelet runs three independent probes: liveness restarts, readiness flips the Ready condition, and startup holds the other two until the app is up.`,
  scene: [`The <code>web</code> pods have a liveness probe on <code>/health</code>. That endpoint runs <code>SELECT 1</code> against the database. At 11:20 the database fails over and is unreachable for 40 seconds (illustrative).`,
          `All four replicas fail the probe, and the kubelets restart them. They start into a database that is still recovering, and the outage lasts several minutes instead of 40 seconds.`],
  predict: { q: `The <b>readiness</b> probe of a container fails. What does the kubelet do?`,
    opts: [`Restarts the container`, `Marks the pod NotReady so it is removed from Service endpoints; the container keeps running`, `Deletes the pod and lets the ReplicaSet recreate it`], ans: 1,
    why: `Readiness only controls the Ready condition. A NotReady pod is taken out of the ready addresses in EndpointSlices, but its container is not restarted. Only a failing liveness probe (or startup probe running out of budget) restarts the container.` },
  idea: [`<b>Liveness</b> answers "is this process stuck?". After <code>failureThreshold</code> consecutive failures the kubelet restarts the container.`,
         `<b>Readiness</b> answers "can I take traffic now?". It sets the pod's <code>Ready</code> condition and removes it from or returns it to endpoints.`,
         `<b>Startup</b> gives slow starters a budget of <code>failureThreshold × periodSeconds</code>; while it runs the other probes are disabled.`,
         `<b>Parameters.</b> <code>initialDelaySeconds</code> (0), <code>periodSeconds</code> (10), <code>timeoutSeconds</code> (1), <code>successThreshold</code> (1), <code>failureThreshold</code> (3) are the defaults. Probes use HTTP, TCP, gRPC or exec.`],
  arch: { w: 560, h: 226, cap: 'The kubelet runs the probes; each result has a different consequence.',
    boxes: [['ct', 10, 86, 120, 56, 'Container\n/healthz /ready', 0], ['kl', 190, 86, 120, 56, 'Kubelet\nprober', 1], ['rs', 370, 8, 170, 50, 'Restart container\nliveness / startup', 4], ['rd', 370, 86, 170, 56, 'Ready condition\nreadiness', 5], ['ep', 370, 168, 170, 50, 'EndpointSlice\nready true / false', 6]],
    arrows: [['kl', 'ct', 'HTTP / TCP / gRPC / exec'], ['kl', 'rs', 'fails x times'], ['kl', 'rd', 'pass / fail'], ['rd', 'ep', 'update']] },

             good: kv([['Probe', [['dedicated light endpoint, timeout 3 s, threshold 5', 'ok']]], ['Spike', [['pods stay, readiness may drop', 'ok']]]], [['capacity', 100, 'ok', '4 of 4 pods']], 'Probes tolerate slowness.') },
      fix: [`Measure first: compare probe latency with application p99 during peak; look for <code>context deadline exceeded</code> events.`, `Fix: serve the probe from a path that does not queue behind request handling, and raise <code>timeoutSeconds</code> and <code>failureThreshold</code>.`, `Fix: handle load with autoscaling and readiness (shed traffic), not with liveness restarts.`, `Verify: during a load test the restart count stays at 0 while latency is high.`] }

{ ask: `Pod IPs change on every deploy, and during scale-down users see 502 errors for a few seconds. How does traffic find the right pods?`,
  why: `Clients need one stable address even though pods come and go, and every machine must learn about changes quickly.`,
  principle: `Give clients a virtual IP and keep a live list of ready backends that every node turns into forwarding rules.`,
  design: `A Service owns a ClusterIP, the EndpointSlice controller publishes ready pod IPs and kube-proxy programs iptables or IPVS rules on every node.`,
  scene: [`The <code>web</code> Service sends traffic to three pods. At 17:05 the HPA removes one pod. For about 4 seconds (illustrative) the front end logs a burst of <code>502 Bad Gateway</code>, then it calms down.`,
          `No pod crashed and no probe failed. Synthetic checks show the failures happen only on scale-down and rolling updates, never at steady state.`],
  predict: { q: `A pod receives SIGTERM. What is guaranteed about <b>removal from every node's forwarding rules</b> versus <b>the process exiting</b>?`,
    opts: [`Rules are removed first, so no traffic can reach a dead process`, `The process always lives until its connections drain`, `Nothing is guaranteed: both start at the same time and race`], ans: 2,
    why: `When a pod is deleted, the API server sets its deletionTimestamp. The kubelet starts shutdown (preStop hook, then SIGTERM) while, in parallel, the EndpointSlice controller removes the endpoint and each node's kube-proxy updates its rules. A process that exits quickly can die before the rules catch up.` },
  idea: [`<b>Service</b> has a selector and a stable virtual IP (ClusterIP) that does not belong to any interface.`,
         `<b>EndpointSlices</b> list the IPs of pods that match the selector and are ready; a terminating pod is marked not ready.`,

{ ask: `How do you ship version 2 to every pod without dropping below full capacity, when yesterday's rollout fell to 50%?`,
  why: `Replacing running pods one by one is a capacity risk unless the pace is bounded by how many pods are really serving.`,
  principle: `Give the new version its own ReplicaSet and shift replicas in bounded steps that only count Ready pods as available.`,
  design: `The Deployment controller scales the new ReplicaSet up and the old one down within maxSurge and maxUnavailable, keeps old ReplicaSets for rollback, and enforces progressDeadlineSeconds.`,
  scene: [`The <code>web</code> Deployment has 4 replicas. Yesterday's release used <code>maxUnavailable: 50%</code> to finish faster. For about 40 seconds (illustrative) only two pods served traffic, and latency tripled at the busiest hour.`,
          `Today the new image has a bug and its pods never become Ready. The release engineer sees the rollout hanging and wonders whether users are affected and how to get back.`],
  predict: { q: `<code>replicas: 4</code>, <code>maxSurge: 0</code>, <code>maxUnavailable: 25%</code>. What is the <b>minimum number of Ready pods</b> during the rollout?`,
    opts: [`4`, `3`, `2`, `1`], ans: 1,
    why: `25% of 4 is 1 (maxUnavailable percentages round down). With no surge, the controller must kill one old pod before it can create a new one, so Ready never drops below 4 - 1 = 3. maxSurge percentages round up.` },
  idea: [`<b>One ReplicaSet per template.</b> A new <code>spec.template</code> gets a new pod-template hash and a new ReplicaSet; old ones are kept (scaled to 0) for rollback.`,
         `<b>Bounds.</b> Total pods stay at most <code>replicas + maxSurge</code>; Ready pods stay at least <code>replicas - maxUnavailable</code>. Both default to 25%. They cannot both be 0.`,
         `<b>Ready counts.</b> A new pod only counts as available once it is Ready (and after <code>minReadySeconds</code>), so a broken version stalls instead of replacing healthy pods.`,
         `<b>Deadline and undo.</b> <code>progressDeadlineSeconds</code> (600 by default) marks a stalled rollout with <code>ProgressDeadlineExceeded</code>; <code>kubectl rollout undo</code> scales the previous ReplicaSet back up.`],
  arch: { w: 620, h: 244, cap: 'The Deployment moves replicas between two ReplicaSets; readiness gates how far it may go.',
    boxes: [['dep', 10, 94, 110, 56, 'Deployment\nstrategy', 1], ['rso', 180, 18, 140, 56, 'ReplicaSet old\n4 → 0', 2], ['rsn', 180, 170, 140, 56, 'ReplicaSet new\n0 → 4', 3], ['po', 380, 18, 100, 56, 'Pods v1', 2], ['pn', 380, 170, 100, 56, 'Pods v2', 3], ['rdy', 520, 94, 92, 56, 'Ready?\navailable', 5]],
    arrows: [['dep', 'rso', 'scale down'], ['dep', 'rsn', 'scale up'], ['rso', 'po', ''], ['rsn', 'pn', ''], ['po', 'rdy', ''], ['pn', 'rdy', 'gates']] },

{ ask: `Traffic jumps 7 times at 8 p.m. How many replicas do you need, how fast, and when do you scale back without flapping?`,
  why: `Load changes faster than people react, and a naive rule either lags the spike or oscillates around its threshold.`,
  principle: `Compute replicas in proportion to measured load versus target, scale up fast and scale down only to the highest recommendation of a recent window.`,
  design: `The HPA computes desired = ceil(current × metric / target), applies a tolerance and behavior policies, and stabilises scale-down.`,
  scene: [`A ticketing site's <code>web</code> Deployment has 4 pods and an HPA targeting 70% CPU utilisation. At 20:00 a sale starts and requests rise about 7 times (illustrative).`,
          `Latency climbs for several minutes. Later, as the sale ends, the replica count saws up and down every few minutes, and each drop is followed by a brief overload.`],
  predict: { q: `4 replicas run at <b>140%</b> CPU utilisation (of requests) and the target is <b>70%</b>. What replica count does the HPA compute?`,
    opts: [`5`, `6`, `8`, `16`], ans: 2,
    why: `desiredReplicas = ceil(currentReplicas × currentMetric / target) = ceil(4 × 140 / 70) = 8. The HPA works from utilisation relative to the pods' CPU requests, so the requests must exist.` },
  idea: [`<b>Metrics pipeline.</b> The kubelet exposes usage, metrics-server serves it through the <code>metrics.k8s.io</code> API, and the HPA controller queries it every 15 s by default.`,
         `<b>Utilisation is relative to requests.</b> No CPU request on a container means no utilisation, so no scaling decision.`,
         `<b>Tolerance.</b> Within 10% of the target (default) the HPA does nothing, which avoids chatter.`,
         `<b>Behavior.</b> Scale-up has no stabilisation by default and may add the larger of 100% or 4 pods per 15 s. Scale-down uses a 300 s stabilisation window and takes the highest recommendation in it. <code>minReplicas</code> and <code>maxReplicas</code> clamp the result.`],
  arch: { w: 600, h: 262, cap: 'The HPA closes a loop: measure, compute, set replicas, wait for new pods to become Ready.',
    boxes: [['ms', 150, 92, 130, 56, 'metrics-server\nmetrics.k8s.io', 1], ['hpa', 310, 92, 130, 56, 'HPA controller\nevery 15 s', 2], ['dep', 470, 92, 120, 56, 'Deployment\nscale', 3], ['pods', 290, 192, 130, 56, 'Pods\nrequests, usage', 4]],
    arrows: [['pods', 'ms', 'usage'], ['ms', 'hpa', 'query'], ['hpa', 'dep', 'set replicas'], ['dep', 'pods', 'create / delete']] },

{ ask: `A machine loses power at 3 a.m. How does the cluster notice and heal, and why did the StatefulSet pod not come back?`,
  why: `Silence can mean a dead machine or only a broken network, and acting wrongly risks running two copies of one workload.`,
  principle: `Treat silence as suspicion, not death: mark, wait, then evict, and let the normal replacement loop do the healing.`,
  design: `Node Leases act as heartbeats, the node lifecycle controller adds NoExecute taints, pods are evicted after tolerationSeconds, and StatefulSets keep at-most-one semantics.`,
  scene: [`At 03:07 a rack loses power and node-7 disappears. It hosted one Deployment pod of <code>web</code> and the StatefulSet pod <code>db-1</code>. The pager rings at 03:13 with a latency alert and a Deployment that looks short of one pod.`,
          `The Deployment's missing pod comes back around 03:13, but <code>db-1</code> is still <code>Terminating</code> at 03:30. The engineer wants to know what the cluster is waiting for.`],
  predict: { q: `The node stops heartbeating. <b>When</b> are its Deployment pods recreated on another node, with default settings?`,
    opts: [`Within a few seconds of the last heartbeat`, `After the node grace period plus the NoExecute toleration, about 5 to 6 minutes`, `Only after an operator deletes the Node object`], ans: 1,
    why: `The node lifecycle controller marks the node Unknown after node-monitor-grace-period (40 s; 50 s from 1.32) and adds the unreachable NoExecute taint. Pods get a default toleration of 300 s for it, so they are evicted about 300 s later, and the ReplicaSet then creates replacements.` },
  idea: [`<b>Lease heartbeats.</b> Each kubelet renews a Lease in <code>kube-node-lease</code> (about every 10 s); the node lifecycle controller marks a node Unknown after <code>node-monitor-grace-period</code> (40 s; 50 s from 1.32).`,
         `<b>Taints.</b> It adds <code>node.kubernetes.io/unreachable:NoExecute</code> (or <code>not-ready</code>). Pods tolerate it for <code>tolerationSeconds</code>, 300 s by default (added by admission), then are evicted.`,
         `<b>At-most-one for StatefulSets.</b> A replacement pod with the same identity is not created until the old pod object is confirmed gone, which an unreachable kubelet cannot do. The <code>node.kubernetes.io/out-of-service</code> taint lets an operator declare a node shut down after verifying it.`,
         `<b>Voluntary disruption.</b> <code>kubectl drain</code> uses the Eviction API, which respects a <code>PodDisruptionBudget</code> and refuses evictions that would breach it.`],
  arch: { w: 620, h: 262, cap: 'Missing heartbeats lead to a taint, then eviction, then the normal ReplicaSet replacement.',
    boxes: [['nd', 10, 100, 100, 56, 'Node\nkubelet', 0], ['ls', 150, 100, 120, 56, 'Node Lease\nrenew ~10 s', 1], ['nc', 310, 100, 130, 56, 'Node lifecycle\ncontroller', 2], ['tn', 490, 20, 120, 56, 'Taint NoExecute\nunreachable', 3], ['ev', 490, 100, 120, 56, 'Taint eviction\ntolerationSeconds', 4], ['rs', 490, 184, 120, 56, 'ReplicaSet\nnew Pod', 5]],
    arrows: [['nd', 'ls', 'heartbeat'], ['ls', 'nc', 'watch'], ['nc', 'tn', 'no renewal'], ['tn', 'ev', ''], ['ev', 'rs', 'Pod deleted']] },
  pg: 'nodefail',
  common: [
    { tab: 'StatefulSet stuck', t: `StatefulSet pods on a dead node are not replaced until the node is confirmed gone`, sym: `Pod <code>db-1</code> stays <code>Terminating</code> (or Unknown) on a NotReady node for a long time.`,
      ctx: `A node lost power. Its StatefulSet pod holds a volume and a stable identity.`,
      why: `A StatefulSet guarantees at most one pod with a given identity. The controller waits until the old pod is really gone, and only the kubelet (or an operator) can confirm that. With the kubelet unreachable, nothing confirms it, so the pod is never replaced automatically.`,
      log: { text: `-- representative output, values illustrative
$ kubectl get pods -o wide
NAME    READY   STATUS        NODE
db-1    1/1     Terminating   node-7
$ kubectl get nodes
node-7  NotReady  <none>  41d`,
        note: `Terminating on a NotReady node is the wait. ${k8sSrc(K8S + 'concepts/cluster-administration/node-shutdown/#non-graceful-node-shutdown', 'Node Shutdown: Non-graceful node shutdown')}` },
      viz: { bad: kv([['node-7', [['powered off', 'bad']]], ['db-1', [['Terminating, no confirmation', 'warn']]], ['db-1 replacement', [['not created', 'bad']]]], [['capacity lost', 100, 'bad', 'one DB replica until fixed']], 'Safety over availability.'),
             good: kv([['Operator', [['verifies power is off, adds out-of-service taint', 'ok']]], ['db-1', [['force-deleted by the control plane', 'ok']]], ['db-1 replacement', [['starts on another node', 'ok']]]], [['capacity lost', 5, 'ok', 'minutes (illustrative)']], 'A human confirms the node is really down.') },
      fix: [`Measure first: <code>kubectl get nodes</code> and <code>kubectl get pods -o wide</code>; confirm by other means (cloud console, power) that the node is down.`, `Fix: once you are sure the node is down, taint it: <code>kubectl taint nodes node-7 node.kubernetes.io/out-of-service=nodeshutdown:NoExecute</code>.`, `Fix: never do this for a node that may still be running: two pods could write the same volume.`, `Verify: the pod is recreated on another node and the volume attaches there.`] },
    { tab: 'PDB blocks drain', t: `A drain blocks because evicting would violate the PodDisruptionBudget`, sym: `<code>kubectl drain</code> keeps retrying the same pod and never finishes.`,
      ctx: `A 3-replica service has a PDB with <code>minAvailable: 3</code>, and a maintenance drain starts.`,
      why: `The Eviction API refuses a voluntary eviction when it would take the healthy count below the budget. With <code>minAvailable</code> equal to the replica count, zero disruptions are ever allowed.`,
      log: { text: `-- representative output, wording varies by version
evicting pod prod/web-5c8b-xxxxx
error when evicting pods/"web-5c8b-xxxxx" -n "prod" (will retry after 5s):
Cannot evict pod as it would violate the pod's disruption budget.`,
        note: `The retry loop is the safety net. ${k8sSrc(K8S + 'tasks/administer-cluster/safely-drain-node/', 'Safely Drain a Node')}` },
      viz: { bad: kv([['Replicas', [['3 healthy', 'ok']]], ['PDB', [['minAvailable 3: 0 disruptions', 'bad']]], ['Drain', [['blocked, retrying', 'bad']]]], [['evictions allowed', 0, 'bad', '0']], 'The budget leaves no room.'),
             good: kv([['PDB', [['minAvailable 2 (or maxUnavailable 1)', 'ok']]], ['Drain', [['evicts one pod at a time', 'ok']]]], [['evictions allowed', 33, 'ok', '1 at a time']], 'Allow one at a time.') },
      fix: [`Measure first: <code>kubectl get pdb</code> and read <code>ALLOWED DISRUPTIONS</code>.`, `Fix: set the budget to leave room: <code>maxUnavailable: 1</code> or <code>minAvailable</code> below the replica count.`, `Fix: run enough replicas that a budget can be honoured during maintenance.`, `Verify: the drain completes and ALLOWED DISRUPTIONS returns to at least 1 afterwards.`] },
    { tab: 'One node, one zone', t: `All replicas on one node or zone mean one failure takes the service down`, sym: `One node or zone fails and the service has no healthy replicas for minutes.`,
      ctx: `All 3 pods of <code>web</code> were scheduled onto the same node because it had the most free resources.`,
      why: `The scheduler spreads by score, not by guarantee. Without a topology spread constraint or anti-affinity, replicas can land together, and a single failure removes them all until the eviction timeout elapses.`,
      log: { text: `-- representative output, values illustrative
$ kubectl get pods -l app=web -o wide
NAME             READY   STATUS    NODE
web-5c8b-aaaaa   1/1     Running   node-7
web-5c8b-bbbbb   1/1     Running   node-7
web-5c8b-ccccc   1/1     Running   node-7`,
        note: `Same NODE column on all replicas is the risk. ${k8sSrc(K8S + 'concepts/scheduling-eviction/topology-spread-constraints/', 'Pod Topology Spread Constraints')}` },
      viz: { bad: kv([['node-7', [['web ×3', 'bad']]], ['node-8', [['empty', 'off']]], ['node-7 fails', [['0 replicas', 'bad']]]], [['replicas surviving', 0, 'bad', '0 of 3']], 'No spread, no redundancy.'),
             good: kv([['node-7', [['web ×1', 'ok']]], ['node-8', [['web ×1', 'ok']]], ['node-9', [['web ×1', 'ok']]], ['node-7 fails', [['2 replicas serve', 'ok']]]], [['replicas surviving', 66, 'ok', '2 of 3']], 'Spread over failure domains.') },
      fix: [`Measure first: <code>kubectl get pods -o wide</code> grouped by node and by zone label.`, `Fix: add <code>topologySpreadConstraints</code> on <code>kubernetes.io/hostname</code> and <code>topology.kubernetes.io/zone</code> with <code>maxSkew: 1</code>.`, `Fix: pair with a PodDisruptionBudget and enough replicas to survive one domain.`, `Verify: after a node drain, replicas are distributed and the service stays up.`] }
  ] }
];
</script>
<script>
/* architecture: one request walks through the boxes; the strip shows the 4 buffer frames */
function archAnim(sp, steps) {
  const B = {};
  sp.boxes.forEach(b => { B[b[0]] = b; });
  const ctr = id => [B[id][1] + B[id][3] / 2, B[id][2] + B[id][4] / 2];
  const edge = (f, t) => {
    const a = B[f], b = B[t], cx = a[1] + a[3] / 2, cy = a[2] + a[4] / 2;
    const dx = b[1] + b[3] / 2 - cx, dy = b[2] + b[4] / 2 - cy;
    const k = Math.min(dx ? (a[3] / 2) / Math.abs(dx) : 1e9, dy ? (a[4] / 2) / Math.abs(dy) : 1e9);
    return [cx + dx * k, cy + dy * k];
  };
  const arrowEls = sp.arrows.map(([f, t, lab, dash]) => {
    const p1 = edge(f, t), p2 = edge(t, f), mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
    const horiz = Math.abs(p2[0] - p1[0]) > Math.abs(p2[1] - p1[1]);
    return svg('g', { class: 'ar-arrow' },
      svg('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], 'marker-end': 'url(#arah)', 'stroke-dasharray': dash ? '6 5' : null }),
      svg('text', { class: 'ar-lab', x: horiz ? mx : mx + 8, y: horiz ? my - 8 : my, 'text-anchor': horiz ? 'middle' : 'start' }, lab));
  });
  let picked = null;
  const boxEls = sp.boxes.map(([id, x, y, w, hh, label]) => {
    const lines = label.split('\n');
    return svg('g', { class: 'ar-box', tabindex: 0, role: 'button', 'aria-label': sp.comp[id].n, onclick: () => pick(id), onkeydown: e => { if (e.key === 'Enter') pick(id); } },
      svg('rect', { x, y, width: w, height: hh, rx: 10 }),
      lines.map((ln, i) => svg('text', { class: i ? 'ar-sub' : 'ar-title', x: x + w / 2, y: y + hh / 2 + (i - (lines.length - 1) / 2) * 16 + 4, 'text-anchor': 'middle' }, ln)));
  });
  const dot = svg('circle', { class: 'ar-dot', r: 7, cx: 0, cy: 0, opacity: 0 });
  const picture = svg('svg', { viewBox: `0 0 ${sp.w} ${sp.h}`, role: 'img', 'aria-label': sp.cap, style: 'width:100%;max-width:500px;margin:0 auto;height:auto;display:block' },
    svg('defs', {}, svg('marker', { id: 'arah', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, svg('path', { d: 'M0 0L10 5L0 10z', fill: 'currentColor' }))),
    arrowEls, boxEls, dot);
  let mode = steps.modes[0].v, k = 0, tok = 0;
  const text = h('p', { class: 'ar-text' }), count = h('small', { class: 'ar-count' });
  const comp = h('div', { class: 'ar-comp' });
  const S = () => steps[mode];
  function paint() {
    const cur = k ? S()[k - 1] : null;
    boxEls.forEach((el, i) => { const on = !!cur && cur.box.includes(sp.boxes[i][0]); el.classList.toggle('on', on); el.classList.toggle('off', !!cur && !on); });
    arrowEls.forEach((el, i) => el.classList.toggle('on', !!cur && cur.arrows.includes(i)));
    text.textContent = cur ? cur.t : steps.intro[mode];
    count.textContent = 'Step ' + k + ' of ' + S().length;
    paintComp();
  }
  /* click a component: its definition appears under the diagram; click it again to close */
  function pick(id) {
    picked = picked === id ? null : id;
    boxEls.forEach((el, i) => el.classList.toggle('picked', sp.boxes[i][0] === picked));
    paintComp();
  }
  function paintComp() {
    comp.replaceChildren(picked
      ? h('div', { class: 'ar-card' }, h('b', {}, sp.comp[picked].n), h('p', { html: sp.comp[picked].d }))
      : h('p', { class: 'ar-hint' }, 'Click a component in the diagram to see what it does.'));
  }
  function flyDot(pairs) {
    const my = ++tok;
    dot.setAttribute('opacity', 0);
    if (!pairs) return;
    let i = 0;
    const next = () => {
      if (my !== tok) return;
      if (i >= pairs.length) { dot.setAttribute('opacity', 0); return; }
      const [f, t] = pairs[i++], a = ctr(f), b = ctr(t), t0 = performance.now();
      const frame = () => {
        if (my !== tok) return;
        const p = Math.min(1, (performance.now() - t0) / 500);
        dot.setAttribute('cx', a[0] + (b[0] - a[0]) * p);
        dot.setAttribute('cy', a[1] + (b[1] - a[1]) * p);
        dot.setAttribute('opacity', 1);
        if (p < 1) requestAnimationFrame(frame); else setTimeout(next, 150);
      };
      requestAnimationFrame(frame);
    };
    next();
  }
  const play = player({
    speed: 1600,
    step() { if (k >= S().length) return false; k++; paint(); flyDot(S()[k - 1].dot); return k < S().length; },
    reset() { k = 0; tok++; dot.setAttribute('opacity', 0); paint(); } });
  const modeSeg = seg(steps.modes, mode, v => { mode = v; k = 0; tok++; play.stop(); paint(); });
  paint();
  return h('figure', { class: 'arch arch-anim' },
    h('div', { class: 'split' },
      h('div', { class: 'split-l svgw' }, picture),
      h('div', { class: 'split-r' }, h('div', { class: 'arch-ctl' }, play, modeSeg), h('div', { class: 'ar-step' }, count, text), comp)),
    h('figcaption', { class: 'note' }, sp.cap));
}

/* ---- shared helpers for the playgrounds (names start with k8s so they never clash with the framework) ---- */
function k8sMount(root, A, why, parts, noteText) {
  root.append(A.h('div', { class: 'pgbox' }, A.h('p', { class: 'pgwhy' }, 'Hypothesis to test: ' + why), ...parts, A.note('Illustrative model: ' + noteText)));
}
function k8sChip(h, text, cls, sub) { return h('div', { class: 'k8s-chip ' + (cls || '') }, text, sub ? h('small', {}, sub) : null); }
function k8sLane(h, segs, label) {   // segs: [{w, cls, t}] widths are relative
  const total = segs.reduce((a, s) => a + s.w, 0) || 1;
  return h('div', { class: 'k8s-laneRow' }, h('span', { class: 'vl' }, label),
    h('div', { class: 'k8s-lane', role: 'img', 'aria-label': label + ': ' + segs.map(s => s.t || s.cls).join(', ') },
      segs.map(s => h('div', { class: 'k8s-seg ' + s.cls, style: 'flex:' + (s.w / total * 100).toFixed(3) + ' 1 0', title: s.t || '' }, s.w / total > 0.08 ? (s.t || '') : ''))));
}

/* ---------------- ch0 · desired state and the watch chain ---------------- */
PG.apply = function (root, A) {
  const { h, seg, slider, stat, btn, bar, player, logbox } = A;
  let reps = 3, mode = 'create', lab = 'match', stopped = 'none', k = 0, rows = [];
  const log = logbox(), out = stat([]), board = h('div', { class: 'k8s-grid' });
  const ACTORS = [['apiserver', 'API server'], ['deployment', 'Deployment ctrl'], ['replicaset', 'ReplicaSet ctrl'], ['scheduler', 'Scheduler'], ['kubelet', 'Kubelet'], ['endpoints', 'EndpointSlice ctrl']];
  function stages() {
    const img = mode === 'create' ? 'web:1.0' : 'web:1.1';
    return [
      { actor: 'apiserver', dt: 1, msg: mode === 'create' ? 'stores Deployment web (resourceVersion +1)' : 'stores the updated Deployment (new pod template)', add: { D: 1 } },
      { actor: 'deployment', dt: 1, msg: mode === 'create' ? 'creates ReplicaSet web-7d9f (new pod-template-hash)' : 'creates ReplicaSet web-5c8b for the new template', add: { R: 1 } },
      { actor: 'replicaset', dt: 1, msg: 'creates ' + reps + ' Pod objects with empty spec.nodeName', add: { P: reps } },
      { actor: 'scheduler', dt: 1, msg: 'binds ' + reps + ' Pods to nodes (spec.nodeName set)', add: {} },
      { actor: 'kubelet', dt: 4, msg: 'pulls ' + img + ' and starts containers; Pods report Ready (about 4 ticks, illustrative)', add: {} },
      { actor: 'endpoints', dt: 1, msg: 'EndpointSlice lists ' + reps + ' ready Pod IPs; the Service can route', add: {} }];
  }
  function simulate() {
    const res = [{ t: 0, actor: 'kubectl', msg: 'apply sent: ' + (mode === 'create' ? 'create' : 'update image') + ', replicas=' + reps + '. Returns "configured" after the API server stores it (about 200 ms)', cls: 'ok', add: {} }];
    if (lab !== 'match') { res.push({ t: 0, actor: 'apiserver', msg: 'REJECTED by validation: selector does not match template labels. Nothing stored.', cls: 'bad', add: {}, stop: 'API validation (nothing stored)' }); return res; }
    let t = 0;
    for (const s of stages()) {
      if (s.actor === stopped) { res.push({ t, actor: s.actor, msg: s.actor + ' is stopped: nobody reacts to the new state, the chain halts', cls: 'bad', add: {}, stop: s.actor }); return res; }
      t += s.dt; res.push({ t, actor: s.actor, msg: s.msg, cls: 'ok', add: s.add });
    }
    res[res.length - 1].ready = t; return res;
  }
  function paint() {
    const shown = rows.slice(0, k), last = shown[shown.length - 1];
    log.clear(); shown.forEach(r => log.add('t=' + r.t + '  ' + r.actor + ': ' + r.msg, r.cls));
    const made = { D: 0, R: 0, P: 0 }; shown.forEach(r => { for (const q in r.add) made[q] += r.add[q]; });
    const done = k >= rows.length, stopRow = rows.find(r => r.stop), readyRow = rows.find(r => r.ready);
    board.replaceChildren(...ACTORS.map(([id, name]) => {
      const hit = shown.find(r => r.actor === id);
      const cls = stopRow && stopRow.actor === id && shown.includes(stopRow) ? 'bad' : hit ? 'ok' : 'off';
      return k8sChip(h, name, cls, hit ? 't=' + hit.t : (done && stopRow ? 'never reached' : 'waiting'));
    }));
    out.update([{ l: 'Deployment · ReplicaSet · Pods', v: made.D + ' · ' + made.R + ' · ' + made.P },
      { l: 'chain stops at', v: done && stopRow ? stopRow.stop : (done ? 'does not stop' : '…'), cls: done && stopRow ? 'bad' : 'ok' },
      { l: 'time to Ready (ticks)', v: done ? (readyRow ? readyRow.ready : 'never') : '…', cls: done ? (readyRow ? 'ok' : 'bad') : '' }]);
  }
  function recompute(showAll) { rows = simulate(); k = showAll ? rows.length : 0; pl.stop(); paint(); }
  const pl = player({ speed: 700, step() { if (k >= rows.length) return false; k++; paint(); return k < rows.length; }, reset() { k = 0; paint(); } });
  const sReps = slider('replicas', 1, 6, reps, 1, v => { reps = v; recompute(true); });
  const sMode = seg([{ v: 'create', l: 'first apply' }, { v: 'update', l: 'new image' }], mode, v => { mode = v; recompute(true); });
  const sLab = seg([{ v: 'match', l: 'labels match' }, { v: 'bad', l: 'selector mismatch' }], lab, v => { lab = v; recompute(true); });
  const sStop = seg([{ v: 'none', l: 'none' }, { v: 'deployment', l: 'deployment' }, { v: 'replicaset', l: 'replicaset' }, { v: 'scheduler', l: 'scheduler' }, { v: 'kubelet', l: 'kubelet' }], stopped, v => { stopped = v; recompute(true); });
  function preset(s, m, l, r) { stopped = s; mode = m; lab = l; reps = r; sStop.set(s); sMode.set(m); sLab.set(l); sReps.value = r; recompute(false); pl.querySelector('button').click(); }
  k8sMount(root, A, 'kubectl apply only stores state; if one controller in the chain is down, the pods stop appearing at exactly that step.', [
    bar(sMode, sReps, sLab), h('div', { class: 'bar' }, h('span', { class: 'vl' }, 'stopped component'), sStop),
    bar(btn('Reproduce the incident', () => preset('scheduler', 'create', 'match', 3)), btn('Apply the fix', () => preset('none', 'create', 'match', 3))), pl, board, out, log.el],
    'one tick stands for a few seconds and every controller reacts in one tick; real timings depend on load, image pulls and watch latency.');
  recompute(true);
};

/* ---------------- ch1 · the API server request chain ---------------- */
PG.apiserver = function (root, A) {
  const { h, seg, slider, stat, btn, bar, rng } = A;
  let user = 'ci-bot', req = 'delete-ns', bind = 'admin', hook = 'fail', burst = 30;
  const out = stat([]), chain = h('div', { class: 'k8s-grid' }), why = h('p', { class: 'note', 'aria-live': 'polite' });
  const CAP = 50;   // illustrative requests/s the priority level can serve
  const REQ = { 'create-dep': { verb: 'create', res: 'deployments', write: true, hooked: true, label: 'create Deployment in prod' }, 'delete-ns': { verb: 'delete', res: 'namespaces', write: true, hooked: false, label: 'delete Namespace prod' }, 'get-pods': { verb: 'get', res: 'pods', write: false, hooked: false, label: 'get Pods in prod' } };
  function allowed() {
    const q = REQ[req];
    if (user === 'admin') return true;
    if (user === 'viewer') return q.verb === 'get';
    if (user === 'ci-bot') return bind === 'admin' ? true : (q.res === 'deployments' && q.verb === 'create');
    return false;
  }
  function run() {
    const q = REQ[req], stages = [], share = burst > CAP ? (burst - CAP) / burst : 0, draw = rng(11)();
    let code = 0, failed = null, changed = false, hookCalled = false;
    const S = (n, res, note) => stages.push({ n, res, note });
    if (user === 'anonymous') { S('authentication', 'bad', '401'); failed = 'authentication'; code = 401; }
    else S('authentication', 'ok');
    if (!failed) { if (draw < share) { S('flow control', 'bad', '429'); failed = 'flow control'; code = 429; } else S('flow control', 'ok'); } else S('flow control', 'off');
    if (!failed) { if (!allowed()) { S('RBAC', 'bad', '403'); failed = 'RBAC'; code = 403; } else S('RBAC', 'ok'); } else S('RBAC', 'off');
    if (!failed && q.write) {
      if (q.hooked) { hookCalled = true; if (hook === 'fail') { S('mutating webhook', 'bad', '500'); failed = 'mutating webhook'; code = 500; } else if (hook === 'ignore') S('mutating webhook', 'warn', 'down, ignored'); else S('mutating webhook', 'ok'); } else S('mutating webhook', 'off', 'not matched');
      if (!failed) S('schema validation', 'ok'); else S('schema validation', 'off');
      if (!failed) S('validating admission', 'ok'); else S('validating admission', 'off');
    } else { S('mutating webhook', 'off', q.write ? '' : 'read'); S('schema validation', 'off'); S('validating admission', 'off'); }
    if (!failed) { S('etcd write', q.write ? 'ok' : 'off', q.write ? 'stored' : 'read only'); code = q.write ? (q.verb === 'create' ? 201 : 200) : 200; changed = q.write; } else S('etcd write', 'off');
    chain.replaceChildren(...stages.map(s => k8sChip(h, s.n, s.res, s.note || (s.res === 'ok' ? 'passed' : s.res === 'off' ? 'skipped' : ''))));
    const risky = user === 'ci-bot' && bind === 'admin';
    out.update([{ l: 'stage reached', v: failed ? failed : (q.write ? 'persisted' : 'read served'), cls: failed ? 'bad' : 'ok' },
      { l: 'HTTP code', v: code, cls: code >= 400 ? 'bad' : 'ok' },
      { l: 'store revision changed', v: changed ? 'yes' : 'no', cls: changed && user === 'ci-bot' && req === 'delete-ns' ? 'bad' : '' },
      { l: 'webhook called', v: hookCalled ? 'yes' : 'no' },
      { l: 'burst rejected (429)', v: Math.round(share * 100) + '%', cls: share > 0 ? 'bad' : 'ok' },

/* ---------------- ch3 · controllers, edge versus level triggering ---------------- */

/* ---------------- ch5 · kubelet, restarts and limits ---------------- */
PG.kubelet = function (root, A) {

    if (img === 'typo') {

      let t = 0, d = 10;
      while (t + d < HORIZON) { push(t, 'Pending', 'Back-off pulling image  (ImagePullBackOff), next try in ' + d + ' s', 'bad'); delay = d; t += d; push(t, 'Pending', 'Failed to pull image "web:1.O": not found  (ErrImagePull)', 'bad'); d = Math.min(d * 2, 300); }

  const sApp = seg([{ v: 'ok', l: 'app ok (peak 120 Mi)' }, { v: 'exit', l: 'exits 1' }, { v: 'leak', l: 'leaks memory' }, { v: 'busy', l: 'CPU busy (800m)' }], app, v => { app = v; recompute(); });
  const sMem = slider('memory limit (Mi)', 32, 512, mem, 32, v => { mem = v; recompute(); });
  const sCpu = slider('CPU limit (m)', 100, 1000, cpu, 100, v => { cpu = v; recompute(); });
  function set(i, a, m, c) { img = i; app = a; mem = m; cpu = c; sImg.set(i); sApp.set(a); sMem.value = m; sCpu.value = c; recompute(); }

    bar(sImg, sApp), bar(sMem, sCpu), bar(btn('Reproduce the incident', () => set('valid', 'ok', 64, 1000)), btn('Apply the fix', () => set('valid', 'ok', 256, 1000))), pl, strip, out, log.el],
    'time is in seconds over a 20 minute horizon; leak rate (8 Mi/s) and demands are made up, throttling is (1 - limit/demand), and the restart delay resets only after 10 minutes of clean running, which this horizon rarely shows.');

/* ---------------- ch7 · services, endpoints and the termination race ---------------- */
PG.services = function (root, A) {

    bar(sRep, sLag, sPre), bar(sCli, btn('Scale down by 1', () => { scaled = true; run(); }), btn('Undo scale-down', () => { scaled = false; run(); })),
    bar(btn('Reproduce the incident', () => set(6, 0, 'short')), btn('Apply the fix', () => set(6, 10, 'short'))), pods, msg, out],

/* ---------------- ch8 · rolling update arithmetic ---------------- */
PG.rollout = function (root, A) {
  const { h, seg, slider, stat, btn, bar, player } = A;
  let reps = 4, surge = 0, unav = 2, v2 = 'ok', k = 0, frames = [], bad = false;
  const out = stat([]), board = h('div', { class: 'k8s-grid' }), msg = h('p', { class: 'note', 'aria-live': 'polite' });
  function simulate() {
    const f = [{ oldR: reps, newR: 0, newU: 0, t: 0 }];

    let oldR = reps, pods = [], same = 0;

      for (let i = 0; i < canCreate; i++) pods.push(0);

      const prev = f[f.length - 1]; same = (prev.oldR === fr.oldR && prev.newR === fr.newR && prev.newU === fr.newU) ? same + 1 : 0;

  }
  function paint() {
    if (!frames) { board.replaceChildren(); msg.textContent = 'Rejected by validation: maxUnavailable may not be 0 when maxSurge is 0 (representative wording).'; out.update([{ l: 'min Ready', v: '-' }, { l: 'max total pods', v: '-' }, { l: 'rollout time (ticks)', v: '-' }, { l: 'stuck', v: 'rejected', cls: 'bad' }]); return; }

    const cells = []; for (let i = 0; i < cur.oldR; i++) cells.push(k8sChip(h, 'v1', 'ok', 'Ready')); for (let i = 0; i < cur.newR; i++) cells.push(k8sChip(h, 'v2', 'ok', 'Ready')); for (let i = 0; i < cur.newU; i++) cells.push(k8sChip(h, 'v2', 'warn', 'not Ready'));

  }
