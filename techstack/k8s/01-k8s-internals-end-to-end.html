  const pl = player({ speed: 500, step() { if (!frames || k >= frames.length - 1) return false; k++; paint(); return k < frames.length - 1; }, reset() { k = 0; paint(); } });
  const sRep = slider('replicas', 1, 10, reps, 1, v => { reps = v; recompute(); });
  const sSur = slider('maxSurge', 0, 4, surge, 1, v => { surge = v; recompute(); });
  const sUn = slider('maxUnavailable', 0, 4, unav, 1, v => { unav = v; recompute(); });
  const sV2 = seg([{ v: 'ok', l: 'v2 becomes Ready' }, { v: 'never', l: 'v2 never Ready' }], v2, v => { v2 = v; recompute(); });
  function set(r, s, u, v) { reps = r; surge = s; unav = u; v2 = v; sRep.value = r; sSur.value = s; sUn.value = u; sV2.set(v); recompute(); pl.querySelector('button').click(); }
  k8sMount(root, A, 'With replicas 4, maxSurge 0 and maxUnavailable 1 (25%) the Ready count never drops below 3; a larger maxUnavailable cuts capacity, and a v2 that never turns Ready stalls the rollout.', [
    bar(sRep, sSur, sUn), bar(sV2), bar(btn('Reproduce the incident', () => set(4, 0, 2, 'ok')), btn('Apply the fix', () => set(4, 1, 0, 'ok'))), pl, board, msg, out],
    'absolute pod counts instead of percentages, a pod is Ready two ticks after creation, and the controller order is: scale up the new ReplicaSet, then scale down the old one by availability. It ignores minReadySeconds and terminating pods.');

/* ---------------- ch9 · the Horizontal Pod Autoscaler loop ---------------- */
PG.hpa = function (root, A) {
  const { h, svg, seg, slider, stat, btn, bar } = A;
  let load = 'step', target = 70, win = 300, maxR = 20, reqs = 'set';
  const STEPS = 160, REQ = 0.25, BASE = 0.7, MINR = 2, out = stat([]), chart = h('div', { class: 'svgw' });
  function demand(s) { if (load === 'step') return (s < 20 || s >= 100) ? BASE : BASE * 7; const tri = 1 - Math.abs((s % 24) / 12 - 1); return BASE * (1 + 2 * tri); }

    let pods = [0, 0, 0, 0].map(() => 9), hist = [], events = 0, over = 0, peakU = 0, peakR = 4;
    const reps = [], utils = [];
    for (let s = 0; s < STEPS; s++) {
      pods = pods.map(a => a + 1);
      const ready = Math.max(1, pods.filter(a => a >= 2).length), util = demand(s) / (ready * REQ) * 100, cur = pods.length;
      utils.push(util); peakU = Math.max(peakU, util); if (util > target) over++;

        let nxt = cur;

        else if (rec < cur) { const w = Math.max(1, Math.round(win / 15)); nxt = Math.max(rec, ...hist.slice(-w)); nxt = Math.min(nxt, cur); }

      }

    }
    const W = 560, H = 176, P = 28, ymaxR = Math.max(maxR, 8), ymaxU = 600;
    const X = i => P + (W - 2 * P) * i / (STEPS - 1), Yr = v => H - P - (H - 2 * P) * v / ymaxR, Yu = v => H - P - (H - 2 * P) * Math.min(v, ymaxU) / ymaxU;
    const pts = (arr, Y) => arr.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ');
    chart.replaceChildren(svg('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Replicas and CPU utilisation over 40 minutes', style: 'width:100%;min-width:420px;max-width:' + W + 'px;height:auto;display:block;margin:0 auto' },
      svg('line', { x1: P, y1: H - P, x2: W - P, y2: H - P, stroke: 'var(--line)' }), svg('line', { x1: P, y1: Yu(target), x2: W - P, y2: Yu(target), stroke: 'var(--ok)', 'stroke-dasharray': '4 4' }),
      svg('polyline', { points: pts(utils, Yu), fill: 'none', stroke: 'var(--acc2)', 'stroke-width': 1.5, 'stroke-dasharray': '3 3' }), svg('polyline', { points: pts(reps, Yr), fill: 'none', stroke: 'var(--acc)', 'stroke-width': 2.4 }),
      svg('text', { x: P, y: 14, 'font-size': 11, fill: 'var(--acc)' }, 'solid: replicas (max ' + ymaxR + ')'), svg('text', { x: P + 170, y: 14, 'font-size': 11, fill: 'var(--acc2)' }, 'dashed: CPU utilisation (max 600%)'), svg('text', { x: W - P, y: 14, 'font-size': 11, fill: 'var(--ok)', 'text-anchor': 'end' }, 'green: target ' + target + '%'),
      svg('text', { x: P, y: H - 8, 'font-size': 11, fill: 'var(--mut)' }, '0 min'), svg('text', { x: W - P, y: H - 8, 'font-size': 11, fill: 'var(--mut)', 'text-anchor': 'end' }, '40 min')));
    out.update([{ l: 'peak utilisation', v: Math.round(peakU) + '%', cls: peakU > target * 1.5 ? 'bad' : 'ok' }, { l: 'peak replicas', v: peakR }, { l: 'scale events', v: reqs === 'set' ? events : 'none (no signal)', cls: events > 10 ? 'bad' : 'ok' }, { l: 'minutes over target', v: (over * 0.25).toFixed(1), cls: over * 0.25 > 5 ? 'bad' : 'ok' }]);
  }
  const sLoad = seg([{ v: 'step', l: 'step 7x at minute 5' }, { v: 'saw', l: 'sawtooth 1x to 3x' }], load, v => { load = v; run(); });
  const sTgt = slider('target utilisation (%)', 30, 90, target, 5, v => { target = v; run(); });
  const sWin = slider('scale-down window (s)', 0, 600, win, 15, v => { win = v; run(); });
  const sMax = slider('maxReplicas', 4, 40, maxR, 1, v => { maxR = v; run(); });
  const sReq = seg([{ v: 'set', l: 'CPU requests set' }, { v: 'missing', l: 'requests missing' }], reqs, v => { reqs = v; run(); });
  function set(l, t, w, m, r) { load = l; target = t; win = w; maxR = m; reqs = r; sLoad.set(l); sTgt.value = t; sWin.value = w; sMax.value = m; sReq.set(r); run(); }
  k8sMount(root, A, 'With 4 replicas at 140% of a 70% target the HPA asks for 8; a short scale-down window makes a bursty load flap.', [
    bar(sLoad, sReq), bar(sTgt, sWin, sMax), bar(btn('Reproduce the incident', () => set('saw', 70, 15, 20, 'set')), btn('Apply the fix', () => set('saw', 70, 300, 20, 'set'))), chart, out],
    '15 s steps, each pod requests 250m, a new pod counts as ready after 30 s, scale-up adds at most the larger of double or 4 pods per step, and scale-down takes the highest recommendation in the window. The demand curves are made up.');

/* ---------------- ch10 · node failure, taint eviction and at-most-one ---------------- */
PG.nodefail = function (root, A) {
  const { h, seg, slider, stat, btn, bar, logbox } = A;
  let event = 'kill', grace = 40, tol = 300, work = 'sts', pdb = 'min3', op = 'none';
  const HOR = 900, REPL = 7, OPAT = 120, out = stat([]), log = logbox(), lanes = h('div', { class: 'k8s-lanes' });
  function run() {
    log.clear(); let tRep = null, dup = 0, blocked = 0; const L = [];
    if (event === 'drain') {
      log.add('t=0 s  kubectl drain node-7: evict web-pod through the Eviction API', 'mut');
      if (pdb === 'min3') { blocked = Math.floor(HOR / 5); log.add('t=0 s  Cannot evict pod as it would violate the pod’s disruption budget. (retry every 5 s, ' + blocked + ' tries in 15 min)', 'bad'); L.push({ w: HOR, cls: 'bad', t: 'drain blocked by PDB' }); }
      else { tRep = REPL; log.add('t=0 s  PDB allows 1 disruption: pod evicted, replacement scheduled elsewhere', 'ok'); log.add('t=' + REPL + ' s  replacement Ready', 'ok'); L.push({ w: REPL, cls: 'warn', t: '' }, { w: HOR - REPL, cls: 'ok', t: 'serving at full count' }); }
    } else {
      log.add('t=0 s  node-7 ' + (event === 'kill' ? 'loses power' : 'is partitioned from the control plane (kubelet and pods still running)') + '; last Lease renewal', 'mut');
      log.add('t=' + grace + ' s  node lifecycle controller: Ready=Unknown, taint node.kubernetes.io/unreachable:NoExecute added', 'mut');
      const tEv = grace + tol;
      L.push({ w: grace, cls: 'warn', t: 'silent, still Ready' }, { w: tol, cls: 'warn', t: 'tainted, pods tolerate it' });
      if (work === 'deploy') {
        tRep = tEv + REPL; log.add('t=' + tEv + ' s  tolerationSeconds elapsed: pod evicted (deletion requested)', 'mut'); log.add('t=' + tRep + ' s  ReplicaSet created a replacement and it is Ready', 'ok');
        if (event === 'partition') { dup = 1; log.add('the old pod is still running on the partitioned node: 2 copies serve until it heals', 'bad'); }
        L.push({ w: REPL, cls: 'bad', t: 'replacing' }, { w: Math.max(1, HOR - tRep), cls: 'ok', t: 'replaced' });
      } else if (op === 'none') {
        log.add('t=' + tEv + ' s  pod marked for deletion, but an unreachable kubelet cannot confirm: pod stays Terminating', 'bad'); log.add('no replacement is created: at-most-one semantics for the StatefulSet', 'bad');
        L.push({ w: Math.max(1, HOR - tEv), cls: 'bad', t: 'no replacement' });
      } else {
        const tOp = Math.max(OPAT, 0); tRep = tOp + REPL;
        log.add('t=' + tOp + ' s  operator verified the node is off and added node.kubernetes.io/out-of-service:NoExecute', 'ok');
        log.add('t=' + tRep + ' s  StatefulSet pod recreated on another node and Ready', 'ok');
        if (event === 'partition') { dup = 1; log.add('but node-7 was only partitioned: the old pod may still write to its volume (split brain)', 'bad'); }
        L.length = 0; L.push({ w: tOp, cls: 'warn', t: 'waiting for operator' }, { w: REPL, cls: 'bad', t: 'replacing' }, { w: Math.max(1, HOR - tRep), cls: 'ok', t: 'replaced' });
      }
    }
    lanes.replaceChildren(k8sLane(h, L, 'one pod of the service, 0 to 15 min'));
    const lost = tRep === null ? HOR / 60 : tRep / 60;
    out.update([{ l: 'time to replacement', v: tRep === null ? (event === 'drain' ? 'blocked' : 'never') : tRep + ' s', cls: tRep === null ? 'bad' : 'ok' },
      { l: 'capacity lost (pod-min)', v: (tRep === null ? '≥ ' : '') + lost.toFixed(1), cls: lost > 3 ? 'bad' : 'ok' },
      { l: 'duplicate pods', v: dup, cls: dup && work === 'sts' ? 'bad' : (dup ? 'warn' : 'ok') }, { l: 'blocked evictions', v: blocked, cls: blocked ? 'bad' : 'ok' }]);
  }
  const sEv = seg([{ v: 'kill', l: 'kill node' }, { v: 'partition', l: 'partition node' }, { v: 'drain', l: 'drain node' }], event, v => { event = v; run(); });
  const sWork = seg([{ v: 'deploy', l: 'Deployment' }, { v: 'sts', l: 'StatefulSet' }], work, v => { work = v; run(); });
  const sGr = slider('node-monitor-grace-period (s)', 10, 120, grace, 5, v => { grace = v; run(); });
  const sTol = slider('tolerationSeconds', 0, 600, tol, 30, v => { tol = v; run(); });
  const sPdb = seg([{ v: 'none', l: 'no PDB' }, { v: 'min2', l: 'PDB minAvailable 2 of 3' }, { v: 'min3', l: 'PDB minAvailable 3 of 3' }], pdb, v => { pdb = v; run(); });
  const sOp = seg([{ v: 'none', l: 'operator: nothing' }, { v: 'oos', l: 'operator: out-of-service taint' }], op, v => { op = v; run(); });
  function set(e, g, t, w, p, o) { event = e; grace = g; tol = t; work = w; pdb = p; op = o; sEv.set(e); sGr.value = g; sTol.value = t; sWork.set(w); sPdb.set(p); sOp.set(o); run(); }

    'one pod on one node over a 15 minute horizon; replacement takes 7 s once allowed and the operator reacts at 120 s (both made up). Defaults modelled: node-monitor-grace-period 40 s and a 300 s unreachable toleration.');

};

function commonSection(c, numEl) {

/* ---- problem-based amendment: predict before the mechanism. Keep byte-identical on all six pages ---- */
function predictBlock(c, numEl) {
  const P = c.predict;
  const why = h('p', { class: 'note why', html: '<b>Why:</b> ' + P.why });
  why.hidden = true;
  const opts = h('div', { class: 'opts', role: 'group', 'aria-label': 'Choose a prediction' });
  P.opts.forEach((o, k) => opts.append(h('button', { html: o, onclick() {
    [...opts.children].forEach((b, j) => { b.disabled = true; b.classList.toggle('right', j === P.ans); b.classList.toggle('wrong', j === k && k !== P.ans); });
    why.hidden = false;
  } })));
  return h('section', { class: 'blk quiz' }, h('h3', {}, numEl, 'Predict before you read on'), h('p', { class: 'q', html: P.q }), opts, why);
}

function chapter(i) {
  const c = CHAPTERS[i], p = PHASES[i], P = partOf(i); let n = 0; const num = () => h('i', {}, ++n);
  document.title = (i + 1) + '. ' + p.t + ' · ' + COURSE.title;

    i < CHAPTERS.length - 1 ? h('button', { class: 'primary', onclick: () => { location.hash = 'ch' + (i + 1); } }, (i + 2) + '. ' + PHASES[i + 1].t + ' →') : (COURSE.other ? h('a', { class: 'btn primary', href: COURSE.other.href, style: 'text-decoration:none;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:10px;background:var(--acc);color:var(--on-brand,#fff);font-weight:600;font-size:14px' }, COURSE.other.label + ' →') : h('button', { onclick: () => { location.hash = ''; } }, 'All chapters')));

    h('div', { class: 'chhead', style: '--pc:' + pc(i) }, h('div', { class: 'n' }, i + 1), h('div', {}, h('small', {}, (COURSE.flat ? COURSE.title : P.name) + ' · chapter ' + (i + 1) + ' of ' + CHAPTERS.length), h('h1', {}, p.t))),
    h('section', { class: 'blk' }, h('h3', {}, num(), 'The problem'), h('div', { class: 'prob' }, h('div', { html: c.scene.map(x => '<p>' + x + '</p>').join('') }), h('p', { class: 'q' }, c.ask))),
    c.predict ? predictBlock(c, num()) : null,

    ...(c.walks || (c.walk ? [c.walk] : [])).map(w => h('section', { class: 'blk' }, h('h3', {}, num(), w.title), walkAnim(w))),
    h('section', { class: 'blk' }, h('h3', {}, num(), c.archSteps ? c.archTitle : c.arch ? (c.pg ? 'Overall architecture and playground' : 'Overall architecture') : 'Playground'), c.arch ? (c.archSteps ? archAnim(c.arch, c.archSteps) : diagram(c.arch)) : null, c.archNote ? h('p', { class: 'archnote', html: c.archNote }) : null, c.pg ? pgbox : null),
    commonSection(c, num()),
    nav));
  if (c.pg) try { PG[c.pg](pgbox, API); } catch (e) { console.error(e); pgbox.append(h('div', { class: 'callout warn' }, 'Playground failed to load: ' + e.message)); }

}
function route() {
