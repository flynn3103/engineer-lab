<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc"><title id="title">Linearizability respects completed operations</title><desc id="desc">A write completes before a read begins, so that read must observe the write or a later one.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#55516b"/></marker></defs><rect width="640" height="340" rx="12" fill="#f9f8fc"/><g font-family="system-ui,sans-serif" font-size="14" fill="#252239"><text x="24" y="30" font-size="17" font-weight="700">Linearizability respects completed operations</text><text x="20" y="112" text-anchor="start" font-size="14">Write x = 2</text><text x="20" y="216" text-anchor="start" font-size="14">Read x</text><line x1="145" y1="126" x2="606" y2="126" stroke="#aaa" stroke-width="1"/><line x1="145" y1="230" x2="606" y2="230" stroke="#aaa" stroke-width="1"/><rect x="166" y="98" width="190" height="56" rx="8" fill="#e8e4fb" stroke="#777084"/><text x="261.0" y="126.0" text-anchor="middle" font-size="14">invoke → response</text><text x="261.0" y="145.0" text-anchor="middle" font-size="12">write interval</text><rect x="410" y="202" width="180" height="56" rx="8" fill="#e0f3e9" stroke="#777084"/><text x="500.0" y="230.0" text-anchor="middle" font-size="14">invoke → response</text><text x="500.0" y="249.0" text-anchor="middle" font-size="12">read interval</text><line x1="380" y1="62" x2="380" y2="275" stroke="#9d7a25" stroke-width="2"/><text x="380" y="294" text-anchor="middle" font-size="14">The write has completed before the read starts.</text></g></svg>