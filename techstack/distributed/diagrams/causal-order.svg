<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc"><title id="title">Follow causes before reading clocks</title><desc id="desc">The send of a message happens before its receipt even if the receiver wall clock is behind.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#55516b"/></marker></defs><rect width="640" height="340" rx="12" fill="#f9f8fc"/><g font-family="system-ui,sans-serif" font-size="14" fill="#252239"><text x="24" y="30" font-size="17" font-weight="700">Follow causes before reading clocks</text><text x="20" y="100" text-anchor="start" font-size="14">A</text><text x="20" y="235" text-anchor="start" font-size="14">B</text><line x1="65" y1="100" x2="602" y2="100" stroke="#777084" stroke-width="2"/><line x1="65" y1="235" x2="602" y2="235" stroke="#777084" stroke-width="2"/><rect x="110" y="73" width="162" height="54" rx="8" fill="#e8e4fb" stroke="#777084"/><text x="191.0" y="100.0" text-anchor="middle" font-size="14">send question</text><text x="191.0" y="119.0" text-anchor="middle" font-size="12">wall clock 12:00:05</text><rect x="360" y="207" width="178" height="54" rx="8" fill="#e0f3e9" stroke="#777084"/><text x="449.0" y="234.0" text-anchor="middle" font-size="14">receive question</text><text x="449.0" y="253.0" text-anchor="middle" font-size="12">wall clock 12:00:02</text><line x1="272" y1="127" x2="360" y2="207" stroke="#55516b" stroke-width="2" marker-end="url(#arrow)"/><text x="316.0" y="158.0" text-anchor="middle" font-size="12">cause → effect</text><text x="320" y="300" text-anchor="middle" font-size="14">Physical timestamps disagree. The message still proves the order.</text></g></svg>