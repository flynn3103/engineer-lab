<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc"><title id="title">Two processes, two memories</title><desc id="desc">A remote request carries bytes between isolated processes; neither process can read the other memory.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#55516b"/></marker></defs><rect width="640" height="340" rx="12" fill="#f9f8fc"/><g font-family="system-ui,sans-serif" font-size="14" fill="#252239"><text x="24" y="30" font-size="17" font-weight="700">Two processes, two memories</text><rect x="24" y="75" width="230" height="120" rx="8" fill="#e8e4fb" stroke="#777084"/><text x="139.0" y="135.0" text-anchor="middle" font-size="14">Process A</text><text x="139.0" y="154.0" text-anchor="middle" font-size="12">its own memory and disk</text><rect x="386" y="75" width="230" height="120" rx="8" fill="#e0f3e9" stroke="#777084"/><text x="501.0" y="135.0" text-anchor="middle" font-size="14">Process B</text><text x="501.0" y="154.0" text-anchor="middle" font-size="12">its own memory and disk</text><line x1="254" y1="112" x2="386" y2="112" stroke="#55516b" stroke-width="2" marker-end="url(#arrow)"/><text x="320.0" y="103.0" text-anchor="middle" font-size="12">request bytes</text><line x1="386" y1="162" x2="254" y2="162" stroke="#55516b" stroke-width="2" marker-end="url(#arrow)"/><text x="320.0" y="153.0" text-anchor="middle" font-size="12">reply bytes</text><text x="320" y="248" text-anchor="middle" font-size="14">The network is a separate part that can delay or fail.</text><text x="320" y="278" text-anchor="middle" font-size="14">A keeps running even when it cannot reach B.</text></g></svg>