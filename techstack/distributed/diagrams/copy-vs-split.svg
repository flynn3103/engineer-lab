<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc"><title id="title">Copying data and splitting data solve different problems</title><desc id="desc">Replication places orders 1 and 2 on both machines. Partitioning places order 1 on A and order 2 on B.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#55516b"/></marker></defs><rect width="640" height="340" rx="12" fill="#f9f8fc"/><g font-family="system-ui,sans-serif" font-size="14" fill="#252239"><text x="24" y="30" font-size="17" font-weight="700">Copying data and splitting data solve different problems</text><text x="166" y="70" text-anchor="middle" font-size="14">Replication</text><text x="474" y="70" text-anchor="middle" font-size="14">Partitioning / sharding</text><rect x="24" y="105" width="132" height="130" rx="8" fill="#e8e4fb" stroke="#777084"/><text x="90.0" y="170.0" text-anchor="middle" font-size="14">A</text><text x="90.0" y="189.0" text-anchor="middle" font-size="12">orders 1 and 2</text><rect x="178" y="105" width="132" height="130" rx="8" fill="#e8e4fb" stroke="#777084"/><text x="244.0" y="170.0" text-anchor="middle" font-size="14">B</text><text x="244.0" y="189.0" text-anchor="middle" font-size="12">orders 1 and 2</text><rect x="332" y="105" width="132" height="130" rx="8" fill="#e0f3e9" stroke="#777084"/><text x="398.0" y="170.0" text-anchor="middle" font-size="14">A</text><text x="398.0" y="189.0" text-anchor="middle" font-size="12">order 1</text><rect x="486" y="105" width="132" height="130" rx="8" fill="#fff0ce" stroke="#777084"/><text x="552.0" y="170.0" text-anchor="middle" font-size="14">B</text><text x="552.0" y="189.0" text-anchor="middle" font-size="12">order 2</text><text x="166" y="280" text-anchor="middle" font-size="14">Same records, extra copy</text><text x="474" y="280" text-anchor="middle" font-size="14">Different records, extra capacity</text></g></svg>