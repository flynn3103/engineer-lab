<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc"><title id="title">Replication copies the same data</title><desc id="desc">Leader A appends set title Lead at position 3; follower B replays that entry into a separate copy.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#55516b"/></marker></defs><rect width="640" height="340" rx="12" fill="#f9f8fc"/><g font-family="system-ui,sans-serif" font-size="14" fill="#252239"><text x="24" y="30" font-size="17" font-weight="700">Replication copies the same data</text><rect x="24" y="70" width="200" height="58" rx="8" fill="#e8e4fb" stroke="#777084"/><text x="124.0" y="99.0" text-anchor="middle" font-size="14">Leader A</text><text x="124.0" y="118.0" text-anchor="middle" font-size="12">accepts the write</text><rect x="416" y="70" width="200" height="58" rx="8" fill="#e0f3e9" stroke="#777084"/><text x="516.0" y="99.0" text-anchor="middle" font-size="14">Follower B</text><text x="516.0" y="118.0" text-anchor="middle" font-size="12">replays the write</text><line x1="224" y1="99" x2="416" y2="99" stroke="#55516b" stroke-width="2" marker-end="url(#arrow)"/><text x="320.0" y="90.0" text-anchor="middle" font-size="12">entry 3: set title</text><rect x="24" y="171" width="200" height="65" rx="8" fill="#e8e4fb" stroke="#777084"/><text x="124.0" y="203.5" text-anchor="middle" font-size="14">title = Lead</text><text x="124.0" y="222.5" text-anchor="middle" font-size="12">log: 1, 2, 3</text><rect x="416" y="171" width="200" height="65" rx="8" fill="#e0f3e9" stroke="#777084"/><text x="516.0" y="203.5" text-anchor="middle" font-size="14">title = Lead</text><text x="516.0" y="222.5" text-anchor="middle" font-size="12">log: 1, 2, 3</text><text x="320" y="286" text-anchor="middle" font-size="14">Two disks hold one logical record. Capacity is not doubled.</text></g></svg>