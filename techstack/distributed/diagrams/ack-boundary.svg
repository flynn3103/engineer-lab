<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc"><title id="title">What does OK promise?</title><desc id="desc">Asynchronous OK precedes follower storage. Waiting for a durable follower acknowledgment adds latency and a surviving copy.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#55516b"/></marker></defs><rect width="640" height="340" rx="12" fill="#f9f8fc"/><g font-family="system-ui,sans-serif" font-size="14" fill="#252239"><text x="24" y="30" font-size="17" font-weight="700">What does OK promise?</text><text x="22" y="86" text-anchor="start" font-size="14">Async</text><line x1="130" y1="100" x2="606" y2="100" stroke="#777084" stroke-width="2"/><rect x="138" y="72" width="118" height="58" rx="8" fill="#e8e4fb" stroke="#777084"/><text x="197.0" y="101.0" text-anchor="middle" font-size="14">A stores</text><text x="197.0" y="120.0" text-anchor="middle" font-size="12">1 copy</text><rect x="290" y="72" width="110" height="58" rx="8" fill="#fff0ce" stroke="#777084"/><text x="345.0" y="101.0" text-anchor="middle" font-size="14">OK</text><text x="345.0" y="120.0" text-anchor="middle" font-size="12">1 copy</text><rect x="450" y="72" width="146" height="58" rx="8" fill="#e0f3e9" stroke="#777084"/><text x="523.0" y="101.0" text-anchor="middle" font-size="14">B stores</text><text x="523.0" y="120.0" text-anchor="middle" font-size="12">2 copies</text><text x="22" y="209" text-anchor="start" font-size="14">Wait for B</text><line x1="130" y1="222" x2="606" y2="222" stroke="#777084" stroke-width="2"/><rect x="138" y="193" width="118" height="58" rx="8" fill="#e8e4fb" stroke="#777084"/><text x="197.0" y="222.0" text-anchor="middle" font-size="14">A stores</text><text x="197.0" y="241.0" text-anchor="middle" font-size="12">1 copy</text><rect x="290" y="193" width="146" height="58" rx="8" fill="#e0f3e9" stroke="#777084"/><text x="363.0" y="222.0" text-anchor="middle" font-size="14">B stores + ACK</text><text x="363.0" y="241.0" text-anchor="middle" font-size="12">2 copies</text><rect x="482" y="193" width="114" height="58" rx="8" fill="#e0f3e9" stroke="#777084"/><text x="539.0" y="222.0" text-anchor="middle" font-size="14">OK</text><text x="539.0" y="241.0" text-anchor="middle" font-size="12">2 copies</text><text x="320" y="300" text-anchor="middle" font-size="14">Time moves right. ACK = acknowledgment of the agreed storage stage.</text></g></svg>