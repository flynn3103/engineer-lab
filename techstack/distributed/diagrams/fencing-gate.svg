<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc"><title id="title">The resource checks authority</title><desc id="desc">Worker A resumes with token 7 after worker B has written with token 8. Storage rejects A because 7 is older than the highest accepted token.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#55516b"/></marker></defs><rect width="640" height="340" rx="12" fill="#f9f8fc"/><g font-family="system-ui,sans-serif" font-size="14" fill="#252239"><text x="24" y="30" font-size="17" font-weight="700">The resource checks authority</text><rect x="24" y="74" width="178" height="68" rx="8" fill="#fbe1e5" stroke="#777084"/><text x="113.0" y="108.0" text-anchor="middle" font-size="14">Worker A</text><text x="113.0" y="127.0" text-anchor="middle" font-size="12">token 7 · resumed</text><rect x="24" y="198" width="178" height="68" rx="8" fill="#e0f3e9" stroke="#777084"/><text x="113.0" y="232.0" text-anchor="middle" font-size="14">Worker B</text><text x="113.0" y="251.0" text-anchor="middle" font-size="12">token 8 · current</text><rect x="406" y="124" width="210" height="100" rx="8" fill="#e8e4fb" stroke="#777084"/><text x="511.0" y="174.0" text-anchor="middle" font-size="14">Storage gate</text><text x="511.0" y="193.0" text-anchor="middle" font-size="12">highest token = 8</text><line x1="202" y1="108" x2="406" y2="150" stroke="#55516b" stroke-width="2" marker-end="url(#arrow)"/><text x="304.0" y="120.0" text-anchor="middle" font-size="12">7: reject</text><line x1="202" y1="232" x2="406" y2="202" stroke="#55516b" stroke-width="2" marker-end="url(#arrow)"/><text x="304.0" y="208.0" text-anchor="middle" font-size="12">8: accept</text><text x="320" y="304" text-anchor="middle" font-size="14">Checking a lease in the worker cannot stop a delayed write.</text></g></svg>