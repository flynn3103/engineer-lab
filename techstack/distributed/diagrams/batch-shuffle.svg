<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc"><title id="title">Shuffle groups records by key</title><desc id="desc">Mappers emit city and amount pairs. The shuffle routes all records for the same city to the same reducer.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#55516b"/></marker></defs><rect width="640" height="340" rx="12" fill="#f9f8fc"/><g font-family="system-ui,sans-serif" font-size="14" fill="#252239"><text x="24" y="30" font-size="17" font-weight="700">Shuffle groups records by key</text><rect x="24" y="72" width="158" height="60" rx="8" fill="#e8e4fb" stroke="#777084"/><text x="103.0" y="102.0" text-anchor="middle" font-size="14">Map task 1</text><text x="103.0" y="121.0" text-anchor="middle" font-size="12">HCM 10, Hanoi 5</text><rect x="24" y="212" width="158" height="60" rx="8" fill="#e8e4fb" stroke="#777084"/><text x="103.0" y="242.0" text-anchor="middle" font-size="14">Map task 2</text><text x="103.0" y="261.0" text-anchor="middle" font-size="12">HCM 20, Hanoi 7</text><rect x="438" y="72" width="178" height="60" rx="8" fill="#e0f3e9" stroke="#777084"/><text x="527.0" y="102.0" text-anchor="middle" font-size="14">Reduce HCM</text><text x="527.0" y="121.0" text-anchor="middle" font-size="12">10 + 20 = 30</text><rect x="438" y="212" width="178" height="60" rx="8" fill="#fff0ce" stroke="#777084"/><text x="527.0" y="242.0" text-anchor="middle" font-size="14">Reduce Hanoi</text><text x="527.0" y="261.0" text-anchor="middle" font-size="12">5 + 7 = 12</text><line x1="182" y1="93" x2="438" y2="93" stroke="#55516b" stroke-width="2" marker-end="url(#arrow)"/><text x="310.0" y="84.0" text-anchor="middle" font-size="12">HCM 10</text><line x1="182" y1="245" x2="438" y2="117" stroke="#55516b" stroke-width="2" marker-end="url(#arrow)"/><text x="310.0" y="172.0" text-anchor="middle" font-size="12">HCM 20</text><line x1="182" y1="115" x2="438" y2="228" stroke="#55516b" stroke-width="2" marker-end="url(#arrow)"/><text x="310.0" y="162.5" text-anchor="middle" font-size="12">Hanoi 5</text><line x1="182" y1="263" x2="438" y2="263" stroke="#55516b" stroke-width="2" marker-end="url(#arrow)"/><text x="310.0" y="254.0" text-anchor="middle" font-size="12">Hanoi 7</text><text x="320" y="310" text-anchor="middle" font-size="14">One key must meet in one place to compute its group result.</text></g></svg>