<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc"><title id="title">A node changes role through protocol rules</title><desc id="desc">Followers can become candidates on election timeout; candidates become leaders on a majority vote. Higher terms cause step down.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#55516b"/></marker></defs><rect width="640" height="340" rx="12" fill="#f9f8fc"/><g font-family="system-ui,sans-serif" font-size="14" fill="#252239"><text x="24" y="30" font-size="17" font-weight="700">A node changes role through protocol rules</text><rect x="24" y="104" width="164" height="72" rx="8" fill="#e8e4fb" stroke="#777084"/><text x="106.0" y="140.0" text-anchor="middle" font-size="14">Follower</text><text x="106.0" y="159.0" text-anchor="middle" font-size="12">listens to leader</text><rect x="238" y="104" width="164" height="72" rx="8" fill="#fff0ce" stroke="#777084"/><text x="320.0" y="140.0" text-anchor="middle" font-size="14">Candidate</text><text x="320.0" y="159.0" text-anchor="middle" font-size="12">asks for votes</text><rect x="452" y="104" width="164" height="72" rx="8" fill="#e0f3e9" stroke="#777084"/><text x="534.0" y="140.0" text-anchor="middle" font-size="14">Leader</text><text x="534.0" y="159.0" text-anchor="middle" font-size="12">replicates the log</text><line x1="188" y1="140" x2="238" y2="140" stroke="#55516b" stroke-width="2" marker-end="url(#arrow)"/><line x1="402" y1="140" x2="452" y2="140" stroke="#55516b" stroke-width="2" marker-end="url(#arrow)"/><text x="212" y="92" text-anchor="middle" font-size="12">timeout</text><text x="425" y="92" text-anchor="middle" font-size="12">majority</text><line x1="534" y1="176" x2="534" y2="258" stroke="#55516b" stroke-width="2" marker-end="url(#arrow)"/><line x1="534" y1="258" x2="106" y2="258" stroke="#55516b" stroke-width="2" marker-end="url(#arrow)"/><text x="320.0" y="249.0" text-anchor="middle" font-size="12">higher term: step down</text><line x1="106" y1="258" x2="106" y2="176" stroke="#55516b" stroke-width="2" marker-end="url(#arrow)"/></g></svg>