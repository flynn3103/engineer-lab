<div id="app"></div>
<script>
/* ---- tiny helpers shared by the chapters and playgrounds ---- */
const PG = {};
const COMMON = {};   // COMMON.<pgkey> = [...] overrides that chapter's common-problems list
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TIMERS = [];
function stopTimers() { while (TIMERS.length) { const t = TIMERS.pop(); clearInterval(t); clearTimeout(t); } }
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  const add = k => { if (k == null || k === false) return; if (Array.isArray(k)) k.forEach(add); else el.append(k.nodeType ? k : document.createTextNode(String(k))); };
  kids.forEach(add);
  return el;
}
function svg(tag, props, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in (props || {})) { const v = props[k]; if (v == null || v === false) continue; if (k === 'class') el.setAttribute('class', v); else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v); else el.setAttribute(k, v); }
  const add = k => { if (k == null || k === false) return; if (Array.isArray(k)) k.forEach(add); else el.append(k.nodeType ? k : document.createTextNode(String(k))); };
  kids.forEach(add);
  return el;
}
/* seeded random numbers, so every run of a playground repeats */
function rng(seed) { let a = (seed >>> 0) || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const bar = (...k) => h('div', { class: 'bar' }, ...k);
const btn = (label, fn, cls) => h('button', { class: cls || '', onclick: fn }, label);
const badge = (text, kind) => h('span', { class: 'badge ' + (kind || '') }, text);
const note = t => h('p', { class: 'note' }, t);
function seg(opts, val, cb) {          // opts: [{v,l}] or [v]; returns element with .value and .set(v)
  const el = h('div', { class: 'seg', role: 'group' });
  const norm = opts.map(o => (typeof o === 'object' ? o : { v: o, l: String(o) }));
  const paint = () => [...el.children].forEach((b, i) => b.classList.toggle('on', norm[i].v === el.value));
  norm.forEach(o => el.append(h('button', { onclick() { el.value = o.v; paint(); cb && cb(o.v); } }, o.l)));
  el.value = val; el.set = v => { el.value = v; paint(); }; paint(); return el;
}
function slider(label, min, max, val, step, cb, fmt) {   // returns <label> with .input and .value
  const out = h('b', {}, fmt ? fmt(val) : val);
  const input = h('input', { type: 'range', min, max, step: step || 1, value: val, 'aria-label': label });
  input.addEventListener('input', () => { out.textContent = fmt ? fmt(+input.value) : input.value; cb && cb(+input.value); });
  const el = h('label', { class: 'sl' }, label, input, out);
  Object.defineProperty(el, 'value', { get: () => +input.value, set: v => { input.value = v; out.textContent = fmt ? fmt(+v) : v; } });
  return el;
}
function player(o) {   // o.step() -> false when finished, o.reset(), o.speed ms per tick. returns element with .stop()
  let t = null;
  const stop = () => { if (t) { clearInterval(t); const i = TIMERS.indexOf(t); if (i >= 0) TIMERS.splice(i, 1); t = null; } play.textContent = '▶ Play'; };
  const tick = () => { if (o.step() === false) stop(); };
  const play = btn('▶ Play', () => { if (t) { stop(); return; } t = setInterval(tick, o.speed || 600); TIMERS.push(t); play.textContent = '⏸ Pause'; tick(); }, 'primary');
  const el = bar(play, btn('Step ›', () => { stop(); tick(); }), btn('⏮ Reset', () => { stop(); o.reset(); }));
  el.stop = stop; return el;
}
function logbox() {
  const el = h('div', { class: 'log', 'aria-live': 'polite' });
  return { el, add(text, cls) { el.append(h('div', { class: cls || '' }, text)); el.scrollTop = el.scrollHeight; }, clear() { el.textContent = ''; } };
}
function stat(items) {   // items: [{l, v, cls}] -> element; call el.update(items) to refresh
  const el = h('div', { class: 'stat' });
  el.update = its => { el.textContent = ''; its.forEach(i => el.append(h('div', { class: i.cls || '' }, h('small', {}, i.l), h('b', {}, i.v)))); };
  el.update(items || []); return el;
}
const API = { h, svg, rng, bar, btn, badge, note, seg, slider, player, logbox, stat, esc, timers: TIMERS };
/* static architecture diagram: spec = {w,h,boxes:[[id,x,y,w,h,label,tone]],arrows:[[from,to,label,dashed]],cap}; tone 0..7 picks a --p colour; '\n' splits lines */
function diagram(sp) {
  const B = {}; sp.boxes.forEach(b => { B[b[0]] = { x: b[1], y: b[2], w: b[3], h: b[4] }; });
  const s = svg('svg', { viewBox: `0 0 ${sp.w} ${sp.h}`, role: 'img', 'aria-label': sp.cap || 'diagram', style: 'width:100%;min-width:' + Math.min(sp.w, 540) + 'px;max-width:' + sp.w + 'px;height:auto;display:block;margin:0 auto' });
  s.append(svg('defs', {}, svg('marker', { id: 'ah', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, svg('path', { d: 'M0 0L10 5L0 10z', fill: 'currentColor' }))));
  const edge = (a, t) => { const cx = a.x + a.w / 2, cy = a.y + a.h / 2, dx = t.x + t.w / 2 - cx, dy = t.y + t.h / 2 - cy; const k = Math.min(dx ? (a.w / 2) / Math.abs(dx) : 1e9, dy ? (a.h / 2) / Math.abs(dy) : 1e9); return [cx + dx * k, cy + dy * k]; };
  (sp.arrows || []).forEach(([f, t, lab, dash]) => {
    const [x1, y1] = edge(B[f], B[t]), [x2, y2] = edge(B[t], B[f]);
    s.append(svg('line', { x1, y1, x2, y2, stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-dasharray': dash ? '5 4' : null, 'marker-end': 'url(#ah)', style: 'color:var(--mut)' }));
    if (lab) s.append(svg('text', { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 5, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--mut)' }, lab));
  });
  sp.boxes.forEach(([id, x, y, w, hh, lab, tone]) => {
    s.append(svg('rect', { x, y, width: w, height: hh, rx: 9, fill: tone == null ? 'var(--card)' : 'var(--p' + tone + ')', stroke: 'var(--line)', 'stroke-width': 1.5 }));
    const ls = String(lab).split('\n'), y0 = y + hh / 2 - (ls.length - 1) * 8 + 4;
    ls.forEach((l, i) => s.append(svg('text', { x: x + w / 2, y: y0 + i * 16, 'text-anchor': 'middle', 'font-size': 12.5, fill: 'var(--ink)', 'font-weight': i === 0 && ls.length > 1 ? 700 : 400 }, l)));
  });
  return h('figure', { class: 'arch' }, h('div', { class: 'svgw' }, s), sp.cap ? h('figcaption', { class: 'note' }, sp.cap) : null);
}
API.diagram = diagram;

const COURSE={
 title:'Distributed Systems',kick:'13 chapters · each new chapter opens with a system that fails',
 h1:'<span>Distributed</span> systems: when one machine is not enough',
 lead:'Start with the wall that threads, cores and async cannot get past. Then what changes once there is a network between your parts: lost messages, copies that disagree, clocks that lie, leaders that pause. Then the algorithms that cope: replication, quorums, consensus, atomic commit, and the logs that feed batch and stream processing. Each new chapter starts from a failing system and animates the fix.',
 flat:true,parts:[{name:'Distributed systems',from:0,to:13}],
 other:{href:'../concurrency/01-concurrency-end-to-end.html',label:'Concurrency'}
};
const PHASES=[
 {t:'When concurrency and async stop helping',s:'Amdahl · shared bottleneck · availability · latency floor'},
 {t:'Remote calls & RPC',s:'partial failure · timeouts · retries · idempotence'},
 {t:'Leaders, followers and failover',s:'sync vs async · replication log · lost writes'},
 {t:'Replication lag and what users see',s:'read-your-writes · monotonic reads · consistent prefix'},
 {t:'Writes everywhere: conflicts and quorums',s:'multi-leader · W + R > N · sloppy quorums'},
 {t:'Splitting data: partitioning',s:'key range · hash · hot spots · rebalancing'},
 {t:'Pauses, leases and fencing',s:'zombie leader · fencing tokens · majority · Byzantine'},
 {t:'Clocks and order',s:'clock skew · last-write-wins · Lamport · vector clocks'},
 {t:'Linearizability',s:'one current value · what it costs · CAP'},
 {t:'Agreeing on a leader: consensus',s:'terms · majority commit · Raft election'},
 {t:'Atomic commit: two-phase commit',s:'prepare · in doubt · coordinator crash'},
 {t:'Batch processing: MapReduce',s:'map · shuffle · reduce · recompute'},
 {t:'Stream processing: logs and events',s:'offsets · change capture · event sourcing · late events'}
];
const CHAPTERS=[
{ask:'You made the code concurrent, parallel and async. The server is still at 100% and the next Black Friday is 5 times bigger. What now?',
 why:'Because threads, cores and async only help inside one machine, and one machine has a ceiling, a single point of failure and a shared bottleneck.',
 principle:'Concurrency, parallelism and async overlap work on one computer. They cannot add a second computer, cannot remove a shared bottleneck, cannot survive the machine dying, and cannot shorten the speed of light.',
 design:'Scale out: split work and data over several machines, keep state in a layer built for it, and accept the new costs: network calls, partial failure and coordination.',
 scene:['Your checkout service already uses every trick: a thread pool, async I/O, 64 cores. At peak it still hits 100% CPU. Buying a bigger machine works once, then the biggest one is not big enough, and it costs 8 times more for 4 times the power.','And when that single machine fails, everything stops. Meanwhile users in Singapore see 300 ms of latency to your data centre in Virginia, and no amount of async changes it.'],
 idea:['<b>The ceiling</b>: a machine has a fixed number of cores, a fixed amount of RAM, one network card, one disk bus. Vertical scaling (a bigger box) gets expensive and then stops.','<b>The shared bottleneck</b>: add 10 app servers and they all hit the same database. Amdahl\'s law again: the serial part (one writer, one lock, one queue) limits total speedup, and more workers can make contention <i>worse</i> (Universal Scalability Law).','<b>The single point of failure</b>: one machine with 99.9% availability is down 9 hours a year. Several machines in parallel are much more available; but if a request needs <i>all</i> of N machines, availability drops as N grows.','<b>The latency floor</b>: light needs about 70 ms to cross an ocean and back. Async can hide a wait behind other work; it cannot make a round trip needed for the answer shorter. To be faster for users, move data closer, which means copies, which means consistency problems.'],
 arch:{w:640,h:150,boxes:[['cl',10,50,90,50,'clients',0],['lb',140,50,100,50,'load balancer',4],['a1',290,5,110,40,'app server 1',3],['a2',290,55,110,40,'app server 2',3],['a3',290,105,110,40,'app server N',3],['db',470,45,150,60,'one database\nthe shared bottleneck',5]],arrows:[['cl','lb'],['lb','a1'],['lb','a2'],['lb','a3'],['a1','db'],['a2','db'],['a3','db']],cap:'Adding app servers scales the easy part. All the state still funnels into one place.'},
 common:[
  {t:'The bottleneck just moves',ex:'A team doubles web servers and the site gets slower: PostgreSQL hit <code>max_connections</code>, connection pools were exhausted, and lock contention rose. Shopify, GitHub and others sharded or added read replicas for exactly this reason.',why:'The parallel part scaled; the serial part (single writer, shared lock, one queue) did not, and contention grows with the number of clients.',fix:'Find the serial resource, then split it: caching, read replicas, sharding by key, queues to smooth bursts.'},
  {t:'Scaling out multiplies the ways to fail',ex:'With 1,000 machines each 99.9% available, on average one is down at any time; Google\'s early clusters saw machines die daily. A request that fans out to 100 backends is slow whenever any one is slow (tail latency, "The Tail at Scale").',why:'The probability that something fails grows with the number of parts; a fan-out takes the worst of N.',fix:'Replicate, make requests hedged and timed out, and design so that losing a node is a normal event.'},
  {t:'Async cannot shorten a round trip',ex:'A multi-region app writes to a primary in us-east-1 from Singapore: each write waits about 250 ms however non-blocking the client is. Adding a read replica in Singapore fixes reads and creates stale reads.',why:'The answer is on the other side of the planet; speed of light and routing are fixed.',fix:'Move data and compute nearer (CDN, regional replicas, regional shards) and decide which operations may be stale.'},
  {t:'Distribution adds coordination cost',ex:'Teams split a monolith into 40 microservices and one request now makes 12 network calls; latency and failure rate go up, and they need tracing, retries and timeouts everywhere. Universal Scalability Law: beyond some N, adding nodes <i>reduces</i> throughput.',why:'Every cross-machine call costs time and can fail; nodes also need to agree on shared state.',fix:'Distribute only what you must, keep calls coarse, avoid shared state across services, and measure before splitting.'}],

{ask:'A function call crosses the network and the reply never arrives. Did it run?',
 why:'You cannot know: the request may have been lost, the server may have crashed, or only the reply may have been lost.',
 principle:'In a distributed system messages can be delayed or lost and nodes can fail independently (partial failure). A timeout is a guess, not a fact.',
 design:'Retry on timeout, and make the operation idempotent (or give each request a unique ID) so running it twice has the same effect as once.',
 scene:['The payment service calls the bank: <code>charge(user, 10)</code>. The call times out after 3 seconds. Did the bank charge the user? Maybe the request never arrived. Maybe the bank charged and the reply got lost. Maybe the bank is still processing.','If you retry and it did run, the customer pays twice. If you do not retry and it did not run, the customer gets free goods.'],
 idea:['A distributed system has <b>no shared memory and no shared clock</b>, message delay is unbounded, and parts fail independently.','<b>RPC</b> makes a remote call look local: the client <b>marshals</b> arguments, sends them, and unmarshals the reply. An <b>IDL</b> (protobuf, Thrift) describes the interface.','<b>At-most-once</b>: never retry (maybe lost). <b>At-least-once</b>: retry until a reply (maybe duplicated). Exactly-once needs <b>idempotent</b> operations or de-duplication by request ID.','Transparency is a trap: a remote call can fail in ways a local one cannot, so the caller must handle timeouts.'],
 arch:{w:640,h:110,boxes:[['c',5,30,90,50,'client code',0],['cs',120,30,90,50,'client stub\nmarshal',3],['net',250,30,100,50,'network\nloss, delay',5],['ss',390,30,90,50,'server stub\nunmarshal',3],['s',515,30,110,50,'server code',0]],arrows:[['c','cs'],['cs','net','request'],['net','ss'],['ss','s']],cap:'Four things can go wrong between the arrows: request lost, server crash, reply lost, or just slow.'},
 common:[
  {t:'No timeout, or timeouts that do not add up',ex:'Go <code>http.Client{}</code> has no timeout by default; Python <code>requests.get(url)</code> without <code>timeout=</code> can hang forever; Java <code>HttpURLConnection</code> defaults to infinite. A 3-second timeout at each of 5 layers is a 15-second user wait.',why:'Without a deadline one stuck dependency ties up threads or goroutines until the caller dies too.',fix:'Set connect and read timeouts everywhere, propagate a deadline (<code>context.WithTimeout</code>, gRPC deadlines) so inner timeouts are shorter than outer ones.'},
  {t:'Retry storms and amplification',ex:'Each of 3 layers retries 3 times on failure: one user request becomes 27 calls to the failing database, which keeps it down (a metastable failure; Amazon and Google SRE describe retry budgets for this).',why:'Retries add load exactly when the dependency is already overloaded.',fix:'Exponential backoff with jitter, retry budgets (for example at most 10% extra), retry only at one layer, circuit breakers.'},
  {t:'Non-idempotent retries: double charge',ex:'Retried <code>POST /charge</code> double-bills a customer; Stripe\'s API takes an <code>Idempotency-Key</code> header for exactly this. Message queues with at-least-once delivery (SQS, Kafka) redeliver after a consumer crash.',why:'The client cannot tell "request lost" from "reply lost".',fix:'Idempotency keys stored with the result, or naturally idempotent operations (set to value, not add 10).'},
  {t:'Chatty calls and schema skew',ex:'The N+1 problem across services: a loop making one remote call per item. Rolling upgrades with a changed protobuf or Java-serialised class break old and new nodes talking to each other.',why:'A remote call looks like a local one but costs about a million times more, and two versions run side by side during deploys.',fix:'Batch APIs, coarse-grained calls, and backward/forward compatible schemas (add optional fields, never reuse tags).'}],
 pg:'d2'},

{ask:`The primary confirmed an order and then crashed before the copy reached the replicas. The customer holds a receipt for an order the system no longer knows. Which copy should answer, and when may the primary say "saved"?`,
 scene:[
  `An online shop keeps all orders on one PostgreSQL primary. Two read replicas copy its log so that reports and the order-history page do not load the primary. Everything works until one Tuesday at 14:00, when the primary's disk fails and it stops responding.`,
  `The on-call engineer promotes the replica that "looks most up to date", the site is back in under a minute, and the incident is closed. The next morning support receives a ticket: "I paid for order 8812, the confirmation page showed it, and now it does not exist." The confirmation was sent a few milliseconds before the disk died. The record never left the primary, so the promoted replica never had it.`,
  `This is not a bug in one line of code. It is a consequence of a choice nobody made explicitly: how long the primary waits before it says "saved", and which copy becomes the truth when the primary dies.`
 ],
 journey:[
  {h:'Attempt 1: acknowledge as soon as the primary has written', p:'The primary appends the order to its own log, answers "OK" to the client, and ships the log entry to the replicas in the background. Latency is one local disk write.', f:'The shipping is asynchronous, so there is a window where the client holds an OK for an entry that exists only on the primary. If the primary dies inside that window, the entry is gone. The window is exactly as big as the replication lag.'},
  {h:'Attempt 2: wait until every replica has the entry', p:'The primary replies only after all followers acknowledge. Now the OK means the order exists on every machine.', f:'Nothing is lost, but one slow or unreachable replica now blocks every write. With five replicas the system stops when any one of them stops. Availability goes down as the cluster grows.'},
  {h:'Attempt 3: wait for one follower (semi-synchronous)', p:'One replica is synchronous and the rest are asynchronous. The OK waits for one follower to acknowledge, so an acknowledged order exists on two machines. A slow follower that is not the synchronous one no longer blocks anything.', f:'Now the acknowledged data survives one machine failure. What is still undecided is who becomes the new primary when the old one dies, and how to be sure that the chosen replica has the newest entries. That is the failover question.'},
  {h:'Attempt 4: promote the first replica that answers', p:'The failover script takes the first healthy replica it can reach and makes it the primary, which is fast and needs no coordination.', f:'That replica may be 40 seconds behind. Its log ends earlier than the old primary, so every acknowledged order in those 40 seconds is missing. The rule must be: promote the replica with the highest log position, and never a replica that is behind the newest acknowledged entry.'}
 ],
 idea:[
  `<b>The replication log.</b> Every change is appended to one ordered log, and each entry has a position (a log sequence number, LSN). A replica that has applied entries 1 to N is an exact copy of the primary as it was at position N. This is why a replica can be "behind" but never "wrong in a different way".`,
  `<b>Lag is a position difference.</b> Lag is the primary's current position minus the replica's position, measured in entries, bytes, or time. A replica that is 40 seconds behind has not applied the last 40 seconds of entries, and those entries are the ones that a failover can lose.`,
  `<b>The loss window is the unreplicated tail.</b> In asynchronous mode the acknowledged entries that no follower holds yet are the tail. Its length is the replication lag at the moment of the crash. Synchronous replication makes the tail empty for the synchronous follower, at the cost of one network round trip per write.`,
  `<b>Failover has four steps, and each can go wrong.</b> (1) Detect that the primary is dead, which is only a timeout and may be a false alarm. (2) Choose the replica with the highest position. (3) Make the others replicate from the new primary and discard any entries they hold beyond the new primary's position. (4) Stop the old primary from accepting writes if it comes back.`,
  `<b>A new replica is built from a snapshot plus a position.</b> Take a consistent snapshot of the primary tagged with its log position P, restore it, then apply the log from P onward. If the copy is taken from live files, the pages come from different moments and the replica holds a state that never existed.`
 ],
 common:[
  {t:'Asynchronous failover loses a confirmed write',exl:'Seen in',ex:`Jepsen's 2013 analysis of MongoDB showed acknowledged writes rolled back after a failover under the default write concern of <code>w:1</code>. The client was told "saved" for writes that the new primary never had.`,why:`The primary acknowledged after its own write. The entry was still in flight to the replicas when the primary crashed, so the promoted replica never received it. The loss window equals the lag at the moment of the crash.`,fix:`Acknowledge only after a replica has the entry (semi-synchronous). Then the promoted replica must have the entry, because it was the one that acknowledged it.`,

  {t:'The promoted follower is behind the old primary',exl:'Typical case',ex:`A failover script picks "the replica that answers first". Latency measurements show it was 40 seconds behind, and nobody compared log positions before the switch.`,why:`Failover chose a candidate without checking how much of the old primary's log it held. Entries between the two positions were acknowledged to clients and then silently dropped.`,fix:`Pick the replica with the highest log position, and refuse to promote anyone whose position is older than the newest acknowledged entry. Keep a record of the last acknowledged position on the coordinator.`,

  {t:'Two primaries accept writes after a partition',exl:'Typical case',ex:`A cross-rack network partition isolates the old primary from the failover controller. The controller promotes a replica, and the old primary keeps serving writes from clients on its side of the partition.`,why:`Being primary is a belief held by one machine. The old primary never learned that it was replaced, so both machines accepted writes for the same rows.`,fix:`Give each primary a generation (epoch) number, have storage reject writes from older epochs, and make the old primary step down when it sees a newer epoch. Use fencing (chapter 7) rather than trusting the old primary to stop itself.`,

{ask:`A user saves a change, reloads the page, and the change is gone. Nothing crashed and no data was lost. Which promise did the system make about reads, and what does it cost to keep the promise the user actually expects?`,
 scene:[
  `A forum stores posts on a leader and serves reads from two followers, because the leader already handles every write and should not also answer every page view. Followers are normally 100 to 300 milliseconds behind, which nobody notices on a quiet day.`,
  `Alice edits her profile title and presses save. The page reloads and shows the old title. She reloads again and the new title appears. Her friend, reading through a different follower, sees both her new title and an old reply that Alice has not seen yet. Each request was served correctly by the follower that handled it, but Alice's experience is broken.`,
  `The bug is not in any single server. Each follower answers truthfully for the moment it is at. What is missing is a rule that ties one user's reads to the position of their own writes.`
 ],
 journey:[
  {h:'Attempt 1: read from any follower', p:`Round-robin across the two followers. Reads are cheap and spread evenly, and the leader only takes writes.`,f:`Alice's write lands on the leader at log position 812. Follower 1 has applied up to 812, but follower 2 is at 809. A reload that hits follower 2 shows the state before her write. Nothing is wrong with follower 2, and the user still sees her change disappear.`},
  {h:'Attempt 2: read everything from the leader', p:`Every read goes to the leader, which is always current. Read-your-writes holds trivially.`,f:`It works, and it removes the benefit of replicas: the leader now serves every page view, and for users far from the leader each read crosses a continent. Load and latency are the price of the guarantee, which is why most systems use it only where it is needed.`},
  {h:'Attempt 3: read from the leader for one minute after a write', p:`A cheap rule: after a user writes, send their reads to the leader for 60 seconds, then return to followers.`,f:`The minute is a guess. A follower can lag longer than a minute during a load spike, so the rule fails exactly when it is needed. And when the minute ends, the user may read from a follower that is behind the value they just saw on the leader, which goes backwards in time (see the next idea).`},
  {h:'Attempt 4: pin each user to one follower', p:`Hash the user ID to choose a follower. Each user always reads from the same replica, so their view never goes backwards.`,f:`That solves going backwards, but not missing writes: a pinned follower may still be behind the user's own write. And when the pinned follower fails, the user moves to another follower that can be even further behind. The fix needs information the reads currently do not carry.`},
  {h:'The idea that finishes it: carry the log position', p:`Every write returns the log position it was stored at (a token such as 812). The client keeps the highest token it has seen, and sends it with each read. A replica may answer only once it has applied at least that position. If it has not, it waits or the read goes to a replica that has.`,f:`This gives read-your-writes and monotonic reads without sending everything to the leader. The cost is that the replica must know its own position and sometimes wait, and the client must carry a token.`}
 ],
 idea:[
  `<b>Lag is a position difference.</b> A follower is at position P_f and the leader at P_l. The gap P_l minus P_f, in entries or seconds, is the replication lag. Most of the time it is small. During a load spike, a long-running query, or a network problem it can grow to minutes, and the application cannot see it from the outside unless it asks.`,
  `<b>Read-your-writes.</b> After a user writes an item at position W, every later read by that user must include the item, which means the replica answering must be at position at least W. The guarantee is per user, so other users may still see older data.`,
  `<b>Monotonic reads.</b> A user who has seen state S must never see a state older than S. Two requests that hit replicas at different lags can violate this, even when each replica is correct. Routing the same user to the same replica is the simplest fix, and the position token is the robust one.`,
  `<b>Consistent prefix reads.</b> If write A happened before write B, anyone who sees B must also see A. This matters when the two writes live in different partitions with different lags: the reader can see B from a fast partition and miss A from a slow one.`,
  `<b>The cost table.</b> Leader reads: always fresh, but the leader carries the read load and remote users pay latency. Position tokens: fresh enough, cheap on the leader, but every read carries a token and a replica may wait. Pinning: monotonic, but a failed replica moves the user to an arbitrary position. Choose per operation: a balance is read from the leader, a comment count from a follower.`

 pg:'d4'},

{ask:`A data centre is cut off for ten minutes, and both sides keep accepting writes. How many replicas must confirm a write, and how many must answer a read, so that a read can never miss a write that was confirmed? And what should happen when two writes did not know about each other?`,
 scene:[
  `A shopping cart is stored on five replicas, and any replica can take a write, because there is no single leader to fail over to. A user adds a book from their phone while the replica in the second data centre is unreachable. Meanwhile a second device removes a different item from the same cart.`,
  `Later the cart is read back inconsistently. One device shows the book and the other does not, and a removed item sometimes reappears. Nothing crashed and no request failed. The design simply let two copies accept writes that nobody reconciled, and it chose a reader that could answer from a copy that never saw the write.`,
  `The question is not "which replica is right", because each one was right at the time it accepted a write. The question is how many copies a write must reach, how many copies a read must consult, and what the system does when two writes were concurrent.`
 ],
 journey:[
  {h:'Attempt 1: write to one replica, read from one replica', p:`The client picks a replica, writes there, and the replicas gossip the change later. Writes are as fast as one disk, and reads are as fast as one disk.`,f:`With five replicas, the write reached one of them. A read that picks another replica returns the old cart. Nothing says which replica is newest, so the client cannot even tell that it is stale.`},
  {h:'Attempt 2: write to all five, wait for all five', p:`Send each write to every replica and confirm only when all acknowledge. Then any single replica has the latest value.`,f:`One unreachable replica now makes every write fail. Five replicas give five times the chance that something is down, so the cart becomes unwritable during exactly the outages it was meant to survive.`},
  {h:'Attempt 3: write to a majority, read from a majority', p:`Let N be the number of replicas. A write is confirmed after W acknowledgements, and a read asks R replicas and keeps the newest version. Choose W = 3 and R = 3 of N = 5.`,f:`Any write set of 3 and any read set of 3 must share at least one replica, because 3 + 3 is greater than 5. That shared replica has the newest version, so the read can return it. This is the quorum rule W + R > N. The rule guarantees overlap, not freshness: the reader must still pick the newest version among the replies.`},
  {h:'Attempt 4: when the quorum is unavailable, accept anyway (sloppy quorum)', p:`If the home replicas are unreachable, store the write on any healthy node outside them, with a hint saying where it belongs, and deliver the hint later.`,f:`The write succeeds, but the overlap argument now refers to the wrong nodes. A read that asks only the home replicas can miss a write that was confirmed. The system is available, but the W + R > N guarantee no longer holds until the hints are delivered.`},
  {h:'The idea that finishes it: keep concurrent writes as siblings', p:`Two writes are concurrent if neither knew about the other. Version vectors record, for each replica, how many writes it has accepted. If one vector dominates the other, the newer write replaces the older one. If neither dominates, both are kept as siblings and the application merges them.`,f:`Quorums decide which version a read can see. Version vectors decide whether two versions are ordered at all. Without the second, a quorum can only pick a winner, and it silently drops the loser.`}
 ],
 idea:[
  `<b>The quorum arithmetic.</b> With N replicas, write set size W and read set size R, a read and a write share a replica whenever W + R > N. Example: N = 5, W = 3, R = 3 gives 6 > 5, so every read set of 3 overlaps every write set of 3 in at least one node. With W = 1, R = 1, the sets can be disjoint: 2 ≤ 5.`,
  `<b>What a coordinator does.</b> The client sends the write to all N replicas (or to a coordinator that does) and waits for W acknowledgements. A read goes to R replicas, and the reply with the highest version is returned. The other replies are repaired in the background: the newest value is written back to the stale replicas (read repair).`,
  `<b>Anti-entropy repairs what reads never touch.</b> A background process compares replicas with Merkle trees (hashes over key ranges) and copies only the differing ranges. Without it, a value that is rarely read can stay stale on one replica for months.`,
  `<b>Hinted handoff.</b> When a home replica is down, a stand-in stores the write with a hint naming the home node. When the home node returns, the hint is delivered and removed. The stand-in's copy does not count toward the quorum for reads that go to home nodes.`,
  `<b>Version vectors detect concurrency.</b> Each replica keeps a counter for every replica that has written the key. A version written after reading version X carries X's counters forward and increments its own. Two versions are concurrent exactly when neither vector is greater than or equal to the other in every entry.`
 ],

{ask:`One table has outgrown its machine. How do you split it so that every machine gets an equal share of the data and the traffic, that a query for one record goes to one machine, and that adding a machine later moves only a small part of the data?`,
 scene:[
  `A messages table holds 2 billion rows and grows by 40 million a day. It has been split over four servers by taking the user ID modulo four: user 1001 goes to server 1, user 1002 to server 2, and so on. For a year it works.`,
  `Then the fifth server is added. Almost every row now belongs to a different server, so the migration copies 80 percent of the table over a weekend and the reads for users in transit are slow. Meanwhile one server runs at 95 percent CPU, because the newest users, who write the most, all have the largest IDs and therefore land on the same range.`,
  `Both problems come from one decision: the function that maps a record to a machine. Mod-N couples the mapping to the machine count. Range partitioning couples it to the arrival order of the keys.`
 ],
 journey:[
  {h:'Attempt 1: user ID modulo the number of servers', p:`server = user_id mod 4. Each lookup computes one number and goes to one server. Writes spread evenly because user IDs are random enough.`,f:`Changing the divisor from 4 to 5 changes the answer for almost every key. Going from N to N+1 servers moves about N/(N+1) of all keys: 80 percent when N = 4. The cost of growth becomes the cost of a full copy.`},
  {h:'Attempt 2: split the ID space into ranges', p:`Server 1 holds IDs 1 to 500 million, server 2 holds the next range, and so on. Adding a server means splitting a range, which moves only half of one range.`,f:`Range splits are cheap, but the keys are not random. New users get IDs in increasing order, so every new write goes to the last range. One server takes all the inserts while the others are idle. The problem is hot spots, not balance on paper.`},
  {h:'Attempt 3: hash the key, then range or mod again', p:`Hash each key to a large number first, so that sequential IDs spread over the space. Then partition the hashed space, by range or by mod.`,f:`Writes now spread evenly, but a range query such as "all messages between 14:00 and 14:05" has no contiguous range to read. It must ask every partition, so the query cost grows with the number of machines.`},
  {h:'Attempt 4: many fixed partitions, assigned to machines', p:`Create far more partitions than machines, for example 1,000 partitions on 10 machines. A key's partition is hash(key) mod 1000, which never changes. Machines own whole partitions, and adding a machine moves a few partitions to it.`,f:`Adding the eleventh machine moves about 1/11 of the partitions, which is roughly 9 percent of the data, instead of 91 percent. The remaining problem is a single key that is itself hot, which no partitioning function can split.`},
  {h:'The idea that finishes it: the mapping must be stable and the routing explicit', p:`Keep the key-to-partition function stable, and keep a separate, small partition-to-machine map. The map is what changes when machines are added. Clients find the machine for a key through that map (a routing tier, the client, or a coordination service).`,f:`Now growth changes the map, not the keys, and a hot key is the only remaining case that needs its own design: split it into sub-keys and combine them on read.`}
 ],
 idea:[
  `<b>Partitioning and replication are separate.</b> Partitioning decides which records a node is responsible for. Replication decides how many copies of each partition exist. A real cluster has many partitions, and each partition has a leader and followers (chapters 3 to 5).`,
  `<b>Key-range partitioning</b> keeps neighbouring keys together, so a range scan reads one or a few partitions. The cost is that the boundaries must be chosen and maintained, and that monotonically growing keys concentrate writes on one partition. Systems such as Bigtable and HBase split and merge ranges automatically for this reason.`,
  `<b>Hash partitioning</b> maps each key to a partition with a hash function, which spreads keys evenly and removes the arrival-order hot spot. It makes range scans expensive, because adjacent keys are no longer adjacent in the hash space.`,
  `<b>Consistent hashing and fixed partitions limit movement.</b> With a ring of 1000 fixed partitions, adding a node moves about 1/(N+1) of the partitions. With consistent hashing and virtual nodes, each physical machine owns many small arcs of the ring, and a new machine takes arcs from everyone, so the load stays balanced.`,
  `<b>Secondary indexes</b> must also be partitioned, and there are two choices. A local index lives with each partition and covers only its rows, so a write touches one partition, but a query by a non-key column must ask every partition (scatter-gather). A global index is partitioned by the indexed value, so the query goes to one partition, but each write must also update an index entry on another partition, which is slower and can lag.`,
  `<b>Request routing</b> is the other half. A client must know which machine holds a partition. A routing tier, the client library, or a coordination service keeps the partition map, and it must learn about changes, or requests land on the wrong machine and must be forwarded.`
 ],
 common:[

  {t:'Time-ordered keys send all new writes to one partition',exl:'Seen in',ex:`HBase's reference guide warns against monotonically increasing row keys, because every new row is written to the region that holds the largest key, and that region server becomes the bottleneck while the others stay idle.`,why:`Range partitioning places neighbouring keys together. A key derived from the current time or an auto-increment ID is always larger than the previous one, so every insert lands at the right edge of the key space.`,fix:`Salt or hash the leading part of the key so that new writes spread over the partitions, and accept that scans over recent data now touch several partitions.`,

  {t:'One celebrity key overwhelms its partition',exl:'Typical case',ex:`A single account or product page receives far more reads and writes than any other key. Hash partitioning spreads keys evenly, yet that one key still lives on one partition, and that partition saturates while the others are idle.`,why:`Partitioning spreads keys, not the traffic of one key. Every request for the same key must go to the partition that owns it, so no function of the key can divide the load.`,fix:`Split the hot key into sub-keys (for example a like counter with 16 random suffixes, summed on read), cache the read path for the hot key, and move the key to a dedicated partition if it stays hot.`,

{ask:`A worker holds a lease on a shared resource. Its process freezes for 40 seconds in a garbage collection pause, the lease expires, and another worker takes over. Then the first worker wakes up, certain it still holds the lease. What stops its write from landing on top of the new owner's work?`,
 scene:[
  `Two workers process invoices from one shared file. A lock service grants a 10-second lease, and the holder renews it every 3 seconds. Worker A renews at 12:00:00, starts a batch, and at 12:00:04 its JVM begins a stop-the-world garbage collection that lasts 40 seconds. No code in A runs during that time, and A's clock keeps no memory of the pause.`,
  `The lock service sees no renewal, expires the lease at 12:00:10, and grants the lock to worker B. B writes invoice 4417. At 12:00:44 A wakes up, checks its own state ("I hold the lock, my lease ends at 12:00:10"), and writes its stale batch on top of B's result. The invoice total is now wrong, and no error appears in any log.`,
  `Nothing in A's code is buggy. A's belief "I hold the lock" was true when it was formed, and A has no way to learn that it stopped being true while it was frozen.`
 ],
 journey:[
  {h:'Attempt 1: the holder checks its lease before writing', p:`Before each write, the worker reads its lease expiry from memory and writes only if the lease has not expired.`,f:`The check is correct at the moment it runs, but the pause can happen after the check. A worker that checks at 12:00:04 and writes at 12:00:44 passes the check, and the lease expired at 12:00:10.`},
  {h:'Attempt 2: check the lease just before the write, as late as possible', p:`Shrink the window: read the clock immediately before the write call, so the pause would have to happen in the microseconds between check and write.`,f:`Shrinking the window does not remove it. Garbage collection, a VM being migrated, a page fault or a CPU throttle can stop a process between any two instructions. Check-then-act is not atomic when the process can be paused in the middle.`},
  {h:'Attempt 3: a longer lease', p:`Give the lease 60 seconds instead of 10, so a normal pause will not outlast it.`,f:`Some pause will eventually be longer than any fixed lease, and a long lease delays recovery: when a worker really crashes, nobody can take the lock for a minute. Longer leases move the failure to a rarer case without removing it.`},
  {h:'The idea that finishes it: a fencing token checked by the resource', p:`The lock service returns a token with each grant that only increases: 33 for A, 34 for B. Every write carries its token, and the storage remembers the highest token it has accepted and refuses anything lower.`,f:`A paused holder can still send its write, but storage has already accepted 34, so 33 is refused. The check now happens where the write happens, on state that the paused process cannot change.`}
 ],
 idea:[
  `<b>A paused process cannot know it is paused.</b> Garbage collection, a VM live migration, a swapped-out page, a CPU quota throttle or an overloaded host can freeze a process for longer than any timeout. When the process resumes, it continues from the instruction it was on, with the beliefs it had before the pause.`,
  `<b>A lease is a promise measured by someone else's clock.</b> The lock service decides when the lease ends, using its own clock. The holder's clock is not involved in the decision, so a holder cannot make its lease longer by believing it has more time.`,
  `<b>Fencing tokens move the check to the resource.</b> A token must be issued by the lock service in increasing order (a counter in the consensus log works). The resource must compare the incoming token with the highest one it has accepted, and reject anything lower. Clients cannot forge a higher token, and they cannot skip the check.`,
  `<b>Majorities decide who may issue tokens.</b> If two lock services each believe they are the authority, they can issue token 34 to two clients. Requiring a majority of nodes to agree on a grant means that only one side of a network partition can issue tokens (chapter 10 shows why two majorities always overlap).`,
  `<b>Byzantine faults are a separate, rarer case.</b> A crash-stop node is silent. A Byzantine node sends wrong data: a flipped bit, a bug, or an attacker. Majority voting over crash-stop nodes does not protect against this, and checksums, signatures and extra replicas are needed.`
 ],
 common:[
  {t:'Stop-the-world GC longer than the lease',exl:'Seen in',ex:`Martin Kleppmann's analysis of distributed locking (2016) walks through this exact sequence: a client holds a lock, pauses for garbage collection past its lease, and writes after another client has taken the lock.`,why:`The lease is decided by the lock service's clock. The paused client's own clock keeps running, but nothing in the paused code reads it, so the client continues as if it still holds the lock.`,fix:`Attach a fencing token to every grant and make the storage reject lower tokens. Keep leases short, and tune heap size and pause time so that pauses stay well below the lease length.`,

  {t:'Check-then-act: the check passes, then the pause happens',exl:'Typical case',ex:`A deployment script checks that no other deploy holds the lock, then starts the rollout. A slow host pauses between the check and the rollout, and two deploys run at once.`,why:`The check and the action are two separate steps. A pause, a context switch or a network delay between them makes the check out of date by the time the action runs.`,fix:`Make the check part of the action. Use a conditional write at the resource (compare-and-set on a version or a fencing token), so the resource refuses the action when the condition is no longer true.`,

      {at:'A',n:`pause (host overloaded)`,k:`bad`,span:2,say:`Before A writes its own owner record, its host is overloaded and A is delayed.`},
      {m:['B','L',`is the lock free? yes → take it`],k:``,set:{L:[`owner: B`],B:[`lock: owned`]},say:`Deploy B checks, sees the lock free, and writes itself as owner.`},
      {m:['A','L',`write owner: A`],k:`bad`,set:{L:[`owner: !A (overwrites B)`],A:[`lock: owned`]},say:`A resumes and writes itself as owner, overwriting B. Both believe they hold the lock.`},
      {m:['A','H',`roll out v2`],k:`bad`,set:{H:[`running: 2 deploys`]},say:`Both rollouts run on the same hosts at the same time.`}
     ]},
    good:{title:`Conditional write: check and act together`,intro:`The owner record is written only if it still has the version the deploy read.`,
     actors:[['A','Deploy A',[`read version 7`]],['L','Lock file',[`owner: none, v7`]],['B','Deploy B',[`read version 7`]]],
     steps:[
      {m:['A','L',`read: owner none, v7`],k:``,set:{A:[`read version 7`]},say:`Deploy A reads the lock and its version, 7.`},
      {m:['B','L',`read: owner none, v7`],k:``,set:{B:[`read version 7`]},say:`Deploy B reads the same version.`},
      {m:['B','L',`CAS: set owner B if v7`],k:`ok`,set:{L:[`owner: B, v8`],B:[`lock: owned`]},say:`B's conditional write succeeds, because the version is still 7. The lock is now at version 8.`},
      {m:['A','L',`CAS: set owner A if v7`],k:`bad`,lost:true,say:`A's write arrives after the change. Its condition (version 7) is false.`},
      {m:['L','A',`rejected: version is 8`],k:`ok`,set:{A:[`read version 7`,`stopped ✓`],L:[`owner: B, v8`]},say:`The lock file refuses A. Exactly one deploy proceeds, however long A paused.`}
     ]}
   }},
  {t:'Two lock services both grant the lock',exl:'Seen in',ex:`Elasticsearch before version 7.0 could elect two masters during a network split when discovery.zen.minimum_master_nodes was set too low. Each side saw the other as gone and kept accepting writes.`,why:`Without a majority rule, each side of a partition may decide that it is the whole cluster. Both sides then issue leadership or locks, and nothing ties the two decisions together.`,fix:`Require a strict majority of the voting nodes for every election and every lock grant, use an odd number of voters, and make the minority side refuse writes.`,

     ]},
    good:{title:`Strict majority of the voters`,intro:`The same split, but a grant needs more than half of all voters, which is 3 of 4 here.`,
     actors:[['N1','Node 1',[`master: —`]],['N2','Node 2',[`master: —`]],['N3','Node 3',[`master: —`]],['N4','Node 4',[`master: —`]]],
     steps:[

      {m:['N1','N2',`vote me master`],k:``,say:`Group one asks for votes.`},

      {m:['N3','N4',`vote me master`],k:``,say:`Group two asks for votes.`},
      {m:['N4','N3',`yes, yes (3 of 4)`],k:`ok`,set:{N3:[`master: node 3`],N4:[`master: node 3`]},say:`Three of four is a majority, so exactly one master exists, and it is on the side with the majority.`}
     ]}

  {t:'A corrupt message spreads through gossip',exl:'Seen in',ex:`Amazon's post-mortem of the July 2008 S3 outage describes a single corrupted message whose bad state spread through the system, so the failure looked like many nodes crashing at once.`,why:`The system assumed a node either works or stops. A node that sends a wrong value is a Byzantine fault: it is still responding, so the other nodes accept its data and forward it.`,fix:`Checksum every message and every stored block, validate inputs at each boundary, and compare results from independent replicas before accepting a value that changes shared state.`,
   anim:{
    bad:{title:`One bad message, many bad nodes`,intro:`Node 1 has a bit flipped in memory. It gossips its state to its peers, who accept it.`,

     actors:[['N1','Node 1',[`status: ok`,`bit flipped`]],['N2','Node 2',[`status: ok`]],['N3','Node 3',[`status: ok`]]],

      {m:['N2','N1',`checksum mismatch: reject`],k:`ok`,set:{N2:[`status: ok`,`rejected 1 message`]},say:`Node 2 recomputes the checksum, sees the mismatch, and rejects the message.`},

     ]}

{ask:`Two clients write the same key, and the write that really happened later is discarded because its timestamp is smaller. What should "later" mean when the clocks disagree, and how can a system tell two writes that were not ordered at all?`,
 scene:[
  `A user profile is replicated to three data centres. Every write carries the client's wall-clock time, and the store keeps the write with the largest time (last-write-wins). One application server's clock runs 3 seconds ahead, because its time source was misconfigured. Another runs 2 seconds behind, because its NTP sync failed last week.`,
  `A user changes their address on the slow server at 12:00:05 real time. A minute later they change it again on the fast server. The store keeps the first address, because the fast server's clock stamps the second write with an earlier time. The user's last change is gone, and no log records an error.`,
  `Nothing in this design is careless. The protocol simply assumed that timestamps from different machines can be compared, and clocks on different machines cannot be compared exactly.`
 ],
 journey:[
  {h:'Attempt 1: stamp each write with the local clock, keep the newest', p:`Last-write-wins: every write gets the time from the machine that made it, and each replica keeps the value with the largest timestamp. It needs no coordination, so it is fast and simple.`,f:`A clock 3 seconds ahead wins every race against a correct clock, and a clock 2 seconds behind loses every race, whatever the real order was. The rule chooses the fastest clock, not the latest write.`},
  {h:'Attempt 2: synchronise every clock with NTP', p:`Keep all machines within a few milliseconds of true time using NTP, so the skew becomes negligible.`,f:`NTP bounds the error; it does not remove it. Typical errors are a few milliseconds on a good network and hundreds of milliseconds on a bad one. Two writes 20 ms apart can be ordered backwards. And NTP can step a clock backwards by correcting it, so timestamps can go down on the same machine.`},
  {h:'Attempt 3: one global sequence number from a central counter', p:`Every write asks one counter service for the next number. The number is a perfect total order, so last-write-wins is correct again.`,f:`The counter is a single point of failure and a bottleneck, and every write now waits for a round trip to it. Across continents the round trip is 100 ms or more. The order is correct, but the system is slower and less available than the problem required.`},
  {h:'Attempt 4: a Lamport counter on each node', p:`Each node keeps a counter. Every local event increments it. When a node receives a message, it sets its counter to the larger of its own counter and the message's counter, plus one. Ordering by this counter respects cause and effect.`,f:`If write A caused write B, then A's counter is smaller than B's. But two writes that were concurrent get some order anyway, and the order says nothing about the truth. Lamport clocks never report that two writes were concurrent, so the store still silently keeps one of them.`},
  {h:'The idea that finishes it: vector clocks and explicit siblings', p:`Keep one counter per node in each version. Version A is older than version B only if every entry of A is at most the matching entry of B. If neither is older, the writes were concurrent, and the store keeps both for the application to merge.`,f:`Causal order is now exact, and concurrency is visible instead of being hidden. The costs are a vector per version, which grows with the number of writers, and the work of merging siblings in the application.`}
 ],
 idea:[
  `<b>Two kinds of clock.</b> A time-of-day (wall) clock is meant to match calendar time, so it can jump forwards or backwards when NTP corrects it. A monotonic clock only counts elapsed time on one machine, and it never goes backwards. Use the monotonic clock for durations and timeouts; use the wall clock only to show a time to people or to stamp a log.`,
  `<b>Clock error has a bound, not a value.</b> A clock reading has an uncertainty interval. NTP on a good network gives a few milliseconds; Spanner's TrueTime gives an explicit interval and waits out the uncertainty before committing. Without such a bound, a timestamp cannot be compared with another machine's timestamp at all.`,
  `<b>Lamport's rule.</b> A local event increments the counter. A send attaches the counter. A receive sets the counter to max(local, received) + 1. This guarantees that if A happened before B, then L(A) < L(B). The converse is false: L(A) < L(B) does not mean A happened before B.`,
  `<b>Vector clocks compare exactly.</b> A version carries a vector with one entry per writer. V(A) ≤ V(B) when every entry of A is at most the matching entry of B. A is before B exactly when V(A) ≤ V(B) and V(A) is not equal to V(B). If neither vector is ≤ the other, the writes are concurrent.`,
  `<b>Hybrid logical clocks</b> combine both ideas: a timestamp is the physical time plus a logical counter that breaks ties and keeps causality when the physical clock is behind. Many databases use this so that timestamps stay close to real time and still respect cause and effect.`,
  `<b>A total order is a separate and expensive goal.</b> Every node agreeing on one sequence of all writes needs consensus (chapter 10). A Lamport or hybrid clock gives an order that is consistent with causality, which is often enough, and it does not need a round trip on every write.`
 ],
 common:[
  {t:'Last-write-wins with skewed client clocks',exl:'Seen in',ex:`Cassandra resolves conflicting cells by the highest client-supplied write timestamp. A client whose clock runs fast keeps overwriting newer data from correct clients, and a client with a slow clock writes values that disappear immediately.`,why:`The store compares timestamps from different machines as if they measured the same clock. A 3 second offset is larger than the real gap between the two writes, so the earlier write wins.`,fix:`Use server-assigned timestamps for conflict resolution, or hybrid logical clocks, or store concurrent versions and resolve them explicitly. Monitor the clock offset of every writer and reject writers that drift.`,

      {m:['A','S',`address = Oslo @12:00:04`],k:``,set:{S:[`address: Oslo`,`stamp 12:00:04`]},say:`The store keeps Alice's write, because it has the newest stamp so far.`},

     ]}
   }},
  {t:'Timestamp IDs go backwards after a clock step',exl:'Typical case',ex:`An ID generator packs a millisecond timestamp, a worker number and a counter into 64 bits. After an NTP correction moves the clock back by 50 ms, the generator issues IDs that repeat IDs it already issued.`,why:`The uniqueness argument silently assumed the wall clock never goes backwards. When it does, the timestamp part repeats, and the counter restarts, so two different rows get the same key.`,fix:`Refuse to issue IDs while the clock is behind the last issued timestamp (wait it out), persist a high-water mark so a restart cannot reuse a range, and use a monotonic clock or a sequence from storage where possible.`,
   anim:{
    bad:{title:`Duplicate IDs after a clock step back`,intro:`An ID generator uses the wall clock. NTP steps the clock back by 50 milliseconds.`,
     actors:[['G','ID generator',[`last: t=1000`]],['D1','Row 1',[`id: —`]],['D2','Row 2',[`id: —`]]],
     steps:[
      {m:['G','D1',`new row: id = 1000 + worker 3 + n=0`],k:``,set:{G:[`last: t=1000`,`n=0`],D1:[`id: 1000-3-0`]},say:`The generator issues an ID at time 1000. The counter is 0.`},
      {at:'G',n:`NTP step: clock back to 950`,k:`bad`,set:{G:[`last: t=1000`,`!clock now t=950`]},say:`NTP corrects the clock by 50 ms. The wall clock now reads 950.`},
      {m:['G','D2',`new row: id = 950 + worker 3 + n=0`],k:`bad`,set:{G:[`last: t=950`,`n=0`],D2:[`id: 950-3-0`]},say:`The generator sees a new millisecond, resets its counter, and issues a fresh ID.`},
      {at:'G',n:`later: clock reaches 1000 again`,k:`bad`,set:{G:[`last: t=1000`,`n=0 again`]},say:`When the clock comes back to 1000, the counter restarts at 0 and the generator issues 1000-3-0 again.`},
      {m:['G','D2',`new row: id = 1000-3-0 (duplicate)`],k:`bad`,set:{D2:[`id: !1000-3-0 (same as row 1)`]},say:`Two different rows now share one primary key. The insert fails or, worse, overwrites the first row.`}
     ]},
    good:{title:`Wait out the backwards step`,intro:`The generator remembers its highest issued timestamp and refuses to go below it.`,
     actors:[['G','ID generator',[`high-water: 1000`]],['D1','Row 1',[`id: —`]],['D2','Row 2',[`id: —`]]],
     steps:[
      {m:['G','D1',`new row: 1000-3-0`],k:``,set:{D1:[`id: 1000-3-0`]},say:`The generator issues 1000-3-0 and records 1000 as its high-water mark.`},
      {at:'G',n:`NTP step: clock back to 950`,k:``,set:{G:[`high-water: 1000`,`clock 950 < 1000`]},say:`The clock steps back to 950, below the high-water mark.`},
      {at:'G',n:`refuses: waits until 1000`,k:`ok`,span:2,set:{G:[`high-water: 1000`,`waiting ⏳`]},say:`The generator will not issue an ID until the clock passes 1000 again. A few milliseconds of delay costs nothing.`},
      {m:['G','D2',`new row: 1001-3-0`],k:`ok`,set:{D2:[`id: 1001-3-0`],G:[`high-water: 1001`]},say:`Once the clock has passed the high-water mark, new IDs are strictly larger. No duplicate is possible.`}
     ]}
   }},
  {t:'A timeout measured with the wall clock never fires',exl:'Typical case',ex:`Code measures a request timeout with the wall clock. After an NTP correction moves the clock back an hour, the timeout computed as now minus start is negative, so the request waits forever. A similar bug reports negative latencies in dashboards.`,why:`The wall clock is designed to be set by people and by NTP. Subtracting two readings is only valid when the clock moved forward between them, and nothing checks that.`,fix:`Use a monotonic clock for every duration and timeout (in Java, System.nanoTime; in Go, time.Since on a value that carries the monotonic reading). Keep the wall clock for timestamps that people read.`,
   anim:{
    bad:{title:`Timeout that never fires`,intro:`A request starts at wall time 10:00:00 and has a 5 second timeout. Then NTP steps the clock back by an hour.`,
     actors:[['R','Request code',[`start: 10:00:00`,`timeout: 5 s`]],['C','Wall clock',[`10:00:02`]],['N','NTP',[`correction: −1 h`]]],

      {at:'R',n:`elapsed = 09:00:03 − 10:00:00 = −1 h`,k:`bad`,set:{R:[`start: 10:00:00`,`!elapsed: −1 h`,`timeout never fires`]},say:`The elapsed time is negative, which is less than the timeout. The code keeps waiting, and the request hangs.`}
     ]},

      {m:['N','C',`wall clock steps back 1 hour`],k:``,say:`NTP steps the wall clock. The monotonic clock does not change.`},

  {t:'Replies arrive before the questions that caused them',exl:'Typical case',ex:`A comment thread is stored as one message per comment on a queue with several partitions. A reply and the comment it answers land on different partitions, and a consumer shows the reply before the comment, and sometimes not at all for a while.`,why:`Each partition keeps its own order, but nothing orders messages across partitions. The reply's causal dependency on the comment was never recorded, so the consumer had no way to wait for it.`,fix:`Route causally related messages to the same partition (for example by thread ID), or record the dependency (the parent ID or a vector clock) and have the consumer hold a reply until its parent has been applied.`,

     ]},

      {m:['P1','C',`comment 1`],k:``,set:{C:[`applied: 1`,`holding reply`]},say:`Comment 1 arrives on partition 1.`},

     ]}

{ask:`A bank app shows a balance. A customer transfers money, sees the new balance on their phone, and a moment later their laptop shows the old one. Both reads came from correct replicas. Which guarantee would have prevented this, and what does it cost to provide it?`,
 scene:[
  `The balance of an account is stored as one value that is written by a leader and copied to followers. Most reads are served by followers, because they are usually up to date and the leader should not do all the work. Usually means that the followers are a few hundred milliseconds behind.`,
  `The customer's phone reads the balance from the leader and sees 1,200. Their laptop reads a moment later from a follower that has not received the write, and shows 1,000. A third client that reads from a second follower sees 1,000 too. From the outside, the balance went up and then went back down, even though every replica answered correctly for its own position.`,
  `The problem is not replication. It is the lack of a rule that says, for one object, the system must behave as if there were one copy, updated at one instant between the request and the reply. That rule is linearizability.`
 ],
 journey:[
  {h:'Attempt 1: any replica may answer a read', p:`Reads go to the nearest follower, writes go to the leader. Each replica is a correct copy of the leader at its own position.`,f:`Replicas disagree about the present moment. A history with a write that finished at 10:00:01 followed by a read at 10:00:02 that returns the old value is not explainable by any single copy of the data. The system is replicated but not consistent in the sense users see.`},
  {h:'Attempt 2: always read from the leader', p:`Only the leader answers reads. It has the newest write, so a read that starts after a write finished must see it.`,f:`Until the leader is replaced. A partitioned old leader keeps believing it leads, keeps answering reads from its frozen state, and returns a value that the new leader has already overwritten. Being the leader is a belief, and the belief must be checked before answering.`},
  {h:'Attempt 3: read from a majority and take the newest version', p:`With N = 5, read from 3 replicas and return the highest version. A write is confirmed after 3 replicas store it, so every read overlaps the last write.`,f:`Good for reads that come after a write has completed. But during a write, one reader can see the new value on a majority, and a later reader can read a different majority that still has the old value. The history goes new, old, which is not linearizable. The reader must help finish the write before returning it.`},
  {h:'The idea that finishes it: read, then write back, then return', p:`A read first finds the newest value in a majority. Before returning it, it writes that value to a majority, so that every later read will find it. Consensus protocols do the equivalent by committing a read through the log, or by asking the leader to confirm it still leads with a majority before serving the read.`,f:`Now the answer to a read is a value that a majority already holds, and every later read must see it. The price is an extra round trip on reads, or a leadership check on every read.`}
 ],
 idea:[
  `<b>The definition, in one sentence.</b> Each operation appears to take effect atomically at one instant between its invocation and its response, and the instants respect real time: if operation A responds before operation B is invoked, then A's effect comes before B's.`,
  `<b>A history is the object of the check.</b> A history is a list of operations with start time, end time, and result. It is linearizable if a single sequence of instants can be chosen, one inside each operation's interval, so that a register returns the last value written before it. The playground checks exactly this.`,
  `<b>Overlap gives freedom.</b> Two operations whose intervals overlap may be ordered either way. A read that overlaps a write may return the old or the new value, but two reads that both overlap the write must not disagree in the wrong order.`,
  `<b>Where it is needed.</b> Locks and leader election (two holders must never coexist), unique constraints (two users must never claim one name), and any value that two parties read and then act on together, such as a balance before a withdrawal.`,
  `<b>The cost, precisely.</b> A linearizable read needs a majority or a leader check, so it takes a network round trip that cannot be avoided by caching. A linearizable write needs a majority acknowledgement. During a network partition, the minority side must refuse such operations to remain linearizable. This is the CAP trade-off: consistency or availability for the requests that cross the partition.`,
  `<b>Linearizable is not serializable.</b> Serializability is about transactions over many objects in some order. Linearizability is about one object and real time. A system can be one without the other, and the database course covers the transaction side.`
 ],

{ask:`The leader of a five-node cluster dies, and a network split leaves two nodes on one side. How do the rest agree on exactly one new leader, and how does the side that lost its leader avoid confirming writes that will later be undone?`,
 scene:[
  `A configuration service runs on five nodes and decides which application server owns each shard. The leader accepts changes and replicates them to the followers. One night the leader's host freezes, and the switch between two racks fails at the same time.`,
  `Two nodes on the cut-off rack still see the old leader and accept a change: "shard 7 moves to server B". Three nodes on the other rack elect a new leader and assign shard 7 to server C. When the network returns, the cluster must end with one history, and it must not have confirmed both changes as final.`,
  `Any protocol that does this must answer three questions. Who may become leader? Which entries are safe to confirm? And how does a leader that does not know it was replaced stop doing harm?`
 ],
 journey:[
  {h:'Attempt 1: the replica with the newest data takes over', p:`When the leader dies, each follower looks at its own log and the one with the most recent entry promotes itself. Nothing needs a vote.`,f:`Two followers can have equally recent logs on different sides of a partition, and both promote themselves. Nothing stops both from accepting writes, so the same shard can be assigned to two servers.`},
  {h:'Attempt 2: a majority vote, but no notion of rounds', p:`A candidate asks every node for a vote and becomes leader with more than half the votes. Each node votes for whoever asks first.`,f:`Two candidates can each collect votes from different halves in the same round, and a node that has voted once can vote again for a later request. A round needs a number, so that each node casts at most one vote per round.`},
  {h:'Attempt 3: the leader confirms once it has written locally', p:`With numbered rounds (terms), the leader appends a write, and confirms it to the client as soon as its own log has it. Followers copy the log in the background.`,f:`A confirmed entry may exist only on the leader. If the leader dies, a new leader from a majority without that entry will overwrite it. The commit point must be a majority holding the entry, not the leader alone.`},
  {h:'Attempt 4: any majority can become leader', p:`With terms and majority commit, the next leader is simply the first candidate that gets a majority of votes.`,f:`The majority that elects the new leader may not contain the last committed entries: a majority and the commit majority overlap, but the new leader can be a node from the overlap that missed the entry. The election itself must refuse candidates whose log is older than the voter's log. This is the up-to-date rule.`},
  {h:'The idea that finishes it: terms, majority commit, and the up-to-date vote', p:`Each election starts a new term. A node votes at most once per term, and only for a candidate whose log is at least as up to date as its own. An entry is committed only when a majority of nodes in the current term store it, and only then is the client confirmed.`,f:`Two leaders can never both win a majority in one term, a committed entry survives every later election, and a leader cut off from the majority can never confirm anything. The price is that writes wait for a majority, and that a leader change takes at least one election timeout.`}
 ],
 idea:[
  `<b>Majorities always overlap.</b> Any two majorities of five nodes share at least one node (3 + 3 is more than 5). That shared node remembers the vote or the entry, so a later decision cannot ignore an earlier one. Every guarantee in consensus is a consequence of this counting fact.`,
  `<b>Terms are the clock of leadership.</b> Term numbers increase with each election. Every message carries its sender's term. A node that sees a higher term steps down at once and adopts it. A leader is valid only in its own term, and an old leader cannot succeed in a newer one.`,
  `<b>Timeouts start elections.</b> A follower that hears no heartbeat for its randomised election timeout becomes a candidate, increments the term, and votes for itself. Random timeouts make a split vote unlikely; when it happens, the next term retries with different timings.`,
  `<b>The log is the state.</b> Each entry has the term in which it was created and its position. Two logs are compared first by the term of their last entry, then by length. A node votes only for a candidate whose log is at least that up to date. A candidate that has every committed entry is therefore always more up to date than any voter that could have a conflicting entry.`,
  `<b>Commit rule.</b> The leader counts how many nodes store each entry. When a majority stores an entry from its own term, the leader advances the commit index and confirms the client. Followers learn the commit index from the next heartbeat. Entries from earlier terms are committed only together with an entry from the current term, which closes a subtle hole.`,
  `<b>Minorities cannot make progress.</b> A leader that cannot reach a majority keeps its log uncommitted. It cannot confirm writes, and when the partition heals it sees a higher term and steps down. Its uncommitted entries are overwritten by the leader's log, which is why the client must treat an unconfirmed write as unknown, not as saved.`
 ],

      {m:['R1','L',`ack after 2.1 s`],k:`bad`,set:{L:[`log: +2 MB (committed)`,`!commit took 2.1 s`]},say:`Only then is the entry committed. Every heartbeat and lock operation queued behind it waits too.`}
     ]},
    good:{title:`Pointer in the log, blob in object storage`,intro:`The blob goes to a replicated object store. The consensus log stores only a small pointer and a checksum.`,
     actors:[['C','Client',[`write: 2 MB`]],['O','Object store',[`blob stored`]],['L','Leader',[`log: pointer 80 B`]],['R1','Remote node 1',[`pointer copied`]]],
     steps:[
      {m:['C','O',`PUT config (2 MB)`],k:``,set:{O:[`blob stored (3 replicas)`]},say:`The client writes the blob to the object store, which handles bulk replication.`},
      {m:['O','C',`blob id: c-91, sha256`],k:`ok`,say:`The store returns an ID and a checksum.`},
      {m:['C','L',`record config = c-91 (80 bytes)`],k:`ok`,set:{L:[`log: pointer 80 B`]},say:`The client records only the pointer in the consensus log.`},
      {m:['L','R1',`replicate 80-byte entry`],k:`ok`,set:{R1:[`pointer copied`,`~30 ms over WAN`]},say:`The majority copy takes milliseconds, so coordination stays fast.`}
     ]}
