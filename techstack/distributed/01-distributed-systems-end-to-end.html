 ],
 pg:'d10'},

{ask:`A transfer must debit account A on one database and credit account B on another. The coordinator crashes between the two. Should the participants commit, abort, or wait, and who decides when nobody can ask the coordinator?`,
 scene:[
  `A payments service moves 100 from account A (on shard 1) to account B (on shard 2). The simple code calls shard 1 to debit, then shard 2 to credit. It works in every test.`,
  `In production, shard 2 times out during the second call, and the service retries the whole request. Account A is now debited twice, or account B never receives the money, depending on which retry runs. Nobody can tell from the logs which of the two accounts is right.`
 ],
 idea:[
  `<b>Two-phase commit (2PC)</b> splits the transfer into a vote and a decision. In phase 1 (prepare), each participant does the work, locks it, writes a prepare record, and votes yes or no. In phase 2 (commit), the coordinator writes its decision to its own log, then tells everyone.`,
  `<b>The promise is the danger.</b> After voting yes, a participant may not abort on its own, because the coordinator might have decided to commit. It holds its locks and waits. This is the <b>in-doubt</b> state.`,
  `<b>The decision log is the source of truth.</b> A recovered coordinator reads its log. If it finds COMMIT, it resends commit. If it finds nothing, it can safely abort, because no commit was ever sent (the presumed-abort rule).`,
  `<b>The cost is blocking.</b> If the coordinator dies after prepare and never returns, the locks stay held, and every other transaction on those rows waits. Many systems add timeouts, replicate the coordinator's log, or use consensus for the decision to avoid this.`,
  `<b>Dual writes are not atomic.</b> Writing to two databases in sequence has no prepare step and no decision log, so a crash between the writes leaves money in one account and not the other. Retries cannot fix a state that nothing recorded.`
 ],
 common:[
  {t:'Naive dual writes lose money',exl:'Typical case',ex:`A service debits one database and then credits another in two separate calls. A crash or timeout between them leaves the debit with no matching credit, and the reconciliation job finds the gap days later.`,why:`Nothing records that the two writes belong to one transfer, so no later step can finish or undo the first one.`,fix:`Give the transfer one ID, record the intent durably before the first write, and make each step idempotent. Or use a single database transaction when both accounts live in one place.`},
  {t:'Participants stuck holding locks',exl:'Typical case',ex:`The coordinator process is killed after all participants voted yes. Every row touched by the transfer stays locked, and other requests on the same accounts time out for as long as the coordinator is down.`,why:`A prepared participant cannot decide alone. The locks protect a decision that only the coordinator can make.`,fix:`Have the coordinator's decision log replicated and recoverable, add a recovery process that resolves in-doubt transactions, and monitor how long a transaction stays prepared.`},
  {t:'Recovery that aborts a committed transfer',exl:'Typical case',ex:`A coordinator restarts without its decision log, finds no record of the transfer, and aborts. A participant that had already committed on the coordinator's earlier message keeps the change, so the two sides disagree.`,why:`The presumed-abort rule is only safe if a commit decision is written to durable storage before any commit message is sent.`,fix:`Force the decision to the log before sending COMMIT, and make the recovery path read that log rather than assuming an absent record means abort after a crash mid-commit.`},
  {t:'Assuming 2PC gives availability',exl:'Typical case',ex:`A team puts a global transaction across three services and expects it to keep working when one service is down. Every transaction that touches the down service blocks until it returns, which the team did not expect.`,why:`2PC is atomic and blocking: it chooses consistency over availability for the transactions that span participants.`,fix:`Keep cross-service transactions rare, design them as sagas with compensating actions where the business allows it, and state clearly which operations block.`}
 ],
 pg:'d11'},

{ask:`A job must count page views over 500 files spread across 50 machines. Machines fail during the run, one is much slower than the others, and the output must be right even when a task runs twice. How do you structure the work so that all three are safe?`,
 scene:[
  `The analytics team counts page views per page from a month of logs. A single script reads the files one by one and takes 9 days. Splitting the files across machines with a cron job per machine works, until one machine's disk fails halfway through, and its partial counts are added to the total anyway.`,
  `Retrying the failed part by hand is worse: the team cannot tell which records were already counted, so some pages are double-counted and others are missing from the report.`
 ],
 idea:[
  `<b>Map, shuffle, reduce.</b> A <b>map</b> function turns each input record into key-value pairs (page, 1). The framework groups the pairs by key (the <b>shuffle</b>), sending each key to one reducer. A <b>reduce</b> function combines the values for each key (sum).`,
  `<b>Immutable input, immutable output.</b> Batch jobs read files and write new files. Nothing is updated in place, so a failed job can be started again from the same input.`,
  `<b>Recovery by re-running.</b> A failed map task is simply executed again on another machine. This is safe only if map and reduce are deterministic: the same input must produce the same output, and a discarded partial output must never be merged.`,
  `<b>Stragglers.</b> The slowest task decides when the job ends. MapReduce schedules backup copies of the last tasks in progress, and uses whichever copy finishes first.`,
  `<b>Skew.</b> The shuffle sends every value of one key to one reducer. A single hot key can make one reducer do most of the work while the rest sit idle, so the job waits for it.`
 ],
 common:[
  {t:'One hot key makes one reducer the bottleneck',exl:'Typical case',ex:`A job that counts events per country sends every record for the largest country to a single reducer, which runs for hours while the other reducers finish in minutes. The MapReduce paper's combiner function exists to merge repeated keys on the map side before they cross the network.`,why:`Hash partitioning spreads keys, not records. A key with most of the data still lands on one reducer.`,fix:`Split the hot key across several reducers (add a random salt to the key, aggregate in two rounds), or use a combiner to pre-aggregate on the map side before the shuffle.`},
  {t:'Non-deterministic mapper output on retry',exl:'Typical case',ex:`A map function adds a timestamp to every output record. A retried task produces different values, and when two attempts' outputs are mixed, the totals differ between runs of the same job.`,why:`A retry is only harmless when the second run reproduces the first. The framework assumes determinism to keep one attempt's output.`,fix:`Keep map and reduce functions pure, take time and randomness from the job's input (or a seeded source), and commit only the output of one successful attempt.`},
  {t:'Intermediate results written to disk between stages',ex:`The Spark paper (2012) motivates its in-memory design by noting that iterative jobs in MapReduce write every intermediate result to the distributed file system, and each iteration reads it back.`,why:`Each stage materialises its output for fault tolerance, which costs disk and network time even when nothing fails.`,fix:`Choose how much intermediate state to keep: recompute from lineage where recomputation is cheap, or persist only the expensive stages.`},
  {t:'Counting partial output from a failed attempt',exl:'Typical case',ex:`A job appends the output of every attempt to the same file. A machine that failed after writing half of its output has its partial records added to the report, so the totals are wrong without any error.`,why:`The output was written in place, without a commit step that makes one attempt's result visible.`,fix:`Write each task's output to a temporary location, and rename it atomically when the task succeeds. Let the framework discard the losers.`}
 ],
 pg:'d12'},

{ask:`Orders are written to one database. A search index, a cache and a warehouse must all reflect every order. If each system is updated by the application at the same time, one update will eventually fail. How do you keep them all in step, when any consumer can crash, restart or fall behind?`,
 scene:[
  `The order service saves an order to PostgreSQL, then updates the search index and the warehouse in two more calls. Most of the time it works. One day the search index is down for a minute, the call fails, and the order service logs a warning and moves on.`,
  `Search now shows the order as not existing. The warehouse has it, the customer has the confirmation, and nothing in any system says the three disagree. A month later a reconciliation job finds 2,000 such orders.`
 ],
 idea:[
  `<b>Write the change once, to a log.</b> Every change becomes an event appended to an ordered, durable log. The database and the log are updated from one transaction (the outbox pattern, or change data capture reading the database's own log).`,
  `<b>Each consumer keeps its own offset.</b> A consumer records how far it has read in the log. It can crash, restart and resume from that point, and a slow consumer does not hold back a fast one.`,
  `<b>The order of two steps decides the failure.</b> Commit the offset before processing and a crash loses the event. Commit it after processing and a crash between the two repeats the event. Most systems choose the second and make processing repeatable.`,
  `<b>Idempotent processing</b> makes a repeated event harmless: store the offset of the last applied event together with the result, in one transaction, and skip events at or below it. Deduplication by event ID is the same idea with a different key.`,
  `<b>Windows and late events.</b> Aggregates over time windows must decide when a window closes. A late event that arrives after its window closed is either dropped, sent to a correction stream, or merged with an allowed-lateness rule. Pick one on purpose.`
 ],
 common:[
  {t:'Offset committed before processing',ex:`Kafka's consumer auto-commit commits the position of records returned by poll on a timer. If the process dies after the commit and before the records are handled, those records are never handled again.`,why:`The offset claims the work is done before it is, so a restart resumes after the unprocessed records.`,fix:`Turn off auto-commit for work that must not be lost, and commit the offset after the side effect has been durably written.`},
  {t:'Duplicates after a crash',exl:'Typical case',ex:`A consumer writes each event to a database, then commits its offset. A crash between the two makes the broker redeliver the last batch, and the database gets two rows for one event.`,why:`At-least-once delivery means every event may arrive more than once, and the consumer's side effects were not keyed by event.`,fix:`Make the write idempotent: use the event ID as a unique key, or an upsert, or store the offset in the same transaction as the result.`},
  {t:'Dual writes diverge',exl:'Typical case',ex:`An application saves an order to the database and then publishes it to a queue. The publish fails after the commit, so the order exists in the database and never reaches the queue or the search index.`,why:`Two systems cannot be updated atomically without a protocol, and a retry only helps if the first step is recorded.`,fix:`Write the event to an outbox table in the same transaction as the change, and let change data capture or a relay publish it. Debezium and similar tools implement this pattern.`},
  {t:'Windows close before late events arrive',exl:'Typical case',ex:`A stream job computes revenue per hour and emits each hour when its window closes. Events from mobile devices that were offline arrive ten minutes late, and the reported totals for those hours are quietly too low.`,why:`The window closed on the job's notion of time, and the event's real time fell outside it.`,fix:`Set an allowed-lateness period, emit corrections when late events arrive, or report the lateness rate so that a wrong total is at least visible.`}
 ],
 pg:'d13'}
];

</script>
<script>
PG.d3 = function (root, A) {
  const { h, svg, bar, btn, seg, slider, player, stat, note } = A;
  const N = 10;                                    // writes in the run
  const DELAY = { F1: 3, F2: 5 };                  // ticks a shipped entry takes to arrive (illustrative)
  const ROWS = [['L', 'Leader', 40], ['F1', 'Follower 1 · lag ' + DELAY.F1, 110], ['F2', 'Follower 2 · lag ' + DELAY.F2, 180]];
  const COLOR = {                                  // [fill, stroke, text]
    empty: ['var(--card)', 'var(--line)', 'var(--mut)'],
    ok: ['var(--acc)', 'var(--acc)', 'var(--card)'],
    wait: ['var(--p4)', 'var(--line)', 'var(--ink)'],
    flight: ['var(--card)', 'var(--acc)', 'var(--mut)'],
    lost: ['var(--acc2)', 'var(--acc2)', 'var(--card)']
  };
  let mode = 'async', crash = 7, t = 0;

  // one write per tick: entry i is written by the leader at tick i
  const ackAt = i => (mode === 'sync' ? i + DELAY.F1 : i);   // tick the client receives OK
  const wrote = (i, now) => i <= now && i < crash && i <= N;
  const acked = (i, now) => wrote(i, now) && ackAt(i) < crash && ackAt(i) <= now;
  const onF = (f, i, now) => wrote(i, now) && i + DELAY[f] <= now && i + DELAY[f] < crash;
  const inFlight = (f, i, now) => wrote(i, now) && now < i + DELAY[f] && i + DELAY[f] < crash;
  // promotion picks F1 (the most complete follower); acked entries F1 never received are lost
  const lostIds = () => { const out = []; for (let i = 1; i <= N; i++) if (i < crash && ackAt(i) < crash && i + DELAY.F1 >= crash) out.push(i); return out; };

  const board = h('div', { class: 'dsim' });
  const verdict = stat([]);

  function build() {
    const s = svg('svg', { viewBox: '0 0 640 230', role: 'img', 'aria-label': 'Replication timeline at tick ' + t, style: 'width:100%;height:auto;display:block' });
    const failed = t >= crash, lost = failed ? lostIds() : [];
    const cell = (x, y, kind, label, dashed) => { const [bg, st, tx] = COLOR[kind];
      return svg('g', {}, svg('rect', { x, y, width: 40, height: 30, rx: 6, fill: bg, stroke: st, 'stroke-width': 1.5, 'stroke-dasharray': dashed ? '4 3' : null }),
        svg('text', { x: x + 20, y: y + 20, 'text-anchor': 'middle', 'font-size': 12, fill: tx }, label)); };
    ROWS.forEach(([id, label, y]) => {
      s.append(svg('text', { x: 10, y: y + 20, 'font-size': 13, fill: 'var(--ink)', 'font-weight': id === 'L' ? 700 : 400 }, label));
      for (let i = 1; i <= N; i++) {
        const x = 150 + (i - 1) * 46;
        if (id === 'L') s.append(cell(x, y, wrote(i, t) ? (acked(i, t) ? 'ok' : 'wait') : 'empty', String(i)));
        else if (failed && id === 'F1' && lost.includes(i)) s.append(cell(x, y, 'lost', '✕'));
        else if (onF(id, i, t)) s.append(cell(x, y, 'ok', String(i)));
        else if (inFlight(id, i, t)) s.append(cell(x, y, 'flight', String(i), true));
        else s.append(cell(x, y, 'empty', String(i)));
      }
    });
    if (failed) {
      s.append(svg('text', { x: 150, y: 84, 'font-size': 12, fill: 'var(--acc2)', 'font-weight': 700 }, '✕ leader crashed at tick ' + crash));
      s.append(svg('text', { x: 150, y: 154, 'font-size': 12, fill: 'var(--acc)', 'font-weight': 700 }, '▲ promoted to new leader'));
    }
    s.append(svg('text', { x: 10, y: 222, 'font-size': 12, fill: 'var(--mut)' }, 'tick ' + t + ' · crash at tick ' + crash));
    return s;
  }
  function update() {
    const failed = t >= crash;
    const acks = [...Array(N)].map((_, k) => k + 1).filter(i => acked(i, t)).length;
    const lost = failed ? lostIds().length : 0;
    verdict.update([
      { l: 'Confirmed to clients', v: acks },
      { l: failed ? 'On new leader (F1)' : 'On leader', v: failed ? [...Array(N)].map((_, k) => k + 1).filter(i => onF('F1', i, t)).length : [...Array(N)].map((_, k) => k + 1).filter(i => wrote(i, t)).length },
      { l: failed ? 'Confirmed but lost' : 'Lost so far', v: lost, cls: lost ? 'bad' : 'ok' }
    ]);
  }
  function redraw() { board.replaceChildren(build()); update(); }

  const pl = player({
    speed: 550,
    step() { if (t >= crash) return false; t++; redraw(); return t < crash; },
    reset() { t = 0; redraw(); }
  });
  const jump = btn('Jump to crash', () => { pl.stop(); t = crash; redraw(); });
  pl.append(jump);
  const modeSeg = seg([{ v: 'async', l: 'Asynchronous followers' }, { v: 'sync', l: 'Wait for follower 1' }], mode, v => { mode = v; t = 0; pl.stop(); redraw(); });
  const crashSl = slider('Leader crashes at tick', 3, 10, crash, 1, v => { crash = v; t = Math.min(t, crash); pl.stop(); redraw(); });

  root.append(
    bar(modeSeg), crashSl, pl, board, verdict,
    h('p', { class: 'note', html: '<span style="color:var(--acc)">■</span> confirmed or stored &nbsp; <span style="color:var(--p4)">■</span> waiting for follower 1 &nbsp; <span style="color:var(--acc)">▭</span> in flight &nbsp; <span style="color:var(--acc2)">✕</span> confirmed but lost' }),
    note('Illustrative: one write per tick, and the lags (3 and 5 ticks) are chosen for the picture, not measured. Press Play, switch to "Wait for follower 1", and compare how many confirmed writes survive the crash.')
  );
  redraw();
};

PG.d4 = function (root, A) {
  const { h, svg, bar, seg, slider, player, stat, note } = A;
  const INF = Infinity;
  // three stories. lag[key][copy] = ticks before a write to that key reaches that copy (leader = 0 for every key)
  const SC = {
    own: {
      name: 'Read your own write',
      rows: [['L', 'Leader'], ['R1', 'Replica 1 · lag 1'], ['R2', 'Replica 2 · lag 4']],
      keys: [['comment', 'comment']],
      lag: { comment: { L: 0, R1: 1, R2: 4 } },
      writes: [{ k: 'comment', t: 1, v: 1 }],
      naive: [{ t: 2, get: { comment: 'R2' } }, { t: 3, get: { comment: 'R1' } }, { t: 6, get: { comment: 'R2' } }],
      fixed: [{ t: 2, get: { comment: 'L' } }, { t: 3, get: { comment: 'L' } }, { t: 6, get: { comment: 'R2' } }],
      bad: (r, prev) => r.t > 1 && r.vals.comment < 1 ? 'her comment is missing' : null,
      what: 'Alice posts at tick 1. Her reads at ticks 2 and 3 should include her comment.'
    },
    mono: {
      name: 'Monotonic reads',
      rows: [['L', 'Leader'], ['R1', 'Replica 1 · lag 1'], ['R2', 'Replica 2 · lag 4']],
      keys: [['val', 'thread']],
      lag: { val: { L: 0, R1: 1, R2: 4 } },
      writes: [{ k: 'val', t: 1, v: 1 }, { k: 'val', t: 2, v: 2 }],
      naive: [{ t: 3, get: { val: 'R1' } }, { t: 4, get: { val: 'R2' } }, { t: 5, get: { val: 'R1' } }],
      fixed: [{ t: 3, get: { val: 'R1' } }, { t: 4, get: { val: 'R1' } }, { t: 5, get: { val: 'R1' } }],
      bad: (r, prev) => prev && r.vals.val < prev.vals.val ? 'went backwards from v' + prev.vals.val + ' to v' + r.vals.val : null,
      what: 'Two comments are written. Alice reads three times. Her view should only move forward.'
    },
    prefix: {
      name: 'Consistent prefix',
      rows: [['C1', 'Copy 1 · question shard'], ['C2', 'Copy 2 · answer shard']],
      keys: [['question', 'question'], ['answer', 'answer']],
      lag: { question: { C1: 4, C2: INF }, answer: { C1: INF, C2: 1 } },
      fixedLag: { question: { C1: 4, C2: INF }, answer: { C1: 4, C2: INF } },
      writes: [{ k: 'question', t: 1, v: 1 }, { k: 'answer', t: 2, v: 1 }],
      naive: [{ t: 3, get: { question: 'C1', answer: 'C2' } }, { t: 5, get: { question: 'C1', answer: 'C2' } }],
      fixed: [{ t: 3, get: { question: 'C1', answer: 'C1' } }, { t: 5, get: { question: 'C1', answer: 'C1' } }],
      bad: (r) => r.vals.answer >= 1 && r.vals.question < 1 ? 'answer shown, question not yet visible' : null,
      what: 'A question is written to one shard and its answer to another. A reader should never see the answer without the question.'
    }
  };
  let sc = 'own', fix = false, t = 0;
  const maxT = 7;

  // lag table in use: the guarantee may change where data is stored (prefix story)
  const lagOf = (S, useFixed) => (useFixed && S.fixedLag ? S.fixedLag : S.lag);
  // newest version of key k that copy c holds at tick now (0 = written but not yet arrived, null = copy does not store k)
  const ver = (S, k, c, now, useFixed) => {
    const d = lagOf(S, useFixed)[k] && lagOf(S, useFixed)[k][c];
    if (d === undefined || d === INF) return null;
    let v = 0;
    S.writes.forEach(w => { if (w.k === k && w.t + d <= now) v = Math.max(v, w.v); });
    return v;
  };
  const cellText = v => (v === null ? '·' : v === 0 ? '—' : 'v' + v);

  const board = h('div', { class: 'dsim' });
  const log = h('div', { class: 'log', style: 'min-height:90px' });
  const verdict = stat([]);

  function reads(S, useFixed) {
    const list = useFixed ? S.fixed : S.naive;
    let prev = null;
    return list.map(r => {
      const vals = {};
      Object.keys(r.get).forEach(k => { vals[k] = ver(S, k, r.get[k], r.t, useFixed); });
      const out = { t: r.t, get: r.get, vals, prev };
      prev = out;
      return out;
    });
  }

  function redraw() {
    const S = SC[sc];
    const useFixed = fix;
    const sf = S.rows.length;
    const W = 640, cw = 210, rh = 40;
    const s = svg('svg', { viewBox: `0 0 ${W} ${60 + sf * rh}`, role: 'img', 'aria-label': S.name + ' at tick ' + t, style: 'width:100%;height:auto;display:block' });
    // column headers
    S.keys.forEach(([k, label], j) => s.append(svg('text', { x: 180 + j * cw + cw / 2 - 40, y: 22, 'font-size': 13, fill: 'var(--mut)', 'text-anchor': 'middle' }, label)));
    S.rows.forEach(([rid, rlabel], i) => {
      const y = 36 + i * rh;
      s.append(svg('text', { x: 10, y: y + 22, 'font-size': 13, fill: 'var(--ink)', 'font-weight': rid === 'L' ? 700 : 400 }, rlabel));
      S.keys.forEach(([k], j) => {
        const v = ver(S, k, rid, t, useFixed);
        const x = 180 + j * cw;
        const hasCopy = v !== null;
        s.append(svg('rect', { x: x + 10, y: y + 4, width: 110, height: 30, rx: 6, fill: hasCopy && v > 0 ? 'var(--acc)' : 'var(--card)', stroke: 'var(--line)', 'stroke-width': 1.5 }));
        s.append(svg('text', { x: x + 65, y: y + 24, 'text-anchor': 'middle', 'font-size': 12, fill: hasCopy && v > 0 ? 'var(--card)' : 'var(--mut)' }, cellText(v)));
      });
    });
    board.replaceChildren(s);

    // reads made so far
    const all = reads(S, useFixed).filter(r => r.t <= t);
    let anomaly = null, lines = [];
    all.forEach(r => {
      const bad = S.bad(r, r.prev);
      if (bad && !anomaly) anomaly = bad;
      const who = Object.keys(r.get).map(k => k + ' from ' + (S.rows.find(x => x[0] === r.get[k]) || [r.get[k]])[1].split(' ·')[0] + ' = ' + cellText(r.vals[k])).join(', ');
      lines.push(h('div', { class: bad ? 'bad' : '' }, 'tick ' + r.t + ' · ' + who + (bad ? '   ✗ ' + bad : '   ✓')));
    });
    log.replaceChildren(...(lines.length ? lines : [h('div', { class: '' }, 'no reads yet')]));
    verdict.update([
      { l: 'Reads so far', v: all.length },
      { l: 'Anomalies', v: all.filter(r => S.bad(r, r.prev)).length, cls: all.some(r => S.bad(r, r.prev)) ? 'bad' : 'ok' },
      { l: 'Guarantee', v: fix ? 'on' : 'off' }
    ]);
  }

  const pl = player({
    speed: 700,
    step() { if (t >= maxT) return false; t++; syncSlider(); redraw(); return t < maxT; },
    reset() { t = 0; syncSlider(); redraw(); }
  });
  const sl = slider('Tick', 0, maxT, t, 1, v => { t = v; pl.stop(); redraw(); });
  const syncSlider = () => { sl.value = t; };
  const scSeg = seg(Object.keys(SC).map(k => ({ v: k, l: SC[k].name })), sc, v => { sc = v; t = 0; syncSlider(); pl.stop(); redraw(); });
  const fixSeg = seg([{ v: false, l: 'Without the guarantee' }, { v: true, l: 'With the guarantee' }], fix, v => { fix = v; pl.stop(); redraw(); });

  root.append(
    bar(scSeg), bar(fixSeg), sl, pl, board, log, verdict,
    note('Illustrative: writes are one per story, and the lags (1 and 4 ticks) are chosen for the picture. Watch the same reads with and without the guarantee: the anomaly disappears, and the cost is the extra load on the leader or the pinned replica.')
  );
  redraw();
};

PG.d5 = function (root, A) {
  const { h, svg, bar, btn, seg, slider, stat, note, timers } = A;
  const N = 5;                                  // home replicas for this key
  const STAND = 2;                              // stand-in nodes used by a sloppy quorum
  const total = N + STAND;
  let W = 3, R = 3, mode = 'strict';
  let up, ver, hints, lastRead = null, lastWrite = null, log = [];

  // initial state: every home replica has v1, stand-ins have nothing
  function reset() {
    up = Array(total).fill(true);
    ver = Array.from({ length: total }, (_, i) => (i < N ? 1 : 0));
    hints = [];
    lastRead = null; lastWrite = null; log = [];
  }
  reset();

  const board = h('div', { class: 'dsim' });
  const verdict = stat([]);
  const logBox = A.logbox();
  const nodeId = i => (i < N ? 'home ' + (i + 1) : 'stand-in ' + (i - N + 1));

  // which nodes a write would reach, and whether it is confirmed
  function planWrite() {
    if (mode === 'strict') {
      const targets = [...Array(N).keys()].filter(i => up[i]);
      return { targets, hinted: [], ok: targets.length >= W, note: targets.length + ' of ' + N + ' home replicas up, need ' + W };
    }
    const home = [...Array(N).keys()].filter(i => up[i]);
    const stand = [...Array(STAND).keys()].map(k => N + k).filter(i => up[i]);
    const targets = home.concat(stand);
    const confirmed = targets.length >= W;
    return { targets: confirmed ? targets : [], ok: confirmed, note: targets.length + ' nodes reachable, need ' + W };
  }

  function doWrite() {
    const p = planWrite();
    if (!p.ok) { record('write v2 · FAILED (' + p.note + ')', 'bad'); redraw(); return; }
    // home nodes that are up store v2; in a sloppy quorum, stand-ins keep a hint for each home node that is down
    p.targets.forEach(i => { if (i < N) ver[i] = 2; });
    if (mode === 'sloppy') {
      const downHome = [...Array(N).keys()].filter(i => !up[i]);
      const standUp = p.targets.filter(i => i >= N);
      downHome.forEach((home, k) => { if (standUp.length) hints.push({ home, v: 2, at: standUp[k % standUp.length] }); });
    }
    lastWrite = 2;
    record('write v2 · confirmed by ' + p.targets.length + ' node(s) (' + p.note + ')', 'ok');
    ripple(p.targets);
    redraw();
  }

  // read: ask R reachable replicas (home nodes first, in reverse order), keep the newest version
  function doRead() {
    const home = [...Array(N).keys()].reverse().filter(i => up[i]);
    const stand = mode === 'sloppy' ? [...Array(STAND).keys()].map(k => N + k).filter(i => up[i]) : [];
    const asked = home.concat(stand).slice(0, R);
    if (asked.length < R) { record('read · FAILED, only ' + asked.length + ' of ' + R + ' replicas reachable', 'bad'); redraw(); return; }
    const newest = Math.max(...asked.map(i => ver[i]));
    const stale = lastWrite === 2 && newest < 2;
    lastRead = { asked, newest };
    record('read R=' + R + ' from ' + asked.map(i => (i < N ? 'home ' + (i + 1) : 'stand-in ' + (i - N + 1))).join(', ') + ' → v' + newest + (stale ? '  ✗ misses the confirmed write' : '  ✓'), stale ? 'bad' : 'ok');
    ripple(asked);
    redraw();
  }

  function heal() {
    up = Array(total).fill(true);
    hints.forEach(hn => { ver[hn.home] = Math.max(ver[hn.home], hn.v); });
    hints = [];
    record('all nodes back · hinted writes delivered to their home replicas', 'ok');
    redraw();
  }

  function record(text, kind) { log.push({ text, kind }); logBox.add(text, kind === 'bad' ? 'bad' : kind === 'ok' ? 'ok' : ''); }

  // a short sequential highlight, so the reader sees which nodes were touched and in what order
  function ripple(ids) {
    ids.forEach((id, k) => {
      const t = setTimeout(() => { const el = board.querySelector('[data-n="' + id + '"]'); if (el) { el.style.opacity = '0.35'; setTimeout(() => { el.style.opacity = ''; }, 500); } }, k * 220);
      timers.push(t);
    });
  }

  function redraw() {
    const cw = 86, gap = 8;
    const s = svg('svg', { viewBox: '0 0 640 170', role: 'img', 'aria-label': 'Seven replicas with their versions', style: 'width:100%;height:auto;display:block' });
    const lastRx = lastRead ? lastRead.asked : [];
    for (let i = 0; i < total; i++) {
      const x = 10 + i * (cw + gap) + (i >= N ? 10 : 0), y = 40;
      const isHome = i < N;
      const dead = !up[i];
      const reached = lastRx.includes(i);
      const fill = dead ? 'var(--p7)' : (ver[i] >= 2 ? 'var(--acc)' : ver[i] === 1 ? 'var(--p0)' : 'var(--card)');
      const g = svg('g', { 'data-n': i, style: 'cursor:pointer', onclick: () => { up[i] = !up[i]; record((up[i] ? 'node back: ' : 'node down: ') + nodeId(i), ''); redraw(); } });
      g.append(svg('rect', { x, y, width: cw, height: 80, rx: 10, fill, stroke: reached ? 'var(--acc2)' : (isHome ? 'var(--line)' : 'var(--mut)'), 'stroke-width': reached ? 3 : 1.5, 'stroke-dasharray': isHome ? null : '5 4' }));
      g.append(svg('text', { x: x + cw / 2, y: y + 22, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--ink)', 'font-weight': 700 }, nodeId(i)));
      g.append(svg('text', { x: x + cw / 2, y: y + 50, 'text-anchor': 'middle', 'font-size': 15, fill: !dead && ver[i] >= 2 ? 'var(--card)' : 'var(--ink)' }, dead ? 'down' : ver[i] === 0 ? 'empty' : 'v' + ver[i]));
      s.append(g);
      if (hints.some(hn => hn.at === i)) s.append(svg('text', { x: x + cw / 2, y: y + 72, 'text-anchor': 'middle', 'font-size': 10, fill: 'var(--acc2)' }, 'hint'));
    }
    s.append(svg('text', { x: 10, y: 150, 'font-size': 12, fill: 'var(--mut)' }, 'Click a node to take it down or bring it back. Dashed = stand-in, used only by a sloppy quorum.'));
    board.replaceChildren(s);
    const reachable = [...Array(total).keys()].filter(i => up[i]).length;
    verdict.update([
      { l: 'Nodes reachable', v: reachable + ' / ' + total },
      { l: 'W + R vs N', v: (W + R) + (W + R > N ? ' > ' : ' ≤ ') + N, cls: W + R > N ? 'ok' : 'bad' },
      { l: 'Last write', v: lastWrite === 2 ? 'v2 confirmed' : 'none yet' }
    ]);
  }

  const wSl = slider('Write acks W', 1, N, W, 1, v => { W = v; redraw(); });
  const rSl = slider('Read replies R', 1, N, R, 1, v => { R = v; redraw(); });
  const modeSeg = seg([{ v: 'strict', l: 'Strict quorum (home only)' }, { v: 'sloppy', l: 'Sloppy quorum (stand-ins)' }], mode, v => { mode = v; redraw(); });

  root.append(
    bar(modeSeg),
    wSl, rSl,
    bar(btn('Write v2', doWrite, 'primary'), btn('Read', doRead), btn('Bring all nodes back', heal), btn('Reset', () => { reset(); logBox.clear(); redraw(); })),
    board, verdict, logBox.el,
    note('Illustrative: five home replicas and two stand-ins. Try W = 3, R = 3 with one home node down: the read still overlaps the write. Then set W = 1, R = 1, take nodes down, and read.')
  );
  redraw();
};

PG.d6 = function (root, A) {
  const { h, svg, bar, btn, seg, stat, note, timers } = A;
  const K = 120;                                // keys 1..120, arriving in time order (higher = newer)
  const P = 12;                                 // fixed partitions for the fixed strategy
  const RECENT = 100;                           // keys above this are "new writes"
  let strat = 'mod', n = 4;
  let pAssign = [];                             // partition -> node (fixed strategy)
  const hash = k => Math.imul(k, 2654435761) >>> 0;

  function initParts(nodes) {
    pAssign = Array.from({ length: P }, (_, p) => Math.floor(p * nodes / P));
  }
  // grow the fixed strategy: the new node takes whole partitions from the existing nodes in turn
  function addNodeParts(newCount) {
    const target = Math.floor(P / newCount);
    let taken = 0, k = 0;
    while (taken < target) {
      const from = k % (newCount - 1);
      for (let p = P - 1; p >= 0; p--) if (pAssign[p] === from) { pAssign[p] = newCount - 1; taken++; break; }
      k++;
      if (k > 10 * P) break;
    }
  }
  initParts(n);

  // node for every key under the current strategy and node count
  function assignAll(count) {
    const out = {};
    for (let k = 1; k <= K; k++) {
      if (strat === 'mod') out[k] = hash(k) % count;
      else if (strat === 'fixed') out[k] = pAssign[hash(k) % P];
      else out[k] = Math.min(count - 1, Math.floor((k - 1) * count / K));
    }
    return out;
  }
  // screen layout for every key given its node and its position on that node
  function layout(assign, count) {
    const colW = 640 / count, pos = {};
    const per = Array.from({ length: count }, () => []);
    for (let k = 1; k <= K; k++) per[assign[k]].push(k);
    per.forEach((list, node) => list.forEach((k, idx) => {
      pos[k] = { x: node * colW + 14 + (idx % 6) * 15, y: 52 + Math.floor(idx / 6) * 15, node };
    }));
    return pos;
  }

  let count = n;
  const board = h('div', { class: 'dsim' });
  const verdict = stat([]);

  function draw(pos, cnt) {
    const colW = 640 / cnt;
    const s = svg('svg', { viewBox: '0 0 640 230', role: 'img', 'aria-label': 'Keys placed on ' + cnt + ' nodes', style: 'width:100%;height:auto;display:block' });
    for (let i = 0; i < cnt; i++) {
      s.append(svg('rect', { x: i * colW + 4, y: 30, width: colW - 8, height: 190, rx: 10, fill: 'var(--card)', stroke: 'var(--line)', 'stroke-width': 1.5 }));
      s.append(svg('text', { x: i * colW + colW / 2, y: 22, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--ink)', 'font-weight': 700 }, 'node ' + (i + 1)));
    }
    Object.keys(pos).forEach(k => {
      const p = pos[k];
      s.append(svg('circle', { cx: p.x, cy: p.y, r: 5, fill: +k > RECENT ? 'var(--acc2)' : 'var(--acc)' }));
    });
    board.replaceChildren(s);
  }

  function summary(prev, next) {
    let moved = 0, recentPer = Array(count).fill(0);
    for (let k = 1; k <= K; k++) {
      if (prev && prev[k] !== undefined && prev[k] !== next[k]) moved++;
      if (k > RECENT) recentPer[next[k]]++;
    }
    return { moved, recentMax: Math.max(...recentPer), recentPer };
  }

  // animate keys from their old places to their new ones
  function show(assignNew, cnt, prevAssign, prevCount) {
    const to = layout(assignNew, cnt);
    const from = prevAssign ? layout(prevAssign, prevCount) : to;
    const frames = prevAssign && prevCount !== cnt ? 8 : 1;
    for (let f = 1; f <= frames; f++) {
      const id = setTimeout(() => {
        const mid = {};
        Object.keys(to).forEach(k => {
          const a = from[k] || to[k], b = to[k], t = f / frames;
          mid[k] = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, node: b.node };
        });
        draw(mid, cnt);
      }, f * 70);
      timers.push(id);
    }
    const s = summary(prevAssign, assignNew);
    verdict.update([
      { l: 'Nodes', v: cnt },
      { l: 'Keys moved by last change', v: prevAssign ? s.moved + ' of ' + K + ' (' + Math.round(100 * s.moved / K) + '%)' : '—', cls: s.moved > K / 3 ? 'bad' : 'ok' },
      { l: 'New writes on busiest node', v: s.recentMax + ' of ' + (K - RECENT), cls: s.recentMax > (K - RECENT) / 2 ? 'bad' : 'ok' }
    ]);
  }

  function addNode() {
    if (count >= 6) return;
    const prevAssign = assignAll(count), prevCount = count;
    if (strat === 'fixed') addNodeParts(count + 1);
    count++;
    const next = assignAll(count);
    show(next, count, prevAssign, prevCount);
  }
  function reset() {
    count = 4; initParts(4); show(assignAll(count), count, null, null);
  }

  const stratSeg = seg([{ v: 'mod', l: 'Hash mod N' }, { v: 'fixed', l: 'Fixed partitions (12)' }, { v: 'range', l: 'Key ranges' }], strat, v => { strat = v; reset(); });

  root.append(
    bar(stratSeg),
    bar(btn('Add a node', addNode, 'primary'), btn('Reset to 4 nodes', reset)),
    board, verdict,
    note('Keys 101 to 120 are the newest writes (orange). Hash spreads them over nodes; key ranges send them all to the last node. Add a node and count how many keys move: hash mod N moves most of them, fixed partitions move only whole partitions. Illustrative: 120 keys and 12 partitions, not a production layout.')
  );
  reset();
};

PG.d7 = function (root, A) {
  const { h, svg, bar, seg, slider, player, stat, note } = A;
  const LEASE = 5;                              // A's lease: t0 .. t5
  const T = 12;                                 // ticks shown
  let pause = 5, fence = false, t = 0;

  // what happens when A is paused from t2 for `pause` ticks, and B takes over at lease expiry
  function scenario() {
    const R = 2 + pause;                        // A resumes here and sends its pending write (token 33)
    const writes = [{ t: LEASE + 1, who: 'B', tok: 34 }, { t: R, who: 'A', tok: 33 }];
    writes.sort((a, b) => a.t - b.t || (a.who === 'B' ? -1 : 1));
    let maxTok = 0, val = '—';
    const store = writes.map(w => {
      const ok = !fence || w.tok >= maxTok;
      if (ok) { val = w.who; maxTok = Math.max(maxTok, w.tok); }
      return Object.assign({ ok }, w);
    });
    const lostB = val === 'A' && store.some(s => s.who === 'B');
    return { R, store, val, lostB };
  }

  const board = h('div', { class: 'dsim' });
  const verdict = stat([]);
  const X = tt => 96 + tt * 44;                 // x position of tick tt
  const LANES = [['A', 'Client A'], ['L', 'Lock service'], ['B', 'Client B'], ['S', 'Storage']];
  const LY = i => 44 + i * 44;

  function draw() {
    const sc = scenario();
    const s = svg('svg', { viewBox: '0 0 640 240', role: 'img', 'aria-label': 'Lease, pause and writes at tick ' + t, style: 'width:100%;height:auto;display:block' });
    // tick ruler
    for (let tt = 0; tt <= T; tt += 1) s.append(svg('text', { x: X(tt), y: 18, 'text-anchor': 'middle', 'font-size': 10, fill: 'var(--mut)' }, String(tt)));
    LANES.forEach(([id, label], i) => {
      s.append(svg('text', { x: 6, y: LY(i) + 4, 'font-size': 12, fill: 'var(--ink)', 'font-weight': 700 }, label));
      s.append(svg('line', { x1: 92, y1: LY(i), x2: X(T), y2: LY(i), stroke: 'var(--line)', 'stroke-width': 1 }));
    });
    const bar_ = (lane, from, to, fill, text) => {
      const end = Math.min(to, t);
      if (end <= from) return;
      s.append(svg('rect', { x: X(from), y: LY(lane) - 9, width: X(end) - X(from), height: 18, rx: 6, fill, opacity: 0.85 }));
      if (text) s.append(svg('text', { x: X(from) + 6, y: LY(lane) + 4, 'font-size': 11, fill: 'var(--ink)' }, text));
    };
    bar_(0, 0, LEASE, 'var(--p0)', 'holds lock · token 33');
    bar_(0, 2, sc.R, 'var(--p5)', 'GC pause');
    bar_(1, 0, LEASE, 'var(--p0)', 'lease 33 → A');
    bar_(1, LEASE, LEASE + 5, 'var(--p2)', 'lease 34 → B');
    // events happen at their ticks
    const dot = (lane, tt, text, cls) => {
      if (tt > t) return;
      s.append(svg('circle', { cx: X(tt), cy: LY(lane), r: 4.5, fill: cls === 'bad' ? 'var(--acc2)' : cls === 'ok' ? 'var(--acc)' : 'var(--mut)' }));
      const right = X(tt) > 480;                                           // keep long labels inside the viewBox
      s.append(svg('text', { x: right ? X(tt) - 7 : X(tt) + 7, y: LY(lane) - 8, 'text-anchor': right ? 'end' : 'start', 'font-size': 10.5, fill: cls === 'bad' ? 'var(--acc2)' : 'var(--ink)' }, text));
    };
    dot(1, LEASE, 'lease expires', '');
    dot(2, LEASE, 'acquire, token 34', 'ok');
    sc.store.forEach(w => {
      const lane = 3;
      dot(lane, w.t, (w.who === 'A' ? 'A (33)' : 'B (34)') + (w.ok ? ' ✓' : ' ✗ rejected'), w.ok ? 'ok' : 'bad');
    });
    // current tick marker
    s.append(svg('line', { x1: X(t), y1: 24, x2: X(t), y2: 214, stroke: 'var(--acc)', 'stroke-width': 1.2, 'stroke-dasharray': '3 3' }));
    s.append(svg('text', { x: 6, y: 232, 'font-size': 11, fill: 'var(--mut)' }, 'tick ' + t + ' · A resumes at tick ' + sc.R + (sc.R <= LEASE ? ' (inside its lease)' : ' (after its lease expired at tick ' + LEASE + ')')));
    board.replaceChildren(s);

    const shownWrites = sc.store.filter(w => w.t <= t);
    const finalShown = t >= T || shownWrites.length === sc.store.length;
    verdict.update([
      { l: 'Stored value', v: finalShown ? sc.val : '…' },
      { l: 'Fencing', v: fence ? 'on' : 'off', cls: fence ? 'ok' : '' },
      { l: 'Outcome', v: !finalShown ? '…' : sc.lostB ? "B's update lost" : 'no conflict', cls: finalShown && sc.lostB ? 'bad' : 'ok' }
    ]);
  }

  const pl = player({
    speed: 600,
    step() { if (t >= T) return false; t++; draw(); return t < T; },
    reset() { t = 0; draw(); }
  });
  const pSl = slider('GC pause length (ticks)', 0, 9, pause, 1, v => { pause = v; t = Math.min(t, T); draw(); });
  const fSeg = seg([{ v: false, l: 'Storage ignores tokens' }, { v: true, l: 'Storage checks fencing tokens' }], fence, v => { fence = v; draw(); });

  root.append(
    bar(fSeg), pSl, pl, board, verdict,
    note('Illustrative: the lease is 5 ticks, and B takes over at expiry. Pause the client for less than the lease and there is no conflict. Pause it longer, then compare the two storage modes: with fencing, the storage refuses the stale token 33 once it has seen 34.')
  );
  draw();
};

PG.d8 = function (root, A) {
  const { h, svg, bar, seg, player, stat, note } = A;
  const OFF = { A: 3, B: -2 };                      // clock offsets in seconds, from the true time
  const T = 4;
  let mode = 'wall', sc = 'causal', t = 0;

  // the two writes, with each mode's stamp already computed
  function writesFor(s) {
    if (s === 'causal') return [
      { t: 1, who: 'A', val: 'A', wall: 1 + OFF.A, L: 1, vc: { A: 1 } },
      { t: 3, who: 'B', val: 'B', wall: 3 + OFF.B, L: 2, vc: { A: 1, B: 1 }, note: 'B read A first' }
    ];
    return [
      { t: 1, who: 'A', val: 'A', wall: 1 + OFF.A, L: 1, vc: { A: 1 } },
      { t: 2, who: 'B', val: 'B', wall: 2 + OFF.B, L: 1, vc: { B: 1 }, note: 'B wrote without reading' }
    ];
  }
  const stamp = (m, v) => m === 'wall' ? 'time ' + v.wall : m === 'lamport' ? 'L=' + v.L : '{' + Object.keys(v.vc).map(k => k + ':' + v.vc[k]).join(' ') + '}';
  const dominates = (a, b) => { const keys = new Set([...Object.keys(a.vc), ...Object.keys(b.vc)]); let gt = false; for (const k of keys) { const x = a.vc[k] || 0, y = b.vc[k] || 0; if (x < y) return false; if (x > y) gt = true; } return gt; };
  // what the store keeps, under each rule
  function resolve(m, list) {
    if (!list.length) return [];
    if (m === 'wall') return [list.reduce((a, b) => (b.wall > a.wall ? b : a))];
    if (m === 'lamport') return [list.reduce((a, b) => (b.L > a.L || (b.L === a.L && b.who > a.who) ? b : a))];
    return list.filter(v => !list.some(u => u !== v && dominates(u, v)));
  }

  const board = h('div', { class: 'dsim' });
  const verdict = stat([]);
  const X = tt => 120 + tt * 118;
  const LANES = [['A', 'Client A · clock +3 s'], ['B', 'Client B · clock −2 s'], ['S', 'Store']];
  const LY = i => 56 + i * 54;

  function draw() {
    const W = writesFor(sc);
    const s = svg('svg', { viewBox: '0 0 640 220', role: 'img', 'aria-label': 'Two writes and the store at real time ' + t, style: 'width:100%;height:auto;display:block' });
    for (let tt = 0; tt <= T; tt++) s.append(svg('text', { x: X(tt), y: 18, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--mut)' }, 'real t=' + tt));
    LANES.forEach(([id, label], i) => {
      s.append(svg('text', { x: 6, y: LY(i) + 4, 'font-size': 12, fill: 'var(--ink)', 'font-weight': 700 }, label));
      s.append(svg('line', { x1: 110, y1: LY(i), x2: X(T), y2: LY(i), stroke: 'var(--line)', 'stroke-width': 1 }));
    });
    const shown = W.filter(w => w.t <= t);
    shown.forEach(w => {
      const lane = w.who === 'A' ? 0 : 1;
      s.append(svg('circle', { cx: X(w.t), cy: LY(lane), r: 6, fill: w.who === 'A' ? 'var(--acc)' : 'var(--acc2)' }));
      s.append(svg('text', { x: X(w.t) + 10, y: LY(lane) - 8, 'font-size': 11, fill: 'var(--ink)' }, 'write ' + w.val + ' · ' + stamp(mode, w)));
      // the store lane shows the write arriving, at the same real time
      s.append(svg('line', { x1: X(w.t), y1: LY(lane) + 8, x2: X(w.t), y2: LY(2) - 8, stroke: 'var(--line)', 'stroke-dasharray': '3 3' }));
      s.append(svg('circle', { cx: X(w.t), cy: LY(2), r: 4, fill: 'var(--mut)' }));
    });
    // what the store holds now
    const kept = resolve(mode, shown);
    const txt = kept.length ? kept.map(v => v.val + ' (' + stamp(mode, v) + ')').join('  +  ') : 'empty';
    s.append(svg('text', { x: 110, y: LY(2) + 24, 'font-size': 12, fill: 'var(--ink)', 'font-weight': 700 }, 'holds: ' + txt));
    board.replaceChildren(s);

    const all = resolve(mode, W);
    const latest = W[W.length - 1].val;
    let outcome, cls;
    if (all.length > 1) { outcome = 'both kept: siblings to merge'; cls = ''; }
    else if (all[0].val === latest) { outcome = 'latest write kept ✓'; cls = 'ok'; }
    else { outcome = latest + "'s later write was lost ✗"; cls = 'bad'; }
    verdict.update([
      { l: 'Final store', v: t >= T ? all.map(v => v.val).join(' + ') : '…' },
      { l: 'Rule', v: mode === 'wall' ? 'last-write-wins' : mode === 'lamport' ? 'highest counter' : 'vector clocks' },
      { l: 'Result', v: t >= T ? outcome : '…', cls: t >= T ? cls : '' }
    ]);
  }

  const pl = player({
    speed: 650,
    step() { if (t >= T) return false; t++; draw(); return t < T; },
    reset() { t = 0; draw(); }
  });
  const modeSeg = seg([{ v: 'wall', l: 'Wall clock (last-write-wins)' }, { v: 'lamport', l: 'Lamport counter' }, { v: 'vector', l: 'Vector clocks' }], mode, v => { mode = v; draw(); });
  const scSeg = seg([{ v: 'causal', l: 'B read A, then wrote' }, { v: 'blind', l: 'B wrote without reading' }], sc, v => { sc = v; t = 0; pl.stop(); draw(); });

  root.append(
    bar(modeSeg), bar(scSeg), pl, board, verdict,
    note('Illustrative: real time runs 0 to 4, and each client reads its own clock. Replay the same two writes under each rule. In the causal case, only vector clocks and Lamport counters keep B. In the blind case, no single rule is right: vector clocks admit that the writes were concurrent.')
  );
  t = 0;
  draw();
};

PG.d9 = function (root, A) {
  const { h, svg, bar, seg, player, stat, note } = A;
  const T = 8;
  let mode = 'leader', t = 0;

  // operations: client, kind, value written or returned, start and end tick
  const HISTORY = {
    leader: [
      { id: 'C1 write 1', c: 'C1', kind: 'w', v: 1, s: 1, e: 3 },
      { id: 'C2 read', c: 'C2', kind: 'r', v: 1, s: 2, e: 4 },
      { id: 'C3 read', c: 'C3', kind: 'r', v: 1, s: 5, e: 7 }
    ],
    follower: [
      { id: 'C1 write 1', c: 'C1', kind: 'w', v: 1, s: 1, e: 3 },
      { id: 'C2 read', c: 'C2', kind: 'r', v: 1, s: 2, e: 4 },
      { id: 'C3 read', c: 'C3', kind: 'r', v: 0, s: 5, e: 7 }
    ]
  };

  // brute force: find an order of the operations that real time allows and a register accepts
  function findOrder(ops) {
    const perms = [];
    const rec = (left, acc) => { if (!left.length) { perms.push(acc); return; } left.forEach((o, i) => rec(left.filter((_, j) => j !== i), acc.concat([o]))); };
    rec(ops, []);
    for (const p of perms) {
      let ok = true;
      for (let i = 0; i < p.length && ok; i++) for (let j = i + 1; j < p.length && ok; j++) if (p[j].e < p[i].s) ok = false;   // p[j] finished before p[i] started, so p[j] cannot come later
      if (!ok) continue;
      let reg = 0;
      for (const o of p) { if (o.kind === 'w') reg = o.v; else if (o.v !== reg) { ok = false; break; } }
      if (ok) return p;
    }
    return null;
  }

  const board = h('div', { class: 'dsim' });
  const verdict = stat([]);
  const X = tt => 110 + tt * 62;
  const ops = () => HISTORY[mode];

  function draw() {
    const list = ops();
    const s = svg('svg', { viewBox: '0 0 640 210', role: 'img', 'aria-label': 'History of operations on one register, tick ' + t, style: 'width:100%;height:auto;display:block' });
    for (let tt = 0; tt <= T; tt++) s.append(svg('text', { x: X(tt), y: 16, 'text-anchor': 'middle', 'font-size': 10.5, fill: 'var(--mut)' }, String(tt)));
    ['C1', 'C2', 'C3'].forEach((c, i) => {
      const y = 36 + i * 52;
      s.append(svg('text', { x: 6, y: y + 20, 'font-size': 12, fill: 'var(--ink)', 'font-weight': 700 }, c));
      s.append(svg('line', { x1: X(0), y1: y + 14, x2: X(T), y2: y + 14, stroke: 'var(--line)', 'stroke-width': 1 }));
      list.filter(o => o.c === c).forEach(o => {
        const end = Math.min(o.e, t);
        if (o.s > t) return;
        const done = t >= o.e;
        const label = o.kind === 'w' ? 'write ' + o.v : 'read → ' + (done ? o.v : '…');
        s.append(svg('rect', { x: X(o.s), y: y, width: Math.max(4, X(end) - X(o.s)), height: 28, rx: 6, fill: o.kind === 'w' ? 'var(--p0)' : (done ? 'var(--acc)' : 'var(--p7)'), stroke: 'var(--line)', 'stroke-width': 1 }));
        s.append(svg('text', { x: X(o.s) + 8, y: y + 18, 'font-size': 11.5, fill: done && o.kind === 'r' ? 'var(--card)' : 'var(--ink)' }, label));
      });
    });
    s.append(svg('line', { x1: X(t), y1: 24, x2: X(t), y2: 196, stroke: 'var(--acc2)', 'stroke-width': 1.2, 'stroke-dasharray': '3 3' }));
    board.replaceChildren(s);

    const order = t >= T ? findOrder(list) : null;
    let result = '…', cls = '';
    if (t >= T) {
      if (order) { result = 'linearizable'; cls = 'ok'; }
      else { result = 'not linearizable'; cls = 'bad'; }
    }
    verdict.update([
      { l: 'Check', v: result, cls },
      { l: 'Order that fits', v: t >= T ? (order ? order.map(o => o.id).join(' → ') : 'none') : '…' }
    ]);
  }

  const pl = player({
    speed: 600,
    step() { if (t >= T) return false; t++; draw(); return t < T; },
    reset() { t = 0; draw(); }
  });
  const modeSeg = seg([{ v: 'leader', l: 'Every read from the leader' }, { v: 'follower', l: 'C3 reads a lagging follower' }], mode, v => { mode = v; t = 0; pl.stop(); draw(); });

  root.append(
    bar(modeSeg), pl, board, verdict,
    note('Each bar is one operation, from its start to its end. A read must return the last write that finished before it, or overlapped it. Here C2 finishes reading 1 before C3 starts, so C3 must also return 1. The checker tries every order that real time allows.')
  );
  draw();
};

PG.d10 = function (root, A) {
  const { h, svg, bar, btn, seg, player, stat, note } = A;
  const IDS = [1, 2, 3, 4, 5];
  const MAJ = 3;
  const RESET = { 1: 5, 2: 4, 3: 3, 4: 6, 5: 5 };   // randomised election timeouts, fixed so the run repeats
  const START = { 1: 4, 2: 2, 3: 5, 4: 6, 5: 3 };   // node 2 times out first, so it wins term 1
  let nodes, t, k, pl;
  let split = false;                                                  // read by the segmented control, so set before it is built

  function reset() {
    t = 0; split = false; k = 0;
    nodes = IDS.map(id => ({ id, up: true, term: 0, role: 'F', voted: null, log: [], left: START[id], commit: 0 }));
  }
  const byId = id => nodes.find(n => n.id === id);
  const group = id => (id <= 2 ? 'P1' : 'P2');
  const reach = (a, b) => byId(a).up && byId(b).up && (!split || group(a) === group(b));
  const leaders = () => nodes.filter(n => n.up && n.role === 'L');

  function tick() {
    t++;
    // 1. leaders send heartbeats; followers copy the leader's log and reset their timers
    nodes.filter(n => n.up && n.role === 'L').forEach(L => {
      if (L.role !== 'L') return;                                         // demoted earlier in this tick
      const peers = nodes.filter(j => j.id !== L.id && reach(L.id, j.id));
      const newer = Math.max(0, ...peers.map(j => j.term));
      if (newer > L.term) {                                               // a newer term deposes the leader; it sends no heartbeats this tick
        L.role = 'F'; L.term = newer; L.voted = null; return;
      }
      peers.forEach(j => {
        if (j.term < L.term) j.voted = null;                              // a new term means a new vote
        j.term = L.term; j.role = 'F'; j.left = RESET[j.id];
        j.log = L.log.map(e => Object.assign({}, e));
        j.commit = Math.min(L.commit, j.log.length);
      });
    });
    // 2. followers and candidates count down; a timeout starts an election
    nodes.filter(n => n.up && n.role !== 'L').forEach(n => {
      n.left--;
      if (n.left > 0 || n.role === 'L') return;
      n.term++; n.role = 'C'; n.voted = n.id;
      let votes = 1;
      nodes.forEach(j => {
        if (j.id === n.id || !reach(n.id, j.id)) return;
        if (j.term < n.term) { j.term = n.term; j.role = 'F'; j.voted = null; }
        const lastT = x => (x.log.length ? x.log[x.log.length - 1].term : 0);
        const upToDate = lastT(n) > lastT(j) || (lastT(n) === lastT(j) && n.log.length >= j.log.length);
        if (j.voted === null && upToDate) { j.voted = n.id; votes++; }
      });
      n.left = RESET[n.id];
      if (votes >= MAJ) { n.role = 'L'; }
    });
    // 3. a leader commits an entry once a majority of the nodes it can reach stores it
    nodes.filter(n => n.up && n.role === 'L').forEach(L => {
      for (let i = L.commit; i < L.log.length; i++) {
        if (L.log[i].term !== L.term) continue;                           // only entries from its own term
        const stored = nodes.filter(j => j.up && (j.id === L.id || reach(L.id, j.id)) && j.log.length > i && j.log[i].term === L.log[i].term).length;
        if (stored >= MAJ) L.commit = i + 1;
      }
    });
    nodes.forEach(n => { if (n.role !== 'L') n.commit = Math.min(n.commit, n.log.length); });
    draw();
  }

  function write() {
    const L = leaders().sort((a, b) => b.term - a.term)[0];   // clients go to the newest leader
    if (!L) { info('No leader to take the write. Wait for an election.'); return; }
    k++;
    L.log.push({ term: L.term, v: 'v' + k });
    info('Client writes v' + k + ' to leader ' + L.id + ' (term ' + L.term + ').');
    draw();
  }
  function kill() {
    const L = leaders()[0];
    if (!L) return;
    L.up = false; info('Leader ' + L.id + ' crashed.');
    draw();
  }
  function revive() { nodes.forEach(n => { n.up = true; n.role = 'F'; }); info('All nodes are back. Their logs are kept.'); draw(); }

  const logBox = A.logbox();
  const info = msg => logBox.add(msg, '');
  const board = h('div', { class: 'dsim' });
  const verdict = stat([]);

  function draw() {
    const W = 128;
    const s = svg('svg', { viewBox: '0 0 640 230', role: 'img', 'aria-label': 'Five consensus nodes at tick ' + t, style: 'width:100%;height:auto;display:block' });
    if (split) {
      s.append(svg('rect', { x: 4, y: 26, width: 2 * W - 8, height: 168, rx: 12, fill: 'none', stroke: 'var(--acc2)', 'stroke-width': 1.5, 'stroke-dasharray': '6 4' }));
      s.append(svg('rect', { x: 2 * W + 4, y: 26, width: 3 * W - 8, height: 168, rx: 12, fill: 'none', stroke: 'var(--acc)', 'stroke-width': 1.5, 'stroke-dasharray': '6 4' }));
    }
    nodes.forEach((n, i) => {
      const x = i * W + 10, y = 36;
      const role = !n.up ? 'down' : n.role === 'L' ? 'leader' : n.role === 'C' ? 'candidate' : 'follower';
      const fill = !n.up ? 'var(--p7)' : n.role === 'L' ? 'var(--acc)' : n.role === 'C' ? 'var(--p4)' : 'var(--card)';
      s.append(svg('rect', { x, y, width: W - 20, height: 150, rx: 12, fill, stroke: 'var(--line)', 'stroke-width': 1.5 }));
      const tc = n.role === 'L' && n.up ? 'var(--card)' : 'var(--ink)';
      s.append(svg('text', { x: x + (W - 20) / 2, y: y + 20, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700, fill: tc }, 'node ' + n.id));
      s.append(svg('text', { x: x + (W - 20) / 2, y: y + 38, 'text-anchor': 'middle', 'font-size': 11, fill: tc }, role));
      s.append(svg('text', { x: x + (W - 20) / 2, y: y + 54, 'text-anchor': 'middle', 'font-size': 11, fill: tc }, 'term ' + n.term));
      n.log.forEach((e, j) => {
        const cx = x + 10 + (j % 4) * 24, cy = y + 66 + Math.floor(j / 4) * 22;
        const committed = j < n.commit;
        s.append(svg('rect', { x: cx, y: cy, width: 20, height: 18, rx: 4, fill: committed ? 'var(--acc)' : 'var(--p4)', stroke: 'var(--line)' }));
        s.append(svg('text', { x: cx + 10, y: cy + 13, 'text-anchor': 'middle', 'font-size': 9, fill: committed ? 'var(--card)' : 'var(--ink)' }, e.v));
      });
      if (!n.log.length) s.append(svg('text', { x: x + (W - 20) / 2, y: y + 84, 'text-anchor': 'middle', 'font-size': 10, fill: 'var(--mut)' }, 'empty log'));
      if (n.up && n.role !== 'L') s.append(svg('text', { x: x + (W - 20) / 2, y: y + 134, 'text-anchor': 'middle', 'font-size': 10, fill: 'var(--mut)' }, 'timeout in ' + Math.max(0, n.left)));
    });
    s.append(svg('text', { x: 10, y: 222, 'font-size': 11, fill: 'var(--mut)' }, 'tick ' + t + ' · green entries are committed (stored on a majority)'));
    board.replaceChildren(s);

    const L = leaders();
    const committed = Math.max(...nodes.map(n => n.commit));
    const pending = L.length ? L[0].log.length - L[0].commit : 0;
    verdict.update([
      { l: 'Leaders now', v: L.length ? L.map(n => 'node ' + n.id + ' (term ' + n.term + ')').join(', ') : 'none', cls: L.length > 1 ? 'bad' : L.length ? 'ok' : 'bad' },
      { l: 'Committed entries', v: committed },
      { l: 'Waiting for a majority', v: pending, cls: pending ? 'bad' : '' }
    ]);
  }

  pl = player({
    speed: 700,
    step() { tick(); return true; },
    reset() { reset(); logBox.clear(); draw(); }
  });
  const splitSeg = seg([{ v: false, l: 'Network connected' }, { v: true, l: 'Split {1,2} | {3,4,5}' }], split, v => { split = v; info(v ? 'The network splits: nodes 1 and 2 cannot reach 3, 4 and 5.' : 'The network heals.'); draw(); });

  root.append(
    bar(splitSeg),
    pl,
    bar(btn('Tick', () => { pl.stop(); tick(); }), btn('Write a value', write, 'primary'), btn('Kill the leader', kill), btn('Revive all', revive)),
    board, verdict, logBox.el,
    note('Illustrative: five nodes, a fixed run (the election timeouts are chosen so the picture repeats). Try: write, kill the leader, watch node 3 win term 2 and keep the committed entries. Then split the network and write: the two-node side accepts entries that never commit, and after the heal those entries are overwritten.')
  );
  reset();
  draw();
  info('Start: no leader yet. Press Tick to advance.');
};

PG.d11 = function (root, A) {
  const { h, svg, bar, btn, seg, slider, player, stat, note } = A;
  const AMOUNT = 100;
  // each step: the message it sends (if any) and what it does to the accounts
  const STEPS = {
    '2pc': [
      { text: 'The client asks the coordinator to move 100 from A to B.', msg: null, run: () => {} },
      { text: 'The coordinator sends PREPARE to A and B.', msg: ['C', 'A'], msg2: ['C', 'B'], run: () => {} },
      { text: 'A and B lock their rows, write a prepare record, and vote YES.', msg: ['A', 'C'], msg2: ['B', 'C'], run: st => { st.A.state = 'prepared'; st.B.state = 'prepared'; st.A.locked = st.B.locked = true; } },
      { text: 'The coordinator writes COMMIT to its own log. The decision is now durable.', msg: null, run: st => { st.dec = 'commit'; } },
      { text: 'The coordinator sends COMMIT to A.', msg: ['C', 'A'], run: () => {} },
      { text: 'A applies the change and unlocks.', msg: null, run: st => applyTo(st, 'A') },
      { text: 'The coordinator sends COMMIT to B.', msg: ['C', 'B'], run: () => {} },
      { text: 'B applies the change and unlocks.', msg: null, run: st => applyTo(st, 'B') }
    ],
    naive: [
      { text: 'The client asks to move 100 from A to B. Each database is updated separately.', msg: null, run: () => {} },
      { text: 'The service tells A to debit 100 and commits it there.', msg: ['C', 'A'], run: st => applyTo(st, 'A') },
      { text: 'The service tells B to credit 100 and commits it there.', msg: ['C', 'B'], run: st => applyTo(st, 'B') }
    ]
  };
  const DELTA = { A: -AMOUNT, B: AMOUNT };
  function applyTo(st, p) {
    if (st[p].state === 'committed') return;
    st[p].bal += DELTA[p]; st[p].state = 'committed'; st[p].locked = false;
  }

  let mode = '2pc', cur = 0, crashAfter = 8, recovered = false;

  // rebuild the whole state from the step list, so every control stays consistent
  function build() {
    const st = { A: { bal: 500, state: 'idle', locked: false }, B: { bal: 200, state: 'idle', locked: false }, dec: null, crashed: false, lines: [] };
    const steps = STEPS[mode];
    for (let i = 0; i < steps.length && i < cur; i++) {
      if (st.crashed) break;
      steps[i].run(st);
      st.lines.push({ i, text: steps[i].text });
      if (i === crashAfter) { st.crashed = true; st.lines.push({ i, text: 'The coordinator crashes here.', crash: true }); }
    }
    if (recovered && st.crashed && mode === '2pc') {
      if (st.dec === 'commit') {
        applyTo(st, 'A'); applyTo(st, 'B');
        st.lines.push({ text: 'Recovered coordinator finds COMMIT in its log and resends it to A and B.' });
      } else {
        ['A', 'B'].forEach(p => { if (st[p].state === 'prepared') { st[p].state = 'aborted'; st[p].locked = false; } });
        st.lines.push({ text: 'Recovered coordinator finds no decision, so it aborts (presumed abort).' });
      }
    }
    if (recovered && st.crashed && mode === 'naive') st.lines.push({ text: 'Nothing recorded the transfer, so nothing can finish it.' });
    return st;
  }

  const board = h('div', { class: 'dsim' });
  const verdict = stat([]);
  const logBox = A.logbox();

  function draw() {
    const st = build();
    const s = svg('svg', { viewBox: '0 0 640 230', role: 'img', 'aria-label': 'Transfer between two shards at step ' + cur, style: 'width:100%;height:auto;display:block' });
    const arrow = (x1, y1, x2, y2, on, label) => {
      s.append(svg('line', { x1, y1, x2, y2, stroke: on ? 'var(--acc2)' : 'var(--line)', 'stroke-width': on ? 3 : 1.5, 'stroke-dasharray': on ? null : '4 4' }));
      if (label) s.append(svg('text', { x: (x1 + x2) / 2 + 6, y: (y1 + y2) / 2, 'font-size': 11, fill: on ? 'var(--acc2)' : 'var(--mut)' }, label));
    };
    // messages of the step that was just executed
    const last = STEPS[mode][Math.min(cur, STEPS[mode].length) - 1];
    const hot = m => last && (last.msg && last.msg[0] + last.msg[1] === m || last.msg2 && last.msg2[0] + last.msg2[1] === m);
    const crash = st.crashed;
    arrow(320, 70, 130, 150, hot('CA'), mode === '2pc' ? 'PREPARE / COMMIT' : 'debit');
    arrow(320, 70, 510, 150, hot('CB'), mode === '2pc' ? 'PREPARE / COMMIT' : 'credit');
    arrow(130, 150, 320, 70, hot('AC'), 'vote');
    arrow(510, 150, 320, 70, hot('BC'), 'vote');
    const box = (x, y, w, hh, title, fill) => s.append(svg('rect', { x, y, width: w, height: hh, rx: 12, fill, stroke: 'var(--line)', 'stroke-width': 1.5 }), svg('text', { x: x + w / 2, y: y + 20, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700, fill: 'var(--ink)' }, title));
    box(230, 20, 180, 50, crash ? 'coordinator (crashed)' : 'coordinator', crash ? 'var(--p7)' : 'var(--card)');
    s.append(svg('text', { x: 320, y: 56, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--mut)' }, st.dec ? 'log: ' + st.dec.toUpperCase() : 'log: empty'));
    [['A', 40, 'shard 1 · account A'], ['B', 420, 'shard 2 · account B']].forEach(([p, x, title]) => {
      const S = st[p];
      const fill = S.state === 'committed' ? 'var(--p2)' : S.state === 'prepared' ? 'var(--p4)' : S.state === 'aborted' ? 'var(--p7)' : 'var(--card)';
      box(x, 150, 180, 70, title, fill);
      const doubt = S.state === 'prepared' && crash && !recovered;
      s.append(svg('text', { x: x + 90, y: 186, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--ink)' }, 'balance ' + S.bal + (S.locked ? ' · locked' : '')));
      s.append(svg('text', { x: x + 90, y: 206, 'text-anchor': 'middle', 'font-size': 11, fill: doubt ? 'var(--acc2)' : 'var(--mut)' }, doubt ? 'in doubt: waiting for the coordinator' : S.state));
    });
    board.replaceChildren(s);

    logBox.clear();
    st.lines.forEach(l => logBox.add(l.text, l.crash ? 'bad' : ''));
    const total = st.A.bal + st.B.bal;
    const inDoubt = crash && !recovered && [st.A, st.B].some(x => x.state === 'prepared');
    let result = total === 700 ? 'consistent' : 'money lost or created', cls = total === 700 ? 'ok' : 'bad';
    if (inDoubt) { result = 'in doubt: locks held until recovery'; cls = 'bad'; }
    verdict.update([
      { l: 'Total money (should be 700)', v: total, cls: total === 700 ? 'ok' : (inDoubt ? '' : 'bad') },
      { l: 'Locks held', v: [st.A, st.B].filter(x => x.locked).length, cls: inDoubt ? 'bad' : '' },
      { l: 'Result', v: result, cls }
    ]);
  }

  const pl = player({
    speed: 800,
    step() { if (cur >= STEPS[mode].length) return false; cur++; draw(); return cur < STEPS[mode].length; },
    reset() { cur = 0; recovered = false; draw(); }
  });
  const crashSl = slider('Coordinator crashes after step (8 = never)', 0, 8, crashAfter, 1, v => { crashAfter = v; recovered = false; draw(); });
  const modeSeg = seg([{ v: '2pc', l: 'Two-phase commit' }, { v: 'naive', l: 'Naive: commit each database separately' }], mode, v => { mode = v; cur = 0; recovered = false; pl.stop(); draw(); });

  root.append(
    bar(modeSeg), crashSl, pl,
    bar(btn('Recover coordinator', () => { recovered = true; draw(); }), btn('Finish all steps', () => { pl.stop(); cur = STEPS[mode].length; draw(); })),
    board, verdict, logBox.el,
    note('Illustrative: balances start at A = 500 and B = 200. Crash the coordinator after the prepare votes and press Recover: the locks are released and nothing moves. Crash it after the decision is logged and Recover resends COMMIT. In the naive mode, a crash between the two calls destroys money, and nothing can repair it.')
  );
  draw();
};

PG.d12 = function (root, A) {
  const { h, svg, bar, btn, seg, player, stat, note } = A;
  const SPLITS = {
    balanced: [['home', 'product', 'home', 'cart'], ['product', 'home', 'search', 'home'], ['home', 'cart', 'product', 'home', 'home']],
    hot: [['home', 'home', 'home', 'product'], ['home', 'home', 'home', 'cart'], ['home', 'home', 'product', 'home']]
  };
  const REDUCER = { home: 0, search: 0, cart: 1, product: 1 };      // hash partitioning, decided up front
  let data = 'balanced', crashOn = false, step = 0;

  // the sequence of events the job goes through; a crash inserts a discard and a full re-run of mapper 2
  function events() {
    const ev = [];
    SPLITS[data].forEach((recs, m) => {
      if (crashOn && m === 1) {
        recs.slice(0, 2).forEach(key => ev.push({ type: 'emit', m, key }));
        ev.push({ type: 'crash', m });
        recs.forEach(key => ev.push({ type: 'emit', m, key, rerun: true }));
      } else recs.forEach(key => ev.push({ type: 'emit', m, key }));
    });
    ev.push({ type: 'shuffle' }, { type: 'reduce' });
    return ev;
  }

  // state after the first k events
  function stateAt(k) {
    const ev = events().slice(0, k);
    const chips = [], st = { shuffle: false, reduce: false, crashed: null, reruns: 0 };
    ev.forEach(e => {
      if (e.type === 'emit') chips.push({ m: e.m, key: e.key, rerun: !!e.rerun });
      if (e.type === 'crash') { st.crashed = e.m; for (let i = chips.length - 1; i >= 0; i--) if (chips[i].m === e.m) chips.splice(i, 1); }
      if (e.type === 'shuffle') st.shuffle = true;
      if (e.type === 'reduce') st.reduce = true;
      if (e.rerun) st.reruns++;
    });
    return { chips, st };
  }
  // the answer a clean, failure-free run gives for the selected data
  const expectedFor = d => { const e = {}; SPLITS[d].flat().forEach(k => { e[k] = (e[k] || 0) + 1; }); return e; };

  const board = h('div', { class: 'dsim' });
  const verdict = stat([]);

  function draw() {
    const total = events().length;
    const { chips, st } = stateAt(step);
    const s = svg('svg', { viewBox: '0 0 640 250', role: 'img', 'aria-label': 'Map, shuffle and reduce at step ' + step, style: 'width:100%;height:auto;display:block' });
    // mappers
    SPLITS[data].forEach((recs, m) => {
      const x = 10 + m * 212;
      s.append(svg('rect', { x, y: 10, width: 200, height: 96, rx: 10, fill: st.crashed === m ? 'var(--p7)' : 'var(--card)', stroke: 'var(--line)', 'stroke-width': 1.5 }));
      s.append(svg('text', { x: x + 8, y: 26, 'font-size': 12, 'font-weight': 700, fill: 'var(--ink)' }, 'mapper ' + (m + 1) + (st.crashed === m ? ' · crashed, output discarded' : '')));
      const mine = chips.filter(c => c.m === m);
      mine.forEach((c, i) => {
        const cx = x + 8 + (i % 6) * 32, cy = 40 + Math.floor(i / 6) * 22;
        s.append(svg('rect', { x: cx, y: cy, width: 28, height: 18, rx: 4, fill: c.rerun ? 'var(--p4)' : (c.key === 'home' ? 'var(--acc2)' : 'var(--acc)'), opacity: 0.9 }));
        s.append(svg('text', { x: cx + 14, y: cy + 13, 'text-anchor': 'middle', 'font-size': 9, fill: c.rerun ? 'var(--ink)' : 'var(--card)' }, c.key.slice(0, 4)));
      });
      s.append(svg('text', { x: x + 8, y: 100, 'font-size': 10, fill: 'var(--mut)' }, 'input: ' + recs.length + ' records' + (st.crashed === m ? ' · re-run from the start' : '')));
    });
    // shuffle
    s.append(svg('text', { x: 10, y: 134, 'font-size': 12, 'font-weight': 700, fill: 'var(--ink)' }, st.shuffle ? 'shuffle: grouped by key, sent to one reducer each' : 'shuffle: waiting for every mapper to finish'));
    // reducers
    [0, 1].forEach(r => {
      const x = 10 + r * 318;
      const keys = Object.keys(REDUCER).filter(k => REDUCER[k] === r);
      const load = chips.filter(c => REDUCER[c.key] === r).length;
      s.append(svg('rect', { x, y: 150, width: 310, height: 92, rx: 10, fill: st.reduce ? 'var(--card)' : 'var(--card)', stroke: 'var(--line)', 'stroke-width': 1.5 }));
      s.append(svg('text', { x: x + 8, y: 168, 'font-size': 12, 'font-weight': 700, fill: 'var(--ink)' }, 'reducer ' + (r + 1) + ' · ' + load + ' records to combine'));
      if (st.shuffle) {
        keys.forEach((key, i) => {
          const n = chips.filter(c => c.key === key).length;
          const bw = Math.max(4, Math.min(290, n * 14));
          s.append(svg('text', { x: x + 8, y: 190 + i * 22, 'font-size': 11, fill: 'var(--ink)' }, key));
          s.append(svg('rect', { x: x + 76, y: 180 + i * 22, width: bw, height: 14, rx: 4, fill: 'var(--acc)' }));
          s.append(svg('text', { x: x + 80 + bw, y: 191 + i * 22, 'font-size': 11, fill: 'var(--ink)' }, st.reduce ? String(n) : '…'));
        });
      }
    });
    board.replaceChildren(s);

    const counts = {};
    chips.forEach(c => { counts[c.key] = (counts[c.key] || 0) + 1; });
    const expected = expectedFor(data);
    const ok = st.reduce && Object.keys(expected).every(k => counts[k] === expected[k]);
    const loads = [0, 1].map(r => chips.filter(c => REDUCER[c.key] === r).length);
    verdict.update([
      { l: 'Output', v: st.reduce ? Object.keys(expected).map(k => k + ' ' + counts[k]).join(', ') : '…' },
      { l: 'Matches a clean run', v: st.reduce ? (ok ? 'yes ✓' : 'no ✗') : '…', cls: st.reduce ? (ok ? 'ok' : 'bad') : '' },
      { l: 'Busiest reducer', v: st.shuffle ? Math.max(...loads) + ' of ' + (loads[0] + loads[1]) : '…', cls: st.shuffle && Math.max(...loads) > (loads[0] + loads[1]) * 0.7 ? 'bad' : '' }
    ]);
    return total;
  }

  const pl = player({
    speed: 450,
    step() { const total = events().length; if (step >= total) return false; step++; draw(); return step < total; },
    reset() { step = 0; draw(); }
  });
  const dataSeg = seg([{ v: 'balanced', l: 'Balanced keys' }, { v: 'hot', l: 'One hot key (home)' }], data, v => { data = v; step = 0; pl.stop(); draw(); });
  const crashSeg = seg([{ v: false, l: 'No failures' }, { v: true, l: 'Mapper 2 crashes midway' }], crashOn, v => { crashOn = v; step = 0; pl.stop(); draw(); });

  root.append(
    bar(dataSeg), bar(crashSeg), pl,
    bar(btn('Finish', () => { pl.stop(); step = events().length; draw(); })),
    board, verdict,
    note('Illustrative: three input splits, two reducers, and a hash that sends home and search to reducer 1. Crash mapper 2 and watch its partial output get discarded, then re-run. The final counts match a clean run because map and reduce are deterministic. With the hot key, reducer 1 does most of the work, and the job waits for it.')
  );
  draw();
};

PG.d13 = function (root, A) {
  const { h, svg, bar, btn, seg, slider, player, stat, note } = A;
  const EV = [{ id: 1, v: 10 }, { id: 2, v: 5 }, { id: 3, v: -3 }, { id: 4, v: 7 }, { id: 5, v: -2 }];
  const TRUTH = EV.reduce((s, e) => s + e.v, 0);     // the right balance after every event
  let mode = 'after', idem = false, crashEv = 0;      // crashEv = event whose handling is interrupted (0 = never)
  let st;

  function fresh() { return { cOff: 0, state: 0, stateOff: 0, applied: {}, crashed: false, crashUsed: false, lines: [] }; }
  function apply(e) {
    if (idem && e.id <= st.stateOff) { st.lines.push('event ' + e.id + ' already applied, skipped'); return; }
    st.state += e.v; st.stateOff = e.id; st.applied[e.id] = (st.applied[e.id] || 0) + 1;
    st.lines.push('applied event ' + e.id + ' → state ' + st.state);
  }
  // one step of the consumer: handle the next event in the log
  function next() {
    if (st.crashed || st.cOff >= EV.length) return false;
    const e = EV[st.cOff];
    const crashHere = !st.crashUsed && e.id === crashEv;
    if (mode === 'after') {                             // process, then commit the offset
      apply(e);
      if (crashHere) return crash(e);
      st.cOff++;
    } else {                                            // commit the offset, then process
      st.cOff++;
      if (crashHere) return crash(e);
      apply(e);
    }
    return true;
  }
  function crash(e) { st.crashUsed = true; st.crashed = true; st.lines.push('consumer crashes while handling event ' + e.id); return true; }
  function restart() { if (!st.crashed) return; st.crashed = false; st.lines.push('consumer restarts from its committed offset (event ' + (EV[st.cOff] ? EV[st.cOff].id : 'end') + ')'); draw(); }
  function reset() { st = fresh(); draw(); }
  st = fresh();

  const board = h('div', { class: 'dsim' });
  const verdict = stat([]);
  const logBox = A.logbox();

  function draw() {
    const s = svg('svg', { viewBox: '0 0 640 220', role: 'img', 'aria-label': 'Event log and consumer at offset ' + st.cOff, style: 'width:100%;height:auto;display:block' });
    s.append(svg('text', { x: 10, y: 16, 'font-size': 12, 'font-weight': 700, fill: 'var(--ink)' }, 'event log (one partition, oldest on the left)'));
    EV.forEach((e, i) => {
      const x = 14 + i * 124, y = 30;
      const done = i < st.cOff;
      const times = st.applied[e.id] || 0;
      s.append(svg('rect', { x, y, width: 112, height: 42, rx: 8, fill: done ? 'var(--p2)' : 'var(--card)', stroke: 'var(--line)', 'stroke-width': 1.5 }));
      s.append(svg('text', { x: x + 56, y: y + 18, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--ink)', 'font-weight': 700 }, 'event ' + e.id + ' (' + (e.v > 0 ? '+' : '') + e.v + ')'));
      s.append(svg('text', { x: x + 56, y: y + 34, 'text-anchor': 'middle', 'font-size': 11, fill: times === 2 ? 'var(--acc2)' : times === 0 && i < st.cOff ? 'var(--acc2)' : 'var(--mut)' }, times === 0 ? (i < st.cOff ? 'never applied' : 'not yet') : times === 1 ? 'applied once' : 'applied ' + times + '×'));
    });
    // consumer offset pointer
    const px = st.cOff < EV.length ? 14 + st.cOff * 124 + 56 : 14 + (EV.length - 1) * 124 + 112;
    s.append(svg('path', { d: `M${px - 8} 84 L${px + 8} 84 L${px} 76 Z`, fill: 'var(--acc)' }));
    s.append(svg('text', { x: px, y: 98, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--acc)' }, 'committed offset ' + st.cOff));
    // consumer
    s.append(svg('rect', { x: 14, y: 120, width: 612, height: 80, rx: 12, fill: st.crashed ? 'var(--p7)' : 'var(--card)', stroke: 'var(--line)', 'stroke-width': 1.5 }));
    s.append(svg('text', { x: 28, y: 146, 'font-size': 13, 'font-weight': 700, fill: 'var(--ink)' }, 'consumer' + (st.crashed ? ' · crashed' : '')));
    s.append(svg('text', { x: 28, y: 170, 'font-size': 12, fill: 'var(--ink)' }, 'balance in the database: ' + st.state + '   (correct after all events: ' + TRUTH + ')'));
    s.append(svg('text', { x: 28, y: 190, 'font-size': 11, fill: 'var(--mut)' }, idem ? 'the database also stores the last applied event id: ' + st.stateOff : 'the database stores only the balance'));
    board.replaceChildren(s);

    const done = st.cOff >= EV.length && !st.crashed;
    const lost = EV.filter(e => (st.applied[e.id] || 0) === 0 && e.id <= st.cOff).length;
    const dup = EV.filter(e => (st.applied[e.id] || 0) > 1).length;
    const result = !done ? 'running' : lost ? 'an event was lost' : dup ? 'an event was applied twice' : 'correct';
    verdict.update([
      { l: 'Balance', v: st.state + ' (truth ' + TRUTH + ')', cls: st.state === TRUTH ? 'ok' : (done ? 'bad' : '') },
      { l: 'Events lost / duplicated', v: lost + ' / ' + dup, cls: lost + dup ? 'bad' : 'ok' },
      { l: 'Result', v: result, cls: result === 'correct' ? 'ok' : result === 'running' ? '' : 'bad' }
    ]);
    logBox.clear();
    st.lines.slice(-6).forEach(l => logBox.add(l, ''));
  }

  const pl = player({
    speed: 700,
    step() { const more = next(); draw(); return more && st.cOff < EV.length && !st.crashed; },
    reset() { reset(); }
  });
  const modeSeg = seg([{ v: 'after', l: 'Commit offset after processing' }, { v: 'before', l: 'Commit offset before processing' }], mode, v => { mode = v; reset(); pl.stop(); });
  const idemSeg = seg([{ v: false, l: 'Plain processing' }, { v: true, l: 'Idempotent (offset stored with the result)' }], idem, v => { idem = v; reset(); pl.stop(); });
  const crashSl = slider('Crash while handling event (0 = never)', 0, 5, crashEv, 1, v => { crashEv = v; reset(); pl.stop(); });

    bar(modeSeg), bar(idemSeg), crashSl,
    bar(pl, btn('Next event', () => { pl.stop(); next(); draw(); }), btn('Restart consumer', () => { pl.stop(); restart(); })),
    board, verdict, logBox.el,
    note('Illustrative: five events with amounts +10, +5, −3, +7 and −2, so the correct balance is 17. Crash the consumer while it handles event 3 and restart it. Commit-after with plain processing duplicates an event; commit-before loses one; idempotent processing fixes the duplicate but cannot recover an event that was never processed.')
  );
  draw();
};

<script>

function vizPane(v) {
