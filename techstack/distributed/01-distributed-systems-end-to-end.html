    (v.rows || []).map(r => h('div', { class: 'vrow' }, h('span', { class: 'vl' }, r.l), h('div', { class: 'vcells' }, r.cells.map(c => h('div', { class: 'vc ' + (c[1] || ''), style: 'flex:' + (c[2] || 1) }, c[0]))))),
    (v.bars || []).map(b => h('div', { class: 'vrow' }, h('span', { class: 'vl' }, b[0]), h('div', { class: 'vbar' }, h('div', { class: 'vtrack' }, h('i', { class: b[2] || '', style: 'width:' + Math.max(1.5, b[1]) + '%' })), h('span', { class: 'vt' }, b[3])))),
    v.cap ? h('p', { class: 'note' }, v.cap) : null);
}
/* ---- sequence animation: a common problem is shown as actors over time, one message or event per step ---- */
function seqViz(sc) {
  const acts = sc.actors.map(a => ({ id: a[0], n: a[1], s: a[2] || [] }));
  const ix = id => acts.findIndex(a => a.id === id);
  const N = acts.length, R = sc.steps.length;
  const X = i => (N === 1 ? 320 : 100 + i * (440 / (N - 1)));       // lifeline x positions
  const BW = Math.min(150, 440 / Math.max(1, N - 1) - 14);            // actor box width
  const ROW0 = 140, RH = 34, H = ROW0 + R * RH + 14;
  let k = 0, prog = 1, auto = null, token = 0;
  const box = h('div', { class: 'seqviz' });
  const view = h('div', {});
  const cap = h('p', { class: 'seqcap', 'aria-live': 'polite' });
  // what an actor box shows: its latest state set by a step that has already happened
  const linesAt = id => { let v = acts[ix(id)].s; for (let j = 0; j < k; j++) { const st = sc.steps[j]; if (st.set && st.set[id]) v = st.set[id]; } return v; };
  function draw() {
    const s = svg('svg', { viewBox: '0 0 640 ' + H, role: 'img', 'aria-label': sc.title, style: 'width:100%;height:auto;display:block' });
    acts.forEach((a, i) => {
      const x = X(i);
      s.append(svg('line', { x1: x, y1: 126, x2: x, y2: H - 6, stroke: 'var(--line)', 'stroke-width': 1.5, 'stroke-dasharray': '4 4' }));
      s.append(svg('rect', { x: x - BW / 2, y: 6, width: BW, height: 112, rx: 10, fill: 'var(--card)', stroke: 'var(--line)', 'stroke-width': 1.5 }));
      s.append(svg('text', { x, y: 23, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 700, fill: 'var(--ink)' }, a.n));
      linesAt(a.id).slice(0, 5).forEach((ln, j) => {
        const bad = ln.charAt(0) === '!';
        const txt = bad ? ln.slice(1) : ln;
        const fs = Math.max(8, Math.min(10.5, (BW - 14) / (txt.length * 0.62)));   // shrink long state lines to fit the box
        s.append(svg('text', { x: x - BW / 2 + 7, y: 42 + j * 15, 'font-size': fs, fill: bad ? 'var(--acc2)' : 'var(--ink)', 'font-weight': bad ? 700 : 400 }, txt));
      });
    });
    sc.steps.forEach((st, r) => {
      if (r >= k) return;
      const y = ROW0 + r * RH + RH / 2, p = r === k - 1 ? prog : 1;
      const col = st.k === 'bad' ? 'var(--acc2)' : st.k === 'ok' ? 'var(--acc)' : 'var(--mut)';
      if (st.m && st.m[0] === st.m[1]) {                          // a message to itself is a local event
        const x = X(ix(st.m[0]));
        s.append(svg('circle', { cx: x, cy: y, r: 5, fill: col }));
        const right = x > 470;
        s.append(svg('text', { x: right ? x - 12 : x + 12, y: y + 4, 'text-anchor': right ? 'end' : 'start', 'font-size': 11, fill: col, 'font-weight': 600 }, st.m[2]));
      } else if (st.m) {
        const x1 = X(ix(st.m[0])), x2 = X(ix(st.m[1]));
        const end = st.lost ? x1 + (x2 - x1) * 0.6 * p : x1 + (x2 - x1) * p;
        s.append(svg('line', { x1, y1: y, x2: end, y2: y, stroke: col, 'stroke-width': 2.2, 'stroke-dasharray': st.lost ? '5 4' : null }));
        if (p >= 1 && !st.lost) {
          const sg = Math.sign(x2 - x1);
          s.append(svg('polygon', { points: `${x2},${y} ${x2 - 8 * sg},${y - 4} ${x2 - 8 * sg},${y + 4}`, fill: col }));
        }
        if (p >= 1 && st.lost) s.append(svg('text', { x: x1 + (x2 - x1) * 0.6 + 6, y: y + 5, 'font-size': 16, 'font-weight': 700, fill: 'var(--acc2)' }, '✕'));
        s.append(svg('text', { x: (x1 + x2) / 2, y: y - 7, 'text-anchor': 'middle', 'font-size': 11, fill: col, 'font-weight': 600 }, st.m[2]));

        if (st.span) s.append(svg('rect', { x: x - 6, y: ROW0 + r * RH + 6, width: 12, height: st.span * RH - 12, rx: 5, fill: col, opacity: 0.22 }));
        s.append(svg('circle', { cx: x, cy: y, r: 5, fill: col }));
        const right = x > 470;
        s.append(svg('text', { x: right ? x - 12 : x + 12, y: y + 4, 'text-anchor': right ? 'end' : 'start', 'font-size': 11, fill: col, 'font-weight': 600 }, st.n));
      }

  }

    const tick = () => { if (my !== token) return; prog = Math.min(1, prog + 0.25); draw(); if (prog < 1) TIMERS.push(setTimeout(tick, 70)); };
    tick();
  }
  function next() {
    if (prog < 1) { prog = 1; draw(); return k < R; }
    if (k >= R) return false;
    k++; animate(); return k < R;
  }
  function stopAuto() { if (auto) clearInterval(auto); auto = null; playBtn.textContent = '▶ Play'; }
  const nextBtn = btn('Next step ›', () => { stopAuto(); next(); }, 'primary');

    TIMERS.push(auto); playBtn.textContent = '⏸ Pause';
  });
  const resetBtn = btn('⏮ Reset', () => { stopAuto(); token++; k = 0; prog = 1; draw(); });
  box.append(view, cap, bar(playBtn, nextBtn, resetBtn));

  return box;
}
