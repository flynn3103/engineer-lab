<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apache Spark · course</title>
<link rel="stylesheet" href="../../assets/lab.css">
<style>
:root{--acc:#0f9d8a;--acc2:#d6456b}
@media(prefers-color-scheme:dark){:root{--acc:#3ccfb8;--acc2:#ff7aa0}}
body{font-size:16px}
.topbar .wrap{min-height:50px}
.topbar .crumb{color:var(--mut);font-size:14px;text-decoration:none}
.topbar .crumb:hover{color:var(--ink)}
.hero{padding:34px 0 10px}
.hero .lead{max-width:60ch}
.part{margin:28px 0 10px}
.part h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 4px}
.part p{margin:0 0 12px;color:var(--mut);font-size:14.5px;max-width:64ch}
.map{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.tile{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:0;height:100%;width:100%}
.tile:hover{border-color:var(--acc);transform:translateY(-2px)}
.tile .n{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--pc);border:1px solid var(--line)}
.tile b{display:block;font-size:15px;line-height:1.3}
.tile small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;line-height:1.35}
.chhead{display:flex;gap:12px;align-items:center;margin:22px 0 4px}
.chhead .n{flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;background:var(--pc);border:1px solid var(--line)}
.chhead h1{font-size:clamp(22px,4.6vw,30px);letter-spacing:-.4px}
.chhead small{display:block;color:var(--mut);font-size:13px}
.ask{font-size:clamp(17px,2.8vw,20px);margin:8px 0 18px;max-width:62ch}
.blk{margin:0 0 16px}
.blk>h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.blk>h3 i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--on-brand,#fff);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.idea{margin:0;padding-left:20px}.idea li{margin:5px 0}
.pg{display:grid;gap:12px}
.pgwhy{margin:0;color:var(--mut);font-size:14px}
.cp{display:grid;gap:10px}
@media(min-width:760px){.cp{grid-template-columns:repeat(3,1fr)}}
.cp>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.cp b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.cp .s b{color:var(--bad)}.cp .c b{color:var(--warn)}.cp .f b{color:var(--ok)}
.cp p{margin:0;font-size:14.5px}
.quiz .q{font-weight:600;margin:0 0 8px}
.quiz .opts{display:grid;gap:6px}
.quiz .opts button{text-align:left;min-height:0;padding:9px 12px}
.quiz .opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.quiz .opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.quiz .why{margin-top:8px}
.pn{display:flex;justify-content:space-between;gap:8px;margin:22px 0 40px}
.pn button{max-width:48%;text-align:left}
.pn button:last-child{margin-left:auto;text-align:right}
/* ---- playground kit ---- */
.pgbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.pgbox .bar{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;min-height:36px;padding:6px 12px;font-size:13.5px;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:var(--on-brand,#fff);font-weight:600}
.sl{display:inline-flex;align-items:center;gap:8px;flex-wrap:nowrap}
.sl input{width:130px}.sl b{color:var(--ink);font-weight:600;min-width:2ch;font-variant-numeric:tabular-nums}
.out{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;min-width:0}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.badge.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.badge.info{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line));background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.log{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card)}
.log div{padding:1px 0;border-bottom:1px dashed var(--line)}.log div:last-child{border:0}
.log .bad{color:var(--bad)}.log .ok{color:var(--ok)}.log .mut{color:var(--mut)}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat>div{border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--card);min-width:84px}
.stat small{display:block;color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat .bad b{color:var(--bad)}.stat .ok b{color:var(--ok)}
.svgw{overflow-x:auto;overscroll-behavior-x:contain}.svgw svg{display:block;max-width:100%}
.cols{display:grid;gap:12px}
@media(min-width:760px){.cols.two{grid-template-columns:1fr 1fr}.cols.three{grid-template-columns:repeat(3,1fr)}}
.cols>*{min-width:0}
@media(max-width:560px){.chhead{margin-top:14px}}
.prob{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc2);border-radius:12px;padding:12px 16px;margin:0 0 6px}
.prob p{margin:0 0 .5em}.scene p:last-child{margin:0}
.prob .q{font-weight:700;font-size:clamp(17px,2.6vw,19px)}
.arch{margin:0}.arch figcaption{text-align:center}
.arch svg{overflow:visible}
.common{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.common>div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);display:grid;gap:5px;align-content:start}
.common h4{font-size:15px;line-height:1.3;margin:0}.common h4 i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;margin-right:6px;vertical-align:1px}
.common p{margin:0;font-size:14px}
.common b{font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-right:6px}
.common .e b{color:var(--acc2)}.common .c b{color:var(--warn)}.common .f b{color:var(--ok)}
.sw{display:flex;gap:6px;margin-left:auto}
.sw a{font-size:13px;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}
.sw a:hover{color:var(--ink);border-color:var(--acc)}.sw a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.ctabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.ctab{border-radius:999px;font-size:14px;padding:7px 14px;min-height:0}
.ctab.on{color:var(--ink);background:color-mix(in srgb,var(--acc2) 14%,var(--card));border-color:var(--acc2);font-weight:700}
.cbody{display:grid;gap:12px}
.ctitle{font-size:clamp(20px,3.6vw,26px);letter-spacing:-.3px;margin:4px 0 0}
.csym{font-size:clamp(16px,2.4vw,18.5px);margin:0}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.ccard h5{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 6px}
.ccard h5:not(:first-child){margin-top:12px}
.ccard p{margin:0 0 .5em;font-size:15px}.ccard .seen b{color:var(--acc2);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.ccard pre{font-size:12.5px}
.vizc{background:var(--soft)}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.vrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin:6px 0}
@media(max-width:620px){.vrow{grid-template-columns:1fr;gap:4px}}
.vl{font-size:13px;color:var(--mut)}
.vcells{display:flex;gap:6px;min-width:0}
.vc{flex:1 1 0;min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;font-size:12.5px;background:var(--card);overflow-wrap:anywhere}
.vc.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.vc.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--card))}
.vc.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,var(--card))}
.vc.off{border-style:dashed;color:var(--mut);background:transparent}
.vbar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
@media(max-width:620px){.vbar{grid-template-columns:1fr}}
.vtrack{height:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vtrack i{display:block;height:100%;border-radius:8px;transition:width .35s}
.vtrack i.bad{background:var(--bad)}.vtrack i.ok{background:var(--ok)}.vtrack i.warn{background:var(--warn)}
.vt{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.fixes{margin:0;padding-left:22px}.fixes li{margin:4px 0}.fixes li::marker{color:var(--acc2);font-weight:700}
.course-custom{display:grid;gap:18px;margin-bottom:22px}
/* chapter 2 · buffer pool playground and architecture animation */
section.blk .prob p{font-size:15px;line-height:1.55}
.arch-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 8px}
.ar-box rect{fill:var(--card);stroke:var(--line);stroke-width:1.5;transition:opacity .3s,stroke .3s}
.ar-box.on rect{stroke:var(--acc);stroke-width:3}
.ar-box.off{opacity:.35}
.ar-box{transition:opacity .3s}
.ar-title{font-size:13px;font-weight:700;fill:var(--ink);font-family:system-ui,sans-serif}
.ar-sub{font-size:11px;fill:var(--mut);font-family:ui-monospace,monospace}
.ar-arrow line{stroke:var(--mut);stroke-width:1.6;fill:none;color:var(--mut);transition:opacity .3s}
.ar-arrow.on line{stroke:var(--acc2);stroke-width:3;color:var(--acc2)}
.ar-arrow:not(.on) line{opacity:.45}
.ar-lab{font-size:11px;fill:var(--mut);font-family:ui-monospace,monospace}
.ar-arrow.on .ar-lab{fill:var(--acc2);font-weight:700}
.ar-dot{fill:var(--acc2);stroke:var(--card);stroke-width:2}
.ar-step{margin-top:8px;border-left:4px solid var(--acc);background:var(--soft);border-radius:0 10px 10px 0;padding:10px 12px}
.ar-count{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.ar-text{margin:4px 0 0;font-size:15px;color:var(--ink)}
.ar-box{cursor:pointer;outline:none}
.ar-box:focus-visible rect{stroke:var(--acc);stroke-width:3}
.ar-box.picked rect{stroke:var(--acc2);stroke-width:3}
.ar-hint{margin:0;font-size:14px;color:var(--mut)}
.split{display:grid;gap:14px;align-items:start}
.split-l,.split-r{min-width:0}
.split-r{display:grid;gap:10px;align-content:start}
@media(min-width:760px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}}

.ar-comp{display:grid;gap:8px;margin-top:10px}
.ar-state{display:grid;gap:8px;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.ar-pt{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.ar-lookup{font-weight:700;font-size:14px}
.ar-lookup.hit{color:var(--ok)}.ar-lookup.miss{color:var(--bad)}
.ar-frs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ar-fr{border:1.5px solid var(--line);border-radius:10px;padding:6px;background:var(--card);display:grid;gap:2px;font-size:12px;color:var(--mut)}
.ar-fr b{font-size:14px;color:var(--ink)}
.ar-fr.pinned{border-color:var(--acc)}
.ar-fr.dirty{box-shadow:inset 0 -4px 0 var(--bad)}
.ar-legend{font-size:12.5px;color:var(--mut);margin:0}
@media(max-width:620px){.ar-frs{grid-template-columns:repeat(2,1fr)}}
.sm{display:grid;gap:10px}
.sm-frames{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sm-fr{border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;background:var(--card);display:grid;gap:2px;text-align:center;min-height:66px;align-content:center}
.sm-fr small{font-size:11px;color:var(--mut)}
.sm-fr b{font-size:15px;color:var(--ink)}
.sm-fr.pinned{border-color:var(--acc)}
.sm-fr.dirty{box-shadow:inset 0 -4px 0 var(--bad)}
.sm-ops{display:flex;flex-wrap:wrap;gap:5px}
.sm-op{font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:7px;padding:3px 7px;color:var(--mut)}
.sm-op.done.hit{color:var(--ok);border-color:var(--ok)}
.sm-op.done.miss{color:var(--bad);border-color:var(--bad)}
.sm-op.now{outline:2px solid var(--acc);outline-offset:2px;color:var(--ink)}
.sm-op.leak{border-style:dashed}
.sm-msg{margin:0;font-size:14.5px;color:var(--ink);min-height:3em}
.sm-cnt{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums;border-top:1px dashed var(--line);padding-top:6px}
@media(max-width:620px){.sm-frames{grid-template-columns:repeat(2,1fr)}}
.ar-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ar-card b{font-size:13px;color:var(--acc)}
.ar-card p{margin:2px 0 0;font-size:14px;color:var(--ink)}
/* spark course · tech CSS (prefix spk-) */
.spk-strip{position:relative;padding:6px 0}
.spk-row{display:flex;height:30px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--soft)}
.spk-ln{flex:none;min-width:1px;border-right:1px solid var(--bg);box-sizing:border-box}
.spk-ln.x{background-image:repeating-linear-gradient(45deg,transparent 0 4px,var(--bad) 4px 6px)}
.spk-cut{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.75}
.spk-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--mut)}
.spk-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.spk-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.spk-chip{border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12.5px;background:var(--card);font-variant-numeric:tabular-nums}
.spk-chip.ok{border-color:var(--ok)}
.spk-chip.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.spk-chip.tmp{color:var(--mut);border-style:dashed}
.spk-chip.on{background:color-mix(in srgb,var(--acc) 16%,var(--card));border-color:var(--acc)}
.spk-cells{display:flex;flex-wrap:wrap;gap:6px}
.spk-cell{width:40px;height:40px;border:1.5px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:12px;background:var(--card);font-variant-numeric:tabular-nums}
.spk-cell.cur{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 30%,transparent)}
.spk-cell.drop{color:var(--mut);border-style:dashed;text-decoration:line-through}
.spk-cell.pass{background:color-mix(in srgb,var(--p1) 70%,var(--card))}
.spk-cell.map{background:color-mix(in srgb,var(--ok) 25%,var(--card));border-color:var(--ok)}
.spk-tblw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.spk-tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.spk-tbl th,.spk-tbl td{padding:5px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.spk-tbl th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.spk-tbl tr.bad td{color:var(--bad)}
.spk-note{font-size:13px;color:var(--mut);margin:0}
.spk-sel{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media(max-width:620px){.spk-cell{width:30px;height:30px;font-size:11px}}
@media(prefers-reduced-motion:reduce){.spk-cell,.spk-chip,.spk-ln{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---- tiny helpers shared by the chapters and playgrounds ---- */
const PG = {};
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TIMERS = [];
function stopTimers() { while (TIMERS.length) { const t = TIMERS.pop(); clearInterval(t); clearTimeout(t); } }
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  const add = k => { if (k == null || k === false) return; if (Array.isArray(k)) k.forEach(add); else el.append(k.nodeType ? k : document.createTextNode(String(k))); };
  kids.forEach(add);
  return el;
}
function svg(tag, props, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in (props || {})) { const v = props[k]; if (v == null || v === false) continue; if (k === 'class') el.setAttribute('class', v); else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v); else el.setAttribute(k, v); }
  const add = k => { if (k == null || k === false) return; if (Array.isArray(k)) k.forEach(add); else el.append(k.nodeType ? k : document.createTextNode(String(k))); };
  kids.forEach(add);
  return el;
}
/* seeded random numbers, so every run of a playground repeats */
function rng(seed) { let a = (seed >>> 0) || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const bar = (...k) => h('div', { class: 'bar' }, ...k);
const btn = (label, fn, cls) => h('button', { class: cls || '', onclick: fn }, label);
const badge = (text, kind) => h('span', { class: 'badge ' + (kind || '') }, text);
const note = t => h('p', { class: 'note' }, t);
function seg(opts, val, cb) {          // opts: [{v,l}] or [v]; returns element with .value and .set(v)
  const el = h('div', { class: 'seg', role: 'group' });
  const norm = opts.map(o => (typeof o === 'object' ? o : { v: o, l: String(o) }));
  const paint = () => [...el.children].forEach((b, i) => b.classList.toggle('on', norm[i].v === el.value));
  norm.forEach(o => el.append(h('button', { onclick() { el.value = o.v; paint(); cb && cb(o.v); } }, o.l)));
  el.value = val; el.set = v => { el.value = v; paint(); }; paint(); return el;
}
function slider(label, min, max, val, step, cb, fmt) {   // returns <label> with .input and .value
  const out = h('b', {}, fmt ? fmt(val) : val);
  const input = h('input', { type: 'range', min, max, step: step || 1, value: val, 'aria-label': label });
  input.addEventListener('input', () => { out.textContent = fmt ? fmt(+input.value) : input.value; cb && cb(+input.value); });
  const el = h('label', { class: 'sl' }, label, input, out);
  Object.defineProperty(el, 'value', { get: () => +input.value, set: v => { input.value = v; out.textContent = fmt ? fmt(+v) : v; } });
  return el;
}
function player(o) {   // o.step() -> false when finished, o.reset(), o.speed ms per tick. returns element with .stop()
  let t = null;

  const edge = (a, t) => { const cx = a.x + a.w / 2, cy = a.y + a.h / 2, dx = t.x + t.w / 2 - cx, dy = t.y + t.h / 2 - cy; const k = Math.min(dx ? (a.w / 2) / Math.abs(dx) : 1e9, dy ? (a.h / 2) / Math.abs(dy) : 1e9); return [cx + dx * k, cy + dy * k]; };
  (sp.arrows || []).forEach(([f, t, lab, dash]) => {
    const [x1, y1] = edge(B[f], B[t]), [x2, y2] = edge(B[t], B[f]);
    s.append(svg('line', { x1, y1, x2, y2, stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-dasharray': dash ? '5 4' : null, 'marker-end': 'url(#ah)', style: 'color:var(--mut)' }));
    if (lab) s.append(svg('text', { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 5, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--mut)' }, lab));
  });
  sp.boxes.forEach(([id, x, y, w, hh, lab, tone]) => {
    s.append(svg('rect', { x, y, width: w, height: hh, rx: 9, fill: tone == null ? 'var(--card)' : 'var(--p' + tone + ')', stroke: 'var(--line)', 'stroke-width': 1.5 }));
    const ls = String(lab).split('\n'), y0 = y + hh / 2 - (ls.length - 1) * 8 + 4;
    ls.forEach((l, i) => s.append(svg('text', { x: x + w / 2, y: y0 + i * 16, 'text-anchor': 'middle', 'font-size': 12.5, fill: 'var(--ink)', 'font-weight': i === 0 && ls.length > 1 ? 700 : 400 }, l)));
  });

/* a left-to-right chain of boxes for the architecture picture */
function chain(items, cap) {
  const n = items.length, gap = 30, bw = Math.floor((620 - gap * (n - 1)) / n), boxes = [], arrows = [];
  items.forEach((it, i) => { boxes.push(['b' + i, 10 + i * (bw + gap), 40, bw, 76, it[0], it[1]]); if (i) arrows.push(['b' + (i - 1), 'b' + i, '']); });

}

{ ask: 'Each step of the task only filters and maps, so why does a task holding one 128 MB partition run out of memory?',
  why: 'A task processes a whole partition; if every step builds its own full list, memory is multiplied by the number of steps.',
  principle: 'Stream records through the whole chain and keep only one in flight.',
  design: 'Narrow functions compose into one pull-based iterator chain, and whole-stage codegen fuses DataFrame operators into one loop.',
  scene: ['A task has a 128 MB partition and three narrow steps: parse, filter, enrich. Nothing shuffles, nothing is cached, and the executors were sized for it.',
    'Yet one stage fails with out-of-memory errors in tasks, and the same code on a different team’s cluster is fine. The only difference is a recent change to the enrich step.'],
  predict: { q: 'A partition has 8 rows and the filter drops 5 of them. How many times does the following map function run?',
    opts: ['8, once per input row', '3, only for the rows that passed', '5, for the rows the filter dropped'], ans: 1,
    why: 'Each row is pulled through filter then map one at a time. A dropped row never reaches map, so map runs 3 times and no intermediate list is built.' },
  idea: ['<b>Iterator chaining</b>: an RDD’s <code>compute</code> returns an iterator over its parent’s iterator, so <code>map</code> and <code>filter</code> add wrappers, not copies.',
    '<b>One pass</b>: the task calls <code>next()</code> on the last iterator; the call pulls one row through every step before the next row is read.',
    '<b>Whole-stage codegen</b> fuses the operators of a DataFrame stage into one generated Java loop, removing per-row virtual calls.',
    '<b>Closures</b> are serialised on the driver and shipped to executors with the task, so they must be serialisable and small.',
    '<b>Memory breaks the chain</b> only where code materialises: <code>toList</code>, collecting into a buffer, or a shuffle.'],
  arch: chain([['Input\niterator', 0], ['filter\nnext()', 1], ['map\nnext()', 2], ['Output\nconsumer', 3]], 'The consumer pulls from the right. A row moves through filter then map before the next row is read.'),
  pg: 'pipeline',
  common: [
    { tab: 'Setup per row', t: 'Expensive setup runs once per row', sym: 'The job is slow, the database shows thousands of connections, and CPU is idle in the tasks.',
      ctx: 'A <code>map</code> opens a database connection for each order to look up a city (illustrative).',
      why: 'The function body runs for every row. A connection opened inside it is opened 40 million times per partition (illustrative).',
      log: { text: '-- representative output, values illustrative\nDB: max_connections reached (500)\nTask 12: 3,400 rows/s (expected 90,000 rows/s)',
        note: 'Throughput far below CPU capacity with an external system under load points to per-row setup. ' + SRC('rdd-programming-guide.html', 'RDD programming guide: passing functions and mapPartitions') },
      viz: { bad: { rows: [R('map', C('connect', 'bad', 1), C('lookup', 'ok', 1), C('close', 'bad', 1), C('× every row', 'warn', 2))], cap: 'Illustrative.' },
        good: { rows: [R('mapPartitions', C('connect once', 'ok', 1), C('lookup × all rows', 'ok', 3), C('close once', 'ok', 1))], cap: 'Illustrative.' } },
      fix: ['Measure first: count connections opened per task against rows per task.', 'Fix: use <code>mapPartitions</code> and open one connection per partition, closing it when the iterator ends.', 'Fix: or load the lookup table as a broadcast value or join it, instead of calling out per row.', 'Verify: connections equal partitions in flight and throughput rises.'] },
    { tab: 'toList in partition', t: 'mapPartitions materialises the whole partition', sym: 'Tasks run out of heap although the partition size is normal.',
      ctx: 'A <code>mapPartitions</code> body starts with <code>iter.toList</code> to "make it easier to loop" (illustrative).',
      why: '<code>toList</code> reads the entire partition into memory at once, which turns a streaming pipeline into a materialised one.',
      log: { text: '-- representative output, wording varies by version\njava.lang.OutOfMemoryError: Java heap space\n\tat scala.collection.immutable.List.$colon$colon(List.scala)\n\tat com.example.Enrich$.apply(Enrich.scala:18)',
        note: 'A stack trace through collection building inside your function is the clue. ' + SRC('tuning.html', 'Tuning Spark: memory management') },
      viz: { bad: { bars: [['rows held', 100, 'bad', 'whole partition']], cap: 'Illustrative.' }, good: { bars: [['rows held', 2, 'ok', 'one row']], cap: 'Illustrative.' } },
      fix: ['Measure first: find the allocation site in the heap-error stack trace.', 'Fix: keep the iterator lazy with <code>iter.map(...)</code> or <code>iter.filter(...)</code> and return an iterator.', 'Fix: if you must batch, use <code>iter.grouped(n)</code> with a bounded n.', 'Verify: peak memory stays flat as partition size grows.'] },
    { tab: 'Python UDF', t: 'Row-at-a-time Python UDF overhead', sym: 'A simple Python function makes the stage several times slower than the same logic in SQL.',
      ctx: 'A PySpark job applies a plain Python UDF to every order row (illustrative).',
      why: 'Each row is serialised from the JVM to a Python worker and back. The cost is per row, not per useful computation.',
      log: { text: '-- representative output, values illustrative\nStage 3: 20,000 tasks, median 4.2 min (SQL equivalent: 40 s)\nPython worker CPU high, JVM CPU low',
        note: 'High Python worker CPU with low JVM CPU shows the serialisation boundary. ' + SRC('sql-pyspark-pandas-with-arrow.html', 'PySpark: Apache Arrow and pandas UDFs') },
      viz: { bad: { rows: [R('Per row', C('JVM → pickle → Python → pickle → JVM', 'bad', 4))], cap: 'Illustrative.' }, good: { rows: [R('Per batch', C('Arrow batch → pandas_udf → Arrow batch', 'ok', 4))], cap: 'Illustrative.' } },
      fix: ['Measure first: compare stage time against a built-in function version on a sample.', 'Fix: prefer built-in functions; they run inside the JVM and codegen.', 'Fix: otherwise use a <code>pandas_udf</code> and enable <code>spark.sql.execution.arrow.pyspark.enabled</code> to move data in Arrow batches.', 'Verify: stage time drops and Python worker CPU falls.'] }
  ] },

  scene: ['The report joins 2 TB of orders to a 5 MB city table filtered to active cities (illustrative). The plan in the SQL tab shows <code>SortMergeJoin</code> with an exchange on both sides.',

    why: 'The planner decides from size <b>estimates</b>. An estimate of 4 GB is above the 10 MB default of <code>spark.sql.autoBroadcastJoinThreshold</code>, so it picks sort-merge unless a hint overrides it.' },
  idea: ['<b>BroadcastHashJoin</b> collects the small side on the driver, ships it to all executors, and joins with no shuffle of the big side.',
    '<b>SortMergeJoin</b> shuffles both sides by the join key, sorts, and merges; it scales to big × big.',

    '<b>Decision</b>: size estimate versus <code>spark.sql.autoBroadcastJoinThreshold</code> (10 MB default), statistics from <code>ANALYZE TABLE ... COMPUTE STATISTICS</code>, and hints <code>BROADCAST</code>, <code>MERGE</code>, <code>SHUFFLE_HASH</code>.',

{ ask: 'The nightly job now logs huge Spill (Disk) numbers and then OutOfMemoryError. How much memory does one task really get?',
  why: 'Several tasks share one executor’s memory, and partition size may exceed a task’s share.',
  principle: 'Memory per task is the pool divided by concurrent tasks; make data per task fit it.',
  design: 'A unified pool of (heap − 300 MB) × fraction is shared by all cores; the rest of the container is overhead.',
  scene: ['Executors have 16 GB and 4 cores (illustrative). After an input growth the shuffle partitions are about 2 GB each. The stage page shows huge Spill (Memory) and Spill (Disk), then tasks start failing with <code>java.lang.OutOfMemoryError</code>.',
    'A teammate proposes doubling <code>spark.executor.cores</code> to "use the machine better" without changing memory.'],
  predict: { q: 'Doubling <code>spark.executor.cores</code> with the same executor memory. What happens to the execution memory available per task?',
    opts: ['It stays the same', 'It halves, because tasks share the same pool', 'It doubles, because there are more cores'], ans: 1,
    why: 'The unified pool is per executor. With twice the concurrent tasks each one has on average half as much, so partitions that fit before can now spill or fail.' },
  idea: ['<b>Unified memory</b>: <code>(heap − 300 MB reserved) × spark.memory.fraction</code> (0.6 by default) is shared by execution (shuffles, sorts, joins) and storage (cache).',
    '<b>Storage fraction</b>: <code>spark.memory.storageFraction</code> (0.5) is the part of the pool protected from execution eviction; execution can borrow unused storage.',
    '<b>Per-task share</b>: with N concurrent tasks each gets roughly between 1/(2N) and 1/N of the pool, so cores and memory must be sized together.',
    '<b>Spill</b>: when a task’s data exceeds its share, it spills to disk; this is correct but slow, and a very large spill ends in OOM.',
    '<b>Overhead</b>: <code>spark.executor.memoryOverhead</code> (the larger of 384 MiB and 10% of executor memory by default) covers off-heap, native and Python memory, and counts towards the container limit.'],
  arch: { w: 640, h: 220, cap: 'The JVM heap holds the unified pool; overhead lives outside the heap but inside the container.',
    boxes: [['hp', 10, 20, 180, 70, 'Executor heap\nspark.executor.memory', 0], ['rs', 10, 120, 180, 60, 'Reserved\n300 MB', 5], ['up', 240, 20, 190, 70, 'Unified pool\n× memory.fraction', 1], ['ex', 480, 20, 150, 60, 'Execution\n÷ concurrent tasks', 2], ['sp', 480, 120, 150, 60, 'Spill to disk\nslow, safe', 3], ['ov', 240, 120, 190, 60, 'Overhead\noff-heap · Python', 4]],
    arrows: [['hp', 'rs', ''], ['hp', 'up', ''], ['up', 'ex', ''], ['ex', 'sp', 'too big']] },
  pg: 'memory',
  common: [
    { tab: 'Big partitions', t: 'Large partitions lead to spill and OOM', sym: 'The Stage page shows Spill (Disk) in the tens of GB per task, then tasks fail.',
      ctx: '2 TB over 1,000 partitions on 16 GB, 4-core executors (illustrative).',
      why: 'A task with 2 GB of input wants several GB for sorting or aggregating. Its share of the pool is smaller, so it spills heavily or runs out of memory.',
      log: { text: '-- representative output, values illustrative\nStage 5: Spill (Memory) 31 GiB, Spill (Disk) 6.2 GiB for task 211\nTask 211 failed: java.lang.OutOfMemoryError: Java heap space',
        note: 'Spill columns are in the stage task summary. ' + SRC('tuning.html', 'Tuning Spark: memory management overview') },
      viz: { bad: { bars: [['task data', 100, 'bad', '2 GB'], ['task share', 38, 'warn', '2.4 GB pool ÷ 4']], cap: 'Illustrative.' }, good: { bars: [['task data', 6, 'ok', '128 MB'], ['task share', 38, 'ok', '2.4 GB pool ÷ 4']], cap: 'Illustrative.' } },
      fix: ['Measure first: read Spill (Disk) and the task input size in the stage page.', 'Fix: more partitions (smaller per task), or fewer cores per executor, or more memory.', 'Fix: avoid caching so much that execution cannot borrow memory.', 'Verify: spill falls to near zero and tasks stop failing.'] },
    { tab: 'Container killed', t: 'The container is killed for exceeding memory limits', sym: 'Executors vanish with exit code 137 or an <code>OOMKilled</code> status, with no Java OutOfMemoryError.',
      ctx: 'A PySpark job runs Python workers next to the JVM on Kubernetes (illustrative).',
      why: 'The container limit counts heap plus overhead, including Python and native memory. The JVM heap is fine; the process is killed from outside.',
      log: { text: '-- representative output, wording varies by version\nExecutorLostFailure (executor 9 exited caused by one of the running tasks) Reason: Container killed by YARN for exceeding memory limits. 16.5 GB of 16 GB physical memory used. Consider boosting spark.executor.memoryOverhead.\n(Kubernetes: lastState.terminated.reason=OOMKilled, exitCode=137)',
        note: 'No Java OOM stack trace plus a container kill indicates memory outside the heap. ' + SRC('configuration.html', 'Configuration: spark.executor.memoryOverhead') },
      viz: { bad: { bars: [['heap', 70, 'ok', 'fine'], ['overhead used', 120, 'bad', 'over limit']], cap: 'Illustrative.' }, good: { bars: [['heap', 70, 'ok', 'fine'], ['overhead used', 60, 'ok', 'within raised limit']], cap: 'Illustrative.' } },
      fix: ['Measure first: confirm exit code 137 or the container-kill message, and whether Python or off-heap use is large.', 'Fix: raise <code>spark.executor.memoryOverhead</code>.', 'Fix: use fewer cores per executor so fewer Python workers share the overhead.', 'Verify: no more container kills over a full run.'] },
    { tab: 'GC pauses', t: 'Long GC pauses in a huge heap shared by many cores', sym: 'The Executors tab shows GC Time as a big share of task time.',
      ctx: 'One executor with 64 GB and 16 cores (illustrative), after "bigger is better".',
      why: 'A large heap with many threads allocating at once has long garbage-collection pauses, which stall all tasks.',
      log: { text: '-- representative output, values illustrative\nExecutors tab: executor 4  Task Time (GC Time)  41 min (17 min)',
        note: 'GC time above roughly 10% of task time is usually worth attention. ' + SRC('tuning.html', 'Tuning Spark: garbage collection tuning') },
      viz: { bad: { rows: [R('Task time', C('compute', 'ok', 3), C('GC 40%', 'bad', 2))], cap: 'Illustrative.' }, good: { rows: [R('Task time', C('compute', 'ok', 8), C('GC 5%', 'ok', 1))], cap: 'Illustrative.' } },
      fix: ['Measure first: read GC Time against Task Time in the Executors tab.', 'Fix: run smaller executors (for example fewer cores and moderate memory each) and more of them.', 'Fix: reduce object churn by selecting fewer columns and avoiding large intermediate collections.', 'Verify: GC share falls and stage times become steadier.'] }
  ] },

{ ask: 'Tasks finish in random order and some run twice. Why did yesterday’s output have duplicate rows and a half-written folder?',
  why: 'Tasks finish out of order, can run twice, and the job can die halfway, but readers must see only whole, correct output.',
  principle: 'Write privately, publish once, and let exactly one attempt win.',
  design: 'Tasks write to per-attempt temporary paths, one attempt per task is committed, and the job publishes all files at job commit.',
  scene: ['The report writes its result as files for the BI tool. Speculation was on, and a node died while the job was writing.',
    'In the morning the output folder has the same partition twice, so revenue is double for some cities, and a few files with half their rows. The BI tool had already loaded it.'],
  predict: { q: 'With a commit protocol, when can a downstream reader first see the output files?',
    opts: ['As soon as each task finishes writing', 'Only after the job commit', 'After the first task commit'], ans: 1,
    why: 'Task output goes to temporary attempt paths. Only job commit moves the winning attempts into the final location, so a reader sees all of the output or none of it.' },
  idea: ['<b>Result merge</b>: <code>count</code> and <code>collect</code> send results to the driver, which orders them by partition index, not arrival order. The total is capped by <code>spark.driver.maxResultSize</code> (1 GiB by default).',
    '<b>Task attempt</b>: each attempt writes under its own temporary path, so a retried or speculative duplicate cannot overwrite another attempt.',
    '<b>Task commit</b>: the driver authorises one attempt per task; the other attempts are aborted and their files discarded.',
    '<b>Job commit</b> publishes all committed files at once (and writes <code>_SUCCESS</code>); a job that dies before it leaves the final location untouched.',
    '<b>Object stores</b> lack an atomic rename, so the rename-based protocol is slow or unsafe there; use an object-store committer from the cloud integration module.'],
  arch: chain([['Task attempt\ntemp file', 0], ['Task commit\none attempt wins', 1], ['Job commit\npublish files', 2], ['_SUCCESS\nreaders see it', 3]], 'Output moves from temporary attempt paths to the final path only at job commit.'),
  pg: 'commit',

<script>
/* architecture: one request walks through the boxes; the strip shows the 4 buffer frames */
function archAnim(sp, steps) {
  const B = {};

  const edge = (f, t) => {
    const a = B[f], b = B[t], cx = a[1] + a[3] / 2, cy = a[2] + a[4] / 2;

    const k = Math.min(dx ? (a[3] / 2) / Math.abs(dx) : 1e9, dy ? (a[4] / 2) / Math.abs(dy) : 1e9);
    return [cx + dx * k, cy + dy * k];
  };
  const arrowEls = sp.arrows.map(([f, t, lab, dash]) => {
    const p1 = edge(f, t), p2 = edge(t, f), mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
    const horiz = Math.abs(p2[0] - p1[0]) > Math.abs(p2[1] - p1[1]);
    return svg('g', { class: 'ar-arrow' },
      svg('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], 'marker-end': 'url(#arah)', 'stroke-dasharray': dash ? '6 5' : null }),
      svg('text', { class: 'ar-lab', x: horiz ? mx : mx + 8, y: horiz ? my - 8 : my, 'text-anchor': horiz ? 'middle' : 'start' }, lab));
  });
  let picked = null;
  const boxEls = sp.boxes.map(([id, x, y, w, hh, label]) => {
    const lines = label.split('\n');
    return svg('g', { class: 'ar-box', tabindex: 0, role: 'button', 'aria-label': sp.comp[id].n, onclick: () => pick(id), onkeydown: e => { if (e.key === 'Enter') pick(id); } },
      svg('rect', { x, y, width: w, height: hh, rx: 10 }),
      lines.map((ln, i) => svg('text', { class: i ? 'ar-sub' : 'ar-title', x: x + w / 2, y: y + hh / 2 + (i - (lines.length - 1) / 2) * 16 + 4, 'text-anchor': 'middle' }, ln)));

    svg('defs', {}, svg('marker', { id: 'arah', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, svg('path', { d: 'M0 0L10 5L0 10z', fill: 'currentColor' }))),
    arrowEls, boxEls, dot);

  const text = h('p', { class: 'ar-text' }), count = h('small', { class: 'ar-count' });

    arrowEls.forEach((el, i) => el.classList.toggle('on', !!cur && cur.arrows.includes(i)));

  }

  function pick(id) {
    picked = picked === id ? null : id;

    paintComp();
  }
  function paintComp() {
    comp.replaceChildren(picked
      ? h('div', { class: 'ar-card' }, h('b', {}, sp.comp[picked].n), h('p', { html: sp.comp[picked].d }))

  }

/* ---- ch0: byte splits against line boundaries ---- */
PG.splits = function (root, A) {
  const { h, seg, slider, stat, btn, bar, note, rng } = A;
  const r = rng(2026), LINES = []; let off = 0;
  for (let i = 0; i < 40; i++) { const len = 24 + Math.floor(r() * 80); LINES.push({ i, start: off, len }); off += len; }
  const TOTAL = off;
  let n = 7, rule = 'naive', codec = 'plain';
  const out = stat([]), strip = h('div', { class: 'spk-strip' }), sl = slider('splits', 1, 12, n, 1, v => { n = v; run(); });
  const sRule = seg([{ v: 'naive', l: 'Naive byte cut' }, { v: 'owns', l: 'Start owns the line' }], rule, v => { rule = v; run(); });
  const sCodec = seg([{ v: 'plain', l: 'Plain text' }, { v: 'gzip', l: 'gzip' }], codec, v => { codec = v; run(); });
  function run() {
    const parts = codec === 'gzip' ? 1 : n, bounds = [0];
    for (let k = 1; k < parts; k++) bounds.push(Math.floor(TOTAL * k / parts));
    bounds.push(TOTAL);
    const own = pos => { let p = 0; while (p < parts - 1 && pos >= bounds[p + 1]) p++; return p; };
    const straddle = LINES.map(L => own(L.start) !== own(L.start + L.len - 1));
    const S = straddle.filter(Boolean).length, broken = rule === 'naive' ? S : 0;
    const sizes = Array(parts).fill(0);
    if (rule === 'naive') for (let p = 0; p < parts; p++) sizes[p] = bounds[p + 1] - bounds[p];
    else LINES.forEach(L => { sizes[own(L.start)] += L.len; });
    const row = h('div', { class: 'spk-row' });
    LINES.forEach((L, i) => row.append(h('div', { class: 'spk-ln' + (rule === 'naive' && straddle[i] ? ' x' : ''), title: 'line ' + i + ' · ' + L.len + ' bytes', style: 'width:' + (L.len / TOTAL * 100) + '%;background-color:var(--p' + (own(L.start) % 8) + ')' })));
    strip.replaceChildren(row, ...bounds.slice(1, -1).map(c => h('div', { class: 'spk-cut', style: 'left:' + (c / TOTAL * 100) + '%' })));
    out.update([{ l: 'partitions', v: parts }, { l: 'rows decoded', v: 40 + broken, cls: broken ? 'bad' : 'ok' }, { l: 'corrupt fragments', v: broken * 2, cls: broken ? 'bad' : 'ok' }, { l: 'largest partition', v: Math.max(...sizes) + ' B' }, { l: 'parallel tasks usable', v: parts, cls: parts === 1 ? 'bad' : 'ok' }]);

    bar(sl, sRule, sCodec),

    h('div', {}, strip, h('div', { class: 'spk-legend' }, h('span', {}, h('i', { style: 'background:repeating-linear-gradient(45deg,transparent 0 3px,var(--bad) 3px 5px)' }), 'line cut by a boundary'), h('span', {}, 'colour = owning split, black marks = byte cuts'))),
    out,
    note('Illustrative model: a fixed 40-line file with seeded line lengths (' + TOTAL + ' bytes). Real splits are 128 MB; the rule, not the size, is what is modelled. gzip is shown as one split.')));
  run();
};

    bar(sMode, bF, bM, bR, bC),
    bar(bA, bZ, btn('Reproduce the incident', () => { on.filter = on.map = on.reduce = true; mode = 'lazy'; sMode.set(mode); cache = false; actions = 2; run(); }), btn('Apply the fix', () => { on.filter = on.map = on.reduce = true; mode = 'lazy'; sMode.set(mode); cache = true; actions = 2; run(); })),
    chain, out, lg.el,
    note('Illustrative model: ' + N + ' records, one source scan per action, no partial caching. Real jobs also pay shuffle cost for reduceByKey on each uncached action.')));

/* ---- ch2: pipeline builder and stage cutting ---- */
PG.stages = function (root, A) {

  const OPS = ['-', 'map', 'filter', 'reduceByKey', 'groupByKey', 'join', 'repartition', 'coalesce'];

  const sShared = seg([{ v: 'yes', l: 'join inputs share a partitioner' }, { v: 'no', l: 'not co-partitioned' }], shared, v => { shared = v; run(); });
  function build() {

    });

  }
  function run() {
    slots.forEach((s, i) => { sbtn[i].textContent = (i + 1) + '. ' + s; });
    const m = build(), n = m.st.length, bw = Math.max(70, Math.floor((620 - 20 * (n - 1)) / n)), boxes = [], arrows = [];
    m.st.forEach((s, i) => {

    pic.replaceChildren(diagram({ w: 640, h: hgt, boxes, arrows, cap: 'Stage graph for the pipeline above (read, then your 6 slots, then an action).' }));

  }

/* ---- ch5: shuffle write and read ---- */

  const W = Array.from({ length: KEYS }, (_, i) => 1 / (i + 6)), WT = W.reduce((a, b) => a + b, 0);

  const sC = seg([{ v: 'off', l: 'no combine' }, { v: 'on', l: 'map-side combine' }], combine, v => { combine = v; run(); }), sZ = seg([{ v: 'small', l: 'Small (50 MB)' }, { v: 'large', l: 'Large (2 TB)' }], size, v => { size = v; run(); });

    for (let k = 0; k < KEYS; k++) { const p = hash(k, R); nonEmpty.add(p); if (p < share.length) share[p] += W[k] / WT; }
    const avg = bytes / R, bad = avg > 512e6 || avg < 16e6;
    pic.replaceChildren(spkBars(share.map(s => s * bytes), { hot: i => share[i] * bytes > 4 * avg, label: 'bytes per reducer', cap: 'bytes per reducer (first ' + share.length + ' of ' + R.toLocaleString('en-US') + ')' }));
    cap.textContent = 'Only ' + KEYS + ' distinct city keys exist, so at most ' + KEYS + ' reducers receive data (' + Math.min(R, nonEmpty.size) + ' here).';
    out.update([{ l: 'shuffle records', v: recs.toLocaleString('en-US') }, { l: 'shuffle bytes', v: spkFmtB(bytes) }, { l: 'blocks (M×R)', v: blocks.toLocaleString('en-US'), cls: blocks > 5e6 ? 'bad' : 'ok' }, { l: 'avg partition (target 128 MB)', v: spkFmtB(avg), cls: bad ? 'bad' : 'ok' }, { l: 'avg block', v: spkFmtB(bytes / blocks), cls: bytes / blocks < 1e3 ? 'bad' : 'ok' }]);

    h('p', { class: 'pgwhy' }, 'Hypothesis to test: map-side combine cuts shuffle records to distinct keys per map task, and the default partition count fits neither size.'),
    bar(sM, sR), bar(sC, sZ),
    bar(btn('Reproduce the incident', () => set(6, 5, 'off', 'large')), btn('Apply the fix', () => set(6, 0, 'on', 'large'))),
    pic, cap, out,
    note('Illustrative model: 400 city keys with a skewed share, 48 bytes per shuffle record, partition = hash(key) mod R. Real keys are far more numerous and shuffle files carry compression and metadata. Reproduce loads 16,000 map tasks (the 2 TB input at 128 MB each) with 200 reduce partitions; the fix combines first, so the shuffle shrinks to a few hundred MB and a handful of partitions is enough.')));

/* ---- ch6: skew, AQE coalesce and skew-join split, salting ---- */

  const sOp = seg([{ v: 'join', l: 'join' }, { v: 'groupBy', l: 'groupBy' }], op, v => { op = v; run(); });
  const sC = seg([{ v: 'off', l: 'AQE coalesce off' }, { v: 'on', l: 'AQE coalesce on' }], coal, v => { coal = v; run(); });
  const sK = seg([{ v: 'off', l: 'skew join off' }, { v: 'on', l: 'skew join on' }], skewJ, v => { skewJ = v; run(); });

/* ---- ch8: unified memory, concurrent tasks, overhead ---- */
PG.memory = function (root, A) {

  const out = stat([]);

  app.replaceChildren(topbar(true), h('div', { class: 'wrap' },
    h('div', { class: 'chhead', style: '--pc:' + pc(i) }, h('div', { class: 'n' }, i + 1), h('div', {}, h('small', {}, (COURSE.flat ? COURSE.title : P.name) + ' · chapter ' + (i + 1) + ' of ' + CHAPTERS.length), h('h1', {}, p.t))),
    h('section', { class: 'blk' }, h('h3', {}, num(), 'The problem'), h('div', { class: 'prob' }, h('div', { html: c.scene.map(x => '<p>' + x + '</p>').join('') }), h('p', { class: 'q' }, c.ask))),
    c.predict ? predictBlock(c, num()) : null,
    c.archSteps ? null : ideaBlock(),
    ...(c.walks || (c.walk ? [c.walk] : [])).map(w => h('section', { class: 'blk' }, h('h3', {}, num(), w.title), walkAnim(w))),
    h('section', { class: 'blk' }, h('h3', {}, num(), c.archSteps ? c.archTitle : c.arch ? (c.pg ? 'Overall architecture and playground' : 'Overall architecture') : 'Playground'), c.arch ? (c.archSteps ? archAnim(c.arch, c.archSteps) : diagram(c.arch)) : null, c.archNote ? h('p', { class: 'archnote', html: c.archNote }) : null, c.pg ? pgbox : null),
    commonSection(c, num()),
    nav));
  if (c.pg) try { PG[c.pg](pgbox, API); } catch (e) { console.error(e); pgbox.append(h('div', { class: 'callout warn' }, 'Playground failed to load: ' + e.message)); }
  scrollTo(0, 0);
}
function route() {
  stopTimers();
  const m = /^#ch(\d+)$/.exec(location.hash);
  if (m && +m[1] < CHAPTERS.length) chapter(+m[1]); else overview();
}
addEventListener('hashchange', route);
route();
</script>
