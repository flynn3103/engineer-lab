<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apache Kafka · course</title>
<link rel="stylesheet" href="../../assets/lab.css">
<style>
:root{--acc:#0f9d8a;--acc2:#d6456b}
@media(prefers-color-scheme:dark){:root{--acc:#3ccfb8;--acc2:#ff7aa0}}
body{font-size:16px}
.topbar .wrap{min-height:50px}
.topbar .crumb{color:var(--mut);font-size:14px;text-decoration:none}
.topbar .crumb:hover{color:var(--ink)}
.hero{padding:34px 0 10px}
.hero .lead{max-width:60ch}
.part{margin:28px 0 10px}
.part h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 4px}
.part p{margin:0 0 12px;color:var(--mut);font-size:14.5px;max-width:64ch}
.map{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.tile{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:0;height:100%;width:100%}
.tile:hover{border-color:var(--acc);transform:translateY(-2px)}
.tile .n{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--pc);border:1px solid var(--line)}
.tile b{display:block;font-size:15px;line-height:1.3}
.tile small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;line-height:1.35}
.chhead{display:flex;gap:12px;align-items:center;margin:22px 0 4px}
.chhead .n{flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;background:var(--pc);border:1px solid var(--line)}
.chhead h1{font-size:clamp(22px,4.6vw,30px);letter-spacing:-.4px}
.chhead small{display:block;color:var(--mut);font-size:13px}
.ask{font-size:clamp(17px,2.8vw,20px);margin:8px 0 18px;max-width:62ch}
.blk{margin:0 0 16px}
.blk>h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.blk>h3 i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--on-brand,#fff);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.idea{margin:0;padding-left:20px}.idea li{margin:5px 0}
.pg{display:grid;gap:12px}
.pgwhy{margin:0;color:var(--mut);font-size:14px}
.cp{display:grid;gap:10px}
@media(min-width:760px){.cp{grid-template-columns:repeat(3,1fr)}}
.cp>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.cp b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.cp .s b{color:var(--bad)}.cp .c b{color:var(--warn)}.cp .f b{color:var(--ok)}
.cp p{margin:0;font-size:14.5px}
.quiz .q{font-weight:600;margin:0 0 8px}
.quiz .opts{display:grid;gap:6px}
.quiz .opts button{text-align:left;min-height:0;padding:9px 12px}
.quiz .opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.quiz .opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.quiz .why{margin-top:8px}
.pn{display:flex;justify-content:space-between;gap:8px;margin:22px 0 40px}
.pn button{max-width:48%;text-align:left}
.pn button:last-child{margin-left:auto;text-align:right}
/* ---- playground kit ---- */
.pgbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.pgbox .bar{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;min-height:36px;padding:6px 12px;font-size:13.5px;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:var(--on-brand,#fff);font-weight:600}
.sl{display:inline-flex;align-items:center;gap:8px;flex-wrap:nowrap}
.sl input{width:130px}.sl b{color:var(--ink);font-weight:600;min-width:2ch;font-variant-numeric:tabular-nums}
.out{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;min-width:0}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.badge.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.badge.info{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line));background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.log{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card)}
.log div{padding:1px 0;border-bottom:1px dashed var(--line)}.log div:last-child{border:0}
.log .bad{color:var(--bad)}.log .ok{color:var(--ok)}.log .mut{color:var(--mut)}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat>div{border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--card);min-width:84px}
.stat small{display:block;color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat .bad b{color:var(--bad)}.stat .ok b{color:var(--ok)}
.svgw{overflow-x:auto;overscroll-behavior-x:contain}.svgw svg{display:block;max-width:100%}
.cols{display:grid;gap:12px}
@media(min-width:760px){.cols.two{grid-template-columns:1fr 1fr}.cols.three{grid-template-columns:repeat(3,1fr)}}
.cols>*{min-width:0}
@media(max-width:560px){.chhead{margin-top:14px}}
.prob{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc2);border-radius:12px;padding:12px 16px;margin:0 0 6px}
.prob p{margin:0 0 .5em}.scene p:last-child{margin:0}
.prob .q{font-weight:700;font-size:clamp(17px,2.6vw,19px)}
.arch{margin:0}.arch figcaption{text-align:center}
.arch svg{overflow:visible}
.common{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.common>div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);display:grid;gap:5px;align-content:start}
.common h4{font-size:15px;line-height:1.3;margin:0}.common h4 i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;margin-right:6px;vertical-align:1px}
.common p{margin:0;font-size:14px}
.common b{font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-right:6px}
.common .e b{color:var(--acc2)}.common .c b{color:var(--warn)}.common .f b{color:var(--ok)}
.sw{display:flex;gap:6px;margin-left:auto}
.sw a{font-size:13px;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}
.sw a:hover{color:var(--ink);border-color:var(--acc)}.sw a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.ctabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.ctab{border-radius:999px;font-size:14px;padding:7px 14px;min-height:0}
.ctab.on{color:var(--ink);background:color-mix(in srgb,var(--acc2) 14%,var(--card));border-color:var(--acc2);font-weight:700}
.cbody{display:grid;gap:12px}
.ctitle{font-size:clamp(20px,3.6vw,26px);letter-spacing:-.3px;margin:4px 0 0}
.csym{font-size:clamp(16px,2.4vw,18.5px);margin:0}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.ccard h5{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 6px}
.ccard h5:not(:first-child){margin-top:12px}
.ccard p{margin:0 0 .5em;font-size:15px}.ccard .seen b{color:var(--acc2);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.ccard pre{font-size:12.5px}
.vizc{background:var(--soft)}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.vrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin:6px 0}
@media(max-width:620px){.vrow{grid-template-columns:1fr;gap:4px}}
.vl{font-size:13px;color:var(--mut)}
.vcells{display:flex;gap:6px;min-width:0}
.vc{flex:1 1 0;min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;font-size:12.5px;background:var(--card);overflow-wrap:anywhere}
.vc.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.vc.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--card))}
.vc.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,var(--card))}
.vc.off{border-style:dashed;color:var(--mut);background:transparent}
.vbar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
@media(max-width:620px){.vbar{grid-template-columns:1fr}}
.vtrack{height:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vtrack i{display:block;height:100%;border-radius:8px;transition:width .35s}
.vtrack i.bad{background:var(--bad)}.vtrack i.ok{background:var(--ok)}.vtrack i.warn{background:var(--warn)}
.vt{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.fixes{margin:0;padding-left:22px}.fixes li{margin:4px 0}.fixes li::marker{color:var(--acc2);font-weight:700}
.course-custom{display:grid;gap:18px;margin-bottom:22px}
/* chapter 2 · buffer pool playground and architecture animation */
section.blk .prob p{font-size:15px;line-height:1.55}
.arch-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 8px}
.ar-box rect{fill:var(--card);stroke:var(--line);stroke-width:1.5;transition:opacity .3s,stroke .3s}
.ar-box.on rect{stroke:var(--acc);stroke-width:3}
.ar-box.off{opacity:.35}
.ar-box{transition:opacity .3s}
.ar-title{font-size:13px;font-weight:700;fill:var(--ink);font-family:system-ui,sans-serif}
.ar-sub{font-size:11px;fill:var(--mut);font-family:ui-monospace,monospace}
.ar-arrow line{stroke:var(--mut);stroke-width:1.6;fill:none;color:var(--mut);transition:opacity .3s}
.ar-arrow.on line{stroke:var(--acc2);stroke-width:3;color:var(--acc2)}
.ar-arrow:not(.on) line{opacity:.45}
.ar-lab{font-size:11px;fill:var(--mut);font-family:ui-monospace,monospace}
.ar-arrow.on .ar-lab{fill:var(--acc2);font-weight:700}
.ar-dot{fill:var(--acc2);stroke:var(--card);stroke-width:2}
.ar-step{margin-top:8px;border-left:4px solid var(--acc);background:var(--soft);border-radius:0 10px 10px 0;padding:10px 12px}
.ar-count{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.ar-text{margin:4px 0 0;font-size:15px;color:var(--ink)}
.ar-box{cursor:pointer;outline:none}
.ar-box:focus-visible rect{stroke:var(--acc);stroke-width:3}
.ar-box.picked rect{stroke:var(--acc2);stroke-width:3}
.ar-hint{margin:0;font-size:14px;color:var(--mut)}
.split{display:grid;gap:14px;align-items:start}
.split-l,.split-r{min-width:0}
.split-r{display:grid;gap:10px;align-content:start}
@media(min-width:760px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}}

.ar-comp{display:grid;gap:8px;margin-top:10px}
.ar-state{display:grid;gap:8px;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.ar-pt{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.ar-lookup{font-weight:700;font-size:14px}
.ar-lookup.hit{color:var(--ok)}.ar-lookup.miss{color:var(--bad)}
.ar-frs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ar-fr{border:1.5px solid var(--line);border-radius:10px;padding:6px;background:var(--card);display:grid;gap:2px;font-size:12px;color:var(--mut)}
.ar-fr b{font-size:14px;color:var(--ink)}
.ar-fr.pinned{border-color:var(--acc)}
.ar-fr.dirty{box-shadow:inset 0 -4px 0 var(--bad)}
.ar-legend{font-size:12.5px;color:var(--mut);margin:0}
@media(max-width:620px){.ar-frs{grid-template-columns:repeat(2,1fr)}}
.sm{display:grid;gap:10px}
.sm-frames{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sm-fr{border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;background:var(--card);display:grid;gap:2px;text-align:center;min-height:66px;align-content:center}
.sm-fr small{font-size:11px;color:var(--mut)}
.sm-fr b{font-size:15px;color:var(--ink)}
.sm-fr.pinned{border-color:var(--acc)}
.sm-fr.dirty{box-shadow:inset 0 -4px 0 var(--bad)}
.sm-ops{display:flex;flex-wrap:wrap;gap:5px}
.sm-op{font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:7px;padding:3px 7px;color:var(--mut)}
.sm-op.done.hit{color:var(--ok);border-color:var(--ok)}
.sm-op.done.miss{color:var(--bad);border-color:var(--bad)}
.sm-op.now{outline:2px solid var(--acc);outline-offset:2px;color:var(--ink)}
.sm-op.leak{border-style:dashed}
.sm-msg{margin:0;font-size:14.5px;color:var(--ink);min-height:3em}
.sm-cnt{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums;border-top:1px dashed var(--line);padding-top:6px}
@media(max-width:620px){.sm-frames{grid-template-columns:repeat(2,1fr)}}
.ar-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ar-card b{font-size:13px;color:var(--acc)}
.ar-card p{margin:2px 0 0;font-size:14px;color:var(--ink)}
/* kafka tech CSS (prefix kfk-) */
.kfk-grid{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
.kfk-cell{border:1.5px solid var(--line);border-radius:6px;padding:4px 2px;text-align:center;font-size:11.5px;background:var(--card);font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.kfk-cell small{display:block;color:var(--mut);font-size:10px}
.kfk-cell.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.kfk-cell.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--card))}
.kfk-cell.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,var(--card))}
.kfk-cell.off{border-style:dashed;color:var(--mut);background:transparent}
.kfk-cell.hl{outline:2px solid var(--acc);outline-offset:1px}
.kfk-lane{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin:4px 0}
.kfk-lane>b{font-size:12.5px;color:var(--mut);font-weight:600}
.kfk-cap{font-size:12.5px;color:var(--mut);margin:2px 0 0}
.kfk-tl{display:block;width:100%;height:auto}
/* playground controls wrap on narrow screens */
.kfk-pg .seg{flex-wrap:wrap;max-width:100%}
.kfk-pg .sl{flex-wrap:wrap}
.kfk-pg .bar{flex-wrap:wrap}
@media(max-width:620px){.kfk-grid{grid-template-columns:repeat(auto-fill,minmax(42px,1fr))}.kfk-lane{grid-template-columns:1fr;gap:2px}}
@media(prefers-reduced-motion:reduce){.kfk-cell,.vtrack i{transition:none}}
.idea code,.ccard p code,.ccard li code,.prob code,.quiz code,.fixes code{overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---- tiny helpers shared by the chapters and playgrounds ---- */
const PG = {};
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TIMERS = [];
function stopTimers() { while (TIMERS.length) { const t = TIMERS.pop(); clearInterval(t); clearTimeout(t); } }
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  const add = k => { if (k == null || k === false) return; if (Array.isArray(k)) k.forEach(add); else el.append(k.nodeType ? k : document.createTextNode(String(k))); };
  kids.forEach(add);
  return el;
}
function svg(tag, props, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in (props || {})) { const v = props[k]; if (v == null || v === false) continue; if (k === 'class') el.setAttribute('class', v); else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v); else el.setAttribute(k, v); }
  const add = k => { if (k == null || k === false) return; if (Array.isArray(k)) k.forEach(add); else el.append(k.nodeType ? k : document.createTextNode(String(k))); };
  kids.forEach(add);
  return el;
}
/* seeded random numbers, so every run of a playground repeats */
function rng(seed) { let a = (seed >>> 0) || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const bar = (...k) => h('div', { class: 'bar' }, ...k);
const btn = (label, fn, cls) => h('button', { class: cls || '', onclick: fn }, label);
const badge = (text, kind) => h('span', { class: 'badge ' + (kind || '') }, text);
const note = t => h('p', { class: 'note' }, t);
function seg(opts, val, cb) {          // opts: [{v,l}] or [v]; returns element with .value and .set(v)
  const el = h('div', { class: 'seg', role: 'group' });
  const norm = opts.map(o => (typeof o === 'object' ? o : { v: o, l: String(o) }));
  const paint = () => [...el.children].forEach((b, i) => b.classList.toggle('on', norm[i].v === el.value));
  norm.forEach(o => el.append(h('button', { onclick() { el.value = o.v; paint(); cb && cb(o.v); } }, o.l)));
  el.value = val; el.set = v => { el.value = v; paint(); }; paint(); return el;
}
function slider(label, min, max, val, step, cb, fmt) {   // returns <label> with .input and .value
  const out = h('b', {}, fmt ? fmt(val) : val);
  const input = h('input', { type: 'range', min, max, step: step || 1, value: val, 'aria-label': label });
  input.addEventListener('input', () => { out.textContent = fmt ? fmt(+input.value) : input.value; cb && cb(+input.value); });
  const el = h('label', { class: 'sl' }, label, input, out);
  Object.defineProperty(el, 'value', { get: () => +input.value, set: v => { input.value = v; out.textContent = fmt ? fmt(+v) : v; } });
  return el;
}
function player(o) {   // o.step() -> false when finished, o.reset(), o.speed ms per tick. returns element with .stop()
  let t = null;
  const stop = () => { if (t) { clearInterval(t); const i = TIMERS.indexOf(t); if (i >= 0) TIMERS.splice(i, 1); t = null; } play.textContent = '▶ Play'; };
  const tick = () => { if (o.step() === false) stop(); };
  const play = btn('▶ Play', () => { if (t) { stop(); return; } t = setInterval(tick, o.speed || 600); TIMERS.push(t); play.textContent = '⏸ Pause'; tick(); }, 'primary');
  const el = bar(play, btn('Step ›', () => { stop(); tick(); }), btn('⏮ Reset', () => { stop(); o.reset(); }));
  el.stop = stop; return el;
}
function logbox() {
  const el = h('div', { class: 'log', 'aria-live': 'polite' });
  return { el, add(text, cls) { el.append(h('div', { class: cls || '' }, text)); el.scrollTop = el.scrollHeight; }, clear() { el.textContent = ''; } };
}
function stat(items) {   // items: [{l, v, cls}] -> element; call el.update(items) to refresh
  const el = h('div', { class: 'stat' });
  el.update = its => { el.textContent = ''; its.forEach(i => el.append(h('div', { class: i.cls || '' }, h('small', {}, i.l), h('b', {}, i.v)))); };
  el.update(items || []); return el;
}

/* static architecture diagram: spec = {w,h,boxes:[[id,x,y,w,h,label,tone]],arrows:[[from,to,label,dashed]],cap}; tone 0..7 picks a --p colour; '\n' splits lines */
function diagram(sp) {
  const B = {}; sp.boxes.forEach(b => { B[b[0]] = { x: b[1], y: b[2], w: b[3], h: b[4] }; });
  const s = svg('svg', { viewBox: `0 0 ${sp.w} ${sp.h}`, role: 'img', 'aria-label': sp.cap || 'diagram', style: 'width:100%;min-width:' + Math.min(sp.w, 540) + 'px;max-width:' + sp.w + 'px;height:auto;display:block;margin:0 auto' });
  s.append(svg('defs', {}, svg('marker', { id: 'ah', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, svg('path', { d: 'M0 0L10 5L0 10z', fill: 'currentColor' }))));
  const edge = (a, t) => { const cx = a.x + a.w / 2, cy = a.y + a.h / 2, dx = t.x + t.w / 2 - cx, dy = t.y + t.h / 2 - cy; const k = Math.min(dx ? (a.w / 2) / Math.abs(dx) : 1e9, dy ? (a.h / 2) / Math.abs(dy) : 1e9); return [cx + dx * k, cy + dy * k]; };
  (sp.arrows || []).forEach(([f, t, lab, dash]) => {
    const [x1, y1] = edge(B[f], B[t]), [x2, y2] = edge(B[t], B[f]);
    s.append(svg('line', { x1, y1, x2, y2, stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-dasharray': dash ? '5 4' : null, 'marker-end': 'url(#ah)', style: 'color:var(--mut)' }));
    if (lab) s.append(svg('text', { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 5, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--mut)' }, lab));
  });
  sp.boxes.forEach(([id, x, y, w, hh, lab, tone]) => {
    s.append(svg('rect', { x, y, width: w, height: hh, rx: 9, fill: tone == null ? 'var(--card)' : 'var(--p' + tone + ')', stroke: 'var(--line)', 'stroke-width': 1.5 }));
    const ls = String(lab).split('\n'), y0 = y + hh / 2 - (ls.length - 1) * 8 + 4;
    ls.forEach((l, i) => s.append(svg('text', { x: x + w / 2, y: y0 + i * 16, 'text-anchor': 'middle', 'font-size': 12.5, fill: 'var(--ink)', 'font-weight': i === 0 && ls.length > 1 ? 700 : 400 }, l)));
  });
  return h('figure', { class: 'arch' }, h('div', { class: 'svgw' }, s), sp.cap ? h('figcaption', { class: 'note' }, sp.cap) : null);
}
API.diagram = diagram;

 pg:'partitioner',
 common:[
 {tab:'Hot key',t:'Hot key makes a hot partition',sym:'One partition has far higher bytes-in and consumer lag; one consumer is pegged while the others idle.',
  ctx:'An orders topic is keyed by <code>seller_id</code>. One marketplace seller produces a large share of all events.',
  why:'<code>partition = hash(key) mod N</code>. Equal keys always map to one partition, so adding brokers or partitions cannot split the traffic of a single key.',
  log:{text:'-- representative output, values illustrative\nBytes-in per partition: P0 48 MB/s, P1 4, P2 5, P3 3, P4 4, P5 4\nkafka-consumer-groups.sh --describe: LAG concentrated on partition 0',note:'Metric pattern and a documented CLI; the values are illustrative. Source: '+SRC.producer},
  viz:{bad:{bars:[['P0',100,'bad','48 MB/s'],['P1',8,'ok','4'],['P2',10,'ok','5'],['P3',6,'ok','3'],['P4',8,'ok','4'],['P5',8,'ok','4']],cap:'The hot key keeps all its traffic on P0 (illustrative).'},
       good:{bars:[['P0',23,'ok','11 MB/s'],['P1',19,'ok','9'],['P2',21,'ok','10'],['P3',19,'ok','9'],['P4',21,'ok','10'],['P5',19,'ok','9']],cap:'A finer or salted key spreads it over all partitions (illustrative).'}},
  fix:['Measure first: compare per-partition bytes-in and consumer lag to confirm the skew.','Fix: use a finer key (for example seller_id plus order_id), or salt the hot key into a few buckets.','Fix: optionally use a custom partitioner for known hot keys, then re-check balance.','Trade-off: order is guaranteed only per key within one partition, so a salted or finer key gives up ordering across the buckets for that seller.','Verify: per-partition throughput and lag are within a small factor of each other.']},
 {tab:'Order breaks',t:'More partitions break per-key order',sym:'A consumer sees an order’s “paid” event before its “created” event, or a stateful job loses state for some keys.',
  ctx:'To get more consumer parallelism the topic grows from 3 to 4 partitions while orders are in flight.',
  why:'The partitioner is <code>hash(key) mod numPartitions</code>. Changing N moves most keys to a new partition, while existing records never move, so one key’s history is now split over two logs.',
  log:{text:'-- representative output, values illustrative\nkafka-topics.sh --bootstrap-server broker:9092 --alter --topic orders --partitions 4\nkey order-7: created @ partition 1, paid @ partition 3',note:'The command is documented; the key placement illustrates <code>hash(key) mod N</code> changing. Source: '+SRC.topic},
  viz:{bad:{rows:[row('P1',['order-7 · created','ok',2]),row('P3 (new)',['order-7 · paid','bad',2]),row('P2',['order-5 · created, paid','ok',2])],cap:'Same key, two partitions: order-7 is split across P1 and P3.'},
       good:{rows:[row('P1',['—','off',2]),row('P3',['order-7 · created, paid','ok',2]),row('P2',['order-5 · created, paid','ok',2])],cap:'A topic created with the final count keeps each key in one partition.'}},
  fix:['Measure first: sample keys and check whether their events sit in more than one partition.','Fix: treat the partition count as part of the data contract and size it up front for the target consumer parallelism.','Fix: if it must grow, create a new topic with the final count and migrate by dual-writing or replaying the old data; drain the old topic before switching key-dependent consumers.','Trade-off: a migration costs a full copy and a coordinated cut-over, and the partition count can never be lowered without recreating the topic.','Verify: for sampled keys every event lands in one partition of the new topic and consumers see them in order.']},
 {tab:'Null keys',t:'Null-key traffic piles onto a slow broker with the old sticky partitioner',sym:'A topic with null keys shows one partition (on a slow broker) with much more data than the others.',
  ctx:'Records have no key, so the producer picks the partition. One broker is slow, and clients run a version older than 3.3 with the KIP-480 sticky partitioner.',
  why:'The old sticky partitioner switched partitions after a batch’s worth of data. A slow broker drains batches slowly, so records waiting for it kept sticking to its partition, which sent even more data to the broker that was already behind. KIP-794 replaced it with a uniform sticky partitioner with adaptive partitioning.',
  log:{text:'-- representative output, values illustrative\nBytes-in per partition (null-key topic): P0 31 MB/s, P1 9, P2 10, P3 9\nP0 leader: broker-3 (high request queue time)',note:'Illustrative skew pattern; the design problem is described in KIP-794. Source: '+SRC.kip794},
  viz:{bad:{bars:[['P0 (slow broker)',100,'bad','31 MB/s'],['P1',29,'warn','9'],['P2',32,'warn','10'],['P3',29,'warn','9']],cap:'The slow partition receives the most data (illustrative).'},
       good:{bars:[['P0 (slow broker)',50,'ok','8 MB/s'],['P1',100,'ok','16'],['P2',100,'ok','16'],['P3',100,'ok','16']],cap:'Adaptive partitioning sends less to the slow broker (illustrative).'}},
  fix:['Measure first: compare bytes-in and request queue time per partition leader to find the slow broker.','Fix: upgrade clients to 3.3 or later, which use the uniform sticky partitioner; keep <code>partitioner.adaptive.partitioning.enable</code> at its default <code>true</code>.','Fix: remove the real cause of the slow broker (disk, network, noisy neighbour).','Trade-off: adaptive partitioning deliberately sends unequal amounts to partitions, so do not read partition-level balance as a health metric.','Verify: the slow partition’s share of bytes-in falls and produce latency on that broker recovers.']}
 ]},
{ask:'Brokers run at 90% CPU serving one request per event though bandwidth is low. How do we do the same work with far fewer requests?',
 why:'Every request costs a round trip and broker work however small it is, so tiny requests waste CPU.',
 principle:'Amortise the fixed per-request cost over many records by batching, and bound the memory that batching may use.',
 design:'Accumulate records per partition until batch.size or linger.ms, compress whole batches, and block or fail when buffer.memory is full.',
 scene:['The order service runs 20 producer instances at about 2,500 events/s each, 50,000 events/s in total (illustrative), with events of about 300 bytes. A developer set <code>linger.ms=0</code> and a small <code>batch.size</code> “to keep latency low”.','Broker request-handler threads sit near 90% CPU (illustrative) while the network is nearly idle, and the produce request rate is about equal to the event rate. During a broker slowdown some services stop answering HTTP because their threads are blocked inside <code>send()</code>.'],
 predict:{q:'You raise <code>linger.ms</code> from 0 to 10 at a steady 5,000 events/s per producer. What happens to requests per second and to latency?',
  opts:['Requests/s stay the same and latency rises by 10 ms','Requests/s drop sharply and latency rises by at most about 10 ms','Requests/s drop, but latency rises by seconds'],ans:1,
  why:'In 10 ms the producer accumulates about 50 records (illustrative), which share one request. A record waits at most <code>linger.ms</code> for its batch to close.'},
 idea:['<b>RecordAccumulator:</b> keeps a queue of batches per partition and appends each record to the open batch.','<b>Batch close:</b> a batch is sent when it holds <code>batch.size</code> bytes or <code>linger.ms</code> has passed since its first record, whichever comes first.','<b>Sender thread:</b> drains ready batches per broker, so one request carries one batch per partition that broker leads.','<b>Compression:</b> <code>compression.type</code> is applied per batch, and a larger batch compresses better.','<b>Bounded buffer:</b> <code>buffer.memory</code> limits unsent data. When it is full, <code>send()</code> blocks for up to <code>max.block.ms</code> and then throws.'],
 arch:{w:620,h:230,cap:'The application thread appends to the accumulator; the Sender thread drains batches into requests.',
  boxes:[['app',10,80,110,60,'App thread\nsend()',0],['acc',170,15,170,70,'RecordAccumulator\nbatch per partition',1],['buf',170,150,170,60,'buffer.memory\nbound',2],['snd',390,80,120,60,'Sender thread\ndrain + compress',3],['brk',545,80,70,60,'Broker',4]],
  arrows:[['app','acc','1 append'],['buf','acc','2 space'],['acc','snd','3 ready'],['snd','brk','4']]},
 pg:'batching',
 common:[
 {tab:'Tiny batches',t:'Tiny batches flood the brokers',sym:'Broker request-handler CPU and the produce request rate are high while bytes-in is modest; produce latency rises with load.',
  ctx:'Many producers send each record immediately: <code>linger.ms=0</code> and a small <code>batch.size</code>, at tens of thousands of records per second.',
  why:'Each request costs a round trip and broker work no matter how small it is. With no linger the producer closes a batch after one record, so throughput is bounded by request rate, not bandwidth.',
  log:{text:'-- representative output, values illustrative\nProducer: batch-size-avg = 310, records-per-request-avg = 1.1\nBroker: kafka.network:type=RequestMetrics,name=RequestsPerSec,request=Produce  -> very high',note:'Documented producer and broker metrics; the pattern is illustrative. Source: '+SRC.monitoring},
  viz:{bad:{bars:[['producer A',93,'bad','38k req/s'],['producer B',100,'bad','41k'],['producer C',88,'bad','36k'],['producer D',98,'bad','40k']],cap:'linger.ms=0: roughly one request per record (illustrative).'},
       good:{bars:[['producer A',10,'ok','4k req/s'],['producer B',12,'ok','5k'],['producer C',10,'ok','4k'],['producer D',12,'ok','5k']],cap:'linger plus larger batches: many records per request (illustrative).'}},
  fix:['Measure first: check <code>batch-size-avg</code> and <code>records-per-request-avg</code> on the producers.','Fix: raise <code>linger.ms</code> (for example 5 to 20 ms) and <code>batch.size</code> (for example 64 KB) so records share a request.','Fix: enable compression with <code>compression.type</code> to shrink whole batches.','Trade-off: <code>linger.ms</code> adds up to that much latency to a record while its batch fills; under heavy load fewer requests can even lower end-to-end latency.','Verify: the produce request rate drops sharply for the same bytes-in, and p99 produce latency does not rise.']},
 {tab:'Buffer full',t:'Buffer exhausted: send() blocks, then throws TimeoutException',sym:'Request threads hang inside send(), then fail with a TimeoutException about allocating memory.',
  ctx:'A broker slows down. The producer keeps accepting events from the application faster than it can ship them.',
  why:'Unsent batches live in <code>buffer.memory</code> (default 32 MiB). When it is full, <code>send()</code> blocks for up to <code>max.block.ms</code> (default 60 s). After that it throws <code>BufferExhaustedException</code>, a <code>TimeoutException</code>. Blocking is back-pressure, but here it propagates into HTTP threads.',
  log:{text:'-- representative output, values illustrative\norg.apache.kafka.common.errors.TimeoutException: Failed to allocate 16384 bytes within the configured max blocking time 60000 ms. Total memory: 33554432 bytes. Available memory: 0 bytes. Poolable size: 16384 bytes',note:'The text follows the exception built by the producer’s buffer pool. Watch <code>buffer-available-bytes</code> and <code>buffer-exhausted-records</code> in the producer metrics. Source: '+SRC.producer},
  viz:{bad:{bars:[['buffer used',100,'bad','32 / 32 MiB'],['send() blocked',90,'bad','up to 60 s'],['threads waiting',80,'warn','40 of 50']],cap:'The buffer is full, so application threads wait (illustrative).'},
       good:{bars:[['buffer used',25,'ok','8 / 32 MiB'],['send() blocked',2,'ok','ms'],['threads waiting',0,'ok','0 of 50']],cap:'The slow broker is fixed and callers fail fast or shed load (illustrative).'}},
  fix:['Measure first: check <code>buffer-available-bytes</code>, <code>buffer-exhausted-records</code> and request latency to find the slow broker.','Fix: remove the cause of the slow broker; raise <code>buffer.memory</code> only to absorb a known burst.','Fix: lower <code>max.block.ms</code> for request threads, or hand events to the producer from a bounded queue so overload is shed deliberately.','Trade-off: a bigger buffer hides a slow broker for longer and loses more unsent data if the process dies; a small <code>max.block.ms</code> fails requests sooner.','Verify: <code>buffer-available-bytes</code> stays well above zero and no TimeoutException appears during the next broker slowdown.']},
 {tab:'Compression',t:'linger.ms=0 with compression gives a poor ratio and high network use',sym:'Compression is enabled, yet network bytes and broker disk barely drop.',
  ctx:'A team turned on <code>compression.type=lz4</code> and expected much less traffic, but left <code>linger.ms=0</code>.',
  why:'Compression works on a whole batch. A batch of one or two records has little redundancy to remove and still pays the header cost, so the ratio stays close to 1.',
  log:{text:'-- representative output, values illustrative\nProducer: compression-rate-avg = 0.94, batch-size-avg = 420\nBroker network in ≈ uncompressed volume',note:'<code>compression-rate-avg</code> is the compressed-to-uncompressed ratio reported by the producer; values near 1.0 mean little saving. Source: '+SRC.producer},
  viz:{bad:{bars:[['compression ratio',94,'bad','0.94'],['batch size',3,'bad','0.4 KB'],['network bytes',94,'bad','94% of raw']],cap:'Tiny batches barely compress (illustrative).'},
       good:{bars:[['compression ratio',45,'ok','0.45'],['batch size',60,'ok','60 KB'],['network bytes',45,'ok','45% of raw']],cap:'Larger batches compress well (illustrative).'}},
  fix:['Measure first: read <code>compression-rate-avg</code> and <code>batch-size-avg</code>.','Fix: raise <code>linger.ms</code> and <code>batch.size</code> so batches fill before they are compressed.','Fix: choose <code>compression.type</code> for the workload (lz4 or zstd for text and JSON) and compare ratios on real data.','Trade-off: compression costs producer and consumer CPU, and a longer linger adds latency.','Verify: <code>compression-rate-avg</code> falls and broker network-in drops for the same event rate.']}
 ]},
{ask:'A lost ack made the producer retry, and finance sees one order twice and another out of order. How do retries become safe?',
 why:'A timeout is ambiguous: the write may already have landed, so a blind retry duplicates or reorders it.',
 principle:'Make retries idempotent by giving every batch an identity that the receiver can recognise.',
 design:'The leader tracks producer ID, epoch and sequence per partition, and accepts only the next expected sequence.',
 scene:['A payments producer still runs an old configuration: <code>enable.idempotence=false</code>, <code>retries=2147483647</code> and <code>max.in.flight.requests.per.connection=5</code>. A broker restart makes some produce responses time out.','Finance reconciliation finds order 7731 booked twice, and for seller 42 the event “paid” appears before “created”. No consumer code changed.'],
 predict:{q:'With idempotence on and 5 requests in flight, can a retry reorder records within a partition?',
  opts:['Yes, more than one request in flight can always reorder on retry','No: the leader accepts a batch only if its sequence is the next expected one','Only when acks=1'],ans:1,
  why:'A batch with a gap in its sequence is rejected with OutOfOrderSequenceException and retried after its predecessor, so order is preserved for up to 5 in-flight requests.'},
 idea:['<b>Producer ID and epoch:</b> with <code>enable.idempotence=true</code> (the default since Kafka 3.0, KIP-679) the broker assigns the producer an ID.','<b>Sequence numbers:</b> each batch carries a per-partition sequence. The leader appends only the next expected one, ignores a duplicate and rejects a gap with <code>OutOfOrderSequenceException</code>.','<b>In-flight window:</b> up to 5 in-flight requests per connection keep order when idempotence is on; without it, more than 1 can reorder on retry.','<b>Bounded retries:</b> <code>delivery.timeout.ms</code> (default 120000) caps the total time to deliver a record, retries included; idempotence needs <code>acks=all</code>.','<b>Scope:</b> deduplication covers one producer session per partition. A restarted producer gets a new ID, which chapter 11 addresses with <code>transactional.id</code>.'],
 arch:{w:600,h:240,cap:'The leader keeps the next expected sequence per producer and partition, so a retried batch is recognised.',
  boxes:[['prod',10,60,140,60,'Producer\nPID 7 · seq 41',0],['ldr',230,60,170,60,'Leader state\nPID 7 expects 41',1],['log',470,60,120,60,'Partition log',3],['retry',10,160,140,60,'Retry\nsame PID + seq',2]],
  arrows:[['prod','ldr','1 send'],['ldr','log','2 append once'],['retry','ldr','3 duplicate: ignored',true]]},
 pg:'idempotence',
 common:[
 {tab:'Dupes and reorder',t:'Retry duplicates and reordering',sym:'Downstream sees the same event twice, or events of one key in a different order than they were sent.',
  ctx:'A producer without idempotence times out waiting for an ack and retries, with several batches in flight per connection.',
  why:'A timeout is ambiguous: the write may already have landed. A blind retry appends it again, and with <code>max.in.flight.requests.per.connection</code> above 1 a retried batch can land after a later batch. Idempotence adds (producer ID, sequence) so the leader can recognise a retry.',
  log:{text:'-- representative output, values illustrative\nProducer metric: record-retry-rate > 0, request timeouts\nConsumer: business id order-7731 appears twice',note:'Documented producer metric; the duplicate is observed by the application, not logged by Kafka. Source: '+SRC.semantics},
  viz:{bad:{rows:[row('timeline',['send #1 #2','ok'],['#1 lands, ack lost','bad'],['#2 lands','ok'],['#1 retried → log 1 2 1','bad',2])],cap:'A blind retry appends batch #1 a second time, after #2.'},
       good:{rows:[row('timeline',['send #1 #2 with PID + seq','ok'],['#1 lands, ack lost','bad'],['#2 lands','ok'],['#1 retry: seq seen → no-op','ok',2])],cap:'The leader recognises the sequence and appends nothing.'}},
  fix:['Measure first: check <code>record-retry-rate</code> and request timeouts on the producer, and look for duplicate business ids downstream.','Fix: set <code>enable.idempotence=true</code> (the default in current clients) with <code>acks=all</code>.','Fix: keep <code>max.in.flight.requests.per.connection</code> at 5 or less (with idempotence that still preserves order) and bound retries with <code>delivery.timeout.ms</code>.','Trade-off: idempotence is per producer session and partition. A restarted producer gets a new producer ID, so it does not dedupe across restarts; that needs a <code>transactional.id</code> (chapter 11). For effects outside Kafka, make the consumer idempotent too.','Verify: after injecting a lost ack, the log holds each batch once and in order.']},
 {tab:'Expired records',t:'Records expire when delivery.timeout.ms passes',sym:'Callbacks report a TimeoutException about expiring records, and the application cannot tell whether they were written.',
  ctx:'The leader of several partitions is unreachable for more than two minutes (illustrative). The producer keeps the batches and retries.',
  why:'<code>delivery.timeout.ms</code> (default 120000 ms) bounds the whole delivery attempt from <code>send()</code> to success or failure. After it passes, the batch is expired with a <code>TimeoutException</code>. If the request was already in flight the outcome can be unknown, so the application has to treat it as maybe written.',
  log:{text:'-- representative output, wording varies by version\norg.apache.kafka.common.errors.TimeoutException: Expiring 25 record(s) for orders-3:120000 ms has passed since batch creation',note:'The exception is delivered to the send callback or future. Check <code>request-latency-avg</code> and <code>record-error-rate</code> in the producer metrics. Source: '+SRC.producer},
  viz:{bad:{rows:[row('record',['created at 0 s','ok'],['leader unreachable','bad',2],['120 s: expired','bad'])],cap:'The batch waits longer than <code>delivery.timeout.ms</code> and fails.'},
       good:{rows:[row('record',['created at 0 s','ok'],['leader back after 9 s','ok',2],['acked at 9 s','ok'])],cap:'The outage is shorter than the delivery window, or the caller re-sends from an outbox.'}},
  fix:['Measure first: find which partitions and brokers were unavailable and for how long, from broker logs and <code>request-latency-avg</code>.','Fix: fix the unavailable leader; keep <code>delivery.timeout.ms</code> at least <code>linger.ms</code> plus <code>request.timeout.ms</code>.','Fix: handle the callback error by re-sending from an outbox or durable queue, with idempotence enabled so a maybe-written record is not duplicated.','Trade-off: a long window keeps the application waiting and holds buffer memory; a short one fails over sooner but surfaces more ambiguous outcomes.','Verify: during a leader failover test no callback reports an expiry, or every expired record is re-sent exactly once.']},
 {tab:'Silently off',t:'Idempotence silently disabled by a conflicting config',sym:'Duplicates appear again after someone tuned producer settings, although nobody turned idempotence off.',
  ctx:'A tuning change sets <code>acks=1</code> “for speed” (or <code>retries=0</code>) on a producer that relied on the idempotence default.',
  why:'Since Kafka 3.0 idempotence is on by default, but only if the settings allow it. When <code>enable.idempotence</code> is not set explicitly and another setting conflicts (<code>acks</code> other than <code>all</code>, <code>retries=0</code>, or too many in-flight requests), the producer disables idempotence and only logs it. An explicit <code>enable.idempotence=true</code> with a conflicting setting fails with a <code>ConfigException</code>.',
  log:{text:`-- representative output, wording varies by version
INFO [Producer clientId=producer-1] Idempotence will be disabled because acks is set to 1, not set to 'all'.`,note:'Look for this line and for <code>enable.idempotence = false</code> in the “ProducerConfig values” block printed at startup. Source: '+SRC.kip679},
  viz:{bad:{rows:[row('effective config',['acks=1','warn'],['enable.idempotence → false','bad',2])],cap:'The default is overridden by a conflicting setting.'},
       good:{rows:[row('effective config',['acks=all','ok'],['enable.idempotence=true','ok',2])],cap:'Explicit settings that agree with each other.'}},
  fix:['Measure first: read the producer startup log for the effective <code>enable.idempotence</code>, <code>acks</code>, <code>retries</code> and <code>max.in.flight.requests.per.connection</code>.','Fix: remove the conflicting setting, or set <code>acks=all</code>.','Fix: set <code>enable.idempotence=true</code> explicitly so a conflicting configuration fails fast instead of silently weakening delivery.','Trade-off: <code>acks=all</code> waits for the in-sync replicas, so latency rises compared with <code>acks=1</code>.','Verify: the startup log shows idempotence enabled, and the lost-ack test no longer produces duplicates.']}
 ]},
{ask:'A broker acknowledged an order and died a moment later. Are the acknowledged events gone, and what decides that?',
 why:'An acknowledgement is only as strong as the number of copies that exist when it is sent.',
 principle:'Replicate through a leader, acknowledge only what a defined set of replicas holds, and show readers only what cannot be lost.',
 design:'Track the in-sync replicas, publish a high watermark at the smallest log end in the ISR, and let acks and min.insync.replicas choose how many copies an ack needs.',
 scene:['The checkout service writes orders to <code>orders</code> with <code>replication.factor=3</code> and <code>acks=1</code> because a benchmark showed it 30% faster (illustrative). Broker 1 leads partition 0.','At 02:14 broker 1 loses its host. Producers saw success for every order. After the failover, support finds five orders that customers paid for and the warehouse never received, and the topic shows no errors.'],
 predict:{q:'With <code>acks=1</code>, the leader dies before the followers fetch the newest records. Is an acknowledged record safe?',
  opts:['Yes, the leader wrote it to disk before replying','No: only the leader had it, and a follower without it may become leader','Yes, the producer retries automatically so it is never lost'],ans:1,
  why:'With <code>acks=1</code> the leader replies after its own append. Records above the log end of the follower that takes over are gone, even though the producer saw success.'},
 idea:['<b>Leader and followers:</b> clients talk to the partition leader; followers fetch from it like consumers and append to their own log.','<b>ISR:</b> the leader plus the followers that caught up within <code>replica.lag.time.max.ms</code> (default 30 s). A follower that lags longer leaves the ISR and returns when it catches up.','<b>High watermark:</b> the smallest log end offset in the ISR. Consumers read only below it, and an <code>acks=all</code> write is acknowledged when the high watermark passes it.','<b>Guard rails:</b> with <code>acks=all</code> the leader rejects writes when the ISR is smaller than <code>min.insync.replicas</code>, and <code>unclean.leader.election.enable=false</code> (the default) keeps an out-of-sync replica from becoming leader.','<b>Leader epoch (KIP-101):</b> after a leader change, followers truncate to the end of the previous epoch instead of trusting the high watermark.'],
 archTitle:'Replication path and the high watermark',
 arch:{w:560,h:220,cap:'Producer to leader, followers fetch, leader advances the high watermark. Click a box for details.',
  boxes:[['prod',10,80,100,60,'Producer',0],['ldr',170,80,130,60,'Leader\nbroker 1',1],['f2',380,10,130,60,'Follower\nbroker 2',2],['f3',380,150,130,60,'Follower\nbroker 3',3],['hw',170,165,130,50,'High watermark\nISR minimum',4]],
  arrows:[['prod','ldr','1 produce'],['f2','ldr','2 fetch',true],['f3','ldr','2 fetch',true],['ldr','hw','3 min LEO']],
  comp:{prod:{n:'Producer',d:'Sends batches to the partition leader. With <code>acks=all</code> it waits for the high watermark; with <code>acks=1</code> it waits only for the leader’s append.'},
   ldr:{n:'Leader',d:'Appends records, serves fetches, tracks each follower’s log end offset and decides who is in the ISR.'},
   f2:{n:'Follower',d:'Fetches from the leader and appends. If it falls behind for more than <code>replica.lag.time.max.ms</code> it leaves the ISR.'},
   f3:{n:'Follower',d:'Same as the other follower. A follower that is out of sync cannot become leader unless unclean election is enabled.'},
   hw:{n:'High watermark',d:'The smallest log end offset across the ISR. Consumers read below it, and <code>acks=all</code> acknowledges when it passes the record.'}}},
 archSteps:{modes:[{v:'all',l:'acks=all'},{v:'one',l:'acks=1 and a crash'}],
  intro:{all:'Follow one record through an acks=all write. Press Play or Step.',one:'Follow one record through an acks=1 write when the leader crashes. Press Play or Step.'},
  all:[{t:'The producer sends record R to the leader of the partition.',box:['prod','ldr'],arrows:[0],dot:[['prod','ldr']]},
   {t:'The leader appends R to its log. R is above the high watermark, so consumers cannot see it and no ack is sent yet.',box:['ldr'],arrows:[],dot:null},
   {t:'Followers in the ISR fetch R and append it; their next fetch tells the leader their new log end offset.',box:['f2','f3','ldr'],arrows:[1,2],dot:[['ldr','f2'],['ldr','f3']]},
   {t:'The leader moves the high watermark to the smallest log end in the ISR and acknowledges the write. R now exists on every in-sync replica.',box:['ldr','hw'],arrows:[3],dot:[['ldr','hw'],['ldr','prod']]},
   {t:'If the leader dies now, an in-sync follower becomes leader and already holds R. No acknowledged record is lost.',box:['f2','f3'],arrows:[],dot:null}],
  one:[{t:'The producer sends record R to the leader.',box:['prod','ldr'],arrows:[0],dot:[['prod','ldr']]},
   {t:'The leader appends R and acknowledges at once, before any follower has fetched it.',box:['ldr','prod'],arrows:[0],dot:[['ldr','prod']]},
   {t:'The leader crashes before the followers fetch R.',box:['ldr'],arrows:[],dot:null},
   {t:'A follower that does not have R becomes the new leader. Its log ends before R.',box:['f2'],arrows:[],dot:null},
