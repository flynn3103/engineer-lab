    [[cSeg, pSeg, sInt], [sK, btn('Crash at record k', () => { crashOn = true; run(); })], [gSeg, rSeg], [btn('Reproduce the incident', () => { commit = 'before'; cSeg.set('before'); proc = 'sync'; pSeg.set('sync'); group = 'existing'; gSeg.set('existing'); sK.value = 6; crashOn = true; run(); }), btn('Apply the fix', () => { commit = 'after'; cSeg.set('after'); proc = 'sync'; pSeg.set('sync'); group = 'existing'; gSeg.set('existing'); crashOn = true; run(); })]],
    [out, view, line], 'Illustrative model: 24 records, polled in batches of 4, one record processed per tick. Auto-commit commits the polled position when poll() runs after the interval. Real clients also commit asynchronously and on rebalance.');

/* ch8 · rebalance: liveness clocks, assignment strategy, static membership */
PG.rebalance = function (root, A) {
  const { h, svg, seg, slider, stat, btn } = A;
  const PARTS = 6, WIN = 1800, DUR = 5, SESSION = 45, DOWN = 10;
  let strat = 'eager', fixedIds = 'off', rolling = true;
  const sC = slider('consumers in the group', 1, 8, 6, 1, () => run());
  const sT = slider('slowest batch takes (s)', 5, 600, 330, 5, () => run());
  const sM = slider('max.poll.interval.ms (s)', 30, 600, 300, 10, () => run());

  const idSeg = seg([{ v: 'off', l: 'no group.instance.id' }, { v: 'on', l: 'static group.instance.id' }], fixedIds, v => { fixedIds = v; run(); });
  const rBtn = btn('', () => { rolling = !rolling; label(); run(); });

  const out = stat([]), view = h('div', { class: 'svgw' }), line = h('p', { class: 'note' });
  function run() {

      if (fixedIds === 'on' && DOWN < SESSION) staticIdle += owned(m) * DOWN; else { add(t0, m, 'pod stops'); add(t0 + DOWN, m, 'pod starts'); }
    }
    const pps = ev.reduce((s, e) => s + e.parts * DUR, 0) + staticIdle, idle = Math.max(0, C - PARTS);
    out.update([
      { l: 'rebalances in 30 min', v: ev.length, cls: ev.length > 4 ? 'bad' : 'ok' },
      { l: 'paused partition-seconds', v: kfmt(pps), cls: pps > 300 ? 'bad' : 'ok' },
      { l: 'idle consumers', v: idle, cls: idle ? 'bad' : 'ok' }]);
    const bars = ev.map(e => { const hh = 6 + e.parts / PARTS * 38; return svg('rect', { x: (e.t / WIN * 600).toFixed(1), y: 52 - hh, width: 3, height: hh, fill: e.why === 'poll timeout' || e.why === 'rejoin' ? 'var(--bad)' : 'var(--warn)' }); });
    const picture = svg('svg', { viewBox: '0 0 600 62', class: 'kfk-tl', role: 'img', 'aria-label': 'Timeline of ' + ev.length + ' rebalances over 30 minutes', style: 'min-width:420px' },
      svg('line', { x1: 0, y1: 53, x2: 600, y2: 53, stroke: 'var(--line)', 'stroke-width': 1.5 }), bars,
      svg('text', { x: 0, y: 61, 'font-size': 10, fill: 'var(--mut)' }, '0'), svg('text', { x: 600, y: 61, 'font-size': 10, fill: 'var(--mut)', 'text-anchor': 'end' }, '30 min'));
    view.replaceChildren(picture);
    line.textContent = 'Each bar is one rebalance; bar height is the share of the ' + PARTS + ' partitions paused for about ' + DUR + ' s. Red bars come from poll timeouts, amber bars from the rolling restart. ' + (sT.value > sM.value ? 'The slowest batch (' + sT.value + ' s) outlasts max.poll.interval.ms (' + sM.value + ' s), so members keep being removed.' : 'Processing stays inside max.poll.interval.ms.') + (fixedIds === 'on' && rolling ? ' With static IDs a pod that returns within session.timeout.ms (45 s) reclaims its partitions without a rebalance, but they stay unread while it is down.' : '');
  }
  label();
  kbox(A, root, 'a batch that outlasts max.poll.interval.ms evicts the member and starts a rebalance, and cooperative assignment plus static IDs shrink the pause caused by rolling restarts.',
    [[sC, sT, sM], [stSeg, idSeg, rBtn], [btn('Reproduce the incident', () => { sC.value = 6; sT.value = 330; sM.value = 300; strat = 'eager'; stSeg.set('eager'); fixedIds = 'off'; idSeg.set('off'); rolling = true; label(); run(); }), btn('Apply the fix', () => { sT.value = 60; strat = 'coop'; stSeg.set('coop'); fixedIds = 'on'; idSeg.set('on'); run(); })]],
    [out, view, line], 'Illustrative model: 6 partitions, a 5 s pause per rebalance, a poll-timeout member rejoining 3 s after removal, and a pod restart of 10 s. Real rebalances also depend on group size and the assignor protocol rounds.');
  run();
};

/* ch9 · cleanup: retention, segment roll, compaction and tombstones */
PG.cleanup = function (root, A) {
  const { h, seg, slider, stat, btn } = A;
  const NOW = 250, RATE = 20, SEGB = 1024, RPH = 20, TOMB = 30;
  let policy = 'delete';
  const pSeg = seg([{ v: 'delete', l: 'cleanup.policy=delete' }, { v: 'compact', l: 'cleanup.policy=compact' }], policy, v => { policy = v; run(); });
  const sRet = slider('retention.ms', 6, 240, 24, 6, () => run(), v => v + ' h');
  const sSeg = slider('segment.ms', 1, 168, 168, 1, () => run(), v => v + ' h');
  const sLag = slider('consumer lag', 0, 200, 60, 2, () => run(), v => v + ' h');
  const sDel = slider('delete.retention.ms', 0, 48, 24, 2, () => run(), v => v + ' h');
  const out = stat([]), view = h('div'), line = h('p', { class: 'note' });
  function run() {
    if (policy === 'delete') {
      const R = Math.min(sSeg.value, SEGB / RATE), ends = [];
      for (let e = R; e < NOW; e += R) ends.push(e);
      const del = ends.filter(e => NOW - e > sRet.value).length, start = del ? ends[del - 1] : 0, disk = (NOW - start) * RATE;
      const gap = Math.max(0, start - (NOW - sLag.value)) * RPH;
      out.update([
        { l: 'disk used (MB, one partition)', v: kfmt(disk), cls: disk > 1500 ? 'bad' : 'ok' },
        { l: 'segments deleted', v: del },
        { l: 'keys retained', v: '—' },
        { l: 'consumer gap (k records missed)', v: kfmt(gap), cls: gap ? 'bad' : 'ok' }]);
      const total = ends.length + 1, groups = Math.min(total, 25), per = Math.ceil(total / groups), cells = [];
      for (let g = 0; g < groups; g++) {
        const a = g * per, b = Math.min(total, a + per) - 1, act = b === total - 1, gone = b < del;
        cells.push({ t: per > 1 ? '#' + a + '+' : '#' + a, s: act ? 'active' : gone ? 'deleted' : 'kept', k: act ? 'warn' : gone ? 'off' : 'ok' });
      }
      view.replaceChildren(kgrid(A, cells));
      line.textContent = 'Segments roll every ' + R.toFixed(0) + ' h (the smaller of segment.ms and the time to fill 1 GiB). Log start is at hour ' + start.toFixed(0) + ' of ' + NOW + '; the consumer reads from hour ' + (NOW - sLag.value) + '. The active segment is never deleted, so a long segment.ms keeps old data past retention.ms.';
    } else {
      const keep = sDel.value >= TOMB, stale = sLag.value > sDel.value ? 10 : 0, keys = 190 + (keep ? 10 : 0), disk = Math.round(190 * 1.5);
      out.update([
        { l: 'disk used (MB, one partition)', v: kfmt(disk), cls: 'ok' },
        { l: 'segments deleted', v: '—' },
        { l: 'keys retained (k)', v: keys },
        { l: 'consumer gap (k stale keys)', v: stale, cls: stale ? 'bad' : 'ok' }]);
      view.replaceChildren(kbars(A, [['clean part', 55, 'ok', 'one value per key'], ['dirty tail', 45, 'warn', 'not yet compacted (min.cleanable.dirty.ratio)'], ['tombstones', keep ? 100 : 4, keep ? 'warn' : 'bad', keep ? 'kept for ' + sDel.value + ' h' : 'purged after ' + sDel.value + ' h']]));
      line.textContent = 'A key deleted ' + TOMB + ' h ago is a tombstone. It survives ' + sDel.value + ' h (delete.retention.ms). A consumer that needs more than that to read the log from the start (' + sLag.value + ' h here) can miss the tombstone and keep the deleted key.';
    }
  }
  kbox(A, root, 'retention.ms 1 day does not delete a 5-day-old active segment, retention ignores slow consumers, and a tombstone can be purged before a slow reader sees it.',
    [[pSeg, sRet, sSeg], [sLag, sDel], [btn('Reproduce the incident', () => { policy = 'delete'; pSeg.set('delete'); sRet.value = 24; sSeg.value = 168; sLag.value = 60; sDel.value = 24; run(); }), btn('Apply the fix', () => { sRet.value = 96; sSeg.value = 12; sLag.value = 24; sDel.value = 48; run(); })]],
    [out, view, line], 'Illustrative model: one partition at 20 MB/h with 1 KB records, 1 GiB segments, a fixed time of 250 h, and 200k keys with 5% deleted 30 h ago. Real cleaners also run on a schedule and in dirty-ratio steps.');
  run();
};

/* ch10 · transactions: the crash matrix */
PG.transactions = function (root, A) {
  const { h, seg, stat, btn, logbox } = A;
  let mode = 'plainA', crash = 1, iso = 'read_uncommitted', zombie = false;
  const mSeg = seg([{ v: 'plainA', l: 'plain: produce, then commit offset' }, { v: 'plainB', l: 'plain: commit offset, then produce' }, { v: 'txn', l: 'transactional' }], mode, v => { mode = v; run(); });
  const cSeg = seg([{ v: 0, l: 'crash before produce' }, { v: 1, l: 'after produce' }, { v: 2, l: 'after offsets' }, { v: 3, l: 'after commit' }], crash, v => { crash = v; run(); });
  const iSeg = seg([{ v: 'read_uncommitted', l: 'read_uncommitted' }, { v: 'read_committed', l: 'read_committed' }], iso, v => { iso = v; run(); });
  const zBtn = btn('', () => { zombie = !zombie; label(); run(); });
  const label = () => { zBtn.textContent = 'Start zombie instance: ' + (zombie ? 'on' : 'off'); };
  const lg = logbox(), out = stat([]), view = h('div');
  function run() {
    let produced, committedOff, committedTx = false;
    if (mode === 'plainA') { produced = crash >= 1; committedOff = crash >= 2; }
    else if (mode === 'plainB') { committedOff = crash >= 1; produced = crash >= 2; }
    else { produced = crash >= 1; committedTx = crash >= 3; committedOff = committedTx; }
    const txn = mode === 'txn', again = !committedOff, entries = [], lines = [];
    lines.push('instance A reads order O5' + (txn ? ', calls initTransactions() and beginTransaction()' : ''));
    if (mode === 'plainB') { if (crash >= 1) lines.push('A commits the offset of O5'); if (crash >= 2) lines.push('A writes invoice I5'); }
    else {
      if (crash >= 1) lines.push('A writes invoice I5' + (txn ? ' inside the transaction' : ''));
      if (crash >= 2) lines.push(txn ? 'A calls sendOffsetsToTransaction()' : 'A commits the offset of O5');
      if (txn && crash >= 3) lines.push('A calls commitTransaction(): COMMIT markers written');
    }
    const done = txn ? crash >= 3 : crash >= 2;
    if (!done) lines.push('A crashes here');
    if (produced) entries.push({ who: 'A', st: txn && !committedTx ? 'aborted' : 'visible' });
    if (!done) {
      lines.push('instance B starts' + (txn ? ' with the same transactional.id: epoch bumped, the open transaction of A is aborted' : '') + ' and resumes from the committed offset');
      if (again) { lines.push('B reprocesses O5 and writes I5' + (txn ? ' in a new transaction that commits' : '')); entries.push({ who: 'B', st: 'visible' }); }
      else lines.push('the offset of O5 is already committed, so B skips it');
    }
    if (zombie) {
      if (txn) lines.push('zombie A wakes up and writes I5: ProducerFencedException, epoch is older'); else { lines.push('zombie A wakes up and writes I5 again: nothing stops it'); entries.push({ who: 'zombie', st: 'visible' }); }
    }
    const vis = entries.filter(e => e.st === 'visible').length + (iso === 'read_uncommitted' ? entries.filter(e => e.st === 'aborted').length : 0);
    const abortedVisible = txn && iso === 'read_uncommitted' ? entries.filter(e => e.st === 'aborted').length : 0;
    const lso = txn && iso === 'read_committed' && produced && !committedTx ? 3 : 0;
    out.update([
      { l: 'duplicate invoices', v: Math.max(0, vis - 1), cls: vis > 1 ? 'bad' : 'ok' },
      { l: 'lost invoices', v: vis === 0 ? 1 : 0, cls: vis === 0 ? 'bad' : 'ok' },
      { l: 'aborted records visible', v: abortedVisible, cls: abortedVisible ? 'bad' : 'ok' },
      { l: 'LSO lag until abort (records, illustrative)', v: lso, cls: lso ? 'bad' : 'ok' }]);
    let seen = 0; const cells = [];
    entries.forEach(e => {
      const shown = e.st === 'visible' || iso === 'read_uncommitted';
      if (shown) seen++;
      cells.push({ t: 'I5 ' + e.who, s: e.st === 'aborted' ? (shown ? 'aborted, visible' : 'filtered') : seen > 1 ? 'duplicate' : 'visible', k: !shown ? 'off' : seen > 1 || e.st === 'aborted' ? 'bad' : 'ok' });
      if (txn) cells.push({ t: e.st === 'aborted' ? 'ABORT' : 'COMMIT', s: 'marker', k: 'off' });
    });
    if (!cells.length) cells.push({ t: 'empty', s: 'no invoice', k: 'bad' });
    view.replaceChildren(h('p', { class: 'kfk-cap' }, 'Invoices partition as a ' + iso + ' reader sees it:'), kgrid(A, cells));
    lg.clear(); lines.forEach(l => lg.add(l, /crash|Fenced|nothing stops/.test(l) ? 'bad' : /COMMIT|commits/.test(l) ? 'ok' : 'mut'));
  }
  kbox(A, root, 'a crash after producing but before committing leaves a duplicate invoice in plain mode, while with transactions a read_committed reader sees the invoice once and a zombie is fenced.',
    [[mSeg, iSeg], [cSeg], [zBtn], [btn('Reproduce the incident', () => { mode = 'plainA'; mSeg.set('plainA'); crash = 1; cSeg.set(1); iso = 'read_uncommitted'; iSeg.set('read_uncommitted'); zombie = false; label(); run(); }), btn('Apply the fix', () => { mode = 'txn'; mSeg.set('txn'); iso = 'read_committed'; iSeg.set('read_committed'); run(); })]],
    [out, view, lg.el], 'Illustrative model: one input record, one invoice, one restart. It ignores timeouts: a real aborted transaction is closed when the new instance calls initTransactions() or when transaction.timeout.ms expires.');
  label(); run();
};

/* ch11 · kraft: quorum, epochs, fencing */
PG.kraft = function (root, A) {
  const { h, seg, stat, btn, logbox, player } = A;
  let n = 3, S, scenario = 'crashes', pc = 0;
  const lg = logbox(), out = stat([]), view = h('div'), line = h('p', { class: 'note' });
  const nSeg = seg([{ v: 3, l: '3 voters' }, { v: 4, l: '4 voters' }, { v: 5, l: '5 voters' }], n, v => { n = v; fresh(); });
  const scSeg = seg([{ v: 'crashes', l: 'scenario: two crashes' }, { v: 'split', l: 'scenario: network split' }], scenario, v => { scenario = v; fresh(); });
  const maj = () => Math.floor(n / 2) + 1;
  const reach = () => S.up.map((u, i) => u && i !== S.iso ? i : -1).filter(i => i >= 0);
  function fresh() {
    S = { up: Array.from({ length: n }, () => true), leader: 0, stale: -1, iso: -1, epoch: 1, committed: 0, uncommitted: 0, fenced: false, timer: 0 };
    pc = 0; lg.clear(); lg.add(n + ' voters, C1 is the active controller at epoch 1, brokers b1 to b3 registered', 'mut'); paint();
  }
  function elect() {
    const r = reach();
    if (r.length >= maj()) { S.leader = r[0]; S.epoch++; lg.add('election: C' + (S.leader + 1) + ' wins with ' + r.length + ' of ' + n + ' votes, epoch ' + S.epoch, 'ok'); }
    else { S.leader = -1; lg.add('no election possible: ' + r.length + ' reachable voter(s), a majority is ' + maj(), 'bad'); }
  }
  const act = {
    kill() { if (S.leader < 0) return lg.add('no active controller to kill', 'mut'); const k = S.leader; S.up[k] = false; S.leader = -1; lg.add('C' + (k + 1) + ' (active) is killed', 'bad'); elect(); },
    isolate() { if (S.leader < 0 || S.stale >= 0) return lg.add('need a connected active controller to isolate', 'mut'); S.stale = S.leader; S.iso = S.leader; S.leader = -1; lg.add('network split: C' + (S.stale + 1) + ' and broker b1 are cut off from everyone else', 'bad'); elect(); },
    heal() { if (S.iso < 0) return lg.add('nothing to heal', 'mut'); lg.add('network healed: C' + (S.iso + 1) + ' sees a higher epoch, steps down and truncates ' + S.uncommitted + ' uncommitted entr' + (S.uncommitted === 1 ? 'y' : 'ies'), 'ok'); S.uncommitted = 0; S.stale = -1; S.iso = -1; S.fenced = false; S.timer = 0; if (S.leader < 0) elect(); },
    propose() { if (S.leader < 0) return lg.add('proposal rejected: no active controller', 'bad'); S.committed++; lg.add('metadata record committed at offset ' + S.committed + ' by C' + (S.leader + 1) + ' (' + reach().length + ' of ' + n + ' acks, epoch ' + S.epoch + ')', 'ok'); },
    old() { if (S.stale < 0) return lg.add('there is no stale controller: isolate the active one first', 'mut'); S.uncommitted++; lg.add('stale C' + (S.stale + 1) + ' appends a record: 1 of ' + n + ' acks, not committed', 'bad'); },
    tick() { if (S.stale >= 0 && S.leader >= 0 && !S.fenced && ++S.timer >= 3) { S.fenced = true; lg.add('C' + (S.leader + 1) + ' fences broker b1: no heartbeat within broker.session.timeout.ms', 'bad'); } }
  };
  const SCRIPTS = { crashes: ['propose', 'kill', 'propose', 'kill', 'propose'], split: ['propose', 'isolate', 'tick', 'tick', 'tick', 'propose', 'old', 'heal', 'propose'] };
  function paint() {
    const cells = S.up.map((u, i) => ({ t: 'C' + (i + 1), s: !u ? 'down' : i === S.leader ? 'active · e' + S.epoch : i === S.stale ? 'stale leader' : i === S.iso ? 'cut off' : 'follower', k: !u ? 'off' : i === S.leader ? 'ok' : i === S.stale ? 'bad' : 'warn' }));
    const brokers = ['b1', 'b2', 'b3'].map((b, i) => ({ t: b, s: i === 0 && S.fenced ? 'fenced' : i === 0 && S.iso >= 0 ? 'cut off' : 'registered', k: i === 0 && S.fenced ? 'bad' : i === 0 && S.iso >= 0 ? 'warn' : 'ok' }));
    out.update([
      { l: 'active controller', v: S.leader < 0 ? 'none' : 'C' + (S.leader + 1), cls: S.leader < 0 ? 'bad' : 'ok' },
      { l: 'epoch', v: S.epoch },
      { l: 'committed metadata offset', v: S.committed },
      { l: 'brokers fenced', v: S.fenced ? 1 : 0, cls: S.fenced ? 'bad' : 'ok' }]);
    view.replaceChildren(h('p', { class: 'kfk-cap' }, 'Controller voters'), kgrid(A, cells), h('p', { class: 'kfk-cap' }, 'Brokers'), kgrid(A, brokers));
    line.textContent = n + ' voters: a majority is ' + maj() + ', so ' + (n - maj()) + ' failure(s) are tolerated. ' + (S.uncommitted ? S.uncommitted + ' entr' + (S.uncommitted === 1 ? 'y' : 'ies') + ' on the stale controller never commit.' : '');
  }
  function runAll() { fresh(); SCRIPTS[scenario].forEach(f => act[f]()); pc = SCRIPTS[scenario].length; paint(); }
  const wrap = f => () => { act[f](); paint(); };
  const play = player({ speed: 900, step() { if (pc >= SCRIPTS[scenario].length) fresh(); act[SCRIPTS[scenario][pc++]](); paint(); return pc < SCRIPTS[scenario].length; }, reset() { fresh(); } });
  kbox(A, root, 'with 4 voters one failure is tolerated, exactly as with 3, and a stale controller on the minority side can append but never commit.',
    [[nSeg, scSeg], [btn('Kill active controller', wrap('kill')), btn('Isolate active controller', wrap('isolate')), btn('Heal network', wrap('heal'))], [btn('Propose leader change', wrap('propose')), btn('Propose via old controller', wrap('old')), btn('Wait 3 s', wrap('tick')), play],
     [btn('Reproduce the incident', () => { n = 3; nSeg.set(3); scenario = 'crashes'; scSeg.set('crashes'); runAll(); }), btn('Apply the fix', () => { n = 5; nSeg.set(5); scenario = 'crashes'; scSeg.set('crashes'); runAll(); })]],
    [out, view, line, lg.el], 'Illustrative model: no log replication details, instant elections, one stale controller at most, and a 3 s broker session timeout. Real KRaft elections use randomised timeouts and vote requests.');
  fresh();
};
</script>
<script>

    (v.bars || []).map(b => h('div', { class: 'vrow' }, h('span', { class: 'vl' }, b[0]), h('div', { class: 'vbar' }, h('div', { class: 'vtrack' }, h('i', { class: b[2] || '', style: 'width:' + Math.max(1.5, b[1]) + '%' })), h('span', { class: 'vt' }, b[3])))),

function commonSection(c, numEl) {

/* ---- problem-based amendment: predict before the mechanism. Keep byte-identical on all six pages ---- */
function predictBlock(c, numEl) {
  const P = c.predict;
  const why = h('p', { class: 'note why', html: '<b>Why:</b> ' + P.why });
  why.hidden = true;
  const opts = h('div', { class: 'opts', role: 'group', 'aria-label': 'Choose a prediction' });
  P.opts.forEach((o, k) => opts.append(h('button', { html: o, onclick() {
    [...opts.children].forEach((b, j) => { b.disabled = true; b.classList.toggle('right', j === P.ans); b.classList.toggle('wrong', j === k && k !== P.ans); });
    why.hidden = false;
  } })));
  return h('section', { class: 'blk quiz' }, h('h3', {}, numEl, 'Predict before you read on'), h('p', { class: 'q', html: P.q }), opts, why);
}
function chapter(i) {

  document.title = (i + 1) + '. ' + p.t + ' · ' + COURSE.title;
  const ideaBlock = () => h('section', { class: 'blk' }, h('h3', {}, num(), 'The idea'), h('ul', { class: 'idea', html: c.idea.map(x => '<li>' + x + '</li>').join('') }));
  const pgbox = h('div', { class: 'pg' });
  const nav = h('div', { class: 'pn' },
    i > 0 ? h('button', { onclick: () => { location.hash = 'ch' + (i - 1); } }, '← ' + i + '. ' + PHASES[i - 1].t) : h('button', { onclick: () => { location.hash = ''; } }, '← All chapters'),
    i < CHAPTERS.length - 1 ? h('button', { class: 'primary', onclick: () => { location.hash = 'ch' + (i + 1); } }, (i + 2) + '. ' + PHASES[i + 1].t + ' →') : (COURSE.other ? h('a', { class: 'btn primary', href: COURSE.other.href, style: 'text-decoration:none;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:10px;background:var(--acc);color:var(--on-brand,#fff);font-weight:600;font-size:14px' }, COURSE.other.label + ' →') : h('button', { onclick: () => { location.hash = ''; } }, 'All chapters')));
  if (c.layout === 'custom') {
    const customRoot = h('main', { class: 'course-custom' });
    app.replaceChildren(topbar(true), h('div', { class: 'wrap' },
      h('div', { class: 'chhead', style: '--pc:' + pc(i) }, h('div', { class: 'n' }, i + 1), h('div', {}, h('small', {}, (COURSE.flat ? COURSE.title : P.name) + ' · chapter ' + (i + 1) + ' of ' + CHAPTERS.length), h('h1', {}, p.t))),
      customRoot, nav));
    try { PG[c.pg](customRoot, API); } catch (e) { console.error(e); customRoot.append(h('div', { class: 'callout warn' }, 'Custom chapter failed to load: ' + e.message)); }
    scrollTo(0, 0);
    return;
  }
  app.replaceChildren(topbar(true), h('div', { class: 'wrap' },
    h('div', { class: 'chhead', style: '--pc:' + pc(i) }, h('div', { class: 'n' }, i + 1), h('div', {}, h('small', {}, (COURSE.flat ? COURSE.title : P.name) + ' · chapter ' + (i + 1) + ' of ' + CHAPTERS.length), h('h1', {}, p.t))),
    h('section', { class: 'blk' }, h('h3', {}, num(), 'The problem'), h('div', { class: 'prob' }, h('div', { html: c.scene.map(x => '<p>' + x + '</p>').join('') }), h('p', { class: 'q' }, c.ask))),
    c.predict ? predictBlock(c, num()) : null,
c.archSteps ? null : ideaBlock(),
    ...(c.walks || (c.walk ? [c.walk] : [])).map(w => h('section', { class: 'blk' }, h('h3', {}, num(), w.title), walkAnim(w))),
    h('section', { class: 'blk' }, h('h3', {}, num(), c.archSteps ? c.archTitle : c.arch ? (c.pg ? 'Overall architecture and playground' : 'Overall architecture') : 'Playground'), c.arch ? (c.archSteps ? archAnim(c.arch, c.archSteps) : diagram(c.arch)) : null, c.archNote ? h('p', { class: 'archnote', html: c.archNote }) : null, c.pg ? pgbox : null),
    commonSection(c, num()),
    nav));
  if (c.pg) try { PG[c.pg](pgbox, API); } catch (e) { console.error(e); pgbox.append(h('div', { class: 'callout warn' }, 'Playground failed to load: ' + e.message)); }
  scrollTo(0, 0);
}
function route() {
  stopTimers();
  const m = /^#ch(\d+)$/.exec(location.hash);
  if (m && +m[1] < CHAPTERS.length) chapter(+m[1]); else overview();
}
addEventListener('hashchange', route);
route();
</script>
