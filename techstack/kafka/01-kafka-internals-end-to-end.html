 pg:'isr',
 common:[
 {tab:'acks=1 loss',t:'acks=1 loses an acknowledged record',sym:'Producers saw success for every record, but after a failover some of those records are gone from the topic.',
  ctx:'A producer uses <code>acks=1</code> for speed. The leader acknowledges after its own append and then crashes before followers fetch the newest records.',
  why:'With <code>acks=1</code> the leader replies before any follower has the record. An in-sync follower with a shorter log is elected, so records above its log end are lost. The high watermark only counts replicas that have the data.',
  log:{text:'-- representative output, values illustrative\nProducer: ack for offsets 4-5 received\nNew leader (follower): log end offset = 4',note:'Illustrative trace of the failover; Kafka does not log a lost-record line. Source: '+SRC.ha},
  viz:{bad:{rows:[row('log offsets',['0','ok'],['1','ok'],['2','ok'],['3','ok'],['4 acked, gone','bad'],['5 acked, gone','bad']),row('marks',['HW = 4','off',4],['acked 0-5 (acks=1)','bad',2])],cap:'Offsets 4 and 5 were acknowledged by the leader alone and vanish on failover.'},
       good:{rows:[row('log offsets',['0','ok'],['1','ok'],['2','ok'],['3','ok'],['4 not acked','warn'],['5 not acked','warn']),row('marks',['HW = 4','off',4],['acks=all: acked 0-3, retry the rest','ok',2])],cap:'Only offsets at or below the high watermark are acknowledged; the rest are retried.'}},
  fix:['Measure first: compare the offsets the producers saw acknowledged with the new leader’s log end offset after a failover.','Fix: use <code>acks=all</code> with <code>replication.factor=3</code> and <code>min.insync.replicas=2</code> for data that must not be lost.','Fix: keep <code>unclean.leader.election.enable=false</code> so an out-of-sync replica cannot become leader, and retry on failure with idempotence on.','Trade-off: <code>acks=all</code> waits for the slowest in-sync replica, so latency rises; with <code>min.insync.replicas=2</code> the partition rejects writes when only one replica is in sync.','Verify: kill the leader mid-stream and check that every acknowledged offset is present on the new leader.']},
 {tab:'NOT_ENOUGH_REPLICAS',t:'NOT_ENOUGH_REPLICAS rejects writes',sym:'Produce requests fail even though the leader is healthy; consumers can still read.',
  ctx:'A topic uses <code>replication.factor=3</code>, <code>min.insync.replicas=2</code> and <code>acks=all</code>. Two of the three replicas fall out of sync during a rolling restart.',
  why:'With <code>acks=all</code> the leader refuses writes when the ISR has fewer than <code>min.insync.replicas</code> members. That is the guard that stops an acknowledged record from existing on a single copy.',
  log:{text:'-- representative output, wording varies by version\nNotEnoughReplicasException: Messages are rejected since there are fewer in-sync replicas than required.\nkafka.server:type=ReplicaManager,name=UnderMinIsrPartitionCount > 0',note:'Documented exception and broker metric; message wording can vary by version. Source: '+SRC.monitoring},
  viz:{bad:{rows:[row('broker 1 (leader)',['in ISR · 1 < min 2','bad',2]),row('broker 2',['out of sync','bad',2]),row('broker 3',['down','off',2])],cap:'Only 1 replica is in sync, below <code>min.insync.replicas=2</code>: writes are rejected.'},
       good:{rows:[row('broker 1 (leader)',['in ISR','ok',2]),row('broker 2',['caught up · in ISR','ok',2]),row('broker 3',['down','off',2])],cap:'Two in-sync replicas: <code>acks=all</code> succeeds again.'}},
  fix:['Measure first: list the under-min-ISR partitions and find which replicas are out of sync and why (down broker, slow disk, network).','Fix: restore or replace the missing replica so the ISR grows back to at least <code>min.insync.replicas</code>.','Fix: restart brokers one at a time and wait for <code>UnderReplicatedPartitions</code> to reach 0 before the next one; do not lower <code>min.insync.replicas</code> as a quick fix unless losing that guarantee is acceptable.','Trade-off: a higher <code>min.insync.replicas</code> trades availability for durability, because the partition stops accepting writes sooner; <code>min.insync.replicas=1</code> keeps writing on one copy.','Verify: <code>UnderMinIsrPartitionCount</code> returns to 0 and produce errors stop.']},
 {tab:'ISR flapping',t:'Slow follower flaps in and out of the ISR',sym:'Under-replicated partitions blink on and off; acks=all latency spikes whenever the follower is in the ISR.',
  ctx:'One follower sits on a busy disk or a congested link and can barely keep up with the leader.',
  why:'A follower that has not caught up to the leader’s log end within <code>replica.lag.time.max.ms</code> is removed from the ISR, then re-added when it catches up. Every shrink and expand is a metadata update, and <code>acks=all</code> waits for the slow member while it is in.',
  log:{text:'-- representative output, values illustrative\nkafka.server:type=ReplicaManager,name=IsrShrinksPerSec  non-zero\nkafka.server:type=ReplicaManager,name=IsrExpandsPerSec  non-zero\nUnderReplicatedPartitions oscillating',note:'Documented broker metrics; the oscillation pattern is illustrative. Source: '+SRC.monitoring},
  viz:{bad:{rows:[row('ISR over time',['0:00 {1,2,3}','ok'],['0:31 {1,2}','bad'],['0:40 {1,2,3}','ok'],['1:10 {1,2}','bad'])],cap:'The ISR keeps shrinking and expanding around the slow follower.'},
       good:{rows:[row('ISR over time',['0:00 slow disk replaced','ok'],['0:05 fetching in time','ok'],['1:00 {1,2,3}','ok'],['2:00 stable','ok'])],cap:'Once the follower keeps up, the ISR is stable.'}},
  fix:['Measure first: find the slow broker from fetcher lag, disk latency, network and GC metrics.','Fix: fix or move the underlying bottleneck rather than raising the timeout, and spread replicas so no broker carries a disproportionate share.','Fix: tune <code>replica.lag.time.max.ms</code> only to match a known, bounded stall.','Trade-off: a larger <code>replica.lag.time.max.ms</code> keeps a slow follower in the ISR longer, so there are fewer flaps but higher <code>acks=all</code> latency and a longer wait before the ISR reflects reality.','Verify: <code>IsrShrinksPerSec</code> and <code>IsrExpandsPerSec</code> return to about 0 and <code>UnderReplicatedPartitions</code> stays at 0.']},
 {tab:'Unclean election',t:'Unclean leader election truncates acknowledged data',sym:'After all in-sync replicas were down, the partition came back, but some acknowledged records are missing and consumers see offsets rewind.',
  ctx:'A topic was set to <code>unclean.leader.election.enable=true</code> “so the partition never stays offline”. The leader and the other in-sync replica both fail, and only an out-of-sync follower returns.',
  why:'With unclean election the controller may pick a replica that is not in the ISR. It becomes leader with a shorter log. Records acknowledged by the old leader but not present on it are lost, and when the old replicas return they truncate to the new leader’s log.',
  log:{text:'-- representative output, values illustrative\nkafka.controller:type=ControllerStats,name=UncleanLeaderElectionsPerSec  > 0\nold leader returns: truncating to offset 8120 (new leader log end), 74 records dropped',note:'The metric is documented; the truncation line is paraphrased. Source: '+SRC.ha},
  viz:{bad:{rows:[row('replicas',['b1 · LEO 8194 (dead)','off'],['b2 · LEO 8194 (dead)','off'],['b3 · LEO 8120 → leader','bad',2]),row('result',['74 acked records lost','bad',3])],cap:'The only live replica was behind, and it became leader.'},
       good:{rows:[row('replicas',['b1 · LEO 8194 (dead)','off'],['b2 · LEO 8194 (back)','ok'],['b3 · LEO 8120 (waits)','warn']),row('result',['partition offline until b1 or b2 returns; nothing lost','ok',3])],cap:'With unclean election off, the partition waits for an in-sync replica.'}},
  fix:['Measure first: check <code>UncleanLeaderElectionsPerSec</code> and the topic’s <code>unclean.leader.election.enable</code> setting.','Fix: keep <code>unclean.leader.election.enable=false</code> for any data that must not be lost, and restore an in-sync replica to bring the partition back.','Fix: if some topics really prefer availability (for example disposable metrics), enable it per topic only.','Trade-off: with it off, the partition is unavailable until an in-sync replica returns; with it on you choose availability over consistency.','Verify: after a multi-broker failure test, the leader is always an ex-ISR member and no acknowledged offset disappears.']}
 ]},
{ask:'New brokers were added, and moving partitions onto them saturated the network so producers timed out. How do we move data safely?',
 why:'Moving a partition is just replication, so it competes with client traffic for the same disks and network.',
 principle:'Grow by adding a replica, let it catch up, then drop the old one, and cap the copy bandwidth.',
 design:'Reassign replica sets with a throttle, restore leadership with preferred leader election, and spread replicas across racks.',
 scene:['A three-broker cluster runs at 70% network at peak (illustrative). Three new brokers are added, and an engineer generates a plan that moves 3 TB (illustrative) onto them and runs it at 14:00 without a throttle.','Produce p99 goes from 8 ms to 900 ms (illustrative), followers drop out of the ISR and some producers log timeouts. When the move finishes, the new brokers hold data but traffic is still skewed, because leaders stayed on brokers 1 and 2.'],
 predict:{q:'During a reassignment, when does the new replica start to serve as leader?',
  opts:['As soon as the plan is submitted','Only after it has joined the ISR and leadership has moved to it','After the old replica is deleted, without a catch-up'],ans:1,
  why:'A new replica first fetches the log like any follower. It can lead only once it is in the ISR and a leader election (or the preferred-replica order) selects it.'},
 idea:['<b>Add, catch up, remove:</b> <code>kafka-reassign-partitions.sh --execute</code> adds the target replicas, they fetch the log, join the ISR, and then the old replicas are dropped.','<b>Throttle:</b> <code>--throttle</code> caps inter-broker replication traffic in bytes/s (through <code>leader.replication.throttled.rate</code> and <code>follower.replication.throttled.rate</code>); <code>--verify</code> removes it afterwards.','<b>Preferred leader:</b> the first replica in the list. <code>auto.leader.rebalance.enable</code> lets the controller move leadership back, and <code>kafka-leader-election.sh --election-type PREFERRED</code> does it on demand.','<b>Rack awareness:</b> <code>broker.rack</code> lets Kafka place replicas of a partition in different racks or zones.','<b>Limit:</b> a throttle set too low can leave a new replica unable to catch up while producers keep writing.'],
 arch:{w:540,h:220,cap:'A move is an extra replica that catches up under a throttle, then the old replica is removed.',
  boxes:[['plan',10,80,120,60,'Reassignment\nplan (JSON)',0],['ctl',180,80,130,60,'Controller\nreplica set',1],['new',380,10,140,60,'New replica\nfetches the log',2],['old',380,150,140,60,'Old replica\nremoved last',3]],
  arrows:[['plan','ctl','1 execute'],['ctl','new','2 add, throttled'],['ctl','old','3 drop',true]]},
 pg:'reassign',
 common:[
 {tab:'Saturated cluster',t:'Reassignment saturates the cluster',sym:'Produce and fetch latency rise and followers drop out of the ISR while data is being copied.',
  ctx:'To use new brokers, an operator reassigns hundreds of partitions at once during peak traffic.',
  why:'A move is just replication: the new replica fetches the full committed log from the leader. Unthrottled, that copy competes with client traffic and with normal follower fetches for the same network and disk.',
  log:{text:'-- representative output, values illustrative\nkafka-reassign-partitions.sh --bootstrap-server broker:9092 --reassignment-json-file plan.json --execute   (no --throttle)\nNetwork and disk saturated; UnderReplicatedPartitions climbing',note:'Documented command; saturation figures are illustrative. Source: '+SRC.expansion},
  viz:{bad:{bars:[['broker 1',95,'bad','95% of NIC'],['broker 2',92,'bad','92%'],['broker 3',90,'bad','90%'],['broker 4 (new)',98,'bad','98%']],cap:'The copy competes with client traffic for the same network (illustrative).'},
       good:{bars:[['broker 1',62,'ok','62% of NIC'],['broker 2',60,'ok','60%'],['broker 3',58,'ok','58%'],['broker 4 (new)',40,'ok','40%']],cap:'A throttle leaves headroom for producers and consumers (illustrative).'}},
  fix:['Measure first: check network and disk utilisation per broker, and the client p99 latency, while the reassignment runs.','Fix: re-run with <code>--throttle</code> (inter-broker bytes/s) so clients keep their bandwidth.','Fix: move a few partitions at a time, preferably off-peak, and watch the ISR and latency during the move.','Trade-off: a throttle makes the move slower and keeps old replicas around longer; a throttle that is too low can leave a new replica unable to catch up while producers keep writing.','Verify: client latency stays flat during the move, and the throttle is removed after <code>--verify</code> reports completion.']},
 {tab:'Leader skew',t:'Leaders stay piled on a few brokers after restarts',sym:'One or two brokers carry most of the traffic and CPU, although partitions are evenly spread.',
  ctx:'After rolling restarts, each partition’s leadership moved to a surviving replica and never moved back.',
  why:'Replica placement and leadership are separate. After a restart the leader is whichever replica is in the ISR, not the preferred (first) replica. Until leadership is rebalanced, the brokers that stayed up keep leading.',
  log:{text:'-- representative output, values illustrative\nkafka-topics.sh --bootstrap-server broker:9092 --describe --topic orders\nTopic: orders  Partition: 0  Leader: 1  Replicas: 3,1,2  Isr: 3,1,2\nTopic: orders  Partition: 1  Leader: 1  Replicas: 2,3,1  Isr: 2,3,1',note:'The preferred leader is the first broker in <code>Replicas</code>; here the actual leader differs. Source: '+SRC.expansion},
  viz:{bad:{bars:[['leaders on broker 1',75,'bad','45 of 60'],['leaders on broker 2',17,'ok','10'],['leaders on broker 3',8,'ok','5']],cap:'Broker 1 leads most partitions (illustrative).'},
       good:{bars:[['leaders on broker 1',33,'ok','20 of 60'],['leaders on broker 2',33,'ok','20'],['leaders on broker 3',33,'ok','20']],cap:'Preferred leader election restores an even spread (illustrative).'}},
  fix:['Measure first: count leaders per broker with <code>kafka-topics.sh --describe</code>, and compare Leader with the first entry of Replicas.','Fix: keep <code>auto.leader.rebalance.enable=true</code> (the default), or run <code>kafka-leader-election.sh --election-type PREFERRED --all-topic-partitions</code> after the restarts.','Fix: restart brokers one at a time and wait for the ISR to recover before the next, so leadership moves are small.','Trade-off: each leader election briefly interrupts the partition, so run it off-peak on very large clusters.','Verify: leaders per broker are within a few percent of each other and the busiest broker’s CPU drops.']},
 {tab:'Single rack',t:'Without broker.rack, all replicas can sit in one rack or zone',sym:'A zone outage takes entire partitions offline although each partition has three replicas.',
  ctx:'Brokers run in three zones, but <code>broker.rack</code> was never set, so the placement algorithm treats all brokers as equal.',
  why:'Rack-aware placement needs to know each broker’s rack. Without it, the three replicas of a partition may all land on brokers of the same zone, and one zone failure removes every copy.',
  log:{text:'-- representative output, values illustrative\npartition orders-5: Replicas 1,2,3 (all in zone-a)\nzone-a outage -> kafka.controller:type=KafkaController,name=OfflinePartitionsCount = 12',note:'<code>OfflinePartitionsCount</code> is a documented controller metric; the placement is an illustration. Source: '+SRC.expansion},
  viz:{bad:{rows:[row('partition orders-5',['b1 zone-a','bad'],['b2 zone-a','bad'],['b3 zone-a','bad']),row('zone-a down',['all replicas gone: partition offline','bad',3])],cap:'All replicas share one failure domain.'},
       good:{rows:[row('partition orders-5',['b1 zone-a','bad'],['b4 zone-b','ok'],['b5 zone-c','ok']),row('zone-a down',['leader moves to zone-b: partition online','ok',3])],cap:'Replicas span zones, so one zone can fail.'}},
  fix:['Measure first: compare each partition’s replica list with the rack of each broker (<code>broker.rack</code>) to find partitions with all replicas in one rack.','Fix: set <code>broker.rack</code> on every broker to its zone and restart them in a rolling fashion.','Fix: new topics follow rack-aware placement automatically; move existing partitions with a throttled reassignment.','Trade-off: cross-zone replication costs network and adds follower latency; consumers may fetch across zones unless rack-aware fetching is configured.','Verify: no partition has all replicas in one rack, and a zone-failure test keeps every partition online.']}
 ]},
{ask:'Twelve teams read the same topic. After a crash, billing skipped some orders and replayed others. Where is each reader’s position kept?',
 why:'A log that is not deleted on read needs every reader to remember its own place.',
 principle:'Make position the reader’s durable state, and let the commit point decide what a crash repeats or skips.',
 design:'Commit offsets per group, topic and partition to __consumer_offsets, and choose commit placement for at-most-once or at-least-once.',
 scene:['Twelve teams read <code>orders</code>, each in its own consumer group. The billing consumer polls batches of 500 records and writes invoices to a database. It runs with defaults, so <code>enable.auto.commit=true</code> with a 5-second interval.','A pod is OOM-killed in the middle of a batch. After the restart billing is missing invoices for some orders, and a similar crash in another service produced duplicate invoices. Both services use the same client library.'],
 predict:{q:'A consumer commits the offset of a batch before processing it and then crashes halfway through the batch. After the restart, the unprocessed records are:',
  opts:['Reprocessed, because the group replays the batch','Skipped, because the committed offset is already past them','Delivered to another group instead'],ans:1,
  why:'A restart resumes from the committed offset. Committing first moves it past records that were never processed, which is at-most-once.'},
 idea:['<b>Reading does not delete:</b> every group keeps its own committed offset per partition, so twelve teams read independently.','<b>Position and commit:</b> the fetch position advances with <code>poll()</code>; the committed offset is what a restart resumes from.','<b>Where it lives:</b> commits are records in the internal compacted topic <code>__consumer_offsets</code>, keyed by group, topic and partition.','<b>Commit placement:</b> commit before processing for at-most-once, after processing for at-least-once. <code>enable.auto.commit</code> with <code>auto.commit.interval.ms</code> commits on a timer inside <code>poll()</code>.','<b>No committed offset:</b> <code>auto.offset.reset</code> (<code>latest</code> by default, <code>earliest</code> or <code>none</code>) decides where a new group starts.'],
 arch:{w:560,h:220,cap:'Where the commit sits relative to processing decides what a crash repeats or skips.',
  boxes:[['log',10,80,130,60,'Partition log\noffsets 0..N',0],['cons',200,80,130,60,'Consumer\nfetch position',1],['proc',400,10,140,60,'Process\nside effects',2],['off',400,150,140,60,'__consumer_offsets\ncommitted offset',3]],
  arrows:[['log','cons','1 poll'],['cons','proc','2 process'],['cons','off','3 commit']]},
 pg:'offsets',
 common:[
 {tab:'Commit placement',t:'Commit placement: skipped or duplicated records',sym:'After a restart, either some records were never processed, or the last few are processed twice.',
  ctx:'A consumer crashes in the middle of a batch. Whether work is lost or repeated depends on when it committed offsets.',
  why:'A restart resumes from the committed offset. Committing before processing gives at-most-once (a crash skips records); committing after gives at-least-once (a crash repeats everything since the last commit). Auto-commit can commit offsets of records that have not finished processing.',
  log:{text:'-- representative output, values illustrative\nenable.auto.commit=true, auto.commit.interval.ms=5000\nkafka-consumer-groups.sh --bootstrap-server broker:9092 --describe --group billing\n  CURRENT-OFFSET ahead of or behind the real progress',note:'Documented configs and CLI; the exact offsets depend on timing. Source: '+SRC.position},
  viz:{bad:{rows:[row('offsets',['0','ok'],['1','ok'],['2','ok'],['3 skipped','bad'],['4 skipped','bad'],['5 skipped','bad'],['6','warn'],['7','warn']),row('marks',['crash after 2','bad',2],['resume at committed = 6','bad',2])],cap:'Committed before processing: records 3 to 5 are skipped after the crash.'},
       good:{rows:[row('offsets',['0','ok'],['1','ok'],['2','ok'],['3 again','warn'],['4 again','warn'],['5','off'],['6','off'],['7','off']),row('marks',['resume at committed = 3','ok',2],['crash after 4','warn',2])],cap:'Committed after processing: records 3 and 4 are repeated, never skipped.'}},
  fix:['Measure first: compare <code>CURRENT-OFFSET</code> from <code>kafka-consumer-groups.sh --describe</code> with the application’s real progress after a crash.','Fix: disable auto-commit for work with side effects and commit after processing succeeds.','Fix: make processing idempotent (a dedupe key or an upsert) so a replay is harmless; for Kafka-to-Kafka pipelines commit the offset inside a transaction with the output (chapter 11).','Trade-off: committing more often reduces duplicates but costs more commit requests; at-least-once always needs an idempotent consumer.','Verify: crash a consumer mid-batch, then check that no offset is skipped and any repeat is absorbed by idempotent processing.']},
 {tab:'Async + auto-commit',t:'Auto-commit with asynchronous processing commits unfinished work',sym:'The group shows zero lag, yet after a crash a few hundred records were never processed.',
  ctx:'The consumer hands each polled record to a worker pool and returns to <code>poll()</code> quickly. Auto-commit is on.',
  why:'Auto-commit commits the offsets returned by earlier <code>poll()</code> calls, not the work that finished. When processing is asynchronous, the committed offset runs ahead of completed work, and a crash loses whatever was still queued.',
  log:{text:'-- representative output, values illustrative\nkafka-consumer-groups.sh --describe --group billing\n  CURRENT-OFFSET 1500  LOG-END-OFFSET 1500  LAG 0\napplication: 412 records still in the worker queue',note:'The tool reports committed progress; it cannot see the application queue. Source: '+SRC.consumer},
  viz:{bad:{bars:[['polled',100,'warn','1500'],['committed',100,'bad','1500'],['finished',73,'ok','1088']],cap:'The committed offset is ahead of finished work (illustrative).'},
       good:{bars:[['polled',100,'warn','1500'],['finished',73,'ok','1088'],['committed',73,'ok','1088']],cap:'Only finished work is committed (illustrative).'}},
  fix:['Measure first: compare the group’s committed offset with the number of records the application has fully processed.','Fix: set <code>enable.auto.commit=false</code> and call <code>commitSync</code> or <code>commitAsync</code> with the offsets of work that has completed.','Fix: track completed offsets per partition, and use <code>pause()</code> and <code>resume()</code> to bound the queue while still calling <code>poll()</code>.','Trade-off: a manual commit path is more code, and out-of-order completion means you can commit only the contiguous prefix.','Verify: after a forced crash, no record is missing and any replays are handled by idempotent processing.']},
 {tab:'Reset = latest',t:'A new group with auto.offset.reset=latest silently skips the backlog',sym:'A new consumer group starts, shows no errors, and processes none of the 4 million historical events.',
  ctx:'A team creates group <code>invoice-v2</code> to rebuild a table from <code>orders</code>. The client keeps the default <code>auto.offset.reset=latest</code>.',
  why:'A group with no committed offset starts at the position given by <code>auto.offset.reset</code>. <code>latest</code> means the log end at the time of the first fetch, so everything before it is ignored without any error. <code>earliest</code> replays from the start, and <code>none</code> throws an exception.',
  log:{text:`-- representative output, wording varies by version
kafka-consumer-groups.sh --bootstrap-server broker:9092 --describe --group invoice-v2
Consumer group 'invoice-v2' has no active members.
(auto.offset.reset=none) NoOffsetForPartitionException: Undefined offset with no reset policy for partitions: [orders-0]`,note:'The second line is what a client with <code>auto.offset.reset=none</code> reports for a group without a committed offset. Source: '+SRC.consumer},
  viz:{bad:{rows:[row('offsets',['0 to 3,999,999','off',4],['start here (latest)','bad',2]),row('result',['backlog skipped silently','bad',6])],cap:'The new group begins at the log end.'},
       good:{rows:[row('offsets',['start here (earliest)','ok',2],['0 to 3,999,999 replayed','ok',4]),row('result',['backlog processed','ok',6])],cap:'The new group begins at the log start.'}},
  fix:['Measure first: check whether the group has committed offsets (<code>kafka-consumer-groups.sh --describe</code>) and what <code>auto.offset.reset</code> the client uses.','Fix: set <code>auto.offset.reset=earliest</code> for groups that must read history, or set <code>none</code> to fail fast and decide explicitly.','Fix: to start from a chosen point, reset offsets with <code>kafka-consumer-groups.sh --reset-offsets</code> while the group is inactive.','Trade-off: <code>earliest</code> can cause a large replay load and duplicates in downstream systems; <code>latest</code> is right for groups that only care about new events.','Verify: lag for the new group starts at the backlog size and falls as it catches up.']}
 ]},
{ask:'Every few minutes all consumers in the group stop for 30 seconds and lag climbs. What makes the group reshuffle itself?',
 why:'Each partition must be owned by exactly one live member, so any membership change forces a new assignment.',
 principle:'Detect liveness with two clocks, heartbeat and poll, and keep reassignments small and rare.',
 design:'A group coordinator runs JoinGroup and SyncGroup and bumps the generation; cooperative assignment and static membership shrink the pause.',
 scene:['The group <code>fulfilment</code> has 6 consumers on a 6-partition topic. Each consumer calls a slow partner API for every record. Most batches finish in seconds, but a few take several minutes (illustrative).','Dashboards show the group flapping: every few minutes consumption stops for about 30 s (illustrative), then resumes, and lag grows steadily. Consumer logs say the member left the group because its poll timeout expired, while the brokers are healthy.'],
 predict:{q:'Processing one polled batch takes longer than <code>max.poll.interval.ms</code>. What happens?',
  opts:['Nothing, because heartbeats keep the member alive','The member is removed from the group and a rebalance starts','The broker closes the connection and commits the batch'],ans:1,
  why:'Heartbeats run on a background thread, but the group also requires <code>poll()</code> to be called within <code>max.poll.interval.ms</code>. If not, the member leaves the group and its partitions are reassigned.'},
 idea:['<b>Group coordinator:</b> one broker per group tracks the members, runs <code>JoinGroup</code> and <code>SyncGroup</code>, and increments the generation on every membership change.','<b>Two liveness clocks:</b> heartbeats must reach the coordinator within <code>session.timeout.ms</code> (45 s by default), and <code>poll()</code> must be called within <code>max.poll.interval.ms</code> (5 minutes by default). <code>max.poll.records</code> bounds the work between polls.','<b>Eager versus cooperative:</b> an eager rebalance revokes every partition first. <code>CooperativeStickyAssignor</code> (KIP-429) moves only the partitions that change owner.','<b>Static membership:</b> <code>group.instance.id</code> (KIP-345) lets a restarted member reclaim its partitions without a rebalance if it returns within <code>session.timeout.ms</code>.','<b>Parallelism limit:</b> a partition belongs to one member at a time, so members beyond the partition count sit idle.'],
 arch:{w:580,h:220,cap:'Members join, the coordinator picks a leader that computes the assignment, and the generation number changes.',
  boxes:[['c1',10,10,110,50,'Consumer 1',0],['c2',10,85,110,50,'Consumer 2',1],['c3',10,160,110,50,'Consumer 3',2],['gc',210,85,160,60,'Group coordinator\ngeneration N',3],['asg',440,85,130,60,'Assignment\np0 to p5',4]],
  arrows:[['c1','gc','1 join'],['c2','gc','',true],['c3','gc','',true],['gc','asg','2 assign']]},
 pg:'rebalance',
 common:[
 {tab:'Rebalance storm',t:'Rebalance storm: processing outlasts max.poll.interval.ms',sym:'Group members repeatedly leave and rejoin; throughput collapses and lag climbs.',
  ctx:'Consumers process each polled batch with slow downstream calls. One batch occasionally takes longer than <code>max.poll.interval.ms</code>.',
  why:'If <code>poll()</code> is not called again within <code>max.poll.interval.ms</code>, the member is removed and its partitions are reassigned. It rejoins, receives the same slow work, times out again, and the group never settles. Heartbeats run on a separate thread and do not prevent this.',
  log:{text:'-- representative output, wording varies by client version\nMember consumer-fulfilment-1 sending LeaveGroup request to coordinator ... due to consumer poll timeout has expired.\nCommitFailedException: ... the group has already rebalanced and assigned the partitions to another member.\nconsumer-coordinator-metrics: rebalance-total increasing',note:'Representative client messages and a documented coordinator metric; exact wording varies by client version. Source: '+SRC.kip429},
  viz:{bad:{rows:[row('timeline',['poll() batch takes 6 min','bad',2],['5 min: no poll, removed','bad',2],['rebalance, rejoin, same batch','bad',2],['lag grows','bad'])],cap:'Each slow batch triggers another rebalance.'},
       good:{rows:[row('timeline',['smaller batch or worker pool','ok',2],['poll() every ~20 s','ok',2],['steady: no rebalance','ok',2],['lag drains','ok'])],cap:'Polling stays inside the interval; ownership is stable.'}},
  fix:['Measure first: watch <code>rebalance-total</code> and the time between <code>poll()</code> calls against <code>max.poll.interval.ms</code>.','Fix: lower <code>max.poll.records</code> so a batch finishes comfortably inside the interval, or raise <code>max.poll.interval.ms</code>.','Fix: move slow work to a worker pool and use <code>pause()</code> and <code>resume()</code> while keeping <code>poll()</code> running; use <code>CooperativeStickyAssignor</code> so only moved partitions pause.','Trade-off: a longer <code>max.poll.interval.ms</code> also delays detection of a genuinely stuck consumer; static membership delays reassignment until <code>session.timeout.ms</code> expires.','Verify: <code>rebalance-total</code> stays flat while lag drains, and no poll-timeout lines appear.']},
 {tab:'Idle consumers',t:'More consumers than partitions',sym:'Adding consumers does not reduce lag; two of the six instances sit idle.',
  ctx:'Lag is growing, so the team scales the consumer group from 4 to 6 instances. The topic has 4 partitions.',
  why:'Within a group a partition is read by one member at a time. Parallelism is capped by the partition count, so extra members get nothing.',
  log:{text:'-- representative output, values illustrative\nkafka-consumer-groups.sh --describe --group fulfilment\n  partitions p0-p3 each owned by one member; two members with no assignment',note:'Documented CLI; the assignment shown is an illustration. Source: '+SRC.consumer},
  viz:{bad:{rows:[row('C1 to C4',['p0','ok'],['p1','ok'],['p2','ok'],['p3','ok']),row('C5, C6',['idle','off'],['idle','off'])],cap:'4 partitions can keep only 4 members busy.'},
       good:{rows:[row('C1 to C3',['p0, p1','ok'],['p2, p3','ok'],['p4, p5','ok']),row('C4 to C6',['p6, p7','ok'],['p8, p9','ok'],['p10, p11','ok'])],cap:'12 partitions let all 6 members share the work.'}},
  fix:['Measure first: check that members do not outnumber partitions and that the per-partition consumer is the bottleneck.','Fix: if more parallelism is needed, create a topic with more partitions (see the key-order trade-off in chapter 3) and migrate.','Fix: otherwise make each consumer faster by batching downstream calls or parallelising inside the member while keeping order by key.','Trade-off: more partitions raise open files, replication work and recovery time, and can break per-key order if added later.','Verify: every group member owns at least one partition and total lag falls.']},
 {tab:'Rolling deploys',t:'Rolling deploys trigger one rebalance per pod',sym:'Every deployment causes a series of short consumption stalls and a lag spike.',
  ctx:'The service runs 6 consumers on Kubernetes. A rolling update replaces one pod at a time, and each pod stops and starts again within about 10 s (illustrative).',
  why:'Without static membership, a stopping member leaves the group and the new pod joins as a new member, so each pod causes two rebalances. With the eager assignor every rebalance revokes every partition of every member.',
  log:{text:`-- representative output, wording varies by version
INFO [GroupCoordinator 2]: Preparing to rebalance group fulfilment in state PreparingRebalance with old generation 41 (reason: Removing member consumer-1 on LeaveGroup)
INFO [GroupCoordinator 2]: Preparing to rebalance group fulfilment in state PreparingRebalance with old generation 42 (reason: Adding new member consumer-1 with group instance id None)`,note:'Broker-side coordinator log; the wording and generation numbers are illustrative. Source: '+SRC.kip345},
  viz:{bad:{bars:[['rebalances',100,'bad','12 per deploy'],['paused partition-s',100,'bad','high'],['lag spike',80,'warn','minutes']],cap:'Two rebalances per pod, each pausing all partitions (illustrative).'},
       good:{bars:[['rebalances',0,'ok','0 per deploy'],['paused partition-s',15,'ok','low'],['lag spike',10,'ok','seconds']],cap:'Static IDs and cooperative assignment keep ownership in place (illustrative).'}},
  fix:['Measure first: count rebalances per deployment with <code>rebalance-total</code> and the coordinator logs.','Fix: set a stable <code>group.instance.id</code> per pod (for example from a StatefulSet ordinal) so a quick restart keeps its partitions.','Fix: use <code>CooperativeStickyAssignor</code>, and keep the restart time well below <code>session.timeout.ms</code>.','Trade-off: with static membership a member that is really gone keeps its partitions until <code>session.timeout.ms</code> expires, so they stay unread for that long.','Verify: a rolling deployment produces no rebalances, and lag stays flat.']}
 ]},
{ask:'Disks fill within days, yet a “latest price” topic must keep only the newest value per key. What decides what is deleted, and when?',
 why:'Storage is finite but readers arrive at their own pace, so the log needs a forgetting rule that does not wait for them.',
 principle:'Forget in whole segments by age or size, or compact to the latest value per key, and never wait for a reader.',
 design:'Delete closed segments past retention, compact with the log cleaner, offload old segments to a remote tier, and bound tombstone life with delete.retention.ms.',
 scene:['The <code>orders</code> topic uses <code>retention.ms</code> of 3 days (illustrative) and a “latest price” topic uses <code>cleanup.policy=compact</code>. On Monday the disks of three brokers are at 95% (illustrative).','A consumer group that was stopped over the weekend restarts and fails with an out-of-range error. A downstream table builder still shows a product that was deleted last week.'],
 predict:{q:'<code>retention.ms</code> is 1 day, but the active segment has been open for 5 days. Is the data in it deleted?',
  opts:['Yes, anything older than a day is removed','No: only closed segments are deleted, and the active one is not closed yet','Yes, but only after every consumer has read it'],ans:1,
  why:'The broker deletes whole segments, and never the active one. A quiet partition can keep old data until <code>segment.ms</code> or <code>segment.bytes</code> rolls the segment.'},
 idea:['<b>Delete policy:</b> the broker deletes closed segments whose newest record is older than <code>retention.ms</code>, or the oldest segments when a partition exceeds <code>retention.bytes</code> (a per-partition limit).','<b>Segment roll decides eligibility:</b> <code>segment.ms</code> and <code>segment.bytes</code> control when the active segment closes and its data can be deleted.','<b>Compaction:</b> with <code>cleanup.policy=compact</code> the log cleaner keeps the last value per key in the dirty part of the log (<code>min.cleanable.dirty.ratio</code>, <code>min.compaction.lag.ms</code>). A null value is a tombstone, kept for <code>delete.retention.ms</code>.','<b>Readers are not consulted:</b> a consumer whose offset is below the log start offset gets <code>OFFSET_OUT_OF_RANGE</code>, and <code>auto.offset.reset</code> then applies.','<b>Tiered storage (KIP-405):</b> with <code>remote.log.storage.system.enable=true</code> on brokers and <code>remote.storage.enable=true</code> on a topic, closed segments are copied to remote storage, and <code>local.retention.ms</code> limits what stays on local disks.'],
 arch:{w:560,h:220,cap:'Only closed segments are eligible for deletion, compaction or offload.',
  boxes:[['act',10,80,130,60,'Active segment\nnever deleted',0],['closed',190,80,140,60,'Closed segments\nretention.ms / bytes',1],['clean',390,10,150,60,'Log cleaner\nlast value per key',2],['remote',390,150,150,60,'Remote tier\nKIP-405',3]],
  arrows:[['act','closed','1 roll'],['closed','clean','2 compact'],['closed','remote','3 offload',true]]},
 pg:'cleanup',
 common:[
 {tab:'Behind retention',t:'Consumer falls behind retention',sym:'On restart the consumer fails to fetch, then either skips a large range of events or reprocesses the whole topic.',
  ctx:'A consumer group is stopped for a weekend while the topic keeps <code>retention.ms</code> at 3 days.',
  why:'Retention deletes whole closed segments by time or size and ignores consumers. The log start offset moves forward past the group’s committed offset, so that offset no longer exists. The client then applies <code>auto.offset.reset</code>.',
  log:{text:'-- representative output, wording varies by client version\nOffsetOutOfRangeException: Fetch position FetchPosition{offset=3, ...} is out of range for partition orders-0\nauto.offset.reset = latest | earliest',note:'Representative client message; the broker-side error is OFFSET_OUT_OF_RANGE. Source: '+SRC.topic},
  viz:{bad:{rows:[row('offsets',['0-5 deleted','bad',3],['6-11 kept','ok',3]),row('marks',['committed = 3: out of range','bad',3],['log start = 6','ok',3])],cap:'The committed offset is below the log start: its segment was deleted.'},
       good:{rows:[row('offsets',['0-5 deleted','off',3],['6-11 kept','ok',3]),row('marks',['log start = 6','ok',3],['committed = 9 (keeps up)','ok',3])],cap:'The consumer stays ahead of the log start offset.'}},
  fix:['Measure first: compare each group’s committed offset with the partition’s log start offset, and compare lag with retention.','Fix: alert on consumer lag measured against retention, not just absolute lag, and scale or fix the slow consumer so it keeps up.','Fix: raise <code>retention.ms</code> or <code>retention.bytes</code>, or use tiered storage so older history stays readable.','Fix: choose <code>auto.offset.reset</code> deliberately: <code>latest</code> skips data, <code>earliest</code> reprocesses it.','Trade-off: longer retention costs disk (or remote storage) and recovery time; tiered storage reads old data at higher latency.','Verify: committed offsets stay above the log start offset and no OffsetOutOfRangeException occurs after a long pause.']},
 {tab:'Tombstone purged',t:'Tombstone purged before a slow consumer saw it',sym:'A deleted customer is still present in one downstream table that never saw the delete.',
  ctx:'A compacted changelog holds one row per customer. A consumer rebuilding its table pauses for hours, and customer k1 is deleted meanwhile.',
  why:'Compaction keeps the latest value per key and writes a delete as a tombstone (null value). The cleaner removes the tombstone itself after <code>delete.retention.ms</code>. A consumer that read the old value but not the tombstone keeps the key forever.',
  log:{text:'-- representative output, values illustrative\ncleanup.policy=compact, delete.retention.ms=86400000 (24 h)\nconsumer position is older than the purge time of the tombstone for key k1',note:'Documented topic configs; the scenario is a timing pattern, not a log line. Source: '+SRC.compaction},
  viz:{bad:{rows:[row('log',['k1=A (compacted away)','off'],['k2=B','ok'],['k1=null (purged)','bad'],['k3=C','ok'],['k2=D','ok']),row('marks',['consumer at 1: never sees the delete','bad',5])],cap:'The cleaner dropped the delete, and the consumer keeps k1 forever.'},
       good:{rows:[row('log',['k1=A (compacted away)','off'],['k2=B','ok'],['k1=null (kept)','warn'],['k3=C','ok'],['k2=D','ok']),row('marks',['consumer reads the tombstone and removes k1','ok',5])],cap:'The tombstone outlives the slow consumer, which then removes k1.'}},
  fix:['Measure first: compare the consumer’s position age with <code>delete.retention.ms</code>.','Fix: set <code>delete.retention.ms</code> longer than the worst-case time a consumer takes to read the log from start to end.','Fix: alert on consumers whose position is older than <code>delete.retention.ms</code>; if a table is already wrong, rebuild it by re-reading the compacted topic from the beginning.','Trade-off: longer tombstone retention keeps deleted keys’ markers (and any personal data in the key) in the log for longer and delays space reclaim slightly.','Verify: a consumer paused longer than the old value still ends with the deleted key removed.']},
 {tab:'Disk fills',t:'Disk fills although retention is set',sym:'Broker disks approach 100% and log directories go offline even though retention is configured.',
  ctx:'A topic sets <code>retention.bytes=100 GiB</code>, thinking of it as a cap for the topic, on 24 partitions with replication factor 3.',
  why:'<code>retention.bytes</code> applies per partition, not per topic: the cap is 100 GiB × 24 partitions × 3 replicas. Retention also only deletes closed segments, so a slow partition can hold old data until its active segment rolls (<code>segment.ms</code> or <code>segment.bytes</code>).',
  log:{text:'-- representative output, values illustrative\ndf: data volume > 90%\nkafka.log:type=LogManager,name=OfflineLogDirectoryCount > 0',note:'An OS command and a documented broker metric; the numbers are illustrative. Source: '+SRC.topic},
  viz:{bad:{bars:[['broker 1',97,'bad','97% disk'],['broker 2',94,'bad','94%'],['broker 3',96,'bad','96%']],cap:'The per-partition cap multiplied across partitions and replicas exceeds the disk (illustrative).'},
       good:{bars:[['broker 1',58,'ok','58% disk'],['broker 2',55,'ok','55%'],['broker 3',57,'ok','57%']],cap:'Retention sized against the disk budget leaves headroom (illustrative).'}},
  fix:['Measure first: compute capacity as partitions × replicas × per-partition limit and compare it with real disk.','Fix: lower <code>retention.bytes</code> or <code>retention.ms</code> to match the disk budget, or add brokers or disks.','Fix: set <code>segment.ms</code> so quiet partitions roll and become deletable; alert early (for example at 70 to 80%) and consider tiered storage for long history.','Trade-off: shorter retention shrinks the replay window for slow or new consumers; more disks or tiered storage cost money and add operational surface.','Verify: disk usage per broker settles below the alert threshold and no log directory goes offline.']}
 ]},
{ask:'A job reads orders, writes invoices and then commits its offset. A crash in between causes duplicate invoices. Can these steps be atomic?',
 why:'Reading, writing and committing touch different logs, so a crash between them leaves the system half-done.',
 principle:'Make the output writes and the offset commit one atomic unit, and fence old instances so they cannot interfere.',
 design:'A transaction coordinator binds transactional.id to a producer ID and epoch, writes commit or abort markers, and read_committed readers stop at the last stable offset.',
 scene:['A Kafka-to-Kafka job reads <code>orders</code>, writes an invoice to <code>invoices</code> and then commits the input offset. It is at-least-once because the commit comes last.','A node crash lands between the invoice write and the offset commit. After the restart the job reprocesses the order, and finance receives the same invoice twice. Later a paused pod wakes up and writes yet another one.'],
 predict:{q:'A transactional job crashes after writing the invoice but before <code>commitTransaction()</code>. What does a <code>read_committed</code> reader see from that attempt?',
  opts:['The invoice, because it is in the log','Nothing: the transaction is aborted and its records are filtered out','The invoice, marked as pending'],ans:1,
  why:'The records are in the log, but an open or aborted transaction is hidden from <code>read_committed</code> readers. They stop at the last stable offset and skip aborted records.'},
 idea:['<b>transactional.id:</b> <code>initTransactions()</code> registers it with the transaction coordinator, which returns a producer ID and bumps the epoch. An older producer with the same id is fenced (<code>ProducerFencedException</code>).','<b>Atomic unit:</b> <code>beginTransaction()</code>, produce, <code>sendOffsetsToTransaction()</code> for the input offsets, then <code>commitTransaction()</code>. The coordinator records the partitions involved in the internal <code>__transaction_state</code> topic.','<b>Markers:</b> on commit or abort the coordinator writes a control marker to every partition in the transaction.','<b>Isolation:</b> <code>isolation.level=read_committed</code> consumers deliver only committed records, up to the last stable offset (LSO). The default <code>read_uncommitted</code> also returns aborted records.','<b>Timeouts:</b> <code>transaction.timeout.ms</code> bounds an open transaction, and the broker caps it with <code>transaction.max.timeout.ms</code>. KIP-664 added tooling for hanging transactions.'],
 arch:{w:580,h:220,cap:'The coordinator ties input offsets and output records into one commit or abort.',
  boxes:[['app',10,80,130,60,'Job\nread, then write',0],['tc',200,80,150,60,'Transaction\ncoordinator',1],['part',410,10,150,60,'Output partitions\nrecords + markers',2],['off',410,150,150,60,'__consumer_offsets\ninput offsets',3]],
  arrows:[['app','tc','1 init / begin'],['tc','part','2 markers'],['tc','off','3 offsets']]},

 {tab:'Shared id',t:'Two instances share a transactional.id',sym:'Producers crash with a fencing error and restart in a loop; throughput is near zero.',
  ctx:'An app deploys several pods that all configure the same <code>transactional.id</code> (for example copied from a template).',
  why:'<code>initTransactions()</code> maps a <code>transactional.id</code> to one producer ID and bumps its epoch, fencing any older producer with the same id. Two live instances keep fencing each other, so neither can commit.',
  log:{text:'-- representative output, values illustrative\nProducerFencedException: There is a newer producer with the same transactionalId which fences the current one.',note:'Documented exception; the sequence in the diagram is an illustration. Source: '+SRC.kip98},
  viz:{bad:{rows:[row('pod A',['init: epoch 5','ok'],['send: fenced','bad'],['restart: epoch 7','bad']),row('pod B',['init: epoch 6, fences A','bad',2],['fenced by A','bad'])],cap:'The shared id makes the pods fence each other in a loop.'},
       good:{rows:[row('pod A',['id svc-0: epoch 5','ok'],['commits','ok']),row('pod B',['id svc-1: epoch 5','ok'],['commits','ok'])],cap:'Unique ids: fencing only stops real zombies.'}},
  fix:['Measure first: list the <code>transactional.id</code> values configured across pods and look for duplicates.','Fix: give every producer instance (or every input partition, depending on your design) its own stable <code>transactional.id</code>.','Fix: treat <code>ProducerFencedException</code> as fatal for that instance: close it and do not retry the same transaction; prefer a framework that derives the id for you, for example Kafka Streams with exactly-once processing.','Trade-off: a stable per-instance id is what makes zombie fencing and cross-restart dedupe work, but it must be unique, so it needs a deployment story.','Verify: each instance keeps one epoch and transactions commit without fencing errors.']},
 {tab:'Hanging txn',t:'Hanging transaction stalls read_committed consumers',sym:'read_committed consumers stop advancing and lag grows, while read_uncommitted consumers keep going.',
  ctx:'A transactional producer crashes after writing records but before commit or abort, and the coordinator’s timeout is long.',
  why:'A <code>read_committed</code> consumer may read only up to the last stable offset, which is the first offset of the earliest still-open transaction. One open transaction pins the LSO for the partition until it is committed or aborted.',
  log:{text:'-- representative output, values illustrative\nread_committed consumer lag grows; last stable offset (LSO) frozen\nkafka-transactions.sh --bootstrap-server broker:9092 find-hanging --broker-id 1',note:'The tool was added with KIP-664; the offsets and lag shown are illustrative. Source: '+SRC.kip664},
  viz:{bad:{rows:[row('offsets',['0-3','ok',4],['4-5 open txn','warn',2],['6-9 committed, hidden','bad',4]),row('marks',['LSO = 4','bad',6],['LEO = 10','ok',4])],cap:'One open transaction at offset 4 pins the LSO; later committed data is hidden.'},
       good:{rows:[row('offsets',['0-3','ok',4],['4-5 aborted','off',2],['6 marker','warn'],['7-9','ok',3]),row('marks',['LSO = LEO = 10','ok',10])],cap:'An abort marker closes the transaction; the LSO jumps to the log end.'}},
  fix:['Measure first: compare the LSO with the log end offset and run <code>kafka-transactions.sh find-hanging</code> to locate old open transactions.','Fix: restart the stuck producer so it ends the transaction, or let the coordinator abort it at <code>transaction.timeout.ms</code>.','Fix: use <code>kafka-transactions.sh abort</code> for a transaction that will never finish, and keep <code>transaction.timeout.ms</code> short (bounded by <code>transaction.max.timeout.ms</code> on the broker).','Trade-off: a short timeout aborts slow but healthy transactions; a long one lets a dead producer block readers for that long.','Verify: the LSO advances to the log end and <code>read_committed</code> lag drains.']},
 {tab:'Dirty reads',t:'A read_uncommitted downstream consumer reads aborted records',sym:'A report counts invoices that finance says never existed, though the producer side uses transactions.',
  ctx:'The invoicing job writes inside transactions, and some attempts abort. A reporting consumer uses the default <code>isolation.level=read_uncommitted</code>.',
  why:'Transactions only hide data from consumers that ask for it. A <code>read_uncommitted</code> consumer returns every record in offset order, including records of open and aborted transactions.',
  log:{text:'-- representative output, values illustrative\nconsumer config: isolation.level = read_uncommitted (default)\nread invoice id=88 from a transaction that was later aborted',note:'The default is documented in the consumer configs; the record is illustrative. Source: '+SRC.consumer},
  viz:{bad:{rows:[row('log',['inv 87 committed','ok'],['inv 88 aborted','warn'],['inv 89 committed','ok']),row('read_uncommitted',['87','ok'],['88 visible','bad'],['89','ok'])],cap:'The aborted record is delivered to the reader.'},
       good:{rows:[row('log',['inv 87 committed','ok'],['inv 88 aborted','warn'],['inv 89 committed','ok']),row('read_committed',['87','ok'],['88 filtered','off'],['89','ok'])],cap:'The aborted record is filtered out.'}},
  fix:['Measure first: check the <code>isolation.level</code> of every consumer group on the transactional topic.','Fix: set <code>isolation.level=read_committed</code> on every consumer that must not see aborted or open transactions.','Fix: document that the exactly-once guarantee applies only inside the Kafka read-process-write loop, and keep external systems idempotent.','Trade-off: <code>read_committed</code> readers lag behind the log end by the length of the longest open transaction.','Verify: a test that aborts a transaction produces no visible record in the downstream consumer.']}
 ]},
{ask:'Who decides which broker leads each partition, and what happens if that decider dies or is cut off from the rest?',
 why:'Cluster metadata needs a single authority, and the authority itself must survive failures without splitting into two.',
 principle:'Replicate the metadata as a log through a majority quorum, with epochs that reject stale leaders.',
 design:'A few KRaft controllers elect one active controller per epoch and commit metadata records by majority; brokers apply committed records and heartbeat to stay unfenced.',
 scene:['A three-node controller quorum runs in one rack. A power-distribution fault takes down two of the three controller nodes (illustrative). The brokers keep running.','Producers on healthy leaders still write, but topic creation hangs, a broker that restarts cannot register, and nobody can change a leader. The on-call engineer sees no active controller.'],
 predict:{q:'A cluster has 4 controller voters. How many can fail before metadata updates stop?',
  opts:['2, because half of them remain','1, the same as with 3 voters','0, because an even number cannot form a quorum'],ans:1,
  why:'A majority of 4 is 3 voters, so losing 2 leaves only half. Four voters tolerate one failure, exactly like three, at a higher cost.'},
 idea:['<b>Metadata is a log:</b> the <code>__cluster_metadata</code> topic holds every change (topics, partition leaders, configs), replicated with a Raft-based protocol (KIP-500, KIP-595, KIP-631).','<b>One active controller per epoch:</b> the voters elect a leader that appends records, and a record commits when a majority of voters has it. A higher epoch wins, so a stale leader is rejected.','<b>Quorum arithmetic:</b> a majority is ⌊n/2⌋ + 1, so 3 voters tolerate 1 failure, 4 tolerate 1 and 5 tolerate 2.','<b>Brokers:</b> they register with the active controller and heartbeat to it. A broker that stays silent longer than <code>broker.session.timeout.ms</code> is fenced and loses its leaderships.','<b>Setup:</b> <code>process.roles</code> chooses broker, controller or both, and the quorum is found through <code>controller.quorum.bootstrap.servers</code> (3.9) or the static <code>controller.quorum.voters</code>. <code>kafka-metadata-quorum.sh describe --status</code> shows leader, epoch and voters.'],
 arch:{w:580,h:230,cap:'Voters commit metadata by majority; brokers apply committed records and heartbeat to the active controller.',
  boxes:[['v1',10,10,130,55,'Controller 1\nactive, epoch 7',0],['v2',10,88,130,55,'Controller 2\nfollower',1],['v3',10,166,130,55,'Controller 3\nfollower',2],['log',220,88,150,55,'Metadata log\nmajority commit',3],['b1',430,20,130,55,'Broker\napplies records',4],['b2',430,150,130,55,'Broker\nheartbeats',5]],
  arrows:[['v1','log','1 append'],['v2','log','2 ack',true],['v3','log','',true],['log','b1','3 committed'],['b2','log','heartbeat',true]]},

 common:[
 {tab:'Majority lost',t:'Metadata quorum loses its majority',sym:'No active controller: topic creation, leader election and broker registration stall, while data traffic on healthy leaders may continue for a while.',
  ctx:'Three controller voters run in one rack. A power event takes two of them down.',
  why:'The metadata log is replicated with a Raft-style protocol: an entry commits, and a leader is elected, only with a majority of voters. One of three voters alive is a minority and can neither elect nor commit.',
  log:{text:'-- representative output, fields abbreviated\nkafka-metadata-quorum.sh --bootstrap-server broker:9092 describe --status\nActiveControllerCount = 0 on every node',note:'Documented tool and controller metric; the output fields shown are abbreviated. Source: '+SRC.kip595},
  viz:{bad:{rows:[row('voters',['1 alive: no majority','bad',2],['2 down','off'],['3 down','off'])],cap:'1 of 3 voters is a minority: no leader and no commits.'},

  fix:['Measure first: run <code>kafka-metadata-quorum.sh describe --status</code> and check <code>ActiveControllerCount</code> to see which voters are alive.','Fix: bring a majority of voters back (here 2 of 3); do not force a minority to act, and wait for the majority to elect a leader with a higher epoch.','Fix: place controller voters in separate failure domains, use an odd number (3 or 5), and alert on <code>ActiveControllerCount</code> and quorum lag.','Trade-off: more voters tolerate more failures but each commit waits for a larger majority; two voters tolerate none.','Verify: one voter reports itself leader with an epoch, <code>ActiveControllerCount</code> is 1 and the high watermark advances.']},
 {tab:'Network split',t:'Network split: the old controller cannot commit',sym:'Changes sent to the old active controller hang, while the other side elects a new active controller.',

  fix:['Measure first: query the quorum status from both sides to see who holds the higher epoch.','Fix: treat the majority side as authoritative and restore the network between the sides.','Fix: when the network heals, the old leader steps down and truncates its uncommitted entries; resend any change that did not commit.','Trade-off: a split-safe design stops the minority side instead of accepting writes on both, so metadata changes there are unavailable to avoid two authorities.','Verify: all voters report the same leader and epoch and the same committed high watermark.']},

       good:{rows:[row('5 voters',['1 down: ok','ok'],['2 down: ok','ok'],['majority = 3','warn',2])],cap:'Five voters tolerate two failures.'}},
  fix:['Measure first: count the controller voters in the quorum status and the failure domains they sit in.','Fix: use 3 voters for most clusters and 5 where two simultaneous failures must be tolerated; avoid even counts.','Fix: spread voters across independent racks or zones, so that one domain failing removes at most one voter.','Trade-off: five voters tolerate more failures, but every commit waits for 3 acknowledgements and each node must be operated and monitored.','Verify: a game day that kills the maximum tolerated number of voters keeps metadata changes working.']}
 ]},
];

<script>
/* architecture: one request walks through the boxes; the strip shows the 4 buffer frames */
function archAnim(sp, steps) {
  const B = {};
  sp.boxes.forEach(b => { B[b[0]] = b; });
  const ctr = id => [B[id][1] + B[id][3] / 2, B[id][2] + B[id][4] / 2];
  const edge = (f, t) => {
    const a = B[f], b = B[t], cx = a[1] + a[3] / 2, cy = a[2] + a[4] / 2;
    const dx = b[1] + b[3] / 2 - cx, dy = b[2] + b[4] / 2 - cy;
    const k = Math.min(dx ? (a[3] / 2) / Math.abs(dx) : 1e9, dy ? (a[4] / 2) / Math.abs(dy) : 1e9);
    return [cx + dx * k, cy + dy * k];
  };
  const arrowEls = sp.arrows.map(([f, t, lab, dash]) => {
    const p1 = edge(f, t), p2 = edge(t, f), mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
    const horiz = Math.abs(p2[0] - p1[0]) > Math.abs(p2[1] - p1[1]);
    return svg('g', { class: 'ar-arrow' },
      svg('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], 'marker-end': 'url(#arah)', 'stroke-dasharray': dash ? '6 5' : null }),
      svg('text', { class: 'ar-lab', x: horiz ? mx : mx + 8, y: horiz ? my - 8 : my, 'text-anchor': horiz ? 'middle' : 'start' }, lab));
  });
  let picked = null;
  const boxEls = sp.boxes.map(([id, x, y, w, hh, label]) => {
    const lines = label.split('\n');
    return svg('g', { class: 'ar-box', tabindex: 0, role: 'button', 'aria-label': sp.comp[id].n, onclick: () => pick(id), onkeydown: e => { if (e.key === 'Enter') pick(id); } },
      svg('rect', { x, y, width: w, height: hh, rx: 10 }),
      lines.map((ln, i) => svg('text', { class: i ? 'ar-sub' : 'ar-title', x: x + w / 2, y: y + hh / 2 + (i - (lines.length - 1) / 2) * 16 + 4, 'text-anchor': 'middle' }, ln)));
  });
  const dot = svg('circle', { class: 'ar-dot', r: 7, cx: 0, cy: 0, opacity: 0 });
  const picture = svg('svg', { viewBox: `0 0 ${sp.w} ${sp.h}`, role: 'img', 'aria-label': sp.cap, style: 'width:100%;max-width:500px;margin:0 auto;height:auto;display:block' },
    svg('defs', {}, svg('marker', { id: 'arah', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, svg('path', { d: 'M0 0L10 5L0 10z', fill: 'currentColor' }))),
    arrowEls, boxEls, dot);
  let mode = steps.modes[0].v, k = 0, tok = 0;
  const text = h('p', { class: 'ar-text' }), count = h('small', { class: 'ar-count' });
  const comp = h('div', { class: 'ar-comp' });
  const S = () => steps[mode];
  function paint() {
    const cur = k ? S()[k - 1] : null;
    boxEls.forEach((el, i) => { const on = !!cur && cur.box.includes(sp.boxes[i][0]); el.classList.toggle('on', on); el.classList.toggle('off', !!cur && !on); });
    arrowEls.forEach((el, i) => el.classList.toggle('on', !!cur && cur.arrows.includes(i)));
    text.textContent = cur ? cur.t : steps.intro[mode];
    count.textContent = 'Step ' + k + ' of ' + S().length;
    paintComp();
  }
  /* click a component: its definition appears under the diagram; click it again to close */
  function pick(id) {
    picked = picked === id ? null : id;
    boxEls.forEach((el, i) => el.classList.toggle('picked', sp.boxes[i][0] === picked));
    paintComp();
  }
  function paintComp() {
    comp.replaceChildren(picked
      ? h('div', { class: 'ar-card' }, h('b', {}, sp.comp[picked].n), h('p', { html: sp.comp[picked].d }))
      : h('p', { class: 'ar-hint' }, 'Click a component in the diagram to see what it does.'));
  }
  function flyDot(pairs) {
    const my = ++tok;
    dot.setAttribute('opacity', 0);
    if (!pairs) return;
    let i = 0;
    const next = () => {
      if (my !== tok) return;
      if (i >= pairs.length) { dot.setAttribute('opacity', 0); return; }
      const [f, t] = pairs[i++], a = ctr(f), b = ctr(t), t0 = performance.now();
      const frame = () => {
        if (my !== tok) return;
        const p = Math.min(1, (performance.now() - t0) / 500);
        dot.setAttribute('cx', a[0] + (b[0] - a[0]) * p);
        dot.setAttribute('cy', a[1] + (b[1] - a[1]) * p);
        dot.setAttribute('opacity', 1);
        if (p < 1) requestAnimationFrame(frame); else setTimeout(next, 150);
      };
      requestAnimationFrame(frame);
    };
    next();
  }
  const play = player({
    speed: 1600,
    step() { if (k >= S().length) return false; k++; paint(); flyDot(S()[k - 1].dot); return k < S().length; },
    reset() { k = 0; tok++; dot.setAttribute('opacity', 0); paint(); } });
  const modeSeg = seg(steps.modes, mode, v => { mode = v; k = 0; tok++; play.stop(); paint(); });
  paint();
  return h('figure', { class: 'arch arch-anim' },
    h('div', { class: 'split' },
      h('div', { class: 'split-l svgw' }, picture),
      h('div', { class: 'split-r' }, h('div', { class: 'arch-ctl' }, play, modeSeg), h('div', { class: 'ar-step' }, count, text), comp)),
    h('figcaption', { class: 'note' }, sp.cap));
}

/* ---- Kafka playground helpers: functions only, no DOM access at load time ---- */
/* Kafka default partitioner hash (Utils.murmur2); checked against the published test vectors */
function murmur2(str) {
  const data = Array.from(str).map(c => c.charCodeAt(0) & 255), len = data.length, m = 0x5bd1e995;
  let hh = (0x9747b28c ^ len) | 0;
  const n4 = len >> 2;
  for (let i = 0; i < n4; i++) {
    const j = i * 4; let k = data[j] + (data[j + 1] << 8) + (data[j + 2] << 16) + (data[j + 3] << 24);
    k = Math.imul(k, m); k ^= k >>> 24; k = Math.imul(k, m); hh = Math.imul(hh, m); hh ^= k;
  }
  const t = len & ~3;
  switch (len % 4) { case 3: hh ^= data[t + 2] << 16; case 2: hh ^= data[t + 1] << 8; case 1: hh ^= data[t]; hh = Math.imul(hh, m); }
  hh ^= hh >>> 13; hh = Math.imul(hh, m); hh ^= hh >>> 15; return hh | 0;
}
/* a row of small state cells: items [{t, k:'ok|bad|warn|off', s, hl}] */
function kgrid(A, items) {
  return A.h('div', { class: 'kfk-grid' }, items.map(i => A.h('div', { class: 'kfk-cell ' + (i.k || '') + (i.hl ? ' hl' : ''), title: i.t + (i.s ? ' · ' + i.s : '') }, i.t, i.s ? A.h('small', {}, i.s) : null)));
}
/* horizontal bars: rows [label, percent, 'ok|bad|warn', text] */
function kbars(A, rows) {
  return A.h('div', {}, rows.map(b => A.h('div', { class: 'vrow' }, A.h('span', { class: 'vl' }, b[0]),
    A.h('div', { class: 'vbar' }, A.h('div', { class: 'vtrack' }, A.h('i', { class: b[2] || '', style: 'width:' + Math.max(1.5, Math.min(100, b[1])) + '%' })), A.h('span', { class: 'vt' }, b[3])))));
}
/* the shared playground frame: hypothesis line, control bars, live outputs, visuals, model note */
function kbox(A, root, why, bars, body, noteText) {
  root.append(A.h('div', { class: 'pgbox kfk-pg' }, A.h('p', { class: 'pgwhy' }, 'Hypothesis to test: ' + why), bars.map(b => A.bar(...b)), body, A.note(noteText)));
}
const kfmt = n => Math.round(n).toLocaleString('en-US');
/* ch0 · segments: offset lookup in a segmented log with a sparse index */
PG.segments = function (root, A) {
  const { h, seg, slider, stat, btn } = A;
  const SEGS = [1, 4, 16, 64, 256, 1024], IDX = [1, 4, 16, 64, 256], REC = 1000;
  let mode = 'offset';
  const sN = slider('records in the partition', 100, 4000, 2000, 100, () => run(), v => kfmt(v) + 'k');
  const sSeg = slider('segment.bytes', 0, 5, 0, 1, () => run(), i => SEGS[i] + ' MiB');
  const sIdx = slider('index.interval.bytes', 0, 4, 1, 1, () => run(), i => IDX[i] + ' KiB');
  const sTgt = slider('target position in the log', 0, 100, 70, 1, () => run(), v => v + '%');
  const m = seg([{ v: 'offset', l: 'find by offset' }, { v: 'time', l: 'find by timestamp' }], mode, v => { mode = v; run(); });
  const out = stat([]), view = h('div'), line = h('p', { class: 'note', 'aria-live': 'polite' });
  function run() {
    const recs = sN.value * 1000, segBytes = SEGS[sSeg.value] * 1048576, step = IDX[sIdx.value] * 1024;
    const rps = Math.max(1, Math.floor(segBytes / REC)), segs = Math.ceil(recs / rps);
    const perSeg = Math.max(1, Math.floor(segBytes / step)), entries = segs * perSeg;
    const t = Math.min(recs - 1, Math.floor(sTgt.value / 100 * (recs - 1)));
    const si = Math.floor(t / rps), rel = t - si * rps;
    const stepRec = Math.max(1, Math.floor(step / REC)), at = Math.floor(rel / stepRec) * stepRec;
    const scanKb = (rel - at + 1) * REC / 1024, files = segs * 3 * 100;
    const probes = Math.ceil(Math.log2(segs + 1)) + Math.ceil(Math.log2(perSeg + 1)) + (mode === 'time' ? 1 : 0);
    out.update([
      { l: 'segments', v: kfmt(segs), cls: segs > 218 ? 'bad' : 'ok' },
      { l: 'index entries', v: kfmt(entries) },
      { l: 'KB scanned for the lookup', v: scanKb.toFixed(1), cls: scanKb > 16 ? 'bad' : 'ok' },
      { l: 'files open (100 such partitions)', v: kfmt(files), cls: files > 65536 ? 'bad' : 'ok' }]);
    const groups = Math.min(segs, 24), per = Math.ceil(segs / groups), cells = [];
    for (let g = 0; g < groups; g++) {
      const a = g * per, hit = si >= a && si < a + per;
      cells.push({ t: per > 1 ? '#' + a + '+' : '#' + a, s: kfmt(a * rps / 1000) + 'k', k: hit ? 'warn' : 'ok', hl: hit });
    }
    view.replaceChildren(kgrid(A, cells));
    line.textContent = (mode === 'offset' ? 'Offset ' : 'Timestamp that maps to offset ') + kfmt(t) + ': segment #' + si + ' starts at offset ' + kfmt(si * rps) + ' (about ' + probes + ' binary-search probes in total); the closest index entry is ' + kfmt(rel - at) + ' records earlier, so the broker scans about ' + scanKb.toFixed(1) + ' KB. ' + (segs > groups ? 'Each cell above groups ' + per + ' segments.' : 'Each cell above is one segment.');
  }
  kbox(A, root, 'a lookup opens the segment with the greatest base offset at or below the target and scans less than one index interval, however large the log is.',
    [[sN, sSeg, sIdx], [sTgt, m], [btn('Reproduce the incident', () => { sN.value = 2000; sSeg.value = 0; sIdx.value = 1; sTgt.value = 70; run(); }), btn('Apply the fix', () => { sSeg.value = 4; run(); })]],
    [out, view, line], 'Illustrative model: 1 KB records in one partition, and 100 such partitions per broker for the file count (3 files per segment). Real indexes also have a size limit and a time index entry per interval.');
  run();
};

/* ch1 · recovery: what an unclean shutdown costs */
PG.recovery = function (root, A) {
  const { h, seg, slider, stat, btn, rng, player } = A;
  const UNFL = 3, SCAN_S = 0.26, TAIL = 1000;
  let mode = 'kill', progress = 0;
  const sh = seg([{ v: 'clean', l: 'clean shutdown' }, { v: 'kill', l: 'kill -9' }], mode, v => { mode = v; run(); });
  const sP = slider('partitions on the broker', 200, 4000, 3000, 100, () => run(), kfmt);
  const sT = slider('num.recovery.threads.per.data.dir', 1, 16, 1, 1, () => run());
  const sPos = slider('torn frame position in the tail', 0, 100, 40, 5, () => run(), v => v + '%');
  const out = stat([]), view = h('div'), line = h('p', { class: 'note' });
  const tm = s => s < 90 ? Math.round(s) + ' s' : (s / 60).toFixed(0) + ' min';
  function calc() {
    const P = sP.value, T = sT.value, r = rng(11); let torn = 0;
    for (let i = 0; i < P; i++) if (r() < 0.15) torn++;
    const kill = mode === 'kill', scanned = kill ? P * UNFL : 0;
    return { P, torn, scanned, secs: kill ? Math.ceil(scanned * SCAN_S / T) : 3, trunc: kill ? Math.round(torn * (1 - sPos.value / 100) * TAIL) : 0, kill };
  }
  function paint() {
    const m = calc(), done = m.kill ? Math.min(1, progress / 10) : 1, urp = Math.round((m.kill ? m.P : 0) * (1 - done));
    out.update([
      { l: 'segments scanned', v: kfmt(m.scanned), cls: m.scanned ? 'bad' : 'ok' },
      { l: 'records truncated', v: kfmt(m.trunc) },
      { l: 'restart time (illustrative)', v: tm(m.secs), cls: m.secs > 300 ? 'bad' : 'ok' },
      { l: 'under-replicated partitions now', v: kfmt(urp), cls: urp ? 'bad' : 'ok' }]);
    view.replaceChildren(kbars(A, [['recovery progress', done * 100, done < 1 ? 'warn' : 'ok', Math.round(done * 100) + '% · ' + tm(m.secs * done) + ' of ' + tm(m.secs)]]));
    line.textContent = m.kill ? 'No clean-shutdown marker: the broker re-validates ' + UNFL + ' segments past the recovery point on each of ' + kfmt(m.P) + ' partitions, ' + sT.value + ' thread(s) at a time. About ' + kfmt(m.torn) + ' partitions had a write in flight and lose the torn tail.' : 'Clean shutdown marker found: recovery is skipped and the broker only opens its logs.';
  }
  function run() { progress = 0; paint(); }
  const play = player({ speed: 500, step() { if (progress >= 10) progress = 0; progress++; paint(); return progress < 10; }, reset() { progress = 0; paint(); } });
  kbox(A, root, 'after kill -9 the broker re-validates only the segments past each recovery point, so restart time scales with partitions divided by recovery threads, and a clean shutdown skips it.',
    [[sh, sP], [sT, sPos], [play], [btn('Reproduce the incident', () => { sh.set('kill'); mode = 'kill'; sP.value = 3000; sT.value = 1; sPos.value = 40; run(); }), btn('Apply the fix', () => { sh.set('clean'); mode = 'clean'; sT.value = 8; run(); })]],
    [out, view, line], 'Illustrative model: 3 unflushed segments of 128 MiB per partition scanned at 500 MB/s, 15% of partitions with a write in flight, one data directory. Real recovery cost depends on disks and CRC speed.');
  run();
};

/* ch2 · partitioner: key hash, partition count, ordering */
PG.partitioner = function (root, A) {
  const { h, seg, slider, stat, btn, rng } = A;
  const E = 600, SELL = Array.from({ length: 200 }, (_, i) => 'seller-' + (i + 1));
  let dist = 'uniform', keymode = 'seller', grow = true;
  const dSeg = seg([{ v: 'uniform', l: 'uniform keys' }, { v: 'hot', l: 'hot key' }, { v: 'null', l: 'null keys' }], dist, v => { dist = v; run(); });
  const kSeg = seg([{ v: 'seller', l: 'key = seller' }, { v: 'salt', l: 'key = seller + bucket' }], keymode, v => { keymode = v; run(); });
  const sN = slider('partitions at the start', 2, 12, 6, 1, () => run());
  const gBtn = btn('', () => { grow = !grow; label(); run(); });
  const label = () => { gBtn.textContent = 'Grow partitions x2 mid-stream: ' + (grow ? 'on' : 'off'); };
  const out = stat([]), view = h('div'), line = h('p', { class: 'note' });
  function run() {
    const n0 = sN.value, r = rng(7), r2 = rng(9), nFinal = grow ? n0 * 2 : n0, cnt = new Array(nFinal).fill(0), last = {}, split = new Set();
    let breaks = 0, cur = 0, inBatch = 0;
    for (let i = 0; i < E; i++) {
      const n = grow && i >= E / 2 ? n0 * 2 : n0;
      const seller = dist === 'hot' && r() < 0.5 ? 'seller-42' : SELL[Math.floor(r() * 200)];
      let p;
      if (dist === 'null') { if (inBatch === 0 || cur >= n) { cur = Math.floor(r2() * n); } if (++inBatch >= 16) inBatch = 0; p = cur; }
      else {
        const key = keymode === 'salt' ? seller + '#' + (i % 4) : seller;
        p = (murmur2(key) & 0x7fffffff) % n;
        if (last[seller] != null && last[seller] !== p) { breaks++; split.add(seller); }
        last[seller] = p;
      }
      cnt[p]++;
    }
    const mx = Math.max(...cnt), avg = E / nFinal;
    out.update([
      { l: 'max / avg load', v: (mx / avg).toFixed(2), cls: mx / avg > 1.6 ? 'bad' : 'ok' },
      { l: 'hottest partition share', v: Math.round(100 * mx / E) + '%' },
      { l: 'keys whose partition changed', v: split.size, cls: split.size ? 'bad' : 'ok' },
      { l: 'out-of-order risks', v: breaks, cls: breaks ? 'bad' : 'ok' }]);
    view.replaceChildren(kbars(A, cnt.map((c, p) => ['partition ' + p, 100 * c / mx, c > 1.6 * avg ? 'bad' : 'ok', c + ' events'])));
    line.textContent = 'Placement uses the real Kafka murmur2 hash on keys such as seller-7. An out-of-order risk is an event whose key was in a different partition than the key’s previous event: two partitions can be read in either order.' + (dist === 'null' ? ' Null keys have no key to order by, so the risk count stays at 0 while sticky batches spread the load.' : '');
  }
  label();
  kbox(A, root, 'growing from N to 2N partitions moves keys, so events of one key land in two partitions and can be read out of order, while a fixed count keeps each key in one partition.',
    [[dSeg, kSeg], [sN, gBtn], [btn('Reproduce the incident', () => { dist = 'uniform'; dSeg.set('uniform'); keymode = 'seller'; kSeg.set('seller'); sN.value = 6; grow = true; label(); run(); }), btn('Apply the fix', () => { sN.value = 12; grow = false; label(); run(); })]],
    [out, view, line], 'Illustrative model: 600 events from 200 sellers, with a fixed random seed. Sticky batches are 16 events. Real traffic is larger and arrives in time order across many producers.');
  run();
};

/* ch3 · batching: linger, batch.size, compression, buffer */
PG.batching = function (root, A) {
  const { h, seg, slider, stat, btn } = A;
  const BS = [1, 4, 16, 64, 128], P = 20, REC = 300, PARTS = 6, BUF = 32 * 1048576;
  let comp = 'lz4';
  const sRate = slider('events/s per producer', 500, 10000, 2500, 500, () => run(), kfmt);
  const sLing = slider('linger.ms', 0, 50, 0, 1, () => run());
  const sBat = slider('batch.size', 0, 4, 0, 1, () => run(), i => BS[i] + ' KB');
  const sSlow = slider('broker slowdown', 0, 95, 0, 5, () => run(), v => v + '%');
  const cSeg = seg([{ v: 'none', l: 'no compression' }, { v: 'lz4', l: 'lz4' }, { v: 'zstd', l: 'zstd' }], comp, v => { comp = v; run(); });
  const out = stat([]), view = h('div'), line = h('p', { class: 'note' });
  function run() {
    const lam = sRate.value, ling = sLing.value, maxBytes = BS[sBat.value] * 1024, maxRecs = Math.max(1, Math.floor(maxBytes / REC));
    const lamP = lam / PARTS, recs = Math.max(1, Math.min(maxRecs, Math.round(lamP * (ling + 1) / 1000)));
    const batchBytes = recs * REC, fillMs = maxRecs / lamP * 1000;

    const W = sW.value, log = [], lines = [], acked = new Set(), tried = {};

  }

    [[iSeg, sW], [nSeg, btn('Drop ack of request N', () => { drop.add(nsel); run(); }), btn('Fail request N, then succeed N+1', () => { fail.add(nsel); run(); }), btn('Clear faults', () => { setFaults([], []); run(); })],
     [btn('Reproduce the incident', () => { idem = false; iSeg.set('off'); sW.value = 5; setFaults([2], [4]); run(); }), btn('Apply the fix', () => { idem = true; iSeg.set('on'); sW.value = 5; setFaults([2], [4]); run(); })]],
    [out, faults, view, lg.el], 'Illustrative model: one partition, 6 single-record batches, retries happen in the next round, and the broker keeps one expected sequence per producer. Real producers also bump epochs and track sequences per partition.');

/* ch5 · isr: replication, high watermark and acks across a leader crash */

/* ch7 · offsets: where the commit sits decides what a crash skips or repeats */

  let commit = 'before', proc = 'sync', reset = 'latest', group = 'existing', crashOn = true;
  const cSeg = seg([{ v: 'before', l: 'commit before processing' }, { v: 'after', l: 'commit after processing' }, { v: 'auto', l: 'auto-commit' }], commit, v => { commit = v; run(); });
  const pSeg = seg([{ v: 'sync', l: 'process in poll loop' }, { v: 'async', l: 'hand off to workers' }], proc, v => { proc = v; run(); });
  const sInt = slider('auto.commit.interval.ms (ticks)', 1, 12, 5, 1, () => run());
  const sK = slider('crash while processing record', 1, 22, 6, 1, () => run());
  const gSeg = seg([{ v: 'existing', l: 'existing group' }, { v: 'new', l: 'new group, backlog of 24' }], group, v => { group = v; run(); });
  const rSeg = seg([{ v: 'latest', l: 'auto.offset.reset=latest' }, { v: 'earliest', l: 'auto.offset.reset=earliest' }], reset, v => { reset = v; run(); });
  const out = stat([]), view = h('div'), line = h('p', { class: 'note' });
  function simulate() {
    const K = crashOn ? sK.value : 999, N = sInt.value;
    let pos = 0, done = 0, committed = 0, lastC = 0, crashed = false;
    for (let t = 1; t < 200 && done < TOTAL; t++) {
      if (proc === 'sync') {
        if (done === pos && pos < TOTAL) {
          if (commit === 'auto' && t - lastC >= N) { committed = pos; lastC = t; }
          pos = Math.min(TOTAL, pos + B); if (commit === 'before') committed = pos;
        }
      } else if (t % 2 === 1 && pos < TOTAL) {

        pos = Math.min(TOTAL, pos + B); if (commit === 'before') committed = pos;
      }

    }

  }
