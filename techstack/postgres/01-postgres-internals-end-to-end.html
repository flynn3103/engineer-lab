<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postgres Internals End-to-End</title>
<link rel="stylesheet" href="../../assets/lab.css">
<style>
:root{--acc:#336791;--acc2:#e25a1c}
@media(prefers-color-scheme:dark){:root{--acc:#6ea8dc;--acc2:#ff7a3d}}
@media(max-width:820px){.g2{grid-template-columns:1fr}}
.pg{border:2px solid var(--line);border-radius:8px;padding:6px;background:var(--card);min-width:0}
.pg.hit{border-color:var(--ok)}.pg.miss{border-color:var(--bad)}.pg.dirty{background:color-mix(in srgb,var(--acc2) 12%,var(--card))}
.pg h5{margin:0 0 4px;font-size:11px;color:var(--mut)}
.pgbar{display:flex;height:16px;border-radius:4px;overflow:hidden;border:1px solid var(--line);margin:3px 0}
.tup{display:inline-block;font-family:ui-monospace,monospace;font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin:1px;background:var(--bg)}
.tup.dead{opacity:.45;text-decoration:line-through;border-color:var(--bad)}.tup.live{border-color:var(--ok)}
.op{border:2px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card);margin:2px 0}
.op.act{border-color:var(--acc2);background:color-mix(in srgb,var(--acc2) 10%,var(--card))}
.op b{font-size:12.5px}.op small{color:var(--mut);margin-left:6px}
.ln{border-left:2px solid var(--line);margin-left:14px;padding-left:10px}
.qpanel{margin-top:12px}
.qpanel textarea{margin-top:8px}
.hscroll{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.hscroll>svg{display:block}
.view .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
#phView .row{white-space:normal;overflow:visible}
.view table.wrap{display:table;white-space:normal;width:100%}
.tup.unc{opacity:.6;border-style:dashed;border-color:var(--mut)}
</style>
</head>
<body>
<div id="dataSlot" hidden>

  <textarea id="src" rows="5" spellcheck="false" aria-label="Table data"></textarea>
  <div class="note" id="srcInfo"></div>

<script>
const STORY={
 system:'PostgreSQL',
 title:'<span>PostgreSQL</span> Internals',
 lead:'Start from a real production problem. Watch the obvious fix break. Then rebuild, one piece at a time, the design PostgreSQL actually uses, running on your own table and your own SQL.',
 problem:{
  scene:[
   'You run the <b>orders database</b> of a marketplace: 2,000 transactions per second at checkout, a finance team running 10-minute reports on the same tables, and a server that will one day lose power in the middle of a write.',
   'Product asks for one thing: <i>"Let us ask any question in SQL, answer it fast, and never lose or half-apply a paid order."</i> Your job is to build the engine underneath.'],
  musts:[
   '<b>Speaks SQL.</b> Users say <i>what</i> they want, the engine decides <i>how</i>, and a bad query fails before it touches any data.',
   '<b>Fast on data bigger than RAM.</b> A point lookup reads a handful of pages, not the whole table.',
   '<b>Committed means durable.</b> An acknowledged COMMIT survives <code>kill -9</code> or a power cut; half-done work disappears.',
   '<b>Readers never block writers.</b> The 10-minute report must not stall checkout, and it must see one consistent picture.',
   '<b>Bounded resources.</b> Memory per query, disk for old row versions, disk for old logs: all stay under control.'],
  naive:{title:'Your first instinct: a JSON file and one big lock',text:'Load the table into memory, run each query as a loop in application code, hold one lock per transaction and rewrite the file on COMMIT. It works for the demo, then:',
   breaks:['The table outgrows RAM, and every query reads the entire file.','A crash halfway through rewriting the file leaves it <b>corrupt</b>: committed orders are gone.','The finance report holds the lock for 10 minutes: <b>checkout stops</b>.']},
  quest:'Rebuild the core of PostgreSQL in 11 chapters. Each one starts from a problem, shows the naive fix failing, then the design PostgreSQL uses, running live on your table.'},
 overview:{title:'The whole engine on one page',lead:'Before the details, follow one query through the engine. Press <b>Trace a request</b> to watch a SQL statement travel from the client to the pages and the log, or tap a component to see what it receives and sends. Colors match the chapters.'},
 chapters:[
  {ask:'A user types <code>SELECT t.nope FROM t</code>. When should the engine notice the mistake?',
   why:'If you only notice while reading rows, a typo on a 50 GB table fails after minutes of I/O, or silently returns nothing on an empty table. The engine must know every table, column and type <b>before</b> it reads data.',
   v0:{name:'Evaluate the SQL text row by row',code:"for row in readAll('t'):\n  if eval(whereText, row): emit(row)",breaks:'An unknown column shows up only when a row is evaluated (never, on an empty table). <code>amount = \'abc\'</code> is compared with whatever coercion your language happens to do. And there is no place to decide <i>how</i> to run the query.'},
   design:'Separate understanding a query from running it: once every name is resolved against the catalog, the engine knows the query is meaningful before it spends any I/O.',
   predict:{q:'Pick the query <b>Error: unknown column</b> (<code>SELECT t.nope FROM t</code>). Where does it fail?',opts:['In the tokenizer: <code>nope</code> is not a keyword','In the executor, at the first row it reads','In the binder, before any page is read'],ans:2,why:'The text is valid syntax, so tokenizing and parsing succeed. The binder looks <code>nope</code> up in the catalog and fails. PostgreSQL does the same: the grammar checks syntax only, then parse analysis resolves names against <code>pg_class</code> and <code>pg_attribute</code> and raises <i>column t.nope does not exist</i>.'},
   build:{steps:['<b>Catalog:</b> a map <code>table → [(column, type)]</code>. In PostgreSQL it is itself stored in tables (<code>pg_class</code>, <code>pg_attribute</code>, <code>pg_type</code>).','<b>Tokenizer and parser:</b> turn text into an AST. Only syntax errors can happen here.','<b>Binder:</b> resolve each name to exactly one <code>(table, column, type)</code>; reject unknown, ambiguous and ill-typed expressions.','<b>Logical plan:</b> a tree of Scan, Filter, Join, Aggregate, Sort, Project and Limit. Still no data read.'],
    code:'ast = parse(tokenize(sql))              // syntax only\nfor ref in ast.columnRefs:\n  hits = catalog.lookup(ref, ast.from)\n  if hits.count != 1: error("unknown or ambiguous")\n  ref.bind(hits[0])                     // now it has a type\ncheckTypes(ast)\nreturn logicalTree(ast)                 // Scan → Filter → … → Limit',
    rule:'No row is read until <b>every name is bound to exactly one typed column</b>.'}},
  {ask:'Where does row 17 physically live, and how do we avoid going to disk every time we need it?',
   why:'A disk read costs around 100 µs on an SSD, about a thousand times more than RAM. Rows need a stable address an index can point to, and hot pages must stay in memory within a fixed budget.',
   v0:{name:'One file per table, read it whole',code:"rows = parse(readFile('t.json'))\nrows[17].amount = 99\nwriteFile('t.json', rows)",breaks:'Every query reads the entire file and every update rewrites it. A row has no stable address, so an index has nothing to point to.'},
   design:'Make the page, not the row, the unit of storage and caching: a fixed-size block is what disks read cheaply and what memory can hold a fixed number of, and a slot indirection gives each row an address that never moves.',
   predict:{q:'Set <b>Buffer frames</b> to 2 and <b>Access pattern</b> to <b>two full scans</b>. The table has more pages than the pool. With this LRU pool, how many reads of the second scan are hits?',opts:['None: each page was evicted just before it is needed again','About half of them','All of them: the pages were just read'],ans:0,why:'LRU evicts exactly the page the scan will need next (sequential flooding), so the hit rate is 0%. PostgreSQL uses clock-sweep with usage counts instead, and gives large sequential scans a small private ring buffer, so one big scan cannot push everybody else’s hot pages out of <code>shared_buffers</code>.'},
   build:{steps:['<b>Slotted page</b> (8 kB in PostgreSQL, 256 B here): a header, a slot array growing forward, tuples growing backward from the end.','<b>Row ID</b> = <code>(page, slot)</code>. A tuple may move inside its page; the slot keeps the address stable. PostgreSQL calls it the <code>ctid</code>.','<b>Buffer pool:</b> N frames, a table <code>pageId → frame</code>, a pin count and a dirty bit per frame.','<b>Eviction:</b> pick an unpinned victim (LRU or clock-sweep); if it is dirty, write it back first (after flushing its log, chapter 6).'],
    code:'get(pageId):\n  if f = table[pageId]: f.pin++; return f          // hit\n  v = pickVictim(frames where pin == 0)            // LRU or clock\n  if v.dirty: disk.write(v.pageId, v.data)\n  v.data = disk.read(pageId); table[pageId] = v\n  v.pin = 1; return v                              // caller unpins later',
    rule:'A <b>pinned page is never evicted</b>, and a dirty page is written back before its frame is reused.'}},
  {ask:'How do you run <code>… ORDER BY amount LIMIT 5</code> without holding the whole table in memory?',
   why:'A plan can combine scans, joins, sorts and limits in any shape. Materialising every intermediate result costs as much memory as the table, and the first row arrives only at the very end.',
   v0:{name:'Every step returns a full array',code:'rows = scan(t)\nrows = rows.filter(where)\nrows = rows.sort(byAmount)\nreturn rows.slice(0, 5)',breaks:'Each step holds all of its rows at once, and <code>LIMIT 1</code> on a billion-row scan still reads all billion rows.'},
   design:'Invert control: the consumer pulls one row at a time from its child, so memory follows the few blocking operators instead of the size of the table, and a LIMIT simply stops pulling.',
   predict:{q:'Pick <b>Filter + sort + limit</b> (<code>… ORDER BY … LIMIT 5</code>). How many rows does the Sort operator pull from its child?',opts:['Exactly 5: LIMIT stops it early','Every row that passes the filter','Every row of the table, matching or not'],ans:1,why:'Sort is <b>blocking</b>: the smallest row might be the last one it reads, so it consumes its whole input before emitting anything. The filter below it streams, so only matching rows reach it; LIMIT saves work only above the Sort. PostgreSQL behaves the same, and switches to a cheaper top-N heapsort when a LIMIT sits on top.'},
   build:{steps:['One interface for every operator: <code>open()</code>, <code>next() → row or null</code>, <code>close()</code>.','<b>Scan</b> walks pages through the buffer pool; <b>Filter</b>, <b>Project</b> and <b>Limit</b> wrap one child and stream.','<b>Sort</b> and <b>Aggregate</b> drain their child on the first <code>next()</code>, then emit.','<b>Nested-loop join</b> re-opens its inner child for every outer row: count those loops.','Keep per-operator counters (rows in and out, pages, loops). That is your EXPLAIN ANALYZE.'],
    code:'Filter.next():\n  while (r = child.next()) != null:\n    if pred(r): return r\n  return null\nLimit.next():\n  if n == k: return null                // stop pulling\n  n++; return child.next()\nrun(root): while (r = root.next()) != null: send(r)',
    rule:'Operators talk only through <code>next()</code>, so <b>any plan shape returns the same rows</b> as the logical query.'}},
  {ask:'Find the order with <code>amount = 99</code> among 10 million rows without reading every page.',
   why:'A full scan of 10 million rows reads about 100,000 pages. A B-tree answers the same point query in 3 or 4 page reads, and keeps doing so while rows keep arriving.',
   v0:{name:'A sorted array of (key, row ID)',code:'i = binarySearch(index, key)        // fast lookup\nindex.insertAt(i, (key, rid))       // shifts half the array',breaks:'Lookups are fast, but every insert shifts half the array. On disk that means rewriting half of the index pages for each INSERT.'},
   design:'Keep the order but give up contiguity: a tree of pages stays sorted while each change touches only one root-to-leaf path, so a lookup or an insert costs a few page reads whatever the table size.',
   predict:{q:'Keep the index on <b>amount</b> (Orders sample), set <b>Probe value</b> to <code>0</code> and <b>Operator</b> to <code>&gt;=</code>, so every row matches. Which reads fewer pages?',opts:['The index scan: an index is always faster','They read the same number of pages','The sequential scan'],ans:2,why:'The index scan reads its tree pages and then fetches every heap page anyway, one matching row at a time. One sequential pass is cheaper. In PostgreSQL those heap fetches are random I/O, which is why the planner prefers a sequential or bitmap scan when a predicate is not selective (chapter 8).'},
   build:{steps:['A node is one page: sorted keys plus child pointers (internal) or row IDs (leaf); each leaf links to its right sibling.','<b>Search:</b> from the root, binary-search each node and follow one child: one page read per level.','<b>Insert:</b> add to the leaf; if it overflows, split it in half and insert the separator into the parent, recursively. A root split adds one level.','<b>Range scan:</b> find the first leaf, then follow sibling links until a key passes the upper bound.','Every index hit still fetches the heap tuple and checks whether it is visible (chapter 5).'],
    code:'insert(k, rid):\n  node = descendToLeaf(root, k); node.add(k, rid)\n  while node.overflows():\n    (right, sep) = node.splitHalf()\n    parent = node.parent or newRoot(node)\n    parent.add(sep, right)\n    node = parent',
    rule:'Keys stay <b>sorted inside and across leaves</b>, and every leaf sits at the same depth.'}},
  {ask:'The finance report reads a row while checkout updates it. Who has to wait?',
   why:'With one copy per row, either the report blocks checkout for 10 minutes, or it reads a half-updated, inconsistent picture of the books.',
   v0:{name:'One copy per row, protected by a lock',code:'lock(row)            // held until COMMIT\nrow.amount = 50\n...\ncommit(); unlock(row)',breaks:'Every reader of that row waits until the writer commits, and a long report holding read locks stalls every update. ROLLBACK also needs an undo copy you never kept.'},
   design:'Keep several copies: if a writer never modifies the version a reader is looking at, readers and writers never have to wait for each other.',
   predict:{q:'Scenario <b>snapshot reads</b>: A reads row 0, B updates row 0 and commits, then A reads row 0 again in the same transaction (one snapshot per transaction, as in REPEATABLE READ). What does A see?',opts:['The old value: its snapshot was taken before B committed','The new value: B has committed','Nothing yet: A blocks until B finishes'],ans:0,why:'A’s snapshot fixes which transactions count as committed for A, so B’s new version stays invisible to A, and nobody waited. PostgreSQL behaves this way under REPEATABLE READ. Under its default, READ COMMITTED, every statement takes a fresh snapshot, so the second read would see B’s value (chapter 11).'},
   build:{steps:['Each transaction gets an increasing <b>txid</b> and a status: in progress, committed or aborted (PostgreSQL keeps it in <code>pg_xact</code>).','INSERT writes a tuple with <code>xmin = me</code>; DELETE sets <code>xmax = me</code>; UPDATE is DELETE + INSERT.','A <b>snapshot</b> is <code>(xmax, in-progress txids)</code>: anything at or above xmax, or in the list, is not committed for me.','A writer that finds the row already updated by an in-progress transaction waits for it, then follows its outcome.'],
    code:'visible(t, snap):\n  if not committedFor(t.xmin, snap): return t.xmin == me\n  if t.xmax == 0: return true\n  return t.xmax != me and not committedFor(t.xmax, snap)\ncommittedFor(x, s) = status[x] == COMMITTED\n                     and x < s.xmax and x not in s.inProgress',
    rule:'A snapshot never changes: <b>a version is visible if its creator committed before the snapshot and its deleter did not</b>.'}},
  {ask:'The power fails right after we answered COMMIT. Is the paid order still there?',
   why:'Writing every changed page at COMMIT means many random writes per transaction, and a crash in the middle leaves some pages new and some old. We need durability for the price of one sequential write per commit.',
   v0:{name:'Write every dirty page at COMMIT',code:"for page in tx.dirtyPages:\n  disk.write(page)\nfsync(); reply('COMMIT')",breaks:'Ten scattered page writes per commit cap throughput, and a crash after page 3 of 10 leaves a <b>half-applied transaction</b> on disk with nothing to repair it.'},
   design:'Treat the log as the source of truth and the data pages as a lazily written cache of it: only the sequential log has to be durable at COMMIT.',
   predict:{q:'Set <b>Crash after</b> to step 4. Page 0 was written to disk at step 4 and already holds T3’s update, but T3 never committed. After recovery, is T3’s change visible?',opts:['Yes: it is on the page on disk','No: there is no COMMIT record for T3, so its version stays invisible','Only if T3’s WAL record survived the crash'],ans:1,why:'Visibility comes from commit status, not from what happens to be on a page. PostgreSQL recovery is redo-only: it replays the WAL, and a transaction without a COMMIT record counts as aborted, so its tuple versions are never visible (VACUUM removes them later).'},
   build:{steps:['Give every change a log record with an increasing <b>LSN</b> (log sequence number), and stamp the page with the LSN of its latest change.','<b>Write-ahead rule:</b> before a dirty page is written, flush the log up to that page’s LSN.','<b>Commit rule:</b> append a COMMIT record and fsync the log up to it before replying to the client.','<b>Recovery:</b> read the log from the redo point, stop at the first record whose checksum fails (a torn tail), and redo a record only if <code>record.lsn &gt; page.lsn</code>.'],
    code:'change(page, rec): rec.lsn = log.append(rec); page.lsn = rec.lsn\nevict(page): log.flush(upTo = page.lsn); disk.write(page)\ncommit(tx): log.flush(upTo = log.append(COMMIT(tx))); reply("COMMIT")\nrecover():\n  for rec in log.from(redoPoint) while checksumOk(rec):\n    if rec.lsn > page(rec).lsn: redo(rec)     // idempotent',
    rule:'<b>Log before data, log before OK:</b> no page write and no COMMIT reply ever gets ahead of the durable log.'}},
  {ask:'Every UPDATE leaves an old version behind. When is it safe to throw one away?',
   why:'A table updated 1,000 times per second collects 86 million dead versions a day. Left alone, the table and its indexes bloat and every scan slows down.',
   v0:{name:'Delete the old version as soon as the update commits',code:'commit(tx):\n  for t in tx.oldVersions: heap.remove(t)',breaks:'The 10-minute report started before the update, and its snapshot still needs the old version. Removing it makes the report <b>miss the row</b> or read a version it should not see.'},
   design:'The oldest observer, not the moment of the commit, decides when a version becomes garbage.',
   predict:{q:'Keep <b>long-running open transaction</b> ticked: a transaction that began before all the updates is still open. How many dead versions can VACUUM remove?',opts:['All of them: they were all overwritten','None of them','Only those on the first page'],ans:1,why:'Every dead version was deleted by a transaction newer than the open one, so its snapshot may still need any of them. In PostgreSQL, a session idle in transaction or a long report that holds an old snapshot or txid holds the horizon back the same way, and the table bloats until it ends. Untick the box and VACUUM reclaims them all.'},
   build:{steps:['<b>Horizon</b> = the oldest txid that is still running or still visible to some snapshot.','A version is removable if its deleter (<code>xmax</code>) committed before the horizon, or its creator (<code>xmin</code>) aborted.','Remove the index entries first, then free the heap slots, and record free space per page so INSERT can reuse it.','Run it in the background (autovacuum), triggered by the number of dead tuples per table. Also <b>freeze</b> very old tuples: PostgreSQL txids are 32-bit and wrap around.'],
    code:'horizon = min(xmin of every running transaction and snapshot)\nfor t in heap:\n  if aborted(t.xmin) or\n     (t.xmax != 0 and committed(t.xmax) and t.xmax < horizon):\n    removeIndexEntries(t); free(t.slot)\nfreeSpaceMap.update(pages)',
    rule:'<b>Never remove a version that any snapshot can still see.</b>'}},
  {ask:'One SQL query can run as a scan, an index lookup, a hash join or a nested loop. Which?',
   why:'On a large table the wrong choice is the difference between 5 ms and 5 minutes, and the right choice depends on how many rows actually match.',
   v0:{name:'Fixed rule: use an index whenever one matches',code:'if index exists on where.column:\n  plan = IndexScan\nelse:\n  plan = SeqScan',breaks:'A predicate matching half the table goes through the index and pays one random heap read per row: far slower than reading every page once.'},
   design:'Turn plan choice into arithmetic: if you can estimate how many rows each step produces, you can price every equivalent plan and let the numbers, not fixed rules, decide.',
   predict:{q:'With the index on <b>amount</b> (Orders sample), pick <b>Point lookup</b> (<code>amount = v</code>, one row), then <b>Filter + sort + limit</b> (<code>amount &gt;= median</code>, half the rows). Which access path wins each?',opts:['Index Scan for the point lookup, Seq Scan for the half-table filter','Index Scan for both: there is an index','Seq Scan for both: scans are always cheaper'],ans:0,why:'The cost of an index scan grows with the number of matching rows (one heap fetch each); a sequential scan costs the same whatever matches. The two lines cross, and the planner picks the cheaper side. PostgreSQL weighs <code>random_page_cost</code> against <code>seq_page_cost</code> the same way; its pages are 8 kB, so the crossover appears on bigger tables than in this 256-byte-page model.'},
   build:{steps:['<b>ANALYZE:</b> sample rows and store, per column, the row count, null fraction, number of distinct values, most common values and a histogram.','<b>Selectivity:</b> <code>=</code> uses the common values or 1/ndv; ranges use the histogram; AND multiplies (assuming independence).','<b>Cost model:</b> sequential pages, random pages and per-row CPU, each with a weight.','<b>Search:</b> enumerate access paths, join methods and join orders (dynamic programming), keep the cheapest.','<b>Feedback:</b> print estimated next to actual rows. A 10× gap means stale or skewed statistics.'],
    code:'rows(pred)      = stats.rows * selectivity(pred, stats)\ncost(SeqScan)   = pages * seq_page_cost + stats.rows * cpu_cost\ncost(IndexScan) = height + matches * random_page_cost + matches * cpu_cost\nplan = argmin(cost, candidatePlans(query))',
    rule:'Planning may change <b>speed, never results</b>: every candidate plan returns the same rows.'}},
  {ask:'<code>ORDER BY</code> over 50 GB with 64 MB of memory. Does the query crash?',
   why:'A query runs alongside hundreds of others. If every sort or hash join takes as much memory as its input, the server runs out of RAM.',
   v0:{name:'Load the whole input into memory',code:'rows = child.readAll()     // 50 GB\nrows.sort(byKey)\nreturn rows',breaks:'The backend grows until the operating system’s out-of-memory killer ends it, and in PostgreSQL that makes the server restart every connection and run crash recovery.'},
   design:'Make every big operation decomposable: split the input into pieces that each fit in memory and finish them one by one from disk, so a fixed budget handles any input size.',
   predict:{q:'Set <b>work_mem</b> to 40 rows (one run, all in memory), then back to 6 (six runs in temp files). What happens to the sorted output?',opts:['The query fails: not enough memory','Some rows come out of order','Nothing: it is identical, only now built from runs in temp files'],ans:2,why:'Each chunk that fits is sorted and written as a run, then a k-way merge produces exactly the same order. Only the cost changes (temp-file I/O). PostgreSQL reports it in EXPLAIN ANALYZE as <code>Sort Method: external merge  Disk: …</code>.'},
   build:{steps:['<b>External sort:</b> read <code>work_mem</code> worth of rows, sort them, write a run; repeat until the input ends.','<b>Merge</b> up to F runs at a time with a min-heap until one run remains.','<b>Hash join:</b> build a hash table on the smaller input, probe it with the larger one.','If the build side does not fit, <b>partition</b> both inputs by <code>hash(key) mod P</code> into temp files, then join each pair of partitions in memory.','Delete the temp files on success, on error and on cancel.'],
    code:'runs = [writeRun(sort(chunk)) for chunk in child.chunks(work_mem)]\nwhile len(runs) > 1:\n  runs = [kWayMerge(g) for g in groups(runs, fanIn)]\n// hash join that spills\nfor r in build: buildPart[hash(r.key) % P].write(r)   // same for probe\nfor i in 0..P-1: joinInMemory(buildPart[i], probePart[i])',
    rule:'Spilling changes <b>where</b> rows wait, never <b>which</b> rows come out, and each operator stays within its memory budget.'}},
  {ask:'The WAL grows forever. After a crash, do we replay a year of log?',
   why:'Recovery time is downtime. Replaying from the very first record makes every restart take hours, and no WAL file can ever be deleted.',
   v0:{name:'Keep all WAL and replay it from the start',code:'recover():\n  for rec in log.from(0): redo(rec)',breaks:'Restart time grows with the age of the database, and the WAL fills the disk because no file is ever safe to remove.'},
   design:'Recovery only needs the log written since the last moment every page was known to be on disk, so create such moments on purpose.',
   predict:{q:'Compare <b>Checkpoint every</b> 3 records with <b>never</b> in the table below the timeline. What do frequent checkpoints buy, and what do they cost?',opts:['Less to replay after a crash, paid for with more page writes','Less to replay and fewer page writes: a pure win','Nothing: replay always starts at the beginning of the log'],ans:0,why:'Frequent checkpoints keep the redo point close, so a crash replays little WAL and old segments can be recycled, but hot pages get written again and again. PostgreSQL adds a second cost: the first change to a page after each checkpoint logs a full-page image, so WAL volume grows too. That is why <code>checkpoint_timeout</code> and <code>max_wal_size</code> are tuned, not minimised.'},
   build:{steps:['Note the current LSN as the <b>redo point</b>.','Flush every page that was dirty at that moment (PostgreSQL spreads this over time to avoid an I/O spike).','Append a checkpoint record that names the redo point, fsync it, then update the control file that tells recovery where to start.','Recycle WAL segments that end before the redo point, unless a replica or the archiver still needs them.'],
    code:'checkpoint():\n  redo = log.currentLsn()\n  for page in bufferPool.dirtyPages(): flush(page)   // WAL first\n  log.append(CHECKPOINT(redo)); log.flush()\n  controlFile.write(redo)                             // atomic\n  recycle(segments ending before redo, unless still needed)',
    rule:'WAL is deleted only after <b>every change it holds is in the data files</b> and no replica or archive still needs it.'}},
  {ask:'Two transactions touch the same rows at once. What may each see, and what if each waits for the other?',
   why:'Running transactions one at a time is correct but slow; anything faster allows anomalies. And as soon as writers wait for locks, two of them can wait for each other forever.',
   v0:{name:'Lock rows as you touch them, wait as long as it takes',code:'A: lock(r1) ... lock(r2)    // waits for B\nB: lock(r2) ... lock(r1)    // waits for A',breaks:'A waits for B and B waits for A: <b>both wait forever</b>, holding locks every other transaction needs. Pick the <b>deadlock</b> history to watch it.'},
   design:'Concurrency correctness is a contract, not one rule: name the anomalies each level allows, and treat waiting as something that can fail, because a cycle of waiters never ends by itself.',
   predict:{q:'History <b>lost update</b>, isolation <b>Read Committed</b>. A runs <code>UPDATE … SET val = val + 10</code> and commits; then B runs <code>SET val = val + 20</code> on the same row (it started at 100). What happens to B?',opts:['B overwrites A’s change: the +10 is lost','B fails with a serialization error','B adds 20 on top of A’s committed value: 130'],ans:2,why:'Under READ COMMITTED an UPDATE works on the newest committed version of the row (waiting first if a writer is still in progress), so <code>val + 20</code> is computed from 110. Switch to <b>Repeatable Read</b>: the row changed after B’s snapshot, so PostgreSQL aborts B with <i>could not serialize access</i> and the application retries. This protects only updates written as <code>val = val + 20</code>; reading in the app and then writing <code>SET val = 120</code> still loses A’s change.'},
   build:{steps:['<b>READ COMMITTED:</b> a new snapshot per statement; an UPDATE that meets a row changed by a committed transaction re-checks it on the newest version.','<b>REPEATABLE READ:</b> one snapshot per transaction; updating a row changed after that snapshot raises a serialization failure.','<b>Row locks:</b> a writer waits for the transaction that last updated the row to finish.','<b>Deadlock detector:</b> when a wait lasts longer than <code>deadlock_timeout</code> (1 s by default), build the wait-for graph; if it has a cycle, abort a transaction in it.','SERIALIZABLE (SSI in PostgreSQL) also tracks read/write dependencies to stop write skew. This model leaves it out.'],
    code:'onLockWait(me):\n  sleep(deadlock_timeout)\n  if me.stillWaiting and cycleInWaitForGraph(me):\n    abort(me)            // releases my locks; the others proceed',
    rule:'Each level shows <b>only its documented anomalies</b>, and every wait-for cycle is broken by aborting a transaction in it.'}}
 ],
 milestones:[
  {t:'Catalog, parser and binder',test:'<code>SELECT t.nope FROM t</code> fails before a single page is read; equivalent queries produce equal logical plans.'},
  {t:'Slotted pages and a buffer pool',test:'After a restart every row is found again at its <code>(page, slot)</code>; a pinned page is never evicted; hit and miss counters match a hand-worked trace.'},
  {t:'Iterator executor',test:'Every query returns the same bag of rows as a brute-force oracle; <code>LIMIT 1</code> over a huge scan reads one page.'},
  {t:'B-tree index',test:'After 100,000 random inserts (thousands of splits), index scans and sequential scans return identical rows for random predicates.'},
  {t:'Transactions and MVCC',test:'Uncommitted rows are invisible to others; a REPEATABLE READ reader gets the same answer before and after concurrent commits.'},
  {t:'WAL and crash recovery',test:'<code>kill -9</code> right after COMMIT loses nothing; before COMMIT shows nothing; a truncated last log record is ignored.'},
  {t:'VACUUM and checkpoints',test:'Dead versions are reclaimed only after the oldest snapshot ends; recovery replays only from the last checkpoint; no needed WAL segment is ever removed.'},
  {t:'Planner, spill and isolation',test:'Plans change with selectivity but results never do; a sort with a tiny <code>work_mem</code> equals the in-memory sort; a deadlock aborts exactly one transaction.'}],
 capstone:{title:'Put it together: a primary and its standbys',lead:'Everything from the chapters on one server, plus streaming replication: the primary writes WAL and the standbys replay it. Play a scenario, scrub the timeline, tap any server or event to see why it happened, then crash the primary and switch <code>synchronous_commit</code>.'}
};

<script>
Lab.mount(STORY);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const J=x=>{try{return JSON.stringify(x)}catch{return String(x)}};
const pc=i=>`var(--p${((i%8)+8)%8})`,tc=i=>`var(--t${((i%8)+8)%8})`;
const cmp=(a,b)=>a<b?-1:a>b?1:0;
const short=(s,n=40)=>{s=String(s);return s.length>n?s.slice(0,n-1)+'…':s};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function lcg(seed){let s=(seed>>>0)||1;return()=>{s=(Math.imul(s,1103515245)+12345)&0x7fffffff;return s/0x7fffffff}}
function fnvStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}

/* ================= parsing + samples ================= */
function detect(t){const s=t.trim();if(s.startsWith('['))return'json';const l=s.split(/\r?\n/)[0]||'';if(l.startsWith('{'))return'jsonl';if(l.includes(','))return'csv';return'text'}
function csvSplit(l){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){o.push(c);c=''}else c+=ch}o.push(c);return o}
const conv=v=>(typeof v==='string'&&/^-?\d+(\.\d+)?$/.test(v.trim()))?Number(v):v;
function colsOf(rows){const c=[];rows.forEach(r=>Object.keys(r).forEach(k=>{if(!c.includes(k))c.push(k)}));return c}
function parseWhole(text,pf){
  if(pf==='json'){const a=JSON.parse(text);if(!Array.isArray(a))throw new Error('JSON must be an array');return{rows:a,columns:colsOf(a)}}
  const lines=text.split(/\r?\n/).filter(l=>l.trim()!=='');
  if(pf==='jsonl'){const rows=lines.map(l=>JSON.parse(l));return{rows,columns:colsOf(rows)}}
  if(pf==='csv'){if(!lines.length)return{rows:[],columns:[]};const h=csvSplit(lines[0]);const rows=lines.slice(1).map(l=>{const v=csvSplit(l),o={};h.forEach((k,i)=>o[k]=conv(v[i]??''));return o});return{rows,columns:h}}
  return{rows:lines.map(l=>({line:l})),columns:['line']};
}
function sampleOrders(){const st=['new','paid','shipped'],cty=['HCM','HN','DN','CT'],r=lcg(11),L=['id,city,status,amount,qty'];for(let i=1;i<=36;i++)L.push([i,cty[Math.floor(r()*4)],st[Math.floor(r()*3)],Math.round(10+r()*490),1+Math.floor(r()*5)].join(','));return L.join('\n')}
function samplePeople(){const d=['eng','ops','sales'],r=lcg(21),L=['id,name,dept,age,salary'];for(let i=1;i<=30;i++)L.push([i,'emp'+i,d[Math.floor(r()*3)],22+Math.floor(r()*30),Math.round(800+r()*3200)].join(','));return L.join('\n')}
function sampleEvents(){const a=['view','click','buy'],r=lcg(5),L=[];for(let i=1;i<=32;i++)L.push(J({id:i,user:'u'+(1+Math.floor(r()*6)),action:a[Math.floor(r()*3)],ms:Math.round(10+r()*300)}));return L.join('\n')}
const SAMPLES={orders:{t:sampleOrders,f:'csv'},people:{t:samplePeople,f:'csv'},events:{t:sampleEvents,f:'jsonl'}};

/* =========================================================
   CATALOG, SQL PARSER, BINDER, LOGICAL PLAN (F01)
   ========================================================= */
const typeOfCol=(rows,k)=>rows.every(r=>r[k]==null||typeof r[k]==='number')?'integer':'text';
const KW=new Set(['SELECT','FROM','WHERE','AND','JOIN','ON','GROUP','BY','ORDER','LIMIT','DESC','ASC','COUNT','SUM','AVG','MIN','MAX']);
function tokenize(sql){
  const toks=[];const re=/\s*(?:('(?:[^']|'')*')|(\d+(?:\.\d+)?)|([A-Za-z_][A-Za-z0-9_.]*)|(>=|<=|<>|!=|=|<|>|\(|\)|\*|,))/y;let m,last=0;
  while(last<sql.length&&/\S/.test(sql.slice(last))){re.lastIndex=last;m=re.exec(sql);if(!m)throw{msg:`syntax error near "${short(sql.slice(last).trim(),12)}"`};last=re.lastIndex;
    if(m[1]!==undefined)toks.push({t:'str',v:m[1].slice(1,-1).replace(/''/g,"'")});else if(m[2]!==undefined)toks.push({t:'num',v:Number(m[2])});
    else if(m[3]!==undefined)toks.push(KW.has(m[3].toUpperCase())?{t:'kw',v:m[3].toUpperCase()}:{t:'id',v:m[3]});else toks.push({t:'sym',v:m[4]==='<>'?'!=':m[4]})}
  return toks;
}
function parseSQL(sql){
  const T=tokenize(sql);let i=0;const peek=()=>T[i],eat=()=>T[i++];
  const isKw=v=>T[i]&&T[i].t==='kw'&&T[i].v===v,isSym=v=>T[i]&&T[i].t==='sym'&&T[i].v===v;
  const need=(v)=>{if(!isKw(v))throw{msg:`expected ${v} but found ${T[i]?'"'+T[i].v+'"':'end of query'}`};i++};
  const colref=()=>{const t=eat();if(!t||t.t!=='id')throw{msg:'expected a column name'};return t.v};
  const lit=()=>{const t=eat();if(!t||(t.t!=='str'&&t.t!=='num'&&t.t!=='id'))throw{msg:'expected a value'};return t};
  const ast={sel:[],tables:[],preds:[],join:null,group:null,order:null,limit:null};
  need('SELECT');
  if(isSym('*')){i++;ast.sel.push({star:true})}
  else do{
    if(i<T.length&&T[i].t==='kw'&&['COUNT','SUM','AVG','MIN','MAX'].includes(T[i].v)){const f=eat().v;if(!isSym('('))throw{msg:'expected ('};i++;let arg;if(isSym('*')){i++;arg='*'}else arg=colref();if(!isSym(')'))throw{msg:'expected )'};i++;ast.sel.push({agg:f,arg})}
    else ast.sel.push({col:colref()});
  }while(isSym(',')&&++i);
  need('FROM');
  const tref=()=>{const n=eat();if(!n||n.t!=='id')throw{msg:'expected a table name'};let al=n.v;if(T[i]&&T[i].t==='id')al=eat().v;return{name:n.v,alias:al}};
  ast.tables.push(tref());
  if(isKw('JOIN')){i++;ast.tables.push(tref());need('ON');const l=colref();if(!isSym('='))throw{msg:'join condition must use ='};i++;const r=colref();ast.join={l,r}}
  if(isKw('WHERE')){i++;do{const l=colref(),o=eat();if(!o||o.t!=='sym'||o.v==='('||o.v===')'||o.v==='*'||o.v===',')throw{msg:'expected a comparison operator'};const rt=lit();ast.preds.push({l,op:o.v,r:rt})}while(isKw('AND')&&++i)}
  if(isKw('GROUP')){i++;need('BY');ast.group=colref()}
  if(isKw('ORDER')){i++;need('BY');const c=colref();let d=false;if(isKw('DESC')){i++;d=true}else if(isKw('ASC'))i++;ast.order={col:c,desc:d}}
  if(isKw('LIMIT')){i++;const n=eat();if(!n||n.t!=='num')throw{msg:'LIMIT needs a number'};ast.limit=n.v}
  if(i<T.length)throw{msg:`unexpected "${T[i].v}"`};
  return{ast,tokens:T};
}
function bindQuery(ast,cat){
  const ts=ast.tables.map(t=>{const tb=cat[t.name];if(!tb)throw{msg:`relation "${t.name}" does not exist`};return{...t,tb}});
  const resolve=ref=>{
    const[a,b]=ref.includes('.')?ref.split('.'):[null,ref];
    if(a){const t=ts.find(x=>x.alias===a||x.name===a);if(!t)throw{msg:`missing FROM-clause entry for table "${a}"`};const c=t.tb.cols.find(c=>c.name===b);if(!c)throw{msg:`column ${ref} does not exist`};return{alias:t.alias,table:t.name,name:b,type:c.type}}
    const hits=ts.filter(t=>t.tb.cols.some(c=>c.name===b));if(!hits.length)throw{msg:`column "${b}" does not exist`};if(hits.length>1)throw{msg:`column reference "${b}" is ambiguous`};
    const t=hits[0];return{alias:t.alias,table:t.name,name:b,type:t.tb.cols.find(c=>c.name===b).type};
  };
  const out={tables:ts.map(t=>({name:t.name,alias:t.alias,cols:t.tb.cols})),sel:[],preds:[],join:null,group:null,order:null,limit:ast.limit,hasAgg:ast.sel.some(s=>s.agg)};
  ast.sel.forEach(s=>{if(s.star)ts.forEach(t=>t.tb.cols.forEach(c=>out.sel.push({col:{alias:t.alias,table:t.name,name:c.name,type:c.type},label:ts.length>1?t.alias+'.'+c.name:c.name})));
    else if(s.agg){const arg=s.arg==='*'?null:resolve(s.arg);if(arg&&arg.type==='text'&&['SUM','AVG'].includes(s.agg))throw{msg:`function ${s.agg.toLowerCase()}(text) does not exist`};out.sel.push({agg:s.agg,arg,label:s.agg.toLowerCase()+'('+(s.arg||'')+')'})}
    else{const c=resolve(s.col);out.sel.push({col:c,label:s.col})}});
  ast.preds.forEach(p=>{const l=resolve(p.l);let r;if(p.r.t==='id')r={col:resolve(p.r.v)};else r={lit:p.r.v,ltype:p.r.t==='num'?'integer':'text'};
    if(r.lit!==undefined&&l.type!==r.ltype)throw{msg:l.type==='integer'?`invalid input syntax for type integer: "${p.r.v}"`:`operator does not exist: ${l.type} ${p.op} ${r.ltype}`};out.preds.push({l,op:p.op,r})});
  if(ast.join){const l=resolve(ast.join.l),r=resolve(ast.join.r);if(l.type!==r.type)throw{msg:`join columns have different types (${l.type} vs ${r.type})`};out.join={l,r}}
  if(ast.group)out.group=resolve(ast.group);if(ast.order)out.order={col:resolve(ast.order.col),desc:ast.order.desc};
  if(out.hasAgg){const plain=out.sel.filter(s=>!s.agg);if(plain.length&&(!out.group||plain.some(s=>s.col.alias!==out.group.alias||s.col.name!==out.group.name)))throw{msg:`column "${plain[0].label}" must appear in the GROUP BY clause or be used in an aggregate function`}}
  return out;
}
function logicalTree(b){
  const L=[];let n={op:'Scan',d:b.tables[0].name+' '+b.tables[0].alias};
  if(b.tables.length>1){n={op:'Join',d:`${b.join.l.alias}.${b.join.l.name} = ${b.join.r.alias}.${b.join.r.name}`,kids:[n,{op:'Scan',d:b.tables[1].name+' '+b.tables[1].alias}]}}
  if(b.preds.length)n={op:'Filter',d:b.preds.map(p=>`${p.l.alias}.${p.l.name} ${p.op} ${p.r.lit!==undefined?J(p.r.lit):p.r.col.alias+'.'+p.r.col.name}`).join(' AND '),kids:[n]};
  if(b.hasAgg)n={op:'Aggregate',d:(b.group?'group by '+b.group.alias+'.'+b.group.name+' · ':'')+b.sel.filter(s=>s.agg).map(s=>s.label).join(', '),kids:[n]};
  if(b.order)n={op:'Sort',d:b.order.col.alias+'.'+b.order.col.name+(b.order.desc?' DESC':''),kids:[n]};
  n={op:'Project',d:b.sel.map(s=>s.label).join(', '),kids:[n]};
  if(b.limit!=null)n={op:'Limit',d:String(b.limit),kids:[n]};
  return n;
}
const showTree=(n,d=0)=>' '.repeat(d*3)+(d?'└ ':'')+n.op+' ['+n.d+']\n'+(n.kids||[]).map(k=>showTree(k,d+1)).join('');

/* =========================================================
   STORAGE: slotted heap pages (MVCC tuples) + buffer pool (F02)
   ========================================================= */
const PAGE=256,PHDR=24,SLOT=4,THDR=24;
const tupBytes=row=>THDR+Object.values(row).reduce((a,v)=>a+String(v).length+2,0);
class MV{
  constructor(rows){this.pages=[];this.xid=1;this.status={1:'committed'};this.nextRid=0;(rows||[]).forEach(r=>this.put(1,r))}
  put(xid,row){const b=tupBytes(row);let pg=this.pages.find(p=>p.used+b+SLOT<=PAGE);if(!pg){pg={no:this.pages.length,tuples:[],used:PHDR,lsn:0};this.pages.push(pg)}
    const t={rid:[pg.no,pg.tuples.length],row,xmin:xid,xmax:0,bytes:b,dead:false};pg.tuples.push(t);pg.used+=b+SLOT;return t}
  begin(){const x=++this.xid;this.status[x]='active';return x}
  commit(x){this.status[x]='committed'}abort(x){this.status[x]='aborted'}
  snapshot(me){return{xmax:this.xid+1,xip:Object.keys(this.status).map(Number).filter(x=>this.status[x]==='active'&&x!==me),me}}
  xv(x,s){if(x===s.me)return true;if(this.status[x]!=='committed')return false;if(x>=s.xmax)return false;if(s.xip.includes(x))return false;return true}
  visible(t,s){if(t.dead)return false;if(!this.xv(t.xmin,s))return false;if(t.xmax&&this.xv(t.xmax,s))return false;return true}
  all(){return this.pages.flatMap(p=>p.tuples)}
  update(x,t,row){t.xmax=x;return this.put(x,row)}
  horizon(){const act=Object.keys(this.status).map(Number).filter(x=>this.status[x]==='active');return act.length?Math.min(...act):this.xid+1}
  vacuum(h){let removed=0,bytes=0;this.pages.forEach(p=>{p.tuples.forEach(t=>{if(t.dead)return;const deadNow=(this.status[t.xmin]==='aborted')||(t.xmax&&this.status[t.xmax]==='committed'&&t.xmax<h);if(deadNow){t.dead=true;removed++;bytes+=t.bytes+SLOT;p.used-=t.bytes+SLOT}})});return{removed,bytes}}
  stats(){let live=0,dead=0,deadB=0,liveB=0;this.all().forEach(t=>{if(t.dead)return;const isDead=this.status[t.xmin]==='aborted'||(t.xmax&&this.status[t.xmax]==='committed');if(isDead){dead++;deadB+=t.bytes}else{live++;liveB+=t.bytes}});return{live,dead,deadB,liveB,pages:this.pages.length}}
}
class BP{
  constructor(frames){this.n=frames;this.fr=[];this.s={hit:0,miss:0,evict:0,flush:0};this.log=[]}
  get(key,write){
    let f=this.fr.find(x=>x.k===key),ev=null,fl=false,kind='hit';
    if(f){this.s.hit++;this.fr.splice(this.fr.indexOf(f),1);this.fr.push(f)}
    else{this.s.miss++;kind='miss';if(this.fr.length>=this.n){const v=this.fr.find(x=>!x.pin)||this.fr[0];this.fr.splice(this.fr.indexOf(v),1);ev=v.k;this.s.evict++;if(v.dirty){this.s.flush++;fl=true}}f={k:key,dirty:false,pin:0};this.fr.push(f)}
    if(write)f.dirty=true;
    this.log.push({k:key,kind,ev,fl,write:!!write,frames:this.fr.map(x=>({k:x.k,d:x.dirty}))});return kind;
  }
}

/* =========================================================
   B-TREE (F04)
   ========================================================= */
class BT{
  constructor(m){this.m=m;this.nid=0;this.root=this.mk(true);this.events=[]}
  mk(leaf){return{id:this.nid++,leaf,keys:[],vals:[],kids:[],next:null}}
  insert(k,rid){
    const path=[];let n=this.root;
    while(!n.leaf){let i=0;while(i<n.keys.length&&cmp(k,n.keys[i])>=0)i++;path.push([n,i]);n=n.kids[i]}
    let i=0;while(i<n.keys.length&&cmp(n.keys[i],k)<0)i++;
    if(n.keys[i]!==undefined&&cmp(n.keys[i],k)===0)n.vals[i].push(rid);else{n.keys.splice(i,0,k);n.vals.splice(i,0,[rid])}
    this.events.push({t:'insert',k});
    while(n.keys.length>this.m-1){
      const mid=Math.floor(n.keys.length/2),r=this.mk(n.leaf);let up;
      if(n.leaf){r.keys=n.keys.splice(mid);r.vals=n.vals.splice(mid);r.next=n.next;n.next=r;up=r.keys[0]}
      else{up=n.keys[mid];r.keys=n.keys.splice(mid+1);n.keys.pop();r.kids=n.kids.splice(mid+1)}
      this.events.push({t:'split',node:n.id,right:r.id,up});
      if(!path.length){const root=this.mk(false);root.keys=[up];root.kids=[n,r];this.root=root;this.events.push({t:'root',id:root.id});break}
      const[parent,pi]=path.pop();parent.keys.splice(pi,0,up);parent.kids.splice(pi+1,0,r);n=parent;
    }
  }
  height(){let h=1,n=this.root;while(!n.leaf){h++;n=n.kids[0]}return h}
  find(k){const path=[];let n=this.root;while(!n.leaf){path.push(n.id);let i=0;while(i<n.keys.length&&cmp(k,n.keys[i])>=0)i++;n=n.kids[i]}path.push(n.id);const i=n.keys.findIndex(x=>cmp(x,k)===0);return{rids:i>=0?n.vals[i]:[],path}}
  range(lo,hi,loInc=true,hiInc=true){ // returns rids and visited nodes
    const path=[];let n=this.root;while(!n.leaf){path.push(n.id);let i=0;while(i<n.keys.length&&cmp(lo===null?-Infinity:lo,n.keys[i])>=0)i++;n=n.kids[i]}
    const rids=[],visited=[...path];let done=false;
    for(;n&&!done;n=n.next){visited.push(n.id);for(let i=0;i<n.keys.length;i++){const k=n.keys[i];if(lo!==null&&(loInc?cmp(k,lo)<0:cmp(k,lo)<=0))continue;if(hi!==null&&(hiInc?cmp(k,hi)>0:cmp(k,hi)>=0)){done=true;break}rids.push(...n.vals[i])}}
    return{rids,visited};
  }
  levels(){const L=[];let cur=[this.root];while(cur.length){L.push(cur);cur=cur[0].leaf?[]:cur.flatMap(n=>n.kids)}return L}
}

/* =========================================================
   STATISTICS + COST-BASED PLANNER (F08)
   ========================================================= */
function analyze(tb,heap,sampleFrac){
  const rows=tb.rows.slice(0,Math.max(1,Math.floor(tb.rows.length*sampleFrac))),scale=1/sampleFrac;
  const st={rows:Math.round(rows.length*scale),pages:Math.max(1,Math.round(heap.pages.length*(sampleFrac<1?sampleFrac:1)*scale)),cols:{}};
  tb.cols.forEach(c=>{const v=rows.map(r=>r[c.name]).filter(x=>x!=null),d=new Set(v);const o={ndv:d.size,n:v.length};
    if(c.type==='integer'){o.min=Math.min(...v);o.max=Math.max(...v);const B=5,w=(o.max-o.min)/B||1;o.hist=Array(B).fill(0);v.forEach(x=>o.hist[Math.min(B-1,Math.floor((x-o.min)/w))]++);o.w=w}
    else{const f={};v.forEach(x=>f[x]=(f[x]||0)+1);o.mcv=Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,3)}
    st.cols[c.name]=o});
  return st;
}
function selOf(p,st){
  const c=st.cols[p.l.name];if(!c)return 0.33;const v=p.r.lit;
  if(p.l.type==='text'){const m=c.mcv.find(x=>x[0]===String(v));const f=m?m[1]/c.n:1/Math.max(1,c.ndv);return p.op==='='?f:p.op==='!='?1-f:0.33}
  const frac=x=>{if(x<=c.min)return 0;if(x>=c.max)return 1;let acc=0;const b=Math.min(c.hist.length-1,Math.floor((x-c.min)/c.w));for(let i=0;i<b;i++)acc+=c.hist[i];acc+=c.hist[b]*((x-c.min-b*c.w)/c.w);return acc/c.n};
  const lt=frac(v);
  switch(p.op){case'=':return Math.max(1/Math.max(1,c.ndv),0.001);case'!=':return 1-1/Math.max(1,c.ndv);case'<':case'<=':return Math.max(lt,0.001);case'>':case'>=':return Math.max(1-lt,0.001)}return 0.33;
}
function planQuery(b,env){
  const scanFor=tb=>{
    const preds=b.preds.filter(p=>p.l.alias===tb.alias&&p.r.lit!==undefined),st=env.stats[tb.name];
    const sel=preds.reduce((a,p)=>a*selOf(p,st),1),estRows=Math.max(1,st.rows*sel);
    const seq=st.pages+0.01*st.rows+0.0025*st.rows*preds.length;
    let best={type:'SeqScan',tb,preds,est:{rows:estRows,cost:seq},alts:[{name:'Seq Scan',cost:seq}]};
    const ip=env.index&&env.index.table===tb.name?preds.find(p=>p.l.name===env.index.col&&p.op!=='!='):null;
    if(ip){const m=st.rows*selOf(ip,st),pf=Math.min(st.pages,Math.max(1,Math.round(m))),cost=0.5*env.index.tree.height()+4*pf+0.01*m;best.alts.push({name:`Index Scan (${env.index.col})`,cost});if(cost<seq)best={type:'IndexScan',tb,preds,ip,est:{rows:estRows,cost},alts:best.alts}}
    best.alts.sort((a,b)=>a.cost-b.cost);return best;
  };
  let node,joinAlts=null;
  const scans=b.tables.map(scanFor);
  if(scans.length===1)node=scans[0];
  else{
    let [A,B]=scans;const lc=b.join.l,rc=b.join.r;
    if(lc.alias!==A.tb.alias){/* ON written as d.x = t.y: normalise */}
    const stA=env.stats[A.tb.name],stB=env.stats[B.tb.name],ndvA=(stA.cols[(lc.alias===A.tb.alias?lc:rc).name]||{ndv:1}).ndv,ndvB=(stB.cols[(lc.alias===B.tb.alias?lc:rc).name]||{ndv:1}).ndv;
    const rowsOut=Math.max(1,A.est.rows*B.est.rows/Math.max(ndvA,ndvB,1));
    const nl=A.est.cost+A.est.rows*B.est.cost;
    const buildIsB=B.est.rows<=A.est.rows,build=buildIsB?B:A,probe=buildIsB?A:B;
    const hj=A.est.cost+B.est.cost+0.02*(A.est.rows+B.est.rows)+(build.est.rows>env.workMem?build.est.rows*0.05:0);
    joinAlts=[{name:'Nested Loop',cost:nl},{name:'Hash Join',cost:hj}].sort((a,b)=>a.cost-b.cost);
    node=joinAlts[0].name==='Hash Join'?{type:'HashJoin',build,probe,A,B,est:{rows:rowsOut,cost:hj},alts:joinAlts}:{type:'NLJ',A,B,est:{rows:rowsOut,cost:nl},alts:joinAlts};
    node.cond=b.join;
  }
  return{root:node,scans,joinAlts};
}

/* =========================================================
   ITERATOR EXECUTOR (F03) + external sort / hash join (F09)
   ========================================================= */
const OPN={SeqScan:'Seq Scan',IndexScan:'Index Scan',NLJ:'Nested Loop',HashJoin:'Hash Join',Sort:'Sort',Agg:'Aggregate',Project:'Project',Limit:'Limit',Filter:'Filter'};
const cmpOp=(a,op,b)=>{if(a==null||b==null)return false;switch(op){case'=':return a===b;case'!=':return a!==b;case'<':return a<b;case'<=':return a<=b;case'>':return a>b;case'>=':return a>=b}return false};
const qname=c=>c.alias+'.'+c.name;
function mkOp(type,detail,kids,fn){return{type,detail,kids,st:{in:0,out:0,loops:0,pages:0,extra:''},id:0,next:fn,open(){}}}
function buildExec(plan,b,ctx){
  const mv=n=>ctx.heaps[n];
  const tag=ctx.snapshotFor;
  const seqScan=(tb,preds)=>{
    const h=mv(tb.name),op=mkOp('SeqScan',`${tb.name} ${tb.alias}${preds.length?' · filter '+preds.map(p=>`${p.l.name}${p.op}${J(p.r.lit)}`).join(' AND '):''}`,[]);
    let pi=0,ti=0;const snap=h.snapshot(0);op.st.loops=0;
    op.reset=()=>{pi=0;ti=0;op.st.loops++};op.reset();
    op.next=()=>{
      for(;;){
        if(pi>=h.pages.length)return null;const pg=h.pages[pi];
        if(ti===0){ctx.pool.get(tb.name+':'+pi,false);op.st.pages++;ctx.access.push(tb.name+':'+pi)}
        if(ti>=pg.tuples.length){pi++;ti=0;continue}
        const t=pg.tuples[ti++];if(!h.visible(t,snap))continue;op.st.in++;
        const row={};Object.keys(t.row).forEach(k=>row[tb.alias+'.'+k]=t.row[k]);
        if(preds.every(p=>cmpOp(row[qname(p.l)],p.op,p.r.lit))){op.st.out++;return row}
      }
    };return op;
  };
  const indexScan=(tb,preds,ip)=>{
    const h=mv(tb.name),idx=ctx.index.tree,op=mkOp('IndexScan',`${ctx.index.col} ${ip.op} ${J(ip.r.lit)} using btree(${ctx.index.col})`,[]);
    const v=ip.r.lit;let lo=null,hi=null,loI=true,hiI=true;
    if(ip.op==='=')lo=hi=v;else if(ip.op==='>'){lo=v;loI=false}else if(ip.op==='>=')lo=v;else if(ip.op==='<'){hi=v;hiI=false}else if(ip.op==='<=')hi=v;
    const r=idx.range(lo,hi,loI,hiI);op.st.pages=r.visited.length;op.st.extra=`${r.visited.length} index node(s)`;const rids=r.rids;let i=0;const snap=h.snapshot(0);
    op.reset=()=>{i=0;op.st.loops++};op.reset();
    op.next=()=>{
      while(i<rids.length){const[p,s]=rids[i++];ctx.pool.get(tb.name+':'+p,false);ctx.access.push(tb.name+':'+p);op.st.pages++;const t=h.pages[p].tuples[s];if(!h.visible(t,snap))continue;op.st.in++;
        const row={};Object.keys(t.row).forEach(k=>row[tb.alias+'.'+k]=t.row[k]);if(preds.every(pp=>cmpOp(row[qname(pp.l)],pp.op,pp.r.lit))){op.st.out++;return row}}
      return null;
    };return op;
  };
  const scanOf=s=>s.type==='IndexScan'?indexScan(s.tb,s.preds,s.ip):seqScan(s.tb,s.preds);
  let top;const root=plan.root;
  if(root.type==='SeqScan'||root.type==='IndexScan')top=scanOf(root);
  else if(root.type==='NLJ'){
    const outer=scanOf(root.A),jl=b.join.l.alias===root.A.tb.alias?b.join.l:b.join.r,jr=b.join.l.alias===root.A.tb.alias?b.join.r:b.join.l;
    let cur=null,inner=null;const op=mkOp('NLJ',`${qname(jl)} = ${qname(jr)}`,[outer]);
    op.next=()=>{for(;;){if(!cur){cur=outer.next();if(!cur)return null;inner=seqScan(root.B.tb,root.B.preds);op.kids[1]=inner}
      const r=inner.next();if(!r){cur=null;continue}op.st.in++;if(r[qname(jr)]===cur[qname(jl)]){op.st.out++;return{...cur,...r}}}};
    top=op;ctx.nlInnerOps=()=>op.kids[1];op.st.extra='inner side rescanned for every outer row';
  }else{
    const bi=root.build,pr=root.probe,bs=scanOf(bi),ps=scanOf(pr),bc=b.join.l.alias===bi.tb.alias?b.join.l:b.join.r,pcol=b.join.l.alias===bi.tb.alias?b.join.r:b.join.l;

    op.next=()=>{if(!res){const g=new Map();let r;while((r=child.next())){op.st.in++;const k=b.group?r[qname(b.group)]:'';if(!g.has(k))g.set(k,[]);g.get(k).push(r)}

  }

    op.next=()=>{if(!res){res=[];let r;while((r=child.next())){op.st.in++;res.push(r)}const k=b.hasAgg?(b.group&&b.order.col.name===b.group.name?qname(b.group):b.sel.find(s=>s.agg)?.label):qname(b.order.col);res.sort((x,y)=>(b.order.desc?-1:1)*cmp(x[k],y[k]));op.st.extra=`sorted ${res.length} row(s) `+(res.length>ctx.workMem?`(external: exceeds work_mem ${ctx.workMem})`:'in memory')}

  }

    op.next=()=>{const r=child.next();if(!r)return null;op.st.in++;op.st.out++;const o={};b.sel.forEach(s=>{o[s.label]=s.agg?r[s.label]:r[qname(s.col)]});return o};top=op}

  return top;
}
function opList(o,acc=[],d=0){acc.push({o,d});(o.kids||[]).forEach(k=>opList(k,acc,d+1));return acc}
function explainText(top,plan){return opList(top).map(({o,d})=>{const e=o.type==='Project'||o.type==='Limit'||o.type==='Agg'||o.type==='Sort'?'':'';return' '.repeat(d*3)+(d?'-> ':'')+OPN[o.type]+' ('+o.detail+')  rows in/out '+o.st.in+'/'+o.st.out+(o.st.pages?' · pages '+o.st.pages:'')+(o.st.loops>1?' · loops '+o.st.loops:'')+(o.st.extra?'  ['+o.st.extra+']':'')}).join('\n')}

/* ================= config + build ================= */
const OPT={frames:3,pat:'query',fan:4,ikey:'',iop:'=',stale:false,wm:6,mvsc:'snap',walCrash:6,torn:false,vlong:true,vn:10,ckK:8,isc:'nonrep',iso:'rc',
  qpick:0,sort:'ext',fin:3};
let S=null;
function cfgRead(){return{text:$('#src').value,fmt:$('#fmt').value,idx:$('#idxc').value,sql:$('#sql').value}}
function build(){
  const c=cfgRead(),o={cfg:c};
  if(!c.text.trim()){o.error='No data yet.';return o}
  let ds;try{ds=parseWhole(c.text,c.fmt==='auto'?detect(c.text):c.fmt)}catch(e){o.error='Cannot parse input: '+e.message;return o}
  if(!ds.rows.length){o.error='No rows.';return o}
  if(ds.rows.length>300){o.error='Please keep the data under 300 rows.';return o}
  o.rows=ds.rows;o.columns=ds.columns;
  const tcols=ds.columns.map(n=>({name:n,type:typeOfCol(ds.rows,n)}));
  const cat={t:{name:'t',cols:tcols,rows:ds.rows}};
  // dimension table d from a low-cardinality text column
  const dimCol=tcols.find(c=>c.type==='text'&&new Set(ds.rows.map(r=>r[c.name])).size>=2&&new Set(ds.rows.map(r=>r[c.name])).size<=12);
  if(dimCol){const vals=[...new Set(ds.rows.map(r=>r[dimCol.name]))].sort();cat.d={name:'d',cols:[{name:dimCol.name,type:'text'},{name:'label',type:'text'},{name:'weight',type:'integer'}],rows:vals.map((v,i)=>({[dimCol.name]:v,label:'L-'+v,weight:(i+1)*10}))}}
  o.cat=cat;o.dimCol=dimCol&&dimCol.name;
  o.heaps={};Object.values(cat).forEach(tb=>o.heaps[tb.name]=new MV(tb.rows));
  // index
  const ic=c.idx&&c.idx!=='(none)'?tcols.find(x=>x.name===c.idx):null;
  if(ic){const tree=new BT(OPT.fan);o.heaps.t.pages.forEach(pg=>pg.tuples.forEach(t=>tree.insert(t.row[ic.name],t.rid)));o.index={table:'t',col:ic.name,tree}}else o.index=null;
  o.stats={};Object.values(cat).forEach(tb=>o.stats[tb.name]=analyze(tb,o.heaps[tb.name],OPT.stale&&tb.name==='t'?0.34:1));
  o.statsFresh={};Object.values(cat).forEach(tb=>o.statsFresh[tb.name]=analyze(tb,o.heaps[tb.name],1));
  // query
  try{const p=parseSQL(c.sql);o.ast=p.ast;o.tokens=p.tokens;o.bound=bindQuery(p.ast,cat);o.logical=logicalTree(o.bound);
    o.plan=planQuery(o.bound,{stats:o.stats,index:o.index,workMem:OPT.wm});
    const ctx={heaps:o.heaps,pool:new BP(OPT.frames),index:o.index,access:[],trace:[],workMem:OPT.wm};
    const top=buildExec(o.plan,o.bound,ctx);const res=[];let r;while((r=top.next())&&res.length<5000)res.push(r);
    o.ctx=ctx;o.top=top;o.result=res;o.explain=explainText(top,o.plan);
  }catch(e){o.qerr=e.msg||String(e.message||e);if(e.stack&&!e.msg)console.error(e)}
  return o;
}

/* ================= player ================= */
const needQ=()=>S.qerr?`<div class="box bad">The current SQL has an error: ${esc(S.qerr)}. Fix the query or pick an example.</div>`:'';

/* =========================================================
   PHASE 1: SQL → AST → BOUND → LOGICAL (F01)
   ========================================================= */
function draw1(p){
  const stage=p<0.25?1:p<0.5?2:p<0.75?3:4;
  const cat=Object.values(S.cat).map(tb=>`<div class="box"><b>${tb.name}</b> <span class="note">(${tb.rows.length} rows)</span><br>${tb.cols.map(c=>`<span class="chip">${esc(c.name)} ${c.type}</span>`).join(' ')}</div>`).join('');
  let err=S.qerr?`<div class="caption bad"><b>ERROR:</b> ${esc(S.qerr)}<div class="note">Parsing and binding fail with an explicit message before any row is read.</div></div>`:'';
  const toks=S.tokens?`<div class="chips">${S.tokens.map(t=>`<span class="chip" style="border-color:${t.t==='kw'?'var(--acc)':t.t==='str'?'var(--t2)':t.t==='num'?'var(--t1)':'var(--line)'}">${esc(t.t==='str'?"'"+t.v+"'":t.v)}</span>`).join('')}</div>`:'';
  return`<div class="g2"><div><h3 style="margin-top:0">Catalog</h3>${cat}<div class="note">Types are inferred from your data; every table and field has a name and a type, and names are validated at bind time.</div></div>
  <div><h3 style="margin-top:0">${stage>=1?'① Tokens':''}</h3>${S.tokens&&stage>=1?toks:''}${stage>=2&&S.ast?`<h3>② Parsed query (AST)</h3><pre>${esc(J({select:S.ast.sel,from:S.ast.tables,where:S.ast.preds.map(x=>[x.l,x.op,x.r.v]),join:S.ast.join,groupBy:S.ast.group,orderBy:S.ast.order,limit:S.ast.limit}))}</pre>`:''}</div></div>${err}
  ${S.bound&&stage>=3?`<h3>③ Binder: names resolved to typed columns</h3><div class="chips">${S.bound.sel.map(s=>`<span class="chip">${esc(s.label)} → ${s.col?esc(s.col.table+'.'+s.col.name)+' : '+s.col.type:'aggregate'}</span>`).join('')}</div>`:''}
  ${S.logical&&stage>=4?`<h3>④ Logical plan (no data read yet)</h3><pre>${esc(showTree(S.logical))}</pre><div class="note">The logical tree says <i>what</i> to compute (scan, filter, join, aggregate, sort, project, limit). Later phases decide <i>how</i>.</div>`:''}`;
}

/* =========================================================
   PHASE 2: HEAP PAGES + BUFFER POOL (F02)
   ========================================================= */
function pageCard(pg,state,hl){
  const hdr=PHDR,slots=pg.tuples.length*SLOT,tb=pg.tuples.reduce((a,t)=>a+t.bytes,0),free=PAGE-hdr-slots-tb;
  const w=x=>x/PAGE*100;
  return`<div class="pg ${state||''} ${hl?'dirty':''}"><h5>page ${pg.no} · ${pg.tuples.length} tuples · free ${free} B</h5><div class="pgbar"><i style="width:${w(hdr)}%;background:var(--t7)" title="header"></i><i style="width:${w(slots)}%;background:var(--t0)" title="slot array"></i><i style="width:${w(free)}%;background:var(--card)" title="free space"></i><i style="width:${w(tb)}%;background:var(--t1)" title="tuples"></i></div>${pg.tuples.slice(0,10).map(t=>`<span class="tup ${t.dead?'dead':''}" title="${esc(J(t.row))}">(${t.rid[0]},${t.rid[1]})</span>`).join('')}${pg.tuples.length>10?'…':''}</div>`;
}
function accessPattern(){
  const h=S.heaps.t,n=h.pages.length;
  if(OPT.pat==='query'&&S.ctx&&S.ctx.access.length)return{acc:S.ctx.access.map(k=>({k,w:false})),label:'the page accesses of your query'};
  if(OPT.pat==='seq2'){const a=[];for(let r=0;r<2;r++)for(let i=0;i<n;i++)a.push({k:'t:'+i,w:false});return{acc:a,label:'two sequential scans of the whole table'}}
  if(OPT.pat==='random'){const rnd=lcg(5),a=[];for(let i=0;i<30;i++)a.push({k:'t:'+Math.floor(Math.pow(rnd(),2)*n),w:false});return{acc:a,label:'30 skewed random page reads (hot pages)'}}
  const a=[];for(let i=0;i<n;i++){a.push({k:'t:'+i,w:i%2===0})}for(let i=0;i<n;i++)a.push({k:'t:'+i,w:false});return{acc:a,label:'a scan that updates every second page, then a second scan'}
}
function draw2(p){
  const h=S.heaps.t,pa=accessPattern(),pool=new BP(OPT.frames);pa.acc.forEach(a=>pool.get(a.k,a.w));
  const k=p>=1?pa.acc.length:Math.max(1,Math.ceil(p*pa.acc.length)),L=pool.log[k-1]||pool.log[0];
  let hit=0,miss=0,ev=0,fl=0;pool.log.slice(0,k).forEach(l=>{if(l.kind==='hit')hit++;else miss++;if(l.ev)ev++;if(l.fl)fl++});
  const pages=h.pages.map(pg=>{const f=L&&L.frames.find(x=>x.k==='t:'+pg.no);return pageCard(pg,L&&L.k==='t:'+pg.no?(L.kind==='hit'?'hit':'miss'):'',f&&f.d)}).join('');
  const frames=Array.from({length:OPT.frames},(_,i)=>{const f=L&&L.frames[i];return`<div class="pg ${f&&f.d?'dirty':''} ${f&&L.k===f.k?(L.kind==='hit'?'hit':'miss'):''}" style="min-height:44px"><h5>frame ${i}</h5>${f?`<b>${esc(f.k)}</b>${f.d?' <span class="tag o">dirty</span>':''}`:'<span class="note">empty</span>'}</div>`}).join('');
  return`<div class="caption">Access ${k}/${pa.acc.length} (${esc(pa.label)}): page <b>${esc(L.k)}</b> → <b class="${L.kind==='hit'?'ok':'bad'}">${L.kind==='hit'?'buffer hit':'miss: read from disk'}</b>${L.ev?`; evicted <b>${esc(L.ev)}</b>${L.fl?' (dirty: flushed first)':''}`:''}</div>
  <h3>Heap file: ${h.pages.length} slotted pages of ${PAGE} B (header · slot array · free space · tuples growing from the end)</h3><div class="grid">${pages}</div>
  <h3>Buffer pool: ${OPT.frames} frame(s)</h3><div class="grid" style="grid-template-columns:repeat(${Math.min(OPT.frames,4)},1fr)">${frames}</div>
  <div class="chips" style="margin-top:8px"><span class="chip ok">hits ${hit}</span><span class="chip bad">misses ${miss}</span><span class="chip">evictions ${ev}</span><span class="chip">dirty flushes ${fl}</span><span class="chip">hit rate ${(hit/Math.max(1,hit+miss)*100).toFixed(0)}%</span></div>
  <div class="note">A row is addressed by a stable row ID (page, slot). Pages are read through a fixed number of frames: a finite cache can thrash when a scan is bigger than the pool (try 2 frames with “two full scans”). Dirty pages must be written before their frame is reused.</div>`;
}

/* =========================================================
   PHASE 3: ITERATOR EXECUTION (F03)
   ========================================================= */

  <h3>EXPLAIN ANALYZE (actual counters)</h3><pre>${esc(S.explain)}</pre></div></div>
  <div class="chips" style="margin-top:6px"><span class="chip">buffer hits ${S.ctx.pool.s.hit}</span><span class="chip">buffer misses ${S.ctx.pool.s.miss}</span><span class="chip">pages touched ${S.ctx.access.length}</span></div>`;

/* =========================================================
   PHASE 4: B-TREE INDEX (F04)
   ========================================================= */
function numericCols(){return S.cat.t.cols.filter(c=>c.type==='integer').map(c=>c.name)}
function draw4(p){
