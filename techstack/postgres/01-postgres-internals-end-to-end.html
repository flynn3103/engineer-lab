  const h=S.heaps.t,entries=[];h.pages.forEach(pg=>pg.tuples.forEach(t=>entries.push([t.row[col],t.rid])));
  const k=Math.max(1,Math.min(entries.length,Math.ceil(clamp(p/0.7,0,1)*entries.length)||1)),tr=new BT(OPT.fan);entries.slice(0,p>=1?entries.length:k).forEach(([kv,rid])=>tr.insert(kv,rid));
  const lv=tr.levels(),W=900,rows=lv.length,H=rows*62+10;
  const probe=OPT.ikey===''?entries[Math.floor(entries.length/2)][0]:(isNaN(Number(OPT.ikey))?OPT.ikey:Number(OPT.ikey));
  const look=(S.cfg.idx===col||true)?tr.find(probe):{rids:[],path:[]},pathSet=new Set(look.path);
  let sv=`<div class="hscroll"><svg viewBox="0 0 ${W} ${H}" style="max-height:${H}px;min-width:${Math.max(560,Math.max(...lv.map(l=>l.length))*58)}px">`;
  lv.forEach((nodes,li)=>{const y=6+li*62,w=Math.min(190,(W-20)/nodes.length-8);nodes.forEach((n,i)=>{const x=10+(W-20)*(i+0.5)/nodes.length-w/2;n._x=x+w/2;n._y=y;
    sv+=`<g><rect x="${x}" y="${y}" width="${w}" height="34" rx="6" fill="${pathSet.has(n.id)&&p>=0.7?'var(--p4)':n.leaf?'var(--p2)':'var(--p0)'}" stroke="${pathSet.has(n.id)&&p>=0.7?'var(--acc2)':'var(--line)'}" stroke-width="${pathSet.has(n.id)&&p>=0.7?3:1.5}"/><text x="${x+5}" y="${y+14}" style="font-size:9px;fill:var(--mut)">${n.leaf?'leaf':'internal'} #${n.id}</text><text x="${x+5}" y="${y+28}" style="font-size:10.5px">${esc(short(n.keys.join(' | '),Math.floor(w/6.4)))}</text></g>`})});
  lv.forEach((nodes,li)=>{if(li===0)return;lv[li-1].forEach(par=>{if(par.leaf)return;par.kids.forEach(ch=>{sv+=`<line x1="${par._x}" y1="${par._y+34}" x2="${ch._x}" y2="${ch._y}" stroke="var(--mut)"/>`})})});sv+='</svg></div>';
  // cost comparison for predicate col OP probe
  const full=new BT(OPT.fan);entries.forEach(([kv,rid])=>full.insert(kv,rid));
  const op=OPT.iop,lo=op==='>='||op==='>'?probe:null,hi=op==='<='||op==='<'?probe:null,rr=op==='='?full.find(probe):full.range(lo,hi,op!=='>',op!=='<');const rids=op==='='?rr.rids:rr.rids,nodes=op==='='?rr.path.length:rr.visited.length;
  const heapPages=new Set(rids.map(r=>r[0])).size;
  const splitCt=tr.events.filter(e=>e.t==='split').length;
  return`<div class="caption">Building a B+tree on <b>${esc(col)}</b> (max ${OPT.fan-1} keys per node): inserted ${p>=1?entries.length:k}/${entries.length} keys, <b>${splitCt}</b> page split(s), height <b>${tr.height()}</b>. Internal nodes route; leaves hold (key → row ID) and are chained for range scans.</div>${sv}
  <div class="g2"><div><h3>Lookup <span class="mono">${esc(col)} = ${esc(probe)}</span> (highlighted path)</h3><div class="chips">${look.path.map(id=>`<span class="chip">node #${id}</span>`).join(' → ')}</div><div class="note">${look.rids.length} row ID(s): ${look.rids.slice(0,6).map(r=>'('+r+')').join(' ')} — root-to-leaf in ${look.path.length} page reads instead of scanning ${h.pages.length} heap pages.</div></div>
  <div><h3>Index scan vs sequential scan: <span class="mono">${esc(col)} ${esc(op)} ${esc(probe)}</span></h3><table><tr><th></th><th class="n">index pages</th><th class="n">heap pages</th><th class="n">total I/O</th></tr><tr><td>Index scan</td><td class="n">${nodes}</td><td class="n">${heapPages}</td><td class="n"><b>${nodes+heapPages}</b></td></tr><tr><td>Seq scan</td><td class="n">0</td><td class="n">${h.pages.length}</td><td class="n"><b>${h.pages.length}</b></td></tr></table>
   <div class="note">${rids.length} of ${entries.length} rows match. Selective predicates favour the index; when many rows match, the random heap fetches cost more than one sequential pass. The index scan still re-checks each heap tuple's visibility (chapter 5).</div></div></div>`;
}

/* =========================================================
   PHASE 5: TRANSACTIONS + MVCC (F05)
   ========================================================= */
function mvTable(){
  const t=S.cat.t,key=t.cols[0].name,val=numericCols().find(c=>c!==key)||numericCols()[0]||null;
  return{key,val,rows:t.rows.slice(0,4).map((r,i)=>({[key]:r[key],val:val?r[val]:100*(i+1)}))};
}
const MVSC={
  snap:{title:'A snapshot never sees later commits',steps:[['A','BEGIN'],['A','SELECT',0],['B','BEGIN'],['B','UPDATE',0,50],['B','COMMIT'],['A','SELECT',0],['A','COMMIT'],['A','BEGIN'],['A','SELECT',0],['A','COMMIT']],verdict:'A read the old version for its whole transaction, even after B committed; readers never blocked and writers never waited. A new transaction sees the new version. (One snapshot per transaction, as in REPEATABLE READ; under READ COMMITTED, the default, the second SELECT would already see B\'s value: chapter 11.)'},
  rollback:{title:'Rollback leaves a dead, invisible version',steps:[['A','BEGIN'],['A','UPDATE',1,70],['B','BEGIN'],['B','SELECT',1],['A','ROLLBACK'],['B','SELECT',1],['B','COMMIT']],verdict:'While A was open, B saw the old row; after ROLLBACK the version A wrote is aborted and permanently invisible (vacuum can remove it later).'},
  conflict:{title:'Write-write conflict: first updater wins',steps:[['A','BEGIN'],['B','BEGIN'],['A','UPDATE',2,10],['B','UPDATE',2,20],['A','COMMIT'],['B','ROLLBACK']],verdict:'B tried to update a row A had already changed: B waited for A, and once A committed B had to abort (its snapshot is older than A\'s commit). That is the REPEATABLE READ rule; under READ COMMITTED B would redo its update on A\'s new version (chapter 11). Readers still never block.'},
  delete:{title:'Insert and delete are versions too',steps:[['A','BEGIN'],['B','BEGIN'],['B','DELETE',3],['B','INSERT'],['B','COMMIT'],['A','SELECT*'],['A','COMMIT'],['C','BEGIN'],['C','SELECT*'],['C','COMMIT']],verdict:'A\'s snapshot still sees the deleted row and not the inserted one (no phantom, no missing row); a later transaction sees the new state.'},
};
function runMV(name){
  const mt=mvTable(),sc=MVSC[name],mv=new MV(mt.rows),S_={},frames=[],waits=[];
  const fmtRow=r=>r?J(r):'(none)';
  const sel=(s,k)=>{const sn=S_[s].snap;const t=mv.all().find(t=>t.rid[1]!==undefined&&mv.visible(t,sn)&&String(t.row[mt.key])===String(mt.rows[k][mt.key]));return t?t.row.val:null};
  const exec=(s,a,k,v,retry)=>{
    let reply='';
    switch(a){
      case'BEGIN':{const x=mv.begin();S_[s]={x,snap:null};S_[s].snap=mv.snapshot(x);reply=`txid ${x}, snapshot: sees commits < ${S_[s].snap.xmax}${S_[s].snap.xip.length?' except in-progress {'+S_[s].snap.xip+'}':''}`;break}
      case'SELECT':reply=`val = ${J(sel(s,k))}`;break;
      case'SELECT*':{const rows=mv.all().filter(t=>mv.visible(t,S_[s].snap)).map(t=>t.row[mt.key]);reply=`rows: ${rows.join(', ')}`;break}
      case'UPDATE':{const t=mv.all().find(t=>mv.visible(t,S_[s].snap)&&String(t.row[mt.key])===String(mt.rows[k][mt.key]));
        if(!t){reply='0 rows';break}
        if(t.xmax&&mv.status[t.xmax]==='active'&&t.xmax!==S_[s].x){waits.push({s,blocker:Object.keys(S_).find(q=>S_[q].x===t.xmax),a,k,v});reply=`⏳ WAITS for txid ${t.xmax} (row locked by an in-progress update)`;return{reply,blocked:true}}
        if(t.xmax&&mv.status[t.xmax]==='committed'){reply='ERROR: could not serialize access due to concurrent update';return{reply,error:true}}
        const nr={...t.row,val:t.row.val+v};mv.update(S_[s].x,t,nr);reply=`UPDATE 1 (new version val=${nr.val}, old version gets xmax=${S_[s].x})`;break}
      case'DELETE':{const t=mv.all().find(t=>mv.visible(t,S_[s].snap)&&String(t.row[mt.key])===String(mt.rows[k][mt.key]));if(t){t.xmax=S_[s].x;reply='DELETE 1 (xmax set)'}else reply='0 rows';break}
      case'INSERT':{mv.put(S_[s].x,{[mt.key]:'new-row',val:999});reply='INSERT 1 (new tuple with xmin='+S_[s].x+')';break}
      case'COMMIT':mv.commit(S_[s].x);reply='COMMIT';break;
      case'ROLLBACK':mv.abort(S_[s].x);reply='ROLLBACK';break;
    }
    return{reply};
  };
  sc.steps.forEach(([s,a,k,v],i)=>{
    if(!S_[s]&&a!=='BEGIN')S_[s]={x:0,snap:null};
    const r=exec(s,a,k,v);
    let after=[];
    if(a==='COMMIT'||a==='ROLLBACK'){waits.filter(w=>w.blocker===s).forEach(w=>{const rr=a==='COMMIT'?{reply:'ERROR: could not serialize access due to concurrent update (the blocker committed)'}:exec(w.s,w.a,w.k,w.v,true);after.push(`${w.s} resumes → ${rr.reply}`);waits.splice(waits.indexOf(w),1)})}
    frames.push({i,s,a,k,v,reply:r.reply,after,tuples:mv.all().map(t=>({rid:t.rid,row:t.row,xmin:t.xmin,xmax:t.xmax,st:mv.status[t.xmin],sx:t.xmax?mv.status[t.xmax]:null,dead:t.dead,visA:S_.A&&S_.A.snap?mv.visible(t,S_.A.snap):false,visB:S_.B&&S_.B.snap?mv.visible(t,S_.B.snap):false})),status:{...mv.status}});
  });
  return{sc,frames,mt};
}
function draw5(p){
  const R=runMV(OPT.mvsc),k=p>=1?R.frames.length:Math.max(1,Math.ceil(p*R.frames.length)),f=R.frames[k-1];
  return`<div class="caption">${esc(R.sc.title)} · step ${k}/${R.frames.length}: <b>${f.s}</b> <span class="mono">${esc(f.a)}${f.k!==undefined?' row '+f.k:''}</span> → ${esc(f.reply)}${f.after.map(a=>'<br>↳ '+esc(a)).join('')}</div>
  <div class="g2"><div><table><tr><th>#</th><th>session</th><th>statement</th><th>result</th></tr>${R.frames.slice(0,k).map((x,i)=>`<tr style="${i===k-1?'background:var(--p0)':''}"><td>${i+1}</td><td><b>${x.s}</b></td><td class="mono">${esc(x.a)}${x.k!==undefined?' #'+x.k:''}</td><td class="mono">${esc(short(x.reply,70))}</td></tr>`).join('')}</table></div>
  <div><h3 style="margin-top:0">Heap tuples (versions)</h3><table><tr><th>rid</th><th>row</th><th>xmin</th><th>xmax</th><th>A sees</th><th>B sees</th></tr>${f.tuples.map(t=>`<tr style="${t.st==='aborted'?'opacity:.5':''}"><td>(${t.rid})</td><td class="mono">${esc(short(J(t.row),30))}</td><td>${t.xmin} <small>${t.st[0]}</small></td><td>${t.xmax||'-'}${t.sx?' <small>'+t.sx[0]+'</small>':''}</td><td>${t.visA?'<b class="ok">✔</b>':''}</td><td>${t.visB?'<b class="ok">✔</b>':''}</td></tr>`).join('')}</table><div class="note">c = committed, a = aborted/active</div></div></div>
  ${p>=1?`<div class="caption good">${esc(R.sc.verdict)}</div>`:''}
  <div class="note">An update never overwrites a row: it stamps the old version with <b>xmax</b> and adds a new version with <b>xmin</b>. A snapshot (the set of transactions visible at its start) decides which version each reader sees, so readers don't block writers. Dead versions accumulate until VACUUM (chapter 7).</div>`;
}

/* =========================================================
   PHASE 6: WAL + CRASH RECOVERY (F06)
   ========================================================= */
function walSim(crashAt,torn){
  const mt=mvTable(),rows=mt.rows.slice(0,3);
  const ops=[['T2','UPDATE',0,10],['T3','UPDATE',1,20],['T2','COMMIT'],['FLUSHPAGE',0],['T3','UPDATE',2,30],['T4','UPDATE',0,5],['T4','COMMIT'],['T3','UPDATE',1,7]];
  const disk=[{lsn:0,tup:rows.map((r,i)=>({slot:i,row:{...r},xmin:1,xmax:0}))}],buf=JSON.parse(JSON.stringify(disk));
  const wal=[];let lsn=0,flushed=0;const acked=[];const log=[];
  const append=rec=>{rec.lsn=++lsn;wal.push(rec);return rec};
  const flushWal=to=>{flushed=Math.max(flushed,to)};
  const xids={T2:2,T3:3,T4:4};
  ops.slice(0,crashAt).forEach((op,i)=>{
    const [who,a,k,v]=op;let note='';
    if(who==='FLUSHPAGE'){const pg=buf[0];if(pg.lsn>flushed){flushWal(pg.lsn);note=`write-ahead rule: page LSN ${pg.lsn} > flushed WAL → flush WAL up to ${pg.lsn} first. `}disk[0]=JSON.parse(JSON.stringify(pg));note+=`page 0 written to disk (pageLSN ${pg.lsn})`}
    else if(a==='UPDATE'){const x=xids[who],cur=buf[0].tup.filter(t=>t.slot===k||t.slot===k).slice(-1)[0];const nl=buf[0].tup.length;
      const oldv=[...buf[0].tup].reverse().find(t=>t.row.val!==undefined&&String(t.row[mt.key])===String(rows[k][mt.key])&&!t.xmax);
      const rec=append({xid:x,type:'UPDATE',slot:oldv?oldv.slot:-1,newSlot:nl,row:{...rows[k],val:(oldv?oldv.row.val:0)+v}});
      if(oldv)oldv.xmax=x;buf[0].tup.push({slot:nl,row:rec.row,xmin:x,xmax:0});buf[0].lsn=rec.lsn;note=`WAL record LSN ${rec.lsn} (xid ${x}) written to the log buffer BEFORE the page change is visible to disk; page 0 is dirty`}
    else if(a==='COMMIT'){const x=xids[who],rec=append({xid:x,type:'COMMIT'});flushWal(rec.lsn);acked.push(x);note=`COMMIT record LSN ${rec.lsn}; WAL flushed to ${flushed} before the client gets "COMMIT"`}
    log.push({who,op:a==='FLUSHPAGE'?'':a,txt:who==='FLUSHPAGE'?'background writer':'',note});
  });
  // crash
  const surviving=wal.filter(r=>r.lsn<=flushed);let torn_=null;
  let walBytes=surviving.map(r=>J(r)).join('\n');
  const inflight=wal.find(r=>r.lsn>flushed);
  if(torn&&inflight){const ls=J(inflight);walBytes+=(walBytes?'\n':'')+ls.slice(0,Math.floor(ls.length*0.55));torn_=inflight}
  // recovery: validate, redo all, commit status from COMMIT records
  const valid=[];walBytes.split('\n').filter(Boolean).forEach(line=>{try{valid.push(JSON.parse(line))}catch{}});
  const committed=new Set(valid.filter(r=>r.type==='COMMIT').map(r=>r.xid));
  const rec=JSON.parse(JSON.stringify(disk));let redone=0,skipped=0;
  valid.forEach(r=>{if(r.type!=='UPDATE')return;const pg=rec[0];if(r.lsn<=pg.lsn){skipped++;return}const old=pg.tup.find(t=>t.slot===r.slot);if(old)old.xmax=r.xid;if(!pg.tup.some(t=>t.slot===r.newSlot))pg.tup.push({slot:r.newSlot,row:r.row,xmin:r.xid,xmax:0});pg.lsn=r.lsn;redone++});
  const visibleOf=pg=>pg.tup.filter(t=>(t.xmin===1||committed.has(t.xmin))&&!(t.xmax&&committed.has(t.xmax))).map(t=>({k:t.row[mt.key],v:t.row.val}));
  const after=visibleOf(rec[0]);
  const expect=rows.map((r,i)=>{let v=r.val;ops.slice(0,crashAt).forEach(op=>{});return{k:r[mt.key],v}});
  // expected = initial + updates of txns whose COMMIT was acknowledged
  const exp=rows.map(r=>({k:r[mt.key],v:r.val}));ops.slice(0,crashAt).forEach(op=>{if(op[1]==='UPDATE'&&acked.includes(xids[op[0]])){const e=exp[op[2]];e.v+=op[3]}});
  const ok=exp.every(e=>{const g=after.find(x=>String(x.k)===String(e.k));return g&&g.v===e.v});
  return{ops,log,wal,flushed,disk,buf,surviving,valid,committed,rec,redone,skipped,after,exp,ok,acked,mt,torn:!!torn_,nValid:valid.length,total:surviving.length,crashAt};
}
function draw6(p){
  const k=OPT.walCrash,W=walSim(k,OPT.torn),show=Math.ceil(clamp(p/0.6,0,1)*W.log.length),rp=p>=0.6;
  const pgBox=(t,lbl)=>`<div class="box"><b>${lbl}</b> <span class="note">pageLSN ${t.lsn}</span><div>${t.tup.map(x=>`<span class="tup ${x.xmin!==1&&!W.committed.has(x.xmin)?'unc':x.xmax&&W.committed.has(x.xmax)?'dead':'live'}" title="xmin ${x.xmin} xmax ${x.xmax}${x.xmin!==1&&!W.committed.has(x.xmin)?' (no COMMIT record: invisible)':''}">${esc(x.row[W.mt.key])}:${x.row.val} <small>x${x.xmin}</small></span>`).join('')}</div></div>`;
  return`<div class="caption">Crash after step ${k}/${W.ops.length}. WAL flushed up to LSN <b>${W.flushed}</b> of ${W.wal.length}; acknowledged commits: ${W.acked.length?W.acked.map(x=>'xid '+x).join(', '):'none'}. ${OPT.torn?'<span class="bad">The in-flight WAL record (never flushed, never acknowledged) is torn mid-write and is rejected on replay.</span>':''}</div>
  <div class="g2"><div><h3 style="margin-top:0">Before the crash</h3>${W.log.slice(0,show).map((l,i)=>`<div class="row"><b>${l.who}</b> ${esc(l.op)} · ${esc(l.note)}</div>`).join('')||'<div class="note">…</div>'}</div>
  <div><h3 style="margin-top:0">Log vs pages</h3><table><tr><th>LSN</th><th>xid</th><th>record</th><th>on disk?</th></tr>${W.wal.map(r=>`<tr><td>${r.lsn}</td><td>${r.xid}</td><td class="mono">${r.type}${r.type==='UPDATE'?' → '+esc(J(r.row)):''}</td><td>${r.lsn<=W.flushed?'<span class="ok">flushed</span>':'<span class="bad">lost</span>'}</td></tr>`).join('')||'<tr><td colspan="4">no records</td></tr>'}</table></div></div>
  ${rp?`<h3>Recovery after restart</h3><div class="g2"><div>${pgBox(W.disk[0],'page 0 as found on disk (stale)')}<div class="note">The data page on disk may miss changes: pages are written lazily, only the log is forced at commit.</div></div>
  <div>${pgBox(W.rec[0],'page 0 after replay')}<div class="note">Validated ${W.nValid}/${W.total} WAL record(s) (torn tail ignored), redid ${W.redone}, skipped ${W.skipped} already on the page (pageLSN check makes replay idempotent). Committed xids found in the log: {${[...W.committed].join(', ')||'-'}}.</div></div></div>
  <div class="caption ${W.ok?'good':'bad'}">Recovered visible state: ${W.after.map(x=>esc(x.k)+'='+x.v).join(', ')}. ${W.ok?'<b class="ok">Every acknowledged commit survived and uncommitted work (xid 3) stayed invisible ✔</b>':'<b class="bad">Mismatch with acknowledged commits ✘</b>'}</div>`:''}
  <div class="note">Rule 1: a change is logged <i>before</i> its page may be written (log-before-data). Rule 2: COMMIT is acknowledged only after its log record is on disk. Dirty pages can be flushed whenever; after a crash the log is validated, replayed, and a torn last record is rejected. Transactions without a COMMIT record never become visible (dashed versions above).</div>`;
}

/* =========================================================
   PHASE 7: VACUUM (F07)
   ========================================================= */
function vacSim(){
  const mt=mvTable(),mv=new MV(S.cat.t.rows.slice(0,12).map((r,i)=>({[mt.key]:r[mt.key],val:mt.val?r[mt.val]:100+i})));

function extSort(vals,W,fan){

  while(cur.length>1){const nx=[];for(let i=0;i<cur.length;i+=fan)nx.push(cur.slice(i,i+fan).flat().sort((a,b)=>cmp(a,b)));cur=nx;passes++;gens.push(cur.map(r=>r.length))}

}
function hashJoinSpill(R,Sx,W,nPart){

  return{inMem,parts,out,files:parts.length*2,spilled:build.length+probe.length};
}

/* =========================================================

    if(K>0&&i%K===0){flushes+=dirty.size;events.push({t:'ckpt',lsn,flush:dirty.size});dirty.clear();redo=lsn}}

  return{recs,events,flushes,redo,replay,segs,retired,keep:segs-retired,K,n,dirtyEnd:dirty.size};
}

/* =========================================================
   PHASE 11: ISOLATION LEVELS + DEADLOCK (F11)
   ========================================================= */
function runIso(sc,level){

  const upd=(s,key,fn,desc)=>{const sn=readOnce(s),t=find(s,key,sn);if(!t){trace.push([s,desc,'0 rows']);return}
    // latest committed version if another txn changed it (read committed re-evaluates)
    const latest=mv.all().find(x=>!x.dead&&x.row[mt.key]===key&&!x.xmax&&(mv.status[x.xmin]==='committed'||x.xmin===ses[s].x));
    if(t.xmax&&mv.status[t.xmax]==='committed'&&t.xmax!==ses[s].x){if(level==='rr'){trace.push([s,desc,'ERROR: could not serialize access due to concurrent update']);ses[s].err=true;return}
      if(latest){const nv=fn(latest.row.val);mv.update(ses[s].x,latest,{...latest.row,val:nv});trace.push([s,desc,`re-evaluated on the newest committed row (${latest.row.val}) → ${nv}`]);return}}

  const ins=(s,key,val)=>{mv.put(ses[s].x,{[mt.key]:key,val});trace.push([s,`INSERT (${key}, ${val})`,'INSERT 1'])};

  if(sc==='nonrep'){begin('A');begin('B');const a1=sel('A','x');upd('B','x',v=>v+50,"UPDATE SET val=val+50 WHERE k='x'");com('B');const a2=sel('A','x');com('A');verdict=a1===a2?`A read ${a1} twice: <b class="ok">repeatable</b>.`:`A read ${a1} then ${a2} inside one transaction: <b class="bad">non-repeatable read</b> (Read Committed refreshes the snapshot each statement).`}
  if(sc==='phantom'){begin('A');begin('B');const c1=cnt('A',100);ins('B','w',150);com('B');const c2=cnt('A',100);com('A');verdict=c1===c2?`The same count query returned ${c1} both times: <b class="ok">no phantom</b> (the snapshot excludes B's new row).`:`count went ${c1} → ${c2}: <b class="bad">phantom row</b> appeared mid-transaction.`}
  if(sc==='skew'){begin('A');begin('B');const a=cnt('A',100),b=cnt('B',100);if(a>=2)upd('A','x',v=>v-100,"UPDATE x (on duty ≥2, so I may leave)");if(b>=2)upd('B','y',v=>v-100,"UPDATE y (on duty ≥2, so I may leave)");com('A');com('B');
    const sn=mv.snapshot(0),left=mv.all().filter(t=>mv.visible(t,sn)&&t.row.val>=100).length;verdict=left<2?`Both transactions saw 3 people on duty, each removed a <i>different</i> row and both committed: <b class="bad">write skew</b> (only ${left} left). Neither level prevents it here: it needs SERIALIZABLE (SSI), which this model omits.`:'No skew.'}
  if(sc==='lost'){begin('A');begin('B');sel('A','x');sel('B','x');upd('A','x',v=>v+10,"UPDATE SET val=val+10 WHERE k='x'");com('A');upd('B','x',v=>v+20,"UPDATE SET val=val+20 WHERE k='x'");com('B');const sn=mv.snapshot(0),t=find('A','x',sn);
    verdict=level==='rc'?`B's UPDATE worked on the newest committed row and added 20 to 110: final <b>${t.row.val}</b>, <b class="ok">no lost update</b> (had A still been open, B would have waited for it).`:`Under Repeatable Read B could not update a row changed after its snapshot: <b class="bad">it aborts</b> (serialization failure) and must retry. Final ${t.row.val}.`}
  return{trace,verdict};
}

    return`<div class="caption ${det?'bad':''}">Deadlock: two transactions lock two rows in opposite order. ${det?'The deadlock detector finds the cycle in the wait-for graph (after deadlock_timeout) and aborts one victim, releasing its locks.':''}</div>
    <div class="g2"><div><table><tr><th>session</th><th>statement</th><th>result</th></tr>${ev.slice(0,k).map(e=>`<tr><td><b>${e[0]}</b></td><td class="mono">${e[1]}</td><td>${e[2]}</td></tr>`).join('')}</table>${det?`<div class="caption ${res?'good':'bad'}" style="margin-top:8px">${res?'<b>B is aborted as the victim</b> (ERROR: deadlock detected). A acquires r2 and commits; B can retry. In PostgreSQL the victim is the waiter whose <code>deadlock_timeout</code> check finds the cycle. Without detection both would wait forever.':'detecting…'}</div>`:''}</div><div>${sv}<div class="note">Edges mean “waits for”. A cycle can never resolve by waiting, so one transaction must abort. A simple alternative is a lock timeout, which also breaks the cycle but aborts on any long wait.</div></div></div>`;

  return`<div class="caption">${titles[OPT.isc]} under <b>${OPT.iso==='rc'?'Read Committed (new snapshot per statement)':'Repeatable Read (one snapshot per transaction)'}</b>.</div>

function exampleQueries(ds){
  const cols=ds.columns,num=cols.filter(c=>ds.rows.every(r=>r[c]==null||typeof r[c]==='number')),txt=cols.filter(c=>!num.includes(c)),key=cols[0];
  const n=num.find(c=>c!==key)||num[0]||key,dim=txt.find(c=>{const d=new Set(ds.rows.map(r=>r[c])).size;return d>=2&&d<=12}),med=[...ds.rows.map(r=>r[n])].sort((a,b)=>a-b)[Math.floor(ds.rows.length*0.5)];
  const q=[];
  q.push([`Filter + sort + limit`,`SELECT t.${key}, t.${n} FROM t WHERE t.${n} >= ${med} ORDER BY t.${n} DESC LIMIT 5`]);
  q.push([`Point lookup`,`SELECT * FROM t WHERE t.${n} = ${ds.rows[2][n]}`]);
  q.push([`Range scan`,`SELECT t.${key}, t.${n} FROM t WHERE t.${n} > ${ds.rows[Math.floor(ds.rows.length*0.8)][n]}`]);
  if(dim){q.push([`Join with d`,`SELECT t.${key}, d.label FROM t JOIN d ON t.${dim} = d.${dim} WHERE t.${n} >= ${med}`]);q.push([`Group by`,`SELECT t.${dim}, COUNT(*), AVG(t.${n}) FROM t GROUP BY t.${dim} ORDER BY t.${dim}`])}
  q.push([`Error: unknown column`,`SELECT t.nope FROM t`]);q.push([`Error: type mismatch`,`SELECT * FROM t WHERE t.${n} = 'abc'`]);
  return{q,n,dim};
}

  {m:"Sort or aggregate spill",s:"EXPLAIN shows Sort Method: external merge Disk, or HashAggregate batches greater than 1",x:"Raise work_mem for that session or role, add an index that provides the order, or reduce rows earlier."},
  {m:"Per-row function overhead",s:"CPU-bound query with a volatile or slow function in WHERE or SELECT",x:"Mark functions with correct volatility (IMMUTABLE or STABLE), move work out of the row loop, or precompute."},
  {m:"Large OFFSET paging",s:"Page N of results gets slower as N grows",x:"Use keyset pagination (WHERE key greater than last seen) with a supporting index."}],
 watch:["EXPLAIN (ANALYZE, BUFFERS): compare rows estimated vs actual and look at loops on inner nodes.","Look for Sort Method: external merge or Batches greater than 1 in hash nodes.","pg_stat_statements: temp_blks_written and mean_exec_time identify spilling statements."]},

{how:"The default index is a B+tree: each 8 kB page holds ordered keys and pointers, with internal pages guiding the descent and leaf pages holding (key, heap ctid) and linked left and right for range scans. Inserts go to the correct leaf; a full page splits and pushes a separator key up. Index-only scans can skip the heap when the visibility map says the page is all-visible.",
 pros:["Logarithmic lookups: a few page reads reach any row even in huge tables.","Leaf links make range scans, ORDER BY and merge joins efficient and ordered.","Covering indexes (INCLUDE) plus the visibility map allow index-only scans.","Unique indexes enforce constraints and support ON CONFLICT."],
 cons:["Every insert, update of an indexed column and delete touches each index, adding write amplification and WAL.","Non-HOT updates must insert new entries in all indexes, since each new row version has a new ctid.","Random-keyed indexes (for example UUID v4) cause scattered writes and page splits.","Unselective predicates make index scans slower than a sequential scan due to random I/O."],
 fails:[{m:"Index bloat",s:"Index size grows far beyond live data; lookups touch many sparse pages",x:"REINDEX CONCURRENTLY, tune autovacuum, and avoid patterns that leave sparse leaf pages."},
  {m:"Unused or duplicate indexes",s:"Writes slow down and disk grows with indexes whose idx_scan stays at zero",x:"Check pg_stat_user_indexes and drop unused or redundant indexes after confirming on replicas too."},
  {m:"Index not used",s:"Seq Scan despite an index; function or cast on the column, or low selectivity",x:"Match expression or type, add an expression or partial index, and refresh statistics."},
  {m:"Blocking index build",s:"CREATE INDEX blocks writes on a busy table for a long time",x:"Use CREATE INDEX CONCURRENTLY and check for invalid indexes if it fails midway."}],
 watch:["pg_stat_user_indexes: idx_scan equal to zero for weeks means a candidate to drop.","pgstattuple or pgstatindex: low avg_leaf_density or high leaf_fragmentation signals bloat.","EXPLAIN shows Index Scan vs Index Only Scan and Heap Fetches; high heap fetches means a stale visibility map."]},

{how:"PostgreSQL implements MVCC by never overwriting a row in place. Each tuple carries xmin (creating transaction) and xmax (deleting or locking transaction); an UPDATE writes a new version and stamps xmax on the old one. A snapshot (xmin, xmax, in-progress list) plus the commit log (pg_xact) decides which version each transaction sees. Under Read Committed a snapshot is taken per statement; under Repeatable Read per transaction.",
 pros:["Readers never block writers and writers never block readers, which gives high concurrency.","Consistent snapshots make long reports and backups see a stable view without locks.","Rollback is cheap: aborted versions are simply invisible and cleaned up later.","Row-level locking means conflicts only occur on the same rows."],
 cons:["Old versions pile up as dead tuples and need VACUUM, so tables can bloat.","Every update writes a full new tuple and often new index entries, increasing write volume.","Under Read Committed, read-modify-write logic can lose updates; under Repeatable Read it can fail with serialization errors that apps must retry.","Transaction IDs are 32-bit and need freezing to avoid wraparound."],
 fails:[{m:"Lost update under Read Committed",s:"Two sessions read a balance, both write back, one change silently vanishes",x:"Use SELECT ... FOR UPDATE, atomic UPDATE x = x + 1, or Repeatable Read with retry on error 40001."},
  {m:"Serialization or write conflict",s:"ERROR: could not serialize access due to concurrent update (SQLSTATE 40001)",x:"Retry the whole transaction in the application; keep transactions short to reduce conflicts."},
  {m:"Idle in transaction",s:"Sessions stuck idle in transaction hold locks and pin the xmin horizon, causing bloat",x:"Set idle_in_transaction_session_timeout, fix the app to commit or rollback, and kill offenders."},
  {m:"Transaction ID wraparound",s:"Warnings to vacuum database; at the limit the cluster refuses writes",x:"Keep autovacuum healthy, monitor age(datfrozenxid), run manual VACUUM FREEZE, and tune autovacuum_freeze_max_age."}],
 watch:["pg_stat_activity: state = idle in transaction and old xact_start or backend_xmin values.","age(datfrozenxid) and age(relfrozenxid): far above autovacuum_freeze_max_age (200 million default) means danger.","pg_stat_database xact_rollback and conflicts, plus application retry counts for 40001 errors."]},

{how:"Write-ahead logging requires a change record to reach the WAL before the modified data page may be flushed, and COMMIT waits for its commit record to be fsynced (synchronous_commit on). WAL is written by backends and the walwriter into 16 MB segments in pg_wal, with each record protected by a CRC. After a crash, startup replays WAL from the last checkpoint's redo point, applying records to pages with older LSNs and stopping at the first invalid or torn record.",
 pros:["Durability with sequential writes: data pages can be flushed lazily because the log is the source of truth.","Crash recovery is automatic and bounded by the checkpoint distance.","The same log feeds streaming replication, PITR and logical decoding.","CRC checks and LSN comparisons make replay idempotent and safe against torn tails."],
 cons:["Every change is written twice (WAL and later the data page), and full_page_writes adds full-page images after a checkpoint.","fsync latency on the commit path directly limits transaction rate on slow disks.","WAL volume can be large for update-heavy or index-heavy workloads.","Unconsumed WAL (replication slots, failed archiving) fills disk."],
 fails:[{m:"WAL disk fills up",s:"pg_wal grows without bound and the server may PANIC on no space",x:"Check inactive replication slots and archive_command failures, set max_slot_wal_keep_size, and add disk alarms."},
  {m:"Slow fsync at commit",s:"High commit latency, WALWrite or WALSync wait events dominate",x:"Use fast storage with a protected write cache, batch commits, or accept synchronous_commit off only for data you can lose."},
  {m:"Replica lag from heavy WAL",s:"Replay lag grows after bulk loads or large updates",x:"Throttle bulk jobs, check replica I/O, and size wal_compression and network accordingly."},
  {m:"Corrupt or missing WAL segment",s:"Startup fails with invalid record or could not locate required checkpoint",x:"Restore from base backup plus archived WAL; never delete files from pg_wal by hand."}],
 watch:["pg_stat_wal: wal_bytes, wal_buffers_full and wal_sync_time show write pressure.","pg_replication_slots: wal_status and retained WAL per slot; pg_stat_replication replay_lag for replicas.","pg_stat_activity wait_event of WALWrite, WALSync or WALInsert indicates commit-path contention."]},

{how:"VACUUM scans heap pages (guided by the visibility map), removes index entries pointing to dead tuples, then marks the line pointers reusable and updates the free space map. A tuple is dead for cleanup only if its xmax committed before the oldest snapshot still in use, the xmin horizon. Autovacuum launches workers per table when dead tuples exceed autovacuum_vacuum_threshold plus scale_factor times reltuples; it also freezes old XIDs.",
 pros:["Reclaims space for reuse without blocking normal reads and writes (plain VACUUM takes a light lock).","Updates the visibility map so index-only scans and later vacuums can skip pages.","Freezing prevents transaction ID wraparound and keeps the cluster safe long term.","Autovacuum is automatic and cost-throttled so it can run alongside production load."],
 cons:["Plain VACUUM does not return space to the OS (except trailing empty pages); only rewriting commands do.","Autovacuum I/O competes with queries and is throttled by cost limits, so it can fall behind on busy tables.","Defaults (scale factor 0.2) are too lazy for very large tables.","One old snapshot anywhere in the database can hold back cleanup for every table."],
 fails:[{m:"Long transaction pins the horizon",s:"Dead tuples grow while VACUUM runs but removes nothing; n_dead_tup keeps climbing",x:"Find the oldest backend_xmin, replication slots and prepared transactions; end them and set idle_in_transaction_session_timeout."},
  {m:"Autovacuum cannot keep up",s:"Tables bloat, autovacuum workers always busy, queries slow down",x:"Lower per-table autovacuum_vacuum_scale_factor, raise autovacuum_vacuum_cost_limit, and add workers."},
  {m:"Severe bloat",s:"Table is many times its live size; plain VACUUM does not shrink the file",x:"Use pg_repack or VACUUM FULL in a maintenance window, then fix the cause."},
  {m:"Anti-wraparound vacuum storm",s:"Aggressive autovacuum to prevent wraparound runs on huge tables and cannot be cancelled",x:"Schedule manual VACUUM FREEZE earlier and monitor XID age with alerts well below 2 billion."}],
 watch:["pg_stat_user_tables: n_dead_tup, last_autovacuum and autovacuum_count per table.","pg_stat_activity backend_xmin age, pg_replication_slots xmin and pg_prepared_xacts for horizon holders.","pg_stat_progress_vacuum for running vacuums and the pgstattuple extension for real bloat."]},

{how:"ANALYZE samples about 300 times default_statistics_target rows per table and stores per-column statistics in pg_statistic (visible via pg_stats): null fraction, n_distinct, most common values, histogram bounds and correlation. The planner uses these to estimate selectivity and row counts, assigns costs using seq_page_cost, random_page_cost and cpu_* parameters, and picks the cheapest path and join order. Extended statistics (CREATE STATISTICS) capture correlations between columns.",
 pros:["Cost-based planning adapts to data size and distribution without manual hints.","Per-column histograms handle skew; extended statistics fix correlated predicates.","The planner can choose between index, bitmap and sequential scans, and between nested loop, hash and merge joins.","Autovacuum runs ANALYZE automatically as data changes."],
 cons:["Estimates are only as good as the sample; skew, correlation and expressions are easy to misjudge.","Errors compound through joins, so a small misestimate can produce a very bad plan.","Statistics go stale after bulk loads until ANALYZE runs.","There are no built-in hints, so fixing a bad plan means changing stats, settings or the query."],
 fails:[{m:"Stale statistics",s:"After a bulk load the plan flips to a nested loop or seq scan; estimated rows far below actual",x:"Run ANALYZE after bulk changes and lower per-table autovacuum_analyze_scale_factor for volatile tables."},
  {m:"Correlated columns underestimated",s:"EXPLAIN shows rows=1 while actual rows are thousands for a multi-column WHERE",x:"CREATE STATISTICS (dependencies, ndistinct, mcv) on the correlated columns, then ANALYZE."},
  {m:"Skew missed by sample",s:"Rare but heavy values get wrong estimates; plan good for most values and terrible for a few",x:"Raise default_statistics_target on the column (ALTER TABLE ... SET STATISTICS) and re-analyze."},
  {m:"Cost parameters wrong for hardware",s:"Planner avoids indexes on SSD storage because random_page_cost is 4",x:"Set random_page_cost near 1.1 for SSD and review effective_cache_size."}],
 watch:["EXPLAIN (ANALYZE): compare estimated rows to actual rows at every node; ratio off by 10x or more is a red flag.","pg_stats and pg_stat_user_tables last_analyze and n_mod_since_analyze for staleness.","pg_stat_statements: statements with high mean time but large variance may be plan flips."]},

{how:"Sorts and hash tables are limited per node by work_mem (default 4 MB). An in-memory sort uses quicksort or top-N heapsort; if it exceeds work_mem it writes sorted runs to temp files and does an external merge. A hash join builds a hash table of the smaller input; if it does not fit it is split into batches (hash_mem_multiplier can give hash more room), spilling partitions to temp files and processing batch by batch.",
 pros:["A fixed per-node budget stops a single query from consuming all RAM.","External sort and batched hash join let queries finish on data far larger than memory.","Temp files are removed automatically at end of statement or backend exit, including after errors.","work_mem can be set per session, role or query to give heavy reports more memory safely."],
 cons:["Spilling to disk is often orders of magnitude slower than in-memory processing.","work_mem is per node and per parallel worker, so total usage is multiplied across nodes, workers and connections.","Hash join batches re-read data, and skewed keys can make one batch huge.","Setting work_mem too high globally risks out-of-memory with many connections."],
 fails:[{m:"Sort spills to disk",s:"EXPLAIN ANALYZE shows Sort Method: external merge Disk: NNN kB, queries slow and temp I/O high",x:"Raise work_mem for that role or query, add an index that avoids the sort, or filter earlier."},
  {m:"Hash join multiple batches",s:"Hash node shows Batches: 8 or more with large temp writes",x:"Raise work_mem or hash_mem_multiplier, or fix an overestimated build side so the planner picks the smaller input."},
  {m:"OOM from work_mem times concurrency",s:"OS kills postgres backends under many concurrent complex queries",x:"Keep global work_mem modest, use a pooler to cap connections, and raise it only for specific workloads."},
  {m:"Temp files fill disk",s:"temp_file_limit errors or full volume from runaway queries",x:"Set temp_file_limit, use log_temp_files to find offenders, and fix the plan."}],
 watch:["EXPLAIN (ANALYZE, BUFFERS): Sort Method, Disk usage, and Hash Batches versus Original Batches.","pg_stat_database temp_files and temp_bytes, plus pg_stat_statements temp_blks_read and temp_blks_written.","Enable log_temp_files = 0 (or a threshold) to log every temp file created."]},

{how:"A checkpoint, triggered by checkpoint_timeout or by WAL growth reaching max_wal_size, writes all dirty shared buffers to disk and records a redo point in pg_control. WAL older than that point can be recycled, and crash recovery only replays from it. The checkpointer spreads writes over checkpoint_completion_target of the interval to smooth I/O, and the first change to each page after a checkpoint writes a full-page image when full_page_writes is on.",
 pros:["Bounds crash recovery time: replay only covers WAL since the last checkpoint.","Lets old WAL be recycled so pg_wal stays a bounded size.","Spreading writes (completion target around 0.9) avoids large single bursts of I/O.","Full-page images after a checkpoint protect against torn page writes."],
 cons:["Frequent checkpoints raise write I/O and WAL volume because of repeated full-page images.","Infrequent checkpoints mean more WAL to keep and a longer crash recovery.","Large shared_buffers with heavy writes can still cause I/O spikes at checkpoint time.","fsync of many files at the end of a checkpoint can stall on slow storage."],
 fails:[{m:"Checkpoints too frequent",s:"Log says checkpoints are occurring too frequently; many requested (not timed) checkpoints in pg_stat_checkpointer",x:"Increase max_wal_size (and checkpoint_timeout) so checkpoints are mostly timed."},
  {m:"Checkpoint I/O spike",s:"Periodic latency spikes and disk saturation aligned with checkpoint times",x:"Raise checkpoint_completion_target to 0.9, tune bgwriter, and use faster storage or spread write bursts."},
  {m:"Long crash recovery",s:"After a crash the server spends minutes in recovery replaying WAL",x:"Shorten checkpoint_timeout or max_wal_size and keep a hot standby for fast failover."},
  {m:"WAL spike from full-page writes",s:"WAL volume jumps right after each checkpoint on write-heavy tables",x:"Enable wal_compression and lengthen checkpoint interval; keep full_page_writes on unless storage guarantees atomic writes."}],
 watch:["pg_stat_bgwriter or pg_stat_checkpointer: checkpoints_timed vs checkpoints_req, and write_time and sync_time.","Set log_checkpoints = on and read buffers written, write and sync durations and distance.","pg_stat_wal wal_fpi shows full-page images; a high ratio to wal_records suggests short checkpoint intervals."]},

{how:"Read Committed (the default) takes a new snapshot per statement, so a later statement can see rows committed in between, which allows non-repeatable reads and phantoms. Repeatable Read uses one snapshot for the whole transaction and fails a writer with a serialization error if the row it wants changed after the snapshot; Serializable adds SSI to catch write skew. Row, table and advisory locks queue conflicting sessions, and after deadlock_timeout (1 s) the deadlock detector finds wait-for cycles and aborts one victim.",
 pros:["Read Committed is simple and rarely errors, which suits most OLTP code.","Repeatable Read gives a stable view for reports and multi-statement logic.","Serializable (SSI) gives true serial behavior without readers blocking writers.","Deadlock detection resolves cycles automatically instead of hanging forever."],
 cons:["Read Committed allows lost updates, non-repeatable reads and phantoms unless you lock explicitly.","Stronger levels turn races into errors (40001 or 40P01) that the application must catch and retry.","Write skew still exists under Repeatable Read; only Serializable prevents it, with extra overhead.","Long lock waits and deadlocks come from inconsistent lock order and long transactions."],
 fails:[{m:"Deadlock",s:"ERROR: deadlock detected (SQLSTATE 40P01); one transaction is rolled back",x:"Lock rows in a consistent order, keep transactions short, and retry on 40P01; log_lock_waits helps find the pair."},
  {m:"Lost update or write skew",s:"Data is silently wrong after concurrent updates (for example two on-call doctors both go off duty)",x:"Use SELECT FOR UPDATE, atomic UPDATE expressions, constraints, or SERIALIZABLE with retry logic."},
  {m:"Lock queue pile-up",s:"One long DDL or idle transaction blocks others; many sessions waiting on locks, connections exhausted",x:"Set lock_timeout and statement_timeout, run DDL with short timeouts, and kill the blocker found in pg_locks."},
  {m:"Unhandled serialization failures",s:"Intermittent 40001 errors reach users under Repeatable Read or Serializable",x:"Wrap the transaction in a retry loop with backoff and keep the transaction small."}],
 watch:["pg_stat_activity wait_event_type = Lock, and pg_locks joined with pg_blocking_pids() to see who blocks whom.","Set log_lock_waits = on and watch pg_stat_database deadlocks and conflicts counters.","Application metrics for SQLSTATE 40001 and 40P01 retries; a rising rate means contention."]}
];

(function(){
const SIMM={
 id:'postgres',nodeLabel:'servers (1 primary + standbys)',nodeRange:[2,4,2],
 settings:[{id:'sc',label:'synchronous_commit',opts:['off','local','remote'],def:'local'},{id:'lag',label:'standby lag',opts:['normal','slow'],def:'slow'}],
 menu:[{op:'I',label:'INSERT',args:[{n:'id',d:'1',w:40},{n:'value',d:'alice',w:70}]},{op:'U',label:'UPDATE',args:[{n:'id',d:'1',w:40},{n:'value',d:'alice2',w:70}]},{op:'D',label:'DELETE',args:[{n:'id',d:'1',w:40}]},{op:'S',label:'SELECT (node#)',args:[{n:'id',d:'1',w:40},{n:'node#',d:'0',w:44}]},{op:'V',label:'VACUUM',args:[]},{op:'K',label:'crash primary',args:[]},{op:'H',label:'restart node as standby',args:[{n:'#',d:'0',w:40}]}],
 scenarios:[
  {name:'insert → update → delete (MVCC)',desc:'Every change is written to the WAL first, then to the heap page. UPDATE does not overwrite: it stamps the old tuple with xmax and adds a new tuple. DELETE only stamps xmax. VACUUM later reclaims dead tuples. Standbys replay the WAL, so a standby read can be stale.',acts:['0 I 1 alice','1800 I 2 bob','3600 U 1 alice2','5200 S 1 1','6800 D 2','8200 S 2 0','9600 V']},
  {name:'primary crash (synchronous_commit)',desc:'The primary dies right after it acknowledged a commit. With synchronous_commit=off the client was told OK before the WAL was even flushed; with local it survives a restart but not a failover if the standby is behind; with remote the commit is only acknowledged once a standby has it. Switch the setting and compare.',acts:['0 I 1 a','1800 I 2 b','3200 I 3 c','4950 K','8000 I 4 d','10000 H 0','11800 S 3 1']},
 ],
 topo(n){
  const nodes=[{id:'cli',x:14,y:150,w:90,h:70,label:'Client'}],bw=Math.min(230,Math.floor(660/n)-14),x0=170+(700-n*(bw+14))/2;
  for(let i=0;i<n;i++)nodes.push({id:'n'+i,x:x0+i*(bw+14),y:70,w:bw,h:290,label:'server '+i,badge:st=>st.role['n'+i]});
  const edges=[];for(let i=0;i<n;i++){edges.push(['cli','n'+i]);if(i>0)edges.push(['n0','n'+i])}
  return{nodes,edges,w:900,h:420,zones:[{x:x0-10,y:48,w:n*(bw+14)+6,h:330,label:'PostgreSQL streaming replication · WAL shipping'}]};
 },
 init(n){const st={status:{cli:'up'},heap:{},log:{},fl:{},role:{},primary:0,n};for(let i=0;i<n;i++){const id='n'+i;st.status[id]='up';st.heap[id]=[];st.log[id]=[];st.fl[id]=0;st.role[id]=i===0?'primary':'standby'}return st},
 apply(st,f){const id='n'+f.n,H=st.heap[id];
  const redo=r=>{if(r.k==='ins')H.push({id:r.id,v:r.v,xmin:r.x,xmax:0});else if(r.k==='upd'){const o=H.find(t=>t.id===r.id&&!t.xmax);if(o)o.xmax=r.x;H.push({id:r.id,v:r.v,xmin:r.x,xmax:0})}else if(r.k==='del'){const o=H.find(t=>t.id===r.id&&!t.xmax);if(o)o.xmax=r.x}};
  switch(f.op){
   case'wal':st.log[id].push(f.r);redo(f.r);if(f.sync)st.fl[id]=f.r.lsn;break;
   case'flush':st.fl[id]=Math.max(st.fl[id],f.lsn);break;
   case'crash':st.status[id]='down';st.log[id]=st.log[id].filter(r=>r.lsn<=st.fl[id]);st.heap[id]=[];st.log[id].forEach(redo);break;
   case'up':st.status[id]='up';break;
   case'promote':st.primary=f.n;Object.keys(st.role).forEach(k=>{if(st.status[k]==='up'||k===id)st.role[k]=k===id?'primary':'standby'});st.status[id]='up';st.role[id]='primary';break;
   case'rejoin':{const s='n'+f.from;st.heap[id]=st.heap[s].map(t=>({...t}));st.log[id]=st.log[s].map(r=>r);st.fl[id]=st.fl[s];st.status[id]='up';st.role[id]='standby';break}
   case'vac':st.heap[id]=H.filter(t=>!t.xmax);break;
  }},
 fxText(f){return{wal:`node ${f.n}: WAL record lsn ${f.r&&f.r.lsn} (${f.r&&f.r.k}) + heap`,flush:`node ${f.n}: WAL flushed to lsn ${f.lsn}`,crash:`node ${f.n} crashed: unflushed WAL lost`,up:`node ${f.n} up`,promote:`node ${f.n} promoted to primary`,rejoin:`node ${f.n} rejoins as standby`,vac:`node ${f.n}: VACUUM removes dead tuples`}[f.op]||f.op},
 run(acts,n,set){
  const W=SIMM.init(n),ev=[],pend=[],ap=f=>SIMM.apply(W,f),lag=set.lag==='slow'?2600:600;
  const push=e=>{ev.push(e);if(e.fx.length)pend.push({at:e.t+e.d,e});return e};
  const flush=t=>{pend.sort((x,y)=>x.at-y.at);while(pend.length&&pend[0].at<=t){pend.shift().e.fx.forEach(ap)}};
  let xid=100,lsn=0;const acked=[];const lastLsn=id=>W.log[id].reduce((m,r)=>Math.max(m,r.lsn),0);
  const truth=id=>{const P='n'+W.primary,x=W.heap[P].find(t=>t.id===id&&!t.xmax);return x?x.v:null};
  for(const a of acts){const t=a.t;flush(t);const P=W.primary,pid='n'+P,alive=W.status[pid]==='up';
   if(a.op==='I'||a.op==='U'||a.op==='D'){
    const id=a.args[0]||'1',v=a.args[1]||'v',k=a.op==='I'?'ins':a.op==='U'?'upd':'del';
    if(!alive){push(E(t,400,'cli','cli','connection refused: no primary','fail',[],'The primary is down and no standby was promoted yet.'));continue}
    flush(t+400);const exists=W.heap[pid].some(x=>x.id===id&&!x.xmax);
    if(k==='ins'&&exists){push(E(t,500,'cli',pid,`INSERT ${id}`,'write',[],'Client sends the statement.'));push(E(t+500,400,pid,'cli','ERROR duplicate key (unique index)','fail',[],'The unique B-tree index already has this key, so the statement aborts before any change is made.'));continue}
    if(k!=='ins'&&!exists){push(E(t,500,'cli',pid,`${a.op==='U'?'UPDATE':'DELETE'} ${id}`,'write',[],'Client sends the statement.'));push(E(t+500,400,pid,'cli','0 rows affected','ack',[],'The index/heap scan found no visible row version for this id, so there is nothing to change.'));continue}
    xid++;lsn++;const rec={lsn,x:xid,k,id,v:k==='del'?null:v};
    const sql=k==='ins'?`INSERT ${id}=${v}`:k==='upd'?`UPDATE ${id}=${v}`:`DELETE ${id}`;
    push(E(t,400,'cli',pid,sql,'write',[],'The statement runs in a backend process. It takes a transaction id (xid '+xid+') and a snapshot.'));
    push(E(t+400,300,pid,pid,`WAL record lsn ${lsn}, heap tuple`,'info',[{op:'wal',n:P,r:rec}],k==='upd'?'MVCC: the old tuple gets xmax='+xid+' and a NEW tuple version is added (the old one is not overwritten).':k==='del'?'MVCC: DELETE only stamps xmax on the tuple; the bytes stay until VACUUM.':'The WAL record is appended first (write-ahead), then the heap page in shared buffers is changed.'));
    const fl=t+700+500;push(E(t+700,500,pid,pid,`fsync WAL → lsn ${lsn}`,'info',[{op:'flush',n:P,lsn}],'COMMIT must make its WAL record durable with fsync. The heap page itself may stay dirty in memory until a checkpoint.'));
    let standAck=null;const stands=[...Array(n).keys()].filter(i=>i!==P&&W.status['n'+i]==='up');
    stands.forEach(i=>{const e=push(E(t+700,lag,pid,'n'+i,`WAL lsn ${lsn} →`,'repl',[{op:'wal',n:i,r:rec,sync:true}],'The WAL sender streams records to the standby; the standby writes/flushes them and replays them into its own heap.'));const ak=push(E(t+700+lag,350,'n'+i,pid,'ack','ack',[],'Standby reports the WAL position it has received.'));if(standAck===null||ak.t+ak.d<standAck)standAck=ak.t+ak.d});
    let at,why;
    if(set.sc==='off'){at=t+700;why='synchronous_commit=off: OK is returned BEFORE the WAL is flushed. Fast, but a crash can lose this "committed" transaction.'}

    else{if(standAck===null){push(E(fl,0,pid,pid,'COMMIT is waiting for a standby (none available)…','fail',[],'synchronous_commit=remote_write/on with a standby configured: the commit blocks until a standby confirms. With no standby up, writes hang. This is the availability cost of zero data loss.'));continue}at=standAck;why='synchronous_commit=remote: OK only after a standby confirmed the WAL. No acknowledged commit can be lost on failover, but latency includes the network round trip.'}
    push(E(at,400,pid,'cli',`COMMIT OK (lsn ${lsn})`,'ack',[],why));acked.push({lsn,at:at+400,sql,id});
   }
   if(a.op==='S'){const id=a.args[0]||'1',ni=+(a.args[1]||W.primary),nid='n'+ni;if(ni>=n)continue;
    push(E(t,450,'cli',nid,`SELECT ${id}`,'read',[],'The query reads the heap using a snapshot: it sees only tuple versions whose xmin is committed and whose xmax is not.'));
    if(W.status[nid]!=='up'){push(E(t+450,400,nid,'cli','connection refused','fail',[],'Server is down.'));continue}
    flush(t+450);const x=W.heap[nid].find(r=>r.id===id&&!r.xmax),tv=truth(id),stale=(x?x.v:null)!==tv&&nid!=='n'+W.primary;
    push(E(t+450,450,nid,'cli',(x?`"${x.v}"`:'(no row)')+(stale?' ← STALE':''),stale?'fail':'ack',[],stale?`This standby has not replayed the newest WAL yet. The primary currently has ${tv===null?'no visible row':'"'+tv+'"'}. Hot-standby reads are eventually consistent.`:'MVCC returns the newest committed visible tuple version.'))}
   if(a.op==='V'&&alive){flush(t+10);const dead=W.heap[pid].filter(x=>x.xmax).length;push(E(t,700,pid,pid,`VACUUM: ${dead} dead tuple(s) reclaimed`,'info',[{op:'vac',n:P}],'VACUUM removes tuple versions no snapshot can see any more, freeing space for reuse. Without it the table bloats.'))}
   if(a.op==='K'&&alive){
    for(let i=pend.length-1;i>=0;i--)if(pend[i].e.from===pid&&pend[i].at>t){const e=pend[i].e;e.fx=[];e.kind='fail';e.msg+=' ✕ never arrives';e.cause='The primary crashed before this was delivered, so the target never receives it.';pend.splice(i,1)}
    push(E(t,0,'cli',pid,`PRIMARY ${P} CRASHES`,'fail',[{op:'crash',n:P}],'The process dies. Anything not fsynced to the WAL is gone; the heap is rebuilt from the WAL on recovery.'));
    const cands=[...Array(n).keys()].filter(i=>i!==P&&W.status['n'+i]==='up');
    if(cands.length){cands.sort((x,y)=>lastLsn('n'+y)-lastLsn('n'+x));const c=cands[0],at=t+1500;
     push(E(at,600,'n'+c,'n'+c,`promote server ${c} (replayed to lsn ${lastLsn('n'+c)})`,'info',[{op:'promote',n:c}],'The standby with the most WAL becomes the new primary. Anything the old primary acknowledged but never shipped is not on it.'));
     const mx=lastLsn('n'+c),lost=acked.filter(x=>x.lsn>mx&&x.at<=t);
     if(lost.length)push(E(at+650,0,'n'+c,'n'+c,`${lost.length} ACKNOWLEDGED commit(s) LOST: ${lost.map(x=>x.sql).join(', ')}`,'fail',[],'The client was told COMMIT OK, but this transaction never reached the promoted standby. Use synchronous_commit=remote to prevent it.'));
     else push(E(at+650,0,'n'+c,'n'+c,'no acknowledged commit was lost','ack',[],'Every acknowledged commit was already on the promoted standby.'));
     flush(at+700)}
    else{const at=t+1500;const mx=W.fl[pid];const lost=acked.filter(x=>x.lsn>mx&&x.at<=t);push(E(at,700,pid,pid,`crash recovery: replay WAL to lsn ${mx}`,'info',[{op:'up',n:P}],'No standby: the same server restarts and replays its flushed WAL (redo).'));
     if(lost.length)push(E(at+750,0,pid,pid,`${lost.length} ACKNOWLEDGED commit(s) LOST: ${lost.map(x=>x.sql).join(', ')}`,'fail',[],'These commits were acknowledged with synchronous_commit=off before their WAL reached disk.'));flush(at+800)}
   }
   if(a.op==='H'){const i=+a.args[0]||0;if(i>=n||i===W.primary)continue;flush(t);push(E(t,800,'n'+W.primary,'n'+i,`server ${i} rejoins as standby (re-sync from new primary)`,'info',[{op:'rejoin',n:i,from:W.primary}],'The old primary may hold WAL the new timeline never saw; it is rewound/re-cloned and then follows the new primary.'));flush(t+800)}
  }
  return{events:ev};
 },
 lines(id,st){if(id==='cli')return[];const H=st.heap[id]||[];return[`WAL lsn ${st.log[id].reduce((m,r)=>Math.max(m,r.lsn),0)} · flushed ${st.fl[id]}`,...H.slice(0,9).map(t=>`id${t.id}=${t.v} xmin${t.xmin}${t.xmax?' xmax'+t.xmax+' ✕':''}`)]},
 detail(id,st){if(id==='cli')return[];const H=st.heap[id]||[];return[`role: ${st.role[id]}`,`WAL records ${st.log[id].length}, flushed to lsn ${st.fl[id]}`,`heap tuples ${H.length} (${H.filter(t=>t.xmax).length} dead)`,...H.map(t=>`id=${t.id} v=${t.v} xmin=${t.xmin} xmax=${t.xmax||'-'}${t.xmax?'  (dead, VACUUM can reclaim)':''}`)]}
};

Lab.sim(SIMM);})();

Lab.start({phases:PHASES,detail:DETAIL,ovs:OVS,ctl:ctlHTML,state:()=>S});
