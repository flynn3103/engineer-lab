<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PostgreSQL · course</title>
<link rel="stylesheet" href="../../assets/lab.css">
<style>
:root{--acc:#0f9d8a;--acc2:#d6456b}
@media(prefers-color-scheme:dark){:root{--acc:#3ccfb8;--acc2:#ff7aa0}}
body{font-size:16px}
.topbar .wrap{min-height:50px}
.topbar .crumb{color:var(--mut);font-size:14px;text-decoration:none}
.topbar .crumb:hover{color:var(--ink)}
.hero{padding:34px 0 10px}
.hero .lead{max-width:60ch}
.part{margin:28px 0 10px}
.part h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 4px}
.part p{margin:0 0 12px;color:var(--mut);font-size:14.5px;max-width:64ch}
.map{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.tile{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:0;height:100%;width:100%}
.tile:hover{border-color:var(--acc);transform:translateY(-2px)}
.tile .n{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--pc);border:1px solid var(--line)}
.tile b{display:block;font-size:15px;line-height:1.3}
.tile small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;line-height:1.35}
.chhead{display:flex;gap:12px;align-items:center;margin:22px 0 4px}
.chhead .n{flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;background:var(--pc);border:1px solid var(--line)}
.chhead h1{font-size:clamp(22px,4.6vw,30px);letter-spacing:-.4px}
.chhead small{display:block;color:var(--mut);font-size:13px}
.ask{font-size:clamp(17px,2.8vw,20px);margin:8px 0 18px;max-width:62ch}
.blk{margin:0 0 16px}
.blk>h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.blk>h3 i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--on-brand,#fff);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.idea{margin:0;padding-left:20px}.idea li{margin:5px 0}
.pg{display:grid;gap:12px}
.pgwhy{margin:0;color:var(--mut);font-size:14px}
.cp{display:grid;gap:10px}
@media(min-width:760px){.cp{grid-template-columns:repeat(3,1fr)}}
.cp>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.cp b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.cp .s b{color:var(--bad)}.cp .c b{color:var(--warn)}.cp .f b{color:var(--ok)}
.cp p{margin:0;font-size:14.5px}
.quiz .q{font-weight:600;margin:0 0 8px}
.quiz .opts{display:grid;gap:6px}
.quiz .opts button{text-align:left;min-height:0;padding:9px 12px}
.quiz .opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.quiz .opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.quiz .why{margin-top:8px}
.pn{display:flex;justify-content:space-between;gap:8px;margin:22px 0 40px}
.pn button{max-width:48%;text-align:left}
.pn button:last-child{margin-left:auto;text-align:right}
/* ---- playground kit ---- */
.pgbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.pgbox .bar{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;min-height:36px;padding:6px 12px;font-size:13.5px;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:var(--on-brand,#fff);font-weight:600}
.sl{display:inline-flex;align-items:center;gap:8px;flex-wrap:nowrap}
.sl input{width:130px}.sl b{color:var(--ink);font-weight:600;min-width:2ch;font-variant-numeric:tabular-nums}
.out{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;min-width:0}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.badge.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.badge.info{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line));background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.log{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card)}
.log div{padding:1px 0;border-bottom:1px dashed var(--line)}.log div:last-child{border:0}
.log .bad{color:var(--bad)}.log .ok{color:var(--ok)}.log .mut{color:var(--mut)}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat>div{border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--card);min-width:84px}
.stat small{display:block;color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat .bad b{color:var(--bad)}.stat .ok b{color:var(--ok)}
.svgw{overflow-x:auto;overscroll-behavior-x:contain}.svgw svg{display:block;max-width:100%}
.cols{display:grid;gap:12px}
@media(min-width:760px){.cols.two{grid-template-columns:1fr 1fr}.cols.three{grid-template-columns:repeat(3,1fr)}}
.cols>*{min-width:0}
@media(max-width:560px){.chhead{margin-top:14px}}
.prob{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc2);border-radius:12px;padding:12px 16px;margin:0 0 6px}
.prob p{margin:0 0 .5em}.scene p:last-child{margin:0}
.prob .q{font-weight:700;font-size:clamp(17px,2.6vw,19px)}
.arch{margin:0}.arch figcaption{text-align:center}
.arch svg{overflow:visible}
.common{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.common>div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);display:grid;gap:5px;align-content:start}
.common h4{font-size:15px;line-height:1.3;margin:0}.common h4 i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;margin-right:6px;vertical-align:1px}
.common p{margin:0;font-size:14px}
.common b{font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-right:6px}
.common .e b{color:var(--acc2)}.common .c b{color:var(--warn)}.common .f b{color:var(--ok)}
.sw{display:flex;gap:6px;margin-left:auto}
.sw a{font-size:13px;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}
.sw a:hover{color:var(--ink);border-color:var(--acc)}.sw a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.ctabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.ctab{border-radius:999px;font-size:14px;padding:7px 14px;min-height:0}
.ctab.on{color:var(--ink);background:color-mix(in srgb,var(--acc2) 14%,var(--card));border-color:var(--acc2);font-weight:700}
.cbody{display:grid;gap:12px}
.ctitle{font-size:clamp(20px,3.6vw,26px);letter-spacing:-.3px;margin:4px 0 0}
.csym{font-size:clamp(16px,2.4vw,18.5px);margin:0}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.ccard h5{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 6px}
.ccard h5:not(:first-child){margin-top:12px}
.ccard p{margin:0 0 .5em;font-size:15px}.ccard .seen b{color:var(--acc2);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.ccard pre{font-size:12.5px}
.vizc{background:var(--soft)}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.vrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin:6px 0}
@media(max-width:620px){.vrow{grid-template-columns:1fr;gap:4px}}
.vl{font-size:13px;color:var(--mut)}
.vcells{display:flex;gap:6px;min-width:0}
.vc{flex:1 1 0;min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;font-size:12.5px;background:var(--card);overflow-wrap:anywhere}
.vc.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.vc.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--card))}
.vc.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,var(--card))}
.vc.off{border-style:dashed;color:var(--mut);background:transparent}
.vbar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
@media(max-width:620px){.vbar{grid-template-columns:1fr}}
.vtrack{height:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vtrack i{display:block;height:100%;border-radius:8px;transition:width .35s}
.vtrack i.bad{background:var(--bad)}.vtrack i.ok{background:var(--ok)}.vtrack i.warn{background:var(--warn)}
.vt{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.fixes{margin:0;padding-left:22px}.fixes li{margin:4px 0}.fixes li::marker{color:var(--acc2);font-weight:700}
.course-custom{display:grid;gap:18px;margin-bottom:22px}
/* chapter 2 · buffer pool playground and architecture animation */
section.blk .prob p{font-size:15px;line-height:1.55}
.arch-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 8px}
.ar-box rect{fill:var(--card);stroke:var(--line);stroke-width:1.5;transition:opacity .3s,stroke .3s}
.ar-box.on rect{stroke:var(--acc);stroke-width:3}
.ar-box.off{opacity:.35}
.ar-box{transition:opacity .3s}
.ar-title{font-size:13px;font-weight:700;fill:var(--ink);font-family:system-ui,sans-serif}
.ar-sub{font-size:11px;fill:var(--mut);font-family:ui-monospace,monospace}
.ar-arrow line{stroke:var(--mut);stroke-width:1.6;fill:none;color:var(--mut);transition:opacity .3s}
.ar-arrow.on line{stroke:var(--acc2);stroke-width:3;color:var(--acc2)}
.ar-arrow:not(.on) line{opacity:.45}
.ar-lab{font-size:11px;fill:var(--mut);font-family:ui-monospace,monospace}
.ar-arrow.on .ar-lab{fill:var(--acc2);font-weight:700}
.ar-dot{fill:var(--acc2);stroke:var(--card);stroke-width:2}
.ar-step{margin-top:8px;border-left:4px solid var(--acc);background:var(--soft);border-radius:0 10px 10px 0;padding:10px 12px}
.ar-count{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.ar-text{margin:4px 0 0;font-size:15px;color:var(--ink)}
.ar-box{cursor:pointer;outline:none}
.ar-box:focus-visible rect{stroke:var(--acc);stroke-width:3}
.ar-box.picked rect{stroke:var(--acc2);stroke-width:3}
.ar-hint{margin:0;font-size:14px;color:var(--mut)}
.split{display:grid;gap:14px;align-items:start}
.split-l,.split-r{min-width:0}
.split-r{display:grid;gap:10px;align-content:start}
@media(min-width:760px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}}

.ar-comp{display:grid;gap:8px;margin-top:10px}
.ar-state{display:grid;gap:8px;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.ar-pt{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.ar-lookup{font-weight:700;font-size:14px}
.ar-lookup.hit{color:var(--ok)}.ar-lookup.miss{color:var(--bad)}
.ar-frs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ar-fr{border:1.5px solid var(--line);border-radius:10px;padding:6px;background:var(--card);display:grid;gap:2px;font-size:12px;color:var(--mut)}
.ar-fr b{font-size:14px;color:var(--ink)}
.ar-fr.pinned{border-color:var(--acc)}
.ar-fr.dirty{box-shadow:inset 0 -4px 0 var(--bad)}
.ar-legend{font-size:12.5px;color:var(--mut);margin:0}
@media(max-width:620px){.ar-frs{grid-template-columns:repeat(2,1fr)}}
.sm{display:grid;gap:10px}
.sm-frames{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sm-fr{border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;background:var(--card);display:grid;gap:2px;text-align:center;min-height:66px;align-content:center}
.sm-fr small{font-size:11px;color:var(--mut)}
.sm-fr b{font-size:15px;color:var(--ink)}
.sm-fr.pinned{border-color:var(--acc)}
.sm-fr.dirty{box-shadow:inset 0 -4px 0 var(--bad)}
.sm-ops{display:flex;flex-wrap:wrap;gap:5px}
.sm-op{font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:7px;padding:3px 7px;color:var(--mut)}
.sm-op.done.hit{color:var(--ok);border-color:var(--ok)}
.sm-op.done.miss{color:var(--bad);border-color:var(--bad)}
.sm-op.now{outline:2px solid var(--acc);outline-offset:2px;color:var(--ink)}
.sm-op.leak{border-style:dashed}
.sm-msg{margin:0;font-size:14.5px;color:var(--ink);min-height:3em}
.sm-cnt{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums;border-top:1px dashed var(--line);padding-top:6px}
@media(max-width:620px){.sm-frames{grid-template-columns:repeat(2,1fr)}}
.ar-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ar-card b{font-size:13px;color:var(--acc)}
.ar-card p{margin:2px 0 0;font-size:14px;color:var(--ink)}
/* PostgreSQL tech CSS (pgx-) */
.pgx-stages{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pgx-stages .badge{font-size:12.5px}
.pgx-stages .arr{color:var(--mut);font-size:12px}
.pgx-cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(14px,1fr));gap:2px}
.pgx-cells i{display:block;height:14px;border-radius:3px;background:var(--soft);border:1px solid var(--line)}
.pgx-cells i.hot{background:var(--acc)}.pgx-cells i.cold{background:var(--p3)}.pgx-cells i.ring{background:var(--warn)}
.pgx-cells i.toast{background:var(--acc2)}
.pgx-lanes{display:grid;gap:8px}
.pgx-lane{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center}
.pgx-lane>span{font-size:12.5px;color:var(--mut)}
.pgx-lane .track{position:relative;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--soft);overflow:hidden}
.pgx-lane .tk{position:absolute;top:4px;bottom:4px;width:7px;border-radius:3px;background:var(--ok)}
.pgx-lane .tk.bad{background:var(--bad)}.pgx-lane .tk.warn{background:var(--warn)}
.pgx-lane .cut{position:absolute;top:0;bottom:0;width:2px;background:var(--acc2)}
@media(max-width:620px){.pgx-lane{grid-template-columns:1fr}}
.pgx-ver{display:grid;gap:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.pgx-ver div{display:grid;grid-template-columns:auto 1fr;gap:10px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--card)}
.pgx-ver div.dead{opacity:.55;text-decoration:line-through}
.pgx-ses{display:grid;gap:8px}
@media(min-width:760px){.pgx-ses{grid-template-columns:1fr 1fr}}
.pgx-ses>div{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card);min-width:0}
.pgx-ses h5{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
.pgx-ses p{margin:2px 0;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.pgx-ses p.wait{color:var(--warn)}.pgx-ses p.err{color:var(--bad)}.pgx-ses p.okk{color:var(--ok)}
.pgx-in{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card);color:var(--ink);width:150px;max-width:100%}
.pgx-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--soft);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.pgx-spark{width:100%;height:auto;display:block}
@media(prefers-reduced-motion:reduce){.pgx-stages *,.pgx-lane *,.pgx-cells *{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---- tiny helpers shared by the chapters and playgrounds ---- */
const PG = {};
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TIMERS = [];
function stopTimers() { while (TIMERS.length) { const t = TIMERS.pop(); clearInterval(t); clearTimeout(t); } }
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  const add = k => { if (k == null || k === false) return; if (Array.isArray(k)) k.forEach(add); else el.append(k.nodeType ? k : document.createTextNode(String(k))); };
  kids.forEach(add);
  return el;
}
function svg(tag, props, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in (props || {})) { const v = props[k]; if (v == null || v === false) continue; if (k === 'class') el.setAttribute('class', v); else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v); else el.setAttribute(k, v); }
  const add = k => { if (k == null || k === false) return; if (Array.isArray(k)) k.forEach(add); else el.append(k.nodeType ? k : document.createTextNode(String(k))); };
  kids.forEach(add);
  return el;
}
/* seeded random numbers, so every run of a playground repeats */
function rng(seed) { let a = (seed >>> 0) || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const bar = (...k) => h('div', { class: 'bar' }, ...k);
const btn = (label, fn, cls) => h('button', { class: cls || '', onclick: fn }, label);
const badge = (text, kind) => h('span', { class: 'badge ' + (kind || '') }, text);
const note = t => h('p', { class: 'note' }, t);
function seg(opts, val, cb) {          // opts: [{v,l}] or [v]; returns element with .value and .set(v)
  const el = h('div', { class: 'seg', role: 'group' });
  const norm = opts.map(o => (typeof o === 'object' ? o : { v: o, l: String(o) }));
  const paint = () => [...el.children].forEach((b, i) => b.classList.toggle('on', norm[i].v === el.value));
  norm.forEach(o => el.append(h('button', { onclick() { el.value = o.v; paint(); cb && cb(o.v); } }, o.l)));
  el.value = val; el.set = v => { el.value = v; paint(); }; paint(); return el;
}
function slider(label, min, max, val, step, cb, fmt) {   // returns <label> with .input and .value
  const out = h('b', {}, fmt ? fmt(val) : val);
  const input = h('input', { type: 'range', min, max, step: step || 1, value: val, 'aria-label': label });
  input.addEventListener('input', () => { out.textContent = fmt ? fmt(+input.value) : input.value; cb && cb(+input.value); });
  const el = h('label', { class: 'sl' }, label, input, out);
  Object.defineProperty(el, 'value', { get: () => +input.value, set: v => { input.value = v; out.textContent = fmt ? fmt(+v) : v; } });
  return el;
}
function player(o) {   // o.step() -> false when finished, o.reset(), o.speed ms per tick. returns element with .stop()
  let t = null;
  const stop = () => { if (t) { clearInterval(t); const i = TIMERS.indexOf(t); if (i >= 0) TIMERS.splice(i, 1); t = null; } play.textContent = '▶ Play'; };
  const tick = () => { if (o.step() === false) stop(); };
  const play = btn('▶ Play', () => { if (t) { stop(); return; } t = setInterval(tick, o.speed || 600); TIMERS.push(t); play.textContent = '⏸ Pause'; tick(); }, 'primary');
  const el = bar(play, btn('Step ›', () => { stop(); tick(); }), btn('⏮ Reset', () => { stop(); o.reset(); }));
  el.stop = stop; return el;
}
function logbox() {
  const el = h('div', { class: 'log', 'aria-live': 'polite' });
  return { el, add(text, cls) { el.append(h('div', { class: cls || '' }, text)); el.scrollTop = el.scrollHeight; }, clear() { el.textContent = ''; } };
}

}

/* static architecture diagram: spec = {w,h,boxes:[[id,x,y,w,h,label,tone]],arrows:[[from,to,label,dashed]],cap}; tone 0..7 picks a --p colour; '\n' splits lines */
function diagram(sp) {
  const B = {}; sp.boxes.forEach(b => { B[b[0]] = { x: b[1], y: b[2], w: b[3], h: b[4] }; });
  const s = svg('svg', { viewBox: `0 0 ${sp.w} ${sp.h}`, role: 'img', 'aria-label': sp.cap || 'diagram', style: 'width:100%;min-width:' + Math.min(sp.w, 540) + 'px;max-width:' + sp.w + 'px;height:auto;display:block;margin:0 auto' });
  s.append(svg('defs', {}, svg('marker', { id: 'ah', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, svg('path', { d: 'M0 0L10 5L0 10z', fill: 'currentColor' }))));
  const edge = (a, t) => { const cx = a.x + a.w / 2, cy = a.y + a.h / 2, dx = t.x + t.w / 2 - cx, dy = t.y + t.h / 2 - cy; const k = Math.min(dx ? (a.w / 2) / Math.abs(dx) : 1e9, dy ? (a.h / 2) / Math.abs(dy) : 1e9); return [cx + dx * k, cy + dy * k]; };
  (sp.arrows || []).forEach(([f, t, lab, dash]) => {
    const [x1, y1] = edge(B[f], B[t]), [x2, y2] = edge(B[t], B[f]);
    s.append(svg('line', { x1, y1, x2, y2, stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-dasharray': dash ? '5 4' : null, 'marker-end': 'url(#ah)', style: 'color:var(--mut)' }));
    if (lab) s.append(svg('text', { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 5, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--mut)' }, lab));
  });
  sp.boxes.forEach(([id, x, y, w, hh, lab, tone]) => {
    s.append(svg('rect', { x, y, width: w, height: hh, rx: 9, fill: tone == null ? 'var(--card)' : 'var(--p' + tone + ')', stroke: 'var(--line)', 'stroke-width': 1.5 }));
    const ls = String(lab).split('\n'), y0 = y + hh / 2 - (ls.length - 1) * 8 + 4;
    ls.forEach((l, i) => s.append(svg('text', { x: x + w / 2, y: y0 + i * 16, 'text-anchor': 'middle', 'font-size': 12.5, fill: 'var(--ink)', 'font-weight': i === 0 && ls.length > 1 ? 700 : 400 }, l)));
  });
  return h('figure', { class: 'arch' }, h('div', { class: 'svgw' }, s), sp.cap ? h('figcaption', { class: 'note' }, sp.cap) : null);
}
API.diagram = diagram;

        note: `A small heap with a very large TOAST relation means that wide values dominate. The planner's width estimate also shows in <code>EXPLAIN</code> as <code>width=</code>. ` + SRC(PGD + 'storage-toast.html', 'TOAST') },
      viz: { bad: vz([['query', [['SELECT *', 'bad', 2]]], ['pages touched', [['heap 4', 'ok'], ['toast chunks 1,200', 'bad', 4]]]], [['bytes to client', 100, 'bad', '2 MB per request (illustrative)']], `Every wide column is read, decompressed and shipped.`),
        good: vz([['query', [['SELECT id, status, amount', 'ok', 2]]], ['pages touched', [['heap 4', 'ok'], ['toast 0', 'ok', 4]]]], [['bytes to client', 3, 'ok', '6 kB per request (illustrative)']], `Unneeded wide columns are never fetched.`) },
      fix: [`Measure first: compare <code>pg_relation_size</code> of the table to its TOAST relation, and run <code>EXPLAIN (ANALYZE, BUFFERS)</code> for the list query.`, `Fix: name the columns the endpoint needs instead of <code>SELECT *</code>.`, `Fix: if a wide column is rarely read, keep it in a separate table joined by key.`, `Verify: <code>Buffers</code> and <code>width</code> drop in <code>EXPLAIN</code>, and the response size shrinks.`] },
    { tab: `Shared memory`, t: `Server fails to start: could not map anonymous shared memory`, sym: `<b>Symptom:</b> after a config change and restart, PostgreSQL does not come up and the log shows <code>FATAL: could not map anonymous shared memory</code>.`,
      ctx: `A tuning change raises <code>shared_buffers</code> to 14 GB (illustrative) and sets <code>huge_pages = on</code> on a host that reserved no huge pages. Another cause is a container memory limit smaller than the request.`,
      why: `The postmaster reserves one shared memory segment at startup, sized from shared_buffers, WAL buffers, connection slots and more. With <code>huge_pages = on</code> it must get huge pages or fail, and with a normal mapping it fails when the request exceeds what the OS or cgroup allows.`,
      log: { text: REP + `FATAL:  could not map anonymous shared memory: Cannot allocate memory\nHINT:  This error usually means that PostgreSQL's request for a shared memory segment exceeded available memory, swap space, or huge pages. To reduce the request size (currently 15481118720 bytes), reduce PostgreSQL's shared memory usage, perhaps by reducing "shared_buffers" or "max_connections".`,
        note: `The request size in bytes is printed, which tells you what to reduce. Wording varies slightly by version. ` + SRC(PGD + 'kernel-resources.html', 'Managing kernel resources') },
      viz: { bad: vz([['startup', [['request 14 GB', 'warn', 2], ['huge pages 0 reserved', 'bad', 2], ['FATAL', 'bad']]]], [['server available', 0, 'bad', 'down']], `The postmaster aborts before accepting connections.`),
        good: vz([['startup', [['request 8 GB', 'ok', 2], ['huge pages reserved', 'ok', 2], ['ready', 'ok']]]], [['server available', 100, 'ok', 'up']], `Request and reservation agree.`) },
      fix: [`Measure first: read the request size in the FATAL line and compare it with host memory, the cgroup limit and <code>vm.nr_hugepages</code>.`, `Fix: reduce <code>shared_buffers</code> or <code>max_connections</code> until the request fits.`, `Fix: either reserve enough huge pages (<code>vm.nr_hugepages</code>) or set <code>huge_pages = try</code> so the server falls back.`, `Verify: the server starts, and <code>SHOW shared_buffers</code> returns the intended value.`] }
  ] },

{ ask: `ORDER BY amount LIMIT 5 over ten million rows reads everything, while LIMIT 5 alone returns instantly. What decides whether a query can stop early?`,
  why: `Rows flow through a tree of nodes, and a node that must see all input before emitting anything forces a full read.`,
  principle: `Pull one item at a time so memory stays small and a consumer can stop the work above it.`,
  design: `The Volcano iterator model: each plan node asks its child for the next row, and sort, hash and aggregate nodes block.`,
  scene: [
    `The admin page shows the five largest orders. The query is <code>SELECT * FROM orders ORDER BY amount DESC LIMIT 5</code> on 10 million rows (illustrative) and takes 4 seconds (illustrative).`,
    `A developer tests <code>SELECT * FROM orders LIMIT 5</code> and gets an answer in 1 ms (illustrative). Both queries end in <code>LIMIT 5</code>, so why are they so different?`
  ],
  predict: { q: `Two plans: <b>A</b> is <code>Seq Scan → Limit</code>, <b>B</b> is <code>Seq Scan → Sort → Limit</code>. Which plan can stop reading the table early?`,
    opts: [`Both, because LIMIT always stops the scan`, `Only A: Sort needs all input before it can emit its first row`, `Only B: sorting first makes the scan cheaper`, `Neither: PostgreSQL always reads the full table`], ans: 1,
    why: `LIMIT stops pulling after N rows. In plan A the scan is one pull away, so it stops after N. In plan B the Sort must consume every input row before returning the first one, so the scan finishes anyway.` },
  idea: [
    `<b>ExecProcNode</b>: each node returns one row per call by calling its child, so a tree runs as nested pulls.`,
    `<b>Streaming nodes</b> (scan, filter, limit, nested loop) pass rows through and hold almost nothing.`,
    `<b>Blocking nodes</b> (Sort, Hash, HashAggregate) must read their input first. Their memory is what <code>work_mem</code> limits.`,
    `<b>Top-N heapsort</b>: with a LIMIT above, Sort keeps only N rows in a heap, so memory stays tiny, but every input row is still read.`,
    `<b>EXPLAIN ANALYZE</b> prints actual <code>rows</code> and <code>loops</code> per node: that is the count of pulls.`
  ],
  arch: { w: 600, h: 200, cap: `The client pulls from Limit, Limit pulls from its child, and so on down to the scan. The blocking node must drain the scan first.`,
    boxes: [['cl', 10, 70, 100, 56, 'Client\nfetch', 0], ['lim', 150, 70, 100, 56, 'Limit\nN rows', 1], ['sort', 290, 70, 110, 56, 'Sort\nblocking', 2], ['scan', 440, 70, 110, 56, 'Seq Scan\n1 row per call', 3]],
    arrows: [['cl', 'lim', 'next row'], ['lim', 'sort', 'next row'], ['sort', 'scan', 'ALL rows'], ['scan', 'sort', '', true]] },
  pg: 'executor',
  common: [
    { tab: `OFFSET`, t: `Deep OFFSET pagination reads and discards rows`, sym: `<b>Symptom:</b> page 1 of a listing is fast, page 5,000 takes seconds, and the cost grows with the page number.`,
      ctx: `The orders list uses <code>ORDER BY created_at DESC LIMIT 50 OFFSET $n</code> (illustrative). Crawlers walk to the last pages.`,
      why: `OFFSET is implemented by pulling and throwing away the first n rows. A plan that has to produce 250,050 rows to return 50 does that work on every request, even with an index.`,
      log: { text: REP + ` Limit (actual time=612.1..612.2 rows=50 loops=1)\n   ->  Index Scan Backward using orders_created_at_idx on orders (actual time=0.03..590.4 rows=250050 loops=1)`,
        note: `The scan node reports <code>rows=250050</code>: that is how many pulls were needed for 50 returned rows. ` + SRC(PGD + 'queries-limit.html', 'LIMIT and OFFSET') },
      viz: { bad: vz([['page 5,000', [['read 250,000', 'bad', 5], ['keep 50', 'ok']]]], [['rows pulled per request', 100, 'bad', '250,050 (illustrative)']], `Skipped rows are still read.`),
        good: vz([['next page', [['seek to cursor', 'ok'], ['keep 50', 'ok']]]], [['rows pulled per request', 1, 'ok', '50']], `Keyset pagination seeks straight to the position.`) },
      fix: [`Measure first: run <code>EXPLAIN (ANALYZE)</code> on a deep page and read the scan node's <code>rows</code>.`, `Fix: use keyset pagination: <code>WHERE (created_at, id) &lt; ($1, $2) ORDER BY created_at DESC, id DESC LIMIT 50</code>.`, `Fix: back it with an index on <code>(created_at, id)</code>.`, `Verify: <code>rows</code> on the scan node equals the page size, for any page.`] },
    { tab: `Fetch size`, t: `The client fetches the whole result set and the app runs out of memory`, sym: `<b>Symptom:</b> an export job dies with <code>java.lang.OutOfMemoryError: Java heap space</code> while the database looks calm.`,
      ctx: `A nightly export runs <code>SELECT * FROM orders</code> through a JDBC driver with default settings (illustrative: 30 million rows).`,
      why: `By default the PostgreSQL JDBC driver reads the entire result into client memory. The server streams rows happily, but the client buffers all of them first.`,
      log: { text: REP + `Exception in thread "export" java.lang.OutOfMemoryError: Java heap space\n  at org.postgresql.jdbc.PgResultSet.<init>\n-- server side: pg_stat_activity shows the backend idle after sending the data`,
        note: `Cursor mode needs autocommit off and a positive fetch size. ` + SRC('https://jdbc.postgresql.org/documentation/query/#getting-results-based-on-a-cursor', 'pgJDBC: getting results based on a cursor') },
      viz: { bad: vz([['client heap', [['30 M rows buffered', 'bad', 5]]], ['server', [['streams all rows', 'ok']]]], [['client memory', 100, 'bad', 'heap exhausted']], `The client holds the full result set.`),
        good: vz([['client heap', [['5,000 rows at a time', 'ok', 2]]], ['server', [['portal / cursor', 'ok']]]], [['client memory', 4, 'ok', 'bounded']], `A cursor delivers batches.`) },
      fix: [`Measure first: check client heap use during the export and confirm the driver fetch size is unset.`, `Fix: turn off autocommit on the connection and call <code>setFetchSize(5000)</code> (or the equivalent in your driver).`, `Fix: for command-line exports, use <code>psql</code> with <code>\\set FETCH_COUNT 5000</code> or <code>COPY ... TO STDOUT</code>.`, `Verify: client memory stays flat while rows stream.`] },
    { tab: `Sort`, t: `ORDER BY on an unindexed column forces a full sort before LIMIT`, sym: `<b>Symptom:</b> a top-N query is slow, and <code>EXPLAIN</code> shows a Sort above a Seq Scan that reads the whole table.`,
      ctx: `The admin page runs <code>ORDER BY amount DESC LIMIT 5</code> and no index on <code>amount</code> exists (illustrative).`,
      why: `With no index to deliver rows already ordered, the Sort node must see every row to know the top 5. Top-N heapsort keeps memory small, but the scan still reads everything.`,
      log: { text: REP + ` Limit (actual time=3820.4..3820.4 rows=5 loops=1)\n   ->  Sort (actual time=3820.4..3820.4 rows=5 loops=1)\n         Sort Key: amount DESC\n         Sort Method: top-N heapsort  Memory: 25kB\n         ->  Seq Scan on orders (actual time=0.02..2910.7 rows=10000000 loops=1)`,
        note: `Memory is tiny (<code>top-N heapsort</code>) but the scan node still shows all ten million rows. ` + SRC(PGD + 'using-explain.html', 'Using EXPLAIN') },
      viz: { bad: vz([['plan', [['Seq Scan 10M', 'bad', 3], ['Sort top-N', 'warn'], ['Limit 5', 'ok']]]], [['rows pulled', 100, 'bad', '10,000,000 (illustrative)']], `The scan cannot stop until the sort is satisfied.`),
        good: vz([['plan', [['Index Scan amount DESC', 'ok', 3], ['Limit 5', 'ok']]]], [['rows pulled', 1, 'ok', '5']], `The index delivers rows in order, so Limit stops the scan.`) },
      fix: [`Measure first: run <code>EXPLAIN (ANALYZE)</code> and note the scan node's actual <code>rows</code>.`, `Fix: <code>CREATE INDEX CONCURRENTLY orders_amount_idx ON orders (amount DESC)</code>.`, `Fix: if filters are always present, make the index match them, for example a partial index.`, `Verify: the plan shows an Index Scan feeding Limit directly and the scan <code>rows</code> equals the LIMIT.`] }
  ] },

{ ask: `Finding amount = 99 in ten million rows scans every page, and after adding an index inserts get slower. What does an index cost and buy?`,
  why: `A sorted structure turns a scan of everything into a short walk, at the price of keeping it sorted on every write.`,
  principle: `Keep data ordered in a wide, shallow tree so any key is a few page reads away.`,
  design: `A B-tree of 8 kB pages: root, internal and leaf pages, with page splits on insert and a linked leaf level for ranges.`,
  scene: [
    `The support tool searches orders by <code>amount</code>. With no index every lookup scans the whole heap (illustrative: 10 million rows, 1.2 GB).`,
    `The team adds an index and lookups drop from seconds to milliseconds. A week later the import job that inserts orders keyed by random UUIDs is slower than before, WAL volume has grown, and the index is larger than the table was expected to be.`
  ],
  predict: { q: `Inserting monotonically increasing keys versus random UUIDv4 keys into a B-tree. Which causes more page splits spread across the tree?`,
    opts: [`Increasing keys: they all pile up on one side`, `Random keys: every insert lands in a random leaf, so many leaves fill and split`, `Both cause the same number of splits`, `Neither: B-trees never split`], ans: 1,
    why: `Increasing keys always go to the rightmost leaf, which splits in a cheap and tightly packed way. Random keys hit random leaves, so leaves split everywhere, run about half full on average, and touch many more pages.` },
  idea: [
    `<b>Search</b>: from the root page, binary-search each page to pick a child, down to a leaf. The number of page reads is the tree height.`,
    `<b>Page split</b>: when a leaf is full, PostgreSQL allocates a new page, moves about half of the entries and adds a downlink in the parent. Splits can cascade up.`,
    `<b>Leaf chain</b>: leaves are linked left and right, so a range scan finds the first key and then walks sideways.`,
    `<b>Index-only scan</b>: when all needed columns are in the index and the <b>visibility map</b> says the heap page is all-visible, the heap is not read.`,
    `<b>Multicolumn rule</b>: entries are ordered by the first column, then the second, so the index helps queries that constrain a leading prefix.`
  ],
  arch: { w: 600, h: 230, cap: `One lookup touches one page per level. Inserts that overflow a leaf split it and push a key into the parent.`,
    boxes: [['root', 235, 10, 130, 50, 'Root page\nkeys + downlinks', 0], ['i1', 100, 85, 130, 50, 'Internal page\nkeys + downlinks', 1], ['i2', 370, 85, 130, 50, 'Internal page\nkeys + downlinks', 1], ['l1', 10, 165, 120, 50, 'Leaf\nkeys + TIDs', 2], ['l2', 160, 165, 120, 50, 'Leaf\nkeys + TIDs', 2], ['l3', 320, 165, 120, 50, 'Leaf\nkeys + TIDs', 2], ['l4', 470, 165, 120, 50, 'Leaf\nkeys + TIDs', 2]],
    arrows: [['root', 'i1', ''], ['root', 'i2', ''], ['i1', 'l1', ''], ['i1', 'l2', ''], ['i2', 'l3', ''], ['i2', 'l4', ''], ['l1', 'l2', '', true], ['l2', 'l3', '', true], ['l3', 'l4', '', true]] },
  pg: 'btree',
  common: [
    { tab: `Expression`, t: `WHERE lower(email) = ... ignores the index on email`, sym: `<b>Symptom:</b> a login lookup stays slow after adding an index on <code>email</code>, and <code>EXPLAIN</code> shows a Seq Scan.`,
      ctx: `The index is <code>CREATE INDEX ON users (email)</code>, but the query is <code>WHERE lower(email) = lower($1)</code> (illustrative: 20 million users).`,
      why: `The index is sorted by the stored value <code>email</code>, not by <code>lower(email)</code>. The planner can only use an index when the query's expression matches an indexed expression.`,
      log: { text: REP + ` Seq Scan on users (actual time=0.02..1811.5 rows=1 loops=1)\n   Filter: (lower(email) = 'ann@example.com'::text)\n   Rows Removed by Filter: 19999999`,
        note: `<code>Rows Removed by Filter</code> is the cost of not having a usable index. ` + SRC(PGD + 'indexes-expressional.html', 'Indexes on expressions') },
      viz: { bad: vz([['index', [['sorted by email', 'warn', 2]]], ['query', [['lower(email)', 'bad', 2], ['no match', 'bad']]]], [['pages read', 100, 'bad', 'whole table']], `The index order is not the query's order.`),
        good: vz([['index', [['sorted by lower(email)', 'ok', 2]]], ['query', [['lower(email)', 'ok', 2], ['match', 'ok']]]], [['pages read', 1, 'ok', '4']], `The expression is indexed, so a lookup descends the tree.`) },
      fix: [`Measure first: run <code>EXPLAIN (ANALYZE)</code> on the login query and read the scan type and <code>Rows Removed by Filter</code>.`, `Fix: <code>CREATE INDEX CONCURRENTLY users_lower_email_idx ON users (lower(email))</code>.`, `Fix: or store a normalized column or use the <code>citext</code> type, and index that.`, `Verify: the plan shows an Index Scan on the new index.`] },
    { tab: `Column order`, t: `Composite index with the wrong column order cannot serve the filter`, sym: `<b>Symptom:</b> a query that filters only on <code>status</code> ignores an index that includes <code>status</code>.`,
      ctx: `The index is <code>(created_at, status)</code>, while the dashboard filters by <code>status = 'pending'</code> only (illustrative).`,
      why: `Entries are ordered by <code>created_at</code> first. Rows with the same status are scattered all over the index, so there is no contiguous range to descend to. A leading-column constraint is what makes the index efficient.`,
      log: { text: REP + ` Index Scan using orders_created_at_status_idx on orders (actual time=0.08..941.2 rows=1200 loops=1)\n   Index Cond: (status = 'pending'::text)\n -- or, more commonly, the planner prefers:\n Seq Scan on orders ... Filter: (status = 'pending'::text)`,
        note: `An index scan that must walk the entire index and filter by a non-leading column is barely better than a table scan. ` + SRC(PGD + 'indexes-multicolumn.html', 'Multicolumn indexes') },
      viz: { bad: vz([['index order', [['created_at', 'warn'], ['status', 'warn']]], ['filter status=pending', [['not a prefix', 'bad', 2], ['walk all leaves', 'bad']]]], [['index pages read', 90, 'bad', 'most of the index']], `The filter column is not the leading column.`),
        good: vz([['index order', [['status', 'ok'], ['created_at', 'ok']]], ['filter status=pending', [['prefix match', 'ok', 2], ['descend + range', 'ok']]]], [['index pages read', 3, 'ok', 'few']], `The equality column leads.`) },
      fix: [`Measure first: list the real filters from <code>pg_stat_statements</code> and check each index with <code>EXPLAIN</code>.`, `Fix: put equality columns first and range or sort columns last, for example <code>(status, created_at)</code>.`, `Fix: drop the old index once the new one is used, to save write cost.`, `Verify: the plan shows <code>Index Cond</code> on the leading column and <code>idx_scan</code> grows on the new index in <code>pg_stat_user_indexes</code>.`] },
    { tab: `UUIDv4`, t: `Random UUIDv4 keys cause page splits, bloat and extra WAL`, sym: `<b>Symptom:</b> bulk inserts get slower as the table grows, the primary key index becomes much larger than the data justifies, and WAL volume rises.`,
      ctx: `The orders primary key is a random UUIDv4 generated by clients (illustrative: 200 million rows).`,
      why: `Each new key lands in a random leaf. That leaf is likely not cached, may be full and split, and the first change to a page after a checkpoint logs a full-page image. Leaves also end up about half full, wasting space.`,
      log: { text: REP + `app=> SELECT relname, pg_size_pretty(pg_relation_size(oid))\n       FROM pg_class WHERE relname IN ('orders_pkey_uuid','orders_pkey_bigint');\n      relname       | pg_size_pretty\n--------------------+----------------\n orders_pkey_uuid   | 11 GB\n orders_pkey_bigint | 4300 MB`,
        note: `Same row count, different key pattern. Sizes here are illustrative. You can measure index density with the <code>pgstattuple</code> extension (<code>pgstatindex</code>). ` + SRC(PGD + 'btree.html', 'B-Tree indexes') },
      viz: { bad: vz([['inserts land in', [['leaf 17', 'warn'], ['leaf 902', 'warn'], ['leaf 311', 'warn'], ['leaf 4', 'warn']]], ['effect', [['many splits', 'bad'], ['half-full leaves', 'bad'], ['many FPIs', 'bad']]]], [['leaf fill', 55, 'bad', 'about 55%']], `Random keys touch the whole index.`),
        good: vz([['inserts land in', [['rightmost leaf', 'ok', 4]]], ['effect', [['few splits', 'ok'], ['dense leaves', 'ok'], ['hot page cached', 'ok']]]], [['leaf fill', 90, 'ok', 'about 90%']], `Ordered keys fill the rightmost leaf.`) },
      fix: [`Measure first: compare index size and leaf density to a sequential-key control, and check WAL volume per insert.`, `Fix: use a time-ordered key: a bigint identity column, or UUIDv7 generated by the application (UUIDv7 generation is not built into PostgreSQL 16 or 17).`, `Fix: if the key must stay random, give the index a lower fillfactor and rebuild it with <code>REINDEX CONCURRENTLY</code> during quiet periods.`, `Verify: <code>pgstatindex</code> reports higher <code>avg_leaf_density</code> and WAL per insert falls.`] },
    { tab: `Type cast`, t: `An implicit cast on the column prevents index use`, sym: `<b>Symptom:</b> a lookup by <code>user_id</code> is a Seq Scan only when called from one service, although the SQL looks identical.`,
      ctx: `<code>user_id</code> is <code>bigint</code> with an index. That service binds the parameter as <code>numeric</code> (illustrative: a decimal type in the client library).`,
      why: `There is no <code>bigint = numeric</code> operator. The analyzer picks <code>numeric = numeric</code> and casts the column, so the indexed value <code>user_id</code> is no longer what the condition compares: the expression is <code>user_id::numeric</code>.`,
      log: { text: REP + ` Seq Scan on orders (actual time=0.03..2204.8 rows=14 loops=1)\n   Filter: ((user_id)::numeric = '42'::numeric)\n   Rows Removed by Filter: 9999986`,
        note: `The tell is the cast on the <em>column</em> side, <code>(user_id)::numeric</code>. ` + SRC(PGD + 'typeconv-oper.html', 'Type conversion: operators') },
      viz: { bad: vz([['parameter type', [['numeric', 'bad']]], ['condition', [['user_id::numeric = 42', 'bad', 2], ['index unusable', 'bad']]]], [['pages read', 100, 'bad', 'whole table']], `The column is cast, so its index no longer applies.`),
        good: vz([['parameter type', [['bigint', 'ok']]], ['condition', [['user_id = 42', 'ok', 2], ['index used', 'ok']]]], [['pages read', 1, 'ok', '4']], `Types match, so the plan uses the index.`) },
      fix: [`Measure first: find the <code>(col)::type</code> pattern in the <code>Filter</code> line of <code>EXPLAIN</code>.`, `Fix: bind parameters with the column's type, or cast the parameter explicitly: <code>WHERE user_id = $1::bigint</code>.`, `Fix: correct the client mapping, for example use long or bigint for identifiers, not decimal types.`, `Verify: the filter shows no cast on the column and the plan uses an Index Scan.`] }
  ] },

{ ask: `The finance report reads an order while checkout updates it. Who waits for whom?`,
  why: `Readers and writers would otherwise block each other, so PostgreSQL keeps several versions of a row instead of locking it.`,
  principle: `Never overwrite in place: keep versions and let each reader pick the one its snapshot allows.`,
  design: `Multiversion concurrency control with xmin/xmax stamps on every tuple and snapshots that decide visibility.`,
  scene: [
    `At month end the finance team runs a 20-minute report that reads the whole <code>orders</code> table (illustrative). At the same time checkout keeps updating order rows from <code>pending</code> to <code>paid</code>.`,
    `A manager asks the on-call engineer to move the report to a replica because "it must be blocking checkout". The engineer opens <code>pg_stat_activity</code> and sees that checkout is not waiting on the report at all. Another batch job that updates the same orders is the thing checkout waits on.`
  ],
  predict: { q: `Transaction A has updated row R and has not committed. Transaction B now runs <code>SELECT</code> on row R. What happens?`,
    opts: [`B waits until A commits`, `B sees the old version of R and does not wait`, `B sees A's uncommitted new version`, `B fails with a serialization error`], ans: 1,
    why: `Plain reads never take row locks. B's snapshot predates A's commit, so the new version, stamped with A's transaction ID in <code>xmin</code>, is invisible to B and the old version is returned. Only another writer to the same row would wait.` },
  idea: [
    `<b>Tuple header</b>: every row version carries <code>xmin</code> (the creating transaction) and <code>xmax</code> (the deleting or updating one). An UPDATE sets xmax on the old version and writes a new version.`,
    `<b>Snapshot</b>: the oldest still-running transaction (xmin), the next ID to assign (xmax) and the list of in-progress IDs (xip). A version is visible if its creator committed before the snapshot and its deleter did not.`,
    `<b>Commit status</b> comes from the commit log (<code>pg_xact</code>), with hint bits on tuples caching the answer.`,
    `<b>HOT update</b>: if no indexed column changes and the new version fits on the same page, no new index entries are written.`,
    `<b>Row locks</b> only conflict between writers: a second UPDATE of the same row waits for the first transaction to end.`
  ],
  arch: { w: 600, h: 220, cap: `Two versions of one row on a page. Each session's snapshot picks one; only a second writer waits.`,
    boxes: [['sa', 10, 20, 120, 56, 'Session A\nUPDATE', 0], ['sb', 10, 140, 120, 56, 'Session B\nSELECT', 1], ['v1', 230, 20, 150, 56, 'Version 1\nxmin=100 xmax=205', 2], ['v2', 230, 140, 150, 56, 'Version 2\nxmin=205 xmax=0', 3], ['clog', 450, 80, 130, 56, 'pg_xact\ncommit status', 4]],
    arrows: [['sa', 'v1', 'set xmax'], ['sa', 'v2', 'insert'], ['sb', 'v1', 'visible'], ['sb', 'v2', 'skip if uncommitted', true], ['v1', 'clog', 'xmax 205?'], ['v2', 'clog', '']] },
  pg: 'mvcc',
  common: [
    { tab: `count(*)`, t: `count(*) is slow because every tuple's visibility is checked`, sym: `<b>Symptom:</b> <code>SELECT count(*) FROM orders</code> takes seconds, grows linearly with the table and looks CPU and I/O bound.`,
      ctx: `The dashboard counts all orders on a table with 80 million rows (illustrative).`,
      why: `No row count is stored, because the right answer depends on the caller's snapshot. PostgreSQL must visit each tuple, or use an index-only scan where the visibility map allows skipping the heap.`,
      log: { text: REP + ` Aggregate (actual time=2210.4..2210.4 rows=1 loops=1)\n   ->  Index Only Scan using orders_pkey on orders (actual time=0.04..1480.1 rows=80000000 loops=1)\n         Heap Fetches: 4120377`,
        note: `<code>Heap Fetches</code> counts pages that still had to be checked in the heap, because the visibility map did not mark them all-visible. ` + SRC('https://wiki.postgresql.org/wiki/Slow_Counting', 'PostgreSQL wiki: Slow Counting') },
      viz: { bad: vz([['count(*)', [['visit 80 M tuples', 'bad', 4], ['check visibility', 'warn']]]], [['work per call', 100, 'bad', '80 M (illustrative)']], `Cost grows with the table.`),
        good: vz([['dashboard', [['read estimate or counter', 'ok', 3]]]], [['work per call', 1, 'ok', 'one row']], `The number comes from a counter or a statistic.`) },
      fix: [`Measure first: <code>EXPLAIN (ANALYZE, BUFFERS)</code> on the count and check <code>Heap Fetches</code>.`, `Fix: if an estimate is fine, read <code>pg_class.reltuples</code> or use <code>EXPLAIN</code>'s row estimate.`, `Fix: if it must be exact and fast, maintain a small counter table updated by the writers or batch job.`, `Fix: keep the visibility map fresh with timely vacuum so index-only scans skip the heap.`, `Verify: the dashboard call stays in milliseconds as the table grows.`] },
    { tab: `HOT`, t: `Indexing a frequently updated column blocks HOT updates`, sym: `<b>Symptom:</b> update throughput drops after adding an index, indexes bloat and WAL volume rises.`,
      ctx: `A developer indexes <code>orders.status</code> for a dashboard, and checkout updates <code>status</code> on every order several times (illustrative).`,
      why: `A HOT update needs that no indexed column changes. Once <code>status</code> is indexed, every status change writes a new version and a new entry in every index, which needs more pages, more WAL and more vacuum work.`,
      log: { text: REP + `app=> SELECT relname, n_tup_upd, n_tup_hot_upd FROM pg_stat_user_tables WHERE relname = 'orders';\n relname | n_tup_upd | n_tup_hot_upd\n---------+-----------+---------------\n orders  |  91234001 |       1204110`,
        note: `A low ratio of <code>n_tup_hot_upd</code> to <code>n_tup_upd</code> on an update-heavy table is the signal. ` + SRC(PGD + 'storage-hot.html', 'Heap-only tuples') },
      viz: { bad: vz([['UPDATE status', [['new version', 'warn'], ['entry in 4 indexes', 'bad', 2]]]], [['HOT updates', 1, 'bad', '1%']], `Every update touches every index.`),
        good: vz([['UPDATE status', [['new version in page', 'ok', 2], ['no index entries', 'ok']]]], [['HOT updates', 85, 'ok', '85%']], `Updates stay inside the heap page.`) },
      fix: [`Measure first: compute <code>n_tup_hot_upd / n_tup_upd</code> from <code>pg_stat_user_tables</code> for the table.`, `Fix: do not index volatile columns. Use a partial index such as <code>WHERE status = 'pending'</code> or query a replica or summary table.`, `Fix: lower the table <code>fillfactor</code> (for example 80 to 90) so a page has room for the new version.`, `Verify: the HOT ratio rises and index size and WAL growth flatten.`] },
    { tab: `Row lock`, t: `Writers queue behind a row lock held by a long transaction`, sym: `<b>Symptom:</b> checkout latency spikes, the connection pool saturates and <code>pg_stat_activity</code> shows many sessions in wait event <code>Lock</code>.`,
      ctx: `A batch job begins a transaction, updates 5 million orders, then waits on an external API before committing (illustrative: 4 minutes).`,
      why: `Row locks are held until the transaction ends. A checkout that updates one of those rows must wait for the batch to commit, and each waiting session holds a connection.`,
      log: { text: REP + `app=> SELECT pid, wait_event_type, wait_event, pg_blocking_pids(pid) AS blocked_by, left(query, 40)\n       FROM pg_stat_activity WHERE wait_event_type = 'Lock';\n  pid  | wait_event_type | wait_event    | blocked_by | left\n-------+-----------------+---------------+------------+--------------------\n  8812 | Lock            | transactionid | {7001}     | UPDATE orders SET ...`,
        note: `<code>pg_blocking_pids</code> names the holder. The wait is on the holder's transaction ID because a row lock is recorded in the tuple. ` + SRC(PGD + 'explicit-locking.html#LOCKING-ROWS', 'Explicit locking: row-level locks') },
      viz: { bad: vz([['batch txn', [['UPDATE 5 M rows', 'warn'], ['wait for API', 'bad', 2]]], ['checkout', [['UPDATE one row', 'ok'], ['waits', 'bad', 2]]]], [['pool slots waiting', 90, 'bad', '90 of 100']], `The lock is held for the whole transaction.`),
        good: vz([['batch txn', [['batch of 1,000', 'ok'], ['commit', 'ok']]], ['checkout', [['UPDATE one row', 'ok'], ['no wait', 'ok']]]], [['pool slots waiting', 2, 'ok', '2 of 100']], `Short transactions release locks quickly.`) },
      fix: [`Measure first: list blockers with <code>pg_blocking_pids</code> and read each blocker's <code>xact_start</code> and state.`, `Fix: process the batch in small transactions and commit between batches, and never wait on external calls inside a transaction.`, `Fix: set <code>idle_in_transaction_session_timeout</code> and <code>lock_timeout</code> so stuck sessions are cut off.`, `Verify: the count of sessions in wait event <code>Lock</code> returns to near zero during the batch.`] }
  ] },

{ ask: `Power fails right after COMMIT returned. Is the paid order still there, and what did PostgreSQL write to make it so?`,
  why: `Data pages are written lazily, so something small and sequential must make a commit survive a crash.`,
  principle: `Write the intent to a sequential log first and make that log durable; treat everything else as a cache that can be rebuilt.`,
  design: `Write-ahead logging: records with LSNs, a flush of WAL at commit, a page-LSN rule and redo from the last checkpoint.`,
  scene: [
    `A payment service writes an order as <code>paid</code> and returns success to the customer. Two seconds later (illustrative) the host loses power.`,
    `After restart, PostgreSQL logs <code>database system was not properly shut down; automatic recovery in progress</code> and opens within seconds. Support receives complaints that two orders that were confirmed to customers are missing. The team had set <code>synchronous_commit = off</code> months earlier to speed up writes.`
  ],
  predict: { q: `With <code>synchronous_commit = off</code>, the host crashes 100 ms after a COMMIT returned. Can that committed transaction be lost?`,
    opts: [`No: COMMIT always means durable`, `Yes: its WAL may not be flushed yet, for up to about three times wal_writer_delay`, `Yes, and the database will also be corrupted`, `No: the checkpointer writes the page first`], ans: 1,
    why: `Asynchronous commit returns before the WAL is flushed. The WAL writer flushes every <code>wal_writer_delay</code> (default 200 ms), and the docs bound the risk window at up to three times that. The database stays consistent, but the last commits can vanish.` },
  idea: [
    `<b>WAL record</b>: describes a change, identified by an increasing <b>LSN</b>. WAL is appended to <b>WAL buffers</b> in memory and written to <code>pg_wal</code> files.`,
    `<b>Commit</b>: with <code>synchronous_commit = on</code> the backend waits until WAL up to its commit record is flushed to disk (<code>fsync</code>). After that the commit is durable, even if no data page was written.`,
    `<b>Page LSN rule</b>: a dirty data page may be written only after WAL up to that page's LSN has been flushed. The log always leads the data.`,
    `<b>Redo</b>: after a crash, replay WAL from the last checkpoint's redo point; a page whose LSN is already at or above the record is skipped.`,
    `<b>Full-page images</b> (<code>full_page_writes</code>): the first change to a page after a checkpoint logs the whole page, so a torn 8 kB write can be repaired.`
  ],
  arch: { w: 600, h: 230, cap: `Commit waits only for the sequential WAL flush. Data pages reach disk later, ahead of which the log must be on disk.`,
    boxes: [['bk', 10, 85, 100, 56, 'Backend\nCOMMIT', 0], ['wb', 150, 85, 120, 56, 'WAL buffers\nrecords + LSN', 1], ['wal', 320, 20, 120, 56, 'pg_wal\nflushed log', 2], ['bp', 320, 150, 120, 56, 'Shared buffers\ndirty pages', 3], ['df', 480, 150, 110, 56, 'Data files\nlazy writes', 4]],
    arrows: [['bk', 'wb', 'append'], ['wb', 'wal', 'flush at commit'], ['bk', 'bp', 'modify page'], ['bp', 'df', 'later'], ['wal', 'bp', 'log first', true]] },
  pg: 'wal',
  common: [
    { tab: `fsync off`, t: `fsync = off corrupts the database after an OS crash`, sym: `<b>Symptom:</b> after a power loss or kernel panic, PostgreSQL starts and later throws <code>invalid page</code> errors or reads wrong data.`,
      ctx: `A team disabled <code>fsync</code> on a production host to speed up a data load and never turned it back on (illustrative).`,
      why: `With <code>fsync = off</code> PostgreSQL never forces data to stable storage, so the OS may write a data page to disk before the WAL that describes it. After a crash the log cannot repair or even explain the state, and the result can be unrecoverable corruption.`,
      log: { text: REP + `ERROR:  invalid page in block 1432 of relation base/16384/16397\nERROR:  could not read block 1432 in file "base/16384/16397": read only 0 of 8192 bytes`,
        note: `The docs call turning off fsync a risk of unrecoverable corruption after a crash. Use it only for data you can recreate. ` + SRC(PGD + 'wal-reliability.html', 'Reliability') },
      viz: { bad: vz([['write order', [['data page on disk', 'bad'], ['WAL not yet', 'bad'], ['crash', 'bad']]]], [['recoverable', 0, 'bad', 'not guaranteed']], `The log no longer leads the data.`),
        good: vz([['write order', [['WAL fsync', 'ok'], ['data page later', 'ok'], ['crash: redo', 'ok']]]], [['recoverable', 100, 'ok', 'redo from WAL']], `With fsync on, redo always has the log.`) },
      fix: [`Measure first: <code>SHOW fsync</code>, <code>SHOW synchronous_commit</code> and <code>SHOW full_page_writes</code> on every production node.`, `Fix: set <code>fsync = on</code>. For disposable data loads use an unlogged table or a temporary database instead.`, `Fix: if the node already crashed with fsync off, restore from a backup rather than trusting the data files.`, `Verify: the settings are on, and configuration management alerts on any drift.`] },
    { tab: `Async window`, t: `The asynchronous-commit window loses the last commits`, sym: `<b>Symptom:</b> after a crash, a handful of confirmed orders are missing while the database is otherwise consistent.`,
      ctx: `A service sets <code>synchronous_commit = off</code> globally to cut commit latency (illustrative: from 4 ms to under 1 ms).`,
      why: `Commits return before their WAL is flushed. The WAL writer flushes every <code>wal_writer_delay</code>. The docs note the real risk window can be up to three times that, because of how the writer paces its flushing.`,
      log: { text: REP + `LOG:  database system was interrupted; last known up at 2026-10-08 14:21:07 UTC\nLOG:  database system was not properly shut down; automatic recovery in progress\nLOG:  redo starts at 4C/9A000028\nLOG:  redo done at 4C/9A8F31E8\nLOG:  database system is ready to accept connections`,
        note: `Recovery is clean, but WAL after the last flush point never existed on disk. Wording varies by version. ` + SRC(PGD + 'wal-async-commit.html', 'Asynchronous commit') },
      viz: { bad: vz([['timeline', [['commit A', 'ok'], ['commit B', 'warn'], ['commit C', 'warn'], ['crash', 'bad']]], ['WAL on disk', [['through A', 'ok'], ['B, C missing', 'bad', 2]]]], [['acknowledged commits lost', 20, 'bad', '2 of 10 (illustrative)']], `Commit B and C were told "ok" but never reached the log.`),
        good: vz([['timeline', [['commit A', 'ok'], ['commit B', 'ok'], ['commit C', 'ok'], ['crash', 'bad']]], ['WAL on disk', [['through C', 'ok', 3]]]], [['acknowledged commits lost', 0, 'ok', '0']], `Each commit waits for its flush.`) },
      fix: [`Measure first: compare <code>SHOW synchronous_commit</code> in the global config, the role and the session, and note which transactions need durability.`, `Fix: keep <code>synchronous_commit = on</code> by default, and use <code>SET LOCAL synchronous_commit = off</code> only inside transactions that can safely lose their last moments, such as logging.`, `Fix: for faster durable commits, batch work in fewer transactions, or put <code>pg_wal</code> on low-latency storage.`, `Verify: critical transactions show commit latency that includes the flush, and the lost-commit count after a crash test is zero.`] },
    { tab: `Torn pages`, t: `full_page_writes = off on storage without atomic 8 kB writes tears pages`, sym: `<b>Symptom:</b> after a crash, queries fail with checksum or invalid page errors on a few blocks, although fsync was on.`,
      ctx: `A team turned <code>full_page_writes</code> off to reduce WAL volume (illustrative: 40% less), on a filesystem that does not guarantee atomic 8 kB page writes.`,
      why: `A crash during a page write can leave half old and half new data. The first change to a page after a checkpoint logs a full-page image to repair that. Without it redo applies deltas to a broken base page.`,
      log: { text: REP + `WARNING:  page verification failed, calculated checksum 51234 but expected 9876\nERROR:  invalid page in block 3318 of relation base/16384/16410\n-- data checksums were enabled at initdb, so the torn page was detected`,
        note: `Checksums turn silent corruption into a loud error. They are chosen at <code>initdb</code> time (or with <code>pg_checksums</code> while offline). ` + SRC(PGD + 'runtime-config-wal.html#GUC-FULL-PAGE-WRITES', 'WAL settings: full_page_writes') },
      viz: { bad: vz([['page write', [['half old', 'bad'], ['half new', 'bad'], ['crash', 'bad']]], ['redo', [['no full image', 'bad', 2], ['cannot repair', 'bad']]]], [['torn pages after crash', 100, 'bad', '1 of 1 in flight']], `Redo has no clean base page.`),
        good: vz([['page write', [['half old', 'warn'], ['half new', 'warn'], ['crash', 'bad']]], ['redo', [['full image in WAL', 'ok', 2], ['page rewritten', 'ok']]]], [['torn pages after crash', 0, 'ok', '0 repaired']], `The full-page image restores the page.`) },
      fix: [`Measure first: <code>SHOW full_page_writes</code>, and check whether data checksums are on with <code>SHOW data_checksums</code>.`, `Fix: set <code>full_page_writes = on</code> unless the storage is certified to write 8 kB atomically.`, `Fix: reduce WAL volume with compression (<code>wal_compression</code>) and longer checkpoint intervals instead.`, `Verify: <code>full_page_writes</code> is on, WAL volume is acceptable, and crash tests produce no page errors.`] }
  ] },

{ ask: `The orders table doubles in size every week while its row count stays flat. Why can the old rows not be removed?`,
  why: `MVCC leaves old versions behind, and each one can only be removed once nobody might still need it.`,
  principle: `Garbage is defined by the oldest reader, not by the clock.`,
  design: `VACUUM removes versions older than the oldest snapshot horizon, and freezing marks very old tuples so transaction IDs can wrap around safely.`,
  scene: [
    `The <code>orders</code> table has 20 million live rows (illustrative) and gets heavy updates. Its size on disk doubles each week while <code>count(*)</code> stays the same. Autovacuum shows up in the logs, and it finishes quickly every time.`,
    `Querying <code>pg_stat_activity</code> reveals a session from a reporting tool that has been <code>idle in transaction</code> since the morning. The on-call engineer wonders what a session that does nothing can have to do with table size.`
  ],
  predict: { q: `A transaction has been idle in transaction for 6 hours. Can VACUUM remove rows that were deleted and committed 5 hours ago?`,
    opts: [`Yes: they are committed and old, so they are dead`, `No: that transaction's snapshot might still see them, so they are not removable yet`, `Yes, but only if autovacuum runs, not manual VACUUM`, `No, but only for the table it touched`], ans: 1,
    why: `A row version can be removed only when it is dead to every snapshot. The old transaction holds the xmin horizon back, so VACUUM must keep the rows. They show up as "dead but not yet removable". It is not limited to the tables the session touched.` },
  idea: [
    `<b>Dead tuple</b>: a version whose deleter committed. It stays on the page until VACUUM reclaims its space for reuse.`,
    `<b>xmin horizon</b>: the oldest transaction ID any snapshot may still need. Held back by long transactions, replication slots, prepared transactions and standbys with <code>hot_standby_feedback</code>.`,
    `<b>Lazy vacuum</b> scans the heap using the visibility map, removes dead tuples, cleans index entries and records free space in the free space map. Space returns to the table, not usually to the OS.`,
    `<b>Autovacuum</b> triggers when dead tuples exceed <code>autovacuum_vacuum_threshold + autovacuum_vacuum_scale_factor * rows</code> (defaults 50 and 0.2).`,
    `<b>Freezing</b>: tuples older than <code>vacuum_freeze_min_age</code> are marked frozen so that 32-bit transaction IDs can wrap safely. If it falls behind, the database stops accepting writes.`
  ],
  arch: { w: 600, h: 220, cap: `Vacuum may only remove what lies behind the horizon. A single old holder keeps the horizon from advancing.`,
    boxes: [['ht', 10, 20, 150, 56, 'Heap pages\nlive + dead tuples', 0], ['hz', 220, 20, 150, 56, 'xmin horizon\noldest snapshot', 1], ['hold', 430, 20, 150, 56, 'Holders\ntxn, slot, prepared', 2], ['vac', 10, 140, 150, 56, 'VACUUM\nremove, freeze', 3], ['vm', 220, 140, 150, 56, 'Visibility map\n+ free space map', 4], ['av', 430, 140, 150, 56, 'Autovacuum\nthreshold trigger', 5]],
    arrows: [['hold', 'hz', 'pin back'], ['hz', 'vac', 'limit'], ['vac', 'ht', 'reclaim'], ['vac', 'vm', 'update'], ['av', 'vac', 'launch']] },
  pg: 'vacuum',
  common: [
    { tab: `Idle in txn`, t: `An idle-in-transaction session blocks vacuum and causes bloat`, sym: `<b>Symptom:</b> table and index size keep growing, VACUUM VERBOSE reports dead tuples that cannot be removed, and one session has an old <code>xact_start</code>.`,
      ctx: `A reporting tool opens a transaction and the user walks away (illustrative: 9 hours).`,
      why: `The session's snapshot pins the oldest xmin. Every version deleted after that point must be kept, for every table in the database, so size grows until the session ends.`,
      log: { text: REP + `INFO:  finished vacuuming "public.orders"\ntuples: 0 removed, 41200000 remain, 38100000 are dead but not yet removable\nremovable cutoff: 91234001, which was 0 XIDs old when operation ended\n\napp=> SELECT pid, state, now() - xact_start AS age FROM pg_stat_activity WHERE state = 'idle in transaction';\n  pid  |        state        |   age\n-------+---------------------+----------\n  5120 | idle in transaction | 09:12:44`,
        note: `<code>oldest xmin</code> in the vacuum output points at the holder, and <code>backend_xmin</code> in <code>pg_stat_activity</code> shows it. Wording of the INFO line varies by version. ` + SRC(PGD + 'routine-vacuuming.html', 'Routine vacuuming') },
      viz: { bad: vz([['horizon', [['stuck at 9 h ago', 'bad', 3]]], ['vacuum', [['runs', 'ok'], ['keeps 38 M dead', 'bad', 2]]]], [['table size vs live data', 100, 'bad', '2.1x (illustrative)']], `Vacuum runs but can remove nothing newer than the horizon.`),
        good: vz([['horizon', [['advances with now', 'ok', 3]]], ['vacuum', [['runs', 'ok'], ['removes dead rows', 'ok', 2]]]], [['table size vs live data', 28, 'ok', '1.1x (illustrative)']], `A short snapshot lets the horizon advance.`) },
      fix: [`Measure first: query <code>pg_stat_activity</code> for sessions with an old <code>xact_start</code> or <code>backend_xmin</code>.`, `Fix: set <code>idle_in_transaction_session_timeout</code> (for example a few minutes) for application roles, and fix the tool to commit or roll back.`, `Fix: terminate the holder with <code>pg_terminate_backend(pid)</code> to unblock cleanup now.`, `Verify: the next vacuum reports dead rows removed, and the table stops growing.`] },
    { tab: `Scale factor`, t: `Autovacuum cannot keep up on a large table with the default scale factor`, sym: `<b>Symptom:</b> a big hot table bloats between rare long vacuums, and each vacuum takes hours.`,
      ctx: `The orders table has 500 million rows (illustrative) with default <code>autovacuum_vacuum_scale_factor = 0.2</code>.`,
      why: `The trigger is a fraction of the table, so for a huge table it waits for tens of millions of dead rows. The vacuum that follows has a huge backlog and is also paced by the cost-based delay.`,
      log: { text: REP + `app=> SELECT relname, n_live_tup, n_dead_tup, last_autovacuum FROM pg_stat_user_tables WHERE relname = 'orders';\n relname | n_live_tup | n_dead_tup | last_autovacuum\n---------+------------+------------+---------------------\n orders  |  500000000 |   96000000 | 2026-10-05 03:12:09\n\n-- trigger = 50 + 0.2 * 500000000 = about 100 million dead rows`,
        note: `Compare <code>n_dead_tup</code> against the trigger formula. Defaults are in the docs. ` + SRC(PGD + 'routine-vacuuming.html#AUTOVACUUM', 'The autovacuum daemon') },
      viz: { bad: vz([['trigger point', [['100 M dead rows', 'bad', 4]]], ['vacuum run', [['rare', 'warn'], ['huge backlog', 'bad', 2]]]], [['dead tuples between runs', 95, 'bad', '~100 M (illustrative)']], `A percentage is too coarse for a big table.`),
        good: vz([['trigger point', [['5 M dead rows', 'ok']]], ['vacuum run', [['frequent', 'ok'], ['small backlog', 'ok', 2]]]], [['dead tuples between runs', 5, 'ok', '~5 M (illustrative)']], `A lower factor triggers earlier.`) },
      fix: [`Measure first: track <code>n_dead_tup</code> and <code>last_autovacuum</code> for the biggest tables.`, `Fix: set per-table options, for example <code>ALTER TABLE orders SET (autovacuum_vacuum_scale_factor = 0.01)</code>.`, `Fix: if vacuum is too slow, raise <code>autovacuum_vacuum_cost_limit</code> (or lower <code>autovacuum_vacuum_cost_delay</code>) and make sure <code>autovacuum_max_workers</code> is sufficient. Trade-off: more I/O.`, `Verify: dead tuples stay near the new threshold and each run finishes in minutes.`] },
    { tab: `Wraparound`, t: `The wraparound guard stops writes`, sym: `<b>Symptom:</b> first warnings about vacuuming within N transactions, then writes fail with <code>database is not accepting commands</code>.`,
      ctx: `A large table was excluded from autovacuum by a per-table setting, and a blocked autovacuum never advanced the frozen horizon (illustrative).`,
      why: `Transaction IDs are 32 bits and compared in a circle. Tuples must be frozen before they are about 2 billion transactions old, or old rows would appear to be in the future. Near the limit PostgreSQL refuses new transaction IDs to protect the data.`,
      log: { text: REP + `WARNING:  database "app" must be vacuumed within 9985967 transactions\nHINT:  To avoid a database shutdown, execute a database-wide VACUUM in that database.\n...\nERROR:  database is not accepting commands that assign new transaction IDs to avoid wraparound data loss in database "app"`,
        note: `Wording varies by version (older releases omit "that assign new transaction IDs"). Track <code>age(datfrozenxid)</code> per database to see it coming. ` + SRC(PGD + 'routine-vacuuming.html#VACUUM-FOR-WRAPAROUND', 'Preventing transaction ID wraparound failures') },
      viz: { bad: vz([['oldest unfrozen xid', [['age 1.99 B', 'bad', 4]]], ['writes', [['refused', 'bad', 2]]]], [['age(datfrozenxid)', 99, 'bad', '99% of limit']], `The guard has stopped new transaction IDs.`),
        good: vz([['oldest unfrozen xid', [['age 120 M', 'ok', 2]]], ['writes', [['accepted', 'ok', 2]]]], [['age(datfrozenxid)', 6, 'ok', '6% of limit']], `Regular freezing keeps the age small.`) },
      fix: [`Measure first: <code>SELECT datname, age(datfrozenxid) FROM pg_database</code> and the same for <code>relfrozenxid</code> per table.`, `Fix: remove the holders (old transactions, slots, prepared transactions), then run <code>VACUUM (FREEZE)</code> on the oldest tables, in single-user mode if the server already refuses writes.`, `Fix: re-enable autovacuum on the excluded table and keep <code>autovacuum_freeze_max_age</code> at a sensible value.`, `Verify: <code>age(datfrozenxid)</code> falls well below <code>autovacuum_freeze_max_age</code> and an alert watches it.`] },
    { tab: `Slot / 2PC`, t: `An abandoned replication slot or prepared transaction holds the horizon`, sym: `<b>Symptom:</b> bloat and a stuck horizon with no visible long session in <code>pg_stat_activity</code>.`,
      ctx: `A decommissioned analytics consumer left a replication slot behind, and an old <code>PREPARE TRANSACTION</code> from a failed coordinator was never resolved (illustrative).`,
      why: `A slot keeps <code>xmin</code> or <code>catalog_xmin</code> back so the consumer can still read old rows, and a prepared transaction keeps its snapshot until committed or rolled back. Both hold the horizon like a long session, and neither shows up as a normal backend.`,
      log: { text: REP + `app=> SELECT slot_name, active, xmin, catalog_xmin FROM pg_replication_slots;\n slot_name | active |  xmin   | catalog_xmin\n-----------+--------+---------+--------------\n analytics | f      |         | 88123456\n\napp=> SELECT gid, prepared, owner FROM pg_prepared_xacts;\n  gid  |           prepared            | owner\n-------+-------------------------------+-------\n tx-77 | 2026-09-30 11:04:12+00        | app`,
        note: `Check both views whenever the horizon is stuck and no session explains it. ` + SRC(PGD + 'view-pg-replication-slots.html', 'pg_replication_slots') },
      viz: { bad: vz([['holders', [['backend: none', 'ok'], ['slot: analytics', 'bad'], ['prepared tx-77', 'bad']]], ['horizon', [['stuck 8 days', 'bad', 3]]]], [['reclaimable tuples', 0, 'bad', 'none']], `The holders are not ordinary sessions.`),
        good: vz([['holders', [['slot dropped', 'ok'], ['tx resolved', 'ok']]], ['horizon', [['advances', 'ok', 3]]]], [['reclaimable tuples', 100, 'ok', 'all dead tuples']], `Cleaning the holders frees the horizon.`) },

{ ask: `After the nightly bulk load a 5 ms query takes 5 minutes, though the query and the schema did not change. What did the planner decide differently?`,
  why: `There are many equivalent plans with wildly different costs, and the planner chooses from guessed row counts.`,
  principle: `Choose by estimated cost, and remember the quality of the choice is only as good as the estimates.`,
  design: `A cost-based planner using per-column statistics (histograms, most-common values, distinct counts) plus extended statistics and a plan cache.`,
  scene: [
    `At 02:00 a loader appends 2 million rows to <code>orders</code> for a new tenant (illustrative). By 08:00 the dashboard query that joins <code>orders</code> to <code>customers</code> takes 5 minutes (illustrative), where it took 5 ms before.`,
    `Nothing changed in the query, the indexes or the config. <code>EXPLAIN ANALYZE</code> shows <code>rows=10</code> estimated and <code>rows=2000000</code> actual on the first node, with a nested loop above it.`
  ],
  predict: { q: `Statistics say 10 rows match, but 2 million really do. Which join method is the planner likely to choose?`,
    opts: [`Hash join, because it is always fastest`, `Nested loop, because it is cheapest for very few outer rows`, `Merge join, because the inputs are large`, `It will refuse and ask for fresh statistics`], ans: 1,
    why: `A nested loop repeats an index probe per outer row, which is ideal for 10 rows and disastrous for 2 million. A hash join costs more up front but scales. The planner picks the cheapest plan for the estimate it believes.` },
  idea: [
    `<b>pg_statistic</b> (shown in <code>pg_stats</code>): per column null fraction, <code>n_distinct</code>, most common values and a histogram, sampled by ANALYZE with <code>default_statistics_target</code> (default 100).`,
    `<b>Selectivity</b>: the fraction of rows a predicate keeps, estimated from those statistics, multiplied across predicates as if they were independent.`,
    `<b>Cost</b>: sequential and random page costs plus CPU costs per row, summed per plan. Join methods differ: nested loop, hash, merge.`,
    `<b>Extended statistics</b> (<code>CREATE STATISTICS</code>) teach the planner about correlated columns.`,
    `<b>Plan cache</b>: a prepared statement uses custom plans for the first five executions, then may switch to a reusable generic plan, controlled by <code>plan_cache_mode</code>.`
  ],
  arch: { w: 600, h: 220, cap: `The planner prices several plans from estimated rows and chooses the cheapest. A wrong estimate flows into every cost above it.`,
    boxes: [['an', 10, 20, 120, 56, 'ANALYZE\nsample the table', 0], ['st', 170, 20, 130, 56, 'pg_statistic\nMCV, histogram', 1], ['sel', 340, 20, 120, 56, 'Selectivity\nrows estimate', 2], ['cost', 340, 140, 120, 56, 'Cost model\nper plan', 3], ['pick', 500, 80, 90, 56, 'Cheapest\nplan', 4], ['ext', 170, 140, 130, 56, 'Extended stats\ncorrelations', 5]],
    arrows: [['an', 'st', 'writes'], ['st', 'sel', 'reads'], ['ext', 'sel', 'refine'], ['sel', 'cost', 'rows'], ['cost', 'pick', 'min']] },
  pg: 'planner',
  common: [

    { tab: `Correlated`, t: `Correlated columns are misestimated`, sym: `<b>Symptom:</b> estimates are off by 10x to 1000x for a filter on two related columns, while each column alone is estimated well.`,

    { tab: `Generic plan`, t: `A generic plan is chosen for a skewed parameter after five executions`, sym: `<b>Symptom:</b> a prepared query is fast at first and becomes slow for large customers from the sixth execution onward.`,

      viz: { bad: vz([['executions 1-5', [['custom plans', 'ok', 3]]], ['execution 6+', [['generic plan', 'bad', 2], ['avg 200 rows', 'bad']]]], [['big customer latency', 100, 'bad', 'seconds (illustrative)']], `The generic plan ignores the skew.`),

      fix: [`Measure first: look for <code>$1</code> in <code>EXPLAIN</code> output and compare latency before and after the fifth call.`, `Fix: <code>SET plan_cache_mode = force_custom_plan</code> for the role or session (<code>ALTER ROLE api SET plan_cache_mode = force_custom_plan</code>).`, `Fix: or disable server-side prepared statements in the driver for this query.`, `Verify: latency for large customers no longer jumps after the fifth execution.`] }
