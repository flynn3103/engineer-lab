/* ---- ch11 · replication ---- */
PG.replication = function (root, A) {
  const { h, svg, seg, slider, stat, bar, note } = A;
  let lvl = 'local', down = 'up', slotM = 'none', keep = 'unlimited', fb = 'off';
  const lS = seg([{ v: 'off', l: 'off' }, { v: 'local', l: 'local' }, { v: 'remote_write', l: 'remote_write' }, { v: 'on', l: 'on' }, { v: 'remote_apply', l: 'remote_apply' }], lvl, v => { lvl = v; run(); });
  const dS = seg([{ v: 'up', l: 'Standby up' }, { v: 'down', l: 'Standby down' }], down, v => { down = v; run(); });
  const lagS = slider('standby lag (ms)', 0, 500, 120, 10, () => run());
  const cS = slider('crash primary at (ms)', 100, 1900, 900, 50, () => run());
  const slS = seg([{ v: 'none', l: 'No slot' }, { v: 'inactive', l: 'Inactive slot (standby down 6 h)' }], slotM, v => { slotM = v; run(); });
  const kS = seg([{ v: 'unlimited', l: 'max_slot_wal_keep_size = -1' }, { v: 'cap', l: 'max_slot_wal_keep_size = 20GB' }], keep, v => { keep = v; run(); });
  const qS = slider('standby query duration (s)', 5, 600, 120, 5, () => run());
  const fbS = seg([{ v: 'off', l: 'hot_standby_feedback = off' }, { v: 'on', l: 'hot_standby_feedback = on' }], fb, v => { fb = v; run(); });
  const out = stat([]), lane = h('div', { class: 'pgx-lanes' });
  function run() {
    const c = cS.value, lag = lagS.value, isDown = down === 'down';
    const marks = []; let latSum = 0, latN = 0, lost = 0, acked = 0, hung = 0;
    for (let i = 0; i < 30; i++) {
      const t = 100 + i * 60, wr = isDown ? Infinity : t + 3 + lag, fl = isDown ? Infinity : wr + 4, ap = isDown ? Infinity : fl + Math.round(lag / 2);
      const ack = lvl === 'off' ? t : lvl === 'local' ? t + 2 : lvl === 'remote_write' ? wr : lvl === 'on' ? fl : ap;
      let cls = '';
      if (ack === Infinity) { if (t <= c) hung++; cls = t <= c ? 'warn' : ''; }
      else if (ack <= c) { acked++; latSum += ack - t; latN++; if (wr > c) { lost++; cls = 'bad'; } }
      else cls = 'warn';
      marks.push({ t, cls });
    }
    const pct = t => (t / 2000 * 100).toFixed(2) + '%';
    lane.replaceChildren(h('div', { class: 'pgx-lane' }, h('span', {}, 'commits'), h('div', { class: 'track', role: 'img', 'aria-label': 'commit timeline with crash line' }, marks.map(m => h('div', { class: 'tk ' + m.cls, style: 'left:' + pct(m.t) })), h('div', { class: 'cut', style: 'left:' + pct(c) }))));
    const walGB = slotM === 'inactive' ? (keep === 'cap' ? 21 : 1 + 6 * 35) : 1;
    const cancelled = qS.value > 30 && fb === 'off' ? 10 : 0;
    const lat = latN ? (latSum / latN).toFixed(1) : (hung ? 'hangs' : '-');
    out.update([{ l: 'acked commits lost on failover', v: lost, cls: lost ? 'bad' : 'ok' }, { l: 'avg commit latency (ms)', v: lat, cls: lat === 'hangs' ? 'bad' : 'ok' }, { l: 'commits hung', v: hung, cls: hung ? 'bad' : 'ok' }, { l: 'pg_wal size (GB, illustrative)', v: walGB, cls: walGB > 100 ? 'bad' : 'ok' }, { l: 'standby queries cancelled (of 10)', v: cancelled, cls: cancelled ? 'bad' : 'ok' }]);
  }
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: what COMMIT waits for decides what a failover can lose, and a synchronous standby that is down makes commits hang.'),
    bar(h('b', {}, 'synchronous_commit '), lS), bar(dS, lagS, cS),
    bar(slS, kS), bar(qS, fbS),
    bar(...pgxPresets(() => { lvl = 'local'; lS.set('local'); down = 'up'; dS.set('up'); lagS.value = 120; cS.value = 900; slotM = 'none'; slS.set('none'); fb = 'off'; fbS.set('off'); qS.value = 120; run(); }, () => { lvl = 'on'; lS.set('on'); down = 'up'; dS.set('up'); keep = 'cap'; kS.set('cap'); fb = 'on'; fbS.set('on'); run(); })),
    lane, out,
    note('Illustrative model: 30 commits every 60 ms, 3 ms plus the standby lag you choose for WAL to reach the standby, 4 ms more to flush it, then half the lag again to replay it. Red commits were acknowledged to the client before their WAL reached the standby and are lost if the standby is promoted. WAL growth assumes 35 GB per hour (invented). Queries over 30 s are cancelled by replay when feedback is off (default max_standby_streaming_delay).')));

  app.replaceChildren(topbar(true), h('div', { class: 'wrap' },
    h('div', { class: 'chhead', style: '--pc:' + pc(i) }, h('div', { class: 'n' }, i + 1), h('div', {}, h('small', {}, (COURSE.flat ? COURSE.title : P.name) + ' · chapter ' + (i + 1) + ' of ' + CHAPTERS.length), h('h1', {}, p.t))),
    h('section', { class: 'blk' }, h('h3', {}, num(), 'The problem'), h('div', { class: 'prob' }, h('div', { html: c.scene.map(x => '<p>' + x + '</p>').join('') }), h('p', { class: 'q' }, c.ask))),
    c.predict ? predictBlock(c, num()) : null,
    c.archSteps ? null : ideaBlock(),
    ...(c.walks || (c.walk ? [c.walk] : [])).map(w => h('section', { class: 'blk' }, h('h3', {}, num(), w.title), walkAnim(w))),
    h('section', { class: 'blk' }, h('h3', {}, num(), c.archSteps ? c.archTitle : c.arch ? (c.pg ? 'Overall architecture and playground' : 'Overall architecture') : 'Playground'), c.arch ? (c.archSteps ? archAnim(c.arch, c.archSteps) : diagram(c.arch)) : null, c.archNote ? h('p', { class: 'archnote', html: c.archNote }) : null, c.pg ? pgbox : null),
    commonSection(c, num()),
    nav));
  if (c.pg) try { PG[c.pg](pgbox, API); } catch (e) { console.error(e); pgbox.append(h('div', { class: 'callout warn' }, 'Playground failed to load: ' + e.message)); }
  scrollTo(0, 0);
}
function route() {
  stopTimers();
  const m = /^#ch(\d+)$/.exec(location.hash);
  if (m && +m[1] < CHAPTERS.length) chapter(+m[1]); else overview();
}
addEventListener('hashchange', route);
route();
</script>
