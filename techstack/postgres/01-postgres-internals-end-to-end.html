{ ask: `An ORDER BY over 50 GB runs with only 64 MB of memory per operation. Does it fail, and what does it do instead?`,
  why: `Data is often larger than memory, and a fixed memory budget must still produce a correct answer.`,
  principle: `Break work into pieces that fit the budget, spill the pieces to disk and combine them.`,
  design: `External merge sort for ORDER BY and batched (partitioned) hash joins, both bounded by work_mem per plan node.`,
  scene: [
    `A nightly report sorts 400 MB of intermediate rows (illustrative) and joins them to a large table. The server runs with <code>work_mem = 4MB</code>, the default.`,
    `The report is slow, and the volume of temporary files in <code>pgsql_tmp</code> is large. A teammate suggests raising <code>work_mem</code> to 2 GB for the whole server. Another teammate warns that the last time someone did, the kernel killed the database.`
  ],
  predict: { q: `<code>work_mem = 4MB</code> and the sort input is 400 MB. What does <code>EXPLAIN (ANALYZE)</code> show for the Sort node?`,
    opts: [`An error: out of memory`, `<code>Sort Method: quicksort  Memory: 4096kB</code>`, `<code>Sort Method: external merge  Disk: ...kB</code>`, `Nothing: sorts never use disk`], ans: 2,
    why: `When the input exceeds <code>work_mem</code>, PostgreSQL sorts memory-sized runs, writes them to temporary files and merges them. The plan shows <code>external merge</code> with the disk size used. The query succeeds, only slower.` },
  idea: [
    `<b>work_mem</b> is the budget per sort or hash operation, not per query or per server. One query can have several such nodes, and each parallel worker gets its own budget.`,
    `<b>External merge sort</b>: sort runs that fit in memory, write them to temp files, then merge runs with a bounded fan-in, which may take extra passes.`,
    `<b>Hash join batches</b>: if the build side exceeds memory (<code>work_mem * hash_mem_multiplier</code>), both inputs are partitioned into batches on disk and joined one batch at a time.`,
    `<b>Temp files</b> are counted against <code>temp_file_limit</code> if set, and logged with <code>log_temp_files</code>.`,
    `<b>Total memory</b> is roughly work_mem times the number of memory-hungry nodes times concurrent sessions, so the safe global value is small.`
  ],
  arch: { w: 600, h: 220, cap: `Memory-sized runs go to disk and are merged. A hash join partitions both sides into batches the same way.`,
    boxes: [['in', 10, 80, 100, 56, 'Input rows\n400 MB', 0], ['mem', 160, 80, 130, 56, 'work_mem\nsort a run', 1], ['tmp', 340, 20, 130, 56, 'Temp files\nsorted runs', 2], ['mg', 340, 140, 130, 56, 'Merge\nfan-in k', 3], ['out', 500, 80, 90, 56, 'Output\nsorted', 4]],
    arrows: [['in', 'mem', 'fill'], ['mem', 'tmp', 'spill run'], ['tmp', 'mg', 'read'], ['mg', 'out', 'rows']] },

        note: `Check the kernel log to confirm it was the OOM killer. The docs recommend disabling memory overcommit on dedicated database hosts. ` + SRC(PGD + 'kernel-resources.html#LINUX-MEMORY-OVERCOMMIT', 'Linux memory overcommit') },

      fix: [`Measure first: compute connections times plan nodes times <code>work_mem</code>, and read <code>dmesg</code> for OOM entries.`, `Fix: keep global <code>work_mem</code> modest and raise it with <code>SET LOCAL</code> or <code>ALTER ROLE</code> for reporting roles only.`, `Fix: cap concurrency with a connection pooler so connection count is bounded.`, `Fix: on dedicated hosts consider <code>vm.overcommit_memory = 2</code> with a suitable ratio, as the docs describe.`, `Verify: no OOM kills under a peak-load test, and memory stays under the host limit.`] },
    { tab: `temp_file_limit`, t: `temporary file size exceeds temp_file_limit`, sym: `<b>Symptom:</b> a large report fails mid-way with <code>temporary file size exceeds temp_file_limit</code> although the data is correct.`,
      ctx: `An operator set <code>temp_file_limit = 1GB</code> to protect the disk (illustrative), and a report legitimately needs more.`,
      why: `The limit is a hard cap per process on the disk space of temporary files. A sort or hash that spills beyond it is cancelled, so the limit protects the disk but turns large spills into errors.`,
      log: { text: REP + `ERROR:  temporary file size exceeds temp_file_limit (1048576kB)\nSTATEMENT:  SELECT ... ORDER BY ...`,

  ] },

{ ask: `The WAL directory keeps growing and every five minutes write latency spikes. Why does PostgreSQL write checkpoints at all, and what do the knobs trade off?`,
  why: `Crash recovery would otherwise have to replay the log from the beginning of time.`,
  principle: `Bound recovery work by creating periodic known-good points, and spread their cost over time.`,
  design: `A checkpoint flushes all dirty buffers, records a redo point in WAL, and then lets older WAL be recycled, paced by checkpoint_completion_target.`,
  scene: [
    `A write-heavy orders cluster generates about 20 MB/s of WAL (illustrative). <code>pg_wal</code> has grown to many gigabytes, and every few minutes commit latency doubles for about a minute (illustrative).`,
    `The log shows <code>checkpoints are occurring too frequently</code> during peaks. A teammate wants to raise <code>checkpoint_timeout</code> to an hour and <code>max_wal_size</code> to 200 GB. Another asks what that does to recovery after a crash.`
  ],
  predict: { q: `Halving <code>checkpoint_timeout</code> makes crash recovery __ and total WAL volume __.`,
    opts: [`faster; smaller`, `faster; larger, because more full-page images are written`, `slower; smaller`, `slower; larger`], ans: 1,
    why: `More frequent checkpoints leave less WAL to replay, so recovery is faster. But after each checkpoint the first change to every page logs a full-page image again, so WAL volume and write amplification rise.` },
  idea: [
    `<b>Checkpoint</b>: flush every dirty buffer, then write a checkpoint record. The <b>redo point</b> is where recovery will start.`,
    `<b>Triggers</b>: <code>checkpoint_timeout</code> (default 5 min) or WAL growth approaching <code>max_wal_size</code>, whichever comes first.`,
    `<b>Pacing</b>: <code>checkpoint_completion_target</code> spreads the writes over that fraction of the interval (default 0.9) to avoid an I/O spike.`,
    `<b>WAL recycling</b>: segments older than the redo point (and not needed by slots or archiving) can be removed or reused.`,
    `<b>Full-page images</b> after each checkpoint add WAL, so shorter intervals mean more WAL.`
  ],
  arch: { w: 600, h: 220, cap: `Time or WAL volume triggers a checkpoint. The checkpointer paces its writes, then moves the redo point so old WAL can go.`,
    boxes: [['trg', 10, 80, 120, 56, 'Trigger\ntimeout or size', 0], ['cp', 170, 80, 130, 56, 'Checkpointer\npaced writes', 1], ['dirty', 340, 20, 130, 56, 'Dirty buffers\nflushed', 2], ['rec', 340, 140, 130, 56, 'Redo point\nin WAL', 3], ['old', 500, 140, 90, 56, 'Old WAL\nrecycled', 4]],
    arrows: [['trg', 'cp', 'start'], ['cp', 'dirty', 'write + fsync'], ['cp', 'rec', 'record'], ['rec', 'old', 'free']] },
  pg: 'checkpoint',
  common: [
    { tab: `Too frequent`, t: `Checkpoints are occurring too frequently`, sym: `<b>Symptom:</b> the log repeatedly warns about frequent checkpoints, and most checkpoints are requested rather than timed.`,
      ctx: `A bulk load writes 20 MB/s of WAL with <code>max_wal_size = 1GB</code> (illustrative).`,
      why: `The size trigger fires well before <code>checkpoint_timeout</code>. The server checkpoints every few dozen seconds, flushing data and re-logging full-page images again and again.`,
      log: { text: REP + `LOG:  checkpoints are occurring too frequently (24 seconds apart)\nHINT:  Consider increasing the configuration parameter "max_wal_size".\n\napp=> SELECT num_timed, num_requested FROM pg_stat_checkpointer;   -- PostgreSQL 17\n-- PostgreSQL 16: SELECT checkpoints_timed, checkpoints_req FROM pg_stat_bgwriter;`,
        note: `<code>pg_stat_checkpointer</code> is new in PostgreSQL 17; in 16 the counters are in <code>pg_stat_bgwriter</code>. ` + SRC(PGD + 'wal-configuration.html', 'WAL configuration') },
      viz: { bad: vz([['trigger', [['size, every 24 s', 'bad', 3]]], ['effect', [['constant flushing', 'bad'], ['many FPIs', 'warn']]]], [['requested share', 95, 'bad', '95% of checkpoints']], `The size limit, not the clock, drives checkpoints.`),
        good: vz([['trigger', [['timeout, every 15 min', 'ok', 3]]], ['effect', [['smooth flushing', 'ok'], ['fewer FPIs', 'ok']]]], [['requested share', 5, 'ok', '5% of checkpoints']], `The timeout drives checkpoints.`) },
      fix: [`Measure first: compare timed and requested checkpoint counters, and read <code>log_checkpoints</code> output (on by default from PostgreSQL 15).`, `Fix: raise <code>max_wal_size</code> so that it comfortably covers a <code>checkpoint_timeout</code> of WAL at peak rate.`, `Fix: size disk for the larger <code>pg_wal</code>. Trade-off: recovery may replay more WAL.`, `Verify: most checkpoints are timed and the warning disappears.`] },
    { tab: `I/O spike`, t: `A checkpoint I/O spike hurts latency`, sym: `<b>Symptom:</b> every checkpoint interval, disk write throughput and commit latency spike together.`,
      ctx: `An old tuning guide had set <code>checkpoint_completion_target = 0.1</code> (illustrative), so flushes happen in the first 10% of the interval.`,
      why: `A low completion target squeezes the same amount of dirty-page writes into a short window. The disk saturates, fsync calls stall and foreground commits wait behind them.`,
      log: { text: REP + `LOG:  checkpoint starting: time\nLOG:  checkpoint complete: wrote 412300 buffers (39.3%); 0 WAL file(s) added, 3 removed, 18 recycled; write=29.912 s, sync=2.140 s, total=32.3 s; sync files=98, longest=1.20 s, average=0.02 s; distance=1043000 kB, estimate=1043000 kB`,
        note: `Needs <code>log_checkpoints = on</code>. Compare <code>write=</code> time with the interval: a write phase of 30 s in a 5-minute interval is a spike. ` + SRC(PGD + 'runtime-config-wal.html#GUC-CHECKPOINT-COMPLETION-TARGET', 'WAL settings: checkpoint_completion_target') },
      viz: { bad: vz([['write phase', [['30 s burst', 'bad'], ['270 s idle', 'off', 4]]]], [['peak write rate', 100, 'bad', 'burst (illustrative)']], `All flushing happens at once.`),

      fix: [`Measure first: read the <code>write=</code> and <code>sync=</code> times and <code>total=</code> in <code>checkpoint complete</code> lines and line them up with latency graphs.`, `Fix: set <code>checkpoint_completion_target = 0.9</code> (the default since PostgreSQL 14).`, `Fix: leave <code>checkpoint_flush_after</code> at its default so the kernel writes back dirty data in small pieces instead of one large flush.`, `Verify: write throughput and commit latency stay flat over the interval.`] },
    { tab: `Slow recovery`, t: `A huge max_wal_size makes crash recovery take far too long`, sym: `<b>Symptom:</b> after a crash the database spends many minutes in recovery before it accepts connections.`,

/* ---------- ch10 ---------- */
{ ask: `Two transactions update the same two accounts in opposite order and one of them gets an error. Why does PostgreSQL kill a query that did nothing wrong?`,
  why: `Concurrent transactions can see or produce results no serial order could, and waiting can form a cycle that never ends.`,
  principle: `Name the anomalies each isolation level permits, and treat waiting as something that can fail.`,
  design: `Snapshot-based isolation levels with serialization failure detection (SSI), table and row lock modes, and a wait-for-graph deadlock detector that runs after deadlock_timeout.`,
  scene: [
    `A payments service moves money between accounts. Transfer A debits account 1 then credits account 2. Transfer B, running at the same time, does the opposite (illustrative: 40 such pairs per hour).`,
    `Sometimes a transfer fails with <code>ERROR: deadlock detected</code> after about one second. Elsewhere a nightly schema migration waits for a lock and, meanwhile, every new query on the table queues behind it.`
  ],
  predict: { q: `Under <code>REPEATABLE READ</code>, T1 updates a row and commits after T2's snapshot was taken. T2 then tries to update the same row. What does T2 get?`,
    opts: [`It silently overwrites T1's change`, `It waits, then sees the new value and proceeds`, `ERROR: could not serialize access due to concurrent update`, `A deadlock error`], ans: 2,
    why: `Repeatable Read uses one snapshot for the whole transaction. T2 cannot update a row version it could not see, and cannot silently follow it to a newer one, so it fails with SQLSTATE 40001. The application is expected to retry.` },
  idea: [
    `<b>Isolation levels</b>: Read Committed takes a new snapshot per statement; Repeatable Read one per transaction; Serializable adds <b>SSI</b> conflict detection on top of it.`,
    `<b>Anomalies</b>: lost update (overwriting a concurrent change), write skew (two transactions each read what the other writes), and unrepeatable reads at the weakest levels.`,
    `<b>Lock modes</b>: row locks conflict only between writers, while table locks like <code>ACCESS EXCLUSIVE</code> (taken by most <code>ALTER TABLE</code>) conflict with everything, including plain reads.`,
    `<b>Deadlock detection</b>: a session that waits longer than <code>deadlock_timeout</code> (default 1 s) checks the wait-for graph and aborts one transaction in a cycle with <code>40P01</code>.`,
    `<b>lock_timeout</b> bounds any lock wait, and fails the statement with <code>55P03</code>.`
  ],
  arch: { w: 600, h: 220, cap: `Two sessions holding one lock each and waiting for the other's: a cycle in the wait-for graph that only an abort can break.`,
    boxes: [['t1', 40, 20, 130, 56, 'Txn 1\nholds acct 1', 0], ['t2', 40, 140, 130, 56, 'Txn 2\nholds acct 2', 1], ['a1', 300, 20, 120, 56, 'Lock\nacct 1', 2], ['a2', 300, 140, 120, 56, 'Lock\nacct 2', 3], ['dd', 470, 80, 120, 56, 'Deadlock\ndetector', 4]],
    arrows: [['t1', 'a1', 'holds'], ['t2', 'a2', 'holds'], ['t1', 'a2', 'waits', true], ['t2', 'a1', 'waits', true], ['a1', 'dd', 'after timeout'], ['a2', 'dd', '']] },
  pg: 'isolation',
  common: [
    { tab: `Deadlock`, t: `ERROR: deadlock detected`, sym: `<b>Symptom:</b> some transfers fail with <code>deadlock detected</code> roughly one second after they began waiting.`,
      ctx: `Transfers lock accounts in the order they are debited, so opposite transfers lock in opposite order (illustrative).`,
      why: `Each transaction holds a lock the other needs. No one can proceed. After <code>deadlock_timeout</code> a waiter runs the detector, finds the cycle and aborts one transaction with SQLSTATE <code>40P01</code>.`,
      log: { text: REP + `ERROR:  deadlock detected\nDETAIL:  Process 8123 waits for ShareLock on transaction 4412; blocked by process 8140.\n         Process 8140 waits for ShareLock on transaction 4410; blocked by process 8123.\nHINT:  See server log for query details.\nCONTEXT:  while updating tuple (0,7) in relation "accounts"`,
        note: `The DETAIL lines spell out the cycle. The full queries are in the server log. ` + SRC(PGD + 'explicit-locking.html#LOCKING-DEADLOCKS', 'Explicit locking: deadlocks') },
      viz: { bad: vz([['Txn 1', [['lock acct 1', 'ok'], ['wait acct 2', 'bad']]], ['Txn 2', [['lock acct 2', 'ok'], ['wait acct 1', 'bad']]], ['outcome', [['abort one (40P01)', 'bad', 2]]]], [['transfers failing', 4, 'bad', '4% (illustrative)']], `Opposite order creates a cycle.`),
        good: vz([['Txn 1', [['lock acct 1', 'ok'], ['lock acct 2', 'ok']]], ['Txn 2', [['wait acct 1', 'warn'], ['then proceed', 'ok']]], ['outcome', [['no cycle', 'ok', 2]]]], [['transfers failing', 0, 'ok', '0%']], `A fixed order cannot form a cycle.`) },
      fix: [`Measure first: read the DETAIL and CONTEXT lines and the statements in the server log to find which two code paths collide.`, `Fix: lock rows in a consistent order, for example by ascending account id, <code>SELECT ... FROM accounts WHERE id IN (...) ORDER BY id FOR UPDATE</code>.`, `Fix: keep transactions short and retry on <code>40P01</code>.`, `Verify: deadlock counts in <code>pg_stat_database.deadlocks</code> stay flat.`] },
    { tab: `40001 retry`, t: `Serialization failure 40001 is not retried by the application`, sym: `<b>Symptom:</b> under Repeatable Read or Serializable a small share of requests fail with <code>could not serialize access</code> and the user sees an error.`,
      ctx: `The service moved to <code>SERIALIZABLE</code> to prevent write skew and did not add a retry loop (illustrative).`,
      why: `At these levels PostgreSQL aborts a transaction that could produce an anomaly, with SQLSTATE <code>40001</code>. This is not a bug: the docs state that applications must be ready to retry the whole transaction.`,
      log: { text: REP + `ERROR:  could not serialize access due to read/write dependencies among transactions\nDETAIL:  Reason code: Canceled on identification as a pivot, during commit attempt.\nHINT:  The transaction might succeed if retried.`,

      viz: { bad: vz([['request', [['txn', 'ok'], ['40001', 'bad'], ['error to user', 'bad', 2]]]], [['requests failed', 3, 'bad', '3% (illustrative)']], `A retryable failure becomes a user-visible error.`),

    { tab: `Lost update`, t: `Lost update under Read Committed from read-modify-write`, sym: `<b>Symptom:</b> two concurrent changes to a balance or stock count lead to one of them disappearing, with no error.`,

      why: `Both transactions read 100. One writes 150 and commits, the other writes 130 computed from its stale read. Read Committed lets the second UPDATE proceed after the first commits, and it simply stores the stale-based value.`,

        note: `No error is raised, which is why this is dangerous. ` + SRC(PGD + 'explicit-locking.html#LOCKING-ROWS', 'Explicit locking: row-level locks') },
      viz: { bad: vz([['balance', [['100', 'ok'], ['T1 writes 150', 'warn'], ['T2 writes 130', 'bad']]], ['result', [['final 130, expected 180', 'bad', 3]]]], [['updates lost', 50, 'bad', '1 of 2']], `Computed in the app from a stale read.`),
        good: vz([['balance', [['100', 'ok'], ['T1: +50', 'ok'], ['T2: +30 waits then applies', 'ok']]], ['result', [['final 180', 'ok', 3]]]], [['updates lost', 0, 'ok', 'none']], `The database applies each delta to the current row.`) },
      fix: [`Measure first: look for read-then-write patterns in the code, and test with two concurrent sessions.`, `Fix: use an atomic update, <code>UPDATE accounts SET balance = balance + 50 WHERE id = 1</code>.`, `Fix: if logic needs the value, lock the row first: <code>SELECT ... FOR UPDATE</code>.`, `Verify: a concurrency test ends with the expected total.`] },
    { tab: `DDL queue`, t: `An ALTER TABLE waiting for ACCESS EXCLUSIVE blocks every later query`, sym: `<b>Symptom:</b> a migration hangs, and soon all queries on the table, including plain SELECTs, wait.`,
      ctx: `A report runs a 10-minute SELECT while a deploy runs <code>ALTER TABLE orders ADD COLUMN ...</code> (illustrative).`,
      why: `The ALTER needs ACCESS EXCLUSIVE, so it waits for the running SELECT. While it waits in the lock queue, new queries that need any lock on the table queue behind it, so one slow reader becomes a full outage.`,
      log: { text: REP + `app=> SELECT pid, wait_event_type, wait_event, left(query, 36) FROM pg_stat_activity WHERE wait_event_type = 'Lock';\n  pid  | wait_event_type | wait_event | left\n-------+-----------------+------------+--------------------------------\n  9001 | Lock            | relation   | ALTER TABLE orders ADD COLUMN ...\n  9014 | Lock            | relation   | SELECT * FROM orders WHERE id = 7\n  9015 | Lock            | relation   | SELECT * FROM orders WHERE id = 8`,
        note: `Many sessions waiting on <code>relation</code> behind one DDL is the signature. ` + SRC(PGD + 'explicit-locking.html#LOCKING-TABLES', 'Explicit locking: table-level locks') },
      viz: { bad: vz([['long SELECT', [['running 10 min', 'warn', 3]]], ['ALTER', [['waits for lock', 'bad', 2]]], ['new queries', [['queue behind ALTER', 'bad', 3]]]], [['queries waiting', 80, 'bad', 'growing']], `The waiting ALTER blocks everything behind it.`),
        good: vz([['long SELECT', [['running 10 min', 'warn', 3]]], ['ALTER', [['lock_timeout 2s: gives up', 'ok', 2]]], ['new queries', [['keep running', 'ok', 3]]]], [['queries waiting', 0, 'ok', 'none']], `A short lock_timeout stops the pile-up.`) },
      fix: [`Measure first: list waiting sessions and run <code>pg_blocking_pids</code> to find the head of the queue.`, `Fix: run DDL with <code>SET lock_timeout = '2s'</code> and retry in a loop, so it never waits long.`, `Fix: also set <code>statement_timeout</code> on reports so they cannot run for hours.`, `Fix: prefer lock-light forms (for example adding a nullable column without a volatile default) and <code>CREATE INDEX CONCURRENTLY</code>.`, `Verify: migrations either finish or fail fast, and no queue forms.`] }
  ] },

/* ---------- ch11 ---------- */
{ ask: `The primary crashes and the team fails over, and two minutes of paid orders are missing. What does a COMMIT actually wait for?`,
  why: `A replica can only protect a commit that reached it before the primary died, so the commit rule sets what a failover can lose.`,
  principle: `Durability against a node failure requires the log to exist on a second node before the client is told it succeeded.`,
  design: `Streaming replication of WAL with per-commit acknowledgement levels (synchronous_commit) and a sync standby list (synchronous_standby_names).`,
  scene: [
    `An orders primary streams WAL to one standby in another zone (illustrative). The default <code>synchronous_commit = on</code> is in force, but <code>synchronous_standby_names</code> is empty, so replication is asynchronous.`,
    `The primary's host dies. The team promotes the standby. After the switch, support finds that the last two minutes (illustrative) of paid orders are not there, although customers saw confirmation pages.`
  ],
  predict: { q: `With <code>synchronous_commit = remote_apply</code> and the only synchronous standby down, what happens to new COMMITs on the primary?`,
    opts: [`They succeed: replication falls back to async automatically`, `They hang until a synchronous standby returns or the wait is cancelled`, `They fail immediately with an error`, `They succeed but are not durable`], ans: 1,
    why: `Once a synchronous standby is configured, commits wait for its acknowledgement, and PostgreSQL does not silently downgrade. Sessions sit in wait event <code>SyncRep</code> until a standby comes back or the setting changes. A quorum list such as <code>ANY 1 (s1, s2)</code> avoids a single point of stall.` },
  idea: [
    `<b>WAL sender and receiver</b>: the primary streams WAL records to each standby, which writes, flushes and replays them in order.`,
    `<b>Commit levels</b>: <code>local</code> waits for the primary's flush only, <code>remote_write</code> for the standby's OS write, <code>on</code> for the standby's flush, <code>remote_apply</code> for replay so reads on the standby see the commit. <code>off</code> does not wait for any flush.`,
    `<b>synchronous_standby_names</b>: which standbys count, as a priority list (<code>FIRST n</code>) or quorum (<code>ANY n</code>). Empty means asynchronous.`,
    `<b>Replication slots</b>: the primary keeps WAL a consumer has not received, which protects the consumer and can fill <code>pg_wal</code>. <code>max_slot_wal_keep_size</code> caps it.`,
    `<b>Hot standby conflicts</b>: replay may need to remove rows a standby query still reads. The query is cancelled after <code>max_standby_streaming_delay</code> unless <code>hot_standby_feedback</code> holds cleanup back.`
  ],
  arch: { w: 600, h: 220, cap: `The COMMIT waits at the stage the chosen level names. A longer wait gives stronger protection and higher latency.`,

    arrows: [['pr', 'ws', 'WAL'], ['ws', 'wr', ''], ['ws', 'fl', ''], ['ws', 'ap', ''], ['ws', 'sl', 'retain', true]] },
  pg: 'replication',
  common: [
    { tab: `Inactive slot`, t: `An inactive replication slot fills pg_wal and the disk`, sym: `<b>Symptom:</b> the WAL directory grows by gigabytes per hour until the disk is full and the primary stops.`,

        note: `<code>wal_status</code> moves from <code>reserved</code> to <code>extended</code>, then <code>unreserved</code> and <code>lost</code> when <code>max_slot_wal_keep_size</code> is set and exceeded. ` + SRC(PGD + 'runtime-config-replication.html#GUC-MAX-SLOT-WAL-KEEP-SIZE', 'Replication: max_slot_wal_keep_size') },
      viz: { bad: vz([['slot', [['inactive', 'bad'], ['keeps all WAL', 'bad', 2]]], ['pg_wal', [['grows 90 GB/h', 'bad', 3]]]], [['disk used', 98, 'bad', '98%']], `No limit on retained WAL.`),
        good: vz([['slot', [['capped by max_slot_wal_keep_size', 'ok', 3]]], ['pg_wal', [['bounded at 50 GB', 'ok', 3]]]], [['disk used', 40, 'ok', '40%']], `A cap trades the slot for the disk.`) },
      fix: [`Measure first: check <code>active</code>, <code>wal_status</code> and the retained size of every slot, and the size of <code>pg_wal</code>.`, `Fix: drop slots you no longer need with <code>pg_drop_replication_slot('name')</code>.`, `Fix: set <code>max_slot_wal_keep_size</code>. Trade-off: a consumer that falls behind that limit loses its slot and must be rebuilt.`, `Fix: alert on slot lag and on <code>pg_wal</code> size.`, `Verify: <code>pg_wal</code> stays within budget during an intentional standby outage.`] },
    { tab: `Sync standby down`, t: `The synchronous standby is down and every commit hangs`, sym: `<b>Symptom:</b> all writes stall at once. <code>pg_stat_activity</code> shows sessions waiting on <code>SyncRep</code>.`,
      ctx: `The cluster has <code>synchronous_standby_names = 's1'</code> with a single standby, and that standby's host fails (illustrative).`,
      why: `With a synchronous standby configured, commit waits for its acknowledgement. With only one candidate there is nothing to fall back to, so the primary stalls rather than lose the guarantee.`,
      log: { text: REP + `app=> SELECT pid, wait_event_type, wait_event, state FROM pg_stat_activity WHERE wait_event = 'SyncRep';\n  pid  | wait_event_type | wait_event | state\n-------+-----------------+------------+--------\n  7001 | IPC             | SyncRep    | active\n  7002 | IPC             | SyncRep    | active`,
        note: `A cancelled wait logs <code>canceling the wait for synchronous replication</code> and the commit is not rolled back. ` + SRC(PGD + 'warm-standby.html#SYNCHRONOUS-REPLICATION', 'Synchronous replication') },
      viz: { bad: vz([['primary', [['COMMIT', 'ok'], ['wait for s1', 'bad', 2]]], ['standby s1', [['down', 'bad', 3]]]], [['writes served', 0, 'bad', 'stalled']], `Exactly one candidate, and it is gone.`),
        good: vz([['primary', [['COMMIT', 'ok'], ['ack from any 1 of 2', 'ok', 2]]], ['standbys', [['s1 down', 'warn'], ['s2 up', 'ok', 2]]]], [['writes served', 100, 'ok', 'normal']], `A quorum survives one failure.`) },
      fix: [`Measure first: count sessions with wait event <code>SyncRep</code> and check <code>pg_stat_replication</code> for connected standbys.`, `Fix: configure a quorum such as <code>synchronous_standby_names = 'ANY 1 (s1, s2)'</code> with at least one spare standby.`, `Fix: in an emergency, clear <code>synchronous_standby_names</code> and reload, accepting the loss of the guarantee knowingly.`, `Verify: stop one standby in a test and confirm commits keep flowing.`] },
    { tab: `Recovery conflict`, t: `canceling statement due to conflict with recovery on a standby`, sym: `<b>Symptom:</b> long reports on a hot standby randomly fail with a conflict error.`,
      ctx: `Reports run for 10 minutes on a standby, while the primary vacuums an updated table (illustrative).`,
      why: `Vacuum on the primary removes old row versions, and the standby must replay that. If the report still needs those rows, replay waits until <code>max_standby_streaming_delay</code> (default 30 s) and then cancels the query.`,
      log: { text: REP + `ERROR:  canceling statement due to conflict with recovery\nDETAIL:  User query might have needed to see row versions that must be removed.`,
        note: `<code>pg_stat_database_conflicts</code> counts these per cause. ` + SRC(PGD + 'hot-standby.html#HOT-STANDBY-CONFLICT', 'Hot standby: handling query conflicts') },
      viz: { bad: vz([['standby query', [['running 10 min', 'warn', 3]]], ['replay', [['needs cleanup', 'bad', 2], ['waits 30 s', 'warn']]], ['result', [['query cancelled', 'bad', 2]]]], [['reports cancelled', 30, 'bad', '30% (illustrative)']], `Replay wins after the delay.`),
        good: vz([['standby query', [['running 10 min', 'warn', 3]]], ['replay', [['cleanup held back', 'ok', 2]]], ['result', [['query completes', 'ok', 2]]]], [['reports cancelled', 0, 'ok', '0%']], `Feedback or delay keeps the rows.`) },
      fix: [`Measure first: read <code>pg_stat_database_conflicts</code> on the standby to see which conflict type dominates.`, `Fix: set <code>hot_standby_feedback = on</code> so the primary keeps rows the standby needs. Trade-off: bloat on the primary from long standby queries.`, `Fix: or raise <code>max_standby_streaming_delay</code> on a dedicated reporting standby. Trade-off: replay lag grows.`, `Verify: conflict counts fall and replay lag stays acceptable.`] },
    { tab: `Async loss`, t: `An asynchronous failover loses acknowledged commits`, sym: `<b>Symptom:</b> after promoting a standby, the newest committed transactions are missing and clients saw success for them.`,
      ctx: `Streaming replication is asynchronous with a few seconds of lag at peak (illustrative).`,
      why: `With async replication the commit returns after the primary's own flush. WAL not yet received by the standby when the primary dies never reaches the new primary, so those commits vanish.`,
      log: { text: REP + `app=> SELECT application_name, state, sync_state, write_lag, flush_lag, replay_lag FROM pg_stat_replication;\n application_name | state     | sync_state | write_lag | flush_lag | replay_lag\n------------------+-----------+------------+-----------+-----------+------------\n standby_a        | streaming | async      | 00:00:00.9| 00:00:01.4| 00:00:02.1`,
        note: `Lag columns estimate how far behind the standby is. In async mode that gap is the data at risk. ` + SRC(PGD + 'warm-standby.html#SYNCHRONOUS-REPLICATION', 'Synchronous replication') },
      viz: { bad: vz([['primary', [['commit 1-50', 'ok', 3], ['commit 51-60', 'warn']]], ['standby has', [['1-50', 'ok', 3], ['missing 51-60', 'bad']]]], [['acknowledged commits lost', 17, 'bad', '10 commits (illustrative)']], `The unreplicated tail is lost.`),
        good: vz([['primary', [['commit 1-60', 'ok', 4]]], ['standby has', [['1-60 (acked first)', 'ok', 4]]]], [['acknowledged commits lost', 0, 'ok', '0']], `The ack waited for the standby.`) },
      fix: [`Measure first: record <code>flush_lag</code> and <code>sent_lsn - write_lsn</code> in <code>pg_stat_replication</code> over time to know the data at risk.`, `Fix: for critical writes use synchronous replication, with <code>synchronous_commit = on</code> (or <code>remote_write</code>) and a quorum of standbys.`, `Fix: or keep async and accept an explicit recovery point objective, writing it down.`, `Verify: a failover test with a write load shows no acknowledged commit missing.`] }

<script>
/* architecture: one request walks through the boxes; the strip shows the 4 buffer frames */
function archAnim(sp, steps) {
  const B = {};
  sp.boxes.forEach(b => { B[b[0]] = b; });
  const ctr = id => [B[id][1] + B[id][3] / 2, B[id][2] + B[id][4] / 2];
  const edge = (f, t) => {
    const a = B[f], b = B[t], cx = a[1] + a[3] / 2, cy = a[2] + a[4] / 2;
    const dx = b[1] + b[3] / 2 - cx, dy = b[2] + b[4] / 2 - cy;
    const k = Math.min(dx ? (a[3] / 2) / Math.abs(dx) : 1e9, dy ? (a[4] / 2) / Math.abs(dy) : 1e9);
    return [cx + dx * k, cy + dy * k];
  };
  const arrowEls = sp.arrows.map(([f, t, lab, dash]) => {
    const p1 = edge(f, t), p2 = edge(t, f), mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;

      lines.map((ln, i) => svg('text', { class: i ? 'ar-sub' : 'ar-title', x: x + w / 2, y: y + hh / 2 + (i - (lines.length - 1) / 2) * 16 + 4, 'text-anchor': 'middle' }, ln)));
  });
  const dot = svg('circle', { class: 'ar-dot', r: 7, cx: 0, cy: 0, opacity: 0 });
  const picture = svg('svg', { viewBox: `0 0 ${sp.w} ${sp.h}`, role: 'img', 'aria-label': sp.cap, style: 'width:100%;max-width:500px;margin:0 auto;height:auto;display:block' },
    svg('defs', {}, svg('marker', { id: 'arah', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, svg('path', { d: 'M0 0L10 5L0 10z', fill: 'currentColor' }))),
    arrowEls, boxEls, dot);
  let mode = steps.modes[0].v, k = 0, tok = 0;

    arrowEls.forEach((el, i) => el.classList.toggle('on', !!cur && cur.arrows.includes(i)));

/* ================= PostgreSQL playgrounds (all deterministic, no network) ================= */
const pgxN = n => (n >= 1e6 ? (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + ' M' : n >= 1e3 ? Math.round(n / 1e3) + ' k' : String(Math.round(n)));
const pgxPresets = (reproduce, fix) => A_bar_presets(reproduce, fix);
function A_bar_presets(reproduce, fix) {
  return [btn('Reproduce the incident', reproduce, 'primary'), btn('Apply the fix', fix)];
}

/* ---- ch0 · query path ---- */
PG.querypath = function (root, A) {
  const { h, seg, bar, stat, note, badge, logbox } = A;
  const CAT = { 'public.orders': ['id', 'user_id', 'amount', 'status'], 'app.orders': ['id', 'user_id', 'amount', 'status', 'coupon'], 'app.users': ['id', 'email'] };
  let kw = 'SELECT', sp = 'app', prep = 'plain', alter = 'no';
  const tbl = h('input', { class: 'pgx-in', value: 'orders', 'aria-label': 'table name' });
  const col = h('input', { class: 'pgx-in', value: 'customer_id', 'aria-label': 'column name' });
  const stages = h('div', { class: 'pgx-stages', 'aria-live': 'polite' });
  const sqlBox = h('div', { class: 'pgx-code' });
  const out = stat([]), log = logbox();
  const ST = ['parse', 'analyze', 'rewrite', 'plan', 'execute'];
  const presets = seg([{ v: 'ok', l: 'Valid query' }, { v: 'typo', l: 'Typo in keyword' }, { v: 'col', l: 'Unknown column' }, { v: 'tab', l: 'Unknown table' }], '', v => {
    kw = v === 'typo' ? 'SELEC' : 'SELECT'; tbl.value = v === 'tab' ? 'ordres' : 'orders'; col.value = v === 'col' ? 'nope' : 'user_id'; run();
  });
  const path = seg([{ v: 'app', l: 'app, public' }, { v: 'pub', l: 'public, app' }], sp, v => { sp = v; run(); });
  const mode = seg([{ v: 'plain', l: 'Plain query' }, { v: 'prepared', l: 'PREPARE + EXECUTE' }], prep, v => { prep = v; run(); });
  const alt = seg([{ v: 'no', l: 'Schema unchanged' }, { v: 'yes', l: 'ALTER TABLE ADD COLUMN since PREPARE' }], alter, v => { alter = v; run(); });
  tbl.addEventListener('input', () => { presets.set(''); run(); });
  col.addEventListener('input', () => { presets.set(''); run(); });
  function run() {
    const c = col.value.trim(), t = tbl.value.trim();
    const sql = `${kw} ${c} FROM ${t} WHERE id = 42;`;
    let fail = -1, code = '00000', msg = '', rel = '-';
    if (kw !== 'SELECT') { fail = 0; code = '42601'; msg = `syntax error at or near "${kw}"`; }
    else {
      const order = t.includes('.') ? [t] : (sp === 'app' ? ['app.' + t, 'public.' + t] : ['public.' + t, 'app.' + t]);
      const key = order.find(k => CAT[k]);
      if (!key) { fail = 1; code = '42P01'; msg = `relation "${t}" does not exist`; }
      else {
        rel = key; const cols = CAT[key];
        if (c !== '*' && !cols.includes(c)) { fail = 1; code = '42703'; msg = `column "${c}" does not exist`; }
        else if (prep === 'prepared' && alter === 'yes' && c === '*') { fail = 1; code = '0A000'; msg = 'cached plan must not change result type'; }
      }
    }
    sqlBox.textContent = sql;
    stages.replaceChildren(...ST.flatMap((s, i) => [i ? h('span', { class: 'arr' }, '→') : null, badge(s, fail === -1 ? 'ok' : i < fail ? 'ok' : i === fail ? 'bad' : '')]));
    const pages = fail === -1 ? 3 : 0;
    out.update([{ l: 'stage reached', v: fail === -1 ? 'execute' : ST[fail], cls: fail === -1 ? 'ok' : 'bad' }, { l: 'SQLSTATE', v: code, cls: fail === -1 ? 'ok' : 'bad' }, { l: 'data pages read', v: pages, cls: pages ? '' : 'ok' }, { l: 'resolved relation', v: rel }]);
    log.clear();
    log.add('> ' + sql, 'mut');
    if (fail === -1) log.add(`OK: ${pages} pages read (illustrative), 1 row`, 'ok');
    else {
      log.add(`ERROR:  ${msg}`, 'bad');
      if (fail === 1 && code !== '0A000') log.add(`LINE 1: ${sql}`, 'mut');
      if (code === '0A000') log.add('-- raised while revalidating the cached plan at EXECUTE', 'mut');
      log.add('-- executor never started: 0 data pages read', 'mut');
    }
  }
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: every pre-execution failure reads 0 data pages, and each kind of error is raised by a different stage.'),
    bar(presets),
    bar(h('label', {}, 'table ', tbl), h('label', {}, 'column ', col), path),
    bar(mode, alt),
    bar(...pgxPresets(() => { presets.set(''); kw = 'SELECT'; tbl.value = 'orders'; col.value = 'customer_id'; path.set('app'); sp = 'app'; mode.set('plain'); prep = 'plain'; run(); },
      () => { presets.set('ok'); kw = 'SELECT'; tbl.value = 'app.orders'; col.value = 'user_id'; run(); })),
    sqlBox, stages, out, log.el,
    note('Illustrative model: a three-table catalog, no real parser. Tip: set the column to * with PREPARE and the ALTER toggle to see the cached-plan error.')));
  run();
};

/* ---- ch1 · buffer pool ---- */
PG.buffers = function (root, A) {
  const { h, seg, slider, stat, bar, note, rng } = A;
  let work = 'scan', ring = 'off', cols = 'star';
  const poolS = slider('shared_buffers (pages)', 16, 160, 64, 8, () => run());
  const wS = seg([{ v: 'hot', l: 'Hot set only' }, { v: 'scan', l: 'Hot set + bulk scan' }, { v: 'wide', l: 'Wide rows (TOAST)' }], work, v => { work = v; run(); });
  const rS = seg([{ v: 'off', l: 'Ring buffer off' }, { v: 'on', l: 'Ring buffer on' }], ring, v => { ring = v; run(); });
  const cS = seg([{ v: 'star', l: 'SELECT *' }, { v: 'need', l: 'Needed columns only' }], cols, v => { cols = v; run(); });
  const out = stat([]), cells = h('div', { class: 'pgx-cells', role: 'img', 'aria-label': 'Contents of the buffer pool after the workload' });
  function run() {
    const N = poolS.value, r = rng(7), HOT = 40, SCAN = 300, TOAST = 160;
    const slots = Array.from({ length: N }, () => ({ p: -1, u: 0 })), where = new Map();
    let hand = 0, lh = 0, lr = 0, readsTotal = 0, evHot = 0, toastN = 0;
    const victim = () => { for (;;) { const i = hand; hand = (hand + 1) % N; const s = slots[i]; if (s.p < 0 || s.u === 0) return i; s.u--; } };
    const touch = (p, scanPhase) => {
      if (where.has(p)) { const s = slots[where.get(p)]; s.u = Math.min(5, s.u + 1); return true; }
      const v = victim(), old = slots[v].p;
      if (old >= 0) { where.delete(old); if (old < HOT && scanPhase) evHot++; }
      slots[v] = { p, u: 1 }; where.set(p, v); return false;
    };
    const lookup = count => {
      const wide = work === 'wide' && cols === 'star', pages = [Math.floor(r() * HOT)];
      if (wide) for (let k = 0; k < 3; k++) pages.push(1000 + Math.floor(r() * TOAST));
      pages.forEach((p, k) => { const hit = touch(p, false); if (count) { if (hit) lh++; else { lr++; readsTotal++; } if (k) toastN++; } });
    };
    for (let i = 0; i < 250; i++) lookup(false);
    if (work === 'scan') for (let i = 0; i < SCAN; i++) {
      readsTotal++;
      if (ring === 'on' && SCAN > N / 4) continue;
      touch(5000 + i, true);
    }
    for (let i = 0; i < 300; i++) lookup(true);
    const ratio = Math.round(100 * lh / Math.max(1, lh + lr));
    out.update([{ l: 'hit ratio (lookups)', v: ratio + '%', cls: ratio >= 90 ? 'ok' : 'bad' }, { l: 'shared read blocks', v: readsTotal, cls: readsTotal > 400 ? 'bad' : 'ok' }, { l: 'TOAST chunks fetched', v: toastN, cls: toastN ? 'bad' : 'ok' }, { l: 'hot pages evicted by scan', v: evHot, cls: evHot ? 'bad' : 'ok' }]);
    cells.replaceChildren(...slots.map(s => h('i', { class: s.p < 0 ? '' : s.p < HOT ? 'hot' : s.p >= 5000 ? 'cold' : 'toast', title: s.p < 0 ? 'empty' : 'page ' + s.p + ', usage ' + s.u })));
  }
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: a big sequential scan only wrecks the cache if it can use the whole pool, and unneeded wide columns pollute it too.'),
    bar(poolS, wS), bar(rS, cS),
    bar(...pgxPresets(() => { poolS.value = 64; work = 'scan'; wS.set('scan'); ring = 'off'; rS.set('off'); cols = 'star'; cS.set('star'); run(); },
      () => { ring = 'on'; rS.set('on'); cols = 'need'; cS.set('need'); run(); })),
    out, cells,
    note('Illustrative model: 40 hot pages, a 300-page scan, 160 TOAST pages, clock sweep with usage counts capped at 5, a fixed 32-page ring used only when the scan exceeds a quarter of the pool. Blue = hot rows, orange = scan pages, pink = TOAST pages.')));
  run();
};

/* ---- ch2 · iterator execution ---- */
PG.executor = function (root, A) {
  const { h, seg, slider, stat, bar, btn, note, player } = A;
  let node = 'Sort', filt = 'off', lim = 'on', cap = 0;
  const rowsS = slider('table rows', 1000, 100000, 10000, 1000, () => { cap = 0; run(); }, pgxN);
  const limS = slider('LIMIT n', 1, 100, 5, 1, () => { cap = 0; run(); });
  const nS = seg([{ v: 'none', l: 'No blocking node' }, { v: 'Sort', l: 'Sort' }, { v: 'HashAgg', l: 'HashAggregate (50 groups)' }], node, v => { node = v; cap = 0; run(); });
  const fS = seg([{ v: 'off', l: 'No filter' }, { v: 'on', l: 'Filter keeps 1 of 4' }], filt, v => { filt = v; cap = 0; run(); });
  const lS = seg([{ v: 'on', l: 'LIMIT' }, { v: 'off', l: 'No LIMIT' }], lim, v => { lim = v; cap = 0; run(); });
  const out = stat([]), plan = h('div', { class: 'pgx-code' });
  function sim(c) {
    const rows = rowsS.value, L = lim === 'on' ? limS.value : Infinity;
    let scan = 0, passed = 0, held = 0, emit = 0, done = false, peak = 0;
    for (let i = 0; i < rows; i++) {
      if (scan >= c) break;
      scan++;
      if (filt === 'on' && i % 4 !== 0) continue;
      passed++;
      if (node === 'Sort') held = Math.min(held + 1, L);
      else if (node === 'HashAgg') held = Math.min(passed, 50);
      else { emit++; if (emit >= L) { done = true; break; } }
      peak = Math.max(peak, held);
    }
    if (!done && scan >= rows) { done = true; if (node === 'Sort') emit = Math.min(L, passed); else if (node === 'HashAgg') emit = Math.min(L, held); }
    return { scan, passed, peak, emit, done };
  }
  function run() {
    const s = sim(cap), rows = rowsS.value;
    const chain = ['Limit', node === 'Sort' ? 'Sort' : node === 'HashAgg' ? 'HashAggregate' : null, filt === 'on' ? 'Filter' : null, 'Seq Scan'].filter(Boolean);
    if (lim === 'off') chain.shift();
    plan.textContent = chain.join('  →  ') + '    (client pulls from the left)';
    out.update([{ l: 'rows pulled from scan', v: pgxN(s.scan), cls: s.scan >= rows ? 'bad' : 'ok' }, { l: 'peak rows held', v: s.peak, cls: s.peak > 1000 ? 'bad' : 'ok' }, { l: 'rows returned', v: s.emit }, { l: 'pages read (100 rows/page)', v: pgxN(Math.ceil(s.scan / 100)) }, { l: 'state', v: s.done ? 'finished' : cap ? 'blocked on input' : 'not started' }]);
    return s;
  }
  const pl = player({ speed: 700, step() { cap = cap ? cap * 2 : 1; const s = run(); return !s.done; }, reset() { cap = 0; run(); } });
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: LIMIT stops the scan only when no blocking node sits between them.'),
    bar(nS, fS), bar(rowsS, limS, lS),
    bar(...pgxPresets(() => { node = 'Sort'; nS.set('Sort'); lim = 'on'; lS.set('on'); rowsS.value = 10000; limS.value = 5; pl.stop(); cap = rowsS.value; run(); },
      () => { node = 'none'; nS.set('none'); lim = 'on'; lS.set('on'); pl.stop(); cap = rowsS.value; run(); }), btn('Run to end', () => { pl.stop(); cap = rowsS.value; run(); })),
    pl, plan, out,
    note('Illustrative model: Play doubles the number of rows pulled each tick. "No blocking node" stands for an index scan that already delivers rows in order. Peak rows held for Sort assumes top-N heapsort when LIMIT is present.')));
  run();
};

/* ---- ch3 · b-tree ---- */
PG.btree = function (root, A) {
  const { h, seg, slider, stat, bar, note, rng } = A;
  let pattern = 'random';
  const nS = slider('inserts', 200, 6000, 3000, 200, () => run());
  const fS = slider('page capacity (entries)', 8, 64, 32, 4, () => run());
  const rS = slider('range scan (rows)', 1, 2000, 100, 1, () => run());
  const pS = seg([{ v: 'seq', l: 'Sequential' }, { v: 'random', l: 'Random (UUIDv4-like)' }, { v: 'dup', l: 'Many duplicates' }], pattern, v => { pattern = v; run(); });
  const out = stat([]);
  function build(F, n, r) {
    let root0 = { leaf: true, keys: [], next: null }, splits = 0, height = 1;
    const keys = [];
    for (let i = 0; i < n; i++) keys.push(i);
    if (pattern === 'random') for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [keys[i], keys[j]] = [keys[j], keys[i]]; }
    if (pattern === 'dup') for (let i = 0; i < n; i++) keys[i] = Math.floor(r() * 100);
    const child = (nd, k) => { let i = 0; while (i < nd.keys.length && nd.keys[i] <= k) i++; return i; };
    function ins(nd, k) {
      if (nd.leaf) {
        let i = 0; while (i < nd.keys.length && nd.keys[i] <= k) i++;
        const atEnd = i === nd.keys.length;
        nd.keys.splice(i, 0, k);
        if (nd.keys.length <= F) return null;
        const mid = nd.next === null && atEnd ? Math.floor(F * 0.9) : Math.floor((F + 1) / 2);
        const right = { leaf: true, keys: nd.keys.splice(mid), next: nd.next };
        nd.next = right; splits++;
        return { sep: right.keys[0], right };
      }
      const ci = child(nd, k), res = ins(nd.kids[ci], k);
      if (!res) return null;
      nd.keys.splice(ci, 0, res.sep); nd.kids.splice(ci + 1, 0, res.right);
      if (nd.kids.length <= F) return null;
      const m = Math.floor(nd.keys.length / 2), sep = nd.keys[m];
      const right = { leaf: false, keys: nd.keys.splice(m + 1), kids: nd.kids.splice(m + 1) };
      nd.keys.pop(); splits++;
      return { sep, right };
    }
    for (const k of keys) {
      const res = ins(root0, k);
      if (res) { root0 = { leaf: false, keys: [res.sep], kids: [root0, res.right] }; height++; }
    }
    return { root: root0, splits, height, child };
  }
  function run() {
    const F = fS.value, n = nS.value, t = build(F, n, rng(11));
    let nd = t.root, leaves = 0, entries = 0;
    const mid = pattern === 'dup' ? 50 : Math.floor(n / 2);
    while (!nd.leaf) nd = nd.kids[t.child(nd, mid)];
    let walk = nd, got = 0, spanned = 0;
    while (walk && got < rS.value) { got += walk.keys.length; spanned++; walk = walk.next; }
    let first = t.root; while (!first.leaf) first = first.kids[0];
    for (let l = first; l; l = l.next) { leaves++; entries += l.keys.length; }
    const fill = Math.round(100 * entries / (leaves * F));
    const pages = t.height + Math.max(0, spanned - 1);
    out.update([{ l: 'tree height', v: t.height }, { l: 'page splits', v: t.splits, cls: t.splits > n / F * 1.5 ? 'bad' : 'ok' }, { l: 'pages read for the range', v: pages }, { l: 'leaf fill', v: fill + '%', cls: fill >= 80 ? 'ok' : 'bad' }, { l: 'leaf pages', v: leaves }]);
  }
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: random keys cause more splits and emptier leaves than sequential keys, while lookups stay a few pages either way.'),
    bar(pS), bar(nS, fS, rS),
    bar(...pgxPresets(() => { pattern = 'random'; pS.set('random'); nS.value = 3000; fS.value = 32; run(); }, () => { pattern = 'seq'; pS.set('seq'); run(); })),
    out,
    note('Illustrative model: a real B+tree insert with a fixed number of entries per page. Sequential inserts split the rightmost leaf at 90% full (like the default leaf fillfactor); other splits are 50/50. Deduplication and page headers are not modelled.')));
  run();
};

/* ---- ch4 · MVCC ---- */
PG.mvcc = function (root, A) {
  const { h, seg, bar, stat, note, player } = A;
  let scen = 'writers-long', iso = 'RC';
  const SC = {
    'reader': { title: 'Reader vs writer', forceB: null, steps: [['B', 'BEGIN'], ['A', 'BEGIN'], ['A', 'UPDATE', 'paid'], ['B', 'SELECT'], ['A', 'COMMIT'], ['B', 'SELECT'], ['B', 'COMMIT']] },
    'writers-long': { title: 'Writer vs writer (long transaction)', steps: [['A', 'BEGIN'], ['A', 'UPDATE', 'paid'], ['A', 'NOTE', 'calls the payment API for 4 minutes (illustrative)'], ['B', 'BEGIN'], ['B', 'UPDATE', 'refunded'], ['A', 'COMMIT'], ['B', 'COMMIT']] },
    'writers-short': { title: 'Writer vs writer (short transaction)', steps: [['A', 'BEGIN'], ['A', 'UPDATE', 'paid'], ['A', 'COMMIT'], ['B', 'BEGIN'], ['B', 'UPDATE', 'refunded'], ['B', 'COMMIT']] },
    'iud': { title: 'Update, delete and vacuum with an old reader', forceB: 'RR', steps: [['B', 'BEGIN'], ['B', 'SELECT'], ['A', 'UPDATE', 'paid'], ['A', 'DELETE'], ['B', 'SELECT'], ['A', 'VACUUM'], ['B', 'COMMIT'], ['A', 'VACUUM']] }
  };
  const sS = seg(Object.keys(SC).map(k => ({ v: k, l: SC[k].title })), scen, v => { scen = v; reset(); });
  const iS = seg([{ v: 'RC', l: 'READ COMMITTED' }, { v: 'RR', l: 'REPEATABLE READ' }], iso, v => { iso = v; reset(); });
  const out = stat([]), vers = h('div', { class: 'pgx-ver', 'aria-live': 'polite' });
  const lanes = { A: h('div', {}, h('h5', {}, 'Session A (checkout)')), B: h('div', {}, h('h5', {}, 'Session B (report / second writer)')) };
  const ses = h('div', { class: 'pgx-ses' }, lanes.A, lanes.B);
  let S, k;
  function reset() {
    S = { next: 100, clog: { 90: 'committed' }, versions: [{ xmin: 90, xmax: 0, val: 'pending' }], tx: { A: { xid: 0, inTx: false, snap: null, iso: 'RC' }, B: { xid: 0, inTx: false, snap: null, iso: SC[scen].forceB || iso } }, waits: 0, err: '—', bSees: '—', pending: null, removed: 0 };
    k = 0;
    for (const w of ['A', 'B']) lanes[w].replaceChildren(h('h5', {}, w === 'A' ? 'Session A (checkout)' : 'Session B (report / second writer)'));
    paint();
  }
  const committed = () => new Set(Object.keys(S.clog).filter(x => S.clog[x] === 'committed').map(Number));
  function say(w, text, cls) { lanes[w].append(h('p', { class: cls || '' }, text)); }
  function seen(t, x) { return x && (x === t.xid || (S.clog[x] === 'committed' && t.snap.has(x))); }
  const visible = (v, t) => seen(t, v.xmin) && !(v.xmax && seen(t, v.xmax));
  function ensureSnap(t) { if (!t.inTx || t.iso === 'RC' || !t.snap) t.snap = committed(); }
  function xid(t) { if (!t.xid) { t.xid = S.next++; S.clog[t.xid] = 'running'; } return t.xid; }
  function finish(w, how) {
    const t = S.tx[w];
    if (t.xid) S.clog[t.xid] = how;
    t.xid = 0; t.inTx = false; t.snap = null;
    // wake a blocked session
    if (S.pending && S.pending.on === w) { const p = S.pending; S.pending = null; exec(p.w, p.op, p.arg, true); }
  }
  function exec(w, op, arg, resumed) {
    const t = S.tx[w], auto = !t.inTx;
    if (op === 'BEGIN') { t.inTx = true; t.snap = null; say(w, `BEGIN ISOLATION LEVEL ${t.iso === 'RR' ? 'REPEATABLE READ' : 'READ COMMITTED'}`); return; }
    if (op === 'NOTE') { say(w, '-- ' + arg, 'wait'); return; }
    if (op === 'COMMIT') { say(w, 'COMMIT', 'okk'); finish(w, 'committed'); return; }
    if (op === 'ROLLBACK') { say(w, 'ROLLBACK'); finish(w, 'aborted'); return; }
    if (op === 'VACUUM') {
      const before = S.versions.length;
      S.versions = S.versions.filter(v => {
        const dead = v.xmax && S.clog[v.xmax] === 'committed' && ['A', 'B'].every(x => { const y = S.tx[x]; return !y.inTx || (y.snap && y.snap.has(v.xmax)); });
        return !dead;
      });
      const rm = before - S.versions.length; S.removed += rm;
      say(w, `VACUUM -> removed ${rm} dead version(s), ${S.versions.filter(v => v.xmax && S.clog[v.xmax] === 'committed').length} dead but not yet removable`, rm ? 'okk' : 'wait');
      return;
    }
    ensureSnap(t);
    const cur = S.versions.find(v => visible(v, t));
    if (op === 'SELECT') {
      const val = cur ? cur.val : '(no row)';
      say(w, `SELECT status FROM orders WHERE id = 7  ->  ${val}`, 'okk');
      if (w === 'B') S.bSees = val;
      if (auto) { t.snap = null; }
      return;
    }
    if (op === 'UPDATE' || op === 'DELETE') {
      let target = cur;
      if (target && target.xmax && target.xmax !== t.xid) {
        const st = S.clog[target.xmax];
        if (st === 'running') {
          const blocker = target.xmax === S.tx.A.xid ? 'A' : 'B';
          S.pending = { w, op, arg, on: blocker }; S.waits++;
          say(w, `${op === 'UPDATE' ? `UPDATE orders SET status = '${arg}' WHERE id = 7` : 'DELETE FROM orders WHERE id = 7'}  -- waits (Lock / transactionid ${target.xmax})`, 'wait');
          return;
        }
        if (st === 'committed') {
          if (t.iso === 'RR') { S.err = '40001'; say(w, 'ERROR:  could not serialize access due to concurrent update', 'err'); if (t.inTx) { say(w, '-- transaction is aborted; the app must retry', 'err'); finish(w, 'aborted'); } return; }
          target = S.versions.find(v => v.xmin === target.xmax && !v.xmax) || null;
          if (!target) { say(w, `${op} 0`, 'wait'); return; }
        } else target.xmax = 0;
      }
      if (!target) { say(w, `${op} 0`, 'wait'); return; }
      const me = xid(t); target.xmax = me;
      if (op === 'UPDATE') { S.versions.push({ xmin: me, xmax: 0, val: arg }); say(w, `UPDATE orders SET status = '${arg}' WHERE id = 7  ->  UPDATE 1 (new version, HOT if no indexed column changes)`, 'okk'); }
      else say(w, 'DELETE FROM orders WHERE id = 7  ->  DELETE 1 (xmax set, row stays on the page)', 'okk');
      if (auto) finish(w, 'committed');
    }
  }
  function paint() {
    vers.replaceChildren(...S.versions.map(v => h('div', { class: v.xmax && S.clog[v.xmax] === 'committed' ? 'dead' : '' }, h('b', {}, `xmin=${v.xmin} xmax=${v.xmax}`), h('span', {}, `status='${v.val}'  ${S.clog[v.xmin] === 'committed' ? '' : '(creator ' + S.clog[v.xmin] + ')'}`))));
    out.update([{ l: 'versions on page', v: S.versions.length, cls: S.versions.length > 2 ? 'bad' : 'ok' }, { l: 'B last read', v: S.bSees }, { l: 'lock waits', v: S.waits, cls: S.waits ? 'bad' : 'ok' }, { l: 'error', v: S.err, cls: S.err === '—' ? 'ok' : 'bad' }, { l: 'versions vacuumed', v: S.removed }]);
  }
  function step() {
    const st = SC[scen].steps;
    if (k >= st.length) return false;
    const [w, op, arg] = st[k++]; exec(w, op, arg); paint();
    return k < st.length;
  }
  function runAll() { reset(); let more = true; while (more) more = step(); }
  const pl = player({ speed: 1000, step, reset });
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: a reader never waits for an uncommitted writer, but a second writer on the same row waits until the first transaction ends.'),
    bar(sS), bar(iS),
    bar(...pgxPresets(() => { scen = 'writers-long'; sS.set(scen); iso = 'RC'; iS.set('RC'); pl.stop(); runAll(); }, () => { scen = 'writers-short'; sS.set(scen); pl.stop(); runAll(); })),
    pl, ses, h('div', {}, h('h5', { style: 'margin:4px 0;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em' }, 'Row versions on the page (struck through = dead)'), vers), out,
    note('Illustrative model: one row, two sessions, a clog of committed transactions and per-statement or per-transaction snapshots. Row-lock waits resume automatically when the holder commits. Isolation applies to both sessions; the last scenario forces Repeatable Read for session B.')));
  reset();
};

/* ---- ch5 · WAL ---- */
PG.wal = function (root, A) {
  const { h, svg, seg, slider, stat, bar, note, rng } = A;
  let sc = 'off', fs = 'on', fpw = 'on';
  const cS = slider('crash at (ms)', 0, 2000, 520, 10, () => run());
  const sS = seg([{ v: 'on', l: 'synchronous_commit = on' }, { v: 'off', l: 'synchronous_commit = off' }], sc, v => { sc = v; run(); });
  const fS = seg([{ v: 'on', l: 'fsync = on' }, { v: 'off', l: 'fsync = off' }], fs, v => { fs = v; run(); });
  const pS = seg([{ v: 'on', l: 'full_page_writes = on' }, { v: 'off', l: 'full_page_writes = off' }], fpw, v => { fpw = v; run(); });
  const out = stat([]), lanes = h('div', { class: 'pgx-lanes' });
  const r0 = rng(21);
  const T = []; let t0 = 30;
  for (let i = 0; i < 14; i++) { t0 += 40 + Math.floor(r0() * 140); T.push(t0); }
  const PAGES = [[500, 40], [1100, 40], [1700, 40]];
  const WRITER = 200, OSFLUSH = 1500;
  function run() {
    const c = cS.value;
    let acked = 0, lost = 0, flushedRecs = 0;
    const marks = T.map(t => {
      const ack = sc === 'on' ? t + 2 : t;
      const flushed = fs === 'off' ? Math.ceil((t + 1) / OSFLUSH) * OSFLUSH : sc === 'on' ? t + 2 : Math.ceil((t + 1) / WRITER) * WRITER + 2;
      const isAcked = ack <= c, isLost = isAcked && flushed > c;
      if (isAcked) acked++; if (isLost) lost++; if (flushed <= c) flushedRecs += 3;
      return { t, cls: ack > c ? 'warn' : isLost ? 'bad' : '', flushed };
    });
    let torn = 0, ahead = 0;
    PAGES.forEach(([s, d]) => {
      if (s < c && c < s + d && fpw === 'off') torn++;
      if (s + d <= c && fs === 'off') { const lsnTxn = marks.filter(m => m.t < s).pop(); if (lsnTxn && lsnTxn.flushed > c) ahead++; }
    });
    const pct = t => (t / 2000 * 100).toFixed(2) + '%';
    const lane = (name, kids) => h('div', { class: 'pgx-lane' }, h('span', {}, name), h('div', { class: 'track', role: 'img', 'aria-label': name }, kids, h('div', { class: 'cut', style: 'left:' + pct(c) })));
    lanes.replaceChildren(
      lane('commits', marks.map(m => h('div', { class: 'tk ' + m.cls, style: 'left:' + pct(m.t), title: 'commit at ' + m.t + ' ms' }))),
      lane('WAL durable', marks.map(m => h('div', { class: 'tk ' + (m.flushed > 2000 ? 'warn' : ''), style: 'left:' + pct(Math.min(1990, m.flushed)), title: 'durable at ' + m.flushed + ' ms' }))),
      lane('page writes', PAGES.map(([s, d]) => h('div', { class: 'tk warn', style: 'left:' + pct(s) + ';width:' + Math.max(7, d / 2000 * 100 * 6) + 'px' }))));
    out.update([{ l: 'acknowledged commits lost', v: lost, cls: lost ? 'bad' : 'ok' }, { l: 'torn or ahead-of-WAL pages', v: torn + ahead, cls: torn + ahead ? 'bad' : 'ok' }, { l: 'redo records replayed', v: flushedRecs }, { l: 'commits acknowledged', v: acked }]);
  }
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: with asynchronous commit a crash right after COMMIT can lose it, while the database stays consistent.'),
    bar(sS, fS, pS), bar(cS),
    bar(...pgxPresets(() => { sc = 'off'; sS.set('off'); fs = 'on'; fS.set('on'); fpw = 'on'; pS.set('on'); cS.value = 520; run(); }, () => { sc = 'on'; sS.set('on'); fs = 'on'; fS.set('on'); fpw = 'on'; pS.set('on'); run(); })),
    lanes, out,
    note('Illustrative model: 14 commits at seeded times, the WAL writer flushes every 200 ms, OS write-back every 1.5 s when fsync is off, three page writes of 40 ms (orange). Red commits were acknowledged but lost; the vertical line is the crash. Move the crash slider into an orange window with full_page_writes off to tear a page.')));
  run();
};

/* ---- ch6 · VACUUM and the horizon ---- */
PG.vacuum = function (root, A) {
  const { h, svg, seg, slider, stat, bar, note } = A;
  let longT = '6h', tmo = 'off', slot = 'none';
  const rS = slider('updates per hour (M, illustrative)', 1, 20, 8, 1, () => run());
  const fS = slider('autovacuum_vacuum_scale_factor', 1, 40, 20, 1, () => run(), v => (v / 100).toFixed(2));
  const lS = seg([{ v: 'none', l: 'No long txn' }, { v: '6h', l: 'Idle in txn 6 h' }, { v: '24h', l: 'Idle in txn 24 h' }], longT, v => { longT = v; run(); });
  const tS = seg([{ v: 'off', l: 'idle_in_transaction_session_timeout = 0' }, { v: 'on', l: 'timeout = 5min' }], tmo, v => { tmo = v; run(); });
  const sSeg = seg([{ v: 'none', l: 'No replication slot' }, { v: 'abandoned', l: 'Abandoned slot' }], slot, v => { slot = v; run(); });
  const out = stat([]), chart = h('div', { class: 'svgw' });
  function run() {
    const U = rS.value, LIVE = 20, sf = fS.value / 100;
    const X = longT === 'none' || tmo === 'on' ? 0 : longT === '6h' ? 6 : 24, start = 24 - X;
    const horizon = t => slot === 'abandoned' ? 0 : (X && t >= start ? start : t);
    const dead = new Array(24).fill(0), series = [];
    let size = 1, trig = 0;
    for (let t = 0; t < 24; t++) {
      dead[t] = U;
      const total = dead.reduce((a, b) => a + b, 0), thr = 50e-6 + sf * LIVE;
      trig = thr;
      if (total > thr) for (let s = 0; s < 24; s++) if (s < horizon(t + 1)) dead[s] = 0;
      const d = dead.reduce((a, b) => a + b, 0);
      size = Math.max(size, 1 + d / LIVE);
      series.push(d);
    }
    const dnow = series[23], hz = horizon(24), rec = dead.reduce((a, v, s) => a + (s < hz ? v : 0), 0);
    const W = 560, H = 120, mx = Math.max(10, ...series);
    const pts = series.map((v, i) => (20 + i * (W - 30) / 23).toFixed(1) + ',' + (H - 14 - v / mx * (H - 30)).toFixed(1)).join(' ');
    chart.replaceChildren(svg('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Dead tuples over 24 hours', style: 'width:100%;min-width:420px;height:auto' },
      svg('line', { x1: 20, y1: H - 14, x2: W - 10, y2: H - 14, stroke: 'var(--line)' }),
      svg('polyline', { points: pts, fill: 'none', stroke: 'var(--acc2)', 'stroke-width': 2.5 }),
      svg('text', { x: 20, y: 12, 'font-size': 11, fill: 'var(--mut)' }, 'dead tuples (M) over 24 h, peak ' + mx.toFixed(0)),
      svg('text', { x: W - 10, y: H - 2, 'font-size': 11, fill: 'var(--mut)', 'text-anchor': 'end' }, 'hour 24')));
    out.update([{ l: 'dead tuples now (M)', v: dnow.toFixed(0), cls: dnow > 20 ? 'bad' : 'ok' }, { l: 'table size vs live data', v: size.toFixed(1) + 'x', cls: size > 1.8 ? 'bad' : 'ok' }, { l: 'horizon age (h)', v: 24 - hz, cls: 24 - hz > 1 ? 'bad' : 'ok' }, { l: 'reclaimable now (M)', v: rec.toFixed(0) }, { l: 'vacuum trigger (M dead)', v: trig.toFixed(1) }]);
  }
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: vacuum runs but reclaims nothing newer than the oldest snapshot, so one idle session or abandoned slot makes the table grow.'),
    bar(lS, tS), bar(sSeg), bar(rS, fS),
    bar(...pgxPresets(() => { longT = '6h'; lS.set('6h'); tmo = 'off'; tS.set('off'); slot = 'none'; sSeg.set('none'); rS.value = 8; fS.value = 20; run(); }, () => { tmo = 'on'; tS.set('on'); slot = 'none'; sSeg.set('none'); fS.value = 2; run(); })),
    chart, out,
    note('Illustrative model: 20 M live rows, one autovacuum pass at the end of every hour when dead tuples exceed the threshold, no I/O throttling, freed space reused but not returned to the OS. Dead tuples created before the horizon are removable.')));
  run();
};

/* ---- ch7 · planner and statistics ---- */
PG.planner = function (root, A) {
  const { h, seg, slider, stat, bar, note } = A;
  let fresh = 'stale', corr = 'indep', ext = 'off', style = 'literal', mode = 'auto';
  const NROWS = 1e7;
  const kS = slider('actual matching rows', 10, 70, 63, 1, () => run(), v => pgxN(Math.pow(10, v / 10)));
  const eS = slider('execution number', 1, 10, 7, 1, () => run());
  const fS = seg([{ v: 'fresh', l: 'Statistics fresh' }, { v: 'stale', l: 'Stale (before bulk load)' }], fresh, v => { fresh = v; run(); });
  const cS = seg([{ v: 'indep', l: 'Independent predicates' }, { v: 'corr', l: 'Correlated predicates' }], corr, v => { corr = v; run(); });
  const xS = seg([{ v: 'off', l: 'No extended statistics' }, { v: 'on', l: 'CREATE STATISTICS' }], ext, v => { ext = v; run(); });
  const qS = seg([{ v: 'literal', l: 'Literal value' }, { v: 'prep', l: 'Prepared ($1)' }], style, v => { style = v; run(); });
  const mS = seg([{ v: 'auto', l: 'auto' }, { v: 'force_custom_plan', l: 'force_custom_plan' }, { v: 'force_generic_plan', l: 'force_generic_plan' }], mode, v => { mode = v; run(); });
  const out = stat([]), pane = h('div', { class: 'pgx-code' });
  const cost = (plan, rows) => plan === 'Nested Loop' ? rows * 0.06 : 2500 + rows * 0.0025;
  function run() {
    const actual = Math.round(Math.pow(10, kS.value / 10));
    let est = fresh === 'stale' ? 10 : (corr === 'corr' && ext === 'off' ? Math.max(1, Math.round(actual * actual / NROWS)) : actual);
    let how = fresh === 'stale' ? 'stale statistics' : corr === 'corr' && ext === 'off' ? 'independence assumption' : 'statistics match';
    if (style === 'prep') {
      const generic = mode === 'force_generic_plan' || (mode === 'auto' && eS.value > 5);
      if (generic) { est = 200; how = 'generic plan: average of 200 rows per value'; }
    }
    const plan = cost('Nested Loop', est) <= cost('Hash Join', est) ? 'Nested Loop' : 'Hash Join';
    const ms = Math.round(cost(plan, actual)), best = Math.round(Math.min(cost('Nested Loop', actual), cost('Hash Join', actual)));
    const ratio = actual / Math.max(1, est);
    pane.textContent = `${plan}  (rows=${est})  (actual rows=${actual})\n  estimate source: ${how}${style === 'prep' ? '\n  plan_cache_mode = ' + mode + ', execution #' + eS.value : ''}`;
    pane.style.whiteSpace = 'pre-wrap';
    out.update([{ l: 'estimated rows', v: pgxN(est) }, { l: 'actual rows', v: pgxN(actual) }, { l: 'chosen plan', v: plan, cls: ms > best * 3 ? 'bad' : 'ok' }, { l: 'runtime (ms, illustrative)', v: pgxN(ms), cls: ms > best * 3 ? 'bad' : 'ok' }, { l: 'estimate error', v: ratio >= 2 ? Math.round(ratio) + 'x too low' : 'ok', cls: ratio >= 2 ? 'bad' : 'ok' }]);
  }
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: a plan that is right for 10 rows is a disaster for 2 million, and the estimate, not the data, decides the plan.'),
    bar(kS, fS), bar(cS, xS), bar(qS, mS, eS),
    bar(...pgxPresets(() => { kS.value = 63; fresh = 'stale'; fS.set('stale'); corr = 'indep'; cS.set('indep'); style = 'literal'; qS.set('literal'); run(); }, () => { fresh = 'fresh'; fS.set('fresh'); corr = 'corr'; cS.set('corr'); ext = 'on'; xS.set('on'); mode = 'force_custom_plan'; mS.set('force_custom_plan'); run(); })),
    pane, out,
    note('Illustrative model: a 10 M row table, two join methods with invented cost formulas (nested loop cost grows per outer row, hash join has a fixed build cost), break-even near 43 thousand rows. Execution number and plan_cache_mode only matter for prepared statements; the real switch to a generic plan compares costs.')));
  run();
};

/* ---- ch8 · work_mem spill ---- */
PG.spill = function (root, A) {
  const { h, seg, slider, stat, bar, note, logbox } = A;
  let op = 'sort', lim = 'none';
  const wS = slider('work_mem (MB)', 1, 1024, 4, 1, () => run());
  const iS = slider('input size (MB)', 10, 4000, 400, 10, () => run());
  const sS = slider('concurrent sessions', 1, 100, 10, 1, () => run());
  const nS = slider('memory-hungry nodes per query', 1, 4, 3, 1, () => run());
  const oS = seg([{ v: 'sort', l: 'Sort' }, { v: 'hash', l: 'Hash join (build side)' }], op, v => { op = v; run(); });
  const lS = seg([{ v: 'none', l: 'temp_file_limit = -1' }, { v: '2048', l: 'temp_file_limit = 2GB' }], lim, v => { lim = v; run(); });
  const out = stat([]), log = logbox();
  function run() {
    const wm = wS.value, inp = iS.value, RAM = 16384;
    let temp = 0, units = 1, line = '', mem = 0;
    if (op === 'sort') {
      if (inp <= wm) { line = `Sort Method: quicksort  Memory: ${inp * 1024}kB`; mem = inp; }
      else {
        const runs = Math.ceil(inp / wm), fan = Math.max(6, Math.min(500, Math.floor(wm * 1024 / 256))), passes = Math.max(1, Math.ceil(Math.log(runs) / Math.log(fan)));
        temp = inp * passes; units = runs; mem = wm;
        line = `Sort Method: external merge  Disk: ${inp * 1024}kB   (${runs} runs, merge fan-in ${fan}, ${passes} write pass${passes > 1 ? 'es' : ''})`;
      }
    } else {
      const hm = wm * 2;
      if (inp <= hm) { line = `Buckets: 65536  Batches: 1  Memory Usage: ${inp * 1024}kB`; mem = inp; }
      else {
        let b = 1; while (b * hm < inp) b *= 2;
        units = b; temp = Math.round((inp + inp * 3) * (1 - 1 / b)); mem = hm;
        line = `Buckets: 65536  Batches: ${b}  Memory Usage: ${hm * 1024}kB`;
      }
    }
    const peakMB = sS.value * nS.value * mem, over = peakMB > RAM * 0.9;
    const ms = Math.round(inp * 3 + temp * 8);
    const limited = lim === '2048' && temp > 2048;
    out.update([{ l: op === 'sort' ? 'sort runs' : 'hash batches', v: units, cls: units > 1 ? 'bad' : 'ok' }, { l: 'temp bytes written (MB)', v: temp, cls: temp ? 'bad' : 'ok' }, { l: 'peak memory, all sessions (GB)', v: (peakMB / 1024).toFixed(1), cls: over ? 'bad' : 'ok' }, { l: 'runtime (s, illustrative)', v: (ms / 1000).toFixed(1) }, { l: 'result', v: limited ? 'ERROR' : over ? 'OOM risk' : 'ok', cls: limited || over ? 'bad' : 'ok' }]);
    log.clear();
    log.add('EXPLAIN (ANALYZE): ' + (op === 'sort' ? 'Sort' : 'Hash'), 'mut');
    log.add('  ' + line, temp ? 'bad' : 'ok');
    if (limited) log.add('ERROR:  temporary file size exceeds temp_file_limit (2097152kB)', 'bad');
    if (over) log.add(`-- ${sS.value} sessions x ${nS.value} nodes x ${mem} MB = ${(peakMB / 1024).toFixed(1)} GB against 16 GB RAM: the kernel OOM killer may strike`, 'bad');
  }
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: a small work_mem makes a big sort spill but still finish, and a big global work_mem multiplies across nodes and sessions.'),
    bar(oS, lS), bar(wS, iS), bar(sS, nS),
    bar(...pgxPresets(() => { op = 'sort'; oS.set('sort'); lim = 'none'; lS.set('none'); wS.value = 4; iS.value = 400; sS.value = 10; nS.value = 3; run(); }, () => { op = 'sort'; oS.set('sort'); wS.value = 512; sS.value = 2; nS.value = 3; run(); })),
    out, log.el,
    note('Illustrative model: 16 GB host, merge fan-in derived from work_mem with a 256 kB tape buffer, hash join probe side three times the build side, hash memory = work_mem times hash_mem_multiplier of 2. Runtimes are invented.')));
  run();
};

/* ---- ch9 · checkpoints ---- */
PG.checkpoint = function (root, A) {
  const { h, svg, seg, slider, stat, bar, btn, note, logbox, rng } = A;
  let tmo = 5;
  const tS = seg([{ v: 1, l: '1 min' }, { v: 5, l: '5 min' }, { v: 15, l: '15 min' }, { v: 30, l: '30 min' }], tmo, v => { tmo = v; run(); });
  const wS = slider('max_wal_size (GB)', 1, 128, 1, 1, () => run());
  const cS = slider('checkpoint_completion_target', 1, 9, 1, 1, () => run(), v => (v / 10).toFixed(1));
  const rS = slider('WAL rate (MB/s)', 1, 100, 20, 1, () => run());

/* ---- ch10 · isolation and deadlocks ---- */
PG.isolation = function (root, A) {
  const { h, seg, slider, stat, bar, note, player, logbox } = A;
  let iso = 'RC', scen = 'lost', fix = 'no';
  const iS = seg([{ v: 'RC', l: 'READ COMMITTED' }, { v: 'RR', l: 'REPEATABLE READ' }, { v: 'SER', l: 'SERIALIZABLE' }], iso, v => { iso = v; reset(); });
  const sS = seg([{ v: 'lost', l: 'Lost update' }, { v: 'skew', l: 'Write skew' }, { v: 'dead', l: 'Opposite lock order' }, { v: 'ddl', l: 'ALTER behind a long query' }], scen, v => { scen = v; reset(); });
  const fS = seg([{ v: 'no', l: 'As written' }, { v: 'yes', l: 'With the fix' }], fix, v => { fix = v; reset(); });
  const lt = slider('lock_timeout (s, 0 = off)', 0, 10, 0, 1, () => reset());
  const out = stat([]), log = logbox();
  let steps, k, res;
  function build() {
    const f = fix === 'yes', S = [];
    let r = { anomaly: 'no', err: '—', waits: 0, queue: 0 };
    const add = (who, text, cls) => S.push({ who, text, cls });
    if (scen === 'lost') {
      add('T1', 'SELECT balance FROM accounts WHERE id = 1;  -- 100'); add('T2', 'SELECT balance FROM accounts WHERE id = 1;  -- 100');
      add('T1', f ? 'UPDATE accounts SET balance = balance + 50 WHERE id = 1;' : 'UPDATE accounts SET balance = 150 WHERE id = 1;  -- computed in the app'); add('T1', 'COMMIT;', 'ok');
      if (iso === 'RC') {
        add('T2', f ? 'UPDATE accounts SET balance = balance + 30 WHERE id = 1;  -- applies to the current row (150)' : 'UPDATE accounts SET balance = 130 WHERE id = 1;  -- stale read, silently overwrites');
        add('T2', 'COMMIT;', 'ok');
        r.anomaly = f ? 'no' : 'yes: final 130, expected 180';
      } else { add('T2', 'UPDATE accounts SET balance = ... WHERE id = 1;'); add('T2', 'ERROR:  could not serialize access due to concurrent update', 'bad'); add('T2', '-- retry the whole transaction: now it sees 150 and writes 180', 'ok'); r.err = '40001'; r.anomaly = 'no (retry needed)'; }
    } else if (scen === 'skew') {
      add('T1', 'SELECT count(*) FROM doctors WHERE on_call;  -- 2'); add('T2', f && iso !== 'SER' ? 'SELECT ... FROM doctors WHERE on_call FOR UPDATE;  -- waits for T1' : 'SELECT count(*) FROM doctors WHERE on_call;  -- 2');
      add('T1', "UPDATE doctors SET on_call = false WHERE name = 'ann';");
      if (f && iso !== 'SER') { r.waits = 1; add('T1', 'COMMIT;', 'ok'); add('T2', '-- lock granted, re-read: count = 1, so do not leave', 'ok'); r.anomaly = 'no'; }
      else if (iso === 'SER') { add('T2', "UPDATE doctors SET on_call = false WHERE name = 'bob';"); add('T1', 'COMMIT;', 'ok'); add('T2', 'COMMIT;  -- ERROR:  could not serialize access due to read/write dependencies among transactions', 'bad'); r.err = '40001'; r.anomaly = 'no (T2 must retry)'; }
      else { add('T2', "UPDATE doctors SET on_call = false WHERE name = 'bob';"); add('T1', 'COMMIT;', 'ok'); add('T2', 'COMMIT;  -- nobody is on call now', 'bad'); r.anomaly = 'yes: 0 doctors on call'; }
    } else if (scen === 'dead') {
      add('T1', 'UPDATE accounts SET balance = balance - 10 WHERE id = 1;'); add('T2', f ? 'UPDATE accounts SET balance = balance + 10 WHERE id = 1;  -- same order, waits for T1' : 'UPDATE accounts SET balance = balance - 5 WHERE id = 2;');
      if (f) { r.waits = 1; add('T1', 'UPDATE accounts SET balance = balance + 10 WHERE id = 2;'); add('T1', 'COMMIT;', 'ok'); add('T2', '-- lock on id 1 granted, finishes', 'ok'); add('T2', 'COMMIT;', 'ok'); }
      else { r.waits = 2; add('T1', 'UPDATE accounts SET balance = balance + 10 WHERE id = 2;  -- waits for T2'); add('T2', 'UPDATE accounts SET balance = balance + 5 WHERE id = 1;  -- waits for T1'); add('T2', 'ERROR:  deadlock detected  (after deadlock_timeout = 1s)', 'bad'); add('T1', '-- T2 aborted, T1 proceeds and commits', 'ok'); r.err = '40P01'; }
    } else {
      const T = lt.value;
      add('T1', 'BEGIN; SELECT count(*) FROM orders;  -- long report, holds ACCESS SHARE'); add('T2', 'ALTER TABLE orders ADD COLUMN note text;  -- needs ACCESS EXCLUSIVE, waits');
      const arr = T ? Math.floor(T / 0.5) : 40;
      add('T3', `${arr} new SELECTs arrive and queue behind the ALTER (one every 0.5 s)`, 'bad');
      if (T) { add('T2', `ERROR:  canceling statement due to lock timeout (after ${T}s)`, 'ok'); add('T3', '-- the queue drains, DDL is retried later', 'ok'); r.err = '55P03'; r.queue = arr; } else { add('T3', '-- everything waits until the long report ends (illustrative: 40 queries queued)', 'bad'); r.queue = 40; }
      r.waits = 1 + arr;
    }
    return { S, r };
  }
  function paint() {
    out.update([{ l: 'anomaly', v: res.anomaly, cls: res.anomaly.startsWith('yes') ? 'bad' : 'ok' }, { l: 'error SQLSTATE', v: res.err, cls: res.err === '—' ? 'ok' : 'bad' }, { l: 'waits', v: res.waits }, { l: 'queue length', v: res.queue, cls: res.queue > 5 ? 'bad' : 'ok' }]);
  }
  function reset() { const b = build(); steps = b.S; res = b.r; k = 0; log.clear(); log.add('-- press Play or Step ›', 'mut'); paint(); }

  function runAll() { reset(); let more = true; while (more) more = step(); }
  const pl = player({ speed: 900, step, reset });
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: stronger isolation turns silent anomalies into retryable errors, and a lock cycle or lock queue only ends by an abort or a timeout.'),
    bar(sS), bar(iS, fS), bar(lt),
    bar(...pgxPresets(() => { scen = 'lost'; sS.set('lost'); iso = 'RC'; iS.set('RC'); fix = 'no'; fS.set('no'); pl.stop(); runAll(); }, () => { fix = 'yes'; fS.set('yes'); if (scen === 'ddl') lt.value = 2; pl.stop(); runAll(); })),
    pl, log.el, out,
