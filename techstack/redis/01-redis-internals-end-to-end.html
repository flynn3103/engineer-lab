<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../assets/lab.css">
<style>
:root{--acc:#0f9d8a;--acc2:#d6456b}
@media(prefers-color-scheme:dark){:root{--acc:#3ccfb8;--acc2:#ff7aa0}}
body{font-size:16px}
.topbar .wrap{min-height:50px}
.topbar .crumb{color:var(--mut);font-size:14px;text-decoration:none}
.topbar .crumb:hover{color:var(--ink)}
.hero{padding:34px 0 10px}
.hero .lead{max-width:60ch}
.part{margin:28px 0 10px}
.part h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 4px}
.part p{margin:0 0 12px;color:var(--mut);font-size:14.5px;max-width:64ch}
.map{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.tile{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:0;height:100%;width:100%}
.tile:hover{border-color:var(--acc);transform:translateY(-2px)}
.tile .n{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--pc);border:1px solid var(--line)}
.tile b{display:block;font-size:15px;line-height:1.3}
.tile small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;line-height:1.35}
.chhead{display:flex;gap:12px;align-items:center;margin:22px 0 4px}
.chhead .n{flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;background:var(--pc);border:1px solid var(--line)}
.chhead h1{font-size:clamp(22px,4.6vw,30px);letter-spacing:-.4px}
.chhead small{display:block;color:var(--mut);font-size:13px}
.ask{font-size:clamp(17px,2.8vw,20px);margin:8px 0 18px;max-width:62ch}
.blk{margin:0 0 16px}
.blk>h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.blk>h3 i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--on-brand,#fff);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.idea{margin:0;padding-left:20px}.idea li{margin:5px 0}
.pg{display:grid;gap:12px}
.pgwhy{margin:0;color:var(--mut);font-size:14px}
.cp{display:grid;gap:10px}
@media(min-width:760px){.cp{grid-template-columns:repeat(3,1fr)}}
.cp>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.cp b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.cp .s b{color:var(--bad)}.cp .c b{color:var(--warn)}.cp .f b{color:var(--ok)}
.cp p{margin:0;font-size:14.5px}
.quiz .q{font-weight:600;margin:0 0 8px}
.quiz .opts{display:grid;gap:6px}
.quiz .opts button{text-align:left;min-height:0;padding:9px 12px}
.quiz .opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.quiz .opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.quiz .why{margin-top:8px}
.pn{display:flex;justify-content:space-between;gap:8px;margin:22px 0 40px}
.pn button{max-width:48%;text-align:left}
.pn button:last-child{margin-left:auto;text-align:right}
/* ---- playground kit ---- */
.pgbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:grid;gap:12px;min-width:0}
.pgbox .bar{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;min-height:36px;padding:6px 12px;font-size:13.5px;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:var(--on-brand,#fff);font-weight:600}
.sl{display:inline-flex;align-items:center;gap:8px;flex-wrap:nowrap}
.sl input{width:130px}.sl b{color:var(--ink);font-weight:600;min-width:2ch;font-variant-numeric:tabular-nums}
.out{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;min-width:0}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.badge.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.badge.info{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line));background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.log{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card)}
.log div{padding:1px 0;border-bottom:1px dashed var(--line)}.log div:last-child{border:0}
.log .bad{color:var(--bad)}.log .ok{color:var(--ok)}.log .mut{color:var(--mut)}
.stat{display:flex;gap:10px;flex-wrap:wrap}
.stat>div{border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--card);min-width:84px}
.stat small{display:block;color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat .bad b{color:var(--bad)}.stat .ok b{color:var(--ok)}
.svgw{overflow-x:auto;overscroll-behavior-x:contain}.svgw svg{display:block;max-width:100%}
.cols{display:grid;gap:12px}
@media(min-width:760px){.cols.two{grid-template-columns:1fr 1fr}.cols.three{grid-template-columns:repeat(3,1fr)}}
.cols>*{min-width:0}
@media(max-width:560px){.chhead{margin-top:14px}}
.prob{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc2);border-radius:12px;padding:12px 16px;margin:0 0 6px}
.prob p{margin:0 0 .5em}.scene p:last-child{margin:0}
.prob .q{font-weight:700;font-size:clamp(17px,2.6vw,19px)}
.arch{margin:0}.arch figcaption{text-align:center}
.arch svg{overflow:visible}
.common{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.common>div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);display:grid;gap:5px;align-content:start}
.common h4{font-size:15px;line-height:1.3;margin:0}.common h4 i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;margin-right:6px;vertical-align:1px}
.common p{margin:0;font-size:14px}
.common b{font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-right:6px}
.common .e b{color:var(--acc2)}.common .c b{color:var(--warn)}.common .f b{color:var(--ok)}
.sw{display:flex;gap:6px;margin-left:auto}
.sw a{font-size:13px;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}
.sw a:hover{color:var(--ink);border-color:var(--acc)}.sw a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.ctabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.ctab{border-radius:999px;font-size:14px;padding:7px 14px;min-height:0}
.ctab.on{color:var(--ink);background:color-mix(in srgb,var(--acc2) 14%,var(--card));border-color:var(--acc2);font-weight:700}
.cbody{display:grid;gap:12px}
.ctitle{font-size:clamp(20px,3.6vw,26px);letter-spacing:-.3px;margin:4px 0 0}
.csym{font-size:clamp(16px,2.4vw,18.5px);margin:0}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.ccard h5{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 6px}
.ccard h5:not(:first-child){margin-top:12px}
.ccard p{margin:0 0 .5em;font-size:15px}.ccard .seen b{color:var(--acc2);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.ccard pre{font-size:12.5px}
.vizc{background:var(--soft)}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.vrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin:6px 0}
@media(max-width:620px){.vrow{grid-template-columns:1fr;gap:4px}}
.vl{font-size:13px;color:var(--mut)}
.vcells{display:flex;gap:6px;min-width:0}
.vc{flex:1 1 0;min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;font-size:12.5px;background:var(--card);overflow-wrap:anywhere}
.vc.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.vc.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--card))}
.vc.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,var(--card))}
.vc.off{border-style:dashed;color:var(--mut);background:transparent}
.vbar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
@media(max-width:620px){.vbar{grid-template-columns:1fr}}
.vtrack{height:16px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vtrack i{display:block;height:100%;border-radius:8px;transition:width .35s}
.vtrack i.bad{background:var(--bad)}.vtrack i.ok{background:var(--ok)}.vtrack i.warn{background:var(--warn)}
.vt{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.fixes{margin:0;padding-left:22px}.fixes li{margin:4px 0}.fixes li::marker{color:var(--acc2);font-weight:700}
.course-custom{display:grid;gap:18px;margin-bottom:22px}

/* chapter 2 · buffer pool playground and architecture animation */
section.blk .prob p{font-size:15px;line-height:1.55}
.arch-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 8px}
.ar-box rect{fill:var(--card);stroke:var(--line);stroke-width:1.5;transition:opacity .3s,stroke .3s}
.ar-box.on rect{stroke:var(--acc);stroke-width:3}
.ar-box.off{opacity:.35}
.ar-box{transition:opacity .3s}
.ar-title{font-size:13px;font-weight:700;fill:var(--ink);font-family:system-ui,sans-serif}
.ar-sub{font-size:11px;fill:var(--mut);font-family:ui-monospace,monospace}
.ar-arrow line{stroke:var(--mut);stroke-width:1.6;fill:none;color:var(--mut);transition:opacity .3s}
.ar-arrow.on line{stroke:var(--acc2);stroke-width:3;color:var(--acc2)}
.ar-arrow:not(.on) line{opacity:.45}
.ar-lab{font-size:11px;fill:var(--mut);font-family:ui-monospace,monospace}
.ar-arrow.on .ar-lab{fill:var(--acc2);font-weight:700}
.ar-dot{fill:var(--acc2);stroke:var(--card);stroke-width:2}
.ar-step{margin-top:8px;border-left:4px solid var(--acc);background:var(--soft);border-radius:0 10px 10px 0;padding:10px 12px}
.ar-count{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.ar-text{margin:4px 0 0;font-size:15px;color:var(--ink)}
.ar-box{cursor:pointer;outline:none}
.ar-box:focus-visible rect{stroke:var(--acc);stroke-width:3}
.ar-box.picked rect{stroke:var(--acc2);stroke-width:3}
.ar-hint{margin:0;font-size:14px;color:var(--mut)}
.split{display:grid;gap:14px;align-items:start}
.split-l,.split-r{min-width:0}
.split-r{display:grid;gap:10px;align-content:start}
@media(min-width:760px){.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}}

.ar-comp{display:grid;gap:8px;margin-top:10px}
.ar-state{display:grid;gap:8px;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.ar-pt{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.ar-lookup{font-weight:700;font-size:14px}
.ar-lookup.hit{color:var(--ok)}.ar-lookup.miss{color:var(--bad)}
.ar-frs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ar-fr{border:1.5px solid var(--line);border-radius:10px;padding:6px;background:var(--card);display:grid;gap:2px;font-size:12px;color:var(--mut)}
.ar-fr b{font-size:14px;color:var(--ink)}
.ar-fr.pinned{border-color:var(--acc)}
.ar-fr.dirty{box-shadow:inset 0 -4px 0 var(--bad)}
.ar-legend{font-size:12.5px;color:var(--mut);margin:0}
@media(max-width:620px){.ar-frs{grid-template-columns:repeat(2,1fr)}}
.sm{display:grid;gap:10px}
.sm-frames{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sm-fr{border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;background:var(--card);display:grid;gap:2px;text-align:center;min-height:66px;align-content:center}
.sm-fr small{font-size:11px;color:var(--mut)}
.sm-fr b{font-size:15px;color:var(--ink)}
.sm-fr.pinned{border-color:var(--acc)}
.sm-fr.dirty{box-shadow:inset 0 -4px 0 var(--bad)}
.sm-ops{display:flex;flex-wrap:wrap;gap:5px}
.sm-op{font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:7px;padding:3px 7px;color:var(--mut)}
.sm-op.done.hit{color:var(--ok);border-color:var(--ok)}
.sm-op.done.miss{color:var(--bad);border-color:var(--bad)}
.sm-op.now{outline:2px solid var(--acc);outline-offset:2px;color:var(--ink)}
.sm-op.leak{border-style:dashed}
.sm-msg{margin:0;font-size:14.5px;color:var(--ink);min-height:3em}
.sm-cnt{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums;border-top:1px dashed var(--line);padding-top:6px}
@media(max-width:620px){.sm-frames{grid-template-columns:repeat(2,1fr)}}
.ar-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ar-card b{font-size:13px;color:var(--acc)}
.ar-card p{margin:2px 0 0;font-size:14px;color:var(--ink)}
/* Redis tech CSS (prefix rds-) */
.rds-hist{display:flex;align-items:flex-end;gap:2px;height:80px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--card);min-width:0}
.rds-hist i{flex:1;min-width:2px;background:var(--acc2);border-radius:2px 2px 0 0;display:block}
.rds-hist i.bad{background:var(--bad)}
input.rds-cli{flex:1 1 220px;min-width:0;width:100%;max-width:100%;box-sizing:border-box;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.rds-tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.rds-tbl th,.rds-tbl td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.rds-tbl th{color:var(--mut);font-weight:600;font-size:12px}
.rds-tbl td.bad{color:var(--bad);font-weight:700}
@media(max-width:620px){input.rds-cli{flex-basis:100%}.rds-tbl{font-size:12px}.rds-hist{height:64px}}
@media(prefers-reduced-motion:reduce){.rds-hist i{transition:none;animation:none}}

</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---- tiny helpers shared by the chapters and playgrounds ---- */
const PG = {};
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TIMERS = [];
function stopTimers() { while (TIMERS.length) { const t = TIMERS.pop(); clearInterval(t); clearTimeout(t); } }
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  const add = k => { if (k == null || k === false) return; if (Array.isArray(k)) k.forEach(add); else el.append(k.nodeType ? k : document.createTextNode(String(k))); };
  kids.forEach(add);
  return el;
}
function svg(tag, props, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in (props || {})) { const v = props[k]; if (v == null || v === false) continue; if (k === 'class') el.setAttribute('class', v); else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v); else el.setAttribute(k, v); }
  const add = k => { if (k == null || k === false) return; if (Array.isArray(k)) k.forEach(add); else el.append(k.nodeType ? k : document.createTextNode(String(k))); };
  kids.forEach(add);
  return el;
}
/* seeded random numbers, so every run of a playground repeats */
function rng(seed) { let a = (seed >>> 0) || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const bar = (...k) => h('div', { class: 'bar' }, ...k);
const btn = (label, fn, cls) => h('button', { class: cls || '', onclick: fn }, label);
const badge = (text, kind) => h('span', { class: 'badge ' + (kind || '') }, text);
const note = t => h('p', { class: 'note' }, t);
function seg(opts, val, cb) {          // opts: [{v,l}] or [v]; returns element with .value and .set(v)
  const el = h('div', { class: 'seg', role: 'group' });
  const norm = opts.map(o => (typeof o === 'object' ? o : { v: o, l: String(o) }));
  const paint = () => [...el.children].forEach((b, i) => b.classList.toggle('on', norm[i].v === el.value));
  norm.forEach(o => el.append(h('button', { onclick() { el.value = o.v; paint(); cb && cb(o.v); } }, o.l)));
  el.value = val; el.set = v => { el.value = v; paint(); }; paint(); return el;
}
function slider(label, min, max, val, step, cb, fmt) {   // returns <label> with .input and .value
  const out = h('b', {}, fmt ? fmt(val) : val);
  const input = h('input', { type: 'range', min, max, step: step || 1, value: val, 'aria-label': label });
  input.addEventListener('input', () => { out.textContent = fmt ? fmt(+input.value) : input.value; cb && cb(+input.value); });
  const el = h('label', { class: 'sl' }, label, input, out);
  Object.defineProperty(el, 'value', { get: () => +input.value, set: v => { input.value = v; out.textContent = fmt ? fmt(+v) : v; } });
  return el;
}
function player(o) {   // o.step() -> false when finished, o.reset(), o.speed ms per tick. returns element with .stop()
  let t = null;
  const stop = () => { if (t) { clearInterval(t); const i = TIMERS.indexOf(t); if (i >= 0) TIMERS.splice(i, 1); t = null; } play.textContent = '▶ Play'; };
  const tick = () => { if (o.step() === false) stop(); };
  const play = btn('▶ Play', () => { if (t) { stop(); return; } t = setInterval(tick, o.speed || 600); TIMERS.push(t); play.textContent = '⏸ Pause'; tick(); }, 'primary');
  const el = bar(play, btn('Step ›', () => { stop(); tick(); }), btn('⏮ Reset', () => { stop(); o.reset(); }));
  el.stop = stop; return el;
}
function logbox() {
  const el = h('div', { class: 'log', 'aria-live': 'polite' });
  return { el, add(text, cls) { el.append(h('div', { class: cls || '' }, text)); el.scrollTop = el.scrollHeight; }, clear() { el.textContent = ''; } };
}
function stat(items) {   // items: [{l, v, cls}] -> element; call el.update(items) to refresh
  const el = h('div', { class: 'stat' });
  el.update = its => { el.textContent = ''; its.forEach(i => el.append(h('div', { class: i.cls || '' }, h('small', {}, i.l), h('b', {}, i.v)))); };
  el.update(items || []); return el;
}
const API = { h, svg, rng, bar, btn, badge, note, seg, slider, player, logbox, stat, esc, timers: TIMERS };
/* static architecture diagram: spec = {w,h,boxes:[[id,x,y,w,h,label,tone]],arrows:[[from,to,label,dashed]],cap}; tone 0..7 picks a --p colour; '\n' splits lines */
function diagram(sp) {
  const B = {}; sp.boxes.forEach(b => { B[b[0]] = { x: b[1], y: b[2], w: b[3], h: b[4] }; });
  const s = svg('svg', { viewBox: `0 0 ${sp.w} ${sp.h}`, role: 'img', 'aria-label': sp.cap || 'diagram', style: 'width:100%;min-width:' + Math.min(sp.w, 540) + 'px;max-width:' + sp.w + 'px;height:auto;display:block;margin:0 auto' });
  s.append(svg('defs', {}, svg('marker', { id: 'ah', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, svg('path', { d: 'M0 0L10 5L0 10z', fill: 'currentColor' }))));
  const edge = (a, t) => { const cx = a.x + a.w / 2, cy = a.y + a.h / 2, dx = t.x + t.w / 2 - cx, dy = t.y + t.h / 2 - cy; const k = Math.min(dx ? (a.w / 2) / Math.abs(dx) : 1e9, dy ? (a.h / 2) / Math.abs(dy) : 1e9); return [cx + dx * k, cy + dy * k]; };
  (sp.arrows || []).forEach(([f, t, lab, dash]) => {
    const [x1, y1] = edge(B[f], B[t]), [x2, y2] = edge(B[t], B[f]);
    s.append(svg('line', { x1, y1, x2, y2, stroke: 'currentColor', 'stroke-width': 1.6, 'stroke-dasharray': dash ? '5 4' : null, 'marker-end': 'url(#ah)', style: 'color:var(--mut)' }));
    if (lab) s.append(svg('text', { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 5, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--mut)' }, lab));
  });
  sp.boxes.forEach(([id, x, y, w, hh, lab, tone]) => {
    s.append(svg('rect', { x, y, width: w, height: hh, rx: 9, fill: tone == null ? 'var(--card)' : 'var(--p' + tone + ')', stroke: 'var(--line)', 'stroke-width': 1.5 }));
    const ls = String(lab).split('\n'), y0 = y + hh / 2 - (ls.length - 1) * 8 + 4;
    ls.forEach((l, i) => s.append(svg('text', { x: x + w / 2, y: y0 + i * 16, 'text-anchor': 'middle', 'font-size': 12.5, fill: 'var(--ink)', 'font-weight': i === 0 && ls.length > 1 ? 700 : 400 }, l)));
  });
  return h('figure', { class: 'arch' }, h('div', { class: 'svgw' }, s), sp.cap ? h('figcaption', { class: 'note' }, sp.cap) : null);
}
API.diagram = diagram;

      VZ([R('HSCAN COUNT 200', ['small pages', 'ok', 1])], [BR('single command time', 2, 'ok', 'under 1 ms'), BR('reply size', 3, 'ok', 'small')], 'Paged reads.'),
      ['Measure first: <code>HLEN</code> or <code>redis-cli --bigkeys</code> on the key, then <code>SLOWLOG GET</code>.', 'Fix: read with <code>HSCAN</code> pages, or store only what you read together; cap hash size by trimming old fields.', 'Fix: split one unbounded key into bounded buckets (for example per day).', 'Verify: the key no longer appears in <code>SLOWLOG</code> and the reply size per call is bounded.'])
  ] },
/* ---------------- ch2 ---------------- */
{ ask: 'Every key holds a typed value with its own encoding. What happens when a client or a size limit breaks that contract?',
  why: 'Each value type needs its own structure, and small values need a compact one to save memory.',
  principle: 'Check the type before touching data and switch representation when size crosses a threshold.',
  design: 'A redisObject carries a type and an encoding; listpack is used while small, hashtable or skiplist after a threshold.',
  scene: ['After a deploy the cart service starts returning errors for some users, and Redis memory jumps to about three times its usual level (illustrative).',
          'The release changed how carts are stored: a few code paths write the cart as a JSON string to a key that older code stores as a hash, and a bulk import filled many carts with hundreds of fields.'],
  predict: { q: 'A hash grows from 100 to 200 fields with default configuration. What changes inside Redis?',
    opts: ['Nothing, a hash is always a hashtable', 'The extra fields are dropped once the hash passes 128 fields', 'The encoding converts from listpack to hashtable and memory per field rises'], ans: 2,
    why: 'The defaults <code>hash-max-listpack-entries 128</code> and <code>hash-max-listpack-value 64</code> keep small hashes in a compact listpack. Crossing either limit converts it to a hashtable, which uses more memory per field. Data is never dropped.' },
  idea: ['<b>redisObject</b>: every value has a <code>type</code> (string, list, hash, set, zset, stream) and an <code>encoding</code>. Commands check the type first and fail with <code>WRONGTYPE</code>.',
         '<b>Compact encodings</b>: small hashes and sorted sets use a <b>listpack</b> (a flat, contiguous array); sets of integers use <code>intset</code>; lists are <code>quicklist</code> of listpacks.',
         '<b>Thresholds</b>: <code>hash-max-listpack-entries</code>, <code>hash-max-listpack-value</code>, <code>zset-max-listpack-entries</code> decide when to convert. Conversion to the big encoding happens at once; shrinking back is not automatic.',
         '<b>Inspect</b> with <code>TYPE</code>, <code>OBJECT ENCODING</code> and <code>MEMORY USAGE</code> before guessing.'],
  arch: { w: 600, h: 230, cap: 'A command checks the type, then runs against whichever encoding the value currently has.',
    boxes: [['cmd', 10, 90, 120, 60, 'Command\nHGETALL k', 0], ['tc', 180, 90, 130, 60, 'Type check\nWRONGTYPE?', 1], ['ro', 365, 90, 130, 60, 'redisObject\ntype + encoding', 2], ['lp', 365, 10, 130, 50, 'listpack\ncompact', 3], ['ht', 365, 175, 130, 50, 'hashtable\nskiplist', 4]],
    arrows: [['cmd', 'tc', ''], ['tc', 'ro', 'ok'], ['ro', 'lp', 'small'], ['ro', 'ht', 'over limit']] },
  pg: 'keyspace',
  common: [
    CE('WRONGTYPE', 'WRONGTYPE after a deploy changes the type of a key',
      '<b>Reads or writes fail for one key family</b> while the rest of Redis is healthy.',
      'Old code stored carts as a hash at <code>cart:{id}</code>. A new code path stores a JSON string at the same key. Both versions run during a rolling deploy.',
      'Types are checked before any command touches the value. Running a hash command on a string key (or the reverse) is rejected, and Redis never converts a value between types.',
      '127.0.0.1:6379> SET cart:42 "{\\"items\\":3}"\nOK\n127.0.0.1:6379> HGETALL cart:42\n(error) WRONGTYPE Operation against a key holding the wrong kind of value\n127.0.0.1:6379> TYPE cart:42\nstring',
      '<code>TYPE key</code> shows what is really stored. The error text is fixed by the server.',
      LK(DOC + 'develop/data-types/', 'Redis data types'),
      VZ([R('old pods', ['HGETALL cart:42', 'bad', 1]), R('new pods', ['SET cart:42 json', 'warn', 1])], [BR('requests failing', 40, 'bad', 'WRONGTYPE')], 'Two writers disagree on the type.'),
      VZ([R('all pods', ['cart:v2:{id} as hash', 'ok', 1])], [BR('requests failing', 0, 'ok', 'none')], 'A new key name for the new layout.'),
      ['Measure first: <code>TYPE</code> on a failing key and <code>redis-cli --scan --pattern cart:*</code> sampled by type.', 'Fix: version key names (<code>cart:v2:</code>) when the value type or layout changes, and migrate lazily.', 'Fix: finish the rolling deploy or pin writers to one layout; add a type check in the client wrapper.', 'Verify: no <code>WRONGTYPE</code> replies in application logs after the cut-over.']),
    CE('Listpack threshold', 'Crossing hash-max-listpack-entries makes memory jump',
      '<b>Memory per key rises sharply</b> after an import, with the same number of keys.',
      'A bulk import writes 200 fields into carts that normally have about 100 (illustrative). Memory climbs about three times for those keys.',
      'At 129 fields (default 128) the hash converts from a listpack to a hashtable. The hashtable needs a bucket entry and object headers per field, so each field costs more bytes.',
      '127.0.0.1:6379> OBJECT ENCODING cart:42\n"listpack"\n127.0.0.1:6379> MEMORY USAGE cart:42\n(integer) 1980      # illustrative\n127.0.0.1:6379> HSET cart:42 f129 v\n127.0.0.1:6379> OBJECT ENCODING cart:42\n"hashtable"\n127.0.0.1:6379> MEMORY USAGE cart:42\n(integer) 9420      # illustrative',
      'Compare <code>MEMORY USAGE</code> before and after the encoding changes. The byte counts here are illustrative.',
      LK(DOC + 'operate/oss_and_stack/management/optimization/memory-optimization/', 'Memory optimization'),
      VZ([R('cart:42', ['200 fields', 'bad', 1], ['hashtable', 'bad', 1])], [BR('bytes per cart', 100, 'bad', 'about 3x')], 'Over the entry limit.'),
      VZ([R('cart:42:a', ['100 fields', 'ok', 1], ['listpack', 'ok', 1]), R('cart:42:b', ['100 fields', 'ok', 1], ['listpack', 'ok', 1])], [BR('bytes per cart', 40, 'ok', 'compact')], 'Split into bounded hashes.'),
      ['Measure first: <code>OBJECT ENCODING</code> and <code>MEMORY USAGE</code> on a sample of keys.', 'Fix: bucket large hashes so each stays at or below the limit (for example <code>cart:{id}:{n}</code>).', 'Fix: raising <code>hash-max-listpack-entries</code> trades CPU for memory because listpack operations are linear; test before changing.', 'Verify: <code>MEMORY USAGE</code> per key stays flat and <code>used_memory</code> returns to the expected level.']),
    CE('Long value', 'One long value converts the whole hash',
      '<b>Memory is higher than field counts predict</b> for hashes that hold a few large values.',
      'Carts store a free-text note per item. Most notes are short, but one 200-byte note appears in nearly every cart.',
      'The listpack stays only while every value is at most <code>hash-max-listpack-value</code> bytes (default 64). One longer value converts the whole hash even with only a few fields.',
      '127.0.0.1:6379> HSET cart:7 note "<200 bytes of text>"\n127.0.0.1:6379> OBJECT ENCODING cart:7\n"hashtable"\n# representative output',
      'A small hash with <code>hashtable</code> encoding usually means a long value tripped the value limit.',
      LK(DOC + 'operate/oss_and_stack/management/optimization/memory-optimization/', 'Memory optimization'),
      VZ([R('cart:7', ['6 fields, one 200-byte value', 'warn', 1], ['hashtable', 'bad', 1])], [BR('bytes per cart', 80, 'bad', 'high')], 'One value over 64 bytes.'),
      VZ([R('cart:7', ['6 fields', 'ok', 1], ['listpack', 'ok', 1]), R('note:7', ['string key', 'ok', 1])], [BR('bytes per cart', 25, 'ok', 'compact')], 'Long text stored apart.'),
      ['Measure first: sample <code>OBJECT ENCODING</code> on small hashes to find which ones are hashtables.', 'Fix: keep long values in separate string keys and store only a short reference in the hash.', 'Fix: or raise <code>hash-max-listpack-value</code> modestly if all values are bounded.', 'Verify: those hashes report <code>listpack</code> again after being rewritten.']),
    CE('INCR on text', 'INCR fails with value is not an integer or out of range',
      '<b>One counter key errors</b> while other counters work.',
      'A rate limiter used <code>INCR</code> on a key that another service had set to a JSON blob, and later to a float string.',
      '<code>INCR</code> requires the value to parse as a 64-bit signed integer. Anything else, including <code>"3.5"</code> or a value that would overflow, is rejected. Floats need <code>INCRBYFLOAT</code>.',
      '127.0.0.1:6379> SET hits "3.5"\nOK\n127.0.0.1:6379> INCR hits\n(error) ERR value is not an integer or out of range\n127.0.0.1:6379> INCRBYFLOAT hits 1\n"4.5"',
      'The server rejects the command before any change, so the value is left as it was.',
      LK(DOC + 'commands/incr/', 'INCR command'),
      VZ([R('hits', ['"3.5" (not an integer)', 'bad', 1])], [BR('INCR result', 100, 'bad', 'ERR')], 'Wrong value shape.'),
      VZ([R('hits', ['integer string', 'ok', 1])], [BR('INCR result', 100, 'ok', 'integer reply')], 'One owner, one shape.'),
      ['Measure first: <code>GET key</code> and <code>TYPE key</code>; find which writer produced the bad value.', 'Fix: give counters their own key namespace and a single owning service.', 'Fix: use <code>INCRBYFLOAT</code> only where fractional values are intended.', 'Verify: the error rate for that command drops to zero.'])
  ] },
/* ---------------- ch3 ---------------- */
{ ask: 'A million sessions share a 30-minute TTL. How does Redis delete them without a pause, and when is memory really freed?',
  why: 'Scanning all keys for deadlines would block the executor, yet expired data must not be served or kept forever.',
  principle: 'Store an absolute deadline, check it on access, and reclaim untouched keys by bounded random sampling.',
  design: 'Lazy expiry on lookup plus an active cycle that samples keys and repeats only while many samples are expired.',
  scene: ['A marketing campaign created about a million sessions within a few minutes, each with a 30-minute TTL (illustrative). Thirty minutes later latency spikes at the top of the minute.',
          'After the campaign ends the dashboards still show high memory for a long time, although traffic is gone and the keys should have expired.'],
  predict: { q: 'A key expired 10 minutes ago and nobody has read it since. Is it still using memory?',
    opts: ['No, Redis frees a key at the exact second its TTL ends', 'Possibly yes, until a lookup touches it or the active cycle samples it', 'Yes, always, until you restart the server'], ans: 1,
    why: 'An expired key is logically gone: any access finds the deadline passed and deletes it. But Redis does not scan all keys. A random-sampling cycle reclaims untouched ones over time, so some can stay in memory for a while.' },
  idea: ['<b>Absolute deadline</b>: <code>EXPIRE</code> stores a unix time in the separate <code>expires</code> dictionary, so checking is a cheap lookup.',
         '<b>Lazy expiry</b>: every access calls <code>expireIfNeeded</code>; if the deadline passed, the key is deleted and treated as missing.',
         '<b>Active cycle</b> (<code>expire.c</code>): about 10 times per second, sample 20 keys with a TTL, delete the expired ones, and repeat while more than 10% were expired, within a time budget. <code>active-expire-effort</code> (1 to 10) raises the effort.',
         '<b>Replicas</b> do not expire keys on their own; they apply the <code>DEL</code> that the primary sends.'],
  arch: { w: 600, h: 230, cap: 'Two paths remove expired keys: the read path (lazy) and a periodic sampler (active).',
    boxes: [['rd', 10, 20, 130, 55, 'Read GET k\nlazy check', 0], ['ex', 200, 90, 150, 60, 'expires dict\nkey to deadline', 1], ['ac', 10, 165, 130, 55, 'Active cycle\nsample 20', 2], ['ks', 420, 90, 150, 60, 'Keyspace\nkeys and values', 3], ['rp', 420, 175, 150, 45, 'Replicas\nreceive DEL', 5]],
    arrows: [['rd', 'ex', 'deadline?'], ['ac', 'ex', 'sample'], ['ex', 'ks', 'delete'], ['ks', 'rp', 'DEL', true]] },
  pg: 'expire',
  common: [
    CE('Synchronised TTL', 'Synchronised TTLs expire at once and cause a latency spike',
      '<b>A latency spike repeats</b> at a regular interval, matching the TTL.',
      'A job writes 500,000 cache entries in one burst, all with <code>EXPIRE 1800</code> (illustrative).',
      'All keys share nearly one deadline, so the active cycle finds almost every sample expired and keeps repeating until its time budget runs out. That budget is spent on the executor thread, so clients see added latency.',
      '# representative output, values illustrative\n127.0.0.1:6379> INFO stats\nexpired_keys:512340\nexpired_stale_perc:0.62\nexpire_cycle_cpu_milliseconds:18400\n\n127.0.0.1:6379> LATENCY LATEST\n1) 1) "expire-cycle"\n   2) (integer) 1696733400\n   3) (integer) 25\n   4) (integer) 31',
      '<code>expired_keys</code> jumping and an <code>expire-cycle</code> latency event (milliseconds) show the cycle running long.',
      LK(DOC + 'commands/expire/', 'EXPIRE command'),
      VZ([R('deadlines', ['all at 12:00:00', 'bad', 1])], [BR('expire work in one second', 100, 'bad', 'cycle hits its budget')], 'Everything expires together.'),
      VZ([R('deadlines', ['spread over 5 minutes', 'ok', 1])], [BR('expire work in one second', 8, 'ok', 'small, steady')], 'Jitter spreads the work.'),
      ['Measure first: <code>INFO stats</code> (<code>expired_keys</code>, <code>expire_cycle_cpu_milliseconds</code>) and <code>LATENCY LATEST</code>.', 'Fix: add random jitter to TTLs, for example <code>1800 + random(0, 300)</code> seconds.', 'Fix: spread bulk writes over time instead of one burst.', 'Verify: the periodic spike disappears from the latency graph.']),
    CE('Stale keys', 'Expired keys pile up in memory when traffic is low',
      '<b>Memory stays high</b> long after keys should be gone; <code>DBSIZE</code> still counts them.',
      'After the campaign nobody reads those sessions again, so the lazy path never touches them.',
      'The active cycle stops when fewer than about 10% of a sample is expired, so a fraction of expired keys can remain. Low read traffic means the lazy path does not help either.',
      '127.0.0.1:6379> INFO keyspace\ndb0:keys=980000,expires=980000,avg_ttl=0   # illustrative\n127.0.0.1:6379> INFO stats\nexpired_stale_perc:8.4                     # illustrative',
      '<code>expired_stale_perc</code> estimates the share of keys that are expired but not yet deleted.',
      LK(DOC + 'commands/expire/', 'EXPIRE command, how Redis expires keys'),
      VZ([R('expired in memory', ['about 10% stay', 'bad', 1])], [BR('memory held by expired keys', 70, 'bad', 'high')], 'Cycle stops at the acceptable stale ratio.'),
      VZ([R('active-expire-effort', ['raised', 'ok', 1])], [BR('memory held by expired keys', 15, 'ok', 'low')], 'More aggressive reclaim.'),
      ['Measure first: <code>INFO stats</code> <code>expired_stale_perc</code> and <code>INFO memory</code> <code>used_memory</code> over time.', 'Fix: raise <code>active-expire-effort</code> (default 1, maximum 10) in steps; it costs more CPU and latency per cycle.', 'Fix: for one-off cleanup, run a bounded <code>SCAN</code> that touches keys so the lazy path deletes them.', 'Verify: <code>expired_stale_perc</code> falls and memory follows within a few cycles.']),
    CE('Lost TTL', 'A plain SET overwrite drops the TTL and keys live forever',
      '<b>Memory grows slowly without bound</b>; <code>TTL</code> on affected keys returns -1.',
      'Session refresh code does <code>SET sess:abc newvalue</code> after the key was created with <code>EX 1800</code>.',
      '<code>SET</code> replaces the value and, unless told otherwise, clears any existing TTL. The key is now persistent.',
      '127.0.0.1:6379> SET sess:abc v1 EX 1800\nOK\n127.0.0.1:6379> SET sess:abc v2\nOK\n127.0.0.1:6379> TTL sess:abc\n(integer) -1',
      '<code>TTL</code> of -1 means the key exists but has no expiry; -2 would mean it does not exist.',
      LK(DOC + 'commands/set/', 'SET command, KEEPTTL option'),
      VZ([R('sess:abc', ['SET without TTL', 'bad', 1], ['TTL -1', 'bad', 1])], [BR('keys without TTL', 60, 'bad', 'growing')], 'The overwrite cleared the TTL.'),
      VZ([R('sess:abc', ['SET ... KEEPTTL', 'ok', 1], ['TTL 1790', 'ok', 1])], [BR('keys without TTL', 0, 'ok', 'none')], 'KEEPTTL or SET with EX.'),
      ['Measure first: sample keys with <code>SCAN</code> and <code>TTL</code> to count persistent ones in the session namespace.', 'Fix: use <code>SET key value KEEPTTL</code> to keep the deadline, or set <code>EX</code> on every write.', 'Fix: add a monitor that alerts when keys under a TTL-only prefix have TTL -1.', 'Verify: new keys in the namespace always report a positive TTL.'])
  ] }
];

{ ask: 'The memory budget is full and a new key arrives. What do you throw away, and what if you throw away the wrong thing?',
  why: 'A byte budget forces a choice between rejecting writes and evicting live data.',
  principle: 'Approximate a global policy by sampling instead of keeping a global order.',
  design: 'Sample maxmemory-samples keys and evict the worst by idle time (LRU) or decayed frequency (LFU).',
  scene: ['The session cache runs with <code>maxmemory 2gb</code> (illustrative). At 21:00 a marketing push doubles logins and the dataset reaches the budget.',
          'Checkout starts failing with errors from Redis on every <code>SET</code>, while product pages that only read keep working. Nothing in the application changed.'],
  predict: { q: 'The policy is <code>noeviction</code> and memory is full. What happens to a <code>GET</code> and to a <code>SET</code> of a new key?',
    opts: ['Both fail', 'Redis evicts the oldest key and both work', 'GET works, SET fails with an OOM error'], ans: 2,
    why: '<code>noeviction</code> rejects commands that could grow memory (most writes) but still serves reads and deletes.' },
  idea: ['<b>maxmemory</b> is the byte budget. When used memory exceeds it, the next command that may add data triggers the policy.',
         '<b>Policies</b>: <code>noeviction</code>, <code>allkeys-lru</code>, <code>allkeys-lfu</code>, <code>allkeys-random</code> and the <code>volatile-*</code> variants that only consider keys with a TTL.',
         '<b>Sampled LRU</b> (<code>evict.c</code>): no global list. Redis samples <code>maxmemory-samples</code> keys (default 5) into an eviction pool and removes the one idle longest.',
         '<b>LFU</b> keeps a small logarithmic counter per key that decays over time (<code>lfu-log-factor</code>, <code>lfu-decay-time</code>), so a one-time scan does not push out hot keys.'],
  arch: { w: 600, h: 260, cap: 'Before a write, Redis compares used memory with the budget and, if over, evicts sampled victims first.',
    boxes: [['cmd', 10, 100, 120, 60, 'Command\nSET k v', 0], ['mem', 190, 100, 170, 60, 'Memory check\nused vs maxmemory', 1], ['pool', 440, 25, 150, 60, 'Eviction pool\nsampled keys', 2], ['ks', 440, 175, 150, 60, 'Keyspace\nthe data', 3]],
    arrows: [['cmd', 'mem', '1 needs bytes'], ['mem', 'pool', '2 over budget'], ['pool', 'ks', '3 evict worst']] },
  pg: 'eviction',
  common: [
    CE('OOM under noeviction', 'OOM command not allowed under noeviction',
      '<b>Writes fail, reads succeed</b>; the error text names maxmemory.',
      'The session cache has <code>maxmemory-policy noeviction</code>, which is the default. A traffic spike fills the budget.',
      'With <code>noeviction</code> the server refuses commands flagged as able to increase memory once the limit is reached, rather than discarding data it was told to keep.',
      `127.0.0.1:6379> SET sess:new v\n(error) OOM command not allowed when used memory > 'maxmemory'.\n127.0.0.1:6379> GET sess:old\n"v"\n127.0.0.1:6379> INFO memory\nused_memory_human:2.00G\nmaxmemory_human:2.00G\nmaxmemory_policy:noeviction`,
      'The OOM error comes from the policy, not from the operating system. <code>used_memory</code> equal to <code>maxmemory</code> confirms it.',
      LK(DOC + 'develop/reference/eviction/', 'Key eviction'),
      VZ([R('policy', ['noeviction', 'bad', 1])], [BR('used / maxmemory', 100, 'bad', '2.00G of 2.00G'), BR('writes', 0, 'bad', 'rejected')], 'Budget full, writes refused.'),
      VZ([R('policy', ['allkeys-lru', 'ok', 1])], [BR('used / maxmemory', 98, 'warn', 'at the cap'), BR('writes', 100, 'ok', 'accepted')], 'Cold keys are evicted to make room.'),
      ['Measure first: <code>INFO memory</code> (<code>used_memory</code>, <code>maxmemory</code>) and <code>INFO stats</code> (<code>evicted_keys</code>).', 'Fix: for a cache, choose <code>allkeys-lru</code> or <code>allkeys-lfu</code>; keep <code>noeviction</code> only where data must never be dropped.', 'Fix: right-size <code>maxmemory</code> and add TTLs so the working set fits.', 'Verify: writes succeed at peak and <code>evicted_keys</code> reflects the expected churn, with an acceptable hit rate.']),
    CE('volatile without TTL', 'A volatile-* policy with no TTL keys behaves like noeviction',
      '<b>OOM errors appear</b> although an eviction policy is configured.',
      'The team switched to <code>volatile-lru</code> to protect permanent keys, but the session writer forgot to set TTLs.',
      '<code>volatile-*</code> policies only consider keys that have an expiry. If none do, there is nothing to evict and the server returns the same OOM error as <code>noeviction</code>.',
      `127.0.0.1:6379> CONFIG GET maxmemory-policy\n1) "maxmemory-policy"\n2) "volatile-lru"\n127.0.0.1:6379> INFO keyspace\ndb0:keys=3200000,expires=0,avg_ttl=0   # illustrative\n127.0.0.1:6379> SET sess:new v\n(error) OOM command not allowed when used memory > 'maxmemory'.`,
      '<code>expires=0</code> in <code>INFO keyspace</code> means no key is eligible for a volatile policy.',
      LK(DOC + 'develop/reference/eviction/', 'Key eviction'),
      VZ([R('keys with TTL', ['0 of 3.2M', 'bad', 1])], [BR('eviction candidates', 0, 'bad', 'none')], 'Nothing to evict.'),
      VZ([R('keys with TTL', ['3.2M of 3.2M', 'ok', 1])], [BR('eviction candidates', 100, 'ok', 'all sessions')], 'TTL on every cache key.'),
      ['Measure first: <code>INFO keyspace</code> compare <code>keys</code> and <code>expires</code>.', 'Fix: set a TTL on every key that may be evicted, or use an <code>allkeys-*</code> policy.', 'Fix: keep permanent data in a separate instance from cache data.', 'Verify: <code>evicted_keys</code> increases at the cap and OOM replies stop.']),
    CE('Fragmentation', 'High mem_fragmentation_ratio: RSS far above used memory',
      '<b>The host runs out of RAM</b> while Redis reports less used memory than the process footprint.',
      'After days of churn with many different value sizes, the process resident set is about 1.8 times the memory Redis counts (illustrative).',
      'The allocator (jemalloc) cannot return freed pages that are partly in use. Resident memory stays above the logical <code>used_memory</code>, which is also what <code>maxmemory</code> counts.',
      '127.0.0.1:6379> INFO memory\nused_memory:2147483648\nused_memory_rss:3865470566       # illustrative\nmem_fragmentation_ratio:1.80     # illustrative\nallocator_frag_ratio:1.62        # illustrative',
      'A ratio well above 1 means wasted resident pages. A ratio below 1 would instead hint at swapping.',

      VZ([R('used_memory', ['2.0 GB', 'ok', 1]), R('RSS', ['3.6 GB', 'bad', 1])], [BR('resident / used', 100, 'bad', '1.8x')], 'Freed memory not returned.'),
      VZ([R('used_memory', ['2.0 GB', 'ok', 1]), R('RSS', ['2.2 GB', 'ok', 1])], [BR('resident / used', 55, 'ok', '1.1x')], 'After defragmentation.'),
      ['Measure first: <code>INFO memory</code> fields <code>mem_fragmentation_ratio</code> and <code>allocator_frag_ratio</code>.', 'Fix: enable <code>activedefrag yes</code> (it runs in the main thread, so tune its CPU limits and watch latency).', 'Fix: or fail over to a fresh replica and restart the old primary to reset the allocator state.', 'Verify: RSS falls toward <code>used_memory</code> and the ratio returns to about 1.0 to 1.2.'])
  ] },
/* ---------------- ch5 ---------------- */
{ ask: 'The machine loses power right after Redis replied OK. What survives the restart, and what does that choice cost?',
  why: 'Memory is volatile, so durability needs a log or a snapshot, each with a different loss window and cost.',
  principle: 'Durability is a declared policy: pick how often data reaches disk and accept the matching cost.',
  design: 'An append-only file with an fsync policy, plus RDB snapshots written by a forked child and renamed atomically.',
  scene: ['The order-event queue shares the cache Redis. A rack loses power at 10:03 (illustrative). After restart, the last seconds of orders are missing, and the team had assumed everything acknowledged was safe.',
          'Later, an engineer proposes <code>appendfsync always</code> to fix it, but the same week a snapshot on a big instance had caused a visible stall and a memory scare.'],
  predict: { q: 'With <code>appendfsync everysec</code>, power fails. What is the worst-case loss of acknowledged writes?',
    opts: ['Nothing, the AOF is written before every reply', 'Everything since the last RDB snapshot', 'About one to two seconds of writes'], ans: 2,
    why: 'With <code>everysec</code> the AOF is fsynced once per second by a background thread, so you lose roughly the last second of writes, up to about two if an fsync was still in flight. <code>always</code> shrinks the window but costs throughput.' },
  idea: ['<b>AOF</b>: every write command is appended to a log. <code>appendfsync</code> sets when it is forced to disk: <code>always</code>, <code>everysec</code> (default) or <code>no</code> (the OS decides).',
         '<b>AOF rewrite</b>: a background child compacts the log; in Redis 7 the AOF is multi-part (a base file plus incremental files in <code>appendonlydir</code>).',
         '<b>RDB snapshot</b>: <code>fork</code> a child that writes the dataset to a temp file, then renames it. Copy-on-write shares pages until the parent modifies them. Triggered by <code>save</code> rules or <code>BGSAVE</code>.',
         '<b>Restart</b>: with the AOF enabled Redis loads it (it is more complete than the RDB). A truncated tail is handled by <code>aof-load-truncated</code> or <code>redis-check-aof --fix</code>.'],
  arch: { w: 600, h: 260, cap: 'Writes go to memory and the AOF buffer; fsync policy and snapshots decide what survives power loss.',
    boxes: [['w', 10, 100, 110, 60, 'Write\nSET k v', 0], ['mem', 170, 100, 130, 60, 'Memory\nkeyspace', 1], ['aof', 360, 20, 150, 60, 'AOF buffer\nthen fsync', 2], ['rdb', 360, 105, 150, 60, 'fork child\nRDB snapshot', 3], ['disk', 360, 190, 150, 55, 'Disk\nappendonlydir, dump.rdb', 4]],
    arrows: [['w', 'mem', ''], ['mem', 'aof', 'append'], ['mem', 'rdb', 'fork, COW'], ['aof', 'disk', 'fsync'], ['rdb', 'disk', 'rename']] },
  pg: 'persistence',
  common: [
    CE('MISCONF', 'MISCONF: Redis is unable to persist and rejects writes',
      '<b>All writes fail</b> with MISCONF while reads still work.',
      'A disk fills up. A background save fails, and <code>stop-writes-on-bgsave-error</code> is enabled (the default).',
      'If the last RDB save failed, Redis refuses writes so the operator notices that persistence is broken, rather than silently accepting data it cannot save.',
      `127.0.0.1:6379> SET a 1\n(error) MISCONF Redis is configured to save RDB snapshots, but it's currently unable to persist to disk. Commands that may modify the data set are disabled, because this instance is configured to report errors during writes if RDB snapshotting fails (stop-writes-on-bgsave-error option). Please check the Redis logs for details about the RDB error.\n\n127.0.0.1:6379> INFO persistence\nrdb_last_bgsave_status:err`,
      '<code>rdb_last_bgsave_status:err</code> confirms the cause; the Redis log names the failing system call (for example a write error or no space).',
      LK(DOC + 'operate/oss_and_stack/management/persistence/', 'Redis persistence'),
      VZ([R('disk', ['100% full', 'bad', 1]), R('last bgsave', ['err', 'bad', 1])], [BR('writes', 0, 'bad', 'MISCONF')], 'Persistence broken, writes refused.'),
      VZ([R('disk', ['40% used', 'ok', 1]), R('last bgsave', ['ok', 'ok', 1])], [BR('writes', 100, 'ok', 'accepted')], 'Space restored, save succeeds.'),
      ['Measure first: <code>INFO persistence</code> and the server log, plus <code>df -h</code> on the data directory.', 'Fix: free or add disk space, then run <code>BGSAVE</code>; the error clears after a successful save.', 'Fix: alert on <code>rdb_last_bgsave_status</code> and free-space thresholds; size the disk for the dataset plus a rewrite.', 'Verify: <code>rdb_last_bgsave_status:ok</code> and writes succeed.']),
    CE('Fork stall', 'A fork on a large dataset stalls Redis and copy-on-write doubles memory',
      '<b>A latency spike at snapshot time</b>, and sometimes the kernel OOM killer ends the process.',
      'A 24 GB primary (illustrative) takes a snapshot at peak write traffic.',
      '<code>fork</code> copies the page tables, which takes time proportional to the dataset. While the child runs, each page the parent modifies is copied (copy-on-write). A write-heavy workload can make the copies approach the dataset size.',
      '127.0.0.1:6379> INFO stats\nlatest_fork_usec:480000        # illustrative, microseconds\n127.0.0.1:6379> INFO persistence\nrdb_last_cow_size:9663676416   # illustrative\n\n# server log (representative)\nBackground saving started by pid 18211\nDB saved on disk',
      '<code>latest_fork_usec</code> is the pause caused by the fork itself; <code>rdb_last_cow_size</code> shows the extra memory used during the last save.',
      LK(DOC + 'operate/oss_and_stack/management/persistence/', 'Redis persistence'),
      VZ([R('fork', ['480 ms pause', 'bad', 1]), R('COW', ['+9 GB', 'bad', 1])], [BR('host memory', 98, 'bad', 'near OOM')], 'Fork pause plus copy-on-write.'),
      VZ([R('fork', ['replica snapshots', 'ok', 1]), R('COW', ['+1 GB', 'ok', 1])], [BR('host memory', 60, 'ok', 'headroom')], 'Snapshot off-peak, on a replica.'),
      ['Measure first: <code>latest_fork_usec</code>, <code>rdb_last_cow_size</code> and host memory during a save.', 'Fix: leave memory headroom for copy-on-write, schedule snapshots off-peak, or snapshot on a replica instead of the primary.', 'Fix: use a hypervisor with fast fork, and disable transparent huge pages as the Redis docs advise.', 'Verify: the fork pause is within the latency budget and memory stays below the host limit during a save.']),
    CE('Truncated AOF', 'A truncated AOF after a crash blocks startup',
      '<b>Redis refuses to start</b> or starts with a warning about an unexpected end of the AOF.',
      'The host crashed while the AOF was being appended, leaving a half-written command at the tail.',
      'On startup Redis replays the AOF. A cut-off last command is detected. With <code>aof-load-truncated yes</code> (default) it loads what it can and logs a warning; otherwise it exits so the operator decides.',
      '# server log (representative, wording varies by version)\n* Reading RDB base file on AOF loading...\n! Bad file format reading the append only file appendonly.aof.1.incr.aof: make a backup of your AOF file, then use ./redis-check-aof --fix <filename.manifest>\n\n$ redis-check-aof --fix appendonlydir/appendonly.aof.manifest',
      'In Redis 7 the check tool takes the manifest file. Always back up the directory before using <code>--fix</code>.',
      LK(DOC + 'operate/oss_and_stack/management/persistence/', 'Redis persistence'),
      VZ([R('AOF tail', ['half-written command', 'bad', 1])], [BR('startup', 0, 'bad', 'refuses or warns')], 'Tail is cut mid-command.'),
      VZ([R('AOF tail', ['trimmed to last good command', 'ok', 1])], [BR('startup', 100, 'ok', 'loads')], 'After redis-check-aof --fix.'),
      ['Measure first: read the startup log and run <code>redis-check-aof</code> without <code>--fix</code> to see the damaged offset.', 'Fix: back up <code>appendonlydir</code>, then run <code>redis-check-aof --fix</code> on the manifest; keep <code>aof-load-truncated yes</code> for automatic recovery.', 'Fix: use <code>appendfsync everysec</code> or <code>always</code> to narrow the window, and keep a replica as a second copy.', 'Verify: Redis starts, <code>DBSIZE</code> is plausible, and the last acknowledged order is checked against the source of truth.']),
    CE('Slow fsync', 'AOF fsync is taking too long and writes slow down',
      '<b>Intermittent latency spikes</b> with a warning in the log, worse during a rewrite.',
      'The AOF is on a disk shared with another busy service, with <code>appendfsync everysec</code>.',
      'The fsync runs in a background thread, but if the previous fsync is still running after about two seconds the main thread writes anyway, which can block on a busy disk.',
      '# server log (representative)\nAsynchronous AOF fsync is taking too long (disk is busy?). Writing the AOF buffer without waiting for fsync to complete, this may slow down Redis.\n\n127.0.0.1:6379> INFO persistence\naof_delayed_fsync:42',
      '<code>aof_delayed_fsync</code> counts how many times this happened.',
      LK(DOC + 'operate/oss_and_stack/management/persistence/', 'Redis persistence'),
      VZ([R('disk', ['shared, busy', 'bad', 1])], [BR('aof_delayed_fsync', 80, 'bad', 'growing')], 'Disk contention.'),
      VZ([R('disk', ['dedicated volume', 'ok', 1])], [BR('aof_delayed_fsync', 0, 'ok', 'flat')], 'Isolated I/O.'),
      ['Measure first: <code>aof_delayed_fsync</code> in <code>INFO persistence</code> and disk latency with <code>iostat</code>.', 'Fix: move the AOF to a dedicated or faster volume; avoid sharing it with other heavy writers.', 'Fix: consider <code>no-appendfsync-on-rewrite yes</code> only if you accept a larger loss window during rewrites.', 'Verify: <code>aof_delayed_fsync</code> stops increasing and the warning disappears.'])
  ] },

{ ask: 'A replica on a flaky link keeps doing full resyncs. How does a replica catch up, and when can it only start over?',
  why: 'A second copy is only useful if it can catch up cheaply after a disconnect.',
  principle: 'Stream writes in order, numbered by byte offset, so a replica can resume from where it stopped.',
  design: 'Replication ID plus offset, a bounded backlog ring for partial resync, and an RDB full sync when the gap is too old.',
  scene: ['A read replica sits in another availability zone behind a flaky link. Every few minutes it drops for about 30 seconds (illustrative) and then reconnects.',
          'Each reconnect makes the primary fork, write a full RDB and push it across the network. The primary network saturates, replica lag grows, and some syncs never finish.'],
  predict: { q: 'The replica is disconnected for 30 s while the primary takes 10 MB/s of writes. The replication backlog is 1 MB. Partial or full resync?',
    opts: ['Full, because the 300 MB gap does not fit in the 1 MB backlog', 'Partial, the replica asks for the missing commands', 'Neither, the replica stays out of sync until restarted'], ans: 0,
    why: 'A partial resync (<code>PSYNC</code>) is possible only if the backlog still holds every byte after the replica offset. 300 MB of writes overwrote the 1 MB ring, so the primary must send a full RDB.' },
  idea: ['<b>Replication ID and offset</b>: the primary numbers its write stream by bytes. <code>INFO replication</code> shows <code>master_repl_offset</code> and each replica offset.',
         '<b>Backlog</b>: a ring buffer of recent writes sized by <code>repl-backlog-size</code> (1 MB default). It lets a returning replica resume with <code>PSYNC</code>.',
         '<b>Full sync</b>: the primary forks, writes an RDB, ships it, and buffers new writes in the replica client output buffer (<code>client-output-buffer-limit replica</code>).',
         '<b>Asynchronous</b>: replicas acknowledge offsets periodically; the primary does not wait for them, so replica reads can be stale.'],
  arch: { w: 600, h: 250, cap: 'The backlog decides whether a returning replica resumes or restarts.',
    boxes: [['pr', 10, 90, 120, 60, 'Primary\nwrites', 0], ['bl', 190, 20, 150, 60, 'Backlog ring\nrepl-backlog-size', 2], ['rdb', 190, 165, 150, 60, 'Full sync\nRDB + buffer', 3], ['rp', 440, 90, 140, 60, 'Replica\nreplica offset', 1]],
    arrows: [['pr', 'bl', 'every write'], ['bl', 'rp', 'PSYNC partial'], ['pr', 'rdb', 'gap too old', true], ['rdb', 'rp', 'RDB stream']] },
  pg: 'replication',
  common: [
    CE('Backlog too small', 'A backlog that is too small turns every blip into a full resync',
      '<b>Network spikes and primary forks</b> after each short disconnect.',
      'The default 1 MB backlog is far smaller than the write volume during a 30 second disconnect.',
      'If the replica offset falls out of the backlog, PSYNC cannot continue and the primary must do a full sync. A bigger ring turns the same blip into a short partial transfer.',
      '# primary log (representative, wording varies by version)\nPartial resynchronization request from 10.0.2.7:6379 rejected: Unable to partial resync with replica 10.0.2.7:6379 for lack of backlog (Slave request was: 884400121).\nStarting BGSAVE for SYNC with target: disk\n\n127.0.0.1:6379> INFO stats\nsync_full:37\nsync_partial_ok:2\nsync_partial_err:35',
      '<code>sync_full</code> and <code>sync_partial_err</code> rising together point to a backlog that is too small for the disconnect length.',
      LK(DOC + 'operate/oss_and_stack/management/replication/', 'Redis replication'),
      VZ([R('backlog', ['1 MB', 'bad', 1]), R('gap', ['300 MB', 'bad', 1])], [BR('sync_full', 90, 'bad', 'every blip')], 'Gap exceeds the ring.'),
      VZ([R('backlog', ['512 MB', 'ok', 1]), R('gap', ['300 MB', 'ok', 1])], [BR('sync_partial_ok', 90, 'ok', 'resumes')], 'Gap fits.'),
      ['Measure first: <code>sync_full</code>, <code>sync_partial_ok</code> and <code>sync_partial_err</code> in <code>INFO stats</code>.', 'Fix: set <code>repl-backlog-size</code> to at least write rate times the longest disconnect you want to survive, plus headroom.', 'Fix: improve the link, or place replicas where disconnects are shorter.', 'Verify: after a blip the replica log shows partial resynchronization and no new RDB is created.']),
    CE('Sync loop', 'A full sync exceeds the replica output-buffer limit and loops forever',
      '<b>The replica never becomes healthy</b>; the primary logs a closed replica client and starts again.',
      'The dataset is large and takes minutes to transfer. Writes during that time pile up for the replica.',
      'During a full sync, new writes are buffered in the replica client output buffer. For the <code>replica</code> class the default limit is hard 256 MB or soft 64 MB for 60 s. If it is exceeded, the primary closes the connection and the replica starts the sync again.',
      '# representative output, wording varies by version\nclient-output-buffer-limit replica 256mb 64mb 60\n\n# primary log\nClient id=9 addr=10.0.2.7:51412 name= ... flags=S ... scheduled to be closed ASAP for overcoming of output buffer limits.\nConnection with replica 10.0.2.7:6379 lost.',
      'A repeated pattern of sync start then client closed for output buffer is the signature of this loop.',
      LK(DOC + 'operate/oss_and_stack/management/replication/', 'Redis replication'),
      VZ([R('writes during sync', ['600 MB buffered', 'bad', 1]), R('limit', ['256 MB hard', 'warn', 1])], [BR('sync result', 0, 'bad', 'restarts')], 'Buffer over the hard limit.'),
      VZ([R('writes during sync', ['600 MB buffered', 'ok', 1]), R('limit', ['1 GB hard', 'ok', 1])], [BR('sync result', 100, 'ok', 'completes')], 'Limit above the buffered writes.'),
      ['Measure first: the primary log and <code>INFO replication</code> (replica state and offsets); estimate write rate times sync duration.', 'Fix: raise <code>client-output-buffer-limit replica</code> above the expected buffer, and check memory headroom for it.', 'Fix: shorten the sync by speeding up disk and network, or reduce write bursts during the sync.', 'Verify: the replica reaches <code>state=online</code> and the sync completes in one attempt.']),
    CE('Stale replica reads', 'Reads from a replica are stale under asynchronous lag',
      '<b>Users do not see their own update</b> for a moment after writing it.',
      'The cart service writes to the primary and reads the cart back from a replica to spread load.',
      'Replication is asynchronous: the primary replies before the replica applies the write. A read that lands on the replica in that window returns the old value, so read-your-writes breaks.',
      '127.0.0.1:6379> HSET cart:42 item:9 2     # primary\n(integer) 1\n\n127.0.0.1:6380> HGET cart:42 item:9      # replica, 5 ms later (illustrative)\n(nil)\n\n127.0.0.1:6379> INFO replication\nconnected_slaves:1\nslave0:ip=10.0.2.7,port=6380,state=online,offset=884400100,lag=0',
      'Compare <code>master_repl_offset</code> with the replica offset to see how far behind it is. <code>lag</code> is in seconds, so short windows are invisible there.',
      LK(DOC + 'operate/oss_and_stack/management/replication/', 'Redis replication'),
      VZ([R('write', ['primary at offset 100', 'ok', 1]), R('read', ['replica at offset 90', 'bad', 1])], [BR('read freshness', 20, 'bad', 'stale')], 'Replica behind the write.'),
      VZ([R('write then read', ['primary at offset 100', 'ok', 1])], [BR('read freshness', 100, 'ok', 'fresh')], 'Critical reads use the primary.'),
      ['Measure first: compare <code>master_repl_offset</code> with each replica offset in <code>INFO replication</code>.', 'Fix: read your own writes from the primary (for example for a short time after a write), and use replicas for tolerant reads.', 'Fix: use <code>WAIT numreplicas timeout</code> after a critical write; it narrows but does not remove the risk of loss on failover.', 'Verify: no user-visible stale reads in the flows that need read-your-writes.']),
    CE('READONLY replica', 'The application writes to a replica and gets READONLY',
      '<b>Writes fail</b> with a READONLY error after a failover or a config change.',
      'A service uses a fixed hostname that now points to a replica, or a DNS entry was swapped without the client knowing.',
      'Replicas default to <code>replica-read-only yes</code>, so they reject writes to keep data consistent with the primary.',
      '127.0.0.1:6380> SET a 1\n(error) READONLY You can\'t write against a read only replica.\n127.0.0.1:6380> INFO replication\nrole:slave\nmaster_host:10.0.2.5',
      '<code>role:slave</code> in <code>INFO replication</code> confirms the node is a replica; its <code>master_host</code> shows where the writes should go.',
      LK(DOC + 'operate/oss_and_stack/management/replication/', 'Redis replication'),
      VZ([R('client target', ['replica 10.0.2.7', 'bad', 1])], [BR('writes', 0, 'bad', 'READONLY')], 'Wrong node.'),
      VZ([R('client target', ['primary 10.0.2.5', 'ok', 1])], [BR('writes', 100, 'ok', 'accepted')], 'Writes follow the primary.'),
      ['Measure first: <code>ROLE</code> or <code>INFO replication</code> on the node the client uses.', 'Fix: point writes at the primary, ideally through a client that discovers it (Sentinel or Cluster aware).', 'Fix: do not disable <code>replica-read-only</code> as a workaround; writes to a replica are lost on resync.', 'Verify: write errors drop to zero and the client logs show the primary address.'])
  ] },

{ ask: 'Moving credit between two balances takes several commands. How do you keep another client from seeing or changing the halfway state?',
  why: 'Several commands are not one unit: other clients can run between them unless you group them.',
  principle: 'Reduce round trips with pipelines, and get isolation from MULTI/EXEC, WATCH, or a script.',
  design: 'Pipeline sends many commands at once; MULTI queues and EXEC runs them back to back; WATCH aborts EXEC if a key changed.',
  scene: ['A loyalty feature moves 10 credits from balance A to balance B with two commands. During a promotion another service spends from A at the same moment (illustrative).',
          'Finance finds that some accounts ended with negative balances, and an audit job that sums A and B sometimes sees 140 instead of 150. The team had wrapped the calls in a pipeline and assumed it was safe.'],
  predict: { q: 'Client A pipelines three <code>INCR</code> commands in one write. Can client B\'s <code>GET</code> run between them?',
    opts: ['No, a pipeline is atomic', 'Yes, the server may run B\'s command between pipelined ones', 'Only if the pipeline has more than 100 commands'], ans: 1,
    why: 'A pipeline only batches the network round trips. The server still handles each command separately, so commands from other clients can interleave. Atomic grouping needs MULTI/EXEC or a script.' },
  idea: ['<b>Pipelining</b> sends many commands without waiting for replies. It saves round trips but gives no atomicity or isolation.',
         '<b>MULTI/EXEC</b> queues commands and runs them back to back with nothing in between. A command with a queue-time error makes EXEC fail with <code>EXECABORT</code>; a runtime error does not roll back the others.',
         '<b>WATCH</b> gives optimistic locking: if a watched key changes before EXEC, EXEC returns nil and nothing runs, and the client retries.',
         '<b>Scripts and Functions</b> (<code>EVAL</code>, <code>FCALL</code>) run read-decide-write logic as one atomic step, which avoids WATCH retry loops under contention.'],
  arch: { w: 600, h: 240, cap: 'EXEC runs the queued commands as one uninterrupted block; WATCH decides whether EXEC may run at all.',
    boxes: [['cl', 10, 90, 110, 60, 'Client A\nMULTI ...', 0], ['qu', 170, 90, 130, 60, 'Command queue\nQUEUED', 1], ['wt', 170, 175, 130, 50, 'WATCH check\nkey changed?', 5], ['ex', 365, 90, 130, 60, 'EXEC\nback to back', 3], ['ks', 520, 90, 70, 60, 'Keys', 4]],
    arrows: [['cl', 'qu', 'queue'], ['qu', 'ex', 'EXEC'], ['wt', 'ex', 'abort if dirty', true], ['ex', 'ks', 'apply']] },
  pg: 'multi',
  common: [
    CE('Pipeline not atomic', 'Pipelining is not atomic: an intermediate state is visible',
      '<b>Totals do not add up</b> for a short time; audits see missing credit.',
      'A transfer pipelines <code>DECRBY a 10</code> and <code>INCRBY b 10</code>. An audit reads both between them.',
      'Each pipelined command is its own unit of execution. Other clients run between them, so they can read the state after the first command and before the second.',
      '# client A (pipeline)        # client B (audit)\nDECRBY a 10                   GET a  -> 90\n                              GET b  -> 50   (sum 140)\nINCRBY b 10\n# representative sequence, values illustrative',
      'The sum of 140 appears only between the two commands; it is a real, visible intermediate state.',
      LK(DOC + 'develop/use/pipelining/', 'Using pipelining'),
      VZ([R('A pipeline', ['DECRBY a 10', 'ok', 1], ['INCRBY b 10', 'warn', 1]), R('B audit', ['reads between', 'bad', 1])], [BR('sum a+b seen by B', 93, 'bad', '140 instead of 150')], 'Interleaving is allowed.'),
      VZ([R('A MULTI/EXEC', ['both run together', 'ok', 1]), R('B audit', ['before or after', 'ok', 1])], [BR('sum a+b seen by B', 100, 'ok', '150 always')], 'EXEC is not interleaved.'),
      ['Measure first: reproduce with two clients and a trace of the command order; check whether the code uses a pipeline.', 'Fix: wrap dependent commands in <code>MULTI</code> / <code>EXEC</code>, or use a Lua script or a Function.', 'Fix: keep pipelines for throughput of independent commands only.', 'Verify: the audit never sees a partial sum under load.']),
    CE('EXEC runtime error', 'A runtime error inside EXEC leaves the other commands applied',
      '<b>A transaction half applied</b> without any rollback.',
      'A queued <code>INCR</code> targets a key that holds a string, while the preceding <code>SET</code> succeeds.',
      'Redis does not roll back. Commands that pass queue-time checks all run; one that fails at execution time returns its error while the others still apply.',
      '127.0.0.1:6379> SET name "bob"\nOK\n127.0.0.1:6379> MULTI\nOK\n127.0.0.1:6379(TX)> SET total 10\nQUEUED\n127.0.0.1:6379(TX)> INCR name\nQUEUED\n127.0.0.1:6379(TX)> EXEC\n1) OK\n2) (error) ERR value is not an integer or out of range',
      'The first command applied even though the second failed.',
      LK(DOC + 'develop/interact/transactions/', 'Transactions'),
      VZ([R('EXEC', ['SET total ok', 'ok', 1], ['INCR name fails', 'bad', 1])], [BR('state', 50, 'bad', 'half applied')], 'No rollback.'),
      VZ([R('validate first', ['types checked', 'ok', 1]), R('EXEC', ['all apply', 'ok', 1])], [BR('state', 100, 'ok', 'consistent')], 'Check preconditions before queueing.'),
      ['Measure first: inspect each reply in the EXEC array; the error is in its own element.', 'Fix: check types and preconditions before queueing, or use a script that validates then writes.', 'Fix: design commands so partial application is safe to repeat (idempotent).', 'Verify: tests that inject a bad key type show a consistent final state.']),
    CE('WATCH starvation', 'A WATCH retry loop starves under contention',
      '<b>Latency and CPU rise</b> for one hot key as retries pile up.',
      'Every checkout does <code>WATCH stock:9</code>, reads it, then <code>MULTI</code>/<code>EXEC</code>. During a flash sale hundreds of clients target the same key.',
      'EXEC aborts whenever any other client changes the key after WATCH. With heavy contention most attempts abort and retry, wasting round trips; some clients may keep losing.',
      '127.0.0.1:6379> WATCH stock:9\nOK\n127.0.0.1:6379> GET stock:9\n"4"\n127.0.0.1:6379> MULTI\nOK\n127.0.0.1:6379(TX)> DECR stock:9\nQUEUED\n127.0.0.1:6379(TX)> EXEC\n(nil)      # another client changed stock:9, retry',
      'A nil reply from EXEC means it was aborted by WATCH; the application must retry.',
      LK(DOC + 'develop/interact/transactions/', 'Transactions, optimistic locking with WATCH'),
      VZ([R('attempts', ['most abort', 'bad', 1])], [BR('successful per attempt', 15, 'bad', 'low'), BR('retries', 85, 'bad', 'many')], 'Optimistic locking under heavy contention.'),
      VZ([R('script', ['read, check, decrement in one step', 'ok', 1])], [BR('successful per attempt', 100, 'ok', 'no retries')], 'Atomic script.'),
      ['Measure first: count nil EXEC replies and retries per request in the application metrics.', 'Fix: move the read-check-write into a Lua script or a Function so it runs atomically with no retry.', 'Fix: otherwise cap retries and add backoff with jitter.', 'Verify: retries per request fall toward zero while stock never goes negative.']),
    CE('EXECABORT', 'EXECABORT discards the whole transaction after a queue-time error',
      '<b>Nothing in the transaction ran</b>, and the client sees EXECABORT.',
      'A queued command had the wrong number of arguments after a client library upgrade.',
      'Errors detected while queueing, such as a syntax error or wrong arity, mark the transaction dirty. EXEC then refuses to run any of it.',
      `127.0.0.1:6379> MULTI\nOK\n127.0.0.1:6379(TX)> SET a\n(error) ERR wrong number of arguments for 'set' command\n127.0.0.1:6379(TX)> SET b 2\nQUEUED\n127.0.0.1:6379(TX)> EXEC\n(error) EXECABORT Transaction discarded because of previous errors.`,
      'The second command was queued, but EXEC ran nothing because of the earlier error.',
      LK(DOC + 'develop/interact/transactions/', 'Transactions'),
      VZ([R('queue', ['SET a (error)', 'bad', 1], ['SET b 2', 'warn', 1])], [BR('commands run', 0, 'bad', 'none')], 'Discarded at EXEC.'),

{ ask: 'At 3 a.m. the primary stops answering. Who decides it is dead, who takes over, and what happens to writes it accepted meanwhile?',

  principle: 'Failure detection needs agreement, and the new leader must fence the old one.',

          'Sentinel promotes a replica within seconds and traffic recovers. In the morning the support team reports orders that customers saw confirmed but that do not exist, a few hundred in total (illustrative).'],

    why: 'Redis has no merge. When the old primary rejoins it is turned into a replica of the new primary and does a full resync, discarding what it accepted alone. <code>min-replicas-to-write</code> limits how long it keeps accepting writes while cut off.' },
  idea: ['<b>SDOWN</b>: one Sentinel sees the primary unreachable for <code>down-after-milliseconds</code>. <b>ODOWN</b>: at least <code>quorum</code> Sentinels agree.',
         '<b>Leader election</b>: Sentinels vote for one leader per failover epoch; the leader needs a majority of all known Sentinels, not just the quorum.',
         '<b>Promotion</b>: the leader picks a replica by <code>replica-priority</code>, then replication offset, then run ID, promotes it, and reconfigures the others. The <b>config epoch</b> makes the newest configuration win.',
         '<b>Limiting damage</b>: <code>min-replicas-to-write</code> and <code>min-replicas-max-lag</code> make a primary that lost its replicas refuse writes (<code>NOREPLICAS</code>). Clients ask Sentinel for the current primary instead of hard-coding it.'],

    arrows: [['s1', 'pr', 'PING'], ['s2', 'pr', 'PING'], ['s3', 'rp', 'promote'], ['pr', 'rp', 'async stream', true], ['cl', 's2', 'where is primary?', true]] },

      VZ([R('old primary', ['refuses after max-lag', 'ok', 1]), R('after heal', ['resync', 'ok', 1])], [BR('writes lost', 10, 'warn', 'bounded window')], 'min-replicas-to-write bounds the loss.'),
      ['Measure first: compare timestamps in the Sentinel log (<code>+sdown</code>, <code>+switch-master</code>) with client write logs.', 'Fix: set <code>min-replicas-to-write 1</code> and a small <code>min-replicas-max-lag</code> so an isolated primary refuses writes (<code>NOREPLICAS</code>).', 'Fix: make critical writes idempotent and reconcile them against a source of truth.', 'Verify: in a partition drill the number of lost writes stays within the configured window.']),
    CE('Sentinels co-located', 'Sentinels on one host fail together and there is no quorum',

      ['Measure first: <code>SENTINEL ckquorum mymaster</code> and the placement of every Sentinel.', 'Fix: run at least three Sentinels in separate failure domains from each other and from the primary.', 'Fix: keep <code>quorum</code> at a majority of the Sentinels you run.', 'Verify: a drill that kills the primary host still produces <code>+switch-master</code>.']),
    CE('Hard-coded primary', 'Clients keep a hard-coded primary address and write to the demoted node',
      '<b>READONLY or lost writes</b> after a failover because clients never learned the new primary.',

      '10.0.1.5:6379> SET order:9 paid\n(error) READONLY You can\'t write against a read only replica.\n\n127.0.0.1:26379> SENTINEL get-master-addr-by-name mymaster\n1) "10.0.1.6"\n2) "6379"',

      VZ([R('client', ['asks Sentinel', 'ok', 1])], [BR('writes accepted', 100, 'ok', 'follows the primary')], 'Sentinel-aware client.'),
      ['Measure first: <code>SENTINEL get-master-addr-by-name</code> versus the address in the client config.', 'Fix: use a client with Sentinel support, or put discovery behind a stable endpoint that follows the primary.', 'Fix: on a READONLY error, re-resolve the primary and retry.', 'Verify: during a failover drill writes resume within the expected window without a client restart.']),
    CE('Failover flapping', 'A down-after-milliseconds that is too low causes failover flapping',
      '<b>Repeated failovers</b> during GC pauses or short network blips, each causing a resync.',
      'The team lowered <code>down-after-milliseconds</code> to speed up recovery, and a brief stall now looks like a failure.',
      'Sentinel treats any silence longer than that threshold as SDOWN. A short pause on a healthy node can reach ODOWN and trigger a promotion, which is more disruptive than the blip.',
      '# sentinel log (representative)\n+sdown master mymaster 10.0.1.5 6379\n+odown master mymaster 10.0.1.5 6379 #quorum 2/2\n+switch-master mymaster 10.0.1.5 6379 10.0.1.6 6379\n... 4 minutes later ...\n+switch-master mymaster 10.0.1.6 6379 10.0.1.5 6379',

      ['Measure first: Sentinel logs for repeated <code>+sdown</code> without a real outage, and Redis latency events.', 'Fix: set <code>down-after-milliseconds</code> above the longest normal stall (the sample config uses 30000); fix the cause of stalls.', 'Fix: keep <code>failover-timeout</code> and <code>parallel-syncs</code> sensible to avoid piling resyncs.', 'Verify: no failovers during peak-load tests with injected short pauses.'])
  ] },
