{ ask: 'The data no longer fits one machine. How does Redis Cluster decide which node owns a key, and what breaks when a command touches two keys?',
  why: 'One node has a memory and throughput ceiling, so keys must be spread without a central lookup.',
  principle: 'Hash every key to a fixed slot, and assign slot ranges to nodes so data can move in small units.',
  design: 'CRC16 of the key (or hash tag) mod 16384, a slot map on every node, MOVED and ASK redirects while slots migrate.',
  scene: ['The marketplace dataset has outgrown one machine, so it moves to a Redis Cluster of three primaries (illustrative). The next day the checkout service starts failing on its multi-key transaction, and one node sits at much higher CPU than the others.',
          'The checkout touches the user cart and the user orders in one <code>MULTI</code>. Before sharding it worked, and nothing in the code changed.'],
  predict: { q: 'Do the keys <code>{user:42}:cart</code> and <code>{user:42}:orders</code> land in the same slot?',
    opts: ['No, different suffixes hash to different slots', 'It depends on how many nodes the cluster has', 'Yes, only the text inside the braces is hashed'], ans: 2,
    why: 'When a key contains <code>{...}</code> with a non-empty tag, only the tag is hashed. Both keys hash <code>user:42</code> and share a slot, so multi-key commands on them work. The slot does not depend on the number of nodes; only the owner does.' },
  idea: ['<b>Key to slot</b>: <code>CRC16(key) mod 16384</code>. If the key has a <b>hash tag</b> <code>{...}</code>, only the tag is hashed. <code>CLUSTER KEYSLOT key</code> shows it.',
         '<b>Slot map</b>: every primary owns slot ranges and every node knows the whole map (<code>CLUSTER SHARDS</code> shows it in 7.x). Multi-key commands require all keys in one slot, else <code>CROSSSLOT</code>.',
         '<b>Redirects</b>: a node that does not own the slot answers <code>MOVED slot host:port</code> (permanent; update your map). During migration it answers <code>ASK</code> (one-off; send <code>ASKING</code> first).',
         '<b>Resharding</b>: a slot is marked <code>MIGRATING</code> on the source and <code>IMPORTING</code> on the target; keys move with <code>MIGRATE</code>, then ownership flips.'],
  arch: { w: 600, h: 260, cap: 'A key maps to a slot; the slot map names the owner; redirects fix stale clients.',
    boxes: [['cl', 10, 100, 110, 60, 'Client\nslot map cache', 0], ['crc', 165, 100, 130, 60, 'CRC16 mod 16384\nkey to slot', 1], ['n1', 380, 10, 200, 55, 'Node 1\nslots 0-5460', 2], ['n2', 380, 100, 200, 55, 'Node 2\nslots 5461-10922', 3], ['n3', 380, 190, 200, 55, 'Node 3\nslots 10923-16383', 4]],
    arrows: [['cl', 'crc', 'hash'], ['crc', 'n1', ''], ['crc', 'n2', 'owner'], ['crc', 'n3', ''], ['n1', 'n2', 'MOVED / ASK', true]] },
  pg: 'slots',
  common: [
    CE('CROSSSLOT', 'CROSSSLOT: a multi-key command spans slots',
      '<b>MULTI, MGET or a script fails</b> only after moving to a cluster.',
      'Checkout runs <code>MULTI</code> over <code>cart:42</code> and <code>orders:42</code>, which hash to different slots.',
      'A transaction or multi-key command is executed by one node, so every key must be in the same slot. Without a shared hash tag the keys land on different slots and the node refuses.',
      '127.0.0.1:7000> MGET cart:42 orders:42\n(error) CROSSSLOT Keys in request don\'t hash to the same slot\n127.0.0.1:7000> CLUSTER KEYSLOT cart:42\n(integer) 4721       # illustrative\n127.0.0.1:7000> CLUSTER KEYSLOT orders:42\n(integer) 13005      # illustrative',
      '<code>CLUSTER KEYSLOT</code> prints the slot for any key; different numbers explain the error.',
      LK(DOC + 'operate/oss_and_stack/reference/cluster-spec/', 'Redis Cluster specification'),
      VZ([R('cart:42', ['slot 4721, node 1', 'bad', 1]), R('orders:42', ['slot 13005, node 3', 'bad', 1])], [BR('MULTI success', 0, 'bad', 'CROSSSLOT')], 'Keys on different nodes.'),
      VZ([R('{user:42}:cart', ['slot 8211, node 2', 'ok', 1]), R('{user:42}:orders', ['slot 8211, node 2', 'ok', 1])], [BR('MULTI success', 100, 'ok', 'same slot')], 'Shared hash tag.'),
      ['Measure first: <code>CLUSTER KEYSLOT</code> for each key in the failing command.', 'Fix: put a shared hash tag in keys that must be used together, for example <code>{user:42}:cart</code> and <code>{user:42}:orders</code>.', 'Fix: or split the logic into single-slot steps and make each step idempotent.', 'Verify: the transaction succeeds and CROSSSLOT errors drop to zero.']),
    CE('Hot slot', 'Over-broad hash tags make one hot slot',
      '<b>One node is saturated</b> while the others are idle, even though the key count looks balanced.',
      'To fix CROSSSLOT someone tagged every key with the same constant, such as <code>{cart}:42</code>.',
      'All keys with the same tag share one slot, hence one node. The cluster no longer spreads load, and that slot cannot be split by moving it.',
      '127.0.0.1:7000> CLUSTER KEYSLOT {cart}:1\n(integer) 5390\n127.0.0.1:7000> CLUSTER KEYSLOT {cart}:2\n(integer) 5390\n# every key lands in slot 5390 (illustrative number)\nredis-cli --cluster info 127.0.0.1:7000\n10.0.0.1:7000 (a1b2...) -> 3200000 keys | 5461 slots | 1 replicas.   # illustrative',
      'One node holding nearly all keys while owning one third of the slots is the signature.',
      LK(DOC + 'operate/oss_and_stack/reference/cluster-spec/', 'Redis Cluster specification, hash tags'),
      VZ([R('node 1', ['all keys', 'bad', 1]), R('node 2', ['idle', 'warn', 1]), R('node 3', ['idle', 'warn', 1])], [BR('node 1 load', 100, 'bad', '100%'), BR('node 2 load', 2, 'ok', '2%')], 'Everything in one slot.'),
      VZ([R('node 1', ['balanced', 'ok', 1]), R('node 2', ['balanced', 'ok', 1]), R('node 3', ['balanced', 'ok', 1])], [BR('node 1 load', 34, 'ok', '34%'), BR('node 2 load', 33, 'ok', '33%')], 'Tag only the user id.'),
      ['Measure first: per-node key counts and CPU, and <code>CLUSTER COUNTKEYSINSLOT</code> for suspicious slots.', 'Fix: make the tag as narrow as the unit that needs atomicity (the user id, not a global constant).', 'Fix: migrate keys to the new naming with a dual-read period.', 'Verify: key counts and CPU are balanced across primaries.']),
    CE('MOVED storm', 'Clients without a slot-map cache cause a MOVED storm',
      '<b>Request latency doubles</b> and every node shows many redirects after a resharding.',
      'A simple client sends each command to a random node, or never refreshes its slot map after a MOVED.',
      'A redirect costs an extra round trip. A cluster-aware client caches the slot map and updates it on MOVED, so redirects are rare. A client that ignores it pays a redirect on most requests.',
      '127.0.0.1:7000> GET {user:42}:cart\n(error) MOVED 8211 10.0.0.2:7000\n# representative sequence: the client then repeats the request on 10.0.0.2',
      'MOVED is permanent: the client should store the new owner for that slot.',
      LK(DOC + 'operate/oss_and_stack/reference/cluster-spec/', 'Redis Cluster specification, redirection'),
      VZ([R('client', ['no slot cache', 'bad', 1])], [BR('redirects per 100 requests', 70, 'bad', 'about 70')], 'Most requests hit the wrong node.'),
      VZ([R('client', ['caches slot map', 'ok', 1])], [BR('redirects per 100 requests', 2, 'ok', 'about 1 to 2')], 'Redirects only after a move.'),
      ['Measure first: count MOVED replies in client metrics and compare with request volume.', 'Fix: use a cluster-aware client that caches the slot map and refreshes it on MOVED (or via <code>CLUSTER SLOTS</code> or <code>CLUSTER SHARDS</code>).', 'Fix: do not route through a load balancer that hides node addresses unless the client supports it.', 'Verify: the redirect rate returns to near zero between reshards.']),
    CE('MIGRATE timeout', 'Migrating a slot with big keys blocks and MIGRATE times out',
      '<b>Resharding stalls</b>; the tool reports an error and the slot stays in migrating state.',
      'A slot contains a multi-hundred-megabyte sorted set. <code>MIGRATE</code> moves keys one at a time.',
      '<code>MIGRATE</code> serialises the key, sends it, and waits for the target, blocking the source while it works. A huge key takes long enough to exceed the timeout and it also stalls other commands on that node.',
      '$ redis-cli --cluster reshard 127.0.0.1:7000\n...\nMoving slot 8211 from a1b2... to c3d4...\n>>> Migrating 8211 ... \nI/O error or timeout   # representative\n(error) IOERR error or timeout reading to target instance',
      'The IOERR text comes from the <code>MIGRATE</code> command. A leftover migrating state may need <code>redis-cli --cluster fix</code>.',
      LK(DOC + 'commands/migrate/', 'MIGRATE command'),
      VZ([R('slot 8211', ['one 400 MB key', 'bad', 1])], [BR('source blocked', 100, 'bad', 'seconds')], 'One giant value per move.'),
      VZ([R('slot 8211', ['keys under 1 MB', 'ok', 1])], [BR('source blocked', 3, 'ok', 'milliseconds')], 'Small keys move quickly.'),
      ['Measure first: find big keys in the slot (<code>redis-cli --bigkeys</code>, <code>CLUSTER GETKEYSINSLOT</code>, <code>MEMORY USAGE</code>).', 'Fix: split or trim big keys before resharding; raise the migrate timeout only as a last resort.', 'Fix: if a slot is left half-moved run <code>redis-cli --cluster fix</code> and verify with <code>CLUSTER NODES</code>.', 'Verify: the reshard completes and no slot stays in <code>migrating</code> or <code>importing</code> state.'])
  ] },

{ ask: 'A worker crashes halfway through an order event. Is the event lost, or processed twice, and how do you get the message back?',
  why: 'A queue must survive consumer crashes without losing messages or processing them forever.',
  principle: 'Keep delivered-but-unacknowledged messages on record until a consumer confirms them.',
  design: 'An append-only log with time-ordered IDs; a consumer group tracks last-delivered ID and a pending entries list per consumer.',
  scene: ['The order service publishes events into a Redis Stream, and three workers read them as a consumer group (illustrative). At 14:10 one worker is killed by a deploy while it holds an order event.',
          'The event is not processed. The next day one customer has a paid order that was never fulfilled, and the stream length keeps growing week after week.'],
  predict: { q: 'A consumer reads entry 5 with <code>XREADGROUP</code> and crashes before <code>XACK</code>. Where is entry 5?',
    opts: ['Deleted, because it was delivered', 'Back at the head of the stream for any consumer', 'In the group pending entries list (PEL), owned by the dead consumer'], ans: 2,
    why: 'Delivery moves the entry into the PEL of that consumer, with a delivery time and count, and it stays until <code>XACK</code>. Nobody else gets it unless you claim it (<code>XAUTOCLAIM</code> or <code>XCLAIM</code>).' },
  idea: ['<b>Entry IDs</b> are <code>ms-seq</code> and grow monotonically. <code>XADD</code> appends; the stream is a log.',
         '<b>Consumer group</b>: stores the <code>last-delivered-id</code>. <code>XREADGROUP</code> with <code>&gt;</code> delivers only new entries.',
         '<b>PEL</b>: per consumer, the entries delivered but not acknowledged, with idle time and delivery count (see <code>XPENDING</code>). <code>XACK</code> removes the entry.',
         '<b>Recovery and trimming</b>: <code>XAUTOCLAIM key group consumer min-idle-time start</code> takes over idle entries; <code>XADD ... MAXLEN ~ n</code> or <code>XTRIM</code> bounds the length.'],
  arch: { w: 600, h: 250, cap: 'Entries move from the log to a consumer PEL on delivery and leave it on acknowledgement.',
    boxes: [['pd', 10, 100, 110, 60, 'Producer\nXADD', 0], ['lg', 170, 100, 140, 60, 'Stream log\nIDs ms-seq', 1], ['gr', 365, 20, 150, 55, 'Group\nlast-delivered-id', 2], ['pel', 365, 105, 150, 55, 'PEL\npending per consumer', 3], ['cs', 365, 190, 150, 50, 'Consumers\nXACK', 4]],
    arrows: [['pd', 'lg', 'append'], ['lg', 'gr', 'XREADGROUP'], ['gr', 'pel', 'deliver'], ['pel', 'cs', 'work'], ['cs', 'pel', 'XACK', true]] },
  pg: 'streams',
  common: [
    CE('Stuck pending', 'Entries stuck pending after a consumer crash',
      '<b>Orders never complete</b>; <code>XPENDING</code> shows entries with a large idle time.',
      'A worker was killed during a deploy while holding entries. No other worker reads those entries because they are not new.',
      '<code>XREADGROUP &gt;</code> only returns never-delivered entries. Entries owned by a dead consumer stay in its PEL until someone claims them.',
      '127.0.0.1:6379> XPENDING orders workers - + 10\n1) 1) "1696747800000-0"\n   2) "worker-2"\n   3) (integer) 5400000\n   4) (integer) 1\n# id, consumer, idle ms, delivery count (illustrative values)\n\n127.0.0.1:6379> XAUTOCLAIM orders workers worker-1 60000 0-0 COUNT 10',
      'A high idle time with the consumer of a dead worker is the sign; <code>XAUTOCLAIM</code> returns the claimed entries.',
      LK(DOC + 'develop/data-types/streams/', 'Redis Streams'),
      VZ([R('PEL of worker-2', ['3 entries, idle 90 min', 'bad', 1])], [BR('pending entries', 60, 'bad', 'stuck')], 'No one claims them.'),
      VZ([R('PEL of worker-2', ['claimed by worker-1', 'ok', 1])], [BR('pending entries', 2, 'ok', 'near zero')], 'A reaper runs XAUTOCLAIM.'),
      ['Measure first: <code>XPENDING key group</code> summary, then the extended form to see idle time and delivery counts.', 'Fix: run <code>XAUTOCLAIM</code> from a live consumer on a schedule with a <code>min-idle-time</code> longer than normal processing.', 'Fix: make handlers idempotent, because a claim means a second delivery.', 'Verify: pending entries stay near zero after a worker is killed.']),
    CE('Unbounded stream', 'Unbounded stream growth fills memory',
      '<b>Memory climbs steadily</b> with no traffic change; one key is the culprit.',
      'Producers append forever and nobody trims. Acknowledged entries are not removed automatically.',
      'A stream keeps entries after <code>XACK</code>. Only <code>XTRIM</code> or <code>MAXLEN</code> / <code>MINID</code> options bound its size.',
      '127.0.0.1:6379> XLEN orders\n(integer) 48211394      # illustrative\n127.0.0.1:6379> MEMORY USAGE orders\n(integer) 9810346112   # illustrative\n127.0.0.1:6379> XADD orders MAXLEN ~ 1000000 * order 9 status paid',
      '<code>MAXLEN ~</code> trims approximately, in whole internal nodes, which is cheaper than an exact cap.',
      LK(DOC + 'develop/data-types/streams/', 'Redis Streams, capped streams'),
      VZ([R('orders', ['48M entries', 'bad', 1])], [BR('stream memory', 100, 'bad', '9 GB')], 'No trimming.'),

      ['Measure first: <code>XLEN</code> and <code>MEMORY USAGE</code> on the stream over time.', 'Fix: add <code>MAXLEN ~ n</code> (or <code>MINID</code>) on <code>XADD</code>, sized so a slow consumer cannot fall off the end.', 'Fix: archive old entries to durable storage if you need history.', 'Verify: stream length and memory flatten at the cap.']),
    CE('Poison message', 'A poison message is redelivered forever',
      '<b>The same entry keeps coming back</b> and the delivery count climbs.',

    note('Illustrative model: a fixed small keyspace and an allow-list of commands (SET GET DEL INCR TYPE OBJECT ENCODING MEMORY USAGE HSET HGETALL ZADD ZRANGE). Defaults used: hash-max-listpack-entries 128, hash-max-listpack-value 64, zset-max-listpack-entries 128. Byte counts are made-up estimates, not real MEMORY USAGE output.')));

/* ---------- ch3: key expiration, lazy plus active cycle ---------- */
PG.expire = function (root, A) {
  const { h, seg, slider, stat, btn, bar, note, rng, player } = A;
  let N = 200, pat = 'same', rate = 100, S = null;
  const out = stat([]), hist = h('div'), cap = h('p', { class: 'note' });
  const BASE = 300, TICKMAX = 720, BUDGET = 25, COST = 0.002;
  function init() {
    const n = N * 1000, r = rng(5), dl = new Int32Array(n), arr = new Int32Array(n), due = new Int32Array(TICKMAX + 700);
    for (let i = 0; i < n; i++) { dl[i] = BASE + (pat === 'same' ? 0 : Math.floor(r() * 300)); arr[i] = i; due[dl[i]]++; }
    S = { t: 0, n, dl, arr, len: n, due, stale: 0, r, freed: 0, peak: 0, used: [], r2: rng(9) };
  }
  function removeAt(i) { S.len--; S.arr[i] = S.arr[S.len]; }
  function tick() {
    const s = S; s.t++; s.stale += s.due[s.t]; let used = 0, freed = 0;
    const kill = i => { const k = s.arr[i]; s.stale--; s.due[s.dl[k]]--; removeAt(i); freed++; };
    for (let q = 0; q < rate / 10; q++) { if (!s.len) break; const i = Math.floor(s.r2() * s.len); if (s.dl[s.arr[i]] <= s.t) kill(i); }
    let again;
    do {
      again = false; let exp = 0;
      for (let k = 0; k < 20 && s.len; k++) { const i = Math.floor(s.r() * s.len); used += COST; if (s.dl[s.arr[i]] <= s.t) { kill(i); exp++; used += COST; } }
      if (exp * 100 / 20 > 10 && used < BUDGET && s.len) again = true;
    } while (again);
    s.freed = freed; s.peak = Math.max(s.peak, used); s.used.push(used);
  }
  function paint() {
    const s = S, mb = s.len * 200 / 1e6;
    out.update([{ l: 'expired but in memory', v: s.stale, cls: s.stale > s.n * 0.15 ? 'bad' : 'ok' }, { l: 'freed last tick', v: s.freed }, { l: 'max cycle (ms)', v: s.peak.toFixed(1), cls: s.peak >= 20 ? 'bad' : 'ok' }, { l: 'memory (MB, illustrative)', v: mb.toFixed(1) }, { l: 'clock (s)', v: (s.t / 10).toFixed(1) }]);
    hist.replaceChildren(rdsHist(s.used.length ? s.used.slice(-120) : [0], 15, 'ms of active cycle per tick'));
    cap.textContent = 'Active-cycle time per tick (last 120 ticks); red bars are above 15 ms of the 25 ms budget.';
  }
  function ff(to) { init(); while (S.t < to) tick(); paint(); }
  const pl = player({ speed: 120, step() { if (S.t >= TICKMAX) return false; tick(); paint(); return S.t < TICKMAX; }, reset() { init(); paint(); } });
  const keysSl = slider('keys with TTL (thousands)', 50, 500, N, 50, v => { N = v; init(); paint(); });
  const patSeg = seg([{ v: 'same', l: 'All same deadline' }, { v: 'jitter', l: 'Jittered deadlines' }], pat, v => { pat = v; init(); paint(); });
  const rateSl = slider('reads per second', 0, 2000, rate, 100, v => { rate = v; init(); paint(); });
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: when all keys share one deadline the active cycle runs at its time budget and expired keys linger; jittered deadlines keep each cycle short.'),
    bar(keysSl, patSeg, rateSl),
    bar(btn('Reproduce the incident', () => { N = 500; pat = 'same'; rate = 0; keysSl.value = N; patSeg.set(pat); rateSl.value = rate; ff(340); }),
        btn('Apply the fix', () => { N = 500; pat = 'jitter'; rate = 0; keysSl.value = N; patSeg.set(pat); rateSl.value = rate; ff(340); })),
    pl, out, cap, hist,
    note('Illustrative model: one tick is 100 ms and the TTL is scaled down to 30 s (300 ticks) so the run is short. Each tick samples 20 keys at a time and repeats while more than 10% are expired, within a 25 ms budget; sampling a key costs 2 microseconds and deleting costs another 2 (made-up costs). Reads delete an expired key they touch (lazy expiry).')));
  init(); paint();
};

/* ---------- ch4: eviction ---------- */
PG.eviction = function (root, A) {
  const { h, seg, slider, stat, btn, bar, note, rng } = A;
  let policy = 'noeviction', budget = 300, samples = 5, wl = 'hot', ttl = false;
  const out = stat([]), mt = h('div');
  const U = 1000, HOT = 20, REQ = 20000;
  function run() {
    const r = rng(42), last = new Int32Array(U), freq = new Uint8Array(U), inRes = new Uint8Array(U), list = [], idx = new Int32Array(U);
    let hits = 0, rej = 0, ev = 0, hotEv = 0, scan = 0;
    const lfu = policy === 'allkeys-lfu', canEvict = policy === 'allkeys-lru' || lfu || (policy === 'volatile-lru' && ttl);
    const bump = k => { const c = freq[k], p = 1 / (c * 10 + 1); if (c < 255 && r() < p) freq[k] = c + 1; };
    const pick = i => {
      if (wl === 'uniform') return Math.floor(r() * U);
      if (i % 3000 >= 2700) return 500 + scan++ % 500;
      return r() < 0.7 ? Math.floor(r() * HOT) : HOT + Math.floor(r() * (U - HOT));
    };
    for (let i = 0; i < REQ; i++) {
      if (i % 1000 === 999) for (let k = 0; k < U; k++) if (freq[k] > 0) freq[k]--;
      const k = pick(i);
      if (inRes[k]) { hits++; last[k] = i; bump(k); continue; }
      if (list.length >= budget) {
        if (!canEvict) { rej++; continue; }
        let v = -1;
        for (let s = 0; s < samples; s++) { const c = list[Math.floor(r() * list.length)]; if (v < 0 || (lfu ? freq[c] < freq[v] : last[c] < last[v])) v = c; }
        const p = idx[v], tail = list.pop(); if (tail !== v) { list[p] = tail; idx[tail] = p; }
        inRes[v] = 0; ev++; if (v < HOT) hotEv++;
      }
      inRes[k] = 1; idx[k] = list.length; list.push(k); last[k] = i; freq[k] = 5;
    }
    const hr = 100 * hits / REQ;
    out.update([{ l: 'writes rejected', v: rej, cls: rej ? 'bad' : 'ok' }, { l: 'hit rate', v: hr.toFixed(1) + '%', cls: hr > 60 ? 'ok' : 'bad' }, { l: 'evictions', v: ev }, { l: 'hot keys evicted', v: hotEv, cls: hotEv > ev * 0.05 ? 'bad' : 'ok' }]);
    rdsMeter(mt, [BR('hit rate', hr, hr > 60 ? 'ok' : 'bad', hr.toFixed(1) + '%'), BR('writes rejected', pct(rej, REQ), rej ? 'bad' : 'ok', String(rej)), BR('hot keys evicted', pct(hotEv, Math.max(1, ev)), hotEv > ev * 0.05 ? 'bad' : 'ok', hotEv + ' of ' + ev + ' evictions')]);
  }
  const pol = seg(['noeviction', 'allkeys-lru', 'allkeys-lfu', 'volatile-lru'], policy, v => { policy = v; run(); });
  const bs = slider('maxmemory (keys)', 100, 800, budget, 100, v => { budget = v; run(); });
  const ss = slider('maxmemory-samples', 1, 10, samples, 1, v => { samples = v; run(); });
  const ws = seg([{ v: 'hot', l: 'Hot set + scans' }, { v: 'uniform', l: 'Uniform' }], wl, v => { wl = v; run(); });
  const ts = seg([{ v: 'no', l: 'Keys have no TTL' }, { v: 'yes', l: 'Keys have TTL' }], 'no', v => { ttl = v === 'yes'; run(); });
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: under noeviction new writes are rejected once the budget is full, while sampled LRU or LFU keeps the hot keys and accepts writes.'),
    bar(pol, bs, ss), bar(ws, ts),
    bar(btn('Reproduce the incident', () => { policy = 'noeviction'; budget = 300; samples = 5; wl = 'hot'; pol.set(policy); bs.value = budget; ss.value = samples; ws.set(wl); run(); }),
        btn('Apply the fix', () => { policy = 'allkeys-lru'; budget = 300; samples = 5; wl = 'hot'; pol.set(policy); bs.value = budget; ss.value = samples; ws.set(wl); run(); })),
    out, mt,
    note('Illustrative model: 1,000 possible keys, 20 of them hot (70% of reads), a sequential scan burst every 3,000 requests, 20,000 requests with a cache-aside write on each miss. Memory is counted in keys, not bytes. The LFU counter is a simplified logarithmic one that decays every 1,000 requests. volatile-lru only works when keys have a TTL.')));
  run();
};

/* ---------- ch5: persistence ---------- */
PG.persistence = function (root, A) {
  const { h, seg, slider, stat, btn, bar, note } = A;
  let mode = 'everysec', rdb = 0, gb = 8, wps = 1000, loss = 10.3;
  const out = stat([]), mt = h('div');
  const SPAN = 20;
  function run() {
    const acked = Math.floor(loss * wps);
    let D = 0;
    if (mode === 'always') D = loss;
    else if (mode === 'everysec') D = Math.floor(loss);
    else if (mode === 'no') D = Math.floor(loss / 30) * 30;
    const snap = rdb > 0 ? Math.floor(loss / rdb) * rdb : 0;
    const durable = Math.max(D, snap);
    const lost = Math.max(0, Math.round((loss - durable) * wps));
    const fsyncs = mode === 'always' ? wps : mode === 'everysec' ? 1 : 0;
    const forkMs = gb * 10, saveSec = gb * 3;
    const cow = Math.min(gb * 1024, Math.round(wps * saveSec * 4 / 1024));
    out.update([{ l: 'acknowledged writes lost', v: lost + ' of ' + acked, cls: lost ? 'bad' : 'ok' }, { l: 'fsyncs per second (max)', v: fsyncs }, { l: 'fork pause (ms, illustrative)', v: forkMs, cls: forkMs > 200 ? 'bad' : 'ok' }, { l: 'copy-on-write (MB, illustrative)', v: cow, cls: cow > gb * 512 ? 'bad' : 'ok' }]);
    rdsMeter(mt, [BR('survives power loss', pct(durable, loss), 'ok', durable.toFixed(1) + ' s of ' + loss.toFixed(1) + ' s'), BR('lost window', pct(loss - durable, loss), lost ? 'bad' : 'ok', (loss - durable).toFixed(1) + ' s'), BR('timeline (0 to 20 s)', pct(loss, SPAN), 'warn', 'power fails at ' + loss.toFixed(1) + ' s')]);
  }
  const ms = seg([{ v: 'rdb', l: 'RDB only' }, { v: 'no', l: 'AOF appendfsync no' }, { v: 'everysec', l: 'AOF everysec' }, { v: 'always', l: 'AOF always' }], mode, v => { mode = v; run(); });
  const rs = slider('RDB every N s (0 = off)', 0, 20, rdb, 5, v => { rdb = v; run(); });
  const gs = slider('dataset (GB)', 1, 32, gb, 1, v => { gb = v; run(); });
  const ws = slider('writes per second', 200, 5000, wps, 200, v => { wps = v; run(); });
  const ls = slider('power loss at (s)', 1, 20, loss, 0.5, v => { loss = v; run(); });
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: with appendfsync everysec at most about one second of acknowledged writes is lost, snapshots alone lose up to the whole interval, and fork cost grows with dataset size.'),
    bar(ms, rs), bar(gs, ws, ls),
    bar(btn('Reproduce the incident', () => { mode = 'rdb'; rdb = 20; loss = 19.5; ms.set(mode); rs.value = rdb; ls.value = loss; run(); }),
        btn('Apply the fix', () => { mode = 'everysec'; rdb = 0; loss = 19.5; ms.set(mode); rs.value = rdb; ls.value = loss; run(); })),
    out, mt,
    note('Illustrative model: writes arrive at a constant rate and are acknowledged at once. everysec makes writes durable at each whole second; no leaves it to the OS, shown here as a flush every 30 s; RDB makes data durable at snapshot times; with AOF and RDB both on, the newer one counts. Fork pause is 10 ms per GB and a save takes 3 s per GB (made-up figures); copy-on-write counts one 4 KB page per write during the save, capped at the dataset size. The real worst case for everysec can reach about two seconds.')));
  run();
};

/* ---------- ch6: replication ---------- */
PG.replication = function (root, A) {
  const { h, seg, slider, stat, btn, bar, note } = A;
  let rate = 10, backlog = 1, disc = 30, limit = 64;
  const out = stat([]), mt = h('div');
  const RDB = 2048, LINK = 100;
  function run() {
    const gap = rate * disc;
    let type, moved, attempts, lag, cls;
    if (gap <= backlog) {
      type = 'partial'; moved = gap; attempts = 1; lag = LINK > rate ? gap / (LINK - rate) : 999; cls = 'ok';
    } else {
      const dur = RDB / LINK, buf = rate * dur;
      if (buf <= limit) { type = 'full'; moved = RDB; attempts = 1; lag = LINK > rate ? buf / (LINK - rate) : 999; cls = 'bad'; }
      else { type = 'full, loops'; attempts = 5; moved = Math.round(attempts * Math.min(RDB, (limit / rate) * LINK)); lag = 999; cls = 'bad'; }
    }
    out.update([{ l: 'resync type', v: type, cls }, { l: 'MB transferred', v: moved, cls: moved > 500 ? 'bad' : 'ok' }, { l: 'replica lag after (s)', v: lag >= 999 ? 'never catches up' : lag.toFixed(1), cls: lag >= 999 ? 'bad' : 'ok' }, { l: 'sync attempts shown', v: attempts + (type === 'full, loops' ? '+' : ''), cls: attempts > 1 ? 'bad' : 'ok' }]);
    const mx = Math.max(gap, backlog, 1), bufMB = rate * RDB / LINK;
    rdsMeter(mt, [BR('gap to cover (MB)', pct(gap, mx), 'warn', gap + ' MB'), BR('backlog (MB)', pct(backlog, mx), backlog >= gap ? 'ok' : 'bad', backlog + ' MB'), BR('buffered during a full sync (MB)', pct(bufMB, Math.max(bufMB, limit)), bufMB > limit ? 'bad' : 'ok', Math.round(bufMB) + ' MB vs limit ' + limit + ' MB')]);
  }
  const rs = slider('primary writes (MB/s)', 1, 20, rate, 1, v => { rate = v; run(); });
  const bs = slider('repl-backlog-size (MB)', 1, 1024, backlog, 1, v => { backlog = v; run(); });
  const ds = slider('disconnect (s)', 1, 120, disc, 1, v => { disc = v; run(); });
  const ls = slider('replica output-buffer hard limit (MB)', 32, 1024, limit, 32, v => { limit = v; run(); });
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: a disconnect longer than the backlog covers forces a full sync, and a full sync only completes if the replica output buffer can hold the writes made during it.'),
    bar(rs, bs), bar(ds, ls),
    bar(btn('Reproduce the incident', () => { rate = 10; backlog = 1; disc = 30; limit = 64; rs.value = rate; bs.value = backlog; ds.value = disc; ls.value = limit; run(); }),
        btn('Apply the fix', () => { rate = 10; backlog = 512; disc = 30; limit = 256; rs.value = rate; bs.value = backlog; ds.value = disc; ls.value = limit; run(); })),
    out, mt,
    note('Illustrative model: a 2 GB dataset (illustrative) is streamed at 100 MB/s with diskless-style sending, so a full sync lasts about 20 s. The gap is write rate times disconnect time. Partial resync needs gap at most backlog. Real replicas also have a soft output-buffer limit held for 60 s, which is not modelled.')));
  run();
};

/* ---------- ch7: pipeline, MULTI/EXEC, WATCH, script ---------- */
PG.multi = function (root, A) {
  const { h, seg, slider, stat, btn, bar, note, logbox } = A;
  let mode = 'pipeline', other = 'writer', slot = 1;
  const out = stat([]), lg = logbox();
  const U = { pipeline: ['GET a', 'DECRBY a 10', 'INCRBY b 10'], multi: ['GET a', 'MULTI / DECRBY a 10 / INCRBY b 10 / EXEC'], watch: ['WATCH a / GET a', 'MULTI / DECRBY a 10 / INCRBY b 10 / EXEC'], lua: ['EVAL: read a, check, DECRBY a, INCRBY b'] };
  function run() {
    const units = U[mode]; slot = Math.min(slot, units.length); slotSl.setMax(units.length); slotSl.value = slot;
    let a = 100, b = 50, seen = null, saw = '-', exec = '-', dirty = false;
    lg.clear(); lg.add('start: a=100 b=50, goal: move 10 from a to b if a >= 10', 'mut');
    const intruder = () => {
      if (other === 'auditor') { saw = a + b; lg.add('client C reads a=' + a + ' b=' + b + ' sum=' + (a + b), a + b === 150 ? 'ok' : 'bad'); }
      else { a -= 95; dirty = true; lg.add('client C: DECRBY a 95 -> a=' + a, 'bad'); }
    };
    const move = () => { a -= 10; b += 10; };
    units.forEach((u, k) => {
      if (k === slot) intruder();
      if (mode === 'pipeline') {
        if (k === 0) { seen = a; lg.add('A: GET a -> ' + a + ' (client decides to go on)'); }
        if (k === 1 && seen >= 10) { a -= 10; lg.add('A: DECRBY a 10 -> a=' + a); }
        if (k === 2 && seen >= 10) { b += 10; lg.add('A: INCRBY b 10 -> b=' + b); }
      } else if (mode === 'multi') {
        if (k === 0) { seen = a; lg.add('A: GET a -> ' + a); }
        else { exec = 'OK'; if (seen >= 10) { move(); lg.add('A: EXEC runs both back to back -> a=' + a + ' b=' + b); } else lg.add('A: balance too low, no transaction'); }
      } else if (mode === 'watch') {
        if (k === 0) { seen = a; lg.add('A: WATCH a, GET a -> ' + a); }
        else if (dirty) { exec = 'nil (aborted)'; lg.add('A: EXEC -> (nil): a changed after WATCH, retry', 'bad'); lg.add('A: retry GET a -> ' + a + (a >= 10 ? ', transfer' : ', too low, give up')); if (a >= 10) move(); }
        else { exec = 'OK'; if (seen >= 10) { move(); lg.add('A: EXEC -> OK, a=' + a + ' b=' + b); } }
      } else {
        exec = a >= 10 ? '1' : '0'; if (a >= 10) { move(); lg.add('A: script moved 10 atomically -> a=' + a + ' b=' + b); } else lg.add('A: script saw a=' + a + ', refused', 'ok');
      }
    });
    if (slot === units.length) intruder();
    const over = a < 0;
    out.update([{ l: 'sum seen by auditor', v: saw, cls: saw !== '-' && saw !== 150 ? 'bad' : 'ok' }, { l: 'EXEC / result', v: exec, cls: '' }, { l: 'final a', v: a, cls: over ? 'bad' : 'ok' }, { l: 'final b', v: b }, { l: 'overdraft', v: over ? 'yes' : 'no', cls: over ? 'bad' : 'ok' }]);
  }
  const ms = seg([{ v: 'pipeline', l: 'Pipeline' }, { v: 'multi', l: 'MULTI/EXEC' }, { v: 'watch', l: 'MULTI + WATCH' }, { v: 'lua', l: 'Lua script' }], mode, v => { mode = v; run(); });
  const os = seg([{ v: 'writer', l: 'C spends 95 from a' }, { v: 'auditor', l: 'C audits a + b' }], other, v => { other = v; run(); });
  const slotSl = slider('C lands before step (0 to end)', 0, 3, slot, 1, v => { slot = v; run(); });
  slotSl.setMax = n => { slotSl.querySelector('input').max = n; };
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: a pipeline lets another client run between its commands, MULTI/EXEC hides the halfway state but not a stale check, and WATCH or a script protects the check as well.'),
    bar(ms, os), bar(slotSl),
    bar(btn('Reproduce the incident', () => { mode = 'pipeline'; other = 'writer'; slot = 1; ms.set(mode); os.set(other); run(); }),
        btn('Apply the fix', () => { mode = 'watch'; other = 'writer'; slot = 1; ms.set(mode); os.set(other); run(); })),
    out, lg.el,
    note('Illustrative model: balances a=100 and b=50; the job moves 10 from a to b only if a >= 10; client C acts between two steps of the job. Positions are counted in units the server runs separately (a pipeline has three, MULTI/EXEC two, WATCH two, a script one).')));
  run();

/* ---------- ch8: Sentinel ---------- */
PG.sentinel = function (root, A) {
  const { h, seg, slider, stat, btn, bar, note, logbox, player } = A;
  let n = 3, quorum = 2, fail = 'partition', minrep = 'off', cur = 0;
  const out = stat([]), lg = logbox();
  const T_FAIL = 2, D = 5, HEAL = 30, RATE = 10, MAXLAG = 3, END = 32;
  function model() {
    const reach = fail === 'crash' ? n : n - 1, major = Math.floor(n / 2) + 1, odown = reach >= quorum, can = odown && reach >= major;
    const ev = [[T_FAIL, fail === 'crash' ? 'primary process crashes' : 'partition: primary, 1 sentinel and 1 client are cut off', 'bad'], [T_FAIL + D, 'SDOWN: ' + reach + ' sentinel(s) see no reply for ' + D + ' ticks (down-after-milliseconds)', '']];
    let fo = null, lost = 0, np = '-', epoch = 4;
    if (!odown) ev.push([T_FAIL + D + 1, 'no ODOWN: ' + reach + ' sentinels reachable, quorum is ' + quorum, 'bad']);
    else {
      ev.push([T_FAIL + D + 1, 'ODOWN: quorum ' + quorum + ' reached (' + reach + ' agree)', '']);
      if (!can) ev.push([T_FAIL + D + 2, 'ODOWN but ' + reach + ' of ' + n + ' sentinels is not a majority: no leader, no failover', 'bad']);
      else { fo = T_FAIL + D + 4; np = 'replica r1'; epoch = 5; ev.push([T_FAIL + D + 2, 'leader elected for epoch 5 with ' + reach + ' of ' + n + ' votes', ''], [T_FAIL + D + 3, 'replica r1 promoted (highest replication offset)', 'ok'], [fo, '+switch-master: clients now ask Sentinel and use r1', 'ok']); }
    }
    if (fail === 'crash') lost = 5;
    else if (can) lost = minrep === 'on' ? RATE * MAXLAG : RATE * (HEAL - T_FAIL);
    if (fail === 'partition') {
      if (minrep === 'on') ev.push([T_FAIL + MAXLAG, 'old primary refuses writes: NOREPLICAS (min-replicas-max-lag ' + MAXLAG + ')', 'ok']);
      if (can) ev.push([HEAL, 'partition heals: old primary becomes a replica, full resync, ' + lost + ' isolated writes discarded', lost ? 'bad' : 'ok']);
      else ev.push([HEAL, 'partition heals: old primary is still primary, nothing lost, but no failover happened', '']);
    } else if (can) ev.push([fo, lost + ' unreplicated writes at the crash are lost (asynchronous replication)', lost ? 'bad' : 'ok']);
    ev.sort((x, y) => x[0] - y[0]);
    return { ev, fo, lost, np, epoch, can };
  }
  function paint() {
    const m = model(); lg.clear();
    m.ev.filter(e => e[0] <= cur).forEach(e => lg.add('t=' + String(e[0]).padStart(2) + '  ' + e[1], e[2]));
    const done = t => cur >= t;
    const foShown = m.fo ? (done(m.fo) ? (m.fo - T_FAIL) + ' ticks' : '...') : (cur >= T_FAIL + D + 2 ? 'none' : '...');
    const lostAt = fail === 'crash' ? (m.fo || 999) : HEAL;
    const lostV = !m.can ? (cur >= (fail === 'crash' ? T_FAIL + D + 2 : HEAL) ? (fail === 'crash' ? 'n/a, no failover' : 0) : '...') : (done(lostAt) ? m.lost : '...');
    out.update([{ l: 'failover time', v: foShown, cls: foShown === 'none' ? 'bad' : foShown === '...' ? '' : 'ok' }, { l: 'writes lost', v: lostV, cls: m.lost > 20 && m.can ? 'bad' : 'ok' }, { l: 'new primary', v: m.fo && done(m.fo) ? m.np : '-' }, { l: 'config epoch', v: m.fo && done(m.fo) ? m.epoch : 4 }, { l: 'tick', v: cur }]);
  }
  function reset() { cur = 0; paint(); }
  const pl = player({ speed: 250, step() { if (cur >= END) return false; cur++; paint(); return cur < END; }, reset });
  const ns = seg([{ v: 3, l: '3 sentinels' }, { v: 5, l: '5 sentinels' }], n, v => { n = v; quorum = Math.min(quorum, n); qs.value = quorum; reset(); });
  const qs = slider('quorum', 1, 5, quorum, 1, v => { quorum = Math.min(v, n); reset(); });

/* ---------- ch9: cluster slots ---------- */
function rdsCrc16(s) {
  const b = new TextEncoder().encode(s); let crc = 0;
  for (let i = 0; i < b.length; i++) { crc ^= b[i] << 8; for (let k = 0; k < 8; k++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff; }
  return crc;
}
function rdsSlot(key) {
  const i = key.indexOf('{');
  if (i >= 0) { const j = key.indexOf('}', i + 1); if (j > i + 1) key = key.slice(i + 1, j); }
  return rdsCrc16(key) % 16384;
}
PG.slots = function (root, A) {
  const { h, seg, slider, stat, btn, bar, note, rng } = A;
  let layout = 'none', nodes = 3, cache = 'yes', mig = 'stable';
  const out = stat([]), mt = h('div'), tester = h('p', { class: 'note', 'aria-live': 'polite' });
  const kin = h('input', { class: 'rds-cli', 'aria-label': 'Keys used in one command', value: '{user:42}:cart {user:42}:orders', autocomplete: 'off', spellcheck: 'false' });
  const owner = s => Math.min(nodes - 1, Math.floor(s * nodes / 16384));
  const names = i => layout === 'none' ? ['cart:' + i, 'orders:' + i] : layout === 'user' ? ['{user:' + i + '}:cart', '{user:' + i + '}:orders'] : ['{shop}:cart:' + i, '{shop}:orders:' + i];
  function test() {
    const ks = kin.value.trim().split(/\s+/).filter(Boolean), sl = ks.map(rdsSlot);
    const same = sl.every(s => s === sl[0]);
    tester.textContent = ks.map((k, i) => k + ' = slot ' + sl[i] + ' (node ' + (owner(sl[i]) + 1) + ')').join('   ') + '   ->   ' + (ks.length < 2 || same ? 'OK, one slot' : 'CROSSSLOT Keys in request don’t hash to the same slot');
  }
  function run() {
    const load = new Array(nodes).fill(0), all = []; let cross = 0;
    for (let i = 1; i <= 200; i++) { const k = names(i); k.forEach(x => { all.push(x); load[owner(rdsSlot(x))]++; }); if (rdsSlot(k[0]) !== rdsSlot(k[1])) cross++; }
    const S = rdsSlot(names(1)[0]), r = rng(7); let red = 0, learned = false;
    for (let q = 0; q < 1000; q++) {
      const key = all[Math.floor(r() * all.length)], s = rdsSlot(key), o = owner(s);
      if (cache === 'yes') {
        if (s === S && mig === 'migrating' && (rdsCrc16(key) & 1)) red++;
        else if (s === S && mig === 'moved' && !learned) { red++; learned = true; }
      } else if (Math.floor(r() * nodes) !== o) red++;
    }
    const mx = Math.max(...load);
    out.update([...load.map((v, i) => ({ l: 'node ' + (i + 1) + ' keys', v, cls: v > all.length * 0.5 ? 'bad' : '' })), { l: 'redirects per 100 requests', v: (red / 10).toFixed(1), cls: red > 100 ? 'bad' : 'ok' }, { l: 'CROSSSLOT of 200 checkouts', v: cross, cls: cross ? 'bad' : 'ok' }]);
    rdsMeter(mt, load.map((v, i) => BR('node ' + (i + 1), pct(v, mx), v > all.length * 0.5 ? 'bad' : 'ok', v + ' keys')));
    test();
  }

  const ns = slider('nodes', 3, 6, nodes, 1, v => { nodes = v; run(); });
  const cs = seg([{ v: 'yes', l: 'Client caches slot map' }, { v: 'no', l: 'No slot-map cache' }], cache, v => { cache = v; run(); });
  const mg = seg([{ v: 'stable', l: 'Slot stable' }, { v: 'migrating', l: 'Migrating slot' }, { v: 'moved', l: 'Slot moved' }], mig, v => { mig = v; run(); });
  kin.addEventListener('input', test);
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: keys sharing a hash tag share a slot (so MULTI works), a tag that is too broad piles load on one node, and clients without a slot-map cache pay many redirects.'),
    bar(ls, ns), bar(cs, mg),
    h('label', { class: 'note' }, 'Keys used in one command (space separated) ', kin), tester,
    bar(btn('Reproduce the incident', () => { layout = 'none'; nodes = 3; cache = 'no'; mig = 'moved'; ls.set(layout); ns.value = nodes; cs.set(cache); mg.set(mig); kin.value = 'cart:42 orders:42'; run(); }),
        btn('Apply the fix', () => { layout = 'user'; nodes = 3; cache = 'yes'; mig = 'stable'; ls.set(layout); ns.value = nodes; cs.set(cache); mg.set(mig); kin.value = '{user:42}:cart {user:42}:orders'; run(); })),
    out, mt,
    note('Illustrative model: 200 users with a cart key and an orders key, slots split evenly over the nodes, 1,000 seeded requests. The slot function is the real one (CRC16 mod 16384, with hash tags). Redirect counts follow a simple rule: a cached client pays one MOVED per moved slot and an ASK per already-moved key while migrating; an uncached client sends each request to a random node.')));

/* ---------- ch10: streams and consumer groups ---------- */
PG.streams = function (root, A) {
  const { h, seg, slider, stat, btn, bar, note, player } = A;
  let prod = 2, cons = 3, idle = 0, trim = 'off', killAt = 0, S = null;

  const ps = slider('producers (entries per tick)', 1, 4, prod, 1, v => { prod = v; init(); paint(); });
  const cs = slider('consumers', 1, 3, cons, 1, v => { cons = v; init(); paint(); });
  const ids = slider('XAUTOCLAIM min-idle (ticks, 0 = off)', 0, 20, idle, 1, v => { idle = v; init(); paint(); });
  const ts = seg([{ v: 'off', l: 'No trimming' }, { v: 'on', l: 'XADD MAXLEN ~ 30' }], trim, v => { trim = v; init(); paint(); });
  root.append(h('div', { class: 'pgbox' },
    h('p', { class: 'pgwhy' }, 'Hypothesis to test: an entry read but not acknowledged stays in the PEL after the consumer dies until XAUTOCLAIM takes it over, and without MAXLEN the stream grows without bound.'),
    bar(ps, cs, ids), bar(ts, btn('Kill consumer 1 (from tick 5, while it holds entries)', () => { killAt = 5; init(); paint(); })),
    bar(btn('Reproduce the incident', () => { prod = 2; cons = 3; idle = 0; trim = 'off'; killAt = 5; ps.value = prod; cs.value = cons; ids.value = idle; ts.set(trim); ff(60); }),
        btn('Apply the fix', () => { prod = 2; cons = 3; idle = 6; trim = 'on'; killAt = 5; ps.value = prod; cs.value = cons; ids.value = idle; ts.set(trim); ff(60); })),
    pl, out, mt,
    note('Illustrative model: one tick per step, consumers read up to 3 new entries with XREADGROUP and acknowledge one per tick; XAUTOCLAIM is run by each idle consumer and takes entries whose idle time in ticks is at least the slider value. MAXLEN is shown as an exact cap of 30 for simplicity (real MAXLEN ~ trims approximately). Trimmed entries that were not acknowledged count as lost.')));
