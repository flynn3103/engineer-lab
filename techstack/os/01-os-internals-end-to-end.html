/* =========================================================
   TRADE-OFFS (how / pros / cons / failures / watch) : plain text
   ========================================================= */
const DETAIL=[
{how:"CPUs have at least two privilege levels. User code runs in ring 3: it cannot execute privileged instructions or touch kernel memory. The syscall instruction, a fault or a hardware interrupt switches to ring 0 at an address the kernel registered at boot. The kernel validates every argument it receives, runs the handler and returns to user mode. A periodic timer interrupt guarantees control comes back to the kernel even when a program never makes a call.",
 pros:["Hardware-enforced isolation: a buggy program cannot halt the machine or read kernel memory.","One narrow entry point where permissions and arguments are checked.","Preemption by timer works for programs that never call the kernel.","Programs use system calls, not device registers, so they are portable across hardware."],
 cons:["Every kernel entry costs a mode switch, and mitigations for CPU vulnerabilities increased that cost.","Copying data between user and kernel memory costs time for large reads and writes.","The kernel is a large trusted code base: one bug there compromises the whole machine.","Extending the kernel safely needs modules or eBPF, both with their own risks."],
 fails:[{m:"System call storm",s:"High system CPU time and many context switches; strace -c shows millions of tiny read or write calls.",x:"Batch I/O with bigger buffers, writev or io_uring, and cache results in user space."},
  {m:"Unchecked user pointer in a driver",s:"Kernel oops, or a privilege-escalation vulnerability.",x:"Always use copy_from_user and copy_to_user; fuzz the interface; enable SMAP and SMEP."},
  {m:"Interrupt storm",s:"One core spends all its time in interrupt handlers and latency spikes.",x:"Interrupt coalescing, NAPI for networking, spread IRQs across cores, inspect /proc/interrupts."}],
 watch:["System CPU time and context switches (vmstat, pidstat -w).","System call rate per process (strace -c, perf trace).","Interrupt counts per CPU (/proc/interrupts)."]},
{how:"Each core has a run queue. A timer tick or a wake-up invokes the scheduler, which picks the next task. Linux used a weighted fair scheduler (CFS) that always ran the task with the smallest virtual runtime until kernel 6.5, and uses EEVDF (earliest eligible virtual deadline first) from 6.6. Real-time classes (SCHED_FIFO, SCHED_RR, SCHED_DEADLINE) run ahead of normal tasks. Nice values change a task's weight, and cgroups divide CPU between groups.",
 pros:["Short tasks are not stuck behind long ones.","No runnable task is starved: each is chosen within a bounded time.","Tasks that sleep get low latency when they wake, without being labelled interactive.","Weights and cgroups give proportional CPU shares."],
 cons:["Every context switch costs microseconds and pollutes the CPU caches and TLB.","Fairness is not a deadline guarantee; hard deadlines need a real-time class.","Per-core run queues need load balancing, which is itself costly and imperfect.","Too many runnable tasks slow everyone down: fairness cannot create CPU time."],
 fails:[{m:"Noisy neighbour",s:"One service uses all cores and its neighbours' latency climbs.",x:"Put services in cgroups with cpu.weight or cpu.max; pin or isolate critical cores."},
  {m:"Priority inversion",s:"A high-priority task waits on a lock held by a low-priority task that never gets CPU.",x:"Use priority-inheritance mutexes; keep critical sections short."},
  {m:"CPU throttling",s:"Latency spikes in containers although average CPU use looks low.",x:"Check cpu.stat nr_throttled; raise the quota or remove the hard limit."}],
 watch:["Load average against core count, and run queue length (vmstat r).","Context switches per second and per task.","cgroup cpu.stat throttling counters."]},
{how:"Each process has its own page table. A virtual address is split into table indexes and a page offset; the MMU walks the table (four or five levels on x86-64) and caches results in the TLB. Entries carry present, writable and user bits. A missing or forbidden mapping raises a page fault that the kernel resolves: allocate a zero page, read from disk, copy on write, or send SIGSEGV. After fork the child shares the parent's frames read-only until one of them writes.",
 pros:["Each process sees a private address space, so one cannot corrupt another.","Memory can be shared (libraries, copy-on-write after fork) at page granularity.","Pages are allocated lazily: untouched memory costs nothing.","A program can use more address space than there is RAM."],
 cons:["A TLB miss needs several memory reads, and page tables themselves use memory.","Page faults are expensive, especially major faults that read from disk.","Changing mappings requires TLB shootdowns on every core that may cache them.","Overcommit lets processes allocate more than RAM, trading safety for density."],
 fails:[{m:"Out-of-memory kill",s:"A process disappears; the kernel log shows the OOM killer chose it.",x:"Set memory limits per cgroup, size RAM for the working set, tune overcommit, fix leaks."},
  {m:"Page fault storm after fork",s:"A large process forks and every write copies a page, so latency spikes.",x:"Use vfork or posix_spawn, avoid fork in large processes, consider huge pages carefully."},
  {m:"TLB thrash",s:"High TLB miss counts with a large random-access working set.",x:"Use huge pages for big heaps, improve locality, reduce the number of mappings."}],
 watch:["Minor and major page faults per second.","Resident versus virtual size per process.","TLB miss counters (perf stat) and huge page usage."]},
{how:"When free memory drops below a watermark, the kernel reclaims frames in the background (kswapd) and directly if an allocation cannot wait. Linux keeps pages on active and inactive lists (or multi-generational LRU in newer kernels) and uses the hardware reference bit to find pages not used recently. Clean file pages are simply dropped, dirty pages are written back, anonymous pages go to swap. If reclaim cannot keep up the OOM killer picks a process to kill.",
 pros:["Memory is used for caches until the moment something else needs it.","Approximate LRU is cheap and close to the best practical choice.","Swap lets rarely used anonymous pages make room for useful cache.","Background reclaim hides most of the cost from running programs."],
 cons:["Any policy can be fooled by scans or by a loop slightly larger than memory.","Swapping a hot page costs milliseconds on a hard disk.","Reference bits are coarse: they say used or not, not how often.","Reclaim itself uses CPU and I/O at exactly the moment the machine is short of memory."],
 fails:[{m:"Thrashing",s:"CPU mostly idle but iowait high; major faults per second keep climbing and everything crawls.",x:"Reduce the working set or the number of running programs, add RAM, set memory limits so one group cannot starve others."},
  {m:"Swap storm",s:"Latency spikes when a large idle process is touched again.",x:"Lower swappiness for latency-sensitive hosts, use fast swap, avoid overcommit."},
  {m:"Cache flush by a scan",s:"A backup or a big sequential read evicts the hot working set.",x:"Use fadvise or O_DIRECT for scans; the multi-generational LRU resists this better."}],
 watch:["Major faults (pgmajfault) and swap in/out rates (vmstat si and so).","Memory pressure stall information (/proc/pressure/memory).","Free memory versus available memory, and OOM events in the kernel log."]},
{how:"A process is an address space plus resources; a thread is a schedulable flow of control inside one. The kernel scheduler multiplexes runnable threads onto cores (concurrency) and runs several at once when there are several cores (parallelism). A thread waiting for I/O leaves the run queue until the device signals completion, so a core can run something else. Amdahl's law: with a fraction p of the work parallelizable over n cores, speedup = 1 / ((1 - p) + p / n), bounded by 1 / (1 - p). Rob Pike's summary: concurrency is about dealing with many things at once, parallelism is about doing many things at once.",
 pros:["Concurrency hides I/O latency: while one task waits another computes, even on a single core.","Parallelism cuts the time of CPU-bound work roughly in proportion to the cores, for the parallelizable part.","Processes give fault isolation and independent memory; threads give cheap sharing of data.","A program structured as independent tasks moves from one core to many without a redesign."],
 cons:["A context switch costs on the order of a microsecond or more directly, and tens to hundreds of microseconds once the caches are cold (Li, Ding and Shen, 2007).","Speedup is limited by the serial fraction, by coordination, and by shared resources such as memory bandwidth.","More threads than cores only adds switching; each OS thread also reserves a stack (1 MB by default on the JVM, typically 8 MB of virtual address space on Linux).","Concurrent programs have many possible interleavings, so bugs are rare and hard to reproduce."],
 fails:[{m:"Thread explosion",s:"Memory and context switches climb with load; latency rises although the CPU is not saturated.",x:"Use bounded pools, an event loop or virtual threads; size concurrency with Little's law (in-flight requests = throughput x latency)."},
  {m:"No speedup from more cores",s:"Adding workers leaves throughput flat; one lock or one queue is hot.",x:"Measure the serial fraction, shard the shared resource, reduce coordination."},
  {m:"CPU-bound work in an I/O pool",s:"Latency rises for everything that shares the pool.",x:"Use separate pools for blocking work and CPU work, and size the CPU pool to the number of cores."}],
 watch:["CPU time versus wall-clock time: is the work I/O-bound or CPU-bound?","Run queue length and context switches per second.","Throughput against the number of workers: where the curve flattens."]},
{how:"Mutual exclusion needs an atomic hardware operation such as compare-and-swap. A mutex tries it in user space and only calls the kernel (a futex wait) to sleep when the lock is taken; the unlocker wakes a waiter. Short kernel sections use spinlocks, read-mostly data can use RCU, and a lone counter can use an atomic add. Deadlock needs mutual exclusion, hold and wait, no preemption and a circular wait, so a global lock order breaks the cycle.",
 pros:["A mutex makes a multi-step update atomic with respect to other threads.","Atomics are a single instruction and cannot deadlock.","A uniform lock order removes a whole class of deadlocks by design.","Futexes keep the uncontended path entirely in user space."],
 cons:["Contention serializes work: more cores do not help a hot lock.","Sleeping and waking costs microseconds; spinning wastes CPU.","Lock ordering must be known and respected across the whole code base.","Races are timing-dependent, so tests pass for months and then fail."],
 fails:[{m:"Deadlock",s:"The program hangs with threads blocked in futex waits and CPU at zero; a thread dump shows a cycle of locks.",x:"Impose a lock order, use try-lock with back-off, hold fewer locks, run lockdep or ThreadSanitizer in CI."},
  {m:"Lost update (data race)",s:"Counters or totals slightly wrong, only under load.",x:"Protect the read-modify-write with a lock or an atomic, or avoid shared state."},
  {m:"Lock convoy",s:"Throughput drops as threads are added; most threads are waiting on one lock.",x:"Shorten the critical section, shard the lock, use read-write locks or lock-free structures."}],
 watch:["Lock contention time (perf lock, off-CPU flame graphs).","Thread dumps when a service hangs.","Race detector and lockdep findings in test runs."]},
{how:"The kernel keeps an interest list of file descriptors and a ready list (epoll). epoll_ctl registers a descriptor once and epoll_wait returns only the ready ones, so the cost of a wake-up depends on how many descriptors are ready, not on how many are watched; select and poll scan every descriptor on each call. An event loop (the reactor pattern) waits for readiness, then runs the handler or resumes the coroutine registered for each ready descriptor. async/await compiles a function into a resumable state machine (Python builds it on generators, Rust on Future::poll) so local variables survive across awaits. io_uring is the completion-based alternative (the proactor style): you submit operations through shared rings and the kernel reports when they are done.",
 pros:["One thread can hold tens of thousands of idle connections at a few kilobytes each, instead of a kernel task and a stack per connection.","No locks are needed between coroutines on the same loop: only one runs at a time and they switch only at await points.","Switching between coroutines is a return and a call, far cheaper than an OS context switch.","Straight-line code instead of chains of callbacks."],
 cons:["Scheduling is cooperative: any blocking call or long computation stalls every other task on the loop.","One loop uses one core; using more cores needs several loops or processes (Vert.x runs several event loops, by default twice the number of cores).","Function colouring: async functions can only be awaited from async code, so it spreads through the code base.","Forgotten awaits and orphaned tasks fail quietly, and stack traces are harder to read."],
 fails:[{m:"Blocked event loop",s:"All requests slow down together by the length of one slow handler; asyncio debug mode logs callbacks longer than 0.1 s.",x:"Never block in a handler: use run_in_executor or a worker pool for blocking and CPU work; in Netty and Vert.x keep handlers non-blocking and use worker threads."},
  {m:"Forgotten await",s:"A coroutine object is created but never runs; 'coroutine was never awaited' warnings; work is silently skipped.",x:"Enable warnings and use TaskGroup, or keep references to tasks (the asyncio loop holds only weak references)."},
  {m:"Callback starvation",s:"Timers and I/O never run because microtasks or process.nextTick callbacks keep re-queuing themselves (Node.js).",x:"Yield to the loop (setImmediate, await sleep(0)) and break up long chains."}],
 watch:["Event-loop lag: the delay between a timer's due time and when it actually runs.","Number of in-flight tasks and open file descriptors.","Time spent in the blocking pool compared with the loop thread."]},
{how:"Go runs goroutines on a small set of OS threads. There are exactly GOMAXPROCS processors (P); each P owns a local run queue of up to 256 goroutines, and an OS thread (M) must hold a P to run Go code. The scheduler looks in the local queue, the global queue (checked about every 61st tick for fairness), the network poller, and then steals work from other Ps. A thread that enters a blocking system call releases its P; a monitor thread (sysmon) retakes Ps and requests preemption of goroutines that run longer than about 10 ms (asynchronous, signal-based preemption since Go 1.14). Goroutine stacks start at 2 KB and grow by copying. A channel is a locked ring buffer with queues of waiting senders and receivers: an unbuffered send to a waiting receiver copies the value directly. Since Go 1.25 the default GOMAXPROCS also follows the Linux cgroup CPU limit.",
 pros:["Millions of goroutines are practical: about 2 KB of stack each at the start.","Blocking-style code with the scalability of an event loop: network waits park the goroutine, not a thread.","Work stealing keeps all cores busy without manual tuning.","Channels and select make pipelines, timeouts and cancellation explicit, and the race detector finds unsynchronized access."],
 cons:["Goroutines can still share memory, so data races and deadlocks are possible: the language does not forbid them.","A goroutine blocked forever on a channel is a leak the garbage collector will not reclaim (a goroutine-leak profile is experimental in Go 1.26).","Unbounded goroutine creation exhausts memory; back-pressure exists only if you bound channels or use semaphores.","cgo calls and blocking system calls hold an OS thread for their duration."],
 fails:[{m:"Goroutine leak",s:"Goroutine count and memory grow slowly; a profile shows goroutines parked on channel operations.",x:"Give every goroutine a way to stop (context cancellation or a closed channel), bound the producers, and test with a leak checker."},
  {m:"Unbounded fan-out",s:"A burst creates millions of goroutines and the process runs out of memory.",x:"Use a worker pool or a semaphore, or a bounded channel for back-pressure."},
  {m:"Wrong GOMAXPROCS in a container",s:"CPU throttling and latency spikes when the process sees all host cores but has a smaller CPU quota.",x:"Go 1.25 and later read the cgroup limit; on older versions set GOMAXPROCS or use automaxprocs."}],
 watch:["Goroutine count and scheduler latency (runtime metrics, execution trace).","Threads in use versus GOMAXPROCS, which grows with blocking system calls.","Time goroutines spend blocked on channels and locks (block and mutex profiles)."]},
{how:"An actor is private state plus behavior plus a mailbox. A message is placed in the mailbox and the sender continues. The dispatcher runs an actor on a thread only while it has mail, processes up to its throughput limit of messages, then releases the thread, so many actors share few threads. Messages are processed one at a time, so an actor's state needs no lock. A parent supervises its children and applies a strategy (resume, restart, stop or escalate). Erlang processes are scheduled preemptively by the BEAM (a new process takes about 327 words of memory including its initial heap, and the default limit is about a million processes); Akka and Pekko run actors on a fork-join dispatcher where the actor yields after a batch of messages. Reactive Streams standardizes back-pressure: a subscriber requests n elements and the publisher never sends more. Elsewhere in Scala: a Future needs an ExecutionContext (the global one is a fork-join pool sized to the processors, and blocking calls should be wrapped in blocking), cats-effect and ZIO run huge numbers of lightweight fibers (about 150 bytes each in cats-effect) over a small work-stealing pool, and JDK 21 virtual threads (JEP 444) give blocking-style code on the JVM.",
 pros:["No shared mutable state, so no locks or data races inside an actor.","Failure is isolated and handled by supervision trees ('let it crash').","Location transparency: the same send works for a local or a remote actor.","A natural fit for many independent stateful entities such as sessions, devices or game rooms."],
 cons:["All interaction is asynchronous: ordering is harder to reason about and request-reply needs correlation.","The mailbox hides a queue: unbounded mailboxes turn overload into memory growth and latency.","Blocking inside an actor starves the dispatcher unless the work is isolated on its own pool.","Akka has been under the Business Source License since 2.7 (September 2022); Apache Pekko is the Apache-licensed fork of Akka 2.6, and cats-effect, ZIO and virtual threads are alternatives."],
 fails:[{m:"Mailbox overflow",s:"Mailbox size and latency keep growing, then the process runs out of memory.",x:"Bound mailboxes, apply back-pressure with Reactive Streams, shard hot actors, add capacity."},
  {m:"Blocking in the default dispatcher",s:"Throughput collapses and actors stop answering while every dispatcher thread is blocked.",x:"Run blocking calls on a dedicated bounded dispatcher (bulkheading) or wrap them in blocking."},
  {m:"Restart loses state",s:"After a failure an actor starts from an empty state and answers incorrectly.",x:"Persist state (event sourcing) and recover it on restart, or choose resume for harmless exceptions."}],
 watch:["Mailbox size per actor and message processing time.","Dead letters and supervisor restarts.","Dispatcher thread utilization and blocked threads."]},
{how:"CPython compiles source to bytecode and runs it in a C loop; each instruction works on heap objects that carry a type and a reference count, and even an integer addition checks types and allocates a result. The specializing adaptive interpreter introduced in 3.11 caches type information and made code about 25% faster on average. The GIL is a mutex and condition variable per interpreter: a thread that waits for it times out after the switch interval (5 ms) and sets a drop request on the holder, and the lock is always released around blocking I/O and by some C extensions. Python 3.12 gave each sub-interpreter its own GIL (PEP 684). Python 3.13 added an optional free-threaded build and an experimental JIT; in 3.14 free threading is officially supported but still optional (PEP 779), with a single-thread overhead the documentation puts at roughly 5 to 10%, and concurrent.interpreters and InterpreterPoolExecutor arrived (PEP 734).",
 pros:["Threads and asyncio overlap I/O well because the GIL is released while waiting.","The GIL keeps the object model and C extensions simple and fast in single-threaded code.","multiprocessing gives real parallelism and fault isolation, at the price of pickling data.","Free-threaded builds and per-interpreter GILs make multi-core Python possible without leaving the language."],
 cons:["CPU-bound pure-Python threads do not run in parallel and contend for the lock.","Tight numeric loops are roughly 50 to 100 times slower than C, Rust or Go in benchmark comparisons.","Process pools need start-up time and pickling; data shared across processes is copied.","Free-threaded builds cost single-thread speed and need libraries that are thread-safe and compatible."],
 fails:[{m:"Threads do not speed up CPU work",s:"CPU use stays near one core out of many and latency is unchanged.",x:"Use ProcessPoolExecutor, a native library that releases the GIL (NumPy and similar), or a free-threaded build."},
  {m:"Blocking call inside asyncio",s:"The whole service stalls; asyncio debug mode reports a slow callback.",x:"Use asyncio.to_thread or run_in_executor for blocking code, and async clients for I/O."},
  {m:"Race despite the GIL",s:"Counters or check-then-act logic give wrong results under load.",x:"Use locks, queue.Queue or atomic operations: the GIL only protects the interpreter, and a switch can happen between bytecodes."}],
 watch:["CPU utilization per core: one busy core with many idle ones points to a GIL or event-loop bottleneck.","Event-loop lag in asyncio services.","Time spent pickling and unpickling in process pools."]},
{how:"The VFS layer turns a path into a dentry and an inode, caching both. An inode holds the size, permissions and block pointers (classic file systems use direct and indirect pointers; ext4 uses extents). File reads go through the page cache, keyed by inode and page index, and miss only when the page is not in RAM. Writes dirty a cached page and return; background writeback flushes it later, and fsync forces it. The kernel also reads ahead when it sees sequential access.",
 pros:["Most reads never touch the device: they are memory copies.","Names, metadata and data are separate, so rename, links and permissions are cheap.","Write-back caching batches and orders writes, raising throughput.","Read-ahead hides device latency for sequential reads."],
 cons:["Written data is not durable until it is flushed: a crash can lose recent writes without fsync.","The cache competes with programs for memory.","Directories with millions of entries and many small files stress metadata.","Cold caches (after reboot or failover) cause latency spikes."],
 fails:[{m:"Out of inodes",s:"Writes fail with 'No space left on device' although df shows free space.",x:"Check df -i; use a file system or layout that allocates inodes dynamically, or fewer, larger files."},
  {m:"Writeback stall",s:"A burst of dirty pages is flushed at once and all writers block for seconds.",x:"Tune the dirty ratio and background ratio, spread writes, use fsync deliberately."},
  {m:"Cold cache after restart",s:"First requests after a reboot are 100 to 1,000 times slower.",x:"Warm the cache before taking traffic, or keep the hot set small enough to read quickly."}],
 watch:["Dirty and Writeback bytes in /proc/meminfo.","Device latency (iostat await) against cache hit ratio.","Free space and free inodes (df, df -i)."]},
{how:"A file operation updates several blocks (data, inode, allocation bitmap). A journaling file system first writes the metadata changes to a journal, then a commit record, then applies them to their home locations (checkpoint). On boot it replays committed transactions and ignores the rest. ext4 defaults to ordered mode: data blocks are written before the metadata that references them is committed. Barriers or FUA writes keep the commit behind the data it covers.",
 pros:["Recovery reads a small journal instead of scanning the whole disk.","A multi-block update is atomic: all of it or none of it.","Ordered mode prevents a committed inode from pointing at stale data.","The same write-ahead idea is used by databases and replicated logs."],
 cons:["Metadata is written twice (journal and home), which adds write amplification.","Commit needs flushes, which add latency to fsync.","Journaling protects file system structure, not application-level consistency.","If a disk acknowledges writes it has not made durable, no journal can help."],
 fails:[{m:"Slow fsync",s:"Application latency spikes at commit; the journal thread is busy flushing.",x:"Put the journal on a faster device, batch commits, avoid fsync per tiny write."},
  {m:"Volatile write cache lies",s:"After a power cut a committed file has garbage or a corrupt structure.",x:"Use enterprise drives with power-loss protection, enable barriers, never disable flushes for speed."},
  {m:"File system remounted read-only",s:"Writes fail with 'Read-only file system' after an I/O error.",x:"Check dmesg and SMART, run fsck offline, replace the disk."}],
 watch:["Commit and fsync latency percentiles.","Kernel log for I/O and journal errors.","Disk health (SMART) and write-cache settings."]},
{how:"The block layer merges adjacent requests and orders them before sending them to the device. On a spinning disk, ordering (an elevator) reduces head movement and the deadline keeps requests from waiting too long. Modern Linux uses blk-mq: per-CPU software queues feed hardware queues, and the available schedulers are none, mq-deadline, bfq and kyber. NVMe devices usually run with none, since they have no head and parallelize internally.",
 pros:["Sorting and merging turn random I/O into mostly sequential motion on a hard disk.","Deadlines bound how long a request can wait.","Per-CPU queues remove lock contention on fast devices.","Per-process schedulers such as bfq can protect interactive latency."],
 cons:["Sorting adds latency to individual requests in exchange for throughput.","On flash the sorting is wasted work and can hurt.","Reordering can starve requests if there is no deadline.","Virtual disks hide the real geometry, so the physical head position is unknown."],
 fails:[{m:"Read latency under heavy writeback",s:"Reads take seconds while a large write flush runs.",x:"Use mq-deadline or bfq, limit writeback with cgroup io controls, throttle the writer."},
  {m:"Queue saturation",s:"High utilization and growing queue depth (aqu-sz), latency climbs linearly.",x:"Reduce concurrency, add devices or move to faster storage."},
  {m:"Wrong scheduler for the device",s:"Throughput much lower than the device spec on NVMe, or poor fairness on a shared hard disk.",x:"Set none for NVMe, mq-deadline or bfq for hard disks; check /sys/block/<dev>/queue/scheduler."}],
 watch:["iostat -x: await, aqu-sz and %util per device.","Scheduler per device in /sys/block/*/queue/scheduler.","Read and write latency percentiles from the application side."]}
];
