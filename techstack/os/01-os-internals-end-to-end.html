<title>Operating System &amp; Concurrency Internals</title>
<link rel="stylesheet" href="../../assets/lab.css">
<style>
:root{--acc:#0f9d8a;--acc2:#d6456b}
@media(prefers-color-scheme:dark){:root{--acc:#3ccfb8;--acc2:#ff7aa0}}
@media(max-width:820px){.g2{grid-template-columns:1fr}}
.lane{display:grid;grid-template-columns:78px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:6px 9px;margin:4px 0;background:var(--card);transition:opacity .15s}
.lane.fut{opacity:.35}.lane.cur{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 25%,transparent)}.lane.bad{border-color:var(--bad)}
.lane .who{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 6px;text-align:center}
.who.u{background:var(--p0)}.who.k{background:var(--p5)}.who.h{background:var(--p4)}
.lane .cost{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--mut);white-space:nowrap}
.modebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.mode{font-weight:700;border-radius:999px;padding:3px 12px;font-size:13px}
.mode.u{background:var(--p0)}.mode.k{background:var(--p5)}
.cell{display:inline-block;min-width:34px;padding:2px 6px;margin:1px;border:1px solid var(--line);border-radius:6px;text-align:center;font-family:ui-monospace,monospace;font-size:12px;background:var(--card)}
.cell.hit{background:var(--p2)}.cell.miss{background:var(--p5)}.cell.new{outline:2px solid var(--acc)}
.bits{font-family:ui-monospace,monospace;font-size:14px;letter-spacing:.5px}
.bits span{padding:2px 5px;border-radius:5px;margin-right:3px}
.pgrid{display:grid;gap:3px;overflow-x:auto;padding-bottom:4px}
.pgrid div{min-width:30px;text-align:center;font-family:ui-monospace,monospace;font-size:12px;border:1px solid var(--line);border-radius:5px;padding:2px 0;background:var(--card)}
.pgrid .h{background:transparent;border:0;color:var(--mut);font-size:11px}
.pgrid .f{background:var(--p5);border-color:var(--bad);font-weight:700}
.pgrid .nf{background:var(--p2)}
.blk{display:inline-block;width:46px;padding:4px 0;margin:2px;border:2px solid var(--line);border-radius:7px;text-align:center;font-size:11px;font-family:ui-monospace,monospace;background:var(--card)}
.blk.on{background:var(--p2);border-color:var(--ok)}.blk.off{opacity:.55}.blk.bad{background:var(--p5);border-color:var(--bad)}
.thr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.legend2{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--mut);margin:2px 0 6px}.legend2 i{display:inline-block;width:14px;height:8px;border-radius:2px;vertical-align:middle;margin-right:4px}
.view table{white-space:normal}
</style>

<script>
const STORY={
 system:'Operating System',
 title:'<span>Operating System</span> &amp; Concurrency Internals',
 lead:'Start from a machine that must run 200 programs at once on 4 cores, 8 GB of RAM and one disk. Watch the obvious design break. Then see what a kernel does about it, and how threads, event loops, goroutines, actors and the Python GIL build on it, with a small model of each mechanism running in your page.',
 problem:{
  scene:[
   'You are writing the <b>kernel for a shared server</b>: 4 CPU cores, 8 GB of RAM and one disk, running 200 programs written by different teams. Some are batch jobs that never stop computing, some are web handlers that need an answer in milliseconds, and some are buggy.',
   'Product says: <i>"Any program may crash, loop forever or misbehave, and the machine must keep serving everyone else. A power cut must never leave the files in a state we cannot read."</i> You have to design the layer between the hardware and those programs.'],
  musts:[
   '<b>Protection.</b> A program cannot read another program\'s memory, touch the hardware or halt the machine.',
   '<b>Fair, responsive CPU sharing.</b> 200 programs on 4 cores, and a short job is not stuck behind a long one.',
   '<b>The illusion of private memory</b> larger than the RAM that exists.',
   '<b>Correct under concurrency.</b> Two threads updating the same data never lose an update, and ten thousand waiting clients do not need ten thousand threads.',
   '<b>Durable files.</b> After a crash the file system is consistent and recovery is fast.',
   '<b>Efficient I/O.</b> A slow disk does not freeze the CPU or every other program.'],
  naive:{title:'Your first instinct: let each program run directly on the hardware, one after another',text:'Load a program, give it the whole machine, run it to completion, then load the next one. It is simple, and then:',
   breaks:['One infinite loop or one 6-hour batch job blocks everything queued behind it.','Programs share the same addresses, so one stray pointer overwrites another program or the kernel itself.','Any program can issue a disk command or halt the CPU: there is no way to enforce rules.','Two copies of the same program cannot run together, and the sum of all memory cannot exceed RAM.']},
  quest:'Rebuild the core of an operating system in 13 chapters: a protected kernel boundary first, then scheduling, virtual memory and page replacement, then concurrency (threads, locks, event loops, Go, actors and Python), and finally files, crash consistency and disk scheduling. Each chapter meets a problem, tries the naive fix, watches it fail, then runs the real design.'},
 overview:{title:'The whole system on one page',lead:'Before the details, see how one <code>read()</code> call travels from a program down to the disk and back. Press <b>Trace a request</b>, or tap a component to see what it receives and sends. Colors match the chapters.'},
 chapters:[
  {ask:'Any program may run any instruction. How do you stop one of them from halting the machine or touching the disk?',
   why:'If every program can execute every instruction and access every address, a single bug takes the whole machine down, and there is no way to enforce any other rule such as memory isolation or file permissions.',
   v0:{name:'Trust programs to call the hardware directly',code:'program:\n  out(DISK_PORT, cmd)      // talk to the device\n  halt()                   // stop the CPU\n  *(kernel_addr) = 0       // overwrite the OS',breaks:'Nothing stops a buggy or hostile program from running <b>privileged instructions</b>, overwriting the OS, or monopolizing the CPU forever. Isolation and fairness cannot be built on top of code that can simply ignore them.'},
   design:'Run the CPU in two modes. User mode can only compute on its own memory. Anything privileged (devices, page tables, halting) runs in kernel mode, and the only way in is a controlled <b>trap</b> to a fixed entry point: a system call, a fault, or a hardware interrupt.',
   principle:'<b>Enforce rules in hardware, then let one trusted program use them.</b> The CPU refuses privileged instructions in user mode and jumps to the kernel at an address the kernel chose, so a program can ask the kernel for work but never run its own code with kernel rights. A timer interrupt guarantees the kernel always gets control back.',
   predict:{q:'A user program executes the privileged instruction <code>hlt</code> (halt the CPU). What happens?',opts:['The CPU halts and the machine stops until a reset','The CPU raises a protection fault, the kernel takes over and kills that program','The instruction is silently ignored'],ans:1,why:'In user mode a privileged instruction triggers a <b>general protection fault</b>. Control jumps into the kernel, which sends the offending process a signal (SIGSEGV or SIGILL on Linux) and keeps running. Pick it in the playground.'},
   build:{intro:'Simplified here to a handful of steps. On x86-64 the <code>syscall</code> instruction switches the privilege ring and the kernel stack in a few dozen cycles.',steps:['A <b>mode bit</b> in a CPU register (ring 3 for user, ring 0 for kernel). Privileged instructions check it.','A <b>trap table</b> the kernel fills at boot: interrupt, fault and syscall number each map to a handler address. User code cannot edit it.','<code>syscall</code> saves the user registers, switches to the <b>kernel stack</b> and jumps to the handler, which dispatches on the syscall number.','<b>Validate every argument</b> from user space: file descriptors and pointers are checked before use, and the kernel copies data with checked helpers.','A <b>timer interrupt</b> fires every few milliseconds so the kernel can preempt a program that never calls it.'],
    code:'syscall_entry(nr, a0, a1, a2):\n  save(user_regs); mode = KERNEL; stack = kstack\n  if nr not in table: return -ENOSYS\n  ret = table[nr](a0, a1, a2)    // each handler validates its args\n  mode = USER; restore(user_regs); return ret',
    rule:'User code can only enter the kernel <b>through the trap table</b>, and the kernel never trusts a pointer or number it received from user space.'}},
  {ask:'200 programs share 4 cores. Who runs next, and for how long, so that short jobs are not stuck behind long ones?',
   why:'A batch job that computes for an hour must not delay a web handler that needs 2 ms of CPU, and a scheduler that switches too often wastes the CPU on switching itself.',
   v0:{name:'First come, first served, run to completion',code:'queue = [job1, job2, ...]\nwhile queue:\n  j = queue.pop_front()\n  run(j) until j.done',breaks:'A long job at the head blocks every short job behind it (the <b>convoy effect</b>): the average wait explodes and interactive programs feel frozen. Nothing ever interrupts a job that never finishes.'},
   design:'Slice time. The timer interrupt preempts the running task and the scheduler picks another from the run queue. Round robin gives equal slices; a fair scheduler tracks how much CPU each task has received and always runs the one that has had the least, weighted by priority.',
   principle:'<b>Fairness is bookkeeping.</b> Keep one number per task (CPU time received, divided by its weight) and always run the task with the smallest number. A task that sleeps falls behind, so when it wakes it runs soon: interactive tasks get low latency without being labelled interactive.',
   predict:{q:'One CPU-bound task and four short tasks arrive together. You pick <b>first come, first served</b> with the long task first. What happens to the short tasks?',opts:['They finish quickly: short jobs are always prioritized','They all wait for the entire long task to finish','They run in parallel on the same core'],ans:1,why:'Without preemption the long task holds the CPU until it ends, so every short task waits its full length. Switch the policy to round robin or fair and compare the <b>average response time</b>.'},
   build:{intro:'Single core, 1 ms ticks. Linux used a weighted-fair scheduler (CFS) until kernel 6.5 and moved to EEVDF in 6.6; both rest on this idea.',steps:['A <b>run queue</b> of runnable tasks, each with a remaining burst, a weight (from its nice value) and a <code>vruntime</code>.','On every tick (or when the slice ends) pick the task with the <b>smallest vruntime</b>; run it for its slice.','When a task runs for <code>d</code> ms, add <code>d &times; 1024 / weight</code> to its vruntime, so heavier tasks age more slowly.','A task that wakes from sleep gets a vruntime near the queue minimum, never far in the past, so it cannot hog the CPU to catch up.','Count <b>context switches</b>: each one costs microseconds of saved registers and cold caches.'],
    code:'pick():\n  t = min(runnable, key = vruntime)\n  slice = max(MIN_GRAN, LATENCY * t.weight / sum(weights))\n  run(t, slice)\n  t.vruntime += ran * 1024 / t.weight\n  if t.remaining > 0: runnable.add(t)',
    rule:'Every runnable task is picked within a bounded time, and over a long run the CPU is divided in proportion to the weights.'}},
  {ask:'Two programs both use address 0x00400000. How can they, and why can neither touch the other\'s data?',
   why:'If programs use physical addresses they collide, a bug in one corrupts another, and each program would have to be loaded at an address that is free right now.',
   v0:{name:'Give each program a base address and a size',code:'phys = base + vaddr\nif vaddr >= limit: fault',breaks:'Each program needs one <b>contiguous</b> block, so memory fragments and a program cannot grow. Sharing a library between processes is impossible, and a program larger than free memory cannot run at all.'},
   design:'Give every process its own <b>virtual address space</b>, cut into 4 KB pages. A per-process page table maps virtual pages to physical frames, with permission bits. The MMU translates every access in hardware, and a small cache called the TLB makes it fast.',
   principle:'<b>Add a level of indirection the hardware enforces.</b> Programs only ever name virtual addresses; the kernel decides what each one means and can leave a page unmapped, share it, make it read-only or fetch it lazily. A missing mapping raises a page fault instead of an error.',
   predict:{q:'A process stores to a virtual page whose page-table entry is marked <b>read-only</b>. What happens?',opts:['The write goes through and the entry is ignored','The MMU raises a protection fault and the kernel decides (for example a copy-on-write copy, or SIGSEGV)','The page is silently moved to disk'],ans:1,why:'Permission bits are checked on every access by the MMU. A write to a read-only page faults into the kernel, which is how <b>copy-on-write</b> after <code>fork()</code> works, and also how a stray write to program code is caught.'},
   build:{intro:'Simplified to the classic 32-bit layout: 10 + 10 + 12 bits. Modern x86-64 uses four or five levels with the same idea.',steps:['Split a virtual address into <b>L1 index, L2 index and page offset</b> (10, 10 and 12 bits).','<b>Page directory</b> (L1) entries point to <b>page tables</b> (L2); an entry holds a frame number plus <code>present</code>, <code>writable</code> and <code>user</code> bits.','On access, check the <b>TLB</b> first: a hit gives the frame without touching memory. On a miss, walk both levels (extra memory reads) and fill the TLB.','Not present: raise a <b>page fault</b>. The kernel decides: load the page, allocate a zero page, copy on write, or kill the process.','On a context switch to another process, load its page-table root and flush (or tag) the TLB.'],
    code:'translate(va, write):\n  e = tlb.get(vpn(va))\n  if !e: e = walk(root, va); tlb.put(vpn(va), e)\n  if !e.present: raise PageFault\n  if write and !e.writable: raise ProtFault\n  return e.frame << 12 | offset(va)',
    rule:'A process can only reach the frames its own page table maps, with the permissions the kernel set, so isolation does not depend on programs behaving.'}},
  {ask:'All frames of RAM are in use and a program touches a page that is on disk. Which page do you throw out?',
   why:'A disk read is about 100,000 times slower than a RAM access. Evict the wrong page and the next access is another disk read, so a bad choice can make the whole machine crawl.',
   v0:{name:'Evict the page that has been in memory the longest (FIFO)',code:'on fault:\n  victim = frames.pop_front()   // oldest\n  load(page); frames.push_back(page)',breaks:'The oldest page is often the one in use all the time, like the loop code or a hot table. FIFO can even get <b>worse with more memory</b> (Belady\'s anomaly): the playground shows 9 faults with 3 frames and 10 with 4.'},
   design:'Approximate LRU. Keep a <b>reference bit</b> per page that the hardware sets on access, and sweep the frames like a clock: a page with the bit set gets a second chance, one with the bit clear is evicted. Reclaim in the background, and keep each process\'s working set resident.',
   principle:'<b>The past predicts the near future.</b> Programs reuse recent pages (locality), so evicting the least recently used page is nearly the best possible choice. True LRU needs an update on every access, so real kernels approximate it with one hardware bit and a sweep.',
   predict:{q:'With the FIFO policy you give the same reference string <b>more frames</b> (3 to 4). What happens to the number of page faults?',opts:['It can never increase','It can increase (Belady\'s anomaly)','It stays exactly the same'],ans:1,why:'FIFO is not a <i>stack algorithm</i>, so the set of pages held with n+1 frames is not always a superset of the set held with n. LRU and OPT are stack algorithms and never get worse. Choose FIFO and the Belady string.'},
   build:{intro:'Simplified. Linux keeps active and inactive page lists (and since 6.1 can use multi-generational LRU), plus a background thread, <code>kswapd</code>, that reclaims before memory runs out.',steps:['A <b>frame table</b>: for each frame the page it holds, a dirty bit and a reference bit.','On a fault with no free frame, run the <b>clock hand</b>: clear the reference bit and move on if it was set, otherwise pick the page.','If the victim is <b>dirty</b>, write it to swap first; clean pages (such as file data) are just dropped.','Read the faulting page into the frame, set the page-table entry, restart the instruction.','Watch the <b>fault rate</b>: when it climbs, the machine is thrashing and the fix is fewer running programs, not a cleverer algorithm.'],
    code:'victim():\n  loop:\n    f = frames[hand]; hand = (hand + 1) % N\n    if f.ref: f.ref = 0        // second chance\n    else: return f\non_fault(page):\n  f = free() or victim()\n  if f.dirty: write_swap(f)\n  read(page, into = f); map(page, f)',
    rule:'A frame holds exactly one page, and a dirty page is <b>never dropped</b> before it is written back.'}},
  {ask:'Your server handles one request at a time and is slow. Do you add threads, processes or cores, and why does adding cores not make it N times faster?',
   why:'Programs spend their time doing two different things: waiting (for a disk, a network, a database) and computing. Waiting needs no CPU, so it can overlap with other work; computing needs a core. Mix the two up and you add threads that queue for nothing, or cores that sit idle.',
   v0:{name:'Handle one request at a time',code:'while True:\n  req = accept()\n  handle(req)        // parse, wait 50 ms for the database, render',breaks:'While a request waits 50 ms for the database the CPU does nothing, and adding cores changes nothing because there is still only one stream of work. Throughput is capped at 1 / (time per request).'},
   design:'Separate two ideas. <b>Concurrency</b> is structuring work as independent tasks whose lifetimes overlap, so a core can run another task while one waits; one core is enough. <b>Parallelism</b> is running tasks at the same instant on different cores. Use concurrency to hide waiting, parallelism to speed up computing, and measure the part that cannot be split (Amdahl\'s law).',
   principle:'<b>Concurrency is a way to structure a program; parallelism is a way to run it.</b> A concurrent program can run on one core or many; a parallel speedup needs independent work and is bounded by its serial fraction: with 10% serial work, no number of cores gives more than 10&times;. The unit you pick (process, thread, coroutine) decides how heavy each task is and who schedules it.',
   predict:{q:'Four I/O-bound tasks (1 ms of CPU, 8 ms waiting, 1 ms of CPU) run <b>interleaved on one core</b>. Compared with running them one after another, how much faster is it?',opts:['No faster: one core can only do one thing at a time','About 3 times faster: the waits overlap','Exactly 4 times faster, one per task'],ans:1,why:'The core is busy for only 2 ms of each task\'s 10 ms. While one task waits, another computes, so the four waits overlap and the whole run takes about 13 ms instead of 40. It is not 4&times; because the CPU parts still run one at a time. Pick <b>concurrent</b> in the playground.'},
   build:{intro:'Simplified. A process has its own address space; a thread shares its process\'s memory (so it is cheap to create and to share data, and also able to race); coroutines and goroutines are tasks scheduled in user space, covered in the next chapters.',
    steps:['<b>Classify the work:</b> compare CPU time with wall-clock time. Wall time much larger than CPU time means I/O-bound; they are equal means CPU-bound.','<b>I/O-bound:</b> raise concurrency (threads, an event loop) up to the number of requests in flight; cores hardly matter.','<b>CPU-bound:</b> raise parallelism: about one worker per core. More workers than cores only adds context switches.','<b>Measure the serial fraction</b> <code>s</code> (setup, merging results, a lock): the speedup limit is <code>1 / s</code>.','<b>Choose isolation or sharing:</b> processes when a task may crash or leak and data can be copied; threads when tasks must share large data in memory.'],
    code:'workers  = cores               // CPU-bound: more only adds switching\ninflight = requests_in_flight  // I/O-bound: limited by memory, not cores\nspeedup(n) = 1 / (s + (1 - s) / n)    // Amdahl: s = serial fraction',
    rule:'Size CPU-bound pools by cores, I/O-bound concurrency by requests in flight, and never promise a speedup beyond <code>1 / s</code>.'}},
  {ask:'Two threads each add 1 to a shared counter 5 times. Why does it end at 7 instead of 10, and how do you fix it without freezing everything?',
   why:'<code>counter++</code> is three steps: load, add, store. The scheduler can switch threads between any two of them, so updates are overwritten, and the bug only appears on some runs.',
   v0:{name:'Hope the threads do not interleave',code:'thread:\n  for i in 1..5:\n    tmp = counter      // load\n    tmp = tmp + 1      // add\n    counter = tmp      // store',breaks:'Both threads load the same value, both store <code>v+1</code>, and one increment is <b>lost</b>. Disabling interrupts for every update would stop the bug but also stops everything else and does nothing on multiple cores.'},
   design:'Make the critical section atomic. A <b>mutex</b> lets one thread in and puts the others to sleep; a single <b>atomic instruction</b> (such as fetch-and-add) does a read-modify-write that no one can split. Take multiple locks in one global order so they cannot wait on each other in a cycle.',
   principle:'<b>Shared mutable state needs a single point of ordering.</b> Either serialize access (mutex), make the operation indivisible (atomic), or avoid sharing. Deadlock needs four conditions at once (mutual exclusion, hold and wait, no preemption, circular wait); break one, usually circular wait with lock ordering.',
   predict:{q:'Thread 1 locks A then B. Thread 2 locks B then A. Both run at the same time. What can happen?',opts:['Nothing: a mutex always grants the lock eventually','Each can hold one lock and wait forever for the other (deadlock)','The kernel always cancels one thread'],ans:1,why:'If thread 1 holds A and thread 2 holds B, each waits for the lock the other holds: a cycle in the wait-for graph. Nothing times out. Choose <b>lock ordering</b> and both lock A first, so the cycle cannot form.'},
   build:{intro:'Simplified. Real mutexes (Linux futexes) spin or take an atomic compare-and-swap in user space and only enter the kernel to sleep under contention.',steps:['A lock is a word in memory changed with an <b>atomic compare-and-swap</b>, so two cores cannot both win.','If the lock is taken, <b>sleep on a wait queue</b> (the futex) instead of spinning; the unlocker wakes one waiter.','Prefer <b>atomics</b> for a single counter or flag: one instruction, no sleeping, no deadlock.','Define a <b>global lock order</b> and always acquire in that order; tools such as lockdep check it at runtime.','Keep critical sections short, and never hold a lock across a slow operation like disk I/O.'],
    code:'lock(m):\n  while !cas(m.state, FREE, HELD):\n    sleep_on(m.waiters)\nunlock(m):\n  m.state = FREE; wake_one(m.waiters)\n// rule: acquire(A) always before acquire(B)',
    rule:'At most one thread is inside the critical section, and the global lock order guarantees no cycle of waiting threads.'}},
  {ask:'Ten thousand clients are connected and nearly all of them are waiting. How can one thread serve them all, and what does <code>await</code> actually do?',
   why:'A thread costs a kernel task, a stack (typically 8 MB of virtual address space on Linux, 1 MB by default on the JVM) and context switches. Ten thousand threads that sleep most of their life waste memory and scheduler time; ten thousand coroutines parked in an event loop do not.',
   v0:{name:'One thread per connection, blocking calls',code:'for conn in accept():\n  spawn_thread(serve, conn)\ndef serve(conn):\n  req = conn.recv()            // blocks this thread\n  row = db.query(req)          // blocks this thread\n  conn.send(render(row))',breaks:'Every connection pins a thread that is asleep nearly all of the time. Past a few thousand connections the memory, the scheduler and the caches dominate (the C10K problem), and a pool of N threads caps concurrency at N no matter how many requests are waiting.'},
   design:'Make waiting cheap. Put sockets in non-blocking mode and register them with the kernel\'s readiness API (<code>epoll</code> on Linux, <code>kqueue</code> on BSD and macOS, IOCP on Windows). One loop asks the kernel "which of these is ready?", runs the code waiting on each ready one, and sleeps in <code>epoll_wait</code> when none is. A coroutine is a function whose local state is saved at each <code>await</code>, so the loop can resume it later.',
   principle:'<b>Never wait on a thread: ask the kernel to tell you when you can proceed.</b> This is the reactor pattern: an event demultiplexer (epoll) plus handlers. <code>async</code>/<code>await</code> is syntax that turns straight-line code into those handlers (a compiler-generated state machine), so you do not write callbacks by hand. It works only while every handler returns quickly: scheduling is cooperative, nothing preempts a coroutine.',
   predict:{q:'An async handler runs a CPU-heavy function for 30 ms (or calls <code>time.sleep(0.03)</code>) <b>without awaiting</b>. What happens to the other requests on that event loop?',opts:['They keep running: the loop switches to them automatically','All of them are delayed by 30 ms: nothing else runs until the handler returns control','Only requests that use the same database are delayed'],ans:1,why:'There is one thread and no preemption. The loop only regains control when the handler awaits or returns, so every other callback waits behind it. Turn on <b>A handler blocks</b> in the playground and compare the event loop with the thread pool, where only one thread is stuck.'},
   build:{intro:'Simplified. Python asyncio, Node.js (libuv), Rust tokio and the Netty library on the JVM follow this design.',steps:['<b>Non-blocking sockets</b> registered with <code>epoll</code> (interest: readable, writable).','<b>The loop:</b> run every ready callback, then <code>epoll_wait(timeout = next timer)</code>; when events arrive, mark the coroutines waiting on those descriptors as ready.','<b>A coroutine</b> runs until its next <code>await</code>, then returns control to the loop (cooperative scheduling). Its locals are kept in a frame or state-machine object.','<b>Timers</b> live in a heap; the earliest one sets the <code>epoll_wait</code> timeout.','<b>Push blocking or CPU-heavy work</b> to a thread or process pool (<code>run_in_executor</code>) and await the result, so the loop stays free.'],
    code:'loop():\n  while True:\n    for cb in ready: cb()                      // each runs to completion\n    events = epoll_wait(fds, timeout = next_timer())\n    for fd in events: ready.append(waiting[fd])\nasync def handle(conn):\n  req = await conn.read()       // register fd, suspend, back to the loop\n  row = await db.get(req.key)   // another suspension point\n  await conn.write(render(row))',
    rule:'A coroutine resumes only when what it awaits is ready, and it must hand control back quickly: one handler that does not await stalls every other request.'}},
  {ask:'You want straight-line code for a million concurrent tasks that still uses every core. How does Go run a million goroutines on a few threads, and why are channels safer than shared memory?',
   why:'OS threads are too heavy for a million tasks, and a single event loop uses one core and forces callbacks. You want cheap tasks, automatic use of all cores, and a way to pass data between tasks without a lock around every variable.',
   v0:{name:'One OS thread per task',code:'for i in 1..1_000_000:\n  pthread_create(work, i)      // a kernel task and a stack each\n// share results through global variables + mutexes',breaks:'A million kernel tasks with megabyte-sized stacks exhaust memory and overwhelm the OS scheduler, and every shared variable needs a lock that someone will forget.'},
   design:'Schedule goroutines in user space. The runtime keeps one <b>processor (P)</b> per core, each with a local run queue; an OS <b>thread (M)</b> must hold a P to run <b>goroutines (G)</b>. An idle P <b>steals half</b> of another P\'s queue. A goroutine that blocks in a system call gives its P to another thread, network waits park the goroutine in a netpoller (epoll), and a goroutine that runs too long is preempted. Goroutines start with a tiny growable stack. <b>Channels</b> are typed queues: a goroutine that cannot send or receive is parked, not blocking a thread.',
   principle:'<b>Do not communicate by sharing memory; share memory by communicating.</b> This is CSP (Hoare, 1978): when a value moves through a channel its ownership moves too, so only one goroutine touches it at a time. A work-stealing scheduler gives you parallelism and a bounded channel gives you back-pressure, without writing either yourself.',
   predict:{q:'A goroutine makes a blocking system call (a file read) that takes 8 ms. What does the Go runtime do with the processor (P) it was running on?',opts:['Keeps it idle until the call returns','Hands the P to another thread so other goroutines keep running','Kills the goroutine after 1 ms'],ans:1,why:'The thread stays blocked in the kernel with the goroutine, but the runtime detaches the P (the monitor thread retakes it after a short time) and gives it to another thread. Choose the <b>16 goroutines that block in a system call</b> workload and switch <b>P is handed off</b> to <b>P stays blocked</b> to see the difference.'},
   build:{intro:'Simplified from the Go runtime (the G, M and P structures of the scheduler).',steps:['<b>Structures:</b> G (stack, state, program counter), M (an OS thread), P (a run queue of up to 256 goroutines plus allocation caches), and a global queue.','<code>go f()</code> creates a G and puts it on the current P\'s local queue.','<b>Scheduler loop:</b> take the next G from the local queue, then the global queue, then the network poller, then <b>steal half</b> of a random P\'s queue; run it until it blocks, finishes or is preempted.','<b>Blocking system call:</b> the M keeps the G; the P is retaken by a monitor thread (sysmon) and handed to another M.','<b>Preemption:</b> the monitor signals a goroutine that has run for about 10 ms (asynchronous preemption since Go 1.14) so a loop cannot starve the rest.','<b>Channel:</b> a ring buffer plus a queue of waiting receivers and senders; blocking parks the G and the peer\'s operation makes it runnable again.'],
    code:'schedule():\n  g = P.runq.pop() or global.pop() or netpoll() or steal_half(random P)\n  run(g)                       // until it blocks, ends or is preempted\nsend(ch, v):\n  if receiver waiting: hand v over; ready(receiver)\n  elif buffer has room: buffer.push(v)\n  else: park(self)             // no thread is blocked',
    rule:'A runnable goroutine sits in exactly one queue, a P does not idle while another queue has work, and a blocked goroutine never holds a thread hostage.'}},
  {ask:'Instead of locks around shared state, can each piece of state have a single owner that you talk to by messages? What do actors give you in Scala, and what do you pay for it?',
   why:'Locks do not compose, deadlock, and are easy to forget. Distributed systems already communicate only by messages; the actor model applies that discipline inside one process and across machines, and adds a standard way to handle failure.',
   v0:{name:'Shared state behind locks',code:'synchronized(lock) {\n  counter += 1               // every caller contends here\n}',breaks:'All callers contend on one lock, lock-order mistakes deadlock, and an exception in the middle of an update leaves shared state half changed with no one in charge of repairing it. The code also cannot move to another machine without being rewritten.'},
   design:'An <b>actor</b> has private state, an address and a <b>mailbox</b>. Senders put immutable messages in the mailbox and return immediately. The actor takes one message at a time, may change its own state, send messages or create child actors. A <b>dispatcher</b> runs many actors on a few threads. A parent <b>supervises</b> its children: when one throws, a strategy (resume, restart, stop, escalate) decides what happens. Reactive Streams adds <b>back-pressure</b> between stages.',
   principle:'<b>Isolation, messages and supervision.</b> One-at-a-time processing makes the actor its own mutex; failure is contained and handled outside the failing code ("let it crash", from Erlang); and sending to a local or a remote actor looks the same. The cost is that all coordination becomes asynchronous messaging, with a queue (the mailbox) you must watch.',
   predict:{q:'The arrival rate is <b>180%</b> of what one actor can process and its mailbox is unbounded. What happens over time?',opts:['The actor speeds up to keep pace','Messages pile up without limit: latency and memory grow until something fails','The runtime automatically adds more actors'],ans:1,why:'Nothing in the model adds capacity: the mailbox is just a queue, and a queue fed faster than it drains grows forever. Real systems bound the mailbox, shard the work over more actors, or push back on senders (Reactive Streams). Raise the arrival rate in the playground and watch the line.'},
   build:{intro:'Simplified. Erlang/OTP is the original; in Scala the main implementations are Akka (now under the Business Source License) and its Apache fork Pekko; cats-effect and ZIO offer lightweight fibers as an alternative.',steps:['<b>A mailbox per actor:</b> a multi-producer, single-consumer queue.','<b>Scheduling:</b> an actor with mail is placed on a dispatcher (a fork-join pool) at most once at a time; it processes up to a <code>throughput</code> number of messages, then yields the thread so others get a turn.','<b>Behavior:</b> a pattern match on the message returns the next behavior; state is a local variable that is never shared.','<b>Supervision:</b> an exception goes to the parent, which applies a strategy; <b>restart</b> resets the actor\'s state but keeps its mailbox.','<b>Overload:</b> bound the mailbox (and decide: drop, block or fail the sender), or use Reactive Streams demand signalling.','<b>Blocking calls</b> go to a separate dispatcher so they cannot starve the actors.'],
    code:'class Counter extends Actor {\n  var n = 0                       // private: no lock needed\n  def receive = {\n    case Inc => n += 1\n    case Get => sender() ! n\n  }\n}\ncounter ! Inc                     // returns at once; the message is queued',
    rule:'At most one thread runs an actor at any moment and its state is never touched from outside: messages are the only way in.'}},
  {ask:'Why does a Python program often run dozens of times slower than the same loop in a compiled language, and why do four threads not make a CPU-bound job four times faster?',
   why:'Two separate costs. The interpreter runs every operation through dynamic checks on heap objects, and the global interpreter lock (GIL) lets only one thread execute Python bytecode at a time, so CPU-bound threads cannot use more than one core.',
   v0:{name:'Four threads for a CPU-heavy job',code:'threads = [Thread(target=crunch, args=(chunk,)) for chunk in chunks]\nfor t in threads: t.start()\nfor t in threads: t.join()',breaks:'The threads take turns holding the GIL (a waiting thread asks the holder to release it after the switch interval, 5 ms by default), so the job takes about as long as running the chunks one after another, plus the switching.'},
   design:'Choose the tool by the bottleneck. <b>I/O-bound:</b> threads or <code>asyncio</code>, because the GIL is released while waiting. <b>CPU-bound:</b> <code>multiprocessing</code> (separate interpreters with separate GILs, data pickled between them), native libraries that release the GIL (NumPy and many C extensions), or a <b>free-threaded</b> build with no GIL (experimental in 3.13, officially supported but optional since 3.14). For raw speed, move hot loops into compiled or vectorized code.',
   principle:'<b>The GIL protects the interpreter, not your data.</b> It keeps reference counting and the object model simple and fast for one thread; it does not make your code thread-safe (<code>x += 1</code> still races across bytecodes) and it is the reason threads help with waiting but not with computing. Speed and parallelism are separate problems: boxed objects and dispatch make each step slow; the GIL stops steps from running side by side.',
   predict:{q:'Four threads each do 100 ms of pure-Python computing on a 4-core machine. About how long does the whole job take?',opts:['About 100 ms: four cores run in parallel','About 400 ms: the GIL lets one thread run Python code at a time','About 25 ms'],ans:1,why:'Only the thread holding the GIL executes bytecode, so the four 100 ms chunks run one at a time. Choose <b>multiprocessing</b> or <b>free-threaded CPython</b> in the playground to see the cores being used.'},
   build:{intro:'Simplified. CPython 3.12 added a per-interpreter GIL (PEP 684); 3.13 added an optional free-threaded build (PEP 703) and an experimental JIT; 3.14 supports free threading officially but still as an option (PEP 779). Check the status for your version.',steps:['<b>One lock per interpreter:</b> a thread must hold the GIL to run bytecode.','<b>Hand-over:</b> a thread waiting for the GIL sets a timeout; after the switch interval (5 ms) the holder is asked to drop it at the next bytecode boundary.','<b>Blocking operations</b> (I/O, <code>sleep</code>, many C functions) release the GIL, so other threads can run while they wait.','<b>Reference counting</b> on every object is why one coarse lock was the simple, fast choice for single-threaded code.','<b>Free-threaded build:</b> replaces the GIL with per-object locks and a different reference-counting scheme, at the cost of some single-thread speed.','<b>Speed:</b> a specializing, adaptive interpreter (3.11+) removes some overhead; each operation still dispatches on boxed objects.'],
    code:'# CPU-bound: separate processes, separate GILs\nwith ProcessPoolExecutor(max_workers=cores) as pool:\n    results = list(pool.map(crunch, chunks))   # arguments and results are pickled\n# I/O-bound: one thread, many coroutines\nresults = await asyncio.gather(*(fetch(u) for u in urls))',
    rule:'Use asyncio or threads to overlap waiting, processes or native or free-threaded code to use more cores, and never assume the GIL protects your own data.'}},
  {ask:'A program reads the same log file twice. How does the kernel find the bytes, and why should the second read take microseconds?',
   why:'A path name is just text, the disk only understands numbered blocks, and a disk read costs 100 microseconds (SSD) to 10 milliseconds (hard disk) against 100 nanoseconds for RAM.',
   v0:{name:'Search the disk for a file by name on every read',code:'read(path, offset):\n  for each block on disk:\n    if block.name == path: return block.data[offset]',breaks:'Scanning is O(disk size) per read. A file also has to be stored contiguously to be addressed this way, so it cannot grow, and every read pays the full disk latency even for data read a moment ago.'},
   design:'Separate names from data. A <b>directory</b> maps a name to an <b>inode number</b>; the inode holds the size, permissions and pointers to the data blocks (direct pointers, then indirect blocks). Recently used blocks are kept in the <b>page cache</b> in RAM, so most reads never reach the disk.',
   principle:'<b>Name, metadata and data are three different things.</b> The inode is the file: a name is just a directory entry that points to it, so hard links, renames and permissions are cheap. A small number of pointer levels covers files from bytes to terabytes, and caching hides the device latency.',
   predict:{q:'A 100 MB file is read once cold, then read again right away. How many disk reads does the <b>second</b> read need?',opts:['The same as the first','Half as many','Almost none: the pages are in the page cache'],ans:2,why:'The first read fills the page cache (and the dentry and inode caches for the path). The second read is served from RAM. Switch the playground from cold to warm cache and compare the disk reads and the time.'},
   build:{intro:'Simplified to a classic UNIX layout with 4 KB blocks: 12 direct pointers, then a single and a double indirect block. ext4 uses extents instead, but the lookup path is the same.',steps:['Disk layout: <b>superblock, inode bitmap, data bitmap, inode table, data blocks</b>.','A directory is a file of <code>(name, inode number)</code> entries; resolving <code>/var/log/app.log</code> reads each directory inode and its data block in turn.','An inode has 12 direct pointers (48 KB), one <b>indirect</b> block of 1,024 pointers (+4 MB) and one <b>double indirect</b> (+4 GB).','Reads go through the <b>page cache</b>: look up by (inode, page index), and on a miss read the block and keep it.','Writes only dirty the cached page. A background flusher writes it back later, or <code>fsync</code> forces it now.'],
    code:'read(path, off):\n  ino = lookup(path)                 // dentry cache, else disk\n  pg = cache.get(ino, off / 4096)\n  if !pg: blk = ptr(ino, off / 4096); pg = disk.read(blk); cache.put(ino, off / 4096, pg)\n  return pg[off % 4096]',
    rule:'The data returned for <code>(inode, page)</code> is the newest write to it, whether it is in the cache or on disk.'}},
  {ask:'Appending one block to a file changes three things on disk. If the power fails between them, what state is the disk in?',
   why:'Adding a block updates the data block, the inode (size and pointer) and the free-space bitmap. The disk completes each write on its own, so a crash can leave any subset of them.',
   v0:{name:'Write the three blocks in some order and hope',code:'append(f, data):\n  write(inode)       // size and pointer\n  write(bitmap)      // mark block used\n  write(data_block)  // the new data',breaks:'A crash after only some of the writes leaves the disk <b>inconsistent</b>: an inode pointing at a block the bitmap calls free (it can be given to another file), a block marked used by nobody (a leak), or a file full of stale data. A full check, <code>fsck</code>, must scan the whole disk to find these.'},
   design:'Write intent first. Before changing the real locations, write the planned updates to a <b>journal</b> and then a <b>commit record</b>. After a crash, replay transactions that have a commit and ignore the rest: every transaction is applied entirely or not at all.',
   principle:'<b>Make a multi-step change atomic with a single commit point.</b> Everything before the commit record can be thrown away, everything after it can be replayed, so recovery looks at a small log instead of the whole disk. The same write-ahead idea powers databases.',
   predict:{q:'With a journal, the power fails <b>after the data and the journal entries were written but before the commit record</b>. What does recovery do?',opts:['Replays the transaction anyway','Ignores that transaction: the file system looks exactly as it did before the append','Rebuilds the whole disk with fsck'],ans:1,why:'Without the commit record the transaction is incomplete, so recovery discards it and the old, consistent state remains. The data block written earlier is simply unreferenced. Move the crash slider and watch the verdict.'},
   build:{intro:'Simplified. ext4 defaults to <code>data=ordered</code> journaling: metadata goes through the journal, and data blocks are written to their final place first.',steps:['Group the updates of one operation into a <b>transaction</b>: begin, the block copies, a <b>commit</b> record.','Write data blocks first (ordered mode) so a committed inode never points at garbage.','Flush, then write the <b>commit record</b> (a barrier or FUA write so the disk cannot reorder it earlier).','<b>Checkpoint</b>: copy the journaled blocks to their home locations, then free the journal space.','Recovery on mount: scan the journal, <b>replay committed</b> transactions in order, discard the tail.'],
    code:'commit(tx):\n  write(data blocks)              // ordered mode\n  write(journal: TxBegin, inode, bitmap)\n  flush(); write(journal: TxEnd); flush()   // commit point\n  checkpoint(inode, bitmap); free(journal)\nrecover():\n  for tx in journal: if tx.has_end: replay(tx)',
    rule:'A transaction becomes durable at exactly one write, the commit record: before it nothing is visible, after it everything is.'}},
  {ask:'Eight requests are queued for a spinning disk. In what order do you serve them to keep the head moving as little as possible?',
   why:'On a hard disk a seek costs milliseconds, and the head can only be in one place. Serving requests in arrival order makes it swing back and forth across the platter, but a greedy order can starve requests at the edge.',
   v0:{name:'Serve requests in arrival order (FCFS)',code:'for r in queue:        // arrival order\n  head.seek(r.cylinder)\n  read(r)',breaks:'With requests at 98, 183, 37, 122, 14, 124, 65 and 67 the head crosses the disk again and again: <b>640 cylinders</b> of movement where about 236 would do. Throughput collapses under load.'},
   design:'Reorder the queue. <b>Shortest-seek-first</b> minimizes movement but can starve far requests. The <b>elevator</b> (SCAN) sweeps in one direction serving everything on the way, then reverses; C-SCAN only serves while sweeping one way for more even waits. Flash storage has no head, so it uses simple or deadline schedulers.',
   principle:'<b>Trade a little latency for a lot of throughput, but bound the wait.</b> Batching and sorting requests turns random access into mostly sequential motion. The elevator gives every request a worst case of about two sweeps, which greedy shortest-seek cannot promise.',
   predict:{q:'A steady stream of requests keeps arriving near the head\'s current position. With <b>shortest-seek-first</b>, what happens to a request at the far edge of the disk?',opts:['It is served next because it has waited longest','It can wait indefinitely (starvation)','It is served in exactly two sweeps'],ans:1,why:'SSTF always picks the closest request, so a nearby stream can postpone the far one forever. SCAN and C-SCAN bound the wait by sweeping the whole disk. Add requests near the head in the playground and compare.'},
   build:{intro:'Simplified to cylinders 0 to 199. Linux no longer uses the old elevator for SSDs: block multi-queue schedulers are <code>none</code>, <code>mq-deadline</code>, <code>bfq</code> and <code>kyber</code>.',steps:['Keep a <b>request queue</b> sorted by cylinder (merge adjacent requests into one).','Track the <b>head position and direction</b>; an elevator serves the nearest request ahead in the current direction.','At the edge (or the last request, in LOOK) reverse direction, or jump back to the start (C-SCAN).','Give each request a <b>deadline</b> so none waits past a limit; serve expired ones first.','On SSD/NVMe skip the seek model: use per-CPU queues and let the device parallelize.'],
    code:'next(head, dir, queue):\n  ahead = [r for r in queue if (r - head) * dir >= 0]\n  if ahead: return min(ahead, key = lambda r: abs(r - head))\n  dir = -dir; return next(head, dir, queue)',
    rule:'Every queued request is served, and none waits for more than a bounded number of sweeps.'}}
 ]
};

<script>
Lab.mount(STORY);
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pc=i=>`var(--p${((i%8)+8)%8})`,tc=i=>`var(--t${((i%8)+8)%8})`;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function lcg(seed){let s=(seed>>>0)||1;return()=>{s=(Math.imul(s,1103515245)+12345)&0x7fffffff;return s/0x7fffffff}}
const fmtNs=n=>n<1e3?Math.round(n)+' ns':n<1e6?(n/1e3).toFixed(n<1e4?1:0)+' µs':n<1e9?(n/1e6).toFixed(n<1e7?1:0)+' ms':(n/1e9).toFixed(1)+' s';
const memo=fn=>{const c=new Map();return(...a)=>{const k=JSON.stringify(a);if(!c.has(k))c.set(k,fn(...a));return c.get(k)}};
const hex=(n,w=8)=>'0x'+(n>>>0).toString(16).toUpperCase().padStart(w,'0');
const DISK={nvme:{n:'NVMe SSD',ns:100000},hdd:{n:'hard disk',ns:8000000}};
const S={};   // Lab needs a non-null state object; every chapter is self-contained

const OPT={disk:'nvme',sc1:'read_hit',pol:'cfs',q:4,wl:'mixed',nice:0,proc:'A',va:0,wr:'read',tlbw:'cold',pat:'loop',tlbn:16,
 refs:'belady',fr:3,alg:'fifo',cs:'lost',prot:'none',seed:3,fsz:200,foff:0,cache:'cold',jm:'journal',jord:'DIB',crash:5,dalg:'fcfs',dq:'classic',dhead:53,ddir:1};
const NUMOPT=['q','nice','va','tlbn','fr','seed','fsz','foff','crash','dhead','ddir'];

/* =========================================================
   CHAPTER 1: KERNEL BOUNDARY (syscalls, faults, interrupts)
   ========================================================= */
function sc1(key,disk){
  const d=DISK[disk],cm=(t,c,l='k',x)=>Object.assign({l,t,c},x||{});
  const entry=[cm('program calls read(fd, buf, 4096); libc puts the syscall number in a register',20,'u'),
    cm('<code>syscall</code> instruction: CPU saves user registers, switches to ring 0 and to the kernel stack',100,'h'),
    cm('entry code dispatches through the syscall table to the read handler',30),
    cm('validate: fd is open and <code>buf</code> lies in user space (access_ok)',30)];
  const back=cm('<code>sysret</code>: restore registers, back to ring 3, return value = 4096',60,'h');
  const T={
   read_hit:{title:'read() of a cached file',out:'ok',res:'Served from the page cache: no device was touched.',steps:[...entry,
     cm('VFS finds the inode and looks the page up in the page cache: <b>hit</b>',120),cm('<code>copy_to_user</code>: 4096 bytes copied into the program buffer',300),back]},
   read_miss:{title:'read() of an uncached file',out:'ok',res:'The program slept for the device time; the CPU ran other work meanwhile.',steps:[...entry,
     cm('page cache <b>miss</b>: the block layer builds a request and submits it to the driver',2000),
     cm('process is put to sleep; the scheduler runs another task on this core',1500),
     cm(`${d.n} performs the read`,d.ns,'h'),
     cm('device raises an <b>interrupt</b>; the handler marks the request complete and wakes the process',1500,'h'),
     cm('page inserted into the page cache, then <code>copy_to_user</code>',500),back]},
   bad_ptr:{title:'read() into an invalid pointer',out:'err',res:'The call fails with EFAULT; the program survives and the kernel was never at risk.',steps:[...entry.slice(0,3),
     cm('validate: <code>buf</code> points at kernel memory: <b>rejected</b>',30,'k',{bad:1}),
     cm('return <code>-EFAULT</code> to user space; no data was copied',60,'h')]},
   priv:{title:'user code executes hlt (privileged)',out:'kill',res:'Only the offending process is killed; every other process keeps running.',steps:[
     cm('program executes the <code>hlt</code> instruction in ring 3',5,'u'),
     cm('CPU refuses: <b>general protection fault</b> (#GP) and jumps to the kernel fault handler',100,'h',{bad:1}),
     cm('kernel finds the faulting instruction is illegal in user mode',50),
     cm('kernel sends the process SIGSEGV (default action: terminate)',200),
     cm('process exits; the scheduler picks the next runnable task',1500)]},
   loop:{title:'user code spins in while(1) {}',out:'ok',res:'The timer interrupt gave the CPU back to the kernel, so the spinner cannot monopolize it.',steps:[
     cm('program runs <code>while (1) {}</code> and never makes a system call',1000000,'u'),
     cm('<b>timer interrupt</b> fires (every few milliseconds); hardware enters the kernel',100,'h'),
     cm('scheduler sees the task used its slice and picks another runnable task',800),
     cm('context switch: save the spinner, load the other task, return to user mode',1500,'h'),
     cm('the other program runs; the spinner waits in the run queue for its next turn',0)]}
  };
  return T[key];
}
const SC1_OPTS=[['read_hit','read(), page cache hit'],['read_miss','read(), cache miss (disk)'],['bad_ptr','read() with a bad pointer'],['priv','privileged instruction in user mode'],['loop','infinite loop, no syscalls']];
function draw1(p){
  const sc=sc1(OPT.sc1,OPT.disk),n=sc.steps.length,k=Math.min(n-1,Math.floor(p*n+1e-9)),done=p>=1;
  const total=sc.steps.reduce((a,s)=>a+s.c,0);let el=0;sc.steps.forEach((s,i)=>{if(i<=k)el+=s.c});
  const cur=sc.steps[k],mode=cur.l==='u'?'u':'k',tag={u:'user',k:'kernel',h:'hardware'};
  let h=`<div class="modebar"><span class="mode ${mode}">CPU mode: ${mode==='u'?'user (ring 3)':'kernel (ring 0)'}</span><span class="note" style="margin:0">${esc(sc.title)}</span></div>`;
  h+=sc.steps.map((s,i)=>`<div class="lane ${i>k?'fut':''} ${i===k?'cur':''} ${s.bad?'bad':''}"><span class="who ${s.l}">${tag[s.l]}</span><span>${s.t}</span><span class="cost">${s.c?'+'+fmtNs(s.c):''}</span></div>`).join('');
  h+=`<div class="caption ${done?(sc.out==='ok'?'good':'bad'):''}">Step ${k+1}/${n} · elapsed in this model: <b>${fmtNs(el)}</b> of ${fmtNs(total)}${done?` · <b>${esc(sc.res)}</b>`:''}</div>`;
  h+=`<div class="note">Costs are orders of magnitude (model values): a trap costs roughly 0.1 to 1 µs depending on the CPU and mitigations, a cached 4 KB read about a microsecond, an NVMe read about 100 µs, a hard-disk seek 5 to 10 ms.</div>`;
  return h;
}

/* =========================================================
   CHAPTER 2: CPU SCHEDULING
   ========================================================= */
const WL={
 mixed:{n:'1 batch job + short interactive tasks',t:(nice)=>[{n:'batch',a:0,b:24,nice},{n:'web1',a:2,b:3,nice:0},{n:'web2',a:4,b:3,nice:0},{n:'editor',a:6,b:2,nice:0},{n:'cron',a:8,b:6,nice:0}]},
 convoy:{n:'convoy: 1 long job, then 4 short ones',t:(nice)=>[{n:'long',a:0,b:30,nice},{n:'s1',a:1,b:2,nice:0},{n:'s2',a:1,b:2,nice:0},{n:'s3',a:1,b:2,nice:0},{n:'s4',a:1,b:2,nice:0}]},
 equal:{n:'4 equal CPU-bound tasks',t:(nice)=>[{n:'A',a:0,b:10,nice},{n:'B',a:0,b:10,nice:0},{n:'C',a:0,b:10,nice:0},{n:'D',a:0,b:10,nice:0}]}
};
const weightOf=nice=>1024/Math.pow(1.25,nice);
const schedule=memo((pol,q,wl,nice)=>{
  const tasks=WL[wl].t(nice).map((t,i)=>({...t,i,rem:t.b,w:weightOf(t.nice),v:0,first:null,fin:null,ran:0}));
  const segs=[],total=tasks.reduce((a,t)=>a+t.b,0)+tasks[tasks.length-1].a+8;let t=0,cur=null,used=0,sw=0,seen=new Set(),last=-1;
  const LAT=12,MING=2,arrived=()=>tasks.filter(x=>x.a<=t&&x.rem>0);
  const rrq=[];
  for(;t<total*3&&tasks.some(x=>x.rem>0);t++){
    tasks.forEach(x=>{if(x.a===t&&!seen.has(x.i)){seen.add(x.i);
      if(pol==='cfs'){const r=arrived().filter(y=>y!==x);x.v=r.length?Math.min(...r.map(y=>y.v))-1:0}

/* generic tick scheduler: tasks are lists of segments [['c',ms] (needs a core) | ['w',ms] (waiting, no core)].
   C cores, round-robin quantum Q. Returns per-task state per tick: run / wait / ready / done. */
function runTicks(tasks0,C,Q){
  const tasks=tasks0.map(t=>({n:t.n,seg:t.seg,st:[],si:0,rem:t.seg[0][1],done:false}));
  const rq=[],run=[];let t=0,busy=0;
  tasks.forEach((k,i)=>{if(k.seg[0][0]==='c')rq.push(i)});
  while(tasks.some(k=>!k.done)&&t<2000){
    while(run.length<C&&rq.length)run.push({i:rq.shift(),used:0});
    const on=new Set(run.map(r=>r.i));
    tasks.forEach((k,i)=>k.st.push(k.done?'done':on.has(i)?'run':(k.seg[k.si][0]==='w'?'wait':'ready')));
    busy+=run.length;
    const wake=[];
    tasks.forEach((k,i)=>{if(k.done||on.has(i)||k.seg[k.si][0]!=='w')return;k.rem--;
      if(k.rem===0){k.si++;if(k.si>=k.seg.length)k.done=true;else{k.rem=k.seg[k.si][1];if(k.seg[k.si][0]==='c')wake.push(i)}}});
    for(let j=run.length-1;j>=0;j--){const r=run[j],k=tasks[r.i];k.rem--;r.used++;
      if(k.rem===0){k.si++;run.splice(j,1);
        if(k.si>=k.seg.length)k.done=true;else{k.rem=k.seg[k.si][1];if(k.seg[k.si][0]==='c')wake.push(r.i)}}
      else if(r.used>=Q){run.splice(j,1);wake.push(r.i)}}
    wake.sort((a,b)=>a-b).forEach(i=>rq.push(i));
    t++;
  }
  return{tasks,total:t,util:busy/(C*Math.max(1,t)),busy,C};
}

  rows.forEach((r,ri)=>{const y=10+ri*(rh+5);s+=`<text x="${x0-6}" y="${y+12}" text-anchor="end" style="font-size:11px">${esc(r.label)}</text>`;
    let a=0;while(a<r.st.length&&a<cut){let b=a;while(b+1<r.st.length&&b+1<cut&&r.st[b+1]===r.st[a])b++;
      const k=r.st[a];if(k!=='done')s+=`<rect x="${x0+a*tw}" y="${y}" width="${Math.max(1,(b-a+1)*tw-0.4)}" height="${rh}" fill="${r.col&&k==='run'?r.col(a):LANE[k]}" stroke="${k==='ready'||k==='wait'?'var(--line)':'none'}" rx="2"/>`;a=b+1}});

/* ---------- chapter 5: concurrency vs parallelism ---------- */
const CW={

/* ---------- chapter 7: event loop, async/await ---------- */
const sim7=memo((model,N,L,pool,blk)=>{
  const c1=1,c2=1,B=30,reqs=Array.from({length:N},(_,i)=>({i,b:(blk==='yes'&&i===0)?B:0,segs:[]}));let total=0,peak=1;const loop=[];
  if(model==='seq'){let t=0;reqs.forEach(r=>{const a=c1+r.b;r.segs.push({k:'run',s:t,e:t+a},{k:'wait',s:t+a,e:t+a+L},{k:'run',s:t+a+L,e:t+a+L+c2});if(t>0)r.segs.unshift({k:'queue',s:0,e:t});t+=a+L+c2});total=t}
  else if(model==='threads'){const free=Array(Math.min(pool,N)).fill(0);peak=free.length;
    reqs.forEach(r=>{const j=free.indexOf(Math.min(...free)),t0=free[j],a=c1+r.b;if(t0>0)r.segs.push({k:'queue',s:0,e:t0});r.segs.push({k:'run',s:t0,e:t0+a},{k:'wait',s:t0+a,e:t0+a+L},{k:'run',s:t0+a+L,e:t0+a+L+c2});free[j]=t0+a+L+c2});total=Math.max(...free)}
  else{let t=0;const ready=reqs.map(r=>({r,at:0,ph:1}));
    while(ready.length){ready.sort((a,b)=>a.at-b.at||a.ph-b.ph||a.r.i-b.r.i);const x=ready.shift();if(x.at>t)t=x.at;
      const d=x.ph===1?c1+x.r.b:c2;if(x.at<t)x.r.segs.push({k:'queue',s:x.at,e:t});
      x.r.segs.push({k:'run',s:t,e:t+d});loop.push({i:x.r.i,s:t,e:t+d});t+=d;
      if(x.ph===1){x.r.segs.push({k:'wait',s:t,e:t+L});ready.push({r:x.r,at:t+L,ph:2})}}

});

const GW={
 many:{n:'64 small goroutines (1 to 4 ms each), all spawned by main',g:()=>{const r=lcg(4);return Array.from({length:64},(_,i)=>({id:i,w:1+Math.floor(r()*4),sys:0}))}},

const sim8=memo((wl,P,pre,sysh)=>{
  const gs=GW[wl].g().map(g=>({...g,rem:g.w,ph:0})),q=Array.from({length:P},()=>[]),cur=Array(P).fill(null),used=Array(P).fill(0),lanes=Array.from({length:P},()=>[]),blockedP=Array(P).fill(0);
  gs.forEach(g=>q[0].push(g));let sysq=[],steals=0,t=0,done=0,busy=0;const fins=[];

    for(let i=0;i<P;i++){

      if(cur[i]&&pre&&used[i]>=10&&q.some(a=>a.length)){q[i].push(cur[i]);cur[i]=null}              // preempted after a 10 ms slice
      if(!cur[i]){

        else{let v=-1,m=0;q.forEach((a,j)=>{if(j!==i&&a.length>m){m=a.length;v=j}});
          if(v>=0){const take=Math.ceil(q[v].length/2),got=q[v].splice(q[v].length-take,take);steals++;cur[i]=got.shift();q[i].push(...got)}}
        used[i]=0}

      const g=cur[i];lanes[i].push(g.id);busy++;g.rem--;used[i]++;

const CH=memo((cap,pT,cT,jit)=>{

  const v=verdict(c.after);

    return`<div class="lane ${i>=x?'fut':''} ${cur&&tl<=x?'cur':''}"><span class="who ${done?'k':'h'}">step ${i+1}</span><span>${s}</span><span class="cost">${done?'on disk':'never happens'}</span></div>`}).join('');
  const cutShown=tl>=x;
  const blk=(l,set)=>`<span class="blk ${set.has(l)?'on':'off'}" title="${NAMES[l]}">${l}${set.has(l)?' new':' old'}</span>`;
  const disk=(set)=>['D','I','B'].map(l=>blk(l,set)).join('');
  const jr=OPT.jm==='journal'?`<div class="note" style="margin:6px 0 0">journal: ${x>=2?'TxBegin + blocks':'empty'} ${x>=3?'+ commit':''} ${x>=6?'(freed)':''}</div>`:'';
  return`<div class="note" style="margin:0 0 4px">One <code>append()</code> changes ${OPT.jm==='journal'?'the data block, the inode and the bitmap, through a journal':'three blocks'}. The power is cut after <b>${x}</b> of ${total} steps.</div>${rows}
  ${cutShown?`<div class="lane bad"><span class="who h">POWER CUT</span><span>⚡ the machine loses power here</span><span class="cost"></span></div>`:''}
  ${cutShown?`<div class="g2"><div><b style="font-size:12px">On disk right after the crash</b><div>${disk(c.before)}</div>${jr}</div><div><b style="font-size:12px">After the boot-time recovery</b><div>${disk(c.after)}</div><div class="note" style="margin:6px 0 0">${c.action}</div></div></div>
  <div class="caption ${v[0]==='ok'?'good':'bad'}">${v[1]} Recovery cost: <b>${c.time}</b>.</div>`:''}
  <div class="note">Real disks also reorder writes, so journaling relies on flush or FUA barriers to keep the commit record behind the data it covers.</div>`;
}

/* =========================================================
   CHAPTER 8: DISK SCHEDULING
   ========================================================= */
const QS={classic:{n:'textbook queue 98 183 37 122 14 124 65 67',q:[98,183,37,122,14,124,65,67],h:53},
 stream:{n:'new requests keep arriving around cylinder 58, plus one far request (190)',q:[60,62,64,66,68,190],h:58,stream:16},
 random:{n:'8 random requests',q:(()=>{const r=lcg(21),o=[];for(let i=0;i<8;i++)o.push(Math.floor(r()*200));return o})(),h:100}};
const MAXC=199;
const diskSim=memo((alg,qk,dir,head)=>{
  const Q=QS[qk],q=Q.q.slice(),path=[{pos:head,req:false,jump:false}],order=[],r=lcg(77);let pos=head,mv=0,d=dir,arrivals=0;
  const go=(to,req,jump)=>{mv+=Math.abs(to-pos);pos=to;path.push({pos,req,jump:!!jump});if(req)order.push(to)};
  while(q.length){
    let pick;
    if(alg==='fcfs')pick=0;
    else if(alg==='sstf'){pick=0;q.forEach((x,i)=>{if(Math.abs(x-pos)<Math.abs(q[pick]-pos))pick=i})}
    else{ // elevator family: nearest request ahead in the current direction
      const ahead=()=>{let bi=-1;q.forEach((x,i)=>{if((x-pos)*d>=0&&(bi<0||Math.abs(x-pos)<Math.abs(q[bi]-pos)))bi=i});return bi};
      pick=ahead();
      if(pick<0){
        if(alg==='scan'){go(d===1?MAXC:0,false);d=-d}
        else if(alg==='look')d=-d;
        else{go(d===1?MAXC:0,false);go(d===1?0:MAXC,false,true)}   // C-SCAN: fast return, keep the direction
        pick=ahead();
      }
    }
    const x=q.splice(pick,1)[0];go(x,true);
    if(Q.stream&&arrivals<Q.stream){arrivals++;q.push(clamp(Q.h+Math.floor(r()*13)-6,0,MAXC))}
  }
  const far=Math.max(...QS[qk].q);
  return{path,order,mv,ms:mv*0.05+order.length*4,farAt:order.indexOf(far)+1,n:order.length};
});
const DALGS=[['fcfs','FCFS (arrival order)'],['sstf','SSTF (shortest seek)'],['scan','SCAN (elevator)'],['cscan','C-SCAN (one-way sweeps)'],['look','LOOK (reverse at last request)']];
function draw8(p){
  const Q=QS[OPT.dq],r=diskSim(OPT.dalg,OPT.dq,OPT.ddir,Q.h===undefined?OPT.dhead:Q.h),pts=r.path,n=pts.length-1;
  const f=p*n,seg=Math.min(n-1,Math.floor(f)),fr=f-seg,W=640,X=c=>20+c/MAXC*W,Y=i=>24+i*(pts.length>10?20:26),H=Y(n)+26;
  let sv=`<svg viewBox="0 0 690 ${H}" style="max-height:${H+10}px"><line x1="${X(0)}" x2="${X(MAXC)}" y1="14" y2="14" stroke="var(--line)"/>`;
  [0,50,100,150,199].forEach(c=>{sv+=`<text x="${X(c)}" y="10" text-anchor="middle" style="font-size:10px;fill:var(--mut)">${c}</text>`});
  for(let i=1;i<=n;i++){const a=pts[i-1],b=pts[i];if(i-1>seg&&p<1)break;const e=(i-1===seg&&p<1)?fr:1;
    sv+=`<line x1="${X(a.pos)}" y1="${Y(i-1)}" x2="${X(a.pos+(b.pos-a.pos)*e)}" y2="${Y(i-1)+(Y(i)-Y(i-1))*e}" stroke="${b.jump?'var(--mut)':'var(--acc)'}" stroke-width="2.5" ${b.jump?'stroke-dasharray="4 4"':''}/>`;
    if(e===1)sv+=`<circle cx="${X(b.pos)}" cy="${Y(i)}" r="${b.req?5:3}" fill="${b.req?'var(--acc2)':'var(--mut)'}"/><text x="${X(b.pos)+8}" y="${Y(i)+4}" style="font-size:10.5px">${b.pos}${b.req?'':' (edge)'}</text>`}
  sv+=`<circle cx="${X(pts[0].pos)}" cy="${Y(0)}" r="6" fill="var(--ok)"/><text x="${X(pts[0].pos)+8}" y="${Y(0)+4}" style="font-size:10.5px">head ${pts[0].pos}</text></svg>`;
  const cmp=DALGS.map(([a,l])=>({a,l,r:diskSim(a,OPT.dq,OPT.ddir,pts[0].pos)})),mx=Math.max(...cmp.map(c=>c.r.mv),1);
  const bars=cmp.map(c=>`<div style="display:grid;grid-template-columns:170px 1fr 62px;gap:6px;align-items:center;margin:3px 0;${c.a===OPT.dalg?'font-weight:700':''}"><span style="font-size:12px">${esc(c.l)}</span><span style="background:var(--soft);border-radius:4px;height:12px"><i style="display:block;height:12px;border-radius:4px;background:${c.a===OPT.dalg?'var(--acc)':'var(--mut)'};width:${Math.max(1,c.r.mv/mx*100).toFixed(1)}%"></i></span><span class="mono" style="font-size:12px">${c.r.mv} cyl</span></div>`).join('');
  const lastReq=Q.stream?`the far request (${Math.max(...Q.q)}) waits for <b>${r.farAt-1} other services</b> before it is served`:`${r.n} requests served`;
  return`<div class="note" style="margin:0 0 4px">${esc(Q.n)}; head starts at cylinder ${pts[0].pos}${OPT.dalg==='fcfs'||OPT.dalg==='sstf'?'':', sweeping '+(OPT.ddir===1?'up':'down')+' first'}.</div>${sv}
  <div class="caption">service order: <span class="mono">${r.order.join(' → ')}</span> · head movement <b>${r.mv}</b> cylinders · ${lastReq} · model time ${r.ms.toFixed(0)} ms (0.05 ms per cylinder + 4 ms rotation each)</div>
  <div class="g2"><div><h3 style="font-size:13px;margin:0 0 4px">Total head movement, same queue</h3>${bars}</div><div class="note"><b>On SSD and NVMe there is no head,</b> so there is nothing to sort: Linux uses the <code>none</code> or <code>mq-deadline</code> scheduler there, and keeps one submission queue per CPU so the device can work on many requests in parallel.</div></div>`;
}
