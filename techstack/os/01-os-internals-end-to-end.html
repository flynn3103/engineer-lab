<style>

<body>
<div id="app"></div>
<script>
/* ---- tiny helpers shared by the chapters and playgrounds ---- */
const PG = {};
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TIMERS = [];
function stopTimers() { while (TIMERS.length) { const t = TIMERS.pop(); clearInterval(t); clearTimeout(t); } }
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  const add = k => { if (k == null || k === false) return; if (Array.isArray(k)) k.forEach(add); else el.append(k.nodeType ? k : document.createTextNode(String(k))); };
  kids.forEach(add);
  return el;
}
function svg(tag, props, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in (props || {})) { const v = props[k]; if (v == null || v === false) continue; if (k === 'class') el.setAttribute('class', v); else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v); else el.setAttribute(k, v); }
  const add = k => { if (k == null || k === false) return; if (Array.isArray(k)) k.forEach(add); else el.append(k.nodeType ? k : document.createTextNode(String(k))); };
  kids.forEach(add);
  return el;
}
/* seeded random numbers, so every run of a playground repeats */
function rng(seed) { let a = (seed >>> 0) || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const bar = (...k) => h('div', { class: 'bar' }, ...k);
const btn = (label, fn, cls) => h('button', { class: cls || '', onclick: fn }, label);
const badge = (text, kind) => h('span', { class: 'badge ' + (kind || '') }, text);
const note = t => h('p', { class: 'note' }, t);
function seg(opts, val, cb) {          // opts: [{v,l}] or [v]; returns element with .value and .set(v)
  const el = h('div', { class: 'seg', role: 'group' });
  const norm = opts.map(o => (typeof o === 'object' ? o : { v: o, l: String(o) }));
  const paint = () => [...el.children].forEach((b, i) => b.classList.toggle('on', norm[i].v === el.value));
  norm.forEach(o => el.append(h('button', { onclick() { el.value = o.v; paint(); cb && cb(o.v); } }, o.l)));
  el.value = val; el.set = v => { el.value = v; paint(); }; paint(); return el;
}
function slider(label, min, max, val, step, cb, fmt) {   // returns <label> with .input and .value
  const out = h('b', {}, fmt ? fmt(val) : val);
  const input = h('input', { type: 'range', min, max, step: step || 1, value: val, 'aria-label': label });
  input.addEventListener('input', () => { out.textContent = fmt ? fmt(+input.value) : input.value; cb && cb(+input.value); });
  const el = h('label', { class: 'sl' }, label, input, out);
  Object.defineProperty(el, 'value', { get: () => +input.value, set: v => { input.value = v; out.textContent = fmt ? fmt(+v) : v; } });
  return el;
}
function player(o) {   // o.step() -> false when finished, o.reset(), o.speed ms per tick. returns element with .stop()
  let t = null;
  const stop = () => { if (t) { clearInterval(t); const i = TIMERS.indexOf(t); if (i >= 0) TIMERS.splice(i, 1); t = null; } play.textContent = '▶ Play'; };
  const tick = () => { if (o.step() === false) stop(); };
  const play = btn('▶ Play', () => { if (t) { stop(); return; } t = setInterval(tick, o.speed || 600); TIMERS.push(t); play.textContent = '⏸ Pause'; tick(); }, 'primary');
  const el = bar(play, btn('Step ›', () => { stop(); tick(); }), btn('⏮ Reset', () => { stop(); o.reset(); }));
  el.stop = stop; return el;
}
function logbox() {
  const el = h('div', { class: 'log', 'aria-live': 'polite' });
  return { el, add(text, cls) { el.append(h('div', { class: cls || '' }, text)); el.scrollTop = el.scrollHeight; }, clear() { el.textContent = ''; } };
}
function stat(items) {   // items: [{l, v, cls}] -> element; call el.update(items) to refresh
  const el = h('div', { class: 'stat' });
  el.update = its => { el.textContent = ''; its.forEach(i => el.append(h('div', { class: i.cls || '' }, h('small', {}, i.l), h('b', {}, i.v)))); };
  el.update(items || []); return el;
}
const API = { h, svg, rng, bar, btn, badge, note, seg, slider, player, logbox, stat, esc, timers: TIMERS };

const PHASES=[
 {t:'Threads & mutual exclusion',s:'interleaving · atomicity · mutex'},
 {t:'Safety, liveness & hardware atomics',s:'deadlock · dining philosophers · test-and-set · bakery'},
 {t:'Semaphores & producer-consumer',s:'bounded buffer · condition sync · readers-writer'},
 {t:'Monitors & condition variables',s:'wait · signal · while not if'},
 {t:'Deadlock & liveness guarantees',s:'resource graph · lock order · priority inversion'},
 {t:'Concurrency without shared data',s:'actors · message passing · composite operations'},
 {t:'Transactions & isolation',s:'serialisability · 2PL · timestamps · OCC'},
 {t:'Crash recovery & lock-free code',s:'write-ahead log · CAS · ABA'},
 {t:'Distributed systems & RPC',s:'partial failure · timeouts · retries · idempotence'},
 {t:'System models & faults',s:'two generals · crash · Byzantine'},
 {t:'Physical time & clocks',s:'drift · NTP · skew'},
 {t:'Logical time & broadcast',s:'happens-before · Lamport · vector clocks'},
 {t:'Replication & quorums',s:'N · R · W · stale reads'},
 {t:'Consensus & Raft',s:'leader election · terms · majority'},
 {t:'Two-phase commit, linearizability & CAP',s:'blocking · partitions · consistency'},
 {t:'Case studies: CRDTs & Spanner',s:'merge without coordination · TrueTime'}
];
const CHAPTERS=[
{ask:'Two threads each run count++ one million times. Why is the total almost never 2,000,000?',
 why:'Because count++ is three steps (load, add, store) and the scheduler may switch threads between any two of them.',
 principle:'An operation that looks like one step is several machine steps. Mutual exclusion makes a critical section behave as one.',
 design:'Wrap the read-modify-write in a mutex so only one thread is inside at a time. Keep the section short.',
 idea:['A <b>thread</b> has its own stack and registers but shares the heap with every other thread in the process.','The scheduler can <b>preempt</b> a thread between any two instructions, so the order of steps (the <b>interleaving</b>) is not under your control.','<code>count++</code> is really <code>load</code>, <code>add</code>, <code>store</code>. Two threads can both load the same old value, so one update is lost.','A <b>mutex</b> makes the section <b>atomic</b>: one thread in, the others wait. Kernel threads are scheduled by the OS, user threads by a library; M:N maps many user threads onto fewer kernel threads.'],
 problem:{sym:'The counter ends below the expected total, and the number changes from run to run.',cause:'Two threads read the same value, each add one, and both write back. One increment is overwritten (a lost update).',fix:'Lock around the whole load-add-store, or use an atomic increment instruction. Never lock only the store.'},
 quiz:{q:'Thread A and B both run count++ with no lock. Starting from 0, which final values are possible?',opts:['Only 2','Only 1','1 or 2','0, 1 or 2'],ans:2,why:'Both can load 0 and both store 1 (result 1), or they run one after the other (result 2). The value never goes to 0 because each store writes at least 1.'},pg:'pg1'},

{ask:'Five philosophers each pick up the left fork, then the right fork. What happens, and what hardware makes locks possible at all?',
 why:'If everyone holds one fork and waits for the other, nobody ever eats: a deadlock.',
 principle:'Safety means nothing bad happens; liveness means something good eventually happens. Deadlock is a liveness failure.',
 design:'Break the cycle: make one philosopher pick the other fork first, or impose a global order on forks. Locks themselves rest on atomic hardware instructions.',
 idea:['<b>Safety</b>: nothing bad ever happens (two threads never in the critical section). <b>Liveness</b>: something good eventually happens (every thread eventually gets in).','Composing threads gives all interleavings. <b>Sequential consistency</b> says the result must match some interleaving that keeps each thread\'s own order.','<b>Deadlock</b>: a cycle of threads each holding a resource another needs. The Dining Philosophers is the classic model.','Software cannot build a lock out of plain loads and stores cheaply. Hardware gives <b>test-and-set</b>, <b>load-linked/store-conditional</b> and <b>fences</b>; Lamport\'s <b>bakery</b> algorithm shows a lock is possible even without them.'],
 problem:{sym:'The program freezes. CPU is idle, no error, no progress.',cause:'Every philosopher holds the left fork and waits for the right one. The waits form a circle.',fix:'Number the forks and always take the lower number first, or allow at most N-1 philosophers to sit down.'},
 quiz:{q:'Which fix removes the deadlock in the dining philosophers?',opts:['Make each philosopher wait longer','Everyone takes the lower-numbered fork first','Give each philosopher a bigger plate','Pick up both forks with two separate locks, in random order'],ans:1,why:'A global order means no cycle can form: the philosopher holding the highest fork never waits for a lower one.'},pg:'pg2'},

{ask:'A producer makes items faster than the consumer eats them. How do you stop the buffer overflowing without spinning in a loop?',
 why:'A semaphore counts free slots and full slots, so each side sleeps exactly when it must.',
 principle:'A semaphore is a counter with atomic wait (decrement, sleep if zero) and signal (increment, wake one).',
 design:'Use two semaphores, empty (starts at capacity) and full (starts at 0), plus a mutex for the buffer itself.',
 idea:['A <b>semaphore</b> holds a count. <code>wait</code> takes one or sleeps; <code>signal</code> gives one back and wakes a sleeper.','<b>Bounded buffer</b>: <code>empty</code> counts free slots, <code>full</code> counts items. The producer waits on <code>empty</code>, the consumer waits on <code>full</code>.','A separate mutex protects the buffer data. Getting the order wrong (mutex first, then semaphore) deadlocks.','<b>Readers-writer (MRSW)</b> locks let many readers in together but a writer alone. A fair policy is needed or writers starve.'],
 problem:{sym:'The producer blocks forever, or the consumer reads an empty slot.',cause:'The semaphore counts disagree with the real buffer, or the consumer holds the mutex while waiting for an item.',fix:'Wait on the counting semaphore first, then take the mutex. Release in the reverse order.'},
 quiz:{q:'In producer-consumer, the producer takes the buffer mutex and then waits on empty. What can go wrong?',opts:['Nothing, the order does not matter','The buffer is full, the producer sleeps holding the mutex, and the consumer can never get in','The consumer runs twice as fast','The semaphore overflows'],ans:1,why:'The consumer needs the mutex to free a slot, but the producer holds it while sleeping. Deadlock.'},pg:'pg3'},

{ask:'A consumer is waiting for the queue to be non-empty. Why must the check be a while loop, not an if?',
 why:'Between being woken and running, another thread may have taken the item, so the condition must be checked again.',
 principle:'A monitor bundles a lock with condition variables. Waiting releases the lock; waking does not guarantee the condition still holds.',
 design:'Always write while (!condition) wait(). With signal-continue (the common kind) the signaller keeps running and the woken thread re-checks later.',
 idea:['A <b>monitor</b> is a lock plus the data it guards, with <b>condition variables</b> for waiting inside it.','<code>wait</code> atomically releases the lock and sleeps. When woken it must get the lock back before it returns.','<b>Signal-wait</b>: the signaller hands the lock to the woken thread at once. <b>Signal-continue</b>: the signaller keeps the lock and the woken thread queues up. Most real systems (pthreads, Java) use signal-continue.','Under signal-continue a third thread can steal the item first, so waiters must <b>re-check in a loop</b>. Spurious wakeups make this rule even more important.'],
 problem:{sym:'The consumer crashes with "queue empty" even though it was signalled.',cause:'The wait is guarded by if. Another consumer slipped in and took the item before the woken one ran.',fix:'Use while. Re-test the condition every time you wake.'},
 quiz:{q:'Why is while (empty) wait() correct but if (empty) wait() not, under signal-continue?',opts:['while is faster','The condition can be false again by the time the woken thread runs','if cannot call wait','wait only works inside loops'],ans:1,why:'Another thread can run between the signal and the wake-up and consume the item.'},pg:'pg4'},

{ask:'Thread A holds lock 1 and wants lock 2; thread B holds lock 2 and wants lock 1. How do you detect that cycle, and make it impossible?',
 why:'A resource-allocation graph shows the cycle; a global lock order removes it.',
 principle:'Deadlock needs four things at once: mutual exclusion, hold-and-wait, no preemption, and a cycle of waiting. Remove any one.',
 design:'Prevent it by ordering locks, avoid it by checking safety before each grant, or detect it with a graph and recover by aborting a victim.',
 idea:['Draw threads and locks as a graph. An edge <b>holds</b> goes lock→thread, <b>wants</b> goes thread→lock. A cycle means deadlock (with single-copy locks).','<b>Lock ordering</b>: if every thread takes locks in the same global order, no cycle can form. Tools can check this at run time.','<b>Prevention</b> removes a condition, <b>avoidance</b> (the banker\'s algorithm) refuses unsafe grants, <b>detection and recovery</b> finds a cycle and kills a victim.','<b>Livelock</b>: threads keep reacting to each other and make no progress. <b>Priority inversion</b>: a low-priority thread holds a lock a high-priority one needs while a medium one hogs the CPU.'],
 problem:{sym:'Two threads freeze, but only sometimes: it depends on timing.',cause:'Thread A locks 1 then 2; thread B locks 2 then 1. If each gets its first lock, both wait forever.',fix:'Agree on one order for all locks (always 1 before 2). For priority inversion use priority inheritance.'},
 quiz:{q:'Which single rule guarantees a program with many locks cannot deadlock?',opts:['Use more locks','Every thread acquires locks in one global order','Release all locks every second','Use spin locks instead of mutexes'],ans:1,why:'With a global order the wait-for graph cannot contain a cycle.'},pg:'pg5'},

{ask:'If shared memory is the problem, what if nobody shares it? How do you transfer $10 between two accounts safely?',
 why:'Give each piece of state one owner that handles one message at a time, and talk to it by sending messages.',
 principle:'No shared data means no data race. The owner serialises access by processing its mailbox in order.',
 design:'Actors (or CSP processes) own their state. A transfer that touches two owners still needs a transaction so both sides change or neither does.',
 idea:['<b>Active objects / actors</b> keep private state and a mailbox. They process one message at a time, so no locks are needed inside.','<b>Message passing</b>: send and receive replace shared reads and writes. CSP uses synchronous channels; actors use asynchronous mailboxes; <b>tuple spaces</b> share a bag of tuples.','Single-owner access is safe, but a <b>composite operation</b> (debit A, credit B) spans two owners. Another message can slip in between the two steps.','A <b>transaction</b> groups the steps: ACID (atomic, consistent, isolated, durable).'],
 problem:{sym:'Money vanishes: A was debited, but B was never credited, or a balance check saw the half-finished state.',cause:'Each account is safe alone, but the transfer is two separate messages and something can fail or interleave between them.',fix:'Make the transfer one atomic unit (a transaction, or one actor owning both accounts) so it is all or nothing.'},
 quiz:{q:'Each bank account is an actor. Why is a transfer between two actors still risky?',opts:['Actors share memory','The debit and the credit are two messages, so a failure or another message can come between them','Actors cannot receive messages','Mailboxes are unordered'],ans:1,why:'Each actor is internally consistent, but the pair of updates is not atomic unless you add a transaction.'},pg:'pg6'},

{ask:'Two transactions interleave their reads and writes. Is the result the same as running them one after the other?',
 why:'Only if the schedule is serialisable: its conflict graph has no cycle.',
 principle:'Serialisability: the outcome equals some serial order of the transactions. Concurrency control must only allow such schedules.',
 design:'Two-phase locking (grow, then shrink), timestamp ordering, or optimistic validation each guarantee serialisable schedules by different means.',
 idea:['Two operations <b>conflict</b> if they touch the same item and at least one is a write. A schedule is serialisable if its <b>conflict graph</b> (T1→T2 when T1\'s conflicting op comes first) has no cycle.','<b>2PL</b>: take locks as you go and never take one after you release one. <b>Strict</b> 2PL holds all locks to commit, which also avoids cascading aborts.','<b>Timestamp ordering (TSO)</b>: each transaction gets a timestamp; an operation that arrives "too late" aborts its transaction.','<b>OCC</b>: run freely on private copies, then validate at commit; if someone changed what you read, abort and retry. Great when conflicts are rare.'],
 problem:{sym:'A report shows a total that never existed: money seems to appear or vanish.',cause:'The schedule interleaved T1 and T2 so that each saw part of the other\'s work (cycle in the conflict graph).',fix:'Run under 2PL (strict), TSO or OCC. Expect blocking or aborts as the price; retry aborted transactions.'},
 quiz:{q:'Under strict 2PL when can a transaction release its locks?',opts:['As soon as it has finished with each item','Only at commit or abort','Before it starts','Never'],ans:1,why:'Holding locks to the end prevents others from reading uncommitted data and avoids cascading aborts.'},pg:'pg7'},

{ask:'The power fails halfway through a transfer. What does the disk look like after reboot, and can we avoid locks altogether?',
 why:'A write-ahead log lets recovery redo what committed and undo what did not; compare-and-swap lets threads update without locks.',
 principle:'Log first, write data later. After a crash, replay the log: committed work is redone, unfinished work is undone.',
 design:'Write the log record to disk before the data page. Lock-free structures retry a CAS in a loop instead of blocking.',
 idea:['<b>Write-ahead logging (WAL)</b>: append <code>(txn, item, old, new)</code> and a <code>COMMIT</code> record to the log and flush it <i>before</i> the data pages change.','<b>Recovery</b>: scan the log; <b>redo</b> changes of committed transactions, <b>undo</b> changes of uncommitted ones. <b>Checkpoints</b> bound how much log must be replayed.','<b>Lock-free</b> code uses <b>compare-and-swap</b>: "set X to new only if it still equals old". On failure, retry. No thread can block another.','Beware the <b>ABA problem</b>: the value changed from A to B and back to A, so the CAS succeeds although the structure changed. <b>Transactional memory</b> offers atomic blocks in hardware or software.'],
 problem:{sym:'After a crash, A has lost $10 but B never received it.',cause:'The data page for A reached disk before the page for B, and there was no log to say the transfer was incomplete.',fix:'Log before data, flush the log at commit, and run redo/undo recovery on restart. For CAS, tag values with a version number to defeat ABA.'},
 quiz:{q:'Why must the log record reach disk before the data page does?',opts:['Logs are smaller','So recovery can undo or redo a change even if the crash hits mid-write','Disks prefer logs','To save memory'],ans:1,why:'If the data page were written first and then the crash hit, nothing would tell recovery how to undo it.'},pg:'pg8'},

{ask:'A function call crosses the network and the reply never arrives. Did it run?',
 why:'You cannot know: the request may have been lost, the server may have crashed, or only the reply may have been lost.',
 principle:'In a distributed system messages can be delayed or lost and nodes can fail independently (partial failure). A timeout is a guess, not a fact.',
 design:'Retry on timeout, and make the operation idempotent (or give each request a unique ID) so running it twice has the same effect as once.',
 idea:['A distributed system has <b>no shared memory and no shared clock</b>, message delay is unbounded, and parts fail independently.','<b>RPC</b> makes a remote call look local: the client <b>marshals</b> arguments, sends them, and unmarshals the reply. An <b>IDL</b> describes the interface.','<b>At-most-once</b>: never retry (maybe lost). <b>At-least-once</b>: retry until a reply (maybe duplicated). Exactly-once needs <b>idempotent</b> operations or de-duplication by request ID.','Transparency is a trap: a remote call can fail in ways a local one cannot, so the caller must handle timeouts.'],
 problem:{sym:'The customer is charged twice (or not at all) after a network blip.',cause:'The client timed out and retried. The first request had in fact succeeded; only the reply was lost.',fix:'Attach an idempotency key to each request; the server remembers keys it has processed and returns the saved result.'},
 quiz:{q:'A client retries a timed-out "charge $10" call. What makes this safe?',opts:['A shorter timeout','An idempotency key the server de-duplicates on','More servers','Using UDP'],ans:1,why:'The server can then recognise the retry and not apply it twice.'},pg:'pg9'},

{ask:'Two armies must attack together, but every messenger can be captured. Can they ever be sure?',
 why:'No: the last message can always be lost, so certainty is impossible over a lossy link.',
 principle:'Agreement over an unreliable channel cannot be guaranteed. The system model says what you can assume about timing and failures.',
 design:'Pick a model (synchronous, partially synchronous, asynchronous) and a fault model (crash-stop, crash-recovery, Byzantine) and design for exactly that.',
 idea:['The <b>two generals problem</b>: whatever acknowledgements you add, the sender of the last message cannot know it arrived.','<b>Network models</b>: synchronous (known bounds on delay), partially synchronous (bounds hold eventually), asynchronous (no bounds).','<b>Fault models</b>: <b>crash-stop</b> (node halts for ever), <b>crash-recovery</b> (node restarts, may lose memory), <b>Byzantine</b> (node may lie).','A <b>failure detector</b> using timeouts can be wrong: slow looks the same as dead.'],
 problem:{sym:'Two services disagree about whether an order was placed.',cause:'Each waits for the other\'s acknowledgement. Whoever sends the final message cannot confirm it arrived.',fix:'Accept it: use retries plus idempotence, a protocol with a coordinator, or consensus. State clearly which failures you tolerate.'},
 quiz:{q:'Why can the two generals never be certain of agreement?',opts:['They are too far apart','The last acknowledgement could always be lost, so one side is always unsure','Messengers are slow','They lack maps'],ans:1,why:'Adding more acknowledgements only moves the uncertainty to the last message.'},pg:'pg10'},

{ask:'Two machines stamp events with their own clocks. Why can an effect look like it happened before its cause?',
 why:'Physical clocks drift and are never perfectly synchronised, so timestamps from different machines cannot be compared exactly.',
 principle:'Every clock drifts. Synchronisation (NTP) bounds the error but never removes it. Time-of-day is not safe for ordering events.',
 design:'Do not order events by wall-clock time across machines. Measure round-trip delay to estimate offset, and treat the result as an interval.',
 idea:['<b>Physical clocks</b> count real time but <b>drift</b> (a few ppm to hundreds of ppm). Leap seconds make UTC jump.','<b>NTP</b> asks a server for its time using four timestamps (t1 send, t2 receive, t3 reply, t4 arrive) and estimates <b>offset</b> and <b>delay</b>.','The estimate is uncertain by up to half the round-trip delay, and asymmetry in the network adds more error.','Never use wall-clock time to decide "which write is newer" across machines: last-write-wins by timestamp can silently drop the real latest write.'],
 problem:{sym:'The newest update is overwritten by an older one, or log lines from two machines appear in the wrong order.',cause:'Machine B\'s clock runs behind machine A\'s, so B\'s later event gets a smaller timestamp.',fix:'Use logical clocks for ordering, or hardware time with a known error bound. Sync often and monitor the offset.'},
 quiz:{q:'Machine B\'s clock is 50 ms behind A\'s. A writes, then B (after receiving A\'s message) writes. Last-write-wins by timestamp keeps...',opts:['B\'s write, always','A\'s write, if the real gap is under 50 ms','Neither','Both'],ans:1,why:'B\'s timestamp is too small by 50 ms, so if the real gap is shorter, B\'s later write looks older and is discarded.'},pg:'pg11'},

{ask:'If we cannot trust clocks, how do we still say what happened before what?',
 why:'By counting events and message hops instead of seconds: logical clocks capture cause and effect.',
 principle:'Happens-before: a→b if a came earlier on the same process, or a is the send and b the receive of the same message. Anything unrelated is concurrent.',
 design:'Lamport clocks give a consistent total order; vector clocks additionally tell causal from concurrent. Use them to deliver broadcasts in the right order.',
 idea:['<b>Happens-before (→)</b> is the order caused by program order and messages. Two events with no path between them are <b>concurrent</b>.','<b>Lamport clock</b>: increment on each event; on receive take max(local, message) + 1. If a→b then L(a)&lt;L(b), but not the other way round.','<b>Vector clock</b>: one counter per process. V(a)&lt;V(b) exactly when a→b; if neither is smaller they are concurrent.','<b>Broadcast orders</b>: FIFO (per sender), causal (respect →), total order (everyone sees the same order). <b>Gossip</b> spreads updates epidemically.'],
 problem:{sym:'A reply shows up before the question it answers, in a chat or comment thread.',cause:'Messages arrive in network order, not causal order, and nothing delays the reply until the question has been delivered.',fix:'Attach vector clocks and have each receiver buffer a message until everything that causally precedes it has been delivered.'},
 quiz:{q:'Events a and b have Lamport timestamps 3 and 5. What can you conclude?',opts:['a happened before b','b did not happen before a, but they may be concurrent','They are concurrent','b happened before a'],ans:1,why:'L(a)<L(b) is consistent with a→b but also with concurrency. Only vector clocks tell the two apart.'},pg:'pg12'},

{ask:'Data lives on 5 replicas and 2 are down. How many must answer so that a read never misses the latest write?',
 why:'If the write quorum W and read quorum R overlap (R + W &gt; N), every read touches at least one replica with the newest value.',
 principle:'Replicas can diverge. Quorums make any read set and write set share a node, so a read sees the latest acknowledged write.',
 design:'Choose N, R and W with R + W &gt; N. Raise W for durability, raise R for freshness; each costs latency and availability.',
 idea:['<b>Replication</b> keeps copies on several nodes so data survives failures and reads scale.','<b>Quorum</b>: write to W replicas, read from R. If R + W &gt; N the two sets always overlap in at least one node.','<b>Idempotent</b> writes make retries safe. <b>Read-after-write consistency</b> means you see your own writes.','<b>State machine replication</b>: replicas apply the same commands in the same order and stay identical. <b>Leader-based replication</b> sends all writes through one leader.'],
 problem:{sym:'A user saves a change, reloads, and sees the old value.',cause:'The write went to some replicas and the read to others, with R + W ≤ N so the sets did not overlap.',fix:'Use R + W &gt; N, or read from the leader, or route a user\'s reads to the replica that took their write.'},
 quiz:{q:'N=5, W=2. What is the smallest R that guarantees reading the latest write?',opts:['1','2','4','5'],ans:2,why:'You need R + W > 5, so R ≥ 4 when W = 2.'},pg:'pg13'},

{ask:'The leader dies. How do the surviving nodes agree on a new one, and never end up with two?',
 why:'Raft uses terms and majority votes: a candidate needs more than half the votes, and each node votes once per term.',
 principle:'Consensus: all nodes agree on one value despite crashes. FLP says it cannot be guaranteed in a fully asynchronous system, so Raft uses timeouts to make progress.',
 design:'Followers start an election when they hear no heartbeat. A candidate that gets a majority becomes leader for that term; higher terms always win.',
 idea:['<b>Consensus</b> gives agreement, validity and termination. The <b>FLP result</b>: no algorithm guarantees termination in an asynchronous system with even one crash; real systems use timeouts and randomness.','<b>Raft</b> splits the job: leader election, log replication, safety.','A follower whose <b>election timeout</b> expires becomes a candidate, bumps its <b>term</b>, and asks for votes. A <b>majority</b> wins. Random timeouts avoid repeated split votes.','The leader appends entries and commits them once a majority has stored them. A node seeing a higher term steps down, which removes stale leaders.'],
 problem:{sym:'After a network split, two nodes both think they are the leader and accept different writes.',cause:'The old leader kept running in a minority partition while the majority elected a new one.',fix:'A leader needs a majority to commit. The minority leader cannot commit, and it steps down on seeing the higher term.'},
 quiz:{q:'A 5-node Raft cluster splits 2 | 3. Which side can elect a leader and commit writes?',opts:['The 2-node side','Both sides','The 3-node side','Neither'],ans:2,why:'Only 3 of 5 is a majority. The 2-node side can never gather 3 votes.'},pg:'pg14'},

{ask:'A transaction spans two databases and the coordinator crashes after "prepare". What may the participants do? And when the network splits, do you answer or refuse?',
 why:'Participants that voted yes must wait (blocked); and during a partition you must give up either consistency or availability.',
 principle:'Two-phase commit is atomic but blocking. CAP: when a partition happens a system cannot be both linearizable and always available.',
 design:'Use 2PC (or consensus-based commit) for atomic commit across nodes. For CAP, choose per operation: refuse to stay consistent (CP) or answer with possibly stale data (AP).',
 idea:['<b>2PC</b>: phase 1, the coordinator asks "can you commit?" and everyone votes; phase 2, it tells everyone to commit or abort. A yes-voter must wait for the decision, so a coordinator crash <b>blocks</b> it.','2PC is consensus on one bit, but it does not tolerate a coordinator failure; consensus-based commit does.','<b>Linearizability</b>: every operation appears to take effect at one instant between its start and end, as if there were one copy. <b>Eventual consistency</b> only promises convergence when updates stop.','<b>CAP</b>: during a network partition choose consistency (refuse some requests) or availability (answer, maybe stale).'],
 problem:{sym:'Participants hold locks for minutes after a coordinator crash, and new transactions queue up behind them.',cause:'They voted yes in phase 1 and may not decide alone: the coordinator might have told others to commit.',fix:'Recover the coordinator quickly, use a replicated coordinator, or use a consensus-based commit protocol.'},
 quiz:{q:'During a network partition, a CP system will...',opts:['Answer every request, even stale','Refuse requests on the side that cannot reach a majority','Ignore the partition','Add more replicas automatically'],ans:1,why:'CP keeps consistency by refusing to answer where it cannot be sure.'},pg:'pg15'},

{ask:'Two people edit offline and reconnect. Can replicas converge with no coordinator? And how does Spanner order events worldwide?',
 why:'CRDTs are designed so that merging in any order gives the same result; Spanner waits out its clock uncertainty so timestamps are safe.',
 principle:'If the merge is commutative, associative and idempotent, replicas converge no matter how updates arrive. Spanner bounds clock error and waits it out.',
 design:'Use CRDTs (counters, sets, text) where coordination is too slow. Use TrueTime and commit-wait where you need global linearizable order.',
 idea:['A <b>CRDT</b> (conflict-free replicated data type) has a <b>merge</b> that is commutative, associative and idempotent, so replicas converge after exchanging state in any order.','A <b>G-counter</b> keeps one slot per replica and merges by taking the max of each slot. An <b>OR-set</b> tags each add so a remove only removes what it saw.','<b>Collaborative text editing</b> gives each character a unique id so concurrent inserts keep their place.','<b>Spanner</b>: <b>TrueTime</b> returns an interval [earliest, latest]. A transaction picks a commit timestamp and waits out the uncertainty (<b>commit-wait</b>) so later transactions always get larger timestamps.'],
 problem:{sym:'After a partition heals, one replica\'s edits or counts are lost, or replicas stay different for ever.',cause:'A last-write-wins merge throws away concurrent updates, or the merge is not commutative.',fix:'Use a data type whose merge keeps every update (CRDT). For global order use bounded-error clocks with commit-wait.'},
 quiz:{q:'Why can CRDT replicas merge in any order and still agree?',opts:['They use a central server','The merge is commutative, associative and idempotent','They share a clock','They never accept writes'],ans:1,why:'Those three properties make the merged result independent of order and of duplicate delivery.'},pg:'pg16'}
];

</script>
<script>
for (let i = 1; i <= 16; i++) if (!PG['pg' + i]) PG['pg' + i] = (root, A) => root.append(A.h('div', { class: 'pgbox' }, 'playground ' + i + ' (stub)'));

PG.pg1 = function (root, A) {
  const { h, rng, bar, btn, badge, note, seg, player, stat } = A;
  const ITERS = 2;                         // each thread runs count++ this many times
  let mutex = false, seed = 7, R = rng(seed), S, lastMsg = '', hist = null;
  const PROG = m => (m ? ['lock', 'load', 'add', 'store', 'unlock'] : ['load', 'add', 'store']);
  const TXT = { lock: 'lock(m)', load: 'r = count', add: 'r = r + 1', store: 'count = r', unlock: 'unlock(m)' };
  const NAME = ['A', 'B'];
  const fresh = () => { S = { mem: 0, lock: null, th: [0, 1].map(() => ({ pc: 0, it: 0, reg: null })) }; lastMsg = 'Nothing has run yet.'; };
  const done = t => S.th[t].it >= ITERS;
  const cur = (t, m) => PROG(m == null ? mutex : m)[S.th[t].pc];
  const can = t => !done(t) && !(cur(t) === 'lock' && S.lock !== null);
  function exec(t) {
    const th = S.th[t], ins = cur(t), n = NAME[t]; let msg;
    if (ins === 'lock') { S.lock = t; msg = n + ' takes the lock.'; }
    else if (ins === 'load') { th.reg = S.mem; msg = n + ' loads count = ' + S.mem + ' into its register.'; }
    else if (ins === 'add') { th.reg += 1; msg = n + ' adds 1 in its register: r = ' + th.reg + '.'; }
    else if (ins === 'store') { const old = S.mem; S.mem = th.reg; msg = n + ' stores ' + th.reg + ' into count' + (old + 1 !== th.reg ? ' (count was ' + old + ': an update is overwritten!)' : '.'); }
    else { S.lock = null; msg = n + ' releases the lock.'; }
    th.pc++; if (th.pc >= PROG(mutex).length) { th.pc = 0; th.it++; th.reg = null; }
    lastMsg = msg;
  }
  function runnable() { return [0, 1].filter(can); }
  function randomStep() { const r = runnable(); if (!r.length) return false; exec(r[Math.floor(R() * r.length)]); return true; }
  function simulate(m, rnd) {          // headless run, returns the final count
    const save = [S, mutex, lastMsg]; mutex = m; fresh();
    for (;;) { const r = runnable(); if (!r.length) break; exec(r[Math.floor(rnd() * r.length)]); }
    const v = S.mem; [S, mutex, lastMsg] = save; return v;
  }
  const view = h('div', { class: 'pg1-view' }), info = h('div', { class: 'out' }), histBox = h('div', { class: 'pg1-hist' });
  const stepA = btn('Step A', () => { stepper.stop(); if (can(0)) { exec(0); render(); } });
  const stepB = btn('Step B', () => { stepper.stop(); if (can(1)) { exec(1); render(); } });
  const stepper = player({ speed: 450, step: () => { const ok = randomStep(); render(); return ok; }, reset: () => { fresh(); render(); } });
  const mx = seg([{ v: false, l: 'No lock' }, { v: true, l: 'Mutex' }], false, v => { mutex = v; hist = null; stepper.stop(); fresh(); render(); });
  const seedBtn = btn('New seed', () => { seed += 11; R = rng(seed); hist = null; stepper.stop(); fresh(); render(); });
  const runBtn = btn('Run 20 random schedules', () => {
    stepper.stop(); const cnt = {}; const exp = 2 * ITERS;
    for (let k = 0; k < 20; k++) { const v = simulate(mutex, rng(seed * 100 + k)); cnt[v] = (cnt[v] || 0) + 1; }
    hist = cnt; render();
  });
  function thread(t) {
    const th = S.th[t], prog = PROG(mutex), blocked = !done(t) && !can(t);
    return h('div', { class: 'pg1-th' + (done(t) ? ' fin' : '') },
      h('div', { class: 'pg1-thh' }, h('b', {}, 'Thread ' + NAME[t]), h('span', { class: 'mut' }, done(t) ? 'finished' : 'iteration ' + (th.it + 1) + ' of ' + ITERS)),
      prog.map((ins, i) => h('div', { class: 'pg1-ins' + (!done(t) && i === th.pc ? ' next' : '') + (i < th.pc ? ' past' : '') }, h('code', {}, TXT[ins]), !done(t) && i === th.pc ? h('span', { class: 'pg1-arrow' }, blocked ? 'waiting for lock' : '◀ next') : null)),
      h('div', { class: 'pg1-reg' }, 'register r = ', h('b', {}, th.reg == null ? '–' : th.reg)));
  }
  function render() {
    view.replaceChildren(thread(0),
      h('div', { class: 'pg1-mem' }, h('small', {}, 'shared memory'), h('div', { class: 'pg1-count' }, 'count = ', h('b', {}, S.mem)),
        mutex ? h('div', { class: 'pg1-lock' + (S.lock != null ? ' held' : '') }, S.lock != null ? '🔒 held by ' + NAME[S.lock] : '🔓 lock is free') : null),
      thread(1));
    stepA.disabled = !can(0); stepB.disabled = !can(1);
    stepA.textContent = 'Step A' + (!done(0) && !can(0) ? ' (blocked)' : ''); stepB.textContent = 'Step B' + (!done(1) && !can(1) ? ' (blocked)' : '');
    const fin = done(0) && done(1), exp = 2 * ITERS;
    info.replaceChildren(...[h('div', {}, lastMsg),
      fin ? h('div', { style: 'margin-top:6px' }, badge('Final count = ' + S.mem + ' (expected ' + exp + ')', S.mem === exp ? 'ok' : 'bad'), ' ',
        S.mem === exp ? 'Correct this time.' : h('span', {}, 'Lost ' + (exp - S.mem) + ' update(s). Run it again with a different order and the answer changes.')) : null].filter(Boolean));
    histBox.replaceChildren();
    if (hist) {
      const e = 2 * ITERS, tot = 20; const good = hist[e] || 0;
      histBox.append(h('div', { class: 'pg1-hh' }, 'Final value over 20 random schedules (expected ' + e + '): ', badge(good + ' of 20 correct', good === 20 ? 'ok' : 'bad')));
      for (let v = 1; v <= e; v++) { const c = hist[v] || 0;
        histBox.append(h('div', { class: 'pg1-hr' }, h('span', { class: 'mono' }, 'count = ' + v), h('span', { class: 'pg1-track' }, h('i', { class: v === e ? 'good' : 'bad', style: 'width:' + (c / tot * 100) + '%' })), h('span', { class: 'mono' }, c))); }
    }
  }
  fresh(); render();
  root.append(h('div', { class: 'pgbox' },
    note('Try this: with No lock press Step A, Step B in an order where both load before either stores. Then switch to Mutex and try the same.'),
    bar(h('span', { class: 'mut' }, 'Protect count with:'), mx),
    view, bar(stepA, stepB, h('span', { class: 'mut' }, 'or let a random scheduler pick:'), stepper, seedBtn),
    info, bar(runBtn, h('span', { class: 'mut' }, 'seed ' + seed + ' · each thread runs count++ ' + ITERS + ' times')), histBox));
};

</script>
<script>
/* ---- router + chapter renderer ---- */
const PARTS = [
  { name: 'Part 1 · Concurrency', blurb: 'Several threads share memory. How do you keep them correct, and fast, and not stuck?', from: 0, to: 8 },
  { name: 'Part 2 · Distributed systems', blurb: 'Several machines share nothing but a network. Messages get lost, clocks disagree, nodes die.', from: 8, to: 16 }
];
const pc = i => 'var(--p' + (i % 8) + ')';
const app = $('#app');
function topbar(label) {
  return h('div', { class: 'topbar' }, h('div', { class: 'wrap' },
    h('a', { class: 'home', href: '../../tech.html' }, '← Tech Stack'),
    h('b', {}, 'Concurrent & Distributed Systems'),
    label ? h('nav', {}, h('a', { href: '#' }, 'All chapters')) : null));
}
function overview() {
  document.title = 'Concurrent & Distributed Systems · course';
  const tiles = (a, b) => h('div', { class: 'map' }, PHASES.slice(a, b).map((p, k) => { const i = a + k;
    return h('button', { class: 'tile', style: '--pc:' + pc(i), onclick: () => { location.hash = 'ch' + i; } },
      h('span', { class: 'n' }, i + 1), h('span', {}, h('b', {}, p.t), h('small', {}, p.s))); }));
  app.replaceChildren(topbar(false), h('div', { class: 'wrap' },
    h('header', { class: 'hero' }, h('div', { class: 'kick' }, 'A 16-lecture course, hands-on'),
      h('h1', {}, 'Concurrent & ', h('span', {}, 'Distributed'), ' Systems'),
      h('p', { class: 'lead' }, 'Sixteen short chapters. Each one starts from a real problem, gives you the idea in a few lines, and lets you break it in a playground: lost updates, deadlocks, lost messages, split brains.')),
    PARTS.map(P => h('section', { class: 'part' }, h('h2', {}, P.name), h('p', {}, P.blurb), tiles(P.from, P.to))),
    h('footer', { class: 'foot' }, 'Part of engineer-lab. Every playground is a small simulation running in your browser: simplified on purpose, deterministic, no network needed.')));
  scrollTo(0, 0);
}
function chapter(i) {
  const c = CHAPTERS[i], p = PHASES[i], part = i < 8 ? 'Concurrency' : 'Distributed systems';
  document.title = (i + 1) + '. ' + p.t + ' · Concurrent & Distributed Systems';
  const pgbox = h('div', { class: 'pg' });
  const quiz = h('div', { class: 'card quiz' }, h('p', { class: 'q' }, c.quiz.q));
  const why = h('p', { class: 'why callout', hidden: true });
  const opts = h('div', { class: 'opts' }, c.quiz.opts.map((o, k) => h('button', { onclick(e) {
    [...opts.children].forEach((b, j) => { b.disabled = true; if (j === c.quiz.ans) b.classList.add('right'); });
    if (k !== c.quiz.ans) e.currentTarget.classList.add('wrong');
    why.hidden = false; why.className = 'why callout ' + (k === c.quiz.ans ? 'good' : 'warn');
    why.innerHTML = '<b class="t">' + (k === c.quiz.ans ? 'Correct' : 'Not quite') + '</b>' + c.quiz.why; } }, o)));
  quiz.append(opts, why);
  const nav = h('div', { class: 'pn' },
    i > 0 ? h('button', { onclick: () => { location.hash = 'ch' + (i - 1); } }, '← ' + (i) + '. ' + PHASES[i - 1].t) : h('button', { onclick: () => { location.hash = ''; } }, '← All chapters'),
    i < CHAPTERS.length - 1 ? h('button', { class: 'primary', onclick: () => { location.hash = 'ch' + (i + 1); } }, (i + 2) + '. ' + PHASES[i + 1].t + ' →') : h('button', { onclick: () => { location.hash = ''; } }, 'All chapters'));
  app.replaceChildren(topbar(true), h('div', { class: 'wrap' },
    h('div', { class: 'chhead', style: '--pc:' + pc(i) }, h('div', { class: 'n' }, i + 1), h('div', {}, h('small', {}, part + ' · chapter ' + (i + 1) + ' of 16'), h('h1', {}, p.t))),
    h('p', { class: 'ask' }, c.ask),
    h('section', { class: 'blk' }, h('h3', {}, h('i', {}, '1'), 'The idea'), h('ul', { class: 'idea', html: c.idea.map(x => '<li>' + x + '</li>').join('') })),
    h('section', { class: 'blk' }, h('h3', {}, h('i', {}, '2'), 'Playground'), pgbox),
    h('section', { class: 'blk' }, h('h3', {}, h('i', {}, '3'), 'The common problem'),
      h('div', { class: 'cp' },
        h('div', { class: 's' }, h('b', {}, 'Symptom'), h('p', {}, c.problem.sym)),
        h('div', { class: 'c' }, h('b', {}, 'Cause'), h('p', {}, c.problem.cause)),
        h('div', { class: 'f' }, h('b', {}, 'Fix'), h('p', {}, c.problem.fix)))),
    h('section', { class: 'blk' }, h('h3', {}, h('i', {}, '4'), 'Check yourself'), quiz),
    nav));
  try { PG[c.pg](pgbox, API); } catch (e) { console.error(e); pgbox.append(h('div', { class: 'callout warn' }, 'Playground failed to load: ' + e.message)); }
  scrollTo(0, 0);
}
function route() {
  stopTimers();
  const m = /^#ch(\d+)$/.exec(location.hash);
  if (m && +m[1] < CHAPTERS.length) chapter(+m[1]); else overview();
}
addEventListener('hashchange', route);
route();

</script>
