<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linh Trần Nhật · Data Platform Engineer</title>
<meta name="description" content="Linh Trần Nhật, Data Platform Engineer. Search deep-dive research on Spark, ScyllaDB, Kafka, Redis, PostgreSQL, Kubernetes, databases and operating system internals, plus agent skills and notes.">
<link rel="stylesheet" href="assets/lab.css">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/curriculum.css">
<link rel="stylesheet" href="assets/home.css">
</head>
<body class="homepage">
<div id="site-nav"></div>
<div class="cur-wrap home-wrap">
  <header class="home-id">
    <div class="home-intro-row"><div class="home-intro">
    <h1 id="hName"></h1>
    <h2 id="hRole"></h2>
    <p class="lead" id="hTag"></p>
    <div class="me" id="me"></div>
    </div>
    <aside class="system-art" aria-label="Animated illustration of data flowing through a platform">
      <div class="art-heading"><span>data platform / live</span><span class="art-live"><span class="node-dot"></span>running</span></div>
      <div class="art-grid" aria-hidden="true">
        <div class="art-source"><span class="node-dot"></span> Events & data</div>
        <div class="art-connector"></div>
        <div class="art-pipeline"><span>01 / DATA PIPELINE</span><b>Stream → Process → Persist</b><div class="pipeline-nodes"><i></i><i></i><i></i><i></i><i></i></div></div>
        <div class="art-branches"><span></span><span></span></div>
        <div class="art-stores"><div><svg class="storage-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="16" cy="8" rx="10" ry="4"/><path d="M6 8v16c0 5 20 5 20 0V8M6 16c0 5 20 5 20 0"/></svg><b>Systems</b><small>Built to scale</small></div><div><svg class="storage-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6c5-1 9 0 12 3 3-3 7-4 12-3v19c-5-1-9 0-12 3-3-3-7-4-12-3ZM16 9v19M8 12l4 1M8 17l4 1M20 13l4-1M20 18l4-1"/></svg><b>Knowledge</b><small>Built to share</small></div></div>
      </div>
      <div class="art-caption"><span class="node-dot"></span> Exploring what happens under the hood.</div>
    </aside></div>
    <form class="cur-search" id="go" role="search" onsubmit="return false">
      <span id="ico"></span>
      <input id="q" type="text" inputmode="search" autocomplete="off" spellcheck="false" placeholder="Search tech stack, skills and posts…" aria-label="Search the site"><kbd>/</kbd>
    </form>
    <div class="cur-status" id="status" aria-live="polite"></div>
    <ul class="cur-result home-res" id="results" hidden></ul>
  </header>

  <main id="home">
  </main>
</div>
<script src="data/profile.js"></script>
<script src="data/systems.js"></script>
<script src="data/tech-index.js"></script>
<script src="data/skills.js"></script>
<script src="data/posts.js"></script>
<script src="assets/site.js"></script>
<script src="assets/thumbs.js"></script>
<script>
(function(){
  const {esc,hi,search,bindSearch,norm}=Site,P=SITE_PROFILE,$=id=>document.getElementById(id),byId=Object.fromEntries(SITE_SYSTEMS.map(s=>[s.id,s]));
  $('hName').textContent=P.name; $('hRole').textContent=P.headline; $('hTag').textContent=P.tagline;
  $('ico').innerHTML=Site.ICON;
  $('me').innerHTML=Site.socials()+(P.links.cv?`<a class="btn primary" href="${esc(P.links.cv)}" download>${Site.ICONS.download}Download CV</a>`:'');


  const SUG=['compaction','ISR','MVCC','join','NULL','etcd'];
  const q=$('q'), res=$('results');
  let skills=SITE_SKILLS.skills||[];
  const all=()=>[
    ...SITE_TECH_INDEX.map(e=>({kind:e.type==='Tour'?'Tour':'Chapter',title:e.title,summary:e.summary,body:e.body,tags:e.tags,url:String(e.url).replace(/^techstack\/([^/]+)\/01-[^#]*/,'techstack/$1/course.html'),sys:e.system})),
    ...skills.map(s=>({kind:'Skill',title:s.name,summary:s.description,tags:s.tags,url:'skills.html?q='+encodeURIComponent(s.name)})),
    ...SITE_POSTS.map(p=>({kind:'Post',title:p.title,summary:p.summary,tags:p.tags,url:p.url}))];
  $('status').innerHTML='Try '+SUG.map(x=>`<button type="button" data-q="${x}">${x}</button>`).join(' ');
  $('status').onclick=e=>{const b=e.target.closest('button');if(!b)return;q.value=b.dataset.q;q.dispatchEvent(new Event('input'));q.focus()};
  function render(){
    const text=q.value.trim();
    res.hidden=!text; $('home').hidden=!!text;
    if(!text){$('status').innerHTML='Try '+SUG.map(x=>`<button type="button" data-q="${x}">${x}</button>`).join(' ');return}
    const hits=search(all(),text,[['title',6],['tags',4],['kind',2],['summary',2],['body',1]]);
    $('status').textContent=hits.length?`${hits.length} result${hits.length>1?'s':''}`:'';
    const toks=norm(text).split(/\s+/).filter(Boolean);
    res.innerHTML=hits.length?hits.slice(0,30).map(({item:e})=>{const s=byId[e.sys]||{};
      return `<li><a href="${esc(e.url)}" style="--c:${s.color||'var(--acc)'}"><span class="t">${hi(e.title,toks)}</span>${e.summary?`<p class="s">${hi(e.summary.length>150?e.summary.slice(0,150)+'…':e.summary,toks)}</p>`:''}<span class="m">${esc(e.kind)}</span></a></li>`}).join('')
      :`<li class="empty" style="padding:22px;text-align:center;color:var(--mut)"><b style="color:var(--ink)">Nothing matches “${esc(text)}”</b>Try a broader word, such as “replication” or “index”.</li>`;
  }
  bindSearch(q,render); render();
  fetch('https://raw.githubusercontent.com/'+SITE_SKILLS.repo+'/main/skills.json',{cache:'no-cache'}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{if(j&&Array.isArray(j.skills)){skills=j.skills;render()}}).catch(()=>{});
})();
</script>
</body>
</html>
