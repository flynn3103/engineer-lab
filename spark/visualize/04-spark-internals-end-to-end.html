/* DD5 */
function dd5(reset){
  const el=$('#dd5b');if(!S||S.error){el.innerHTML='';return}
  if(reset||!D.cache){
    D.cache={cap:Math.max(...S.comp.parts.map(p=>Math.max(1,p.kept)),1)*2,blocks:S.comp.parts.map(p=>({p:p.index,size:Math.max(1,p.kept),state:'none',last:0})),hits:0,miss:0,rec:0,tick:0,log:['(empty cache)']};
  }
  const C=D.cache,used=()=>C.blocks.filter(b=>b.state==='cached').reduce((s,b)=>s+b.size,0);
  const draw=()=>{
    el.innerHTML=`<div class="bar"><label>Storage capacity (records) <input type="range" id="d5c" min="1" max="${C.blocks.reduce((s,b)=>s+b.size,0)+2}" value="${C.cap}"> <b>${C.cap}</b></label><button id="d5r" class="primary">▶ Run action (read-through)</button><button id="d5l">Lose a cached block</button><button id="d5x">Clear</button></div>
      <div>${C.blocks.map(b=>`<div class="blk ${b.state}"><b>rdd_p${b.p}</b><br>${b.size} records<br><small>${b.state==='none'?'not cached':b.state}</small></div>`).join('')}</div>
      <div class="chips"><span class="chip">used ${used()}/${C.cap}</span><span class="chip ${C.hits?'ok':''}">hits ${C.hits}</span><span class="chip">misses ${C.miss}</span><span class="chip">recomputed partitions ${C.rec}</span></div>
      <div class="box mono" style="margin-top:8px;max-height:140px;overflow:auto">${C.log.slice(-8).map(esc).join('<br>')}</div>
      <div class="note">Cache is an optimization only: a miss, an evicted block, or a lost block falls back to lineage recomputation with an identical result. A block becomes visible only after it is complete and published atomically.</div>`;
    el.querySelector('#d5c').oninput=e=>{C.cap=+e.target.value;draw()};
    el.querySelector('#d5r').onclick=()=>{
      C.log.push(`— action #${++C.tick}`);
      C.blocks.forEach(b=>{
        if(b.state==='cached'){C.hits++;b.last=C.tick;C.log.push(`p${b.p}: HIT, read immutable block (no source I/O)`)}
        else{C.miss++;C.rec++;C.log.push(`p${b.p}: MISS (${b.state==='none'?'never cached':b.state}) → recompute from lineage`);
          if(b.size>C.cap){C.log.push(`p${b.p}: block larger than capacity, not cached`);return}
          while(used()+b.size>C.cap){const v=C.blocks.filter(x=>x.state==='cached').sort((x,y)=>x.last-y.last)[0];if(!v)break;v.state='evicted';C.log.push(`evict p${v.p} (LRU)`)}
          b.state='cached';b.last=C.tick;C.log.push(`p${b.p}: published atomically`)}
      });draw();
    };
    el.querySelector('#d5l').onclick=()=>{const b=C.blocks.find(x=>x.state==='cached');if(b){b.state='lost';C.log.push(`p${b.p}: block LOST (executor/disk) → next read recomputes it`)}draw()};
    el.querySelector('#d5x').onclick=()=>dd5(true);
  };
  draw();
}

/* DD6 */
function dd6(){
  const el=$('#dd6b');if(!S||S.error){el.innerHTML='';return}
  const c=S.cfg,cols=S.read.columns,id=n=>cols.indexOf(n),isAgg=c.template==='agg',col=S.read.mode==='columnar';
  const pred=c.pred?`${c.pred.col} ${c.pred.op} ${c.pred.val}`:null,need=S.read.needed||neededCols(c,cols);
  const sel=isAgg?[c.key,...(c.agg==='sum'?[c.valCol]:[])]:neededCols({...c,pred:null},cols);
  const aggS=c.agg==='sum'?`sum(${c.valCol})`:'count(1)';
  const plans=[
   {n:'1 · Unresolved logical plan',note:'Built lazily from the DataFrame calls. Names are just strings; nothing is validated yet.',
    t:[isAgg?`Aggregate [${c.key}], [${c.key}, ${aggS}]`:`Project [${sel.join(', ')}]`,...(pred?[`+- Filter (${pred})`]:[]),`   +- UnresolvedRelation [${S.read.label}]`]},
   {n:'2 · Analyzed logical plan',note:'Attributes resolve to stable field IDs and types; missing/ambiguous names fail here, before any execution.',
    t:[isAgg?`Aggregate [${c.key}#${id(c.key)}], [${c.key}#${id(c.key)}, ${aggS.replace(c.valCol,c.valCol+'#'+id(c.valCol))}]`:`Project [${sel.map(x=>x+'#'+id(x)).join(', ')}]`,...(pred?[`+- Filter (${c.pred.col}#${id(c.pred.col)} ${c.pred.op} ${c.pred.val})`]:[]),`   +- Relation [${cols.map(x=>x+'#'+id(x)).join(', ')}] ${S.read.label}`]},
   {n:'3 · Optimized logical plan',note:`Rule batches run to a fixed point. Applied: ColumnPruning (read only ${need.join(', ')})${pred?`, PushDownPredicate (${col?'into the Parquet scan':'filter stays above a row-file scan: nothing to skip'})`:''}, CollapseProject.`,
    t:[isAgg?`Aggregate [${c.key}], [${c.key}, ${aggS}]`:`Project [${sel.join(', ')}]`,...(pred&&!col?[`+- Filter (${pred})`]:[]),`   +- Relation [${need.join(', ')}] ${S.read.label}${pred&&col?`  PushedFilters: [${c.pred.col} ${c.pred.op} ${c.pred.val}]`:''}`]},
   {n:'4 · Physical plan',note:`Physical operators declare required distribution. HashAggregate needs rows clustered by key, so an <b>Exchange</b> is inserted: that is the ShuffleDependency and the stage boundary from chapter 3.`,
    t:isAgg?[`HashAggregate(keys=[${c.key}], functions=[${aggS}])        ← ResultStage (reduce)`,`+- Exchange hashpartitioning(${c.key}, ${c.R0})          ← shuffle = stage cut`,`   +- HashAggregate(keys=[${c.key}], functions=[partial_${aggS}])   ← map-side combine`,...(pred&&!col?[`      +- Filter (${pred})`]:[]),`      +- Scan ${col?'parquet':S.read.pf} [${need.join(', ')}]${pred&&col?` PushedFilters:[${pred}] + residual Filter`:''}   ← source RDD`]
     :[`Project [${sel.join(', ')}]                    ← narrow Map`,...(pred?[`+- Filter (${pred})                       ← narrow Filter`]:[]),`   +- Scan ${col?'parquet':S.read.pf} [${need.join(', ')}]   ← source RDD`]}
  ];
  const st=Math.min(D.dd6step,plans.length-1);
  el.innerHTML=`<div class="bar">${plans.map((p,i)=>`<button data-s="${i}" class="${i===st?'on':''}">${p.n}</button>`).join('')}</div><pre>${esc(plans[st].t.join('\n'))}</pre><div class="note">${plans[st].note}</div>
    <div class="note">A DataFrame is schema + logical plan with expression trees (no opaque closures), which is what makes rules like pruning and pushdown possible. The RDD engine underneath is exactly what chapters 1–8 just ran.</div>`;
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{D.dd6step=+b.dataset.s;dd6()});
}

/* DD7 */
function dd7(){
  const el=$('#dd7b');if(!S||S.error){el.innerHTML='';return}
  const P=S.cfg.P,old=el.querySelector('#d7t')?+el.querySelector('#d7t').value:Math.max(1,P-1);

    let nf;const cur=W.files[p].flatMap(f=>f.rows);
    if(job.kind==='I')nf=W.files[p].concat([{name:`part-${p}-${++seq}`,rows:[{k:job.key,v:job.val}]}]);
    else{const r=cur.filter(x=>job.kind==='D'?x.k!==job.key:true).map(x=>job.kind==='U'&&x.k===job.key?{k:x.k,v:job.val}:x);nf=r.length?[{name:`part-${p}-${++seq}`,rows:r}]:[]}
    add(E(t,600,ex,'sto',`write part-${p}-${seq} (staged)`,'write',[{op:'stage',p,files:nf}],job.kind==='I'?'A new immutable file is written next to the existing ones. Not visible to readers until the driver commits.':'The full replacement partition is written as a NEW file; old files are untouched until commit. This is why updates are expensive.'));t+=600}
   add(E(t,400,ex,'drv','task finished','ack',[{op:'task',e}],'The executor reports success.'));t+=400;
   const task={p,e,doneAt:t,events:te,job};job.tasks.push(task);return task}
  function submit(t,kind,key,val,label,why){
   const job={kind,key,val,tasks:[],fin:false,label};jobs.push(job);
   push(E(t,400,'cli','drv',label,'write',[{op:'job'}],why||'The application calls an action; the driver turns it into a job.'));
   const p=key?spPart(key):0,up=ups();
   if(!up.length){push(E(t+400,300,'drv','cli','no executors available','fail',[],'All executors are down.'));job.fin=true;return}
   push(E(t+400,300,'drv','drv',kind==='A'?`plan: scan → ${SP_P} tasks`:`plan: partition ${p} only (1 task)`,'info',[],kind==='A'?'A full scan needs one task for each partition.':'The key maps to one partition, so the other partitions are pruned: only one task runs.'));
   const start=t+700;
   if(kind==='A')for(let q=0;q<SP_P;q++)runTask(job,q,up[q%up.length],start);else runTask(job,p,up[p%up.length],start);
  }
  function finalize(job){
   job.fin=true;const done=Math.max(...job.tasks.map(x=>x.doneAt));flush(done);
   if(job.kind==='I'||job.kind==='U'||job.kind==='D'){const p=job.tasks[0].p;
    push(E(done,500,'drv','sto',`commit partition ${p}`,'write',[{op:'commit',p}],'The driver commits atomically: only now does the new file set replace the old one. If it had crashed earlier, nothing would have changed.'));
    const w=W.stg[p];push(E(done+500,400,'drv','cli',`OK · ${job.kind==='I'?'1 row appended':job.kind==='U'?'partition rewritten':'rows removed, partition rewritten'}`,'ack',[],'Job finished. Files per partition can be seen on the Storage node.'));flush(done+500)}
   else if(job.kind==='R'){const p=job.tasks[0].p,m=rows(p).filter(x=>x.k===job.key);push(E(done,450,'drv','cli',m.length?m.map(x=>`"${x.v}"`).join(', ')+(m.length>1?'  ← DUPLICATE rows':''):'(no row)',m.length>1?'fail':'ack',[],m.length>1?'Spark does not enforce unique keys, so inserting the same key twice stores two rows.':'The task result goes back to the driver, then to the application.'))}
   else{let c=0;for(let p=0;p<SP_P;p++)c+=rows(p).length;push(E(done,450,'drv','cli',`count = ${c}`,'ack',[],'Partial counts from every partition are combined by the driver.'))}
  }
  const finalizeDue=t=>{jobs.filter(j=>!j.fin&&j.tasks.length&&Math.max(...j.tasks.map(x=>x.doneAt))<=t).forEach(finalize)};
  for(const a of acts){const t=a.t;flush(t);finalizeDue(t);flush(t);
   const k=a.args[0]||'k',v=a.args[1]||'v';
   if(a.op==='I')submit(t,'I',k,v,`INSERT ${k}=${v}`,'The application appends a row. Spark has no INSERT statement on files: it writes a new file.');
   if(a.op==='U')submit(t,'U',k,v,`UPDATE ${k}=${v}`,'Files are immutable: an update is a job that rewrites the whole partition.');
   if(a.op==='D')submit(t,'D',k,null,`DELETE ${k}`,'A delete is a filter + rewrite of the partition.');
   if(a.op==='R')submit(t,'R',k,null,`SELECT ${k}`,'A point lookup is still a job: Spark prunes to one partition, but there is no index.');
   if(a.op==='A')submit(t,'A',null,null,'SCAN count(*)','An action (count) triggers a job over all partitions.');
   if(a.op==='K'){const i=+a.args[0]||0;if(i>=n||W.status['e'+i]!=='up')continue;
    for(let q=pend.length-1;q>=0;q--){const e=pend[q].e;if((e.from==='e'+i||e.to==='e'+i)&&pend[q].at>t&&e.kind!=='fail'){e.fx=[];e.kind='fail';e.msg+=' ✕ lost';e.cause='The executor died before this completed.';pend.splice(q,1)}}
    push(E(t,0,'drv','e'+i,`executor ${i} LOST`,'fail',[{op:'down',e:i}],'The driver notices the missed heartbeat. Everything running on it and everything it cached is gone.'));flush(t);
    const orphan=[];jobs.forEach(j=>{if(j.fin)return;j.tasks.forEach(x=>{if(x.e===i&&x.doneAt>t)orphan.push(x)})});
    const up=ups();let at=t+800;
    orphan.forEach(x=>{const j=x.job;j.tasks=j.tasks.filter(y=>y!==x);
     if(!up.length){push(E(t+800,0,'drv','drv','job fails: no executors left','fail',[],'Every executor is lost.'));j.fin=true;return}
     const e2=up[x.p%up.length];push(E(at,500,'drv','drv',`retry partition ${x.p} on executor ${e2} (attempt 2)`,'sched',[],'Lineage: the partition is recomputed from the immutable source files. No data is lost, only time.'));runTask(j,x.p,e2,at+500)})}
   if(a.op==='H'){const i=+a.args[0]||0;if(i>=n)continue;push(E(t,0,'drv','e'+i,`executor ${i} registers again`,'info',[{op:'up',e:i}],'A fresh executor joins with an empty cache.'));flush(t)}
  }
  jobs.filter(j=>!j.fin&&j.tasks.length).forEach(finalize);
  return{events:ev};
 },
 lines(id,st){if(id==='cli'||id==='drv')return id==='drv'?[`jobs ${st.jobs}`,`committed versions ${st.ver}`]:[];
  if(id==='sto')return st.files.map((fs,p)=>`p${p}: ${fs.length} file(s), ${fs.reduce((c,f)=>c+f.rows.length,0)} row(s)${st.stg[p]?' +staged':''}`);
  const i=+id.slice(1);return[`tasks done ${st.done[id]}`,`cached: ${Object.keys(st.cache[i]).map(p=>'p'+p).join(' ')||'—'}`]},
 detail(id,st){if(id==='sto')return st.files.flatMap((fs,p)=>fs.length?fs.map(f=>`p${p} ${f.name}: ${f.rows.map(r=>r.k+'='+r.v).join(', ')}`):[`p${p}: (empty)`]).concat(st.stg.map((s,p)=>s?`p${p} STAGED (uncommitted): ${s.length} file(s)`:null).filter(Boolean));return SIMM.lines(id,st)}
};

Lab.sim(SIMM);})();

Lab.start({phases:PHASES,detail:DETAIL,ovs:OVS,ctl:ctlHTML,state:()=>S});
