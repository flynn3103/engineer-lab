<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spark Internals End-to-End</title>
<link rel="stylesheet" href="../../assets/lab.css">
<style>
:root{--acc:#e25a1c;--acc2:#2f6fed}
@media(prefers-color-scheme:dark){:root{--acc:#ff7a3d;--acc2:#6c9bff}}
.sep{color:var(--line)}
.part{border:1.5px solid var(--line);border-radius:8px;padding:8px;min-width:0}
.part h4{margin:0 0 6px;font-size:12.5px}
/* job panel */
input.sm{width:90px}
/* phase nav */
/* strip */
.strip{position:relative;display:flex;height:30px;border-radius:6px;overflow:hidden;border:1px solid var(--line);margin:8px 0 4px}
.strip .seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.strip .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.35}
.strip .tick.h{background:var(--acc);opacity:1;width:2px}
.strip .cut{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--bad);z-index:2}
/* row groups */
.rg{border:1.5px solid var(--line);border-radius:8px;padding:6px;margin:6px 0;transition:opacity .3s}
.rg.skip{opacity:.55;border-style:dashed;border-color:var(--bad)}
.rg.pend{opacity:.4}
.rg .cs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.cc{font-family:ui-monospace,monospace;font-size:10.5px;border-radius:4px;padding:1px 5px;border:1px solid var(--line)}
.cc.rd{background:color-mix(in srgb,var(--ok) 22%,var(--card));border-color:var(--ok)}
.cc.no{color:var(--mut);text-decoration:line-through}
/* dag */
.nd rect{fill:var(--card);stroke:var(--line);stroke-width:1.5;transition:fill .3s}
.nd.cur rect{stroke:var(--acc);stroke-width:4}
.nd .s2{fill:var(--mut);font-size:10.5px}
.edge{fill:none;stroke:#8a94a6;stroke-width:1.6}
.edge.shuf{stroke:var(--bad);stroke-dasharray:6 4;stroke-width:2.2}
.edge.walk{stroke:var(--acc);stroke-width:3.5}
.edge.found{stroke:var(--bad);stroke-width:4.5;stroke-dasharray:none}
.st{border-radius:8px;padding:6px 12px;border:2px solid var(--line);margin-top:6px;font-size:13px}
.st.reuse{border-style:dashed}
/* lanes */
.lane{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;margin:8px 0}
.lane .lh{font-weight:700;font-size:12px;padding:6px 0;text-align:center;border-radius:6px}
.track{position:relative;display:flex;gap:clamp(8px,3vw,30px);min-height:74px;padding:7px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.nd2{position:relative;flex:1;min-width:0;height:56px;margin:auto 0;border:2px solid var(--line);border-radius:8px;background:var(--card);display:flex;flex-direction:column;align-items:center;padding-top:3px;font-size:11.5px;z-index:1}
.nd2 .nm{font-weight:700}.nd2 .ct{margin-top:auto;margin-bottom:2px;font-family:ui-monospace,monospace;color:var(--mut);font-size:11px}
.tok{position:absolute;z-index:3;width:20px;height:20px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px #0005}
.cap{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--mut);min-height:17px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* misc */
.file{font-family:ui-monospace,monospace;font-size:12px;padding:2px 0}
.tabs{display:flex;gap:6px;margin:6px 0}
.cell{display:inline-block;min-width:28px;text-align:center;border-radius:4px;padding:1px 4px;font-family:ui-monospace,monospace;font-size:11.5px}
.blk{display:inline-block;width:86px;border:2px solid var(--line);border-radius:8px;padding:6px;margin:4px;text-align:center;font-size:12px}
.blk.cached{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.blk.evicted,.blk.lost{border-style:dashed;color:var(--mut)}
.blk.lost{border-color:var(--bad)}
.caption.cut{border-left-color:var(--bad)}.caption.make{border-left-color:var(--ok)}
.jobcode{margin-top:14px}.jobcode .lbl{font-size:13px;color:var(--mut);margin-bottom:4px}.jobcode pre{font-size:12.5px;white-space:pre;overflow-x:auto}
.ddb{overflow-x:auto}.ddb table{display:block;overflow-x:auto;max-width:100%;white-space:nowrap}
.ddb .bar label{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}
.ddb svg{min-width:0}
.nd2{padding:3px 2px 0;text-align:center}.nd2 .nm{line-height:1.15;font-size:11px}
@media(max-width:560px){.lane{grid-template-columns:28px 1fr;gap:6px}.track{padding:6px 4px}.nd2 .nm{font-size:10px}}
.sim .ctl select,.ddb select{max-width:100%}
#simScn{max-width:calc(100vw - 96px)}
</style>
</head>
<body>
<div id="dataSlot" hidden>
<div class="sample-row"><span class="lbl">Every chapter below runs one real job on a dataset:</span>
  <button data-sample="orders">Orders (CSV)</button><button data-sample="events">Events (JSONL)</button><button data-sample="users">Users (JSON array)</button></div>
<div class="jobcode"><div class="lbl">The job, as a program (it follows your settings)</div><pre><code id="jobLine"></code></pre></div>
<details class="mydata"><summary>Change the job, the data, the file format or the partitions</summary>
  <div class="jobgrid">
    <label>Job <select id="tpl"><option value="agg">Group &amp; aggregate (has a shuffle)</option><option value="narrow">Filter &amp; project (narrow only)</option></select></label>
    <span>Filter <select id="fcol"></select><select id="fop"><option>&gt;=</option><option>&gt;</option><option>&lt;=</option><option>&lt;</option><option>=</option><option>!=</option></select><input type="text" id="fval" class="sm" placeholder="value" aria-label="Filter value"></span>
    <span id="aggBox">Group by <select id="kcol"></select> aggregate <select id="agg"><option value="sum">sum</option><option value="count">count</option></select> <select id="vcol"></select></span>
    <span id="projBox">Select columns <input type="text" id="proj" style="width:min(200px,60vw)" placeholder="a,b,c"></span>
    <label>Action <select id="act"><option>Count</option><option>Collect</option><option>WriteJSONLines</option></select></label>
  </div>
  <div class="bar" style="margin-top:12px">
    <input type="file" id="file" accept=".csv,.json,.jsonl,.ndjson,.txt" aria-label="Load a file">
    <label>Storage format <select id="fmt">
      <option value="auto">auto-detect (row file)</option><option value="csv">CSV</option><option value="jsonl">JSONL</option><option value="json">JSON array</option>
      <option value="parquet">Parquet (simulated, columnar)</option></select></label>
    <label>Source partitions <input type="range" id="P" min="1" max="6" value="3"> <b id="Pv">3</b></label>
  </div>
  <textarea id="src" rows="5" spellcheck="false" aria-label="Input data"></textarea>
  <div class="note" id="srcInfo"></div>
</details>
</div>
<script src="../../assets/lab.js"></script>
<script>
const STORY={
 system:'Apache Spark',
 title:'Build <span>Spark</span> from scratch',
 lead:'Start from a data problem that no single machine can finish in time. Watch the obvious fix break. Then rebuild the core of Spark one mechanism at a time, running a real job on your own data.',
 problem:{
  scene:[
   'Your marketplace writes <b>2 TB of order logs per day</b> to object storage, one line per order. Finance wants a report on their desk by 6 AM: <i>revenue per city, for orders above a threshold</i>.',
   'One machine cannot do it. 2 TB does not fit in its 64 GB of RAM, and a single disk at 500 MB/s needs over an hour just to read the file once (2 TB &divide; 500 MB/s &asymp; 67 min). You have 50 machines, and in a fleet that size one of them fails every few days.'],
  musts:[
   '<b>Scales out.</b> Twice the data needs twice the machines, not a rewrite.',
   '<b>Survives failures.</b> A machine dying at minute 40 must not restart the whole job or corrupt the answer.',
   '<b>Same answer as one machine.</b> Splitting, retries and the order tasks finish in must never change the result.',
   '<b>Moves as little data as possible.</b> Disk reads and network copies are the real cost, so skip and shrink them.',
   '<b>Explains itself.</b> When it is slow or fails, you can see which stage, which task and why.'],
  naive:{title:'Your first instinct: a script and a thread pool',text:'Read the file, hand lines to threads, add amounts into a shared map per city. It works on a 1 GB sample, then:',
   breaks:['One machine is capped by one disk and one network card: the 2 TB scan alone takes over an hour.',
    'Spreading it over 50 machines by hand means writing the file splitting, code shipping, merging of partial results and retries yourself, again for every new report.',
    'A machine dies at minute 40. Nothing records how its partial sums were computed, so you rerun everything.',
    'Grouping by city needs every row of a city in one place: by hand that is an ad hoc all-to-all copy with no failure story.']},
  quest:'Rebuild the core of Spark in 8 chapters by following one job from file to answer: <code>read &rarr; filter &rarr; map &rarr; reduceByKey &rarr; action</code>. Each chapter meets a problem, tries the naive fix, sees it fail, then runs the design Spark uses on the dataset below.'},
 overview:{title:'The whole engine on one page',lead:'Before the details, see how one job travels: the driver plans and coordinates, executors do the work. Press <b>Trace a request</b> to follow the job, or tap a component to see what it receives and sends. Colors match the chapters.'},
 chapters:[
  {ask:'How do 50 machines read one 2 TB file without overlapping or losing a line?',
   why:'Reading is the first bottleneck. Cut into 128 MB splits, a 2 TB file becomes about 16,000 partitions that can be read in parallel. But a byte cut almost never lands on a line break.',
   v0:{name:'Cut the file into N equal byte ranges and parse each one',code:'size = file.length / N\nfor i in 0..N-1:\n  task(i) parses bytes [i*size, (i+1)*size)',breaks:'Nearly every cut lands inside a line, so one task sees the first half of a record and the next task sees the rest. At every boundary you get <b>corrupt rows or lost rows</b>. Raise <i>Source partitions</i> here and watch the red cuts fall inside lines.'},
   design:'Cut by bytes for parallelism, but give each line to the partition where it <b>starts</b>: a reader skips the partial line at its start and reads past its end to finish its last line.',
   predict:{q:'A line starts in partition 0 and ends 30 bytes into partition 1. Who decodes it?',opts:['Both: each partition decodes its own half','Partition 0: it reads past its end to finish the line, and partition 1 skips the fragment','Partition 1: a line belongs to the range where it ends'],ans:1,why:'Ownership goes by the first byte of the line. Partition 0 reads past its boundary (look for the <i>reads past boundary</i> tag), and partition 1 starts at the next newline, so every line is decoded exactly once. Hadoop’s <code>LineRecordReader</code>, which Spark uses for text files, follows essentially the same rule.'},
   build:{intro:'Four small pieces, each testable alone:',
    steps:['<b>Source descriptor.</b> Path, format and a list of splits <code>(start, end)</code>. Planning splits reads no data.',
     '<b>Line reader per split.</b> If <code>start &gt; 0</code>, skip to just after the first newline (the previous split owns that line). Then read whole lines while a line <i>starts</i> before <code>end</code>, even if it ends after it.',
     '<b>Decoder.</b> Turn each line into a row: CSV with its header, or one JSON object per line. A bad line becomes an error record, not a crash.',
     '<b>Columnar files.</b> For Parquet the unit is a row group. Footer min/max statistics let a reader skip whole groups and every column the job does not need. Switch <i>Storage format</i> to Parquet to see it.'],
    code:'splits = [(i*size, min((i+1)*size, len)) for i in 0..N-1]\nreadSplit(start, end):\n  pos = start\n  if start > 0: pos = indexOf("\\n", start - 1) + 1   // previous split owns it\n  while pos < end:\n    line = readLineAt(pos)          // may run past end\n    emit(decode(line)); pos += line.length',
    rule:'<b>Every line is decoded exactly once</b>, whatever the number of splits.'}},
  {ask:'The user chains filter, map and reduceByKey. When should the 2 TB actually be read?',
   why:'If every call ran at once, each step would produce a full 2 TB intermediate before the next could start, and the engine would never see the whole pipeline to plan it.',
   v0:{name:'Eager collections: every call computes its result immediately',code:'rows  = readAll(path)        // 2 TB in memory?\nbig   = rows.filter(f)       // another full copy\npairs = big.map(g)           // and another',breaks:'Every step <b>materializes a full copy</b>. 2 TB does not fit in memory, spilling each step to disk multiplies the I/O, and when a machine dies nothing records how a lost piece was computed.'},
   design:'A transformation returns a new immutable RDD that only remembers its parent, its function and its partitioning: a recipe, called the <b>lineage</b>, not data.',
   predict:{q:'After <code>read &rarr; filter &rarr; map &rarr; reduceByKey</code>, and before any action, how many source records have been read?',opts:['Zero: transformations only record lineage','One partition, to learn the schema','All of them, cached for later steps'],ans:0,why:'RDD transformations are lazy. The counters in the playground stay at 0 until an action runs. One real-world caveat: a DataFrame read with <code>inferSchema</code>, or JSON without a schema, scans data early to learn the columns. RDD transformations never do.'},
   build:{steps:['<b>RDD node:</b> <code>{id, partitions, deps, fn}</code>, immutable once created.',
     '<code>map</code>, <code>filter</code> and <code>flatMap</code> create a child with a <b>narrow</b> dependency: child partition <i>i</i> needs only parent partition <i>i</i>.',
     '<code>reduceByKey</code> creates a child with a <b>shuffle</b> dependency and a partitioner: each child partition needs a slice of <i>every</i> parent partition.',
     '<b>No I/O here.</b> Validate arguments and assign ids. Never open the file and never call the user function.'],
    code:'class RDD { id; parts; deps; fn }\nmap(f)         = RDD(parts = this.parts, deps = [Narrow(this)], fn = f)\nfilter(p)      = RDD(parts = this.parts, deps = [Narrow(this)], fn = p)\nreduceByKey(r) = RDD(parts = R, deps = [Shuffle(this, Hash(R))], fn = r)\n// nothing runs until an action calls compute()',
    rule:'<b>Building lineage never touches data</b>, and an RDD never changes, so any partition can be recomputed from its parents.'}},
  {ask:'The action fires. Which steps can run together, and where must the job stop and wait?',
   why:'Narrow steps can be chained inside one task with no data movement. A shuffle needs every map output to exist before any reducer starts, so it is a hard barrier.',
   v0:{name:'One task per operator, run in topological order',code:'for op in topoSort(lineage):\n  for p in partitions(op):\n    out[op][p] = op.run(in[op][p])   // materialize every step',breaks:'Every operator writes its whole output before the next one starts. Filter and map each <b>materialize a copy</b> and wait for a scheduling round, although they could stream row by row inside one task.'},
   design:'Walk backward from the final RDD: narrow dependencies stay in the current stage, and every shuffle dependency cuts off a new parent stage. Stages, not operators, are what gets scheduled.',
   predict:{q:'How many stages does <code>read &rarr; filter &rarr; map &rarr; reduceByKey &rarr; count</code> produce?',opts:['4, one per operator','1, because Spark fuses everything','2: a ShuffleMapStage before the shuffle and a ResultStage after it'],ans:2,why:'Only the shuffle edge cuts. Read, filter and map pipeline into the ShuffleMapStage, and the reduce plus the count run in the ResultStage. Switch <i>Job</i> to <i>filter &amp; project</i> and the plan collapses to a single ResultStage.'},
   build:{steps:['Start at the action’s final RDD and create the <b>ResultStage</b> for it.',
     'Walk dependencies depth-first. <b>Narrow:</b> add the parent to the current stage and keep walking. <b>Shuffle:</b> stop and remember the dependency.',
     'For each remembered shuffle, get or create a <b>ShuffleMapStage</b> for its parent, recursively, keyed by shuffle id so a shared shuffle is planned once.',
     'Each stage gets one task per partition of its last RDD. A stage becomes runnable when all its parent stages are done.'],
    code:'stageFor(rdd):\n  members, shuffleDeps = walkNarrow(rdd)      // stop at shuffle edges\n  parents = [getOrCreateMapStage(d) for d in shuffleDeps]\n  return Stage(members, parents, tasks = rdd.partitions)\nresultStage = stageFor(finalRdd)',
    rule:'<b>No stage contains a shuffle edge</b>, and a stage runs only after all its parent stages have finished.'}},
  {ask:'50 executors, 16,000 tasks, and a machine dies at minute 40. Who runs what, and what runs again?',
   why:'Without one owner of the job state, two machines may run the same partition, or none will. Spark retries a failing task up to <code>spark.task.maxFailures</code> (4) times before it fails the job.',
   v0:{name:'Every worker grabs partitions from a shared list',code:'while (p = sharedQueue.pop()):\n  run(p)           // who notices if I crash?',breaks:'A worker that dies mid-task loses its partition, or it gets done twice. If it dies <b>after</b> finishing a map task, the shuffle output on its disk vanishes and nobody knows the next stage now has holes.'},
   design:'One driver owns all state. It turns each stage into a set of tasks, gives them to free executor slots, retries failed attempts, and opens a stage only after its parents have succeeded.',
   predict:{q:'An executor dies <b>after</b> the map stage has finished. Some of the map outputs lived on its disk. What does the driver run again?',opts:['The whole job, from reading the file','Only the map tasks whose output was on the lost executor','Nothing: finished tasks are never rerun'],ans:1,why:'The map stage is resubmitted only for the partitions whose output disappeared; the rest are kept. Set <i>Failure injection</i> to <i>executor lost</i> and look for the hatched tasks. In real clusters, an external shuffle service or graceful decommissioning can keep those files alive even after the executor is gone.'},
   build:{steps:['<b>Task set</b> per stage: one task per partition, each run as numbered attempts.',
     '<b>Resource offers:</b> each executor has <code>cores / task.cpus</code> slots. Fill free slots with pending tasks, preferring one that already holds the data.',
     '<b>Task state lives on the driver only:</b> queued &rarr; running &rarr; succeeded or failed. A failed attempt is queued again until <code>maxFailures</code>, then the job fails.',
     '<b>Executor lost:</b> fail its running tasks, unregister the map outputs it held, and resubmit only those partitions of the parent stage.',
     '<b>Stage barrier:</b> submit a stage once all its parents have complete outputs.'],
    code:'onOffer(exec):    while exec.freeSlots and pending: launch(pending.pop(), exec)\nonFailed(task):   if ++task.attempt <= MAX_FAILURES: pending.push(task) else abortJob()\nonExecutorLost(e):\n  for t in running(e): onFailed(t)\n  for (stage, p) in mapOutputsOn(e): unregister(stage, p); resubmit(stage, p)\nonStageDone(s):   submit(children whose parents are all done)',
    rule:'<b>Only the driver changes task state</b>, and a result from an old attempt can never overwrite a newer one.'}},
  {ask:'Inside one task, how do filter and map process 128 MB without building a list at every step?',
   why:'A task owns one partition. If each operator built a full list, a task would need several times its partition in memory, and an executor runs many tasks at once.',
   v0:{name:'Run each operator over the whole partition',code:'rows   = readPartition(p)            // list\nkept   = [r for r in rows if pred(r)]   // list\nmapped = [f(r) for r in kept]         // list',breaks:'Three full lists live at once in every task. Memory becomes a multiple of the partition size and the executor runs <b>out of memory</b>, although each row only needed to pass through.'},
   design:'Compose the narrow functions into one chain of iterators: each row is pulled from the source, filtered, mapped and handed on before the next row is read.',
   predict:{q:'In one task, the filter drops 5 of 8 rows. How many times does the map function run?',opts:['3: rows the filter drops never reach map','8: map runs on every row and the result is filtered afterwards','16: every row passes through both functions'],ans:0,why:'Rows travel one at a time through the fused chain, and a dropped row stops at the Filter box (the token turns red). Compare the <i>Filter calls</i> and <i>Map calls</i> counters. Spark SQL goes further and compiles such a chain into a single loop (whole-stage code generation).'},
   build:{steps:['Each RDD implements <code>compute(partition)</code>, which returns an <b>iterator</b>.',
     'A narrow child wraps its parent’s iterator: <code>filter</code> skips, <code>map</code> transforms, <code>flatMap</code> expands.',
     'The task pulls from the last iterator into its sink: a counter, a buffer, a file writer, or the shuffle writer.',
     'Bound concurrency: an executor runs at most as many tasks as it has slots.'],
    code:'compute(Source, p) = readSplit(p)                                  // iterator\ncompute(Filter, p) = (r for r in compute(parent, p) if pred(r))\ncompute(Map, p)    = (f(r) for r in compute(parent, p))\nrunTask(p):  for r in compute(lastRdd, p): sink.add(r)',
    rule:'<b>A task reads only its own partition</b> and keeps one row in flight per operator, never a whole intermediate list.'}},
  {ask:'Revenue per city: each city’s rows are spread over all 16,000 partitions. How do they meet?',
   why:'Grouping needs every value of a key on one machine. That all-to-all copy is usually the most expensive step of a job: a disk write, a network transfer and a barrier between stages.',
   v0:{name:'Send every pair to one central reducer',code:'for (city, amount) in allPartitions:\n  driver.totals[city] += amount',breaks:'One machine receives every record, so its <b>network card and memory</b> become the bottleneck: the same single-machine wall you started from.'},
   design:'Each map task hashes the key to choose one of R reduce partitions and writes one block per destination. Each reduce task fetches its block from every map output, so equal keys always meet in the same task.',
   predict:{q:'Map-side combine is on. A map task holds 8 (city, amount) pairs covering 3 distinct cities. How many records does it write to the shuffle?',opts:['8, one per pair','1, the task’s grand total','3, one partial sum per city'],ans:2,why:'<code>reduceByKey</code> combines on the map side, so a task writes one partial sum per key it saw. It writes more only when memory forces a spill: try a small <i>Memory budget</i>. Untick <i>map-side combine</i> and every pair is shuffled.'},
   build:{steps:['<b>Partitioner:</b> <code>dest = floorMod(hash(key), R)</code>, identical on every machine. Never use a per-process random hash seed.',
     '<b>Shuffle write:</b> per map task, combine values per key in memory, spill sorted runs to disk when over budget, then write one file with R blocks plus an index.',
     '<b>Register</b> the committed output and its location with the driver (the map-output tracker).',
     '<b>Shuffle read:</b> reduce task <i>r</i> asks where block <i>r</i> of every map output lives, fetches them all and merges values per key.',
     '<b>Barrier:</b> reduce tasks start only when every map output is registered.'],
    code:'mapTask(p):\n  buf = {}\n  for (k, v) in compute(parent, p): buf[k] = combine(buf[k], v)    // spill if full\n  writeBlocks(groupBy(buf, k -> floorMod(hash(k), R))); tracker.register(p)\nreduceTask(r):\n  for p in mapPartitions: for (k, v) in fetch(p, r): acc[k] = reduce(acc[k], v)\n  return acc',
    rule:'<b>Equal keys always land in the same reduce partition</b>, and a reducer reads only committed map outputs.'}},
  {ask:'Thousands of tasks finish in random order, some of them twice. How do you get one correct answer?',
   why:'Retries and speculative copies mean one partition can produce output twice. A half-written output folder that the next job reads is worse than a failed job.',
   v0:{name:'Every task appends straight to the final output',code:'task(p): for r in rows: output.append(r)\n// count: the driver adds partial counts as they arrive',breaks:'A retried task appends its rows <b>twice</b>, a failed job leaves <b>half-written</b> output that readers pick up, and appending in finish order makes <code>collect</code> return a different order on every run.'},
   design:'Results are merged by partition index, not by arrival: count sums one number per partition, collect concatenates in partition order, and writes go to per-attempt temporary files that are published at job commit.',
   predict:{q:'With <code>writeJSONLines</code>, when can a downstream reader first see the output?',opts:['After the job commits: files are moved into place, then <code>_SUCCESS</code> is written','As soon as the first task finishes','While tasks are still writing, line by line'],ans:0,why:'Each attempt writes under a temporary folder, and the driver publishes the files only at job commit. Pick <i>writeJSONLines</i> and play it. Caveat for real systems: the v2 commit algorithm and some object-store committers move files as each task commits, which is exactly why readers should wait for <code>_SUCCESS</code>.'},
   build:{steps:['<b>Count:</b> each task returns a partial count; the driver stores it by partition index and sums once all have arrived.',
     '<b>Collect:</b> keep partition <i>p</i>’s rows in slot <i>p</i> and concatenate in index order. Refuse results above a size limit: they all land in driver memory.',
     '<b>Write:</b> each attempt writes under <code>_temporary/&lt;attempt&gt;/</code>. The driver lets exactly one attempt per partition commit.',
     '<b>Job commit:</b> move committed files into the target folder, then write <code>_SUCCESS</code>. On failure, delete <code>_temporary</code>.'],
    code:'onTaskResult(p, attempt, value):\n  if results[p] is set: return            // duplicate or stale attempt\n  results[p] = value\nwhen all results are set:\n  count   = sum(results)\n  collect = concat(results[0..n-1])       // partition order\n  write   = commitJob(); create("_SUCCESS")',
    rule:'<b>Exactly one attempt per partition counts</b>, and output becomes visible all at once or not at all.'}},
  {ask:'Last night the job took 3 hours instead of 20 minutes. How do you find out why, after it has finished?',
   why:'Log lines from 50 machines disagree and vanish with the executors. You need one ordered record of what the scheduler decided, and a way to see the plan without running it.',
   v0:{name:'Print logs and bump counters wherever something happens',code:'log.info("task done")       // on 50 machines\nui.counter++                 // from many threads',breaks:'Counters drift from what really happened (a retried task counted twice, a lost one never), logs disappear with their executors, and nothing tells you <b>which stage</b> was slow.'},
   design:'The driver emits one ordered stream of lifecycle events. The UI, the event log and every metric are folded from that stream, and <code>explain</code> prints the plan from metadata only.',
   predict:{q:'The summary tab says <i>retries 1</i>. Where does that number come from?',opts:['A counter each executor increments','It is folded from the ordered event stream on the driver','It is estimated from the plan before the job runs'],ans:1,why:'Every number in the summary is folded from the same events listed in the events tab, so the two can never disagree. Spark’s web UI and history server work the same way: they replay <code>SparkListener</code> events. Set <i>Failure injection</i> to <i>a task fails once</i>, then compare the events and summary tabs.'},
   build:{steps:['<b>Event types:</b> job, stage and task start and end, executor added and lost, each with a sequence number and a time.',
     '<b>One bus</b> on the driver: the scheduler posts, and listeners consume asynchronously (UI store, event-log file, metrics).',
     '<b>Summaries are folds</b> over the stream, never counters maintained on the side.',
     '<b>Explain</b> renders lineage and the stage plan from metadata: no row data, no closures, a deterministic order.'],
    code:'post(e): e.seq = nextSeq++; bus.publish(e)\nsummary = events.reduce(fold, emptySummary)\nfold(s, TaskEnd(ok))     = s with ok + 1\nfold(s, TaskEnd(failed)) = s with failed + 1\nexplain(plan) = render(plan.stages)        // metadata only',
    rule:'<b>Every reported number is derived from the event stream</b>, so replaying it gives exactly the same summary.'}}
 ],
 milestones:[
  {t:'Partitioned reader',test:'For 1 to 8 splits of the same file, the decoded rows equal a plain single-threaded parse: no line lost, none duplicated.'},
  {t:'Lazy lineage',test:'Build <code>filter &rarr; map &rarr; reduceByKey</code> on a source that throws when opened: nothing fails until an action is called.'},
  {t:'Stage planner',test:'<code>filter &rarr; map &rarr; reduceByKey</code> plans exactly 2 stages, a narrow-only job plans 1, and explain prints identical text on every run.'},
  {t:'Local runtime with count and collect',test:'Results equal a single-machine reference with 1, 2 and 4 worker slots, and collect always returns partition order.'},
  {t:'Shuffle and reduceByKey',test:'Each key appears in exactly one reduce partition; sums match the reference with combine on and off, and with a memory budget small enough to force spills.'},
  {t:'Retries and executor loss',test:'Inject a failing task and a lost executor: the answer still matches the reference, and only the lost map outputs are recomputed.'},
  {t:'Atomic writes and events',test:'Kill the job mid-write: no visible output and no <code>_SUCCESS</code>. On success, the summary folded from events equals the counters you observed.'}],
 capstone:{title:'Put it together: a live Spark application',lead:'A driver, a few executors and file storage, running jobs on a small table. Spark never edits a file: an INSERT writes a new file, UPDATE and DELETE rewrite a whole partition, and new files become visible only when the driver commits. Play a scenario, tap any event to see why it happened, then kill an executor and compare <code>cache()</code> on and off.'},
 extras:[
  {id:'dd1b',title:'Parquet: column pruning &amp; predicate pushdown',sub:'chapter 1'},
  {id:'dd2b',title:'HashPartitioner &amp; skew',sub:'chapter 6'},
  {id:'dd3b',title:'Spill &amp; external merge sort',sub:'chapter 6'},
  {id:'dd4b',title:'Join strategies &amp; AQE',sub:'beyond the tour'},
  {id:'dd5b',title:'Cache &amp; BlockManager',sub:'chapters 2 and 4'},
  {id:'dd6b',title:'DataFrame &rarr; optimizer &rarr; physical plan',sub:'chapters 2 and 3'},
  {id:'dd7b',title:'coalesce vs repartition',sub:'chapter 3'}]
};
</script>
<script>
Lab.mount(STORY);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const J=x=>{try{return JSON.stringify(x)}catch{return String(x)}};
const pc=i=>`var(--p${((i%8)+8)%8})`,tc=i=>`var(--t${((i%8)+8)%8})`;
const hashCode=s=>{let h=0;for(const c of String(s))h=(Math.imul(31,h)+c.charCodeAt(0))|0;return h};
const floorMod=(a,b)=>((a%b)+b)%b;
const cmp=(a,b)=>a<b?-1:a>b?1:0;
const short=(s,n=60)=>{s=String(s);return s.length>n?s.slice(0,n-1)+'…':s};
const enc=new TextEncoder(),dec=new TextDecoder();

/* =========================================================
   SAMPLES
   ========================================================= */
function lcg(seed){let s=seed;return()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}}
function sampleOrders(){
  const cities=['HCM','HN','DN','CT'],cats=['phone','laptop','book','toy'],names=['An','Binh','Chi','Dung','Em','Phuc'],r=lcg(11);
  const L=['id,customer,city,category,amount,qty'];
  for(let i=1;i<=24;i++)L.push([i,names[i%6],cities[Math.floor(r()*4)],cats[Math.floor(r()*4)],Math.round(i*18+r()*40),1+Math.floor(r()*5)].join(','));
  return L.join('\n');
}
function sampleEvents(){
  const acts=['view','click','buy'],ctr=['VN','TH','ID'],r=lcg(5),L=[];
  for(let i=1;i<=18;i++)L.push(J({ts:1000+i*7,user:'u'+(1+Math.floor(r()*5)),action:acts[Math.floor(r()*3)],ms:Math.round(i*3+r()*20),country:ctr[Math.floor(r()*3)]}));
  return L.join('\n');
}
function sampleUsers(){
  const c=['VN','TH','ID','SG'],r=lcg(9),a=[];
  for(let i=1;i<=12;i++)a.push({id:i,name:'user'+i,country:c[Math.floor(r()*4)],age:18+i*2+Math.floor(r()*4),score:Math.round(r()*100)});
  return J(a);
}
const SAMPLES={orders:{text:sampleOrders,fmt:'csv'},events:{text:sampleEvents,fmt:'jsonl'},users:{text:sampleUsers,fmt:'json'}};

/* =========================================================
   PARSING
   ========================================================= */
function detect(t){const s=t.trim();if(s.startsWith('['))return'json';const l=s.split(/\r?\n/)[0]||'';if(l.startsWith('{'))return'jsonl';if(l.includes(','))return'csv';return'text'}
function csvSplit(l){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){o.push(c);c=''}else c+=ch}o.push(c);return o}
const conv=v=>(typeof v==='string'&&/^-?\d+(\.\d+)?$/.test(v.trim()))?Number(v):v;
function colsOf(rows){const c=[];rows.forEach(r=>Object.keys(r).forEach(k=>{if(!c.includes(k))c.push(k)}));return c}
function parseWhole(text,pf){ // independent, sequential parse (used as correctness reference)
  if(pf==='json'){const a=JSON.parse(text);if(!Array.isArray(a))throw new Error('JSON must be an array');return{rows:a,columns:colsOf(a)}}
  const lines=text.split(/\r?\n/).filter(l=>l.trim()!=='');
  if(pf==='jsonl'){const rows=lines.map(l=>JSON.parse(l));return{rows,columns:colsOf(rows)}}
  if(pf==='csv'){if(!lines.length)return{rows:[],columns:[]};const h=csvSplit(lines[0]);const rows=lines.slice(1).map(l=>{const v=csvSplit(l),o={};h.forEach((k,i)=>o[k]=conv(v[i]??''));return o});return{rows,columns:h}}
  return{rows:lines.map(l=>({line:l})),columns:['line']};
}

/* =========================================================
   PREDICATES
   ========================================================= */
function coerce(a,b){const bn=Number(b);const num=typeof a==='number'&&b!==''&&!isNaN(bn);return num?[a,bn]:[String(a),String(b)]}
function evalPred(row,p){
  const a=row[p.col];if(a==null)return false;const[x,y]=coerce(a,p.val);
  switch(p.op){case'>=':return x>=y;case'>':return x>y;case'<=':return x<=y;case'<':return x<y;case'=':return x===y;case'!=':return x!==y}return false;
}
function canMatch(ch,p){ // conservative: true when unsure
  if(!ch||ch.min===undefined)return false;
  const bn=Number(p.val),num=typeof ch.min==='number'&&typeof ch.max==='number'&&p.val!==''&&!isNaN(bn);
  if(!num&&!(typeof ch.min==='string'&&typeof ch.max==='string'))return true;
  const lo=ch.min,hi=ch.max,v=num?bn:String(p.val);
  switch(p.op){case'>':return hi>v;case'>=':return hi>=v;case'<':return lo<v;case'<=':return lo<=v;case'=':return lo<=v&&v<=hi;case'!=':return!(lo===hi&&lo===v)}return true;
}
function skipReason(ch,p){
  const v=p.val;
  switch(p.op){case'>':return`max=${ch.max} ≤ ${v}`;case'>=':return`max=${ch.max} < ${v}`;case'<':return`min=${ch.min} ≥ ${v}`;case'<=':return`min=${ch.min} > ${v}`;case'=':return`${v} ∉ [${ch.min}, ${ch.max}]`;case'!=':return`all values = ${v}`}return'';
}

/* =========================================================
   CONFIG
   ========================================================= */
const OPT={W:3,fail:'none',R0:3,combine:true,aqe:false,budget:0};
let DS={columns:[],rows:[]};
function cfg(){
  const pv=$('#fval').value.trim(),pc_=$('#fcol').value;
  return{text:$('#src').value,fmt:$('#fmt').value,P:+$('#P').value,template:$('#tpl').value,
    pred:(pc_&&pc_!=='(none)'&&pv!=='')?{col:pc_,op:$('#fop').value,val:pv}:null,
    key:$('#kcol').value,agg:$('#agg').value,valCol:$('#vcol').value,
    proj:$('#proj').value.split(',').map(s=>s.trim()).filter(Boolean),action:$('#act').value,...OPT};
}
function neededCols(c,cols){
  let n=c.template==='agg'?[c.key,c.agg==='sum'?c.valCol:null]:c.proj.slice();
  if(c.pred)n.push(c.pred.col);
  n=[...new Set(n.filter(x=>x&&cols.includes(x)))];
  return n.length?n:cols.slice();
}

/* =========================================================
   READ (Feature 01 + 16)
   ========================================================= */
function columnarLayout(rows,cols,P){
  const N=rows.length,rgSize=Math.max(2,Math.ceil(N/(P*2))),G=Math.max(1,Math.ceil(N/rgSize)),rgs=[];
  for(let g=0;g<G;g++){
    const sl=rows.slice(g*rgSize,(g+1)*rgSize),chunks={};
    cols.forEach(col=>{
      const vals=sl.map(r=>r[col]).filter(v=>v!=null);
      let min,max;
      if(vals.length){const nums=vals.every(v=>typeof v==='number');const f=nums?vals:vals.map(String);min=f.reduce((a,b)=>b<a?b:a);max=f.reduce((a,b)=>b>a?b:a)}
      chunks[col]={min,max,nulls:sl.length-vals.length,bytes:sl.reduce((s,r)=>s+J(r[col]).length,0)+8};
    });
    rgs.push({g,start:g*rgSize,end:g*rgSize+sl.length,rows:sl,chunks});
  }
  return{rgs,rgSize,footer:64+16*G};
}
function pushdown(layout,cols,pred,needed){
  let read=layout.footer,total=layout.footer;
  layout.rgs.forEach(rg=>{
    rg.skip=false;rg.reason='';
    if(pred&&!canMatch(rg.chunks[pred.col],pred)){rg.skip=true;rg.reason=skipReason(rg.chunks[pred.col],pred)}
    cols.forEach(c=>{total+=rg.chunks[c].bytes;if(!rg.skip&&needed.includes(c))read+=rg.chunks[c].bytes});
  });
  return{readBytes:read,totalBytes:total};
}
function distribute(n,P){const base=Math.floor(n/P),ex=n%P,out=[];let s=0;for(let p=0;p<P;p++){const sz=base+(p<ex?1:0);out.push([s,s+sz]);s+=sz}return out}

function buildRead(c){
  const text=c.text,P=c.P;
  if(!text.trim())return{error:'No data yet.'};
  const pf=(c.fmt==='auto'||c.fmt==='parquet')?detect(text):c.fmt;
  let whole;try{whole=parseWhole(text,pf)}catch(e){return{error:'Cannot parse input: '+e.message}}
  const r={P,pf,sel:c.fmt,error:null,columns:whole.columns,allRows:whole.rows,N:whole.rows.length,partitions:[]};
  if(c.fmt==='parquet'){
    r.mode='columnar';r.label='Parquet (simulated)';
    const lay=columnarLayout(r.allRows,r.columns,P),needed=neededCols(c,r.columns);
    const pd=pushdown(lay,r.columns,c.pred,needed);
    r.rgs=lay.rgs;r.footer=lay.footer;r.rgSize=lay.rgSize;r.needed=needed;r.readBytes=pd.readBytes;r.totalBytes=pd.totalBytes;
    const dist=distribute(lay.rgs.length,P);
    for(let p=0;p<P;p++){
      const mine=lay.rgs.slice(dist[p][0],dist[p][1]);mine.forEach(g=>g.part=p);
      const rows=[];mine.filter(g=>!g.skip).forEach(g=>g.rows.forEach(rw=>{const o={};needed.forEach(k=>o[k]=rw[k]);rows.push(o)}));
      r.partitions.push({index:p,rgs:mine,rows});
    }
    return r;
  }
  if(pf==='json'){
    r.mode='memory';r.label='JSON array (memory source)';
    distribute(r.N,P).forEach(([a,b],p)=>r.partitions.push({index:p,rows:r.allRows.slice(a,b)}));
    return r;
  }
  // file source with byte ranges (UC-04) + record decoding (UC-05)
  r.mode='file';r.label=pf.toUpperCase()+' (row file, byte ranges)';
  const bytes=enc.encode(text),L=bytes.length;r.L=L;
  r.ranges=Array.from({length:P},(_,i)=>[Math.floor(L*i/P),Math.floor(L*(i+1)/P)]);
  const lines=[];let st=0;
  for(let i=0;i<L;i++)if(bytes[i]===10){lines.push({s:st,e:i+1,ce:(i>st&&bytes[i-1]===13)?i-1:i});st=i+1}
  if(st<L)lines.push({s:st,e:L,ce:L});
  let headers=null;
  if(pf==='csv'&&lines.length){lines[0].header=true;headers=csvSplit(dec.decode(bytes.slice(lines[0].s,lines[0].ce)))}
  for(let p=0;p<P;p++)r.partitions.push({index:p,range:r.ranges[p],lines:[],rows:[]});
  for(const ln of lines){
    ln.txt=dec.decode(bytes.slice(ln.s,ln.ce));
    const p=r.ranges.findIndex(x=>ln.s>=x[0]&&ln.s<x[1]);
    ln.crosses=ln.e>r.ranges[p][1];r.partitions[p].lines.push(ln);
    if(ln.header||!ln.txt.trim())continue;
    let row;
    try{
      if(pf==='jsonl')row=JSON.parse(ln.txt);
      else if(pf==='csv'){const v=csvSplit(ln.txt);row={};headers.forEach((h,i)=>row[h]=conv(v[i]??''))}
      else row={line:ln.txt};
    }catch(e){row={_decode_error:e.message}}
    r.partitions[p].rows.push(row);
  }
  r.nlines=lines.length;
  return r;
}

/* =========================================================
   LINEAGE (Feature 01/02)
   ========================================================= */
function buildLineage(c,read){
  const nodes=[];
  const add=(op,label,deps,parts)=>{const n={id:nodes.length,op,label,deps:deps.map(p=>({kind:op==='ReduceByKey'?'shuffle':'narrow',parent:p})),parts};nodes.push(n);return n};
  let last=add('Source',read.label,[],read.P);
  if(c.pred)last=add('Filter',`${c.pred.col} ${c.pred.op} ${c.pred.val}`,[last.id],read.P);
  if(c.template==='agg'){
    last=add('Map',`(${c.key}, ${c.agg==='sum'?c.valCol:'1'})`,[last.id],read.P);
    last=add('ReduceByKey',`${c.agg}() by key`,[last.id],c.R0);
  }else last=add('Map',`select(${neededCols({...c,pred:null},read.columns).join(',')})`,[last.id],read.P);
  return nodes;
}

/* planner events (Feature 02) */
function makePlan(nodes){
  const sched={jobs:0,stages:0,shuffle:new Map()},ev=[],final=nodes.length-1;
  ev.push({t:'job',final});
  function find(start,why){
    ev.push({t:'begin',start,why});
    const stack=[start],seen=new Set(),deps=[],members=[];
    while(stack.length){
      const cur=stack.pop();
      if(seen.has(cur)){ev.push({t:'skip',rdd:cur});continue}
      seen.add(cur);members.push(cur);ev.push({t:'look',rdd:cur});
      for(const dp of nodes[cur].deps){
        if(dp.kind==='shuffle'){deps.push({child:cur,parent:dp.parent});ev.push({t:'cut',child:cur,parent:dp.parent})}
        else{stack.push(dp.parent);ev.push({t:'keep',child:cur,parent:dp.parent})}
      }
    }
    return{deps,members};
  }
  const stages=[];
  function getOrCreate(dep){
    const ex=sched.shuffle.get(dep.child);if(ex){ev.push({t:'reuse',stage:ex});return ex.id}
    const{deps,members}=find(dep.parent,'feeds');
    const parents=[...new Set(deps.map(getOrCreate))];
    const st={id:sched.stages++,kind:'map',rdd:dep.parent,members,parents,parts:nodes[dep.parent].parts};
    sched.shuffle.set(dep.child,st);stages.push(st);ev.push({t:'make',stage:st});return st.id;
  }
  const{deps,members}=find(final,'final');
  const parents=[...new Set(deps.map(getOrCreate))];
  const rs={id:sched.stages++,kind:'result',rdd:final,members,parents,parts:nodes[final].parts};
  stages.push(rs);ev.push({t:'make',stage:rs});
  ev.push({t:'done',order:stages.map(s=>s.id)});
  return{events:ev,stages};
}

/* =========================================================
   COMPUTE (Feature 03/04/10/17): real execution on your rows
   ========================================================= */
function compute(c,read){
  const m={srcRecords:0,filterCalls:0,mapCalls:0,shuffleWritten:0,shuffleBytes:0,spills:0,combineSaved:0};
  const parts=[];
  read.partitions.forEach(pt=>{
    const rowsIn=pt.rows;m.srcRecords+=rowsIn.length;
    const trace=[],kept=[];
    for(const row of rowsIn){
      let passed=true;if(c.pred){m.filterCalls++;passed=evalPred(row,c.pred)}
      let out=null;
      if(passed){m.mapCalls++;
        if(c.template==='agg'){const k=row[c.key];out=[k==null?'null':String(k),c.agg==='count'?1:(Number(row[c.valCol])||0)]}
        else{const o={};neededCols({...c,pred:null},read.columns).forEach(k=>o[k]=row[k]);out=o}
        kept.push(out)}
      trace.push({src:row,passed,out});
    }
    parts.push({index:pt.index,rowsIn:rowsIn.length,kept:kept.length,trace,out:kept});
  });
  const res={parts,metrics:m,isAgg:c.template==='agg'};
  if(!res.isAgg){res.outParts=parts.map(p=>p.out);return res}

  const R0=c.R0,tasks=[];
  parts.forEach(p=>{
    const pairs=p.out;let emitted=[],buf=new Map(),bufList=[],spills=0;
    const flush=()=>{if(c.combine){emitted.push(...buf.entries());buf=new Map()}else{emitted.push(...bufList);bufList=[]}};
    for(const[k,v]of pairs){
      if(c.combine){buf.set(k,(buf.get(k)||0)+v)}else bufList.push([k,v]);
      const size=c.combine?buf.size:bufList.length;
      if(c.budget>0&&size>=c.budget){flush();spills++}
    }
    flush();
    const shards=Array.from({length:R0},()=>[]);
    emitted.forEach(([k,v])=>shards[floorMod(hashCode(k),R0)].push([k,v]));
    m.shuffleWritten+=emitted.length;m.shuffleBytes+=emitted.reduce((s,r)=>s+J(r).length,0);m.spills+=spills;m.combineSaved+=pairs.length-emitted.length;
    tasks.push({index:p.index,before:pairs.length,after:emitted.length,spills,shards});
  });
  res.mapTasks=tasks;
  const sizes=Array.from({length:R0},(_,d)=>tasks.reduce((s,t)=>s+t.shards[d].length,0));
  res.sizes=sizes;
  const total=sizes.reduce((a,b)=>a+b,0);
  let groups=sizes.map((_,d)=>[d]);
  if(c.aqe){
    const advisory=Math.max(1,Math.ceil(total/2));groups=[];let cur=[],sum=0;
    sizes.forEach((s,d)=>{if(cur.length&&sum+s>advisory){groups.push(cur);cur=[];sum=0}cur.push(d);sum+=s});
    if(cur.length)groups.push(cur);res.advisory=advisory;
  }
  res.groups=groups;res.R1=groups.length;
  res.reduceTasks=groups.map((g,gi)=>{
    const acc=new Map();let recs=0;
    g.forEach(d=>tasks.forEach(t=>t.shards[d].forEach(([k,v])=>{recs++;acc.set(k,(acc.get(k)||0)+v)})));
    const out=[...acc.entries()].sort((a,b)=>cmp(a[0],b[0])).map(([key,value])=>({key,value}));
    return{index:gi,dests:g,recsRead:recs,out};
  });
  res.outParts=res.reduceTasks.map(t=>t.out);
  return res;
}
function reference(c,read){ // single-machine, no splitting, no pushdown, no combine
  let rows=read.allRows;if(c.pred)rows=rows.filter(r=>evalPred(r,c.pred));
  if(c.template==='agg'){
    const acc=new Map();rows.forEach(r=>{const k=r[c.key]==null?'null':String(r[c.key]);acc.set(k,(acc.get(k)||0)+(c.agg==='count'?1:(Number(r[c.valCol])||0)))});
    return[...acc.entries()].sort((a,b)=>cmp(a[0],b[0])).map(([key,value])=>({key,value}));
  }
  const cols=neededCols({...c,pred:null},read.columns);
  return rows.map(r=>{const o={};cols.forEach(k=>o[k]=r[k]);return o});
}
function checkAgainstRef(S){
  const got=S.comp.outParts.flat(),ref=S.ref;
  if(S.comp.isAgg){return J(got.slice().sort((a,b)=>cmp(a.key,b.key)))===J(ref)}
  return J(got.map(J).sort())===J(ref.map(J).sort());
}

/* =========================================================
   SCHEDULER SIMULATION (Features 03, 05, 11, 12)
   ========================================================= */
function simulate(c,S){
  const comp=S.comp,isAgg=comp.isAgg,segs=[],ev=[];let ord=0;
  const E=(t,type,d={})=>ev.push({t,type,o:ord++,...d});
  const execs=[];const mk=(id,t)=>{const e={id,alive:true,freeAt:t||0};execs.push(e);return e};
  for(let i=0;i<c.W;i++)mk('E'+i);
  const alive=()=>execs.filter(e=>e.alive);
  execs.forEach(e=>E(0,'executor-registered',{exec:e.id}));
  E(0,'job-start',{action:c.action});
  const stageDefs=S.plan.stages.map(st=>{
    let tasks;
    if(st.kind==='map'||!isAgg)tasks=comp.parts.map(p=>({part:p.index,dur:150+p.rowsIn*30+(isAgg?(comp.mapTasks[p.index].spills*60):0)}));

      const tk=pending.shift(),e=alive().reduce((a,b)=>a.freeAt<=b.freeAt?a:b),start=Math.max(e.freeAt,tk.avail,tStart);

    if(si===0&&c.fail==='executor'&&!isAgg)failSpec={stage:sd.id,part:0,reason:'executor lost mid-task',kill:true};
    let done=runTasks(sd,sd.tasks,t,failSpec);

      const cnt={};done.forEach(d=>cnt[d.exec]=(cnt[d.exec]||0)+1);
      const victim=execs.filter(e=>e.alive).sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0)||b.id.localeCompare(a.id))[0];
      const lostAt=end+300;
      victim.alive=false;E(lostAt,'executor-lost',{exec:victim.id,reason:'heartbeat timeout'});
      const inval=done.filter(d=>d.exec===victim.id);

      if(!alive().length){const ne=mk(victim.id+"'",lostAt);E(lostAt,'executor-registered',{exec:ne.id})}
      alive().forEach(e=>e.freeAt=Math.max(e.freeAt,lostAt));
      if(inval.length){

        const re=runTasks(sd,inval.map(d=>({part:d.part,dur:d.dur,attempt:2})),lostAt,null);
        done=done.filter(d=>d.exec!==victim.id).concat(re);

function foldEvents(ev,k){

    if(e.type==='executor-lost')s.lost++;if(e.type==='map-output-invalidated')s.invalidated+=e.parts.length;if(e.type==='stage-completed')s.stages++;

function evText(e){

   'task-start':`task S${e.stage}.p${e.part} attempt ${e.attempt} → ${e.exec}`,'task-success':`task S${e.stage}.p${e.part} attempt ${e.attempt} succeeded on ${e.exec}`,
   'task-failed':`task S${e.stage}.p${e.part} attempt ${e.attempt} FAILED on ${e.exec}: ${e.error}`,'task-retry':`retry S${e.stage}.p${e.part} → attempt ${e.attempt}`,
   'executor-lost':`executor ${e.exec} LOST (${e.reason})`,'map-output-invalidated':`map outputs of S${e.stage} p[${(e.parts||[]).join(',')}] hosted on ${e.exec} invalidated`,
   'stage-resubmitted':`stage ${e.stage} resubmitted for ${e.tasks} lost map output(s)`,'stage-completed':`stage ${e.stage} completed`,'job-end':`job ${e.status}`};

/* =========================================================
   BUILD EVERYTHING

let S=null;
function build(){
  const c=cfg();const o={cfg:c};
  o.read=buildRead(c);if(o.read.error){o.error=o.read.error;return o}
  o.nodes=buildLineage(c,o.read);
  o.plan=makePlan(o.nodes);
  o.comp=compute(c,o.read);
  o.sim=simulate(c,o);
  o.ref=reference(c,o.read);
  o.ok=checkAgainstRef(o);
  return o;
}

/* =========================================================

   ========================================================= */
function dagSVG(nodes,o={}){
  const d={};const dep=n=>d[n.id]??(d[n.id]=n.deps.length?1+Math.max(...n.deps.map(x=>dep(nodes[x.parent]))):0);
  nodes.forEach(dep);const lv={};nodes.forEach(n=>{n.d=d[n.id];(lv[n.d]=lv[n.d]||[]).push(n)});
  const W=168,H=72,gx=100,gy=16;
  nodes.forEach(n=>{n.x=10+n.d*(W+gx);n.y=10+lv[n.d].indexOf(n)*(H+gy)});
  const dm=Math.max(...nodes.map(n=>n.d)),mr=Math.max(...Object.values(lv).map(a=>a.length));
  const w=20+(dm+1)*(W+gx)-gx,h=20+mr*(H+gy)-gy,reveal=o.reveal??nodes.length;
  let s=`<svg viewBox="0 0 ${w} ${h}" style="max-height:${Math.max(h,100)*1.3}px;min-width:${Math.min(w,1000)*0.66}px"><defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0L9,4.5L0,9z" fill="#8a94a6"/></marker></defs>`;
  nodes.forEach(n=>{if(n.id>=reveal)return;n.deps.forEach(dp=>{
    const a=nodes[dp.parent],k=a.id+'>'+n.id;
    const cls=`edge ${dp.kind==='shuffle'?'shuf':''} ${o.edgeWalk&&o.edgeWalk.has(k)?'walk':''} ${o.edgeFound&&o.edgeFound.has(k)?'found':''}`;
    const x1=a.x+W,y1=a.y+H/2,x2=n.x,y2=n.y+H/2;
    s+=`<path class="${cls}" d="M${x1},${y1} C${x1+28},${y1} ${x2-28},${y2} ${x2},${y2}" marker-end="url(#ar)"/>`;
    if(dp.kind==='shuffle')s+=`<text x="${(x1+x2)/2}" y="${(y1+y2)/2-8}" text-anchor="middle" style="fill:var(--bad);font-size:11px;font-weight:700;paint-order:stroke;stroke:var(--card);stroke-width:4px">shuffle</text>`;
  })});
  nodes.forEach(n=>{
    if(n.id>=reveal)return;
    const st=o.stageOf&&o.stageOf.get(n.id);
    s+=`<g class="nd ${o.cur===n.id?'cur':''}"><rect ${st!=null?`style="fill:${pc(st)}"`:''} x="${n.x}" y="${n.y}" width="${W}" height="${H}" rx="9"/>
      <text x="${n.x+9}" y="${n.y+20}" font-weight="700">#${n.id} ${n.op}</text>
      <text class="s2" x="${n.x+9}" y="${n.y+37}">${esc(short(n.label,26))}</text>
      <text class="s2" x="${n.x+9}" y="${n.y+54}">${n.parts} partitions</text>
      <text x="${n.x+9}" y="${n.y+67}" style="font-size:10.5px;font-weight:700">${st!=null?'Stage '+st:''}</text></g>`;
  });
  return s+'</svg><div class="swipehint">&larr; swipe the diagram &rarr;</div>';
}

/* =========================================================
   PHASE 1: READ
   ========================================================= */
function draw1(p){

    h+=`<div class="note" style="margin:0 0 4px">Bytes read: <b>${readB}</b> of ${r.totalBytes} (${Math.round(readB/r.totalBytes*100)}%)</div><div class="meter"><i style="width:${readB/r.totalBytes*100}%"></i></div>`;
    h+=`<div class="grid">`+r.partitions.map(pt=>`<div class="part" style="background:${pc(pt.index)}"><h4>partition ${pt.index} · ${pt.rows.length} rows decoded</h4>`+pt.rgs.map(g=>{
      const known=g.g<decided,cls=!known?'pend':g.skip?'skip':'';
      return`<div class="rg ${cls}" style="background:var(--card)"><b style="font-size:12px">RG ${g.g}</b> <span class="mono" style="color:var(--mut)">rows ${g.start}–${g.end-1}</span>${known?(g.skip?` <span class="tag r">skipped: ${esc(g.reason)}</span>`:' <span class="tag g">read</span>'):' <span class="tag">pending</span>'}
        <div class="cs">${r.columns.map(c=>{const ch=g.chunks[c],isN=r.needed.includes(c);return`<span class="cc ${known&&!g.skip&&isN?'rd':''} ${known&&!isN?'no':''}" title="bytes=${ch.bytes}">${esc(c)} ${ch.min===undefined?'∅':esc(ch.min+'..'+ch.max)}</span>`}).join('')}</div></div>`}).join('')+`</div>`).join('')+`</div>`;
    h+=`<div class="note">Pushdown only decides what <i>not</i> to read. The Filter stays in the lineage as a residual filter, so rows in kept row groups are still checked.</div>`;
    return h;
  }

    const k=p>=1?pt.rows.length:Math.ceil(p*pt.rows.length);streamed+=k;
    const hdr=r.mode==='file'?` · bytes [${pt.range[0]},${pt.range[1]})`:'';
    const cr=r.mode==='file'?pt.lines.filter(l=>l.crosses).length:0;
    return`<div class="part" style="background:${pc(pt.index)}"><h4>partition ${pt.index}${hdr}${cr?'<span class="tag o">reads past boundary</span>':''}</h4>
      <div class="meter"><i style="width:${pt.rows.length?k/pt.rows.length*100:100}%"></i></div>
      ${pt.rows.slice(0,Math.min(k,5)).map(x=>`<span class="row" title="${esc(J(x))}">${esc(J(x))}</span>`).join('')}
      <span class="note">${k}/${pt.rows.length} records streamed${pt.rows.length>5?` (showing ${Math.min(k,5)})`:''}</span></div>`}).join('');
  if(r.mode==='file'){
    h+=`<div class="note" style="margin:0 0 4px">Source descriptor: <b>${r.label}</b> · ${r.L} bytes · ${r.nlines} lines → ${total} records. The file is cut into ${r.P} byte ranges; each line belongs to the partition where it <i>starts</i> and is read past the boundary if needed (exactly once).</div>`;
    h+=`<div class="strip">`+r.ranges.map((x,i)=>`<div class="seg" style="width:${(x[1]-x[0])/r.L*100}%;background:${pc(i)}">P${i}</div>`).join('')+
      r.partitions.map(pt=>pt.lines.map(l=>`<div class="tick ${l.header?'h':''}" style="left:${l.s/r.L*100}%"></div>`).join('')).join('')+

  h+=`<div class="note" style="margin:4px 0">Records streamed: <b>${streamed}</b> / ${total}</div><div class="grid">${cards}</div>`;

/* PHASE 2: LINEAGE */

/* PHASE 3: PLAN */
let planBounds=null;
function replayPlan(upto){
  const nodes=S.nodes,ui={cur:null,stageOf:new Map(),walk:new Set(),found:new Set(),cards:[],cap:null};
  const nm=i=>`<b>#${i} ${nodes[i].op}</b>`;
  for(let i=0;i<upto;i++){const e=S.plan.events[i];
    switch(e.t){
      case'job':ui.cap={t:`PlanJob starts at the action's final RDD ${nm(e.final)}. Only dependencies are inspected.`};break;
      case'begin':ui.cur=e.start;ui.cap={t:e.why==='feeds'?`Now plan the stage that <b>feeds</b> the shuffle. Start from ${nm(e.start)}.`:`Walk backward from ${nm(e.start)}.`};break;
      case'look':ui.cur=e.rdd;break;
      case'skip':ui.cap={t:`${nm(e.rdd)} already seen: not visited twice.`};break;
      case'keep':ui.walk.add(e.parent+'>'+e.child);ui.cap={t:`${nm(e.child)} ← ${nm(e.parent)} is <b>narrow</b>: same stage, keep walking.`};break;
      case'cut':ui.found.add(e.parent+'>'+e.child);ui.cap={k:'cut',t:`${nm(e.child)} ← ${nm(e.parent)} is a <b>shuffle</b>. Cut here: ${nm(e.parent)} and what is before it is a different stage.`};break;
      case'make':ui.cur=null;ui.cards.push(e.stage);e.stage.members.forEach(m=>ui.stageOf.set(m,e.stage.id));
        ui.cap={k:'make',t:`Create <b>Stage ${e.stage.id}</b> (${e.stage.kind==='result'?'ResultStage':'ShuffleMapStage'}) with ${e.stage.members.slice().sort((a,b)=>a-b).map(i=>'#'+i).join(', ')}. TaskSetTemplate: ${e.stage.parts} partitions.`};break;
      case'reuse':ui.cur=null;ui.cap={k:'make',t:`Stage ${e.stage.id} reused.`};break;
      case'done':ui.cur=null;ui.cap={k:'make',t:`JobPlan ready: ${e.order.map(s=>'Stage '+s).join(' → ')}. 0 tasks launched, 0 closures called.`};break;
    }}

}
function draw3(p){

  const k=Math.max(1,Math.ceil(p*planBounds.length)),ui=replayPlan(p>=1?S.plan.events.length:planBounds[k-1]);
  return`<div class="caption ${ui.cap?.k||''}">${ui.cap?ui.cap.t:''}</div>`+dagSVG(S.nodes,{cur:ui.cur,stageOf:ui.stageOf,edgeWalk:ui.walk,edgeFound:ui.found})+
   ui.cards.map(s=>`<div class="st" style="background:${pc(s.id)}"><b>Stage ${s.id}</b> · ${s.kind==='result'?'ResultStage':'ShuffleMapStage'} · RDDs ${s.members.slice().sort((a,b)=>a-b).map(i=>'#'+i+' '+S.nodes[i].op).join(' → ')} · <b>${s.parts}</b> tasks later · ${s.parents.length?'waits for Stage '+s.parents.join(', '):'can run first'}</div>`).join('')+
   `<div class="note">Rule: narrow edges stay in one stage; the shuffle edge (ReduceByKey) cuts a ShuffleMapStage (producer) from a ResultStage (consumer). Stage IDs are scheduler counters.</div>`;

  const names=lanesNodes(),M=names.length,Lmax=5,fi=names.indexOf('Filter');
  const lanes=S.comp.parts.map(pt=>({pt,rows:pt.trace.slice(0,Lmax)}));
  const maxU=Math.max(1,...lanes.map(l=>l.rows.length*M)),g=p*maxU;
  const centers=i=>(i+0.5)/M*100;
  let h=`<div class="note" style="margin:0 0 6px">Each partition is a task. Inside a task rows are pulled <b>one at a time</b> through all fused narrow steps (iterator model): the first ${Lmax} rows per task are animated, counters show the real totals when finished.</div>`;
  lanes.forEach(({pt,rows})=>{
    const sU=Math.min(g,rows.length*M),r=Math.min(rows.length-1,Math.floor(sU/M)),u=sU-r*M;
    const counts=names.map(()=>0);let tok='',cap='waiting…';
    const reached=(row,pos)=>{const drop=(!row.passed&&fi>=0)?fi:null;return names.map((_,i)=>(drop===null||i<drop)&&pos>=i)};
    rows.forEach((row,ri)=>{
      if(ri<r||(p>=1)){const rc=reached(row,M-1);rc.forEach((v,i)=>{if(v)counts[i]++})}
      else if(ri===r&&rows.length){const drop=(!row.passed&&fi>=0)?fi:null;const pos=Math.min(u,drop===null?M-1:drop);const rc=reached(row,pos);rc.forEach((v,i)=>{if(v)counts[i]++});
        const vis=drop===null?u<M-0.2:u<drop+0.7;
        if(vis&&sU>0){const dropped=drop!==null&&u>=drop;
          tok=`<div class="tok" style="left:calc(${centers(Math.min(pos,M-1))}% - 10px);top:27px;background:${dropped?'var(--bad)':tc(pt.index)};${dropped?'opacity:.5;':''}" title="${esc(J(row.src))}">${dropped?'✕':ri}</div>`;
          cap=`row ${ri}: ${esc(short(J(row.src),70))}${dropped?' → dropped by Filter':(u>=M-1?' → '+esc(short(J(row.out),40)):'')}`}}
    });
    const final=p>=1,totals=names.map((nme,i)=>i===0?pt.rowsIn:pt.kept);
    h+=`<div class="lane"><div class="lh" style="background:${pc(pt.index)}">P${pt.index}</div><div><div class="track">${names.map((nme,i)=>`<div class="nd2"><span class="nm">${nme}</span><span class="ct">${final?totals[i]:counts[i]}</span></div>`).join('')}${final?'':tok}</div><div class="cap">${final?`task done: ${pt.rowsIn} in → ${pt.kept} out`:cap}</div></div></div>`;
  });
  const m=S.comp.metrics;
  return h+`<div class="chips" style="margin-top:8px"><span class="chip">source records read: ${p>=1?m.srcRecords:'…'}</span><span class="chip">Filter calls: ${p>=1?m.filterCalls:'…'}</span><span class="chip">Map calls: ${p>=1?m.mapCalls:'…'}</span></div>`;
}

/* PHASE 6: SHUFFLE */
function draw6(p){
  const c=S.comp;
  if(!c.isAgg)return`<div class="box">The plan has <b>no shuffle</b> (only narrow dependencies), so there is nothing to shuffle. Switch <b>Job</b> (knob above) to “Group &amp; aggregate” to see it.</div>`;
  const P=c.mapTasks.length,R0=S.cfg.R0,R1=c.R1;
  const a=Math.min(1,p/0.35),b=Math.max(0,Math.min(1,(p-0.35)/0.35)),d=Math.max(0,Math.min(1,(p-0.7)/0.3));
  const rowH=64,H=Math.max(P,R1)*rowH+10,mx=10,rx=400;
  let s=`<svg viewBox="0 0 600 ${H}" style="max-height:${H+10}px;min-width:480px">`;
  const mid=i=>10+i*rowH+26,rid=g=>10+g*rowH+26,maxCnt=Math.max(1,...c.mapTasks.flatMap(t=>t.shards.map(x=>x.length)));
  const groupOf=dd=>c.groups.findIndex(g=>g.includes(dd));
  c.mapTasks.forEach(t=>t.shards.forEach((sh,dd)=>{
    if(!sh.length)return;const gi=groupOf(dd),show=b>0||(a>=1);
    const op=(a>=(t.index+1)/P)?1:0;
    s+=`<path style="opacity:${op}" class="${b>0&&b<1?'flow':''}" d="M${mx+190},${mid(t.index)} C${mx+270},${mid(t.index)} ${rx-80},${rid(gi)} ${rx},${rid(gi)}" fill="none" stroke="${tc(dd)}" stroke-width="${1+3*sh.length/maxCnt}" opacity=".75"><title>map p${t.index} → reduce partition ${dd}: ${sh.length} records</title></path>`;
  }));
  c.mapTasks.forEach(t=>{
    const on=a>=(t.index+1)/P;
    s+=`<g><rect x="${mx}" y="${10+t.index*rowH}" width="190" height="${rowH-10}" rx="8" fill="${pc(t.index)}" stroke="${on?'var(--acc)':'var(--line)'}" stroke-width="${on?2.5:1.5}"/>
      <text x="${mx+8}" y="${10+t.index*rowH+17}" font-weight="700">map task p${t.index}</text>
      <text x="${mx+8}" y="${10+t.index*rowH+32}" style="font-size:10.5px">${t.before} pairs${S.cfg.combine?` → combine → ${t.after}`:` → ${t.after} written`}</text>
      <text x="${mx+8}" y="${10+t.index*rowH+45}" style="font-size:10.5px;fill:${t.spills?'var(--bad)':'var(--mut)'}">${S.cfg.budget?`spills: ${t.spills}`:'no memory limit'}</text></g>`;
  });
  c.reduceTasks.forEach((t,gi)=>{
    const on=b>=1;
    s+=`<g><rect x="${rx}" y="${10+gi*rowH}" width="190" height="${rowH-10}" rx="8" fill="${pc(t.dests[0])}" stroke="${on?'var(--acc)':'var(--line)'}" stroke-width="${on?2.5:1.5}"/>
      <text x="${rx+8}" y="${10+gi*rowH+17}" font-weight="700">reduce task ${gi}</text>
      <text x="${rx+8}" y="${10+gi*rowH+32}" style="font-size:10.5px">partitions {${t.dests.join(',')}} · ${t.recsRead} records</text>
      <text x="${rx+8}" y="${10+gi*rowH+45}" style="font-size:10.5px">${d>0?`→ ${t.out.length} keys`:''}</text></g>`;
  });
  s+='</svg><div class="swipehint">&larr; swipe the diagram &rarr;</div>';
  const phase=p<0.35?'① map tasks hash each record: dest = floorMod(hashCode(key), R) and write one shard per destination':p<0.7?'② reduce tasks ask the tracker for committed blocks and fetch their shards':'③ reduce: group by key and call the reducer; one value per key';
  const matrix=`<table><tr><th>map ↓ / dest →</th>${Array.from({length:R0},(_,dd)=>`<th class="n" style="background:${pc(dd)}">dest ${dd}</th>`).join('')}<th class="n">written</th><th>block location</th></tr>`+
    c.mapTasks.map(t=>`<tr style="${a>=(t.index+1)/P?'':'opacity:.25'}"><td>map p${t.index}</td>${t.shards.map(sh=>`<td class="n">${sh.length}</td>`).join('')}<td class="n">${t.after}</td><td class="mono">${S.sim.loc[t.index]||'-'}${S.sim.lostInfo&&S.sim.lostInfo.parts.includes(t.index)?' <span class="tag r">recomputed</span>':''}</td></tr>`).join('')+
    `<tr><td><b>total</b></td>${c.sizes.map(x=>`<td class="n"><b>${x}</b></td>`).join('')}<td></td><td></td></tr></table>`;
  const aq=S.cfg.aqe?`<div class="note"><b>AQE:</b> map-output statistics are complete before the reduce stage starts. Advisory size = ${c.advisory} records, so ${R0} shuffle partitions → <b>${R1} reduce task(s)</b> ${c.groups.map(g=>'{'+g.join(',')+'}').join(' ')}. The ResultStage task set was ${R0}; runtime coalesced it.</div>`:'';
  const outs=d>0?`<h3>Reduce output</h3>`+c.reduceTasks.map((t,gi)=>`<div class="chips" style="margin:3px 0"><span class="chip" style="background:${pc(t.dests[0])}">reduce ${gi}</span>${t.out.map(o=>`<span class="chip">${esc(o.key)} = ${o.value}</span>`).join('')||'<span class="note">empty</span>'}</div>`).join(''):'';
  const keys=[...new Set(c.mapTasks.flatMap(t=>t.shards.flatMap((sh,dd)=>sh.map(r=>r[0]+'|'+dd))))].map(x=>x.split('|'));
  return`<div class="caption">${phase}</div>${s}<h3>Shuffle blocks (what lands where)</h3>${matrix}${aq}
    <h3>HashPartitioner buckets (R = ${R0})</h3><div class="chips">${keys.map(([k,dd])=>`<span class="chip" style="background:${pc(+dd)}" title="hashCode=${hashCode(k)}">${esc(k)} → ${dd}</span>`).join('')}</div>${outs}
    <div class="note">Equal keys always reach the same destination, which is why one reduce task sees every value of a key. Shuffle records written: ${S.comp.metrics.shuffleWritten} (${S.comp.metrics.combineSaved} fewer than raw pairs thanks to map-side combine/spill policy) · ${S.comp.metrics.shuffleBytes} bytes.</div>`;
}

/* PHASE 7: ACTION */
function writeFiles(){return S.comp.outParts.map((rows,i)=>({name:'part-'+String(i).padStart(4,'0')+'.jsonl',content:rows.map(J).join('\n')+(rows.length?'\n':'')}))}
function draw7(p){
  const parts=S.comp.outParts,act=S.cfg.action,ref=S.ok?'<span class="ok">✔ matches the single-machine reference (no splitting, no pushdown, no combine)</span>':'<span class="bad">✘ differs from the reference</span>';
  let h='';
  if(act==='Count'){
    const total=parts.reduce((s,x)=>s+x.length,0),k=Math.ceil(p*parts.length);let run=0;
    h=`<div class="chips" style="margin-bottom:8px">`+parts.map((x,i)=>{const on=i<k||p>=1;if(on)run+=x.length;return`<span class="chip" style="background:${pc(i)};${on?'':'opacity:.3'}">task ${i}: ${x.length}</span>`}).join('<span> + </span>')+`</div><div class="big">${p>=1?total:run}</div><div class="note">Count = Σ per-task counts, independent of the number of workers or the order they finish.</div>`;
  }else if(act==='Collect'){
    const flat=[];parts.forEach((x,i)=>x.forEach(r=>flat.push([i,r])));const k=p>=1?flat.length:Math.ceil(p*flat.length);
    h=`<table><tr><th>partition</th><th>row</th></tr>${flat.slice(0,Math.min(k,40)).map(([i,r])=>`<tr><td style="background:${pc(i)}">${i}</td><td class="mono">${esc(J(r))}</td></tr>`).join('')}</table><div class="note">Collect concatenates in <b>partition order</b> (deterministic). ${flat.length} rows total${flat.length>40?', first 40 shown':''}. Only suitable for small results: everything lands in driver memory.</div>`;
  }else{
    const files=writeFiles(),stage=p<0.3?0:p<0.6?1:p<0.85?2:3;
    const label=['① each task writes its own attempt directory','② validate: checksum + manifest per file','③ atomic rename into the target directory','④ _SUCCESS written, temporary directory removed'][stage];
    h=`<div class="caption ${stage===3?'make':''}">${label}</div><pre>${stage<2?`output/\n  _temporary/job-0/\n${files.map(f=>`    attempt-0/${f.name}${stage===1?'   ✓ checksum ok':''}`).join('\n')}`:
      stage===2?`output/\n  _temporary/job-0/   (files being renamed…)\n${files.map(f=>`  ${f.name}`).join('\n')}`:`output/\n${files.map(f=>`  ${f.name}   (${f.content.split('\n').filter(Boolean).length} lines)`).join('\n')}\n  _SUCCESS`}</pre>
      <div class="note">All-or-nothing publish: downstream readers never see a partial output. If a task failed it would simply be retried in a fresh attempt directory and the failed attempt discarded.</div>
      <h3>Preview</h3>${files.map((f,i)=>`<div class="file" style="background:${pc(i)};padding:3px 8px;border-radius:5px;margin:3px 0"><b>${f.name}</b><br>${esc(f.content.split('\n').slice(0,2).join('\n'))||'(empty)'}</div>`).join('')}
      <div class="bar"><button data-act="dl">⬇ Download all as one .jsonl</button></div>`;
  }
  return h+`<div class="note" style="margin-top:8px">Correctness: ${ref}</div>`;
}

/* PHASE 8: EVENTS & EXPLAIN */
let tab8='events';
function explainText(){
  const L=['== RDD lineage =='];
  S.nodes.slice().reverse().forEach(n=>L.push(`RDD#${n.id} ${n.op} [${n.parts} partitions]${n.deps.length?` <- ${n.deps[0].kind==='shuffle'?'shuffle(HashPartitioner)':'narrow'} RDD#${n.deps[0].parent}`:''}`));
  L.push('','== JobPlan (JobID 0) ==');
  S.plan.stages.forEach(s=>L.push(`${s.kind==='result'?'ResultStage':'ShuffleMapStage'} ${s.id}: RDDs [${s.members.slice().sort((a,b)=>a-b).map(i=>'#'+i).join(', ')}] parents [${s.parents.map(x=>'S'+x).join(', ')}] TaskSetTemplate ${s.parts} partitions`));
  if(S.cfg.aqe&&S.comp.isAgg)L.push('',`== Runtime (AQE) ==`,`reduce partitions ${S.cfg.R0} -> ${S.comp.R1} tasks (advisory ${S.comp.advisory} records)`);
  L.push('','(metadata only: no row payloads, no closure bodies, no timestamps in the plan section)');
  return L.join('\n');
}
function draw8(p){
  const ev=S.sim.events,k=p>=1?ev.length:Math.ceil(p*ev.length),f=foldEvents(ev,k);
  const tabs=['events','summary','explain'].map(t=>`<button data-act="tab8" data-t="${t}" class="${tab8===t?'on':''}">${t}</button>`).join('');
  let body='';
  if(tab8==='events')body=`<table><tr><th class="n">seq</th><th class="n">t(ms)</th><th>event</th></tr>${ev.slice(0,k).map(e=>`<tr style="${/FAILED|LOST|invalidated/.test(evText(e))?'background:color-mix(in srgb,var(--bad) 14%,var(--card))':''}"><td class="n">${e.seq}</td><td class="n">${Math.round(e.t)}</td><td class="mono">${esc(evText(e))}</td></tr>`).join('')}</table>`;
  else if(tab8==='summary'){
    const m=S.comp.metrics;
    body=`<div class="chips"><span class="chip">status: ${f.status}</span><span class="chip">stages completed: ${f.stages}/${S.plan.stages.length}</span><span class="chip">tasks started ${f.started}</span><span class="chip">succeeded ${f.ok}</span><span class="chip">failed ${f.failed}</span><span class="chip">retries ${f.retries}</span><span class="chip">executors lost ${f.lost}</span><span class="chip">duration ${Math.round(f.ms)} ms (simulated)</span></div>
    <h3>Output metrics (counters only)</h3><div class="chips"><span class="chip">source records ${m.srcRecords}</span><span class="chip">filter calls ${m.filterCalls}</span><span class="chip">map calls ${m.mapCalls}</span>${S.comp.isAgg?`<span class="chip">shuffle records ${m.shuffleWritten}</span><span class="chip">shuffle bytes ${m.shuffleBytes}</span><span class="chip">spills ${m.spills}</span>`:''}${S.read.mode==='columnar'?`<span class="chip">bytes read ${S.read.readBytes}/${S.read.totalBytes}</span>`:''}</div>
    <div class="note">The summary is folded from the event stream (first ${k} of ${ev.length} events), so success and failure share one source of truth.</div>`;
  }else body=`<pre>${esc(explainText())}</pre>`;
  return`<div class="tabs">${tabs}</div>${body}`;
}

 {t:'Read source',s:'file → partitions',f:'F01 · F16',dur:5200,draw:draw1,
  b:'The source descriptor decides how the file is cut. Row files (CSV/JSONL) are cut into byte ranges and every complete line is decoded exactly once; Parquet is cut into row groups and can skip whole groups using min/max stats.'},
 {t:'Build lineage',s:'lazy RDD graph',f:'F01 · F13/14',dur:3200,draw:draw2,

 {t:'Plan stages',s:'DAGScheduler',f:'F02',dur:7000,draw:draw3,

 {t:'Schedule tasks',s:'driver ↔ executors',f:'F03 · F05 · F11',dur:6500,draw:draw4,
  b:'Each stage becomes a TaskSet with one task per partition. The driver is the only owner of state: it launches attempts on executors, retries failures, and opens the next stage only after its parents succeed.'},
 {t:'Run narrow tasks',s:'rows through closures',f:'F03',dur:7000,draw:draw5,

  if(k===1||k===2||k===4)return tplK;

  if(k===5)return($('#tpl').value==='narrow'?tplK:'')+`<label>Shuffle partitions R ${sel('R0',[1,2,3,4,5,6].map(x=>[x,x]),OPT.R0)}</label><label><input type="checkbox" data-opt="combine" ${OPT.combine?'checked':''}> map-side combine</label><label><input type="checkbox" data-opt="aqe" ${OPT.aqe?'checked':''}> AQE coalesce</label><label>Memory budget ${sel('budget',[[0,'unlimited'],[2,'2 records'],[3,'3 records'],[5,'5 records']],OPT.budget)}</label>`;
  if(k===6)return`<label>Action ${px('#act',[['Count','count'],['Collect','collect'],['WriteJSONLines','writeJSONLines']],$('#act').value)}</label>${tplK}`;

/* data → controls */
function fillSelect(sel,opts,keep,fallback){

  $(sel).innerHTML=opts.map(o=>`<option>${esc(o)}</option>`).join('');
  $(sel).value=opts.includes(old)?old:(fallback!==undefined&&opts.includes(fallback)?fallback:opts[0]);

function onData(auto){
  const c=cfg();let ds;
  try{const pf=(c.fmt==='auto'||c.fmt==='parquet')?detect(c.text):c.fmt;ds={...parseWhole(c.text,pf),pf}}catch(e){ds={rows:[],columns:[],pf:'?',err:e.message}}
  DS=ds;const cols=ds.columns;
  $('#srcInfo').innerHTML=ds.err?`<span class="bad">${esc(ds.err)}</span>`:`${ds.rows.length} rows · ${cols.length} columns (${esc(cols.join(', '))}) · parsed as ${ds.pf}`;
  const numCols=cols.filter(k=>ds.rows.length&&ds.rows.every(r=>r[k]==null||typeof r[k]==='number'));
  const strCols=cols.filter(k=>!numCols.includes(k));
  fillSelect('#fcol',['(none)',...cols],!auto,undefined);
  fillSelect('#kcol',cols,!auto);fillSelect('#vcol',cols,!auto);
  if(auto){
    const catCols=strCols.filter(k=>{const d=new Set(ds.rows.map(r=>r[k])).size;return d>=2&&d<=Math.max(6,ds.rows.length/3)});

    const vc=numCols.filter(k=>!/id$/i.test(k)&&!/^ts$/i.test(k));
    const pref=vc.find(k=>/amount|ms|score|age/i.test(k))||vc[0];
    if(pref){$('#vcol').value=pref;$('#fcol').value=pref;
      const vals=ds.rows.map(r=>r[pref]).filter(v=>typeof v==='number').sort((a,b)=>a-b);
      $('#fval').value=vals.length?String(Math.round(vals[Math.floor(vals.length*0.4)])):'';
      $('#fop').value='>=';$('#agg').value=/age/i.test(pref)?'count':'sum';}
    else{$('#fcol').value='(none)';$('#fval').value='';$('#agg').value='count'}
    $('#proj').value=cols.slice(0,3).join(',');
  }

function jobCode(){
  const el=$('#jobLine');if(!el)return;const c=cfg(),r=S&&S.read;
  const fm=c.fmt==='parquet'?'parquet':(r&&r.pf)||c.fmt,file='input.'+(fm==='parquet'?'parquet':fm==='jsonl'?'jsonl':fm==='json'?'json':'csv');
  const L=[`rdd = read("${file}", partitions = ${c.P})`];
  if(c.pred)L.push(`  .filter(row -> row.${c.pred.col} ${c.pred.op==='='?'==':c.pred.op} ${isNaN(Number(c.pred.val))?JSON.stringify(c.pred.val):c.pred.val})`);
  if(c.template==='agg'){L.push(`  .map(row -> (row.${c.key}, ${c.agg==='sum'?'row.'+c.valCol:'1'}))`);L.push(`  .reduceByKey((a, b) -> a + b, partitions = ${c.R0})`)}
  else L.push(`  .map(row -> select(${(r&&!r.error?neededCols({...c,pred:null},r.columns):c.proj).join(', ')}))`);

}

/* DD2 */
function dd2(){
  const el=$('#dd2b');if(!S||S.error){el.innerHTML='';return}

  const run=()=>{
    const R=+el.querySelector('#d2r').value;el.querySelector('#d2v').textContent=R;
    const pairs=pairsForDD(),cnt=new Map();pairs.forEach(([k])=>cnt.set(k,(cnt.get(k)||0)+1));
    const sizes=Array(R).fill(0),keys=Array.from({length:R},()=>[]);
    [...cnt.entries()].forEach(([k,c])=>{const d=floorMod(hashCode(k),R);sizes[d]+=c;keys[d].push(k+'×'+c)});
    const max=Math.max(1,...sizes),avg=pairs.length/R,skew=Math.max(...sizes)>2*avg&&R>1;
    el.querySelector('#d2out').innerHTML=sizes.map((s,d)=>`<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><span class="cell" style="background:${pc(d)};min-width:70px">dest ${d}</span><span class="bar2" style="width:${s/max*55}%;background:${tc(d)}"></span><b>${s}</b><span class="mono" style="color:var(--mut)">${esc(keys[d].join('  '))}</span></div>`).join('')+
      `<div class="note">${pairs.length} records over ${cnt.size} distinct keys. ${skew?'<span class="bad">Skew: one partition holds more than 2× the average.</span> A single hot key cannot be split by hashing: AQE skew handling or salting is needed.':'Reasonably balanced.'} Each key maps to exactly one partition: floorMod(hashCode(key), R).</div>`;
  };

}

/* DD3 */
function dd3(){
  const el=$('#dd3b');if(!S||S.error){el.innerHTML='';return}
  const oldB=el.querySelector('#d3b')?+el.querySelector('#d3b').value:4,oldF=el.querySelector('#d3f')?+el.querySelector('#d3f').value:2;
  el.innerHTML=`<div class="bar"><label>Memory budget (records) <input type="range" id="d3b" min="2" max="12" value="${oldB}"> <b id="d3bv">${oldB}</b></label><label>Merge fan-in <input type="range" id="d3f" min="2" max="4" value="${oldF}"> <b id="d3fv">${oldF}</b></label><button id="d3a" class="primary">▶ Animate</button></div><div id="d3out"></div>`;
  const draw=(p)=>{
    const B=+el.querySelector('#d3b').value,F=+el.querySelector('#d3f').value;el.querySelector('#d3bv').textContent=B;el.querySelector('#d3fv').textContent=F;
    const recs=pairsForDD().map(r=>r[0]).slice(0,40),N=recs.length;
    const spillP=Math.min(1,p/0.6),used=p>=1?N:Math.ceil(spillP*N);
    const runs=[];let buf=[];
    for(let i=0;i<used;i++){buf.push(recs[i]);if(buf.length>=B){runs.push(buf.slice().sort());buf=[]}}
    const final=used>=N;if(final&&buf.length){runs.push(buf.slice().sort());buf=[]}
    let h=`<div class="note" style="margin:0 0 4px">① records stream into a bounded buffer; when it reaches the budget it is sorted and spilled as a run (${used}/${N} consumed)</div>
      <div class="chips" style="margin-bottom:4px"><b style="font-size:12px">buffer:</b>${buf.map(k=>`<span class="chip">${esc(k)}</span>`).join('')||'<span class="note">empty</span>'}</div>`;
    h+=runs.map((r,i)=>`<div class="chips" style="margin:3px 0"><span class="chip" style="background:${pc(i)}">run ${i}</span>${r.map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div>`).join('');
    if(p>0.6||p>=1){
      let level=runs.map(r=>r),passes=0;
      const mp=p>=1?1:(p-0.6)/0.4;
      let steps=0;const log=[];
      while(level.length>1){passes++;const nx=[];for(let i=0;i<level.length;i+=F){const grp=level.slice(i,i+F);nx.push(grp.flat().sort());log.push(`pass ${passes}: merge ${grp.length} runs`)}level=nx}
      const merged=level[0]||[];const shown=Math.ceil(mp*merged.length);
      const expect=recs.slice().sort();
      h+=`<div class="note" style="margin:8px 0 4px">② k-way merge with fan-in ${F}: ${runs.length} run(s) → ${passes} pass(es)${passes?' ('+log.join(', ')+')':''}</div><div class="chips">${merged.slice(0,shown).map(k=>`<span class="chip" style="border-color:var(--ok)">${esc(k)}</span>`).join('')}</div>`;
      if(p>=1)h+=`<div class="note">Spilled runs: <b>${runs.length}</b> · output equals in-memory sort ${J(merged)===J(expect)?'<span class="ok">✔</span>':'<span class="bad">✘</span>'}. Spill files are never visible as final output; they are deleted only after a verified merge.</div>`;
    }
    Lab.morph(el.querySelector('#d3out'),h);
  };
  el.querySelector('#d3b').oninput=()=>draw(1);el.querySelector('#d3f').oninput=()=>draw(1);
  el.querySelector('#d3a').onclick=()=>{const g0=++D.d3gen;let t0=null;const f=now=>{if(g0!==D.d3gen)return;if(t0===null)t0=now;const p=Math.min(1,(now-t0)/5000);draw(p);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)};draw(1);
}

        <rect x="420" y="15" width="150" height="55" rx="8" fill="var(--p2)" stroke="var(--line)"/><text x="430" y="40">${s.replace('Join','')}</text><text x="430" y="57" style="fill:var(--mut)">joined output</text></svg>`};

      ${sk?`<div class="note"><b class="bad">Skew detected:</b> one shuffle partition is far above the median. For an eligible inner join AQE splits it into sub-partitions and replicates the matching build rows; otherwise it falls back safely.</div>`:''}
