const DETAIL=[
{how:"Each partition is a directory of segment files (.log, .index, .timeindex) named by base offset. Appends go to the active segment, which rolls at log.segment.bytes or log.roll.ms. The sparse offset index adds an entry roughly every index.interval.bytes, so a fetch binary-searches the index and scans a short stretch. After an unclean shutdown the broker re-validates segments past the recovery point and truncates at the first bad record.",
 pros:["Sequential appends and reads exploit the OS page cache and disk throughput","Sparse index stays small enough to be memory-mapped yet gives near O(log n) lookup","Segment granularity makes retention and deletion cheap file operations","Recovery only scans the tail past the recovery checkpoint, not the whole log"],
 cons:["Durability leans on replication; fsync is not per message by default (log.flush.* is unset)","Too many small segments or partitions means many open file handles and mmaps","Index lookup is sparse, so each fetch still scans a short linear stretch","Random access by key is not supported; only offset and timestamp lookups"],
 fails:[{m:"Torn tail after crash",s:"Broker restart logs 'Recovering unflushed segment' and takes a long time with large logs",x:"Use clean shutdown, keep segments modest, raise num.recovery.threads.per.data.dir, rely on replicas to refetch truncated data"},
 {m:"Corrupted record or index",s:"CorruptRecordException on fetch, or index rebuild messages at startup",x:"Check disk and filesystem health, let the broker rebuild indexes, re-replicate the partition from the leader if the log is bad"},
 {m:"Out of file descriptors / mmap limit",s:"Broker fails with 'Too many open files' or 'Map failed' after adding partitions",x:"Raise ulimit -n and vm.max_map_count, cut partition count per broker, increase segment size"},
 {m:"Disk full",s:"Log dir goes offline; partitions on it become offline or fail over",x:"Add disks or brokers, lower retention, alert before 80 percent; JBOD log dir failure marks only that dir offline"}],
 watch:["kafka.log:type=Log,name=Size and LogEndOffset per partition; flat or runaway growth is suspect","OfflineLogDirectoryCount above 0 means a failed disk","kafka-dump-log.sh --files <segment> to inspect records and verify the index","Startup time and 'Recovering unflushed segment' log lines after restarts"]},

{how:"The default partitioner hashes the key bytes with murmur2 and takes it modulo the partition count, so equal keys always land in the same partition. Records without a key use the sticky partitioner: fill one batch for a partition, then switch. Order is guaranteed only inside a partition. A custom Partitioner class can override placement.",
 pros:["Per-key ordering is preserved because one key maps to one partition","Stateful consumers can rely on key locality for joins and aggregations","Partitioning is client-side, so brokers do no routing work","Sticky partitioning for null keys yields larger batches and lower latency"],
 cons:["Skewed keys create hot partitions that one consumer and one leader must absorb","Adding partitions changes hash modulo, so existing keys map to new partitions and per-key order breaks","No global ordering across partitions","Partition count cannot be decreased without recreating the topic"],
 fails:[{m:"Hot partition",s:"One partition has much higher bytes-in and lag while others idle; one consumer is pegged",x:"Salt or composite keys, custom partitioner for known hot keys, split the workload, or use more fine-grained keys"},
 {m:"Repartition breaks key order",s:"After increasing partitions the same key appears in a different partition; stateful consumers see gaps or duplicates of state",x:"Over-provision partitions up front, or create a new topic and migrate with a dual-write or replay"},
 {m:"Null-key assumption",s:"Consumers expect ordering for records that were published without a key",x:"Always set a key when order matters; document that unkeyed topics are unordered"},
 {m:"Too few partitions",s:"Consumer group cannot scale past partition count; extra consumers sit idle",x:"Size partitions for target consumer parallelism and throughput before launch"}],
 watch:["Per-partition BytesInPerSec and message counts via kafka-log-dirs.sh or topic metrics; one outlier means skew","Per-partition consumer lag from kafka-consumer-groups.sh --describe","Key cardinality and top-key share in producer-side sampling","Partition count versus consumer count; consumers above partitions are idle"]},

{how:"KafkaProducer.send appends records into per-partition batches in the RecordAccumulator. A batch is sent when it reaches batch.size or after linger.ms, and whole batches can be compressed (compression.type: gzip, snappy, lz4, zstd). Total buffered bytes are capped by buffer.memory; when full, send blocks up to max.block.ms and then throws.",
 pros:["Batching amortizes request overhead and boosts throughput by orders of magnitude","Compressing whole batches gives better ratios and saves network and disk","buffer.memory bounds heap use so a slow broker cannot cause an OutOfMemoryError","linger.ms trades a few milliseconds of latency for fuller batches"],
 cons:["linger.ms adds latency to every record in a quiet topic","Compression costs producer and consumer CPU, and brokers may recompress on mismatch","Buffered but unsent records are lost if the producer process dies","Backpressure surfaces as blocked send calls, which can stall application threads"],
 fails:[{m:"Producer blocked by full buffer",s:"send blocks then TimeoutException: Failed to allocate memory within max.block.ms",x:"Fix the slow broker or network, raise buffer.memory, add producers, or reduce rate upstream"},
 {m:"Batch expiry",s:"TimeoutException: Expiring N record(s) after delivery.timeout.ms",x:"Check broker health and request.timeout.ms, tune delivery.timeout.ms and retries, ensure leader availability"},
 {m:"Tiny batches",s:"Low batch-size-avg and high request-rate with poor throughput",x:"Increase linger.ms and batch.size, make sure keys do not fan out into too many partitions"},
 {m:"Data lost on producer crash",s:"Records accepted by send never reach the broker after process kill",x:"Call flush or close on shutdown, use callbacks to track acks, keep an outbox if loss is unacceptable"}],
 watch:["Producer metrics batch-size-avg, record-queue-time-avg, buffer-available-bytes, bufferpool-wait-time","request-latency-avg and request-rate; rising latency drives buffer exhaustion","compression-rate-avg to confirm compression is actually helping","Broker RequestQueueTimeMs and produce TotalTimeMs for slow-broker signs"]},

{how:"Consumers in a group.id split the partitions; the group coordinator broker tracks members and assigns via the partition assignor. Consumers pull records and commit offsets to the __consumer_offsets topic. Committing after processing gives at-least-once, before processing risks skips. A join, leave or missed heartbeat (session.timeout.ms, max.poll.interval.ms) triggers a rebalance.",
 pros:["Pull model lets consumers control pace and apply their own backpressure","Group membership gives horizontal scaling and automatic failover","Offsets stored in Kafka make restarts resumable from a known position","CooperativeStickyAssignor moves only the affected partitions, avoiding stop-the-world"],
 cons:["Eager rebalance revokes all partitions so the whole group pauses","Parallelism is capped by partition count","At-least-once means duplicates after a crash unless processing is idempotent","Slow processing past max.poll.interval.ms kicks the member out"],
 fails:[{m:"Rebalance storm",s:"Constant 'Revoking previously assigned partitions' logs, throughput collapses, lag climbs",x:"Use CooperativeStickyAssignor, static membership via group.instance.id, tune session.timeout.ms and max.poll.interval.ms, avoid rolling restarts all at once"},
 {m:"Duplicate processing",s:"Records reprocessed after a crash or rebalance because the commit happened after side effects",x:"Make handlers idempotent, commit synchronously after processing, or use transactions"},
 {m:"Skipped records",s:"Messages never processed after a crash because offset was committed before processing (or auto-commit raced)",x:"Commit after processing, or disable enable.auto.commit and commit explicitly"},
 {m:"Consumer lag growth",s:"records-lag-max rises steadily; end-to-end latency grows",x:"Scale consumers up to partition count, speed up processing, reduce max.poll.records, check for a stuck member"}],
 watch:["kafka-consumer-groups.sh --describe: per-partition LAG and CONSUMER-ID","Consumer metrics records-lag-max, rebalance-rate-per-hour, last-rebalance-seconds-ago, commit-latency-avg","Group state (Stable, PreparingRebalance, Empty) from the coordinator","Time between polls versus max.poll.interval.ms; close to the limit predicts eviction"]},

{how:"Brokers delete whole closed segments once they exceed retention.ms or retention.bytes; the active segment is never deleted. The log start offset advances and consumers behind it get OffsetOutOfRange and fall back per auto.offset.reset. With tiered storage (KIP-405, remote.storage.enable), closed segments are copied to remote storage and local.retention.ms/bytes only controls the local copy.",
 pros:["Retention is a cheap file delete and independent of consumers, so slow readers never block the broker","Time and size limits give predictable disk usage","Tiered storage decouples storage from compute and keeps long history readable","Local disks can be small and rebuilds of brokers copy less data"],
 cons:["A consumer lagging beyond retention silently loses data","Deletion granularity is a segment, so actual retention can overshoot the setting","Tiered reads from remote storage have higher latency than local reads","Tiered storage cannot be used with compacted topics and adds a plugin to operate"],
 fails:[{m:"Consumer falls off retained range",s:"OffsetOutOfRangeException; with auto.offset.reset=latest records are skipped, with earliest a big reprocess happens",x:"Alert on lag versus retention, raise retention, scale consumers, choose reset policy deliberately"},
 {m:"Retention not applied",s:"Disk keeps growing because the active segment is large and has not rolled",x:"Lower segment.ms or log.segment.bytes so segments roll and become eligible for deletion"},
 {m:"Remote storage outage",s:"Fetches of old offsets fail or time out while recent data still works",x:"Monitor the remote storage plugin, keep local retention long enough for common consumer lag, retry and alert"},
 {m:"Retention too short for replay",s:"Backfill or reprocessing cannot reach the needed history",x:"Extend retention or enable tiered storage before the incident, not after"}],
 watch:["Consumer lag compared to time left until deletion (lag in time versus retention.ms)","Log start offset versus committed offsets from kafka-consumer-groups.sh","Per-topic log Size and disk usage trend per broker","Tiered storage metrics: RemoteCopyLagBytes, RemoteFetchBytesPerSec, RemoteCopyErrorsPerSec"]},

{how:"Followers fetch from the partition leader like consumers. The in-sync replica set (ISR) holds followers within replica.lag.time.max.ms. The high watermark is the highest offset replicated to all ISR members and only records below it are visible to consumers. With acks=all the leader acks after the full ISR has the record, and min.insync.replicas rejects writes when the ISR is too small.",
 pros:["acks=all with min.insync.replicas=2 and replication factor 3 survives one broker loss without losing acked data","The high watermark prevents consumers from seeing data that could be lost on failover","ISR adapts to slow followers instead of waiting for all replicas forever","Leader epochs let followers truncate divergent logs safely after failover"],
 cons:["acks=all adds latency, bound by the slowest ISR member","With ISR shrunk below min.insync.replicas, producers get errors and the partition is unavailable for writes","acks=1 or 0 can lose acknowledged data on leader failure","Replication multiplies network and disk use"],
 fails:[{m:"acks=1 data loss",s:"Leader fails after ack but before followers fetch; the acked record vanishes after election",x:"Use acks=all with min.insync.replicas of 2 and replication factor 3"},
 {m:"ISR shrink",s:"UnderReplicatedPartitions rises, IsrShrinksPerSec spikes, NotEnoughReplicasException for acks=all producers",x:"Find the slow or dead follower (disk, GC, network), fix it, tune replica.lag.time.max.ms only after root cause"},
 {m:"Unclean leader election",s:"Out-of-sync replica becomes leader after all ISR died; consumers see data rewind or loss",x:"Keep unclean.leader.election.enable=false; accept unavailability over loss unless the topic tolerates it"},
 {m:"Offline partition",s:"OfflinePartitionsCount above 0; clients get LeaderNotAvailable",x:"Restore the failed brokers, check ISR of the partition, only then consider a controlled unclean election"}],
 watch:["UnderReplicatedPartitions and UnderMinIsrPartitionCount should stay at 0","IsrShrinksPerSec and IsrExpandsPerSec; frequent flapping is bad","UncleanLeaderElectionsPerSec and OfflinePartitionsCount must be 0","kafka-topics.sh --describe --under-replicated-partitions and follower lag via ReplicaFetcherManager MaxLag"]},

{how:"With enable.idempotence=true (default since Kafka 3.0) the broker assigns a producer ID (PID) with an epoch, and the producer tags each batch with a per-partition sequence number. The leader keeps recent batch metadata per PID and partition, so a retried batch is detected as a duplicate and acked without re-append. A gap in sequence raises OutOfOrderSequenceException. A newer epoch fences older producers.",
 pros:["Retries after a lost ack no longer create duplicates","Ordering holds with up to 5 in-flight requests per connection","Zero application changes beyond a config flag","Epoch fencing stops a stale producer from writing after a replacement started"],
 cons:["Guarantees apply to one producer session and one partition only; a restart gets a new PID","Does not cover duplicates created by application-level resends or consumer reprocessing","Requires acks=all and bounded max.in.flight.requests.per.connection (5 or less)","Broker dedup state is limited, so it cannot detect duplicates across very old batches"],
 fails:[{m:"Duplicate on retry (idempotence off)",s:"Same record appears twice after a timeout and retry",x:"Enable idempotence, which is default in modern clients, and keep acks=all"},
 {m:"OutOfOrderSequenceException",s:"Producer errors after the broker lost sequence state or a batch was expired out of order",x:"Treat as fatal for that producer, recreate it, review delivery.timeout.ms and broker retention of producer state"},
 {m:"Zombie producer fenced",s:"ProducerFencedException or InvalidProducerEpochException from an old instance",x:"Expected for a replaced instance; shut it down, do not retry, check for duplicate deployments"},
 {m:"Cross-session duplicates",s:"After app restart the same logical message is written again",x:"Use transactional.id for cross-session guarantees or add a business-level idempotency key downstream"}],
 watch:["Producer metrics record-retry-rate and record-error-rate","Client log lines with OutOfOrderSequenceException or ProducerFencedException","Broker metric ProducerStateManager and producer snapshot files in the partition directory","Config check: enable.idempotence=true, acks=all, max.in.flight.requests.per.connection 5 or less"]},

{how:"With cleanup.policy=compact the log cleaner thread rewrites older segments keeping only the latest record per key, while offsets of kept records do not change. A record with a null value is a tombstone; it is kept for delete.retention.ms so consumers rebuilding state can see the delete, then removed. The active segment is never compacted, and a partition is cleaned when its dirty ratio passes min.cleanable.dirty.ratio.",
 pros:["Bounded storage that still holds the full current state per key","New consumers can rebuild a table by reading the topic from the start","Offsets are preserved so consumer positions stay valid","Tombstones allow deletes, for example for GDPR key removal"],
 cons:["Cleaning is asynchronous; old versions may remain for a long time","Does not preserve history of intermediate values","Cleaner threads cost I/O and CPU; a dead cleaner thread silently stops compaction","Consumers slower than delete.retention.ms can miss a tombstone and keep stale keys"],
 fails:[{m:"Tombstone removed too early",s:"A slow rebuilding consumer never sees the delete and keeps a deleted key in its state",x:"Set delete.retention.ms longer than the worst-case consumer rebuild time"},
 {m:"Cleaner thread died",s:"Topic keeps growing; log-cleaner-recopy and cleaner metrics flat; log shows LogCleaner errors",x:"Check log-cleaner.log, fix the cause (often a corrupt or oversized record), restart the broker"},
 {m:"Nothing compacts",s:"Old values remain because the active segment never rolls or the dirty ratio is not reached",x:"Lower segment.ms or min.cleanable.dirty.ratio, set max.compaction.lag.ms to bound staleness"},
 {m:"Null key rejected",s:"Producer gets an error writing a record without a key to a compacted topic",x:"Always set a non-null key for compacted topics"}],
 watch:["kafka.log:type=LogCleanerManager,name=max-dirty-percent and time-since-last-run-ms","kafka.log:type=LogCleaner,name=max-clean-time-secs and cleaner-recopy-percent","Topic Size growth versus unique key count","Consumer rebuild time compared with delete.retention.ms"]},

{how:"A transactional producer (transactional.id) registers with a transaction coordinator, writes to many partitions, and calls sendOffsetsToTransaction to commit consumed offsets in the same transaction. On commit or abort the coordinator writes control markers to every partition involved. Consumers with isolation.level=read_committed read only up to the last stable offset (LSO) and skip aborted records.",
 pros:["Atomic read-process-write across partitions and the consumer offset for Kafka-to-Kafka pipelines","Producer fencing by transactional.id and epoch removes zombies after failover","read_committed hides in-flight and aborted data from downstream consumers","Builds on idempotent producer so retries stay safe"],
 cons:["Exactly-once covers Kafka reads and writes only, not external side effects like database writes","Open transactions stall the LSO and delay read_committed consumers","Extra round trips and markers add latency and throughput cost","Transaction state lives in __transaction_state, adding coordinator load"],
 fails:[{m:"Hanging transaction blocks LSO",s:"read_committed consumers stop advancing while read_uncommitted keeps going; LSO lag grows",x:"Keep transaction.timeout.ms reasonable so the coordinator aborts it, fix the stuck producer, use kafka-transactions.sh find-hanging and abort"},
 {m:"Zombie producer",s:"ProducerFencedException after failover or rebalance",x:"Use stable transactional.id per input partition, let fenced instance close, do not retry blindly"},
 {m:"Transaction timeout abort",s:"Commit fails with InvalidProducerEpochException after a long processing pause",x:"Reduce batch work per transaction or raise transaction.timeout.ms within the broker limit"},
 {m:"Side effects not atomic",s:"An external database write happens twice or never when a transaction aborts",x:"Keep side effects inside Kafka, or use an idempotent sink or outbox pattern"}],
 watch:["Consumer metric records-lag versus last-stable-offset lag for read_committed groups","Producer metrics txn-commit-time-avg, txn-abort-time-avg","Broker metrics for TransactionMarkerChannelManager and __transaction_state partition health","kafka-transactions.sh list and describe for long-running or hanging transactions"]},

{how:"kafka-reassign-partitions.sh (or Cruise Control) adds target replicas to a partition, which copy data from the leader as followers, join the ISR once caught up, and only then are old replicas dropped. Leadership can then move through preferred leader election. Copy rate can be limited with --throttle (leader.replication.throttled.rate and follower.replication.throttled.rate).",
 pros:["Rebalances disk, bytes and leader load across brokers online","Staged copy then switch keeps the partition available throughout","Throttle protects production traffic from catch-up traffic","Same mechanism handles broker decommissioning and expansion"],
 cons:["Moving a replica copies the full partition, which can take hours and saturate disks and network","It moves whole partitions; a single hot partition or hot key is not split","A throttle that is too low makes the move take forever, too high hurts clients","New brokers receive no existing partitions unless reassignment is run"],
 fails:[{m:"Reassignment saturates cluster",s:"Produce and fetch latency rise, ISR shrink during the move",x:"Apply a throttle, move few partitions at a time, run off-peak, remove throttle after completion"},
 {m:"Stuck reassignment",s:"Move never finishes because a target broker is slow or down; --verify shows in progress",x:"Fix or replace the target broker, cancel with --cancel, check follower fetch lag and throttle rate"},
 {m:"Leaders imbalance after move",s:"One broker still serves most traffic even though replica counts are even",x:"Run preferred leader election or enable auto.leader.rebalance.enable, check leader count per broker"},
 {m:"Throttle left in place",s:"Normal follower replication stays slow later; under-replicated partitions persist",x:"Run --verify to clear throttles after the move finishes"}],
 watch:["kafka-reassign-partitions.sh --verify for progress and throttle cleanup","ReplicaFetcherManager MaxLag and UnderReplicatedPartitions during moves","Per-broker BytesInPerSec, disk usage, and LeaderCount for balance","Network and disk saturation on source and target brokers"]},

{how:"In KRaft mode a quorum of controllers (process.roles=controller) replicates the cluster metadata log, __cluster_metadata, using a Raft variant. One controller is the active leader per epoch; it handles topic, partition and leader changes and brokers fetch metadata from it. A record commits once a majority of voters has replicated it, and a new election happens if the active controller fails. This replaces ZooKeeper.",
 pros:["No external ZooKeeper; one system to operate and secure","Metadata changes are a replicated log, so recovery and propagation to brokers are fast","Majority quorum tolerates minority failures (1 of 3, 2 of 5)","Scales to far more partitions than the old ZooKeeper design"],
 cons:["Needs an odd number of voters and majority availability; losing quorum stops metadata changes","Quorum members cannot be changed casually in older versions; dynamic quorum came later","Network partition leaves only the majority side able to commit","Operators must learn new tools such as kafka-metadata-quorum.sh and metadata snapshots"],
 fails:[{m:"Controller quorum lost",s:"No active controller; topic creation, leader election and broker registration stall while existing data traffic may continue",x:"Restore a majority of controller nodes; keep voters on separate failure domains"},
 {m:"Frequent controller elections",s:"ActiveControllerCount flaps; leader changes pile up",x:"Check network latency, GC, disk fsync on controller nodes, tune controller.quorum.election.timeout.ms carefully"},
 {m:"Metadata lag on brokers",s:"Brokers serve stale leader info; clients get NotLeaderOrFollower errors",x:"Check broker fetch from controller, metadata.log size, and snapshot generation"},
 {m:"Split-brain worry in a partition",s:"Isolated old active controller cannot commit but may think it leads briefly",x:"Epochs and majority commit prevent conflicting writes; heal network and let it step down"}],
 watch:["kafka.controller:type=KafkaController,name=ActiveControllerCount sums to exactly 1","kafka-metadata-quorum.sh describe --status for leader, epoch, high watermark and voter lag","kafka.server:type=raft-metrics: current-state, commit-latency-avg, election-latency-avg","Metadata log size and last snapshot age; follower lag in the quorum"]}
];

(function(){

const SIMM={
 id:'kafka',nodeLabel:'brokers',nodeRange:[3,5,3],

 ],
 topo(n){
  const bw=Math.min(150,Math.floor(560/n)-14),x0=150+(560-n*(bw+14))/2,nodes=[{id:'prod',x:14,y:170,w:100,h:70,label:'Producer'},{id:'ctrl',x:380,y:6,w:150,h:46,label:'Controller',badge:'metadata'},{id:'cons',x:780,y:150,w:110,h:130,label:'Consumer'}];
  for(let i=0;i<n;i++)nodes.push({id:'b'+i,x:x0+i*(bw+14),y:90,w:bw,h:290,label:'broker '+i});
  const edges=[];for(let i=0;i<n;i++){edges.push(['prod','b'+i],['b'+i,'cons'],['ctrl','b'+i]);for(let j=i+1;j<n;j++)edges.push(['b'+i,'b'+j])}
  return{nodes,edges,w:900,h:400,zones:[{x:x0-12,y:70,w:n*(bw+14)+10,h:326,label:'Kafka cluster · topic orders · 3 partitions · RF 3'}]};
 },
 init(n){const st={status:{prod:'up',ctrl:'up',cons:'up'},logs:{},lead:[],ep:[0,0,0],hw:[0,0,0],view:{},coff:[0,0,0],n};for(let i=0;i<n;i++){st.status['b'+i]='up';st.logs['b'+i]=[[],[],[]]}for(let p=0;p<3;p++)st.lead[p]=KB_REPL(p,n)[0];return st},
 apply(st,f){switch(f.op){case'app':st.logs['b'+f.b][f.p].push(f.rec);break;case'hw':st.hw[f.p]=f.v;break;case'down':st.status['b'+f.b]='down';break;case'up':st.status['b'+f.b]='up';break;case'lead':st.lead[f.p]=f.b;st.ep[f.p]=f.ep;break;case'trunc':st.logs['b'+f.b][f.p].length=f.len;break;case'consume':f.recs.forEach(r=>{if(r.val===null)delete st.view[r.key];else st.view[r.key]=r.val});st.coff[f.p]+=f.recs.length;break}},
 fxText(f){return{app:`b${f.b} p${f.p} append offset ${f.rec&&f.rec.off}`,hw:`p${f.p} high watermark ${f.v}`,down:`broker ${f.b} down`,up:`broker ${f.b} up`,lead:`p${f.p} leader → b${f.b} (epoch ${f.ep})`,trunc:`b${f.b} p${f.p} truncated to ${f.len}`,consume:`consumer applies ${f.recs&&f.recs.length} record(s)`}[f.op]||f.op},
 run(acts,n,set){
  const W=SIMM.init(n),ev=[],push=e=>{ev.push(e);return e},ap=f=>SIMM.apply(W,f);
  for(const a of acts){const t=a.t;
   if(['P','U','D'].includes(a.op)){
    const key=a.args[0]||'k',val=a.op==='D'?null:(a.args[1]||'v'),p=sHash(key)%3,L=W.lead[p],lb='b'+L,label=a.op==='P'?'produce':a.op==='U'?'update':'tombstone';
    if(W.status[lb]==='down'){push(E(t,500,'prod','ctrl',`${label} ${key}: leader of p${p} is down → refresh metadata`,'fail',[],'The producer cannot reach the partition leader. It refreshes metadata and retries once a new leader has been elected.'));continue}
    push(E(t,500,'prod',lb,`${label} ${key}${val===null?'':'='+val} → p${p}`,'write',[],`partition = hash("${key}") mod 3 = ${p}. Equal keys always go to the same partition, so their order is preserved.`));
    const off=W.logs[lb][p].length,rec={off,key,val,ep:W.ep[p]};
    const e1=push(E(t+500,0,lb,lb,`append offset ${off}`,'info',[{op:'app',b:L,p,rec}],'The leader appends to the end of its log and assigns the next offset. Nothing is overwritten: an update or delete is just a new record.'));ap(e1.fx[0]);
    const rep=KB_REPL(p,n),isr=rep.filter(r=>r!==L&&W.status['b'+r]==='up'),downF=rep.filter(r=>r!==L&&W.status['b'+r]==='down');
    if(set.acks==='1')push(E(t+500,400,lb,'prod',`ack offset ${off} (acks=1)`,'ack',[],'acks=1: the leader answers after its own append. Followers do not have the record yet, so a leader crash right now would lose it.'));
    let tf=t+500;
    isr.forEach((f,i)=>{const e=push(E(t+700+i*100,600,lb,'b'+f,`replicate offset ${off}`,'repl',[{op:'app',b:f,p,rec}],'Followers pull the leader log. The record is committed only after every in-sync replica has it.'));ap(e.fx[0]);tf=Math.max(tf,e.t+e.d)});
    if(downF.length)push(E(t+500,0,lb,lb,`ISR shrinks: b${downF.join(',b')} out of sync`,'info',[],'A dead follower leaves the in-sync set so writes can still be acknowledged (as long as min.insync.replicas is met).'));
    const hw=push(E(tf,0,lb,lb,`high watermark → ${off+1}`,'info',[{op:'hw',p,v:off+1}],'High watermark = smallest log end among in-sync replicas. Consumers can only read below it.'));ap(hw.fx[0]);
    if(set.acks!=='1')push(E(tf,400,lb,'prod',`ack offset ${off}`,'ack',[],'acks=all: acknowledged only when all in-sync replicas have the record, so it survives losing the leader.'));
   }
   if(a.op==='C'){for(let p=0;p<3;p++){const L=W.lead[p],lb='b'+L;if(W.status[lb]==='down')continue;const from=W.coff[p],recs=W.logs[lb][p].slice(from,W.hw[p]);
     push(E(t+p*140,400,'cons',lb,`fetch p${p} @${from}`,'read',[],'Consumers pull from the partition leader at their own offset.'));
     const e=push(E(t+p*140+400,500,lb,'cons',`${recs.length} record(s) p${p}`,'data',[{op:'consume',p,recs}],'The consumer applies records in order: a later record for a key replaces the earlier value, and a tombstone deletes the key.'));ap(e.fx[0])}}
   if(a.op==='K'){const b=+a.args[0]||0;if(b>=n)continue;const e=push(E(t,0,'ctrl','b'+b,`broker ${b} crashes`,'fail',[{op:'down',b}],'The broker process dies. Followers stop receiving data from it; the controller notices missing heartbeats.'));ap(e.fx[0]);
     ev.forEach(x=>{if(x===e||x.t+x.d<=t)return;
       if(x.kind==='repl'&&x.from==='b'+b&&x.fx.length){x.fx.forEach(f=>{if(f.op==='app'){const lg=W.logs['b'+f.b][f.p];const i=lg.findIndex(r=>r.off===f.rec.off&&r.key===f.rec.key);if(i>=0&&i===lg.length-1)lg.pop()}});x.fx=[];x.msg+=' ✕ cut off';x.kind='fail';x.cause='The leader died before this follower copied the record, so the record exists only on the dead leader.'}
       else if(x.from==='b'+b&&x.fx.some(f=>f.op==='hw')){x.fx=[];x.msg='(high watermark never advanced)';x.kind='fail'}
       else if(x.from==='b'+b&&x.to==='prod'&&x.t>t){x.msg='ack never sent (leader died)';x.kind='fail'}});
     for(let p=0;p<3;p++)if(W.lead[p]===b){const cand=KB_REPL(p,n).filter(r=>r!==b&&W.status['b'+r]==='up').sort((x,y)=>W.logs['b'+y][p].length-W.logs['b'+x][p].length)[0];
       if(cand===undefined){push(E(t+600,0,'ctrl','ctrl',`p${p} OFFLINE: no in-sync replica`,'fail',[],'Unclean leader election is disabled, so Kafka prefers unavailability over electing a stale replica.'));continue}
       const lostN=W.logs['b'+b][p].length-W.logs['b'+cand][p].length;if(lostN>0)push(E(t+500,0,'ctrl','ctrl',set.acks==='1'?`${lostN} ACKNOWLEDGED record(s) on p${p} are LOST`:`${lostN} un-acknowledged record(s) on p${p} dropped (producer will retry)`,'fail',[],set.acks==='1'?'With acks=1 the producer was told "success" before any follower had the record. After failover the new leader does not have it: silent data loss.':'With acks=all the producer never received an ack for these records, so it retries them against the new leader: nothing acknowledged is lost.'));
       const e2=push(E(t+600,500,'ctrl','b'+cand,`elect b${cand} leader of p${p} (epoch ${W.ep[p]+1})`,'ctl',[{op:'lead',p,b:cand,ep:W.ep[p]+1}],'Only an in-sync replica may become leader. The epoch fences the old leader if it comes back.'));ap(e2.fx[0])}}
   if(a.op==='H'){const b=+a.args[0]||0;if(b>=n)continue;const e=push(E(t,0,'ctrl','b'+b,`broker ${b} restarts`,'info',[{op:'up',b}],'The broker rejoins and catches up from the current leaders before returning to the in-sync set.'));ap(e.fx[0]);
     let k=0;for(let p=0;p<3;p++){if(!KB_REPL(p,n).includes(b))continue;const L=W.lead[p];if(L===b)continue;const miss=W.logs['b'+L][p].slice(W.logs['b'+b][p].length);const extra=W.logs['b'+b][p].length-W.logs['b'+L][p].length;if(extra>0){const et=push(E(t+250+k*150,0,'b'+b,'b'+b,`truncate p${p} divergent suffix (${extra})`,'ctl',[{op:'trunc',b,p,len:W.logs['b'+L][p].length}],'The returning replica discards records the new leader never had (they were never committed).'));et.fx.forEach(ap);k++;continue}
       if(!miss.length)continue;
       const e3=push(E(t+300+k*150,600,'b'+L,'b'+b,`catch-up p${p} (${miss.length} record(s))`,'repl',miss.map(rec=>({op:'app',b,p,rec})),'A returning replica fetches everything it missed from the current leader.'));e3.fx.forEach(ap);k++}}
  }
  return{events:ev};
 },
 lines(id,st){
  if(id==='cons')return[...Object.entries(st.view).slice(0,7).map(([k,v])=>`${k} = ${v}`),Object.keys(st.view).length?'':'(no state yet)'];
  if(id==='ctrl')return[`epochs ${st.ep.join(' ')}`];
  if(id[0]==='b'&&id!=='bx'){const i=+id.slice(1),o=[];for(let p=0;p<3;p++){if(!KB_REPL(p,st.n).includes(i))continue;const lg=st.logs[id][p],last=lg[lg.length-1];o.push(`p${p}${st.lead[p]===i?'★':' '} ${lg.length} rec · hw ${st.hw[p]}`);o.push(last?`  o${last.off}: ${last.key}=${last.val===null?'∅':last.val}`:'  (empty)')}return o}
  return[];
 },
 detail(id,st){if(id[0]==='b'){const o=[];for(let p=0;p<3;p++){if(!KB_REPL(p,st.n).includes(+id.slice(1)))continue;o.push(`partition ${p}${st.lead[p]===+id.slice(1)?' (leader, epoch '+st.ep[p]+')':' (follower)'}`);st.logs[id][p].forEach(r=>o.push(`  offset ${r.off}: ${r.key} = ${r.val===null?'null (tombstone)':r.val}`))}return o}return SIMM.lines(id,st)}
};

Lab.sim(SIMM);})();

Lab.onStop(()=>{rsLive=false;rsAnim=false;const lb=document.querySelector("[data-act=r-live]");if(lb)lb.textContent="▶ Run live"});
