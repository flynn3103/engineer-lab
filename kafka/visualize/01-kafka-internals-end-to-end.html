<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafka Internals End-to-End</title>

<style>
:root{--acc:#231f20;--acc2:#2f6fed}
@media(prefers-color-scheme:dark){:root{--acc:#e8ecf3;--acc2:#6c9bff}}
@media(max-width:820px){.g2{grid-template-columns:1fr}}
.rc{display:inline-block;min-width:30px;text-align:center;font-family:ui-monospace,monospace;font-size:10.5px;border:1.5px solid var(--line);border-radius:4px;padding:1px 3px;margin:1px;background:var(--card);vertical-align:top}
.rc.gone{opacity:.3;text-decoration:line-through}.rc.del{border-color:var(--bad)}.rc.hl{border-color:var(--t1);background:color-mix(in srgb,var(--t1) 20%,var(--card))}
.rc.dup{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}.rc.ok{border-color:var(--ok)}.rc.ab{opacity:.45;border-style:dashed}.rc.mk{border-color:var(--t3);background:color-mix(in srgb,var(--t3) 20%,var(--card))}
.seg{display:inline-block;border:2px solid var(--line);border-radius:8px;padding:4px 6px;margin:3px;vertical-align:top;background:var(--card)}
.seg.act{border-color:var(--t1)}.seg.rem{border-style:dashed;border-color:var(--t3)}.seg.del{opacity:.25;border-style:dotted}
.seg h5{margin:0 0 3px;font-size:10.5px;color:var(--mut);font-weight:600}
.le{display:inline-block;min-width:34px;text-align:center;font-family:ui-monospace,monospace;font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:1px 4px;margin:1px}
.le.c{border:2px solid var(--ok);font-weight:700}
/* Kafka: --acc is near-black, so give the shared shell a readable brand colour */
:root{--brand:#cf4b14}
@media(prefers-color-scheme:dark){:root{--brand:#ff7a3d;--on-brand:#1a1206}}
/* phone-friendly views: text tables wrap, numbers do not; step rows wrap instead of being cut */
.view table{white-space:normal}
.view td.n,.view th.n{white-space:nowrap}
.view .row{white-space:normal;overflow:visible;text-overflow:clip}
.tlw{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.tlw>svg{min-width:560px}
.view table.pt{font-size:12px}.view table.pt td,.view table.pt th{padding:3px 5px}
.rbtns{display:flex;flex-wrap:wrap;gap:6px}
/* ---- redesign: stages, offset strips, byte bars, comparison bars ---- */
.callout.principle{border-left:5px solid var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--card));margin:0 0 12px;font-size:15px}
.callout.principle b.t{color:var(--brand)}
.stg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.stg button{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:6px 12px;border-radius:999px}
.stg button i{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--soft);font-size:11px;font-weight:700}
.stg button.act{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--card));font-weight:700}
.stg button.act i{background:var(--brand);color:var(--on-brand,#fff)}
.segs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.segs .seg{margin:0;display:block;min-width:0}
.seg.dim{opacity:.4}.seg.hit{border-color:var(--brand)}.seg.nxt{border-style:dashed;opacity:.7}
.kstrip{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end;margin:3px 0}
.kscroll{overflow-x:auto;padding-bottom:3px}.kscroll .kstrip{flex-wrap:nowrap}
.kcol{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.kfl{display:flex;flex-direction:column;align-items:center;gap:1px;min-height:14px;justify-content:flex-end}
.kf{font-size:9px;line-height:1;padding:2px 4px;border-radius:4px;background:var(--mut);color:#fff;white-space:nowrap;font-weight:700;letter-spacing:.02em}
.kf.hw{background:var(--ok)}.kf.leo{background:var(--t1,#e25a1c)}.kf.bad{background:var(--bad)}.kf.cur{background:var(--brand);color:var(--on-brand,#fff)}.kf.idx{background:var(--ok)}
.kc{display:inline-grid;place-items:center;min-width:27px;height:27px;padding:0 3px;border:2px solid var(--line);border-radius:6px;font:600 11px ui-monospace,monospace;background:var(--kc,var(--card));color:var(--ink);white-space:nowrap}
.kc.ghost{border-style:dashed;opacity:.45;background:transparent}
.kc.ok{border-color:var(--ok)}.kc.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.kc.hot{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 25%,transparent)}
.kc.dim{opacity:.32}.kc.gone{opacity:.28;text-decoration:line-through;background:transparent}.kc.empty{border-style:dotted;opacity:.5;background:transparent}
.kc.open{border-style:dashed}.kc.ab{border-style:dashed;opacity:.5;text-decoration:line-through}.kc.mk{border-radius:50%;border-color:var(--t3);background:color-mix(in srgb,var(--t3) 25%,var(--card))}
.kc.rem{border-style:dashed;border-color:var(--t3)}.kc.idx{box-shadow:inset 0 -4px 0 var(--ok)}.kc.latest{outline:2.5px solid var(--ok);outline-offset:1px}
.krow{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px;align-items:end;margin:6px 0}
.krow>b{font-size:12px;padding-bottom:5px;line-height:1.2}.krow>b small{display:block;font-weight:400;color:var(--mut);font-size:10.5px}
.krow.dead>*{opacity:.45}
@media(max-width:560px){.krow{grid-template-columns:1fr;gap:0}.krow>b{padding:0}}
.kbytes{display:flex;height:34px;border:2px solid var(--line);border-radius:7px;overflow:hidden;background:var(--soft)}
.bf{display:grid;place-items:center;font:700 10px ui-monospace,monospace;font-style:normal;border-right:1px solid var(--card);min-width:2px;overflow:hidden;white-space:nowrap}
.bf.ok{background:color-mix(in srgb,var(--ok) 30%,var(--card))}.bf.chk{background:color-mix(in srgb,var(--brand) 22%,var(--card))}
.bf.bad{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--bad) 45%,var(--card)) 0 6px,var(--card) 6px 12px);color:var(--ink)}
.bf.lost{background:transparent;border-left:2px dashed var(--bad);color:var(--bad)}.bf.free{background:transparent;color:var(--mut);font-weight:400}
.kstep{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12.5px;background:var(--card);min-width:0}
.kstep b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:2px}
.kstep.act{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--card))}.kstep.act b{color:var(--brand)}
.ksteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
@media(max-width:700px){.ksteps{grid-template-columns:1fr}}
.kbars{display:grid;gap:5px;margin:6px 0}
.kb{display:grid;grid-template-columns:minmax(64px,118px) minmax(0,1fr) 62px;gap:8px;align-items:center;font-size:12px}
.kt{height:15px;background:var(--soft);border-radius:5px;overflow:hidden}.kt i{display:block;height:100%;background:var(--mut);border-radius:5px}
.kb.bad .kt i{background:var(--bad)}.kb.ok .kt i{background:var(--ok)}.kb.cur .kt i{background:var(--brand)}.kb.cur>span{font-weight:700}
.kb b{text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px}
.kmulti{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:8px 0}
.kmulti h5{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
@media(max-width:760px){.kmulti{grid-template-columns:1fr}}
.kchips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.kchip{font:600 11px ui-monospace,monospace;border:1.5px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--kc,var(--card))}
.kchip.bad{border-color:var(--bad)}.kchip.ok{border-color:var(--ok)}
.kframe{display:flex;flex-wrap:wrap;gap:0;font:11px ui-monospace,monospace;margin:4px 0;border:2px solid var(--line);border-radius:6px;overflow:hidden}
.kframe span{padding:3px 7px;border-right:1px solid var(--line);overflow-wrap:anywhere}
.kframe .f1{background:color-mix(in srgb,var(--t2,#2f6fed) 22%,var(--card))}.kframe .f2{background:color-mix(in srgb,var(--t4,#9b4fd0) 22%,var(--card))}.kframe .f3{background:var(--card);flex:1}
.kgrid{display:grid;gap:4px;margin:6px 0;align-items:center;font-size:11.5px}
.kgrid .h{font-weight:700;color:var(--mut);text-align:center;font-size:11px}
.kgrid .r{font-weight:700}
.kg{display:grid;place-items:center;height:28px;border:2px solid var(--line);border-radius:6px;font:700 11px ui-monospace,monospace;background:var(--card)}
.kg.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}.kg.new{border-color:var(--ok);border-style:dashed;background:color-mix(in srgb,var(--ok) 28%,var(--card))}
.kg.old{border-color:var(--bad);border-style:dashed;opacity:.65}.kg.empty{border-style:dotted;opacity:.4}
.kclock{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin:4px 0 8px}.kclock i{display:block;height:100%;background:var(--brand)}
.kcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);min-width:0}
.kcard h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.kg2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media(max-width:760px){.kg2{grid-template-columns:1fr}}
.kseq text{font-size:11px}.kseq .lbl{font-size:10.5px;fill:var(--mut)}
</style>

<body>
<div id="dataSlot" hidden>
<div class="sample-row"><span class="lbl">Every chapter below runs on a stream of events:</span>
  <button data-sample="orders">Orders (CSV)</button><button data-sample="clicks">Clickstream (JSONL)</button><button data-sample="sensors">Sensors (CSV)</button>
  <span class="note" id="statLine" style="margin:0"></span></div>
<details class="mydata"><summary>Use your own events and pick the key</summary>
  <div class="bar"><input type="file" id="file" accept=".csv,.json,.jsonl,.ndjson"><label>Format <select id="fmt"><option value="auto">auto-detect</option><option value="csv">CSV</option><option value="jsonl">JSONL</option><option value="json">JSON array</option></select></label></div>
  <textarea id="src" rows="5" spellcheck="false"></textarea>
  <div class="note" id="srcInfo"></div>
  <div class="jobgrid">
    <span>Record key <select id="kcol"></select></span>
    <label>Workload <select id="mix"><option value="updates">updates + deletes (tombstones)</option><option value="plain">plain appends</option><option value="hot">hot key (40% one key)</option></select></label>
    <label>Partitions <select id="pn"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label>
    <label>Segment size <select id="seg"><option value="3">3 records</option><option value="5" selected>5 records</option><option value="8">8 records</option></select></label>
    <span class="note" style="margin:0">3 brokers · replication factor 3 · virtual clock (1 record = 10 ms)</span>
  </div>
</details>
</div>
<script src="../../assets/lab.js"></script>
<script>
const STORY={
 system:'Kafka',
 kicker:'Rebuild it from first principles',
 title:'Build <span>Kafka</span> from scratch',
 lead:'Start from a real production problem and watch the obvious fix break. Then rebuild the design from one idea, <b>the append-only log</b>, applied seven times, running on your own events.',
 problem:{
  scene:[
   'You run the <b>event backbone</b> of a marketplace. The orders service emits <code>created → paid → shipped</code> events, <b>50,000 per second</b> at peak, and twelve teams consume them: search indexing, emails, fraud, warehouse, analytics.',
   'Product says: <i>"Every team must get every order event, in order, even when a machine dies. And the new fraud team wants to replay last week."</i> Your job is to design the system in the middle.'],
  musts:[
   '<b>Never lose an acknowledged event</b>, even if a broker dies a millisecond after saying OK.',
   '<b>Per-order ordering:</b> no team ever sees <code>paid</code> before <code>created</code>.',
   '<b>Many independent readers:</b> each team reads at its own pace, and a new team can replay history.',
   '<b>Scales out:</b> more traffic means more machines, and a slow reader never slows down the writers.',
   '<b>No duplicates from retries</b>, and disk usage that stays bounded.'],
  naive:{title:'Your first instinct: an events table in PostgreSQL',text:'Producers <code>INSERT</code> each event, every team polls <code>WHERE id &gt; :last_seen</code>, and a nightly job deletes old rows. It works on day one, then:',
   breaks:['Every insert updates indexes and the WAL on <b>one primary</b>: write throughput hits a ceiling you can only raise by buying a bigger machine.','Twelve teams polling the same table compete with the order path for the same CPU and disk; one slow analytics scan hurts checkout.','Ids are handed out at insert time but transactions commit later and out of order, so a reader at <code>id 1005</code> can <b>silently skip</b> row 1003 that commits a moment later.','Bulk deletes cause bloat and vacuum storms, and a team that wants last week back finds it gone.']},
  quest:'Follow one record through 7 chapters: <b>log → produce → replicate → consume → clean up → transact → coordinate</b>. Each chapter starts from a problem, tries the naive fix, watches it fail, states the <b>principle</b> you would rebuild from, then runs the real design on your events.'},
 overview:{title:'Kafka at a glance',lead:'Producers write to a cluster of brokers; consumers read from it. Press <b>Trace a request</b> to follow one record, or <b>tap a component to open it</b> and see what is inside. Inside, tap a part to read what it does and jump to its chapter.'},
 chapters:[
  /* ---------- 1 · the log ---------- */
  {ask:'Where do we put 50,000 events per second so any reader can resume from any point?',
   why:'Readers need a stable position to resume from after a crash, reads from an old position must not scan everything before it, and a crash mid-write must not corrupt what was already stored.',
   v0:{name:'Append JSON lines to one big file',code:'file.append(json(event) + "\\n")\nread(n) = scan lines from the start until line n',breaks:'Reading position <i>n</i> scans <b>everything before it</b>, deleting old data means rewriting the whole file, and a crash mid-write leaves a <b>half line</b> that readers misparse or choke on.'},
   principle:'<b>Never modify, only append.</b> A record\'s <b>offset</b> is its permanent address. Immutability is what makes everything else cheap: closed files can be cached, copied and deleted whole, and after a crash only the tail of the last file can be wrong.',
   design:'Cut the log into <b>segment files</b> named by their first offset, keep a <b>sparse index</b> per segment, and frame every record with a length and a checksum so the end of the valid data is always detectable.',
   predict:{q:'The broker is killed halfway through appending a record, so the active segment ends with half a record. What does the restart do?',opts:['Keeps the half record and lets consumers skip the broken bytes','Refuses to start until an operator repairs the file by hand','Scans the active segment, keeps every complete record and truncates the torn tail'],ans:2,why:'Closed segments are immutable, so only the active tail can be bad. Recovery validates each frame (length, then checksum) and truncates at the first invalid one; the next append continues right after the last valid record. Open the <i>Crash &amp; recover</i> tab and try <i>corrupted record</i> too: everything after the bad frame is cut, even valid-looking records.'},
   build:{intro:'Simplified here: segments roll every few records and every 2nd record is indexed. Kafka rolls by bytes or time (<code>log.segment.bytes</code>, <code>log.roll.ms</code>) and adds an index entry about every 4 KB.',
    steps:['<b>Record frame:</b> <code>[length][checksum][offset, key, value, timestamp]</code>, so a reader can tell a complete record from garbage.','<b>Append:</b> write to the active segment and assign <code>offset = logEndOffset++</code>; roll to a new file <code>{baseOffset}.log</code> when it is full.','<b>Sparse index:</b> every N bytes store <code>(offset, filePosition)</code>. Fetch = binary-search the segment by base offset, then the index, then scan a few records.','<b>Recovery:</b> on restart scan only the active segment, validate each frame, truncate at the first bad one, rebuild its index.'],
    code:'append(rec): frame = len(rec) + crc(rec) + rec\n  active.write(frame); index.maybeAdd(offset, pos); offset++\n  if active.size > SEGMENT_BYTES: roll()\nfetch(off): seg = floorSegment(off); pos = seg.index.floor(off)\n  scan seg from pos until record.offset == off\nrecover(): for frame in active: if !valid(frame): truncate(here); break',
    rule:'An offset, once acknowledged, always means the same record; recovery may only cut the <b>unvalidated tail</b> of the active segment.'}},
  /* ---------- 2 · produce ---------- */
  {ask:'One log cannot take 50,000 events/s. How do clients spread the writes, keep each order in order, and survive retries?',
   why:'A single log is one leader on one disk. Splitting it must not break <code>created → paid → shipped</code> for one order, a request per record would drown the broker, and a timeout is ambiguous: a blind retry may write the payment twice.',
   v0:{name:'Round-robin every record, one request each, retry on timeout',code:'p = counter++ % numPartitions\ntry: logs[p].produce([record])\ncatch Timeout: logs[p].produce([record])',breaks:'Order 900\'s <code>created</code> and <code>paid</code> land in different partitions and are read out of order. One request per record caps a connection near 1,000 records/s. And if the first attempt did land, the retry writes the batch <b>twice</b>.'},
   principle:'<b>Put the cleverness on the client and keep the broker a dumb, fast appender.</b> The client picks the partition (<code>hash(key)</code>), amortises request cost over many records (batches), and makes its own retries recognisable (producer ID + sequence numbers).',
   design:'Three decisions, all made before the bytes leave the producer: <b>route</b> equal keys to one partition (order is kept per key, not globally), <b>batch</b> by size and time inside a bounded buffer (overload becomes back-pressure, not a crash), and <b>number</b> every batch so the leader can tell a retry from new data.',
   predict:{q:'Your topic grows from 3 to 4 partitions. What happens to the keys that already have records?',opts:['Many keys now hash to a different partition; their old records stay where they are, so per-key order across the change breaks','Kafka moves the existing records too, so every key still lives in one partition','Only brand-new keys are affected; existing keys keep their old partition'],ans:0,why:'The partitioner is just <code>hash(key) % N</code>. Change N and most keys map elsewhere, while existing records never move. The red chips on the <i>Route by key</i> tab count how many of your keys would move. Size the partition count up front.'},
   build:{intro:'Kafka hashes key bytes with murmur2 (this playground uses FNV) and sends one ProduceRequest per broker carrying batches for many partitions. The idempotent producer is the default since Kafka 3.0.',
    steps:['<b>Route:</b> <code>partition = hash(keyBytes) % numPartitions</code> computed by the client; keyless records fill one partition\'s batch, then switch (sticky). Measure skew: a hot key keeps one partition hot.','<b>Accumulate:</b> one open batch per partition; <code>send()</code> only appends and returns a future. Close a batch at <code>batch.size</code> or after <code>linger.ms</code>; compress the whole batch.','<b>Bound memory:</b> count buffered bytes; when full, block <code>send()</code> up to <code>max.block.ms</code>, then fail.','<b>Number batches:</b> <code>InitProducerId</code> gives a PID + epoch; each batch carries <code>(PID, epoch, firstSeq)</code>. The leader keeps the last sequences per <code>(PID, partition)</code>: next = append, seen = return the old offsets, gap = reject.','Rebuild that producer state from the batch headers in the log, so a new leader after failover has it too.'],
    code:'send(rec): waitUntil(buffered + size(rec) <= BUFFER_MEMORY)\n  p = hash(rec.key) % N; b = open[p]; b.add(rec)\n  if b.bytes >= BATCH_SIZE or age(b) >= LINGER_MS: close(b)\nsender: req = compress(b); req.seq = nextSeq[p]; await broker.produce(req)\nleader.onProduce(pid, epoch, seq):\n  if epoch < s.epoch: reject FENCED\n  if seq <= s.lastSeq: return oldOffsets(seq)   // duplicate\n  if seq != s.lastSeq + 1: reject OUT_OF_ORDER\n  append(batch); s.lastSeq = seq + count - 1',
    rule:'Equal keys map to <b>one partition</b>, buffered bytes never exceed <code>buffer.memory</code>, and for one producer ID and partition each sequence is <b>appended at most once, in order</b>.'}},
  /* ---------- 3 · replicate ---------- */
  {ask:'A broker dies right after saying OK. Are the acknowledged events gone?',
   why:'With one copy, yes. With copies, two questions remain: when may the leader say OK, and which copy may take over? And later, how do we put a copy on a brand-new machine without stopping anything?',
   v0:{name:'Leader acks after its own write, copies in the background',code:'leader.append(batch)\nreply(OK)                  // acks=1\nfollowers copy later',breaks:'The leader can crash <b>after</b> the OK but before any follower copied the record. A follower takes over without it: an <b>acknowledged event is lost</b>.'},
   principle:'<b>Replicate the log, not the state.</b> A follower is just a consumer of the leader\'s log. A record is <b>committed</b> once every in-sync replica has it, and only an in-sync replica may become leader, so nothing committed can be lost. Moving a partition is the same trick: add one more follower, switch when it has caught up.',
   design:'Track the <b>ISR</b> (replicas that keep up). The <b>high watermark</b> is the smallest log end in the ISR: consumers read only below it and <code>acks=all</code> answers when the watermark passes the record.',
   predict:{q:'acks=all, min.insync.replicas=2. The leader dies partway through the stream. How many acknowledged records are lost?',opts:['Only the ones the slow follower had not fetched yet','Every record since the last flush to disk','None: an ack meant every in-sync replica already had the record'],ans:2,why:'The new leader is chosen from the ISR, and every ISR member holds everything below the high watermark. Now switch <i>acks</i> to 1 and play again: records acked before any follower copied them turn red.'},
   build:{intro:'Simplified here: the ISR is decided by how far a follower lags. Kafka uses time (<code>replica.lag.time.max.ms</code>), and the controller (chapter 7) picks the new leader.',
    steps:['Followers send <b>Fetch</b>(their log end offset) to the leader, like consumers.','The leader tracks each follower\'s log end and the <b>ISR</b>; a follower that falls too far behind leaves it.','<b>High watermark</b> = min log end over the ISR. Consumers read only below it.','<code>acks=all</code>: reply once HW &gt; offset; reject if ISR size &lt; <code>min.insync.replicas</code>.','On leader failure elect an <b>ISR member</b>, bump the leader epoch; the old leader truncates its divergent tail when it returns.','<b>Move a replica:</b> add the target as a throttled follower, wait until it joins the ISR, publish the new placement (epoch bump), then remove the old replica.'],
    code:'leader.onFetch(f, fetchOffset): leo[f] = fetchOffset\n  isr = { r : leo[leader] - leo[r] small enough }\n  hw = min(leo[r] for r in isr)\nproduce(acks=all): if |isr| < MIN_ISR: reject NOT_ENOUGH_REPLICAS\n  append; wait until hw > offset; reply OK\nfailover: newLeader = isr member; epoch++\nreassign(p, target): replicas = old ∪ target; wait target ⊆ isr\n  metadata.commit(p, target, epoch+1); delete(old − target)',
    rule:'Only an in-sync replica can become leader, so <b>every record below the high watermark survives</b> a failover; at every moment exactly <b>one placement is authoritative</b>.'}},
  /* ---------- 4 · consume ---------- */
  {ask:'Twelve teams read the same events at their own pace. How does each remember where it stopped, and share the work?',
   why:'Each team must see every event, be able to crash and resume, and spread its work over several machines without two of them processing the same partition.',
   v0:{name:'A work queue that deletes a message once it is acked',code:'msg = queue.take()\nprocess(msg); queue.ack(msg)   // broker deletes it',breaks:'The search indexer acks, the event is gone, and the email service <b>never sees it</b>. Replaying last week after a bug fix is impossible.'},
   principle:'<b>Readers own their position; the broker keeps no per-message state.</b> A reader\'s whole state is <b>one number per partition</b> (stored in a log of its own), and who reads which partition is a <b>lease with a generation number</b> that fences stale owners.',
   design:'Do not delete on read: the log stays, any number of groups read it independently, and a <b>group coordinator</b> hands out partitions and bumps a generation whenever membership changes.',
   predict:{q:'A member processes records, then commits its offset every 4 records. It crashes between processing and the next commit. After the restart?',opts:['The records after the last commit are skipped','The records after the last commit are processed again (duplicates)','Kafka notices and delivers each record exactly once'],ans:1,why:'A restart resumes at the committed offset, so everything processed after it is redone: <b>at-least-once</b>. Commit <i>before</i> processing and you get skips instead (at-most-once). Move <i>Crash at</i> to change how many.'},
   build:{intro:'Simplified here: auto-commit fires every 5 records; Kafka\'s <code>enable.auto.commit</code> commits on a timer (every 5 s by default).',
    steps:['Members <b>join</b> the group; the coordinator bumps the <b>generation</b> and an assignor splits partitions among them.','Each member <code>poll()</code>s its partitions from its current position.','<b>Commit</b> <code>(group, partition) → offset</code> into an internal compacted topic (<code>__consumer_offsets</code>).','On join, leave or a missed heartbeat: <b>rebalance</b>. Cooperative mode revokes only the partitions that move.','Reject commits that carry an <b>older generation</b>.'],
    code:'loop:\n  records = poll(myPartitions, position)\n  process(records)                     // side effects\n  commit(group, generation, position)  // after: at-least-once\non rebalance(gen): revoke(moved); assign(new); generation = gen\ncoordinator.commit(gen, ...): if gen < current: reject ILLEGAL_GENERATION',
    rule:'Within a group each partition has <b>one owner per generation</b>, and a commit from an older generation is rejected.'}},
  /* ---------- 5 · log lifecycle ---------- */
  {ask:'Disks fill up within days. What do we delete, and what if we only need the latest value per key?',
   why:'50,000 events/s at 1 KB each is about <b>4 TB per day</b> per replica. Something must go, a stuck consumer must not be able to stop that, and a changelog of 40 million customers must stay replayable forever without keeping every old version.',
   v0:{name:'Delete a record once every group has read it',code:'deleteBelow(min(committedOffset of every group))',breaks:'One abandoned or stuck consumer group <b>pins the disk forever</b> and the broker fills up. Deleting single records also means rewriting files. And plain time-based retention makes a customer who has not changed in 8 days <b>disappear</b>.'},
   principle:'<b>Cleanup is a background rewrite of closed segments, driven by policy, never by readers.</b> Retention drops whole old files (by time or size); compaction rewrites them keeping the latest value per key. Offsets are never renumbered, and deletes are just records (tombstones).',
   design:'Two cleaners over the same segments: <b>delete</b> old files on a clock, or <b>compact</b> to the latest value per key. A reader that fell behind is told (<code>OFFSET_OUT_OF_RANGE</code>) instead of being waited for; tiered storage moves verified old segments to cheap storage.',
   predict:{q:'Retention deletes segments older than 30 s. A group is stuck at an old committed offset it never read past. What happens?',opts:['The segments are deleted anyway; the group\'s next fetch gets OFFSET_OUT_OF_RANGE','Kafka keeps the segments: data a group has not read is never deleted','The broker quietly moves the group\'s committed offset to the log start'],ans:0,why:'Consumer offsets never pin data. The broker answers with an error and the valid range; the consumer client then applies <code>auto.offset.reset</code> (earliest or latest). Tiered storage does not change this: <code>retention.ms</code> still bounds the whole log, local plus remote. It makes a long retention <i>affordable</i>.'},
   build:{steps:['Track the <b>log start offset</b> (first retained record) next to the log end offset.','<b>Retention:</b> a background task deletes the oldest <b>closed</b> segment while it is older than <code>retention.ms</code> or the log exceeds <code>retention.bytes</code>; never the active one. A fetch below the log start returns <b>OFFSET_OUT_OF_RANGE</b>.','<b>Tiered:</b> upload a closed segment, verify it, publish it in a remote manifest, and only then let the local copy expire (<code>local.retention.ms</code>).','<b>Compaction, pass 1:</b> build a map <code>key → latest offset</code> over the dirty closed segments.','<b>Pass 2:</b> copy each record whose offset is the latest for its key, <b>keeping its original offset</b>; drop tombstones older than <code>delete.retention.ms</code>; swap the new segments in atomically.'],
    code:'every minute:\n  while segments.length > 1 && (age(oldest) > RETENTION_MS || bytes > RETENTION_BYTES):\n    if tiered && !remote.has(oldest): upload(oldest); verify; manifest.add(oldest)\n    deleteLocal(oldest); logStart = segments[0].baseOffset\nfetch(off): if off < logStart: error(OFFSET_OUT_OF_RANGE, [logStart, logEnd))\ncompact(closed):\n  latest = {r.key: r.offset for r in closed}\n  out = [r for r in closed if latest[r.key]==r.offset and !(r.value==null and age(r)>DELETE_RETENTION)]\n  swapAtomically(closed, out)   // offsets unchanged',
    rule:'The log start offset only moves forward and an offset below it <b>fails loudly</b>; replaying a compacted log gives the <b>same final value per key</b> as the full history.'}},
  /* ---------- 6 · transactions ---------- */
  {ask:'A job reads orders, writes invoices, then commits its offset. A crash in between: duplicate invoices?',
   why:'The output write and the offset commit are two separate writes. A crash between them means redoing work (duplicates) or skipping it.',
   v0:{name:'Write the outputs, then commit the input offset',code:'for o in transform(records): produce(o)\ncommitOffset(lastInput + 1)',breaks:'Crash after the outputs but before the commit: the restart reprocesses the input and writes every invoice <b>again</b>.'},
   principle:'<b>Atomicity is a marker in the same log.</b> Write the data now, decide its visibility later with a COMMIT or ABORT control record. Treat the consumer offset as just another output, so one atomic commit covers the results and the progress; readers simply stop at the <b>last stable offset</b>.',
   design:'A <b>transaction coordinator</b> maps <code>transactional.id</code> to a producer ID and epoch (fencing zombies), tracks which partitions were written, and writes the markers. <code>read_committed</code> consumers filter on them.',
   predict:{q:'Transactions on. The job crashes after writing all 3 outputs, before committing. What does a read_committed reader see after the restart?',opts:['Each output twice: once from the crashed attempt, once from the redo','Each output exactly once: the open transaction is aborted and the work redone','Nothing: the outputs of a crashed job are lost'],ans:1,why:'The crashed attempt is aborted, its records stay in the log but are hidden behind an ABORT marker, and the redo commits once. Now untick <i>transactional</i> and crash after step 3 (the last output) to get 3 duplicates.'},
   build:{intro:'This covers Kafka to Kafka only. A database or email sink outside Kafka still needs its own idempotency.',
    steps:['<code>initTransactions()</code>: the coordinator maps <code>transactional.id</code> to a PID and bumps the epoch, fencing any zombie with the same id.','<code>beginTransaction()</code>, produce the outputs; each new partition is registered with the coordinator.','<code>sendOffsetsToTransaction()</code> adds the consumed offsets to the same transaction.','<b>Commit:</b> the coordinator logs PREPARE, writes COMMIT markers to every partition, then logs COMPLETE.','Consumers with <code>read_committed</code> stop at the last stable offset and skip aborted records.'],
    code:'initTransactions()            // fences older epochs\nloop:\n  recs = poll(); beginTransaction()\n  for o in transform(recs): produce(o)\n  sendOffsetsToTransaction(positions, group)\n  commitTransaction()         // markers on every partition\n  on error: abortTransaction()',
    rule:'Outputs and the input offset become visible <b>together or not at all</b>.'}},
  /* ---------- 7 · control plane ---------- */
  {ask:'Who decides which broker leads each partition, and what if that decider dies?',
   why:'Every failover from chapter 3 needs one authority. Two deciders that disagree means two leaders for one partition, and diverging data.',
   v0:{name:'One controller process',code:'controller.electLeader(p)\ncontroller.broadcast(metadata)',breaks:'It dies: nobody elects new partition leaders, so partitions whose leader also died stay <b>offline</b>. Add a hot standby and a network split can leave <b>two active controllers</b>.'},
   principle:'<b>Metadata is also a log.</b> Apply the same idea to the controller itself: a small quorum keeps a replicated metadata log that only advances with a <b>majority</b>, and an <b>epoch</b> on every message fences the stale, so there can never be two authorities.',
   design:'A few controller nodes (KRaft) elect one active controller per epoch. Topic, placement, leader and ISR changes are entries in the metadata log; brokers apply only committed entries and reject older epochs.',
   predict:{q:'Scenario 4: the active controller is cut off in the minority and a client sends it a MoveReplica. What happens?',opts:['It commits: that controller is still active for its epoch','Both sides commit, and the newest timestamp wins when the network heals','It is appended but never commits; the majority elects a new controller, and the entry is truncated on heal'],ans:2,why:'Committing needs a majority, which the cut-off side does not have. The majority side elects a new active controller with a higher epoch and keeps committing; on heal the old one steps down and drops its uncommitted entry.'},
   build:{intro:'Simplified here: classic Raft where the leader pushes AppendEntries. In KRaft followers <b>fetch</b> from the leader instead, but the vote and commit rules are the same.',
    steps:['Persist <code>(epoch, votedFor, log)</code> before answering anyone.','A follower that hears nothing until its election timeout becomes a candidate: <code>epoch++</code>, ask for votes.','Grant a vote only to a candidate whose log is <b>at least as up to date</b> as yours.','The leader replicates entries; one is <b>committed</b> once a majority stores it (in the current epoch).','Brokers apply only committed metadata, and reject requests carrying an older controller epoch.'],
    code:'onTimeout(): epoch++; vote(self); requestVotes(lastIndex, lastEpoch)\nvote(c): grant if c.epoch >= epoch and c.log at least as new as mine\nleader: replicate(entries); match[f] = ack index\ncommit = max i where majority(match >= i) and log[i].epoch == epoch\nbrokers: apply(log[..commit]) in order',
    rule:'A committed metadata change exists on a majority, so <b>every future active controller has it</b>.'}}
 ]
};
</script>
<script src="./kafka-incidents.js"></script>
<script>
Lab.mount(STORY);
initIncidents(document.getElementById("chTrade"));
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const J=x=>{try{return JSON.stringify(x)}catch{return String(x)}};
const pc=i=>`var(--p${((i%8)+8)%8})`,tc=i=>`var(--t${((i%8)+8)%8})`;
const cmp=(a,b)=>a<b?-1:a>b?1:0;
const short=(s,n=40)=>{s=String(s);return s.length>n?s.slice(0,n-1)+'…':s};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function lcg(seed){let s=(seed>>>0)||1;return()=>{s=(Math.imul(s,1103515245)+12345)&0x7fffffff;return s/0x7fffffff}}
function fnvStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
const hex=(n,w)=>n.toString(16).padStart(w,'0');
const bn=i=>'b'+i;

/* ================= parsing + samples ================= */
function detect(t){const s=t.trim();if(s.startsWith('['))return'json';const l=s.split(/\r?\n/)[0]||'';if(l.startsWith('{'))return'jsonl';if(l.includes(','))return'csv';return'text'}
function csvSplit(l){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){o.push(c);c=''}else c+=ch}o.push(c);return o}
const conv=v=>(typeof v==='string'&&/^-?\d+(\.\d+)?$/.test(v.trim()))?Number(v):v;
function colsOf(rows){const c=[];rows.forEach(r=>Object.keys(r).forEach(k=>{if(!c.includes(k))c.push(k)}));return c}
function parseWhole(text,pf){
  if(pf==='json'){const a=JSON.parse(text);if(!Array.isArray(a))throw new Error('JSON must be an array');return{rows:a,columns:colsOf(a)}}
  const lines=text.split(/\r?\n/).filter(l=>l.trim()!=='');
  if(pf==='jsonl'){const rows=lines.map(l=>JSON.parse(l));return{rows,columns:colsOf(rows)}}
  if(pf==='csv'){if(!lines.length)return{rows:[],columns:[]};const h=csvSplit(lines[0]);const rows=lines.slice(1).map(l=>{const v=csvSplit(l),o={};h.forEach((k,i)=>o[k]=conv(v[i]??''));return o});return{rows,columns:h}}
  return{rows:lines.map(l=>({line:l})),columns:['line']};
}
function sampleOrders(){const st=['new','paid','shipped'],r=lcg(11),L=['customer,order_id,status,amount'];for(let i=0;i<30;i++)L.push([`C${101+((i*5)%7)}`,`O-${900+i}`,st[Math.floor(r()*3)],Math.round(20+r()*480)].join(','));return L.join('\n')}
function sampleClicks(){const pg=['/home','/cart','/pay','/help'],r=lcg(5),L=[];for(let i=0;i<30;i++)L.push(J({user:'u'+(1+Math.floor(r()*6)),page:pg[Math.floor(r()*4)],ms:Math.round(20+r()*300)}));return L.join('\n')}
function sampleSensors(){const r=lcg(7),L=['device,ts,temp'];for(let i=0;i<30;i++)L.push([`D${1+(i%5)}`,1000+i*10,Math.round(180+r()*80)/10].join(','));return L.join('\n')}
const SAMPLES={orders:{t:sampleOrders,f:'csv'},clicks:{t:sampleClicks,f:'jsonl'},sensors:{t:sampleSensors,f:'csv'}};

/* ================= config + records ================= */
const OPT={lp:0,fetchOff:0,crash:'torn',rate:1,batch:2048,linger:20,comp:'none',mem:4096,policy:'block',slow:1,members:2,commit:'after',crashPct:60,rebal:'cooperative',rev:'join',
  rpol:'time',rlim:30,tier:false,localRet:12,cOff:5,racks:'all',minIsr:2,slowF:200,failPct:60,idem:true,ccrash:4,txn:true,ctgt:2,cdel:25,cdelRet:15,cOffset:0,
  bk:4,thr:3,roll:true,mcrash:0,raftN:3,raftScen:'partition',rp:0};
function cfg(){return{text:$('#src').value,fmt:$('#fmt').value,kcol:$('#kcol').value,mix:$('#mix').value,P:+$('#pn').value,seg:+$('#seg').value}}
function mkRecords(c,rows){
  const rnd=lcg(rows.length*7+1),ev=rows.map((r,i)=>({r,at:i*3,kind:'put'}));
  if(c.mix==='updates'){rows.forEach((r,i)=>{if(i%3===1)ev.push({r:{...r,_v:2},at:i*3+8+Math.floor(rnd()*5),kind:'put'})});
    const seen=[],last={};rows.forEach(r=>{const k=String(r[c.kcol]);if(!seen.includes(k))seen.push(k);last[k]=r});
    seen.forEach((k,idx)=>{if(idx%3===1)ev.push({r:last[k],at:rows.length*3+20+idx,kind:'del'})})}
  ev.sort((a,b)=>a.at-b.at);const hot=String(rows[0][c.kcol]);
  return ev.map((e,i)=>{let key=String(e.r[c.kcol]);if(c.mix==='hot'&&(i*37)%100<40)key=hot;return{i,key,value:e.kind==='del'?null:J(e.r),ts:1000+i*10,t:i}});
}
const partOf=(key,P)=>fnvStr(key)%P;
const rbytes=r=>r.key.length+(r.value?r.value.length:0)+24;
function buildLogs(recs,P,segRecs){
  const logs=Array.from({length:P},(_,p)=>({p,recs:[],segs:[]}));
  recs.forEach(r=>{const L=logs[partOf(r.key,P)];L.recs.push({off:L.recs.length,key:r.key,value:r.value,ts:r.ts,t:r.t,i:r.i,bytes:rbytes(r)})});
  logs.forEach(L=>L.recs.forEach(x=>{let s=L.segs[L.segs.length-1];if(!s||s.recs.length>=segRecs){s={base:x.off,recs:[]};L.segs.push(s)}s.recs.push(x)}));
  return logs;
}
let S=null;
function build(){
  const c=cfg(),o={cfg:c};
  if(!c.text.trim()){o.error='No data yet.';return o}
  let ds;try{ds=parseWhole(c.text,c.fmt==='auto'?detect(c.text):c.fmt)}catch(e){o.error='Cannot parse input: '+e.message;return o}
  if(!ds.rows.length||!ds.columns.includes(c.kcol)){o.error='Choose a key column.';return o}
  if(ds.rows.length>300){o.error='Please keep the data under 300 rows.';return o}
  o.rows=ds.rows;o.columns=ds.columns;o.recs=mkRecords(c,ds.rows);o.logs=buildLogs(o.recs,c.P,c.seg);
  o.lp=clamp(OPT.lp,0,c.P-1);
  return o;
}

/* ================= player ================= */
let rsAnim=false;
const rcell=(r,cls='')=>`<span class="rc ${cls}" title="${esc(r.key)} → ${esc(r.value===null?'null (tombstone)':short(r.value,60))}">${r.off}${r.value===null?'✕':''}</span>`;
const lbl=k=>esc(short(k,10));

const CH={log:0,produce:1,repl:2,consume:3,life:4,txn:5,ctl:6};

/* =========================================================
   PHASE 1: PARTITION LOG, SEGMENTS, SPARSE INDEX, RECOVERY (F01)
   ========================================================= */
function frameOf(r){const p=`${r.off}|${r.key}|${r.ts}|${r.value===null?'∅':r.value}`;return hex(p.length,4)+hex(fnvStr(p),8)+p}
function parseFrames(buf){
  const out=[];let i=0,why='clean end';
  while(i<buf.length){
    if(i+12>buf.length){why='torn header';break}
    const len=parseInt(buf.slice(i,i+4),16),crc=parseInt(buf.slice(i+4,i+12),16);
    if(isNaN(len)||isNaN(crc)){why='garbage header';break}
    if(i+12+len>buf.length){why='torn payload';break}
    const p=buf.slice(i+12,i+12+len);if(fnvStr(p)!==crc){why='checksum mismatch';break}
    const[off,key,ts,...rest]=p.split('|');out.push({off:+off,key,ts:+ts,value:rest.join('|')==='∅'?null:rest.join('|')});i+=12+len;
  }
  return{recs:out,consumed:i,why};
}
const IDX=2;
function segIndex(seg){let pos=0;const ix=[];seg.recs.forEach((r,k)=>{if(k%IDX===0)ix.push({off:r.off,pos});pos+=frameOf(r).length});return ix}
function locate(L,off){
  let lo=0,hi=L.segs.length-1,steps=0,si=0;
  while(lo<=hi){const m=(lo+hi)>>1;steps++;if(L.segs[m].base<=off){si=m;lo=m+1}else hi=m-1}
  const seg=L.segs[si],ix=segIndex(seg);let e=ix[0];ix.forEach(x=>{if(x.off<=off)e=x});
  let scanned=0,found=null;for(const r of seg.recs){if(r.off<e.off)continue;scanned++;if(r.off===off){found=r;break}}
  return{si,seg,ix,entry:e,steps,scanned,found};
}
/* =========================================================
   SHARED VISUAL PRIMITIVES (stages, offset strips, bars)
   ========================================================= */
const NODATA='<div class="box">This partition is empty. Pick another one.</div>';
const keyCol=k=>`color-mix(in srgb,var(--t${fnvStr(String(k))%8}) 38%,var(--card))`;
const STG={};const stage=k=>STG[k]||0;
const STAGES={
  0:['Append & roll','Find an offset','Crash & recover'],
  1:['Route by key','Batch & compress','Retry safely'],
  2:['Replicate & ack','Move a replica'],
  3:['Position & commit','Share partitions'],
  4:['Retention & tiers','Compaction']
};
function stageTabs(k){const s=stage(k);return`<div class="stg" role="tablist" aria-label="Stages of this chapter">${STAGES[k].map((n,i)=>`<button role="tab" data-stage="${i}" aria-selected="${i===s}" class="${i===s?'act':''}"><i>${i+1}</i>${n}</button>`).join('')}</div>`}
const staged=(k,fns)=>p=>stageTabs(k)+fns[Math.min(stage(k),fns.length-1)](p);
/* a row of offset cells; marks = {cellIndex:[[label,tone],...]}; a mark at index == cells.length lands on a ghost cell (the "next" slot) */
function kstrip(cells,marks={},o={}){
  const n=cells.length,ghost=marks[n]?1:0,any=Object.keys(marks).length>0;
  const colH=(inner,i)=>`<div class="kcol">${any?`<div class="kfl">${(marks[i]||[]).map(([l,t])=>`<b class="kf ${t||''}">${esc(l)}</b>`).join('')}</div>`:''}${inner}</div>`;
  const cellH=c=>`<span class="kc ${c.c||''}"${c.col?` style="--kc:${c.col}"`:''}${c.title?` title="${esc(c.title)}"`:''}>${c.t==null?'':c.t}</span>`;
  return`<div class="kstrip ${o.cls||''}">${cells.map((c,i)=>colH(cellH(c),i)).join('')}${ghost?colH('<span class="kc ghost"></span>',n):''}</div>`;
}
function kbars(rows,max){
  const mx=max||Math.max(1e-9,...rows.map(r=>r.v));
  return`<div class="kbars">${rows.map(r=>`<div class="kb ${r.c||''}"><span>${r.l}</span><div class="kt"><i style="width:${Math.max(1.5,Math.min(100,r.v/mx*100)).toFixed(1)}%"></i></div><b>${r.t==null?r.v:r.t}</b></div>`).join('')}</div>`;
}
const kchips=(a)=>`<div class="kchips">${a.map(([t,c,col])=>`<span class="kchip ${c||''}"${col?` style="--kc:${col}"`:''}>${t}</span>`).join('')}</div>`;

/* =========================================================
   CHAPTER 1 · THE LOG   (stages: append & roll · find an offset · crash & recover)
   ========================================================= */
function log0(p){
  const L=S.logs[S.lp],n=L.recs.length;if(!n)return NODATA;
  const shown=p>=1?n:Math.min(n,Math.ceil(p/0.92*n)),segSz=S.cfg.seg;
  const vis=L.segs.filter(s=>s.base<shown);
  const boxes=vis.map((s,si)=>{
    const cells=s.recs.filter(r=>r.off<shown),last=si===vis.length-1,ix=segIndex({recs:cells}),ixo=new Set(ix.map(x=>x.off));
    const marks={};if(last&&!(cells.length>=segSz&&shown<n))marks[cells.length]=[['LEO '+shown,'leo']];
    return`<div class="seg ${last?'act':''}"><h5>${hex(s.base,8)}.log · ${last?'active (appending)':'closed · immutable'}</h5>${kstrip(cells.map(r=>({t:r.off,col:keyCol(r.key),c:ixo.has(r.off)?'idx':'',title:`offset ${r.off} · key ${r.key}`})),marks)}<div class="note" style="margin:2px 0 0">sparse index: ${ix.map(x=>`${x.off}→${x.pos} B`).join(' · ')||'–'}</div></div>`;
  });
  const lastSeg=vis[vis.length-1],full=lastSeg&&lastSeg.recs.filter(r=>r.off<shown).length>=segSz&&shown<n;
  if(full)boxes.push(`<div class="seg nxt"><h5>${hex(shown,8)}.log · segment rolls here</h5>${kstrip([],{0:[['LEO '+shown,'leo']]})}</div>`);
  const lr=shown?L.recs[shown-1]:null,fr=lr?frameOf(lr):null;

  const acked=sim.acks.filter(a=>a.status==='acked'&&a.ackT<=T).length,rej=sim.acks.filter(a=>a.status==='rejected'&&a.t<=T).length;

  return`<div class="caption">acks=<b>${o.racks}</b>${o.racks==='all'?`, min.insync.replicas=<b>${o.minIsr}</b>`:''} · ISR {${isr.map(bn).join(',')}} · <b>HW ${hw}</b>: consumers read only <i>left</i> of the green HW flag · acked ${acked} · rejected ${rej}</div>

  <div class="caption ${out?'bad':'good'}">Fetch at committed offset <b>${c}</b> → <b>${where}</b>${out?`: the broker answers <b>OFFSET_OUT_OF_RANGE</b> with the valid range [${logStart}, ${n}). It never moves the consumer's offset; the client's <code>auto.offset.reset</code> decides what happens next.`:''}${where.startsWith('REMOTE')?': found in the remote manifest, read at higher latency, same offsets.':''}</div>

}

   <div class="caption">Fetch of removed offset ${rm===null?'–':rm} returns the next survivor, offset <b>${rm===null?'–':nextAfter(rm)}</b>; a removed offset is never reused.</div></div>
  <div><div class="caption ${m.diff.length?'bad':'good'}">A consumer that had read offsets 0–${m.c-1} and resumes <i>after</i> compaction ends with ${m.diff.length?'<b class="bad">'+m.diff.length+' wrong key(s)</b>: its tombstone was purged before it arrived (<code>delete.retention.ms</code> too short).':'<b class="ok">the correct state</b>.'}</div></div></div>

  <div class="caption ${m.dups||m.missing?'bad':'good'}" style="${crashed&&phase===0?'visibility:hidden':''}">${m.dups?`<b>${m.dups} duplicate output record(s)</b>: the input offset was not committed with the output, so the work was redone.`:m.missing?`<b>${m.missing} record(s) never produced.</b>`:'<b>Exactly-once result:</b> every input record produced exactly one committed output.'}</div>
  <details class="adv"><summary>Crash matrix: every crash point, with and without transactions</summary><div class="g2"><div><b style="font-size:12px">without transactions</b>${mk(false)}</div><div><b style="font-size:12px">with transactions</b>${mk(true)}</div></div></details>
  <div class="note">The output is written <i>now</i> but made visible <i>later</i>: a COMMIT or ABORT marker in the same log closes the transaction, and <code>read_committed</code> consumers read only up to the <b>last stable offset</b> (before the first still-open record). The consumed offset travels in the same transaction, so output and progress become visible together. Kafka→Kafka only; an external database still needs its own idempotency.</div>`;
}

  {id:'controller',x:255,y:272,w:225,h:75,label:'Controller quorum',sub:'KRaft metadata log',phase:6,

    groups:[{x:0,y:10,w:740,h:310,label:'Controller quorum (KRaft)'}],
    nodes:[

     {id:'f2',x:290,y:225,w:190,h:70,label:'Standby C2',sub:'fetches the log',phase:6,desc:'Same role as C1. Three controllers survive one failure; five survive two.'},
