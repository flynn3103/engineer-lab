<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafka Internals End-to-End</title>
<link rel="stylesheet" href="../../assets/lab.css">
<style>
:root{--acc:#231f20;--acc2:#2f6fed}
@media(prefers-color-scheme:dark){:root{--acc:#e8ecf3;--acc2:#6c9bff}}
@media(max-width:820px){.g2{grid-template-columns:1fr}}
.rc{display:inline-block;min-width:30px;text-align:center;font-family:ui-monospace,monospace;font-size:10.5px;border:1.5px solid var(--line);border-radius:4px;padding:1px 3px;margin:1px;background:var(--card);vertical-align:top}
.rc.gone{opacity:.3;text-decoration:line-through}.rc.del{border-color:var(--bad)}.rc.hl{border-color:var(--t1);background:color-mix(in srgb,var(--t1) 20%,var(--card))}
.rc.dup{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}.rc.ok{border-color:var(--ok)}.rc.ab{opacity:.45;border-style:dashed}.rc.mk{border-color:var(--t3);background:color-mix(in srgb,var(--t3) 20%,var(--card))}
.seg{display:inline-block;border:2px solid var(--line);border-radius:8px;padding:4px 6px;margin:3px;vertical-align:top;background:var(--card)}
.seg.act{border-color:var(--t1)}.seg.rem{border-style:dashed;border-color:var(--t3)}.seg.del{opacity:.25;border-style:dotted}
.seg h5{margin:0 0 3px;font-size:10.5px;color:var(--mut);font-weight:600}
.le{display:inline-block;min-width:34px;text-align:center;font-family:ui-monospace,monospace;font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:1px 4px;margin:1px}
.le.c{border:2px solid var(--ok);font-weight:700}
/* Kafka: --acc is near-black, so give the shared shell a readable brand colour */
:root{--brand:#cf4b14}
@media(prefers-color-scheme:dark){:root{--brand:#ff7a3d;--on-brand:#1a1206}}
/* phone-friendly views: text tables wrap, numbers do not; step rows wrap instead of being cut */
.view table{white-space:normal}
.view td.n,.view th.n{white-space:nowrap}
.view .row{white-space:normal;overflow:visible;text-overflow:clip}
.tlw{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.tlw>svg{min-width:560px}
.view table.pt{font-size:12px}.view table.pt td,.view table.pt th{padding:3px 5px}
.rbtns{display:flex;flex-wrap:wrap;gap:6px}
</style>
</head>
<body>
<div id="dataSlot" hidden>
<div class="sample-row"><span class="lbl">Every chapter below runs on a stream of events:</span>
  <button data-sample="orders">Orders (CSV)</button><button data-sample="clicks">Clickstream (JSONL)</button><button data-sample="sensors">Sensors (CSV)</button>
  <span class="note" id="statLine" style="margin:0"></span></div>
<details class="mydata"><summary>Use your own events and pick the key</summary>
  <div class="bar"><input type="file" id="file" accept=".csv,.json,.jsonl,.ndjson"><label>Format <select id="fmt"><option value="auto">auto-detect</option><option value="csv">CSV</option><option value="jsonl">JSONL</option><option value="json">JSON array</option></select></label></div>
  <textarea id="src" rows="5" spellcheck="false"></textarea>
  <div class="note" id="srcInfo"></div>
  <div class="jobgrid">
    <span>Record key <select id="kcol"></select></span>
    <label>Workload <select id="mix"><option value="updates">updates + deletes (tombstones)</option><option value="plain">plain appends</option><option value="hot">hot key (40% one key)</option></select></label>
    <label>Partitions <select id="pn"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label>
    <label>Segment size <select id="seg"><option value="3">3 records</option><option value="5" selected>5 records</option><option value="8">8 records</option></select></label>
    <span class="note" style="margin:0">3 brokers · replication factor 3 · virtual clock (1 record = 10 ms)</span>
  </div>
</details>
</div>
<script src="../../assets/lab.js"></script>
<script>
const STORY={
 system:'Kafka',
 title:'Build <span>Kafka</span> from scratch',
 lead:'Start from a real production problem. Watch the obvious fix break. Then see the design Kafka uses, running on your own events.',
 problem:{
  scene:[
   'You run the <b>event backbone</b> of a marketplace. The orders service emits <code>created → paid → shipped</code> events, <b>50,000 per second</b> at peak, and twelve teams consume them: search indexing, emails, fraud, warehouse, analytics.',
   'Product says: <i>"Every team must get every order event, in order, even when a machine dies. And the new fraud team wants to replay last week."</i> Your job is to design the system in the middle.'],
  musts:[
   '<b>Never lose an acknowledged event</b>, even if a broker dies a millisecond after saying OK.',
   '<b>Per-order ordering:</b> no team ever sees <code>paid</code> before <code>created</code>.',
   '<b>Many independent readers:</b> each team reads at its own pace, and a new team can replay history.',
   '<b>Scales out:</b> more traffic means more machines, and a slow reader never slows down the writers.',
   '<b>No duplicates from retries</b>, and disk usage that stays bounded.'],
  naive:{title:'Your first instinct: an events table in PostgreSQL',text:'Producers <code>INSERT</code> each event, every team polls <code>WHERE id &gt; :last_seen</code>, and a nightly job deletes old rows. It works on day one, then:',
   breaks:['Every insert updates indexes and the WAL on <b>one primary</b>: write throughput hits a ceiling you can only raise by buying a bigger machine.','Twelve teams polling the same table compete with the order path for the same CPU and disk; one slow analytics scan hurts checkout.','Ids are handed out at insert time but transactions commit later and out of order, so a reader at <code>id 1005</code> can <b>silently skip</b> row 1003 that commits a moment later.','Bulk deletes cause bloat and vacuum storms, and a team that wants last week back finds it gone.']},
  quest:'Rebuild the core of Kafka in 11 chapters. Each one starts from a problem, tries the naive fix, watches it fail, then runs the real design on your events.'},
 overview:{title:'The whole system on one page',lead:'Before the details, see how one event travels. Press <b>Trace a request</b> to follow a record from the producer to a consumer, or tap a component to see what it receives and sends. Colors match the chapters.'},
 chapters:[
  {ask:'Where do we store 50,000 events per second so any reader can resume from any point?',
   why:'Readers need a stable position to resume from after a crash, reads from an old position must not scan everything before it, and a crash mid-write must not corrupt what was already stored.',
   v0:{name:'Append JSON lines to one big file',code:'file.append(json(event) + "\\n")\nread(n) = scan lines from the start until line n',breaks:'Reading position <i>n</i> scans <b>everything before it</b>, deleting old data means rewriting the whole file, and a crash mid-write leaves a <b>half line</b> that readers misparse or choke on.'},
   design:'Never modify, only append: an offset becomes a permanent address, and immutable files make reads, deletes and crash recovery simple.',
   predict:{q:'The broker is killed halfway through appending a record, so the active segment ends with half a record. What does the restart do?',opts:['Keeps the half record and lets consumers skip the broken bytes','Refuses to start until an operator repairs the file by hand','Scans the active segment, keeps every complete record and truncates the torn tail'],ans:2,why:'Closed segments are immutable, so only the active tail can be bad. Recovery validates each frame (length, then checksum) and truncates at the first invalid one; the next append continues right after the last valid record. Try <i>corrupted record</i> too: everything after the bad frame is cut, even valid-looking records.'},
   build:{intro:'Simplified here: segments roll every few records and every 2nd record is indexed. Kafka rolls by bytes or time (<code>log.segment.bytes</code>, <code>log.roll.ms</code>) and adds an index entry about every 4 KB.',
    steps:['<b>Record frame:</b> <code>[length][checksum][offset, key, value, timestamp]</code>, so a reader can tell a complete record from garbage.','<b>Append:</b> write to the active segment and assign <code>offset = logEndOffset++</code>; roll to a new file <code>{baseOffset}.log</code> when it is full.','<b>Sparse index:</b> every N bytes store <code>(offset, filePosition)</code>. Fetch = binary-search the segment by base offset, then the index, then scan a few records.','<b>Recovery:</b> on restart scan only the active segment, validate each frame, truncate at the first bad one, rebuild its index.'],
    code:'append(rec): frame = len(rec) + crc(rec) + rec\n  active.write(frame); index.maybeAdd(offset, pos); offset++\n  if active.size > SEGMENT_BYTES: roll()\nfetch(off): seg = floorSegment(off); pos = seg.index.floor(off)\n  scan seg from pos until record.offset == off\nrecover(): for frame in active: if !valid(frame): truncate(here); break',
    rule:'An offset, once acknowledged, always means the same record; recovery may only cut the <b>unvalidated tail</b> of the active segment.'}},
  {ask:'One log cannot take 50,000 events/s. How do we split it and keep each order in order?',
   why:'A single log is one leader on one disk and one reader at a time. But <code>created</code>, <code>paid</code> and <code>shipped</code> for the same order must never be read out of order.',
   v0:{name:'Spread records round-robin over N logs',code:'p = counter++ % numPartitions\nlogs[p].append(record)',breaks:'Order 900\'s <code>created</code> lands in partition 0 and its <code>paid</code> in partition 1. The reader of partition 1 is faster, so the warehouse ships an order it has not seen created.'},
   design:'Nobody needs one global order, only order per order id, so give up the total order and keep it <b>per key</b>.',
   predict:{q:'Your topic grows from 3 to 4 partitions. What happens to the keys that already have records?',opts:['Many keys now hash to a different partition; their old records stay where they are, so per-key order across the change breaks','Kafka moves the existing records too, so every key still lives in one partition','Only brand-new keys are affected; existing keys keep their old partition'],ans:0,why:'The partitioner is just <code>hash(key) % N</code>. Change N and most keys map elsewhere, while existing records never move. The caption below counts how many of your keys would move. Size the partition count up front.'},
   build:{intro:'Kafka hashes the key bytes with murmur2; this playground uses FNV. Same idea: any stable hash that every client computes identically.',
    steps:['Producers send records with a <b>key</b> (for example the order id or customer id).','The client-side partitioner computes <code>hash(keyBytes) % numPartitions</code>; brokers do no routing.','Records <b>without a key</b> may go anywhere (Kafka fills one partition\'s batch, then switches) and carry no order guarantee.','Measure skew: one hot key keeps one partition hot no matter how many brokers you add.'],
    code:'partition(record):\n  if record.key == null: return stickyPartition()\n  return positive(murmur2(record.key)) % numPartitions\n// order is guaranteed per partition only',
    rule:'Equal keys map to <b>one partition</b> for as long as the partition count does not change.'}},
  {ask:'Sending every event as its own request is too slow. How do we send fewer, bigger requests?',
   why:'With 1 ms round trips, one request per record caps a connection near 1,000 records/s, and the broker drowns in tiny requests. Buffering helps, until a slow broker makes the buffer grow without limit.',
   v0:{name:'Send each record and wait for its ack',code:'for record in events:\n  await broker.produce([record])',breaks:'Throughput is bounded by round-trip time, not bandwidth. The obvious fix, an unbounded in-memory queue, turns one slow broker into an <b>OutOfMemoryError</b> in every producer.'},
   design:'Spread the per-request cost over many records, and make the buffer <b>finite</b> so overload turns into back-pressure instead of a crash.',
   predict:{q:'On this stream (a record every 10 ms) you raise <code>linger.ms</code> from 0 to 100 and <code>batch.size</code> to 8192. What happens?',opts:['Both the request count and the average latency go down','Far fewer requests, but each record waits longer, so average latency goes up','Nothing changes: linger only matters when the buffer is full'],ans:1,why:'Linger trades latency for batch size: records wait for the batch to fill or the timer to fire. Compare the <i>no batching</i> and <i>large batch</i> rows. (Under heavy load the trade can flip: fewer requests means less queueing.)'},
   build:{intro:'Simplified here: one request per batch and a toy LZ77 codec. Real Kafka sends one ProduceRequest per broker carrying batches for many partitions, with gzip, snappy, lz4 or zstd.',
    steps:['<b>Accumulator:</b> one open batch per partition; <code>send()</code> only appends to it and returns a future.','<b>Close a batch</b> when it reaches <code>batch.size</code> or when <code>linger.ms</code> has passed since its first record.','A <b>sender thread</b> ships closed batches, optionally compressed as a whole, and completes the futures when acks arrive.','<b>Bound memory:</b> count buffered bytes; when full, block <code>send()</code> up to <code>max.block.ms</code>, then fail.'],
    code:'send(rec): waitUntil(buffered + size(rec) <= BUFFER_MEMORY)   // or fail\n  b = open[partition(rec)]; b.add(rec); buffered += size(rec)\n  if b.bytes >= BATCH_SIZE: close(b)\nsenderLoop: close batches older than LINGER_MS\n  for b in closed: req = compress(b); await broker.produce(req)\n  buffered -= b.bytes; complete(b.futures)',
    rule:'Buffered bytes never exceed <code>buffer.memory</code>: a slow broker <b>slows the producer down</b>, it never crashes it.'}},
  {ask:'Twelve teams read the same events at their own pace. How does each remember where it stopped?',
   why:'Each team must see every event, be able to crash and resume, and spread its work over several machines without two of them processing the same partition.',
   v0:{name:'A work queue that deletes a message once it is acked',code:'msg = queue.take()\nprocess(msg); queue.ack(msg)   // broker deletes it',breaks:'The search indexer acks, the event is gone, and the email service <b>never sees it</b>. Replaying last week after a bug fix is impossible.'},
   design:'Do not delete on read: the log stays, and a reader\'s whole state is <b>one number per partition</b>, so any number of groups read the same data independently.',
   predict:{q:'A member processes records, then commits its offset every 4 records. It crashes between processing and the next commit. After the restart?',opts:['The records after the last commit are skipped','The records after the last commit are processed again (duplicates)','Kafka notices and delivers each record exactly once'],ans:1,why:'A restart resumes at the committed offset, so everything processed after it is redone: <b>at-least-once</b>. Commit <i>before</i> processing and you get skips instead (at-most-once). Move <i>Crash at</i> to change how many.'},
   build:{intro:'Simplified here: auto-commit fires every 5 records; Kafka\'s <code>enable.auto.commit</code> commits on a timer (every 5 s by default).',
    steps:['Members <b>join</b> the group; the coordinator bumps the <b>generation</b> and an assignor splits partitions among them.','Each member <code>poll()</code>s its partitions from its current position.','<b>Commit</b> <code>(group, partition) → offset</code> into an internal compacted topic (<code>__consumer_offsets</code>).','On join, leave or a missed heartbeat: <b>rebalance</b>. Cooperative mode revokes only the partitions that move.','Reject commits that carry an <b>older generation</b>.'],
    code:'loop:\n  records = poll(myPartitions, position)\n  process(records)                     // side effects\n  commit(group, generation, position)  // after: at-least-once\non rebalance(gen): revoke(moved); assign(new); generation = gen\ncoordinator.commit(gen, ...): if gen < current: reject ILLEGAL_GENERATION',
    rule:'Within a group each partition has <b>one owner per generation</b>, and a commit from an older generation is rejected.'}},
  {ask:'Disks fill up within days. What do we delete, and what if a team has not read it yet?',
   why:'50,000 events/s at 1 KB each is about <b>4 TB per day</b> per replica. Something must go, and a stuck consumer must not be able to stop that.',
   v0:{name:'Delete a record once every group has read it',code:'deleteBelow(min(committedOffset of every group))',breaks:'One abandoned or stuck consumer group <b>pins the disk forever</b> and the broker fills up. Deleting single records also means rewriting files.'},
   design:'Make deletion cheap and independent of readers: drop <b>whole old files</b> on a clock, and tell a reader that fell behind instead of waiting for it.',
   predict:{q:'Retention deletes segments older than 30 s. A group is stuck at an old committed offset it never read past. What happens?',opts:['The segments are deleted anyway; the group\'s next fetch gets OFFSET_OUT_OF_RANGE','Kafka keeps the segments: data a group has not read is never deleted','The broker quietly moves the group\'s committed offset to the log start'],ans:0,why:'Consumer offsets never pin data. The broker answers with an error and the valid range; the consumer client then applies <code>auto.offset.reset</code> (earliest or latest). Tiered storage does not change this: <code>retention.ms</code> still bounds the whole log, local plus remote. It makes a long retention <i>affordable</i>: turn it on and scrub to the middle to see old segments served from the remote tier.'},
   build:{steps:['Track the <b>log start offset</b> (first retained record) next to the log end offset.','A background task deletes the oldest <b>closed</b> segment while it is older than <code>retention.ms</code> or the log exceeds <code>retention.bytes</code>; never the active one.','A fetch below the log start returns <b>OFFSET_OUT_OF_RANGE</b> with the available range.','<b>Tiered:</b> upload a closed segment, verify it, publish it in a remote manifest, and only then let the local copy expire (<code>local.retention.ms</code>).'],
    code:'every minute:\n  while segments.length > 1 && (age(oldest) > RETENTION_MS || bytes > RETENTION_BYTES):\n    if tiered && !remote.has(oldest): upload(oldest); verify; manifest.add(oldest)\n    deleteLocal(oldest); logStart = segments[0].baseOffset\nfetch(off): if off < logStart: error(OFFSET_OUT_OF_RANGE, [logStart, logEnd))',
    rule:'The log start offset only moves forward, and an offset below it <b>fails loudly</b>; it never returns other data.'}},
  {ask:'A broker dies right after saying OK. Are the acknowledged events gone?',
   why:'With one copy, yes. With copies, two questions remain: when may the leader say OK, and which copy may take over?',
   v0:{name:'Leader acks after its own write, copies in the background',code:'leader.append(batch)\nreply(OK)                  // acks=1\nfollowers copy later',breaks:'The leader can crash <b>after</b> the OK but before any follower copied the record. A follower takes over without it: an <b>acknowledged event is lost</b>.'},
   design:'Say OK only once every replica that is <b>keeping up</b> has the record, and let only those replicas take over.',
   predict:{q:'acks=all, min.insync.replicas=2. The leader dies partway through the stream. How many acknowledged records are lost?',opts:['Only the ones the slow follower had not fetched yet','Every record since the last flush to disk','None: an ack meant every in-sync replica already had the record'],ans:2,why:'The new leader is chosen from the ISR, and every ISR member holds everything below the high watermark. Now switch <i>acks</i> to 1 and play again: records acked before any follower copied them vanish.'},
   build:{intro:'Simplified here: the ISR is decided by how far a follower lags. Kafka uses time (<code>replica.lag.time.max.ms</code>) and the controller (chapter 11) picks the new leader.',
    steps:['Followers send <b>Fetch</b>(their log end offset) to the leader, like consumers.','The leader tracks each follower\'s log end and the <b>ISR</b>; a follower that falls too far behind leaves it.','<b>High watermark</b> = min log end over the ISR. Consumers read only below it.','<code>acks=all</code>: reply once HW &gt; offset; reject if ISR size &lt; <code>min.insync.replicas</code>.','On leader failure elect an <b>ISR member</b>, bump the leader epoch; the old leader truncates its divergent tail when it returns.'],
    code:'leader.onFetch(f, fetchOffset): leo[f] = fetchOffset\n  isr = { r : leo[leader] - leo[r] small enough }\n  hw = min(leo[r] for r in isr)\nproduce(acks=all): if |isr| < MIN_ISR: reject NOT_ENOUGH_REPLICAS\n  append; wait until hw > offset; reply OK\nfailover: newLeader = isr member; epoch++',
    rule:'Only an in-sync replica can become leader, so <b>every record below the high watermark survives</b> a failover.'}},
  {ask:'The ack got lost and the producer retried. Did we just write the payment twice?',
   why:'A timeout is ambiguous: the write may or may not have landed. Retrying is needed for durability, but a blind retry duplicates.',
   v0:{name:'Retry on timeout',code:'try: produce(batch)\ncatch Timeout: produce(batch)   // same records again',breaks:'If the first attempt did land, the log now holds the batch <b>twice</b>: a customer is emailed or charged twice.'},
   design:'Make the retry recognisable: if every batch carries who sent it and its <b>position in that sender\'s stream</b>, the leader can tell a retry from new data.',
   predict:{q:'Batch #2 is appended but its ack is lost, so the producer retries it with the same sequence. With idempotence on, what does the leader do?',opts:['Recognises producer ID + sequence, appends nothing and returns the original offsets','Appends it again: the leader cannot tell a retry from a new batch','Rejects it as out of order, and the producer must drop the batch'],ans:0,why:'The leader remembers the last sequences per producer and partition, inside the replicated log, so it still recognises the retry after a failover. Untick <i>idempotent producer</i> to see the duplicate appear.'},
   build:{intro:'Honest note: the playground restarts the producer with a bumped <b>epoch</b> and fences the old one. That fencing comes from a <code>transactional.id</code> (chapter 9); a plain idempotent producer gets a <b>new producer ID</b> on restart, so its dedupe does not span restarts.',
    steps:['<code>InitProducerId</code> gives the producer a <b>PID</b> (and epoch).','The producer numbers records per partition; each batch carries <code>(PID, epoch, firstSeq)</code>.','The leader keeps the last few batch sequences per <code>(PID, partition)</code>: <b>next</b> = append, <b>seen</b> = return the old offsets, <b>gap</b> = reject.','Rebuild this state from the batch headers in the log, so a new leader after failover has it too.'],
    code:'onProduce(pid, epoch, seq, batch):\n  s = state[pid, partition]\n  if epoch < s.epoch: reject PRODUCER_FENCED\n  if seq <= s.lastSeq: return s.offsetsOf(seq)     // duplicate\n  if seq != s.lastSeq + 1: reject OUT_OF_ORDER_SEQUENCE\n  offsets = append(batch); s.lastSeq = seq + batch.count - 1',
    rule:'For one producer ID and partition, each sequence number is <b>appended at most once, and in order</b>.'}},
  {ask:'We need the latest address of every customer forever, but not every old version. How?',
   why:'A changelog of 40 million customers grows forever if kept whole. Deleting by age instead drops customers who simply have not changed lately.',
   v0:{name:'Use time-based retention on the changelog',code:'retention.ms = 7 days',breaks:'A customer who has not changed in 8 days <b>disappears</b>, so a new service rebuilding its table from the topic never learns they exist.'},
   design:'For a changelog only the <b>latest value per key</b> matters, so garbage-collect older versions in the background and turn deletes into records.',
   predict:{q:'A consumer read half the partition, paused, and resumes after the cleaner dropped a tombstone it had not reached yet. What does its table end up with?',opts:['The correct state: compaction never changes what a replay produces','An error: it must restart from offset 0','The deleted key is still there, because it never saw the delete'],ans:2,why:'It already holds the old value and the tombstone that should remove it is gone. Raise <i>delete.retention</i> until the tombstone survives the cleaner and the state becomes correct. (Needs the <i>updates + deletes</i> workload.)'},
   build:{steps:['Only <b>closed</b> segments are cleaned; the active segment is never touched.','Pass 1: build a map <code>key → latest offset</code> over the dirty segments.','Pass 2: copy each record whose offset is the latest for its key, <b>keeping its original offset</b>; drop tombstones older than <code>delete.retention.ms</code>.','Swap the cleaned segments in atomically. A fetch of a removed offset returns the next surviving record.'],
    code:'latest = {}\nfor r in closedSegments: latest[r.key] = r.offset\nout = [r for r in closedSegments\n       if latest[r.key] == r.offset\n       and !(r.value == null and age(r) > DELETE_RETENTION)]\nswapAtomically(closedSegments, out)   // offsets unchanged',
    rule:'Replaying the compacted log gives the <b>same final value per key</b> as replaying the full history.'}},
  {ask:'A job reads orders, writes invoices, then commits its offset. A crash in between: duplicate invoices?',
   why:'The output write and the offset commit are two separate writes. A crash between them means redoing work (duplicates) or skipping it.',
   v0:{name:'Write the outputs, then commit the input offset',code:'for o in transform(records): produce(o)\ncommitOffset(lastInput + 1)',breaks:'Crash after the outputs but before the commit: the restart reprocesses the input and writes every invoice <b>again</b>.'},
   design:'Treat the consumer offset as <b>just another output</b>, so one atomic commit covers both the results and the progress.',
   predict:{q:'Transactions on. The job crashes after writing all 3 outputs, before committing. What does a read_committed reader see after the restart?',opts:['Each output twice: once from the crashed attempt, once from the redo','Each output exactly once: the open transaction is aborted and the work redone','Nothing: the outputs of a crashed job are lost'],ans:1,why:'The crashed attempt is aborted, its records stay in the log but are hidden behind an ABORT marker, and the redo commits once. Now untick <i>transactional</i> and crash after step 3 (the last output) to get 3 duplicates.'},
   build:{intro:'This covers Kafka to Kafka only. A database or email sink outside Kafka still needs its own idempotency.',
    steps:['<code>initTransactions()</code>: the coordinator maps <code>transactional.id</code> to a PID and bumps the epoch, fencing any zombie with the same id.','<code>beginTransaction()</code>, produce the outputs; each new partition is registered with the coordinator.','<code>sendOffsetsToTransaction()</code> adds the consumed offsets to the same transaction.','<b>Commit:</b> the coordinator logs PREPARE, writes COMMIT markers to every partition, then logs COMPLETE.','Consumers with <code>read_committed</code> stop at the last stable offset and skip aborted records.'],
    code:'initTransactions()            // fences older epochs\nloop:\n  recs = poll(); beginTransaction()\n  for o in transform(recs): produce(o)\n  sendOffsetsToTransaction(positions, group)\n  commitTransaction()         // markers on every partition\n  on error: abortTransaction()',
    rule:'Outputs and the input offset become visible <b>together or not at all</b>.'}},
  {ask:'Two new brokers sit idle while the old ones fill up. How do we move data without downtime?',
   why:'Partitions are pinned to the brokers they were created on. Moving one means copying gigabytes while producers keep writing and consumers keep reading.',
   v0:{name:'Stop the partition, copy the files, restart',code:'stop(partition)\nrsync(oldBroker:/data/p0 -> newBroker)\nupdateConfig(p0 -> newBroker); start(partition)',breaks:'<b>Downtime</b> for that partition, writes during the copy are lost if you do not stop, and clients still pointed at the old broker write to the wrong place.'},
   design:'A move is just replication: add the new broker as <b>one more follower</b>, and switch over only once it has caught up.',
   predict:{q:'One partition is the hottest because of a hot key. You add brokers and reassign. What happens to that partition\'s load?',opts:['It moves as a whole: broker load evens out, but that partition stays exactly as hot','It is split across the new brokers, so the hot key cools down','Reassignment skips hot partitions until their traffic drops'],ans:0,why:'Reassignment moves whole replicas. Its bytes are identical before and after; only a different key or more partitions (chapter 2) splits a hot key. Pick <i>hot key</i> in the data panel to exaggerate it.'},
   build:{steps:['Plan: for each partition, the target replica list.','Add the target replicas as <b>followers</b>; they fetch from the leader, throttled so clients keep their bandwidth.','Wait until each new replica <b>joins the ISR</b> (it holds the committed prefix).','<b>Publish</b> the new placement in the metadata log (epoch bump), move leadership if needed, then remove the old replicas.'],
    code:'reassign(p, target):\n  replicas[p] = old ∪ target           // new ones fetch, throttled\n  wait until target ⊆ isr[p]\n  metadata.commit(p, replicas = target, epoch + 1)\n  stopAndDelete(old - target)',
    rule:'At every moment exactly <b>one placement is authoritative</b>, and a new replica serves only after it holds the committed prefix.'}},
  {ask:'Who decides which broker leads each partition, and what if that decider dies?',
   why:'Every failover from chapter 6 needs one authority. Two deciders that disagree means two leaders for one partition, and diverging data.',
   v0:{name:'One controller process',code:'controller.electLeader(p)\ncontroller.broadcast(metadata)',breaks:'It dies: nobody elects new partition leaders, so partitions whose leader also died stay <b>offline</b>. Add a hot standby and a network split can leave <b>two active controllers</b>.'},
   design:'The decider needs what the data needed, a replicated log, but one that only advances with a <b>majority</b>, so there can never be two authorities.',
   predict:{q:'Scenario 4: the active controller is cut off in the minority and a client sends it a MoveReplica. What happens?',opts:['It commits: that controller is still active for its epoch','Both sides commit, and the newest timestamp wins when the network heals','It is appended but never commits; the majority elects a new controller, and the entry is truncated on heal'],ans:2,why:'Committing needs a majority, which the cut-off side does not have. The majority side elects a new active controller with a higher epoch and keeps committing; on heal the old one steps down and drops its uncommitted entry.'},
   build:{intro:'Simplified here: classic Raft where the leader pushes AppendEntries. In KRaft followers <b>fetch</b> from the leader instead, but the vote and commit rules are the same.',
    steps:['Persist <code>(epoch, votedFor, log)</code> before answering anyone.','A follower that hears nothing until its election timeout becomes a candidate: <code>epoch++</code>, ask for votes.','Grant a vote only to a candidate whose log is <b>at least as up to date</b> as yours.','The leader replicates entries; one is <b>committed</b> once a majority stores it (in the current epoch).','Brokers apply only committed metadata, and reject requests carrying an older controller epoch.'],
    code:'onTimeout(): epoch++; vote(self); requestVotes(lastIndex, lastEpoch)\nvote(c): grant if c.epoch >= epoch and c.log at least as new as mine\nleader: replicate(entries); match[f] = ack index\ncommit = max i where majority(match >= i) and log[i].epoch == epoch\nbrokers: apply(log[..commit]) in order',
    rule:'A committed metadata change exists on a majority, so <b>every future active controller has it</b>.'}}
 ],
 milestones:[
  {t:'Single-partition log',test:'<code>kill -9</code> in the middle of an append: the restart keeps every complete record and the next offset continues right after them.'},
  {t:'Partitioned topic with key hashing',test:'The same key maps to the same partition on every client; per-key order holds with 4 concurrent producers.'},
  {t:'Batching producer with a bounded buffer',test:'10,000 records go out in fewer than 100 requests with linger on; with a broker paused, producer memory stays at or below <code>buffer.memory</code>.'},
  {t:'Consumer groups and committed offsets',test:'Kill a consumer mid-batch: after the restart no record is skipped, and a commit from an old generation is rejected.'},
  {t:'Retention by segment',test:'Disk usage stays bounded under constant load; a consumer behind the log start gets OFFSET_OUT_OF_RANGE, never wrong data.'},
  {t:'Replication with ISR and high watermark',test:'Kill the leader under <code>acks=all</code>, <code>min.insync.replicas=2</code>: zero acknowledged records lost.'},
  {t:'Idempotence, compaction and transactions',test:'Inject lost acks and crashes: a <code>read_committed</code> consumer sees every output once; a compacted replay equals the full-history state.'},
  {t:'Controller quorum',test:'Kill or isolate controllers in a loop: never two active controllers in one epoch, and committed metadata is identical everywhere.'}],
 capstone:{title:'Put it together: a live cluster',lead:'Producer, three brokers, a controller and a consumer, running at once. Play a scenario, scrub the timeline, tap a broker to see its log, then kill a broker and compare <code>acks=all</code> with <code>acks=1</code>.'}
};
</script>
<script>
Lab.mount(STORY);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const J=x=>{try{return JSON.stringify(x)}catch{return String(x)}};
const pc=i=>`var(--p${((i%8)+8)%8})`,tc=i=>`var(--t${((i%8)+8)%8})`;
const cmp=(a,b)=>a<b?-1:a>b?1:0;
const short=(s,n=40)=>{s=String(s);return s.length>n?s.slice(0,n-1)+'…':s};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function lcg(seed){let s=(seed>>>0)||1;return()=>{s=(Math.imul(s,1103515245)+12345)&0x7fffffff;return s/0x7fffffff}}
function fnvStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
const hex=(n,w)=>n.toString(16).padStart(w,'0');
const bn=i=>'b'+i;

/* ================= parsing + samples ================= */
function detect(t){const s=t.trim();if(s.startsWith('['))return'json';const l=s.split(/\r?\n/)[0]||'';if(l.startsWith('{'))return'jsonl';if(l.includes(','))return'csv';return'text'}
function csvSplit(l){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){o.push(c);c=''}else c+=ch}o.push(c);return o}
const conv=v=>(typeof v==='string'&&/^-?\d+(\.\d+)?$/.test(v.trim()))?Number(v):v;
function colsOf(rows){const c=[];rows.forEach(r=>Object.keys(r).forEach(k=>{if(!c.includes(k))c.push(k)}));return c}
function parseWhole(text,pf){
  if(pf==='json'){const a=JSON.parse(text);if(!Array.isArray(a))throw new Error('JSON must be an array');return{rows:a,columns:colsOf(a)}}
  const lines=text.split(/\r?\n/).filter(l=>l.trim()!=='');
  if(pf==='jsonl'){const rows=lines.map(l=>JSON.parse(l));return{rows,columns:colsOf(rows)}}
  if(pf==='csv'){if(!lines.length)return{rows:[],columns:[]};const h=csvSplit(lines[0]);const rows=lines.slice(1).map(l=>{const v=csvSplit(l),o={};h.forEach((k,i)=>o[k]=conv(v[i]??''));return o});return{rows,columns:h}}
  return{rows:lines.map(l=>({line:l})),columns:['line']};
}
function sampleOrders(){const st=['new','paid','shipped'],r=lcg(11),L=['customer,order_id,status,amount'];for(let i=0;i<30;i++)L.push([`C${101+((i*5)%7)}`,`O-${900+i}`,st[Math.floor(r()*3)],Math.round(20+r()*480)].join(','));return L.join('\n')}
function sampleClicks(){const pg=['/home','/cart','/pay','/help'],r=lcg(5),L=[];for(let i=0;i<30;i++)L.push(J({user:'u'+(1+Math.floor(r()*6)),page:pg[Math.floor(r()*4)],ms:Math.round(20+r()*300)}));return L.join('\n')}
function sampleSensors(){const r=lcg(7),L=['device,ts,temp'];for(let i=0;i<30;i++)L.push([`D${1+(i%5)}`,1000+i*10,Math.round(180+r()*80)/10].join(','));return L.join('\n')}
const SAMPLES={orders:{t:sampleOrders,f:'csv'},clicks:{t:sampleClicks,f:'jsonl'},sensors:{t:sampleSensors,f:'csv'}};

/* ================= config + records ================= */
const OPT={lp:0,fetchOff:0,crash:'torn',rate:1,batch:2048,linger:20,comp:'none',mem:4096,policy:'block',slow:1,members:2,commit:'after',crashPct:60,rebal:'cooperative',rev:'join',
  rpol:'time',rlim:30,tier:false,localRet:12,cOff:5,racks:'all',minIsr:2,slowF:200,failPct:60,idem:true,ccrash:4,txn:true,ctgt:2,cdel:25,cdelRet:15,cOffset:0,
  bk:4,thr:3,roll:true,mcrash:0,raftN:3,raftScen:'partition',rp:0};
function cfg(){return{text:$('#src').value,fmt:$('#fmt').value,kcol:$('#kcol').value,mix:$('#mix').value,P:+$('#pn').value,seg:+$('#seg').value}}
function mkRecords(c,rows){
  const rnd=lcg(rows.length*7+1),ev=rows.map((r,i)=>({r,at:i*3,kind:'put'}));
  if(c.mix==='updates'){rows.forEach((r,i)=>{if(i%3===1)ev.push({r:{...r,_v:2},at:i*3+8+Math.floor(rnd()*5),kind:'put'})});
    const seen=[],last={};rows.forEach(r=>{const k=String(r[c.kcol]);if(!seen.includes(k))seen.push(k);last[k]=r});
    seen.forEach((k,idx)=>{if(idx%3===1)ev.push({r:last[k],at:rows.length*3+20+idx,kind:'del'})})}
  ev.sort((a,b)=>a.at-b.at);const hot=String(rows[0][c.kcol]);
  return ev.map((e,i)=>{let key=String(e.r[c.kcol]);if(c.mix==='hot'&&(i*37)%100<40)key=hot;return{i,key,value:e.kind==='del'?null:J(e.r),ts:1000+i*10,t:i}});
}
const partOf=(key,P)=>fnvStr(key)%P;
const rbytes=r=>r.key.length+(r.value?r.value.length:0)+24;
function buildLogs(recs,P,segRecs){
  const logs=Array.from({length:P},(_,p)=>({p,recs:[],segs:[]}));
  recs.forEach(r=>{const L=logs[partOf(r.key,P)];L.recs.push({off:L.recs.length,key:r.key,value:r.value,ts:r.ts,t:r.t,i:r.i,bytes:rbytes(r)})});
  logs.forEach(L=>L.recs.forEach(x=>{let s=L.segs[L.segs.length-1];if(!s||s.recs.length>=segRecs){s={base:x.off,recs:[]};L.segs.push(s)}s.recs.push(x)}));
  return logs;
}
let S=null;
function build(){
  const c=cfg(),o={cfg:c};
  if(!c.text.trim()){o.error='No data yet.';return o}
  let ds;try{ds=parseWhole(c.text,c.fmt==='auto'?detect(c.text):c.fmt)}catch(e){o.error='Cannot parse input: '+e.message;return o}
  if(!ds.rows.length||!ds.columns.includes(c.kcol)){o.error='Choose a key column.';return o}
  if(ds.rows.length>300){o.error='Please keep the data under 300 rows.';return o}
  o.rows=ds.rows;o.columns=ds.columns;o.recs=mkRecords(c,ds.rows);o.logs=buildLogs(o.recs,c.P,c.seg);
  o.lp=clamp(OPT.lp,0,c.P-1);
  return o;
}

/* ================= player ================= */
let rsAnim=false;
const rcell=(r,cls='')=>`<span class="rc ${cls}" title="${esc(r.key)} → ${esc(r.value===null?'null (tombstone)':short(r.value,60))}">${r.off}${r.value===null?'✕':''}</span>`;
const lbl=k=>esc(short(k,10));

/* =========================================================
   PHASE 1: PARTITION LOG, SEGMENTS, SPARSE INDEX, RECOVERY (F01)
   ========================================================= */
function frameOf(r){const p=`${r.off}|${r.key}|${r.ts}|${r.value===null?'∅':r.value}`;return hex(p.length,4)+hex(fnvStr(p),8)+p}
function parseFrames(buf){
  const out=[];let i=0,why='clean end';
  while(i<buf.length){
    if(i+12>buf.length){why='torn header';break}
    const len=parseInt(buf.slice(i,i+4),16),crc=parseInt(buf.slice(i+4,i+12),16);
    if(isNaN(len)||isNaN(crc)){why='garbage header';break}
    if(i+12+len>buf.length){why='torn payload';break}
    const p=buf.slice(i+12,i+12+len);if(fnvStr(p)!==crc){why='checksum mismatch';break}
    const[off,key,ts,...rest]=p.split('|');out.push({off:+off,key,ts:+ts,value:rest.join('|')==='∅'?null:rest.join('|')});i+=12+len;
  }
  return{recs:out,consumed:i,why};
}
const IDX=2;
function segIndex(seg){let pos=0;const ix=[];seg.recs.forEach((r,k)=>{if(k%IDX===0)ix.push({off:r.off,pos});pos+=frameOf(r).length});return ix}
function locate(L,off){
  let lo=0,hi=L.segs.length-1,steps=0,si=0;
  while(lo<=hi){const m=(lo+hi)>>1;steps++;if(L.segs[m].base<=off){si=m;lo=m+1}else hi=m-1}
  const seg=L.segs[si],ix=segIndex(seg);let e=ix[0];ix.forEach(x=>{if(x.off<=off)e=x});
  let scanned=0,found=null;for(const r of seg.recs){if(r.off<e.off)continue;scanned++;if(r.off===off){found=r;break}}
  return{si,seg,ix,entry:e,steps,scanned,found};
}
function draw1(p){
  const L=S.logs[S.lp],n=L.recs.length;if(!n)return'<div class="box">This partition is empty. Pick another one.</div>';
  const k=p>=1?n:Math.max(1,Math.ceil(p*0.5*2*n*0.999)),shown=Math.min(n,Math.ceil(clamp(p/0.45,0,1)*n)),off=clamp(OPT.fetchOff,0,n-1),look=p>=0.45||p>=1?locate(L,off):null;
  const segs=L.segs.map((s,i)=>{const act=i===L.segs.length-1,ix=segIndex(s).map(x=>x.off);return`<div class="seg ${act?'act':''}"><h5>${act?'active ':'closed '}segment · base ${s.base} · ${hex(s.base,8)}.log</h5>${s.recs.map(r=>r.off<shown?rcell(r,(ix.includes(r.off)?'ok ':'')+(look&&look.found&&look.found.off===r.off?'hl':'')):'').join('')}</div>`}).join('');
  // recovery experiment
  const act=L.segs[L.segs.length-1],buf0=act.recs.map(frameOf).join('');let buf=buf0,mode=OPT.crash,desc='';
  if(mode==='torn'){const lastLen=frameOf(act.recs[act.recs.length-1]).length;buf=buf0.slice(0,buf0.length-Math.floor(lastLen*0.45));desc='The process died while appending the last record: the file ends mid-record.'}
  if(mode==='corrupt'&&act.recs.length>1){const mid=frameOf(act.recs[0]).length+16;buf=buf0.slice(0,mid)+(buf0[mid]==='x'?'y':'x')+buf0.slice(mid+1);desc='A byte in the second record was flipped (bad disk write).'}
  const rec=parseFrames(buf),good=rec.recs.length,trunc=buf.length-rec.consumed,next=good?rec.recs[good-1].off+1:act.base;
  const rebuilt=segIndex({recs:rec.recs}),orig=segIndex({recs:act.recs.slice(0,good)}),same=J(rebuilt)===J(orig)&&J(rec.recs.map(x=>x.off))===J(act.recs.slice(0,good).map(x=>x.off));
  const recoveryHtml=mode==='none'?`<div class="note">Pick a crash type above to see tail recovery.</div>`:`<div class="caption ${same?'good':'bad'}"><b>Restart after crash.</b> ${esc(desc)} The broker scans the active segment from its start validating length + checksum: <b>${good}</b> complete record(s) kept, scan stopped at "${rec.why}", <b>${trunc}</b> byte(s) truncated. Next append gets offset <b>${next}</b>. Rebuilt sparse index ${same?'<b class="ok">equals</b>':'<b class="bad">differs from</b>'} the original for the surviving prefix.</div>`;
  return`<div class="caption">Partition <b>${S.lp}</b> · ${n} records in ${L.segs.length} segment(s). Each append gets the next offset; segments roll at ${S.cfg.seg} records. Green outline = a sparse-index entry (every ${IDX}nd record).</div>${segs}
  <div class="g2"><div><h3>Fetch from offset ${off}</h3>${look?`<table><tr><th>step</th><th>what happens</th></tr>
   <tr><td>1</td><td>binary search over ${L.segs.length} segment base offsets (${look.steps} probe${look.steps>1?'s':''}) → segment <span class="mono">${hex(look.seg.base,8)}.log</span></td></tr>
   <tr><td>2</td><td>sparse index: last entry ≤ ${off} is offset ${look.entry.off} at byte ${look.entry.pos}</td></tr>
   <tr><td>3</td><td>scan forward ${look.scanned} record(s) → <b>${look.found?esc(short(look.found.key,14))+' @ '+look.found.off:'not found'}</b></td></tr></table><div class="note">Without the index every earlier segment would be scanned.</div>`:'<div class="note">…</div>'}</div>
  <div><h3>Crash recovery</h3>${recoveryHtml}</div></div>
  <div class="note">An offset is the record's permanent position in this partition. Sequential appends and immutable closed segments make replay simple; only the active segment's tail can be incomplete after a crash, and it is validated before new writes are accepted.</div>`;
}

/* =========================================================
   PHASE 2: KEY ROUTING + SKEW (F02)
   ========================================================= */
function draw2(p){
  const P=S.cfg.P,recs=S.recs,k=p>=1?recs.length:Math.ceil(p*recs.length),cnt=Array(P).fill(0),by=Array(P).fill(0),keys=new Map();
  recs.slice(0,k).forEach(r=>{const q=partOf(r.key,P);cnt[q]++;by[q]+=rbytes(r);keys.set(r.key,(keys.get(r.key)||0)+1)});
  const mx=Math.max(1,...cnt),tot=cnt.reduce((a,b)=>a+b,0),hotP=cnt.indexOf(Math.max(...cnt)),top=[...keys.entries()].sort((a,b)=>b[1]-a[1]);
  const allKeys=[...new Set(recs.map(r=>r.key))],moved=allKeys.filter(x=>partOf(x,P)!==partOf(x,P+1)).length;
  const last=recs[Math.max(0,k-1)];
  return`<div class="caption">Record <b>${esc(last.key)}</b> → hash <span class="mono">${hex(fnvStr(last.key),8)}</span> mod ${P} → <b>partition ${partOf(last.key,P)}</b>. The same key always lands in the same partition (for a fixed partition count).</div>
  <div class="g2"><div>${cnt.map((c,i)=>`<div class="lrow"><b style="color:${tc(i)}">partition ${i}</b><span class="bar2" style="width:${c/mx*55}%;background:${tc(i)}"></span><span class="mono">${c} records · ${by[i]} B</span></div>`).join('')}
   <div class="note">busiest partition: <b>${hotP}</b> with ${(cnt[hotP]/Math.max(1,tot)*100).toFixed(0)}% of records (fair share ${(100/P).toFixed(0)}%)</div></div>
  <div><table><tr><th>key</th><th class="n">records</th><th>partition</th></tr>${top.slice(0,6).map(([key,n])=>`<tr><td class="mono">${esc(short(key,14))}</td><td class="n">${n}</td><td>${partOf(key,P)}</td></tr>`).join('')}</table>
   <div class="note">${top[0]&&top[0][1]/Math.max(1,tot)>0.3?'<b class="bad">Hot key:</b> one key carries '+(top[0][1]/tot*100).toFixed(0)+'% of the traffic, so partition '+partOf(top[0][0],P)+' stays hot however many brokers you add.':'Keys spread reasonably evenly.'}</div></div></div>
  <div class="caption ${moved?'bad':'good'}">Changing the partition count from ${P} to ${P+1} would move <b>${moved}/${allKeys.length}</b> distinct keys to a different partition: per-key ordering across the change is not preserved. Order exists <i>within</i> a partition only; there is no topic-wide order.</div>`;
}

/* =========================================================
   PHASE 3: PRODUCE, BATCHING, COMPRESSION, BACKPRESSURE (F03 + F07)
   ========================================================= */
function lz(s){const out=[];let i=0;while(i<s.length){let bl=0,bo=0;for(let j=Math.max(0,i-255);j<i;j++){let l=0;while(i+l<s.length&&s[j+l]===s[i+l]&&l<60)l++;if(l>bl){bl=l;bo=i-j}}if(bl>=4){out.push([bo,bl]);i+=bl}else{out.push(s[i]);i++}}return out}
const lzSize=t=>t.reduce((a,x)=>a+(typeof x==='string'?1:3),0);
function unlz(t){let o='';t.forEach(x=>{if(typeof x==='string')o+=x;else{const st=o.length-x[0];for(let k=0;k<x[1];k++)o+=o[st+k]}});return o}
const _lzc=new Map();
function wireBytes(payload,comp){if(comp==='none')return payload.length;if(!_lzc.has(payload)){const t=lz(payload);_lzc.set(payload,{size:lzSize(t),ok:unlz(t)===payload});if(_lzc.size>300)_lzc.delete(_lzc.keys().next().value)}return _lzc.get(payload).size}
function produceSim(recs,o){
  const open=new Map(),pend=[],lat=[];let sendFree=0,blocked=0,rejected=0,maxBuf=0,wire=0,raw=0,reqs=0,delivered=0,t0=null,tEnd=0;const batches=[],bufSeries=[];
  const bufAt=t=>{let b=0;open.forEach(x=>b+=x.bytes);pend.forEach(x=>{if(x.end>t)b+=x.bytes});return b};
  const closeB=(pk,rt)=>{const b=open.get(pk);if(!b)return;open.delete(pk);const payload=b.recs.map(r=>r.key+'|'+(r.value||'')).join('\n'),w=wireBytes(payload,o.comp),st=Math.max(sendFree,rt),dur=(6+w/200)*o.slow,end=st+dur;sendFree=end;
    pend.push({bytes:b.bytes,end});reqs++;wire+=w;raw+=payload.length;b.recs.forEach(r=>{lat.push(end-r.at);delivered++});tEnd=Math.max(tEnd,end);batches.push({pk,rt,st,end,n:b.recs.length,raw:payload.length,w})};
  recs.forEach(r=>{
    let t=r.t*10*(1/o.rate);if(t0===null)t0=t;
    [...open.entries()].filter(([pk,b])=>o.linger>=0&&b.first+o.linger<=t).sort((a,b)=>a[1].first-b[1].first).forEach(([pk,b])=>closeB(pk,b.first+o.linger));
    const sz=rbytes(r);let drop=false,at=t;
    while(bufAt(at)+sz>o.mem){const nx=pend.filter(x=>x.end>at).map(x=>x.end).sort((a,b)=>a-b)[0];if(o.policy==='reject'||nx===undefined){drop=true;break}blocked+=nx-at;at=nx}
    if(drop){rejected++;return}
    const pk=partOf(r.key,S.cfg.P);let b=open.get(pk);if(!b){b={recs:[],bytes:0,first:at};open.set(pk,b)}b.recs.push({...r,at:r.t*10*(1/o.rate)});b.bytes+=sz;maxBuf=Math.max(maxBuf,bufAt(at));bufSeries.push({t:at,b:bufAt(at)});
    if(b.bytes>=o.batch||o.linger===0)closeB(pk,at);
  });
  [...open.entries()].sort((a,b)=>a[1].first-b[1].first).forEach(([pk,b])=>closeB(pk,b.first+Math.max(0,o.linger)));

/* =========================================================
   PHASE 4: CONSUMER GROUPS, OFFSETS, REBALANCE (F04 + F10)
   ========================================================= */
function assignRange(P,n){const a=Array.from({length:n},()=>[]);const base=Math.floor(P/n),ex=P%n;let p=0;for(let m=0;m<n;m++){const c=base+(m<ex?1:0);for(let i=0;i<c;i++)a[m].push(p++)}return a}

/* =========================================================
   PHASE 5: RETENTION, LAG, TIERED STORAGE (F05 + F14)
   ========================================================= */
function segLife(L,t,o){

  segs.forEach((s,i)=>{if(i===n-1){s.state='active';return}if(t<s.close){s.state='active';return}
    if(o.tier){s.uploaded=s.close+2;if(t<s.uploaded)s.state='local';else if(t-s.close>=o.localRet)s.state='remote';else s.state='local+remote'}
    if(o.rpol==='time'&&t-s.close>=o.rlim)s.state='deleted'});
  if(o.rpol==='bytes'){let tot=segs.filter(s=>s.state!=='deleted').reduce((a,s)=>a+s.bytes,0);for(const s of segs){if(tot<=o.rlim*60)break;if(s.state!=='active'&&s.state!=='deleted'&&!(s.i===n-1)){tot-=s.bytes;s.state='deleted'}}}
  return segs;
}
function draw5(p){

  const alive=segs.filter(s=>s.state!=='deleted'),logStart=alive.length?alive[0].base:n,localStart=(segs.find(s=>['active','local','local+remote'].includes(s.state))||{base:n}).base,c=clamp(OPT.cOff,0,n);
  const loc=c>=n?'end of log':c<logStart?'OUT_OF_RANGE':(()=>{const s=segs.filter(x=>x.base<=c).pop();return s.state==='remote'?'REMOTE (cold read)':'local (hot read)'})();
  const lag=n-c;
  const cls={active:'act',local:'','local+remote':'','remote':'rem',deleted:'del'};
  const segHtml=segs.map(s=>`<div class="seg ${cls[s.state]}"><h5>${hex(s.base,8)}.log · ${s.state}</h5>${L.segs[s.i].recs.map(r=>`<span class="rc ${s.state==='deleted'?'gone':''} ${r.off===c?'hl':''}">${r.off}</span>`).join('')}</div>`).join('');

  return`<div class="caption ${out?'bad':''}">t = ${t.toFixed(0)} s · policy <b>${o.rpol==='time'?'delete segments older than '+o.rlim+' s':'keep at most '+o.rlim*60+' B'}</b>${o.tier?` · tiered: local copy kept ${o.localRet} s, remote kept until the policy deletes it`:''}</div>${segHtml}
  <div class="chips" style="margin:8px 0"><span class="chip">log start offset ${logStart}</span>${o.tier?'<span class="chip">local start '+localStart+'</span>':''}<span class="chip">log end ${n}</span><span class="chip">consumer committed ${c}</span><span class="chip ${lag>0?'':'ok'}">lag ${lag}</span></div>
  <div class="caption ${out?'bad':'good'}">Fetch at committed offset <b>${c}</b> → <b>${loc}</b>${out?`: the broker returns an explicit error with the available range [${logStart}, ${n}); the broker never moves the consumer's offset itself; the client's auto.offset.reset decides what happens next.`:''}${loc.startsWith('REMOTE')?': the segment is located in the remote manifest, read at higher latency, and returns the same offsets.':''}</div>
  <div class="note">Retention deletes whole closed segments regardless of whether anyone has read them: consumer offsets never pin data. ${o.tier?'Tiered storage uploads a verified closed segment and publishes a manifest <i>before</i> the local copy may expire, so local disks keep a short hot window while older history stays readable.':'Turn on tiered storage to keep older history readable from a remote tier.'} Move the committed offset to see lag cross the retention boundary.</div>`;

/* =========================================================
   PHASE 6: REPLICATION, ISR, HIGH WATERMARK (F06)
   ========================================================= */
function replSim(L,o){
  const R=L.recs.map(r=>({t:r.t*10,off:r.off,key:r.key})),n=R.length,intervals=[0,60,o.slowF],lagMax=150;
  const fi=Math.min(n-1,Math.floor(o.failPct/100*n)),tf=n?R[fi].t+1:0;

    if(r.t>tf)return{...r,status:'after failover'};

    for(let tt=r.t;tt<r.t+2000;tt+=5)if(hw(tt)>=r.off+1)return{...r,status:'acked',ackT:tt};

  });

}

/* =========================================================
   PHASE 7: IDEMPOTENT PRODUCER (F08)
   ========================================================= */
function idemScript(){
  const L=S.logs[S.lp].recs.length?S.logs[S.lp]:S.logs.find(x=>x.recs.length)||S.logs[0],r=L.recs.slice(0,8),log=[],state={},steps=[];const idem=OPT.idem;
  const append=(recs,tag)=>{const offs=[];recs.forEach(x=>{log.push({off:log.length,key:x.key,tag});offs.push(log.length-1)});return offs};
  const send=(pid,epoch,seq,recs,lostAck,desc)=>{
    let res,offs;const st=state[pid];
    if(idem){
      if(st&&epoch<st.epoch){res='INVALID_PRODUCER_EPOCH (fenced)';offs=[]}
      else if(st&&seq+recs.length-1<=st.lastSeq&&epoch===st.epoch){res='DUPLICATE → return prior offsets';offs=st.byseq[seq]||[]}
      else if(st&&seq!==st.lastSeq+1&&epoch===st.epoch){res='OUT_OF_ORDER_SEQUENCE (gap) rejected';offs=[]}
      else{offs=append(recs,desc.includes('retry')?'dup':'');state[pid]={epoch,lastSeq:seq+recs.length-1,byseq:{...(st&&st.epoch===epoch?st.byseq:{}),[seq]:offs}};res='appended'}
    }else{offs=append(recs,desc.includes('retry')||desc.includes('zombie')||desc.includes('gap')?'dup':'');res='appended (no validation)'}
    steps.push({desc,res,offs,lostAck,log:log.map(x=>({...x})),state:JSON.parse(JSON.stringify(state))});
  };
  send(7,0,0,r.slice(0,2),false,'batch #1 (seq 0-1)');
  send(7,0,2,r.slice(2,4),true,'batch #2 (seq 2-3): the ACK is lost on the network');
  send(7,0,2,r.slice(2,4),false,'producer times out and retries batch #2');
  send(7,0,6,r.slice(4,6),false,'batch #3 arrives with a sequence gap (seq 6, expected 4)');

/* =========================================================
   PHASE 8: LOG COMPACTION (F09)
   ========================================================= */
function compactModel(){

/* =========================================================
   PHASE 9: TRANSACTIONS + EOS (F12)
   ========================================================= */

/* =========================================================
   PHASE 10: REASSIGNMENT + SKEW (F11)
   ========================================================= */
function placement(P,B){return Array.from({length:P},(_,p)=>[p%B,(p+1)%B,(p+2)%B])}

  <div><h3 style="margin-top:0">Partition skew (independent of broker placement)</h3>${bytes.map((b,i)=>`<div class="lrow"><b style="color:${tc(i)}">partition ${i}</b><span class="bar2" style="width:${b/Math.max(1,...bytes)*55}%;background:${tc(i)}"></span><span class="mono">${b} B</span></div>`).join('')}

   ${crash>0&&p>=1?`<div class="caption ${crash<4?'good':'bad'}">${crash<4?`Crash at step ${crash} (before the placement is published): <b>roll back</b>. The old replica set stays authoritative; the unverified partial copy on broker ${move.to} is discarded and never serves reads.`:`Crash at step ${crash} (after the placement is published): <b>resume forward</b>; the verified new replica is authoritative.`}</div>`:''}`:'<div class="note">Choose 4 or 5 brokers to see a reassignment.</div>'}

/* =========================================================

    if(a.a==='isolate'){const L=this.leader();this.iso=L?L.id:0;const grp=[this.iso];for(const x of this.nodes){if(grp.length>=Math.floor(this.n/2))break;if(x.id!==this.iso)grp.push(x.id)}grp.forEach(i=>this.nodes[i].grp=1);this.log(`network partition: {${grp.map(cn)}} cut off from the rest`)}
    if(a.a==='heal'){this.nodes.forEach(x=>x.grp=0);this.log('partition healed')}
  }
  nextCmd(){const c=['CreateTopic orders p=3 rf=3','AssignReplicas orders-0 [b0,b1,b2]','ElectLeader orders-0 → b0 (epoch 1)','MoveReplica orders-2 b0→b3','ElectLeader orders-1 → b2 (epoch 2)'];return c[this.cmd++%c.length]}
  step(){
    this.t+=10;
    this.script.filter(s=>!s.done&&s.t<=this.t).forEach(s=>{s.done=true;this.act(s)});
    const due=this.msgs.filter(m=>m.arrive<=this.t).sort((a,b)=>a.arrive-b.arrive);this.msgs=this.msgs.filter(m=>m.arrive>this.t);due.forEach(m=>this.deliver(m));
    this.nodes.forEach(x=>{if(!x.up)return;
      if(x.role==='leader'){if(this.t>=x.hb+50){x.hb=this.t;this.bcast(x)}}
      else if(this.t>=x.deadline)this.elect(x)});
    const seen={};this.nodes.forEach(x=>{if(x.role==='leader'&&x.up){if(seen[x.term]!==undefined)this.vio.push(`two leaders in term ${x.term}`);seen[x.term]=x.id}});
  }
  advanceTo(T){while(this.t<T)this.step()}
}

 "to": "remote", "label": "upload", "kind": "data"}, {"from": "controller", "to": "leader", "label": "leaders", "kind": "ctl"}, {"from": "controller", "to": "reassign", "label": "placement", "kind": "ctl"}, {"from": "reassign", "to": "follower", "label": "copy", "kind": "ctl"}], "flow": [{"n": "producer", "t": "The producer batches records (and may compress them)."}, {"n": "partitioner", "t": "Each record's key is hashed to one partition."}, {"n": "idem", "t": "Idempotent producer: PID + sequence let the leader drop retries."}, {"n": "leader", "t": "The leader appends the record and assigns the next offset."}, {"n": "follower", "t": "Followers pull it; the ISR defines the high watermark."}, {"n": "consumers", "t": "Consumers fetch up to the high watermark and commit offsets."}, {"n": "retention", "t": "Old closed segments are deleted or moved to the remote tier."}, {"n": "remote", "t": "Cold history stays readable from the remote tier."}]};
