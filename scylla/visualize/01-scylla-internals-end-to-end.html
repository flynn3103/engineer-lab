<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scylla Internals End-to-End</title>
<link rel="stylesheet" href="../../assets/lab.css">
<style>
:root{--acc:#2f6fed;--acc2:#e25a1c}
@media(prefers-color-scheme:dark){:root{--acc:#6c9bff;--acc2:#ff7a3d}}
@media(max-width:820px){.g2{grid-template-columns:1fr}}
.sst{display:inline-block;border:2px solid var(--line);border-radius:7px;padding:3px 7px;margin:3px;font-family:ui-monospace,monospace;font-size:11px;background:var(--card);vertical-align:top}
.sst.in{border-color:var(--acc2);background:color-mix(in srgb,var(--acc2) 15%,var(--card))}
.sst.out{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.sst.skip{opacity:.45}
.le{display:inline-block;min-width:34px;text-align:center;font-family:ui-monospace,monospace;font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:1px 4px;margin:1px}
.le.c{border:2px solid var(--ok);font-weight:700}
/* Production tuning and incident comparisons */
.ops-panel{margin:18px 0;padding:20px}
.ops-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:20px}
.ops-controls{display:grid;gap:14px;align-content:start}
.ops-controls label{display:grid;gap:5px;border-bottom:1px solid var(--line);padding-bottom:13px;font-size:13px}
.ops-controls label:last-child{border:0}
.ops-controls select{width:max-content;max-width:100%}
.ops-controls small,.ops-muted{color:var(--mut);font-size:12px;line-height:1.5}
.ops-preview{min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px;font-size:13px}
.ops-preview h4{margin:0 0 12px}
.ops-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.ops-metrics div{border-top:2px solid var(--acc);padding-top:7px;min-width:0}
.ops-metrics b{display:block;font-size:17px}.ops-metrics span{display:block;font-size:11px;color:var(--mut)}
.ops-replicas{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.ops-replicas span{border:1px solid var(--line);border-radius:8px;padding:7px 11px;background:var(--card)}
.ops-replicas .hit{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--card))}
.ops-replicas .miss{border-color:var(--bad);opacity:.7}
.ops-bar{height:22px;display:flex;border-radius:5px;overflow:hidden;margin:10px 0}
.ops-bar span{min-width:0;display:grid;place-items:center;font-size:11px;background:var(--acc);color:white}
.ops-bar span+span{background:var(--soft);color:var(--ink)}
.ops-case-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 18px}
.ops-case-tabs button{font-size:12px;line-height:1.25;text-align:left}
.ops-case-tabs button[aria-selected="true"],.ops-case-tabs button[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card));font-weight:700}
.ops-incident h3{margin:0 0 5px}.ops-incident>p{margin:0 0 15px}
.ops-context{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin:12px 0}
.ops-context>div,.ops-fix{border:1px solid var(--line);border-radius:9px;padding:12px;min-width:0}
.ops-context h4,.ops-fix h4{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.ops-context p{font-size:13px;margin:0}.ops-context pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 6px;padding:9px;border-radius:6px;background:var(--soft)}
.ops-context small{font-size:11px;color:var(--mut)}
.ops-stage{border:1px solid var(--line);border-radius:11px;background:var(--bg);padding:14px;margin:15px 0}
.ops-stage-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ops-stage-head b{font-size:13px}.ops-stage-head .ops-case-tabs{margin:0}
.ops-stage-caption{font-size:12px;color:var(--mut);margin:10px 0 0}
.ops-chart{display:grid;gap:7px;margin:15px 0}
.ops-chart-row{display:grid;grid-template-columns:minmax(55px,95px) minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:11px}
.ops-chart-track{background:var(--soft);border-radius:5px;height:21px;overflow:hidden}
.ops-chart-track i{display:block;height:100%;background:var(--bad);border-radius:5px;min-width:3px}
.ops-stage.fixed .ops-chart-track i{background:var(--ok)}
.ops-chart-row strong{text-align:right;font-variant-numeric:tabular-nums}
.ops-node-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}
.ops-node{background:var(--card);border:2px solid var(--line);border-radius:9px;text-align:center;padding:12px 5px;min-width:0}
.ops-node.good{border-color:var(--ok)}.ops-node.bad{border-color:var(--bad)}.ops-node.muted{opacity:.55}
.ops-node b{display:block;font-size:14px}.ops-node span{font-size:11px;overflow-wrap:anywhere}
.ops-files{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;margin:16px 0}
.ops-file{display:grid;place-items:center;min-height:37px;border:1px solid var(--line);border-radius:4px;font-size:10px;background:var(--card)}
.ops-file.open{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}.ops-file.needed{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}.ops-file.skip{opacity:.45}
.ops-file-summary{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut)}
.ops-time{display:flex;align-items:stretch;gap:6px;margin:16px 0;overflow-x:auto}
.ops-time-point{flex:1;min-width:72px;border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:6px;padding:8px;background:var(--card);font-size:11px}
.ops-time-point.bad{border-top-color:var(--bad)}.ops-time-point.good{border-top-color:var(--ok)}
.ops-time-point b{display:block;font-size:10px;color:var(--mut);margin-bottom:5px}.ops-time-arrow{align-self:center;color:var(--mut)}
.ops-quorum{display:grid;grid-template-columns:1fr 25px 1fr;gap:8px;align-items:center;margin:16px 0}
.ops-quorum-side{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:12px;text-align:center;font-size:12px}
.ops-quorum-side b{display:block;font-size:24px}.ops-quorum-side.bad{border-color:var(--bad)}.ops-quorum-side.good{border-color:var(--ok)}
.ops-fix ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:13px}.ops-fix li::marker{color:var(--acc)}
.ops-evidence{background:var(--soft);border-radius:8px;padding:11px;font-size:12px;margin-top:12px}
.ops-evidence p{margin:5px 0}.ops-evidence a{overflow-wrap:anywhere}
@media(max-width:760px){.ops-grid,.ops-context{grid-template-columns:1fr}.ops-panel{padding:14px}.ops-files{grid-template-columns:repeat(6,minmax(0,1fr))}.ops-node-grid{gap:4px}.ops-node{padding:8px 2px}.ops-case-tabs[role=tablist]{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}.ops-case-tabs[role=tablist] button{flex:none;white-space:nowrap}}

</style>

<body>
<div id="dataSlot" hidden>
<div class="sample-row"><span class="lbl">Every chapter below runs on a dataset:</span>
  <button data-sample="orders">Orders (CSV)</button><button data-sample="sensors">Sensors (CSV)</button><button data-sample="users">Users (JSON)</button></div>
<details class="mydata"><summary>Use your own data and pick the keys</summary>
  <div class="bar"><input type="file" id="file" accept=".csv,.json,.jsonl,.ndjson"><label>Format <select id="fmt"><option value="auto">auto-detect</option><option value="csv">CSV</option><option value="jsonl">JSONL</option><option value="json">JSON array</option></select></label></div>
  <textarea id="src" rows="5" spellcheck="false"></textarea>
  <div class="note" id="srcInfo"></div>

    <span>Partition key <select id="pk"></select></span>

    <span class="note" style="margin:0">RF = 3 · one table · virtual clock (1 op = 1 s)</span>
  </div>
</details>

<script src="../../assets/lab.js"></script>
<script>
const STORY={
 system:'ScyllaDB',
 title:'Build <span>ScyllaDB</span> from scratch',
 lead:'Start from a real production problem. Watch the obvious fix break. Then see the design real systems use, running on your own data.',
 problem:{
  scene:[
   'You run the <b>orders service</b> of a marketplace: 40 million customers, 30,000 writes per second at peak, and a machine dies somewhere in the fleet about once a week.',
   'Product says: <i>"Orders must always be accepted, never be lost, and the app must stay fast when we double the traffic."</i> Your job is to design the storage layer.'],
  musts:[
   '<b>Always writable.</b> One dead machine must not stop orders.',
   '<b>Scales out.</b> Double the traffic by adding machines, not by a heroic migration.',
   '<b>Never loses an acknowledged write</b>, even if the process is killed a millisecond later.',
   '<b>Reads stay fast</b> while data piles up on disk.',
   '<b>Deleted stays deleted</b>, on every copy.'],
  naive:{title:'Your first instinct: one big PostgreSQL',text:'One primary takes all writes, a few replicas serve reads. It works on day one, then:',
   breaks:['The single primary saturates: you can only scale it <i>up</i>, and there is a ceiling.','When the primary dies, writes stop until a failover finishes.','Sharding it by hand means resharding downtime every time you grow.']},
  quest:'Rebuild the core of ScyllaDB in 8 chapters. In each one you meet a problem, try the naive fix, see it fail, then see how the real design survives.'},
 overview:{title:'The whole system on one page',lead:'Before the details, see how a request travels. Press <b>Trace a request</b> to follow one write through the system, or tap a component to see what it receives and sends. Colors match the chapters.'},
 chapters:[
  {ask:'Which machine owns customer C101’s orders?',
   why:'40 million customers cannot live on one machine. Every client and every node must agree on the owner of a row <b>without asking anyone</b>.',
   v0:{name:'Hash the key and take the remainder',code:'owner = hash(key) % nodes.length',breaks:'Add a 5th node and the divisor changes from 4 to 5: roughly <b>80% of keys get a new owner</b>, so you must move most of your data. (The deep dive in this chapter measures this on your data.)'},
   design:'Hash keys onto a ring, place nodes on the same ring. A key belongs to the next node clockwise, so a new node only steals a slice from its neighbours.',
   predict:{q:'You add a 5th node to a 4-node ring. About how many keys change owner?',opts:['About 80%, like <code>hash % N</code>','About 20%: only the slice the new node takes over','None: the ring never moves keys'],ans:1,why:'Only the token range the new node takes over moves, about 1/N of the data. That is the whole point of consistent hashing.'},
   build:{intro:'You need four small pieces, each testable on its own:',
    steps:['<b>Canonical key encoding.</b> Length-prefix every key part, so <code>("ab","c")</code> and <code>("a","bc")</code> can never produce the same bytes.','<b>Token.</b> Hash the encoded key to a 64-bit integer.','<b>Ring.</b> A sorted list of <code>(token, node)</code> endpoints; give each node several <i>vnodes</i> so load evens out.','<b>Lookup.</b> Binary-search the first endpoint at or after the token (wrap around). Replicas are the next distinct nodes clockwise.'],
    code:'token = hash64(encode(partitionKey))\ni = lowerBound(ring, token)           // wraps to 0 at the end\nowner = ring[i % ring.length].node\nreplicas = next RF distinct nodes clockwise from i',
    rule:'Every client and every node computes the <b>same token and the same owner</b> from the same key bytes.'}},
  {ask:'A node dies in the middle of a write. Is the order lost?',
   why:'With one copy, yes. With several copies the question becomes: <b>how many must answer</b> before you tell the client OK? This chapter is about row data: quorum counts responses from replicas, but does not put concurrent writes into one agreed order.',
   v0:{name:'Write to the owner, replicate in the background',code:'owner.write(row)\nreturn OK            // replicas catch up later',breaks:'The owner can crash <b>after</b> the OK but before copying the row: an <b>acknowledged write is lost</b>. A read from a lagging replica returns stale data.'},
   design:'Any node can be the coordinator. It sends the write to all 3 replicas in parallel and answers once enough of them acknowledge (the consistency level).',
   predict:{q:'RF = 3. You write at ONE, then read at ONE from a different replica. Can the read return the old value?',opts:['Never: the write was acknowledged','Yes, if that replica missed or has not applied the write yet','Only if two nodes are down'],ans:1,why:'ONE only waits for a single replica. Another replica may not have the write yet, so ONE + ONE gives no overlap. QUORUM + QUORUM always overlaps (2 + 2 > 3).'},
   build:{steps:['The coordinator finds the replicas from the ring (chapter 1) and sends the mutation to <b>all</b> live ones.','Count ACKs; reply to the client when you have <code>need</code> of them.','Refuse early (<i>Unavailable</i>) if fewer than <code>need</code> replicas are alive.','Reads ask <code>need</code> replicas and return the <b>highest version</b>.'],
    code:'need = { ONE: 1, QUORUM: floor(rf/2)+1, ALL: rf }[cl]\nacks = sendToAll(replicas, mutation)\nif (acks >= need) reply(OK)\n// read: ask `need` replicas, return max(version)',
    rule:'<b>R + W &gt; RF</b>: a read set intersects the acknowledged write set for a completed write. Concurrent conflicting writes still need version conflict resolution; quorum overlap is not a total order or a transaction.'}},
  {ask:'The process is killed right after we said OK. Is the data still there?',
   why:'RAM is fast but forgets on a crash. Disk is durable but slow for random writes. A database needs both speed and durability.',
   v0:{name:'Update the row in place on disk',code:'page = disk.read(pageOf(key))\npage.update(row)\ndisk.write(page)',breaks:'Every write is a <b>random disk I/O</b>, which caps throughput. A crash halfway through writing a page can <b>corrupt</b> it.'},
   design:'Append writes to a sequential commit log, apply them to a sorted memtable, then flush immutable SSTables. This lab models sync-before-ACK for strict local crash durability; ScyllaDB’s periodic commitlog mode can ACK before fsync, while batch mode waits for the sync.',
   predict:{q:'In this lab’s sync-before-ACK mode, the node crashes right after ACK, before any flush. What does it recover?',opts:['Nothing: the memtable lived in RAM','Every acknowledged write: the commit log is replayed','Only what is already in SSTables'],ans:1,why:'In this mode the commit log was synced before ACK. Restart replays frames newer than the last flush and rebuilds the memtable.'},
   build:{steps:['<b>Commit log:</b> append <code>{seq,key,value,version}</code>, then <code>fsync</code>, then ACK.','<b>Memtable:</b> a sorted map; newest version of a key wins.','<b>Flush:</b> when the memtable passes its budget, write its sorted rows to a temp file, fsync, then publish it with an atomic manifest swap.','<b>Recovery:</b> load the manifest, replay only log frames with <code>seq &gt; flushedSeq</code>.'],
    code:'write(m): log.append(m); log.fsync(); memtable.put(m); ack()\nif (memtable.size > BUDGET):\n  sst = writeSorted(memtable.freeze())   // temp file + fsync\n  manifest.publish(sst, flushedSeq)      // atomic rename\n  log.truncate(flushedSeq)\nrecover(): replay log frames where seq > manifest.flushedSeq',
    rule:'For strict local durability, <b>ACK only after the log is durable</b>; retire log segments only after the SSTable is published. Check production commitlog_sync mode before assuming this guarantee.'}},
  {ask:'One row can live in the memtable and a dozen files. How do we read it without opening them all?',
   why:'Every flush creates another file. Newer data shadows older data, so a read must still find the newest version of the key.',
   v0:{name:'Scan every file and merge',code:'for f in [memtable, ...sstables]:\n  scan(f).filter(key)',breaks:'Cost grows with <b>files &times; size</b> and gets worse with every flush. Most files do not even contain the key.'},
   design:'Give each SSTable a Bloom filter (a cheap "definitely not here") and a sparse index (jump close to the key), then merge only the few candidates and cache hot results.',
   predict:{q:'A Bloom filter answers "no" for SSTable 3. What does that guarantee?',opts:['The key might still be there','The key is definitely not in that file','The key is there but deleted'],ans:1,why:'Bloom filters have no false negatives. "No" is certain; "maybe" can be a false positive that costs one wasted index probe, never a wrong answer.'},
   build:{steps:['For each SSTable build a <b>Bloom filter</b> over its keys (bits per key is your RAM / accuracy knob).','Keep a <b>sparse index</b>: every Nth key with its file offset.','Read: ask every file whose Bloom says "maybe"; binary-search the sparse index and scan one small block.','Merge all candidate versions plus the memtable; the highest version (or tombstone) wins.','Optional cache, invalidated by a per-file generation number.'],
    code:'cands = [memtable] + [s for s in sstables if s.bloom.maybe(key)]\nversions = [c.lookup(key) for c in cands]   // sparse index inside\nreturn newest(versions)',
    rule:'<b>No false negatives:</b> a key that is stored must always answer "maybe".'}},
  {ask:'Flushes keep adding files, reads slow down, and old overwritten data fills the disk. Now what?',
   why:'Immutable files are great for writes and bad for accumulating. Something must tidy them in the background without changing what reads return.',
   v0:{name:'Either never merge, or merge everything every time',code:'// A: keep all files forever\n// B: every flush -> rewrite the whole dataset',breaks:'A: reads touch more and more files. B: you rewrite terabytes to absorb a few megabytes (huge <b>write amplification</b>).'},
   design:'Compaction merges sorted files in the background. Size-tiered (STCS) merges similar-size files, leveled (LCS) keeps non-overlapping levels, time-window (TWCS) groups by time. Each trades write, read and space amplification differently.',
   predict:{q:'Which strategy rewrites the same data the most (highest write amplification)?',opts:['STCS (size-tiered)','LCS (leveled)','TWCS (time-window)'],ans:1,why:'LCS keeps tight, non-overlapping levels, so data is rewritten each time it moves down a level: great reads, expensive writes. STCS is cheap to write but can need up to 2x space during a merge.'},
   build:{steps:['<b>Merge iterator:</b> k-way merge of sorted inputs; for equal keys the newest version wins.','Write the output sorted to a temp file, fsync, then <b>publish the new file set atomically</b> and delete inputs afterwards.','<b>Pick inputs</b> by strategy: STCS: &ge;4 files of similar size; LCS: L0 plus overlapping L1; TWCS: files inside one time window.','Test with an <b>oracle</b>: reads before and after compaction must be identical.'],
    code:'inputs = strategy.pick(files)\nout = kWayMerge(inputs, newestWins)\npublish(files - inputs + out)   // atomic\ndelete(inputs)',
    rule:'Compaction may <b>rearrange and drop provably dead data</b>, never change what a read returns.'}},
  {ask:'How do you delete a row that also lives in five immutable files and on three replicas?',
   why:'You cannot edit an SSTable, and a replica that was offline has never heard of the delete.',
   v0:{name:'Just remove the row',code:'memtable.remove(key)',breaks:'Older copies in other SSTables and on other replicas still hold the row. The next read or repair <b>resurrects</b> it.'},
   design:'A delete is a write: a tombstone with a newer version that shadows everything older. Compaction may only purge it once it is safe.',
   predict:{q:'Compaction merges 2 of 3 files and drops a tombstone. The third, older file still holds the original row. What does a read return?',opts:['Deleted','The old row comes back (resurrection)','An error'],ans:1,why:'Nothing shadows the old row any more. This is why tombstones must be kept until no older data can exist outside the compaction inputs.'},
   build:{steps:['<b>Delete</b> = write <code>{key, tombstone, version}</code>. <b>TTL</b> = write with an expiry; an expired cell reads as a tombstone.','A read treats the newest version as the answer, tombstone included.','<b>Purge rule:</b> drop a tombstone only if it is older than <code>gc_grace</code> <i>and</i> no overlapping data outside the inputs is older than it.','Run repair within <code>gc_grace</code> so every replica learns the tombstone.'],
    code:'canPurge(t) = t.age > GC_GRACE\n           && no file outside inputs overlaps t.key with older data',
    rule:'<b>Never drop a tombstone</b> while a value it shadows may still exist in a file or on a replica you did not merge.'}},
  {ask:'You add a node. How do you move data without stopping traffic or losing writes?',
   why:'Data must move while clients keep writing, and clients with a stale map must not write to the old owner after the cut-over.',
   v0:{name:'Pause, copy the ranges, resume',code:'pause()\ncopy(rangeFromOldOwner, newOwner)\nresume()',breaks:'<b>Downtime</b>. And if you do not pause, writes that land during the copy are missed, and stale clients keep writing to the old owner.'},
   design:'Split the table into tablets: token ranges that each carry their own replica set and an <b>epoch</b>. Moving a replica copies a snapshot, catches up, fences the old owner, then commits the new epoch.',
   predict:{q:'After a move, a client with an old epoch writes to the old owner. What should happen?',opts:['It is accepted and silently lost','It is rejected (fenced) and the client refreshes its tablet map','It is accepted on both owners'],ans:1,why:'Fencing: the old owner rejects any request carrying an older epoch, so a stale client can never split the data.'},
   build:{steps:['Tablet map: <code>[{range, replicas, epoch}]</code>.','<b>Move:</b> mark transition, stream a snapshot, stream changes since the snapshot (catch-up).','<b>Fence</b> the old replica (reject epoch &lt; new), then <b>commit the new epoch</b> in durable metadata.','Drop the old data. A crash at any step resumes or rolls back from durable state.'],
    code:'move(tablet, from, to):\n  stream(snapshot); stream(changesSince(snapshot))\n  fence(from, epoch+1)\n  metadata.commit(tablet, replicas=[..to..], epoch+1)',
    rule:'<b>Exactly one replica set is authoritative per epoch</b>, and epochs only increase.'}},
  {ask:'Who decides the tablet map when nodes disagree or the network splits?',
   why:'Tablet placement must have <b>one agreed order</b> of changes. Chapter 2 can acknowledge row writes on overlapping replica sets, but it cannot decide whether “move tablet” happened before or after “split tablet” when coordinators disagree.',
   v0:{name:'Let every node edit the map and gossip it',code:'node.map[tablet] = newReplicas\ngossip(node.map)',breaks:'A network split lets both sides change placement: <b>two owners for the same range</b>, and last-write-wins cannot repair that.'},
   design:'For the metadata in this model, Raft elects one leader per term and commits placement changes in log order after a majority stores them. The minority cannot commit a competing map; ordinary row writes continue through the chapter 2 path.',
   predict:{q:'A 5-member group splits into 2 | 3. Which side can commit new entries?',opts:['Both sides','Only the 3-member majority','Neither side'],ans:1,why:'Commit needs a majority (3 of 5). The 2-side cannot elect a leader or commit, so there is never a second authoritative history.'},
   build:{steps:['Persist <code>(currentTerm, votedFor, log)</code> before replying to anyone.','Follower &rarr; candidate on election timeout; vote only for a candidate whose log is at least as up to date.','Leader sends <code>AppendEntries</code> (also as heartbeat); followers truncate conflicts.','Commit index = highest index stored on a majority <i>in the current term</i>; apply entries in order.'],
    code:'onTimeout(): term++; vote(self); ask all RequestVote\nleader: AppendEntries(prevIdx, prevTerm, entries)\ncommitIdx = majority(matchIndex) where log[idx].term == term',
    rule:'A committed entry exists on a majority, so <b>every future leader contains it</b>.'}}
 ],
 extras:[]
};
</script>
<script src="./scylla-incidents.js"></script>
<script>
Lab.mount(STORY);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const J=x=>{try{return JSON.stringify(x)}catch{return String(x)}};
const pc=i=>`var(--p${((i%8)+8)%8})`,tc=i=>`var(--t${((i%8)+8)%8})`;
const cmp=(a,b)=>a<b?-1:a>b?1:0;
const short=(s,n=40)=>{s=String(s);return s.length>n?s.slice(0,n-1)+'…':s};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const enc8=new TextEncoder();

function nodePos(i,n){const a=(i/n)*2*Math.PI-Math.PI/2;return[200+130*Math.cos(a),130+90*Math.sin(a)]}

/* =========================================================

   ========================================================= */

  <h3>Same trace, three strategies (final state)</h3><table><tr><th>strategy</th><th class="n">files</th><th class="n">WA</th><th class="n">SA</th><th class="n">RA</th><th class="n">peak disk B</th><th>reads = oracle</th></tr>${['STCS','LCS','TWCS'].map(m).join('')}</table>

/* =========================================================
   PHASE 6: DELETES, TTL, TOMBSTONES
   ========================================================= */
function tombScenario(){
  const keys=S.keys,key=keys.includes(S.cfg.rkey)?S.cfg.rkey:keys[0],row=(S.cl.byKey.get(key).src),lbl=short(key.replace(/\d+:/g,'|'),20);
  const v1={id:1,key,pkey:'',row,ver:10,kind:'upsert',exp:null},isTtl=S.cfg.scen==='ttl';
  const v2=isTtl?{id:2,key,pkey:'',row:{...row,_v:2},ver:20,kind:'upsert',exp:25}:{id:2,key,pkey:'',row:null,ver:20,kind:'delete',exp:null};
  const filler={id:3,key:'zz-filler',pkey:'',row:{x:1},ver:21,kind:'upsert',exp:null},filler2={id:4,key:'zz-filler2',pkey:'',row:{x:2},ver:22,kind:'upsert',exp:null};
  const base=[{id:'S1',map:new Map([[key,v1],['aa-big',{id:5,key:'aa-big',row:{big:true},ver:5,kind:'upsert',exp:null}]])},{id:'S2',map:new Map([[key,v2]])},{id:'S3',map:new Map([[filler.key,filler],[filler2.key,filler2]])}];
  const files=base.map(b=>fileFrom(b.id,b.map)),now=S.cfg.tNow,gc=15,mode=S.cfg.purge;
  const ins=mode==='full'?files:[files[1],files[2]],others=files.filter(f=>!ins.includes(f));
  const merged=mergeMaps(ins);let decision='';
  const m=merged.get(key);
  if(isDead(m,now)||m.kind==='delete'){
    const aged=now-m.ver>=gc,older=others.some(x=>key>=x.minKey&&key<=x.maxKey&&x.minTS<m.ver);
    if(mode==='unsafe'){merged.delete(key);decision=`UNSAFE policy: drop the ${m.kind==='delete'?'tombstone':'expired cell'} as soon as it is compacted (ignores older files).`}
    else if(aged&&!older){merged.delete(key);decision=`Purge allowed: age ${now-m.ver} ≥ gc_grace ${gc} and no file outside the inputs can hold older data.`}
    else decision=`Keep the ${m.kind==='delete'?'tombstone':'expired cell'}: ${!aged?`age ${now-m.ver} < gc_grace ${gc}`:`file ${others.filter(x=>key>=x.minKey&&key<=x.maxKey&&x.minTS<m.ver).map(x=>x.id).join(',')} outside the inputs may still hold older data`}.`;
  }else decision='Winner is a live value: nothing to purge.';

  const readAfter=mergeMaps(after).get(key),readBefore=mergeMaps(files).get(key);

}
function draw6(p){

  <div class="caption ${t.ra==='live'&&t.mode!=='full'||(t.ra==='live'&&t.rb!=='live')?'bad':'good'}" style="${a>=3?'':'visibility:hidden'}">${t.rb!==t.ra?`<b>Read result changed by compaction: ${t.rb} → ${t.ra}.</b> That is data resurrection, which the purge guard exists to prevent.`:`Read result unchanged (${t.ra}): compaction preserved delete/TTL semantics.`}</div>
  <div class="note">Rule: a tombstone (or expired cell) may only be dropped when older than gc_grace <i>and</i> no file outside the compaction can contain older data. ${t.isTtl?'For TTL, the expired winner still hides older versions: it must not fall back to v1.':''} Try modes <b>unsafe</b> and <b>full merge</b> and move <b>now</b> to see the difference.</div>`;

/* =========================================================

   ========================================================= */
let TMS=null,migAnim=null;

function tabletRows(tabs){
  const rows=new Map(tabs.map(t=>[t.id,0]));S.parts.forEach(q=>{const t=tabletOf(tabs,q.tok);rows.set(t.id,(rows.get(t.id)||0)+q.rows)});return rows;

  S.parts.forEach(q=>{strip+=`<circle cx="${10+Number(q.tok*880n/MAX)}" cy="58" r="3.5" fill="${tc(tabletOf(tabs,q.tok).rep[0])}"/>`});
  strip+=`<text x="10" y="76" style="fill:var(--mut);font-size:10px">token 0</text><text x="890" y="76" text-anchor="end" style="fill:var(--mut);font-size:10px">2⁶⁴ · dots = your partitions</text></svg>`;
  let mv='';
  if(mig){
    const cr=S.cfg.mcrash,crashed=cr>0&&step>=cr,committed=cr===0||cr>6;

    if(crashed&&p>=1)mv+=`<div class="caption ${cr<6?'bad':'good'}">${cr<6?`Crash at step ${cr} (before the durable commit): <b>abort</b>. The map still says ${mig.before.map(nn).join(',')} (epoch ${mig.epoch}); the provisional copy on ${nn(mig.to)} is discarded and acknowledged writes remain on the old replicas.`:`Crash at step ${cr} (after the durable commit): <b>resume forward</b>. Epoch ${mig.epoch+1} is durable, ${nn(mig.to)} is authoritative; never roll back to the old replica just because the caller got no reply.`}</div>`;
  }

  return`<div class="caption">Placement map epoch <b>${TMS.epoch}</b> · ${tabs.length} tablets · every token belongs to exactly one tablet; each tablet has 3 replicas on distinct nodes.</div>${strip}
  <div class="g2"><div><table><tr><th>tablet</th><th>token range</th><th>replicas</th><th class="n">rows</th></tr>${tabs.map(t=>`<tr><td>${t.id}</td><td class="mono">${tokHex(t.lo)} – ${tokHex(t.hi)}</td><td>${t.rep.map(nn).join(', ')}</td><td class="n">${rows.get(t.id)||0}</td></tr>`).join('')}</table></div>
  <div><h3 style="margin-top:0">Stored rows per node (replicas counted)</h3>${load.map((l,i)=>`<div class="lrow"><b style="color:${tc(i)}">node ${nn(i)}</b><span class="bar2" style="width:${l/mx*60}%;background:${tc(i)}"></span><span class="mono">${l}</span></div>`).join('')}<div class="note">skew = max/min = ${(mx/Math.max(1,Math.min(...load))).toFixed(2)}</div><h3>Recent changes</h3>${log}</div></div>${mv}

}
function doSplit(){
  if(!TMS)initTMS();const t=TMS.tablets.find(x=>x.id===S.cfg.mtab)||TMS.tablets[0];
  const mid=(t.lo+t.hi)/2n,a={...t,id:'T'+TMS.next++,hi:mid,epoch:TMS.epoch+1},b={...t,id:'T'+TMS.next++,lo:mid,epoch:TMS.epoch+1};
  TMS.tablets.splice(TMS.tablets.indexOf(t),1,a,b);TMS.epoch++;TMS.log.push(`split ${t.id} at ${tokHex(mid)} → ${a.id}, ${b.id} (epoch ${TMS.epoch})`);OPT.mtab=a.id;showPhase(6);

function doMove(){
  if(!TMS)initTMS();const t=TMS.tablets.find(x=>x.id===S.cfg.mtab)||TMS.tablets[0],from=S.cfg.mfrom,to=S.cfg.mto;
  if(!t.rep.includes(from)||t.rep.includes(to)){TMS.log.push(`invalid: ${t.id} replicas ${t.rep.map(nn).join(',')}; need a current replica as source and a non-replica as destination`);showPhase(6);return}

    if(ok&&migAnim){const cr=S.cfg.mcrash;if(cr===0||cr>6){t.rep=after;t.epoch=++TMS.epoch;TMS.log.push(`moved ${t.id}: ${before.map(nn)} → ${after.map(nn)} (epoch ${TMS.epoch}); stale-epoch requests now rejected`)}else TMS.log.push(`move of ${t.id} aborted at step ${cr}; map unchanged`)}
    migAnim=null;paintView(1);showPhase(6);

/* =========================================================
   PHASE 8: RAFT (new) — real simulator, deterministic
   ========================================================= */
class Raft{
  constructor(n,seed){this.n=n;this.seed=seed;this.reset()}
  reset(){this.rnd=lcg(this.seed);this.t=0;this.msgs=[];this.ev=[];this.script=[];this.vio=[];this.maxCommit=0;this.cl={};this.cmd=0;this.iso=null;this.elections=0;
    this.nodes=Array.from({length:this.n},(_,i)=>({id:i,up:true,grp:0,role:'follower',term:0,voted:null,log:[],commit:0,deadline:this.et(),hb:0,next:[],match:[],votes:0}))}
  et(){return this.t+150+Math.floor(this.rnd()*150)}
  maj(){return Math.floor(this.n/2)+1}
  log(s){this.ev.push(`${(this.t/1000).toFixed(2)}s  ${s}`);if(this.ev.length>60)this.ev.shift()}
  leader(){let b=null;this.nodes.forEach(x=>{if(x.up&&x.role==='leader'&&(!b||x.term>b.term))b=x});return b}
  send(f,to,type,pl){const a=this.nodes[f],b=this.nodes[to];if(!a.up)return;this.msgs.push({f,to,type,pl,sent:this.t,arrive:this.t+25+Math.floor(this.rnd()*30)})}
  become(x,term){if(term>x.term){x.term=term;x.voted=null}if(x.role!=='follower'){this.log(`${nn(x.id)} steps down (term ${x.term})`)}x.role='follower';x.deadline=this.et()}
  elect(x){x.term++;x.role='candidate';x.voted=x.id;x.votes=1;x.deadline=this.et();this.elections++;this.log(`${nn(x.id)} timed out → candidate, term ${x.term}`);
    this.nodes.forEach(o=>{if(o.id!==x.id)this.send(x.id,o.id,'RV',{term:x.term,li:x.log.length,lt:x.log.length?x.log[x.log.length-1].term:0})});
    if(x.votes>=this.maj())this.win(x)}
  win(x){x.role='leader';x.next=this.nodes.map(()=>x.log.length+1);x.match=this.nodes.map(()=>0);x.match[x.id]=x.log.length;
    this.log(`${nn(x.id)} elected LEADER for term ${x.term} (${x.votes}/${this.n} votes)`);
    const prev=this.cl;for(let i=1;i<=this.maxCommit;i++){if(this.cl[i]&&(!x.log[i-1]||J(x.log[i-1])!==this.cl[i]))this.vio.push(`leader ${nn(x.id)} lacks committed entry ${i}`)}
    x.log.push({term:x.term,cmd:'NOOP'});x.match[x.id]=x.log.length;x.hb=this.t;this.bcast(x)}
  bcast(x){this.nodes.forEach(o=>{if(o.id!==x.id)this.ae(x,o.id)})}
  ae(x,to){const ni=x.next[to],pi=ni-1,pt=pi>0?x.log[pi-1].term:0;this.send(x.id,to,'AE',{term:x.term,pi,pt,ents:x.log.slice(ni-1,ni+2),lc:x.commit})}
  advance(x){for(let N=x.log.length;N>x.commit;N--){if(x.log[N-1].term!==x.term)break;const c=x.match.filter(m=>m>=N).length;if(c>=this.maj()){x.commit=N;this.log(`leader ${nn(x.id)} commits index ${N} (${c}/${this.n} stored it)`);break}}}
  recordCommit(x){for(let i=1;i<=x.commit;i++){const e=J(x.log[i-1]);if(!this.cl[i])this.cl[i]=e;else if(this.cl[i]!==e)this.vio.push(`committed entry ${i} differs on ${nn(x.id)}`)}this.maxCommit=Math.max(this.maxCommit,x.commit)}
  deliver(m){
    const x=this.nodes[m.to],f=this.nodes[m.f];if(!x.up||x.grp!==f.grp)return;
    const p=m.pl;
    if(m.type==='RV'){
      if(p.term>x.term)this.become(x,p.term);
      const myLT=x.log.length?x.log[x.log.length-1].term:0,upToDate=p.lt>myLT||(p.lt===myLT&&p.li>=x.log.length);
      const grant=p.term===x.term&&(x.voted===null||x.voted===m.f)&&upToDate;
      if(grant){x.voted=m.f;x.deadline=this.et()}
      this.send(x.id,m.f,'RVR',{term:x.term,grant});
    }else if(m.type==='RVR'){
      if(p.term>x.term){this.become(x,p.term);return}
      if(x.role==='candidate'&&p.term===x.term&&p.grant){x.votes++;if(x.votes>=this.maj())this.win(x)}
    }else if(m.type==='AE'){
      if(p.term<x.term){this.send(x.id,m.f,'AER',{term:x.term,ok:false,mi:0});return}
      if(p.term>x.term||x.role!=='follower')this.become(x,p.term);x.deadline=this.et();
      if(p.pi>0&&(x.log.length<p.pi||x.log[p.pi-1].term!==p.pt)){this.send(x.id,m.f,'AER',{term:x.term,ok:false,mi:Math.min(x.log.length,p.pi-1)});return}
      p.ents.forEach((e,i)=>{const idx=p.pi+1+i;if(x.log.length>=idx&&x.log[idx-1].term!==e.term){this.log(`${nn(x.id)} truncates conflicting log from index ${idx}`);x.log.length=idx-1}if(x.log.length<idx)x.log.push(e)});
      const mi=p.pi+p.ents.length;if(p.lc>x.commit){x.commit=Math.min(p.lc,mi);this.recordCommit(x)}
      this.send(x.id,m.f,'AER',{term:x.term,ok:true,mi});
    }else if(m.type==='AER'){

fe to purge.", "phase": 5}, {"id": "compact", "x": 630, "y": 335, "w": 150, "h": 60, "label": "Compaction", "sub": "STCS \u00b7 LCS \u00b7 TWCS", "desc": "Background merging of SSTables to bound read cost and space, without changing what reads return.", "phase": 4}, {"id": "tablets", "x": 850, "y": 75, "w": 130, "h": 64, "label": "Tablets", "sub": "ranges + epoch", "desc": "Per-table token ranges with their own replica sets, split and moved by a journaled migration protocol.", "phase": 6}, {"id": "raft", "x": 850, "y": 260, "w": 130, "h": 64, "label": "Raft group", "sub": "agreed metadata", "desc": "A replicated log that gives the cluster one agreed order for metadata such as tablet placement epochs.", "phase": 7}], "edges": [{"from": "client", "to": "coord", "label": "request", "kind": "data"}, {"from": "ring", "to": "coord", "label": "owner + replicas", "kind": "ctl"}, {"from": "coord", "to": "commitlog", "label": "mutation (CL ACKs)", "kind": "data"}, {"from": "commitlog", "to": "memtable", "label": "apply", "kind": "data"}, {"from": "memtable", "to": "sst", "label": "flush", "kind": "data"}, {"from": "coord", "to": "read", "label": "read at CL", "kind": "data"}, {"from": "read", "to": "sst", "label": "seek", "kind": "data"}, {"from": "sst", "to": "compact", "label": "inputs", "kind": "data", "bend": 22}, {"from": "compact", "to": "sst", "label": "output", "kind": "data", "bend": 22}, {"from": "tomb", "to": "compact", "label": "purge", "kind": "ctl"}, {"from": "tomb", "to": "read", "label": "masks", "kind": "ctl"}, {"from": "tablets", "to": "ring", "label": "replaces static ring", "kind": "ctl", "bend": 95}, {"from": "raft", "to": "tablets", "label": "agrees placement epochs", "kind": "ctl"}], "flow": [{"n": "client", "t": "A client writes a row."}, {"n": "ring", "t": "The partition key is hashed to a token that names 3 replicas."}, {"n": "coord", "t": "The coordinator fans the mutation out and waits for CL acknowledgements."}, {"n": "commitlog", "t": "In this lab, each replica appends and syncs the commitlog before ACK."}, {"n": "memtable", "t": "Then applies it to the memtable and ACKs."}, {"n": "sst", "t": "A full memtable is flushed to an immutable SSTable."}, {"n": "compact", "t": "Compaction merges SSTables in the background."}, {"n": "read", "t": "Later reads use Bloom filters and indexes to avoid most files, then merge the winner."}]};

/* Production tuning: small, explicit models rather than latency predictions. */
const TUNE_DEFAULTS={write:'QUORUM',read:'QUORUM',down:1,bloom:0.01,strategy:'STCS',workload:'write',grace:10,repair:7};
const tune={...TUNE_DEFAULTS};
const TUNE_PANELS=[
 {id:'consistency',title:'1 · Replica consistency',sub:'How many replicas must answer?',controls:[
  ['write','Write CL',['ONE','QUORUM','ALL'],'Acknowledgements required for a completed write.'],
  ['read','Read CL',['ONE','QUORUM','ALL'],'Responses reconciled for a read.'],
  ['down','Failed replicas',[0,1,2],'Assume RF = 3 for one partition.']]},
 {id:'bloom',title:'2 · Bloom filter',sub:'Memory against unnecessary SSTable probes',controls:[
  ['bloom','bloom_filter_fp_chance',[0.1,0.01,0.001],'Target false-positive chance for a key absent from an SSTable.']]},
 {id:'compaction',title:'3 · Compaction strategy',sub:'Match file layout to the workload',controls:[
  ['strategy','Table strategy',['STCS','LCS','TWCS'],'Changing strategy on a real table can trigger substantial recompaction.'],
  ['workload','Workload',['write','read','ttl'],'write = frequent updates · read = point reads · ttl = mostly append-only TTL.']]},
 {id:'deletes',title:'4 · Tombstone grace',sub:'Keep deletes long enough for repair',controls:[
  ['grace','gc_grace_seconds (days)',[1,3,10,30],'Illustrates timeout-based tombstone GC; repair-based mode follows different rules.'],
  ['repair','Full repair interval (days)',[1,3,7,14,30],'Use the longest real interval, including likely delays.']]}
];
const TUNE_LABEL={write:'Write CL',read:'Read CL',down:'Failed replicas',bloom:'bloom_filter_fp_chance',strategy:'Table strategy',workload:'Workload',grace:'gc_grace_seconds (days)',repair:'Full repair interval (days)'};
function tuneControl([id,,values,help]){
  return `<label for="tune-${id}"><b>${TUNE_LABEL[id]}</b><select id="tune-${id}" data-tune="${id}">${values.map(v=>`<option value="${v}" ${tune[id]===v?'selected':''}>${v}</option>`).join('')}</select><small>${help}</small></label>`;
}
const tuneMetric=(value,label)=>`<div><b>${value}</b><span>${label}</span></div>`;
function tuneRender(){
  const need=x=>x==='ONE'?1:x==='ALL'?3:2,live=3-tune.down,w=need(tune.write),r=need(tune.read),wOK=live>=w,rOK=live>=r,overlap=w+r>3;
  $('#tune-preview-consistency').innerHTML=`<h4>RF = 3 · ${live} live replica${live===1?'':'s'}</h4><div class="ops-replicas">${[0,1,2].map(i=>`<span class="${i<live?'hit':'miss'}">Replica ${i+1} ${i<live?'✓':'✕'}</span>`).join('')}</div>
    <div class="ops-metrics">${tuneMetric(w+'/3','write ACKs needed')}${tuneMetric(r+'/3','read replies needed')}${tuneMetric(w+r+' > 3',overlap?'sets must overlap':'overlap not guaranteed')}</div>
    <p>${wOK?'Write can complete.':'Write is unavailable.'} ${rOK?'Read can complete.':'Read is unavailable.'} ${wOK&&rOK&&overlap?'A later read must contact at least one replica from a completed write set, assuming the same replica set and no competing writes.':'This choice does not give a successful overlapping read and write under the selected failures.'}</p>
    <p class="ops-muted">Overlap is about a completed write and later read. It does not order concurrent writes, repair missed replicas, or replace Raft for metadata.</p>`;
  const p=+tune.bloom,bits=-Math.log(p)/Math.LN2**2,probes=Math.round(1000*12*p),width=Math.min(100,bits/16*100);
  $('#tune-preview-bloom').innerHTML=`<h4>1,000 absent-key reads across 12 SSTables</h4><div class="ops-bar" role="img" aria-label="${bits.toFixed(1)} approximate bits per key"><span style="width:${width}%">${bits.toFixed(1)} bits/key</span><span style="flex:1">filter memory</span></div>
    <div class="ops-metrics">${tuneMetric((12000-probes).toLocaleString(),'expected files skipped')}${tuneMetric(probes.toLocaleString(),'expected false probes')}${tuneMetric('0','false negatives')}</div>
    <p>Lowering the target from 0.1 to 0.001 spends roughly 3× as many filter bits per key to avoid most wasted probes. It cannot fix reads that touch many SSTables containing the key.</p>
    <p class="ops-muted">Illustration: 12,000 independent absent-key checks; expected probes = checks × target probability. Actual filter size and observed rate depend on the table and data.</p>`;
  const profiles={STCS:{read:3,write:1,space:3,desc:'Merge similar-sized files. Low rewrite cost, but overlapping files raise read cost and large merges need disk headroom.'},LCS:{read:1,write:3,space:1,desc:'Non-overlapping levels reduce point-read work and space overhead, at the cost of more rewrites.'},TWCS:{read:2,write:1,space:1,desc:'Group mostly append-only TTL data by time so expired windows can be dropped together. Late updates and mixed TTLs can block that.'}},a=profiles[tune.strategy];
  const fit=tune.workload==='write'?tune.strategy==='STCS':tune.workload==='read'?tune.strategy==='LCS':tune.strategy==='TWCS';
  const bar=(n,color)=>`<div class="ops-bar" aria-label="${n} of 3 relative cost"><span style="width:${n/3*100}%;background:${color}">${'●'.repeat(n)}</span><span style="flex:1"></span></div>`;
  $('#tune-preview-compaction').innerHTML=`<h4>${tune.strategy} · ${fit?'good starting fit':'check this mismatch'}</h4><p>${a.desc}</p>
    <div class="ops-metrics">${tuneMetric(a.read+'/3','relative read work')}${tuneMetric(a.write+'/3','relative rewrite work')}${tuneMetric(a.space+'/3','relative disk pressure')}</div><b>Read work</b>${bar(a.read,'var(--acc)')}<b>Rewrite work</b>${bar(a.write,'var(--acc2)')}
    <p>${fit?'This matches the selected workload as a starting hypothesis.':'For this workload, test '+(tune.workload==='write'?'STCS':tune.workload==='read'?'LCS':'TWCS')+' as a starting hypothesis.'} Measure SSTables per read, compaction backlog, write throughput and free disk before changing a real table.</p>
    <p class="ops-muted">The 1–3 marks show direction only; they are not benchmark results or predicted latency. TWCS assumes time-ordered, mostly immutable data with consistent TTL.</p>`;
  const safe=+tune.repair<+tune.grace;
  $('#tune-preview-deletes').innerHTML=`<h4>Repair must complete before the grace window closes</h4><div class="ops-bar" role="img" aria-label="repair every ${tune.repair} days; grace ${tune.grace} days"><span style="width:${Math.min(100,tune.repair/Math.max(tune.grace,tune.repair)*100)}%;background:${safe?'var(--ok)':'var(--bad)'}">repair ${tune.repair}d</span><span style="flex:1">grace ${tune.grace}d</span></div>
    <div class="ops-metrics">${tuneMetric(tune.grace+'d','grace window')}${tuneMetric(tune.repair+'d','repair interval')}${tuneMetric(safe?'inside':'too late','schedule check')}</div>
    <p>${safe?'The example repair schedule fits within the grace window. Leave time for delays and verify every replica was repaired.':'The example repair schedule can miss the grace window. An offline replica may retain an old value after the delete marker is purged.'}</p>
    <p class="ops-muted">This timing check is necessary for timeout-based GC, not sufficient: overlapping SSTables, actual repair completion and replica outages matter. Tablets may use repair-based tombstone GC instead.</p>`;
}

function mountOperations(){
  $('#build').remove();$('#capstone').remove();$('#chDeepBox')?.remove();$('#deepStore')?.remove();
  $('nav a[href="#build"]')?.remove();const nav=$('nav a[href="#capstone"]');if(nav){nav.href='#parameter-tuning';nav.textContent='Parameter tuning'}
  $('.foot').insertAdjacentHTML('beforebegin',`<section class="sec" id="parameter-tuning"><div class="sec-h"><div class="kick">Parameter tuning</div><h2>Change a parameter. See the consequence.</h2><p>Start from a symptom, adjust one setting, then check the production metric. These small models explain direction and safety rules; they do not predict latency or replace a load test.</p></div>
    <div class="bar"><button id="tune-reset">Reset parameters</button><span class="ops-muted">Examples use RF = 3, one datacenter and a simplified workload.</span></div>
    ${TUNE_PANELS.map(p=>`<article class="card ops-panel"><h3>${p.title}</h3><p class="ops-muted">${p.sub}</p><div class="ops-grid"><div class="ops-controls">${p.controls.map(tuneControl).join('')}</div><div class="ops-preview" id="tune-preview-${p.id}" aria-live="polite"></div></div></article>`).join('')}
    <p class="ops-muted">Official references: <a href="https://docs.scylladb.com/manual/stable/cql/consistency.html">consistency levels</a> · <a href="https://docs.scylladb.com/manual/stable/cql/ddl.html">table options</a> · <a href="https://docs.scylladb.com/manual/stable/architecture/compaction/compaction-strategies.html">compaction strategies</a> · <a href="https://docs.scylladb.com/manual/stable/kb/gc-grace-seconds.html">repair and gc_grace_seconds</a>.</p></section>`);
  $('#parameter-tuning').addEventListener('change',e=>{const el=e.target.closest('[data-tune]');if(!el)return;const id=el.dataset.tune;tune[id]=typeof TUNE_DEFAULTS[id]==='number'?+el.value:el.value;tuneRender()});
  $('#tune-reset').onclick=()=>{Object.assign(tune,TUNE_DEFAULTS);$$('[data-tune]').forEach(el=>el.value=tune[el.dataset.tune]);tuneRender()};
  $('#chTrade').addEventListener('click',e=>{const c=e.target.closest('[data-case]'),f=e.target.closest('[data-fixed]');if(!c&&!f)return;const k=activeIncidentChapter,state=incidentState[k];if(!state)return;if(c){state.index=+c.dataset.case;state.fixed=false}else state.fixed=f.dataset.fixed==='true';renderIncidents(k,$('#chTrade'));$('#chTrade').querySelector(c?`[data-case="${state.index}"]`:`[data-fixed="${state.fixed}"]`)?.focus({preventScroll:true})});
  $('#chTrade').addEventListener('keydown',e=>{const tab=e.target.closest('[data-case]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const tabs=[...$('#chTrade').querySelectorAll('[data-case]')],i=tabs.indexOf(tab),next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[next].click()});
  tuneRender();
}
Lab.onStop(()=>{rsLive=false;rsAnim=false;migAnim=null});
Lab.start({phases:PHASES,ovs:OVS,ctl:ctlHTML,state:()=>S,renderTrade:renderIncidents,beforePlay:k=>{if(k===7){rsInit(S.cfg.raftScen);rsAnim=true}},afterPlay:k=>{if(k===7)rsAnim=false}});
mountOperations();
</script>
