<body>
<div id="dataSlot" hidden>
<div class="sample-row"><span class="lbl">Every chapter below runs on a dataset:</span>
  <button data-sample="orders">Orders (CSV)</button><button data-sample="sensors">Sensors (CSV)</button><button data-sample="users">Users (JSON)</button></div>
<details class="mydata"><summary>Use your own data and pick the keys</summary>
  <div class="bar"><input type="file" id="file" accept=".csv,.json,.jsonl,.ndjson"><label>Format <select id="fmt"><option value="auto">auto-detect</option><option value="csv">CSV</option><option value="jsonl">JSONL</option><option value="json">JSON array</option></select></label></div>

    <span>Partition key <select id="pk"></select></span>
    <span>Clustering key <select id="ck"></select></span>

    <span class="note" style="margin:0">RF = 3 · one table · virtual clock (1 op = 1 s)</span>
  </div>

<script src="../../assets/lab.js"></script>
<script>
const STORY={
 system:'ScyllaDB',
 title:'Build <span>ScyllaDB</span> from scratch',
 lead:'Start from a real production problem. Watch the obvious fix break. Then see the design real systems use, running on your own data.',
 problem:{
  scene:[
   'You run the <b>orders service</b> of a marketplace: 40 million customers, 30,000 writes per second at peak, and a machine dies somewhere in the fleet about once a week.',
   'Product says: <i>"Orders must always be accepted, never be lost, and the app must stay fast when we double the traffic."</i> Your job is to design the storage layer.'],
  musts:[
   '<b>Always writable.</b> One dead machine must not stop orders.',
   '<b>Scales out.</b> Double the traffic by adding machines, not by a heroic migration.',
   '<b>Never loses an acknowledged write</b>, even if the process is killed a millisecond later.',
   '<b>Reads stay fast</b> while data piles up on disk.',
   '<b>Deleted stays deleted</b>, on every copy.'],
  naive:{title:'Your first instinct: one big PostgreSQL',text:'One primary takes all writes, a few replicas serve reads. It works on day one, then:',
   breaks:['The single primary saturates: you can only scale it <i>up</i>, and there is a ceiling.','When the primary dies, writes stop until a failover finishes.','Sharding it by hand means resharding downtime every time you grow.']},
  quest:'Rebuild the core of ScyllaDB in 8 chapters. In each one you meet a problem, try the naive fix, see it fail, then see how the real design survives.'},
 overview:{title:'The whole system on one page',lead:'Before the details, see how a request travels. Press <b>Trace a request</b> to follow one write through the system, or tap a component to see what it receives and sends. Colors match the chapters.'},
 chapters:[
  {ask:'Which machine owns customer C101’s orders?',
   why:'40 million customers cannot live on one machine. Every client and every node must agree on the owner of a row <b>without asking anyone</b>.',
   v0:{name:'Hash the key and take the remainder',code:'owner = hash(key) % nodes.length',breaks:'Add a 5th node and the divisor changes from 4 to 5: roughly <b>80% of keys get a new owner</b>, so you must move most of your data. (The deep dive at the bottom of the page measures this on your data.)'},
   design:'Hash keys onto a ring, place nodes on the same ring. A key belongs to the next node clockwise, so a new node only steals a slice from its neighbours.',
   predict:{q:'You add a 5th node to a 4-node ring. About how many keys change owner?',opts:['About 80%, like <code>hash % N</code>','About 20%: only the slice the new node takes over','None: the ring never moves keys'],ans:1,why:'Only the token range the new node takes over moves, about 1/N of the data. That is the whole point of consistent hashing.'},
   build:{intro:'You need four small pieces, each testable on its own:',
    steps:['<b>Canonical key encoding.</b> Length-prefix every key part, so <code>("ab","c")</code> and <code>("a","bc")</code> can never produce the same bytes.','<b>Token.</b> Hash the encoded key to a 64-bit integer.','<b>Ring.</b> A sorted list of <code>(token, node)</code> endpoints; give each node several <i>vnodes</i> so load evens out.','<b>Lookup.</b> Binary-search the first endpoint at or after the token (wrap around). Replicas are the next distinct nodes clockwise.'],
    code:'token = hash64(encode(partitionKey))\ni = lowerBound(ring, token)           // wraps to 0 at the end\nowner = ring[i % ring.length].node\nreplicas = next RF distinct nodes clockwise from i',
    rule:'Every client and every node computes the <b>same token and the same owner</b> from the same key bytes.'}},
  {ask:'A node dies in the middle of a write. Is the order lost?',
   why:'With one copy, yes. With several copies the question becomes: <b>how many must answer</b> before you tell the client OK?',
   v0:{name:'Write to the owner, replicate in the background',code:'owner.write(row)\nreturn OK            // replicas catch up later',breaks:'The owner can crash <b>after</b> the OK but before copying the row: an <b>acknowledged write is lost</b>. A read from a lagging replica returns stale data.'},
   design:'Any node can be the coordinator. It sends the write to all 3 replicas in parallel and answers once enough of them acknowledge (the consistency level).',
   predict:{q:'RF = 3. You write at ONE, then read at ONE from a different replica. Can the read return the old value?',opts:['Never: the write was acknowledged','Yes, if that replica missed or has not applied the write yet','Only if two nodes are down'],ans:1,why:'ONE only waits for a single replica. Another replica may not have the write yet, so ONE + ONE gives no overlap. QUORUM + QUORUM always overlaps (2 + 2 > 3).'},
   build:{steps:['The coordinator finds the replicas from the ring (chapter 1) and sends the mutation to <b>all</b> live ones.','Count ACKs; reply to the client when you have <code>need</code> of them.','Refuse early (<i>Unavailable</i>) if fewer than <code>need</code> replicas are alive.','Reads ask <code>need</code> replicas and return the <b>highest version</b>.'],
    code:'need = { ONE: 1, QUORUM: floor(rf/2)+1, ALL: rf }[cl]\nacks = sendToAll(replicas, mutation)\nif (acks >= need) reply(OK)\n// read: ask `need` replicas, return max(version)',
    rule:'<b>R + W &gt; RF</b>: every read quorum overlaps the latest write quorum.'}},
  {ask:'The process is killed right after we said OK. Is the data still there?',
   why:'RAM is fast but forgets on a crash. Disk is durable but slow for random writes. A database needs both speed and durability.',
   v0:{name:'Update the row in place on disk',code:'page = disk.read(pageOf(key))\npage.update(row)\ndisk.write(page)',breaks:'Every write is a <b>random disk I/O</b>, which caps throughput. A crash halfway through writing a page can <b>corrupt</b> it.'},
   design:'Append every write to a sequential commit log and fsync it, apply it to a sorted in-memory memtable, and flush full memtables to immutable sorted files (SSTables).',
   predict:{q:'The node crashes right after ACK, before any flush. What does it recover on restart?',opts:['Nothing: the memtable lived in RAM','Every acknowledged write: the commit log is replayed','Only what is already in SSTables'],ans:1,why:'The commit log was fsynced before the ACK. On restart the node replays frames newer than the last flush and rebuilds the memtable.'},
   build:{steps:['<b>Commit log:</b> append <code>{seq,key,value,version}</code>, then <code>fsync</code>, then ACK.','<b>Memtable:</b> a sorted map; newest version of a key wins.','<b>Flush:</b> when the memtable passes its budget, write its sorted rows to a temp file, fsync, then publish it with an atomic manifest swap.','<b>Recovery:</b> load the manifest, replay only log frames with <code>seq &gt; flushedSeq</code>.'],
    code:'write(m): log.append(m); log.fsync(); memtable.put(m); ack()\nif (memtable.size > BUDGET):\n  sst = writeSorted(memtable.freeze())   // temp file + fsync\n  manifest.publish(sst, flushedSeq)      // atomic rename\n  log.truncate(flushedSeq)\nrecover(): replay log frames where seq > manifest.flushedSeq',
    rule:'<b>ACK only after the log is durable</b>, and drop log segments only after the SSTable is published.'}},
  {ask:'One row can live in the memtable and a dozen files. How do we read it without opening them all?',
   why:'Every flush creates another file. Newer data shadows older data, so a read must still find the newest version of the key.',
   v0:{name:'Scan every file and merge',code:'for f in [memtable, ...sstables]:\n  scan(f).filter(key)',breaks:'Cost grows with <b>files &times; size</b> and gets worse with every flush. Most files do not even contain the key.'},
   design:'Give each SSTable a Bloom filter (a cheap "definitely not here") and a sparse index (jump close to the key), then merge only the few candidates and cache hot results.',
   predict:{q:'A Bloom filter answers "no" for SSTable 3. What does that guarantee?',opts:['The key might still be there','The key is definitely not in that file','The key is there but deleted'],ans:1,why:'Bloom filters have no false negatives. "No" is certain; "maybe" can be a false positive that costs one wasted index probe, never a wrong answer.'},
   build:{steps:['For each SSTable build a <b>Bloom filter</b> over its keys (bits per key is your RAM / accuracy knob).','Keep a <b>sparse index</b>: every Nth key with its file offset.','Read: ask every file whose Bloom says "maybe"; binary-search the sparse index and scan one small block.','Merge all candidate versions plus the memtable; the highest version (or tombstone) wins.','Optional cache, invalidated by a per-file generation number.'],
    code:'cands = [memtable] + [s for s in sstables if s.bloom.maybe(key)]\nversions = [c.lookup(key) for c in cands]   // sparse index inside\nreturn newest(versions)',
    rule:'<b>No false negatives:</b> a key that is stored must always answer "maybe".'}},
  {ask:'Flushes keep adding files, reads slow down, and old overwritten data fills the disk. Now what?',
   why:'Immutable files are great for writes and bad for accumulating. Something must tidy them in the background without changing what reads return.',
   v0:{name:'Either never merge, or merge everything every time',code:'// A: keep all files forever\n// B: every flush -> rewrite the whole dataset',breaks:'A: reads touch more and more files. B: you rewrite terabytes to absorb a few megabytes (huge <b>write amplification</b>).'},
   design:'Compaction merges sorted files in the background. Size-tiered (STCS) merges similar-size files, leveled (LCS) keeps non-overlapping levels, time-window (TWCS) groups by time. Each trades write, read and space amplification differently.',
   predict:{q:'Which strategy rewrites the same data the most (highest write amplification)?',opts:['STCS (size-tiered)','LCS (leveled)','TWCS (time-window)'],ans:1,why:'LCS keeps tight, non-overlapping levels, so data is rewritten each time it moves down a level: great reads, expensive writes. STCS is cheap to write but can need up to 2x space during a merge.'},
   build:{steps:['<b>Merge iterator:</b> k-way merge of sorted inputs; for equal keys the newest version wins.','Write the output sorted to a temp file, fsync, then <b>publish the new file set atomically</b> and delete inputs afterwards.','<b>Pick inputs</b> by strategy: STCS: &ge;4 files of similar size; LCS: L0 plus overlapping L1; TWCS: files inside one time window.','Test with an <b>oracle</b>: reads before and after compaction must be identical.'],
    code:'inputs = strategy.pick(files)\nout = kWayMerge(inputs, newestWins)\npublish(files - inputs + out)   // atomic\ndelete(inputs)',
    rule:'Compaction may <b>rearrange and drop provably dead data</b>, never change what a read returns.'}},
  {ask:'How do you delete a row that also lives in five immutable files and on three replicas?',
   why:'You cannot edit an SSTable, and a replica that was offline has never heard of the delete.',
   v0:{name:'Just remove the row',code:'memtable.remove(key)',breaks:'Older copies in other SSTables and on other replicas still hold the row. The next read or repair <b>resurrects</b> it.'},
   design:'A delete is a write: a tombstone with a newer version that shadows everything older. Compaction may only purge it once it is safe.',
   predict:{q:'Compaction merges 2 of 3 files and drops a tombstone. The third, older file still holds the original row. What does a read return?',opts:['Deleted','The old row comes back (resurrection)','An error'],ans:1,why:'Nothing shadows the old row any more. This is why tombstones must be kept until no older data can exist outside the compaction inputs.'},
   build:{steps:['<b>Delete</b> = write <code>{key, tombstone, version}</code>. <b>TTL</b> = write with an expiry; an expired cell reads as a tombstone.','A read treats the newest version as the answer, tombstone included.','<b>Purge rule:</b> drop a tombstone only if it is older than <code>gc_grace</code> <i>and</i> no overlapping data outside the inputs is older than it.','Run repair within <code>gc_grace</code> so every replica learns the tombstone.'],
    code:'canPurge(t) = t.age > GC_GRACE\n           && no file outside inputs overlaps t.key with older data',
    rule:'<b>Never drop a tombstone</b> while a value it shadows may still exist in a file or on a replica you did not merge.'}},
  {ask:'You add a node. How do you move data without stopping traffic or losing writes?',
   why:'Data must move while clients keep writing, and clients with a stale map must not write to the old owner after the cut-over.',
   v0:{name:'Pause, copy the ranges, resume',code:'pause()\ncopy(rangeFromOldOwner, newOwner)\nresume()',breaks:'<b>Downtime</b>. And if you do not pause, writes that land during the copy are missed, and stale clients keep writing to the old owner.'},
   design:'Split the table into tablets: token ranges that each carry their own replica set and an <b>epoch</b>. Moving a replica copies a snapshot, catches up, fences the old owner, then commits the new epoch.',
   predict:{q:'After a move, a client with an old epoch writes to the old owner. What should happen?',opts:['It is accepted and silently lost','It is rejected (fenced) and the client refreshes its tablet map','It is accepted on both owners'],ans:1,why:'Fencing: the old owner rejects any request carrying an older epoch, so a stale client can never split the data.'},
   build:{steps:['Tablet map: <code>[{range, replicas, epoch}]</code>.','<b>Move:</b> mark transition, stream a snapshot, stream changes since the snapshot (catch-up).','<b>Fence</b> the old replica (reject epoch &lt; new), then <b>commit the new epoch</b> in durable metadata.','Drop the old data. A crash at any step resumes or rolls back from durable state.'],
    code:'move(tablet, from, to):\n  stream(snapshot); stream(changesSince(snapshot))\n  fence(from, epoch+1)\n  metadata.commit(tablet, replicas=[..to..], epoch+1)',
    rule:'<b>Exactly one replica set is authoritative per epoch</b>, and epochs only increase.'}},
  {ask:'Who decides the tablet map when nodes disagree or the network splits?',
   why:'Tablet placement must have <b>one agreed order</b> of changes. Leaderless QUORUM gives no total order.',
   v0:{name:'Let every node edit the map and gossip it',code:'node.map[tablet] = newReplicas\ngossip(node.map)',breaks:'A network split lets both sides change placement: <b>two owners for the same range</b>, and last-write-wins cannot repair that.'},
   design:'Raft: one leader per term replicates a log to followers; an entry is committed once a majority stores it; a new leader can only win if its log is up to date.',
   predict:{q:'A 5-member group splits into 2 | 3. Which side can commit new entries?',opts:['Both sides','Only the 3-member majority','Neither side'],ans:1,why:'Commit needs a majority (3 of 5). The 2-side cannot elect a leader or commit, so there is never a second authoritative history.'},
   build:{steps:['Persist <code>(currentTerm, votedFor, log)</code> before replying to anyone.','Follower &rarr; candidate on election timeout; vote only for a candidate whose log is at least as up to date.','Leader sends <code>AppendEntries</code> (also as heartbeat); followers truncate conflicts.','Commit index = highest index stored on a majority <i>in the current term</i>; apply entries in order.'],
    code:'onTimeout(): term++; vote(self); ask all RequestVote\nleader: AppendEntries(prevIdx, prevTerm, entries)\ncommitIdx = majority(matchIndex) where log[idx].term == term',
    rule:'A committed entry exists on a majority, so <b>every future leader contains it</b>.'}}
 ],
 milestones:[
  {t:'Token ring',test:'The same key gives the same owner on every node; adding a node moves about 1/N of keys.'},
  {t:'Single-node storage',test:'<code>kill -9</code> right after an ACK loses nothing (commit log + memtable + flush).'},
  {t:'Reads across files',test:'Results always equal a plain in-memory map (your oracle), with Bloom + index on or off.'},
  {t:'Compaction (start with size-tiered)',test:'Read results are identical before and after; file count stays bounded.'},
  {t:'Replication and consistency levels',test:'Kill any 1 of 3 replicas: QUORUM reads and writes still succeed.'},
  {t:'Tombstones and TTL',test:'A delete survives compaction and repair; nothing is resurrected.'},
  {t:'Tablets, then Raft',test:'Move a tablet under write load with no lost write; split the cluster and see only the majority commit.'}],
 capstone:{title:'Put it together: a live cluster',lead:'Everything from the chapters, running at once. Play a scenario, scrub the timeline, tap any node or event to see why it happened, then kill a node.'},
 extras:[{id:'dd1b',title:'Consistent hashing vs hash % N',sub:'chapter 1'},{id:'dd2b',title:'Bloom filter explorer',sub:'chapter 4'},{id:'dd3b',title:'Leaderless QUORUM vs Raft',sub:'chapters 2 and 8'}]
};
</script>
<script>
Lab.mount(STORY);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const J=x=>{try{return JSON.stringify(x)}catch{return String(x)}};
const pc=i=>`var(--p${((i%8)+8)%8})`,tc=i=>`var(--t${((i%8)+8)%8})`;
const cmp=(a,b)=>a<b?-1:a>b?1:0;
const short=(s,n=40)=>{s=String(s);return s.length>n?s.slice(0,n-1)+'…':s};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const enc8=new TextEncoder();
const NAMES='ABCDEFGH';const nn=i=>NAMES[i]??('N'+i);
function lcg(seed){let s=(seed>>>0)||1;return()=>{s=(Math.imul(s,1103515245)+12345)&0x7fffffff;return s/0x7fffffff}}

/* =========================================================
   SHA-256 → 64-bit token (Feature 01 contract)
   ========================================================= */
const K256=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
function sha256hex(str){
  const msg=enc8.encode(str),l=msg.length,padLen=((l+9+63)>>6)<<6,buf=new Uint8Array(padLen);
  buf.set(msg);buf[l]=0x80;const dv=new DataView(buf.buffer);dv.setUint32(padLen-8,Math.floor(l*8/4294967296));dv.setUint32(padLen-4,(l*8)>>>0);
  const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19],w=new Uint32Array(64);
  for(let i=0;i<padLen;i+=64){
    for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);
    for(let t=16;t<64;t++){const a=w[t-15],b=w[t-2];const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3),s1=((b>>>17)|(b<<15))^((b>>>19)|(b<<13))^(b>>>10);w[t]=(w[t-16]+s0+w[t-7]+s1)|0}
    let[a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){
      const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)),ch=(e&f)^(~e&g),t1=(h+S1+ch+K256[t]+w[t])|0;
      const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
const MAX=2n**64n;
const tokenOf=s=>BigInt('0x'+sha256hex(s).slice(0,16));
const tokHex=t=>'0x'+t.toString(16).padStart(16,'0').slice(0,8)+'…';
const angle=t=>Number(t*36000n/MAX)/100;
const enc=s=>String(s).length+':'+s;       // length-prefixed canonical codec (no ad-hoc separators)

/* =========================================================
   PARSING + SAMPLES
   ========================================================= */
function detect(t){const s=t.trim();if(s.startsWith('['))return'json';const l=s.split(/\r?\n/)[0]||'';if(l.startsWith('{'))return'jsonl';if(l.includes(','))return'csv';return'text'}
function csvSplit(l){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){o.push(c);c=''}else c+=ch}o.push(c);return o}
const conv=v=>(typeof v==='string'&&/^-?\d+(\.\d+)?$/.test(v.trim()))?Number(v):v;
function colsOf(rows){const c=[];rows.forEach(r=>Object.keys(r).forEach(k=>{if(!c.includes(k))c.push(k)}));return c}
function parseWhole(text,pf){
  if(pf==='json'){const a=JSON.parse(text);if(!Array.isArray(a))throw new Error('JSON must be an array');return{rows:a,columns:colsOf(a)}}
  const lines=text.split(/\r?\n/).filter(l=>l.trim()!=='');
  if(pf==='jsonl'){const rows=lines.map(l=>JSON.parse(l));return{rows,columns:colsOf(rows)}}
  if(pf==='csv'){if(!lines.length)return{rows:[],columns:[]};const h=csvSplit(lines[0]);const rows=lines.slice(1).map(l=>{const v=csvSplit(l),o={};h.forEach((k,i)=>o[k]=conv(v[i]??''));return o});return{rows,columns:h}}
  return{rows:lines.map(l=>({line:l})),columns:['line']};
}
function sampleOrders(){const st=['new','paid','shipped'],r=lcg(11),L=['customer_id,order_id,created_at,status,amount'];
  for(let i=0;i<28;i++)L.push([`C${101+((i*5)%8)}`,`O-${900+i}`,1000+i*13,st[Math.floor(r()*3)],Math.round(20+r()*480)].join(','));return L.join('\n')}

/* =========================================================
   CONFIG
   ========================================================= */
const OPT={N:4,vn:2,place:'ring',cl:'QUORUM',budget:3,strategy:'STCS',downNode:-1,downFrom:0.3,downTo:0.6,bloomBits:10,cache:true,rounds:3,
  opIdx:0,rkey:'',rnode:-1,wnode:0,crash:'none',cnode:0,scen:'delete',purge:'safe',tNow:40,readAt:-1,raftN:3,raftScen:'crash',tablets:8,
  mtab:'',mfrom:0,mto:1,mcrash:0};
let DS={rows:[],columns:[]};
function cfg(){return{text:$('#src').value,fmt:$('#fmt').value,pk:$('#pk').value,ck:$('#ck').value,mix:$('#mix').value,...OPT}}

/* =========================================================
   WORKLOAD → MUTATIONS
   ========================================================= */
function genOps(c,rows){
  const ckc=c.ck&&c.ck!=='(none)'?c.ck:null,rnd=lcg(rows.length*7+3),ev=[];
  rows.forEach((r,i)=>ev.push({r,at:i*3,kind:'upsert'}));

    if(i%4===1)ev.push({r:{...r,_v:2},at:i*3+9+Math.floor(rnd()*6),kind:'upsert'});
    if(i%7===3)ev.push({r,at:i*3+18+Math.floor(rnd()*6),kind:'delete'});
  });
  ev.sort((a,b)=>a.at-b.at||((a.kind==='delete')-(b.kind==='delete')));
  return ev.map((e,i)=>{
    const pk=String(e.r[c.pk]),ckv=ckc?String(e.r[ckc]):null;
    return{i,kind:e.kind,pk,ck:ckv,key:enc(pk)+(ckv!==null?enc(ckv):''),pkey:enc(pk),row:e.kind==='delete'?null:e.r,src:e.r,ver:i+1,t:i,
      exp:(c.mix==='ttl'&&e.kind==='upsert')?i+8+Math.floor(rnd()*40):null};
  });
}
const mut=o=>({id:o.i,key:o.key,pkey:o.pkey,row:o.row,ver:o.ver,kind:o.kind,exp:o.exp,pk:o.pk,ck:o.ck});
function winner(a,b){if(!a)return b;if(!b)return a;if(a.ver!==b.ver)return a.ver>b.ver?a:b;if(a.kind!==b.kind)return a.kind==='delete'?a:b;return a.id>=b.id?a:b}
function statusOf(m,at){if(!m)return'absent';if(m.kind==='delete')return'deleted';if(m.exp!=null&&at>=m.exp)return'expired';return'live'}
const mbytes=m=>m.key.length+16+(m.row?J(m.row).length:4);

/* =========================================================
   PLACEMENT: token ring (F01) or tablets (F07)
   ========================================================= */
function buildRing(n,vn){
  const ep=[];for(let i=0;i<n;i++)for(let j=0;j<vn;j++)ep.push({token:tokenOf(`node-${i}-vn-${j}`),node:i});
  ep.sort((a,b)=>a.token<b.token?-1:a.token>b.token?1:0);return ep;
}
function ringLookup(ep,tok){let i=ep.findIndex(e=>tok<=e.token);if(i<0)i=0;return i}
function ringReplicas(ep,tok,rf){const out=[];let i=ringLookup(ep,tok);for(let k=0;k<ep.length&&out.length<rf;k++){const nd=ep[(i+k)%ep.length].node;if(!out.includes(nd))out.push(nd)}return out}
function initTablets(n,T){return Array.from({length:T},(_,i)=>({id:'T'+i,lo:MAX*BigInt(i)/BigInt(T),hi:MAX*BigInt(i+1)/BigInt(T),rep:[i%n,(i+1)%n,(i+2)%n],epoch:1}))}
function tabletOf(tabs,tok){const t=tabs.find(t=>tok>=t.lo&&tok<t.hi);return t||tabs[tabs.length-1]}
function makePlacement(c){
  const ring=buildRing(c.N,c.vn),tabs=initTablets(c.N,c.tablets),cache=new Map();
  return{ring,tabs,place(pkey){
    if(cache.has(pkey))return cache.get(pkey);
    const tok=tokenOf(pkey);let r;
    if(c.place==='tablets'){const t=tabletOf(tabs,tok);r={tok,replicas:t.rep.slice(),tablet:t.id,primary:t.rep[0]}}
    else{const idx=ringLookup(ring,tok);r={tok,replicas:ringReplicas(ring,tok,3),primary:ring[idx].node,epIdx:idx}}
    cache.set(pkey,r);return r}};
}

/* =========================================================
   STORAGE ENGINE per node: commitlog → memtable → SSTable (F02), read path (F06)
   ========================================================= */
function fnv(s,seed){let h=(2166136261^seed)>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
function mkSst(id,entries){ // entries: [[key,m]] sorted

  entries.forEach(([k,m])=>{bytes+=mbytes(m);minTS=Math.min(minTS,m.ver);maxTS=Math.max(maxTS,m.ver);if(m.exp==null)allExp=false;else maxExp=Math.max(maxExp,m.exp)});
  return{id,rows:entries,n:entries.length,bytes,minKey:entries[0][0],maxKey:entries[entries.length-1][0],minTS,maxTS,maxExp:allExp?maxExp:null,level:0,bloom:{}};
}
function bloomOf(s,bits){

  s.rows.forEach(([key])=>{const h1=fnv(key,1),h2=fnv(key,7)|1;for(let i=0;i<k;i++)arr[(h1+Math.imul(i,h2)>>>0)%m]=1});
  return s.bloom[bits]={m,k,arr};
}
const bloomMaybe=(s,key,bits)=>{const b=bloomOf(s,bits),h1=fnv(key,1),h2=fnv(key,7)|1;for(let i=0;i<b.k;i++)if(!b.arr[(h1+Math.imul(i,h2)>>>0)%b.m])return false;return true};
function sstFind(s,key){let lo=0,hi=s.rows.length-1;while(lo<=hi){const mid=(lo+hi)>>1,c=cmp(s.rows[mid][0],key);if(c===0)return mid;if(c<0)lo=mid+1;else hi=mid-1}return-1}
const FENCE=4;
function indexStart(s,key){let i=0;for(let f=0;f<s.rows.length;f+=FENCE){if(s.rows[f][0]<=key)i=f;else break}return i}

class Node{
  constructor(id,budget){this.id=id;this.budget=budget;this.wal=[];this.seq=0;this.flushedSeq=0;this.mem=new Map();this.sst=[];this.nextS=1;this.manifest=0;this.gen=0;this.hist=[];this.flushLog=[];this.cache=new Map();this.opIdx=[]}
  apply(m,opi){
    this.wal.push({seq:++this.seq,m});this.opIdx.push(opi);this.mem.set(m.key,winner(this.mem.get(m.key),m));this.gen++;
    let cap=`append seq ${this.seq} → fsync → apply to memtable → ACK`;
    if(this.mem.size>=this.budget)cap=this.flush(`memtable full (${this.mem.size}/${this.budget})`);
    this.hist.push(this.snap(cap,opi));
  }
  flush(why){
    const entries=[...this.mem.entries()].sort((a,b)=>cmp(a[0],b[0])),s=mkSst('S'+this.nextS++,entries);
    this.flushLog.push({seq:this.seq,prevFlushed:this.flushedSeq,prevCount:this.sst.length});
    this.sst.push(s);this.flushedSeq=this.seq;this.manifest++;this.mem=new Map();this.gen++;
    return`${why}: freeze → write ${s.id}.tmp (${s.n} rows) → validate → publish manifest gen ${this.manifest} → retire log ≤ seq ${this.seq}`;
  }
  snap(cap,opi){return{opi,cap,wal:this.wal.slice(-8).map(f=>({seq:f.seq,key:f.m.key,kind:f.m.kind,ret:f.seq<=this.flushedSeq})),walKept:this.wal.filter(f=>f.seq>this.flushedSeq).length,
    mem:[...this.mem.keys()].sort(),ssts:this.sst.map(s=>({id:s.id,n:s.n,bytes:s.bytes,min:s.minKey,max:s.maxKey})),manifest:this.manifest}}
  visible(sst=this.sst,mem=this.mem){const o=new Map();sst.forEach(s=>s.rows.forEach(([k,m])=>o.set(k,winner(o.get(k),m))));mem.forEach((m,k)=>o.set(k,winner(o.get(k),m)));return o}

    if(mode==='midflush'&&this.flushLog.length){const l=this.flushLog[this.flushLog.length-1];sst=this.sst.slice(0,l.prevCount);fl=l.prevFlushed;note=`last flush was crash-interrupted: ${this.sst[this.sst.length-1].id}.tmp never published → ignored`}
    const mem=new Map();let replayed=0;this.wal.filter(f=>f.seq>fl).forEach(f=>{mem.set(f.m.key,winner(mem.get(f.m.key),f.m));replayed++});
    const a=this.visible(),b=this.visible(sst,mem),ja=J([...a.entries()].sort()),jb=J([...b.entries()].sort());
    return{ok:ja===jb,replayed,note,sst:sst.length,fl,memAfter:mem.size};
  }
  localWinner(key){let w=this.mem.get(key);this.sst.forEach(s=>{const i=sstFind(s,key);if(i>=0)w=winner(w,s.rows[i][1])});return w}
  readTrace(key,bits,cacheOn){

      const inRange=key>=s.minKey&&key<=s.maxKey,maybe=bloomMaybe(s,key,bits);
      const step={id:s.id,inRange,maybe,found:false,scanned:0,fp:false};
      if(maybe){t.bloomFiles++;const st=indexStart(s,key);let i=st,sc=0;while(i<s.rows.length&&sc<FENCE+1){sc++;if(s.rows[i][0]===key){step.found=true;w=winner(w,s.rows[i][1]);break}if(s.rows[i][0]>key)break;i++}step.scanned=sc;t.idxRows+=sc;if(!step.found){step.fp=true;t.fp++}}
      t.steps.push(step);
    }
    t.win=w;if(cacheOn)this.cache.set(key,{gen:this.gen,win:w});return t;
  }
}

/* =========================================================
   CLUSTER RUN: coordinator → replicas with consistency levels (F05)
   ========================================================= */
const needOf=(cl,rf)=>cl==='ONE'?1:cl==='ALL'?rf:Math.floor(rf/2)+1;
function runCluster(c,ops,pl){
  const engines=Array.from({length:c.N},(_,i)=>new Node(i,c.budget)),rnd=lcg(ops.length*31+c.N),res=[];
  const isDown=(nd,i)=>nd===c.downNode&&i>=Math.floor(c.downFrom*ops.length)&&i<Math.floor(c.downTo*ops.length);
  let rr=0;
  ops.forEach(o=>{
    const m=mut(o),p=pl.place(o.pkey),down=nd=>isDown(nd,o.i),live=p.replicas.filter(r=>!down(r)),need=needOf(c.cl,p.replicas.length);
    const ups=[...Array(c.N).keys()].filter(x=>!down(x)),coord=ups[(rr++)%ups.length];
    const lat={};p.replicas.forEach(r=>lat[r]=1+Math.floor(rnd()*9)+(r===coord?0:2));
    let status='ok';
    if(live.length<need)status='unavailable';else live.forEach(r=>engines[r].apply(m,o.i));
    const sorted=live.map(r=>lat[r]).sort((a,b)=>a-b);
    res.push({op:o,coord,replicas:p.replicas,live,lat,need,status,ackLat:status==='ok'?sorted[need-1]:null,missed:status==='ok'?p.replicas.filter(r=>down(r)):[],tok:p.tok,tablet:p.tablet});
  });
  // divergence per key
  const byKey=new Map();ops.forEach(o=>{if(!byKey.has(o.key))byKey.set(o.key,o)});
  const div=[];
  byKey.forEach((o,key)=>{
    const p=pl.place(o.pkey),ws=p.replicas.map(r=>engines[r].localWinner(key)),vs=ws.map(w=>w?w.ver:0),mx=Math.max(...vs);
    if(vs.some(v=>v!==mx))div.push({key,o,reps:p.replicas.map((r,i)=>({node:r,w:ws[i]})),truth:ws.reduce((a,b)=>winner(a,b))});
  });
  return{engines,res,div,keys:[...byKey.keys()],byKey};
}

/* =========================================================
   COMPACTION SIMULATOR (F03) + tombstone purge guard (F04)
   ========================================================= */
const isDead=(m,now)=>m.kind==='delete'||(m.exp!=null&&now>=m.exp);
function fileFrom(id,map,extra){
  const rows=[...map.entries()].sort((a,b)=>cmp(a[0],b[0]));let bytes=0,minTS=Infinity,maxTS=-Infinity,maxExp=0,allExp=true;
  rows.forEach(([k,m])=>{bytes+=mbytes(m);minTS=Math.min(minTS,m.ver);maxTS=Math.max(maxTS,m.ver);if(m.exp==null)allExp=false;else maxExp=Math.max(maxExp,m.exp)});
  return{id,map,rows,n:rows.length,bytes,minKey:rows.length?rows[0][0]:'',maxKey:rows.length?rows[rows.length-1][0]:'',minTS,maxTS,maxExp:allExp&&rows.length?maxExp:null,level:0,window:0,...extra};
}
const mergeMaps=files=>{const o=new Map();files.forEach(f=>f.map.forEach((m,k)=>o.set(k,winner(o.get(k),m))));return o};
const overlap=(f,lo,hi)=>!(f.maxKey<lo||f.minKey>hi);
function pickSTCS(files){
  const sorted=[...files].sort((a,b)=>a.bytes-b.bytes),bk=[];
  sorted.forEach(f=>{const b=bk.find(b=>{const avg=b.sum/b.f.length;return f.bytes>=avg*0.5&&f.bytes<=avg*1.5});if(b){b.f.push(f);b.sum+=f.bytes}else bk.push({f:[f],sum:f.bytes})});
  const c=bk.filter(b=>b.f.length>=4).sort((a,b)=>b.f.length-a.f.length||a.sum/a.f.length-b.sum/b.f.length)[0];
  return c?{inputs:c.f.slice(0,32),level:0,reason:`bucket of ${c.f.length} similar-size files (min_threshold 4)`}:null;
}
function pickLCS(files,o){
  const L0=files.filter(f=>f.level===0);
  if(L0.length>=4){const lo=L0.reduce((a,f)=>f.minKey<a?f.minKey:a,L0[0].minKey),hi=L0.reduce((a,f)=>f.maxKey>a?f.maxKey:a,L0[0].maxKey),L1=files.filter(f=>f.level===1&&overlap(f,lo,hi));
    return{inputs:[...L0,...L1],level:1,split:true,reason:`L0 has ${L0.length} files → merge with ${L1.length} overlapping L1 file(s)`}}
  for(let lv=1;lv<=5;lv++){const fl=files.filter(f=>f.level===lv),bytes=fl.reduce((a,f)=>a+f.bytes,0),cap=Math.pow(o.fanout,lv)*o.target;
    if(bytes>cap){const f=fl[0],nx=files.filter(g=>g.level===lv+1&&overlap(g,f.minKey,f.maxKey));return{inputs:[f,...nx],level:lv+1,split:true,reason:`L${lv} over capacity (${bytes}>${cap} bytes): push a file down, merge with ${nx.length} overlapping`}}}
  return null;
}
function pickTWCS(files,o){
  const ex=files.filter(f=>f.maxExp!=null&&f.maxExp<=o.now);
  if(ex.length)return{inputs:ex,drop:true,level:0,reason:`${ex.length} fully expired file(s): deleted whole, no rewrite`};
  const by={};files.forEach(f=>(by[f.window]=by[f.window]||[]).push(f));const cur=Math.max(...files.map(f=>f.window));
  for(const w of Object.keys(by).map(Number).sort((a,b)=>a-b)){if(w<cur&&by[w].length>1)return{inputs:by[w],level:0,reason:`window ${w} is closed: merge its ${by[w].length} files into one`}}
  const cf=by[cur]||[];if(cf.length>=4)return{inputs:cf,level:0,reason:`current window ${cur}: ${cf.length} files → STCS-style merge`};
  return null;
}
function compactSim(strategy,flushMaps,o){
  const files=[];let nid=1,flushed=0,written=0,peak=0,ok=true;const steps=[],oracle=new Map();

  const snap=(text,inputs,outputs,extra={})=>steps.push({text,files:files.map(f=>({id:f.id,row:rowOf(f),bytes:f.bytes,n:f.n,min:f.minKey,max:f.maxKey})).sort((a,b)=>cmp(a.row,b.row)||cmp(a.min,b.min)),inputs,outputs,...extra});

  flushMaps.forEach(map=>{
    map.forEach((mm,k)=>oracle.set(k,winner(oracle.get(k),mm)));
    const f=fileFrom('F'+nid++,map);f.window=Math.floor(f.maxTS/o.window);files.push(f);flushed+=f.bytes;snap(`flush → ${f.id} (${f.n} rows, ${f.bytes} B)`,[],[f.id]);

      if(pl.split){const ents=[...merged.entries()].sort((a,b)=>cmp(a[0],b[0]));let cur=new Map(),sz=0;ents.forEach(([k,m])=>{cur.set(k,m);sz+=mbytes(m);if(sz>=o.target){outs.push(cur);cur=new Map();sz=0}});if(cur.size)outs.push(cur)}
      else if(merged.size)outs=[merged];
      const nf=outs.map(mp=>{const x=fileFrom('F'+nid++,mp,{level:pl.level});x.window=Math.floor(x.maxTS/o.window);return x});
      const wb=nf.reduce((a,x)=>a+x.bytes,0);written+=wb;peak=Math.max(peak,before+wb);

      snap(`${pl.reason} → ${nf.map(x=>x.id).join(', ')||'(nothing left)'}${purged?` · purged ${purged} tombstone(s)`:''}${kept?` · kept ${kept} tombstone(s) (purge guard)`:''}`,ins.map(x=>x.id),nf.map(x=>x.id));

}
function buildTrace(c,eng){
  const muts=eng.wal.map(f=>f.m),maps=[];let all=[];
  for(let r=0;r<c.rounds;r++)muts.forEach((m,idx)=>{if(r===0||fnv(m.key,r)%2===0)all.push({...m,ver:m.ver+r*1000,exp:m.exp!=null?m.exp+r*1000:null,id:m.id+r*100000})});
  const bs=Math.max(1,c.budget);for(let i=0;i<all.length;i+=bs){const mp=new Map();all.slice(i,i+bs).forEach(m=>mp.set(m.key,winner(mp.get(m.key),m)));maps.push(mp)}
  const sizes=maps.map(mp=>[...mp.values()].reduce((a,m)=>a+mbytes(m),0)).sort((a,b)=>a-b),med=sizes[Math.floor(sizes.length/2)]||100;

}

/* =========================================================
   BUILD EVERYTHING
   ========================================================= */
let S=null;
function build(){
  const c=cfg(),o={cfg:c};
  if(!c.text.trim()){o.error='No data yet.';return o}
  let ds;try{const pf=c.fmt==='auto'?detect(c.text):c.fmt;ds=parseWhole(c.text,pf)}catch(e){o.error='Cannot parse input: '+e.message;return o}
  if(!ds.rows.length||!ds.columns.includes(c.pk)){o.error='Choose a partition key column.';return o}
  if(ds.rows.length>400){o.error='Please keep the data under 400 rows for the playground.';return o}
  o.ds=ds;o.ops=genOps(c,ds.rows);o.pl=makePlacement(c);
  o.cl=runCluster(c,o.ops,o.pl);
  o.readAt=c.readAt<0?o.ops.length:c.readAt;
  o.keys=o.cl.keys;
  const parts=new Map();o.ops.forEach(op=>{const e=parts.get(op.pkey)||{pk:op.pk,pkey:op.pkey,rows:new Set(),ops:0};e.rows.add(op.key);e.ops++;parts.set(op.pkey,e)});
  o.parts=[...parts.values()].map(p=>({...p,rows:p.rows.size,...o.pl.place(p.pkey)}));
  o.cnode=clamp(c.cnode,0,c.N-1);
  o.trace=buildTrace(c,o.cl.engines[o.cnode]);
  o.comp={};['STCS','LCS','TWCS'].forEach(s=>o.comp[s]=compactSim(s,o.trace.maps,o.trace.opts));
  return o;

/* =========================================================
   PHASE 1: PARTITION KEY → TOKEN → RING
   ========================================================= */
function ringSVG(ring,N,dots,opts={}){

let _rm=null;

}

/* =========================================================
   PHASE 2: ROUTE & REPLICATE
   ========================================================= */
function nodePos(i,n){const a=(i/n)*2*Math.PI-Math.PI/2;return[200+130*Math.cos(a),130+90*Math.sin(a)]}
function readExperiment(o,key,cl){
  const o0=o.cl.byKey.get(key);if(!o0)return null;
  const p=o.pl.place(o0.pkey),eng=o.cl.engines,ws=p.replicas.map(r=>({node:r,w:eng[r].localWinner(key)}));
  const truth=ws.reduce((a,b)=>({w:winner(a.w,b.w)}),{w:null}).w,need=needOf(cl,3);
  const subsets=[];(function go(st,acc){if(acc.length===need){subsets.push(acc.slice());return}for(let i=st;i<ws.length;i++){acc.push(ws[i]);go(i+1,acc);acc.pop()}})(0,[]);
  const outs=subsets.map(sub=>({nodes:sub.map(x=>x.node),w:sub.reduce((a,b)=>winner(a,b.w),null)}));
  return{ws,truth,outs,stale:outs.some(x=>(x.w?x.w.ver:0)<(truth?truth.ver:0)),need};
}

    s+=`<g><circle cx="${x}" cy="${y}" r="24" fill="${isRep?pc(i):'var(--card)'}" stroke="${i===r.coord?'var(--acc2)':tc(i)}" stroke-width="${i===r.coord?4:2}" ${isDown?'stroke-dasharray="4 3" opacity=".55"':''}/><text x="${x}" y="${y+4}" text-anchor="middle" font-weight="700">${nn(i)}</text>
      <text x="${x}" y="${y+38}" text-anchor="middle" style="font-size:10px;fill:var(--mut)">${i===r.coord?'coordinator':isRep?'replica':''}${isDown?' ✕ down':''}</text></g>`;
  }

/* =========================================================
   PHASE 3: REPLICA WRITE PATH
   ========================================================= */

/* =========================================================
   PHASE 4: READ PATH (Bloom → index → merge → cache)
   ========================================================= */

/* =========================================================
   PHASE 6: DELETES, TTL, TOMBSTONES
   ========================================================= */

  const keys=S.keys,key=keys.includes(S.cfg.rkey)?S.cfg.rkey:keys[0],row=(S.cl.byKey.get(key).src),lbl=short(key.replace(/\d+:/g,'|'),20);
  const v1={id:1,key,pkey:'',row,ver:10,kind:'upsert',exp:null},isTtl=S.cfg.scen==='ttl';
  const v2=isTtl?{id:2,key,pkey:'',row:{...row,_v:2},ver:20,kind:'upsert',exp:25}:{id:2,key,pkey:'',row:null,ver:20,kind:'delete',exp:null};
  const filler={id:3,key:'zz-filler',pkey:'',row:{x:1},ver:21,kind:'upsert',exp:null},filler2={id:4,key:'zz-filler2',pkey:'',row:{x:2},ver:22,kind:'upsert',exp:null};

/* =========================================================

   ========================================================= */

  recordCommit(x){for(let i=1;i<=x.commit;i++){const e=J(x.log[i-1]);if(!this.cl[i])this.cl[i]=e;else if(this.cl[i]!==e)this.vio.push(`committed entry ${i} differs on ${nn(x.id)}`)}this.maxCommit=Math.max(this.maxCommit,x.commit)}

  }

}

function dd2(){
  const el=$('#dd2b');if(!S||S.error){el.innerHTML='';return}
  const eng=S.cl.engines.reduce((a,b)=>b.sst.reduce((x,s)=>x+s.n,0)>a.sst.reduce((x,s)=>x+s.n,0)?b:a);
  const sst=eng.sst.slice().sort((a,b)=>b.n-a.n)[0];

  const bits=OPT.bloomBits,b=bloomOf(sst,bits),set=b.arr.reduce((a,x)=>a+x,0);

const DETAIL=[
{how:"ScyllaDB serializes the partition key, hashes it with the Murmur3Partitioner into a signed 64-bit token, and finds the node that owns the range containing that token. With vnodes (num_tokens, 256 by default) each node owns many small ranges. The keyspace replication factor and NetworkTopologyStrategy then pick the next distinct nodes or racks as replicas, and the token also selects the CPU shard inside each node. Token-aware drivers compute this client-side and skip an extra hop.",
 pros:["Hash placement spreads partitions evenly with no central directory to consult or maintain","Any client can compute replicas locally, so token-aware routing removes a network hop","Vnodes let a joining or leaving node stream small slices from many peers in parallel","Clustering keys sort rows inside a partition, so range scans within one partition are cheap sequential reads"],
 cons:["Hashing destroys key order, so range scans across partitions need a full token-range scan","One very popular partition key always lands on the same replicas and cannot be split","Choosing the partition key is a one-way design decision that is hard to change later","Many vnodes make repair and token-range operations more complex than a few big ranges"],
 fails:[{m:"Hot partition",s:"One shard or replica set shows high CPU and latency while the rest of the cluster is idle",x:"Add a bucket (for example day or hash suffix) to the partition key, or cache or rate-limit the hot key at the application layer"},
 {m:"Large partition",s:"Large partition warnings in the log, slow reads and long repairs for specific keys",x:"Bound partition size by time or bucket; find offenders in system.large_partitions and remodel the table"},
 {m:"Low-cardinality partition key",s:"Data and traffic pile onto few tokens and some nodes or shards hold far more data than others",x:"Pick a high-cardinality key or compose the key with a bucket column so tokens spread evenly"},
 {m:"Non-token-aware client",s:"Higher latency and extra coordinator-to-replica traffic on every request",x:"Use the Scylla shard-aware driver with a TokenAwarePolicy and a correct local datacenter"}],
 watch:["nodetool status and nodetool ring: ownership should be roughly even across nodes","ScyllaDB Monitoring per-shard load panel: a single shard much busier than its peers means a hot partition","SELECT * FROM system.large_partitions: any rows above a few hundred MB are a warning sign","nodetool getendpoints <ks> <table> <key> shows which replicas own a given key"]},

{how:"Any node can act as coordinator. It computes the replicas and sends the mutation to all of them in parallel, then replies to the client once the consistency level (ONE, QUORUM, LOCAL_QUORUM, ALL) is met. Replicas that are down or slow still get the write later through hinted handoff (if within max_hint_window) or repair. For reads the coordinator asks one replica for data and others for digests, and read repair or speculative retry can reconcile or hide slow nodes.",
 pros:["Leaderless: there is no single write master, so losing any node does not stop writes while a quorum survives","Tunable per-request consistency lets each query trade latency against safety","LOCAL_QUORUM keeps latency inside one datacenter while still replicating across DCs","Hinted handoff and read repair heal most transient divergence automatically"],
 cons:["CL=ONE writes and reads can return stale data if the replica read missed an earlier write","There is no total order across replicas, so conflicts are resolved by last-write-wins timestamps","QUORUM and ALL pay the latency of the slowest replica involved","Hints are best-effort and time-limited; they do not replace repair"],
 fails:[{m:"Stale read at weak CL",s:"A client reads old values right after a successful write; results differ between retries",x:"Use QUORUM or LOCAL_QUORUM for both reads and writes so R + W > RF, and run regular repair"},
 {m:"UnavailableException",s:"Coordinator rejects the request because fewer replicas are alive than the CL needs",x:"Restore the failed nodes or lower the CL for tolerant workloads; check RF and rack layout so one rack loss does not break quorum"},
 {m:"Write or read timeout",s:"WriteTimeoutException or ReadTimeoutException while nodes are up but overloaded",x:"Find the slow replica (compaction backlog, hot shard, GC-like stalls), reduce load, and tune the client timeouts and retries"},
 {m:"Clock skew with LWW",s:"A newer write appears to lose to an older one because of unsynced node or client clocks",x:"Run chrony or NTP on all nodes; prefer server-side timestamps or driver timestamp generators with monotonic guarantees"}],
 watch:["Metrics scylla_storage_proxy_coordinator_write_timeouts and read_timeouts, and unavailables: any sustained rise is bad","scylla_hints_manager_* counters and nodetool statushandoff: growing pending hints mean a replica is behind","Driver-side latency percentiles per CL; a p99 far above p50 usually means one slow replica","nodetool status: any DN node lowers the CL levels you can still satisfy"]},

{how:"On each replica the mutation is appended to the commitlog (a segment-based sequential log) and applied to an in-memory memtable per table. When memtables use too much dirty memory, or commitlog space (commitlog_total_space_in_mb) runs low, they are flushed to new immutable SSTables made of Data, Index, Summary, Filter and TOC files. Once flushed, the old commitlog segments are released. After a crash, Scylla replays the commitlog on startup to rebuild the lost memtables.",
 pros:["Writes are sequential appends plus a memory insert, so they are fast and avoid random disk I/O","Immutable SSTables are simple to cache, back up and checksum, and never need in-place updates","Commitlog replay gives durability without writing every row to its final on-disk place at once","Each shard owns its own memtable, so writes scale with cores and avoid cross-thread locks"],
 cons:["Default commitlog_sync is periodic (about 10 s), so a power loss can lose the latest acknowledged writes unless you use batch mode","Every flush creates a new SSTable, which adds read amplification until compaction merges them","Memtable and commitlog sizing need care; too small means many small SSTables, too large means long replay","Replication is the real durability story: one node's disk is not enough on its own"],
 fails:[{m:"Commitlog full or write stall",s:"Writes slow down or block; log shows memtable flush pressure and commitlog segments piling up",x:"Check disk throughput, add nodes or shards of capacity, and avoid bursts that outrun flush and compaction"},
 {m:"Data loss on crash with periodic sync",s:"After a power failure the most recent acknowledged writes on one replica are gone",x:"Rely on RF>=3 with QUORUM and repair, or switch to commitlog_sync: batch when single-node durability matters"},
 {m:"Slow or corrupt commitlog replay",s:"Node takes very long to start or refuses to start after a crash",x:"Keep commitlog on fast storage, avoid oversize commitlog space, and follow the corrupt-segment recovery steps in the docs"},
 {m:"Too many tiny SSTables",s:"Rising SSTable count per read and compaction backlog after many small flushes",x:"Avoid frequent forced flushes and tiny memtable budgets; let compaction catch up before adding more write load"}],
 watch:["scylla_commitlog_disk_total_bytes and pending flushes: a commitlog near its limit means flush or disk is the bottleneck","scylla_memtable_* and scylla_database_dirty_memory metrics: dirty memory pinned at the limit means write throttling","nodetool cfstats: SSTable count and memtable size per table; steadily climbing counts are bad","Disk write latency and bandwidth on the data and commitlog volumes"]},

{how:"A point read merges the freshest versions of a row from the memtable and every SSTable that may hold the partition. For each SSTable Scylla checks the Bloom filter (bloom_filter_fp_chance, default 0.01) to skip files that surely lack the key, then uses the partition index and summary to seek the right offset. Scylla also has a per-shard row cache that serves hot partitions from memory and is kept consistent with writes, so a hit skips SSTable access. Results are reconciled by timestamp, with tombstones winning ties.",
 pros:["Bloom filters avoid disk reads for SSTables that do not contain the key","Sparse index and summary reach the right offset with one small seek","The row cache gives memory-speed reads for hot data without a separate cache layer","Reads see a consistent merged view even while flushes and compactions run"],
 cons:["Read amplification grows with the number of SSTables that overlap the key","Lower bloom_filter_fp_chance costs more memory; higher values cause extra useless disk reads","Wide partitions and range scans can evict useful rows from the cache","Reconciling many versions and tombstones is CPU work on the read path"],
 fails:[{m:"Read amplification from compaction backlog",s:"p99 read latency climbs and tracing shows many SSTables touched per query",x:"Clear the compaction backlog, consider a strategy better for the read pattern (LCS), and avoid overlapping data"},
 {m:"Cache thrash on big scans",s:"Cache hit rate falls and disk reads rise after analytics-style or full-table scans",x:"Run scans with BYPASS CACHE, throttle them, or move them to a separate workload or datacenter"},
 {m:"Tombstone-heavy reads",s:"Slow reads, tracing shows many tombstones read per query, warnings in the log",x:"Fix the data model (queue-like deletes), shorten the scanned range, lower gc_grace after repairing, and compact"},
 {m:"Bloom filter too weak or too big",s:"Many Bloom false positives cause extra disk reads, or filters consume too much memory",x:"Tune bloom_filter_fp_chance per table and recheck with cfstats false-positive ratio"}],
 watch:["scylla_cache_row_hits vs scylla_cache_row_misses: hit rate should be high for hot workloads","nodetool tablehistograms <ks> <table>: SSTables per read, p99 above a few means read amplification","CQL TRACING ON for a slow query: look for many SSTables and tombstones scanned","nodetool cfstats: bloom filter false ratio and disk space used by filters"]},

{how:"Compaction runs in the background merging SSTables into fewer, larger ones, dropping shadowed versions and expired tombstones without changing query results. The strategy is a per-table option: STCS merges similar-sized SSTables, LCS keeps non-overlapping levels for low read amplification, TWCS buckets data by time window for TTL workloads, and Incremental (ICS) is available in Enterprise. Scylla's compaction controller sizes CPU and I/O shares by the backlog so compaction does not starve foreground traffic.",
 pros:["STCS gives the lowest write amplification, good for write-heavy workloads","LCS bounds read amplification with about one SSTable per level per read, good for read-heavy workloads","TWCS drops whole expired windows cheaply and avoids rewriting old time-series data","The backlog-driven controller automatically balances compaction against foreground latency"],
 cons:["STCS needs lots of free disk (up to about 50 percent headroom) and gives high space and read amplification","LCS rewrites data many times and stresses disk with high write amplification","TWCS works badly with out-of-order writes, updates or manual deletes inside old windows","Changing strategy triggers large recompaction work on existing data"],
 fails:[{m:"Compaction backlog",s:"Backlog metric rises, SSTable count grows, read latency and disk usage worsen",x:"Add capacity or shards, slow the ingest, check disk I/O, and avoid running repair or major compactions at the same time"},
 {m:"Out of disk during STCS compaction",s:"Free space drops sharply during big merges; node may stop compacting or crash",x:"Keep 50 percent free space for STCS, add nodes, or move to ICS or LCS; never run major compaction near full disk"},
 {m:"Wrong strategy for the workload",s:"TWCS with updates keeps old windows alive; LCS on write-heavy data saturates disk",x:"Match the strategy to the access pattern: TWCS for append-only TTL data, LCS for read-heavy, STCS for write-heavy"},
 {m:"Overlapping time windows",s:"TWCS never drops expired SSTables because late writes keep touching old windows",x:"Write in time order, size windows so that about 20-30 exist per TTL, and stop updates to old data"}],
 watch:["scylla_compaction_manager_backlog and nodetool compactionstats: a backlog that keeps growing means compaction cannot keep up","SSTable count per table in nodetool cfstats and disk free percent on data volumes","scylla_compaction_manager_pending_compactions and per-shard I/O queue delay","Read latency p99 vs SSTables per read; if both rise together, compaction is the cause"]},

{how:"A DELETE or an expired TTL writes a tombstone, a timestamped marker that hides older data in every SSTable and replica. The tombstone must live at least gc_grace_seconds (default 864000, 10 days) so repair can spread it before it is purged. During compaction Scylla drops a tombstone only when it is older than the gc time and no overlapping data outside the compaction inputs could still need hiding. The table option tombstone_gc (timeout, repair, immediate, disabled) controls when the purge is allowed.",
 pros:["Marking a delete as a write keeps deletes fast, append-only and replicated like any other write","The purge guard prevents deleted data from reappearing when older copies sit in other files","gc_grace gives the repair process time to propagate deletes to every replica","tombstone_gc repair mode ties purge to completed repairs, which is safer than wall-clock time alone"],
 cons:["Deleted data still costs disk and read CPU until tombstones are compacted away","Heavy delete workloads (queues, wide partitions with range deletes) create tombstone overload","Tombstones cannot be purged until gc_grace passes and overlap checks succeed, so space is held back","Mistuning gc_grace or skipping repair risks zombie data coming back"],
 fails:[{m:"Tombstone overload",s:"Reads slow down or time out; tracing and logs show huge numbers of tombstones scanned",x:"Remodel to avoid queue patterns, bucket data by time, query narrower ranges, and compact once gc_grace has passed"},
 {m:"Zombie data resurrection",s:"Deleted rows reappear after a node was down longer than gc_grace and was not repaired",x:"Run repair within gc_grace_seconds (or use tombstone_gc repair mode) and replace long-dead nodes instead of rejoining them"},
 {m:"Tombstones not purged",s:"Disk stays full of deleted data even after compaction and gc_grace has elapsed",x:"Check overlapping SSTables blocking purge, run compaction for the table, and ensure repairs complete if tombstone_gc is repair mode"},
 {m:"Unsafe purge by age only",s:"Data returns because tombstone was dropped while an older shadowed copy remained in another file",x:"Keep the purge guard on; never lower gc_grace without a repair schedule that fits it"}],
 watch:["CQL TRACING output: tombstone cells scanned per query; large counts mean trouble","Scylla log warnings about tombstones, plus system.large_partitions and large_rows for delete-heavy partitions","nodetool repair run history vs gc_grace_seconds: last repair must be newer than gc_grace","Table option tombstone_gc and gc_grace_seconds in DESCRIBE TABLE; check them after every schema change"]},

{how:"With tablets (ScyllaDB 6.0 and later, enabled per keyspace), each table is split into many token-range tablets, each with its own replica set, instead of fixed vnode ownership. Tablets split or merge automatically as they grow or shrink, and the load balancer moves tablets between nodes and shards. A migration streams a snapshot to the new replica, catches up on later writes, fences the old replica, then commits the new replica set through the topology state machine on Raft.",
 pros:["Adding or removing nodes is faster and can run concurrently because only some tablets move","Load balancing is continuous and per-table, so uneven data or traffic can be corrected without a full topology change","Tablets split with data growth, so ranges stay small and bounded","Fencing and an epoch (topology version) stop stale replicas from serving after a move"],
 cons:["Tablets need NetworkTopologyStrategy keyspaces and some features or older tools may not be supported with them","Migrations consume network, disk and CPU, which can affect latency during rebalancing","A single hot partition still cannot be split by a tablet split","More metadata (tablet map) must be kept consistent through Raft, so operations depend on a healthy quorum"],
 fails:[{m:"Stuck or slow tablet migration",s:"Rebalancing never finishes or a node add or removal seems to hang",x:"Check streaming and compaction load, node health and Raft quorum; inspect system.tablets and logs, then retry or abort via the documented procedure"},
 {m:"Node failure during migration",s:"A move was interrupted at a step; the tablet shows a transitional state",x:"The topology coordinator rolls the move back or forward from its durable state; make sure a Raft majority is up so it can resume"},
 {m:"Migration latency impact",s:"Foreground read and write p99 rises while tablets stream",x:"Lower streaming load, schedule changes off-peak, and make sure compaction and I/O shares leave room for user traffic"},
 {m:"Hot tablet",s:"One tablet carries disproportionate traffic and its replicas run hot despite balancing",x:"Fix the key distribution in the data model; balancing moves tablets but cannot spread one partition"}],
 watch:["nodetool status and the system.tablets table: replica sets and tablet counts per table should look balanced","Scylla logs and metrics for streaming and tablet migration progress; any migration stuck for a long time is bad","Per-node and per-shard load panels in ScyllaDB Monitoring while rebalancing runs","Raft group 0 health, since topology changes need a live majority"]},

{how:"ScyllaDB uses Raft for strongly consistent cluster metadata: schema changes and topology changes (including tablet maps) go through Raft group 0. Voters elect a leader per term; the leader appends commands to its log, replicates them, and marks them committed once a majority stores them in its current term. Each node applies committed entries in the same order. A leader cut off from the majority cannot commit, and a new election happens in a higher term after a heartbeat timeout.",
 pros:["Gives one agreed total order for metadata, so schema and topology changes cannot conflict","Safe re-election: a committed entry is never lost as long as a majority survives","Removes the old gossip-based, eventually consistent schema and topology changes with their races","Minority-side leaders cannot commit stale decisions, so there is no split brain for metadata"],
 cons:["Metadata changes need a live majority; losing quorum blocks DDL and topology operations","A single leader serializes commands, so metadata throughput is limited (fine for metadata, not for data)","Leader elections add a pause after leader failure or network flaps","Raft covers metadata only; normal data writes still use leaderless replication with tunable CL"],
 fails:[{m:"Raft quorum lost",s:"CREATE, ALTER or node add and remove time out or fail; reads and writes of data may still work",x:"Bring enough group 0 voters back; if nodes are permanently lost, follow the documented majority-loss recovery procedure"},
 {m:"Leader churn",s:"Frequent elections and slow schema or topology operations during network instability",x:"Fix network latency and packet loss, check for overloaded nodes missing heartbeats, and avoid running too many voters across weak links"},
 {m:"Minority partition",s:"Nodes on the small side cannot change schema or topology and may report errors, while the majority continues",x:"Heal the partition; the minority truncates uncommitted entries and catches up from the leader automatically"},
 {m:"Unsafe manual intervention",s:"Removing or replacing nodes without a majority leaves the group in an inconsistent state",x:"Use nodetool removenode or the recovery procedure with all steps; never delete system.raft data by hand"}],
 watch:["Schema agreement after DDL: nodetool describecluster should show one schema version","Raft-related errors and leader changes in Scylla logs; repeated elections are a bad sign","nodetool status for DN nodes: count how many group 0 voters remain compared with the majority needed","DDL and topology command latency; sudden timeouts often mean lost quorum"]}
];

(function(){
const SC_REP=(k,n)=>{const h=sHash(k)%n,r=[];for(let i=0;i<Math.min(3,n);i++)r.push((h+i)%n);return r};
const nid=(x,n)=>String(x||'').startsWith('@')?SC_REP(x.slice(1),n)[1]:(+x||0);
const SIMM={
 id:'scylla',nodeLabel:'nodes',nodeRange:[3,6,4],
 settings:[{id:'cl',label:'consistency',opts:['ONE','QUORUM','ALL'],def:'QUORUM'}],
 menu:[{op:'W',label:'INSERT / UPDATE',args:[{n:'key',d:'c101',w:60},{n:'value',d:'paid',w:70}]},{op:'D',label:'DELETE (tombstone)',args:[{n:'key',d:'c101',w:60}]},{op:'R',label:'SELECT (read)',args:[{n:'key',d:'c101',w:60}]},{op:'K',label:'kill node (# or @key = a replica of key)',args:[{n:'#',d:'1',w:50}]},{op:'H',label:'restart node',args:[{n:'#',d:'1',w:36}]}],
 scenarios:[
  {name:'insert → update → delete',desc:'Any node coordinates. The partition key is hashed to a token that names 3 replicas; each replica appends to its commitlog and memtable. Updates and deletes are new versions (a delete is a tombstone). The highest version wins.',acts:['0 W c101 new','1800 W c102 paid','3600 W c101 shipped','5400 R c101','7000 D c102','8800 R c102']},
  {name:'a replica is down (QUORUM vs ONE)',desc:'One replica misses writes while it is down and nothing repairs it here. Reads at ONE can return stale data; QUORUM overlaps with the write quorum and sees the newest version. Change consistency in the controls.',acts:['0 W c101 v1','1800 K @c101','2400 W c101 v2','4400 H @c101','5200 R c101','6600 R c101','8000 R c101']},
 ],
 topo(n){
  const nodes=[{id:'cli',x:14,y:170,w:90,h:70,label:'Client'}],cx=520,cy=215,rx=280,ry=145,bw=130,bh=104;
  for(let i=0;i<n;i++){const a=(i/n)*2*Math.PI-Math.PI/2;nodes.push({id:'n'+i,x:cx+rx*Math.cos(a)-bw/2,y:cy+ry*Math.sin(a)-bh/2,w:bw,h:bh,label:'node '+i})}
  const edges=[];for(let i=0;i<n;i++){edges.push(['cli','n'+i]);for(let j=i+1;j<n;j++)edges.push(['n'+i,'n'+j])}
  return{nodes,edges,w:900,h:430};
 },
 init(n){const st={status:{cli:'up'},d:{},cl:{},mem:{},sst:{},n};for(let i=0;i<n;i++){const id='n'+i;st.status[id]='up';st.d[id]={};st.cl[id]=0;st.mem[id]=0;st.sst[id]=0}return st},
 apply(st,f){const id='n'+f.n;switch(f.op){case'put':st.d[id][f.k]=f.rec;st.cl[id]++;st.mem[id]++;if(st.mem[id]>=4){st.mem[id]=0;st.sst[id]++}break;case'down':st.status[id]='down';break;case'up':st.status[id]='up';break}},
 fxText(f){return f.op==='put'?`node ${f.n}: ${f.k} v${f.rec.ver}${f.rec.del?' (tombstone)':'='+f.rec.v} → commitlog + memtable`:`node ${f.n} ${f.op}`},
 run(acts,n,set){
  const W=SIMM.init(n),ev=[],pend=[],ap=f=>SIMM.apply(W,f);
  const push=e=>{ev.push(e);if(e.fx.length)pend.push({at:e.t+e.d,e});return e};
  const flush=t=>{pend.sort((x,y)=>x.at-y.at);while(pend.length&&pend[0].at<=t){pend.shift().e.fx.forEach(ap)}};
  let ver=0,rr=0,rd=0;const rf=Math.min(3,n),need=set.cl==='ONE'?1:set.cl==='ALL'?rf:Math.floor(rf/2)+1;
  const coord=()=>{const up=[...Array(n).keys()].filter(i=>W.status['n'+i]==='up');return up.length?up[rr++%up.length]:null};
  for(const a of acts){const t=a.t;flush(t);
   if(a.op==='W'||a.op==='D'){
    const k=a.args[0]||'k',v=a.args[1]||'v',del=a.op==='D',c=coord();
    if(c===null){push(E(t,300,'cli','cli','no node available','fail',[],'All nodes are down.'));continue}
    const reps=SC_REP(k,n),live=reps.filter(r=>W.status['n'+r]==='up'),existed=reps.some(r=>W.d['n'+r][k]&&!W.d['n'+r][k].del);ver++;
    const label=del?`DELETE ${k}`:`${existed?'UPDATE':'INSERT'} ${k}=${v}`;
    push(E(t,500,'cli','n'+c,label,'write',[],`Any node can be the coordinator (here node ${c}). The key hashes to a token that names its ${rf} replicas: nodes ${reps.join(', ')}.`));
    if(live.length<need){push(E(t+500,400,'n'+c,'cli',`UnavailableException: ${set.cl} needs ${need} replica(s), only ${live.length} alive`,'fail',[],'The coordinator knows too few replicas are up for this consistency level, so it refuses the write instead of risking an inconsistent result. Nothing was written.'));continue}
    const acks=[];live.forEach((r,i)=>{const rec={v:del?null:v,ver,del};push(E(t+500+i*60,500,'n'+c,'n'+r,del?'tombstone':'mutation','write',[{op:'put',n:r,k,rec}],'Each replica appends to its commitlog (durability), then applies to its memtable. A delete is not an erase: it is a tombstone version that hides older data.'));
      const ak=push(E(t+1000+i*60,400,'n'+r,'n'+c,'ack','ack',[],'The replica acknowledges after the commitlog append and memtable apply.'));acks.push(ak.t+ak.d)});
    acks.sort((x,y)=>x-y);push(E(acks[need-1],350,'n'+c,'cli',`OK after ${need}/${live.length} ack(s) (${set.cl})`,'ack',[],`${set.cl} needs ${need} replica acknowledgement(s). Remaining replicas still apply the write in the background.`));
    reps.filter(r=>!live.includes(r)).forEach(r=>push(E(t+700,0,'n'+c,'n'+c,`node ${r} is down: it MISSES this write`,'info',[],'There are no hints or repair in this model, so a replica that was down stays behind until something repairs it.')));
   }
   if(a.op==='R'){const k=a.args[0]||'k',c=coord();if(c===null)continue;const reps=SC_REP(k,n),live=reps.filter(r=>W.status['n'+r]==='up');
    push(E(t,450,'cli','n'+c,`SELECT ${k}`,'read',[],`The coordinator asks ${need} replica(s) for the row (consistency ${set.cl}).`));
    if(live.length<need){push(E(t+450,400,'n'+c,'cli',`UnavailableException (${set.cl})`,'fail',[],'Not enough live replicas to satisfy the consistency level.'));continue}
    flush(t+1500);const off=rd++%live.length,ask=live.slice(off).concat(live.slice(0,off)).slice(0,need),res=[];ask.forEach((r,i)=>{push(E(t+450+i*60,450,'n'+c,'n'+r,'read','read',[],'Replicas return their newest version of the row.'));const x=W.d['n'+r][k];res.push(x);push(E(t+900+i*60,450,'n'+r,'n'+c,x?`v${x.ver}${x.del?' tombstone':'='+x.v}`:'(no row)','data',[],'The reply carries the row version (timestamp).'))});
    const best=res.filter(Boolean).sort((x,y)=>y.ver-x.ver)[0],truth=reps.map(r=>W.d['n'+r][k]).filter(Boolean).sort((x,y)=>y.ver-x.ver)[0],stale=(best?best.ver:0)<(truth?truth.ver:0);
    push(E(t+1400,450,'n'+c,'cli',best?(best.del?'(deleted)':`"${best.v}"`)+(stale?' ← STALE':''):'(not found)'+(stale?' ← STALE':''),stale?'fail':'ack',[],stale?`A replica that missed the write answered. Newest version in the cluster is v${truth.ver}: with ${set.cl} the read set did not overlap the write set.`:'The coordinator reconciles the replies and returns the highest version. A tombstone means "deleted".'))}
   if(a.op==='K'){const i=nid(a.args[0],n);if(i>=n)continue;push(E(t,0,'cli','n'+i,`node ${i} goes down`,'fail',[{op:'down',n:i}],'The node stops answering. Other nodes keep serving as long as the consistency level can still be met.'));flush(t)}
   if(a.op==='H'){const i=nid(a.args[0],n);if(i>=n)continue;push(E(t,0,'cli','n'+i,`node ${i} restarts (commitlog replay)`,'info',[{op:'up',n:i}],'On restart the node replays its commitlog to rebuild the memtable. It does NOT get the writes it missed.'));flush(t)}
  }
  return{events:ev};
 },
 lines(id,st){if(id==='cli')return[];const d=st.d[id],ks=Object.keys(d);return[`cl${st.cl[id]} mem${st.mem[id]} sst${st.sst[id]}`,...ks.slice(0,6).map(k=>d[k].del?`${k} ✕ tombstone v${d[k].ver}`:`${k}=${d[k].v} v${d[k].ver}`)]},
 detail(id,st){if(id==='cli')return[];const d=st.d[id];return[`commitlog records ${st.cl[id]}`,`memtable rows ${st.mem[id]}`,`sstables ${st.sst[id]}`,...Object.entries(d).map(([k,r])=>`${k}: ${r.del?'TOMBSTONE':r.v} (version ${r.ver})`)]}
};

Lab.sim(SIMM);})();

Lab.onStop(()=>{rsLive=false;rsAnim=false;migAnim=null});
Lab.start({phases:PHASES,detail:DETAIL,ovs:OVS,ctl:ctlHTML,state:()=>S,beforePlay:k=>{if(k===7){rsInit(S.cfg.raftScen);rsAnim=true}},afterPlay:k=>{if(k===7)rsAnim=false}});
</script>
