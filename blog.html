<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog · Linh Trần Nhật</title>
<meta name="description" content="Notes on engineering work, systems and lessons learned.">
<link rel="stylesheet" href="assets/lab.css">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/curriculum.css">
</head>
<body>
<div id="site-nav"></div>
<div class="cur-wrap">
  <header class="cur-hero">
    <div class="kick">BLOG</div>
    <h1>Notes from the work</h1>
    <p class="lead">Lessons from building and operating systems, and the experience behind the tech-stack research.</p>
    <div class="cur-search" id="sb" hidden role="search"><span id="ico"></span><input id="q" type="text" autocomplete="off" placeholder="Search posts…" aria-label="Search posts"><kbd>/</kbd></div>
    <div id="tags" style="display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0"></div>
    <div class="cur-status" id="status" aria-live="polite"></div>
  </header>
  <main><div class="cgrid" id="posts" style="margin-top:18px"></div></main>
  <footer class="cur-foot" id="site-foot"></footer>
</div>
<script src="data/profile.js"></script>
<script src="data/posts.js"></script>
<script src="assets/site.js"></script>
<script src="assets/thumbs.js"></script>
<script>
(function(){
  const {esc,hi,search,bindSearch,norm}=Site,PO=SITE_POSTS,$=id=>document.getElementById(id),tags=new Set(),on=new Set();
  PO.forEach(p=>(p.tags||[]).forEach(t=>tags.add(t)));
  if(!PO.length){
    $('posts').innerHTML=`<div class="ccard empty" style="--p:var(--p0)"><div class="art" style="aspect-ratio:auto;height:150px">${window.Thumbs.svg('blog')}</div><div class="body"><h3>The first posts are on the way</h3><p>Nothing is published yet. Follow <a href="${esc((SITE_PROFILE.links||{}).github||'#')}" target="_blank" rel="noopener">GitHub</a> to see the first one when it lands.</p></div></div>`;
    return;
  }
  $('sb').hidden=false;$('ico').innerHTML=Site.ICON;
  $('tags').innerHTML=[...tags].map(t=>`<button type="button" aria-pressed="false" data-k="${esc(t)}" style="font:13px var(--mono);border:1px solid var(--ink);border-radius:999px;padding:3px 11px;background:var(--card);color:var(--ink);min-height:0">${esc(t)}</button>`).join('');
  $('tags').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;on.has(k)?on.delete(k):on.add(k);b.setAttribute('aria-pressed',on.has(k));render()};
  function render(){const q=$('q').value,toks=norm(q).split(/\s+/).filter(Boolean);
    const hits=search(PO.filter(p=>!on.size||(p.tags||[]).some(t=>on.has(t))),q,[['title',6],['tags',4],['summary',1]]);
    $('status').textContent=`${hits.length} post${hits.length===1?'':'s'}`;
    $('posts').innerHTML=hits.map(({item:p},i)=>`<a class="ccard" href="${esc(p.url)}" style="--p:var(--p${i%8})"><div class="art">${window.Thumbs.svg('blog')}</div><div class="body"><span class="grp">${esc(p.date||'')}</span><h3>${hi(p.title,toks)}</h3><p>${hi(p.summary||'',toks)}</p><div class="chips">${(p.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div></div></a>`).join('')}
  bindSearch($('q'),render);render();
})();
</script>
</body>
</html>
