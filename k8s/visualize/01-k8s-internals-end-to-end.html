<!doctype html>
<html lang="en">
<head>

<title>Kubernetes Internals End-to-End</title>
<link rel="stylesheet" href="../../assets/lab.css">
<style>
:root{--acc:#326ce5;--acc2:#e25a1c}
@media(prefers-color-scheme:dark){:root{--acc:#6c9bff;--acc2:#ff7a3d}}
@media(max-width:820px){.g2{grid-template-columns:1fr}}
.pod{display:inline-block;border:2px solid var(--line);border-radius:7px;padding:1px 6px;margin:2px;font-family:ui-monospace,monospace;font-size:10.5px;background:var(--card);vertical-align:top}
.pod.ready{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}.pod.run{border-color:var(--t4)}
.pod.pend{border-style:dashed;color:var(--mut)}.pod.term{border-color:var(--bad);text-decoration:line-through;opacity:.7}.pod.err{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.node{border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);min-width:0}
.node.dead{border-color:var(--bad);opacity:.75}
.view .row{white-space:normal;overflow-wrap:anywhere}
.svgscroll.seq{border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:6px 0 4px}
.svgscroll.seq>svg{min-width:860px}
.wide{overflow-x:auto;overscroll-behavior-x:contain}
.wide>svg{min-width:600px}
.view .node{margin-bottom:6px}
.clusterbar{margin-top:10px}
.view table.wrap{white-space:normal}.view table.wrap td{overflow-wrap:break-word}
.wide>svg{max-height:none!important}
</style>

<script>
const STORY={
 system:'Kubernetes',
 title:'Build the <span>Kubernetes</span> control plane from scratch',
 lead:'Start from a real operations problem. Watch the obvious deploy script break. Then rebuild, piece by piece, the control plane that keeps hundreds of containers running without a human in the loop.',
 problem:{
  scene:[
   'You run the platform team of a marketplace: <b>40 services</b>, about <b>600 containers</b> on <b>120 machines</b>. Teams ship 50 times a day, and some machine fails roughly every other day.',
   'Today a deploy is a bash script that SSHes into machines and runs <code>docker run</code>. Last night a machine died at 3 a.m. and the <i>checkout</i> service ran on 1 of its 3 copies until someone woke up. Your job: make the cluster run itself.'],
  musts:[
   '<b>Declare, don\'t command.</b> Teams say <i>"3 copies of web:1.25"</i>; the system makes it true and <b>keeps</b> it true.',
   '<b>Self-healing.</b> A dead container or a dead machine is replaced without a human.',
   '<b>Smart placement.</b> Containers land only on machines with enough free CPU and memory and the right labels.',
   '<b>Zero-downtime deploys</b> with a one-command rollback, and capacity that follows the load.',
   '<b>One safe source of truth.</b> Many people and programs change state at once: no lost updates, no unauthorised writes.'],
  naive:{title:'Your first instinct: a smarter deploy script',text:'A script picks hosts, SSHes in, runs the containers and edits the load balancer config. It works for the demo, then:',
   breaks:['It runs <b>once</b>. When a machine dies an hour later, nothing notices and nothing restarts.','If it crashes halfway, the cluster is left in an unknown state: 2 of 3 copies, or old and new versions mixed.','Two engineers deploying at the same time overwrite each other, and the load balancer still points at IPs that no longer exist.']},
  quest:'Rebuild the core of Kubernetes in 10 chapters. In each one you meet a problem, try the naive fix, see it fail, then see the real design running as a small control plane in your browser.'},
 overview:{title:'The whole control plane on one page',lead:'Before the details, see how one <code>kubectl apply</code> travels. Press <b>Trace a request</b> to follow it, or tap a component to see what it receives and sends. Notice that nothing calls anything directly: every component reads and writes objects through the API server. Colors match the chapters.'},
 chapters:[
  {ask:'You run <code>kubectl apply</code>. Who actually starts the containers, and when?',
   why:'One command has to end with 3 running, reachable containers on the right machines, and must still end there if any component crashes halfway through.',
   v0:{name:'One imperative script that does everything in order',code:'for i in 1..3:\n  host = pickHost()\n  ssh(host, "docker run web:1.25")\nlb.add(host)',breaks:'It is a one-shot sequence. If it dies after the 2nd container, nobody knows a 3rd is missing. If a host dies tomorrow, nothing re-runs the loop. There is no record of what <i>should</i> be running.'},
   design:'Store only the <b>desired state</b> in one place, and let independent components, each watching that place, push reality one step closer to it.',
   predict:{q:'<code>kubectl apply</code> prints <i>"deployment.apps/web created"</i>. At that moment, how many containers are running?',opts:['All of them: apply waits until the pods are up','One: apply starts the first pod and the others follow','None yet: apply only stored the desired state'],ans:2,why:'apply returns as soon as the Deployment object is persisted. In the sequence below, the first container starts seconds later, after the controllers, the scheduler and a kubelet have each reacted to a watch event.'},
   build:{intro:'The skeleton every later chapter plugs into:',
    steps:['<b>Object model.</b> Every resource is <code>{kind, metadata, spec, status}</code>: <code>spec</code> is what you want, <code>status</code> is what is.','<b>One store, one front door.</b> Clients only write <code>spec</code> through the API server (chapter 2), which persists it (chapter 3).','<b>Watchers.</b> Each component subscribes to the kinds it cares about and writes the next piece of state: Deployment &rarr; ReplicaSet &rarr; Pods &rarr; <code>nodeName</code> &rarr; container &rarr; endpoints.','<b>No direct calls.</b> Components never talk to each other, only to the API server, so any one of them can crash and restart alone.'],
    code:'kubectl:    PUT desired object -> return\ncontroller: on change(obj): write next object\nscheduler:  on unbound pod: write pod.nodeName\nkubelet:    on pod for me: start it, write status',
    rule:'The store holds the <b>only truth</b>. Every component can be killed and restarted at any time and must rebuild everything it needs from the store.'}},
  {ask:'Anyone with network access can write cluster state. How do you stop bad or malicious objects?',
   why:'One malformed Deployment, say a selector that matches no pod, would make controllers loop forever. One leaked credential with write access is a full cluster takeover.',
   v0:{name:'Let every client write straight to the database',code:'db.put("/deployments/web", yaml)   // anyone, any shape',breaks:'No identity, no permissions, no defaults, no validation. A Deployment whose selector does not match its labels is stored, and the ReplicaSet controller keeps creating pods it can never count.'},
   design:'Put <b>one gatekeeper</b> in front of the store: every request passes the same chain, and the first failing stage rejects it before anything is written.',
   predict:{q:'Bob may create Deployments, but his manifest has <code>selector: app=web</code> while the pod labels say <code>app=other</code>. Pick <i>selector &ne; labels</i> below. What happens?',opts:['It is stored; the ReplicaSet simply never finds its pods','It is rejected with 422 at validation, and nothing reaches etcd','It is rejected with 403 by RBAC'],ans:1,why:'Bob passes authentication and RBAC, defaults are filled in, then schema validation refuses a selector that does not match the template labels (HTTP 422 Invalid). Nothing is persisted, so no controller ever sees it.'},
   build:{steps:['<b>Authenticate:</b> map the bearer token or client certificate to a user and groups, or answer 401.','<b>Authorize (RBAC):</b> does any role bound to this user allow <code>verb</code> on <code>resource</code> in this namespace? If not, 403.','<b>Mutating admission:</b> fill defaults and inject fields (for example a sidecar).','<b>Validate</b> the final object (422), then run <b>validating admission</b> (quotas, policies).','<b>Persist</b> with the resourceVersion check (chapter 3), then fan the change out to watchers.'],
    code:'user = authn(req) or 401\nif !rbac.allows(user, req.verb, req.resource): 403\nobj = mutate(req.obj)            // defaults, injection\nerrs = validate(obj) + admit(obj) // 422 / 403\nif errs: return errs\nreturn store.write(obj)          // 201, or 409 if stale',
    rule:'Nothing reaches the store without passing <b>every</b> stage, and the API server is the <b>only</b> component that talks to the store.'}},
  {ask:'Two clients update the same Deployment at the same time. Whose change survives?',
   why:'Controllers, kubectl and autoscalers all write the same objects concurrently, and 30 controllers polling every object every second would melt the store.',
   v0:{name:'Read, modify, write back, and poll for changes',code:'obj = get(key); obj.replicas = 5; put(key, obj)\nwhile true: for o in list(all): react(o); sleep(1)',breaks:'Two writers read the same version; the second <code>put</code> silently erases the first (<b>lost update</b>). Polling costs <i>controllers &times; objects</i> reads per second and still reacts up to a second late.'},
   design:'Version every write with one global <b>revision</b>: updates become compare-and-swap on <code>resourceVersion</code>, and readers <b>stream changes</b> from a revision instead of polling.',
   predict:{q:'A and B both read the Deployment at resourceVersion 12. A writes first. Then B writes, still sending rv 12. Choose <i>update race (409)</i> and predict B\'s result.',opts:['409 Conflict: B must re-read (now rv 13) and retry','B\'s write wins and A\'s change is lost','The store merges both changes automatically'],ans:0,why:'B\'s write is conditional on rv 12, but the object is now at rv 13, so it is refused. B re-reads, re-applies its change on top of A\'s, and succeeds. No locks, and no lost updates.'},
   build:{steps:['Keep one global counter <code>rev</code>; every write increments it and stamps the object with <code>resourceVersion = rev</code>.','<b>Conditional update:</b> accept a write only if its <code>resourceVersion</code> equals the stored one, otherwise answer 409.','Keep a history of changes. <b>Watch(fromRev)</b> streams every ADDED / MODIFIED / DELETED after <code>fromRev</code>.','<b>Compaction</b> drops old history; a watch from a compacted revision answers 410 Gone, and the client must LIST again.','Clients build an <b>informer</b>: LIST once, remember rev, WATCH from it, keep a local cache.'],
    code:'write(obj, expectRv):\n  if store[obj.key].rv != expectRv: return 409\n  rev += 1; obj.rv = rev; store[obj.key] = obj\n  history.append({rev, type, obj}); notify watchers\nwatch(fromRev):\n  if fromRev < compactedRev: return 410\n  stream history after fromRev, then live events',
    rule:'A write based on a stale version is <b>rejected, never merged silently</b>, and watchers see changes in revision order.'}},
  {ask:'A pod is deleted, and the "pod deleted" event is lost. Is it ever replaced?',
   why:'Events get lost: connections drop, controllers restart, nodes reboot. A system that only works when every single event arrives will drift away from what you asked for.',
   v0:{name:'Edge-triggered handlers: react to each event',code:'onPodDeleted(pod):\n  createPod(pod.template)',breaks:'If the event is missed (watch hiccup, controller restart), the pod is <b>never</b> replaced. If an event is delivered twice, you get one pod too many. Tick <i>lose the watch event</i> below to see the difference.'},
   design:'Make controllers <b>level-triggered</b>: whatever woke them up, they re-read the current state, compare it with the desired state, and take the smallest step to close the gap.',
   predict:{q:'Select <i>delete a pod</i> and tick <i>lose the watch event</i>. What happens to the missing replica?',opts:['Nothing: the controller never heard about it','A human has to restart the controller manager','It is recreated on a later reconcile'],ans:2,why:'The ReplicaSet controller does not remember events, it counts pods. The next time it runs for that ReplicaSet (here a periodic resync; in a real cluster typically a re-list after the broken watch) it sees 2 &lt; 3 and creates one. Duplicated events are just as harmless.'},
   build:{steps:['<b>Informer:</b> LIST + WATCH into a local cache (chapter 3).','On any event, push the <b>object key</b> (not the event) onto a de-duplicating <b>work queue</b>.','<b>Reconcile(key):</b> read desired from the cache, count the observed children, create or delete the difference.','Re-queue with back-off on errors; resync or re-list as a safety net.','Children carry an <code>ownerReference</code> so controllers can find them and garbage collection can delete them.'],
    code:'on any event for obj: queue.add(ownerKey(obj))\nworker: key = queue.pop()\n  rs   = cache.get(key)\n  pods = cache.pods(ownedBy = key, notTerminating)\n  diff = rs.replicas - len(pods)\n  if diff > 0: create diff pods\n  if diff < 0: delete -diff pods (unready first)',
    rule:'Reconcile from <b>current state, not from events</b>: running it twice, late or after a missed event gives the same result.'}},
  {ask:'A new pod needs 200m CPU and an SSD. Which of 120 machines should run it?',
   why:'Put it on a full node and it gets starved or killed. Ignore labels and taints and a database lands on a disk-less GPU box. Decide badly and some nodes sit idle while others overflow.',
   v0:{name:'Round-robin over the nodes',code:'node = nodes[i++ % nodes.length]',breaks:'It ignores free capacity, <code>nodeSelector</code> and taints. Pods land on full nodes or on nodes that cannot run them, and you only find out when they fail.'},
   design:'Separate <b>hard rules</b> from <b>preferences</b>: filter out every node that cannot run the pod, score the ones that can, then bind the pod by writing a single field.',
   predict:{q:'Web sample, 3 nodes of 2000m CPU, pods request 200m but really use about 20m. Slide <i>Pods to schedule</i> to 36. How many get a node?',opts:['All 36: real usage is tiny','30: the scheduler adds up requests, so pod 31 stays Pending','10: one node at a time is filled first'],ans:1,why:'Filtering compares the sum of <b>requests</b> with the node capacity: 10 &times; 200m fills 2000m on each node. Pods 31 to 36 stay Pending with <i>Insufficient cpu</i>, even though the CPUs are mostly idle.'},
   build:{steps:['Watch for pods with an empty <code>spec.nodeName</code>.','<b>Filter:</b> drop nodes that are not Ready, have a taint the pod does not tolerate, miss a <code>nodeSelector</code> label, or lack free requested CPU or memory.','<b>Score</b> the survivors: least-allocated (spread), most-allocated (bin-pack), minus a penalty for replicas of the same app.','<b>Bind:</b> write <code>spec.nodeName</code>. If nothing passes, record the reasons ("0/3 nodes available: ...") and retry later.'],
    code:'feasible = [n for n in nodes if ready(n) and tolerates(pod, n)\n            and matches(pod.nodeSelector, n.labels)\n            and n.free.cpu >= pod.cpu and n.free.mem >= pod.mem]\nif !feasible: pod.status = Unschedulable(reasons); retry\nbest = max(feasible, key = score)\npatch(pod, nodeName = best)',
    rule:'Never bind a pod to a node where the <b>sum of requests</b> would exceed capacity or a hard constraint fails.'}},
  {ask:'A pod is bound to node-1. What turns that record into a running, healthy container?',
   why:'Image pulls fail, apps take seconds to boot, containers crash. The control plane only sees what the node reports, so "started" and "ready to serve" must be reported separately.',
   v0:{name:'Start the container once and mark it Running',code:'onPodBound(pod):\n  runtime.run(pod.image)\n  setStatus(pod, "Running")',breaks:'A failed pull is never retried, so the pod is silently stuck. And "Running" is reported while the app is still booting, so traffic arrives before it can answer.'},
   design:'Put an <b>agent on every node</b> that reconciles its own pods: watch the pods bound to me, drive the container runtime toward their spec, and report observed status, including readiness, back to the API server.',
   predict:{q:'Pick <i>bad image tag</i>. What happens to the pod?',opts:['It stays put and the kubelet keeps retrying the pull','The scheduler moves it to another node','The API server rejects the Deployment: no such image'],ans:0,why:'Neither the API server nor the scheduler looks at registries. The kubelet reports <code>ErrImagePull</code>, then <code>ImagePullBackOff</code>, and retries with an exponentially growing delay. The pod never becomes Ready, so it never receives traffic.'},
   build:{steps:['Watch pods whose <code>spec.nodeName</code> is this node.','For each one, reconcile through the runtime interface (CRI): pull the image, create and start the container. On failure, retry with exponential back-off.','Report <code>phase</code> (Pending &rarr; Running) and a separate <code>ready</code> condition driven by the readiness probe.','On deletion: SIGTERM, wait the grace period, SIGKILL, then remove the pod object.','Renew the node heartbeat (a Lease) every few seconds (chapter 10).'],
    code:'for pod in podsBoundTo(me):\n  c = runtime.get(pod)\n  if pod.deleting: stopGracefully(c); continue\n  if !c: try runtime.pull+start(pod) except: backoff(pod)\n  setStatus(pod, phase = c.state, ready = probe(c))',
    rule:'A pod is reported <b>Ready only after its readiness probe passes</b>, and status always reflects what the node actually observed.'}},
  {ask:'Pods come and go with new IPs every deploy. How do clients find a working one?',
   why:'In a single rolling update every pod IP changes. Hard-coded IPs break on the next deploy, and traffic sent to a pod that is still booting or already gone fails.',
   v0:{name:'Hard-code pod IPs in the client, or DNS round-robin',code:'upstreams = ["10.244.0.2", "10.244.1.2", "10.244.2.2"]',breaks:'The list is stale after every deploy, includes pods that are not ready yet, and DNS caches keep stale answers for minutes.'},
   design:'Give the service one <b>stable virtual IP</b>, keep a live list of <b>ready</b> pod IPs (Endpoints), and let every node rewrite packets for that virtual IP to one of them.',
   predict:{q:'During a rolling update, set <i>grace period</i> to <b>0 s</b> and watch the failed counter. Why do some requests fail?',opts:['Some nodes still route to an old pod for a moment after its container has already exited','The Service gets a new ClusterIP during the update','New pods get traffic before they are Ready'],ans:0,why:'Removing the pod from Endpoints and stopping its container happen in parallel, and each node\'s kube-proxy needs a moment to reprogram its rules. With grace 0 the container is gone before every node has caught up. With a 2 s grace period it keeps serving through that lag: 0 failures.'},
   build:{steps:['A Service is <code>{selector, port, targetPort}</code> plus a stable ClusterIP allocated once.','<b>Endpoints controller:</b> list pods matching the selector that are Running, Ready and not terminating; write their IPs.','<b>kube-proxy</b> on every node watches Endpoints and programs kernel rules: packets to <code>ClusterIP:port</code> are DNAT-ed to a random endpoint.','Apps must drain on SIGTERM: keep serving during the grace period while the rules propagate.'],
    code:'endpoints(svc) = sorted(p.ip for p in pods\n  if matches(svc.selector, p.labels) and p.ready and !p.deleting)\nkube-proxy, on endpoints change:\n  rules[svc.clusterIP] = endpoints   // DNAT, equal odds',
    rule:'Only <b>Ready, non-terminating</b> pods are endpoints, and a pod keeps serving until every node has stopped routing to it.'}},
  {ask:'Ship version 2 to all pods without ever dropping below full capacity. How?',
   why:'50 deploys a day. Each one must keep serving, must stop by itself if v2 is broken, and must be undoable in seconds.',
   v0:{name:'Delete all old pods, then create the new ones',code:'scale(oldVersion, 0)\nscale(newVersion, replicas)',breaks:'Downtime between the last old pod stopping and the first new pod becoming Ready. If v2 is broken, <b>everything</b> is down. (This is the <i>Recreate</i> strategy in the capstone.)'},
   design:'A new pod template gets its <b>own ReplicaSet</b>. The Deployment controller shifts replicas from old to new in steps bounded by <code>maxSurge</code> and <code>maxUnavailable</code>, counting only Ready pods.',
   predict:{q:'Set maxSurge <b>1</b>, maxUnavailable <b>0</b> and choose <i>broken tag</i>. What does the rollout do?',opts:['Replaces the old pods one by one and the service goes down','Rolls back to the old version automatically','Stalls with 1 unready new pod while all old pods keep serving'],ans:2,why:'With maxUnavailable 0, an old pod is only removed once a new one is Ready, and that never happens. maxSurge 1 caps the extra pods at one. Kubernetes does not roll back on its own: it reports the stall (progress deadline exceeded) and you run <code>rollout undo</code>, which you can tick below.'},
   build:{steps:['Hash the pod template; the ReplicaSet named <code>deploy-&lt;hash&gt;</code> is the "new" one. Create it if it is missing.','<b>Scale up</b> the new ReplicaSet while the total stays at most <code>replicas + maxSurge</code>.','<b>Scale down</b> old ReplicaSets only while Ready pods stay at least <code>replicas - maxUnavailable</code>.','Run on every change (pod Ready, pod gone): the rollout is just this reconcile repeated.','Keep old ReplicaSets at 0 replicas: rollback means making an old template the new one again.'],
    code:'new = rsFor(hash(template)) or create(0 replicas)\nup = min(R - new.replicas, R + maxSurge - total)\nscale(new, new.replicas + up)\nbudget = ready - (R - maxUnavailable)\nfor old in oldRS: take = min(old.replicas, budget)\n  scale(old, old.replicas - take); budget -= take',
    rule:'During a rollout, <b>Ready &ge; replicas &minus; maxUnavailable</b> and <b>total &le; replicas + maxSurge</b> at every moment.'}},
  {ask:'Traffic jumps 7x at 8 p.m. How many replicas do you need, and when do you scale back?',
   why:'Too few pods and requests time out; too many and you pay for idle machines. Load moves faster than any human can edit YAML.',
   v0:{name:'Add one pod above 80% CPU, remove one below 40%',code:'every 15s:\n  if cpu > 80%: replicas += 1\n  if cpu < 40%: replicas -= 1',breaks:'A 7x spike needs many steps of +1, so it stays overloaded for minutes. When load hovers near a threshold the count flaps up and down every period.'},
   design:'Compute the needed replicas <b>proportionally</b> from utilisation versus a target, scale up quickly, and scale down only to the highest recommendation seen during a stabilisation window.',
   predict:{q:'4 Ready pods average 90% CPU (of their request) and the target is 60%. What replica count does the HPA ask for?',opts:['5: add one pod per period','6','8: double the replicas under load'],ans:1,why:'desired = ceil(current &times; utilisation / target) = ceil(4 &times; 1.5) = 6. Read the same formula in the caption below as the load changes. Utilisation is measured against the pod <b>request</b>, which is why HPA needs requests set.'},
   build:{steps:['Every period, read the average CPU of Ready pods and divide by the CPU <b>request</b> to get utilisation.','<code>raw = ceil(current &times; util / target)</code>; ignore changes within a ~10% tolerance.','Clamp to <code>[min, max]</code>; limit how much one step may scale up.','<b>Scale down</b> to the highest recommendation inside the stabilisation window, then write <code>spec.replicas</code>; the Deployment does the rest.'],
    code:'util = avg(cpuUsage(readyPods)) / cpuRequest\nraw  = ceil(current * util / target)\nif abs(util / target - 1) <= 0.1: raw = current\nwindow.push(raw)\ndesired = raw > current ? raw : max(window)\nscale(deployment, clamp(desired, min, max))',
    rule:'Scale on a <b>ratio to the target</b>, and never scale down faster than the stabilisation window allows.'}},
  {ask:'A machine loses power at 3 a.m. How does the cluster notice and heal?',
   why:'A dead node sends nothing. The control plane cannot tell <i>dead</i> from <i>slow network</i>, and reacting to every blip would reshuffle thousands of pods.',
   v0:{name:'One missed heartbeat: delete its pods and move them',code:'if now - node.lastBeat > 2s:\n  for pod in podsOn(node): delete(pod)',breaks:'A 3-second network blip reshuffles every pod on the node. A partitioned node that is actually alive keeps running the old copies while new ones start elsewhere.'},
   design:'Treat silence as <b>suspicion, not death</b>: after a grace period mark the node NotReady and taint it, evict its pods only after a toleration period, and let the normal ReplicaSet loop create replacements.',
   predict:{q:'Press Play. When do replacements for the dead node\'s pods start?',opts:['As soon as the first heartbeat is missed','After a grace period plus an eviction toleration','Never: an operator has to delete them by hand'],ans:1,why:'Here the node is marked NotReady about 9 s after it dies (8 s grace, checked every second), and its pods are evicted after the toleration you set (6 s by default). With real defaults (tens of seconds of grace plus a 300 s toleration) that is about 5 minutes, which is why critical workloads lower <code>tolerationSeconds</code>.'},
   build:{steps:['The kubelet renews a heartbeat (Lease) every few seconds.','<b>Node controller:</b> no heartbeat for <code>grace</code> &rarr; mark NotReady and add the <code>unreachable:NoExecute</code> taint.','<b>Taint eviction:</b> pods that do not tolerate the taint longer than <code>tolerationSeconds</code> are marked for deletion.','The ReplicaSet controller sees fewer live pods and creates replacements; the scheduler skips the NotReady node; Endpoints drop the lost pods.','When the node returns, remove the taint; its kubelet cleans up the old containers.'],
    code:'every 1s, for node in nodes:\n  if now - lastBeat(node) > GRACE and node.ready:\n    node.ready = false; taint(node, unreachable:NoExecute)\n  for pod on NotReady node past tolerationSeconds:\n    markDeleted(pod)   // ReplicaSet loop replaces it\n  if beats again: node.ready = true; untaint(node)',
    rule:'Only <b>prolonged</b> silence evicts pods, and replacement always goes through the same reconcile loops, never special failure code.'}}
 ],
 milestones:[
  {t:'Versioned object store with watch',test:'Two concurrent updates from the same resourceVersion: exactly one gets 409. A watch from revision N replays every later change in order; from a compacted revision it gets 410.'},
  {t:'API server in front of it',test:'A viewer creating a Deployment gets 403 and the store revision does not change; a selector that does not match the labels gets 422.'},

    const mine=bound.filter(b=>b.node===n.name),used={cpu:mine.reduce((a,b)=>a+b.cpu,0),mem:mine.reduce((a,b)=>a+b.mem,0)};
    if(used.cpu+pod.cpu>n.cpu)fails.push(`Insufficient cpu (${n.cpu-used.cpu}m free, needs ${pod.cpu}m)`);
    if(used.mem+pod.mem>n.mem)fails.push(`Insufficient memory (${Math.round(n.mem-used.mem)}Mi free, needs ${pod.mem}Mi)`);
    const free=((n.cpu-used.cpu-pod.cpu)/n.cpu+(n.mem-used.mem-pod.mem)/n.mem)/2*100;

/* =========================================================

function draw3(p){

  return`<div class="caption">Service <b>${esc(S.svc.metadata.name)}</b> (ClusterIP ${S.svc.spec.clusterIP}:${S.svc.spec.port} → targetPort ${S.svc.spec.targetPort}) is just a stable virtual IP. The Endpoints controller lists <b>ready</b> pods; every node's kube-proxy turns that list into packet-rewrite rules. Traffic below keeps flowing during a rolling update (t = +${((T-T0)/1000).toFixed(1)}s).</div>
  <div class="g2"><div><h3 style="margin-top:0">kube-proxy rules before the update</h3><pre>${esc(`-A KUBE-SERVICES -d ${S.svc.spec.clusterIP}/32 -p tcp --dport ${S.svc.spec.port} -j KUBE-SVC-${S.svc.metadata.name.toUpperCase()}\n${rulesTxt}\n(-j DNAT --to-destination <podIP>:${S.svc.spec.targetPort})`)}</pre><div class="note">Random statistic rules give each endpoint an equal share; there is no proxy process in the data path, only kernel NAT (iptables/IPVS).</div></div>
  <div><h3 style="margin-top:0">Endpoints now (${now.ep})</h3><div>${now.pods.filter(x=>x.ready&&!x.term).map(podChip).join('')||'<span class="note">none</span>'}</div><h3>Client requests (green = served, red = failed)</h3>${sv}<div class="chips"><span class="chip">requests ${done.length}</span><span class="chip ${errs?'bad':'ok'}">failed ${errs}</span><span class="chip">programming lag ≈ 0.8 s</span></div></div></div>
  <div class="note">New pods get traffic only when <b>Ready</b>; old pods leave the endpoint list when they start terminating. Because endpoint and rule updates take a moment to propagate, a pod must keep serving during its termination grace period (now ${OPT.tgrace}s). Set it to 0 in the controls to see connection resets during a rollout.</div>`;
}

/* =========================================================
   PHASE 8: ROLLING UPDATE
   ========================================================= */
function draw8(p){
  const sim=simRollout(),T0=sim.rolloutStart,span=55000,T=T0+p*span,now=snapAt(sim,T);
  const names=[...new Set(sim.snaps.flatMap(s=>s.rs.map(r=>r.name)))],W=640,H=110,xs=t=>10+(t-T0)/span*W;
  const maxPods=Math.max(1,...sim.snaps.map(s=>s.pods.filter(x=>!x.term||true).length));
  let sv=`<div class="wide"><svg viewBox="0 0 680 ${H+20}" style="max-height:${H+30}px">`;
  names.forEach((nm,ri)=>{let pts='';sim.snaps.filter(s=>s.t>=T0-500&&s.t<=T).forEach(s=>{const r=s.rs.find(x=>x.name===nm),v=r?s.pods.filter(x=>x.rs===nm&&x.ready&&!x.term).length:0;pts+=`${xs(s.t)},${H-v/maxPods*(H-10)} `});sv+=`<polyline fill="none" stroke="${tc(ri)}" stroke-width="2.5" points="${pts}"/><text x="${12}" y="${14+ri*12}" style="fill:${tc(ri)};font-size:10px">${esc(nm.slice(-8))} ready pods</text>`});
  sv+=`<line x1="${xs(T)}" x2="${xs(T)}" y1="4" y2="${H}" stroke="var(--ink)" opacity=".4"/></svg></div>`;
  const R=S.dep.spec.replicas,ds=sim.get('Deployment',S.dep.metadata.name),ready=now.pods.filter(x=>x.ready&&!x.term).length,min=R-ds.spec.strategy.maxUnavailable;
  const stuck=OPT.rcase==='bad';
  return`<div class="caption">Update to a ${stuck?'<b class="bad">bad</b> ':''}new image · maxSurge <b>${ds.spec.strategy.maxSurge}</b>, maxUnavailable <b>${ds.spec.strategy.maxUnavailable}</b> → ready pods never drop below <b>${min}</b> and the total never exceeds <b>${R+ds.spec.strategy.maxSurge}</b>. At +${((T-T0)/1000).toFixed(1)}s: <b>${ready}/${R}</b> ready${stuck&&!OPT.rback?' · <span class="bad">rollout stuck waiting for new pods to become Ready; old pods keep serving</span>':''}${OPT.rback&&T>T0+18000?' · <b class="ok">rolled back</b>':''}</div>${sv}
  <h3>ReplicaSets and pods (t=+${((T-T0)/1000).toFixed(1)}s)</h3>${now.rs.sort((a,b)=>a.rev-b.rev).map((r,i)=>`<div class="node" style="margin-bottom:6px;border-color:${tc(i)}"><b>${esc(r.name.slice(-14))}</b> <span class="tag m">rev ${r.rev}</span> <span class="note">desired ${r.desired} · ready ${now.pods.filter(x=>x.rs===r.name&&x.ready&&!x.term).length}</span><div>${now.pods.filter(x=>x.rs===r.name).map(podChip).join('')||'<span class="note">no pods</span>'}</div></div>`).join('')}
  <div class="note">A Deployment is a controller of ReplicaSets: a new pod template creates a new ReplicaSet and the two are scaled in steps limited by maxSurge/maxUnavailable. The old ReplicaSet is kept (at 0 replicas) so <span class="mono">kubectl rollout undo</span> is just scaling it back up. ${stuck?'With a broken image, availability is protected: only up to maxSurge new pods are created and none of the old ones are removed.':''}</div>`;
}

/* =========================================================
   PHASE 9: HPA
   ========================================================= */
function draw9(p){
  const sim=simHPA(),log=sim.hpaLog,T=p*110000,W=640,xs=t=>10+t/110000*W,mx=Math.max(1,...log.map(l=>l.cur),...log.map(l=>l.ready),OPT.hmax),maxLoad=Math.max(1,...log.map(l=>l.load));
  let a='',b='',c='';log.filter(l=>l.t<=T).forEach(l=>{a+=`${xs(l.t)},${100-l.load/maxLoad*90} `;b+=`${xs(l.t)},${100-l.cur/mx*90} `;c+=`${xs(l.t)},${100-l.ready/mx*90} `});
  const cur=log.filter(l=>l.t<=T).slice(-1)[0]||log[0];
  const sv=`<div class="wide"><svg viewBox="0 0 680 115" style="max-height:125px"><polyline fill="none" stroke="var(--t7)" stroke-width="2" stroke-dasharray="4 3" points="${a}"/><polyline fill="none" stroke="var(--t0)" stroke-width="2.5" points="${b}"/><polyline fill="none" stroke="var(--ok)" stroke-width="2.5" points="${c}"/><line x1="${xs(T)}" x2="${xs(T)}" y1="4" y2="105" stroke="var(--ink)" opacity=".4"/><text x="10" y="112" style="fill:var(--mut);font-size:10px">load (dashed) · desired replicas (blue) · ready replicas (green)</text></svg></div>`;
  const req=S.dep.spec.template.spec.containers[0].cpu;
  return`<div class="caption">Every 3 s the HPA reads average CPU utilisation (usage ÷ <i>request</i> = ${req}m) and computes <b>desired = ceil(current × utilisation ÷ target)</b>. At +${(cur.t/1000).toFixed(0)}s: ${cur.ready} ready pod(s), utilisation <b>${cur.util.toFixed(0)}%</b> vs target ${OPT.htarget}% → ceil(${cur.cur} × ${cur.util.toFixed(0)} ÷ ${OPT.htarget}) = <b>${Math.ceil(cur.cur*cur.util/OPT.htarget)}</b> → clamped to [${OPT.hmin}, ${OPT.hmax}] → <b>${cur.des}</b>.</div>${sv}
  <div class="g2"><div><table><tr><th>t</th><th class="n">load m</th><th class="n">ready</th><th class="n">util %</th><th class="n">replicas</th></tr>${log.filter(l=>l.t<=T).slice(-8).map(l=>`<tr><td>${(l.t/1000).toFixed(0)}s</td><td class="n">${Math.round(l.load)}</td><td class="n">${l.ready}</td><td class="n">${l.util.toFixed(0)}</td><td class="n">${l.cur}${l.des!==l.cur?' → <b>'+l.des+'</b>':''}</td></tr>`).join('')}</table></div>
  <div><div class="note" style="margin:0">Scaling up is fast (at most double + 4 per step), but new pods still need to be scheduled, pull images and pass readiness (green lags blue). Scaling down waits for a <b>stabilisation window</b> (${OPT.hstab}s): the highest recommendation in the window wins, which prevents flapping when load briefly dips. <i>Simplified:</i> during scale-up a real HPA counts pods that are not Ready yet as 0% busy, which damps the overshoot this model can show mid-spike.</div></div></div>`;
}

/* =========================================================
   PHASE 10: NODE FAILURE
   ========================================================= */
function draw10(p){
  const sim=simNodeFail(),T0=sim.failAt,span=55000,T=T0+p*span,now=snapAt(sim,T),before=snapAt(sim,T0-300);
  const ev=sim.log.filter(l=>l.t>=T0-200&&l.t<=T&&(l.from==='node-controller'&&!/^PUT /.test(l.msg)||l.from==='chaos'||l.from==='scheduler'&&/→/.test(l.msg)||l.from==='replicaset-controller'&&/^POST/.test(l.msg)||l.to==='kubelet/'+sim.victim&&false)).slice(0,14);
  const R=S.dep.spec.replicas,ready=now.pods.filter(x=>x.ready&&!x.term).length;
  return`<div class="caption"><b>${sim.victim}</b> loses power at +0s. Heartbeats stop → after the grace period the node controller marks it <b>NotReady</b>, taints it, and after the toleration period <b>evicts</b> its pods; the ReplicaSet creates replacements and the scheduler places them on healthy nodes. At +${((T-T0)/1000).toFixed(1)}s: <b>${ready}/${R}</b> pods Ready.</div>
  <div class="g2"><div><h3 style="margin-top:0">Timeline</h3>${ev.map(l=>`<span class="row ${l.kind==='lost'?'bad':''}">+${((l.t-T0)/1000).toFixed(1)}s · ${esc(l.msg)}</span>`).join('')||'<span class="note">…</span>'}<div class="note">Heartbeat grace 8 s, eviction after ${OPT.nevict} s (real clusters: tens of seconds of grace, then a default 300 s toleration).</div></div>
  <div>${now.nodes.map(n=>`<div class="node ${n.alive?'':'dead'}" style="margin-bottom:6px"><b>${n.name}</b> <span class="tag ${n.ready?'g':'r'}">${n.ready?'Ready':'NotReady'}</span>${n.alive?'':' <span class="tag r">down</span>'}<div>${now.pods.filter(x=>x.node===n.name).map(podChip).join('')||'<span class="note">no pods</span>'}</div></div>`).join('')}${now.pods.some(x=>!x.node)?`<div class="node"><b>Pending</b><div>${now.pods.filter(x=>!x.node).map(podChip).join('')}</div></div>`:''}</div></div>
  <div class="chips"><span class="chip">endpoints ${now.ep}</span><span class="chip">service stays up while ≥1 pod is Ready</span></div>
  <div class="note">Kubernetes cannot know a silent node is dead, only that it stopped reporting. Evicted pods stay "Terminating" on the dead node (their kubelet cannot confirm) but no longer count, so capacity is restored elsewhere. If the node returns (control above), its kubelet cleans the old containers up.</div>`;
}

 fails:[{m:"Manifest rejected",s:"error: ... is invalid, or unknown field / strict decoding error from kubectl apply",x:"Run kubectl apply --dry-run=server and kubectl diff; fix apiVersion, schema and selector/labels mismatch"},

 {m:"Field ownership conflict",s:"Server-side apply error: Apply failed with 1 conflict ... conflict with another manager",x:"Decide the owner of the field; use --force-conflicts only deliberately or remove the other writer (HPA vs replicas)"},
 {m:"Stale kubeconfig or auth failure",s:"Unauthorized / Forbidden or connection refused / timeout to the API server",x:"Check kubectl config current-context, token/cert expiry, VPN, and API server endpoint health"}],
 watch:["kubectl get events --sort-by=.lastTimestamp: bad = Warning events right after apply","kubectl rollout status deploy/NAME: bad = hangs or progress deadline exceeded","kubectl get deploy,rs,pods -o wide: bad = READY below desired for a long time"]},

{how:"Each request goes through the kube-apiserver handler chain: authentication (x509, bearer/OIDC/ServiceAccount token), authorization (RBAC checks Role/ClusterRole bindings for verb, resource, namespace), mutating admission (defaulting, sidecar injection via webhooks), schema validation, validating admission (ResourceQuota, LimitRange, Pod Security, validating webhooks), then the write to etcd. Rejection at any stage returns 401, 403, 422 or 409 and stores nothing.",
 pros:["One enforcement point for security and policy, regardless of which client is calling","Admission lets platform teams inject defaults and block unsafe objects without changing apps","Fail early: bad requests never reach etcd or controllers","RBAC is additive and auditable through audit logs"],
 cons:["The API server is a shared bottleneck: slow admission or webhooks slow every write","Webhooks add network hops and a new failure domain on the critical path","RBAC grows complex and over-broad ClusterRoles are common","Mutating webhooks can change objects in surprising ways (order matters)"],
 fails:[{m:"Admission webhook outage",s:"Creates/updates fail with: failed calling webhook ... context deadline exceeded or connection refused",x:"Set failurePolicy and timeoutSeconds deliberately, exclude kube-system and the webhook's own namespace, run webhook HA with PDB"},
 {m:"RBAC denied",s:"Error from server (Forbidden): user cannot create resource in namespace",x:"kubectl auth can-i --as=USER; add a minimal Role/RoleBinding instead of cluster-admin"},
 {m:"ResourceQuota exceeded",s:"forbidden: exceeded quota, requested vs used vs limited; pods missing from ReplicaSet",x:"Raise the quota or lower requests; also make sure pods set requests/limits when a quota requires them"},
 {m:"API server overload",s:"429 Too Many Requests, high request latency, slow kubectl",x:"Tune API Priority and Fairness, fix noisy clients/controllers, scale apiserver replicas, watch etcd latency"}],
 watch:["apiserver_request_duration_seconds and apiserver_request_total by code: bad = rising 5xx/429 or p99 over 1s","apiserver_admission_webhook_rejection_count / admission_webhook latency: bad = timeouts","kubectl auth can-i --list --as=USER; check audit logs for Forbidden","kubectl describe quota -n NS: bad = used equals hard"]},

{how:"etcd is a Raft-replicated key-value store, normally 3 or 5 members. Every object lives under /registry/... and each write bumps a global revision, exposed as resourceVersion. Updates are optimistic: the API server rejects a write whose resourceVersion is stale with 409 Conflict. Clients use list+watch from a resourceVersion; if it was compacted away, they get 410 Gone and must re-list.",
 pros:["Strong consistency via Raft means a single agreed view of cluster state","resourceVersion gives lock-free optimistic concurrency between controllers","Watch streams push changes, so controllers do not poll","Revisions allow resuming a watch exactly where it left off"],
 cons:["Writes need a quorum and a disk fsync, so slow disks hurt the entire cluster","Practical limits: a 2 GB default space quota (about 8 GB recommended maximum) and a 1.5 MB request size cap","Compaction and defrag must be managed, and 410 Gone forces expensive re-lists","Large clusters with many watchers or big objects (Secrets, CRDs, Events) strain it"],
 fails:[{m:"Quorum loss",s:"API server returns timeouts or 'etcdserver: no leader'; cluster is read-only or unavailable; running pods continue",x:"Restore majority of members or recover from snapshot; keep odd member count across failure zones; practice restores"},
 {m:"Slow disk / high latency",s:"'etcdserver: request timed out', slow kubectl, leader elections flapping",x:"Use dedicated SSD/NVMe; watch fsync and backend commit durations; keep etcd off noisy neighbors"},
 {m:"Database space exceeded",s:"etcdserver: mvcc: database space exceeded; writes refused (NOSPACE alarm)",x:"Compact, defrag, disarm the alarm; find the object hoarding space (events, huge CRs); raise quota-backend-bytes carefully"},
 {m:"409 Conflict / 410 Gone",s:"Operation cannot be fulfilled ... object has been modified; or 'too old resource version' in controller logs",x:"Retry with a fresh GET (client-go RetryOnConflict); informers re-list automatically; avoid long-lived stale watches"}],
 watch:["etcd_disk_wal_fsync_duration_seconds and backend_commit_duration: bad = p99 above ~10 ms / 25 ms","etcd_server_has_leader and leader_changes_seen_total: bad = 0 leader or frequent changes","etcd_mvcc_db_total_size_in_bytes vs quota: bad = above ~80 percent","etcdctl endpoint status -w table and endpoint health"]},

{how:"kube-controller-manager runs many controllers (Deployment, ReplicaSet, Endpoints, Node, Job and others). Each uses informers with a local cache fed by watch, puts keys on a work queue, and in a reconcile function compares desired spec with observed status, then creates, patches or deletes objects. They are level-triggered: if an event is missed, the next resync or re-list still finds the gap. Deployment owns ReplicaSets, which own Pods through ownerReferences.",
 pros:["Level-triggered loops self-heal: a lost event or a crashed controller is corrected on the next sync","Small single-purpose controllers compose into complex behavior","Same pattern works for your own CRDs and operators","Garbage collection via ownerReferences cleans children automatically"],
 cons:["Reconciliation is asynchronous, so there is always a delay between change and effect","Two controllers editing the same field can fight each other forever","Controller-manager is leader-elected, so only one active instance does work","Errors are retried with backoff, which can hide a persistent problem in logs"],
 fails:[{m:"Controller-manager down or leaderless",s:"Scaling or deleting pods has no effect; ReplicaSet does not replace deleted pods",x:"Check the kube-controller-manager pod and logs, lease in kube-system, and API connectivity; keep 3 control-plane nodes"},
 {m:"Reconcile fight",s:"Replicas keep flipping, objects constantly modified, high API write rate",x:"Single owner per field (HPA owns replicas, remove replicas from GitOps manifest); inspect managedFields"},
 {m:"Missed watch event",s:"Temporary drift until the next resync, such as a deleted pod not replaced immediately",x:"Expected to heal via resync/re-list; check informer lag and API server health if it persists"},
 {m:"Stuck finalizers / orphan objects",s:"Object stays Terminating, namespace never deletes",x:"Find the finalizer and its controller; fix or remove the controller; patch the finalizer only as a last resort"}],
 watch:["workqueue_depth and workqueue_work_duration_seconds per controller: bad = growing depth or long processing","kubectl get rs,deploy: bad = DESIRED differs from CURRENT for long","kubectl get lease -n kube-system: bad = stale renewTime for the controller-manager","kubectl describe deploy: look at Conditions (Progressing, Available) and Events"]},

{how:"kube-scheduler watches pods with an empty spec.nodeName. For each one it runs Filter plugins (NodeResourcesFit using requests, taints and tolerations, nodeSelector/affinity, topology spread, PVC zone) to drop infeasible nodes, then Score plugins to rank the rest, and finally Binds by creating a Binding that sets spec.nodeName. Scheduling uses requests, not actual usage. If no node fits, the pod stays Pending with a FailedScheduling event.",
 pros:["Pluggable framework: filters and scores can be tuned or extended with profiles","Resource requests give predictable placement and bin-packing control","Affinity, taints and topology spread express placement rules declaratively","Decoupled from kubelet: scheduling decision is just one field written to the API"],
 cons:["Decisions rely on requests, which are often wrong, so nodes can be overcommitted or wasteful","Scheduling is a point-in-time choice; nothing rebalances later without the descheduler","Strict constraints (anti-affinity, zone volumes) can make pods unschedulable","One scheduler loop is a throughput limit on very large bursts"],
 fails:[{m:"FailedScheduling: insufficient cpu/memory",s:"Pods Pending; event: 0/N nodes are available: N Insufficient cpu",x:"Lower requests if oversized, add nodes or enable Cluster Autoscaler, check kubectl describe node Allocated resources"},
 {m:"Taint / selector mismatch",s:"Event: node(s) had untolerated taint or didn't match Pod's node affinity/selector",x:"Add tolerations or fix labels; check kubectl describe node for Taints"},
 {m:"Volume node affinity conflict",s:"Pod Pending: node(s) had volume node affinity conflict; PVC bound in another zone",x:"Use WaitForFirstConsumer StorageClass; ensure capacity in the volume's zone"},
 {m:"Scheduler not running",s:"New pods Pending with no events at all",x:"Check kube-scheduler pod and leader lease; restore control-plane node"}],
 watch:["kubectl get pods --field-selector=status.phase=Pending and kubectl describe pod (FailedScheduling event)","scheduler_pending_pods and scheduler_pod_scheduling_duration_seconds: bad = rising queue or high latency","kubectl describe node: compare Allocated requests vs Allocatable","kubectl top nodes to compare real usage with requested"]},

{how:"The kubelet on each node watches pods whose spec.nodeName is its node. It pulls images and creates the sandbox and containers through the CRI (containerd or CRI-O), mounts volumes, runs startup, liveness and readiness probes, and writes pod status back to the API. It also renews its Lease every ~10 s and posts node status. Failed containers are restarted per restartPolicy with exponential backoff up to 5 minutes.",
 pros:["Node-local agent keeps working from its cache even if the control plane is briefly unreachable","CRI abstraction lets you swap container runtimes","Probes give the platform application-level health signals","Status reporting makes pod state visible and drives traffic via readiness"],
 cons:["Image pulls, slow registries and big images delay startup","Bad probe settings cause needless restarts or premature traffic","Resource limits cause OOMKills and CPU throttling that look like app bugs","Kubelet trouble hides pods on that node from the control plane's view"],
 fails:[{m:"ImagePullBackOff / ErrImagePull",s:"Pod stuck, event: Failed to pull image / manifest unknown / unauthorized",x:"Fix tag or registry, add imagePullSecrets, check registry reachability and rate limits"},
 {m:"CrashLoopBackOff",s:"Restarts climb, back-off delay grows to 5 minutes, Last State terminated with exit code",x:"kubectl logs --previous; check config, dependencies, exit code, OOMKilled; add startupProbe for slow apps"},
 {m:"Readiness never passes",s:"Pod Running but READY 0/1; removed from Service endpoints",x:"kubectl describe pod for probe failures; fix probe path/port/initialDelay; do not point readiness at external dependencies"},
 {m:"OOMKilled / eviction",s:"Last State: OOMKilled, exit 137; or Evicted due to node pressure",x:"Raise memory limit or fix leak; set requests close to real use; watch node DiskPressure/MemoryPressure"}],
 watch:["kubectl get pods -w and kubectl describe pod: bad = Waiting reasons, rising RESTARTS","kubectl logs POD --previous for crashed containers","kubelet_pod_start_duration_seconds and container_oom_events_total","kubectl get node: bad = NotReady, plus conditions like MemoryPressure"]},

{how:"A Service gets a stable ClusterIP and a label selector. The EndpointSlice controller keeps EndpointSlices listing only pod IPs that are Ready. kube-proxy on every node watches Services and EndpointSlices and programs iptables (default, random probability rules) or IPVS rules so traffic to the ClusterIP is DNAT-ed to one ready pod. CoreDNS gives the Service a DNS name.",
 pros:["Stable virtual IP and DNS name while pods come and go","Readiness gating means only healthy pods receive traffic","Rules are programmed on every node, so there is no central proxy to saturate","Simple model that works for any TCP/UDP workload"],
 cons:["Connection-level balancing only, so long-lived HTTP/2 or gRPC connections can stay unbalanced","iptables mode scales linearly with Service count; rule sync gets slow in huge clusters","Rule updates are eventually consistent, so brief traffic to a gone pod is possible","Poor visibility: no per-request metrics or retries without a mesh"],
 fails:[{m:"Empty endpoints",s:"Connection refused / timeout via the Service; kubectl get endpoints shows <none>",x:"Selector must match pod labels; pods must be Ready; check targetPort matches the containerPort"},
 {m:"Traffic to terminating pod",s:"Errors or resets during deploys or scale-down",x:"preStop sleep, terminationGracePeriodSeconds, handle SIGTERM and drain connections; use readiness to fail fast"},
 {m:"Stale kube-proxy rules",s:"Some nodes cannot reach a Service or hit dead pod IPs",x:"Check kube-proxy pod logs and sync duration; restart it; verify the CNI and conntrack"},
 {m:"Unbalanced long-lived connections",s:"One pod gets most load while others idle",x:"Client-side balancing, connection max age, or a service mesh / L7 ingress"}],
 watch:["kubectl get endpointslices -l kubernetes.io/service-name=NAME: bad = no ready addresses","kubectl describe svc NAME: check selector, ports, Endpoints","kubeproxy_sync_proxy_rules_duration_seconds: bad = seconds-long syncs","kubectl run curl test from inside the cluster and check CoreDNS logs"]},

{how:"Changing the pod template changes its hash, so the Deployment controller creates a new ReplicaSet and scales it up while scaling the old one down. Pace is bounded by maxSurge (extra pods above desired) and maxUnavailable (pods allowed below desired), defaults 25 percent each. A new pod only counts as available after readiness (and minReadySeconds). Old ReplicaSets are kept (revisionHistoryLimit, default 10), enabling kubectl rollout undo.",
 pros:["Zero-downtime updates when readiness probes and surge settings are right","Easy rollback to a previous ReplicaSet","Bad new version stalls the rollout and leaves old pods serving","Tunable speed vs capacity trade-off"],
 cons:["Surge needs spare cluster capacity or the new pods stay Pending","No automatic rollback: a stuck rollout just reports ProgressDeadlineExceeded","Both versions run together, so schemas and APIs must be backward compatible","Not canary or traffic-weighted; that needs Argo Rollouts or a mesh"],
 fails:[{m:"Broken new image",s:"New pods ImagePullBackOff or CrashLoopBackOff; rollout stalls; old pods keep serving",x:"kubectl rollout undo; fix the image; progressDeadlineSeconds surfaces the failure to CI"},
 {m:"Readiness gap / dropped requests",s:"5xx or connection resets during deploy",x:"Accurate readiness probe, preStop delay, sufficient grace period, maxUnavailable 0 for strict availability"},
 {m:"Surge pods Pending",s:"Rollout stuck at partial progress; FailedScheduling for new pods",x:"Free capacity, lower maxSurge, or let Cluster Autoscaler add nodes"},
 {m:"Bad rollback target",s:"Undo goes to a ReplicaSet with the same bad config or trimmed history",x:"Keep revisionHistoryLimit adequate and annotate change causes; deploy via Git so state is reproducible"}],
 watch:["kubectl rollout status deploy/NAME and kubectl rollout history: bad = ProgressDeadlineExceeded","kubectl get rs: bad = new RS stuck below desired, old RS not draining","kube_deployment_status_replicas_unavailable: bad = above 0 for long","kubectl describe deploy: Conditions and ReplicaSet events"]},

{how:"The HPA controller syncs every 15 s by default. It reads metrics from metrics-server (CPU/memory) or custom/external metrics APIs and computes desired = ceil(current replicas * current metric / target). CPU utilization is relative to pod requests. It applies tolerance (about 10 percent), min/maxReplicas, the behavior policies and a scale-down stabilization window (default 300 s), and then patches the scale subresource of the Deployment.",
 pros:["Capacity follows load automatically, cutting cost and manual toil","Scale-up is quick while scale-down is damped to avoid thrashing","Works with custom metrics such as queue length or RPS","Min/max bounds protect against runaway scaling"],
 cons:["Needs CPU requests set, and utilization is measured against them","Reactive: new pods take time to schedule, pull images and become Ready","Metrics lag (scrape interval) delays decisions","Scaling replicas does not help if nodes are full or the bottleneck is a database"],
 fails:[{m:"Metrics unavailable",s:"HPA shows <unknown>/70%; event FailedGetResourceMetric",x:"Install or fix metrics-server; ensure containers define resource requests; check the APIService v1beta1.metrics.k8s.io"},
 {m:"HPA flapping",s:"Replica count oscillates up and down",x:"Increase scale-down stabilizationWindowSeconds, use behavior policies, widen target gap, smooth the metric"},
 {m:"Scaled out but pods Pending",s:"Desired replicas high but available replicas stay low",x:"Enable Cluster Autoscaler or Karpenter; check quotas and FailedScheduling events"},
 {m:"Fighting with replicas in Git",s:"GitOps resets replicas to a fixed number",x:"Remove spec.replicas from the manifest or ignore the field in the sync tool"}],
 watch:["kubectl get hpa -w and kubectl describe hpa: bad = <unknown> targets, AbleToScale or ScalingActive false","kube_horizontalpodautoscaler_status_desired_replicas vs current: bad = long gap","kubectl top pods: compare real CPU with requests and target","Pending pods after scale-up: kubectl get pods --field-selector=status.phase=Pending"]},

{how:"Each kubelet renews a Lease in kube-node-lease every ~10 s. If the node-lifecycle controller sees no update for node-monitor-grace-period (default 40 s; 50 s in recent releases), it sets Ready to Unknown, and adds the node.kubernetes.io/unreachable taint with NoSchedule and NoExecute. Pods get a default toleration of 300 s (tolerationSeconds), after which they are evicted; their ReplicaSet creates replacements elsewhere and the Endpoints controller removes the not-Ready pods from Services.",
 pros:["Automatic recovery: lost capacity is recreated on healthy nodes","Taints and tolerations make eviction timing configurable per pod","Services stop sending traffic once pods are not Ready","Tolerating short blips avoids needless churn from brief network issues"],
 cons:["Default ~5 minutes of delay before pods are evicted (40-50 s detection plus 300 s toleration)","Cannot tell a dead node from a partitioned one, so a pod may still run on the isolated node","Stateful pods with RWO volumes can wait on volume detach or need fencing","Mass failure (zone outage) causes a thundering herd of rescheduling, and eviction rate is limited"],
 fails:[{m:"Slow eviction",s:"Pods stay Running/Unknown on a NotReady node for ~5 minutes; capacity short",x:"Lower tolerationSeconds for unreachable/not-ready taints on critical workloads; run enough replicas across nodes and zones"},
 {m:"All replicas on one node",s:"Service outage when that node dies",x:"topologySpreadConstraints or pod anti-affinity; PodDisruptionBudget; multiple zones"},
 {m:"StatefulSet / volume stuck",s:"Replacement pod Pending or ContainerCreating: Multi-Attach error",x:"Wait for detach, or force delete the pod only after confirming the node is really down; use node shutdown handling"},
 {m:"Zone outage eviction throttling",s:"Many nodes NotReady, controller slows evictions (cluster unhealthy mode)",x:"Expected safety behavior; restore the zone, ensure spare capacity so rescheduled pods can fit"}],
 watch:["kubectl get nodes: bad = NotReady; kubectl describe node for Conditions and taints","kube_node_status_condition{condition=Ready,status=true}==0 alert","kubectl get events: reasons NodeNotReady, TaintManagerEviction, Killing","kubectl get lease -n kube-node-lease: bad = stale renewTime"]}
];

(function(){
const SIMM={
 id:'k8s',nodeLabel:'worker nodes',nodeRange:[2,4,3],
 settings:[{id:'strat',label:'update strategy',opts:['RollingUpdate','Recreate'],def:'RollingUpdate'},{id:'grace',label:'node-monitor grace',opts:['short (2.5s)','long (5s)'],def:'short (2.5s)'}],
 menu:[{op:'C',label:'CREATE Deployment',args:[{n:'name',d:'web',w:50},{n:'replicas',d:'3',w:40},{n:'image',d:'v1',w:44}]},{op:'S',label:'SCALE (update replicas)',args:[{n:'name',d:'web',w:50},{n:'replicas',d:'5',w:40}]},{op:'U',label:'UPDATE image (rollout)',args:[{n:'name',d:'web',w:50},{n:'image',d:'v2',w:44}]},{op:'D',label:'DELETE Deployment',args:[{n:'name',d:'web',w:50}]},{op:'K',label:'kill worker node',args:[{n:'#',d:'1',w:40}]},{op:'H',label:'restart worker node',args:[{n:'#',d:'1',w:40}]}],
 scenarios:[
  {name:'create → update → delete',desc:'kubectl only writes desired state. Controllers, the scheduler and kubelets each watch the API server and react: Deployment → ReplicaSet → Pods → node binding → containers → Service endpoints. A rolling update replaces pods one at a time so the Service keeps ready endpoints; Recreate kills all first.',acts:['0 C web 3 v1','8500 U web v2','25000 D web']},
  {name:'worker node fails (self-healing)',desc:'The node stops sending heartbeats, but the control plane still lists its pods as Running until the grace period expires. Then the node controller evicts them, the ReplicaSet creates replacements and the scheduler places them on healthy nodes. Try the longer grace period.',acts:['0 C web 4 v1','8000 K 1','21000 H 1','23000 S web 6']},
 ],
 topo(n){
  const nodes=[{id:'cli',x:14,y:190,w:90,h:70,label:'kubectl'},{id:'api',x:170,y:170,w:140,h:110,label:'API server',badge:'auth→admit→persist'},{id:'etcd',x:170,y:14,w:140,h:100,label:'etcd',badge:'desired state'},{id:'ctl',x:370,y:14,w:150,h:100,label:'Controllers',badge:'reconcile loops'},{id:'sch',x:370,y:340,w:150,h:90,label:'Scheduler',badge:'filter + score'},{id:'svc',x:370,y:178,w:150,h:96,label:'Service',badge:'kube-proxy endpoints'}];
  const bh=Math.min(120,Math.floor(430/n)-8),y0=(450-n*(bh+8))/2;
  for(let i=0;i<n;i++)nodes.push({id:'w'+i,x:620,y:y0+i*(bh+8),w:260,h:bh,label:'worker '+i,badge:'kubelet'});
  const edges=[['cli','api'],['api','etcd'],['api','ctl'],['api','sch'],['api','svc']];for(let i=0;i<n;i++)edges.push(['api','w'+i]);
  return{nodes,edges,w:900,h:450,zones:[{x:156,y:2,w:380,h:124,label:'control plane'}]};
 },
 init(n){const st={status:{cli:'up',api:'up',etcd:'up',ctl:'up',sch:'up',svc:'up'},dep:{},pods:[],rv:0,bound:0,n};for(let i=0;i<n;i++)st.status['w'+i]='up';return st},
 apply(st,f){st.rv++;switch(f.op){
   case'dep':st.dep[f.name]={replicas:f.replicas,image:f.image};break;
   case'depdel':delete st.dep[f.name];break;
   case'pod+':st.pods.push({name:f.name,dep:f.dep,img:f.img,node:null,phase:'Pending'});break;
   case'bind':{const p=st.pods.find(x=>x.name===f.name);if(p){p.node=f.node;st.bound++}break}
   case'phase':{const p=st.pods.find(x=>x.name===f.name);if(p)p.phase=f.phase;break}
   case'pod-':st.pods=st.pods.filter(x=>x.name!==f.name);break;
   case'down':st.status[f.node]='down';break;
   case'up':st.status[f.node]='up';break}},
 fxText(f){return{dep:`etcd: Deployment ${f.name} replicas=${f.replicas} image=${f.image}`,depdel:`etcd: Deployment ${f.name} deleted`,'pod+':`etcd: Pod ${f.name} created (Pending)`,bind:`Pod ${f.name} bound to ${f.node}`,phase:`Pod ${f.name} → ${f.phase}`,'pod-':`Pod ${f.name} removed`,down:`${f.node} stops heartbeating`,up:`${f.node} Ready`}[f.op]||f.op},
 run(acts,n,set){
  const W=SIMM.init(n),ev=[],pend=[],ap=f=>SIMM.apply(W,f),grace=set.grace&&set.grace.startsWith('long')?5000:2500,recreate=set.strat==='Recreate';
  const push=e=>{ev.push(e);if(e.fx.length)pend.push({at:e.t+e.d,e});return e};
  const flush=t=>{pend.sort((x,y)=>x.at-y.at);while(pend.length&&pend[0].at<=t){pend.shift().e.fx.forEach(ap)}};
  let seq=0;
  const load=i=>W.pods.filter(p=>p.node==='w'+i).length+pend.filter(x=>x.e.fx.some(f=>f.op==='bind'&&f.node==='w'+i)).length;
  const upNodes=()=>[...Array(n).keys()].filter(i=>W.status['w'+i]==='up');
  // create one pod; returns time it becomes Ready
  function podFlow(t,dep,img,why){
   const name=`${dep}-${++seq}`;
   push(E(t,300,'ctl','api',`create Pod ${name} (${img})`,'ctrl',[],why||'The ReplicaSet controller sees fewer pods than replicas and creates a Pod object.'));
   push(E(t+300,300,'api','etcd',`persist Pod ${name} (Pending)`,'write',[{op:'pod+',name,dep,img}],'The pod exists only as a record in etcd. Nothing is running yet and no node is chosen.'));
   push(E(t+600,350,'api','sch',`watch: unscheduled Pod ${name}`,'watch',[],'The scheduler watches for pods with no node.'));
   flush(t+950);const ups=upNodes();
   if(!ups.length){push(E(t+950,0,'sch','sch',`Pod ${name}: no node available (Pending)`,'fail',[],'FailedScheduling: every node is down or unfit. The pod stays Pending until a node returns.'));return null}
   ups.sort((a,b)=>load(a)-load(b));const w=ups[0];
   push(E(t+950,400,'sch','sch',`filter + score → worker ${w}`,'info',[],'Filter drops unfit nodes (resources, taints). Score ranks the rest; here the least-loaded wins.'));
   push(E(t+1350,350,'sch','api',`bind ${name} → worker ${w}`,'write',[{op:'bind',name,node:'w'+w}],'The scheduler only writes a binding (spec.nodeName). It does not start anything.'));
   push(E(t+1700,350,'api','w'+w,`watch: Pod ${name} assigned`,'watch',[],'The kubelet on that node watches for pods bound to it.'));
   push(E(t+2050,900,'w'+w,'w'+w,`pull ${img}, start container`,'info',[{op:'phase',name,phase:'Running'}],'The kubelet asks the container runtime to pull the image and start the container, then runs probes.'));
   push(E(t+2950,300,'w'+w,'api',`status: ${name} Ready`,'ack',[],'The kubelet reports Ready through the API server.'));
   push(E(t+3250,300,'api','svc',`endpoint +${name}`,'watch',[],'The endpoints controller adds the pod IP; kube-proxy then starts routing traffic to it.'));
   return{name,at:t+3550,node:w};
  }
  function killPod(t,name,why){const p=W.pods.find(x=>x.name===name),node=p&&p.node;
   push(E(t,300,'api','svc',`endpoint −${name}`,'watch',[],'The pod is removed from Service endpoints first so no new traffic reaches it.'));
   if(node)push(E(t+300,300,'api',node,`delete ${name}`,'watch',[{op:'phase',name,phase:'Terminating'}],why||'The kubelet receives SIGTERM, gives the app time to drain, then removes the container.'));
   push(E(t+600,500,node||'api','api',`${name} gone`,'ack',[{op:'pod-',name}],'The pod object is removed after the container has stopped.'));return t+1100}
  const live=dep=>W.pods.filter(p=>p.dep===dep&&p.phase!=='Terminating');
  for(const a of acts){const t=a.t;flush(t);const name=a.args[0]||'web';
   if(a.op==='C'){const r=Math.max(1,+a.args[1]||3),img=a.args[2]||'v1';
    if(W.dep[name]){push(E(t,500,'cli','api',`create ${name}`,'write',[],'kubectl sends the manifest.'));push(E(t+500,300,'api','cli','AlreadyExists','fail',[],'Names are unique per namespace; use apply/update instead.'));continue}
    push(E(t,450,'cli','api',`POST Deployment ${name} (replicas=${r}, ${img})`,'write',[],'kubectl submits desired state: "I want '+r+' pods".'));
    push(E(t+450,400,'api','api','authenticate → authorize → admit → validate','info',[],'The API server pipeline: who are you, may you do this, mutating/validating admission, schema validation.'));
    push(E(t+850,300,'api','etcd',`persist Deployment ${name}`,'write',[{op:'dep',name,replicas:r,image:img}],'Desired state is saved in etcd. This is the only durable record; everything else can be rebuilt from it.'));
    push(E(t+1150,350,'api','ctl',`watch: Deployment ${name} added`,'watch',[],'Controllers hold watches on the API server, so they are told immediately instead of polling.'));
    push(E(t+1500,300,'ctl','ctl',`Deployment → ReplicaSet (${r} pods)`,'ctrl',[],'The Deployment controller creates a ReplicaSet; the ReplicaSet controller then creates the Pods.'));
    for(let i=0;i<r;i++)podFlow(t+1800+i*120,name,img);flush(t+1800)}
   if(a.op==='S'){const r=Math.max(0,+a.args[1]||1);if(!W.dep[name])continue;const cur=live(name).length;
    push(E(t,450,'cli','api',`scale ${name} → ${r}`,'write',[],'Scaling only changes spec.replicas.'));
    push(E(t+450,300,'api','etcd',`persist replicas=${r}`,'write',[{op:'dep',name,replicas:r,image:W.dep[name].image}],'One field changes in etcd.'));
    push(E(t+750,350,'api','ctl',`watch: ${name} changed`,'watch',[],'The ReplicaSet controller compares observed (${cur}) with desired (${r}) and closes the gap.'));
    if(r>cur)for(let i=0;i<r-cur;i++)podFlow(t+1100+i*120,name,W.dep[name].image,`Desired ${r}, observed ${cur+i}: create another pod.`);
    else live(name).slice(r-cur).forEach((p,i)=>killPod(t+1100+i*150,p.name))}
   if(a.op==='U'){const img=a.args[1]||'v2';const d=W.dep[name];if(!d)continue;
    push(E(t,450,'cli','api',`set image ${name} → ${img}`,'write',[],'A new pod template (image) is submitted.'));
    push(E(t+450,300,'api','etcd',`persist ${name} image=${img}`,'write',[{op:'dep',name,replicas:d.replicas,image:img}],'Changing the pod template creates a NEW ReplicaSet; the old one is scaled down.'));
    push(E(t+750,350,'api','ctl',`watch: ${name} changed`,'watch',[],'The Deployment controller starts a rollout.'));
    const olds=live(name).filter(p=>p.img!==img);let c=t+1100;
    if(recreate){push(E(c,300,'ctl','ctl','Recreate: stop ALL old pods first','ctrl',[],'Recreate has no overlap: simple, but the app is down between the last old pod stopping and the first new pod becoming Ready.'));let e0=c+300;olds.forEach((p,i)=>{e0=Math.max(e0,killPod(c+300+i*100,p.name))});
     push(E(e0,0,'svc','svc','0 ready endpoints: traffic FAILS (downtime)','fail',[],'Every old pod is gone and the new ones are not Ready yet.'));for(let i=0;i<olds.length;i++)podFlow(e0+200+i*120,name,img,'Recreate: start the new version.');}
    else{push(E(c,300,'ctl','ctl','RollingUpdate: surge 1, unavailable 0','ctrl',[],'Start one new pod, wait until Ready, only then stop one old pod. Capacity never drops below the desired count.'));
     for(const o of olds){const f=podFlow(c+300,name,img,'Rollout step: surge one new pod.');if(!f)break;c=killPod(f.at,o.name,'Only after the new pod is Ready does the old one get terminated.')}}
    flush(t+1100)}
   if(a.op==='D'){const d=W.dep[name];if(!d)continue;
    push(E(t,450,'cli','api',`DELETE Deployment ${name}`,'write',[],'kubectl asks to delete.'));
    push(E(t+450,300,'api','etcd',`remove ${name}`,'write',[{op:'depdel',name}],'The Deployment is removed from etcd. Dependents carry an ownerReference, so garbage collection removes them.'));
    push(E(t+750,350,'api','ctl',`GC: delete ReplicaSet and Pods`,'watch',[],'The garbage collector deletes everything owned by the Deployment.'));
    live(name).forEach((p,i)=>killPod(t+1100+i*150,p.name));flush(t+1100)}
   if(a.op==='K'){const i=+a.args[0]||0;if(i>=n||W.status['w'+i]!=='up')continue;const nd='w'+i;
    for(let q=pend.length-1;q>=0;q--){const e=pend[q].e;if((e.from===nd||e.to===nd)&&pend[q].at>t){e.fx=e.fx.filter(f=>f.op==='bind'||f.op==='pod+');e.kind='fail';e.msg+=' ✕ node died';pend.splice(q,1)}}
    push(E(t,0,nd,nd,`worker ${i} CRASHES (heartbeats stop)`,'fail',[{op:'down',node:nd}],'Power loss or network partition. The control plane does not know yet: its pods still look Running.'));flush(t);
    const lost=W.pods.filter(p=>p.node===nd||(p.node===null&&false));
    push(E(t+grace-400,400,'ctl','api','node-monitor: no heartbeat → NotReady','ctrl',[],`After the grace period (${grace/1000}s) the node controller marks the node NotReady and taints it. A longer grace period avoids false alarms but lengthens the outage.`));
    const et=t+grace;
    lost.forEach(p=>{push(E(et,350,'api','svc',`endpoint −${p.name} (node lost)`,'watch',[],'Pods on the dead node are removed from Service endpoints.'));push(E(et+350,300,'api','etcd',`evict ${p.name}`,'write',[{op:'pod-',name:p.name}],'The pod record is deleted; the dead kubelet cannot confirm it, so the control plane forgets it.'))});
    flush(et+700);
    const deps={};lost.forEach(p=>{deps[p.dep]=(deps[p.dep]||0)+1});
    const rem=Object.keys(W.dep).reduce((c,k)=>c+live(k).length,0);
    if(lost.length&&rem===0)push(E(t,0,'svc','svc','no ready endpoints left: traffic FAILS','fail',[],'All pods were on the failed node: this is why you spread replicas across nodes (topology spread / anti-affinity).'));
    Object.entries(deps).forEach(([d,k])=>{if(!W.dep[d])return;const need=W.dep[d].replicas-live(d).length;for(let j=0;j<Math.max(0,need);j++)podFlow(et+800+j*120,d,W.dep[d].image,'Observed < desired after eviction: the ReplicaSet creates a replacement. Same loop, no special failure code.')});
    flush(et+800)}
   if(a.op==='H'){const i=+a.args[0]||0;if(i>=n)continue;push(E(t,500,'w'+i,'api',`worker ${i} registers, Ready`,'ack',[{op:'up',node:'w'+i}],'The kubelet comes back with no pods. Existing pods are not moved back; the scheduler simply uses it for new ones.'));flush(t+500)}
  }
  return{events:ev};
 },
 lines(id,st){
  if(id==='cli')return[];
  if(id==='etcd')return[`revision ${st.rv}`,...Object.entries(st.dep).map(([k,v])=>`deploy/${k} ×${v.replicas} ${v.image}`),`pods ${st.pods.length}`];
  if(id==='api')return[`writes ${st.rv}`];
  if(id==='ctl')return Object.entries(st.dep).map(([k,v])=>{const r=st.pods.filter(p=>p.dep===k&&p.phase==='Running').length;return`${k}: ${r}/${v.replicas} ready`});
  if(id==='sch')return[`bound ${st.bound}`,`pending ${st.pods.filter(p=>!p.node).length}`];
  if(id==='svc'){const r=st.pods.filter(p=>p.phase==='Running');return[`${r.length} endpoint(s)`,...r.slice(0,5).map(p=>p.name+' '+p.img)]}
  return st.pods.filter(p=>p.node===id).slice(0,8).map(p=>`${p.name} ${p.img} ${p.phase==='Running'?'●':p.phase}`)},
 detail(id,st){return SIMM.lines(id,st)}
};

Lab.sim(SIMM);})();

Lab.start({phases:PHASES,detail:DETAIL,ovs:OVS,ctl:ctlHTML,state:()=>S});
</script>
